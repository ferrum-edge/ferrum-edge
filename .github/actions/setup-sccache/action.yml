name: Setup sccache
description: >-
  Installs sccache via mozilla-actions/sccache-action and wires it as the
  cargo rustc wrapper. CI uses sccache for compiler-output caching through the
  GitHub Actions backend; Swatinem/rust-cache remains responsible for restoring
  Cargo registry/git data and target directories using per-job/per-target keys.
  The checked-in `.cargo/config.toml` hardcodes `[build] rustc-wrapper =
  "sccache"` so local developers get caching for free once sccache is on PATH;
  this action provides the CI half of that contract.

  If sccache install fails, the GitHub Actions cache service env is unavailable,
  or the server cannot start, the action sets `RUSTC_WRAPPER=` and
  `CARGO_BUILD_RUSTC_WRAPPER=` to clear the config-file value so cargo doesn't
  try to exec an unusable wrapper. Build still proceeds, just without the
  cache.

  The server idle timeout is disabled (`SCCACHE_IDLE_TIMEOUT=0`). The release
  build compiles the large `ferrum-edge` crate as one long rustc invocation
  that can exceed sccache's 600s default; with no new compile requests
  arriving while it runs, the server would otherwise shut down mid-compile —
  on the slower Windows runner this surfaced as "connection forcibly closed
  (os error 10054)" and a failed `ferrum-edge` lib build.

runs:
  using: composite
  steps:
    - name: Install sccache
      uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10
      continue-on-error: true

    - name: Configure sccache
      shell: bash
      run: |
        set -euo pipefail

        if ! command -v sccache &> /dev/null; then
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "sccache unavailable — cleared rustc-wrapper so cargo falls back to default"
          exit 0
        fi

        if [ -z "${ACTIONS_RESULTS_URL:-}" ] || [ -z "${ACTIONS_RUNTIME_TOKEN:-}" ]; then
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "::warning::GitHub Actions cache service env is unavailable; sccache disabled to avoid local-disk-only wrapper overhead"
          exit 0
        fi

        # sccache reads backend selection when the daemon starts. Export these
        # before `--start-server`; writing them only to GITHUB_ENV would make
        # later steps see the variables while the already-running daemon keeps
        # using its default local-disk backend.
        export RUSTC_WRAPPER=sccache
        export SCCACHE_GHA_ENABLED=on
        # Disable the sccache server idle timeout (default 600s). The release
        # build compiles the large `ferrum-edge` lib crate as a single rustc
        # invocation (fat LTO, codegen-units=1) that hovers right around 600s
        # on the slower Windows runner. No new compile requests arrive while it
        # runs, so the server idle-times-out and exits mid-compile; the client
        # then dies with "connection forcibly closed (os error 10054)". 0 = run
        # until the ephemeral runner is torn down.
        export SCCACHE_IDLE_TIMEOUT=0
        # Restart any server a prior step started so it adopts the timeout above
        # and the GHA backend (a server that's already running keeps the values
        # it started with).
        sccache --stop-server > /dev/null 2>&1 || true
        if sccache --start-server 2>/dev/null; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"
          # Persist for build steps in case sccache lazily re-spawns a server.
          echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"
          echo "sccache enabled with GitHub Actions backend (idle timeout disabled)"
          sccache --version
          if [ -n "${RUSTC_WRAPPER:-}" ]; then
            echo "RUSTC_WRAPPER is set"
          else
            echo "RUSTC_WRAPPER is not set"
          fi
          env | awk -F= '/^SCCACHE_/ { print $1"=<set>" }' | sort
          sccache --show-stats || true
        else
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "sccache unavailable — cleared rustc-wrapper so cargo falls back to default"
        fi
