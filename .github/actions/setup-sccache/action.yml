name: Setup sccache
description: >-
  Installs a checksum-pinned sccache release from mozilla/sccache GitHub
  releases and wires it as the cargo rustc wrapper. The checked-in
  `.cargo/config.toml` hardcodes `[build] rustc-wrapper = "sccache"` so
  local developers get caching once sccache is on PATH; this action provides
  the CI half of that contract.

  This action does not invoke mozilla-actions/sccache-action (or any other
  installer that `core.exportVariable`s `ACTIONS_RUNTIME_TOKEN` /
  `ACTIONS_RESULTS_URL` into `GITHUB_ENV`). PR-controlled `run:` steps
  therefore never receive the GitHub Actions cache-service credential.
  Compiler outputs use a bounded local-disk cache at
  `${GITHUB_WORKSPACE}/.cache/sccache`. Workflow cache actions persist that
  directory with their private credential.

  If sccache install fails (network blip, checksum mismatch, unsupported
  platform), the action sets `RUSTC_WRAPPER=` and
  `CARGO_BUILD_RUSTC_WRAPPER=` so cargo does not exec a missing binary.
  Build still proceeds without the compiler cache.

  The server idle timeout is disabled (`SCCACHE_IDLE_TIMEOUT=0`). The release
  build compiles the large `ferrum-edge` crate as one long rustc invocation
  that can exceed sccache's 600s default; with no new compile requests
  arriving while it runs, the server would otherwise shut down mid-compile —
  on the slower Windows runner this surfaced as "connection forcibly closed
  (os error 10054)" and a failed `ferrum-edge` lib build.

inputs:
  version:
    description: sccache release version without the v prefix
    required: false
    default: "0.17.0"
  linux-amd64-sha256:
    description: SHA-256 for sccache-vVERSION-x86_64-unknown-linux-musl.tar.gz
    required: false
    default: "67c4a96dd237c1f518f6b36083f270f9976d516f1e57fce891755ea782e50006"
  linux-arm64-sha256:
    description: SHA-256 for sccache-vVERSION-aarch64-unknown-linux-musl.tar.gz
    required: false
    default: "821a86343191aa1cbab74bd42f9e93c9a63bf85e4742945f40d3ae84193c1c77"
  macos-amd64-sha256:
    description: SHA-256 for sccache-vVERSION-x86_64-apple-darwin.tar.gz
    required: false
    default: "c2144cafbfe3d22e34ae637f9974ce53613543ac19477fdb287df22ea3668261"
  macos-arm64-sha256:
    description: SHA-256 for sccache-vVERSION-aarch64-apple-darwin.tar.gz
    required: false
    default: "0c560bfba31aef5bdfb4fb3d2677f6e61d71c5c00952f2a83344f47aa31f00f1"
  windows-amd64-sha256:
    description: SHA-256 for sccache-vVERSION-x86_64-pc-windows-msvc.tar.gz
    required: false
    default: "caf1932d76a909c909b7a2e41443cdfe3c79a49a380da1a22fa422e1d00d3ca7"

runs:
  using: composite
  steps:
    - name: Install checksum-pinned sccache
      continue-on-error: true
      shell: bash
      env:
        SCCACHE_VERSION: ${{ inputs.version }}
        SCCACHE_LINUX_AMD64_SHA256: ${{ inputs.linux-amd64-sha256 }}
        SCCACHE_LINUX_ARM64_SHA256: ${{ inputs.linux-arm64-sha256 }}
        SCCACHE_MACOS_AMD64_SHA256: ${{ inputs.macos-amd64-sha256 }}
        SCCACHE_MACOS_ARM64_SHA256: ${{ inputs.macos-arm64-sha256 }}
        SCCACHE_WINDOWS_AMD64_SHA256: ${{ inputs.windows-amd64-sha256 }}
      run: |
        set -euo pipefail

        # The following step must never discover a preinstalled executable
        # after this best-effort installer fails. Publish an empty sentinel
        # first; replace it with the exact verified path only after the pinned
        # archive has passed its checksum and the binary is installed.
        echo "FERRUM_SCCACHE_BIN=" >> "$GITHUB_ENV"

        # Hosted callers: Linux x86_64 (ubuntu-latest / ubuntu-24.04),
        # macOS x86_64 and aarch64 (macos-latest), Windows x86_64
        # (windows-latest). Linux aarch64 is pinned for GitHub-hosted ARM
        # runners. Unsupported platforms fall through to the wrapper-clearing
        # fallback; this step is continue-on-error.
        if ! [[ "$SCCACHE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::sccache version must be a numeric release such as 0.17.0"
          exit 1
        fi

        os="${RUNNER_OS:-}"
        arch="${RUNNER_ARCH:-}"
        case "${os}-${arch}" in
          Linux-X64)
            triple=x86_64-unknown-linux-musl
            asset_sha="$SCCACHE_LINUX_AMD64_SHA256"
            ;;
          Linux-ARM64)
            triple=aarch64-unknown-linux-musl
            asset_sha="$SCCACHE_LINUX_ARM64_SHA256"
            ;;
          macOS-X64)
            triple=x86_64-apple-darwin
            asset_sha="$SCCACHE_MACOS_AMD64_SHA256"
            ;;
          macOS-ARM64)
            triple=aarch64-apple-darwin
            asset_sha="$SCCACHE_MACOS_ARM64_SHA256"
            ;;
          Windows-X64)
            triple=x86_64-pc-windows-msvc
            asset_sha="$SCCACHE_WINDOWS_AMD64_SHA256"
            ;;
          *)
            echo "::warning::setup-sccache has no pinned archive for ${os}/${arch}; cargo will run without sccache"
            exit 1
            ;;
        esac
        if ! [[ "$asset_sha" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::sccache SHA-256 must be 64-character lowercase hex"
          exit 1
        fi

        file_sha256() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$1" | awk '{print $1}'
          else
            echo "::error::neither sha256sum nor shasum is available"
            exit 1
          fi
        }

        # The install root must be the same path on every run. The wrapper
        # path is published as RUSTC_WRAPPER / CARGO_BUILD_RUSTC_WRAPPER, and
        # Swatinem/rust-cache hashes the value of every CARGO* and RUST*
        # variable into its cache key; a mktemp suffix here made every key
        # unique, so no rust-cache lane could ever restore. RUNNER_TEMP is
        # private to this job and wiped between jobs; the root is recreated
        # from scratch so no pre-existing file can survive into the verified
        # install. The download scratch directory stays randomized because
        # nothing exports it.
        install_root="${RUNNER_TEMP}/ferrum-sccache-bin"
        install_dir="${install_root}/bin"
        work_dir="$(mktemp -d "${RUNNER_TEMP}/ferrum-sccache.XXXXXX")"
        archive="${work_dir}/sccache.tar.gz"
        rm -rf "$install_root"
        mkdir -p "$install_dir"
        trap 'rm -rf "$work_dir"' EXIT

        filename="sccache-v${SCCACHE_VERSION}-${triple}.tar.gz"
        url="https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${filename}"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
          --connect-timeout 30 --max-time 300 \
          -o "$archive" "$url"
        if [ ! -s "$archive" ]; then
          echo "::error::sccache download produced an empty archive: ${url}"
          exit 1
        fi
        actual="$(file_sha256 "$archive")"
        if [ "$actual" != "$asset_sha" ]; then
          echo "::error::sccache checksum mismatch for ${filename}: got ${actual}, want ${asset_sha}"
          exit 1
        fi
        tar -xzf "$archive" -C "$work_dir"

        src=""
        for candidate in \
          "${work_dir}/sccache-v${SCCACHE_VERSION}-${triple}/sccache" \
          "${work_dir}/sccache-v${SCCACHE_VERSION}-${triple}/sccache.exe"
        do
          if [ -f "$candidate" ]; then
            src="$candidate"
            break
          fi
        done
        if [ -z "$src" ]; then
          echo "::error::pinned sccache archive did not contain a sccache binary"
          exit 1
        fi
        dest="${install_dir}/$(basename "$src")"
        cp "$src" "$dest"
        chmod 0755 "$dest"
        echo "FERRUM_SCCACHE_BIN=${dest}" >> "$GITHUB_ENV"
        echo "sccache v${SCCACHE_VERSION} (${triple}) installed to a verified runner-temporary path"

    - name: Configure sccache
      shell: bash
      run: |
        set -euo pipefail

        # Deliberate security choice: do not enable the sccache GHA backend
        # and do not persist ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN.
        # Those credentials belong to the cache action process, not to later
        # cargo/build.rs/test `run:` steps. Consumers persist the bounded
        # local directory through Swatinem/rust-cache `cache-directories` or
        # a dedicated actions/cache producer archive.
        #
        # Keep the local store deterministic across runner invocations and cap
        # it well below GitHub's per-entry limit to control cache eviction
        # pressure. These values must be set before starting the daemon.
        export SCCACHE_DIR="${GITHUB_WORKSPACE}/.cache/sccache"
        export SCCACHE_CACHE_SIZE=2G
        mkdir -p "${SCCACHE_DIR}"
        unset SCCACHE_GHA_ENABLED
        # `unset` protects this shell. Persist an explicit empty value as the
        # final GITHUB_ENV assignment so an earlier action or workflow cannot
        # re-enable the credential-bearing GHA backend in later build steps.
        echo "SCCACHE_GHA_ENABLED=" >> "$GITHUB_ENV"

        # Disable the sccache server idle timeout (default 600s). The release
        # build compiles the large `ferrum-edge` lib crate as a single rustc
        # invocation (fat LTO, codegen-units=1) that hovers right around 600s
        # on the slower Windows runner. No new compile requests arrive while it
        # runs, so the server idle-times-out and exits mid-compile; the client
        # then dies with "connection forcibly closed (os error 10054)". 0 = run
        # until the ephemeral runner is torn down.
        export SCCACHE_IDLE_TIMEOUT=0
        sccache_bin="${FERRUM_SCCACHE_BIN:-}"
        # Invoke only the checksum-verified binary installed above. PATH lookup
        # would let a failed download silently activate an unpinned preinstalled
        # sccache. Stop any server a prior step started so no daemon holds stale
        # settings (a running server keeps the values it started with).
        if [ -n "$sccache_bin" ] && [ -x "$sccache_bin" ]; then
          "$sccache_bin" --stop-server > /dev/null 2>&1 || true
        fi
        if [ -n "$sccache_bin" ] && [ -x "$sccache_bin" ] && "$sccache_bin" --start-server 2>/dev/null; then
          # The start above is only a health probe. This action runs BEFORE the
          # cache step that restores ${SCCACHE_DIR} (rust-cache
          # `cache-directories` / producer archive), and the local-disk backend
          # indexes its cache when the server starts — entries unpacked
          # afterwards would never be hits. Stop the probe server; the first
          # rustc invocation lazily respawns it AFTER the cache restore,
          # inheriting SCCACHE_* from GITHUB_ENV, so the persisted cache is
          # actually indexed and reused.
          "$sccache_bin" --stop-server > /dev/null 2>&1 || true
          echo "RUSTC_WRAPPER=${sccache_bin}" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=${sccache_bin}" >> "$GITHUB_ENV"
          # Persisted for build steps: the lazily-spawned server reads these.
          echo "SCCACHE_DIR=${SCCACHE_DIR}" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=${SCCACHE_CACHE_SIZE}" >> "$GITHUB_ENV"
          echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"
          echo "sccache enabled (2 GiB local cache; idle timeout disabled; server starts lazily after cache restore)"
        else
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "sccache unavailable — cleared rustc-wrapper so cargo falls back to default"
        fi

    - name: Assert cache-service credentials are absent
      shell: bash
      run: |
        set -euo pipefail
        # Fail closed if a prior installer persisted the Actions cache token
        # into this `run:` environment. Do not print credential values.
        leaked=0
        for var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
          if [ -n "${!var:-}" ]; then
            echo "::error::${var} is present in this run environment; refusing to execute later PR-controlled build steps with a cache-service credential" >&2
            leaked=1
          fi
        done
        if [ "$leaked" -ne 0 ]; then
          exit 1
        fi
