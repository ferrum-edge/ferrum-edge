name: Setup Rust CI environment
description: >-
  Installs the stable Rust toolchain (optional components), wires sccache
  via setup-sccache, optionally installs Linux native build dependencies
  and a fast linker in one apt transaction, configures setup-fast-linker,
  sets up the Swatinem rust-cache, and pre-fetches crate dependencies.
  sccache caches compiler outputs in the GitHub Actions cache backend;
  rust-cache restores Cargo and target directories with isolated shared keys
  so incompatible job/profile/target artifacts do not mix. Centralizes the
  setup block so individual jobs only declare their cache key and any extra
  rustup components.

inputs:
  shared-key:
    description: >-
      rust-cache shared key. Set per logical job (e.g. `ci-test`,
      `ci-test-functional`, `ci-lint`, `ci-perf`) so caches don't trample
      each other. Jobs that compile the same artifacts should share a key.
    required: true
  components:
    description: >-
      Comma-separated rustup components (e.g. `clippy`, `rustfmt`). Empty
      string skips component install — most jobs don't need extras.
    required: false
    default: ""
  install-native-deps:
    description: >-
      Install Linux native build dependencies required by the root workspace
      build script and current CI compile/test jobs (`protobuf-compiler` for
      tonic/prost codegen and `libcurl4-openssl-dev` for native headers).
      Set false only for Rust setup jobs that do not compile this workspace.
    required: false
    default: "true"
  install-fast-linker:
    description: >-
      Install/configure the fast linker (`mold` + `clang` on Linux, `lld` on
      macOS). Set false for jobs that only need cargo/rustup and do not build.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: stable
        components: ${{ inputs.components }}

    - uses: ./.github/actions/setup-sccache

    - name: Install Linux build packages
      if: runner.os == 'Linux' && (inputs.install-native-deps == 'true' || inputs.install-fast-linker == 'true')
      shell: bash
      run: |
        set -euo pipefail

        missing_packages=()

        if [ "${{ inputs.install-fast-linker }}" = "true" ]; then
          if ! command -v mold > /dev/null 2>&1; then
            missing_packages+=(mold)
          fi
          if ! command -v clang > /dev/null 2>&1; then
            missing_packages+=(clang)
          fi
        fi

        if [ "${{ inputs.install-native-deps }}" = "true" ]; then
          if ! command -v protoc > /dev/null 2>&1; then
            missing_packages+=(protobuf-compiler)
          fi
          if ! dpkg -s libcurl4-openssl-dev > /dev/null 2>&1; then
            missing_packages+=(libcurl4-openssl-dev)
          fi
        fi

        if [ "${#missing_packages[@]}" -eq 0 ]; then
          echo "Linux build packages already available"
          exit 0
        fi

        sudo apt-get update
        sudo apt-get install -y --no-install-recommends "${missing_packages[@]}"

    - uses: ./.github/actions/setup-fast-linker
      if: inputs.install-fast-linker == 'true'
      with:
        install-linux-packages: "false"

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        shared-key: ${{ inputs.shared-key }}

    - name: Pre-fetch crate dependencies (isolate transient registry flakes)
      shell: bash
      run: |
        # Warm the dependency download surface up front so a transient
        # crates.io/CDN hiccup fails *here* — fast, isolated, and clearly
        # labeled — instead of minutes into a compile where it reads as a
        # mysterious build error and prompts a "is this my change?" re-review.
        # On a warm Swatinem cache this is a near-instant no-op (everything is
        # already in ~/.cargo). cargo's own net.retry / http.multiplexing=false
        # (.cargo/config.toml) harden each fetch pass; this outer loop is the
        # backstop for the rare case where a whole pass dies past that budget.
        # --locked also catches Cargo.lock drift early with a clear failure.
        attempts=5
        for i in $(seq 1 "$attempts"); do
          if cargo fetch --locked; then
            exit 0
          fi
          if [ "$i" -lt "$attempts" ]; then
            backoff=$((i * 5))
            echo "::warning::cargo fetch attempt ${i}/${attempts} failed (transient registry error?); retrying in ${backoff}s"
            sleep "$backoff"
          fi
        done
        echo "::error::cargo fetch failed after ${attempts} attempts — likely a crates.io/registry outage, not this change"
        exit 1
