name: Setup Rust CI environment
description: >-
  Installs the stable Rust toolchain (optional components), wires sccache
  via setup-sccache, installs the required Linux native build dependencies
  (strict) and the optional fast linker (best-effort), configures
  setup-fast-linker, sets up the Swatinem rust-cache, and pre-fetches crate
  dependencies.
  sccache caches compiler outputs in a bounded local directory (the
  cache-service credential is intentionally not exposed to later PR-controlled
  steps); rust-cache persists that directory together with Cargo and target
  directories using isolated shared keys so incompatible job/profile/target
  artifacts do not mix.
  Centralizes the setup block so individual jobs only declare their cache key
  and any extra rustup components.

inputs:
  shared-key:
    description: >-
      rust-cache shared key. Set per logical job (e.g. `ci-test`,
      `ci-test-functional`, `ci-lint`, `ci-perf`) so caches don't trample
      each other. Jobs that compile the same artifacts should share a key.
    required: true
  components:
    description: >-
      Comma-separated rustup components (e.g. `clippy`, `rustfmt`). Empty
      string skips component install — most jobs don't need extras.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Opt pedagogical example plugins into CI/test builds
      shell: bash
      run: |
        # Examples under custom_plugins/examples/ are excluded from default /
        # Docker / release builds. Jobs that use this action (unit, lint,
        # coverage, test-artifact archives, etc.) opt them in here so their
        # tests and clippy coverage exercise the templates. The protected
        # ARM64 Cross job does not use this action and keeps examples out.
        # Include every production custom_plugins/*.rs stem automatically so
        # adding a production plugin cannot silently remove it from CI merely
        # because this opt-in list exists for the pedagogical examples.
        plugins="example_plugin,example_audit_plugin"
        for source in custom_plugins/*.rs; do
          [ -e "$source" ] || continue
          stem="${source##*/}"
          stem="${stem%.rs}"
          [ "$stem" = "mod" ] || plugins="$plugins,$stem"
        done
        echo "FERRUM_CUSTOM_PLUGINS=$plugins" >> "$GITHUB_ENV"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: stable
        components: ${{ inputs.components }}

    - uses: ./.github/actions/setup-sccache

    - name: Install required Linux build packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        # Native build deps the workspace build script genuinely needs:
        # protobuf-compiler for tonic/prost codegen, libcurl4-openssl-dev for
        # native headers. A missing/failed install here is fatal — these are
        # not optional. The fast linker (mold + clang) is installed separately
        # below as best-effort, since setup-fast-linker falls back to the
        # default linker when they are unavailable.
        required_packages=()

        if ! command -v protoc > /dev/null 2>&1; then
          required_packages+=(protobuf-compiler)
        fi
        if ! dpkg -s libcurl4-openssl-dev > /dev/null 2>&1; then
          required_packages+=(libcurl4-openssl-dev)
        fi

        if [ "${#required_packages[@]}" -eq 0 ]; then
          echo "Required Linux build packages already available"
          exit 0
        fi

        sudo apt-get update
        sudo apt-get install -y --no-install-recommends "${required_packages[@]}"

    - name: Install optional fast-linker packages (best-effort)
      if: runner.os == 'Linux'
      shell: bash
      # Non-fatal: mold + clang are only a linker optimization (paired with the
      # per-target rustflags in .cargo/config.toml). If either package is
      # transiently unavailable or an apt mirror fails for just these, do NOT
      # fail the job — setup-fast-linker's "Configure fast linker" step detects
      # the missing tools and clears the mold rustflags so cargo uses the
      # default linker. Build still proceeds, just at default link speed.
      continue-on-error: true
      run: |
        set -euo pipefail

        optional_packages=()

        if ! command -v mold > /dev/null 2>&1; then
          optional_packages+=(mold)
        fi
        if ! command -v clang > /dev/null 2>&1; then
          optional_packages+=(clang)
        fi

        if [ "${#optional_packages[@]}" -eq 0 ]; then
          echo "Fast-linker packages already available"
          exit 0
        fi

        sudo apt-get update
        sudo apt-get install -y --no-install-recommends "${optional_packages[@]}"

    - uses: ./.github/actions/setup-fast-linker
      with:
        install-linux-packages: "false"

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        shared-key: ${{ inputs.shared-key }}
        cache-directories: ${{ github.workspace }}/.cache/sccache

    - name: Pre-fetch crate dependencies (isolate transient registry flakes)
      shell: bash
      run: |
        # Warm the dependency download surface up front so a transient
        # crates.io/CDN hiccup fails *here* — fast, isolated, and clearly
        # labeled — instead of minutes into a compile where it reads as a
        # mysterious build error and prompts a "is this my change?" re-review.
        # On a warm Swatinem cache this is a near-instant no-op (everything is
        # already in ~/.cargo). cargo's own net.retry / http.multiplexing=false
        # (.cargo/config.toml) harden each fetch pass; this outer loop is the
        # backstop for the rare case where a whole pass dies past that budget.
        # --locked also catches Cargo.lock drift early with a clear failure.
        attempts=5
        for i in $(seq 1 "$attempts"); do
          if cargo fetch --locked; then
            exit 0
          fi
          if [ "$i" -lt "$attempts" ]; then
            backoff=$((i * 5))
            echo "::warning::cargo fetch attempt ${i}/${attempts} failed (transient registry error?); retrying in ${backoff}s"
            sleep "$backoff"
          fi
        done
        echo "::error::cargo fetch failed after ${attempts} attempts — likely a crates.io/registry outage, not this change"
        exit 1
