# Declared GNU runtime contract for published ferrum-edge and ferrum-cni
# Linux binaries (issue #4301). Hosted release jobs, the ABI scanner, and
# operator docs must agree on these values.
#
# The advertised generic `ferrum-edge-linux-{x86_64,aarch64}` and
# `ferrum-cni-linux-{x86_64,aarch64}` artifacts are GNU (glibc) binaries.
# They are not musl. Artifact names stay unchanged so checksums, signatures,
# and container packaging keep consuming the same trusted asset set.

# TOML binds a bare key to the table header above it, so every top-level
# key in this contract must stay above the first `[table]` below.

glibc_max_version = "2.34"

# Dynamic libraries the GNU artifacts may reference. libz is listed because
# librdkafka's cmake build may still pull in libz-sys; the sysroot build sets
# LIBZ_SYS_STATIC=1 so a clean link typically omits it. glibc SONAMEs (libc,
# libm, libpthread, libdl, librt, libresolv) and libgcc_s are the remaining
# runtime contract. Anything else fails the gate.
allowed_needed = [
    "libc.so.6",
    "libm.so.6",
    "libgcc_s.so.1",
    "libpthread.so.0",
    "libdl.so.2",
    "librt.so.1",
    "libresolv.so.2",
    "libz.so.1",
    "ld-linux-x86-64.so.2",
    "ld-linux-aarch64.so.1",
]

# Oldest supported runtime this contract claims: RHEL 9 / Rocky Linux 9 /
# AlmaLinux 9 (glibc 2.34). Ubuntu 22.04 (2.35) and Debian 12 (2.36) are
# newer and therefore included. The x86_64 GNU build sysroot is older than
# this floor so the linked GLIBC ceiling cannot silently track ubuntu-26.04.

[sysroot]
# AlmaLinux 8.10 (glibc 2.28). Digest is the multi-arch index; callers pass
# --platform linux/amd64. dnf in this image still serves EL8.
image = "almalinux@sha256:4a87d2615a770506e204c27d6248ac97f4df67f4e41e2e9c47c81f0ed0be98cb"
name = "AlmaLinux 8.10"
glibc = "2.28"
platform = "linux/amd64"
protoc_version = "25.1"
protoc_archive = "protoc-25.1-linux-x86_64.zip"
protoc_url = "https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip"
protoc_sha256 = "ed8fca87a11c888fed329d6a59c34c7d436165f662a2c875246ddb1ac2b6dd50"

[smoke.floor]
# Oldest advertised runtime. Must be older than the ubuntu-26.04 build host.
image = "almalinux@sha256:1c718a4cd7bab3bdb069ddbbd1eb593a390e6932d51d0048a2f6556303bafba7"
name = "AlmaLinux 9.4"
glibc = "2.34"

[smoke.ubuntu2204]
image = "ubuntu@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc"
name = "Ubuntu 22.04"
glibc = "2.35"
