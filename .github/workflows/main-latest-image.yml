name: Main Latest Image

# Owner decision 2026-09-28: the Docker `latest` tag tracks the most recent
# `main` commit whose complete push CI succeeded. It is a moving development
# channel, not a release; version tags are published only by release.yml.
#
# Fail-closed contract, pinned by .github/scripts/verify_main_latest_image_workflow.py
# (run by the required Tests gate through verify_required_ci.py):
#   * runs only after a successful `push` run of ci.yml on `main` in this
#     repository, and builds exactly that run's head SHA;
#   * publishes nothing unless that SHA is still the head of `main`, checked
#     before building and again immediately before `latest` moves, so a late
#     run can never move `latest` backwards;
#   * pushes only `latest` and the immutable `main-<sha>` tag, never a version
#     tag and never an `-ebpf` / `-ebpf-tools` variant;
#   * signs and attests the `main-<sha>` digest (SPDX SBOMs and SLSA
#     provenance, keyless Cosign) before `latest` is pointed at it.
#
# The image is built from source with the root `Dockerfile` `runtime` target on
# native amd64/arm64 runners, exactly as release.yml builds its eBPF families.
# The release default image instead packages the protected release binaries,
# which only release.yml may produce.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

# One publisher at a time. Only qualifying (push + success) CI completions
# share the group, so an unrelated completion cannot displace a pending
# publisher. A newer qualifying completion may replace a pending one; the head
# check makes the replaced run stale anyway.
concurrency:
  group: main-latest-image-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.conclusion }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve main head
    if: github.repository == 'ferrum-edge/ferrum-edge' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/ci.yml' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.head.outputs.publish }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Require the CI-validated commit to be the current main head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::workflow_run head SHA is missing or malformed" >&2
            exit 1
          fi
          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

          # The workflow definition that runs here must come from the same
          # commit it publishes. A mismatch means main moved after CI finished.
          if [ "$GITHUB_SHA" != "$SOURCE_SHA" ]; then
            echo "::notice::main moved to ${GITHUB_SHA} after CI validated ${SOURCE_SHA}; not publishing"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          main_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$main_head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve the current head of main" >&2
            exit 1
          fi
          if [ "$main_head" != "$SOURCE_SHA" ]; then
            echo "::notice::main head is ${main_head}, not ${SOURCE_SHA}; not publishing a stale latest"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Main latest image"
            echo ""
            echo "Commit: \`${SOURCE_SHA}\`"
            echo ""
            echo "CI run: ${CI_RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: steps.head.outputs.publish == 'true'
        with:
          ref: ${{ steps.head.outputs.sha }}
          persist-credentials: false

      - name: Verify the publisher contract at the published commit
        if: steps.head.outputs.publish == 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_main_latest_image_workflow.py --self-test
          python3 .github/scripts/verify_main_latest_image_workflow.py

  build:
    name: Build latest image (${{ matrix.platform }})
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch_dir: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch_dir: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Confirm the checkout is the CI-validated commit
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$SOURCE_SHA" ]; then
            echo "::error::checkout ${checked_out} is not the CI-validated ${SOURCE_SHA}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push per-platform digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: |
            FEATURES=cloud-secrets
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          outputs: type=image,"name=ferrumedge/ferrum-edge,ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build produced no immutable digest" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: main-latest-digest-${{ matrix.arch_dir }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish main-sha manifest
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: main-latest-digest-*
          merge-multiple: true

      - name: Require exactly one digest per platform
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          count=0
          for digest in *; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected digest file ${digest}" >&2
              exit 1
            fi
            count=$((count + 1))
          done
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests, found ${count}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the immutable `main-<sha>` tag is created here. `latest` moves in
      # `promote`, after this digest is signed, attested, and verified.
      - name: Create and push immutable multi-arch manifests
        working-directory: ${{ runner.temp }}/digests
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ferrumedge/ferrum-edge:main-${SOURCE_SHA}" \
            $(printf 'ferrumedge/ferrum-edge@sha256:%s ' *)
          docker buildx imagetools create \
            -t "ghcr.io/${GITHUB_REPOSITORY}:main-${SOURCE_SHA}" \
            $(printf "ghcr.io/${GITHUB_REPOSITORY}@sha256:%s " *)

  attest:
    name: Sign and attest main image
    needs: [resolve, manifest]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      packages: write
    outputs:
      docker_digest: ${{ steps.images.outputs.docker_digest }}
      ghcr_digest: ${{ steps.images.outputs.ghcr_digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve and compare immutable manifest digests
        id: images
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/image-attestations"
          mkdir -p "$work"

          cat > "$work/require_manifest.jq" <<'JQ'
          (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
          (.manifests | type == "array" and length == 2) and
          ([.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]) and
          all(.manifests[]; (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")))
          JQ

          cat > "$work/platform_descriptors.jq" <<'JQ'
          .manifests
          | sort_by(.platform.os, .platform.architecture)
          | map({mediaType, digest, size, platform})
          JQ

          resolve_manifest() {
            local registry="$1"
            local tag_ref="$2"
            local manifest_file="$work/${registry}.manifest.json"
            local digest

            docker buildx imagetools inspect \
              "$tag_ref" \
              --format '{{json .Manifest}}' > "$manifest_file"

            jq -e -f "$work/require_manifest.jq" "$manifest_file" >/dev/null

            digest="$(jq -er '.digest' "$manifest_file")"
            echo "${registry}_digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "${registry}_ref=${tag_ref%:main-*}@${digest}" >> "$GITHUB_OUTPUT"
          }

          resolve_manifest docker "ferrumedge/ferrum-edge:main-${SOURCE_SHA}"
          resolve_manifest ghcr "ghcr.io/${GITHUB_REPOSITORY}:main-${SOURCE_SHA}"

          jq -S -f "$work/platform_descriptors.jq" \
            "$work/docker.manifest.json" > "$work/docker.descriptors.json"
          jq -S -f "$work/platform_descriptors.jq" \
            "$work/ghcr.manifest.json" > "$work/ghcr.descriptors.json"
          if ! diff -u "$work/docker.descriptors.json" "$work/ghcr.descriptors.json"; then
            echo "::error::platform manifests differ between Docker Hub and GHCR" >&2
            exit 1
          fi

      - name: Generate SPDX SBOMs and manifest provenance
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          DOCKER_REF: ${{ steps.images.outputs.docker_ref }}
          GHCR_REF: ${{ steps.images.outputs.ghcr_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/image-attestations"

          cat > "$work/require_sbom.jq" <<'JQ'
          (.spdxVersion | type == "string" and startswith("SPDX-")) and
          (.documentNamespace | type == "string" and length > 0) and
          (.packages | type == "array" and length > 0) and
          ((.documentDescribes | type == "array" and length > 0) or
            ([.relationships[]? | select(.spdxElementId == "SPDXRef-DOCUMENT"
              and .relationshipType == "DESCRIBES")] | length > 0))
          JQ

          generate_sboms() {
            local registry="$1"
            local image_ref="$2"
            local registry_username="$3"
            local registry_password="$4"
            local platform arch output

            for platform in linux/amd64 linux/arm64; do
              arch="${platform#linux/}"
              output="$work/${registry}-${arch}.spdx.json"
              # anchore/syft:v1.49.0, pinned to the same image as release.yml.
              docker run --rm \
                -e SYFT_CHECK_FOR_APP_UPDATE=false \
                -e SYFT_REGISTRY_AUTH_USERNAME="$registry_username" \
                -e SYFT_REGISTRY_AUTH_PASSWORD="$registry_password" \
                -v "$work:/out" \
                anchore/syft@sha256:9a9f85314017f1ea798fb012edfa7fe9259923910f82c8d4bc983ab5c765e60b \
                scan "registry:${image_ref}" \
                --platform "$platform" \
                -o "spdx-json=/out/${registry}-${arch}.spdx.json"

              jq -e -f "$work/require_sbom.jq" "$output" >/dev/null
            done
          }

          generate_sboms docker "$DOCKER_REF" "$DOCKERHUB_USERNAME" "$DOCKERHUB_PASSWORD"
          generate_sboms ghcr "$GHCR_REF" "$GHCR_USERNAME" "$GHCR_TOKEN"

          cat > "$work/create_provenance.jq" <<'JQ'
          {
            buildDefinition: {
              buildType: $build_type,
              externalParameters: {
                repository: $repository,
                ref: $ref,
                tag: $tag,
                variant: "standard",
                platforms: ["linux/amd64", "linux/arm64"],
                validatedBy: $ci_run
              },
              internalParameters: {},
              resolvedDependencies: (
                [{
                  uri: $source_uri,
                  digest: {gitCommit: $source_sha}
                }] +
                ($manifest[0].manifests | map({
                  uri: ($repository + "@" + .digest),
                  digest: {sha256: (.digest | sub("^sha256:"; ""))},
                  annotations: {platform: (.platform.os + "/" + .platform.architecture)}
                }))
              )
            },
            runDetails: {
              builder: {id: $builder_id},
              metadata: {invocationId: $invocation_id},
              byproducts: []
            }
          }
          JQ

          create_provenance() {
            local registry="$1"
            local repository="$2"

            jq -n \
              --arg build_type "https://github.com/${GITHUB_REPOSITORY}/blob/${SOURCE_SHA}/docs/ci_cd.md#main-latest-image" \
              --arg builder_id "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --arg invocation_id "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
              --arg ref "$GITHUB_REF" \
              --arg repository "$repository" \
              --arg source_uri "git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_REF}" \
              --arg source_sha "$SOURCE_SHA" \
              --arg tag "main-${SOURCE_SHA}" \
              --arg ci_run "$CI_RUN_URL" \
              --slurpfile manifest "$work/${registry}.manifest.json" \
              -f "$work/create_provenance.jq" > "$work/${registry}.provenance.json"
          }

          create_provenance docker ferrumedge/ferrum-edge
          create_provenance ghcr "ghcr.io/${GITHUB_REPOSITORY}"

      - name: Sign and attest immutable image digests
        env:
          DOCKER_REF: ${{ steps.images.outputs.docker_ref }}
          GHCR_REF: ${{ steps.images.outputs.ghcr_ref }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/image-attestations"

          sign_and_attest() {
            local registry="$1"
            local image_ref="$2"

            cosign sign --yes "$image_ref"
            cosign attest --yes \
              --type slsaprovenance1 \
              --predicate "$work/${registry}.provenance.json" \
              "$image_ref"
            for sbom in "$work/${registry}-amd64.spdx.json" "$work/${registry}-arm64.spdx.json"; do
              cosign attest --yes \
                --type spdxjson \
                --predicate "$sbom" \
                "$image_ref"
            done
          }

          sign_and_attest docker "$DOCKER_REF"
          sign_and_attest ghcr "$GHCR_REF"

      - name: Verify signatures, provenance, subjects, and SBOMs
        env:
          DOCKER_REF: ${{ steps.images.outputs.docker_ref }}
          GHCR_REF: ${{ steps.images.outputs.ghcr_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/image-attestations"
          certificate_identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          oidc_issuer="https://token.actions.githubusercontent.com"

          cat > "$work/require_signature.jq" <<'JQ'
          length > 0 and
          all(.[]; .critical.image["docker-manifest-digest"] == $digest)
          JQ

          cat > "$work/require_provenance.jq" <<'JQ'
          [
            flatten[]
            | (.payload // .dsseEnvelope.payload)
            | select(type == "string")
            | @base64d
            | fromjson
            | select(.predicateType == "https://slsa.dev/provenance/v1")
            | select(any(.subject[]?; .digest.sha256 == $digest))
            | select(
                any(
                  .predicate.buildDefinition.resolvedDependencies[]?;
                  .digest.gitCommit == $source_sha
                )
              )
          ] | length > 0
          JQ

          cat > "$work/require_sbom_attest.jq" <<'JQ'
          [
            flatten[]
            | (.payload // .dsseEnvelope.payload)
            | select(type == "string")
            | @base64d
            | fromjson
            | select(any(.subject[]?; .digest.sha256 == $digest))
            | select(.predicate.spdxVersion | startswith("SPDX-"))
            | select(.predicate.packages | type == "array" and length > 0)
          ] | length >= 2
          JQ

          verify_common_args=(
            --certificate-identity "$certificate_identity"
            --certificate-oidc-issuer "$oidc_issuer"
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY"
            --certificate-github-workflow-sha "$GITHUB_SHA"
            --certificate-github-workflow-ref "$GITHUB_REF"
            --certificate-github-workflow-trigger workflow_run
          )

          verify_image() {
            local registry="$1"
            local image_ref="$2"
            local expected_digest="${image_ref##*@sha256:}"
            local prefix="$work/verified-${registry}"

            if [[ ! "$expected_digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::invalid immutable image reference ${image_ref}" >&2
              exit 1
            fi

            cosign verify \
              "${verify_common_args[@]}" \
              "$image_ref" > "${prefix}-signature.json"
            jq -e --arg digest "sha256:${expected_digest}" \
              -f "$work/require_signature.jq" \
              "${prefix}-signature.json" >/dev/null

            cosign verify-attestation \
              "${verify_common_args[@]}" \
              --type slsaprovenance1 \
              "$image_ref" > "${prefix}-provenance.json"
            jq -e -s --arg digest "$expected_digest" --arg source_sha "$SOURCE_SHA" \
              -f "$work/require_provenance.jq" \
              "${prefix}-provenance.json" >/dev/null

            cosign verify-attestation \
              "${verify_common_args[@]}" \
              --type spdxjson \
              "$image_ref" > "${prefix}-sbom.json"
            jq -e -s --arg digest "$expected_digest" \
              -f "$work/require_sbom_attest.jq" \
              "${prefix}-sbom.json" >/dev/null
          }

          verify_image docker "$DOCKER_REF"
          verify_image ghcr "$GHCR_REF"

  promote:
    name: Move latest to the verified digest
    needs: [resolve, attest]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The head check and the tag move share one step so no other step can run
      # between them. A newer main commit waits behind this run's concurrency
      # group and moves `latest` itself once its own CI succeeds.
      - name: Move latest when the commit is still the main head
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          DOCKER_DIGEST: ${{ needs.attest.outputs.docker_digest }}
          GHCR_DIGEST: ${{ needs.attest.outputs.ghcr_digest }}
        run: |
          set -euo pipefail
          for digest in "$DOCKER_DIGEST" "$GHCR_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::verified manifest digest is missing or malformed" >&2
              exit 1
            fi
          done

          main_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$main_head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve the current head of main" >&2
            exit 1
          fi
          if [ "$main_head" != "$SOURCE_SHA" ]; then
            echo "::notice::main head is ${main_head}, not ${SOURCE_SHA}; leaving latest unchanged"
            echo "\`latest\` unchanged: main moved to \`${main_head}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          docker buildx imagetools create \
            -t "ferrumedge/ferrum-edge:latest" \
            "ferrumedge/ferrum-edge@${DOCKER_DIGEST}"
          docker buildx imagetools create \
            -t "ghcr.io/${GITHUB_REPOSITORY}:latest" \
            "ghcr.io/${GITHUB_REPOSITORY}@${GHCR_DIGEST}"

          # `latest` must name exactly the digest that was signed and verified.
          require_latest() {
            local tag_ref="$1"
            local expected="$2"
            local actual
            actual="$(docker buildx imagetools inspect "$tag_ref" --format '{{json .Manifest}}' | jq -er '.digest')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::${tag_ref} resolves to ${actual}, expected verified ${expected}" >&2
              exit 1
            fi
          }
          require_latest "ferrumedge/ferrum-edge:latest" "$DOCKER_DIGEST"
          require_latest "ghcr.io/${GITHUB_REPOSITORY}:latest" "$GHCR_DIGEST"

          {
            echo "\`latest\` now points to \`main-${SOURCE_SHA}\`:"
            echo ""
            echo "- \`ferrumedge/ferrum-edge@${DOCKER_DIGEST}\`"
            echo "- \`ghcr.io/${GITHUB_REPOSITORY}@${GHCR_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
