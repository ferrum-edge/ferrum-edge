name: Main Latest Image

# Owner decision 2026-09-28: the Docker `latest` tag tracks the newest `main`
# commit whose complete push CI succeeded and whose image this workflow then
# built. It is a moving development channel, not a release; version tags are
# published only by release.yml.
#
# Fail-closed contract, pinned by .github/scripts/verify_main_latest_image_workflow.py
# (run by the required Tests gate through verify_required_ci.py):
#   * runs only after a successful `push` run of ci.yml on `main` in this
#     repository, and builds exactly that run's head SHA;
#   * runs are serialized: one runs, the newest waits, and any older waiting
#     run is replaced, so intermediate commits may be skipped. Each commit that
#     is built gets `main-<sha>`; a re-run reuses an already signed `main-<sha>`
#     instead of rebuilding it, so it never re-pushes a different digest;
#   * moves `latest` only while the commit is still on main's history and only
#     forward: when the commit `latest` names (its
#     `org.opencontainers.image.revision` label) is on main's history, it must
#     be an ancestor of this commit. Both facts are re-checked immediately
#     before each registry's move;
#   * credential isolation: the only jobs that check out or execute repository
#     code (`contract`, `smoke`) hold no secret and no registry token. Jobs
#     that hold registry credentials never check out the repository; `build`
#     hands BuildKit the public Git URL of the commit instead. Syft, which
#     parses the built image, gets no credential and scans Docker Hub
#     anonymously;
#   * pushes only `latest` and the `main-<sha>` tag, never a version tag and
#     never an `-ebpf` / `-ebpf-tools` variant;
#   * smoke-runs each platform image, then attests (SPDX SBOMs, SLSA
#     provenance) and signs the `main-<sha>` digest with keyless Cosign, and
#     points `latest` only at the digest reference the verify step checked.
#
# A failure after `manifest` and before signing leaves an unsigned `main-<sha>`
# tag behind until a re-run replaces it. Consumers must verify the signature.
#
# The image is built from source with the root `Dockerfile` `runtime` target on
# native amd64/arm64 runners, exactly as release.yml builds its eBPF families.
# The release default image instead packages the protected release binaries,
# which only release.yml may produce.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

# One group for every run that can publish (a successful `push` run of ci.yml
# in this repository), so publishers never overlap and every move of `latest`
# is serialized. With cancel-in-progress disabled, GitHub keeps the running
# publisher and only the newest waiting one; an older waiting run is cancelled
# before it starts. Runs for other events or conclusions land in other groups
# and skip at `resolve`, so they cannot displace a waiting publisher.
concurrency:
  group: main-latest-image-${{ github.repository }}-${{ github.event.workflow_run.path }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.conclusion }}
  cancel-in-progress: false

jobs:
  # No checkout and no repository code: this job only reads GitHub and the
  # registries. It holds a GHCR read token because the GHCR package does not
  # serve anonymous reads; Docker Hub is read anonymously.
  resolve:
    name: Resolve main commit
    if: github.repository == 'ferrum-edge/ferrum-edge' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/ci.yml' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      publish: ${{ steps.head.outputs.publish }}
      sha: ${{ steps.head.outputs.sha }}
      build: ${{ steps.existing.outputs.build }}
    steps:
      - name: Require the CI-validated commit to be on main's history
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::workflow_run head SHA is missing or malformed" >&2
            exit 1
          fi
          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

          # GitHub reports `ahead` or `identical` exactly when base is an
          # ancestor of, or equal to, head. A compare 404 counts as "not an
          # ancestor" only when it is corroborated: GitHub says the histories
          # share no common ancestor, or the commits API does not know one of
          # the two commits either (for example after main was rewritten). An
          # uncorroborated 404, like any other answer, stops the run.
          is_ancestor() {
            local base="$1"
            local head="$2"
            local status
            local compare_err
            local commit_err
            local commit
            local corroborated
            compare_err="$(mktemp)"
            commit_err="$(mktemp)"
            status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${base}...${head}?per_page=1" --jq '.status' 2>"$compare_err" || true)"
            if grep -q 'HTTP 404' "$compare_err"; then
              corroborated=false
              if grep -qi 'no common ancestor' "$compare_err"; then
                corroborated=true
              fi
              for commit in "$base" "$head"; do
                if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${commit}" --jq '.sha' >/dev/null 2>"$commit_err" &&
                  grep -Eq 'HTTP 404|No commit found for SHA' "$commit_err"; then
                  corroborated=true
                fi
              done
              if [ "$corroborated" != true ]; then
                echo "::error::compare ${base}...${head} returned 404, but both commits exist and GitHub reported no missing common ancestor; refusing to treat ${base} as off main's history" >&2
                cat "$compare_err" >&2
                exit 1
              fi
              status="missing"
            fi
            case "$status" in
              ahead | identical) return 0 ;;
              behind | diverged | missing) return 1 ;;
              *)
                echo "::error::could not compare ${base} with ${head}" >&2
                cat "$compare_err" >&2
                exit 1
                ;;
            esac
          }

          # The running workflow definition (main's head when CI completed)
          # must already contain the commit it publishes.
          if ! is_ancestor "$SOURCE_SHA" "$GITHUB_SHA"; then
            echo "::notice::the running workflow at ${GITHUB_SHA} does not contain ${SOURCE_SHA}; not publishing"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          main_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$main_head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve the current head of main" >&2
            exit 1
          fi
          if ! is_ancestor "$SOURCE_SHA" "$main_head"; then
            echo "::notice::${SOURCE_SHA} is no longer on main's history (head ${main_head}); not publishing"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Main latest image"
            echo ""
            echo "Commit: \`${SOURCE_SHA}\`"
            echo ""
            echo "CI run: ${CI_RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        if: steps.head.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install Cosign
        if: steps.head.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        if: steps.head.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `main-<sha>` is built once. When both registries already hold it and
      # its signature verifies under this workflow's identity, the build,
      # manifest, and signing jobs are skipped and the existing digest is
      # re-verified and promoted. An unsigned leftover is rebuilt. This step
      # must stay last in the job: `build=false` is its final output.
      - name: Reuse an already signed main-sha image
        id: existing
        if: steps.head.outputs.publish == 'true'
        env:
          SOURCE_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/existing-main-image"
          mkdir -p "$work"
          certificate_identity="https://github.com/ferrum-edge/ferrum-edge/.github/workflows/main-latest-image.yml@refs/heads/main"
          oidc_issuer="https://token.actions.githubusercontent.com"
          verify_common_args=(
            --certificate-identity "$certificate_identity"
            --certificate-oidc-issuer "$oidc_issuer"
            --certificate-github-workflow-repository ferrum-edge/ferrum-edge
            --certificate-github-workflow-ref refs/heads/main
            --certificate-github-workflow-trigger workflow_run
          )

          # Docker Hub is read anonymously, so its per-IP rate limit applies. A
          # throttled (429), failed (5xx), or dropped request is retried with
          # exponential backoff, at most three attempts; any other failure returns
          # to the caller at once, and exhausted retries stop the run. Each caller
          # runs its own literal registry command in a three-attempt loop and uses
          # only the attempt that succeeded. After a failed attempt this helper
          # reads that attempt's stderr: it backs off and returns 0 for a
          # transient error with attempts left, returns 1 for any other error,
          # and stops the run when the third attempt also failed transiently.
          transient_registry_error='toomanyrequests|too many requests|internal server error|bad gateway|service unavailable|timeout|connection reset|connection refused|no such host|temporary failure|\beof\b|deadline exceeded'
          retry_registry_read() {
            local err_file="$1"
            local attempt="$2"
            if ! grep -Eqi "$transient_registry_error" "$err_file"; then
              return 1
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::registry read still failing after 3 attempts" >&2
              cat "$err_file" >&2
              exit 1
            fi
            echo "::warning::transient registry error on attempt ${attempt} of 3, retrying" >&2
            sleep $((10 * 2 ** (attempt - 1)))
          }

          # Prints the manifest digest of a tag, or nothing when it does not exist.
          existing_digest() {
            local tag_ref="$1"
            local manifest
            local attempt
            for attempt in 1 2 3; do
              if manifest="$(docker buildx imagetools inspect "$tag_ref" --format '{{json .Manifest}}' 2>"$work/inspect.err")"; then
                break
              fi
              if ! retry_registry_read "$work/inspect.err" "$attempt"; then
                if grep -qi 'not found' "$work/inspect.err"; then
                  return 0
                fi
                echo "::error::could not inspect ${tag_ref}" >&2
                cat "$work/inspect.err" >&2
                exit 1
              fi
            done
            jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$manifest"
          }

          # `attest` signs only after both attestations are written, so a
          # verified signature marks a digest that finished attesting.
          signed() {
            local image_ref="$1"
            local digest="${image_ref##*@}"
            local attempt
            for attempt in 1 2 3; do
              if cosign verify "${verify_common_args[@]}" "$image_ref" > "$work/signature.json" 2>"$work/verify.err"; then
                break
              fi
              if ! retry_registry_read "$work/verify.err" "$attempt"; then
                return 1
              fi
            done
            jq -e --arg digest "$digest" \
              'length > 0 and all(.[]; .critical.image["docker-manifest-digest"] == $digest)' \
              "$work/signature.json" >/dev/null
          }

          docker_digest="$(existing_digest "ferrumedge/ferrum-edge:main-${SOURCE_SHA}")"
          ghcr_digest="$(existing_digest "ghcr.io/${GITHUB_REPOSITORY}:main-${SOURCE_SHA}")"
          if [ -n "$docker_digest" ] && [ -n "$ghcr_digest" ] &&
            signed "ferrumedge/ferrum-edge@${docker_digest}" &&
            signed "ghcr.io/${GITHUB_REPOSITORY}@${ghcr_digest}"; then
            echo "::notice::main-${SOURCE_SHA} is already published and signed; reusing it"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # Checks out and runs repository code on the host, so it holds no secret, no
  # registry login, and no write token. `python3 -I` keeps the checkout's
  # `.github/scripts/` off sys.path and ignores PYTHON* variables.
  contract:
    name: Verify publisher contract
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the publisher contract of the running workflow
        run: |
          set -euo pipefail
          python3 -I .github/scripts/verify_main_latest_image_workflow.py --self-test
          python3 -I .github/scripts/verify_main_latest_image_workflow.py

  # Holds registry credentials, so it never checks out the repository.
  # BuildKit fetches the public repository at the CI-validated commit itself,
  # and the repository's build steps run only inside BuildKit. The empty
  # `github-token` keeps the job token out of the build, so no Dockerfile can
  # mount it as a GIT_AUTH_TOKEN secret.
  build:
    name: Build latest image (${{ matrix.platform }})
    needs: [resolve, contract]
    if: needs.resolve.outputs.publish == 'true' && needs.resolve.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch_dir: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch_dir: arm64
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push per-platform digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: https://github.com/ferrum-edge/ferrum-edge.git#${{ needs.resolve.outputs.sha }}
          github-token: ""
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: |
            FEATURES=cloud-secrets
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
          outputs: type=image,"name=ferrumedge/ferrum-edge,ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build produced no immutable digest" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: main-latest-digest-${{ matrix.arch_dir }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Runs each pushed platform image by digest on its native runner before the
  # digest can reach a manifest, so an image that cannot start never moves
  # `latest`. Running the image executes repository code, so this job holds no
  # secret and no registry login: Docker Hub serves the image anonymously.
  smoke:
    name: Smoke latest image (${{ matrix.platform }})
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true' && needs.resolve.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch_dir: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch_dir: arm64
    steps:
      - name: Download digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: main-latest-digest-${{ matrix.arch_dir }}
          path: ${{ runner.temp }}/digest

      - name: Smoke the pushed platform image
        working-directory: ${{ runner.temp }}/digest
        run: |
          set -euo pipefail
          # Docker Hub is read anonymously, so its per-IP rate limit applies. A
          # throttled (429), failed (5xx), or dropped request is retried with
          # exponential backoff, at most three attempts; any other failure returns
          # to the caller at once, and exhausted retries stop the run. Each caller
          # runs its own literal registry command in a three-attempt loop and uses
          # only the attempt that succeeded. After a failed attempt this helper
          # reads that attempt's stderr: it backs off and returns 0 for a
          # transient error with attempts left, returns 1 for any other error,
          # and stops the run when the third attempt also failed transiently.
          transient_registry_error='toomanyrequests|too many requests|internal server error|bad gateway|service unavailable|timeout|connection reset|connection refused|no such host|temporary failure|\beof\b|deadline exceeded'
          retry_registry_read() {
            local err_file="$1"
            local attempt="$2"
            if ! grep -Eqi "$transient_registry_error" "$err_file"; then
              return 1
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::registry read still failing after 3 attempts" >&2
              cat "$err_file" >&2
              exit 1
            fi
            echo "::warning::transient registry error on attempt ${attempt} of 3, retrying" >&2
            sleep $((10 * 2 ** (attempt - 1)))
          }

          digests=(*)
          if [ "${#digests[@]}" -ne 1 ] || [[ ! "${digests[0]}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::expected exactly one platform digest" >&2
            exit 1
          fi
          DIGEST="sha256:${digests[0]}"
          pull_err="$RUNNER_TEMP/smoke-pull.err"
          for attempt in 1 2 3; do
            if docker pull "ferrumedge/ferrum-edge@${DIGEST}" 2>"$pull_err"; then
              break
            fi
            if ! retry_registry_read "$pull_err" "$attempt"; then
              echo "::error::could not pull ferrumedge/ferrum-edge@${DIGEST}" >&2
              cat "$pull_err" >&2
              exit 1
            fi
          done
          version_json="$(docker run --rm --network none --pull never "ferrumedge/ferrum-edge@${DIGEST}" version --json)"
          jq -e '.version | type == "string" and length > 0' <<<"$version_json" >/dev/null
          echo "Smoke passed for ${DIGEST}: ${version_json}"

  manifest:
    name: Publish main-sha manifest
    needs: [resolve, build, smoke]
    if: needs.resolve.outputs.publish == 'true' && needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: main-latest-digest-*
          merge-multiple: true

      - name: Require exactly one digest per platform
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          count=0
          for digest in *; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::unexpected digest file ${digest}" >&2
              exit 1
            fi
            count=$((count + 1))
          done
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests, found ${count}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the `main-<sha>` tag is created here. `latest` moves in `promote`,
      # after this digest is attested, signed, and verified.
      - name: Create and push main-sha multi-arch manifests
        working-directory: ${{ runner.temp }}/digests
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ferrumedge/ferrum-edge:main-${SOURCE_SHA}" \
            $(printf 'ferrumedge/ferrum-edge@sha256:%s ' *)
          docker buildx imagetools create \
            -t "ghcr.io/${GITHUB_REPOSITORY}:main-${SOURCE_SHA}" \
            $(printf "ghcr.io/${GITHUB_REPOSITORY}@sha256:%s " *)

  # `manifest` is skipped when `resolve` reuses a signed `main-<sha>`; the
  # explicit result checks replace the implicit success() that a skipped
  # dependency would otherwise fail, and require every needed job that must
  # run to have succeeded.
  attest:
    name: Sign and attest main image
    needs: [resolve, contract, manifest]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.contract.result == 'success' && needs.resolve.outputs.publish == 'true' && (needs.manifest.result == 'success' || (needs.manifest.result == 'skipped' && needs.resolve.outputs.build == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      packages: write
    outputs:
      docker_ref: ${{ steps.verify.outputs.docker_ref }}
      ghcr_ref: ${{ steps.verify.outputs.ghcr_ref }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve and compare main-sha manifest digests
        id: images
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/image-attestations"
          mkdir -p "$work"

          cat > "$work/require_manifest.jq" <<'JQ'
          (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
          (.manifests | type == "array" and length == 2) and
          ([.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]) and
          all(.manifests[]; (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")))
          JQ

          cat > "$work/platform_descriptors.jq" <<'JQ'
          .manifests
          | sort_by(.platform.os, .platform.architecture)
          | map({mediaType, digest, size, platform})
          JQ

          resolve_manifest() {
            local registry="$1"
            local tag_ref="$2"
            local manifest_file="$work/${registry}.manifest.json"
            local digest

            docker buildx imagetools inspect \
              "$tag_ref" \
              --format '{{json .Manifest}}' > "$manifest_file"

            jq -e -f "$work/require_manifest.jq" "$manifest_file" >/dev/null

            digest="$(jq -er '.digest' "$manifest_file")"
            echo "${registry}_digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "${registry}_ref=${tag_ref%:main-*}@${digest}" >> "$GITHUB_OUTPUT"
          }

          resolve_manifest docker "ferrumedge/ferrum-edge:main-${SOURCE_SHA}"
          resolve_manifest ghcr "ghcr.io/${GITHUB_REPOSITORY}:main-${SOURCE_SHA}"

          jq -S -f "$work/platform_descriptors.jq" \
            "$work/docker.manifest.json" > "$work/docker.descriptors.json"
          jq -S -f "$work/platform_descriptors.jq" \
            "$work/ghcr.manifest.json" > "$work/ghcr.descriptors.json"
          if ! diff -u "$work/docker.descriptors.json" "$work/ghcr.descriptors.json"; then
            echo "::error::platform manifests differ between Docker Hub and GHCR" >&2
            exit 1
          fi

      # Syft parses the image the repository built, so it gets no credential:
      # the step references no secret or token, and the container gets no
      # registry auth and only its own new output directory. Docker Hub serves the
      # public image anonymously. The `images` step proved that both registries
      # hold identical platform descriptors, so the GHCR attestations reuse
      # the Docker Hub SBOMs.
      - name: Generate SPDX SBOMs and manifest provenance
        if: needs.resolve.outputs.build == 'true'
        env:
          DOCKER_REF: ${{ steps.images.outputs.docker_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/image-attestations"

          cat > "$work/require_sbom.jq" <<'JQ'
          (.spdxVersion | type == "string" and startswith("SPDX-")) and
          (.documentNamespace | type == "string" and length > 0) and
          (.packages | type == "array" and length > 0) and
          ((.documentDescribes | type == "array" and length > 0) or
            ([.relationships[]? | select(.spdxElementId == "SPDXRef-DOCUMENT"
              and .relationshipType == "DESCRIBES")] | length > 0))
          JQ

          # Docker Hub is read anonymously, so its per-IP rate limit applies. A
          # throttled (429), failed (5xx), or dropped request is retried with
          # exponential backoff, at most three attempts; any other failure returns
          # to the caller at once, and exhausted retries stop the run. Each caller
          # runs its own literal registry command in a three-attempt loop and uses
          # only the attempt that succeeded. After a failed attempt this helper
          # reads that attempt's stderr: it backs off and returns 0 for a
          # transient error with attempts left, returns 1 for any other error,
          # and stops the run when the third attempt also failed transiently.
          transient_registry_error='toomanyrequests|too many requests|internal server error|bad gateway|service unavailable|timeout|connection reset|connection refused|no such host|temporary failure|\beof\b|deadline exceeded'
          retry_registry_read() {
            local err_file="$1"
            local attempt="$2"
            if ! grep -Eqi "$transient_registry_error" "$err_file"; then
              return 1
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::registry read still failing after 3 attempts" >&2
              cat "$err_file" >&2
              exit 1
            fi
            echo "::warning::transient registry error on attempt ${attempt} of 3, retrying" >&2
            sleep $((10 * 2 ** (attempt - 1)))
          }

          sbom_dir="$RUNNER_TEMP/syft-output"
          mkdir "$sbom_dir"
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            output="$sbom_dir/${arch}.spdx.json"
            for attempt in 1 2 3; do
              # anchore/syft:v1.49.0, pinned to the same image as release.yml.
              if docker run --rm \
                -e SYFT_CHECK_FOR_APP_UPDATE=false \
                -v "$sbom_dir:/out" \
                anchore/syft@sha256:9a9f85314017f1ea798fb012edfa7fe9259923910f82c8d4bc983ab5c765e60b \
                scan "registry:${DOCKER_REF}" \
                --platform "$platform" \
                -o "spdx-json=/out/${arch}.spdx.json" 2>"$work/syft.err"; then
                break
              fi
              if ! retry_registry_read "$work/syft.err" "$attempt"; then
                echo "::error::Syft could not scan ${DOCKER_REF} for ${platform}" >&2
                cat "$work/syft.err" >&2
                exit 1
              fi
            done
            if [ -L "$output" ] || [ ! -f "$output" ]; then
              echo "::error::Syft did not write a regular SBOM file for ${platform}" >&2
              exit 1
            fi
            jq -e -f "$work/require_sbom.jq" "$output" >/dev/null
            cp "$output" "$work/docker-${arch}.spdx.json"
            cp "$output" "$work/ghcr-${arch}.spdx.json"
          done

          cat > "$work/create_provenance.jq" <<'JQ'
          {
            buildDefinition: {
              buildType: $build_type,
              externalParameters: {
                repository: $repository,
                ref: $ref,
                tag: $tag,
                variant: "standard",
                platforms: ["linux/amd64", "linux/arm64"],
                validatedBy: $ci_run
              },
              internalParameters: {},
              resolvedDependencies: (
                [{
                  uri: $source_uri,
                  digest: {gitCommit: $source_sha}
                }] +
                ($manifest[0].manifests | map({
                  uri: ($repository + "@" + .digest),
                  digest: {sha256: (.digest | sub("^sha256:"; ""))},
                  annotations: {platform: (.platform.os + "/" + .platform.architecture)}
                }))
              )
            },
            runDetails: {
              builder: {id: $builder_id},
              metadata: {invocationId: $invocation_id},
              byproducts: []
            }
          }
          JQ

          create_provenance() {
            local registry="$1"
            local repository="$2"

            jq -n \
              --arg build_type "https://github.com/${GITHUB_REPOSITORY}/blob/${SOURCE_SHA}/docs/ci_cd.md#main-latest-image" \
              --arg builder_id "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --arg invocation_id "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
              --arg ref "$GITHUB_REF" \
              --arg repository "$repository" \
              --arg source_uri "git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_REF}" \
              --arg source_sha "$SOURCE_SHA" \
              --arg tag "main-${SOURCE_SHA}" \
              --arg ci_run "$CI_RUN_URL" \
              --slurpfile manifest "$work/${registry}.manifest.json" \
              -f "$work/create_provenance.jq" > "$work/${registry}.provenance.json"
          }

          create_provenance docker ferrumedge/ferrum-edge
          create_provenance ghcr "ghcr.io/${GITHUB_REPOSITORY}"

      - name: Attest and sign main-sha image digests
        if: needs.resolve.outputs.build == 'true'
        env:
          DOCKER_REF: ${{ steps.images.outputs.docker_ref }}
          GHCR_REF: ${{ steps.images.outputs.ghcr_ref }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/image-attestations"

          sign_and_attest() {
            local registry="$1"
            local image_ref="$2"

            cosign attest --yes \
              --type slsaprovenance1 \
              --predicate "$work/${registry}.provenance.json" \
              "$image_ref"
            for sbom in "$work/${registry}-amd64.spdx.json" "$work/${registry}-arm64.spdx.json"; do
              cosign attest --yes \
                --type spdxjson \
                --predicate "$sbom" \
                "$image_ref"
            done
            # Sign last: `resolve` reuses a `main-<sha>` only when it is signed.
            cosign sign --yes "$image_ref"
          }

          sign_and_attest docker "$DOCKER_REF"
          sign_and_attest ghcr "$GHCR_REF"

      - name: Verify signatures, provenance, subjects, and SBOMs
        id: verify
        env:
          DOCKER_REF: ${{ steps.images.outputs.docker_ref }}
          GHCR_REF: ${{ steps.images.outputs.ghcr_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/image-attestations"
          mkdir -p "$work"
          certificate_identity="https://github.com/ferrum-edge/ferrum-edge/.github/workflows/main-latest-image.yml@refs/heads/main"
          oidc_issuer="https://token.actions.githubusercontent.com"
          verify_common_args=(
            --certificate-identity "$certificate_identity"
            --certificate-oidc-issuer "$oidc_issuer"
            --certificate-github-workflow-repository ferrum-edge/ferrum-edge
            --certificate-github-workflow-ref refs/heads/main
            --certificate-github-workflow-trigger workflow_run
          )

          cat > "$work/require_signature.jq" <<'JQ'
          length > 0 and
          all(.[]; .critical.image["docker-manifest-digest"] == $digest)
          JQ

          cat > "$work/require_provenance.jq" <<'JQ'
          [
            flatten[]
            | (.payload // .dsseEnvelope.payload)
            | select(type == "string")
            | @base64d
            | fromjson
            | select(.predicateType == "https://slsa.dev/provenance/v1")
            | select(any(.subject[]?; .digest.sha256 == $digest))
            | select(
                any(
                  .predicate.buildDefinition.resolvedDependencies[]?;
                  .digest.gitCommit == $source_sha
                )
              )
          ] | length > 0
          JQ

          cat > "$work/require_sbom_attest.jq" <<'JQ'
          [
            flatten[]
            | (.payload // .dsseEnvelope.payload)
            | select(type == "string")
            | @base64d
            | fromjson
            | select(any(.subject[]?; .digest.sha256 == $digest))
            | select(.predicate.spdxVersion | startswith("SPDX-"))
            | select(.predicate.packages | type == "array" and length > 0)
          ] | length >= 2
          JQ

          verify_image() {
            local registry="$1"
            local image_ref="$2"
            local expected_digest="${image_ref##*@sha256:}"
            local prefix="$work/verified-${registry}"

            if [[ ! "$expected_digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::invalid immutable image reference ${image_ref}" >&2
              exit 1
            fi

            cosign verify \
              "${verify_common_args[@]}" \
              "$image_ref" > "${prefix}-signature.json"
            jq -e --arg digest "sha256:${expected_digest}" \
              -f "$work/require_signature.jq" \
              "${prefix}-signature.json" >/dev/null

            cosign verify-attestation \
              "${verify_common_args[@]}" \
              --type slsaprovenance1 \
              "$image_ref" > "${prefix}-provenance.json"
            jq -e -s --arg digest "$expected_digest" --arg source_sha "$SOURCE_SHA" \
              -f "$work/require_provenance.jq" \
              "${prefix}-provenance.json" >/dev/null

            cosign verify-attestation \
              "${verify_common_args[@]}" \
              --type spdxjson \
              "$image_ref" > "${prefix}-sbom.json"
            jq -e -s --arg digest "$expected_digest" \
              -f "$work/require_sbom_attest.jq" \
              "${prefix}-sbom.json" >/dev/null
          }

          verify_image docker "$DOCKER_REF"
          verify_image ghcr "$GHCR_REF"

          # Only digest references that passed every check above reach `promote`.
          echo "docker_ref=${DOCKER_REF}" >> "$GITHUB_OUTPUT"
          echo "ghcr_ref=${GHCR_REF}" >> "$GITHUB_OUTPUT"

  # No other publisher runs while this job does: the workflow-level concurrency
  # group serializes every run that can move `latest`.
  promote:
    name: Move latest to the verified digest
    needs: [resolve, contract, attest]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.contract.result == 'success' && needs.attest.result == 'success' && needs.resolve.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The ancestry checks and each registry's move share one step, so no
      # other step can run between a check and the tag change it guards.
      - name: Move latest forward to the verified digest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          DOCKER_REF: ${{ needs.attest.outputs.docker_ref }}
          GHCR_REF: ${{ needs.attest.outputs.ghcr_ref }}
        run: |
          set -euo pipefail

          require_verified_ref() {
            local repository="$1"
            local ref="$2"
            if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::CI-validated SHA is missing or malformed" >&2
              exit 1
            fi
            if [ "${ref%@*}" != "$repository" ] || [[ ! "${ref#*@}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${ref} is not a verified ${repository} digest reference" >&2
              exit 1
            fi
          }

          # GitHub reports `ahead` or `identical` exactly when base is an
          # ancestor of, or equal to, head. A compare 404 counts as "not an
          # ancestor" only when it is corroborated: GitHub says the histories
          # share no common ancestor, or the commits API does not know one of
          # the two commits either (for example after main was rewritten). An
          # uncorroborated 404, like any other answer, stops the run.
          is_ancestor() {
            local base="$1"
            local head="$2"
            local status
            local compare_err
            local commit_err
            local commit
            local corroborated
            compare_err="$(mktemp)"
            commit_err="$(mktemp)"
            status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${base}...${head}?per_page=1" --jq '.status' 2>"$compare_err" || true)"
            if grep -q 'HTTP 404' "$compare_err"; then
              corroborated=false
              if grep -qi 'no common ancestor' "$compare_err"; then
                corroborated=true
              fi
              for commit in "$base" "$head"; do
                if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${commit}" --jq '.sha' >/dev/null 2>"$commit_err" &&
                  grep -Eq 'HTTP 404|No commit found for SHA' "$commit_err"; then
                  corroborated=true
                fi
              done
              if [ "$corroborated" != true ]; then
                echo "::error::compare ${base}...${head} returned 404, but both commits exist and GitHub reported no missing common ancestor; refusing to treat ${base} as off main's history" >&2
                cat "$compare_err" >&2
                exit 1
              fi
              status="missing"
            fi
            case "$status" in
              ahead | identical) return 0 ;;
              behind | diverged | missing) return 1 ;;
              *)
                echo "::error::could not compare ${base} with ${head}" >&2
                cat "$compare_err" >&2
                exit 1
                ;;
            esac
          }

          # The commit must still be on main's history.
          require_on_main() {
            local main_head
            main_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ ! "$main_head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::could not resolve the current head of main" >&2
              exit 1
            fi
            if ! is_ancestor "$SOURCE_SHA" "$main_head"; then
              echo "::notice::${SOURCE_SHA} is no longer on main (head ${main_head}); leaving latest unchanged"
              echo "\`latest\` unchanged: \`${SOURCE_SHA}\` is no longer on main." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          }

          # `latest` only moves forward: when the commit it names now is on
          # main's history, it must be an ancestor of (or equal to) this one.
          # A missing tag, an image without a readable revision label, or a
          # revision that is not on main's history (main was rewritten) cannot
          # be newer, so it does not block the move.
          require_latest_not_newer() {
            local repository="$1"
            local inspect_err
            local revision
            local main_head
            inspect_err="$(mktemp)"
            if ! revision="$(
              docker buildx imagetools inspect "${repository}:latest" \
                --format '{{json .Image}}' 2>"$inspect_err" |
                jq -r '(if type == "object" and has("config") then [.] else [.[]?] end)
                  | map(.config.Labels["org.opencontainers.image.revision"]? // empty)
                  | unique
                  | if length == 1 then .[0] else "" end'
            )"; then
              if grep -qi 'not found' "$inspect_err"; then
                echo "::notice::${repository}:latest does not exist yet"
                return 0
              fi
              echo "::error::could not inspect ${repository}:latest" >&2
              cat "$inspect_err" >&2
              exit 1
            fi
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::notice::${repository}:latest carries no readable revision label"
              return 0
            fi
            if is_ancestor "$revision" "$SOURCE_SHA"; then
              return 0
            fi
            main_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ ! "$main_head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::could not resolve the current head of main" >&2
              exit 1
            fi
            if ! is_ancestor "$revision" "$main_head"; then
              echo "::warning::${repository}:latest names ${revision}, which is not on main's history; treating latest as absent"
              return 0
            fi
            echo "::notice::${repository}:latest names ${revision}, which is newer than ${SOURCE_SHA}; leaving latest unchanged"
            echo "\`latest\` unchanged in ${repository}: it names the newer \`${revision}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # `latest` must name exactly the verified digest. A mismatch stops the
          # run before the next registry moves.
          require_latest() {
            local tag_ref="$1"
            local expected_ref="$2"
            local actual
            actual="$(docker buildx imagetools inspect "$tag_ref" --format '{{json .Manifest}}' | jq -er '.digest')"
            if [ "$actual" != "${expected_ref#*@}" ]; then
              echo "::error::${tag_ref} resolves to ${actual}, expected verified ${expected_ref}" >&2
              exit 1
            fi
          }

          summarize() {
            {
              echo "\`latest\` now points to \`main-${SOURCE_SHA}\`:"
              echo ""
              echo "- \`${DOCKER_REF}\`"
              echo "- \`${GHCR_REF}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          require_verified_ref "ferrumedge/ferrum-edge" "$DOCKER_REF"
          require_verified_ref "ghcr.io/${GITHUB_REPOSITORY}" "$GHCR_REF"

          require_on_main
          require_latest_not_newer "ferrumedge/ferrum-edge"
          docker buildx imagetools create \
            -t "ferrumedge/ferrum-edge:latest" \
            "$DOCKER_REF"
          require_latest "ferrumedge/ferrum-edge:latest" "$DOCKER_REF"

          require_on_main
          require_latest_not_newer "ghcr.io/${GITHUB_REPOSITORY}"
          docker buildx imagetools create \
            -t "ghcr.io/${GITHUB_REPOSITORY}:latest" \
            "$GHCR_REF"
          require_latest "ghcr.io/${GITHUB_REPOSITORY}:latest" "$GHCR_REF"

          summarize
