name: Scheduled Scaling Regression

# Weekly coverage for the large functional stress tests intentionally excluded
# from the pull-request functional shards in ci.yml. Each variant runs in its
# own matrix job so one backend failure does not hide the remaining signals.

on:
  schedule:
    # Saturdays 04:00 UTC, away from the Sunday and Monday maintenance crons.
    - cron: "0 4 * * 6"
  workflow_dispatch:

concurrency:
  group: scaling-regression
  cancel-in-progress: true

permissions:
  contents: read

# The scaling-gate-signal job below is the durable alert for a red weekly
# run. A separate daily freshness workflow reuses the same publisher so a
# stale (unrun) gate cannot stay silent. Both upsert a `severity:high` issue
# and must not mention required check names in live YAML. Publisher jobs
# share scaling-gate-publisher with queue: max and cancel-in-progress:
# false so overlapping weekly/daily work stays queued instead of replacing
# the default single pending job. GitHub does not guarantee FIFO among
# queued jobs; the publisher is generation-aware and follows the latest
# scaling-regression.yml run on main.

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  scaling-regression:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    # 300, not 180: read-your-write live apply (#3960) made `POST /batch` block
    # until the poll loop publishes a covering generation, so every one of the
    # 30k test's ten batches now pays a synchronous convergence cost that used
    # to be asynchronous. The MongoDB leg ran 138 min before that landed and
    # exceeded 180 after (issue #4136), while reporting 100% success on every
    # batch it completed — it ran out of wall clock, not correctness. This
    # restores comparable headroom without shrinking the 30,000-proxy workload
    # the gate exists to measure.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 30k proxy scale (SQLite)
            backend: sqlite
            test: functional::functional_scale_perf_test::test_scale_perf_30k_proxies
          - name: 30k proxy scale (PostgreSQL)
            backend: postgres-scale
            test: functional::functional_scale_perf_test::test_scale_perf_30k_proxies_postgres
          - name: 30k proxy scale (MongoDB)
            backend: mongodb
            test: functional::functional_scale_perf_test::test_scale_perf_30k_proxies_mongodb
          - name: 10k proxy load stress (PostgreSQL)
            backend: postgres-load
            test: functional::functional_load_stress_test::test_load_stress_10k_proxies

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Verify workflow contract (static)
        run: |
          python3 -I .github/scripts/verify_scaling_regression_workflow.py --self-test
          python3 -I .github/scripts/verify_scaling_regression_workflow.py
          python3 -I .github/scripts/publish_scaling_gate_signal.py --self-test

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-scaling-regression"

      - name: Install PostgreSQL client
        if: matrix.backend == 'postgres-scale'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install wrk
        if: matrix.backend == 'postgres-load'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wrk

      - name: Start scale-test PostgreSQL
        if: matrix.backend == 'postgres-scale'
        run: |
          set -euo pipefail
          docker run -d --name ferrum-scale-test-pg \
            -e POSTGRES_USER=ferrum \
            -e POSTGRES_PASSWORD=ferrum-scale-test \
            -e POSTGRES_DB=ferrum_scale \
            -p 25432:5432 \
            postgres:16

          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 30); do
            if docker exec ferrum-scale-test-pg pg_isready -U ferrum 2>/dev/null; then
              echo "PostgreSQL container ready"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::PostgreSQL did not become ready in 30 seconds"
              exit 1
            fi
            sleep 1
          done

      - name: Start scale-test MongoDB
        if: matrix.backend == 'mongodb'
        # Single-node replica set, not standalone: the scale test provisions
        # resources through POST /batch, which is all-or-nothing (issue #2401)
        # and therefore needs MongoDB multi-document transactions. A standalone
        # mongod refuses the batch with 501 rather than applying part of a graph.
        run: |
          set -euo pipefail
          # `--network host` with a real port: a replica-set member advertises
          # its own host:port and the driver reconnects to whatever is
          # advertised, so a `-p` mapping would point the driver at the wrong
          # port.
          docker run -d --name ferrum-scale-test-mongo --network host \
            mongo:7 --replSet rs0 --port 27117 --bind_ip_all

          echo "Waiting for MongoDB to be ready..."
          for i in $(seq 1 30); do
            if docker exec ferrum-scale-test-mongo \
              mongosh --quiet --port 27117 --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; then
              echo "MongoDB container ready"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::MongoDB did not become ready in 30 seconds"
              exit 1
            fi
            sleep 1
          done

          docker exec ferrum-scale-test-mongo mongosh --quiet --port 27117 --eval \
            'try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27117"}]}) }'
          echo "Waiting for the replica set primary..."
          for i in $(seq 1 60); do
            if docker exec ferrum-scale-test-mongo mongosh --quiet --port 27117 --eval \
              'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              echo "Replica set primary ready"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::MongoDB replica set did not elect a primary"
              docker logs ferrum-scale-test-mongo
              exit 1
            fi
            sleep 1
          done
          echo "FERRUM_MONGO_REPLICA_SET=rs0" >> "$GITHUB_ENV"

      - name: Start load-test PostgreSQL
        if: matrix.backend == 'postgres-load'
        run: |
          set -euo pipefail
          docker run -d --name ferrum-load-test-pg \
            -e POSTGRES_USER=ferrum \
            -e POSTGRES_PASSWORD=ferrum-load-test \
            -e POSTGRES_DB=ferrum_load \
            -p 25433:5432 \
            postgres:16

          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 30); do
            if docker exec ferrum-load-test-pg pg_isready -U ferrum 2>/dev/null; then
              echo "PostgreSQL container ready"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::PostgreSQL did not become ready in 30 seconds"
              exit 1
            fi
            sleep 1
          done

      # Both suites select target/release/ferrum-edge when it is present. The
      # load-stress test also invokes this build internally; prebuilding makes
      # that second invocation a fast fingerprint check.
      - name: Build release gateway binary
        run: cargo build --release --bin ferrum-edge

      - name: Run scheduled scaling regression
        run: |
          set -euo pipefail
          cargo test --test functional_tests -- \
            --ignored \
            --exact "${{ matrix.test }}" \
            --nocapture 2>&1 | tee scaling-regression.log
        env:
          RUST_BACKTRACE: 1

      - name: Summarize scaling regression
        if: always()
        run: |
          {
            echo "## ${{ matrix.name }}"
            echo ""
            echo "- Test: \`${{ matrix.test }}\`"
            echo "- Backend: \`${{ matrix.backend }}\`"
            echo "- Job status: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scaling regression log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scaling-regression-${{ matrix.backend }}-${{ github.sha }}
          path: scaling-regression.log
          retention-days: 30
          if-no-files-found: ignore

  scaling-gate-signal:
    name: Scaling gate signal
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: [scaling-regression]
    if: always()
    concurrency:
      group: scaling-gate-publisher
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Publish scaling gate signal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCALING_JOB_RESULT: ${{ needs.scaling-regression.result }}
        run: |
          python3 -I .github/scripts/publish_scaling_gate_signal.py --self-test
          python3 -I .github/scripts/publish_scaling_gate_signal.py
