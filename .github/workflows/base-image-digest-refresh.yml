# Refreshes the `@sha256:` digests pinning Ferrum's container build inputs.
#
# `verify_ci_runtime_cache.py` (`check_dockerfile_image_pins`) requires every
# `FROM` and `ARG` image reference in the four Dockerfiles to carry an immutable
# digest. A pin that nothing refreshes ages silently: base-image CVE fixes never
# arrive. The separately frozen Cross inventory job below reports drift for
# trusted-policy rotation; it never rewrites the admitted Cross pin. Dependabot's
# docker ecosystem reads `FROM` lines only, so the
# `ARG <NAME>=<image>:<tag>@sha256:...` defaults — which is every input of
# `Dockerfile.ebpf-tools-layer` and both runtime bases of `Dockerfile` — need
# this job.
#
# The rewrite is digest-preserving by construction: it resolves the digest the
# reference's own tag points at today and substitutes it. It never removes a
# digest, never changes an image or tag, and opens an ordinary pull request that
# the full required CI (multi-arch build, FIPS, eBPF, ABI scan, chart smoke)
# gates like any other change.
#
# Every tracked file that pins a drifted reference is rewritten together, so
# the distroless runtime base also moves in `ci.yml`'s `main-linux-image` job and
# `tests/performance/multi_protocol/h3_proof/Dockerfile.live`. The trusted
# Cross policy admits that one protected-job change only when the new digest is
# the one the registry serves for the same tag when the policy runs, and
# `verify_ci_runtime_cache.py` still requires every distroless reference to
# match `Dockerfile`. The two trusted policy files are never rewritten.
#
# `refresh` resolves, rewrites and runs the repository verifier on a runner
# that never holds a write credential. `open` repeats the same rotation with
# this frozen shell alone, proceeds only if it is identical to the verified
# one, and pushes and opens the pull request with `BASE_IMAGE_REFRESH_TOKEN` (a
# fine-grained personal access token; see docs/ci_cd.md) so its CI runs: events
# from `GITHUB_TOKEN` start no workflows, and only a token with workflow-write
# access may change `ci.yml`. `merge` waits for every context in
# `.github/required-publication-checks.json` to succeed on the exact head, with
# no other check failing or pending, and merges that head with a merge commit.
# The trusted Cross policy freezes these three jobs and this workflow's
# top-level shape by SHA-256 and confines the token to them, so neither the
# rotation nor the merge gate can change in an ordinary pull request.
name: Base Image Digest Refresh

on:
  schedule:
    # Mondays 05:00 UTC, ahead of the weekly Dependabot run.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  # Every write uses BASE_IMAGE_REFRESH_TOKEN; GITHUB_TOKEN only reads.
  contents: read

concurrency:
  group: base-image-digest-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Resolve and verify current base image digests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # One inventory for resolution and staging, including the live image layer.
      DOCKERFILES: "Dockerfile Dockerfile.release Dockerfile.test Dockerfile.ebpf-tools-layer Dockerfile.iproute2-layer"
    outputs:
      rotations: ${{ steps.resolve.outputs.rotations }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Resolve current digests
        id: resolve
        run: |
          set -euo pipefail
          rotations=""
          # Every pinned reference in the governed Dockerfiles, deduplicated.
          refs="$(grep -hoE '[A-Za-z0-9][A-Za-z0-9./_-]*:[A-Za-z0-9][A-Za-z0-9._-]*@sha256:[0-9a-f]{64}' \
            ${DOCKERFILES} | sort -u)"
          if [ -z "${refs}" ]; then
            echo "::error::no digest-pinned image references found; the refresh must fail closed"
            exit 1
          fi
          for ref in ${refs}; do
            tagged="${ref%@*}"
            current="${ref##*@}"
            resolved="$(docker buildx imagetools inspect "${tagged}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [[ ! "${resolved}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::could not resolve a manifest digest for ${tagged} (got '${resolved}')"
              exit 1
            fi
            if [ "${resolved}" = "${current}" ]; then
              echo "up to date: ${tagged} -> ${resolved}"
              continue
            fi
            # Every tracked Dockerfile and YAML consumer of the old reference
            # moves together; prose and history (CHANGELOG, docs) keep theirs.
            consumers=""
            for file in $(git grep -lF "${tagged}@${current}"); do
              case "${file}" in
                .github/scripts/verify_cross_build_policy.py|.github/workflows/cross-build-policy.yml)
                  echo "::error::${file} pins ${tagged}@${current}; trusted policy files are never rewritten by the refresh"
                  exit 1
                  ;;
                *Dockerfile*|*.yml|*.yaml)
                  consumers="${consumers}${file} "
                  ;;
                *)
                  echo "not rewritten (not a Dockerfile or YAML consumer): ${file}"
                  ;;
              esac
            done
            echo "refresh: ${tagged} ${current} -> ${resolved} in ${consumers}"
            for file in ${consumers}; do
              sed -i "s|${tagged}@${current}|${tagged}@${resolved}|g" "${file}"
            done
            rotations="${rotations}${tagged} ${current} ${resolved} ${consumers% }\n"
          done
          {
            echo "rotations<<ROTATIONS_EOF"
            printf '%b' "${rotations}"
            echo "ROTATIONS_EOF"
          } >> "${GITHUB_OUTPUT}"

      # Repository code runs only here, on a runner that never holds the
      # refresh token. The `open` job repeats the rotation itself and proceeds
      # only when it is identical to the one verified here.
      - name: Verify the pin contract still holds
        if: steps.resolve.outputs.rotations != ''
        run: python3 .github/scripts/verify_ci_runtime_cache.py

  open:
    name: Open the refresh pull request
    needs: refresh
    if: needs.refresh.outputs.rotations != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      DOCKERFILES: "Dockerfile Dockerfile.release Dockerfile.test Dockerfile.ebpf-tools-layer Dockerfile.iproute2-layer"
    outputs:
      pr: ${{ steps.open.outputs.pr }}
      head: ${{ steps.open.outputs.head }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # No repository code runs in this job: only this frozen shell, git,
      # docker and gh touch the checkout before the token is used.
      - name: Repeat the verified rotation
        id: rotate
        env:
          VERIFIED_ROTATIONS: ${{ needs.refresh.outputs.rotations }}
        run: |
          set -euo pipefail
          rotations=""
          # Every pinned reference in the governed Dockerfiles, deduplicated.
          refs="$(grep -hoE '[A-Za-z0-9][A-Za-z0-9./_-]*:[A-Za-z0-9][A-Za-z0-9._-]*@sha256:[0-9a-f]{64}' \
            ${DOCKERFILES} | sort -u)"
          if [ -z "${refs}" ]; then
            echo "::error::no digest-pinned image references found; the refresh must fail closed"
            exit 1
          fi
          for ref in ${refs}; do
            tagged="${ref%@*}"
            current="${ref##*@}"
            resolved="$(docker buildx imagetools inspect "${tagged}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [[ ! "${resolved}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::could not resolve a manifest digest for ${tagged} (got '${resolved}')"
              exit 1
            fi
            if [ "${resolved}" = "${current}" ]; then
              echo "up to date: ${tagged} -> ${resolved}"
              continue
            fi
            # Every tracked Dockerfile and YAML consumer of the old reference
            # moves together; prose and history (CHANGELOG, docs) keep theirs.
            consumers=""
            for file in $(git grep -lF "${tagged}@${current}"); do
              case "${file}" in
                .github/scripts/verify_cross_build_policy.py|.github/workflows/cross-build-policy.yml)
                  echo "::error::${file} pins ${tagged}@${current}; trusted policy files are never rewritten by the refresh"
                  exit 1
                  ;;
                *Dockerfile*|*.yml|*.yaml)
                  consumers="${consumers}${file} "
                  ;;
                *)
                  echo "not rewritten (not a Dockerfile or YAML consumer): ${file}"
                  ;;
              esac
            done
            echo "refresh: ${tagged} ${current} -> ${resolved} in ${consumers}"
            for file in ${consumers}; do
              sed -i "s|${tagged}@${current}|${tagged}@${resolved}|g" "${file}"
            done
            rotations="${rotations}${tagged} ${current} ${resolved} ${consumers% }\n"
          done
          if [ "$(printf '%b' "${rotations}")" != "$(printf '%s' "${VERIFIED_ROTATIONS}")" ]; then
            echo "::error::the registry or tree changed since verification; not opening a pull request"
            exit 1
          fi
          {
            echo "body<<PR_BODY_EOF"
            echo "## Summary"
            echo
            echo "Automated refresh of the digest pins on Ferrum's container build inputs."
            echo "Each reference keeps its image and tag; only the digest its tag currently"
            echo "resolves to changed, in every Dockerfile and YAML file that pinned it."
            echo
            echo "## Changes"
            echo
            printf '%b' "${rotations}" | while read -r tagged current resolved consumers; do
              echo "- \`${tagged}\`: \`${current}\` -> \`${resolved}\` (${consumers})"
            done
            echo
            echo "## Test plan"
            echo
            echo "Normal required CI on this pull request: multi-arch image build, FIPS,"
            echo "eBPF, the GNU ABI scan, and the Helm chart smoke. A distroless digest"
            echo "change is admitted by the trusted Cross policy only if it equals the"
            echo "digest the registry serves for the tag when the policy runs."
            echo
            echo "The refresh workflow merges this pull request itself once every"
            echo "required check succeeds on its exact head."
            echo
            echo "Refs #4444"
            echo "PR_BODY_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Open or update the refresh pull request
        id: open
        env:
          GH_TOKEN: ${{ secrets.BASE_IMAGE_REFRESH_TOKEN }}
          PR_BODY: ${{ steps.rotate.outputs.body }}
          BRANCH: deps/base-image-digests
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::configure the BASE_IMAGE_REFRESH_TOKEN secret (contents, pull requests and workflows write) so the refresh pull request runs CI and can change ci.yml"
            exit 1
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add --update
          git commit --no-verify -m "deps: refresh container base image digests"
          git push --no-verify --force origin "${BRANCH}"
          if [ -n "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "${BRANCH}" --body "${PR_BODY}"
          else
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "deps: refresh container base image digests" \
              --body "${PR_BODY}" \
              --label dependencies
          fi
          echo "pr=$(gh pr view "${BRANCH}" --json number --jq .number)" >> "${GITHUB_OUTPUT}"
          echo "head=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  merge:
    name: Merge the refresh pull request after required CI
    needs: open
    if: needs.open.outputs.pr != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Wait for required checks on the exact head, then merge
        env:
          GH_TOKEN: ${{ secrets.BASE_IMAGE_REFRESH_TOKEN }}
          PR: ${{ needs.open.outputs.pr }}
          HEAD_SHA: ${{ needs.open.outputs.head }}
        run: |
          set -euo pipefail
          # The merging token may be able to bypass branch protection, so this
          # job enforces the gate itself instead of trusting a merge to be refused.
          required="$(jq -r '.required_checks[].context' .github/required-publication-checks.json)"
          if [ -z "${required}" ]; then
            echo "::error::the required-check inventory is empty; refusing to merge"
            exit 1
          fi
          while :; do
            head="$(gh pr view "${PR}" --json headRefOid,state --jq '.state + " " + .headRefOid')"
            if [ "${head}" != "OPEN ${HEAD_SHA}" ]; then
              echo "::error::refresh pull request #${PR} is no longer open at ${HEAD_SHA} (${head}); not merging"
              exit 1
            fi
            checks="$(gh pr checks "${PR}" --json name,bucket || true)"
            if [ -z "${checks}" ]; then
              sleep 60
              continue
            fi
            failed="$(jq -r '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")' <<<"${checks}")"
            if [ -n "${failed}" ]; then
              echo "::error::refresh pull request #${PR} has failing checks: ${failed}; not merging"
              exit 1
            fi
            pending="$(jq '[.[] | select(.bucket == "pending")] | length' <<<"${checks}")"
            missing=""
            while IFS= read -r context; do
              # Only SUCCESS satisfies a required context; skipped or neutral never does.
              if ! jq -e --arg c "${context}" 'any(.[]; .name == $c and .bucket == "pass")' <<<"${checks}" >/dev/null; then
                missing="${missing}[${context}]"
              fi
            done <<<"${required}"
            if [ "${pending}" -eq 0 ] && [ -z "${missing}" ]; then
              break
            fi
            sleep 60
          done
          # A merge commit keeps the PR head as the second parent, which the
          # publication gate uses to bind a main commit to its reviewed head.
          gh pr merge "${PR}" --merge --match-head-commit "${HEAD_SHA}"
          echo "Merged refresh pull request #${PR} at ${HEAD_SHA}" >> "${GITHUB_STEP_SUMMARY}"

  cross-image-drift:
    name: Inspect the admitted Cross image pin
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # Production build-input inventory: refresh by trusted policy rotation only.
      CROSS_IMAGE_PIN: ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5@sha256:7f8308a8734d9fcd2ebbe9a3e4bdea74af293f0799d80c3cc341e340cda49a4c
    steps:
      - name: Resolve Cross 0.2.5 without changing the admitted pin
        run: |
          set -euo pipefail
          tagged="${CROSS_IMAGE_PIN%@*}"
          admitted="${CROSS_IMAGE_PIN##*@}"
          resolved="$(docker buildx imagetools inspect "$tagged" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$resolved" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Cross registry did not return a complete OCI digest"
            exit 1
          fi
          {
            echo '### Production Cross image inventory'
            echo "Tag: $tagged"
            echo "Admitted OCI index: $admitted"
            echo "Published OCI index: $resolved"
            echo 'Host platform: linux/amd64; target: aarch64-unknown-linux-gnu'
            echo 'A changed index requires independent platform/input review and trusted-base policy admission.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$resolved" != "$admitted" ]; then
            echo "::error::Cross tag drift: prepare a reviewed trusted-policy rotation; do not remove or auto-replace the pin"
            exit 1
          fi
