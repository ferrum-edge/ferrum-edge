# Refreshes the `@sha256:` digests pinning Ferrum's container build inputs.
#
# `verify_ci_runtime_cache.py` (`check_dockerfile_image_pins`) requires every
# `FROM` and `ARG` image reference in the four Dockerfiles to carry an immutable
# digest. A pin that nothing refreshes ages silently: base-image CVE fixes never
# arrive. The separately frozen Cross inventory job below reports drift for
# trusted-policy rotation; it never rewrites the admitted Cross pin. Dependabot's
# docker ecosystem reads `FROM` lines only, so the
# `ARG <NAME>=<image>:<tag>@sha256:...` defaults — which is every input of
# `Dockerfile.ebpf-tools-layer` and both runtime bases of `Dockerfile` — need
# this job.
#
# The rewrite is digest-preserving by construction: it resolves the digest the
# reference's own tag points at today and substitutes it. It never removes a
# digest, never changes an image or tag, and opens an ordinary pull request that
# the required PR checks gate like any other change. It also moves the
# `# Digest resolved YYYY-MM-DD` comment governing each rewritten pin to the
# run's UTC date.
#
# Every tracked non-workflow file that pins a drifted reference is rewritten
# together, so the distroless runtime base also moves in
# `tests/performance/multi_protocol/h3_proof/Dockerfile.live`; `ci.yml`'s
# `main-linux-image` job reads it from `Dockerfile`, so no workflow file pins it.
# The job runs with its own `GITHUB_TOKEN` only (no stored credential), which
# cannot change workflow files: a drifted reference pinned in a workflow fails
# the run instead. A pull request opened by `GITHUB_TOKEN` does not start its
# required CI on its own: `pull_request` runs, if created, wait for maintainer
# approval, and the `pull_request_target` trusted policy never starts, so
# approving them is not enough. A maintainer closes and reopens the refresh PR
# (or pushes a commit to it, for example by merging `main`) to run every
# required check, reviews it, and merges it.
name: Base Image Digest Refresh

on:
  schedule:
    # Mondays 05:00 UTC, ahead of the weekly Dependabot run.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: base-image-digest-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Resolve and propose current base image digests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # One inventory for resolution and staging, including the live image layer.
      DOCKERFILES: "Dockerfile Dockerfile.release Dockerfile.test Dockerfile.ebpf-tools-layer Dockerfile.iproute2-layer"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: true

      - name: Resolve current digests
        id: resolve
        run: |
          set -euo pipefail
          changed=""
          # Every pinned reference in the governed Dockerfiles, deduplicated.
          refs="$(grep -hoE '[A-Za-z0-9][A-Za-z0-9./_-]*:[A-Za-z0-9][A-Za-z0-9._-]*@sha256:[0-9a-f]{64}' \
            ${DOCKERFILES} | sort -u)"
          if [ -z "${refs}" ]; then
            echo "::error::no digest-pinned image references found; the refresh must fail closed"
            exit 1
          fi
          for ref in ${refs}; do
            tagged="${ref%@*}"
            current="${ref##*@}"
            resolved="$(docker buildx imagetools inspect "${tagged}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')"
            case "${resolved}" in
              sha256:[0-9a-f][0-9a-f]*) ;;
              *)
                echo "::error::could not resolve a manifest digest for ${tagged} (got '${resolved}')"
                exit 1
                ;;
            esac
            if [ "${resolved}" = "${current}" ]; then
              echo "up to date: ${tagged} -> ${resolved}"
              continue
            fi
            # Every tracked consumer of the old reference moves together;
            # prose and history (CHANGELOG, docs) keep theirs.
            consumers=""
            for file in $(git grep -lF "${tagged}@${current}"); do
              case "${file}" in
                .github/workflows/*|.github/scripts/verify_cross_build_policy.py)
                  echo "::error::${file} pins ${tagged}@${current}; the refresh cannot rewrite workflow or trusted policy files, so move that pin into a Dockerfile it reads"
                  exit 1
                  ;;
                *Dockerfile*|*.yml|*.yaml)
                  consumers="${consumers}${file} "
                  ;;
                *)
                  echo "not rewritten (not a Dockerfile or YAML consumer): ${file}"
                  ;;
              esac
            done
            echo "refresh: ${tagged} ${current} -> ${resolved} in ${consumers}"
            for file in ${consumers}; do
              sed -i "s|${tagged}@${current}|${tagged}@${resolved}|g" "${file}"
            done
            # The resolution date lives on the comment above a block of pins:
            # for each rewritten line, walk up over adjacent FROM/ARG pin lines
            # and move a `# Digest resolved YYYY-MM-DD` comment to today.
            for file in ${consumers}; do
              awk -v ref="${tagged}@${resolved}" -v today="$(date -u +%F)" '
                { line[NR] = $0 }
                END {
                  date = "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]"
                  for (i = 1; i <= NR; i++) {
                    if (index(line[i], ref) == 0) continue
                    j = i - 1
                    while (j >= 1 && line[j] ~ /^[[:space:]]*(FROM|ARG)[[:space:]]/) j--
                    if (j >= 1 && line[j] ~ ("^[[:space:]]*# Digest resolved " date)) {
                      sub(date, today, line[j])
                    }
                  }
                  for (i = 1; i <= NR; i++) print line[i]
                }' "${file}" > "${file}.resolved"
              cat "${file}.resolved" > "${file}"
              rm -f "${file}.resolved"
            done
            changed="${changed}- \`${tagged}\`: \`${current}\` -> \`${resolved}\` (${consumers% })\n"
          done
          if [ -z "${changed}" ]; then
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "updated=true" >> "${GITHUB_OUTPUT}"
          {
            echo "body<<PR_BODY_EOF"
            echo "## Summary"
            echo
            echo "Automated refresh of the digest pins on Ferrum's container build inputs."
            echo "Each reference keeps its image and tag; only the digest its tag currently"
            echo "resolves to changed."
            echo
            echo "## Changes"
            echo
            printf '%b' "${changed}"
            echo
            echo "## Test plan"
            echo
            echo "The ordinary required PR checks, selected by the changed paths. For"
            echo "Dockerfile changes that includes the amd64 production Dockerfile smoke"
            echo "build. Multi-architecture image builds, FIPS and the GNU ABI scan are"
            echo "not guaranteed to run on this pull request: check which checks actually"
            echo "ran before merging, and rely on main and release qualification for the"
            echo "rest."
            echo
            echo "This pull request was opened with the workflow's GITHUB_TOKEN, so its"
            echo "required CI does not start on its own: any pull_request runs wait for"
            echo "approval and the Trusted Cross Build Policy never starts. Close and"
            echo "reopen it (or merge main into it) to run every required check, verify"
            echo "each digest against its registry, then merge."
            echo
            echo "Refs #4444"
            echo "PR_BODY_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify the pin contract still holds
        if: steps.resolve.outputs.updated == 'true'
        run: python3 .github/scripts/verify_ci_runtime_cache.py

      - name: Open or update the refresh pull request
        if: steps.resolve.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ steps.resolve.outputs.body }}
          BRANCH: deps/base-image-digests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add --update
          git commit -m "deps: refresh container base image digests"
          git push --force origin "${BRANCH}"
          if [ -n "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "${BRANCH}" --body "${PR_BODY}"
          else
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "deps: refresh container base image digests" \
              --body "${PR_BODY}" \
              --label dependencies
          fi

  cross-image-drift:
    name: Inspect the admitted Cross image pin
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # Production build-input inventory: refresh by trusted policy rotation only.
      CROSS_IMAGE_PIN: ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5@sha256:7f8308a8734d9fcd2ebbe9a3e4bdea74af293f0799d80c3cc341e340cda49a4c
    steps:
      - name: Resolve Cross 0.2.5 without changing the admitted pin
        run: |
          set -euo pipefail
          tagged="${CROSS_IMAGE_PIN%@*}"
          admitted="${CROSS_IMAGE_PIN##*@}"
          resolved="$(docker buildx imagetools inspect "$tagged" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$resolved" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Cross registry did not return a complete OCI digest"
            exit 1
          fi
          {
            echo '### Production Cross image inventory'
            echo "Tag: $tagged"
            echo "Admitted OCI index: $admitted"
            echo "Published OCI index: $resolved"
            echo 'Host platform: linux/amd64; target: aarch64-unknown-linux-gnu'
            echo 'A changed index requires independent platform/input review and trusted-base policy admission.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$resolved" != "$admitted" ]; then
            echo "::error::Cross tag drift: prepare a reviewed trusted-policy rotation; do not remove or auto-replace the pin"
            exit 1
          fi
