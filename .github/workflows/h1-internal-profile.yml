name: H1 Internal Profile

on:
  # Observer-feature contracts are optional (not required, not release
  # gating). A pull request runs them only when it edits the profiler itself.
  # The shared proxy/pool/runtime surfaces the observers hook into are
  # re-validated by a daily run on the main tip (one run instead of one per
  # merge, ~20 merges/day); a red run points at that day's merges for
  # revert/bisect before the next release cut.
  pull_request:
    paths:
      - src/h1_profile/**
      - tests/unit/gateway_core/h1_profile*
      - tests/functional/h1_cadence_tests.rs
      - tests/performance/multi_protocol/h1_*
      - docs/h1_internal_profile.md
      - .github/workflows/h1-internal-profile.yml
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      payloads:
        description: All sizes, or one budgeted subset (all five remain required)
        type: choice
        default: all
        options: [all, '10240', '71680', '512000', '1048576', '5242880']
      trace_mode:
        description: Separate intrusive trace campaign (requires diagnostic_only=false and one payload shard)
        type: choice
        default: none
        options: [none, syscalls, cpu]
      diagnostic_only:
        description: Stop after the single-pass 5 MiB H1 drain diagnostic
        type: boolean
        default: true

permissions:
  contents: read

env:
  RUSTC_WRAPPER: ""
  CARGO_BUILD_RUSTC_WRAPPER: ""
  RUSTFLAGS: ""

# A newer push to the same pull request cancels the superseded run. Every
# other event (push to main, dispatch, schedule) gets a unique group so it
# always runs to completion and never displaces another dispatch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: H1 profile feature checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Hosted prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev libcurl4-openssl-dev clang
      - name: Formatting (hosted only)
        run: cargo fmt --all -- --check
      - name: H1 harness formatting, lint and cancellation/retirement regressions
        run: |
          cargo fmt --manifest-path tests/performance/multi_protocol/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path tests/performance/multi_protocol/Cargo.toml --lib --bin proto_bench --test metrics_tests -- -D warnings
          cargo test --locked --manifest-path tests/performance/multi_protocol/Cargo.toml --test metrics_tests h1_diagnostic_tests
      - name: Feature compile and lint (default builds do not cover observers)
        run: cargo clippy --locked --features bench-h1-profile --lib --bin ferrum-edge --test unit_gateway_core_tests -- -D warnings
      - name: Allocator publication seams
        run: cargo test --locked --features bench-h1-profile --lib h1_profile::store::tests
      - name: Feature observers and existing coalescer contracts
        run: |
          cargo test --locked --features bench-h1-profile --test unit_gateway_core_tests h1_profile_tests
          cargo test --locked --features bench-h1-profile --test unit_gateway_core_tests response_coalescing
      - name: Default observer-off coalescer contracts
        run: cargo test --locked --test unit_gateway_core_tests response_coalescing
      - name: Existing live streaming contracts with observers
        run: |
          cargo build --locked --features bench-h1-profile --bin ferrum-edge
          cargo test --locked --features bench-h1-profile --test functional_tests functional_streaming -- --ignored
      - name: H1 schema and retained-failure rules
        if: always()
        run: |
          python3 -m unittest discover --verbose --start-directory tests/performance/multi_protocol/tests --pattern 'test_h1_internal_profile.py'

  cadence:
    name: H1 live cadence (observer ${{ matrix.observer }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        observer: ['off', 'on']
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      H1_OBSERVER: ${{ matrix.observer }}
      FERRUM_SKIP_GATEWAY_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Hosted prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev libcurl4-openssl-dev clang
      - name: Compile, lint, and pin the external binary
        run: |
          set -euo pipefail
          mkdir -p h1-cadence-evidence
          flags=()
          if [ "$H1_OBSERVER" = on ]; then flags+=(--features bench-h1-profile); fi
          cargo clippy --locked "${flags[@]}" --bin ferrum-edge --test functional_tests -- -D warnings
          cargo build --locked "${flags[@]}" --bin ferrum-edge
          binary="$RUNNER_TEMP/ferrum-h1-cadence-$H1_OBSERVER"
          cp target/debug/ferrum-edge "$binary"
          printf 'FERRUM_EDGE_TEST_BIN=%s\n' "$binary" >> "$GITHUB_ENV"
          git rev-parse HEAD > h1-cadence-evidence/revision.txt
          sha256sum "$binary" > h1-cadence-evidence/binary.sha256
          printf 'observer=%s\nprofile=dev\ncutoffs=0,1\nhops=plain,verified-tls\n' "$H1_OBSERVER" \
            > h1-cadence-evidence/matrix.txt
      - name: Explicit H1 cadence and safety matrix
        run: |
          set -euo pipefail
          flags=()
          if [ "$H1_OBSERVER" = on ]; then flags+=(--features bench-h1-profile); fi
          cargo test --locked "${flags[@]}" --test functional_tests h1_cadence_tests:: \
            -- --ignored --nocapture 2>&1 | tee h1-cadence-evidence/cadence.log
      - name: Supported-protocol trailer gates for the shared coalescer
        run: |
          set -euo pipefail
          flags=()
          if [ "$H1_OBSERVER" = on ]; then flags+=(--features bench-h1-profile); fi
          for test in \
            functional::scripted_backend_h2_tests::h2_grpc_response_trailers_strip_hop_by_hop_names \
            functional::scripted_backend_h3_tests::h2c_frontend_h3_backend_streaming_trailers_obey_response_header_policy \
            functional::scripted_backend_h3_tests::h2c_frontend_h3_backend_forwards_trailers_when_fin_is_delayed_past_timeout; do
            cargo test --locked "${flags[@]}" --test functional_tests "$test" \
              -- --ignored --exact --nocapture 2>&1 | tee -a h1-cadence-evidence/trailers.log
          done
      - name: Retain cadence identity and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: h1-cadence-${{ matrix.observer }}-${{ github.sha }}
          path: h1-cadence-evidence/
          retention-days: 14

  trace-fixtures:
    name: H1 syscall and CPU capability fixtures (hosted only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install Ubuntu observer and software sampling tools
        run: |
          sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 libbpf-dev libelf-dev \
            zlib1g-dev gcc libc6-dev binutils util-linux linux-tools-generic linux-tools-common python3-yaml
      - name: Compile and lint shared observer and optimized DWARF fixture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h1-trace/build"
          clang-18 -target bpf -D__TARGET_ARCH_x86 -O2 -g -Wall -Werror \
            -I/usr/include/x86_64-linux-gnu -c tests/performance/multi_protocol/h3_proof/observer.bpf.c \
            -o "$RUNNER_TEMP/h1-trace/build/observer.bpf.o"
          cc -std=gnu11 -O2 -g -Wall -Wextra -Werror tests/performance/multi_protocol/h3_proof/observer.c \
            -lbpf -lelf -lz -o "$RUNNER_TEMP/h1-trace/build/observer"
          cc -std=gnu11 -O2 -g -fomit-frame-pointer -fasynchronous-unwind-tables -Wall -Wextra -Werror \
            tests/performance/multi_protocol/h1_trace_fixture.c -pthread -o "$RUNNER_TEMP/h1-trace/build/h1_trace_fixture"
          bash -n tests/performance/multi_protocol/h1_trace_commands.sh
          bash -n tests/performance/multi_protocol/run_gateway_protocol_bench.sh
          python3 -m py_compile tests/performance/multi_protocol/h1_trace*.py
          python3 -m unittest discover -v -s tests/performance/multi_protocol/tests -p 'test_h1_trace.py'
      - name: Verify root-owned raw artifact handoff to the ordinary runner
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            python3 -m unittest discover -v -s tests/performance/multi_protocol/tests \
            -p 'test_h1_trace.py' -k H1ArtifactOwnershipTests
      - name: Stage owned binaries and run actual fixtures and negative cases
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH \
            python3 tests/performance/multi_protocol/h1_trace.py stage --build "$RUNNER_TEMP/h1-trace/build"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,ImageOS,ImageVersion \
            python3 tests/performance/multi_protocol/h1_trace.py preflight --output "$RUNNER_TEMP/h1-trace"
      - name: Prepare fixture artifacts even after producer failure
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/h1-trace" ]; then
            sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
              python3 tests/performance/multi_protocol/h1_trace.py prepare-artifacts --output "$RUNNER_TEMP/h1-trace"
          fi
      - name: Retain failed and unsupported fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: h1-trace-fixtures-${{ github.sha }}
          path: ${{ runner.temp }}/h1-trace/
          retention-days: 14

  measurement:
    name: Hosted H1 calibration then cutoff observations
    if: github.event_name == 'workflow_dispatch'
    needs: [checks, cadence, trace-fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Validate explicit trace campaign selection
        env:
          TRACE_MODE: ${{ inputs.trace_mode }}
          PAYLOADS: ${{ inputs.payloads }}
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
        run: |
          if [ "$TRACE_MODE" != none ] && [ "$DIAGNOSTIC_ONLY" != true ]; then
            test "$PAYLOADS" != all
          fi
      - name: Hosted prerequisites and memory headroom
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev libcurl4-openssl-dev clang lsof binutils clang-18 llvm-18 libbpf-dev libelf-dev zlib1g-dev linux-tools-generic linux-tools-common
          sudo fallocate -l 12G /mnt/h1-profile-swap
          sudo chmod 600 /mnt/h1-profile-swap
          sudo mkswap /mnt/h1-profile-swap
          sudo swapon /mnt/h1-profile-swap
      - name: Retain source, build and runner identity
        run: |
          mkdir -p h1-profile-evidence/builds
          git rev-parse HEAD > h1-profile-evidence/revision.txt
          git status --porcelain > h1-profile-evidence/source-status.txt
          git archive HEAD | sha256sum > h1-profile-evidence/source-tree.sha256
          cp Cargo.lock Cargo.toml h1-profile-evidence/builds/
          cp tests/performance/multi_protocol/Cargo.lock h1-profile-evidence/builds/harness-Cargo.lock
          cp .cargo/config.toml h1-profile-evidence/builds/cargo-config.toml
          rustc -Vv > h1-profile-evidence/builds/rustc.txt
          cargo -V > h1-profile-evidence/builds/cargo.txt
          uname -a > h1-profile-evidence/kernel.txt
          lscpu > h1-profile-evidence/cpu.txt
          free -k > h1-profile-evidence/memory.txt
          cat /proc/sys/kernel/random/boot_id > h1-profile-evidence/boot-id.txt
      - name: Build identical-revision symbolized observer twins
        env:
          CARGO_PROFILE_RELEASE_DEBUG: '1'
          CARGO_PROFILE_RELEASE_STRIP: 'none'
        run: |
          set -euo pipefail
          mkdir -p bin/amd64
          for observer in off on; do
            flags=()
            if [ "$observer" = on ]; then flags+=(--features bench-h1-profile); fi
            directory="h1-profile-evidence/builds/$observer"
            mkdir -p "$directory"
            printf '%s\n' "observer=$observer" 'profile=release' 'debug=1' 'strip=none' \
              'default_features=crypto-ring' 'lto=fat' 'codegen_units=1' 'opt_level=3' \
              'panic=abort' 'RUSTFLAGS=' > "$directory/flags.txt"
            cargo build --locked --release --bin ferrum-edge --bin ferrum-cni "${flags[@]}" \
              2>&1 | tee "$directory/build.log"
            cp target/release/ferrum-edge target/release/ferrum-cni bin/amd64/
            sha256sum bin/amd64/* > "$directory/binaries.sha256"
            readelf -n bin/amd64/ferrum-edge > "$directory/build-id.txt"
            cp bin/amd64/ferrum-edge "$directory/ferrum-edge"
            readelf -S bin/amd64/ferrum-edge > "$directory/elf-sections.txt"
            objcopy --only-keep-debug bin/amd64/ferrum-edge "$directory/ferrum-edge.debug"
            docker build -f Dockerfile.release --build-arg TARGETARCH=amd64 \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "ferrum.h1-profile=$observer" -t "ferrum-h1:$observer" . \
              2>&1 | tee "$directory/image-build.log"
            docker image inspect "ferrum-h1:$observer" > "$directory/image.json"
          done
      - name: Build common harness
        run: cargo build --locked --release --manifest-path tests/performance/multi_protocol/Cargo.toml
      - name: Single-pass H1 drain diagnostic before full profiles
        id: diagnostic
        continue-on-error: true
        run: |
          set -euo pipefail
          FERRUM_IMAGE=ferrum-h1:off bash tests/performance/multi_protocol/run_gateway_protocol_bench.sh \
            http1-tls --h1-profile diagnostic --gateways ferrum --skip-build \
            --duration 30 --concurrency 200 --pairs 1 --payload-sizes 5242880 \
            --wallclock-budget-seconds 900 --output-dir h1-profile-evidence/diagnostic \
            2>&1 | tee h1-profile-evidence/diagnostic-run.log
      - name: Calibrate overhead at identical revision and configuration
        id: calibration
        if: inputs.diagnostic_only != true && steps.diagnostic.outcome == 'success'
        continue-on-error: true
        env:
          H1_PAYLOAD_SELECTION: ${{ inputs.payloads }}
        run: |
          set -euo pipefail
          sizes="$H1_PAYLOAD_SELECTION"
          if [ "$sizes" = all ]; then sizes='10240 71680 512000 1048576 5242880'; fi
          FERRUM_IMAGE=ferrum-h1:on bash tests/performance/multi_protocol/run_gateway_protocol_bench.sh \
            http1-tls --h1-profile calibration --baseline-image ferrum-h1:off \
            --gateways ferrum --skip-build --duration 15 --concurrency 200 --pairs 4 \
            --payload-sizes "$sizes" --wallclock-budget-seconds 7200 \
            --output-dir h1-profile-evidence/calibration
      - name: Four counterbalanced cutoff pairs with repeated direct controls
        id: cutoff
        if: inputs.diagnostic_only != true && steps.diagnostic.outcome == 'success'
        continue-on-error: true
        env:
          H1_PAYLOAD_SELECTION: ${{ inputs.payloads }}
        run: |
          set -euo pipefail
          sizes="$H1_PAYLOAD_SELECTION"
          if [ "$sizes" = all ]; then sizes='10240 71680 512000 1048576 5242880'; fi
          FERRUM_IMAGE=ferrum-h1:on bash tests/performance/multi_protocol/run_gateway_protocol_bench.sh \
            http1-tls --h1-profile cutoff --gateways ferrum --skip-build \
            --duration 15 --concurrency 200 --pairs 4 --payload-sizes "$sizes" \
            --wallclock-budget-seconds 7200 --output-dir h1-profile-evidence/cutoff
      - name: Compile and stage the same shared observer for the selected trace lane
        if: inputs.diagnostic_only != true && inputs.trace_mode != 'none' && steps.diagnostic.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p h1-profile-evidence/trace-build
          clang-18 -target bpf -D__TARGET_ARCH_x86 -O2 -g -Wall -Werror \
            -I/usr/include/x86_64-linux-gnu -c tests/performance/multi_protocol/h3_proof/observer.bpf.c \
            -o h1-profile-evidence/trace-build/observer.bpf.o
          cc -std=gnu11 -O2 -g -Wall -Wextra -Werror tests/performance/multi_protocol/h3_proof/observer.c \
            -lbpf -lelf -lz -o h1-profile-evidence/trace-build/observer
          cc -std=gnu11 -O2 -g -fomit-frame-pointer -fasynchronous-unwind-tables -Wall -Wextra -Werror \
            tests/performance/multi_protocol/h1_trace_fixture.c -pthread -o h1-profile-evidence/trace-build/h1_trace_fixture
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH \
            python3 tests/performance/multi_protocol/h1_trace.py stage --build h1-profile-evidence/trace-build
      - name: Actual capability and attribution preflight on this measurement VM
        id: trace_preflight
        if: inputs.diagnostic_only != true && inputs.trace_mode != 'none' && steps.diagnostic.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p h1-profile-evidence/trace-preflight
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,ImageOS,ImageVersion \
            python3 tests/performance/multi_protocol/h1_trace.py preflight --output h1-profile-evidence/trace-preflight
      - name: Independently calibrate external observer and repeat cutoff comparison
        id: trace_campaign
        if: inputs.diagnostic_only != true && inputs.trace_mode != 'none' && steps.diagnostic.outcome == 'success' && steps.trace_preflight.outcome == 'success'
        continue-on-error: true
        env:
          TRACE_MODE: ${{ inputs.trace_mode }}
          PAYLOAD: ${{ inputs.payloads }}
        run: |
          set -euo pipefail
          status=0
          for campaign in trace-calibration cutoff; do
            baseline=()
            if [ "$campaign" = trace-calibration ]; then baseline=(--baseline-image ferrum-h1:on); fi
            FERRUM_IMAGE=ferrum-h1:on bash tests/performance/multi_protocol/run_gateway_protocol_bench.sh \
              http1-tls --h1-profile "$campaign" --h1-trace "$TRACE_MODE" \
              --h1-trace-builds "$PWD/h1-profile-evidence/builds" "${baseline[@]}" \
              --gateways ferrum --skip-build --duration 15 --concurrency 200 --pairs 4 \
              --payload-sizes "$PAYLOAD" --wallclock-budget-seconds 7200 \
              --output-dir "h1-profile-evidence/$TRACE_MODE-$campaign" || status=1
            python3 tests/performance/multi_protocol/h1_internal_profile.py report \
              "h1-profile-evidence/$TRACE_MODE-$campaign" "$campaign" || status=1
          done
          exit "$status"
      - name: Retain every failed observation and profile completeness
        if: always()
        env:
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
        run: |
          status=0
          python3 tests/performance/multi_protocol/h1_internal_profile.py report-diagnostic \
            h1-profile-evidence/diagnostic || status=1
          if [ "$DIAGNOSTIC_ONLY" = true ] || [ "$DIAGNOSTIC_OUTCOME" != success ]; then exit "$status"; fi
          for campaign in calibration cutoff; do
            python3 tests/performance/multi_protocol/h1_internal_profile.py report \
              "h1-profile-evidence/$campaign" "$campaign" || status=1
          done
          exit "$status"
      - name: Prepare only trace evidence trees after success or failure
        if: always()
        run: |
          status=0
          for directory in "$PWD/h1-profile-evidence/trace-preflight" \
            "$PWD"/h1-profile-evidence/{cpu,syscalls}-{trace-calibration,cutoff}/pairs/pair_{001,002,003,004}/traces \
            "$PWD"/h1-profile-evidence/builds/{off,on}/symfs; do
            if [ -d "$directory" ]; then
              sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
                python3 tests/performance/multi_protocol/h1_trace.py prepare-artifacts --output "$directory" || status=1
            fi
          done
          exit "$status"
      - name: Upload raw evidence, including incomplete campaigns
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: h1-internal-profile-${{ github.sha }}-${{ inputs.payloads }}
          path: h1-profile-evidence/
          retention-days: 14
      - name: Preserve runner failures in job conclusion
        if: always()
        env:
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
          CALIBRATION_OUTCOME: ${{ steps.calibration.outcome }}
          CUTOFF_OUTCOME: ${{ steps.cutoff.outcome }}
          TRACE_MODE: ${{ inputs.trace_mode }}
          TRACE_PREFLIGHT: ${{ steps.trace_preflight.outcome }}
          TRACE_CAMPAIGN: ${{ steps.trace_campaign.outcome }}
        run: |
          test "$DIAGNOSTIC_OUTCOME" = success
          if [ "$DIAGNOSTIC_ONLY" != true ]; then
            test "$CALIBRATION_OUTCOME" = success && test "$CUTOFF_OUTCOME" = success
            if [ "$TRACE_MODE" != none ]; then
              test "$TRACE_PREFLIGHT" = success && test "$TRACE_CAMPAIGN" = success
            fi
          fi
