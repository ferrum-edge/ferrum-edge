name: Istio Status CAS Live

# Hosted Kind/apiserver competing-writer proof for issue #3838.
# Thin launcher: checkout → Rust CI toolchain → pinned Kind/kubectl →
# checked-in CRD → ignored live test binary that drives Ferrum's real
# IstioStatusWriter. Stays outside ci.yml so the Cross-frozen Tests
# aggregate is untouched.
#
# `Istio Status CAS Live` is an OPTIONAL always-reporting aggregate: it is
# deliberately not branch-protection-required (.claude/rules/testing.md), and
# verify_required_ci.py asserts it stays out of REQUIRED_MERGE_GROUP_WORKFLOWS
# and DEDICATED_REQUIRED_CHECKS. The `changes` job below follows the same
# trusted-base relevance shape the required live suites use, with the
# suite/slug/display substitutions and a temporary #3908 bootstrap handshake
# until the classifier suite reaches `main`. It is not byte-frozen until a
# later trusted-policy change adds it to LIVE_SUITE_RELEVANCE_CONTRACTS; until
# then a pull request can still rewrite this job. Comments are written for the
# required case so the block can be frozen verbatim by that follow-up.

on:
  workflow_dispatch:
  # No workflow-level `paths:` filter (issue #3908): a `paths:` list lives in
  # the pull request's own checkout, so the same commit that breaks the Istio
  # status CAS writer could delete its trigger and skip this suite. Relevance
  # is decided by the trusted-base classifier in the `changes` job instead.
  pull_request:
  merge_group:
    types:
      - checks_requested
  # A queue entry is a COMBINED commit, and the main push is the first place a
  # queue-combined regression in these surfaces can surface at all.
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel a superseded PR/main run on rapid re-push. Merge-group runs are keyed
# by the synthesized head so a queue entry never cancels a pull-request run, and
# manual dispatches share one lane and run to completion.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('istio-status-cas-live-pr-{0}', github.event.pull_request.number) || (github.event_name == 'merge_group' && format('istio-status-cas-live-merge-group-{0}', github.event.merge_group.head_sha) || (github.event_name == 'push' && format('istio-status-cas-live-{0}', github.ref) || 'istio-status-cas-live-shared')) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

# The kind cluster name is spelled literally in each step below rather than
# through a workflow-level `env:`, so no step body depends on a rewritten
# context value.

jobs:
  changes:
    name: Istio status CAS trigger
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      # Relevance decides whether a REQUIRED live gate runs at all, so it must
      # never be computed by code the pull request supplies: a PR that widens
      # its own suite patterns could declare itself irrelevant, skip the live
      # job, and still turn the required check green.
      #
      # Everything below reads ONE immutable trusted commit. The base-branch
      # tip is fetched from the base repository, pinned once to a full object
      # id, checked to hold the filter as a regular blob, and then read BY
      # OBJECT ID rather than by path. A fork head, a rewritten head, or a push
      # to the base branch mid-run therefore cannot swap the script between
      # validation and execution, and every failure exits non-zero so the gate
      # fails closed instead of quietly declaring itself irrelevant.
      #
      # This block is frozen by .github/scripts/verify_cross_build_policy.py
      # (see live_suite_relevance_errors); it is byte-identical across every
      # live-suite workflow apart from the suite, slug, and display name.
      - name: Check for istio-status-cas changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          filter_path=.github/scripts/live_suite_path_filter.py
          changed_files="$RUNNER_TEMP/istio-status-cas-changed-files.txt"
          trusted_filter="$RUNNER_TEMP/istio-status-cas-trusted-filter.py"
          rm -f -- "$changed_files" "$trusted_filter"
          : > "$changed_files"

          filter_args=(--suite istio-status-cas --changed-files "$changed_files")

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # `github.base_ref` names a branch in the BASE repository, so a fork
            # cannot control its contents -- but it is still untrusted text.
            # Reject anything outside a conservative branch charset before it
            # reaches a refspec so no option, pathspec, or revision-syntax
            # metacharacter can be smuggled into a git invocation.
            if ! printf '%s' "$BASE_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$'; then
              echo "::error::refusing to resolve an unsafe base ref" >&2
              exit 1
            fi
            case "$BASE_REF" in
              *..*|*//*|*/|*.lock|*/.*)
                echo "::error::refusing to resolve an unsafe base ref" >&2
                exit 1
                ;;
            esac
            fetched=false
            for attempt in 1 2 3; do
              if git fetch --no-tags --no-recurse-submodules origin \
                "+refs/heads/${BASE_REF}:refs/ferrum/trusted-base"; then
                fetched=true
                break
              fi
              echo "git fetch of ${BASE_REF} failed (attempt ${attempt}/3); retrying" >&2
              sleep $(( attempt * 10 ))
            done
            if [ "$fetched" != true ]; then
              echo "::error::git fetch of ${BASE_REF} failed after 3 attempts" >&2
              exit 1
            fi
            # Pin the moving tip exactly once; nothing below re-resolves a ref.
            trusted_sha="$(git rev-parse --verify --quiet refs/ferrum/trusted-base^{commit} || true)"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # Merge queues synthesize a combined SHA. Use the event's base_sha
            # as the trusted filter source and the change-set base so a missing
            # pull_request payload cannot force-skip or check only main.
            if ! printf '%s' "$MERGE_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::merge_group base_sha missing or malformed" >&2
              exit 1
            fi
            if ! git cat-file -e "${MERGE_BASE_SHA}^{commit}" 2>/dev/null; then
              fetched=false
              for attempt in 1 2 3; do
                if git fetch --no-tags --no-recurse-submodules origin \
                  "${MERGE_BASE_SHA}"; then
                  fetched=true
                  break
                fi
                echo "git fetch of merge_group base failed (attempt ${attempt}/3); retrying" >&2
                sleep $(( attempt * 10 ))
              done
              if [ "$fetched" != true ]; then
                echo "::error::git fetch of merge_group base_sha failed after 3 attempts" >&2
                exit 1
              fi
            fi
            trusted_sha="$MERGE_BASE_SHA"
          else
            # A push to the default branch and a manual dispatch already run
            # trusted code, so the checked-out commit IS the trusted base.
            trusted_sha="$(git rev-parse --verify --quiet 'HEAD^{commit}' || true)"
            filter_args+=(--force-run)
          fi

          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::trusted base did not resolve to a full commit id" >&2
            exit 1
          fi

          # Reject anything that is not a regular blob at that exact commit: a
          # symlink (mode 120000) would make a content read emit its target
          # path, a gitlink (160000) or tree (040000) carries no script at all,
          # and a missing entry must fail closed rather than fall back to the
          # pull request's own copy.
          entry="$(git ls-tree --full-tree "$trusted_sha" -- "$filter_path")"
          if [ "$(printf '%s\n' "$entry" | grep -c . || true)" != "1" ]; then
            echo "::error::${filter_path} is not a single tree entry at ${trusted_sha}" >&2
            exit 1
          fi
          entry_mode="$(printf '%s\n' "$entry" | awk '{print $1}')"
          entry_type="$(printf '%s\n' "$entry" | awk '{print $2}')"
          entry_object="$(printf '%s\n' "$entry" | awk '{print $3}')"
          entry_path="$(printf '%s\n' "$entry" | awk -F'\t' '{print $2}')"
          if [ "$entry_type" != "blob" ] || [ "$entry_path" != "$filter_path" ]; then
            echo "::error::${filter_path} is not a blob at ${trusted_sha}" >&2
            exit 1
          fi
          case "$entry_mode" in
            100644|100755) ;;
            *)
              echo "::error::${filter_path} has non-regular mode ${entry_mode}" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$entry_object" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::${filter_path} did not resolve to an object id" >&2
            exit 1
          fi
          if [ "$(git cat-file -s "$entry_object")" -gt 262144 ]; then
            echo "::error::${filter_path} exceeds the 256 KiB trusted-filter ceiling" >&2
            exit 1
          fi
          git cat-file blob "$entry_object" > "$trusted_filter"

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            git diff --name-only --no-renames "${trusted_sha}...HEAD" \
              | sort > "$changed_files"
          fi

          # Isolated interpreter: no user site directory, no PYTHON* overrides,
          # and no implicit path entry, so nothing the pull request committed
          # can be imported by the trusted filter.
          python3 -I "$trusted_filter" --self-test
          plan="$(python3 -I "$trusted_filter" "${filter_args[@]}")"
          relevant="$(printf '%s\n' "$plan" | sed -n 's/^relevant=//p')"
          case "$relevant" in
            true|false) ;;
            *)
              echo "::error::trusted relevance filter produced no usable verdict" >&2
              exit 1
              ;;
          esac
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevance decided by trusted base ${trusted_sha}." >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$plan" | sed -n '/^## /,$p' >> "$GITHUB_STEP_SUMMARY"

  istio-status-cas-live:
    name: Istio status CAS live competing-writer proof
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-istio-status-cas-live"

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-kubernetes-tools

      - name: Create kind cluster
        run: kind create cluster --name ferrum-istio-status-cas --wait 120s

      - name: Install pinned AuthorizationPolicy status CRD
        run: kubectl apply -f tests/fixtures/k8s/istio_authorizationpolicy_status_crd.yaml

      - name: Wait for CRD to establish
        run: kubectl wait --for=condition=Established crd/authorizationpolicies.security.istio.io --timeout=60s

      - name: Run Istio status CAS live competing-writer proof
        env:
          FERRUM_ISTIO_STATUS_CAS_LIVE: "1"
          RUST_BACKTRACE: "1"
        run: cargo test --test k8s_istio_status_cas_live -- --ignored --nocapture --exact live_competing_writer_preserves_foreign_and_ferrum_conditions

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name ferrum-istio-status-cas

  gate:
    name: Istio Status CAS Live
    needs:
      - changes
      - istio-status-cas-live
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when Istio status CAS relevance planning fails
        if: needs.changes.result != 'success'
        run: |
          {
            echo "## Istio Status CAS Live"
            echo ""
            echo "Failed before change detection completed."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Skip Istio status CAS proof for unrelated changes
        if: needs.changes.outputs.relevant == 'false'
        run: |
          {
            echo "## Istio Status CAS Live"
            echo ""
            echo "Skipped the competing-writer proof: no Istio status writer, metrics, live test, CRD fixture, workflow, or local-action surfaces changed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when Istio status CAS relevance output is unusable
        if: needs.changes.result == 'success' && needs.changes.outputs.relevant != 'true' && needs.changes.outputs.relevant != 'false'
        run: |
          {
            echo "## Istio Status CAS Live"
            echo ""
            echo "Change detection returned an invalid relevance result: ${{ needs.changes.outputs.relevant }}."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Fail when Istio status CAS live proof did not succeed
        if: needs.changes.outputs.relevant == 'true' && needs.istio-status-cas-live.result != 'success'
        run: |
          {
            echo "## Istio Status CAS Live"
            echo ""
            echo "Live competing-writer proof failed or did not complete: ${{ needs.istio-status-cas-live.result }}."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Report Istio status CAS live proof
        if: needs.changes.outputs.relevant == 'true' && needs.istio-status-cas-live.result == 'success'
        run: |
          {
            echo "## Istio Status CAS Live"
            echo ""
            echo "Live competing-writer proof passed."
          } >> "$GITHUB_STEP_SUMMARY"
