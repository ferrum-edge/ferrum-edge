name: Multicluster Federation Live Datapath

on:
  workflow_dispatch:
  pull_request:
  # Every main push runs the FULL suite (the changes job force-runs on non-PR
  # events): the multicluster federation GA contract is release-blocking, and
  # release.yml's `validate-release-sha` requires a successful PUSH run of this
  # workflow for the tag target, so each main SHA must carry a validated live
  # artifact.
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel a superseded PR/main run on rapid re-push. Manual dispatches share one
# lane and run to completion.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('multicluster-federation-live-pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('multicluster-federation-live-{0}', github.ref) || 'multicluster-federation-live-shared') }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FERRUM_IMAGE_REPOSITORY: ferrum-edge
  FERRUM_IMAGE_TAG: multicluster-federation
  CLUSTER_A: ferrum-fed-a
  CLUSTER_B: ferrum-fed-b

jobs:
  changes:
    name: Multicluster federation trigger
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Check for multicluster federation changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          changed_files="$RUNNER_TEMP/multicluster-federation-changed-files.txt"
          trusted_filter="$RUNNER_TEMP/live_suite_path_filter.py"
          : > "$changed_files"

          filter_args=(--suite mesh-federation --changed-files "$changed_files")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            fetched=false
            for attempt in 1 2 3; do
              if git fetch --no-tags origin "${BASE_REF}"; then
                fetched=true
                break
              fi
              echo "git fetch of ${BASE_REF} failed (attempt ${attempt}/3); retrying" >&2
              sleep $(( attempt * 10 ))
            done
            if [ "$fetched" != true ]; then
              echo "git fetch of ${BASE_REF} failed after 3 attempts" >&2
              exit 1
            fi
            git show "origin/${BASE_REF}:.github/scripts/live_suite_path_filter.py" > "$trusted_filter"
            git diff --name-only "origin/${BASE_REF}...HEAD" | sort > "$changed_files"
          else
            cp .github/scripts/live_suite_path_filter.py "$trusted_filter"
            filter_args+=(--force-run)
          fi

          python3 "$trusted_filter" --self-test
          plan="$(python3 "$trusted_filter" "${filter_args[@]}")"
          relevant="$(printf '%s\n' "$plan" | sed -n 's/^relevant=//p')"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$plan" | sed -n '/^## /,$p' >> "$GITHUB_STEP_SUMMARY"

  multicluster-federation-live:
    name: Multicluster federation live datapath
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-multicluster-federation-live"

      - name: Build runtime binary
        run: cargo build --profile pr-build --bin ferrum-edge

      - name: Package runtime image
        uses: ./.github/actions/package-ferrum-runtime-image
        with:
          binary-path: target/pr-build/ferrum-edge
          image: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-kubernetes-tools

      - name: Create both kind clusters
        run: |
          set -euo pipefail
          kind create cluster --name "$CLUSTER_A" --wait 180s
          kind create cluster --name "$CLUSTER_B" --wait 180s
          kubectl --context "kind-$CLUSTER_A" get nodes -o wide
          kubectl --context "kind-$CLUSTER_B" get nodes -o wide

      - name: Load runtime image into both clusters
        run: |
          set -euo pipefail
          kind load docker-image "${FERRUM_IMAGE_REPOSITORY}:${FERRUM_IMAGE_TAG}" --name "$CLUSTER_A"
          kind load docker-image "${FERRUM_IMAGE_REPOSITORY}:${FERRUM_IMAGE_TAG}" --name "$CLUSTER_B"

      - name: Run live multicluster federation datapath validation
        env:
          FERRUM_MULTICLUSTER_LIVE_ACK_DISPOSABLE: "true"
          FERRUM_SKIP_IMAGE_BUILD: "1"
          FERRUM_IMAGE_REPOSITORY: ${{ env.FERRUM_IMAGE_REPOSITORY }}
          FERRUM_IMAGE_TAG: ${{ env.FERRUM_IMAGE_TAG }}
        run: tests/k8s/multicluster-federation/run.sh

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          results="$GITHUB_WORKSPACE/multicluster-federation-results"
          mkdir -p "$results"
          for cluster in "$CLUSTER_A" "$CLUSTER_B"; do
            ctx="kind-$cluster"
            kubectl --context "$ctx" get nodes -o wide > "$results/${cluster}-nodes.txt" 2>&1
            kubectl --context "$ctx" get pods -A -o wide > "$results/${cluster}-pods.txt" 2>&1
            kubectl --context "$ctx" get events -A --sort-by=.lastTimestamp > "$results/${cluster}-events.txt" 2>&1
            kubectl --context "$ctx" -n ferrum get all -o wide > "$results/${cluster}-ferrum-all.txt" 2>&1
            kubectl --context "$ctx" -n ferrum describe pods > "$results/${cluster}-ferrum-pods-describe.txt" 2>&1
            kubectl --context "$ctx" -n ferrum get configmap -o yaml > "$results/${cluster}-configmaps.yaml" 2>&1
            kubectl --context "$ctx" -n spire-system get all -o wide > "$results/${cluster}-spire-all.txt" 2>&1
            kubectl --context "$ctx" -n spire-system logs statefulset/spire-server --all-containers --tail=500 > "$results/${cluster}-spire-server.log" 2>&1
            kubectl --context "$ctx" -n spire-system logs daemonset/spire-agent --all-containers --tail=500 > "$results/${cluster}-spire-agent.log" 2>&1
            for deploy in svc ferrum-mesh-east-west client rogue; do
              kubectl --context "$ctx" -n ferrum logs "deploy/$deploy" --all-containers --tail=500 > "$results/${cluster}-${deploy}.log" 2>&1
            done
            kubectl --context "$ctx" -n ferrum logs deploy/svc -c ferrum-edge-init --tail=50 > "$results/${cluster}-svc-iptables.txt" 2>&1
          done
          if [ -d "$GITHUB_WORKSPACE/.context/multicluster-federation" ]; then
            cp -R "$GITHUB_WORKSPACE/.context/multicluster-federation" "$results/artifacts"
          fi
          if [ -f target/multicluster-federation/live-assertions.json ]; then
            cp target/multicluster-federation/live-assertions.json "$results/live-assertions.json"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: multicluster-federation-results
          path: multicluster-federation-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete kind clusters
        if: always()
        run: |
          kind delete cluster --name "$CLUSTER_A" || true
          kind delete cluster --name "$CLUSTER_B" || true

  validate-live-contract:
    name: Validate multicluster federation GA contract
    needs:
      - changes
      - multicluster-federation-live
    if: needs.changes.outputs.relevant == 'true' && needs.multicluster-federation-live.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-multicluster-federation-contract"

      - name: Download live assertions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: multicluster-federation-results
          path: target/multicluster-federation

      - name: Validate GA-contract live assertions artifact
        env:
          FERRUM_LIVE_ASSERTIONS_FILE: target/multicluster-federation/live-assertions.json
          FERRUM_LIVE_SUITE: multicluster-federation
          FERRUM_LIVE_MAX_AGE_HOURS: "6"
        run: |
          set -euo pipefail
          status=0
          output="$(FERRUM_LIVE_EXPECTED_COMMIT="$(git rev-parse HEAD)" \
            cargo test --profile pr-build --test conformance_tests -- \
            --exact conformance::live_contract::live_contract_artifact_gate --nocapture 2>&1)" || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error::GA-contract live-assertion validation failed (see validator output above)" >&2
            exit "$status"
          fi
          if ! printf '%s\n' "$output" | grep -q '^test result: ok\. 1 passed'; then
            echo "::error::live_contract_artifact_gate did not run (module unwired or test renamed)" >&2
            exit 1
          fi

  gate:
    name: Multicluster Federation Live
    needs:
      - changes
      - multicluster-federation-live
      - validate-live-contract
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize multicluster federation live result
        run: |
          {
            echo "## Multicluster Federation Live"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Failed before change detection completed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.relevant }}" = "false" ]; then
            echo "Skipped live datapath validation: no multicluster federation, mesh, identity, proxy, GA-contract, image, proto, documentation, configuration, or CI workflow surfaces changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ needs.changes.outputs.relevant }}" != "true" ]; then
            echo "Change detection returned an invalid relevance result: ${{ needs.changes.outputs.relevant }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.multicluster-federation-live.result }}" != "success" ]; then
            echo "Live datapath validation failed or did not complete: ${{ needs.multicluster-federation-live.result }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.validate-live-contract.result }}" != "success" ]; then
            echo "GA-contract validation failed or did not complete: ${{ needs.validate-live-contract.result }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Live datapath validation passed." >> "$GITHUB_STEP_SUMMARY"
