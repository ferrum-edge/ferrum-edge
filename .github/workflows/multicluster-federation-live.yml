name: Multicluster Federation Live Datapath

on:
  workflow_dispatch:
  pull_request:
  # Every main push runs the FULL suite (the changes job force-runs on non-PR
  # events): the multicluster federation datapath is release-blocking, and
  # release.yml's `validate-release-sha` requires a successful PUSH run of this
  # workflow for the tag target, so each main SHA must carry a green live run.
  #
  # Where the GA/release enforcement lives — three blocking layers:
  #   1. The fixture. `tests/k8s/multicluster-federation/run.sh` ends in
  #      `ferrum_live_assertions_require_all_passed` over its
  #      `REQUIRED_LIVE_ASSERTIONS` array, so a required `multicluster.*`
  #      assertion that is missing, failed, or skipped fails the live job.
  #   2. The emitted artifact, in the `gate` job below. It downloads the
  #      published `multicluster-federation-results` artifact and validates
  #      `live-assertions.json` with `.github/scripts/validate_live_assertions.py`:
  #      exact schema version, suite, `${{ github.sha }}` commit, and
  #      `kind-spire-multicluster-federation` platform profile; a fresh,
  #      non-future timestamp; no duplicate ids; exactly the required id set;
  #      and `pass` for every required id. This proves the artifact the run
  #      PUBLISHED matches the contract, which the fixture-side check cannot.
  #   3. The contract binding, in the hosted Rust conformance suite
  #      (`tests/conformance/live_contract.rs`,
  #      `tests/conformance/mesh_multicluster_federation.rs`), which asserts set
  #      equality between the enforced, non-deferred `multicluster-federation`
  #      rows of `tests/conformance/ga_contract.yaml`, run.sh's
  #      `REQUIRED_LIVE_ASSERTIONS`, and the `--require` list in the `gate` job.
  #
  # The `gate` job runs no toolchain, build, or cargo step: the trusted
  # build-policy gate compares the per-job digest of every build-sensitive job,
  # so the validator is standard-library Python behind a SHA-pinned
  # `download-artifact`, and the pre-existing jobs stay byte-identical to main.
  # See docs/ci_cd.md and docs/mesh_multicluster_federation_runbook.md.
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel a superseded PR/main run on rapid re-push. Manual dispatches share one
# lane and run to completion.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('multicluster-federation-live-pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('multicluster-federation-live-{0}', github.ref) || 'multicluster-federation-live-shared') }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FERRUM_IMAGE_REPOSITORY: ferrum-edge
  FERRUM_IMAGE_TAG: multicluster-federation
  CLUSTER_A: ferrum-fed-a
  CLUSTER_B: ferrum-fed-b

jobs:
  changes:
    name: Multicluster federation trigger
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Check for multicluster federation changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          python3 .github/scripts/live_suite_path_filter.py --self-test
          changed_files="$RUNNER_TEMP/multicluster-federation-changed-files.txt"
          : > "$changed_files"

          filter_args=(--suite mesh-federation --changed-files "$changed_files")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            fetched=false
            for attempt in 1 2 3; do
              if git fetch --no-tags origin "${BASE_REF}"; then
                fetched=true
                break
              fi
              echo "git fetch of ${BASE_REF} failed (attempt ${attempt}/3); retrying" >&2
              sleep $(( attempt * 10 ))
            done
            if [ "$fetched" != true ]; then
              echo "git fetch of ${BASE_REF} failed after 3 attempts" >&2
              exit 1
            fi
            git diff --name-only "origin/${BASE_REF}...HEAD" | sort > "$changed_files"
          else
            filter_args+=(--force-run)
          fi

          plan="$(python3 .github/scripts/live_suite_path_filter.py "${filter_args[@]}")"
          relevant="$(printf '%s\n' "$plan" | sed -n 's/^relevant=//p')"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$plan" | sed -n '/^## /,$p' >> "$GITHUB_STEP_SUMMARY"

  multicluster-federation-live:
    name: Multicluster federation live datapath
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-multicluster-federation-live"

      - name: Build runtime binary
        run: cargo build --profile pr-build --bin ferrum-edge

      - name: Package runtime image
        uses: ./.github/actions/package-ferrum-runtime-image
        with:
          binary-path: target/pr-build/ferrum-edge
          image: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-kubernetes-tools

      - name: Create both kind clusters
        run: |
          set -euo pipefail
          kind create cluster --name "$CLUSTER_A" --wait 180s
          kind create cluster --name "$CLUSTER_B" --wait 180s
          kubectl --context "kind-$CLUSTER_A" get nodes -o wide
          kubectl --context "kind-$CLUSTER_B" get nodes -o wide

      - name: Load runtime image into both clusters
        run: |
          set -euo pipefail
          kind load docker-image "${FERRUM_IMAGE_REPOSITORY}:${FERRUM_IMAGE_TAG}" --name "$CLUSTER_A"
          kind load docker-image "${FERRUM_IMAGE_REPOSITORY}:${FERRUM_IMAGE_TAG}" --name "$CLUSTER_B"

      - name: Run live multicluster federation datapath validation
        env:
          FERRUM_MULTICLUSTER_LIVE_ACK_DISPOSABLE: "true"
          FERRUM_SKIP_IMAGE_BUILD: "1"
          FERRUM_IMAGE_REPOSITORY: ${{ env.FERRUM_IMAGE_REPOSITORY }}
          FERRUM_IMAGE_TAG: ${{ env.FERRUM_IMAGE_TAG }}
        run: tests/k8s/multicluster-federation/run.sh

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          results="$GITHUB_WORKSPACE/multicluster-federation-results"
          mkdir -p "$results"
          for cluster in "$CLUSTER_A" "$CLUSTER_B"; do
            ctx="kind-$cluster"
            kubectl --context "$ctx" get nodes -o wide > "$results/${cluster}-nodes.txt" 2>&1
            kubectl --context "$ctx" get pods -A -o wide > "$results/${cluster}-pods.txt" 2>&1
            kubectl --context "$ctx" get events -A --sort-by=.lastTimestamp > "$results/${cluster}-events.txt" 2>&1
            kubectl --context "$ctx" -n ferrum get all -o wide > "$results/${cluster}-ferrum-all.txt" 2>&1
            kubectl --context "$ctx" -n ferrum describe pods > "$results/${cluster}-ferrum-pods-describe.txt" 2>&1
            kubectl --context "$ctx" -n ferrum get configmap -o yaml > "$results/${cluster}-configmaps.yaml" 2>&1
            kubectl --context "$ctx" -n spire-system get all -o wide > "$results/${cluster}-spire-all.txt" 2>&1
            kubectl --context "$ctx" -n spire-system logs statefulset/spire-server --all-containers --tail=500 > "$results/${cluster}-spire-server.log" 2>&1
            kubectl --context "$ctx" -n spire-system logs daemonset/spire-agent --all-containers --tail=500 > "$results/${cluster}-spire-agent.log" 2>&1
            for deploy in svc ferrum-mesh-east-west client rogue; do
              kubectl --context "$ctx" -n ferrum logs "deploy/$deploy" --all-containers --tail=500 > "$results/${cluster}-${deploy}.log" 2>&1
            done
            kubectl --context "$ctx" -n ferrum logs deploy/svc -c ferrum-edge-init --tail=50 > "$results/${cluster}-svc-iptables.txt" 2>&1
          done
          if [ -d "$GITHUB_WORKSPACE/.context/multicluster-federation" ]; then
            cp -R "$GITHUB_WORKSPACE/.context/multicluster-federation" "$results/artifacts"
          fi
          if [ -f target/multicluster-federation/live-assertions.json ]; then
            cp target/multicluster-federation/live-assertions.json "$results/live-assertions.json"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: multicluster-federation-results
          path: multicluster-federation-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete kind clusters
        if: always()
        run: |
          kind delete cluster --name "$CLUSTER_A" || true
          kind delete cluster --name "$CLUSTER_B" || true

  gate:
    # Aggregate required check AND the emitted-artifact release gate. Nothing
    # may be written between the job above and this key: a comment there
    # attaches to the frozen `multicluster-federation-live` block and would
    # change the digest the trusted build-policy gate compares.
    #
    # This job carries no Rust toolchain step and no build step — the trusted
    # build-policy gate compares the per-job digest of every job it reads as
    # build-sensitive, so the artifact validation below is deliberately a
    # checkout plus a SHA-pinned `download-artifact` plus one standard-library
    # Python validator. `verify_required_ci.py` and the hosted conformance
    # suite both assert that property, so keep this job toolchain-free.
    name: Multicluster Federation Live
    needs:
      - changes
      - multicluster-federation-live
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize multicluster federation live result
        id: summarize
        run: |
          {
            echo "## Multicluster Federation Live"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail closed by default: the artifact gate below runs only when this
          # step positively establishes that a relevant live run succeeded.
          echo "validate=false" >> "$GITHUB_OUTPUT"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Failed before change detection completed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.relevant }}" = "false" ]; then
            echo "Skipped live datapath validation: no multicluster federation, mesh, identity, proxy, GA-contract, image, proto, documentation, configuration, or CI workflow surfaces changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ needs.changes.outputs.relevant }}" != "true" ]; then
            echo "Change detection returned an invalid relevance result: ${{ needs.changes.outputs.relevant }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.multicluster-federation-live.result }}" != "success" ]; then
            echo "Live datapath validation failed or did not complete: ${{ needs.multicluster-federation-live.result }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "validate=true" >> "$GITHUB_OUTPUT"
          echo "Live datapath run succeeded; validating the emitted live-assertions.json artifact against the release contract." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Ferrum Edge
        if: steps.summarize.outputs.validate == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download live assertion artifact
        if: steps.summarize.outputs.validate == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: multicluster-federation-results
          path: multicluster-federation-artifact

      # The fixture's own `ferrum_live_assertions_require_all_passed` proves
      # only what the fixture process saw. This validates the artifact the run
      # actually published: exact schema/suite/commit/platform profile, a fresh
      # non-future timestamp, no duplicate ids, exactly the required
      # `multicluster.*` id set, and `pass` (never `skip`) for every one of
      # them. The required set below is pinned to the enforced, non-deferred
      # `multicluster-federation` rows of tests/conformance/ga_contract.yaml by
      # `live_contract_multicluster_release_gate_requires_exactly_the_enforced_rows`,
      # so drift in either direction fails the hosted conformance suite.
      - name: Validate emitted live assertion artifact
        if: steps.summarize.outputs.validate == 'true'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 .github/scripts/validate_live_assertions.py --self-test

          python3 .github/scripts/validate_live_assertions.py \
            --artifact multicluster-federation-artifact/live-assertions.json \
            --schema-version 1 \
            --suite multicluster-federation \
            --platform-profile kind-spire-multicluster-federation \
            --commit "$EXPECTED_COMMIT" \
            --max-age-seconds 21600 \
            --required-namespace multicluster. \
            --require multicluster.spire.federation_ready_a \
            --require multicluster.spire.federation_ready_b \
            --require multicluster.federation.trust_bundle_exchange \
            --require multicluster.spire.workload_entries \
            --require multicluster.eastwest.gateway_reachable \
            --require multicluster.eastwest.a_to_b_authenticated \
            --require multicluster.eastwest.b_to_a_authenticated \
            --require multicluster.eastwest.bidirectional_authenticated_traffic \
            --require multicluster.eastwest.untrusted_peer_rejected \
            --require multicluster.federation.bundle_revoked_rejected \
            --require multicluster.federation.trust_restored_recovers \
            --require multicluster.eastwest.endpoint_blackhole_when_dest_down \
            --require multicluster.eastwest.endpoint_recovers_when_dest_returns

          echo "Emitted live-assertions.json validated against the GA/release contract." >> "$GITHUB_STEP_SUMMARY"
