# Hosted execution gate for the mesh-runtime benchmark harness's own
# tests and contracts. `tests/performance/mesh_runtime/` is a standalone
# crate (own manifest + lockfile), so the workspace test aggregate never
# builds it; `benchmark-harness-tests.yml` covers other harness packages
# and neither lockfile lane covers this one. This lane keeps the crate,
# the summarizer contract, and the harness script compilable/checkable on
# every change that touches them — not only when the (manual, expensive)
# benchmark workflow is dispatched.

name: Mesh Runtime Harness Tests

on:
  pull_request:
    paths:
      - tests/performance/mesh_runtime/**
      - .github/scripts/summarize_mesh_runtime_results.py
      - .github/scripts/mesh_runtime_campaign.py
      - .github/scripts/mesh_runtime_campaign.sh
      - .github/workflows/mesh-runtime-benchmark.yml
      - .github/workflows/mesh-runtime-harness-tests.yml
  push:
    branches: [main]
    paths:
      - tests/performance/mesh_runtime/**
      - .github/scripts/summarize_mesh_runtime_results.py
      - .github/scripts/mesh_runtime_campaign.py
      - .github/scripts/mesh_runtime_campaign.sh
      - .github/workflows/mesh-runtime-benchmark.yml
      - .github/workflows/mesh-runtime-harness-tests.yml
  workflow_dispatch:
    inputs:
      fixture_smoke:
        description: "Smoke synthetic mTLS fixtures using the retained pinned-main CI binary (no performance claim)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness-tests:
    name: Mesh runtime harness tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Summarizer contract self-test
        run: |
          python3 .github/scripts/summarize_mesh_runtime_results.py --self-test
          python3 -m py_compile .github/scripts/summarize_mesh_runtime_results.py

      - name: Harness script syntax
        run: bash -n tests/performance/mesh_runtime/run_mesh_runtime_bench.sh

      - name: Campaign and resource sampler contracts
        run: python3 -m unittest discover -s tests/performance/mesh_runtime/tests -p 'test_*.py' -v

      - name: Locked crate tests
        run: cargo test --locked --manifest-path tests/performance/mesh_runtime/Cargo.toml

      - name: Crate formatting
        run: cargo fmt --manifest-path tests/performance/mesh_runtime/Cargo.toml -- --check

      # The overall source CI failed; this retained build is only a disposable
      # fixture probe, never evidence of release readiness or performance.
      - name: Download pinned-main fixture binary
        if: inputs.fixture_smoke == true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ferrum-edge-debug-Linux-X64
          run-id: 39560802458
          github-token: ${{ github.token }}
          path: fixture-bin

      - name: Package nonroot fixture image without compiling the runtime
        if: inputs.fixture_smoke == true
        uses: ./.github/actions/package-ferrum-runtime-image
        with:
          binary-path: fixture-bin/ferrum-edge
          image: ferrum-edge:bench

      - name: Build only the small load generator and retain fixture identity
        if: inputs.fixture_smoke == true
        timeout-minutes: 6
        run: |
          mkdir -p fixture-results
          printf '%s\n' 'source_sha=236ec83e5684fe57284894ca96750ce8a37bdc94' 'source_run=39560802458' 'source_artifact=12327942352' 'purpose=fixture_smoke_only' > fixture-results/source.txt
          sha256sum fixture-bin/ferrum-edge > fixture-results/source-binary.sha256
          docker image inspect ferrum-edge:bench --format '{{.Id}} {{.Config.User}}' > fixture-results/image.txt
          docker run --rm ferrum-edge:bench version --json > fixture-results/version.json
          docker build -f tests/performance/mesh_runtime/Dockerfile.tools -t mesh-bench-tools:local tests/performance/mesh_runtime

      - name: Prove Ferrum and Envoy synthetic identities and one tiny load cell
        if: inputs.fixture_smoke == true
        timeout-minutes: 6
        run: |
          bash tests/performance/mesh_runtime/run_mesh_runtime_bench.sh ferrum --skip-build --duration 1 --concurrency 1 --payload-sizes 1024 --output-dir fixture-results/ferrum
          bash tests/performance/mesh_runtime/run_mesh_runtime_bench.sh envoy --skip-build --duration 1 --concurrency 1 --payload-sizes 1024 --output-dir fixture-results/envoy

      - name: Retain fixture proof without synthetic private keys
        if: always() && inputs.fixture_smoke == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mesh-fixture-smoke-${{ github.sha }}
          path: |
            fixture-results/
            !fixture-results/**/runtime/**
          retention-days: 14
