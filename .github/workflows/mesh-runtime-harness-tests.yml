# Hosted execution gate for the mesh-runtime benchmark harness's own
# tests and contracts. `tests/performance/mesh_runtime/` is a standalone
# crate (own manifest + lockfile), so the workspace test aggregate never
# builds it; `benchmark-harness-tests.yml` covers other harness packages
# and neither lockfile lane covers this one. This lane keeps the crate,
# the summarizer contract, and the harness script compilable/checkable on
# every change that touches them — not only when the (manual, expensive)
# benchmark workflow is dispatched.

name: Mesh Runtime Harness Tests

on:
  pull_request:
    paths:
      - tests/performance/mesh_runtime/**
      - .github/scripts/summarize_mesh_runtime_results.py
      - .github/scripts/mesh_runtime_campaign.py
      - .github/workflows/mesh-runtime-benchmark.yml
      - .github/workflows/mesh-runtime-harness-tests.yml
  push:
    branches: [main]
    paths:
      - tests/performance/mesh_runtime/**
      - .github/scripts/summarize_mesh_runtime_results.py
      - .github/scripts/mesh_runtime_campaign.py
      - .github/workflows/mesh-runtime-benchmark.yml
      - .github/workflows/mesh-runtime-harness-tests.yml
  workflow_dispatch:
    inputs:
      runtime_checks:
        description: "Run bounded mesh hook-plan runtime regression checks"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness-tests:
    name: Mesh runtime harness tests
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Summarizer contract self-test
        run: |
          python3 .github/scripts/summarize_mesh_runtime_results.py --self-test
          python3 -m py_compile .github/scripts/summarize_mesh_runtime_results.py

      - name: Harness script syntax
        run: bash -n tests/performance/mesh_runtime/run_mesh_runtime_bench.sh

      - name: Campaign and resource sampler contracts
        run: python3 -m unittest discover -s tests/performance/mesh_runtime/tests -p 'test_*.py' -v

      - name: Locked crate tests
        run: cargo test --locked --manifest-path tests/performance/mesh_runtime/Cargo.toml

      - name: Crate formatting
        run: cargo fmt --manifest-path tests/performance/mesh_runtime/Cargo.toml -- --check

      - name: Runtime test prerequisites
        if: inputs.runtime_checks == true
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang cmake libssl-dev libcurl4-openssl-dev

      - name: Mesh hook-plan and sibling regression tests
        if: inputs.runtime_checks == true
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo test --locked --profile pr-build --test unit_plugins_b_tests plugin_request_hook_plan_tests
          cargo test --locked --profile pr-build --test unit_plugins_b_tests plugin_trigger_gate_tests
          cargo test --locked --profile pr-build --test unit_plugins_b_tests plugin_cache_tests
          cargo test --locked --profile pr-build --test unit_plugins_b_tests route_header_finalization_tests
          cargo test --locked --profile pr-build --test unit_plugins_a_tests grpc_deadline_tests
          cargo fmt --all -- --check
