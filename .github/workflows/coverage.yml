name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

concurrency:
  group: coverage-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  # Pushes to main are never cancelled (see ci.yml); superseded PR runs are.
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Absolute line-coverage FLOORS (regression backstops), not targets. They sit
  # deliberately BELOW measured coverage so ordinary drift does not flap main red.
  # Every PR is measured against its own base, but many PRs land independently and
  # the merged total on main can dip a fraction of a point below any single PR's
  # figure — a floor pinned to the peak then fails ~half of merges for a sub-0.1pt
  # miss. The real protection for NEW code is the diff-scoped
  # MIN_CHANGED_PLUGIN_LINE_COVERAGE gate that runs on pull_request events.
  #
  # Sizing: when this gate was introduced main measured ~78.29% overall / ~84.99%
  # plugins; it has since oscillated 78.20%–78.42% overall (a ~0.2pt band that
  # straddled the old 78.28 floor, so merges flapped red/green on identical code).
  # Give ~0.9pt of headroom below the low-water mark. A genuine >~1pt regression
  # still trips the floor. Re-ratchet these upward deliberately once coverage
  # stabilizes materially higher — do not pin them back to the current peak.
  MIN_OVERALL_LINE_COVERAGE: "77.50"
  MIN_PLUGINS_LINE_COVERAGE: "84.50"
  MIN_CHANGED_PLUGIN_LINE_COVERAGE: "84.98"
  # cargo-llvm-cov applies this during report generation; v0.8.7 warns if it
  # is passed to --no-report collection commands.
  LLVM_COV_IGNORE_FILENAME_REGEX: "(vendor/|tests/|build\\.rs|target/|custom_plugins/|ebpf/|proto/)"

jobs:
  coverage-plan:
    name: Coverage Plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      shards: ${{ steps.plan.outputs.shards }}
      shard-matrix: ${{ steps.plan.outputs.shard-matrix }}
      plugin_gate: ${{ steps.plan.outputs.plugin_gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Validate coverage planner examples
        run: python3 .github/scripts/coverage_plan.py --self-test

      - name: Validate coverage workflow contract
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_coverage_workflow.py --self-test
          python3 .github/scripts/verify_coverage_workflow.py

      - id: plan
        name: Select coverage mode
        run: |
          set -euo pipefail

          changed_files="changed-files.txt"
          : > "$changed_files"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="origin/${BASE_REF}"
            if ! git diff --name-only --no-renames "${base_ref}...HEAD" > "$changed_files"; then
              echo "::warning::changed-file diff unavailable; failing closed to full coverage" >&2
              : > "$changed_files"
            fi
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            if ! printf '%s' "$MERGE_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::merge_group base_sha missing or malformed" >&2
              exit 1
            fi
            if ! git cat-file -e "${MERGE_BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "${MERGE_BASE_SHA}"
            fi
            if ! git diff --name-only --no-renames "${MERGE_BASE_SHA}...HEAD" > "$changed_files"; then
              echo "::warning::changed-file diff unavailable; failing closed to full coverage" >&2
              : > "$changed_files"
            fi
          fi

          plan="$(python3 .github/scripts/coverage_plan.py \
            --event-name "$EVENT_NAME" \
            --changed-files "$changed_files" \
            --github-output "$GITHUB_OUTPUT")"
          mode="$(printf '%s\n' "$plan" | sed -n 's/^mode=//p' | head -n1)"
          reason="$(printf '%s\n' "$plan" | sed -n 's/^reason=//p' | head -n1)"
          shards="$(printf '%s\n' "$plan" | sed -n 's/^shards=//p' | head -n1)"
          plugin_gate="$(printf '%s\n' "$plan" | sed -n 's/^plugin_gate=//p' | head -n1)"

          {
            echo "## Coverage Plan"
            echo ""
            echo "Mode: **${mode}**"
            echo ""
            echo "Shards: \`${shards:-[]}\`"
            echo ""
            echo "Plugin gate: **${plugin_gate:-false}**"
            echo ""
            echo "${reason}"
            if [ -s "$changed_files" ]; then
              echo ""
              echo "### Changed Files"
              echo ""
              while IFS= read -r path; do
                echo "- \`${path}\`"
              done < "$changed_files"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}

  coverage-shard:
    name: Coverage Shard (${{ matrix.shard }})
    needs: coverage-plan
    if: needs.coverage-plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    # A cold/partial-cache lib + unit_tests llvm-cov invocation can exceed the
    # old 45- and 75-minute budgets even though warm shards normally finish
    # sooner. Keep the combined invocation so runner loss cannot discard the
    # shared compile. Issue #4368: PR #4347 run 33223661366 attempt 1 job
    # 99027333486 was still progressing through passing unit tests when the
    # 75-minute deadline canceled it. Cap cargo's jobserver below the #4099
    # value of 3 so peak memory fits the runner, and keep enough wall-clock
    # for the slower compile plus the remaining suite.
    timeout-minutes: 120
    env:
      # Issue #4099 / #4368: cold-cache instrumented compiles have killed hosted
      # runners ("shutdown signal" + exit 143) during the cargo compile
      # phase, before any test runs — the same memory-ceiling signature as
      # fips-test-build (#4018). PR #4336 run 33219849557 job 99020110238
      # reproduced that stall at CARGO_BUILD_JOBS=3 (silent after
      # Compiling testcontainers v0.27.3, then exit 143). Cap cargo's
      # jobserver at 2 so peak memory fits the runner, and shrink debuginfo
      # per codegen thread. llvm-cov's instrumentation flags (`--no-report`,
      # `--lib`, `--test`, nextest) are untouched. The cap is job-level
      # because GitHub cannot set per-matrix-row env without splitting the
      # shard job; integration shards finish well under the new deadline.
      CARGO_BUILD_JOBS: "2"
      # `line-tables-only` keeps file:line for backtraces and drops only
      # variable-level DWARF. Line/region attribution comes from
      # `-C instrument-coverage` mapping sections, not from DWARF locals, so
      # cargo-llvm-cov reports stay equivalent. Set on BOTH profiles rather
      # than relying on `test` inheriting from `dev` (`cargo llvm-cov --lib
      # --test` builds under the test profile).
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    # The lib-unit shard compiles the aggregated tests/unit_tests binary,
    # whose single-crate rustc frontend exceeds hosted-runner RAM cold — the
    # swap step below keeps the VM alive through that window (see ci.yml
    # test-unit for the incident pattern).
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.coverage-plan.outputs.shard-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Extend runner swap for the aggregated unit_tests compile
        run: |
          set -euo pipefail
          sudo fallocate -l 12G /mnt/ferrum-swapfile
          sudo chmod 600 /mnt/ferrum-swapfile
          sudo mkswap /mnt/ferrum-swapfile
          sudo swapon /mnt/ferrum-swapfile
          free -h

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-coverage"
          # The lib-unit shard compiles the superset of the instrumented
          # dependency graph and is the lane's sole producer on main.
          save: ${{ matrix.kind == 'lib-unit' && 'true' || 'false' }}
          # Publish a complete instrumented dependency lane only after success.
          cache-on-failure: "false"

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Install llvm tools
        run: rustup component add llvm-tools-preview

      - name: Clean stale coverage data
        run: cargo llvm-cov clean --workspace

      - name: Run lib and unit coverage
        if: matrix.kind == 'lib-unit'
        run: |
          set -euo pipefail
          # One llvm-cov invocation compiles lib + the four unit targets together so a
          # runner-loss after the library suite does not throw away that compile
          # and then recompile ferrum-edge for the unit-test target (#3888).
          cargo llvm-cov --no-report \
            --lib \
            --test unit_tests \
            --test unit_plugins_a_tests \
            --test unit_plugins_b_tests \
            --test unit_gateway_core_tests
        env:
          RUST_BACKTRACE: 1

      - name: Run integration coverage shard
        if: matrix.kind == 'integration'
        run: |
          set -euo pipefail
          filters=()
          while IFS= read -r filter; do
            [ -z "$filter" ] && continue
            filters+=("$filter")
          done <<< "$INTEGRATION_FILTERS"
          cargo llvm-cov --no-report \
            nextest --test integration_tests \
            --no-fail-fast \
            "${filters[@]}"
        env:
          INTEGRATION_FILTERS: ${{ matrix.filters }}
          RUST_BACKTRACE: 1

      - name: Start functional data-plane service containers
        # Plaintext Redis/MongoDB/PostgreSQL/MySQL for the serial
        # `functional-data` shard, matching the ports and URLs ci.yml's
        # data-plane functional shards use. The TLS database fixtures stay
        # ci.yml-only: without FERRUM_DB_TLS_REQUIRED those cells skip here,
        # which costs their coverage but not the gate.
        if: matrix.kind == 'functional' && matrix.data_services == 'true'
        run: |
          set -euo pipefail

          docker run -d --name ferrum-cov-redis -p 6379:6379 redis:7-alpine
          docker run -d --name ferrum-cov-mongo -p 27017:27017 mongo:7
          # A replica-set member advertises its own host:port, so it must run
          # on the host network at the port the driver dials.
          docker run -d --name ferrum-cov-mongo-rs --network host \
            mongo:7 --replSet rs0 --port 27020 --bind_ip_all \
            --setParameter enableTestCommands=1
          docker run -d --name ferrum-cov-postgres \
            -e POSTGRES_DB=ferrum \
            -e POSTGRES_USER=ferrum \
            -e POSTGRES_PASSWORD=ferrum \
            -p 5432:5432 \
            postgres:16-alpine
          docker run -d --name ferrum-cov-mysql \
            -e MYSQL_DATABASE=ferrum \
            -e MYSQL_USER=ferrum \
            -e MYSQL_PASSWORD=ferrum \
            -e MYSQL_ROOT_PASSWORD=ferrum \
            -p 3306:3306 \
            mysql:8

          redis_ok=""
          for _ in $(seq 1 30); do
            if docker exec ferrum-cov-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              redis_ok=1; break
            fi
            sleep 2
          done
          if [ -z "$redis_ok" ]; then
            echo "::error::redis did not become ready"; docker logs ferrum-cov-redis; exit 1
          fi

          mongo_ok=""
          for _ in $(seq 1 30); do
            if docker exec ferrum-cov-mongo mongosh --quiet \
                --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)' 2>/dev/null; then
              mongo_ok=1; break
            fi
            sleep 2
          done
          if [ -z "$mongo_ok" ]; then
            echo "::error::mongo did not become ready"; docker logs ferrum-cov-mongo; exit 1
          fi

          mongo_rs_ok=""
          for _ in $(seq 1 30); do
            if docker exec ferrum-cov-mongo-rs mongosh --quiet --port 27020 \
                --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)' 2>/dev/null; then
              mongo_rs_ok=1; break
            fi
            sleep 2
          done
          if [ -z "$mongo_rs_ok" ]; then
            echo "::error::mongo replica set did not become ready"
            docker logs ferrum-cov-mongo-rs; exit 1
          fi
          # The primary election loop below is the readiness gate; `|| true`
          # keeps `set -e` from pre-empting its diagnostic.
          docker exec ferrum-cov-mongo-rs mongosh --quiet --port 27020 --eval \
            'try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27020"}]}) }' || true
          mongo_rs_primary=""
          for _ in $(seq 1 60); do
            if docker exec ferrum-cov-mongo-rs mongosh --quiet --port 27020 \
                --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' 2>/dev/null; then
              mongo_rs_primary=1; break
            fi
            sleep 1
          done
          if [ -z "$mongo_rs_primary" ]; then
            echo "::error::mongo replica set did not elect a primary"
            docker logs ferrum-cov-mongo-rs; exit 1
          fi
          {
            echo "FERRUM_TEST_MONGO_REPLICA_SET=rs0"
            echo "FERRUM_TEST_MONGO_REPLICA_SET_URL=mongodb://localhost:27020/ferrum_test"
          } >> "$GITHUB_ENV"

          # `-h 127.0.0.1`: a socket-only pg_isready reports ready while the
          # entrypoint's initialization server is still running.
          pg_ok=""
          for _ in $(seq 1 60); do
            if docker exec ferrum-cov-postgres pg_isready -h 127.0.0.1 -U ferrum -d ferrum >/dev/null 2>&1; then
              pg_ok=1; break
            fi
            sleep 2
          done
          if [ -z "$pg_ok" ]; then
            echo "::error::postgres did not become ready"; docker logs ferrum-cov-postgres; exit 1
          fi

          mysql_ok=""
          for _ in $(seq 1 90); do
            if MYSQL_PWD=ferrum docker exec -e MYSQL_PWD ferrum-cov-mysql mysqladmin ping -h 127.0.0.1 -uferrum --silent >/dev/null 2>&1 \
              && MYSQL_PWD=ferrum docker exec -e MYSQL_PWD ferrum-cov-mysql mysql -h 127.0.0.1 -uferrum -D ferrum \
                   -e "SELECT 1" >/dev/null 2>&1; then
              mysql_ok=1; break
            fi
            sleep 2
          done
          if [ -z "$mysql_ok" ]; then
            echo "::error::mysql did not become ready"; docker logs ferrum-cov-mysql; exit 1
          fi

          # Functional cells provision per-cell databases via CREATE/DROP.
          MYSQL_PWD=ferrum docker exec -e MYSQL_PWD ferrum-cov-mysql mysql -uroot -e \
            "GRANT CREATE, DROP, ALTER, INDEX, SELECT, INSERT, UPDATE, DELETE, REFERENCES, CREATE TEMPORARY TABLES, LOCK TABLES, TRIGGER ON *.* TO 'ferrum'@'%'; FLUSH PRIVILEGES;"
          docker exec ferrum-cov-postgres psql -U ferrum -d ferrum -v ON_ERROR_STOP=1 -c \
            "ALTER USER ferrum WITH CREATEDB;"

      - name: Run functional coverage shard
        # Runs the subprocess `functional_tests` suite so the spawned
        # instrumented `ferrum-edge` processes write profiles next to the test
        # binaries' (the harness forwards LLVM_PROFILE_FILE, and a gateway
        # stopped with SIGTERM flushes on exit; one stopped with SIGKILL does
        # not). ci.yml's Functional Tests shards are the correctness gate for
        # this suite, so test failures here only warn: instrumented debug
        # binaries are slower, and a timing-sensitive failure must not turn
        # the coverage floor red. A build failure, or a run that produced no
        # profiles at all, still fails the shard.
        if: matrix.kind == 'functional'
        run: |
          set -euo pipefail
          # Build the test binary and the instrumented gateway first, running
          # no test, so a compile failure fails the shard outright.
          cargo llvm-cov --no-report \
            nextest --test functional_tests \
            --no-tests=pass \
            -E 'none()'
          # Several functional suites resolve the gateway through the fixed
          # ./target/debug/ferrum-edge path rather than FERRUM_EDGE_TEST_BIN,
          # and the CLI suite hard-links that path into temp directories.
          # A symlink would be linked as a dangling relative link there, so
          # hard-link the real instrumented binary instead.
          mkdir -p target/debug
          ln -f target/llvm-cov-target/debug/ferrum-edge target/debug/ferrum-edge
          filters=()
          while IFS= read -r filter; do
            [ -z "$filter" ] && continue
            filters+=("$filter")
          done <<< "$FUNCTIONAL_FILTERS"
          nextest_args=()
          if [ -n "$FUNCTIONAL_PARTITION" ]; then
            nextest_args+=(--partition "$FUNCTIONAL_PARTITION")
          fi
          if [ -n "$FUNCTIONAL_TEST_THREADS" ]; then
            nextest_args+=(--test-threads "$FUNCTIONAL_TEST_THREADS")
          fi
          started="${RUNNER_TEMP}/functional-coverage-started"
          touch "$started"
          status=0
          # `--no-clean`: every cargo-llvm-cov invocation otherwise runs
          # `cargo clean -p ferrum-edge` and rebuilds the binary linked above.
          cargo llvm-cov --no-report --no-clean \
            nextest --test functional_tests \
            --run-ignored all \
            --no-fail-fast \
            --retries 1 \
            -E "$FUNCTIONAL_FILTERSET" \
            "${nextest_args[@]}" \
            "${filters[@]}" || status=$?
          profiles="$(find target/llvm-cov-target -name '*.profraw' -newer "$started" | wc -l)"
          echo "functional coverage profiles written: ${profiles}"
          if [ "$profiles" -eq 0 ]; then
            echo "::error::the functional coverage run wrote no profiles (exit ${status})"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::functional coverage shard ${COVERAGE_SHARD} finished with test failures (exit ${status}); ci.yml's Functional Tests own correctness, so the collected profiles are kept"
          fi
          {
            echo "## Functional coverage shard: ${COVERAGE_SHARD}"
            echo ""
            echo "Profiles written: ${profiles}. nextest exit status: ${status}."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          COVERAGE_SHARD: ${{ matrix.shard }}
          FUNCTIONAL_FILTERS: ${{ matrix.filters }}
          FUNCTIONAL_FILTERSET: ${{ matrix.filterset }}
          FUNCTIONAL_PARTITION: ${{ matrix.partition }}
          FUNCTIONAL_TEST_THREADS: ${{ matrix.test_threads }}
          FERRUM_EDGE_TEST_BIN: ${{ github.workspace }}/target/llvm-cov-target/debug/ferrum-edge
          # cargo-llvm-cov's default name carries `%p`, one profile per process.
          # The suite spawns thousands of test and gateway processes at several
          # MB of counters each, which would swamp the shard tar and the merge
          # job. Drop `%p` so every process of one binary merges online into a
          # pool of at most four files (LLVM `%Nm`, keyed by binary signature).
          LLVM_PROFILE_FILE_NAME: ferrum-edge-functional-%4m.profraw
          # The nextest build above already produced the instrumented binary;
          # skip the harness's per-process `cargo build --bin ferrum-edge`.
          FERRUM_SKIP_GATEWAY_BUILD: "1"
          RUST_BACKTRACE: 1
          FERRUM_TEST_POSTGRES_URL: ${{ matrix.data_services == 'true' && 'postgres://ferrum:ferrum@127.0.0.1:5432/ferrum' || '' }}
          FERRUM_TEST_MYSQL_URL: ${{ matrix.data_services == 'true' && 'mysql://ferrum:ferrum@127.0.0.1:3306/ferrum' || '' }}
          FERRUM_TEST_MONGO_URL: ${{ matrix.data_services == 'true' && 'mongodb://127.0.0.1:27017/ferrum_test' || '' }}

      - name: Stop functional data-plane service containers
        if: always() && matrix.kind == 'functional' && matrix.data_services == 'true'
        run: |
          set +e
          for name in ferrum-cov-redis ferrum-cov-mongo ferrum-cov-mongo-rs \
                      ferrum-cov-postgres ferrum-cov-mysql; do
            docker unpause "$name" >/dev/null 2>&1
            docker rm -f "$name" >/dev/null 2>&1
          done

      - name: Package coverage data
        run: |
          set -euo pipefail
          # `cargo llvm-cov report` only needs the *.profraw profile data and
          # the linked instrumented binaries. Ship just those in a tar and drop
          # the dependency rlibs/rmeta, codegen-unit .o files, dep-info, and the
          # incremental and fingerprint caches: report never reads them and they
          # are the bulk of the target dir. tar also preserves the Unix
          # executable bit that actions/upload-artifact's zip would otherwise
          # drop (actions/upload-artifact#38, actions/toolkit#1722), so the
          # merge job needs no chmod to make the binaries discoverable as object
          # files (cargo-llvm-cov's is_object requires `mode & 0o111 != 0`).
          find target/llvm-cov-target \
            -type d \( -name incremental -o -name .fingerprint \) -prune -o \
            -type f ! -name '*.rlib' ! -name '*.rmeta' ! -name '*.d' ! -name '*.o' -print \
            > coverage-files.txt
          echo "packaging $(grep -c '' coverage-files.txt) files ($(grep -c '\.profraw$' coverage-files.txt) profraw)"
          tar -cf "coverage-${{ matrix.shard }}.tar" -T coverage-files.txt
          ls -lh "coverage-${{ matrix.shard }}.tar"

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.tar
          retention-days: 1
          if-no-files-found: error

  coverage-merge:
    name: Merge Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - coverage-plan
      - coverage-shard
    if: always()
    steps:
      - name: Fail when coverage planning fails
        if: needs.coverage-plan.result != 'success'
        run: exit 1

      - name: Fail when coverage mode is invalid
        if: needs.coverage-plan.result == 'success' && !contains(fromJSON('["skip", "plugin", "shards", "full"]'), needs.coverage-plan.outputs.mode)
        run: exit 1

      - name: Skip coverage for unrelated changes
        if: needs.coverage-plan.outputs.mode == 'skip'
        run: |
          {
            echo "## Coverage Gate"
            echo ""
            echo "No coverage-relevant files changed in this run."
            echo "Full coverage still runs on core source, proto/build-input, pushes to main, manual dispatch, and schedule."
            echo "Classifiable pull-request and merge-group diffs run lib-unit plus the affected integration shards."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when planned coverage shards fail
        if: needs.coverage-plan.outputs.mode != 'skip' && needs.coverage-shard.result != 'success'
        run: exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        if: needs.coverage-plan.outputs.mode != 'skip'
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust-ci
        if: needs.coverage-plan.outputs.mode != 'skip'
        with:
          shared-key: "ci-coverage"

      - name: Install cargo-llvm-cov
        if: needs.coverage-plan.outputs.mode != 'skip'
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-llvm-cov

      - name: Install llvm tools
        if: needs.coverage-plan.outputs.mode != 'skip'
        run: rustup component add llvm-tools-preview

      - name: Download and extract coverage data
        if: needs.coverage-plan.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          # Each shard tar holds *.profraw plus the instrumented binaries with
          # their executable bit intact (see the shard "Package coverage data"
          # step), so cargo-llvm-cov can collect them as object files without a
          # chmod. Preserve the existing sequential overwrite order for shared
          # paths; do not assume binaries from separate runners are identical.
          # Keep the compressed Actions ZIP on disk and stream its tar member
          # into tar, avoiding a multi-GiB intermediate uncompressed tar write
          # and reread per shard. The uploaded ZIP/tar and file set are unchanged.
          # Only one compressed shard archive is staged at a time.
          #
          # Only the planner's shard list is downloaded. Leftover coverage-data-*
          # artifacts from a prior attempt of the same run must not join the
          # merge, and a skipped/missing planned shard must not green the gate.
          fanin_started=$SECONDS
          artifact_names="$(python3 .github/scripts/coverage_plan.py \
            --emit-artifact-names \
            --planned-shards "$PLANNED_SHARDS")"
          test -n "$artifact_names"

          # Resolve names only within this run, including all API pages. Reject
          # missing, expired, or ambiguous planned artifacts before downloading.
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            > coverage-artifacts.json

          {
            echo "## Coverage artifact fan-in"
            echo ""
            echo "| Shard artifact | ZIP bytes | Tar bytes | Download seconds | Extract seconds |"
            echo "| --- | ---: | ---: | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r artifact_name; do
            [ -z "$artifact_name" ] && continue
            artifact_id="$(jq -er --arg name "$artifact_name" '
              [.[].artifacts[] | select(.name == $name)]
              | if length == 1 and .[0].expired == false
                then .[0].id
                else error("expected exactly one non-expired planned artifact: " + $name)
                end
            ' coverage-artifacts.json)"
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            echo "downloading ${artifact_name}"
            rm -rf coverage-data
            mkdir -p coverage-data
            archive="coverage-data/artifact.zip"
            download_started=$SECONDS
            downloaded=false
            for attempt in 1 2; do
              if gh api \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
                > "$archive"; then
                downloaded=true
                break
              fi
              if [ "$attempt" -lt 2 ]; then
                echo "::warning::artifact download for ${artifact_name} failed; retrying"
                sleep 5
              fi
            done
            if [ "$downloaded" != "true" ]; then
              echo "::error::artifact download failed for ${artifact_name}"
              exit 1
            fi

            download_seconds=$((SECONDS - download_started))
            extract_started=$SECONDS
            member="coverage-${artifact_name#coverage-data-}.tar"
            if [ "$(unzip -Z1 "$archive")" != "$member" ]; then
              echo "::error::expected exactly ${member} in ${artifact_name}"
              exit 1
            fi
            zip_bytes="$(stat -c '%s' "$archive")"
            # The validated ZIP has one member; its directory records the exact
            # expanded tar size without a second decompression pass.
            tar_bytes="$(unzip -l "$archive" | tail -n 1 | awk '{print $1}')"
            [[ "$tar_bytes" =~ ^[0-9]+$ ]]
            echo "streaming ${member} from ${archive} (${zip_bytes} ZIP bytes, ${tar_bytes} tar bytes)"
            # Drain any tar end padding so unzip always reaches its CRC check.
            # pipefail propagates corrupt ZIPs AND tar extraction failures.
            unzip -p "$archive" "$member" | { tar -xpf - && cat > /dev/null; }
            extract_seconds=$((SECONDS - extract_started))
            echo "| ${artifact_name} | ${zip_bytes} | ${tar_bytes} | ${download_seconds} | ${extract_seconds} |" >> "$GITHUB_STEP_SUMMARY"
            rm -rf coverage-data
          done <<< "$artifact_names"

          find target/llvm-cov-target -name '*.profraw' -print
          test -n "$(find target/llvm-cov-target -name '*.profraw' -print -quit)"
          echo "Fan-in wall time: $((SECONDS - fanin_started)) seconds." >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED_SHARDS: ${{ needs.coverage-plan.outputs.shards }}

      - name: Generate coverage reports
        if: needs.coverage-plan.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          mkdir -p coverage-report
          cargo llvm-cov report \
            --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX" \
            --html \
            --output-dir coverage-report
          cargo llvm-cov report \
            --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX" \
            --lcov \
            --output-path coverage-report/lcov.info
          cargo llvm-cov report \
            --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX" \
            > coverage-report/summary.txt
          cargo llvm-cov report \
            --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX" \
            --json \
            --summary-only \
            --output-path coverage-report/coverage.json

      - name: Write coverage summary
        if: needs.coverage-plan.outputs.mode != 'skip'
        run: |
          set -euo pipefail

          overall=$(jq -r '
            [.data[].totals.lines] as $lines
            | (($lines | map(.covered) | add) // 0) as $covered
            | (($lines | map(.count) | add) // 0) as $count
            | if $count == 0 then "0.00" else (($covered / $count * 100 * 100 | round) / 100 | tostring) end
          ' coverage-report/coverage.json)

          rows='
            [.data[].files[]
              | {
                  file: (.filename | sub("^" + env.GITHUB_WORKSPACE + "/"; "") | gsub("[|]"; "\\|")),
                  covered: (.summary.lines.covered // 0),
                  count: (.summary.lines.count // 0)
                }
              | select(.count > 0)
              | .percent = (if .count == 0 then 0 else (.covered / .count * 100) end)
            ]
          '

          {
            echo "## Coverage Summary"
            echo ""
            echo "Overall line coverage: **${overall}%**"
            echo ""
            echo "### Lowest-covered files"
            echo ""
            echo "| File | Lines | Coverage |"
            echo "| --- | ---: | ---: |"
            jq -r "${rows} | sort_by(.percent, .count) | .[:20][] | \"| \(.file) | \(.covered)/\(.count) | \(((.percent * 100 | round) / 100))% |\"" coverage-report/coverage.json
            echo ""
            echo "### Highest-covered files"
            echo ""
            echo "| File | Lines | Coverage |"
            echo "| --- | ---: | ---: |"
            jq -r "${rows} | sort_by(-.percent, -.count) | .[:20][] | \"| \(.file) | \(.covered)/\(.count) | \(((.percent * 100 | round) / 100))% |\"" coverage-report/coverage.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check coverage thresholds
        if: needs.coverage-plan.outputs.mode != 'skip'
        run: |
          set -euo pipefail

          threshold_args=()
          if [ "$COVERAGE_MODE" = "full" ]; then
            threshold_args+=(
              --min-overall-line "$MIN_OVERALL_LINE_COVERAGE"
              --min-plugins-line "$MIN_PLUGINS_LINE_COVERAGE"
            )
          elif [ "$PLUGIN_GATE" = "true" ]; then
            threshold_args+=(--min-changed-plugins-line "$MIN_CHANGED_PLUGIN_LINE_COVERAGE")
          fi

          changed_base_args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="origin/${BASE_REF}"
            changed_base_args=(--changed-base "$base_ref")
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            if ! printf '%s' "$MERGE_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::merge_group base_sha missing or malformed" >&2
              exit 1
            fi
            if ! git cat-file -e "${MERGE_BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "${MERGE_BASE_SHA}"
            fi
            changed_base_args=(--changed-base "$MERGE_BASE_SHA")
          fi

          python3 scripts/check_coverage_thresholds.py \
            --coverage-json coverage-report/coverage.json \
            --lcov coverage-report/lcov.info \
            "${threshold_args[@]}" \
            "${changed_base_args[@]}"
        env:
          COVERAGE_MODE: ${{ needs.coverage-plan.outputs.mode }}
          PLUGIN_GATE: ${{ needs.coverage-plan.outputs.plugin_gate }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}

      - name: Upload coverage report
        if: always() && needs.coverage-plan.outputs.mode != 'skip'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30
          if-no-files-found: error
