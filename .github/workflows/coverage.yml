name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # From the latest completed default-branch coverage artifact available when
  # this gate was introduced: overall 210900/269397 lines (78.29%) and
  # src/plugins 54957/64665 lines (84.99%). Floors are rounded down to avoid
  # failing on floating-point presentation noise while still catching real drops.
  MIN_OVERALL_LINE_COVERAGE: "78.28"
  MIN_PLUGINS_LINE_COVERAGE: "84.98"
  MIN_CHANGED_PLUGIN_LINE_COVERAGE: "84.98"
  # cargo-llvm-cov applies this during report generation; v0.8.7 warns if it
  # is passed to --no-report collection commands.
  LLVM_COV_IGNORE_FILENAME_REGEX: "(vendor/|tests/|build\\.rs|target/|custom_plugins/|ebpf/|proto/)"

jobs:
  coverage-plan:
    name: Coverage Plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - id: plan
        name: Select coverage mode
        run: |
          set -euo pipefail

          mode=full
          reason="full coverage is required for ${EVENT_NAME}"
          changed_files="changed-files.txt"
          : > "$changed_files"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            mode=skip
            reason="no plugin coverage-relevant files changed"
            base_ref="origin/${BASE_REF}"
            git diff --name-only "${base_ref}...HEAD" > "$changed_files"

            plugin_pattern='^(\.github/workflows/coverage\.yml|scripts/check_coverage_thresholds\.py|src/plugin_cache\.rs|tests/functional/functional_redis_rate_limiting_test\.rs)$|^(src/plugins/|tests/unit/plugins/)'
            if grep -Eq "$plugin_pattern" "$changed_files"; then
              mode=plugin
              reason="plugin coverage-relevant files changed"
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"

          {
            echo "## Coverage Plan"
            echo ""
            echo "Mode: **${mode}**"
            echo ""
            echo "${reason}"
            if [ -s "$changed_files" ]; then
              echo ""
              echo "### Changed Files"
              echo ""
              while IFS= read -r path; do
                echo "- \`${path}\`"
              done < "$changed_files"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}

  coverage-shard:
    name: Coverage Shard (${{ matrix.shard }})
    needs: coverage-plan
    if: needs.coverage-plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: lib-unit
            kind: lib-unit
            filters: ""
          - shard: admin-api
            kind: integration
            filters: |
              integration::admin_api_specs_handler_tests
              integration::admin_db_api_specs_tests
              integration::admin_audit_rbac_tests
              integration::admin_backend_capabilities_tests
              integration::admin_runtime_metrics_tests
          - shard: admin-config
            kind: integration
            filters: |
              integration::admin_cached_config_tests
              integration::admin_cross_namespace_refs_tests
              integration::admin_mesh_config_drift_tests
              integration::admin_mesh_egress_scope_tests
              integration::admin_mesh_policy_denies_tests
              integration::admin_mesh_runtime_overlay_tests
              integration::admin_mesh_service_graph_tests
              integration::admin_node_waypoint_identities_tests
              integration::apply_incremental_outcome_tests
              integration::log_schema_integration_tests
              integration::log_schema_registry_tests
              integration::deferred_log_tests
          - shard: mesh-routing
            kind: integration
            filters: |
              integration::mesh_l7_routing_tests
              integration::mesh_topology_hbone_tests
              integration::mesh_authz_e2e_tests
              integration::mesh_authz_negative_match_tests
              integration::mesh_service_waypoint_tests
              integration::mesh_ew_egress_e2e_tests
              integration::mesh_destination_rule_tls_tests
              integration::mesh_destination_rule_locality_lb_tests
              integration::mesh_destination_rule_port_policy_tests
              integration::mesh_dr_service_entry_e2e_tests
              integration::mesh_sidecar_e2e_tests
          - shard: mesh-platform
            kind: integration
            filters: |
              integration::k8s_controller_istio_status_tests
              integration::mesh_telemetry_k8s_provider_lookup_tests
              integration::mesh_telemetry_tracing_tests
              integration::mesh_federation_poller_tests
              integration::mesh_proxy_config_tests
              integration::mesh_outbound_registry_stream_tests
              integration::mesh_runtime_overlay_consumers_tests
              integration::mesh_peer_auth_live_reload_tests
              integration::mesh_k8s_pod_discovery_tests
              integration::mesh_hbone_tests
              integration::cni_tests
          - shard: protocols-data-plane
            kind: integration
            filters: |
              integration::cp_dp_grpc_tests
              integration::cp_multi_namespace_tests
              integration::connection_pool_tests
              integration::http2_pool_tests
              integration::http3_integration_tests
              integration::grpc_proxy_tests
              integration::scripted_backend_smoke_tests
              integration::dtls_integration_tests
              integration::backend_mtls_tests
              integration::backend_tls_san_allow_list_tests
              integration::frontend_tls_live_reload_tests
              integration::tcp_frontend_tls_order_tests
              integration::tcp_fast_path_l4_plugins_tests
              integration::gateway_hbone_pool_tests
              integration::gateway_svid_identity_tests
              integration::graceful_shutdown_tests
              integration::db_full_load_snapshot_tests
              integration::db_incremental_poll_tests
              integration::db_offline_bootstrap_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-coverage"

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Install llvm tools
        run: rustup component add llvm-tools-preview

      - name: Clean stale coverage data
        run: cargo llvm-cov clean --workspace

      - name: Run lib and unit coverage
        if: matrix.kind == 'lib-unit'
        run: |
          set -euo pipefail
          cargo llvm-cov --no-report \
            --lib
          cargo llvm-cov --no-report \
            --test unit_tests
        env:
          RUST_BACKTRACE: 1

      - name: Run integration coverage shard
        if: matrix.kind == 'integration'
        run: |
          set -euo pipefail
          filters=()
          while IFS= read -r filter; do
            [ -z "$filter" ] && continue
            filters+=("$filter")
          done <<< "$INTEGRATION_FILTERS"
          cargo llvm-cov --no-report \
            nextest --test integration_tests \
            --no-fail-fast \
            "${filters[@]}"
        env:
          INTEGRATION_FILTERS: ${{ matrix.filters }}
          RUST_BACKTRACE: 1

      - name: Package coverage data
        run: |
          set -euo pipefail
          # `cargo llvm-cov report` only needs the *.profraw profile data and
          # the linked instrumented binaries. Ship just those in a tar and drop
          # the dependency rlibs/rmeta, codegen-unit .o files, dep-info, and the
          # incremental and fingerprint caches: report never reads them and they
          # are the bulk of the target dir. tar also preserves the Unix
          # executable bit that actions/upload-artifact's zip would otherwise
          # drop (actions/upload-artifact#38, actions/toolkit#1722), so the
          # merge job needs no chmod to make the binaries discoverable as object
          # files (cargo-llvm-cov's is_object requires `mode & 0o111 != 0`).
          find target/llvm-cov-target \
            -type d \( -name incremental -o -name .fingerprint \) -prune -o \
            -type f ! -name '*.rlib' ! -name '*.rmeta' ! -name '*.d' ! -name '*.o' -print \
            > coverage-files.txt
          echo "packaging $(grep -c '' coverage-files.txt) files ($(grep -c '\.profraw$' coverage-files.txt) profraw)"
          tar -cf "coverage-${{ matrix.shard }}.tar" -T coverage-files.txt
          ls -lh "coverage-${{ matrix.shard }}.tar"

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.tar
          retention-days: 1
          if-no-files-found: error

  coverage-merge:
    name: Merge Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - coverage-plan
      - coverage-shard
    if: always()
    steps:
      - name: Fail when coverage planning fails
        if: needs.coverage-plan.result != 'success'
        run: exit 1

      - name: Skip coverage for unrelated PR changes
        if: needs.coverage-plan.outputs.mode == 'skip'
        run: |
          {
            echo "## Coverage Gate"
            echo ""
            echo "No plugin coverage-relevant files changed in this PR."
            echo "Full coverage still runs on pushes to main, manual dispatch, and schedule."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when full coverage shards fail
        if: needs.coverage-plan.outputs.mode == 'full' && needs.coverage-shard.result != 'success'
        run: exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: needs.coverage-plan.outputs.mode != 'skip'
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust-ci
        if: needs.coverage-plan.outputs.mode != 'skip'
        with:
          shared-key: "ci-coverage"

      - name: Install cargo-llvm-cov
        if: needs.coverage-plan.outputs.mode != 'skip'
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2
        with:
          tool: cargo-llvm-cov

      - name: Install llvm tools
        if: needs.coverage-plan.outputs.mode != 'skip'
        run: rustup component add llvm-tools-preview

      - name: Run PR plugin coverage
        if: needs.coverage-plan.outputs.mode == 'plugin'
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report \
            --lib
          cargo llvm-cov --no-report \
            --test unit_tests
        env:
          RUST_BACKTRACE: 1

      - name: Download coverage data
        if: needs.coverage-plan.outputs.mode == 'full'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Extract coverage data
        if: needs.coverage-plan.outputs.mode == 'full'
        run: |
          set -euo pipefail
          # Each shard tar holds *.profraw plus the instrumented binaries with
          # their executable bit intact (see the shard "Package coverage data"
          # step), so cargo-llvm-cov can collect them as object files without a
          # chmod. Binaries shared across shards (e.g. the integration_tests
          # binary) are identical and simply overwrite.
          shopt -s nullglob
          archives=(coverage-data/*.tar)
          test "${#archives[@]}" -gt 0
          for archive in "${archives[@]}"; do
            echo "extracting ${archive}"
            tar -xpf "${archive}"
          done
          find target/llvm-cov-target -name '*.profraw' -print
          test -n "$(find target/llvm-cov-target -name '*.profraw' -print -quit)"

      - name: Generate coverage reports
        if: needs.coverage-plan.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          mkdir -p coverage-report
          cargo llvm-cov report \
            --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX" \
            --html \
            --output-dir coverage-report
          cargo llvm-cov report \
            --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX" \
            --lcov \
            --output-path coverage-report/lcov.info
          cargo llvm-cov report \
            --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX" \
            > coverage-report/summary.txt
          cargo llvm-cov report \
            --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX" \
            --json \
            --summary-only \
            --output-path coverage-report/coverage.json

      - name: Write coverage summary
        if: needs.coverage-plan.outputs.mode != 'skip'
        run: |
          set -euo pipefail

          overall=$(jq -r '
            [.data[].totals.lines] as $lines
            | (($lines | map(.covered) | add) // 0) as $covered
            | (($lines | map(.count) | add) // 0) as $count
            | if $count == 0 then "0.00" else (($covered / $count * 100 * 100 | round) / 100 | tostring) end
          ' coverage-report/coverage.json)

          rows='
            [.data[].files[]
              | {
                  file: (.filename | sub("^" + env.GITHUB_WORKSPACE + "/"; "") | gsub("[|]"; "\\|")),
                  covered: (.summary.lines.covered // 0),
                  count: (.summary.lines.count // 0)
                }
              | select(.count > 0)
              | .percent = (if .count == 0 then 0 else (.covered / .count * 100) end)
            ]
          '

          {
            echo "## Coverage Summary"
            echo ""
            echo "Overall line coverage: **${overall}%**"
            echo ""
            echo "### Lowest-covered files"
            echo ""
            echo "| File | Lines | Coverage |"
            echo "| --- | ---: | ---: |"
            jq -r "${rows} | sort_by(.percent, .count) | .[:20][] | \"| \(.file) | \(.covered)/\(.count) | \(((.percent * 100 | round) / 100))% |\"" coverage-report/coverage.json
            echo ""
            echo "### Highest-covered files"
            echo ""
            echo "| File | Lines | Coverage |"
            echo "| --- | ---: | ---: |"
            jq -r "${rows} | sort_by(-.percent, -.count) | .[:20][] | \"| \(.file) | \(.covered)/\(.count) | \(((.percent * 100 | round) / 100))% |\"" coverage-report/coverage.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check coverage thresholds
        if: needs.coverage-plan.outputs.mode != 'skip'
        run: |
          set -euo pipefail

          threshold_args=()
          if [ "$COVERAGE_MODE" = "full" ]; then
            threshold_args+=(
              --min-overall-line "$MIN_OVERALL_LINE_COVERAGE"
              --min-plugins-line "$MIN_PLUGINS_LINE_COVERAGE"
            )
          else
            threshold_args+=(--min-changed-plugins-line "$MIN_CHANGED_PLUGIN_LINE_COVERAGE")
          fi

          changed_base_args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="origin/${BASE_REF}"
            changed_base_args=(--changed-base "$base_ref")
          fi

          python3 scripts/check_coverage_thresholds.py \
            --coverage-json coverage-report/coverage.json \
            --lcov coverage-report/lcov.info \
            "${threshold_args[@]}" \
            "${changed_base_args[@]}"
        env:
          COVERAGE_MODE: ${{ needs.coverage-plan.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}

      - name: Upload coverage report
        if: always() && needs.coverage-plan.outputs.mode != 'skip'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30
          if-no-files-found: error
