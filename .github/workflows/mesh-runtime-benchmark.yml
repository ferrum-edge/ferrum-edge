# Mesh runtime head-to-head benchmark: Ferrum Edge running as a service-mesh
# data plane vs other mesh data planes in the same environment.
#
# Every arm runs an HTTP/1.1 echo workload (H1 -> HTTP/2-over-mTLS -> H1
# through the proxy pair) at 6 payload sizes (1KiB, 10KiB, 70KiB, 500KiB,
# 1MiB, 5MiB). All arms run sequentially on ONE ubuntu-26.04 runner in the
# fixed order direct -> ferrum -> envoy -> linkerd, so overhead is computed
# against a same-runner direct baseline (per-arm runners would make the
# direct denominator a different machine).
#
# Arms:
#   direct  : no proxies (same-runner overhead baseline)
#   ferrum  : 2x ferrum-edge FERRUM_MODE=mesh Sidecar, localized file
#             config + file SVIDs, STRICT PeerAuthentication (real mesh
#             runtime, no control plane needed)
#   envoy   : 2x envoyproxy/envoy hand-configured H2/mTLS pair (the Istio
#             sidecar data-plane proxy; a static proxy control labeled
#             Envoy, not full Istio: no istiod, telemetry, or Wasm)
#   linkerd : 2x ghcr.io/linkerd/proxy standalone probe. linkerd2-proxy
#             requires the Destination control-plane service, so this arm
#             records `unsupported-standalone` with logs when that
#             evidence appears; it never fabricates numbers. Full-mesh
#             (kind) comparison is the Tier-2 follow-up in
#             docs/mesh_runtime_benchmark.md.
#
# Dispatch inputs reach steps only through env (never interpolated into
# shell source). Every computation beyond a literal command lives in
# .github/scripts/summarize_mesh_runtime_results.py; keep inline
# interpreter bodies out of this file (trusted Cross build policy).
# The default 10s x 1-iteration profile is a smoke run; use
# duration=30 + iterations=3 for publishable comparisons.

name: Mesh Runtime Benchmark

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Load duration per payload size (seconds)"
        required: false
        default: "10"
        type: string
      concurrency:
        description: "Concurrent keep-alive connections (bulk sizes scale down)"
        required: false
        default: "100"
        type: string
      iterations:
        description: "Iterations per (mesh, payload) — median reported"
        required: false
        default: "1"
        type: choice
        options: ["1", "3"]
      skip_meshes:
        description: "Space-separated arms to skip (direct ferrum envoy linkerd)"
        required: false
        default: ""
        type: string
      skip_payload_sizes:
        description: "Space-separated payload sizes (bytes) to skip"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: mesh-runtime-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  BENCH_DURATION: ${{ inputs.duration }}
  BENCH_CONCURRENCY: ${{ inputs.concurrency }}
  BENCH_ITERATIONS: ${{ inputs.iterations }}
  BENCH_SKIP_MESHES: ${{ inputs.skip_meshes }}
  BENCH_SKIP_PAYLOAD_SIZES: ${{ inputs.skip_payload_sizes }}

jobs:
  benchmark:
    name: Mesh runtime benchmark
    runs-on: ubuntu-26.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Verify summarizer contract (static)
        run: |
          python3 .github/scripts/summarize_mesh_runtime_results.py --self-test
          python3 -m py_compile .github/scripts/summarize_mesh_runtime_results.py

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl sysstat

      - name: Runner health check
        run: |
          echo "=== CPU ==="
          nproc
          lscpu | grep -E 'Model name|Socket|MHz|Hypervisor' || true
          echo ""
          echo "=== CPU steal (5s) ==="
          vmstat 1 6 | tail -n 5
          echo ""
          echo "=== Memory ==="
          free -h
          echo ""
          echo "=== Docker ==="
          docker version --format '{{.Server.Version}}' || true

      - name: Compute mesh + payload lists
        id: plan
        run: |
          all_meshes="direct ferrum envoy linkerd"
          meshes=""
          for m in $all_meshes; do
            case " $BENCH_SKIP_MESHES " in
              *" $m "*) ;;
              *) meshes="$meshes $m" ;;
            esac
          done
          all_sizes="1024 10240 71680 512000 1048576 5242880"
          sizes=""
          for sz in $all_sizes; do
            case " $BENCH_SKIP_PAYLOAD_SIZES " in
              *" $sz "*) ;;
              *) sizes="$sizes $sz" ;;
            esac
          done
          meshes=$(echo "$meshes" | xargs)
          sizes=$(echo "$sizes" | xargs)
          echo "meshes=$meshes" >> "$GITHUB_OUTPUT"
          echo "payload_sizes=$sizes" >> "$GITHUB_OUTPUT"
          echo "Arms: $meshes"
          echo "Payload sizes: $sizes"

      - name: Set up Docker Buildx
        if: contains(steps.plan.outputs.meshes, 'ferrum')
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Ferrum Docker image
        if: contains(steps.plan.outputs.meshes, 'ferrum')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: ferrum-edge:bench
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run benchmark (all arms, sequential, same runner)
        timeout-minutes: 150
        env:
          MESHES: ${{ steps.plan.outputs.meshes }}
          PAYLOAD_SIZES: ${{ steps.plan.outputs.payload_sizes }}
          FERRUM_IMAGE: ferrum-edge:bench
        run: |
          mkdir -p results
          {
            echo "sha=${GITHUB_SHA}"
            echo "runner=ubuntu-26.04"
            date -u +%Y-%m-%dT%H:%M:%SZ
            nproc
            uname -a
            docker version --format '{{.Server.Version}}' || true
            docker image inspect ferrum-edge:bench --format 'ferrum {{.Id}}' || true
          } > results/host-facts.txt
          for mesh in $MESHES; do
            for run in $(seq 1 "$BENCH_ITERATIONS"); do
              echo ""
              echo "============================================"
              echo "  ARM ${mesh} — RUN ${run}/${BENCH_ITERATIONS}"
              echo "============================================"
              run_dir="results/${mesh}/run_${run}"
              mkdir -p "$run_dir"
              extra_flags=""
              # Tools + Ferrum images are built by the first arm run.
              if [ -f results/.tools-built ]; then extra_flags="--skip-build"; fi
              bash tests/performance/mesh_runtime/run_mesh_runtime_bench.sh \
                "$mesh" \
                --payload-sizes "$PAYLOAD_SIZES" \
                --duration "$BENCH_DURATION" \
                --concurrency "$BENCH_CONCURRENCY" \
                --output-dir "$run_dir" \
                $extra_flags \
                2>&1 | tee "$run_dir/run.log" || true
              touch results/.tools-built
            done
          done

      - name: Force-cleanup any leaked containers
        if: always()
        run: |
          docker ps -aq --filter "name=meshbench-" | xargs -r docker rm -f 2>/dev/null || true

      - name: Render combined summary
        if: always()
        run: |
          python3 .github/scripts/summarize_mesh_runtime_results.py \
            --results-root results \
            --output results/summary.json \
            --summary-md results/summary.md \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mesh-runtime-bench-${{ github.sha }}
          # Runtime dirs hold single-run throwaway key material generated
          # by the harness; logs/ and result JSON are uploaded instead.
          path: |
            results
            !results/**/runtime/**
          retention-days: 90

      # Acceptance is independent of rendering/upload: missing or error
      # cells in any required arm fail the run even though artifacts were
      # preserved above.
      - name: Enforce campaign acceptance
        if: always()
        run: |
          python3 .github/scripts/summarize_mesh_runtime_results.py \
            --check-acceptance --output results/summary.json
