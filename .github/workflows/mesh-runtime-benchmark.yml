# One prespecified latest-main tail confirmation; all128 planned cells retained.
# Registered workflow path reused on this experiment branch; no release gate.
name: Mesh Runtime Benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mesh-tail-confirmation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  confirmation:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      RUSTFLAGS: ""
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check confirmation contracts
        run: |
          python3 -m unittest discover -s tests/performance/mesh_runtime/tests -p 'test_*.py'
          python3 -m unittest discover -s tests/performance/multi_protocol/tests -p test_gateway_regression.py
          bash -n .github/scripts/mesh_tail_confirmation.sh tests/performance/multi_protocol/run_gateway_protocol_bench.sh
      - name: Install common harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl sysstat protobuf-compiler libssl-dev lsof
      - name: Build exact baseline and candidate images and common mesh tools
        timeout-minutes: 120
        run: bash .github/scripts/mesh_tail_confirmation.sh build
      - name: Build standalone native protocol tools only
        timeout-minutes: 15
        run: |
          set -euo pipefail
          unset CARGO_TARGET_DIR
          rustc -Vv > results/images/proto-tools-rustc.txt
          cargo -Vv > results/images/proto-tools-cargo.txt
          cargo build --locked --release --manifest-path tests/performance/multi_protocol/Cargo.toml \
            --bin proto_bench --bin proto_backend 2>&1 | tee results/images/proto-tools.build.log
      - name: Run interleaved AA and AB confirmation (all128 planned cells)
        timeout-minutes: 100
        run: python3 -u .github/scripts/mesh_tail_confirmation.py run
      - name: Render every planned result and failure
        if: always()
        run: |
          python3 .github/scripts/mesh_tail_confirmation.py check || true
          cat results/confirmation/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve all raw confirmation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mesh-tail-confirmation-${{ github.sha }}
          path: |
            results
            !results/**/runtime/**
          retention-days: 90
      - name: Require complete valid evidence (no performance equivalence claim)
        if: always()
        run: python3 .github/scripts/mesh_tail_confirmation.py check
