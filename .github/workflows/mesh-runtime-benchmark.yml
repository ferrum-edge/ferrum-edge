# Experiment branch only: immutable shipping images, remote load tools.
name: Mesh Runtime Benchmark
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Qualification, production ranking, or labeled H1 idle-cap configuration diagnostic"
        type: choice
        default: smoke-l7
        options: [smoke-l7, smoke, smoke-fixed, ranking, h1-idle-diagnostic, symbols, profile-envoy, ferrum-symbol-canary, profile-ferrum, gap-vendor-preflight, gap-checks, gap-telemetry-reproduce]
      candidate_sha:
        description: "Exact reviewed 40-hex candidate commit; required for gap phases"
        type: string
        default: ""
      candidate_kind:
        description: "Fixed correctness test allowlist; telemetry never builds performance images"
        type: choice
        default: h2-handoff
        options: [h2-handoff, header-boundary, telemetry-reproduce]
permissions:
  contents: read
concurrency:
  group: mesh-runtime-benchmark-${{ github.ref }}-${{ inputs.phase }}
  cancel-in-progress: false
env:
  BENCH_PHASE: ${{ inputs.phase }}
jobs:
  benchmark:
    name: Production mesh qualification and ranking
    if: ${{ !startsWith(inputs.phase, 'gap-') && inputs.phase != 'symbols' && inputs.phase != 'profile-envoy' && inputs.phase != 'ferrum-symbol-canary' && inputs.phase != 'profile-ferrum' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install read-only observation and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl sysstat binutils iproute2 iptables
      - name: Record runner environment
        run: |
          mkdir -p results
          lscpu > results/lscpu.txt
          free -b > results/memory.txt
          docker version > results/docker-version.txt
          vmstat 1 6 > results/host-before.txt
      - name: Validate and prepare pinned production images and load tools
        timeout-minutes: 25
        run: bash .github/scripts/mesh_production_campaign.sh prepare
      - name: Measure prescribed campaign
        timeout-minutes: 120
        run: bash .github/scripts/mesh_production_campaign.sh measure
      - name: Cleanup fixture containers
        if: always()
        run: |
          mapfile -t leaked < <(docker ps -aq --filter "label=ferrum.meshbench.owner=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [ "${#leaked[@]}" -gt 0 ]; then docker rm -f "${leaked[@]}" 2>/dev/null || true; fi
      - name: Render complete evidence ledger
        if: always()
        run: python3 .github/scripts/mesh_production_campaign.py summarize >> "$GITHUB_STEP_SUMMARY"
      - name: Retain all outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mesh-production-${{ inputs.phase }}-${{ github.sha }}
          path: |
            results
            !results/**/runtime/**
          retention-days: 30
      - name: Require valid complete campaign
        if: always()
        run: python3 .github/scripts/mesh_production_campaign.py accept
  symbol-preflight:
    name: Qualify Envoy production symbol companion
    if: inputs.phase == 'symbols'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Match bounded symbol package to pinned production code
        run: bash .github/scripts/mesh_production_profile_symbols.sh "$RUNNER_TEMP/mesh-symbol-preflight"
      - name: Retain symbol identity report without multi-gigabyte binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mesh-symbol-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mesh-symbol-preflight/report.json
            ${{ runner.temp }}/mesh-symbol-preflight/resolved-images.json
            ${{ runner.temp }}/mesh-symbol-preflight/production/*manifest*.json
            ${{ runner.temp }}/mesh-symbol-preflight/debug/*manifest*.json
          retention-days: 30
  profile-envoy:
    name: Qualify shipping Envoy CPU leaf observer
    if: inputs.phase == 'profile-envoy'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install bounded sampling and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl sysstat binutils iproute2 iptables linux-perf linux-tools-generic linux-tools-common
          mkdir -p results
          lscpu > results/lscpu.txt
          free -b > results/memory.txt
      - name: Prepare production images and verified companion
        timeout-minutes: 25
        run: bash .github/scripts/mesh_production_profile_campaign.sh prepare
      - name: Measure controls and leaf observer
        timeout-minutes: 15
        run: bash .github/scripts/mesh_production_profile_campaign.sh measure
      - name: Cleanup this run's labeled fixture containers
        if: always()
        run: |
          mapfile -t leaked < <(docker ps -aq --filter "label=ferrum.meshbench.owner=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [ "${#leaked[@]}" -gt 0 ]; then docker rm -f "${leaked[@]}" 2>/dev/null || true; fi
      - name: Render full observer qualification
        if: always()
        run: python3 .github/scripts/mesh_production_profile_campaign.py >> "$GITHUB_STEP_SUMMARY"
      - name: Stage only public profile artifacts
        if: always()
        run: python3 .github/scripts/mesh_production_profile_campaign.py export
      - name: Retain raw samples and identity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mesh-profile-envoy-${{ github.sha }}
          path: results/profile-public
          retention-days: 30
      - name: Require observer qualification
        if: always()
        run: python3 .github/scripts/mesh_production_profile_campaign.py accept
  ferrum-symbol-canary:
    name: Qualify unchanged-profile Ferrum symbol capture
    if: inputs.phase == 'ferrum-symbol-canary'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Verify helper contracts
        run: |
          python3 .github/scripts/mesh_production_profile_linker_test.py
          python3 .github/scripts/mesh_production_profile_ferrum_test.py
      - name: Run tiny link-equivalence canary in pinned builder
        timeout-minutes: 16
        run: bash .github/scripts/mesh_production_profile_ferrum.sh canary "$RUNNER_TEMP/ferrum-symbol-canary"
      - name: Retain all canary receipts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ferrum-symbol-canary-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ferrum-symbol-canary/report.json
            ${{ runner.temp }}/ferrum-symbol-canary/*.stdout
            ${{ runner.temp }}/ferrum-symbol-canary/*.stderr
            ${{ runner.temp }}/ferrum-symbol-canary/canary/*.log
            ${{ runner.temp }}/ferrum-symbol-canary/canary/capture/**/*.json
          retention-days: 30

  profile-ferrum:
    name: Qualify shipping Ferrum symbols and CPU leaf observer
    if: inputs.phase == 'profile-ferrum'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      BENCH_PROFILE_ARM: ferrum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install bounded sampling and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl sysstat binutils iproute2 iptables linux-perf linux-tools-generic linux-tools-common
          mkdir -p results
          lscpu > results/lscpu.txt
          free -b > results/memory.txt
      - name: Require unchanged-profile canary before full build
        timeout-minutes: 16
        run: bash .github/scripts/mesh_production_profile_ferrum.sh canary "$RUNNER_TEMP/ferrum-symbol-canary"
      - name: Capture companion and prove shipping code equivalence
        timeout-minutes: 133
        run: bash .github/scripts/mesh_production_profile_ferrum.sh qualify "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ferrum-symbol-full" "$RUNNER_TEMP/ferrum-symbol-canary/report.json"
      - name: Prepare unchanged shipping image and load tools
        env:
          BENCH_SYMBOL_ELF: ${{ runner.temp }}/ferrum-symbol-full/capture/ferrum-edge/symbols
          BENCH_SYMBOL_REPORT: ${{ runner.temp }}/ferrum-symbol-full/report.json
        timeout-minutes: 25
        run: bash .github/scripts/mesh_production_profile_campaign.sh prepare
      - name: Measure controls and leaf observer
        env:
          BENCH_SYMBOL_ELF: ${{ runner.temp }}/ferrum-symbol-full/capture/ferrum-edge/symbols
          BENCH_SYMBOL_REPORT: ${{ runner.temp }}/ferrum-symbol-full/report.json
        timeout-minutes: 15
        run: bash .github/scripts/mesh_production_profile_campaign.sh measure
      - name: Cleanup this run's labeled fixture containers
        if: always()
        run: |
          mapfile -t leaked < <(docker ps -aq --filter "label=ferrum.meshbench.owner=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [ "${#leaked[@]}" -gt 0 ]; then docker rm -f "${leaked[@]}" 2>/dev/null || true; fi
      - name: Render full observer qualification
        if: always()
        run: python3 .github/scripts/mesh_production_profile_campaign.py >> "$GITHUB_STEP_SUMMARY"
      - name: Stage only public profile artifacts
        if: always()
        run: python3 .github/scripts/mesh_production_profile_campaign.py export
      - name: Retain raw samples and bounded qualification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mesh-profile-ferrum-${{ github.sha }}
          path: |
            results/profile-public
            ${{ runner.temp }}/ferrum-symbol-canary/report.json
            ${{ runner.temp }}/ferrum-symbol-canary/*.stderr
            ${{ runner.temp }}/ferrum-symbol-canary/canary/*.log
            ${{ runner.temp }}/ferrum-symbol-canary/canary/capture/**/*.json
            ${{ runner.temp }}/ferrum-symbol-full/report.json
            ${{ runner.temp }}/ferrum-symbol-full/*.stderr
            ${{ runner.temp }}/ferrum-symbol-full/Dockerfile.*
            ${{ runner.temp }}/ferrum-symbol-full/capture/**/*.json
          retention-days: 30
      - name: Require observer qualification
        if: always()
        run: python3 .github/scripts/mesh_production_profile_campaign.py accept

  gap-checks:
    name: Exact candidate correctness or explicitly labeled preflight
    if: startsWith(inputs.phase, 'gap-')
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      GAP_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      GAP_CANDIDATE_KIND: ${{ inputs.candidate_kind }}
      RUSTFLAGS: ""
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact inputs before setup
        run: |
          python3 -c 'import sys; sys.path.insert(0, ".github/scripts"); from mesh_gap_candidate import selection; print(selection())'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libcurl4-openssl-dev protobuf-compiler clang libclang-dev cmake openssl mold
      - name: Run only the selected fixed check plan
        run: python3 -u .github/scripts/mesh_gap_checks.py
      - name: Retain checks and generated manifest without build trees
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mesh-gap-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/gap/checks
          retention-days: 30
