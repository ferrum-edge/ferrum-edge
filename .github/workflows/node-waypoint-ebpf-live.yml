name: NodeWaypoint eBPF Live Datapath

on:
  workflow_dispatch:
    inputs:
      force_cold_cache:
        description: Skip BuildKit cache restore to prove cold-path image contracts
        type: boolean
        default: false
  # No workflow-level `paths:` filter (issue #3908). A `paths:` list lives in
  # the pull request's own checkout, so the same commit that breaks the
  # NodeWaypoint datapath could delete its trigger and skip this suite. The
  # workflow now starts on every event and relevance is decided by the
  # trusted-base `production-dockerfile-plan` job below, which reads
  # `ci_runtime_plan.py` from the base branch.
  pull_request:
  merge_group:
    types:
      - checks_requested
  # Queue entries are COMBINED commits: two individually green pull requests
  # can interact in the chart/image/eBPF surfaces this suite covers. Running on
  # merge_group re-evaluates the combination, and running on the main push
  # surfaces a queue-combined regression immediately rather than on whichever
  # later pull request happens to touch the same paths.
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel a superseded PR/main run on rapid re-push. Merge-group runs are keyed
# by the synthesized head so a queue entry never cancels a pull-request run, and
# manual dispatches share one lane and run to completion.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('node-waypoint-ebpf-live-pr-{0}', github.event.pull_request.number) || (github.event_name == 'merge_group' && format('node-waypoint-ebpf-live-merge-group-{0}', github.event.merge_group.head_sha) || (github.event_name == 'push' && format('node-waypoint-ebpf-live-{0}', github.ref) || 'node-waypoint-ebpf-live-shared')) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  FERRUM_IMAGE_REPOSITORY: ferrum-edge
  FERRUM_IMAGE_TAG: node-waypoint-ebpf-live
  KIND_CLUSTER: ferrum-ebpf-live
  ISTIO_VERSION: 1.24.3
  # Commit behind the signed Istio 1.24.3 release tag.
  ISTIO_COMMIT_SHA: 44d0e58e49d0dc89e27fc4f8679c68132d46b887
  ISTIO_CRD_SHA256: 952afcf4b1bf47d2bdf1f230d636f9e613c3ee9cc68ef53ab751f6d59e2ee205
  FERRUM_CI_FORCE_COLD_CACHE: ${{ github.event.inputs.force_cold_cache == 'true' }}

jobs:
  production-dockerfile-plan:
    name: Production Dockerfile smoke trigger
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      node_waypoint_relevant: ${{ steps.filter.outputs.node_waypoint_relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for production Dockerfile smoke changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          filter_path=.github/scripts/ci_runtime_plan.py
          changed_files="$RUNNER_TEMP/production-dockerfile-smoke-changed-files.txt"
          trusted_filter="$RUNNER_TEMP/production-dockerfile-smoke-trusted-filter.py"
          rm -f -- "$changed_files" "$trusted_filter"
          : > "$changed_files"

          filter_args=(--changed-files "$changed_files")

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! printf '%s' "$BASE_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$'; then
              echo "::error::refusing to resolve an unsafe base ref" >&2
              exit 1
            fi
            case "$BASE_REF" in
              *..*|*//*|*/|*.lock|*/.*)
                echo "::error::refusing to resolve an unsafe base ref" >&2
                exit 1
                ;;
            esac
            fetched=false
            for attempt in 1 2 3; do
              if git fetch --no-tags --no-recurse-submodules origin \
                "+refs/heads/${BASE_REF}:refs/ferrum/trusted-base"; then
                fetched=true
                break
              fi
              echo "git fetch of ${BASE_REF} failed (attempt ${attempt}/3); retrying" >&2
              sleep $(( attempt * 10 ))
            done
            if [ "$fetched" != true ]; then
              echo "::error::git fetch of ${BASE_REF} failed after 3 attempts" >&2
              exit 1
            fi
            trusted_sha="$(git rev-parse --verify --quiet refs/ferrum/trusted-base^{commit} || true)"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            if ! printf '%s' "$MERGE_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::merge_group base_sha missing or malformed" >&2
              exit 1
            fi
            if ! git cat-file -e "${MERGE_BASE_SHA}^{commit}" 2>/dev/null; then
              fetched=false
              for attempt in 1 2 3; do
                if git fetch --no-tags --no-recurse-submodules origin \
                  "${MERGE_BASE_SHA}"; then
                  fetched=true
                  break
                fi
                echo "git fetch of merge_group base failed (attempt ${attempt}/3); retrying" >&2
                sleep $(( attempt * 10 ))
              done
              if [ "$fetched" != true ]; then
                echo "::error::git fetch of merge_group base_sha failed after 3 attempts" >&2
                exit 1
              fi
            fi
            trusted_sha="$MERGE_BASE_SHA"
          else
            trusted_sha="$(git rev-parse --verify --quiet 'HEAD^{commit}' || true)"
            filter_args+=(--force-run)
          fi

          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::trusted base did not resolve to a full commit id" >&2
            exit 1
          fi

          if ! git cat-file -e "${trusted_sha}:${filter_path}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "node_waypoint_relevant=true" >> "$GITHUB_OUTPUT"
            echo "trusted base has not adopted ${filter_path}; running the full gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          entry="$(git ls-tree --full-tree "$trusted_sha" -- "$filter_path")"
          if [ "$(printf '%s\n' "$entry" | grep -c . || true)" != "1" ]; then
            echo "::error::${filter_path} is not a single tree entry at ${trusted_sha}" >&2
            exit 1
          fi
          entry_mode="$(printf '%s\n' "$entry" | awk '{print $1}')"
          entry_type="$(printf '%s\n' "$entry" | awk '{print $2}')"
          entry_object="$(printf '%s\n' "$entry" | awk '{print $3}')"
          entry_path="$(printf '%s\n' "$entry" | awk -F'\t' '{print $2}')"
          if [ "$entry_type" != "blob" ] || [ "$entry_path" != "$filter_path" ]; then
            echo "::error::${filter_path} is not a blob at ${trusted_sha}" >&2
            exit 1
          fi
          case "$entry_mode" in
            100644|100755) ;;
            *)
              echo "::error::${filter_path} has non-regular mode ${entry_mode}" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$entry_object" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::${filter_path} did not resolve to an object id" >&2
            exit 1
          fi
          if [ "$(git cat-file -s "$entry_object")" -gt 262144 ]; then
            echo "::error::${filter_path} exceeds the 256 KiB trusted-filter ceiling" >&2
            exit 1
          fi
          git cat-file blob "$entry_object" > "$trusted_filter"

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            git diff --name-only --no-renames -z "${trusted_sha}...HEAD" \
              > "$changed_files"
          fi

          python3 -I "$trusted_filter" --self-test

          emit_suite_verdict() {
            local suite="$1"
            local output_key="$2"
            local plan relevant
            plan="$(python3 -I "$trusted_filter" --suite "$suite" "${filter_args[@]}")"
            relevant="$(printf '%s\n' "$plan" | sed -n 's/^relevant=//p')"
            case "$relevant" in
              true|false) ;;
              *)
                echo "::error::trusted ${suite} relevance filter produced no usable verdict" >&2
                exit 1
                ;;
            esac
            echo "${output_key}=$relevant" >> "$GITHUB_OUTPUT"
            echo "Relevance (${suite}) decided by trusted base ${trusted_sha}." >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$plan" | sed -n '/^## /,$p' >> "$GITHUB_STEP_SUMMARY"
          }

          emit_suite_verdict production-dockerfile-smoke relevant
          emit_suite_verdict node-waypoint-ebpf-live node_waypoint_relevant

  production-dockerfile-smoke-default:
    name: Production Dockerfile default image (registry reader)
    needs: production-dockerfile-plan
    if: needs.production-dockerfile-plan.outputs.relevant == 'true' && !(github.repository == 'ferrum-edge/ferrum-edge' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Record registry cache policy
        if: github.event.inputs.force_cold_cache != 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name buildkit-registry \
            --note "scope=production-dockerfile-smoke-default policy=anonymous-restore-only; actual layer reuse is reported by BuildKit"

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name buildkit-registry \
            --hit false \
            --bytes 0 \
            --note "scope=production-dockerfile-smoke-default policy=force-cold skipped import and export"

      - name: Time image build
        run: python3 .github/scripts/ci_runtime_telemetry.py start --phase image-build

      - name: Build ordinary production runtime with registry cache
        if: github.event.inputs.force_cold_cache != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          build-args: |
            CARGO_PROFILE=pr-build
          load: true
          tags: ferrum-edge:production-default-smoke
          provenance: false
          cache-from: type=registry,ref=ghcr.io/ferrum-edge/ferrum-edge-buildcache:default-v1-linux-amd64-runtime

      - name: Build ordinary production runtime (cold cache)
        if: github.event.inputs.force_cold_cache == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          build-args: |
            CARGO_PROFILE=pr-build
          load: true
          tags: ferrum-edge:production-default-smoke
          provenance: false

      - name: Finish image build timer
        if: always()
        run: python3 .github/scripts/ci_runtime_telemetry.py end --phase image-build --status ${{ job.status == 'success' && '0' || '1' }}

      - name: Verify ordinary distroless runtime contract
        run: |
          set -euo pipefail
          python3 .github/scripts/ci_runtime_telemetry.py start --phase ordinary-inventory
          ordinary_image=ferrum-edge:production-default-smoke
          docker run --rm --entrypoint /app/ferrum-edge "$ordinary_image" version

          inventory_image() {
            image="$1"
            output="$2"
            container="$(docker create "$image")"
            docker export "$container" | tar -tf - | sed -e 's#^\./##' -e 's#^/##' > "$output"
            docker rm "$container" >/dev/null
          }
          inventory_image "$ordinary_image" ordinary-runtime-files.txt

          grep -Fxq app/ferrum-edge ordinary-runtime-files.txt
          if grep -Fxq usr/sbin/ip ordinary-runtime-files.txt; then
            echo "ordinary runtime unexpectedly contains eBPF-only /usr/sbin/ip" >&2
            exit 1
          fi

          for forbidden in \
            bin/sh usr/bin/sh bin/bash usr/bin/bash bin/dash usr/bin/dash \
            bin/ash usr/bin/ash bin/zsh usr/bin/zsh bin/ksh usr/bin/ksh \
            bin/busybox usr/bin/busybox sbin/apk usr/sbin/apk usr/bin/apk \
            usr/bin/apt usr/bin/apt-cache usr/bin/apt-get \
            usr/bin/dpkg usr/bin/dpkg-query usr/bin/rpm usr/bin/yum \
            usr/bin/dnf usr/bin/microdnf usr/sbin/iptables \
            usr/sbin/ip6tables usr/sbin/nft; do
            if grep -Fxq "$forbidden" ordinary-runtime-files.txt; then
              echo "forbidden runtime tool is present: /$forbidden" >&2
              exit 1
            fi
          done
          python3 .github/scripts/ci_runtime_telemetry.py end --phase ordinary-inventory --status 0

      - name: Summarize ordinary image runtime
        if: always()
        run: python3 .github/scripts/ci_runtime_telemetry.py summarize --title "Production Dockerfile default image"

  production-dockerfile-smoke-default-write:
    name: Production Dockerfile default image (registry writer)
    needs: production-dockerfile-plan
    if: needs.production-dockerfile-plan.outputs.relevant == 'true' && (github.repository == 'ferrum-edge/ferrum-edge' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Log in to cache registry
        if: github.event.inputs.force_cold_cache != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Record registry cache policy
        if: github.event.inputs.force_cold_cache != 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name buildkit-registry \
            --note "scope=production-dockerfile-smoke-default policy=trusted-main-publish; actual layer reuse is reported by BuildKit"

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name buildkit-registry \
            --hit false \
            --bytes 0 \
            --note "scope=production-dockerfile-smoke-default policy=force-cold skipped import and export"

      - name: Time image build
        run: python3 .github/scripts/ci_runtime_telemetry.py start --phase image-build

      - name: Build ordinary production runtime with registry cache
        if: github.event.inputs.force_cold_cache != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          build-args: |
            CARGO_PROFILE=pr-build
          load: true
          tags: ferrum-edge:production-default-smoke
          provenance: false
          cache-from: type=registry,ref=ghcr.io/ferrum-edge/ferrum-edge-buildcache:default-v1-linux-amd64-runtime
          cache-to: type=registry,ref=ghcr.io/ferrum-edge/ferrum-edge-buildcache:default-v1-linux-amd64-runtime,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Build ordinary production runtime (cold cache)
        if: github.event.inputs.force_cold_cache == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          build-args: |
            CARGO_PROFILE=pr-build
          load: true
          tags: ferrum-edge:production-default-smoke
          provenance: false

      - name: Finish image build timer
        if: always()
        run: python3 .github/scripts/ci_runtime_telemetry.py end --phase image-build --status ${{ job.status == 'success' && '0' || '1' }}

      - name: Verify ordinary distroless runtime contract
        run: |
          set -euo pipefail
          python3 .github/scripts/ci_runtime_telemetry.py start --phase ordinary-inventory
          ordinary_image=ferrum-edge:production-default-smoke
          docker run --rm --entrypoint /app/ferrum-edge "$ordinary_image" version

          inventory_image() {
            image="$1"
            output="$2"
            container="$(docker create "$image")"
            docker export "$container" | tar -tf - | sed -e 's#^\./##' -e 's#^/##' > "$output"
            docker rm "$container" >/dev/null
          }
          inventory_image "$ordinary_image" ordinary-runtime-files.txt

          grep -Fxq app/ferrum-edge ordinary-runtime-files.txt
          if grep -Fxq usr/sbin/ip ordinary-runtime-files.txt; then
            echo "ordinary runtime unexpectedly contains eBPF-only /usr/sbin/ip" >&2
            exit 1
          fi

          for forbidden in \
            bin/sh usr/bin/sh bin/bash usr/bin/bash bin/dash usr/bin/dash \
            bin/ash usr/bin/ash bin/zsh usr/bin/zsh bin/ksh usr/bin/ksh \
            bin/busybox usr/bin/busybox sbin/apk usr/sbin/apk usr/bin/apk \
            usr/bin/apt usr/bin/apt-cache usr/bin/apt-get \
            usr/bin/dpkg usr/bin/dpkg-query usr/bin/rpm usr/bin/yum \
            usr/bin/dnf usr/bin/microdnf usr/sbin/iptables \
            usr/sbin/ip6tables usr/sbin/nft; do
            if grep -Fxq "$forbidden" ordinary-runtime-files.txt; then
              echo "forbidden runtime tool is present: /$forbidden" >&2
              exit 1
            fi
          done
          python3 .github/scripts/ci_runtime_telemetry.py end --phase ordinary-inventory --status 0

      - name: Summarize ordinary image runtime
        if: always()
        run: python3 .github/scripts/ci_runtime_telemetry.py summarize --title "Production Dockerfile default image"

  production-dockerfile-smoke-ebpf:
    name: Production Dockerfile eBPF image
    needs: production-dockerfile-plan
    if: needs.production-dockerfile-plan.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Ambient's trusted main writer exports this identical Dockerfile target.
      # Every NodeWaypoint event is an anonymous reader; there is no cache export.
      - name: Record registry cache policy
        if: github.event.inputs.force_cold_cache != 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name buildkit-registry \
            --note "scope=ambient-v1-linux-amd64-runtime-ebpf policy=anonymous-restore-only; BuildKit logs report actual layer reuse; no restored-byte estimate"

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name buildkit-registry --hit false --bytes 0 \
            --note "scope=ambient-v1-linux-amd64-runtime-ebpf policy=force-cold skipped registry import and export"

      - name: Time image build
        run: python3 .github/scripts/ci_runtime_telemetry.py start --phase image-build

      - name: Build eBPF production runtime (anonymous registry reader)
        if: github.event.inputs.force_cold_cache != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: runtime-ebpf
          build-args: |
            CARGO_PROFILE=pr-build
            FEATURES=cloud-secrets,ebpf
          load: true
          tags: ferrum-edge:production-ebpf-smoke
          provenance: false
          cache-from: type=registry,ref=ghcr.io/ferrum-edge/ferrum-edge-buildcache:ambient-v1-linux-amd64-runtime-ebpf

      - name: Build eBPF production runtime (cold cache)
        if: github.event.inputs.force_cold_cache == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: runtime-ebpf
          build-args: |
            CARGO_PROFILE=pr-build
            FEATURES=cloud-secrets,ebpf
          load: true
          tags: ferrum-edge:production-ebpf-smoke
          provenance: false

      - name: Finish image build timer
        if: always()
        run: python3 .github/scripts/ci_runtime_telemetry.py end --phase image-build --status ${{ job.status == 'success' && '0' || '1' }}

      - name: Verify eBPF distroless runtime contract
        run: |
          set -euo pipefail
          python3 .github/scripts/ci_runtime_telemetry.py start --phase ebpf-inventory
          ebpf_image=ferrum-edge:production-ebpf-smoke
          docker run --rm --entrypoint /app/ferrum-edge "$ebpf_image" version
          docker run --rm --entrypoint /usr/sbin/ip "$ebpf_image" -V

          inventory_image() {
            image="$1"
            output="$2"
            container="$(docker create "$image")"
            docker export "$container" | tar -tf - | sed -e 's#^\./##' -e 's#^/##' > "$output"
            docker rm "$container" >/dev/null
          }
          inventory_image "$ebpf_image" ebpf-runtime-files.txt

          grep -Fxq app/ferrum-edge ebpf-runtime-files.txt
          grep -Fxq usr/sbin/ip ebpf-runtime-files.txt

          for forbidden in \
            bin/sh usr/bin/sh bin/bash usr/bin/bash bin/dash usr/bin/dash \
            bin/ash usr/bin/ash bin/zsh usr/bin/zsh bin/ksh usr/bin/ksh \
            bin/busybox usr/bin/busybox sbin/apk usr/sbin/apk usr/bin/apk \
            usr/bin/apt usr/bin/apt-cache usr/bin/apt-get \
            usr/bin/dpkg usr/bin/dpkg-query usr/bin/rpm usr/bin/yum \
            usr/bin/dnf usr/bin/microdnf usr/sbin/iptables \
            usr/sbin/ip6tables usr/sbin/nft; do
            if grep -Fxq "$forbidden" ebpf-runtime-files.txt; then
              echo "forbidden runtime tool is present: /$forbidden" >&2
              exit 1
            fi
          done
          python3 .github/scripts/ci_runtime_telemetry.py end --phase ebpf-inventory --status 0

      - name: Summarize eBPF image runtime
        if: always()
        run: python3 .github/scripts/ci_runtime_telemetry.py summarize --title "Production Dockerfile eBPF image"

  production-dockerfile-smoke:
    name: Production Dockerfile eBPF image smoke
    runs-on: ubuntu-latest
    needs:
      - production-dockerfile-plan
      - production-dockerfile-smoke-default
      - production-dockerfile-smoke-default-write
      - production-dockerfile-smoke-ebpf
    if: always()
    steps:
      - name: Fail when production-image planning fails
        if: needs.production-dockerfile-plan.result != 'success'
        run: exit 1

      - name: Fail when production-image planner output is unusable
        if: needs.production-dockerfile-plan.result == 'success' && needs.production-dockerfile-plan.outputs.relevant != 'true' && needs.production-dockerfile-plan.outputs.relevant != 'false'
        run: exit 1

      - name: Skip production-image smoke for unrelated changes
        if: needs.production-dockerfile-plan.outputs.relevant == 'false'
        run: |
          {
            echo "## Production Dockerfile eBPF image smoke"
            echo ""
            echo "No Dockerfile/runtime-sensitive paths changed. Image smoke skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the ordinary registry writer did not succeed exclusively
        if: needs.production-dockerfile-plan.outputs.relevant == 'true' && (github.repository == 'ferrum-edge/ferrum-edge' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && (needs.production-dockerfile-smoke-default-write.result != 'success' || needs.production-dockerfile-smoke-default.result != 'skipped')
        run: exit 1

      - name: Fail when the ordinary registry reader did not succeed exclusively
        if: needs.production-dockerfile-plan.outputs.relevant == 'true' && !(github.repository == 'ferrum-edge/ferrum-edge' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && (needs.production-dockerfile-smoke-default.result != 'success' || needs.production-dockerfile-smoke-default-write.result != 'skipped')
        run: exit 1

      - name: Fail when the eBPF production image did not succeed
        if: needs.production-dockerfile-plan.outputs.relevant == 'true' && needs.production-dockerfile-smoke-ebpf.result != 'success'
        run: exit 1

      - name: Report production-image smoke
        if: needs.production-dockerfile-plan.outputs.relevant == 'true'
        run: |
          {
            echo "## Production Dockerfile eBPF image smoke"
            echo ""
            echo "Ordinary \`runtime\` and distroless \`runtime-ebpf\` images built in parallel"
            echo "through BuildKit with target-specific GHCR caches. Pull requests"
            echo "import anonymously and never export. Only trusted main runs publish"
            echo "the ordinary cache; the eBPF image reads Ambient's shared cache."
            echo "Cold dispatch skips imports and exports. Distroless inventories passed."
            echo ""
            echo "Warm PR target: <=30 minutes, p95 <=45 minutes, measured on hosted runs."
          } >> "$GITHUB_STEP_SUMMARY"

  node-waypoint-ebpf-live:
    name: NodeWaypoint eBPF live datapath
    needs: production-dockerfile-plan
    if: ${{ !cancelled() && needs.production-dockerfile-plan.outputs.node_waypoint_relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-node-waypoint-ebpf-live"

      - name: Build normal runtime binary
        run: cargo build --profile pr-build --bin ferrum-edge

      - name: Package normal image
        uses: ./.github/actions/package-ferrum-runtime-image
        with:
          binary-path: target/pr-build/ferrum-edge
          image: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}

      - name: Build eBPF runtime binary
        run: cargo build --profile pr-build --bin ferrum-edge --features cloud-secrets,ebpf

      - name: Install nightly Rust with rust-src
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: rust-src

      - name: Install bpf-linker
        uses: ./.github/actions/setup-bpf-linker

      - name: Build eBPF program
        run: cd ebpf && cargo +nightly build --target bpfel-unknown-none -Z build-std=core --release -p ferrum-ebpf

      - name: Package eBPF base image
        uses: ./.github/actions/package-ferrum-runtime-image
        with:
          binary-path: target/pr-build/ferrum-edge
          image: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}-ebpf-base
          bpf-elf-path: ebpf/target/bpfel-unknown-none/release/ferrum-ebpf

      - name: Add distroless iproute2 runtime closure
        env:
          BASE_IMAGE: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}-ebpf-base
          FINAL_IMAGE: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}-ebpf
        run: |
          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --file Dockerfile.iproute2-layer \
            --tag "$FINAL_IMAGE" \
            .

      - name: Package tools-capable NodeWaypoint UDP steering image
        env:
          BASE_IMAGE: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}-ebpf-base
          FINAL_IMAGE: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}-ebpf-tools
        run: |
          set -euo pipefail
          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --file Dockerfile.ebpf-tools-layer \
            --tag "$FINAL_IMAGE" \
            .
          docker run --rm --entrypoint /bin/sh "$FINAL_IMAGE" -c '
            set -eu
            for tool in ip iptables ip6tables iptables-save ip6tables-save; do
              command -v "$tool" >/dev/null 2>&1 || {
                echo "missing required steering tool: $tool" >&2
                exit 1
              }
            done
            test -s /app/ferrum-edge
            test -s /app/bpf/ferrum-ebpf
          '

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-kubernetes-tools

      - name: Create disposable dual-stack kind cluster
        run: |
          set -euo pipefail
          cat > kind-ebpf-live.yaml <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            ipFamily: dual
            podSubnet: "10.244.0.0/16,fd00:10:244::/56"
            serviceSubnet: "10.96.0.0/16,fd00:10:96::/112"
          nodes:
            - role: control-plane
            - role: worker
            - role: worker
          YAML
          kind create cluster --name "$KIND_CLUSTER" --config kind-ebpf-live.yaml --wait 180s
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" podCIDRs="}{.spec.podCIDRs}{"\n"}{end}'
          for node in $(kind get nodes --name "$KIND_CLUSTER"); do
            docker exec "$node" sh -eu -c '
              mkdir -p /sys/fs/bpf
              grep -q " /sys/fs/bpf bpf " /proc/mounts || mount -t bpf bpf /sys/fs/bpf
              test -f /sys/fs/cgroup/cgroup.controllers
              mount | grep -q " /sys/fs/bpf type bpf "
            '
          done

      - name: Load images into kind
        run: |
          set -euo pipefail
          kind load docker-image "${FERRUM_IMAGE_REPOSITORY}:${FERRUM_IMAGE_TAG}" --name "$KIND_CLUSTER"
          kind load docker-image "${FERRUM_IMAGE_REPOSITORY}:${FERRUM_IMAGE_TAG}-ebpf" --name "$KIND_CLUSTER"
          kind load docker-image "${FERRUM_IMAGE_REPOSITORY}:${FERRUM_IMAGE_TAG}-ebpf-tools" --name "$KIND_CLUSTER"

      - name: Install Istio policy CRDs
        run: |
          set -euo pipefail
          crd_path="${RUNNER_TEMP}/istio-${ISTIO_VERSION}-crd-all.gen.yaml"
          crd_url="https://raw.githubusercontent.com/istio/istio/${ISTIO_COMMIT_SHA}/manifests/charts/base/files/crd-all.gen.yaml"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 30 --max-time 300 \
            -o "$crd_path" "$crd_url"
          test -s "$crd_path"
          printf '%s  %s\n' "$ISTIO_CRD_SHA256" "$crd_path" | sha256sum --check --strict
          kubectl apply --server-side=true -f "$crd_path"
          for crd in \
            authorizationpolicies.security.istio.io \
            peerauthentications.security.istio.io \
            requestauthentications.security.istio.io \
            destinationrules.networking.istio.io \
            envoyfilters.networking.istio.io \
            gateways.networking.istio.io \
            proxyconfigs.networking.istio.io \
            serviceentries.networking.istio.io \
            sidecars.networking.istio.io \
            virtualservices.networking.istio.io \
            workloadentries.networking.istio.io \
            workloadgroups.networking.istio.io \
            telemetries.telemetry.istio.io; do
            kubectl wait --for=condition=Established "crd/${crd}" --timeout=120s
          done

      - name: Run live NodeWaypoint eBPF datapath validation
        env:
          FERRUM_EBPF_LIVE_ACK_DISPOSABLE: "true"
          FERRUM_LIVE_KEEP_RESOURCES: "true"
          FERRUM_LIVE_REQUIRE_DUAL_STACK: "true"
          FERRUM_LIVE_TESTS_REQUIRED: "1"
          FERRUM_LIVE_IMAGE_REPOSITORY: ${{ env.FERRUM_IMAGE_REPOSITORY }}
          FERRUM_LIVE_IMAGE_TAG: ${{ env.FERRUM_IMAGE_TAG }}
          FERRUM_LIVE_DOCKER_NODE_EVIDENCE: "true"
          FERRUM_LIVE_SPIRE_PRODUCTION: "true"
          FERRUM_LIVE_TRUST_DOMAIN: "cluster.local"
        run: tests/k8s/node_waypoint_ebpf_live/run.sh

      - name: Assert a real BPF bypass metric
        run: |
          set -euo pipefail
          results="target/node-waypoint-ebpf-live/mesh-bpf-metrics"
          mkdir -p "$results"

          # Select the Running, non-terminating src-a pod explicitly. run.sh
          # deletes and rescales src-a earlier in this job, so `items[0]` of a
          # bare label selector can name the pod that is on its way out: the
          # excluded-port connection would then be issued into a container that
          # is already tearing down, and the counter would legitimately stand
          # still. The field selector drops non-Running pods; the go-template
          # drops anything already carrying a deletion timestamp.
          running_template='{{range .items}}{{if not .metadata.deletionTimestamp}}{{.metadata.name}}{{"\n"}}{{end}}{{end}}'
          source_pod="$(
            kubectl -n ferrum-ebpf-live get pod -l app=src-a \
              --field-selector status.phase=Running \
              -o go-template="$running_template" | sort | awk 'NR == 1'
          )"
          if [[ -z "$source_pod" ]]; then
            echo "no Running, non-terminating src-a pod to source the excluded-port connection from" >&2
            kubectl -n ferrum-ebpf-live get pod -l app=src-a -o wide >&2 || true
            exit 1
          fi
          kubectl -n ferrum-ebpf-live wait --for=condition=Ready "pod/$source_pod" --timeout=60s

          source_node="$(kubectl -n ferrum-ebpf-live get "pod/$source_pod" -o jsonpath='{.spec.nodeName}')"
          if [[ -z "$source_node" ]]; then
            echo "src-a pod $source_pod is not scheduled onto a node" >&2
            exit 1
          fi

          # The bypass decision is taken by the connect4 hook inside the source
          # pod's cgroup and accounted on that node's per-CPU counters, so the
          # only proxy that can observe it is the ambient pod sharing the node.
          # Same Running/non-terminating filter: run.sh restarts the ambient
          # DaemonSet earlier, so a terminating predecessor can still be listed
          # for the node and would export a frozen, pre-restart counter.
          ambient_pod="$(
            kubectl -n ferrum get pod \
              -l app.kubernetes.io/name=ferrum-mesh-ambient \
              --field-selector "spec.nodeName=$source_node,status.phase=Running" \
              -o go-template="$running_template" | sort | awk 'NR == 1'
          )"
          if [[ -z "$ambient_pod" ]]; then
            echo "no Running, non-terminating ferrum-mesh-ambient pod on node $source_node" >&2
            kubectl -n ferrum get pod -l app.kubernetes.io/name=ferrum-mesh-ambient -o wide >&2 || true
            exit 1
          fi
          kubectl -n ferrum wait --for=condition=Ready "pod/$ambient_pod" --timeout=60s

          kubectl -n ferrum port-forward "pod/$ambient_pod" 19450:19010 \
            >"$results/port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true; wait "$port_forward_pid" 2>/dev/null || true' EXIT

          metric='ferrum_mesh_bpf_drops_total{reason="exclude_port_hit"}'
          regime_metric='ferrum_mesh_bpf_ringbuf_in_overrun_regime'

          # Two INDEPENDENT properties are asserted below (issue #5502).
          #
          # 1. The datapath. ferrum_mesh_bpf_drops_total is sourced from the
          #    kernel per-CPU FERRUM_SOCK_OPS_STATS slots, not from the
          #    events ringbuf, so a stalled ringbuf consumer cannot inflate
          #    it and cannot hide a bypass decision behind a discarded
          #    record. A plain increase on it therefore IS the statement
          #    "the connect4 hook classified this connection".
          #
          # 2. The ringbuf consumer. Every OTHER cumulative
          #    ferrum_mesh_bpf_* counter is ringbuf-sourced, so while the
          #    consumer replays the same resident records the whole family
          #    is one common multiple of the underlying counts. The greatest
          #    common divisor of that family is the replay factor, and it is
          #    1 on a healthy consumer; ferrum_mesh_bpf_ringbuf_in_overrun_regime
          #    is 0 when the kernel is not dropping events either.
          #
          # drops_total is deliberately EXCLUDED from the gcd: it is not a
          # member of the replayed family, so dividing it by that family's
          # factor would report a real bypass decision as a rescale
          # artifact (and, when it happens to be odd, would collapse the
          # whole guard to 1). The always-1 drop_reasons gauges, the overrun
          # counter and the regime gauge are excluded for the same reason a
          # gauge can never pin a gcd.
          #
          # Every scrape below tolerates a port-forward that cannot serve
          # /metrics: that is a different failure from a counter that did
          # not move and must never be reported as one.
          fetched=false
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 http://127.0.0.1:19450/metrics >"$results/before.prom" 2>"$results/scrape.err"; then
              fetched=true
              break
            fi
            sleep 0.5
          done
          if [[ "$fetched" != "true" ]]; then
            echo "failed to fetch same-node ambient metrics before the bypass" >&2
            cat "$results/scrape.err" >&2 || true
            cat "$results/port-forward.log" >&2 || true
            exit 1
          fi

          before="$(awk -v metric="$metric" '$1 == metric { value = $2 } END { print value }' "$results/before.prom")"
          if [[ ! "$before" =~ ^[0-9]+$ ]]; then
            echo "missing integer $metric baseline in ambient metrics" >&2
            grep 'ferrum_mesh_bpf_drops_total' "$results/before.prom" >&2 || true
            exit 1
          fi
          # Recorded for diagnosis only: it separates "the consumer was
          # already replaying before the connection" from "it went unhealthy
          # during the window".
          before_scale="$(awk 'function gcd(a, b,   t) { while (b) { t = a % b; a = b; b = t } return a } { series = $1; value = $2; if (series ~ /^ferrum_mesh_bpf_/ && value ~ /^[0-9]+$/ && series !~ /drops_total|drop_reasons|ringbuf_overruns_total|ringbuf_in_overrun_regime/ && value > 0) { scale = (scale == "" ? value + 0 : gcd(scale, value + 0)) } } END { if (scale == "" || scale < 1) scale = 1; printf "%d\n", scale }' "$results/before.prom")"
          before_regime="$(awk -v metric="$regime_metric" '$1 == metric { value = $2 } END { print value }' "$results/before.prom")"

          # Issue the excluded-port connection and keep the evidence. curl
          # runs under a nested shell that echoes a `curl_exit=` sentinel, so
          # curl's own status is recovered from the container's stdout rather
          # than from kubectl's exit status. kubectl exec propagates the
          # container command's status, which cannot distinguish `curl: (1)
          # unsupported protocol` from kubectl itself failing at the
          # transport layer; an absent sentinel is the unambiguous signal
          # that the command never ran in the pod. Swallowing either with
          # `|| true` is what made this assertion undiagnosable.
          exec_out="$results/excluded-port-exec.out"
          exec_err="$results/excluded-port-exec.err"
          set +e
          kubectl -n ferrum-ebpf-live exec "pod/$source_pod" -- sh -c 'curl -sS --connect-timeout 2 --max-time 5 -o /dev/null http://127.0.0.1:15020/; echo "curl_exit=$?"' >"$exec_out" 2>"$exec_err"
          exec_status=$?
          set -e
          curl_exit="$(sed -n 's/^curl_exit=\([0-9][0-9]*\)$/\1/p' "$exec_out" | tail -n 1)"
          printf 'exec_status=%s\ncurl_exit=%s\n' "$exec_status" "$curl_exit" \
            >"$results/excluded-port-exec.status"

          if [[ ! "$curl_exit" =~ ^[0-9]+$ ]]; then
            echo "kubectl exec into pod/$source_pod returned no curl_exit sentinel (kubectl exit $exec_status): curl never ran in the pod, so nothing can be concluded from the counter" >&2
            cat "$exec_out" >&2 || true
            cat "$exec_err" >&2 || true
            exit 1
          fi

          # Accept every curl status that implies connect() completed, which
          # is what the connect4 hook classifies as exclude_port_hit — an
          # HTTP response is not required:
          #   0  transfer completed
          #   7  failed to connect (the kernel answered the SYN on a closed
          #      port, or the timeout expired mid-connect); either way the
          #      SYN left the pod through connect()
          #   18 partial transfer
          #   28 operation timed out
          #   52 empty reply from server
          #   55 failed sending network data
          #   56 failure receiving network data
          # 18/52/55/56 can only be reached after the TCP connection is
          # established. Anything else (1 unsupported protocol, 2 failed
          # init, 3 malformed URL, 6 could not resolve host) means curl gave
          # up before connect().
          if [[ ! "$curl_exit" =~ ^(0|7|18|28|52|55|56)$ ]]; then
            echo "curl in pod/$source_pod exited $curl_exit without attempting the excluded-port connect()" >&2
            cat "$exec_out" >&2 || true
            cat "$exec_err" >&2 || true
            exit 1
          fi

          # Poll until BOTH properties hold on the SAME scrape, and report a
          # failure only once the whole budget is spent. A single sample that
          # happens to catch a transient is not a reason to fail a gate with
          # 39 attempts left.
          after="$before"
          after_scale=0
          after_regime=""
          polls=0
          scrape_failures=0
          moved=false
          consumer_healthy=false
          : >"$results/poll-outcomes.txt"
          for attempt in $(seq 1 40); do
            polls="$attempt"
            if ! curl -fsS --max-time 10 http://127.0.0.1:19450/metrics >"$results/after.prom" 2>"$results/scrape.err"; then
              scrape_failures=$((scrape_failures + 1))
              printf 'poll=%s outcome=scrape_failed\n' "$attempt" >>"$results/poll-outcomes.txt"
              sleep 0.5
              continue
            fi
            candidate="$(awk -v metric="$metric" '$1 == metric { value = $2 } END { print value }' "$results/after.prom")"
            if [[ ! "$candidate" =~ ^[0-9]+$ ]]; then
              scrape_failures=$((scrape_failures + 1))
              printf 'poll=%s outcome=metric_missing\n' "$attempt" >>"$results/poll-outcomes.txt"
              sleep 0.5
              continue
            fi
            after="$candidate"
            after_scale="$(awk 'function gcd(a, b,   t) { while (b) { t = a % b; a = b; b = t } return a } { series = $1; value = $2; if (series ~ /^ferrum_mesh_bpf_/ && value ~ /^[0-9]+$/ && series !~ /drops_total|drop_reasons|ringbuf_overruns_total|ringbuf_in_overrun_regime/ && value > 0) { scale = (scale == "" ? value + 0 : gcd(scale, value + 0)) } } END { if (scale == "" || scale < 1) scale = 1; printf "%d\n", scale }' "$results/after.prom")"
            after_regime="$(awk -v metric="$regime_metric" '$1 == metric { value = $2 } END { print value }' "$results/after.prom")"
            moved=false
            consumer_healthy=false
            if ((after > before)); then
              moved=true
            fi
            if [[ "$after_scale" == "1" ]]; then
              if [[ "$after_regime" == "0" ]]; then
                consumer_healthy=true
              fi
            fi
            printf 'poll=%s outcome=scraped drops=%s family_gcd=%s overrun_regime=%s moved=%s consumer_healthy=%s\n' \
              "$attempt" "$after" "$after_scale" "$after_regime" "$moved" "$consumer_healthy" \
              >>"$results/poll-outcomes.txt"
            if [[ "$moved" == "true" ]]; then
              if [[ "$consumer_healthy" == "true" ]]; then
                break
              fi
            fi
            sleep 0.5
          done

          if ((polls > 0 && scrape_failures == polls)); then
            echo "all $polls post-connection scrapes failed: the port-forward to pod/$ambient_pod never served /metrics, so $metric was never read" >&2
            cat "$results/scrape.err" >&2 || true
            cat "$results/port-forward.log" >&2 || true
            exit 1
          fi

          # The datapath assertion, on the kernel-sourced counter alone.
          if [[ "$moved" != "true" ]]; then
            echo "expected $metric to increase after a real excluded-port connection from pod/$source_pod (curl exit $curl_exit); before=$before after=$after over $polls polls, $scrape_failures of them failed to scrape. This counter is read from the kernel per-CPU bypass slots, so a flat value means the connect4 hook never classified the connection." >&2
            grep 'ferrum_mesh_bpf_drops_total' "$results/after.prom" >&2 || true
            cat "$results/port-forward.log" >&2 || true
            exit 1
          fi

          # The ringbuf-consumer assertion, on the replayed family. This does
          # NOT say anything about the bypass decision above; it says the
          # ambient pod's SOCK_OPS ringbuf consumer is making forward
          # progress instead of re-counting resident records (issue #5563).
          if [[ "$consumer_healthy" != "true" ]]; then
            echo "pod/$ambient_pod's SOCK_OPS ringbuf consumer is not healthy after $polls polls: the ringbuf-sourced ferrum_mesh_bpf_* family shares a common factor of $after_scale (expected 1) and ferrum_mesh_bpf_ringbuf_in_overrun_regime is '$after_regime' (expected 0). A common factor above 1 means the consumer is replaying the same resident records instead of draining new ones; the family was already at factor $before_scale / regime '$before_regime' before the connection." >&2
            grep 'ferrum_mesh_bpf_' "$results/after.prom" >&2 || true
            cat "$results/port-forward.log" >&2 || true
            exit 1
          fi

          printf 'source_pod=%s\nsource_node=%s\nambient_pod=%s\nmetric=%s\nexec_status=%s\ncurl_exit=%s\nbefore=%s\nafter=%s\nbefore_scale=%s\nafter_scale=%s\nbefore_regime=%s\nafter_regime=%s\npolls=%s\nscrape_failures=%s\n' \
            "$source_pod" "$source_node" "$ambient_pod" "$metric" "$exec_status" "$curl_exit" \
            "$before" "$after" "$before_scale" "$after_scale" \
            "$before_regime" "$after_regime" "$polls" "$scrape_failures" \
            >"$results/assertion.txt"

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          results="$GITHUB_WORKSPACE/node-waypoint-ebpf-live-results"
          mkdir -p "$results"
          kubectl get nodes -o wide > "$results/nodes.txt" 2>&1
          kubectl get pods -A -o wide > "$results/pods.txt" 2>&1
          kubectl get events -A --sort-by=.lastTimestamp > "$results/events.txt" 2>&1
          kubectl -n ferrum get all -o wide > "$results/ferrum-all.txt" 2>&1
          kubectl -n ferrum-ebpf-live get all -o wide > "$results/workloads-all.txt" 2>&1
          kubectl -n ferrum-ebpf-live describe pods > "$results/workloads-pods-describe.txt" 2>&1
          kubectl -n ferrum-ebpf-live describe svc > "$results/workloads-services-describe.txt" 2>&1
          kubectl -n spire-system get all -o wide > "$results/spire-all.txt" 2>&1
          kubectl -n spire-system logs statefulset/spire-server --all-containers --tail=500 > "$results/spire-server.log" 2>&1
          kubectl -n spire-system logs daemonset/spire-agent --all-containers --tail=500 > "$results/spire-agent.log" 2>&1
          helm -n ferrum get values ferrum-live --all > "$results/helm-values.yaml" 2>&1
          helm -n ferrum get manifest ferrum-live > "$results/helm-manifest.yaml" 2>&1
          kubectl -n ferrum describe deployment/ferrum-mesh-control-plane > "$results/control-plane-deployment-describe.txt" 2>&1
          kubectl -n ferrum describe daemonset/ferrum-mesh-node-agent > "$results/node-agent-daemonset-describe.txt" 2>&1
          kubectl -n ferrum describe daemonset/ferrum-mesh-ambient > "$results/ambient-daemonset-describe.txt" 2>&1
          kubectl -n ferrum describe pods > "$results/ferrum-pods-describe.txt" 2>&1
          kubectl -n ferrum logs deployment/ferrum-mesh-control-plane --all-containers --tail=500 > "$results/control-plane.log" 2>&1
          kubectl -n ferrum logs daemonset/ferrum-mesh-node-agent --all-containers --tail=500 > "$results/node-agent.log" 2>&1
          kubectl -n ferrum logs daemonset/ferrum-mesh-ambient --all-containers --tail=500 > "$results/ambient.log" 2>&1
          for pod in $(kubectl -n ferrum get pods -o name 2>/dev/null); do
            name="${pod#pod/}"
            kubectl -n ferrum logs "$pod" --all-containers --tail=500 > "$results/${name}.log" 2>&1
            kubectl -n ferrum logs "$pod" --previous --all-containers --tail=500 > "$results/${name}-previous.log" 2>&1
          done
          if command -v kind >/dev/null 2>&1 && command -v docker >/dev/null 2>&1; then
            for node in $(kind get nodes --name "$KIND_CLUSTER" 2>/dev/null); do
              docker exec "$node" sh -eu -c '
                dir="${1:-/run/ferrum/node-waypoint-pods}"
                if [ ! -d "$dir" ]; then
                  echo "$dir does not exist"
                  exit 0
                fi
                find "$dir" -maxdepth 2 -type f -print 2>/dev/null | sort | while IFS= read -r file; do
                  echo "--- $file"
                  sed -n "1,3p" "$file" 2>/dev/null || true
                done
              ' sh "${FERRUM_LIVE_NODE_WAYPOINT_REGISTRY_DIR:-/run/ferrum/node-waypoint-pods}" \
                > "$results/node-waypoint-registry-${node}.txt" 2>&1
            done
          fi
          if [ -d target/node-waypoint-ebpf-live ]; then
            cp -R target/node-waypoint-ebpf-live "$results/bpf-evidence"
          fi
          if [ -f target/node-waypoint-ebpf-live/live-assertions.json ]; then
            cp target/node-waypoint-ebpf-live/live-assertions.json "$results/live-assertions.json"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: node-waypoint-ebpf-live-results
          path: node-waypoint-ebpf-live-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER" || true

  node-waypoint-ebpf-live-gate:
    name: NodeWaypoint eBPF Live
    runs-on: ubuntu-latest
    needs:
      - production-dockerfile-plan
      - node-waypoint-ebpf-live
    if: always()
    steps:
      # `NodeWaypoint eBPF Live` is deliberately NOT branch-protection-required
      # (.claude/rules/testing.md); verify_required_ci.py asserts it stays out
      # of REQUIRED_MERGE_GROUP_WORKFLOWS and DEDICATED_REQUIRED_CHECKS. It is
      # an always-reporting aggregate so that a skipped-for-irrelevance run is
      # visibly green rather than absent, and so a planner failure cannot look
      # like a pass.
      #
      # The live job's own binding is `always() && ... != 'false'`, so the only
      # outcome that legitimately skips it is an exact `false` verdict from the
      # trusted-base planner. Every other shape reaches the live job, and this
      # aggregate then reports whatever the live job did.
      - name: Fail when NodeWaypoint relevance planning fails
        if: needs.production-dockerfile-plan.result != 'success'
        run: |
          {
            echo "## NodeWaypoint eBPF Live"
            echo ""
            echo "Failed before trusted-base relevance planning completed."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Skip NodeWaypoint eBPF live datapath for unrelated changes
        if: needs.production-dockerfile-plan.outputs.node_waypoint_relevant == 'false'
        run: |
          {
            echo "## NodeWaypoint eBPF Live"
            echo ""
            echo "Skipped the Kind/eBPF live datapath: the trusted-base classifier"
            echo "proved no NodeWaypoint eBPF, chart, image, harness, or"
            echo "documentation surface changed. The production-image contract is"
            echo "reported separately by \`Production Dockerfile eBPF image smoke\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the NodeWaypoint eBPF live datapath did not succeed
        if: needs.production-dockerfile-plan.outputs.node_waypoint_relevant != 'false' && needs.node-waypoint-ebpf-live.result != 'success'
        run: |
          {
            echo "## NodeWaypoint eBPF Live"
            echo ""
            echo "Live datapath validation failed or did not complete: ${{ needs.node-waypoint-ebpf-live.result }}."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Report NodeWaypoint eBPF live datapath
        if: needs.production-dockerfile-plan.outputs.node_waypoint_relevant != 'false' && needs.node-waypoint-ebpf-live.result == 'success'
        run: |
          {
            echo "## NodeWaypoint eBPF Live"
            echo ""
            echo "Live datapath validation passed."
          } >> "$GITHUB_STEP_SUMMARY"
