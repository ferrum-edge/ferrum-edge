name: Ambient Host UDP Live Kernel

on:
  workflow_dispatch:
  pull_request:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ambient-host-udp-live-pr-{0}', github.event.pull_request.number) || (github.event_name == 'merge_group' && format('ambient-host-udp-live-merge-group-{0}', github.event.merge_group.head_sha) || 'ambient-host-udp-live-shared') }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    name: Ambient host-UDP trigger
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      # Relevance decides whether a REQUIRED live gate runs at all, so it must
      # never be computed by code the pull request supplies: a PR that widens
      # its own suite patterns could declare itself irrelevant, skip the live
      # job, and still turn the required check green.
      #
      # Everything below reads ONE immutable trusted commit. The base-branch
      # tip is fetched from the base repository, pinned once to a full object
      # id, checked to hold the filter as a regular blob, and then read BY
      # OBJECT ID rather than by path. A fork head, a rewritten head, or a push
      # to the base branch mid-run therefore cannot swap the script between
      # validation and execution, and every failure exits non-zero so the gate
      # fails closed instead of quietly declaring itself irrelevant.
      #
      # This block is frozen by .github/scripts/verify_cross_build_policy.py
      # (see live_suite_relevance_errors); it is byte-identical across every
      # live-suite workflow apart from the suite, slug, and display name.
      - name: Check for ambient-host-udp changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          filter_path=.github/scripts/live_suite_path_filter.py
          changed_files="$RUNNER_TEMP/ambient-host-udp-changed-files.txt"
          trusted_filter="$RUNNER_TEMP/ambient-host-udp-trusted-filter.py"
          rm -f -- "$changed_files" "$trusted_filter"
          : > "$changed_files"

          filter_args=(--suite ambient-host-udp --changed-files "$changed_files")

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # `github.base_ref` names a branch in the BASE repository, so a fork
            # cannot control its contents -- but it is still untrusted text.
            # Reject anything outside a conservative branch charset before it
            # reaches a refspec so no option, pathspec, or revision-syntax
            # metacharacter can be smuggled into a git invocation.
            if ! printf '%s' "$BASE_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$'; then
              echo "::error::refusing to resolve an unsafe base ref" >&2
              exit 1
            fi
            case "$BASE_REF" in
              *..*|*//*|*/|*.lock|*/.*)
                echo "::error::refusing to resolve an unsafe base ref" >&2
                exit 1
                ;;
            esac
            fetched=false
            for attempt in 1 2 3; do
              if git fetch --no-tags --no-recurse-submodules origin \
                "+refs/heads/${BASE_REF}:refs/ferrum/trusted-base"; then
                fetched=true
                break
              fi
              echo "git fetch of ${BASE_REF} failed (attempt ${attempt}/3); retrying" >&2
              sleep $(( attempt * 10 ))
            done
            if [ "$fetched" != true ]; then
              echo "::error::git fetch of ${BASE_REF} failed after 3 attempts" >&2
              exit 1
            fi
            # Pin the moving tip exactly once; nothing below re-resolves a ref.
            trusted_sha="$(git rev-parse --verify --quiet refs/ferrum/trusted-base^{commit} || true)"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # Merge queues synthesize a combined SHA. Use the event's base_sha
            # as the trusted filter source and the change-set base so a missing
            # pull_request payload cannot force-skip or check only main.
            if ! printf '%s' "$MERGE_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::merge_group base_sha missing or malformed" >&2
              exit 1
            fi
            if ! git cat-file -e "${MERGE_BASE_SHA}^{commit}" 2>/dev/null; then
              fetched=false
              for attempt in 1 2 3; do
                if git fetch --no-tags --no-recurse-submodules origin \
                  "${MERGE_BASE_SHA}"; then
                  fetched=true
                  break
                fi
                echo "git fetch of merge_group base failed (attempt ${attempt}/3); retrying" >&2
                sleep $(( attempt * 10 ))
              done
              if [ "$fetched" != true ]; then
                echo "::error::git fetch of merge_group base_sha failed after 3 attempts" >&2
                exit 1
              fi
            fi
            trusted_sha="$MERGE_BASE_SHA"
          else
            # A push to the default branch and a manual dispatch already run
            # trusted code, so the checked-out commit IS the trusted base.
            trusted_sha="$(git rev-parse --verify --quiet 'HEAD^{commit}' || true)"
            filter_args+=(--force-run)
          fi

          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::trusted base did not resolve to a full commit id" >&2
            exit 1
          fi

          # Reject anything that is not a regular blob at that exact commit: a
          # symlink (mode 120000) would make a content read emit its target
          # path, a gitlink (160000) or tree (040000) carries no script at all,
          # and a missing entry must fail closed rather than fall back to the
          # pull request's own copy.
          entry="$(git ls-tree --full-tree "$trusted_sha" -- "$filter_path")"
          if [ "$(printf '%s\n' "$entry" | grep -c . || true)" != "1" ]; then
            echo "::error::${filter_path} is not a single tree entry at ${trusted_sha}" >&2
            exit 1
          fi
          entry_mode="$(printf '%s\n' "$entry" | awk '{print $1}')"
          entry_type="$(printf '%s\n' "$entry" | awk '{print $2}')"
          entry_object="$(printf '%s\n' "$entry" | awk '{print $3}')"
          entry_path="$(printf '%s\n' "$entry" | awk -F'\t' '{print $2}')"
          if [ "$entry_type" != "blob" ] || [ "$entry_path" != "$filter_path" ]; then
            echo "::error::${filter_path} is not a blob at ${trusted_sha}" >&2
            exit 1
          fi
          case "$entry_mode" in
            100644|100755) ;;
            *)
              echo "::error::${filter_path} has non-regular mode ${entry_mode}" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$entry_object" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::${filter_path} did not resolve to an object id" >&2
            exit 1
          fi
          if [ "$(git cat-file -s "$entry_object")" -gt 262144 ]; then
            echo "::error::${filter_path} exceeds the 256 KiB trusted-filter ceiling" >&2
            exit 1
          fi
          git cat-file blob "$entry_object" > "$trusted_filter"

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            git diff --name-only --no-renames "${trusted_sha}...HEAD" \
              | sort > "$changed_files"
          fi

          # Isolated interpreter: no user site directory, no PYTHON* overrides,
          # and no implicit path entry, so nothing the pull request committed
          # can be imported by the trusted filter.
          python3 -I "$trusted_filter" --self-test
          plan="$(python3 -I "$trusted_filter" "${filter_args[@]}")"
          relevant="$(printf '%s\n' "$plan" | sed -n 's/^relevant=//p')"
          case "$relevant" in
            true|false) ;;
            *)
              echo "::error::trusted relevance filter produced no usable verdict" >&2
              exit 1
              ;;
          esac
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevance decided by trusted base ${trusted_sha}." >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$plan" | sed -n '/^## /,$p' >> "$GITHUB_STEP_SUMMARY"

  ambient-host-udp-live:
    name: Ambient host-network UDP live-kernel
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-ambient-host-udp-live"

      - name: Build live test binaries
        id: build_test_bin
        run: |
          set -euo pipefail
          mapfile -t bins < <(
            cargo test --lib --no-run --message-format=json-render-diagnostics \
              | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null and (.target.kind | index("lib"))) | .executable'
          )
          if [ "${#bins[@]}" -ne 1 ]; then
            printf 'Expected exactly one lib test binary, found %s:\n' "${#bins[@]}" >&2
            printf '%s\n' "${bins[@]}" >&2
            exit 1
          fi
          echo "lib_test_bin=${bins[0]}" >> "$GITHUB_OUTPUT"

          cargo build --bin ferrum-edge
          mapfile -t functional_bins < <(
            cargo test --test functional_tests --no-run --message-format=json-render-diagnostics \
              | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null and (.target.kind | index("test"))) | .executable'
          )
          if [ "${#functional_bins[@]}" -ne 1 ]; then
            printf 'Expected exactly one functional test binary, found %s:\n' "${#functional_bins[@]}" >&2
            printf '%s\n' "${functional_bins[@]}" >&2
            exit 1
          fi
          echo "functional_test_bin=${functional_bins[0]}" >> "$GITHUB_OUTPUT"

      - name: Preflight privileged host-UDP primitives
        run: |
          set -euo pipefail
          sudo -n true
          for bin in unshare nsenter setpriv timeout ip iptables ip6tables iptables-save ip6tables-save; do
            command -v "$bin" >/dev/null 2>&1 || {
              echo "::error::$bin is required for ambient host-UDP live tests"
              exit 1
            }
          done
          sudo unshare --net -- ip link set lo up
          sudo unshare --net -- iptables -t mangle -L >/dev/null
          sudo unshare --net -- ip6tables -t mangle -L >/dev/null

      - name: Run ambient host-UDP live gate as root
        env:
          FERRUM_LIVE_TESTS_REQUIRED: "1"
          FERRUM_HOST_UDP_LIB_TEST_BIN: ${{ steps.build_test_bin.outputs.lib_test_bin }}
          FERRUM_HOST_UDP_FUNCTIONAL_TEST_BIN: ${{ steps.build_test_bin.outputs.functional_test_bin }}
          FERRUM_HOST_UDP_LIVE_RESULTS: ${{ github.workspace }}/target/ambient-host-udp-live
        run: |
          set -euo pipefail
          # Explicit hosted disposable outer network-namespace boundary (#3804).
          # Composes with PR #3800: the trusted relevance / `changes` job above
          # is untouched; only this live execution step is wrapped. run.sh also
          # creates its own proven disposable outer netns for every ordinary
          # root execution (including ad-hoc), so isolation does not depend on
          # a forgeable environment flag.
          sudo -E unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            if [[ -w /proc/sys/net/ipv6/conf/all/disable_ipv6 ]]; then
              printf 0 > /proc/sys/net/ipv6/conf/all/disable_ipv6 || true
            fi
            ip -6 link set lo up 2>/dev/null || true
            exec "$1"
          ' bash tests/k8s/ambient_host_udp_live/run.sh

      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ambient-host-udp-live-results
          path: target/ambient-host-udp-live
          if-no-files-found: warn
          retention-days: 14

  # The live-kernel job above runs prebuilt test binaries directly on the hosted
  # runner, which proves the RUNNER's package set — not the image the mesh chart
  # actually selects. The Ambient UDP lifecycle drives generated `sh -c`
  # iptables/ip6tables scripts, so a chart that selected the distroless `-ebpf`
  # image would render a pod that cannot execute the very backend the live gate
  # validates, and CI would stay green (#3705). This job closes that boundary by
  # smoking the EXACT production image target the chart names.
  #
  # Full containerized TPROXY execution is impractical here (the datapath needs
  # privileged host netns manipulation the live job already covers on the real
  # kernel), so the contract proven here is precisely the one the runner cannot
  # prove: that the selected image can execute the tools.
  ambient-host-udp-image:
    name: Ambient host-UDP production image contract
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Cheap, deterministic half: the tool-provisioning stage the production
      # runtime is built FROM. This alone would not prove the shipped image, so
      # the full target is smoked below; running it first surfaces a broken tool
      # closure in ~1 minute instead of after the Rust + nightly eBPF builds.
      - name: Build the capture tool base stage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: capture-tools-base
          load: true
          tags: ferrum-edge-capture-tools-base:ci
          cache-from: type=gha,scope=ambient-host-udp-images
          cache-to: type=gha,mode=max,scope=ambient-host-udp-images
          provenance: false

      # The exact target the mesh chart's `-ebpf-tools` tag publishes.
      - name: Build the production Ambient UDP lifecycle runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: runtime-ebpf-tools
          build-args: |
            FEATURES=cloud-secrets,ebpf
          load: true
          tags: ferrum-edge-ebpf-tools:ci
          cache-from: type=gha,scope=ambient-host-udp-images
          cache-to: type=gha,mode=max,scope=ambient-host-udp-images
          provenance: false

      - name: Prove the published runtime can execute the production tool set
        run: |
          set -euo pipefail

          # Every tool the generated host/pod-netns UDP setup and teardown
          # scripts invoke. `preflight_capture_tools` refuses startup without
          # them, so an image failing here crash-loops the Ambient UDP producer.
          docker run --rm --entrypoint /bin/sh ferrum-edge-ebpf-tools:ci -c '
            set -eu
            for tool in ip iptables ip6tables iptables-save ip6tables-save; do
              command -v "$tool" >/dev/null 2>&1 || {
                echo "missing required tool: $tool" >&2
                exit 1
              }
            done
            ip -V >/dev/null
            iptables --version >/dev/null
            ip6tables --version >/dev/null
            iptables-save --version >/dev/null
            ip6tables-save --version >/dev/null
          '

          # The image must still be a working Ferrum runtime, and must carry the
          # eBPF ELF that makes it a strict superset of the `-ebpf` variant.
          docker run --rm ferrum-edge-ebpf-tools:ci version >/dev/null
          docker run --rm --entrypoint /bin/sh ferrum-edge-ebpf-tools:ci -c \
            'test -s /app/bpf/ferrum-ebpf'

      # The complementary half of the contract: the ordinary `-ebpf` image the
      # chart still selects for eBPF capture / NodeWaypoint must REMAIN
      # distroless. Proving the tools image alone would let a later change
      # "fix" this finding by quietly adding a shell to `-ebpf` instead.
      - name: Build the distroless eBPF runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: runtime-ebpf
          build-args: |
            FEATURES=cloud-secrets,ebpf
          load: true
          tags: ferrum-edge-ebpf:ci
          cache-from: type=gha,scope=ambient-host-udp-images
          cache-to: type=gha,mode=max,scope=ambient-host-udp-images
          provenance: false

      - name: Prove the `-ebpf` image keeps its distroless contract
        run: |
          set -euo pipefail
          container="$(docker create ferrum-edge-ebpf:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          listing="$RUNNER_TEMP/ebpf-image-files.txt"
          # Normalize exactly like the production Dockerfile smoke so the
          # exact-path assertions below cannot be defeated by a `./` prefix.
          docker export "$container" | tar -tf - \
            | sed -e 's#^\./##' -e 's#^/##' > "$listing"

          # Positive control: prove the exact-path assertion is live before
          # asserting absences against the same inventory.
          grep -Fxq app/ferrum-edge "$listing"
          # `ip` IS expected: NodeWaypoint owns an exact policy rule/route.
          grep -Fxq usr/sbin/ip "$listing"

          for forbidden in \
            bin/sh usr/bin/sh bin/bash usr/bin/bash bin/dash usr/bin/dash \
            bin/busybox usr/bin/busybox usr/bin/apt usr/bin/apt-get \
            usr/bin/dpkg usr/sbin/iptables usr/sbin/ip6tables usr/sbin/nft; do
            if grep -Fxq "$forbidden" "$listing"; then
              echo "::error::the distroless -ebpf image must not ship /$forbidden" >&2
              exit 1
            fi
          done

  gate:
    name: Ambient Host UDP Live
    needs:
      - changes
      - ambient-host-udp-live
      - ambient-host-udp-image
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize ambient host-UDP live result
        run: |
          {
            echo "## Ambient Host UDP Live"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Failed before change detection completed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.relevant }}" = "false" ]; then
            echo "Skipped live-kernel validation: no ambient host-UDP capture, mesh UDP, fixture, documentation, or CI workflow surfaces changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ needs.changes.outputs.relevant }}" != "true" ]; then
            echo "Change detection returned an invalid relevance result: ${{ needs.changes.outputs.relevant }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.ambient-host-udp-live.result }}" != "success" ]; then
            echo "Live-kernel validation failed or did not complete: ${{ needs.ambient-host-udp-live.result }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.ambient-host-udp-image.result }}" != "success" ]; then
            echo "Production image contract failed or did not complete: ${{ needs.ambient-host-udp-image.result }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Live-kernel validation and production image contract passed." >> "$GITHUB_STEP_SUMMARY"
