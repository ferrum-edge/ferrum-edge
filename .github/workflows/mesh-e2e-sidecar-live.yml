name: Mesh E2E Sidecar Live Datapath

on:
  workflow_dispatch:
  pull_request:
  # Every main push runs the FULL suite (the changes job force-runs on non-PR
  # events): the M2 sidecar GA contract is release-blocking, and release.yml's
  # `validate-release-sha` requires a successful PUSH run of this workflow for
  # the tag target, so each main SHA must carry a validated live artifact.
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel a superseded PR/main run on rapid re-push. Manual dispatches share one
# lane and run to completion.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('mesh-e2e-sidecar-live-pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('mesh-e2e-sidecar-live-{0}', github.ref) || 'mesh-e2e-sidecar-live-shared') }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FERRUM_IMAGE_REPOSITORY: ferrum-edge
  FERRUM_IMAGE_TAG: mesh-e2e-sidecar
  CLUSTER: ferrum-sidecar-e2e

jobs:
  changes:
    name: Mesh e2e sidecar trigger
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      # Relevance decides whether a REQUIRED live gate runs at all, so it must
      # never be computed by code the pull request supplies: a PR that widens
      # its own suite patterns could declare itself irrelevant, skip the live
      # job, and still turn the required check green.
      #
      # Everything below reads ONE immutable trusted commit. The base-branch
      # tip is fetched from the base repository, pinned once to a full object
      # id, checked to hold the filter as a regular blob, and then read BY
      # OBJECT ID rather than by path. A fork head, a rewritten head, or a push
      # to the base branch mid-run therefore cannot swap the script between
      # validation and execution, and every failure exits non-zero so the gate
      # fails closed instead of quietly declaring itself irrelevant.
      #
      # This block is frozen by .github/scripts/verify_cross_build_policy.py
      # (see live_suite_relevance_errors); it is byte-identical across every
      # live-suite workflow apart from the suite, slug, and display name.
      - name: Check for mesh-e2e-sidecar changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          filter_path=.github/scripts/live_suite_path_filter.py
          changed_files="$RUNNER_TEMP/mesh-e2e-sidecar-changed-files.txt"
          trusted_filter="$RUNNER_TEMP/mesh-e2e-sidecar-trusted-filter.py"
          rm -f -- "$changed_files" "$trusted_filter"
          : > "$changed_files"

          filter_args=(--suite mesh-e2e-sidecar --changed-files "$changed_files")

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # `github.base_ref` names a branch in the BASE repository, so a fork
            # cannot control its contents -- but it is still untrusted text.
            # Reject anything outside a conservative branch charset before it
            # reaches a refspec so no option, pathspec, or revision-syntax
            # metacharacter can be smuggled into a git invocation.
            if ! printf '%s' "$BASE_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$'; then
              echo "::error::refusing to resolve an unsafe base ref" >&2
              exit 1
            fi
            case "$BASE_REF" in
              *..*|*//*|*/|*.lock|*/.*)
                echo "::error::refusing to resolve an unsafe base ref" >&2
                exit 1
                ;;
            esac
            fetched=false
            for attempt in 1 2 3; do
              if git fetch --no-tags --no-recurse-submodules origin \
                "+refs/heads/${BASE_REF}:refs/ferrum/trusted-base"; then
                fetched=true
                break
              fi
              echo "git fetch of ${BASE_REF} failed (attempt ${attempt}/3); retrying" >&2
              sleep $(( attempt * 10 ))
            done
            if [ "$fetched" != true ]; then
              echo "::error::git fetch of ${BASE_REF} failed after 3 attempts" >&2
              exit 1
            fi
            # Pin the moving tip exactly once; nothing below re-resolves a ref.
            trusted_sha="$(git rev-parse --verify --quiet refs/ferrum/trusted-base^{commit} || true)"
          else
            # A push to the default branch and a manual dispatch already run
            # trusted code, so the checked-out commit IS the trusted base.
            trusted_sha="$(git rev-parse --verify --quiet 'HEAD^{commit}' || true)"
            filter_args+=(--force-run)
          fi

          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::trusted base did not resolve to a full commit id" >&2
            exit 1
          fi

          # Reject anything that is not a regular blob at that exact commit: a
          # symlink (mode 120000) would make a content read emit its target
          # path, a gitlink (160000) or tree (040000) carries no script at all,
          # and a missing entry must fail closed rather than fall back to the
          # pull request's own copy.
          entry="$(git ls-tree --full-tree "$trusted_sha" -- "$filter_path")"
          if [ "$(printf '%s\n' "$entry" | grep -c . || true)" != "1" ]; then
            echo "::error::${filter_path} is not a single tree entry at ${trusted_sha}" >&2
            exit 1
          fi
          entry_mode="$(printf '%s\n' "$entry" | awk '{print $1}')"
          entry_type="$(printf '%s\n' "$entry" | awk '{print $2}')"
          entry_object="$(printf '%s\n' "$entry" | awk '{print $3}')"
          entry_path="$(printf '%s\n' "$entry" | awk -F'\t' '{print $2}')"
          if [ "$entry_type" != "blob" ] || [ "$entry_path" != "$filter_path" ]; then
            echo "::error::${filter_path} is not a blob at ${trusted_sha}" >&2
            exit 1
          fi
          case "$entry_mode" in
            100644|100755) ;;
            *)
              echo "::error::${filter_path} has non-regular mode ${entry_mode}" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$entry_object" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::${filter_path} did not resolve to an object id" >&2
            exit 1
          fi
          if [ "$(git cat-file -s "$entry_object")" -gt 262144 ]; then
            echo "::error::${filter_path} exceeds the 256 KiB trusted-filter ceiling" >&2
            exit 1
          fi
          git cat-file blob "$entry_object" > "$trusted_filter"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --no-renames "${trusted_sha}...HEAD" \
              | sort > "$changed_files"
          fi

          # Isolated interpreter: no user site directory, no PYTHON* overrides,
          # and no implicit path entry, so nothing the pull request committed
          # can be imported by the trusted filter.
          python3 -I "$trusted_filter" --self-test
          plan="$(python3 -I "$trusted_filter" "${filter_args[@]}")"
          relevant="$(printf '%s\n' "$plan" | sed -n 's/^relevant=//p')"
          case "$relevant" in
            true|false) ;;
            *)
              echo "::error::trusted relevance filter produced no usable verdict" >&2
              exit 1
              ;;
          esac
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevance decided by trusted base ${trusted_sha}." >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$plan" | sed -n '/^## /,$p' >> "$GITHUB_STEP_SUMMARY"

  mesh-e2e-sidecar-live:
    name: Mesh e2e sidecar live datapath
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-mesh-e2e-sidecar-live"

      - name: Build runtime binary
        run: cargo build --profile pr-build --bin ferrum-edge

      - name: Package runtime image
        uses: ./.github/actions/package-ferrum-runtime-image
        with:
          binary-path: target/pr-build/ferrum-edge
          image: ${{ env.FERRUM_IMAGE_REPOSITORY }}:${{ env.FERRUM_IMAGE_TAG }}

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-kubernetes-tools

      - name: Create kind cluster
        run: |
          set -euo pipefail
          kind create cluster --name "$CLUSTER" --wait 180s
          kubectl --context "kind-$CLUSTER" get nodes -o wide

      - name: Load runtime image into the cluster
        run: |
          set -euo pipefail
          kind load docker-image "${FERRUM_IMAGE_REPOSITORY}:${FERRUM_IMAGE_TAG}" --name "$CLUSTER"

      - name: Run live sidecar mesh e2e suite
        env:
          FERRUM_MESH_E2E_LIVE_ACK_DISPOSABLE: "true"
          FERRUM_SKIP_IMAGE_BUILD: "1"
          FERRUM_IMAGE_REPOSITORY: ${{ env.FERRUM_IMAGE_REPOSITORY }}
          FERRUM_IMAGE_TAG: ${{ env.FERRUM_IMAGE_TAG }}
        run: tests/k8s/mesh_e2e_sidecar/run.sh

      # Stage-4 contract validator: the emitted artifact must satisfy every
      # enforced (non-`live_deferred`) GA-contract live assertion for this
      # suite, for this exact commit/profile, with no duplicate or stale
      # artifacts. Reuses the pr-build cache from the binary build above.
      # The gate test is invoked by EXACT path and the step then asserts it
      # actually ran: a filtered-out test exits 0 with "0 passed", so a PR
      # that unwires `mod live_contract;` (or renames the test) must fail
      # here rather than silently skipping the artifact gate.
      - name: Validate GA-contract live assertions artifact
        env:
          FERRUM_LIVE_ASSERTIONS_FILE: target/mesh-e2e-sidecar/live-assertions.json
          FERRUM_LIVE_SUITE: mesh-e2e-sidecar
          FERRUM_LIVE_MAX_AGE_HOURS: "6"
        run: |
          set -euo pipefail
          # Capture with an explicit status so a FAILING gate still prints the
          # validator's full error list before the step exits (a bare
          # command-substitution assignment would abort under `set -e` with
          # the output swallowed).
          status=0
          output="$(FERRUM_LIVE_EXPECTED_COMMIT="$(git rev-parse HEAD)" \
            cargo test --profile pr-build --test conformance_tests -- \
            --exact conformance::live_contract::live_contract_artifact_gate --nocapture 2>&1)" || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error::GA-contract live-assertion validation failed (see validator output above)" >&2
            exit "$status"
          fi
          if ! printf '%s\n' "$output" | grep -q '^test result: ok\. 1 passed'; then
            echo "::error::live_contract_artifact_gate did not run (module unwired or test renamed) — the GA artifact gate must not be skippable" >&2
            exit 1
          fi

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          results="$GITHUB_WORKSPACE/mesh-e2e-sidecar-results"
          mkdir -p "$results"
          ctx="kind-$CLUSTER"
          kubectl --context "$ctx" get nodes -o wide > "$results/nodes.txt" 2>&1
          kubectl --context "$ctx" get pods -A -o wide > "$results/pods.txt" 2>&1
          kubectl --context "$ctx" get events -A --sort-by=.lastTimestamp > "$results/events.txt" 2>&1
          kubectl --context "$ctx" -n ferrum get all -o wide > "$results/ferrum-all.txt" 2>&1
          kubectl --context "$ctx" -n ferrum describe pods > "$results/ferrum-pods-describe.txt" 2>&1
          kubectl --context "$ctx" -n ferrum get configmap -o yaml > "$results/configmaps.yaml" 2>&1
          kubectl --context "$ctx" -n spire-system get all -o wide > "$results/spire-all.txt" 2>&1
          kubectl --context "$ctx" -n spire-system logs statefulset/spire-server --all-containers --tail=500 > "$results/spire-server.log" 2>&1
          kubectl --context "$ctx" -n spire-system logs daemonset/spire-agent --all-containers --tail=500 > "$results/spire-agent.log" 2>&1
          for deploy in svc client rogue; do
            kubectl --context "$ctx" -n ferrum logs "deploy/$deploy" --all-containers --tail=500 > "$results/${deploy}.log" 2>&1
          done
          kubectl --context "$ctx" -n ferrum logs deploy/svc -c ferrum-edge-init --tail=50 > "$results/svc-iptables.txt" 2>&1
          kubectl --context "$ctx" -n ferrum logs deploy/client -c ferrum-blackhole-init --tail=50 > "$results/client-blackhole.txt" 2>&1
          if [ -d "$GITHUB_WORKSPACE/.context/mesh-e2e-sidecar" ]; then
            cp -R "$GITHUB_WORKSPACE/.context/mesh-e2e-sidecar" "$results/artifacts"
          fi
          if [ -f target/mesh-e2e-sidecar/live-assertions.json ]; then
            cp target/mesh-e2e-sidecar/live-assertions.json "$results/live-assertions.json"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mesh-e2e-sidecar-results
          path: mesh-e2e-sidecar-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER" || true

  gate:
    name: Mesh E2E Sidecar Live
    needs:
      - changes
      - mesh-e2e-sidecar-live
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize mesh e2e sidecar live result
        run: |
          {
            echo "## Mesh E2E Sidecar Live"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Failed before change detection completed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.relevant }}" = "false" ]; then
            echo "Skipped live datapath validation: no mesh sidecar, identity, proxy, JWT plugin, GA-contract, image, proto, documentation, configuration, or CI workflow surfaces changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ needs.changes.outputs.relevant }}" != "true" ]; then
            echo "Change detection returned an invalid relevance result: ${{ needs.changes.outputs.relevant }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.mesh-e2e-sidecar-live.result }}" != "success" ]; then
            echo "Live datapath validation failed or did not complete: ${{ needs.mesh-e2e-sidecar-live.result }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Live datapath validation passed." >> "$GITHUB_STEP_SUMMARY"
