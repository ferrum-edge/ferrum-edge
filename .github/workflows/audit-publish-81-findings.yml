name: Publish 81 reviewed launch-audit findings

on:
  pull_request:
    branches:
      - audit/publish-base-2026-07-26
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/audit-publish-81-findings.yml'
      - 'tools/audit/publish_81/**'

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ferrum-publish-81-reviewed-findings
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'audit/publish-81-findings-2026-07-26'
    runs-on: ubuntu-slim
    timeout-minutes: 25
    steps:
      - name: Check out audit publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Decode reviewed finding manifest
        shell: bash
        run: |
          set -euo pipefail
          cat tools/audit/publish_81/findings.b64.* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/ferrum-reviewed-findings.json

      - name: Validate and publish reviewed findings
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 tools/audit/publish_81/publish_findings.py \
            --manifest-file /tmp/ferrum-reviewed-findings.json \
            --resolved-manifest tools/audit/publish_81/resolved_findings.json \
            --output tools/audit/publish_81/results.json

      - name: Upload publication manifest and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-published-81-findings-${{ github.run_id }}
          path: |
            tools/audit/publish_81/findings.b64.*
            tools/audit/publish_81/resolved_findings.json
            tools/audit/publish_81/results.json
          if-no-files-found: warn
          retention-days: 7
