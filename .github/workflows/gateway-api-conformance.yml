name: Gateway API Conformance

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      gateway_api_version:
        description: Gateway API tag to test against
        required: false
        default: v1.5.1
      conformance_profile:
        description: Upstream Gateway API conformance profiles (comma-separated)
        required: false
        default: GATEWAY-HTTP,GATEWAY-GRPC
      supported_features:
        description: Comma-separated Gateway API conformance features
        required: false
        default: Gateway,ReferenceGrant,HTTPRoute,GRPCRoute,HTTPRouteResponseHeaderModification,HTTPRoutePathRewrite,HTTPRouteHostRewrite,HTTPRouteRequestTimeout,HTTPRouteBackendTimeout
      skip_tests:
        description: Optional space-separated upstream conformance tests to skip
        required: false
        default: ""
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

# PRs and main pushes get independent lanes so required checks do not queue
# behind stale labs for older SHAs. Scheduled/manual runs keep sharing one lane
# for lab budget.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gateway-api-conformance-pr-{0}', github.event.pull_request.number) || (github.event_name == 'merge_group' && format('gateway-api-conformance-merge-group-{0}', github.event.merge_group.head_sha) || (github.event_name == 'push' && format('gateway-api-conformance-{0}', github.ref) || 'gateway-api-conformance-shared')) }}
  # Cancel a superseded PR/main/merge-group lab on rapid re-push. Scheduled and
  # manual runs share one lane and must run to completion for lab budget.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  FERRUM_IMAGE: ferrum-edge:gateway-api-conformance

jobs:
  changes:
    name: Gateway API conformance trigger
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Relevance decides whether a REQUIRED live gate runs at all, so it must
      # never be computed by code the pull request supplies: a PR that widens
      # its own suite patterns could declare itself irrelevant, skip the live
      # job, and still turn the required check green.
      #
      # Everything below reads ONE immutable trusted commit. The base-branch
      # tip is fetched from the base repository, pinned once to a full object
      # id, checked to hold the filter as a regular blob, and then read BY
      # OBJECT ID rather than by path. A fork head, a rewritten head, or a push
      # to the base branch mid-run therefore cannot swap the script between
      # validation and execution, and every failure exits non-zero so the gate
      # fails closed instead of quietly declaring itself irrelevant.
      #
      # This block is frozen by .github/scripts/verify_cross_build_policy.py
      # (see live_suite_relevance_errors); it is byte-identical across every
      # live-suite workflow apart from the suite, slug, and display name.
      - name: Check for gateway-api-conformance changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          filter_path=.github/scripts/live_suite_path_filter.py
          changed_files="$RUNNER_TEMP/gateway-api-conformance-changed-files.txt"
          trusted_filter="$RUNNER_TEMP/gateway-api-conformance-trusted-filter.py"
          rm -f -- "$changed_files" "$trusted_filter"
          : > "$changed_files"

          filter_args=(--suite gateway-api --changed-files "$changed_files")

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # `github.base_ref` names a branch in the BASE repository, so a fork
            # cannot control its contents -- but it is still untrusted text.
            # Reject anything outside a conservative branch charset before it
            # reaches a refspec so no option, pathspec, or revision-syntax
            # metacharacter can be smuggled into a git invocation.
            if ! printf '%s' "$BASE_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$'; then
              echo "::error::refusing to resolve an unsafe base ref" >&2
              exit 1
            fi
            case "$BASE_REF" in
              *..*|*//*|*/|*.lock|*/.*)
                echo "::error::refusing to resolve an unsafe base ref" >&2
                exit 1
                ;;
            esac
            fetched=false
            for attempt in 1 2 3; do
              if git fetch --no-tags --no-recurse-submodules origin \
                "+refs/heads/${BASE_REF}:refs/ferrum/trusted-base"; then
                fetched=true
                break
              fi
              echo "git fetch of ${BASE_REF} failed (attempt ${attempt}/3); retrying" >&2
              sleep $(( attempt * 10 ))
            done
            if [ "$fetched" != true ]; then
              echo "::error::git fetch of ${BASE_REF} failed after 3 attempts" >&2
              exit 1
            fi
            # Pin the moving tip exactly once; nothing below re-resolves a ref.
            trusted_sha="$(git rev-parse --verify --quiet refs/ferrum/trusted-base^{commit} || true)"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # Merge queues synthesize a combined SHA. Use the event's base_sha
            # as the trusted filter source and the change-set base so a missing
            # pull_request payload cannot force-skip or check only main.
            if ! printf '%s' "$MERGE_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::merge_group base_sha missing or malformed" >&2
              exit 1
            fi
            if ! git cat-file -e "${MERGE_BASE_SHA}^{commit}" 2>/dev/null; then
              fetched=false
              for attempt in 1 2 3; do
                if git fetch --no-tags --no-recurse-submodules origin \
                  "${MERGE_BASE_SHA}"; then
                  fetched=true
                  break
                fi
                echo "git fetch of merge_group base failed (attempt ${attempt}/3); retrying" >&2
                sleep $(( attempt * 10 ))
              done
              if [ "$fetched" != true ]; then
                echo "::error::git fetch of merge_group base_sha failed after 3 attempts" >&2
                exit 1
              fi
            fi
            trusted_sha="$MERGE_BASE_SHA"
          else
            # A push to the default branch and a manual dispatch already run
            # trusted code, so the checked-out commit IS the trusted base.
            trusted_sha="$(git rev-parse --verify --quiet 'HEAD^{commit}' || true)"
            filter_args+=(--force-run)
          fi

          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::trusted base did not resolve to a full commit id" >&2
            exit 1
          fi

          # Reject anything that is not a regular blob at that exact commit: a
          # symlink (mode 120000) would make a content read emit its target
          # path, a gitlink (160000) or tree (040000) carries no script at all,
          # and a missing entry must fail closed rather than fall back to the
          # pull request's own copy.
          entry="$(git ls-tree --full-tree "$trusted_sha" -- "$filter_path")"
          if [ "$(printf '%s\n' "$entry" | grep -c . || true)" != "1" ]; then
            echo "::error::${filter_path} is not a single tree entry at ${trusted_sha}" >&2
            exit 1
          fi
          entry_mode="$(printf '%s\n' "$entry" | awk '{print $1}')"
          entry_type="$(printf '%s\n' "$entry" | awk '{print $2}')"
          entry_object="$(printf '%s\n' "$entry" | awk '{print $3}')"
          entry_path="$(printf '%s\n' "$entry" | awk -F'\t' '{print $2}')"
          if [ "$entry_type" != "blob" ] || [ "$entry_path" != "$filter_path" ]; then
            echo "::error::${filter_path} is not a blob at ${trusted_sha}" >&2
            exit 1
          fi
          case "$entry_mode" in
            100644|100755) ;;
            *)
              echo "::error::${filter_path} has non-regular mode ${entry_mode}" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$entry_object" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::${filter_path} did not resolve to an object id" >&2
            exit 1
          fi
          if [ "$(git cat-file -s "$entry_object")" -gt 262144 ]; then
            echo "::error::${filter_path} exceeds the 256 KiB trusted-filter ceiling" >&2
            exit 1
          fi
          git cat-file blob "$entry_object" > "$trusted_filter"

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            git diff --name-only --no-renames "${trusted_sha}...HEAD" \
              | sort > "$changed_files"
          fi

          # Isolated interpreter: no user site directory, no PYTHON* overrides,
          # and no implicit path entry, so nothing the pull request committed
          # can be imported by the trusted filter.
          python3 -I "$trusted_filter" --self-test
          plan="$(python3 -I "$trusted_filter" "${filter_args[@]}")"
          relevant="$(printf '%s\n' "$plan" | sed -n 's/^relevant=//p')"
          case "$relevant" in
            true|false) ;;
            *)
              echo "::error::trusted relevance filter produced no usable verdict" >&2
              exit 1
              ;;
          esac
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevance decided by trusted base ${trusted_sha}." >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$plan" | sed -n '/^## /,$p' >> "$GITHUB_STEP_SUMMARY"

  gateway-api-conformance:
    name: Gateway API conformance suite
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    # The host-built binary is packaged into the Dockerfile's distroless
    # Debian 13 runtime base; package-ferrum-runtime-image fails when it needs
    # a newer glibc than that image provides.
    timeout-minutes: 90
    env:
      KIND_CLUSTER_NAME: ferrum-gwapi
      GATEWAY_API_LAB_CONTEXT: kind-ferrum-gwapi

    steps:
      # `runner.temp` is not available to job-level `env`, so the lab's
      # ownership record path is exported from the first step instead.
      - name: Select the GatewayClass ownership record path
        run: echo "GATEWAY_API_LAB_OWNERSHIP_FILE=$RUNNER_TEMP/gateway-api-gatewayclass-ownership.tsv" >> "$GITHUB_ENV"

      - name: Checkout Ferrum Edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve inputs
        id: inputs
        # Dispatch inputs are data: they reach the shell only through the
        # environment, never by expression interpolation into the script.
        env:
          DISPATCH_GATEWAY_API_VERSION: ${{ inputs.gateway_api_version }}
          DISPATCH_CONFORMANCE_PROFILE: ${{ inputs.conformance_profile }}
          DISPATCH_SUPPORTED_FEATURES: ${{ inputs.supported_features }}
          DISPATCH_SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          set -euo pipefail
          gateway_api_version="$DISPATCH_GATEWAY_API_VERSION"
          conformance_profile="$DISPATCH_CONFORMANCE_PROFILE"
          supported_features="$DISPATCH_SUPPORTED_FEATURES"
          skip_tests="$DISPATCH_SKIP_TESTS"
          for value in "$gateway_api_version" "$conformance_profile" "$supported_features" "$skip_tests"; do
            case "$value" in
              *$'\n'*|*$'\r'*)
                echo "::error::dispatch inputs must be single-line values" >&2
                exit 1
                ;;
            esac
          done
          if [ -z "$gateway_api_version" ]; then
            gateway_api_version="v1.5.1"
          fi
          if [ -z "$conformance_profile" ]; then
            conformance_profile="GATEWAY-HTTP,GATEWAY-GRPC"
          fi
          if [ -z "$supported_features" ]; then
            # Extended feature names are declared only for filters and rule
            # fields Ferrum implements end to end (issue #5646). Adding a name here makes
            # the upstream suite RUN that feature's tests, so never declare
            # one ahead of the implementation.
            supported_features="Gateway,ReferenceGrant,HTTPRoute,GRPCRoute,HTTPRouteResponseHeaderModification,HTTPRoutePathRewrite,HTTPRouteHostRewrite,HTTPRouteRequestTimeout,HTTPRouteBackendTimeout"
          fi
          {
            echo "gateway_api_version=$gateway_api_version"
            echo "conformance_profile=$conformance_profile"
            echo "supported_features=$supported_features"
            echo "skip_tests=$skip_tests"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-rust-ci
        with:
          # Same default-feature `pr-build` ferrum-edge graph as the other
          # live labs that compile only that binary. Do not share with
          # extra-binary, extra-feature, or debug-profile lanes.
          shared-key: "ci-live-pr-build"

      - name: Build gateway binary
        run: cargo build --profile pr-build --bin ferrum-edge

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-kubernetes-tools

      - name: Package Ferrum image
        uses: ./.github/actions/package-ferrum-runtime-image
        with:
          binary-path: target/pr-build/ferrum-edge
          image: ${{ env.FERRUM_IMAGE }}

      - name: Set up Ferrum Gateway API lab
        env:
          GATEWAY_API_VERSION: ${{ steps.inputs.outputs.gateway_api_version }}
        run: bash scripts/gateway_api_conformance_lab_setup.sh setup

      - name: Verify GatewayClass ownership refusals
        run: |
          set -euo pipefail
          if GATEWAY_API_LAB_CONTEXT=kind-other \
            bash scripts/gateway_api_gatewayclass_authority_conformance.sh blackbox; then
            echo "GatewayClass check accepted the wrong Kind context" >&2
            exit 1
          fi

          IFS=$'\t' read -r recorded_context nonce uid < "$GATEWAY_API_LAB_OWNERSHIP_FILE"
          foreign_record="$RUNNER_TEMP/gateway-api-foreign-gatewayclass.tsv"
          printf '%s\t%s\t%s\n' "$recorded_context" "$nonce" \
            '00000000-0000-0000-0000-000000000000' > "$foreign_record"
          if GATEWAY_API_LAB_OWNERSHIP_FILE="$foreign_record" \
            bash scripts/gateway_api_gatewayclass_authority_conformance.sh blackbox; then
            echo "GatewayClass check accepted a foreign UID" >&2
            exit 1
          fi

          printf '%s\t%s\t%s\n' "$recorded_context" \
            '00000000000000000000000000000000' "$uid" > "$foreign_record"
          if GATEWAY_API_LAB_OWNERSHIP_FILE="$foreign_record" \
            bash scripts/gateway_api_gatewayclass_authority_conformance.sh blackbox; then
            echo "GatewayClass check accepted a foreign run marker" >&2
            exit 1
          fi

      - name: Run upstream Gateway API conformance
        id: conformance
        env:
          GATEWAY_API_VERSION: ${{ steps.inputs.outputs.gateway_api_version }}
          GATEWAY_API_PROFILE: ${{ steps.inputs.outputs.conformance_profile }}
          GATEWAY_API_SUPPORTED_FEATURES: ${{ steps.inputs.outputs.supported_features }}
          GATEWAY_API_SKIP_TESTS: ${{ steps.inputs.outputs.skip_tests }}
        run: bash scripts/gateway_api_data_plane_conformance.sh upstream

      - name: Run Ferrum Gateway API black-box checks
        # HTTPRoute black-box coverage. The upstream suite owns live GRPCRoute
        # evidence; the dedicated step below owns live TCPRoute evidence.
        env:
          GATEWAY_API_VERSION: ${{ steps.inputs.outputs.gateway_api_version }}
          GATEWAY_API_PROFILE: ${{ steps.inputs.outputs.conformance_profile }}
          GATEWAY_API_SUPPORTED_FEATURES: ${{ steps.inputs.outputs.supported_features }}
        run: bash scripts/gateway_api_data_plane_conformance.sh blackbox

      - name: Run Ferrum Gateway API TCPRoute black-box checks
        # Ferrum-specific echo/status/update/delete coverage; this does not claim
        # an upstream GATEWAY-TCP profile on the pinned Gateway API version.
        env:
          GATEWAY_API_VERSION: ${{ steps.inputs.outputs.gateway_api_version }}
        run: bash scripts/gateway_api_tcproute_conformance.sh blackbox

      - name: Run Ferrum Gateway API TLSRoute black-box checks
        # Ferrum-specific SNI passthrough/status/update/delete coverage; this does
        # not claim an upstream GATEWAY-TLS profile on the pinned Gateway API version.
        env:
          GATEWAY_API_VERSION: ${{ steps.inputs.outputs.gateway_api_version }}
        run: bash scripts/gateway_api_tlsroute_conformance.sh blackbox

      - name: Run Ferrum Gateway API ListenerSet black-box checks
        # Ferrum-specific attachment/status/traffic/delete coverage; this does not
        # advertise upstream ListenerSet as a supported conformance feature.
        env:
          GATEWAY_API_VERSION: ${{ steps.inputs.outputs.gateway_api_version }}
        run: bash scripts/gateway_api_listenerset_conformance.sh blackbox

      - name: Run Ferrum GatewayClass authority black-box checks
        # Proves a listener appears when the owned GatewayClass is created and
        # withdraws when that class is deleted, without restarting Ferrum.
        env:
          GATEWAY_API_VERSION: ${{ steps.inputs.outputs.gateway_api_version }}
        run: bash scripts/gateway_api_gatewayclass_authority_conformance.sh blackbox

      - name: Capture controller failure evidence
        if: failure()
        continue-on-error: true
        env:
          GATEWAY_API_VERSION: ${{ steps.inputs.outputs.gateway_api_version }}
          GATEWAY_API_PROFILE: ${{ steps.inputs.outputs.conformance_profile }}
          GATEWAY_API_SUPPORTED_FEATURES: ${{ steps.inputs.outputs.supported_features }}
        run: bash scripts/gateway_api_data_plane_conformance.sh failure-evidence

      - name: Collect diagnostics
        if: always()
        env:
          GATEWAY_API_VERSION: ${{ steps.inputs.outputs.gateway_api_version }}
          GATEWAY_API_PROFILE: ${{ steps.inputs.outputs.conformance_profile }}
          GATEWAY_API_SUPPORTED_FEATURES: ${{ steps.inputs.outputs.supported_features }}
        run: bash scripts/gateway_api_data_plane_conformance.sh diagnostics

      - name: Collect TCPRoute diagnostics
        if: always()
        run: bash scripts/gateway_api_tcproute_conformance.sh diagnostics

      - name: Collect TLSRoute diagnostics
        if: always()
        run: bash scripts/gateway_api_tlsroute_conformance.sh diagnostics

      - name: Collect ListenerSet diagnostics
        if: always()
        run: bash scripts/gateway_api_listenerset_conformance.sh diagnostics

      - name: Collect GatewayClass authority diagnostics
        if: always()
        run: bash scripts/gateway_api_gatewayclass_authority_conformance.sh diagnostics

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gateway-api-conformance-${{ steps.inputs.outputs.gateway_api_version }}
          path: conformance-results/
          retention-days: 90

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gateway-api-conformance-failure-evidence-${{ steps.inputs.outputs.gateway_api_version }}
          path: conformance-results/failure-evidence/
          if-no-files-found: ignore
          retention-days: 90

  gate:
    name: Gateway API Conformance
    needs:
      - changes
      - gateway-api-conformance
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Summarize Gateway API conformance result
        run: |
          {
            echo "## Gateway API Conformance"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Failed before change detection completed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.relevant }}" = "false" ]; then
            echo "Skipped full conformance: no Gateway API, controller, data-plane, routing, chart, image, proto, script, dependency, or CI workflow surfaces changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ needs.changes.outputs.relevant }}" != "true" ]; then
            echo "Change detection returned an invalid relevance result: ${{ needs.changes.outputs.relevant }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.gateway-api-conformance.result }}" != "success" ]; then
            echo "Full conformance failed or did not complete: ${{ needs.gateway-api-conformance.result }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Full conformance passed." >> "$GITHUB_STEP_SUMMARY"
