name: Gateway API Conformance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      gateway_api_version:
        description: Gateway API tag to test against
        required: false
        default: v1.5.1
      conformance_profile:
        description: Upstream Gateway API conformance profile
        required: false
        default: GATEWAY-HTTP
      supported_features:
        description: Comma-separated Gateway API conformance features
        required: false
        default: Gateway,ReferenceGrant,HTTPRoute
      skip_tests:
        description: Optional space-separated upstream conformance tests to skip
        required: false
        default: ""
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

# PRs and main pushes get independent lanes so current CI mirrors do not queue
# behind stale labs for older SHAs. Scheduled/manual runs keep sharing one lane
# for lab budget.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gateway-api-conformance-pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('gateway-api-conformance-{0}', github.ref) || 'gateway-api-conformance-shared') }}
  # Cancel a superseded PR/main lab on rapid re-push (its mirror in ci.yml is
  # already cancelled, so nothing reads the stale run). Scheduled and manual
  # runs share one lane and must run to completion for lab budget.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  FERRUM_IMAGE: ferrum-edge:gateway-api-conformance
  KIND_VERSION: v0.27.0
  KUBECTL_VERSION: v1.32.3

jobs:
  changes:
    name: Gateway API conformance trigger
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Check for Gateway API conformance changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          python3 .github/scripts/live_suite_path_filter.py --self-test
          changed_files="$RUNNER_TEMP/gateway-api-conformance-changed-files.txt"
          : > "$changed_files"

          filter_args=(--suite gateway-api --changed-files "$changed_files")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Diff against the live base branch ref (triple-dot = merge-base) so the
            # path filter only sees this PR's changes. github.event.pull_request.base.sha
            # is the base recorded when the synthetic merge ref was last built and can
            # lag main on long-lived PRs; diffing against it would pull in files that
            # main changed afterwards and wrongly route the PR through the 90-minute lab.
            base_ref="origin/${BASE_REF}"
            # Retry the base-ref fetch so a single 403/5xx/network blip does not fail
            # the changes job. Only hard-fail after exhausting the attempts: an
            # incomplete fetch would diff against a stale/missing base and mis-gate
            # the lab, so silently swallowing the failure is not safe here.
            fetched=false
            for attempt in 1 2 3; do
              if git fetch --no-tags origin "${BASE_REF}"; then
                fetched=true
                break
              fi
              echo "git fetch of ${BASE_REF} failed (attempt ${attempt}/3); retrying" >&2
              sleep $(( attempt * 10 ))
            done
            if [ "$fetched" != true ]; then
              echo "git fetch of ${BASE_REF} failed after 3 attempts" >&2
              exit 1
            fi
            git diff --name-only "${base_ref}...HEAD" | sort > "$changed_files"
          else
            filter_args+=(--force-run)
          fi

          plan="$(python3 .github/scripts/live_suite_path_filter.py "${filter_args[@]}")"
          relevant="$(printf '%s\n' "$plan" | sed -n 's/^relevant=//p')"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$plan" | sed -n '/^## /,$p' >> "$GITHUB_STEP_SUMMARY"

  gateway-api-conformance:
    name: Gateway API conformance suite
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # The host-built binary is packaged into a distroless Debian 13 image.
    # Pin the build host so its glibc stays no newer than the runtime image.
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Ferrum Edge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Resolve inputs
        id: inputs
        run: |
          set -euo pipefail
          gateway_api_version="${{ github.event.inputs.gateway_api_version }}"
          conformance_profile="${{ github.event.inputs.conformance_profile }}"
          supported_features="${{ github.event.inputs.supported_features }}"
          skip_tests="${{ github.event.inputs.skip_tests }}"
          if [ -z "$gateway_api_version" ]; then
            gateway_api_version="v1.5.1"
          fi
          if [ -z "$conformance_profile" ]; then
            conformance_profile="GATEWAY-HTTP"
          fi
          if [ -z "$supported_features" ]; then
            supported_features="Gateway,ReferenceGrant,HTTPRoute"
          fi
          {
            echo "gateway_api_version=$gateway_api_version"
            echo "conformance_profile=$conformance_profile"
            echo "supported_features=$supported_features"
            echo "skip_tests=$skip_tests"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test-functional"

      - name: Build gateway binary
        run: cargo build --profile pr-build --bin ferrum-edge

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install Kubernetes tools
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo chmod +x /usr/local/bin/kind
          sudo curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Package Ferrum image
        uses: ./.github/actions/package-ferrum-runtime-image
        with:
          binary-path: target/pr-build/ferrum-edge
          image: ${{ env.FERRUM_IMAGE }}

      - name: Set up Ferrum Gateway API lab
        env:
          GATEWAY_API_VERSION: ${{ steps.inputs.outputs.gateway_api_version }}
        run: bash scripts/gateway_api_data_plane_conformance.sh setup

      - name: Run upstream Gateway API conformance
        id: conformance
        env:
          GATEWAY_API_VERSION: ${{ steps.inputs.outputs.gateway_api_version }}
          GATEWAY_API_PROFILE: ${{ steps.inputs.outputs.conformance_profile }}
          GATEWAY_API_SUPPORTED_FEATURES: ${{ steps.inputs.outputs.supported_features }}
          GATEWAY_API_SKIP_TESTS: ${{ steps.inputs.outputs.skip_tests }}
        run: bash scripts/gateway_api_data_plane_conformance.sh upstream

      - name: Run Ferrum Gateway API black-box checks
        env:
          GATEWAY_API_VERSION: ${{ steps.inputs.outputs.gateway_api_version }}
          GATEWAY_API_PROFILE: ${{ steps.inputs.outputs.conformance_profile }}
          GATEWAY_API_SUPPORTED_FEATURES: ${{ steps.inputs.outputs.supported_features }}
        run: bash scripts/gateway_api_data_plane_conformance.sh blackbox

      - name: Collect diagnostics
        if: always()
        env:
          GATEWAY_API_VERSION: ${{ steps.inputs.outputs.gateway_api_version }}
          GATEWAY_API_PROFILE: ${{ steps.inputs.outputs.conformance_profile }}
          GATEWAY_API_SUPPORTED_FEATURES: ${{ steps.inputs.outputs.supported_features }}
        run: bash scripts/gateway_api_data_plane_conformance.sh diagnostics

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gateway-api-conformance-${{ steps.inputs.outputs.gateway_api_version }}
          path: conformance-results/
          retention-days: 90

  gate:
    name: Gateway API Conformance
    needs:
      - changes
      - gateway-api-conformance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize Gateway API conformance result
        run: |
          {
            echo "## Gateway API Conformance"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Failed before change detection completed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.relevant }}" != "true" ]; then
            echo "Skipped full conformance: no Gateway API, controller, data-plane, routing, chart, image, proto, script, dependency, or CI workflow surfaces changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ needs.gateway-api-conformance.result }}" != "success" ]; then
            echo "Full conformance failed or did not complete: ${{ needs.gateway-api-conformance.result }}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Full conformance passed." >> "$GITHUB_STEP_SUMMARY"
