name: Audit source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-source-snapshot.yml'
      - 'tools/audit/**'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact audited main revision
        uses: actions/checkout@v4
        with:
          ref: 30dfc4aee3c16f5ea5ddcb7078a2b9da6f89564c
          fetch-depth: 1

      - name: Record audited revision
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/AUDITED_SHA
          git status --short

      - name: Package source tree
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=target \
            -czf /tmp/ferrum-edge-audit-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-edge-audit-source
          path: |
            /tmp/ferrum-edge-audit-source.tar.gz
            /tmp/AUDITED_SHA
          if-no-files-found: error
          retention-days: 1
