name: Audit source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-source-snapshot.yml'
      - 'tools/audit/**'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Record audited revision
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > AUDITED_SHA
          git status --short

      - name: Package source tree
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude='*.tar.gz' \
            -czf ferrum-edge-audit-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-edge-audit-source
          path: ferrum-edge-audit-source.tar.gz
          if-no-files-found: error
          retention-days: 1
