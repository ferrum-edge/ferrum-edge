name: Audit launch-readiness candidates

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/audit-source-snapshot.yml'
      - 'tools/audit/scan_repo.py'
  push:
    branches:
      - audit/launch-readiness-2026-07-26
    paths:
      - '.github/workflows/audit-source-snapshot.yml'
      - 'tools/audit/scan_repo.py'

permissions:
  contents: write

concurrency:
  group: ferrum-launch-readiness-audit
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: audit/launch-readiness-2026-07-26
          fetch-depth: 1

      - name: Check out exact audited main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: 04b523efcab7325e7665d1afa95ca6c281de76fd
          path: audited-main
          fetch-depth: 1
          persist-credentials: false

      - name: Generate structured candidate report
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit/scan_repo.py \
            --root audited-main \
            --sha 04b523efcab7325e7665d1afa95ca6c281de76fd \
            --out tools/audit/generated
          printf '%s\n' "$GITHUB_RUN_ID" > tools/audit/generated/RUN_ID

      - name: Commit report and run ID
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/audit/generated
          if git diff --cached --quiet; then
            echo 'Candidate report is unchanged.'
          else
            git commit -m 'chore(audit): refresh generated candidate report [skip ci]'
            git push origin HEAD:audit/launch-readiness-2026-07-26
          fi

      - name: Package exact audited source
        shell: bash
        run: |
          set -euo pipefail
          tar -C audited-main \
            --exclude=.git \
            --exclude=target \
            -czf /tmp/ferrum-edge-audited-main.tar.gz .

      - name: Upload exact audited source
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-edge-audited-main-${{ github.run_id }}
          path: /tmp/ferrum-edge-audited-main.tar.gz
          if-no-files-found: error
          retention-days: 1
