name: Pool Internal Profile

on:
  # Observer-feature contracts are optional (not required, not release
  # gating). A pull request runs them only when it edits the profiler itself.
  # The shared proxy/pool/runtime surfaces the observers hook into are
  # re-validated by a daily run on the main tip (one run instead of one per
  # merge, ~20 merges/day); a red run points at that day's merges for
  # revert/bisect before the next release cut.
  pull_request:
    paths:
      - src/pool_profile/**
      - src/pool_profile_macros.rs
      - tests/unit/gateway_core/pool_profile*
      - tests/performance/multi_protocol/pool_internal_profile.py
      - tests/performance/multi_protocol/pool_profile_*.json
      - docs/pool_internal_profile.md
      - .github/workflows/pool-internal-profile.yml
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the superseded run. Every
# other event (push to main, dispatch, schedule) gets a unique group so it
# always runs to completion and never displaces another dispatch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Pool profile feature checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-test
          components: rustfmt, clippy
      - name: Native prerequisites (including shared libcurl policy)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev libcurl4-openssl-dev clang
      - name: Hosted formatting
        run: cargo fmt --all -- --check
      - name: Feature lint
        run: cargo clippy --locked --features bench-pool-profile --lib --bin ferrum-edge --test unit_gateway_core_tests --test integration_tests -- -D warnings
      - name: Observer publication, polls and allocation attribution
        run: |
          cargo test --locked --features bench-pool-profile --lib pool_profile::store::tests
          cargo test --locked --features bench-pool-profile --test unit_gateway_core_tests pool_profile_tests
          cargo test --locked --features bench-pool-profile --test unit_gateway_core_tests h1_profile_tests
          cargo test --locked --features bench-pool-profile --test unit_gateway_core_tests pool_create_failure
          cargo test --locked --features bench-pool-profile --test unit_gateway_core_tests pool_key_tests
          cargo test --locked --features bench-pool-profile --test unit_gateway_core_tests grpc_capability_probe_log_tests
      - name: Live pool behavior with and without observers
        run: |
          cargo build --locked --features bench-pool-profile --bin ferrum-edge
          cargo test --locked --features bench-pool-profile --test integration_tests http2_pool_tests
          cargo test --locked --test integration_tests http2_pool_tests
      - name: Harness build and retained-failure schema checks
        run: |
          cargo build --locked --manifest-path tests/performance/multi_protocol/Cargo.toml
          python3 -m unittest discover --verbose --start-directory tests/performance/multi_protocol/tests --pattern 'test_pool_internal_profile.py'
          python3 -m unittest discover --verbose --start-directory tests/performance/multi_protocol/tests --pattern 'test_h1_internal_profile.py'

  measurement:
    name: Pool calibration and profile (${{ matrix.protocol }}, ${{ matrix.payload }})
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      # Each cell owns both arms, four pairs and repeated direct controls on
      # ONE host. Larger sizes remain explicit rechecks, never inferred wins.
      matrix:
        protocol: [http2, grpcs]
        payload: [10240, 71680, 512000, 1048576, 5242880]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-perf
          workspaces: |
            . -> target
            tests/performance/multi_protocol -> target
      - name: Hosted prerequisites and memory headroom
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev libcurl4-openssl-dev clang lsof binutils
          sudo fallocate -l 12G /mnt/pool-profile-swap
          sudo chmod 600 /mnt/pool-profile-swap
          sudo mkswap /mnt/pool-profile-swap
          sudo swapon /mnt/pool-profile-swap
      - name: Retain source and runner identity
        run: |
          mkdir -p pool-profile-evidence/builds/off pool-profile-evidence/builds/on
          git rev-parse HEAD > pool-profile-evidence/revision.txt
          git status --porcelain > pool-profile-evidence/source-status.txt
          git archive HEAD | sha256sum > pool-profile-evidence/source-tree.sha256
          cp Cargo.toml Cargo.lock .cargo/config.toml pool-profile-evidence/builds/
          cp tests/performance/multi_protocol/Cargo.lock pool-profile-evidence/builds/harness-Cargo.lock
          rustc -Vv > pool-profile-evidence/builds/rustc.txt
          cargo -V > pool-profile-evidence/builds/cargo.txt
          printf '%s\n' "RUSTFLAGS=${RUSTFLAGS-<unset>}" "RUSTC_WRAPPER=${RUSTC_WRAPPER-<unset>}" \
            "CARGO_BUILD_RUSTC_WRAPPER=${CARGO_BUILD_RUSTC_WRAPPER-<unset>}" \
            "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=${CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER-<unset>}" \
            > pool-profile-evidence/builds/effective-build-environment.txt
          uname -a > pool-profile-evidence/kernel.txt
          lscpu > pool-profile-evidence/cpu.txt
          free -k > pool-profile-evidence/memory.txt
          cat /proc/sys/kernel/random/boot_id > pool-profile-evidence/boot-id.txt
          printf '%s\n' 'cpu_stacks=not_collected' 'hardware_cache_events=not_collected' \
            'stream_credit_wait=opaque' 'correctness_disposition=pending_root' \
            > pool-profile-evidence/residuals.txt
      - name: Build observer-off twin (H1 foundation retained)
        env:
          CARGO_PROFILE_RELEASE_DEBUG: '1'
          CARGO_PROFILE_RELEASE_STRIP: 'none'
        run: |
          set -euo pipefail
          unset FERRUM_CUSTOM_PLUGINS
          cargo build --locked --release --features bench-h1-profile --bin ferrum-edge --bin ferrum-cni 2>&1 | tee pool-profile-evidence/builds/off/build.log
          mkdir -p bin/amd64
          cp target/release/ferrum-edge target/release/ferrum-cni bin/amd64/
          sha256sum bin/amd64/* > pool-profile-evidence/builds/off/binaries.sha256
          readelf -n bin/amd64/ferrum-edge > pool-profile-evidence/builds/off/build-id.txt
          objcopy --only-keep-debug bin/amd64/ferrum-edge pool-profile-evidence/builds/off/ferrum-edge.debug
          docker build -f Dockerfile.release --build-arg TARGETARCH=amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label ferrum.pool-profile=off -t ferrum-pool:off .
          docker image inspect ferrum-pool:off > pool-profile-evidence/builds/off/image.json
          printf '%s\n' 'features=crypto-ring,bench-h1-profile' 'debug=1' 'strip=none' \
            'custom_plugins=production-default' 'optimization=release shared Cargo.toml/.cargo policy' > pool-profile-evidence/builds/off/flags.txt
      - name: Build observer-on twin at the same revision
        env:
          CARGO_PROFILE_RELEASE_DEBUG: '1'
          CARGO_PROFILE_RELEASE_STRIP: 'none'
        run: |
          set -euo pipefail
          unset FERRUM_CUSTOM_PLUGINS
          cargo build --locked --release --features bench-pool-profile --bin ferrum-edge --bin ferrum-cni 2>&1 | tee pool-profile-evidence/builds/on/build.log
          cp target/release/ferrum-edge target/release/ferrum-cni bin/amd64/
          sha256sum bin/amd64/* > pool-profile-evidence/builds/on/binaries.sha256
          readelf -n bin/amd64/ferrum-edge > pool-profile-evidence/builds/on/build-id.txt
          objcopy --only-keep-debug bin/amd64/ferrum-edge pool-profile-evidence/builds/on/ferrum-edge.debug
          docker build -f Dockerfile.release --build-arg TARGETARCH=amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label ferrum.pool-profile=on -t ferrum-pool:on .
          docker image inspect ferrum-pool:on > pool-profile-evidence/builds/on/image.json
          printf '%s\n' 'features=crypto-ring,bench-h1-profile,bench-pool-profile' 'debug=1' 'strip=none' \
            'custom_plugins=production-default' 'optimization=release shared Cargo.toml/.cargo policy' > pool-profile-evidence/builds/on/flags.txt
      - name: Build common harness
        run: cargo build --locked --release --manifest-path tests/performance/multi_protocol/Cargo.toml
      - name: Four same-host overhead pairs
        id: calibration
        continue-on-error: true
        env:
          POOL_PROTOCOL: ${{ matrix.protocol }}
          POOL_PAYLOAD: ${{ matrix.payload }}
        run: |
          FERRUM_IMAGE=ferrum-pool:on bash tests/performance/multi_protocol/run_gateway_protocol_bench.sh \
            "$POOL_PROTOCOL" --pool-profile calibration --baseline-image ferrum-pool:off \
            --gateways ferrum --skip-build --duration 15 --concurrency 200 --pairs 4 \
            --payload-sizes "$POOL_PAYLOAD" --wallclock-budget-seconds 3600 \
            --output-dir pool-profile-evidence/calibration
      - name: Four same-image profile pairs
        id: profile
        continue-on-error: true
        env:
          POOL_PROTOCOL: ${{ matrix.protocol }}
          POOL_PAYLOAD: ${{ matrix.payload }}
        run: |
          FERRUM_IMAGE=ferrum-pool:on bash tests/performance/multi_protocol/run_gateway_protocol_bench.sh \
            "$POOL_PROTOCOL" --pool-profile profile --baseline-image ferrum-pool:on \
            --gateways ferrum --skip-build --duration 15 --concurrency 200 --pairs 4 \
            --payload-sizes "$POOL_PAYLOAD" --wallclock-budget-seconds 3600 \
            --output-dir pool-profile-evidence/profile
      - name: Retain all failed and incomplete observations
        if: always()
        env:
          POOL_PROTOCOL: ${{ matrix.protocol }}
        run: |
          status=0
          python3 tests/performance/multi_protocol/pool_internal_profile.py report pool-profile-evidence/calibration calibration "$POOL_PROTOCOL" || status=1
          python3 tests/performance/multi_protocol/pool_internal_profile.py report pool-profile-evidence/profile profile "$POOL_PROTOCOL" || status=1
          exit "$status"
      - name: Retain raw evidence and matching symbols
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pool-profile-${{ github.sha }}-${{ matrix.protocol }}-${{ matrix.payload }}
          path: pool-profile-evidence/
          retention-days: 14
      - name: Preserve campaign failures in the job conclusion
        if: always()
        env:
          CALIBRATION_OUTCOME: ${{ steps.calibration.outcome }}
          PROFILE_OUTCOME: ${{ steps.profile.outcome }}
        run: test "$CALIBRATION_OUTCOME" = success && test "$PROFILE_OUTCOME" = success
