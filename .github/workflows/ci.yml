name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  test-unit:
    name: Unit Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test"

      - name: Run unit tests
        run: cargo test --test unit_tests
        env:
          RUST_BACKTRACE: 1

  test-lib:
    name: Inline Lib Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test"

      - name: Run inline lib tests
        # Covers `#[cfg(test)] mod tests` blocks inline in `src/` (used for
        # private fns/structs that the separate tests/ binaries can't see).
        # CLAUDE.md lists them as required pre-commit checks; CI now runs them
        # too so a regression in an inline test fails the PR instead of
        # waiting until someone runs the lib suite locally.
        run: cargo test --lib
        env:
          RUST_BACKTRACE: 1

  test-integration:
    # Integration tests are an in-process suite — they spin up gateway state,
    # databases, gRPC servers, etc. inside the test process (no external
    # binary), so they ALSO don't need redis/mongo services. The shard split
    # below groups the 57 test files into 5 logical buckets sized roughly by
    # test count (admin-api ~153, admin-config ~152, mesh-routing ~158,
    # mesh-platform ~60, protocols-data-plane ~150). Two-hundred-plus
    # wall-clock waits in `wait_for_poll` / `wait_for_route` / fixed sleeps
    # gate the suite far more than CPU time, so sharding wins are wall-clock
    # parallelism not core utilisation — same shape as `test-functional`.
    name: Integration Tests (${{ matrix.shard }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: admin-api
            # Heavy admin-API surface: spec import/export, DB-backed specs,
            # RBAC/audit, backend capabilities, runtime metrics.
            filters: |
              integration::admin_api_specs_handler_tests
              integration::admin_db_api_specs_tests
              integration::admin_audit_rbac_tests
              integration::admin_backend_capabilities_tests
              integration::admin_runtime_metrics_tests
          - shard: admin-config
            # Cached config / cross-namespace refs / mesh-config admin
            # endpoints / log schema / deferred logging. These share the
            # admin-side config-cache and log-pipeline machinery so they
            # land together.
            filters: |
              integration::admin_cached_config_tests
              integration::admin_cross_namespace_refs_tests
              integration::admin_mesh_config_drift_tests
              integration::admin_mesh_egress_scope_tests
              integration::admin_mesh_policy_denies_tests
              integration::admin_mesh_runtime_overlay_tests
              integration::admin_mesh_service_graph_tests
              integration::admin_node_waypoint_identities_tests
              integration::apply_incremental_outcome_tests
              integration::log_schema_integration_tests
              integration::log_schema_registry_tests
              integration::deferred_log_tests
          - shard: mesh-routing
            # End-to-end mesh dispatch + authz + DestinationRule + sidecar
            # tests. Heaviest mesh slice tests since each one stands up a
            # mock workload set and asserts on the routing/auth outcome.
            filters: |
              integration::mesh_l7_routing_tests
              integration::mesh_topology_hbone_tests
              integration::mesh_authz_e2e_tests
              integration::mesh_authz_negative_match_tests
              integration::mesh_service_waypoint_tests
              integration::mesh_ew_egress_e2e_tests
              integration::mesh_destination_rule_tls_tests
              integration::mesh_destination_rule_locality_lb_tests
              integration::mesh_destination_rule_port_policy_tests
              integration::mesh_dr_service_entry_e2e_tests
              integration::mesh_sidecar_e2e_tests
          - shard: mesh-platform
            # k8s controller status, telemetry, federation poller, peer-auth
            # live reload, CNI, hbone tunnel, proxy-config / runtime-overlay
            # consumers. Heavier per-test setup (k8s clients, telemetry
            # collectors) balances the smaller test count.
            filters: |
              integration::k8s_controller_istio_status_tests
              integration::mesh_telemetry_k8s_provider_lookup_tests
              integration::mesh_telemetry_tracing_tests
              integration::mesh_federation_poller_tests
              integration::mesh_proxy_config_tests
              integration::mesh_outbound_registry_stream_tests
              integration::mesh_runtime_overlay_consumers_tests
              integration::mesh_peer_auth_live_reload_tests
              integration::mesh_k8s_pod_discovery_tests
              integration::mesh_hbone_tests
              integration::cni_tests
          - shard: protocols-data-plane
            # Protocol / TLS / connection-pool / CP-DP gRPC / DB poll /
            # graceful-shutdown / SVID identity. The CP-DP file alone has
            # ~46 tests, so this shard pairs it with the smaller TLS /
            # connection / DB files to balance.
            filters: |
              integration::cp_dp_grpc_tests
              integration::cp_multi_namespace_tests
              integration::connection_pool_tests
              integration::http2_pool_tests
              integration::http3_integration_tests
              integration::grpc_proxy_tests
              integration::scripted_backend_smoke_tests
              integration::dtls_integration_tests
              integration::backend_mtls_tests
              integration::backend_tls_san_allow_list_tests
              integration::frontend_tls_live_reload_tests
              integration::tcp_frontend_tls_order_tests
              integration::tcp_fast_path_l4_plugins_tests
              integration::gateway_hbone_pool_tests
              integration::gateway_svid_identity_tests
              integration::graceful_shutdown_tests
              integration::db_incremental_poll_tests
              integration::db_offline_bootstrap_tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test"

      - name: Install cargo-nextest
        # Same prebuilt-binary install action as `test-functional`. Nextest
        # gives us per-test process isolation, OR'd substring filters via
        # positional args, and a much nicer progress UI than libtest.
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2
        with:
          tool: cargo-nextest

      - name: Run integration test shard
        # Mirrors the `test-functional` shard runner. Each filter line is a
        # substring matched against the full test path
        # (`integration::<file_module>::<test_name>`) — nextest ORs them.
        # Listing the file-module prefix scopes the shard to one set of
        # files without per-test enumeration.
        run: |
          set -e
          filters=()
          while IFS= read -r filter; do
            [ -z "$filter" ] && continue
            filters+=("$filter")
          done <<< "$INTEGRATION_FILTERS"
          cargo nextest run --test integration_tests \
            --no-fail-fast \
            "${filters[@]}"
        env:
          INTEGRATION_FILTERS: ${{ matrix.filters }}
          RUST_BACKTRACE: 1
        timeout-minutes: 30

      - name: Summarize integration shard
        if: always()
        run: |
          echo "## Integration Test Shard: ${{ matrix.shard }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "$INTEGRATION_FILTERS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          INTEGRATION_FILTERS: ${{ matrix.filters }}

  test-integration-coverage:
    # Sanity check: every test file in tests/integration/ must be listed in
    # exactly one shard above. Catches the easy mistake of adding a new
    # `mod foo_tests` and forgetting to wire it into the matrix. We diff
    # the on-disk file set against the union of the shard filters; the job
    # fails if either side has files the other doesn't.
    name: Integration Test Shard Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test-integration
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Verify every integration_tests module is sharded
        run: |
          set -euo pipefail
          # All non-helper test files (excluding mod.rs and the shared
          # mesh_test_support helper).
          actual=$(ls tests/integration/*.rs \
            | xargs -n1 basename \
            | sed 's/\.rs$//' \
            | grep -v -E '^(mod|mesh_test_support)$' \
            | sort -u)
          # All filter lines under `test-integration:` matrix that name an
          # `integration::<file_module>` filter. POSIX-friendly regex —
          # `[[:space:]]` instead of `\s` so this also works on macOS dev
          # shells if anyone runs it locally.
          declared=$(grep -hE '^[[:space:]]+integration::[a-z0-9_]+_tests[[:space:]]*$' .github/workflows/ci.yml \
            | sed -E 's|^[[:space:]]+integration::||; s|[[:space:]]+$||' \
            | sort -u)
          if ! diff <(echo "$actual") <(echo "$declared") > /tmp/integration-coverage.diff; then
            echo "Integration shard coverage mismatch. Files missing from a shard, or stale filters:"
            cat /tmp/integration-coverage.diff
            exit 1
          fi
          echo "All $(echo "$actual" | wc -l | tr -d ' ') integration test files are sharded."

  test-conformance:
    name: Mesh Conformance Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test"

      - name: Run mesh conformance tests
        # Covers the Istio/xDS compatibility matrix under tests/conformance.
        # This is a separate job so mesh conformance gates PRs without adding
        # latency to the unit or integration shards.
        run: cargo test --test conformance_tests
        env:
          RUST_BACKTRACE: 1

      - name: Upload mesh conformance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mesh-conformance-coverage
          path: target/conformance/
          retention-days: 14
          if-no-files-found: ignore

  build-gateway-binary:
    name: Build Gateway Binary (functional tests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test-functional"

      - name: Build gateway binary
        run: cargo build --bin ferrum-edge

      - name: Upload gateway binary
        # Shared across every test-functional shard via download-artifact so
        # the ~60s `cargo build --bin ferrum-edge` step runs once instead of
        # six times. Functional tests look for ./target/debug/ferrum-edge;
        # shards re-create that path on download.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ferrum-edge-debug
          path: target/debug/ferrum-edge
          retention-days: 1
          if-no-files-found: error

  test-functional:
    name: Functional Tests (${{ matrix.shard }})
    if: github.event_name == 'pull_request'
    needs: build-gateway-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: harness
            filters: |
              common::
              scaffolding::
              scenarios::
              functional_shared_harness_smoke_test
              functional_cli_test
              functional_node_agent_test
              functional_ci_shard_coverage_test
          - shard: admin-routing
            filters: |
              functional_admin_observability_test
              functional_admin_operations_test
              functional_auth_acl_test
              functional_credential_rotation_test
              functional_file_mode_test
              functional_host_only_routing_test
              functional_migrate_mode_test
              functional_protocol_validation_test
              functional_regex_routing_test
              functional_router_cache_test
              functional_secrets_test
          - shard: plugins
            filters: |
              functional_ai_plugins_test
              functional_grpc_plugins_test
              functional_logging_plugins_test
              functional_logging_test
              functional_otel_ldap_test
              functional_plugin_extended_test
              functional_plugin_test
              functional_plugins_network_test
              functional_prometheus_test
              functional_serverless_mirror_test
              functional_ws_plugins_test
          - shard: protocols
            filters: |
              functional_grpc_test
              functional_passthrough_test
              functional_sse_test
              functional_stream_listener_failure_test
              functional_tcp_proxy_test
              functional_udp_proxy_test
              functional_websocket_test
              scripted_backend_h2_tests
              scripted_backend_h3_tests
              scripted_backend_matrix_tests
              scripted_backend_network_sim_tests
              scripted_backend_tests
              scripted_backend_udp_tests
              functional_early_data_test
              functional_ws_origin_test
              functional_allowed_methods_test
              functional_forwarded_via_headers_test
              functional_streaming_latency_tracking_test
              functional_chunked_request_size_limits_test
              functional_chunked_response_size_limits_test
              functional_body_size_limits_test
              functional_url_query_limits_test
              functional_header_size_limits_test
              functional_protocol_h3_request_body_test
              functional_protocol_h3_body_limit_config_test
              functional_protocol_h2_body_limit_config_test
              functional_protocol_body_limit_config_test
              functional_h3_authority_validation_test
              functional_websocket_limits_test
          - shard: data-plane
            # Serialized because DP functional tests bind exclusive ports and
            # race when nextest runs this shard in parallel.
            nextest_jobs: 1
            filters: |
              functional_capability_registry_test
              functional_cp_dp_resilience_test
              functional_cp_dp_test
              functional_database_test
              functional_db_failover_test
              functional_db_outage_test
              functional_db_tls_test
              functional_db_upstream_test
              functional_mesh_mode_test
              functional_mongodb_test
              functional_namespace_test
              functional_redis_rate_limiting_test
          - shard: resilience
            filters: |
              functional_circuit_breaker_retry_test
              functional_dns_cache_test
              functional_graceful_shutdown_test
              functional_load_balancer_test
              functional_load_stress_test
              functional_mtls_acl_test
              functional_mtls_test
              functional_overload_test
              functional_retry_test
              functional_scale_perf_test
              functional_service_discovery_test
              functional_tls_lifecycle_test
              functional_tls_only_test
              functional_client_ip_env_test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test-functional"

      - name: Install cargo-nextest
        # Prebuilt binaries from taiki-e/install-action — no compile time.
        # Nextest's process-per-test model isolates port/process contention
        # and ships built-in slow-test + retry support, which fits this E2E
        # suite better than libtest's shared-process scheduler.
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2
        with:
          tool: cargo-nextest

      - name: Download prebuilt gateway binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ferrum-edge-debug
          path: target/debug

      - name: Mark gateway binary executable
        # actions/download-artifact does not preserve the executable bit.
        run: chmod +x target/debug/ferrum-edge

      - name: Run functional test shard
        # ── Single nextest invocation per shard ───────────────────────────
        # The old loop ran `cargo test` once per filter line, paying cargo's
        # fingerprint-check + libtest startup (~3–5s) every iteration. With
        # 7–13 filters per shard that was 30–60s of pure overhead. Here we
        # collect the filters into an argv array and let nextest OR them.
        #
        # `--run-ignored=all` mirrors libtest's `--include-ignored` so the
        # non-ignored harness unit tests bundled into the functional_tests
        # binary (e.g. `common::config_builder::tests::*`) run alongside the
        # ignored E2E tests.
        #
        # The filter expression excludes the long stress suites that are
        # intentionally local-only:
        #   - test_scale_perf_30k_proxies (matches both base + _postgres)
        #   - test_load_stress_10k_proxies (single ignored test in that file)
        #
        # `FERRUM_SKIP_GATEWAY_BUILD=1` makes `ensure_gateway_built()` in the
        # harness skip its per-process `cargo build --bin ferrum-edge` and
        # trust the artifact we just downloaded. Critical with nextest's
        # one-process-per-test model — otherwise every test would pay the
        # cargo fingerprint check on first call.
        run: |
          set -e
          filters=()
          while IFS= read -r filter; do
            [ -z "$filter" ] && continue
            filters+=("$filter")
          done <<< "$FUNCTIONAL_FILTERS"
          nextest_args=()
          if [ -n "${NEXTEST_JOBS:-}" ]; then
            nextest_args+=("-j" "$NEXTEST_JOBS")
          fi
          cargo nextest run --test functional_tests \
            --run-ignored=all \
            --no-fail-fast \
            -E 'not test(/test_scale_perf_30k_proxies/) and not test(/test_load_stress_10k_proxies/)' \
            "${nextest_args[@]}" \
            "${filters[@]}"
        env:
          FUNCTIONAL_FILTERS: ${{ matrix.filters }}
          NEXTEST_JOBS: ${{ matrix.nextest_jobs }}
          FERRUM_SKIP_GATEWAY_BUILD: "1"
          RUST_BACKTRACE: 1
        timeout-minutes: 30

      - name: Summarize functional shard
        if: always()
        run: |
          echo "## Functional Test Shard: ${{ matrix.shard }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "$FUNCTIONAL_FILTERS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          FUNCTIONAL_FILTERS: ${{ matrix.filters }}

  gateway-api-conformance:
    name: Gateway API Conformance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FERRUM_IMAGE: ferrum-edge:gateway-api-conformance
      KIND_VERSION: v0.27.0
      KUBECTL_VERSION: v1.32.3
      GATEWAY_API_VERSION: v1.5.1
      GATEWAY_API_SUPPORTED_FEATURES: Gateway,HTTPRoute
      # This CI lab deploys the Gateway API controller/status surface only.
      # Full GATEWAY-HTTP profile traffic conformance needs a routable Ferrum
      # data-plane Service and should be enabled with that runtime work.
      GATEWAY_API_CONFORMANCE_TESTS: >-
        GatewayClassObservedGenerationBump
        GatewayObservedGenerationBump
        HTTPRouteObservedGenerationBump
        HTTPRouteInvalidCrossNamespaceParentRef
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for Gateway API conformance changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(\.github/workflows/(ci|gateway-api-conformance)\.yml|Cargo\.(toml|lock)|Dockerfile|charts/ferrum-mesh/|proto/|src/grpc/|src/k8s_controller/|src/modes/mesh/)'; then
            echo "gateway_api_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "gateway_api_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.changes.outputs.gateway_api_changed == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Install Kubernetes tools
        if: steps.changes.outputs.gateway_api_changed == 'true'
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo chmod +x /usr/local/bin/kind
          sudo curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Build Ferrum image
        if: steps.changes.outputs.gateway_api_changed == 'true'
        run: docker build -t "$FERRUM_IMAGE" .

      - name: Create kind cluster
        if: steps.changes.outputs.gateway_api_changed == 'true'
        run: |
          set -euo pipefail
          kind create cluster --name ferrum-gwapi --wait 120s
          kind load docker-image "$FERRUM_IMAGE" --name ferrum-gwapi

      - name: Install Gateway API CRDs
        if: steps.changes.outputs.gateway_api_changed == 'true'
        run: |
          set -euo pipefail
          kubectl apply --server-side=true -f "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml"
          for crd in \
            gatewayclasses.gateway.networking.k8s.io \
            gateways.gateway.networking.k8s.io \
            httproutes.gateway.networking.k8s.io \
            grpcroutes.gateway.networking.k8s.io \
            referencegrants.gateway.networking.k8s.io; do
            kubectl wait --for=condition=Established "crd/${crd}" --timeout=120s
          done

      - name: Deploy Ferrum mesh controller
        if: steps.changes.outputs.gateway_api_changed == 'true'
        run: |
          set -euo pipefail
          kubectl create namespace ferrum
          # Exercise the Gateway API controller only; do not install the
          # injector webhook because it can intercept pod admission before its
          # own TLS secret/endpoints exist in this single-node conformance lab.
          helm upgrade --install ferrum ./charts/ferrum-mesh \
            --namespace ferrum \
            --set image.repository=ferrum-edge \
            --set image.tag=gateway-api-conformance \
            --set image.pullPolicy=IfNotPresent \
            --set injector.enabled=false \
            --set ca.enabled=false \
            --set controlPlane.rbac.create=true \
            --set controlPlane.rbac.gatewayApi=true \
            --set controlPlane.rbac.istio=false \
            --set controlPlane.rbac.meshConfig=false \
            --set controlPlane.rbac.podDiscovery=true \
            --set controlPlane.env.FERRUM_DB_TYPE=sqlite \
            --set-string 'controlPlane.env.FERRUM_DB_URL=sqlite:////tmp/ferrum-gateway-api-conformance.db?mode=rwc' \
            --set controlPlane.env.FERRUM_ADMIN_JWT_SECRET=ferrum-edge-gateway-api-conformance-admin-secret \
            --set controlPlane.env.FERRUM_CP_DP_GRPC_JWT_SECRET=ferrum-edge-gateway-api-conformance-grpc-secret \
            --set-string 'controlPlane.env.FERRUM_CP_NAMESPACES=*' \
            --set controlPlane.env.FERRUM_LOG_LEVEL=info \
            --set controlPlane.env.FERRUM_K8S_CONTROLLER_ENABLED=true \
            --set controlPlane.env.FERRUM_K8S_WATCH_GATEWAY_API_CRDS=true \
            --set controlPlane.env.FERRUM_K8S_WATCH_ISTIO_CRDS=false \
            --set controlPlane.env.FERRUM_K8S_WATCH_MESH_CONFIG=false
          if ! kubectl -n ferrum rollout status deployment/ferrum-mesh-control-plane --timeout=180s; then
            kubectl -n ferrum describe deployment/ferrum-mesh-control-plane || true
            kubectl -n ferrum describe replicasets || true
            kubectl -n ferrum describe pods || true
            kubectl -n ferrum logs deployment/ferrum-mesh-control-plane --all-containers --tail=200 || true
            kubectl -n ferrum get events --sort-by=.lastTimestamp || true
            echo "::error title=Control plane never reached Ready::skipping conformance run"
            exit 1
          fi

      - name: Create Ferrum GatewayClass
        if: steps.changes.outputs.gateway_api_changed == 'true'
        run: |
          cat <<'YAML' | kubectl apply -f -
          apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: ferrum
          spec:
            controllerName: ferrum.io/gateway-controller
          YAML

      - name: Run upstream Gateway API conformance
        if: steps.changes.outputs.gateway_api_changed == 'true'
        id: conformance
        run: |
          set -uo pipefail
          results="$GITHUB_WORKSPACE/conformance-results"
          mkdir -p "$results"
          git clone --depth 1 --branch "$GATEWAY_API_VERSION" https://github.com/kubernetes-sigs/gateway-api.git /tmp/gateway-api
          cd /tmp/gateway-api
          : > "$results/gateway-api-conformance-test.json"
          status=0
          for test_name in $GATEWAY_API_CONFORMANCE_TESTS; do
            echo "::group::Gateway API conformance: ${test_name}"
            test_log="$results/gateway-api-conformance-${test_name}.json"
            test_report="$results/gateway-api-conformance-${test_name}-report.yaml"
            go test -json ./conformance -run TestConformance -count=1 -timeout=10m -args \
              --gateway-class=ferrum \
              --supported-features="$GATEWAY_API_SUPPORTED_FEATURES" \
              --run-test="$test_name" \
              --cleanup-base-resources=false \
              --organization=Ferrum \
              --project="Ferrum Edge" \
              --url=https://github.com/ferrum-edge/ferrum-edge \
              --version="${GITHUB_SHA}" \
              --contact=https://github.com/ferrum-edge/ferrum-edge/issues \
              --report-output="$test_report" \
              2>&1 | tee "$test_log"
            test_status=${PIPESTATUS[0]}
            cat "$test_log" >> "$results/gateway-api-conformance-test.json"
            if [ "$test_status" -ne 0 ]; then
              echo "::error title=Gateway API conformance failed::${test_name} exited with ${test_status}"
              status="$test_status"
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Collect Gateway API conformance diagnostics
        if: always() && steps.changes.outputs.gateway_api_changed == 'true'
        run: |
          set +e
          results="$GITHUB_WORKSPACE/conformance-results"
          mkdir -p "$results"
          kubectl get gatewayclasses,gateways,httproutes,grpcroutes -A -o yaml > "$results/gateway-api-resources.yaml"
          kubectl -n ferrum get all -o wide > "$results/ferrum-namespace.txt"
          kubectl -n ferrum describe deployment/ferrum-mesh-control-plane > "$results/ferrum-control-plane-deployment.txt"
          kubectl -n ferrum get events --sort-by=.lastTimestamp > "$results/ferrum-events.txt"
          kubectl -n ferrum logs deployment/ferrum-mesh-control-plane --all-containers --tail=1000 > "$results/ferrum-control-plane.log"
          {
            kubectl auth can-i get gatewayclasses/status --as=system:serviceaccount:ferrum:ferrum-mesh
            kubectl auth can-i patch gatewayclasses/status --as=system:serviceaccount:ferrum:ferrum-mesh
            kubectl auth can-i get gateways/status --as=system:serviceaccount:ferrum:ferrum-mesh -n gateway-conformance-infra
            kubectl auth can-i patch gateways/status --as=system:serviceaccount:ferrum:ferrum-mesh -n gateway-conformance-infra
            kubectl auth can-i get httproutes/status --as=system:serviceaccount:ferrum:ferrum-mesh -n gateway-conformance-infra
            kubectl auth can-i patch httproutes/status --as=system:serviceaccount:ferrum:ferrum-mesh -n gateway-conformance-infra
          } > "$results/ferrum-rbac-can-i.txt"
          cat > "$results/CONFORMANCE.md" <<EOF
          # Gateway API Conformance

          Gateway API version: ${GATEWAY_API_VERSION}

          Supported features: ${GATEWAY_API_SUPPORTED_FEATURES}

          Targeted upstream tests: ${GATEWAY_API_CONFORMANCE_TESTS}

          Artifacts:
          - gateway-api-conformance-test.json
          - gateway-api-conformance-*-report.yaml
          - gateway-api-resources.yaml
          - ferrum-namespace.txt
          - ferrum-control-plane-deployment.txt
          - ferrum-events.txt
          - ferrum-control-plane.log
          - ferrum-rbac-can-i.txt
          EOF

      - name: Upload Gateway API conformance artifacts
        if: always() && steps.changes.outputs.gateway_api_changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gateway-api-conformance-${{ env.GATEWAY_API_VERSION }}
          path: conformance-results/

      - name: Summarize Gateway API conformance skip
        if: steps.changes.outputs.gateway_api_changed != 'true'
        run: |
          echo "## Gateway API Conformance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped: this PR does not touch Gateway API, mesh controller, chart, image, proto, or CI workflow surfaces." >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests
    if: always() && github.event_name == 'pull_request'
    needs:
      - test-unit
      - test-lib
      - test-integration
      - test-conformance
      - build-gateway-binary
      - test-functional
      - gateway-api-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Summarize test results
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit | ${{ needs.test-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Inline lib | ${{ needs.test-lib.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.test-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mesh conformance | ${{ needs.test-conformance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gateway binary build | ${{ needs.build-gateway-binary.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Functional shards | ${{ needs.test-functional.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gateway API conformance | ${{ needs.gateway-api-conformance.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test-unit.result }}" != "success" ] ||
             [ "${{ needs.test-lib.result }}" != "success" ] ||
             [ "${{ needs.test-integration.result }}" != "success" ] ||
             [ "${{ needs.test-conformance.result }}" != "success" ] ||
             [ "${{ needs.build-gateway-binary.result }}" != "success" ] ||
             [ "${{ needs.test-functional.result }}" != "success" ] ||
             [ "${{ needs.gateway-api-conformance.result }}" != "success" ]; then
            exit 1
          fi

  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-lint"
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  build-ebpf:
    name: Build eBPF Programs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check for eBPF changes
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^ebpf/'; then
            echo "ebpf_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ebpf_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install nightly Rust with rust-src
        if: steps.changes.outputs.ebpf_changed == 'true'
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          components: rust-src

      - name: Install stable Rust for shared types
        if: steps.changes.outputs.ebpf_changed == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - if: steps.changes.outputs.ebpf_changed == 'true'
        uses: ./.github/actions/setup-sccache

      - if: steps.changes.outputs.ebpf_changed == 'true'
        uses: ./.github/actions/setup-fast-linker

      - name: Install bpf-linker
        if: steps.changes.outputs.ebpf_changed == 'true'
        run: cargo install bpf-linker --locked

      - name: Build BPF programs
        if: steps.changes.outputs.ebpf_changed == 'true'
        run: cd ebpf && cargo +nightly build --target bpfel-unknown-none -Z build-std=core --release -p ferrum-ebpf

      - name: Test shared types
        if: steps.changes.outputs.ebpf_changed == 'true'
        run: cd ebpf && cargo test -p ferrum-ebpf-common

      - name: Upload BPF artifact
        if: steps.changes.outputs.ebpf_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ebpf-programs
          path: ebpf/target/bpfel-unknown-none/release/ferrum-ebpf
          retention-days: 14

  performance-regression:
    name: Performance Regression Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-perf"

      - name: Build release binaries
        run: |
          cargo build --profile ci-release --bin ferrum-edge
          cd tests/performance && cargo build --release --bin backend_server

      - name: Start backend server
        run: |
          tests/performance/target/release/backend_server > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:3001/health > /dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Backend failed to start"
              cat /tmp/backend.log
              exit 1
            fi
            sleep 1
          done

      - name: Start gateway
        run: |
          FERRUM_MODE=file \
          FERRUM_FILE_CONFIG_PATH="$(pwd)/tests/performance/perf_config.yaml" \
          FERRUM_LOG_LEVEL=error \
          FERRUM_ADD_VIA_HEADER=false \
          FERRUM_POOL_MAX_IDLE_PER_HOST=200 \
          FERRUM_POOL_IDLE_TIMEOUT_SECONDS=120 \
          FERRUM_POOL_ENABLE_HTTP_KEEP_ALIVE=true \
          FERRUM_POOL_ENABLE_HTTP2=false \
          FERRUM_POOL_WARMUP_ENABLED=true \
          ./target/ci-release/ferrum-edge run > /tmp/gateway.log 2>&1 &
          echo "GATEWAY_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "Gateway ready"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Gateway failed to start"
              cat /tmp/gateway.log
              exit 1
            fi
            sleep 1
          done

      - name: Run self-relative performance test
        timeout-minutes: 5
        run: |
          mkdir -p tests/performance/ci_results
          python3 tests/performance/ci_overhead_bench.py \
            --gateway-url http://127.0.0.1:8000/api/users \
            --backend-url http://127.0.0.1:3001/api/users \
            --gateway-health-url http://127.0.0.1:8000/health \
            --concurrency 50 \
            --duration 5 \
            --iterations 3 \
            --warmup 2 \
            --overhead-threshold 50 \
            --output tests/performance/ci_results/overhead_results.json

      - name: Stop services
        if: always()
        run: |
          kill $BACKEND_PID 2>/dev/null || true
          kill $GATEWAY_PID 2>/dev/null || true

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-results
          path: tests/performance/ci_results/
          retention-days: 30

      - name: Post performance summary
        if: always()
        run: |
          echo "## Performance Regression Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tests/performance/ci_results/overhead_results.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat tests/performance/ci_results/overhead_results.json >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Performance tests did not produce results." >> $GITHUB_STEP_SUMMARY
          fi

  # ── Cross-platform builds ────────────────────────────────────────────────
  # PRs run a fast linked build (`pr-build`) to prove each platform compiles.
  # Main pushes build production `release` artifacts consumed by latest release
  # and Docker publication. Versioned tags are handled by release.yml.

  build-binaries:
    name: Build (${{ matrix.asset_name }})
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ferrum-edge
            asset_name: ferrum-edge-linux-x86_64
            cni_asset_name: ferrum-cni-linux-x86_64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: ferrum-edge
            asset_name: ferrum-edge-linux-aarch64
            cni_asset_name: ferrum-cni-linux-aarch64

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ferrum-edge
            asset_name: ferrum-edge-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ferrum-edge
            asset_name: ferrum-edge-macos-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ferrum-edge.exe
            asset_name: ferrum-edge-windows-x86_64.exe

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-sccache

      - uses: ./.github/actions/setup-fast-linker

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        # Cache restore/save is a build-time optimization, not a correctness
        # input. The Windows runner occasionally fails the post-step cache
        # upload to GitHub's cache service with no log output (observed on PR
        # #884: tar.exe completes, then the step is marked failed before any
        # error is printed). The release binary itself is already built and
        # uploaded as an artifact before this step's post phase runs, so a
        # cache miss / save failure should not gate the binary build. Treat
        # this step as best-effort across all targets to avoid an entire
        # build matrix entry going red on a transient GitHub Actions cache
        # issue.
        continue-on-error: true
        with:
          shared-key: "build-${{ matrix.target }}"

      - name: Install protoc and build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc and NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc nasm -y
          echo "C:\Program Files\NASM" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Install cross (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build PR verification binary (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && github.event_name == 'pull_request'
        run: cross build --features cloud-secrets --profile pr-build --target ${{ matrix.target }}
        env:
          RUSTC_WRAPPER: ""

      - name: Build release binary (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && github.event_name == 'push'
        run: cross build --features cloud-secrets --release --target ${{ matrix.target }}
        env:
          RUSTC_WRAPPER: ""

      - name: Build PR verification binary (cargo)
        if: matrix.target != 'aarch64-unknown-linux-gnu' && github.event_name == 'pull_request'
        run: cargo build --features cloud-secrets --profile pr-build --target ${{ matrix.target }}

      - name: Build release binary (cargo)
        if: matrix.target != 'aarch64-unknown-linux-gnu' && github.event_name == 'push'
        run: cargo build --features cloud-secrets --release --target ${{ matrix.target }}

      - name: Prepare release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "release-assets/${{ matrix.asset_name }}"
          if [[ -n "${{ matrix.cni_asset_name }}" ]]; then
            cp "target/${{ matrix.target }}/release/ferrum-cni" "release-assets/${{ matrix.cni_asset_name }}"
          fi
          cd release-assets
          for asset in *; do
            [[ "$asset" == *.sha256 ]] && continue
            if command -v sha256sum &> /dev/null; then
              sha256sum "$asset" > "$asset.sha256"
            else
              shasum -a 256 "$asset" > "$asset.sha256"
            fi
            cat "$asset.sha256"
          done

      - name: Upload artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: release-assets/

  latest-release:
    name: Update Latest Release
    needs: [build-binaries]
    if: always() && needs.build-binaries.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: downloaded-artifacts
          pattern: binary-*

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -la release-assets/

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing latest release and tag
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          # Build release notes
          cat > notes.md << 'NOTES'
          ## Latest Development Build

          Auto-built from the latest commit on `main` (${{ github.sha }}).

          For stable releases, download a versioned tag (e.g., `v1.0.0`).

          ### Binaries

          | Platform | Binary |
          |----------|--------|
          | Linux x86_64 | `ferrum-edge-linux-x86_64` |
          | Linux x86_64 CNI plugin | `ferrum-cni-linux-x86_64` |
          | Linux ARM64 | `ferrum-edge-linux-aarch64` |
          | Linux ARM64 CNI plugin | `ferrum-cni-linux-aarch64` |
          | macOS x86_64 | `ferrum-edge-macos-x86_64` |
          | macOS ARM64 (Apple Silicon) | `ferrum-edge-macos-aarch64` |
          | Windows x86_64 | `ferrum-edge-windows-x86_64.exe` |

          ### Docker

          ```bash
          docker pull ferrumedge/ferrum-edge:latest
          docker pull ghcr.io/ferrum-edge/ferrum-edge:latest
          ```

          ### Checksums

          ```
          NOTES
          cat release-assets/*.sha256 >> notes.md
          echo '```' >> notes.md

          # Create the release
          gh release create latest \
            --title "Latest Build ($(date -u +%Y-%m-%d))" \
            --notes-file notes.md \
            --prerelease \
            --target "${{ github.sha }}" \
            release-assets/*

  docker:
    name: Docker (${{ matrix.platform }})
    needs: [build-binaries]
    if: always() && needs.build-binaries.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            binary_target: x86_64-unknown-linux-gnu
            binary_asset: ferrum-edge-linux-x86_64
            cni_asset: ferrum-cni-linux-x86_64
            arch_dir: amd64
          - platform: linux/arm64
            binary_target: aarch64-unknown-linux-gnu
            binary_asset: ferrum-edge-linux-aarch64
            cni_asset: ferrum-cni-linux-aarch64
            arch_dir: arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-${{ matrix.binary_target }}
          path: downloaded-artifacts

      - name: Prepare Docker context
        run: |
          mkdir -p docker-context/bin/${{ matrix.arch_dir }}
          cp downloaded-artifacts/${{ matrix.binary_asset }} docker-context/bin/${{ matrix.arch_dir }}/ferrum-edge
          cp downloaded-artifacts/${{ matrix.cni_asset }} docker-context/bin/${{ matrix.arch_dir }}/ferrum-cni
          cp Dockerfile.release docker-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push per-platform digest
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: docker-context
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=ferrumedge/ferrum-edge,ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-digest-${{ matrix.arch_dir }}
          path: /tmp/digests/*
          if-no-files-found: error

  docker-manifest:
    name: Docker Manifest
    needs: docker
    if: always() && needs.docker.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest (Docker Hub)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ferrumedge/ferrum-edge:latest \
            -t ferrumedge/ferrum-edge:main-${{ github.sha }} \
            $(printf 'ferrumedge/ferrum-edge@sha256:%s ' *)

      - name: Create and push multi-arch manifest (GHCR)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:latest \
            -t ghcr.io/${{ github.repository }}:main-${{ github.sha }} \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
