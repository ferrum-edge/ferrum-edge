name: Stack Boxing Experiment

# Branch-only diagnostic experiment. Never merge this workflow replacement.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Isolated variants or their combined removal
        type: choice
        options: [all, combined]
        default: all
permissions:
  contents: read
concurrency:
  group: stack-box-${{ github.run_id }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_BUILD_JOBS: '3'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  BORINGCACHE_ENABLED: 'false'
jobs:
  probe:
    name: Stack probe (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'combined' && '["control", "combined"]' || '["control", "frontend", "routing-dispatch", "direct-h1", "direct-h2", "h3-exchange"]') }}
    env:
      STACK_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record immutable source and apply one isolated experiment
        run: |
          mkdir -p stack-results
          git rev-parse HEAD > stack-results/revision.txt
          printf '%s\n' "$STACK_VARIANT" > stack-results/variant.txt
          python3 tests/performance/multi_protocol/stack_box_experiment.py
          # The gateway unit suite checks the production CI policy as data.
          # Restore that exact baseline file on the ephemeral runner.
          git show d2a0052f9e9ca7fbb6caf8c855254ffbb4f93c92:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --no-ext-diff > stack-results/experiment.patch
      - name: Extend runner swap
        run: |
          sudo fallocate -l 12G /mnt/ferrum-swapfile
          sudo chmod 600 /mnt/ferrum-swapfile
          sudo mkswap /mnt/ferrum-swapfile
          sudo swapon /mnt/ferrum-swapfile
      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-debug
          cache: 'true'
          save: 'false'
      - name: Ordinary-stack library and gateway regressions
        id: gateway
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --test unit_gateway_core_tests frontend_and_backend_future_state_stays_within_the_stack_budget -- --nocapture > stack-results/gateway.log 2>&1
          cargo test --lib --test unit_gateway_core_tests -- --nocapture >> stack-results/gateway.log 2>&1
      - name: H3 state sizes and cold-connection regressions
        id: h3
        if: always() && steps.gateway.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --test integration_tests h3_cold -- --nocapture > stack-results/h3.log 2>&1
      - name: Publish observations
        if: always()
        env:
          GATEWAY_OUTCOME: ${{ steps.gateway.outcome }}
          H3_OUTCOME: ${{ steps.h3.outcome }}
        run: |
          printf 'gateway=%s\nh3=%s\n' "$GATEWAY_OUTCOME" "$H3_OUTCOME" > stack-results/outcomes.txt
          grep -h 'STACK_PROBE' stack-results/*.log >> "$GITHUB_STEP_SUMMARY" || true
          cat stack-results/outcomes.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: always()
        with:
          name: stack-box-${{ matrix.variant }}-${{ github.sha }}
          path: stack-results/
          retention-days: 30
      - name: Surface failed probes
        if: always()
        env:
          GATEWAY_OUTCOME: ${{ steps.gateway.outcome }}
          H3_OUTCOME: ${{ steps.h3.outcome }}
        run: test "$GATEWAY_OUTCOME" = success && test "$H3_OUTCOME" = success
