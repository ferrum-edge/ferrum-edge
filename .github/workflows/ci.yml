  helm-chart:
    name: Helm Chart
    if: needs.ci-plan.outputs.mode == 'full' && needs.ci-plan.outputs.run_helm == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    needs: [ci-plan, build-test-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FERRUM_IMAGE: ferrum-edge:helm-chart-ci
      KIND_VERSION: v0.27.0
      KUBECTL_VERSION: v1.32.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Kubernetes tools
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo chmod +x /usr/local/bin/kind
          sudo curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Helm static validation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ferrum-helm-results"
          helm lint ./charts/ferrum-mesh
          helm template ferrum ./charts/ferrum-mesh --namespace ferrum \
            > "$RUNNER_TEMP/ferrum-helm-results/default-rendered.yaml"
          helm template ferrum ./charts/ferrum-mesh --namespace ferrum \
            --set ambient.enabled=true \
            --set nodeAgent.enabled=true \
            --set image.repository=example/ferrum-edge \
            --set image.tag=udp-cleanup \
            > "$RUNNER_TEMP/ferrum-helm-results/ambient-udp-disabled-cleanup-rendered.yaml"
          registry_refs="$(grep -c 'name: node-waypoint-pod-registry' "$RUNNER_TEMP/ferrum-helm-results/ambient-udp-disabled-cleanup-rendered.yaml")"
          if [ "$registry_refs" -lt 4 ]; then
            echo "::error title=Ambient disabled cleanup registry missing::expected registry volume and mount in both Ambient and node-agent DaemonSets"
            exit 1
          fi
          topology_refs="$(grep -A1 'name: FERRUM_MESH_TOPOLOGY' "$RUNNER_TEMP/ferrum-helm-results/ambient-udp-disabled-cleanup-rendered.yaml" | grep -c 'ambient')"
          if [ "$topology_refs" -lt 2 ]; then
            echo "::error title=Ambient topology missing from node-agent::disabled cleanup requires both DaemonSets to render FERRUM_MESH_TOPOLOGY=ambient"
            exit 1
          fi
          image_refs="$(grep -c 'example/ferrum-edge:udp-cleanup-ebpf' "$RUNNER_TEMP/ferrum-helm-results/ambient-udp-disabled-cleanup-rendered.yaml")"
          if [ "$image_refs" -lt 2 ]; then
            echo "::error title=Ambient disabled cleanup image lacks tools::expected tools-capable -ebpf image for both DaemonSets"
            exit 1
          fi
          if grep -q 'name: FERRUM_MESH_CAPTURE_UDP_ENABLED' "$RUNNER_TEMP/ferrum-helm-results/ambient-udp-disabled-cleanup-rendered.yaml"; then
            echo "::error title=Disabled Ambient UDP capture was armed::cleanup wiring must not render the producer enable flag"
            exit 1
          fi
          helm template ferrum ./charts/ferrum-mesh --namespace ferrum \
            --set ambient.enabled=true \
            --set nodeAgent.enabled=true \
            --set nodeAgent.captureMode=iptables \
            > "$RUNNER_TEMP/ferrum-helm-results/ambient-udp-disabled-iptables-rendered.yaml"
          iptables_registry_refs="$(grep -c 'name: node-waypoint-pod-registry' "$RUNNER_TEMP/ferrum-helm-results/ambient-udp-disabled-iptables-rendered.yaml")"
          if [ "$iptables_registry_refs" -lt 4 ]; then
            echo "::error title=Ambient iptables fallback bypasses lifecycle gate::expected registry volume and mount in both DaemonSets so node-agent startup fails closed"
            exit 1
          fi
          iptables_topology_refs="$(grep -A1 'name: FERRUM_MESH_TOPOLOGY' "$RUNNER_TEMP/ferrum-helm-results/ambient-udp-disabled-iptables-rendered.yaml" | grep -c 'ambient')"
          if [ "$iptables_topology_refs" -lt 2 ]; then
            echo "::error title=Ambient iptables fallback bypasses topology gate::expected both DaemonSets to render FERRUM_MESH_TOPOLOGY=ambient so node-agent startup fails closed"
            exit 1
          fi
          if grep -q 'name: FERRUM_MESH_CAPTURE_UDP_ENABLED' "$RUNNER_TEMP/ferrum-helm-results/ambient-udp-disabled-iptables-rendered.yaml"; then
            echo "::error title=Disabled Ambient UDP capture was armed in iptables mode::lifecycle wiring must not render the producer enable flag"
            exit 1
          fi
          if grep -q 'ferrum-mesh-control-plane' "$RUNNER_TEMP/ferrum-helm-results/default-rendered.yaml"; then
            echo "::error title=Default chart rendered a control plane::controlPlane.enabled must default to false until required values are supplied"
            exit 1
          fi
          if helm template ferrum ./charts/ferrum-mesh --namespace ferrum --set controlPlane.enabled=true \
            > "$RUNNER_TEMP/ferrum-helm-results/missing-config-rendered.yaml" \
            2> "$RUNNER_TEMP/ferrum-helm-results/missing-config.err"; then
            echo "::error title=Missing CP settings rendered successfully::mandatory CP configuration must fail during Helm validation"
            exit 1
          fi
          grep -F 'controlPlane.database.type is required' "$RUNNER_TEMP/ferrum-helm-results/missing-config.err"
          if helm template ferrum ./charts/ferrum-mesh --namespace ferrum \
            --set controlPlane.enabled=true \
            --set controlPlane.database.type=postgres \
            --set controlPlane.database.host=postgres.ferrum.svc \
            --set controlPlane.database.name=ferrum \
            --set controlPlane.database.existingCredentialsSecret.name=ferrum-db-credentials \
            > "$RUNNER_TEMP/ferrum-helm-results/structured-secret-credentials-rendered.yaml" \
            2> "$RUNNER_TEMP/ferrum-helm-results/structured-secret-credentials.err"; then
            echo "::error title=Structured Secret credentials rendered successfully::Secret-backed username/password cannot be safely encoded into FERRUM_DB_URL"
            exit 1
          fi
          grep -F 'structured Secret-backed username/password cannot be safely percent-encoded into FERRUM_DB_URL' "$RUNNER_TEMP/ferrum-helm-results/structured-secret-credentials.err"
          helm template ferrum ./charts/ferrum-mesh --namespace ferrum \
            --set controlPlane.enabled=true \
            --set controlPlane.database.type=postgres \
            --set-string 'controlPlane.database.host=2001:db8::1' \
            --set controlPlane.database.port=5432 \
            --set-string 'controlPlane.database.name=ferrum/main db' \
            --set-string 'controlPlane.database.username=ferrum/user' \
            --set-string 'controlPlane.database.password=p/a?s# word' \
            --set controlPlane.credentials.adminJwtSecret.existingSecret.name=ferrum-mesh-production-credentials \
            --set controlPlane.credentials.adminJwtSecret.existingSecret.key=admin-jwt-secret \
            --set controlPlane.credentials.cpDpGrpcJwtSecret.existingSecret.name=ferrum-mesh-production-credentials \
            --set controlPlane.credentials.cpDpGrpcJwtSecret.existingSecret.key=cp-dp-grpc-jwt-secret \
            > "$RUNNER_TEMP/ferrum-helm-results/structured-direct-credentials-rendered.yaml"
          grep -F 'postgres://ferrum%2Fuser:p%2Fa%3Fs%23%20word@[2001:db8::1]:5432/ferrum%2Fmain%20db' "$RUNNER_TEMP/ferrum-helm-results/structured-direct-credentials-rendered.yaml"
          helm template ferrum ./charts/ferrum-mesh --namespace ferrum \
            -f ./charts/ferrum-mesh/examples/development-values.yaml \
            > "$RUNNER_TEMP/ferrum-helm-results/development-rendered.yaml"
          helm template ferrum ./charts/ferrum-mesh --namespace ferrum \
            -f ./charts/ferrum-mesh/examples/production-existing-secrets-values.yaml \
            > "$RUNNER_TEMP/ferrum-helm-results/production-existing-secrets-rendered.yaml"
          for name in FERRUM_DB_URL FERRUM_ADMIN_JWT_SECRET FERRUM_CP_DP_GRPC_JWT_SECRET; do
            if ! grep -A5 "name: ${name}" "$RUNNER_TEMP/ferrum-helm-results/production-existing-secrets-rendered.yaml" | grep -q 'valueFrom:'; then
              echo "::error title=Secret env did not render with valueFrom::${name} must use a Secret reference in the production-style values file"
              exit 1
            fi
          done

      - name: Core gateway chart static validation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ferrum-gateway-helm-results"
          helm lint ./charts/ferrum-gateway
          # Default (file mode) renders a runnable, Secret-free gateway.
          helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/file-rendered.yaml"
          grep -Fq 'name: FERRUM_FILE_CONFIG_PATH' "$RUNNER_TEMP/ferrum-gateway-helm-results/file-rendered.yaml"
          # GatewayConfig deserialization requires all four top-level lists (version,
          # proxies, consumers, plugin_configs) with no serde defaults, so the default
          # inline ConfigMap must emit consumers/plugin_configs or the pod fails to boot.
          grep -Fq 'consumers: []' "$RUNNER_TEMP/ferrum-gateway-helm-results/file-rendered.yaml"
          grep -Fq 'plugin_configs: []' "$RUNNER_TEMP/ferrum-gateway-helm-results/file-rendered.yaml"
          # Each supported mode renders.
          helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=database --set database.type=sqlite \
            --set-string database.sqlite.path=/data/ferrum.db \
            --set admin.jwtSecret.existingSecret.name=ferrum-gateway-credentials \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/database-rendered.yaml"
          helm template ferrum-cp ./charts/ferrum-gateway --namespace ferrum \
            -f ./charts/ferrum-gateway/examples/cp-values.yaml \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/cp-rendered.yaml"
          grep -Fq 'name: FERRUM_CP_GRPC_LISTEN_ADDR' "$RUNNER_TEMP/ferrum-gateway-helm-results/cp-rendered.yaml"
          helm template ferrum-dp ./charts/ferrum-gateway --namespace ferrum \
            -f ./charts/ferrum-gateway/examples/dp-values.yaml \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/dp-rendered.yaml"
          grep -Fq 'name: FERRUM_DP_CP_GRPC_URLS' "$RUNNER_TEMP/ferrum-gateway-helm-results/dp-rendered.yaml"
          grep -Fq 'http://ferrum-cp-ferrum-gateway-grpc.ferrum.svc:50051' "$RUNNER_TEMP/ferrum-gateway-helm-results/dp-rendered.yaml"
          grep -Fq 'name: ferrum-cp-ferrum-gateway-grpc' "$RUNNER_TEMP/ferrum-gateway-helm-results/cp-rendered.yaml"
          long_name="$(printf 'a%.0s' {1..63})"
          helm template ferrum-cp ./charts/ferrum-gateway --namespace ferrum \
            -f ./charts/ferrum-gateway/examples/cp-values.yaml \
            --set-string fullnameOverride="$long_name" \
            --show-only templates/service-cp-grpc.yaml \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/long-cp-service.yaml"
          grpc_service_name="$(awk '/^  name:/{print $2; exit}' "$RUNNER_TEMP/ferrum-gateway-helm-results/long-cp-service.yaml")"
          if [ "${#grpc_service_name}" -gt 63 ]; then
            echo "::error title=CP gRPC Service name exceeds DNS label limit::suffix must be included before truncation"
            exit 1
          fi
          # Secret-backed modes render env via valueFrom, never inline secrets.
          for name in FERRUM_ADMIN_JWT_SECRET FERRUM_CP_DP_GRPC_JWT_SECRET; do
            if ! grep -A5 "name: ${name}" "$RUNNER_TEMP/ferrum-gateway-helm-results/cp-rendered.yaml" | grep -q 'valueFrom:'; then
              echo "::error title=Gateway CP secret not via valueFrom::${name} must be a Secret reference in cp-values.yaml"
              exit 1
            fi
            if ! grep -A5 "name: ${name}" "$RUNNER_TEMP/ferrum-gateway-helm-results/dp-rendered.yaml" | grep -q 'valueFrom:'; then
              echo "::error title=Gateway DP secret not via valueFrom::${name} must use a Secret reference in dp-values.yaml"
              exit 1
            fi
          done
          # database/cp mode without an admin JWT secret must fail render.
          if helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=database --set database.type=sqlite \
            --set-string database.sqlite.path=/data/ferrum.db \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/missing-admin-jwt.yaml" \
            2> "$RUNNER_TEMP/ferrum-gateway-helm-results/missing-admin-jwt.err"; then
            echo "::error title=Missing admin JWT rendered successfully::database mode must require an admin JWT secret"
            exit 1
          fi
          grep -F 'admin.jwtSecret requires exactly one of' "$RUNNER_TEMP/ferrum-gateway-helm-results/missing-admin-jwt.err"
          # DP also creates the admin JWT manager at startup and must not render
          # without an admin JWT source.
          if helm template ferrum-dp ./charts/ferrum-gateway --namespace ferrum \
            --set mode=dp \
            --set-string dp.cpGrpcUrls=https://ferrum-cp.example:50051 \
            --set grpc.jwtSecret.existingSecret.name=ferrum-grpc-credentials \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/dp-missing-admin-jwt.yaml" \
            2> "$RUNNER_TEMP/ferrum-gateway-helm-results/dp-missing-admin-jwt.err"; then
            echo "::error title=Missing DP admin JWT rendered successfully::dp mode must require an admin JWT source"
            exit 1
          fi
          grep -F 'admin.jwtSecret requires exactly one of' "$RUNNER_TEMP/ferrum-gateway-helm-results/dp-missing-admin-jwt.err"
          # Required JWTs may be supplied through the documented _FILE path.
          helm template ferrum-dp ./charts/ferrum-gateway --namespace ferrum \
            --set mode=dp \
            --set-string dp.cpGrpcUrls=https://ferrum-cp.example:50051 \
            --set 'secretFileMounts[0].name=FERRUM_ADMIN_JWT_SECRET' \
            --set 'secretFileMounts[0].secretName=ferrum-admin' \
            --set 'secretFileMounts[0].secretKey=admin-jwt-secret' \
            --set 'secretFileMounts[1].name=FERRUM_CP_DP_GRPC_JWT_SECRET' \
            --set 'secretFileMounts[1].secretName=ferrum-grpc' \
            --set 'secretFileMounts[1].secretKey=cp-dp-grpc-jwt-secret' \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/dp-file-jwts.yaml"
          grep -Fq 'name: FERRUM_ADMIN_JWT_SECRET_FILE' "$RUNNER_TEMP/ferrum-gateway-helm-results/dp-file-jwts.yaml"
          grep -Fq 'name: FERRUM_CP_DP_GRPC_JWT_SECRET_FILE' "$RUNNER_TEMP/ferrum-gateway-helm-results/dp-file-jwts.yaml"
          # Database URL and admin JWT can both use the same generic _FILE path.
          helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=database --set database.type=postgres \
            --set 'secretFileMounts[0].name=FERRUM_DB_URL' \
            --set 'secretFileMounts[0].secretName=ferrum-db' \
            --set 'secretFileMounts[0].secretKey=url' \
            --set 'secretFileMounts[1].name=FERRUM_ADMIN_JWT_SECRET' \
            --set 'secretFileMounts[1].secretName=ferrum-admin' \
            --set 'secretFileMounts[1].secretKey=admin-jwt-secret' \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/database-file-secrets.yaml"
          grep -Fq 'name: FERRUM_DB_URL_FILE' "$RUNNER_TEMP/ferrum-gateway-helm-results/database-file-secrets.yaml"
          grep -Fq 'name: FERRUM_ADMIN_JWT_SECRET_FILE' "$RUNNER_TEMP/ferrum-gateway-helm-results/database-file-secrets.yaml"
          # A non-loopback plaintext admin bind in database mode must fail render
          # (the binary hard-fails on this at boot).
          if helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=database --set database.type=sqlite \
            --set-string database.sqlite.path=/data/ferrum.db \
            --set admin.jwtSecret.existingSecret.name=ferrum-gateway-credentials \
            --set admin.bindAddress=0.0.0.0 \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/unsafe-admin-bind.yaml" \
            2> "$RUNNER_TEMP/ferrum-gateway-helm-results/unsafe-admin-bind.err"; then
            echo "::error title=Unsafe admin bind rendered successfully::non-loopback plaintext admin bind must fail in database mode"
            exit 1
          fi
          grep -F 'hard-fails on a non-loopback plaintext admin bind' "$RUNNER_TEMP/ferrum-gateway-helm-results/unsafe-admin-bind.err"
          # Admin TLS on 9443 does not protect a live plaintext listener on 9000.
          if helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=database --set database.type=sqlite \
            --set-string database.sqlite.path=/data/ferrum.db \
            --set admin.jwtSecret.existingSecret.name=ferrum-gateway-credentials \
            --set admin.bindAddress=0.0.0.0 \
            --set tls.admin.enabled=true --set tls.admin.secretName=ferrum-admin-tls \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/tls-with-plaintext-admin.yaml" \
            2> "$RUNNER_TEMP/ferrum-gateway-helm-results/tls-with-plaintext-admin.err"; then
            echo "::error title=TLS guard left plaintext admin enabled::ports.adminHttp must be 0 when TLS is the protection"
            exit 1
          fi
