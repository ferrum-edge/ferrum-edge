              integration::vendor_integrity_tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust
        # The shard runs a prebuilt nextest archive, so it only needs `cargo`
        # on PATH for `cargo nextest`; sccache, rust-cache, protoc, and fast
        # linker setup belong in the archive build job.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-nextest
        # Same prebuilt-binary install action as `test-functional`. Nextest
        # gives us per-test process isolation, OR'd substring filters via
        # positional args, and a much nicer progress UI than libtest.
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-nextest

      - name: Download integration tests archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: integration-tests-archive-${{ runner.os }}-${{ runner.arch }}
          path: .

      - name: Download prebuilt ferrum-cni binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ferrum-cni-debug-${{ runner.os }}-${{ runner.arch }}
          path: target/debug

      - name: Mark ferrum-cni binary executable
        # actions/download-artifact does not preserve the executable bit.
        run: chmod +x target/debug/ferrum-cni

      - name: Run integration test shard
        # Mirrors the `test-functional` shard runner. Each filter line is a
        # substring matched against the full test path
        # (`integration::<file_module>::<test_name>`) — nextest ORs them.
        # Listing the file-module prefix scopes the shard to one set of
        # files without per-test enumeration.
        #
        # `--archive-file` skips per-shard recompiles. `--workspace-remap .`
        # rewrites compile-time workspace paths to this runner's checkout so
        # runtime fixture lookups keep resolving against the checked-out repo.
        run: |
          set -e
          archive_file="integration-tests-${RUNNER_OS}-${RUNNER_ARCH}.tar.zst"
          filters=()
          while IFS= read -r filter; do
            [ -z "$filter" ] && continue
            filters+=("$filter")
          done <<< "$INTEGRATION_FILTERS"
          cargo nextest run \
            --archive-file "$archive_file" \
            --workspace-remap . \
            --no-fail-fast \
            "${filters[@]}"
        env:
          INTEGRATION_FILTERS: ${{ matrix.filters }}
          RUST_BACKTRACE: 1
        timeout-minutes: 30

      - name: Summarize integration shard
        if: always()
        run: |
          echo "## Integration Test Shard: ${{ matrix.shard }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "$INTEGRATION_FILTERS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          INTEGRATION_FILTERS: ${{ matrix.filters }}

  test-conformance:
    name: Mesh Conformance Tests
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test"

      - name: Run mesh conformance tests
        # Covers the Istio/xDS compatibility matrix under tests/conformance.
        # This is a separate job so mesh conformance gates PRs without adding
        # latency to the unit or integration shards.
        #
        # FERRUM_CONFORMANCE_STRICT_GATE enables the GA-contract presence check
        # (a deleted/renamed GA test fails CI); --test-threads=1 guarantees the
        # `zz_`-named gate runs last with a fully populated registry. The
        # ordering-independent per-call GA assertion runs regardless.
        run: cargo test --test conformance_tests -- --test-threads=1
        env:
          RUST_BACKTRACE: 1
          FERRUM_CONFORMANCE_STRICT_GATE: "1"

      - name: Upload mesh conformance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mesh-conformance-coverage
          path: target/conformance/
          retention-days: 14
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency Audit (cargo-deny)
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    # cargo-deny only runs `cargo metadata` (no compilation), so this job does
    # not install sccache. Clear the checked-in sccache rustc-wrapper
    # (.cargo/config.toml `[build] rustc-wrapper = "sccache"`) — same fallback
    # the setup-sccache action uses — so `cargo metadata` doesn't try to exec a
    # binary that isn't on PATH.
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          # Pinned to the version the deny.toml schema was validated against, so
          # a future cargo-deny release can't silently change gate behavior.
          tool: cargo-deny@0.19.9

      - name: cargo-deny (advisories, bans, sources)
        # BLOCKING dependency-security gate. A new RUSTSEC advisory not
        # explicitly time-boxed in deny.toml fails the PR. License checks are
        # intentionally outside this gate (see deny.toml header). The weekly
        # .github/workflows/dependency-audit.yml re-runs this plus the
        # advisory-patch-status check.
        # Policy: docs/dependency-policy.md.
        run: cargo deny check advisories bans sources

      - name: Advisory-exception expiry
        # cargo-deny accepts ignores without the repo's [expires:] convention, so
        # validate it here too: a PR that adds a malformed or already-expired
        # exception is rejected at PR time, not only by the weekly workflow.
        run: bash scripts/check_advisory_expiry.sh

  test-vendor-patches:
    name: Vendored Patch Regressions
    needs: build-test-artifacts
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-vendor-patches"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-nextest

      - name: Run vendored h3 frame-drain regressions
        run: cargo test --manifest-path vendor/h3-0.0.8-ferrum-patched/Cargo.toml --lib frame

      - name: Run vendored tungstenite raw-takeover and parser-policy regressions
        run: |
          cargo test --manifest-path vendor/tungstenite-0.29.0-ferrum-patched/Cargo.toml --lib into_inner_with_read_buffer
          cargo test --manifest-path vendor/tungstenite-0.29.0-ferrum-patched/Cargo.toml --lib size_limit_hit

      - name: Run vendored tokio-tungstenite raw-takeover regression
        run: cargo test --manifest-path vendor/tokio-tungstenite-0.29.0-ferrum-patched/Cargo.toml --config 'patch.crates-io.tungstenite.path="vendor/tungstenite-0.29.0-ferrum-patched"' --test into_inner_with_read_buffer

      - name: Download integration tests archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: integration-tests-archive-${{ runner.os }}-${{ runner.arch }}
          path: .

      - name: Run reqwest connect-timeout patch smoke regressions
        # Reuse the prebuilt integration suite instead of compiling the leaf
        # crate again under the vendored-patch cache key. The two names are
        # ordinary nextest positional filters (substring match, same as the
        # integration shard runner) — args after `--` would be forwarded to
        # the test binaries instead of selecting tests.
        run: |
          archive_file="integration-tests-${RUNNER_OS}-${RUNNER_ARCH}.tar.zst"
          cargo nextest run \
            --archive-file "$archive_file" \
            --workspace-remap . \
            --no-fail-fast \
            integration::connection_pool_tests::test_connect_timeout_does_not_fragment_pool \
            integration::connection_pool_tests::test_pooled_client_exposes_per_request_connect_timeout

