      - name: Download prebuilt gateway binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ferrum-edge-debug-${{ runner.os }}-${{ runner.arch }}
          path: target/debug

      - name: Mark gateway binary executable
        run: chmod +x target/debug/ferrum-edge

      - name: Download functional tests archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: functional-tests-archive-${{ runner.os }}-${{ runner.arch }}
          path: .

      - name: Start Redis
        run: |
          set -euo pipefail
          docker run -d --name ferrum-ci-plugin-hardening-redis -p 6379:6379 redis:7-alpine
          redis_ok=""
          for _ in $(seq 1 30); do
            if docker exec ferrum-ci-plugin-hardening-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              redis_ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$redis_ok" ]; then
            echo "::error::redis did not become ready"
            docker logs ferrum-ci-plugin-hardening-redis
            exit 1
          fi
          echo "plugin hardening redis ready (redis:6379)"

      - name: Run cross-instance request deduplication regression
        run: |
          set -euo pipefail
          archive_file="functional-tests-${RUNNER_OS}-${RUNNER_ARCH}.tar.zst"
          cargo nextest run \
            --archive-file "$archive_file" \
            --workspace-remap . \
            --run-ignored=all \
            --no-fail-fast \
            -j 1 \
            test_request_deduplication_redis_blocks_concurrent_cross_instance
        env:
          FERRUM_SKIP_GATEWAY_BUILD: "1"
          FERRUM_REDIS_REQUIRED: "1"
          RUST_BACKTRACE: 1

      - name: Summarize plugin hardening Redis regression
        if: always()
        run: |
          echo "## Plugin Hardening Redis Regression" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- test_request_deduplication_redis_blocks_concurrent_cross_instance" >> $GITHUB_STEP_SUMMARY

