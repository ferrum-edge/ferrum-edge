name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # crates.io download hardening — mirrors .cargo/config.toml [net]/[http].
  # The config file already covers every job that builds from this checkout;
  # surfacing the same values here makes the CI intent explicit/greppable and
  # covers any step that shells cargo outside the repo's config layering.
  # Rationale and the failure mode live in .cargo/config.toml.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  fmt:
    name: Format Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  test-unit:
    name: Unit Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test"

      - name: Run unit tests
        run: cargo test --test unit_tests
        env:
          RUST_BACKTRACE: 1

  plugin-hardening-unit-regressions:
    name: Plugin Hardening Unit Regressions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-plugin-hardening-unit"

      - name: Run cache accounting and reload safety regressions
        run: |
          set -euo pipefail
          hardening_tests=(
            unit::plugins::response_caching_tests::test_concurrent_stores_keep_size_bounded_and_non_wrapping
            unit::plugins::plugin_cache_tests::test_rebuild_rejects_malformed_body_validator_and_keeps_prior_cache
            unit::plugins::plugin_cache_tests::test_apply_delta_rejects_malformed_request_size_limiting_and_keeps_prior_cache
            unit::plugins::plugin_cache_tests::test_apply_delta_rejects_unknown_enabled_plugin_and_keeps_prior_cache
          )

          set +e
          test_output="$(cargo test --test unit_tests -- --exact "${hardening_tests[@]}" 2>&1)"
          test_status=$?
          set -e

          printf '%s\n' "$test_output"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi

          if ! printf '%s\n' "$test_output" | grep -qE '^test result: ok\. 4 passed; 0 failed; 0 ignored;'; then
            echo "::error::expected exactly 4 plugin hardening unit regressions to run and pass"
            exit 1
          fi
        env:
          RUST_BACKTRACE: 1

      - name: Summarize plugin hardening unit regressions
        if: always()
        run: |
          echo "## Plugin Hardening Unit Regressions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- test_concurrent_stores_keep_size_bounded_and_non_wrapping" >> $GITHUB_STEP_SUMMARY
          echo "- test_rebuild_rejects_malformed_body_validator_and_keeps_prior_cache" >> $GITHUB_STEP_SUMMARY
          echo "- test_apply_delta_rejects_malformed_request_size_limiting_and_keeps_prior_cache" >> $GITHUB_STEP_SUMMARY
          echo "- test_apply_delta_rejects_unknown_enabled_plugin_and_keeps_prior_cache" >> $GITHUB_STEP_SUMMARY

  test-lib:
    name: Inline Lib Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test"

      - name: Run inline lib tests
        # Covers `#[cfg(test)] mod tests` blocks inline in `src/` (used for
        # private fns/structs that the separate tests/ binaries can't see).
        # CLAUDE.md lists them as required pre-commit checks; CI now runs them
        # too so a regression in an inline test fails the PR instead of
        # waiting until someone runs the lib suite locally.
        run: cargo test --lib
        env:
          RUST_BACKTRACE: 1

  test-secrets:
    name: Secret Backends (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One isolated job per provider so a single backend failure does not
        # mask the others. `file`/`all` exercise the resolver registry
        # (no Docker); `vault`/`aws` use testcontainers (Docker, available on
        # ubuntu-latest); `gcp`/`azure` use in-process wiremock fakes.
        include:
          - name: file
            features: ""
            filters: "file_backend cross_backend"
          - name: vault
            features: "secrets-vault"
            filters: "vault_backend"
          - name: aws
            features: "secrets-aws"
            filters: "aws_backend"
          - name: gcp
            features: "secrets-gcp"
            filters: "gcp_backend"
          - name: azure
            features: "secrets-azure"
            filters: "azure_backend"
          - name: all
            features: "secrets-vault,secrets-aws,secrets-gcp,secrets-azure"
            filters: "cross_backend"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test-secrets-${{ matrix.name }}"

      - name: Run secret-backend functional tests
        # Test-name filters are passed after `--` so multiple substrings (e.g.
        # `file_backend cross_backend`) are accepted as an OR set by libtest.
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo test --features "${{ matrix.features }}" --test secrets_functional -- ${{ matrix.filters }}
          else
            cargo test --test secrets_functional -- ${{ matrix.filters }}
          fi
        env:
          RUST_BACKTRACE: 1

  test-service-integration:
    name: Service Integration (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One isolated job per external middleware so a single backend failure
        # does not mask the others. Each runs the REAL third-party software as a
        # local container via testcontainers (Docker, available on
        # ubuntu-latest) and drives the real integration code against it:
        #   - consul → ConsulDiscoverer::discover() health-API JSON parsing
        #   - ldap   → ldap_auth bind / search-then-bind / group membership
        # GitHub Actions sets CI=true, so a container that fails to start is a
        # hard failure (see fail_in_ci_else_skip) rather than a silent skip.
        include:
          - name: consul
            filters: consul
          - name: ldap
            filters: ldap
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test-service-integration-${{ matrix.name }}"

      - name: Run service-integration tests
        # The test-name filter selects the backend module (consul / ldap).
        run: cargo test --test service_integration -- ${{ matrix.filters }}
        env:
          RUST_BACKTRACE: 1

  test-pkcs11-softhsm:
    name: PKCS#11 SoftHSM Smoke Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test-pkcs11"

      - name: Install SoftHSM and OpenSC tools
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc

      - name: Initialize SoftHSM token
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          cat > "$RUNNER_TEMP/softhsm/softhsm2.conf" <<EOF
          directories.tokendir = $RUNNER_TEMP/softhsm/tokens
          objectstore.backend = file
          log.level = ERROR
          slots.removable = false
          EOF
          export SOFTHSM2_CONF="$RUNNER_TEMP/softhsm/softhsm2.conf"
          softhsm2-util --init-token --free --label ferrum-ci --so-pin 1234 --pin 123456
          pkcs11-tool --module /usr/lib/softhsm/libsofthsm2.so \
            --login --pin 123456 --token-label ferrum-ci \
            --keypairgen --key-type rsa:2048 \
            --label edge-rsa --id 01 --usage-sign
          echo "SOFTHSM2_CONF=$SOFTHSM2_CONF" >> "$GITHUB_ENV"

      - name: Run PKCS#11 signer smoke test
        run: cargo test --features pkcs11 --lib tls::pkcs11::tests::signer_loads_configured_token_and_signs -- --ignored
        env:
          FERRUM_PKCS11_MODULE_PATH: /usr/lib/softhsm/libsofthsm2.so
          FERRUM_PKCS11_PIN: "123456"
          FERRUM_PKCS11_TEST_KEY_SOURCE: "pkcs11://edge-rsa?pin_env=FERRUM_PKCS11_PIN&id_hex=01"
          RUST_BACKTRACE: 1

  build-integration-tests-archive:
    name: Build Integration Tests Archive
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test-integration-archive"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2
        with:
          tool: cargo-nextest

      - name: Build ferrum-cni binary
        # `cni_tests` launches `env!("CARGO_BIN_EXE_ferrum-cni")`, which
        # Cargo bakes in as target/debug/ferrum-cni under the workspace path
        # used to build the archive. Keep archive builders and shard runners on
        # matching OS/arch + checkout layout, or update this artifact/path with
        # any future runner/workspace/target-dir change.
        #
        # This binary is transferred to every integration shard. Keep full
        # local dev debuginfo intact, but avoid carrying it in the CI artifact.
        run: cargo build --config profile.dev.debug=0 --bin ferrum-cni

      - name: Build integration tests archive
        # Nextest archives are native binaries, so the file and artifact names
        # include runner OS/arch. Future non-Linux shards must build and
        # download their matching archive instead of sharing this Linux one.
        #
        # Full debuginfo for tests and bundled bin targets makes this archive
        # hundreds of MB larger and is downloaded by every integration shard.
        # CI still keeps Rust backtraces and test stdout/stderr, but omits
        # DWARF from this transfer-only build.
        run: |
          archive_file="integration-tests-${RUNNER_OS}-${RUNNER_ARCH}.tar.zst"
          cargo nextest archive \
            --config profile.test.debug=0 \
            --config profile.dev.debug=0 \
            --test integration_tests \
            --archive-file "$archive_file"

      - name: Upload integration tests archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-tests-archive-${{ runner.os }}-${{ runner.arch }}
          path: integration-tests-${{ runner.os }}-${{ runner.arch }}.tar.zst
          retention-days: 1
          if-no-files-found: error

      - name: Upload ferrum-cni binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ferrum-cni-debug-${{ runner.os }}-${{ runner.arch }}
          path: target/debug/ferrum-cni
          retention-days: 1
          if-no-files-found: error

  test-integration:
    # Integration tests are an in-process suite — they spin up gateway state,
    # databases, gRPC servers, etc. inside the test process (no external
    # binary), so they ALSO don't need redis/mongo services. The shard split
    # below groups the 59 test files into 5 logical buckets sized roughly by
    # test count (admin-api ~153, admin-config ~152, mesh-routing ~158,
    # mesh-platform ~60, protocols-data-plane ~150). Two-hundred-plus
    # wall-clock waits in `wait_for_poll` / `wait_for_route` / fixed sleeps
    # gate the suite far more than CPU time, so sharding wins are wall-clock
    # parallelism not core utilisation — same shape as `test-functional`.
    name: Integration Tests (${{ matrix.shard }})
    if: github.event_name == 'pull_request'
    needs: build-integration-tests-archive
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: admin-api
            # Heavy admin-API surface: spec import/export, DB-backed specs,
            # RBAC/audit, backend capabilities, runtime metrics.
            filters: |
              integration::admin_api_specs_handler_tests
              integration::admin_db_api_specs_tests
              integration::db_proxy_plugin_association_fail_closed_tests
              integration::admin_audit_rbac_tests
              integration::admin_backend_capabilities_tests
              integration::admin_runtime_metrics_tests
              integration::admin_observability_auth_tests
          - shard: admin-config
            # Cached config / cross-namespace refs / mesh-config admin
            # endpoints / log schema / deferred logging. These share the
            # admin-side config-cache and log-pipeline machinery so they
            # land together.
            filters: |
              integration::admin_cached_config_tests
              integration::admin_cross_namespace_refs_tests
              integration::admin_mesh_config_drift_tests
              integration::admin_mesh_egress_scope_tests
              integration::admin_mesh_policy_denies_tests
              integration::admin_mesh_remote_clusters_tests
              integration::admin_mesh_runtime_overlay_tests
              integration::admin_mesh_service_graph_tests
              integration::admin_node_waypoint_identities_tests
              integration::apply_incremental_outcome_tests
              integration::log_schema_integration_tests
              integration::log_schema_registry_tests
              integration::deferred_log_tests
              integration::api_chargeback_sink_tests
          - shard: mesh-routing
            # End-to-end mesh dispatch + authz + DestinationRule + sidecar
            # tests. Heaviest mesh slice tests since each one stands up a
            # mock workload set and asserts on the routing/auth outcome.
            filters: |
              integration::mesh_l7_routing_tests
              integration::mesh_topology_hbone_tests
              integration::mesh_authz_e2e_tests
              integration::mesh_authz_negative_match_tests
              integration::mesh_service_waypoint_tests
              integration::mesh_ew_egress_e2e_tests
              integration::mesh_destination_rule_tls_tests
              integration::mesh_destination_rule_locality_lb_tests
              integration::mesh_destination_rule_port_policy_tests
              integration::mesh_destination_rule_max_connections_tests
              integration::mesh_destination_rule_connection_pool_audit_tests
              integration::mesh_dr_service_entry_e2e_tests
              integration::mesh_sidecar_e2e_tests
          - shard: mesh-platform
            # k8s controller status, telemetry, federation poller, peer-auth
            # live reload, CNI, hbone tunnel, proxy-config / runtime-overlay
            # consumers. Heavier per-test setup (k8s clients, telemetry
            # collectors) balances the smaller test count.
            filters: |
              integration::k8s_controller_istio_status_tests
              integration::mesh_telemetry_k8s_provider_lookup_tests
              integration::mesh_telemetry_tracing_tests
              integration::mesh_federation_poller_tests
              integration::mesh_file_source_tests
              integration::mesh_multicluster_discovery_tests
              integration::mesh_cross_cluster_egress_tests
              integration::mesh_proxy_config_tests
              integration::mesh_outbound_registry_stream_tests
              integration::mesh_node_waypoint_stream_scope_tests
              integration::mesh_runtime_overlay_consumers_tests
              integration::mesh_peer_auth_live_reload_tests
              integration::mesh_k8s_pod_discovery_tests
              integration::mesh_hbone_tests
              integration::cni_tests
              integration::injector_admission_tests
          - shard: protocols-data-plane
            # Protocol / TLS / connection-pool / CP-DP gRPC / DB poll /
            # graceful-shutdown / SVID identity. The CP-DP file alone has
            # ~46 tests, so this shard pairs it with the smaller TLS /
            # connection / DB files to balance.
            filters: |
              integration::cp_dp_grpc_tests
              integration::cp_multi_namespace_tests
              integration::connection_pool_tests
              integration::http2_pool_tests
              integration::http3_integration_tests
              integration::grpc_proxy_tests
              integration::scripted_backend_smoke_tests
              integration::dtls_integration_tests
              integration::backend_mtls_tests
              integration::backend_tls_san_allow_list_tests
              integration::frontend_tls_live_reload_tests
              integration::tcp_frontend_tls_order_tests
              integration::tcp_fast_path_l4_plugins_tests
              integration::gateway_hbone_pool_tests
              integration::gateway_svid_identity_tests
              integration::graceful_shutdown_tests
              integration::db_full_load_snapshot_tests
              integration::db_incremental_poll_tests
              integration::db_offline_bootstrap_tests
              integration::vendor_integrity_tests
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install Rust
        # The shard runs a prebuilt nextest archive, so it only needs `cargo`
        # on PATH for `cargo nextest`; sccache, rust-cache, protoc, and fast
        # linker setup belong in the archive build job.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-nextest
        # Same prebuilt-binary install action as `test-functional`. Nextest
        # gives us per-test process isolation, OR'd substring filters via
        # positional args, and a much nicer progress UI than libtest.
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2
        with:
          tool: cargo-nextest

      - name: Download integration tests archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: integration-tests-archive-${{ runner.os }}-${{ runner.arch }}
          path: .

      - name: Download prebuilt ferrum-cni binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ferrum-cni-debug-${{ runner.os }}-${{ runner.arch }}
          path: target/debug

      - name: Mark ferrum-cni binary executable
        # actions/download-artifact does not preserve the executable bit.
        run: chmod +x target/debug/ferrum-cni

      - name: Run integration test shard
        # Mirrors the `test-functional` shard runner. Each filter line is a
        # substring matched against the full test path
        # (`integration::<file_module>::<test_name>`) — nextest ORs them.
        # Listing the file-module prefix scopes the shard to one set of
        # files without per-test enumeration.
        #
        # `--archive-file` skips per-shard recompiles. `--workspace-remap .`
        # rewrites compile-time workspace paths to this runner's checkout so
        # runtime fixture lookups keep resolving against the checked-out repo.
        run: |
          set -e
          archive_file="integration-tests-${RUNNER_OS}-${RUNNER_ARCH}.tar.zst"
          filters=()
          while IFS= read -r filter; do
            [ -z "$filter" ] && continue
            filters+=("$filter")
          done <<< "$INTEGRATION_FILTERS"
          cargo nextest run \
            --archive-file "$archive_file" \
            --workspace-remap . \
            --no-fail-fast \
            "${filters[@]}"
        env:
          INTEGRATION_FILTERS: ${{ matrix.filters }}
          RUST_BACKTRACE: 1
        timeout-minutes: 30

      - name: Summarize integration shard
        if: always()
        run: |
          echo "## Integration Test Shard: ${{ matrix.shard }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "$INTEGRATION_FILTERS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          INTEGRATION_FILTERS: ${{ matrix.filters }}

  test-integration-coverage:
    # Sanity check: every test file in tests/integration/ must be listed in
    # exactly one shard above. Catches the easy mistake of adding a new
    # `mod foo_tests` and forgetting to wire it into the matrix. We diff
    # the on-disk file set against the union of the shard filters; the job
    # fails if either side has files the other doesn't.
    name: Integration Test Shard Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test-integration
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Verify every integration_tests module is sharded
        run: |
          set -euo pipefail
          # All non-helper test files (excluding mod.rs and the shared
          # mesh_test_support helper).
          actual=$(ls tests/integration/*.rs \
            | xargs -n1 basename \
            | sed 's/\.rs$//' \
            | grep -v -E '^(mod|mesh_test_support)$' \
            | sort -u)
          # All filter lines under `test-integration:` matrix that name an
          # `integration::<file_module>` filter. POSIX-friendly regex —
          # `[[:space:]]` instead of `\s` so this also works on macOS dev
          # shells if anyone runs it locally.
          declared=$(grep -hE '^[[:space:]]+integration::[a-z0-9_]+_tests[[:space:]]*$' .github/workflows/ci.yml \
            | sed -E 's|^[[:space:]]+integration::||; s|[[:space:]]+$||' \
            | sort -u)
          if ! diff <(echo "$actual") <(echo "$declared") > /tmp/integration-coverage.diff; then
            echo "Integration shard coverage mismatch. Files missing from a shard, or stale filters:"
            cat /tmp/integration-coverage.diff
            exit 1
          fi
          echo "All $(echo "$actual" | wc -l | tr -d ' ') integration test files are sharded."

  test-conformance:
    name: Mesh Conformance Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test"

      - name: Run mesh conformance tests
        # Covers the Istio/xDS compatibility matrix under tests/conformance.
        # This is a separate job so mesh conformance gates PRs without adding
        # latency to the unit or integration shards.
        #
        # FERRUM_CONFORMANCE_STRICT_GATE enables the GA-contract presence check
        # (a deleted/renamed GA test fails CI); --test-threads=1 guarantees the
        # `zz_`-named gate runs last with a fully populated registry. The
        # ordering-independent per-call GA assertion runs regardless.
        run: cargo test --test conformance_tests -- --test-threads=1
        env:
          RUST_BACKTRACE: 1
          FERRUM_CONFORMANCE_STRICT_GATE: "1"

      - name: Upload mesh conformance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mesh-conformance-coverage
          path: target/conformance/
          retention-days: 14
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency Audit (cargo-deny)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # cargo-deny only runs `cargo metadata` (no compilation), so this job does
    # not install sccache. Clear the checked-in sccache rustc-wrapper
    # (.cargo/config.toml `[build] rustc-wrapper = "sccache"`) — same fallback
    # the setup-sccache action uses — so `cargo metadata` doesn't try to exec a
    # binary that isn't on PATH.
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2
        with:
          # Pinned to the version the deny.toml schema was validated against, so
          # a future cargo-deny release can't silently change gate behavior.
          tool: cargo-deny@0.19.9

      - name: cargo-deny (advisories, bans, sources)
        # BLOCKING dependency-security gate. A new RUSTSEC advisory not
        # explicitly time-boxed in deny.toml fails the PR. License checks are
        # intentionally outside this gate (see deny.toml header). The weekly
        # .github/workflows/dependency-audit.yml re-runs this plus the
        # advisory-patch-status check.
        # Policy: docs/dependency-policy.md.
        run: cargo deny check advisories bans sources

      - name: Advisory-exception expiry
        # cargo-deny accepts ignores without the repo's [expires:] convention, so
        # validate it here too: a PR that adds a malformed or already-expired
        # exception is rejected at PR time, not only by the weekly workflow.
        run: bash scripts/check_advisory_expiry.sh

  build-gateway-binary:
    name: Build Gateway Binary (functional tests)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # This binary is also packaged into a distroless Debian 13 image for the
    # Gateway API conformance lab. Pin the build host so its glibc stays no
    # newer than the runtime image glibc.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test-functional"

      - name: Build gateway binary
        run: |
          set -euo pipefail
          cargo build --profile pr-build --bin ferrum-edge
          mkdir -p target/debug
          cp target/pr-build/ferrum-edge target/debug/ferrum-edge

      - name: Upload gateway binary
        # Shared across every test-functional shard via download-artifact so
        # the gateway binary build runs once instead of six times. The binary
        # is built with the fast `pr-build` profile, then copied into the
        # ./target/debug/ferrum-edge path functional tests already expect.
        # The artifact name includes OS/arch because the downloaded binary is
        # native to this runner.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ferrum-edge-debug-${{ runner.os }}-${{ runner.arch }}
          path: target/debug/ferrum-edge
          retention-days: 1
          if-no-files-found: error

  build-functional-tests-archive:
    name: Build Functional Tests Archive
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test-functional"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2
        with:
          tool: cargo-nextest

      - name: Build functional tests archive
        # Nextest archives are native binaries, so the file and artifact names
        # include runner OS/arch. Future non-Linux shards must build and
        # download their matching archive instead of sharing this Linux one.
        #
        # Full debuginfo for tests and bundled bin targets makes this archive
        # hundreds of MB larger and is downloaded by every functional shard.
        # CI still keeps Rust backtraces and test stdout/stderr, but omits
        # DWARF from this transfer-only build.
        run: |
          archive_file="functional-tests-${RUNNER_OS}-${RUNNER_ARCH}.tar.zst"
          cargo nextest archive \
            --config profile.test.debug=0 \
            --config profile.dev.debug=0 \
            --test functional_tests \
            --archive-file "$archive_file"

      - name: Upload functional tests archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: functional-tests-archive-${{ runner.os }}-${{ runner.arch }}
          path: functional-tests-${{ runner.os }}-${{ runner.arch }}.tar.zst
          retention-days: 1
          if-no-files-found: error

  test-functional:
    name: Functional Tests (${{ matrix.shard }})
    if: github.event_name == 'pull_request'
    needs: [build-gateway-binary, build-functional-tests-archive]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: harness
            filters: |
              common::
              scaffolding::
              scenarios::
              functional_shared_harness_smoke_test
              functional_cli_test
              functional_node_agent_test
              functional_ci_shard_coverage_test
          - shard: admin-routing
            filters: |
              functional_admin_connection_limit_test
              functional_admin_observability_test
              functional_admin_operations_test
              functional_auth_acl_test
              functional_credential_rotation_test
              functional_file_mode_test
              functional_host_only_routing_test
              functional_migrate_mode_test
              functional_protocol_validation_test
              functional_regex_routing_test
              functional_router_cache_test
              functional_secrets_test
          - shard: plugins
            filters: |
              functional_ai_plugins_test
              functional_ai_semantic_firewall_streaming_test
              functional_grpc_plugins_test
              functional_logging_plugins_test
              functional_logging_test
              functional_mesh_vs_traffic_mgmt_test
              functional_otel_ldap_test
              functional_plugin_extended_test
              functional_plugin_test
              functional_plugins_network_test
              functional_prometheus_test
              functional_serverless_mirror_test
              functional_ws_plugins_test
          - shard: protocols
            filters: |
              functional_grpc_test
              functional_passthrough_test
              functional_sse_test
              functional_stream_listener_failure_test
              functional_tcp_proxy_test
              functional_tcp_splice_backend_timeout_test
              functional_udp_proxy_test
              functional_websocket_test
              scripted_backend_h2_tests
              scripted_backend_h3_tests
              scripted_backend_matrix_tests
              scripted_backend_network_sim_tests
              scripted_backend_tests
              scripted_backend_udp_tests
              functional_query_param_limits_test
              functional_streaming_request_body_limits_test
              functional_streaming_response_body_limits_test
              functional_tcp_idle_timeout_env_test
              functional_websocket_frame_limit_test
              functional_websocket_connection_limit_test
              functional_header_read_timeout_test
              functional_response_body_limits_test
              functional_request_body_limits_test
              functional_header_limits_test
              functional_early_data_test
              functional_ws_origin_test
              functional_allowed_methods_test
              functional_forwarded_via_headers_test
              functional_streaming_latency_tracking_test
              functional_streaming_outcome_accounting_test
              functional_chunked_request_size_limits_test
              functional_chunked_response_size_limits_test
              functional_body_size_limits_test
              functional_url_query_limits_test
              functional_header_size_limits_test
              functional_protocol_h3_request_body_test
              functional_protocol_h3_body_limit_config_test
              functional_protocol_h2_body_limit_config_test
              functional_protocol_body_limit_config_test
              functional_h3_authority_validation_test
              functional_h3_local_policy_test
              functional_h3_grpc_streaming_test
              functional_websocket_limits_test
          - shard: data-plane
            # Serialized because DP functional tests bind exclusive ports and
            # race when nextest runs this shard in parallel.
            nextest_jobs: 1
            filters: |
              functional_capability_registry_test
              functional_admin_crud_resources_test
              functional_cp_dp_resilience_test
              functional_cp_dp_test
              functional_database_test
              functional_db_failover_test
              functional_db_outage_test
              functional_db_tls_test
              functional_db_upstream_test
              functional_mesh_mode_test
              functional_mongodb_test
              functional_namespace_test
              functional_redis_rate_limiting_test
          - shard: resilience
            filters: |
              functional_circuit_breaker_retry_test
              functional_dns_cache_test
              functional_graceful_shutdown_test
              functional_load_balancer_test
              functional_load_stress_test
              functional_mtls_acl_test
              functional_mtls_test
              functional_overload_test
              functional_retry_test
              functional_scale_perf_test
              functional_service_discovery_test
              functional_tls_lifecycle_test
              functional_tls_only_test
              functional_client_ip_env_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install Rust
        # The shard runs a prebuilt nextest archive, so it only needs `cargo`
        # on PATH for `cargo nextest`; sccache, rust-cache, protoc, and fast
        # linker setup belong in the archive build job.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-nextest
        # Prebuilt binaries from taiki-e/install-action — no compile time.
        # Nextest's process-per-test model isolates port/process contention
        # and ships built-in slow-test + retry support, which fits this E2E
        # suite better than libtest's shared-process scheduler.
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2
        with:
          tool: cargo-nextest

      - name: Download prebuilt gateway binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ferrum-edge-debug-${{ runner.os }}-${{ runner.arch }}
          path: target/debug

      - name: Mark gateway binary executable
        # actions/download-artifact does not preserve the executable bit.
        run: chmod +x target/debug/ferrum-edge

      - name: Download functional tests archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: functional-tests-archive-${{ runner.os }}-${{ runner.arch }}
          path: .

      - name: Start data-plane service containers
        # Only the data-plane shard runs the redis/mongo-backed functional tests
        # (functional_redis_rate_limiting_test, functional_mongodb_test). These
        # services were previously declared job-wide, so EVERY shard provisioned
        # redis + mongo at job startup — a transient Docker Hub pull hiccup then
        # failed otherwise-unrelated shards (e.g. resilience) before any test ran.
        # Start them only where they're used to isolate that blast radius. Ports
        # map to the runner's localhost exactly as the service containers did, so
        # the tests' localhost:6379 / localhost:27017 connections are unchanged.
        if: matrix.shard == 'data-plane'
        run: |
          docker run -d --name ferrum-ci-redis -p 6379:6379 redis:7-alpine
          docker run -d --name ferrum-ci-mongo -p 27017:27017 mongo:7
          # The runner used to gate steps on the services' --health-cmd; reproduce
          # that readiness wait using the tools shipped inside each image.
          redis_ok=""
          for _ in $(seq 1 30); do
            if docker exec ferrum-ci-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              redis_ok=1; break
            fi
            sleep 2
          done
          mongo_ok=""
          for _ in $(seq 1 30); do
            if docker exec ferrum-ci-mongo mongosh --quiet \
                --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)' 2>/dev/null; then
              mongo_ok=1; break
            fi
            sleep 2
          done
          if [ -z "$redis_ok" ]; then
            echo "::error::redis did not become ready"; docker logs ferrum-ci-redis; exit 1
          fi
          if [ -z "$mongo_ok" ]; then
            echo "::error::mongo did not become ready"; docker logs ferrum-ci-mongo; exit 1
          fi
          echo "data-plane services ready (redis:6379, mongo:27017)"

      - name: Run functional test shard
        # ── Single nextest invocation per shard ───────────────────────────
        # The old loop ran `cargo test` once per filter line, paying cargo's
        # fingerprint-check + libtest startup (~3–5s) every iteration. With
        # 7–13 filters per shard that was 30–60s of pure overhead. Here we
        # collect the filters into an argv array and let nextest OR them.
        #
        # `--archive-file` skips per-shard recompiles. `--workspace-remap .`
        # rewrites the archive's compile-time workspace path to this runner's
        # checkout so runtime fixtures under tests/ keep resolving correctly.
        #
        # `--run-ignored=all` mirrors libtest's `--include-ignored` so the
        # non-ignored harness unit tests bundled into the functional_tests
        # binary (e.g. `common::config_builder::tests::*`) run alongside the
        # ignored E2E tests.
        #
        # The filter expression excludes the long stress suites that are
        # intentionally local-only:
        #   - test_scale_perf_30k_proxies (matches base + _postgres + _mongodb)
        #   - test_load_stress_10k_proxies (single ignored test in that file)
        #
        # `FERRUM_SKIP_GATEWAY_BUILD=1` makes `ensure_gateway_built()` in the
        # harness skip its per-process `cargo build --bin ferrum-edge` and
        # trust the artifact we just downloaded. Critical with nextest's
        # one-process-per-test model — otherwise every test would pay the
        # cargo fingerprint check on first call.
        run: |
          set -e
          archive_file="functional-tests-${RUNNER_OS}-${RUNNER_ARCH}.tar.zst"
          filters=()
          while IFS= read -r filter; do
            [ -z "$filter" ] && continue
            filters+=("$filter")
          done <<< "$FUNCTIONAL_FILTERS"
          nextest_args=()
          if [ -n "${NEXTEST_JOBS:-}" ]; then
            nextest_args+=("-j" "$NEXTEST_JOBS")
          fi
          cargo nextest run \
            --archive-file "$archive_file" \
            --workspace-remap . \
            --run-ignored=all \
            --no-fail-fast \
            -E 'not test(/test_scale_perf_30k_proxies/) and not test(/test_load_stress_10k_proxies/)' \
            "${nextest_args[@]}" \
            "${filters[@]}"
        env:
          FUNCTIONAL_FILTERS: ${{ matrix.filters }}
          NEXTEST_JOBS: ${{ matrix.nextest_jobs }}
          FERRUM_SKIP_GATEWAY_BUILD: "1"
          RUST_BACKTRACE: 1
        timeout-minutes: 30

      - name: Summarize functional shard
        if: always()
        run: |
          echo "## Functional Test Shard: ${{ matrix.shard }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "$FUNCTIONAL_FILTERS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          FUNCTIONAL_FILTERS: ${{ matrix.filters }}

  plugin-hardening-redis-regression:
    name: Plugin Hardening Redis Regression
    if: github.event_name == 'pull_request'
    needs: [build-gateway-binary, build-functional-tests-archive]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2
        with:
          tool: cargo-nextest

      - name: Download prebuilt gateway binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ferrum-edge-debug-${{ runner.os }}-${{ runner.arch }}
          path: target/debug

      - name: Mark gateway binary executable
        run: chmod +x target/debug/ferrum-edge

      - name: Download functional tests archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: functional-tests-archive-${{ runner.os }}-${{ runner.arch }}
          path: .

      - name: Start Redis
        run: |
          set -euo pipefail
          docker run -d --name ferrum-ci-plugin-hardening-redis -p 6379:6379 redis:7-alpine
          redis_ok=""
          for _ in $(seq 1 30); do
            if docker exec ferrum-ci-plugin-hardening-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              redis_ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$redis_ok" ]; then
            echo "::error::redis did not become ready"
            docker logs ferrum-ci-plugin-hardening-redis
            exit 1
          fi
          echo "plugin hardening redis ready (redis:6379)"

      - name: Run cross-instance request deduplication regression
        run: |
          set -euo pipefail
          archive_file="functional-tests-${RUNNER_OS}-${RUNNER_ARCH}.tar.zst"
          cargo nextest run \
            --archive-file "$archive_file" \
            --workspace-remap . \
            --run-ignored=all \
            --no-fail-fast \
            -j 1 \
            test_request_deduplication_redis_blocks_concurrent_cross_instance
        env:
          FERRUM_SKIP_GATEWAY_BUILD: "1"
          FERRUM_REDIS_REQUIRED: "1"
          RUST_BACKTRACE: 1

      - name: Summarize plugin hardening Redis regression
        if: always()
        run: |
          echo "## Plugin Hardening Redis Regression" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- test_request_deduplication_redis_blocks_concurrent_cross_instance" >> $GITHUB_STEP_SUMMARY

  gateway-api-conformance:
    name: Gateway API Conformance (CI mirror)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Backstop above the in-script poll bounds (discovery <=30 min +
    # status <=140 min) so the graceful "Timed out" branch is reachable and
    # the job is never force-killed at GitHub's 360-min default.
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - name: Mirror dedicated Gateway API conformance result
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: gateway-api-conformance.yml
          # This CI run's own id, used to derive the floor timestamp below so we
          # only mirror a dedicated run created for the *current* event.
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          {
            echo "## Gateway API Conformance"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # A reused head commit (PR close/reopen, or re-running CI without a new
          # commit) can surface an OLDER gateway-api-conformance.yml run for this
          # same head_sha that still matches the PR-number filter. Selecting "the
          # most recent run for this PR" would then `break` on that stale run and
          # mirror its old conclusion instead of the current attempt's. To make a
          # reused-SHA stale run unselectable, floor the search by this CI run's
          # own trigger time: both this CI run and the dedicated conformance run
          # are launched by the *same* `pull_request` event, so the dedicated run
          # we want has `created_at` at/after this CI run's `created_at`. A prior
          # attempt's run for the same SHA was created on an earlier event and is
          # always strictly older, so the floor drops it.
          #
          # `created_at` (event/trigger time) is shared across workflows for one
          # event, unlike `run_started_at` (runner pickup time, which varies with
          # queue depth). Subtract a small skew tolerance so a few seconds of
          # per-workflow registration jitter on the *same* event never excludes
          # the run we want; this window is far smaller than the minutes-to-hours
          # gap to any prior attempt for the same SHA.
          SKEW_TOLERANCE_SECONDS=120
          ci_created_at=""
          for _ in $(seq 1 10); do
            ci_created_at="$(
              gh api -X GET "/repos/${REPOSITORY}/actions/runs/${CI_RUN_ID}" \
                --jq '.created_at // empty' 2>/dev/null || true
            )"
            if [ -n "$ci_created_at" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$ci_created_at" ]; then
            echo "Could not resolve this CI run's created_at to floor the conformance run search." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # GNU date on the ubuntu runner; falls back to BSD date for local use.
          since="$(date -u -d "${ci_created_at} - ${SKEW_TOLERANCE_SECONDS} seconds" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -j -v-"${SKEW_TOLERANCE_SECONDS}"S -f "%Y-%m-%dT%H:%M:%SZ" "${ci_created_at}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || echo "${ci_created_at}")"
          echo "Only mirroring dedicated runs created at/after ${since} (this CI run started ${ci_created_at})." >> "$GITHUB_STEP_SUMMARY"

          # Among dedicated runs for this head_sha that are at/after the floor,
          # prefer the most recent run whose `.pull_requests[]` includes THIS PR
          # number; only when none match (cross-fork PR runs report an empty
          # `.pull_requests`) fall back to the most recent in-window head_sha run
          # so forked PRs still get a result. The `created_at >= env.SINCE` floor
          # is applied to BOTH paths so a stale same-SHA run cannot satisfy either.
          # `gh api --jq` runs gojq, which has no `--arg` flag (that's a flag of
          # the standalone `jq` binary, not of `gh`). Passing `--arg` makes `gh`
          # exit non-zero with "unknown flag", and the surrounding
          # `2>/dev/null || true` would silently swallow it, leaving `run_id`
          # empty and failing the gate on every PR. Instead, read the values
          # inside the program via gojq's `env` builtin: `PR_NUMBER` is exported
          # in the step `env:` block, and `SINCE` is exported here so the jq
          # program can reference `env.SINCE`.
          export SINCE="${since}"
          run_id=""
          for _ in $(seq 1 60); do
            # `env.PR_NUMBER` / `env.SINCE` below read process env from inside
            # the jq program, so it is intentionally single-quoted.
            # shellcheck disable=SC2016
            run_id="$(
              gh api -X GET "/repos/${REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=10" \
                --jq '
                  [.workflow_runs[]]
                  | map(select(.created_at >= env.SINCE))
                  | sort_by(.created_at) | reverse
                  | (map(select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber)))) | .[0].id)
                    // (.[0].id)
                    // empty
                ' 2>/dev/null || true
            )"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 30
          done

          if [ -z "$run_id" ]; then
            echo "Dedicated Gateway API conformance workflow for the current attempt did not start (no run for this head_sha created at/after ${since})." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Mirroring dedicated workflow run ${run_id}." >> "$GITHUB_STEP_SUMMARY"

          # ~280 polls * 30s ~= 140 min, comfortably under this job's
          # timeout-minutes cap so the graceful timeout branch is reachable.
          # The dedicated lab has a 90-min job timeout plus queue time, so a
          # ~140-min ceiling leaves margin for it to finish and report.
          for _ in $(seq 1 280); do
            run_json="$(gh api -X GET "/repos/${REPOSITORY}/actions/runs/${run_id}" 2>/dev/null || true)"
            if [ -z "$run_json" ]; then
              sleep 30
              continue
            fi
            status="$(printf '%s' "$run_json" | jq -r '.status' 2>/dev/null || true)"
            if [ -z "$status" ]; then
              sleep 30
              continue
            fi
            conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // ""' 2>/dev/null || true)"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Dedicated Gateway API conformance workflow passed." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "Dedicated Gateway API conformance workflow completed with conclusion: ${conclusion}." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            sleep 30
          done

          echo "Timed out after ~140 min waiting for dedicated Gateway API conformance workflow." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  mesh-multicluster-federation:
    name: Mesh Multicluster Federation
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: build-gateway-binary
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FERRUM_IMAGE: ferrum-edge:multicluster-federation
      KIND_VERSION: v0.27.0
      KUBECTL_VERSION: v1.32.3
      FERRUM_MULTICLUSTER_DEPLOY_ONLY: "1"
      FERRUM_SKIP_IMAGE_BUILD: "1"
      FERRUM_IMAGE_REPOSITORY: ferrum-edge
      FERRUM_IMAGE_TAG: multicluster-federation
      # This deploy-only smoke creates and destroys disposable kind clusters in
      # CI; acknowledge run.sh's preflight guard (the live workflow sets the same).
      FERRUM_MULTICLUSTER_LIVE_ACK_DISPOSABLE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for mesh federation changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mesh_federation_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(\.github/workflows/ci\.yml|\.github/actions/package-ferrum-runtime-image/|tests/k8s/multicluster-federation/|docs/(mesh|mesh_multicluster_federation_runbook|spire_deployment)\.md|docs/configuration\.md|ferrum\.conf|openapi\.yaml|proto/|src/admin/(mesh_remote_clusters|mod)\.rs|src/config/env_config\.rs|src/grpc/|src/identity/|src/modes/mesh/|src/proxy/|src/tls/|Cargo\.(toml|lock))'; then
            echo "mesh_federation_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "mesh_federation_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Kubernetes tools
        if: steps.changes.outputs.mesh_federation_changed == 'true'
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo chmod +x /usr/local/bin/kind
          sudo curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Download prebuilt gateway binary
        if: steps.changes.outputs.mesh_federation_changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ferrum-edge-debug-${{ runner.os }}-${{ runner.arch }}
          path: target/debug

      - name: Package Ferrum image
        if: steps.changes.outputs.mesh_federation_changed == 'true'
        uses: ./.github/actions/package-ferrum-runtime-image
        with:
          binary-path: target/debug/ferrum-edge
          image: ${{ env.FERRUM_IMAGE }}

      - name: Run two-cluster deployment smoke
        if: steps.changes.outputs.mesh_federation_changed == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ferrum-multicluster-federation
        run: tests/k8s/multicluster-federation/run.sh

      - name: Upload mesh federation diagnostics
        if: always() && steps.changes.outputs.mesh_federation_changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ferrum-multicluster-federation
          path: ${{ runner.temp }}/ferrum-multicluster-federation
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize mesh federation skip
        if: steps.changes.outputs.mesh_federation_changed != 'true'
        run: |
          echo "## Mesh Multicluster Federation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped: this PR does not touch mesh federation, discovery, SPIFFE identity, proxy, chart, image, proto, docs, config, or CI workflow surfaces." >> "$GITHUB_STEP_SUMMARY"

  helm-chart:
    name: Helm Chart
    if: github.event_name == 'pull_request'
    needs: build-gateway-binary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FERRUM_IMAGE: ferrum-edge:helm-chart-ci
      KIND_VERSION: v0.27.0
      KUBECTL_VERSION: v1.32.3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Check for Helm chart changes
        id: helm_changes
        run: |
          set -euo pipefail

          # Curated list of source paths whose changes can affect the Helm
          # install checks below, which boot the control-plane binary and assert
          # readiness plus secret log-redaction (a CP-boot smoke test). It runs
          # for changes that can affect:
          # - chart sources, dashboards, schemas, and examples under charts/
          # - this CI workflow and local .github/actions/ image packaging
          # - Docker/runtime packaging metadata and Cargo/proto build inputs
          #   (Cargo.{toml,lock}, build.rs, proto/ are broad catch-alls)
          # - build configuration that shapes the deployed binary: .cargo/
          #   (config.toml linker/rustflags) and vendor/ (patched crates wired
          #   in via [patch.crates-io] in Cargo.toml, compiled into ferrum-edge)
          # - ferrum.conf plus runtime config defaults rendered into the chart
          # - control-plane startup, admin, gRPC, xDS, DNS, TLS, identity,
          #   Kubernetes, and secret paths exercised by the Helm install checks
          # - Kubernetes translation sources (src/config_sources/k8s/): the CP
          #   started by the chart runs the Kubernetes controller, which feeds
          #   CRDs through config_sources::k8s::translate_k8s_objects(), so a
          #   translation regression can break CP readiness in this smoke
          # - mesh sources (src/modes/mesh/, e.g. config.rs/slice.rs/
          #   dns_proxy.rs): the Helm examples boot the CP with
          #   FERRUM_XDS_ENABLED=true and the CP/xDS path depends on these
          #   modules (src/xds/server.rs reads
          #   modes::mesh::dns_proxy::DEFAULT_CLUSTER_DOMAIN;
          #   src/xds/translator.rs and src/grpc/cp_server.rs use
          #   modes::mesh::{config,slice}), so a mesh-source regression can
          #   break the deployed control plane this gate validates
          # - CP-boot startup helpers reached before /health goes ready:
          #   src/proxy/client_ip.rs (TrustedProxies::parse_strict on the admin
          #   CIDR allowlist), src/util/sharding.rs (pool_shard_amount feeding
          #   DashMap shard sizing), and src/runtime_metrics.rs
          #   (runtime_metrics::global().configure(...))
          # - logging/redaction (src/logging/): the kind-install steps assert the
          #   CP boot logs never emit the admin/gRPC secrets (`grep -Fq`), and
          #   that secret-redaction assertion is UNIQUE to this job, so a
          #   redaction regression here would otherwise silently skip the gate
          # - crate root / module wiring (src/lib.rs) and the overload monitor
          #   (src/overload.rs), both initialized at serving-mode startup
          # This is a curated allowlist, not exhaustive: the broad functional and
          # integration jobs cover most omitted paths, but the secret
          # log-redaction assertion in the kind-install steps is specific to this
          # job and has no overlapping coverage -- so redaction-relevant paths
          # (e.g. src/logging/) must stay listed to keep the gate fail-safe.
          helm_change_regex='^(charts/|\.github/workflows/ci\.yml$|\.github/actions/|\.cargo/|vendor/|Dockerfile(\..*)?$|\.dockerignore$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|build\.rs$|proto/|ferrum\.conf$|src/lib\.rs$|src/overload\.rs$|src/runtime_metrics\.rs$|src/(main|startup|cli)\.rs$|src/config/|src/config_sources/k8s/|src/logging/|src/modes/(control_plane|database|migrate|mod|tls_reload|grpc_tls_reload|db_tls_reload)\.rs$|src/modes/mesh/|src/admin/|src/dns/|src/grpc/|src/identity/|src/k8s_controller/|src/proxy/client_ip\.rs$|src/secrets/|src/tls/|src/util/sharding\.rs$|src/xds/)'
          # Diff captured first so a git error (e.g. a missing base ref) fails
          # closed: it aborts the step loudly under `set -euo pipefail` rather
          # than being swallowed by the match and silently skipping every heavy
          # validation step, including the secret log-redaction assertions.
          # `--no-renames` is required: with rename detection on (the default),
          # `git diff --name-only` emits only the destination path for a rename,
          # so moving a chart template OUT of charts/ (e.g.
          # `git mv charts/ferrum-mesh/templates/x.yaml docs/x.yaml`) would show
          # only the unlisted docs/ path and skip the gate even though the chart
          # lost a template. `--no-renames` reports the rename as a delete + add,
          # so the old charts/ path is still matched and chart-breaking moves
          # keep the gate fail-safe.
          # `grep -Ec` reads all input so no SIGPIPE (unlike `grep -q`, which
          # closes the pipe on the first match and could SIGPIPE-kill the
          # upstream `printf` with exit 141). grep's exit codes are distinct:
          # 0 = matched, 1 = no match (normal -> changed=false), >=2 = real
          # error (bad regex, read failure). We capture the rc instead of `||
          # true` so a >=2 error fails the step closed rather than being
          # misread as "no match" and silently skipping every heavy validation
          # step, including the secret log-redaction assertions.
          changed_files="$(git diff --no-renames --name-only "origin/${{ github.base_ref }}...HEAD")"
          set +e
          match_count="$(printf '%s\n' "$changed_files" | grep -Ec "$helm_change_regex")"
          grep_rc=$?
          set -e
          if [ "$grep_rc" -gt 1 ]; then
            echo "helm gate: grep failed (rc=$grep_rc)" >&2
            exit 1
          fi
          if [ "${match_count:-0}" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Kubernetes tools
        if: steps.helm_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo chmod +x /usr/local/bin/kind
          sudo curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Helm static validation
        if: steps.helm_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ferrum-helm-results"
          helm lint ./charts/ferrum-mesh
          helm template ferrum ./charts/ferrum-mesh --namespace ferrum \
            > "$RUNNER_TEMP/ferrum-helm-results/default-rendered.yaml"
          if grep -q 'ferrum-mesh-control-plane' "$RUNNER_TEMP/ferrum-helm-results/default-rendered.yaml"; then
            echo "::error title=Default chart rendered a control plane::controlPlane.enabled must default to false until required values are supplied"
            exit 1
          fi
          if helm template ferrum ./charts/ferrum-mesh --namespace ferrum --set controlPlane.enabled=true \
            > "$RUNNER_TEMP/ferrum-helm-results/missing-config-rendered.yaml" \
            2> "$RUNNER_TEMP/ferrum-helm-results/missing-config.err"; then
            echo "::error title=Missing CP settings rendered successfully::mandatory CP configuration must fail during Helm validation"
            exit 1
          fi
          grep -F 'controlPlane.database.type is required' "$RUNNER_TEMP/ferrum-helm-results/missing-config.err"
          if helm template ferrum ./charts/ferrum-mesh --namespace ferrum \
            --set controlPlane.enabled=true \
            --set controlPlane.database.type=postgres \
            --set controlPlane.database.host=postgres.ferrum.svc \
            --set controlPlane.database.name=ferrum \
            --set controlPlane.database.existingCredentialsSecret.name=ferrum-db-credentials \
            > "$RUNNER_TEMP/ferrum-helm-results/structured-secret-credentials-rendered.yaml" \
            2> "$RUNNER_TEMP/ferrum-helm-results/structured-secret-credentials.err"; then
            echo "::error title=Structured Secret credentials rendered successfully::Secret-backed username/password cannot be safely encoded into FERRUM_DB_URL"
            exit 1
          fi
          grep -F 'structured Secret-backed username/password cannot be safely percent-encoded into FERRUM_DB_URL' "$RUNNER_TEMP/ferrum-helm-results/structured-secret-credentials.err"
          helm template ferrum ./charts/ferrum-mesh --namespace ferrum \
            --set controlPlane.enabled=true \
            --set controlPlane.database.type=postgres \
            --set-string 'controlPlane.database.host=2001:db8::1' \
            --set controlPlane.database.port=5432 \
            --set-string 'controlPlane.database.name=ferrum/main db' \
            --set-string 'controlPlane.database.username=ferrum/user' \
            --set-string 'controlPlane.database.password=p/a?s# word' \
            --set controlPlane.credentials.adminJwtSecret.existingSecret.name=ferrum-mesh-production-credentials \
            --set controlPlane.credentials.adminJwtSecret.existingSecret.key=admin-jwt-secret \
            --set controlPlane.credentials.cpDpGrpcJwtSecret.existingSecret.name=ferrum-mesh-production-credentials \
            --set controlPlane.credentials.cpDpGrpcJwtSecret.existingSecret.key=cp-dp-grpc-jwt-secret \
            > "$RUNNER_TEMP/ferrum-helm-results/structured-direct-credentials-rendered.yaml"
          grep -F 'postgres://ferrum%2Fuser:p%2Fa%3Fs%23%20word@[2001:db8::1]:5432/ferrum%2Fmain%20db' "$RUNNER_TEMP/ferrum-helm-results/structured-direct-credentials-rendered.yaml"
          helm template ferrum ./charts/ferrum-mesh --namespace ferrum \
            -f ./charts/ferrum-mesh/examples/development-values.yaml \
            > "$RUNNER_TEMP/ferrum-helm-results/development-rendered.yaml"
          helm template ferrum ./charts/ferrum-mesh --namespace ferrum \
            -f ./charts/ferrum-mesh/examples/production-existing-secrets-values.yaml \
            > "$RUNNER_TEMP/ferrum-helm-results/production-existing-secrets-rendered.yaml"
          for name in FERRUM_DB_URL FERRUM_ADMIN_JWT_SECRET FERRUM_CP_DP_GRPC_JWT_SECRET; do
            if ! grep -A5 "name: ${name}" "$RUNNER_TEMP/ferrum-helm-results/production-existing-secrets-rendered.yaml" | grep -q 'valueFrom:'; then
              echo "::error title=Secret env did not render with valueFrom::${name} must use a Secret reference in the production-style values file"
              exit 1
            fi
          done

      - name: Download prebuilt gateway binary
        if: steps.helm_changes.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ferrum-edge-debug-${{ runner.os }}-${{ runner.arch }}
          path: target/debug

      - name: Package Ferrum image
        if: steps.helm_changes.outputs.changed == 'true'
        uses: ./.github/actions/package-ferrum-runtime-image
        with:
          binary-path: target/debug/ferrum-edge
          image: ${{ env.FERRUM_IMAGE }}

      - name: Create kind cluster
        if: steps.helm_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          chmod +x target/debug/ferrum-edge
          kind create cluster --name ferrum-helm --wait 120s
          kind load docker-image "$FERRUM_IMAGE" --name ferrum-helm

      - name: Default install renders no unusable control plane
        if: steps.helm_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          kubectl create namespace ferrum-default
          helm install ferrum-default ./charts/ferrum-mesh -n ferrum-default
          kubectl -n ferrum-default get all -o wide > "$RUNNER_TEMP/ferrum-helm-results/default-install-resources.txt"
          if kubectl -n ferrum-default get deployment ferrum-mesh-control-plane >/dev/null 2>&1; then
            echo "::error title=Default install created a control plane::default install must not create an unusable CP"
            exit 1
          fi
          if [ -n "$(kubectl -n ferrum-default get pods -o name)" ]; then
            echo "::error title=Default install created runtime pods::default install should be scaffolding-only"
            kubectl -n ferrum-default get pods -o wide
            exit 1
          fi

      - name: Development values become Ready
        if: steps.helm_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          kubectl create namespace ferrum-dev
          admin_secret="$(openssl rand -hex 32)"
          grpc_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${admin_secret}"
          echo "::add-mask::${grpc_secret}"
          kubectl -n ferrum-dev create secret generic ferrum-mesh-dev-credentials \
            --from-literal=admin-jwt-secret="${admin_secret}" \
            --from-literal=cp-dp-grpc-jwt-secret="${grpc_secret}"
          helm install ferrum-dev ./charts/ferrum-mesh -n ferrum-dev \
            -f ./charts/ferrum-mesh/examples/development-values.yaml \
            --set image.repository=ferrum-edge \
            --set image.tag=helm-chart-ci \
            --set image.pullPolicy=IfNotPresent
          kubectl -n ferrum-dev rollout status deployment/ferrum-mesh-control-plane --timeout=180s
          kubectl -n ferrum-dev get pods -o wide > "$RUNNER_TEMP/ferrum-helm-results/development-pods.txt"
          kubectl -n ferrum-dev describe deployment/ferrum-mesh-control-plane > "$RUNNER_TEMP/ferrum-helm-results/development-control-plane-deployment.txt"
          kubectl -n ferrum-dev get events --sort-by=.lastTimestamp > "$RUNNER_TEMP/ferrum-helm-results/development-events.txt"
          kubectl -n ferrum-dev logs deployment/ferrum-mesh-control-plane --all-containers --tail=1000 > "$RUNNER_TEMP/ferrum-helm-results/development-control-plane.log"
          if grep -Fq "${admin_secret}" "$RUNNER_TEMP/ferrum-helm-results/development-control-plane.log" ||
             grep -Fq "${grpc_secret}" "$RUNNER_TEMP/ferrum-helm-results/development-control-plane.log"; then
            rm -f "$RUNNER_TEMP/ferrum-helm-results/development-control-plane.log"
            echo "::error title=Secret leaked to logs::development control-plane logs contained a JWT secret"
            exit 1
          fi

      - name: Existing Secret production-style values become Ready
        if: steps.helm_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          kubectl create namespace ferrum-prod
          pg_password="$(openssl rand -hex 24)"
          admin_secret="$(openssl rand -hex 32)"
          grpc_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${pg_password}"
          echo "::add-mask::${admin_secret}"
          echo "::add-mask::${grpc_secret}"
          kubectl -n ferrum-prod create secret generic ferrum-postgres \
            --from-literal=password="${pg_password}"
          cat <<'YAML' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ferrum-postgres
            namespace: ferrum-prod
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ferrum-postgres
            template:
              metadata:
                labels:
                  app: ferrum-postgres
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    ports:
                      - containerPort: 5432
                    env:
                      - name: POSTGRES_DB
                        value: ferrum
                      - name: POSTGRES_USER
                        value: ferrum
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: ferrum-postgres
                            key: password
                    readinessProbe:
                      exec:
                        command: ["pg_isready", "-U", "ferrum", "-d", "ferrum"]
                      periodSeconds: 2
                      timeoutSeconds: 2
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ferrum-postgres
            namespace: ferrum-prod
          spec:
            selector:
              app: ferrum-postgres
            ports:
              - name: postgres
                port: 5432
                targetPort: 5432
          YAML
          kubectl -n ferrum-prod rollout status deployment/ferrum-postgres --timeout=180s
          db_url="postgres://ferrum:${pg_password}@ferrum-postgres.ferrum-prod.svc.cluster.local:5432/ferrum"
          echo "::add-mask::${db_url}"
          kubectl -n ferrum-prod create secret generic ferrum-mesh-production-db \
            --from-literal=url="${db_url}"
          kubectl -n ferrum-prod create secret generic ferrum-mesh-production-credentials \
            --from-literal=admin-jwt-secret="${admin_secret}" \
            --from-literal=cp-dp-grpc-jwt-secret="${grpc_secret}"
          helm install ferrum-prod ./charts/ferrum-mesh -n ferrum-prod \
            -f ./charts/ferrum-mesh/examples/production-existing-secrets-values.yaml \
            --set image.repository=ferrum-edge \
            --set image.tag=helm-chart-ci \
            --set image.pullPolicy=IfNotPresent
          kubectl -n ferrum-prod rollout status deployment/ferrum-mesh-control-plane --timeout=180s
          kubectl -n ferrum-prod get pods -o wide > "$RUNNER_TEMP/ferrum-helm-results/production-pods.txt"
          kubectl -n ferrum-prod describe deployment/ferrum-mesh-control-plane > "$RUNNER_TEMP/ferrum-helm-results/production-control-plane-deployment.txt"
          kubectl -n ferrum-prod get events --sort-by=.lastTimestamp > "$RUNNER_TEMP/ferrum-helm-results/production-events.txt"
          kubectl -n ferrum-prod logs deployment/ferrum-mesh-control-plane --all-containers --tail=1000 > "$RUNNER_TEMP/ferrum-helm-results/production-control-plane.log"
          for secret in "$pg_password" "$db_url" "$admin_secret" "$grpc_secret"; do
            if grep -Fq "$secret" "$RUNNER_TEMP/ferrum-helm-results/production-control-plane.log"; then
              rm -f "$RUNNER_TEMP/ferrum-helm-results/production-control-plane.log"
              echo "::error title=Secret leaked to logs::production-style control-plane logs contained a secret value"
              exit 1
            fi
          done

      - name: Collect Helm chart diagnostics
        if: always() && steps.helm_changes.outputs.changed == 'true'
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/ferrum-helm-results"
          for ns in ferrum-default ferrum-dev ferrum-prod; do
            kubectl -n "$ns" get all -o wide > "$RUNNER_TEMP/ferrum-helm-results/${ns}-all.txt" 2>&1
            kubectl -n "$ns" get events --sort-by=.lastTimestamp > "$RUNNER_TEMP/ferrum-helm-results/${ns}-events.txt" 2>&1
            kubectl -n "$ns" get pods -o jsonpath='{range .items[*]}{.metadata.name}{" phase="}{.status.phase}{" ready="}{range .status.containerStatuses[*]}{.ready}{" restartCount="}{.restartCount}{" exitCode="}{.lastState.terminated.exitCode}{" reason="}{.lastState.terminated.reason}{";"}{end}{"\n"}{end}' \
              > "$RUNNER_TEMP/ferrum-helm-results/${ns}-pod-status.txt" 2>&1
          done

      - name: Upload Helm chart diagnostics
        if: always() && steps.helm_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ferrum-mesh-helm-chart
          path: ${{ runner.temp }}/ferrum-helm-results
          retention-days: 7

      - name: Summarize Helm chart skip
        if: steps.helm_changes.outputs.changed != 'true'
        run: |
          echo "## Helm Chart" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped: this PR does not touch chart sources, chart test values, CI workflow/actions, Docker or runtime image packaging, Cargo/build.rs/rust-toolchain/.cargo/vendor build inputs, proto, ferrum.conf, runtime config, control-plane startup, admin, gRPC, xDS, DNS, TLS, identity, Kubernetes controller, Kubernetes translation (src/config_sources/k8s/), mesh sources (src/modes/mesh/, consumed by the CP/xDS path), CP-boot startup helpers (client_ip CIDR parser, sharding helper, runtime metrics init), or secret surfaces." >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests
    if: always() && github.event_name == 'pull_request'
    needs:
      - test-unit
      - plugin-hardening-unit-regressions
      - test-lib
      - test-secrets
      - test-service-integration
      - build-integration-tests-archive
      - test-integration
      - test-conformance
      - build-gateway-binary
      - build-functional-tests-archive
      - test-functional
      - plugin-hardening-redis-regression
      - gateway-api-conformance
      - mesh-multicluster-federation
      - helm-chart
    runs-on: ubuntu-latest
    steps:
      - name: Summarize test results
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit | ${{ needs.test-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Plugin hardening unit regressions | ${{ needs.plugin-hardening-unit-regressions.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Inline lib | ${{ needs.test-lib.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret backends | ${{ needs.test-secrets.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Service integration | ${{ needs.test-service-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration archive build | ${{ needs.build-integration-tests-archive.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.test-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mesh conformance | ${{ needs.test-conformance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gateway binary build | ${{ needs.build-gateway-binary.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Functional archive build | ${{ needs.build-functional-tests-archive.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Functional shards | ${{ needs.test-functional.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Plugin hardening Redis regression | ${{ needs.plugin-hardening-redis-regression.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gateway API conformance | ${{ needs.gateway-api-conformance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mesh multicluster federation | ${{ needs.mesh-multicluster-federation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Helm chart | ${{ needs.helm-chart.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test-unit.result }}" != "success" ] ||
             [ "${{ needs.plugin-hardening-unit-regressions.result }}" != "success" ] ||
             [ "${{ needs.test-lib.result }}" != "success" ] ||
             [ "${{ needs.test-secrets.result }}" != "success" ] ||
             [ "${{ needs.test-service-integration.result }}" != "success" ] ||
             [ "${{ needs.build-integration-tests-archive.result }}" != "success" ] ||
             [ "${{ needs.test-integration.result }}" != "success" ] ||
             [ "${{ needs.test-conformance.result }}" != "success" ] ||
             [ "${{ needs.build-gateway-binary.result }}" != "success" ] ||
             [ "${{ needs.build-functional-tests-archive.result }}" != "success" ] ||
             [ "${{ needs.test-functional.result }}" != "success" ] ||
             [ "${{ needs.plugin-hardening-redis-regression.result }}" != "success" ] ||
             [ "${{ needs.gateway-api-conformance.result }}" != "success" ] ||
             [ "${{ needs.mesh-multicluster-federation.result }}" != "success" ] ||
             [ "${{ needs.helm-chart.result }}" != "success" ]; then
            exit 1
          fi

  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-lint"
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  detect-ebpf-live-changes:
    name: Detect eBPF/Netns Live Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Detect live-kernel-sensitive paths
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          git diff --name-only "origin/${BASE_REF}...HEAD" | sort > "$RUNNER_TEMP/ebpf-live-changed-files.txt"

          changed=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml|\
              .github/workflows/node-waypoint-ebpf-live.yml|\
              .github/actions/setup-rust-ci/*|.github/actions/setup-rust-ci/**|\
              .github/actions/setup-sccache/*|.github/actions/setup-sccache/**|\
              .github/actions/setup-fast-linker/*|.github/actions/setup-fast-linker/**|\
              Cargo.toml|Cargo.lock|.cargo/*|.cargo/**|rust-toolchain.toml|build.rs|proto/*|proto/**|\
              ebpf/*|ebpf/**|\
              src/capture/*|src/capture/**|\
              src/ebpf/*|src/ebpf/**|\
              src/grpc/*|src/grpc/**|\
              src/identity/*|src/identity/**|\
              src/k8s_controller/*|src/k8s_controller/**|\
              src/modes/control_plane.rs|\
              src/modes/mesh/*|src/modes/mesh/**|\
              src/modes/node_agent.rs|src/modes/node_agent_cni_server.rs|\
              src/plugins/mesh/*|src/plugins/mesh/**|src/plugins/prometheus_metrics.rs|\
              src/proxy/hbone_pool.rs|src/proxy/hbone_proxy.rs|src/proxy/mesh_mtls_pool.rs|\
              src/proxy/mesh_tcp_egress.rs|src/proxy/mesh_tcp_inbound.rs|\
              src/proxy/mesh_udp_capture.rs|src/proxy/mesh_udp_frame.rs|src/proxy/mod.rs|\
              src/proxy/netns_capture.rs|src/proxy/tcp_proxy.rs|src/proxy/udp_batch.rs|\
              src/router_cache.rs|src/socket_opts.rs|\
              tests/k8s/lib/*|tests/k8s/lib/**|tests/k8s/node_waypoint_ebpf_live/*|tests/k8s/node_waypoint_ebpf_live/**|\
              tests/*capture*|tests/*ebpf*|tests/*netns*|tests/*node_waypoint*)
                changed=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/ebpf-live-changed-files.txt"

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          echo "## eBPF/Netns Live Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$changed" = "true" ]; then
            echo "Live-kernel-sensitive files changed; CI will run the eBPF live-kernel and netns live checks." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No live-kernel-sensitive files changed; CI will skip the eBPF live-kernel and netns live checks for this PR." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The eBPF userspace compile guard still runs on every PR." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: List changed files for live gate
        if: always()
        run: |
          echo "Changed files considered by the eBPF/netns live gate:"
          cat "$RUNNER_TEMP/ebpf-live-changed-files.txt"

  build-ebpf:
    name: Build eBPF Programs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Check for eBPF changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -q '^ebpf/'; then
            echo "ebpf_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ebpf_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install nightly Rust with rust-src
        if: steps.changes.outputs.ebpf_changed == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: rust-src

      - name: Install stable Rust for shared types
        if: steps.changes.outputs.ebpf_changed == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - if: steps.changes.outputs.ebpf_changed == 'true'
        uses: ./.github/actions/setup-sccache

      - if: steps.changes.outputs.ebpf_changed == 'true'
        uses: ./.github/actions/setup-fast-linker

      - name: Install bpf-linker
        if: steps.changes.outputs.ebpf_changed == 'true'
        run: cargo install bpf-linker --locked

      - name: Build BPF programs
        if: steps.changes.outputs.ebpf_changed == 'true'
        run: cd ebpf && cargo +nightly build --target bpfel-unknown-none -Z build-std=core --release -p ferrum-ebpf

      - name: Test shared types
        if: steps.changes.outputs.ebpf_changed == 'true'
        run: cd ebpf && cargo test -p ferrum-ebpf-common

      - name: Upload BPF artifact
        if: steps.changes.outputs.ebpf_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ebpf-programs
          path: ebpf/target/bpfel-unknown-none/release/ferrum-ebpf
          retention-days: 14

  build-ebpf-userspace:
    name: Build eBPF Userspace Loader
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-ebpf-userspace"

      - name: Build userspace aya loader (--features ebpf)
        # The aya userspace loader (src/ebpf/loader.rs, src/ebpf/maps.rs) only
        # compiles under `--features ebpf` on Linux, and no other CI job
        # exercises it — the default image ships the no-op mock backend. This
        # guarantees the loader keeps building as the shared BPF ABI
        # (ferrum-ebpf-common) and map set evolve. The kernel ELF is read at
        # runtime, so no compiled BPF object is needed here.
        run: cargo build --lib --features ebpf
        env:
          RUST_BACKTRACE: 1

  ebpf-live:
    name: eBPF Live-Kernel Test
    needs: detect-ebpf-live-changes
    # Live kernel validation is high-value for BPF/node-waypoint-sensitive
    # changes, but it adds several minutes to every PR when run unconditionally.
    if: github.event_name == 'pull_request' && needs.detect-ebpf-live-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install nightly Rust with rust-src
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: rust-src

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-ebpf-live"

      - name: Install bpf-linker
        run: cargo install bpf-linker --locked

      - name: Build BPF programs (kernel object)
        run: cd ebpf && cargo +nightly build --target bpfel-unknown-none -Z build-std=core --release -p ferrum-ebpf

      - name: Build and locate live-kernel test binary (--features ebpf)
        id: build_test_bin
        run: |
          set -euo pipefail
          mapfile -t bins < <(
            cargo test --features ebpf --lib --no-run --message-format=json-render-diagnostics \
              | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null and (.target.kind | index("lib"))) | .executable'
          )
          if [ "${#bins[@]}" -ne 1 ]; then
            printf 'Expected exactly one lib test binary, found %s:\n' "${#bins[@]}" >&2
            printf '%s\n' "${bins[@]}" >&2
            exit 1
          fi
          BIN="${bins[0]}"
          echo "Live-kernel test binary: $BIN"
          echo "test_bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Ensure bpffs is mounted
        run: sudo mount -t bpf bpf /sys/fs/bpf 2>/dev/null || true

      - name: Run live-kernel eBPF test as root
        # Loads + verifies every BPF program (including the GAP-2M sock_ops
        # cookie bridge) on the runner's real kernel, attaches them to a
        # scratch cgroup, and round-trips the workload-identity map. The test
        # self-skips (passes) if the runner lacks kernel >= 5.7 / cgroup v2 /
        # bpffs. Run the prebuilt test binary directly under sudo so cargo
        # never runs as root against the user-owned target dir.
        run: |
          set -euo pipefail
          BIN="${{ steps.build_test_bin.outputs.test_bin }}"
          echo "Live-kernel test binary: $BIN"
          sudo -E "FERRUM_NODE_AGENT_BPF_ELF_PATH=$GITHUB_WORKSPACE/ebpf/target/bpfel-unknown-none/release/ferrum-ebpf" \
            "$BIN" ebpf::loader::live_kernel_tests --ignored --nocapture --test-threads=1
        env:
          RUST_BACKTRACE: 1

  netns-capture-live:
    name: Node-Waypoint In-Netns Capture Live Test
    needs: detect-ebpf-live-changes
    # The netns tests require privileged live-kernel operations; the path gate
    # keeps unrelated PRs fast while preserving coverage for capture/proxy paths.
    if: github.event_name == 'pull_request' && needs.detect-ebpf-live-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-netns-capture-live"

      - name: Build and locate live test binary
        id: build_test_bin
        run: |
          set -euo pipefail
          mapfile -t bins < <(
            cargo test --lib --no-run --message-format=json-render-diagnostics \
              | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null and (.target.kind | index("lib"))) | .executable'
          )
          if [ "${#bins[@]}" -ne 1 ]; then
            printf 'Expected exactly one lib test binary, found %s:\n' "${#bins[@]}" >&2
            printf '%s\n' "${bins[@]}" >&2
            exit 1
          fi
          BIN="${bins[0]}"
          echo "In-netns live test binary: $BIN"
          echo "test_bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Run in-netns capture live tests as root
        # Privileged functional tests for the per-pod-netns outbound capture
        # listener (`src/proxy/netns_capture.rs`). They create + enter network
        # namespaces (needs CAP_SYS_ADMIN) to prove a 127.0.0.1:15001 listener
        # bound INSIDE a pod netns is reachable from a client in that netns and
        # isolated from the host netns — the loopback property a single
        # host-netns listener cannot satisfy. Also runs the SO_ORIGINAL_DST
        # live test (`src/socket_opts.rs::original_dst_live_tests`): a real
        # iptables REDIRECT in a throwaway netns must report the pre-NAT
        # destination on the accepted socket — the primitive mesh outbound
        # multi-port routing rests on. Also runs the mesh UDP source-capture
        # live test (`src/proxy/mesh_udp_capture.rs::live_netns_tests`): a real
        # TPROXY mangle rule + fwmark policy routing in a throwaway netns must
        # divert a pod-egress UDP datagram onto the transparent capture socket
        # and recover its pre-TPROXY destination from the IP_RECVORIGDSTADDR
        # cmsg (the UDP analogue of SO_ORIGINAL_DST). Each test self-skips
        # (passes) when the runner lacks root / `unshare` / `iptables` / `ip`.
        # Run the prebuilt binary directly under sudo so cargo never runs as
        # root against the user-owned target.
        run: |
          set -euo pipefail
          BIN="${{ steps.build_test_bin.outputs.test_bin }}"
          echo "In-netns live test binary: $BIN"
          sudo -E "$BIN" proxy::netns_capture::live_netns_tests socket_opts::original_dst_live_tests proxy::mesh_udp_capture::live_netns_tests --ignored --nocapture --test-threads=1
        env:
          RUST_BACKTRACE: 1

  performance-regression:
    name: Performance Regression Check
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Detect performance-sensitive changes
        id: perf_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          run_benchmark=true
          reason="Performance regression checks always run for ${EVENT_NAME} events."
          changed_files=""

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null)"; then
              run_benchmark=false
              reason="No performance-sensitive paths changed."

              if grep -Eq '^(src/|custom_plugins/|vendor/|ebpf/|tests/performance/|build\.rs$|ferrum\.conf$|proto/|Cargo\.toml$|Cargo\.lock$|\.cargo/|rust-toolchain\.toml$|\.github/workflows/ci\.yml$|\.github/actions/)' <<<"${changed_files}"; then
                run_benchmark=true
                reason="Performance-sensitive paths changed."
              fi
            else
              run_benchmark=true
              reason="Could not diff against origin/${BASE_REF}; running benchmark to be safe."
              changed_files=""
            fi
          fi

          if [ -n "${changed_files}" ]; then
            printf '%s\n' "${changed_files}" > "${RUNNER_TEMP}/performance-regression-changed-files.txt"
          else
            : > "${RUNNER_TEMP}/performance-regression-changed-files.txt"
          fi

          {
            echo "run=${run_benchmark}"
            echo "reason=${reason}"
          } >> "${GITHUB_OUTPUT}"

      - uses: ./.github/actions/setup-rust-ci
        if: steps.perf_changes.outputs.run == 'true'
        with:
          shared-key: "ci-perf"

      - name: Build release binaries
        if: steps.perf_changes.outputs.run == 'true'
        run: |
          cargo build --profile ci-release --bin ferrum-edge
          cd tests/performance && cargo build --release --bin backend_server

      - name: Start backend server
        if: steps.perf_changes.outputs.run == 'true'
        run: |
          tests/performance/target/release/backend_server > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "${GITHUB_ENV}"
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:3001/health > /dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Backend failed to start"
              cat /tmp/backend.log
              exit 1
            fi
            sleep 1
          done

      - name: Start gateway
        if: steps.perf_changes.outputs.run == 'true'
        run: |
          FERRUM_MODE=file \
          FERRUM_FILE_CONFIG_PATH="$(pwd)/tests/performance/perf_config.yaml" \
          FERRUM_LOG_LEVEL=error \
          FERRUM_ADD_VIA_HEADER=false \
          FERRUM_POOL_MAX_IDLE_PER_HOST=200 \
          FERRUM_POOL_IDLE_TIMEOUT_SECONDS=120 \
          FERRUM_POOL_ENABLE_HTTP_KEEP_ALIVE=true \
          FERRUM_POOL_ENABLE_HTTP2=false \
          FERRUM_POOL_WARMUP_ENABLED=true \
          ./target/ci-release/ferrum-edge run > /tmp/gateway.log 2>&1 &
          echo "GATEWAY_PID=$!" >> "${GITHUB_ENV}"
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "Gateway ready"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Gateway failed to start"
              cat /tmp/gateway.log
              exit 1
            fi
            sleep 1
          done

      - name: Run self-relative performance test
        if: steps.perf_changes.outputs.run == 'true'
        timeout-minutes: 5
        run: |
          mkdir -p tests/performance/ci_results
          python3 tests/performance/ci_overhead_bench.py \
            --gateway-url http://127.0.0.1:8000/api/users \
            --backend-url http://127.0.0.1:3001/api/users \
            --gateway-health-url http://127.0.0.1:8000/health \
            --concurrency 50 \
            --duration 5 \
            --iterations 3 \
            --warmup 2 \
            --overhead-threshold 50 \
            --output tests/performance/ci_results/overhead_results.json

      - name: Stop services
        if: always() && steps.perf_changes.outputs.run == 'true'
        run: |
          kill "${BACKEND_PID:-}" 2>/dev/null || true
          kill "${GATEWAY_PID:-}" 2>/dev/null || true

      - name: Upload performance results
        if: always() && steps.perf_changes.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-results
          path: tests/performance/ci_results/
          retention-days: 30

      - name: Post performance summary
        if: always()
        env:
          RUN: ${{ steps.perf_changes.outputs.run }}
          REASON: ${{ steps.perf_changes.outputs.reason }}
        run: |
          {
            echo "## Performance Regression Check"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${RUN}" != "true" ]; then
            {
              echo "Skipped expensive benchmark: ${REASON}"
              echo ""
              echo "Relevant paths: \`src/**\`, \`custom_plugins/**\`, \`vendor/**\`, \`ebpf/**\`, \`tests/performance/**\`, \`build.rs\`, \`ferrum.conf\`, \`proto/**\`, \`Cargo.toml\`, \`Cargo.lock\`, \`.cargo/**\`, \`rust-toolchain.toml\`, \`.github/workflows/ci.yml\`, \`.github/actions/**\`."
              echo ""
              echo "Changed files:"
              echo '```'
              if [ -s "${RUNNER_TEMP}/performance-regression-changed-files.txt" ]; then
                cat "${RUNNER_TEMP}/performance-regression-changed-files.txt"
              else
                echo "(none)"
              fi
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [ -f tests/performance/ci_results/overhead_results.json ]; then
            {
              echo '```json'
              cat tests/performance/ci_results/overhead_results.json
              echo ''
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Performance tests did not produce results." >> "${GITHUB_STEP_SUMMARY}"
          fi

  # ── Cross-platform builds ────────────────────────────────────────────────
  # PRs run a fast linked build (`pr-build`) to prove each platform compiles.
  # Main pushes build production `release` artifacts consumed by latest release
  # and Docker publication. Versioned tags are handled by release.yml.

  build-binaries:
    name: Build (${{ matrix.asset_name }})
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ferrum-edge
            asset_name: ferrum-edge-linux-x86_64
            cni_asset_name: ferrum-cni-linux-x86_64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: ferrum-edge
            asset_name: ferrum-edge-linux-aarch64
            cni_asset_name: ferrum-cni-linux-aarch64

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ferrum-edge
            asset_name: ferrum-edge-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ferrum-edge
            asset_name: ferrum-edge-macos-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ferrum-edge.exe
            asset_name: ferrum-edge-windows-x86_64.exe

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-sccache

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # Required native deps only. mold + clang are an optional fast-linker
        # optimization, so they are intentionally NOT in this strict transaction
        # — a transient mirror failure for those linker-only packages must not
        # fail an otherwise-buildable binary. setup-fast-linker below installs
        # them best-effort (continue-on-error) and clears the mold rustflags via
        # its fallback when they are missing, degrading to the default linker.
        run: |
          set -euo pipefail

          missing_packages=()
          if ! command -v protoc > /dev/null 2>&1; then
            missing_packages+=(protobuf-compiler)
          fi
          if ! dpkg -s libcurl4-openssl-dev > /dev/null 2>&1; then
            missing_packages+=(libcurl4-openssl-dev)
          fi
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            for package in gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu; do
              if ! dpkg -s "$package" > /dev/null 2>&1; then
                missing_packages+=("$package")
              fi
            done
          fi

          if [ "${#missing_packages[@]}" -eq 0 ]; then
            echo "Required Linux build dependencies already available"
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${missing_packages[@]}"

      - uses: ./.github/actions/setup-fast-linker

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        # Cache restore/save is a build-time optimization, not a correctness
        # input. The Windows runner occasionally fails the post-step cache
        # upload to GitHub's cache service with no log output (observed on PR
        # #884: tar.exe completes, then the step is marked failed before any
        # error is printed). The release binary itself is already built and
        # uploaded as an artifact before this step's post phase runs, so a
        # cache miss / save failure should not gate the binary build. Treat
        # this step as best-effort across all targets to avoid an entire
        # build matrix entry going red on a transient GitHub Actions cache
        # issue.
        continue-on-error: true
        with:
          shared-key: "build-${{ matrix.target }}"

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc and NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc nasm -y
          echo "C:\Program Files\NASM" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Install cross (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build PR verification binary (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && github.event_name == 'pull_request'
        run: cross build --features cloud-secrets --profile pr-build --target ${{ matrix.target }}
        env:
          RUSTC_WRAPPER: ""
          RUSTFLAGS: ""
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

      - name: Build release binary (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && github.event_name == 'push'
        run: cross build --features cloud-secrets --release --target ${{ matrix.target }}
        env:
          RUSTC_WRAPPER: ""
          RUSTFLAGS: ""
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

      - name: Build PR verification binary (cargo)
        if: matrix.target != 'aarch64-unknown-linux-gnu' && github.event_name == 'pull_request'
        run: cargo build --features cloud-secrets --profile pr-build --target ${{ matrix.target }}

      - name: Build release binary (cargo)
        if: matrix.target != 'aarch64-unknown-linux-gnu' && github.event_name == 'push'
        run: cargo build --features cloud-secrets --release --target ${{ matrix.target }}

      - name: Prepare release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "release-assets/${{ matrix.asset_name }}"
          if [[ -n "${{ matrix.cni_asset_name }}" ]]; then
            cp "target/${{ matrix.target }}/release/ferrum-cni" "release-assets/${{ matrix.cni_asset_name }}"
          fi
          cd release-assets
          for asset in *; do
            [[ "$asset" == *.sha256 ]] && continue
            if command -v sha256sum &> /dev/null; then
              sha256sum "$asset" > "$asset.sha256"
            else
              shasum -a 256 "$asset" > "$asset.sha256"
            fi
            cat "$asset.sha256"
          done

      - name: Upload artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: release-assets/

  latest-release:
    name: Update Latest Release
    needs: [build-binaries]
    if: always() && needs.build-binaries.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: downloaded-artifacts
          pattern: binary-*

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -la release-assets/

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing latest release and tag
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          # Build release notes
          cat > notes.md << 'NOTES'
          ## Latest Development Build

          Auto-built from the latest commit on `main` (${{ github.sha }}).

          For stable releases, download a versioned tag (e.g., `v1.0.0`).

          ### Binaries

          | Platform | Binary |
          |----------|--------|
          | Linux x86_64 | `ferrum-edge-linux-x86_64` |
          | Linux x86_64 CNI plugin | `ferrum-cni-linux-x86_64` |
          | Linux ARM64 | `ferrum-edge-linux-aarch64` |
          | Linux ARM64 CNI plugin | `ferrum-cni-linux-aarch64` |
          | macOS x86_64 | `ferrum-edge-macos-x86_64` |
          | macOS ARM64 (Apple Silicon) | `ferrum-edge-macos-aarch64` |
          | Windows x86_64 | `ferrum-edge-windows-x86_64.exe` |

          ### Docker

          ```bash
          docker pull ferrumedge/ferrum-edge:latest
          docker pull ghcr.io/ferrum-edge/ferrum-edge:latest
          ```

          ### Checksums

          ```
          NOTES
          cat release-assets/*.sha256 >> notes.md
          echo '```' >> notes.md

          # Create the release
          gh release create latest \
            --title "Latest Build ($(date -u +%Y-%m-%d))" \
            --notes-file notes.md \
            --prerelease \
            --target "${{ github.sha }}" \
            release-assets/*

  docker:
    name: Docker (${{ matrix.platform }})
    needs: [build-binaries]
    if: always() && needs.build-binaries.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            binary_target: x86_64-unknown-linux-gnu
            binary_asset: ferrum-edge-linux-x86_64
            cni_asset: ferrum-cni-linux-x86_64
            arch_dir: amd64
          - platform: linux/arm64
            binary_target: aarch64-unknown-linux-gnu
            binary_asset: ferrum-edge-linux-aarch64
            cni_asset: ferrum-cni-linux-aarch64
            arch_dir: arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Download Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-${{ matrix.binary_target }}
          path: downloaded-artifacts

      - name: Prepare Docker context
        run: |
          mkdir -p docker-context/bin/${{ matrix.arch_dir }}
          cp downloaded-artifacts/${{ matrix.binary_asset }} docker-context/bin/${{ matrix.arch_dir }}/ferrum-edge
          cp downloaded-artifacts/${{ matrix.cni_asset }} docker-context/bin/${{ matrix.arch_dir }}/ferrum-cni
          cp Dockerfile.release docker-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push per-platform digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: docker-context
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=ferrumedge/ferrum-edge,ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-digest-${{ matrix.arch_dir }}
          path: /tmp/digests/*
          if-no-files-found: error

  docker-manifest:
    name: Docker Manifest
    needs: docker
    if: always() && needs.docker.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest (Docker Hub)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ferrumedge/ferrum-edge:latest \
            -t ferrumedge/ferrum-edge:main-${{ github.sha }} \
            $(printf 'ferrumedge/ferrum-edge@sha256:%s ' *)

      - name: Create and push multi-arch manifest (GHCR)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:latest \
            -t ghcr.io/${{ github.repository }}:main-${{ github.sha }} \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
