    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust
        # The shard runs a prebuilt nextest archive, so it only needs `cargo`
        # on PATH for `cargo nextest`; sccache, rust-cache, protoc, and fast
        # linker setup belong in the archive build job.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-nextest
        # Prebuilt binaries from taiki-e/install-action — no compile time.
        # Nextest's process-per-test model isolates port/process contention
        # and ships built-in slow-test + retry support, which fits this E2E
        # suite better than libtest's shared-process scheduler.
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-nextest

      - name: Download prebuilt gateway binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ferrum-edge-debug-${{ runner.os }}-${{ runner.arch }}
          path: target/debug

      - name: Mark gateway binary executable
        # actions/download-artifact does not preserve the executable bit.
        run: chmod +x target/debug/ferrum-edge

      - name: Download functional tests archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: functional-tests-archive-${{ runner.os }}-${{ runner.arch }}
          path: .

      - name: Start data-plane service containers
        # Only the data-plane shard runs the redis/mongo-backed functional tests
        # (functional_redis_rate_limiting_test, functional_mongodb_test). These
        # services were previously declared job-wide, so EVERY shard provisioned
        # redis + mongo at job startup — a transient Docker Hub pull hiccup then
        # failed otherwise-unrelated shards (e.g. resilience) before any test ran.
        # Start them only where they're used to isolate that blast radius. Ports
        # map to the runner's localhost exactly as the service containers did, so
        # the tests' localhost:6379 / localhost:27017 connections are unchanged.
        if: matrix.shard == 'data-plane'
        run: |
          docker run -d --name ferrum-ci-redis -p 6379:6379 redis:7-alpine
          docker run -d --name ferrum-ci-mongo -p 27017:27017 mongo:7
          # The runner used to gate steps on the services' --health-cmd; reproduce
          # that readiness wait using the tools shipped inside each image.
          redis_ok=""
          for _ in $(seq 1 30); do
            if docker exec ferrum-ci-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              redis_ok=1; break
            fi
            sleep 2
          done
          mongo_ok=""
          for _ in $(seq 1 30); do
            if docker exec ferrum-ci-mongo mongosh --quiet \
                --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)' 2>/dev/null; then
              mongo_ok=1; break
            fi
            sleep 2
          done
          if [ -z "$redis_ok" ]; then
            echo "::error::redis did not become ready"; docker logs ferrum-ci-redis; exit 1
          fi
          if [ -z "$mongo_ok" ]; then
            echo "::error::mongo did not become ready"; docker logs ferrum-ci-mongo; exit 1
          fi
          echo "data-plane services ready (redis:6379, mongo:27017)"

      - name: Run functional test shard
        # ── Single nextest invocation per shard ───────────────────────────
        # The old loop ran `cargo test` once per filter line, paying cargo's
        # fingerprint-check + libtest startup (~3–5s) every iteration. With
        # 7–13 filters per shard that was 30–60s of pure overhead. Here we
        # collect the filters into an argv array and let nextest OR them.
        #
        # `--archive-file` skips per-shard recompiles. `--workspace-remap .`
        # rewrites the archive's compile-time workspace path to this runner's
        # checkout so runtime fixtures under tests/ keep resolving correctly.
        #
        # `--run-ignored=all` mirrors libtest's `--include-ignored` so the
        # non-ignored harness unit tests bundled into the functional_tests
        # binary (e.g. `common::config_builder::tests::*`) run alongside the
        # ignored E2E tests.
        #
        # The filter expression excludes the long stress suites that are
        # intentionally local-only:
        #   - test_scale_perf_30k_proxies (matches base + _postgres + _mongodb)
        #   - test_load_stress_10k_proxies (single ignored test in that file)
        #
        # `FERRUM_SKIP_GATEWAY_BUILD=1` makes `ensure_gateway_built()` in the
        # harness skip its per-process `cargo build --bin ferrum-edge` and
        # trust the artifact we just downloaded. Critical with nextest's
        # one-process-per-test model — otherwise every test would pay the
        # cargo fingerprint check on first call.
        run: |
          set -e
          archive_file="functional-tests-${RUNNER_OS}-${RUNNER_ARCH}.tar.zst"
          filters=()
          while IFS= read -r filter; do
            [ -z "$filter" ] && continue
            filters+=("$filter")
          done <<< "$FUNCTIONAL_FILTERS"
          nextest_args=()
          if [ -n "${NEXTEST_JOBS:-}" ]; then
            nextest_args+=("-j" "$NEXTEST_JOBS")
          fi
          cargo nextest run \
            --archive-file "$archive_file" \
            --workspace-remap . \
            --run-ignored=all \
            --no-fail-fast \
            -E 'not test(/test_scale_perf_30k_proxies/) and not test(/test_load_stress_10k_proxies/)' \
            "${nextest_args[@]}" \
            "${filters[@]}"
        env:
          FUNCTIONAL_FILTERS: ${{ matrix.filters }}
          NEXTEST_JOBS: ${{ matrix.nextest_jobs }}
          FERRUM_SKIP_GATEWAY_BUILD: "1"
          RUST_BACKTRACE: 1
        timeout-minutes: 30

      - name: Summarize functional shard
        if: always()
        run: |
          echo "## Functional Test Shard: ${{ matrix.shard }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "$FUNCTIONAL_FILTERS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          FUNCTIONAL_FILTERS: ${{ matrix.filters }}

  plugin-hardening-redis-regression:
    name: Plugin Hardening Redis Regression
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build-test-artifacts
