name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # crates.io download hardening — mirrors .cargo/config.toml [net]/[http].
  # The config file already covers every job that builds from this checkout;
  # surfacing the same values here makes the CI intent explicit/greppable and
  # covers any step that shells cargo outside the repo's config layering.
  # Rationale and the failure mode live in .cargo/config.toml.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  ci-plan:
    name: CI Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      run_helm: ${{ steps.plan.outputs.run_helm }}
      run_mesh_federation: ${{ steps.plan.outputs.run_mesh_federation }}
      run_mesh_sidecar_smoke: ${{ steps.plan.outputs.run_mesh_sidecar_smoke }}
      run_ebpf_live: ${{ steps.plan.outputs.run_ebpf_live }}
      run_ebpf_build: ${{ steps.plan.outputs.run_ebpf_build }}
      binary-matrix: ${{ steps.binary-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Validate ARM64 Cross policy without executing a PR verifier
        run: |
          set -euo pipefail
          policy=.github/scripts/verify_cross_build_policy.py

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="origin/${BASE_REF}"
            git fetch --no-tags origin \
              "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            if git cat-file -e "${base_ref}:${policy}" 2>/dev/null; then
              trusted_policy="$RUNNER_TEMP/verify-cross-build-policy.py"
              git show "${base_ref}:${policy}" > "$trusted_policy"
              policy="$trusted_policy"
            else
              # One-time bootstrap: the base has no verifier to execute yet.
              # Compile, then run this reviewed proposal in isolated mode. All
              # later PRs take the trusted-base branch above.
              PYTHONPYCACHEPREFIX="$RUNNER_TEMP/cross-policy-pyc" \
                python3 -I -m py_compile "$policy"
            fi
          fi

          python3 -I "$policy" \
            --self-test \
            --config Cross.toml \
            --cargo-config Cargo.toml \
            --ci-workflow .github/workflows/ci.yml \
            --release-workflow .github/workflows/release.yml \
            --workflows-dir .github/workflows
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}

      - name: Validate trusted PR CI planner examples
        run: |
          set -euo pipefail
          # The preceding Cross-policy step fetches the exact base ref into
          # origin/${BASE_REF}; keep these adjacent because this consumer uses
          # that immutable fetched ref rather than PR-controlled planner code.
          planner=.github/scripts/pr_ci_plan.py
          planner_dir=.github/scripts
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="origin/${BASE_REF}"
            if ! git cat-file -e "${base_ref}:${planner}" 2>/dev/null; then
              echo "::error::trusted base branch has no PR CI planner" >&2
              exit 1
            fi
            trusted_dir="$RUNNER_TEMP/pr-ci-plan-self-test"
            trusted_planner="$trusted_dir/pr_ci_plan.py"
            trusted_live_filter="$trusted_dir/live_suite_path_filter.py"
            mkdir -p "$trusted_dir"
            git show "${base_ref}:${planner}" > "$trusted_planner"
            git show \
              "${base_ref}:.github/scripts/live_suite_path_filter.py" \
              > "$trusted_live_filter"
            planner="$trusted_planner"
            planner_dir="$trusted_dir"
          fi
          python3 -I -c 'import runpy, sys; sys.path.insert(0, sys.argv.pop(1)); sys.argv[0] = sys.argv.pop(1); runpy.run_path(sys.argv[0], run_name="__main__")' "$planner_dir" "$planner" --self-test
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}

      - name: Check PR diff hygiene
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - id: plan
        name: Select CI mode
        run: |
          set -euo pipefail

          changed_files="$RUNNER_TEMP/pr-ci-changed-files.txt"
          planner=".github/scripts/pr_ci_plan.py"
          planner_dir=".github/scripts"
          : > "$changed_files"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="origin/${BASE_REF}"
            # Disable rename detection so moving a full-CI input to an allowed
            # lightweight path reports both the deleted source and destination.
            git diff --name-only --no-renames "${base_ref}...HEAD" | sort > "$changed_files"

            # A PR that edits only the planner must not be able to classify
            # itself as light. Use the base branch's trusted planner when it
            # exists; the current checkout is the bootstrap fallback for the
            # PR that first introduces this file.
            trusted_dir="$RUNNER_TEMP/pr-ci-plan"
            trusted_planner="$trusted_dir/pr_ci_plan.py"
            trusted_live_filter="$trusted_dir/live_suite_path_filter.py"
            if git cat-file -e "${base_ref}:${planner}" 2>/dev/null; then
              mkdir -p "$trusted_dir"
              git show "${base_ref}:${planner}" > "$trusted_planner"
              if git cat-file -e "${base_ref}:.github/scripts/live_suite_path_filter.py" 2>/dev/null; then
                git show "${base_ref}:.github/scripts/live_suite_path_filter.py" > "$trusted_live_filter"
              fi
              planner="$trusted_planner"
              planner_dir="$trusted_dir"
            fi
          fi

          plan="$(python3 -I -c 'import runpy, sys; sys.path.insert(0, sys.argv.pop(1)); sys.argv[0] = sys.argv.pop(1); runpy.run_path(sys.argv[0], run_name="__main__")' "$planner_dir" "$planner" \
            --event-name "$EVENT_NAME" \
            --changed-files "$changed_files")"
          mode="$(printf '%s\n' "$plan" | sed -n 's/^mode=//p')"
          reason="$(printf '%s\n' "$plan" | sed -n 's/^reason=//p')"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

          # The first PR that introduces these outputs necessarily runs the
          # older trusted base-branch planner. Missing/invalid gate values
          # therefore fail closed to true; after merge, the trusted planner
          # computes the narrow path gates for every subsequent PR.
          gate_fallbacks=()
          for gate in run_helm run_mesh_federation run_mesh_sidecar_smoke run_ebpf_live run_ebpf_build; do
            value="$(printf '%s\n' "$plan" | sed -n "s/^${gate}=//p")"
            if [ "$value" != "true" ] && [ "$value" != "false" ]; then
              value=true
              gate_fallbacks+=("$gate")
            fi
            printf '%s=%s\n' "$gate" "$value" >> "$GITHUB_OUTPUT"
          done

          {
            echo "## CI Plan"
            echo ""
            echo "Mode: **${mode}**"
            echo ""
            echo "$reason"
            if [ -s "$changed_files" ]; then
              echo ""
              echo "### Changed Files"
              echo ""
              while IFS= read -r path; do
                echo "- \`${path}\`"
              done < "$changed_files"
            fi
            echo ""
            echo "### Runner-free job gates"
            echo ""
            echo "| Gate | Scheduled |"
            echo "| --- | --- |"
            for gate in run_helm run_mesh_federation run_mesh_sidecar_smoke run_ebpf_live run_ebpf_build; do
              value="$(printf '%s\n' "$plan" | sed -n "s/^${gate}=//p")"
              if [ "$value" != "true" ] && [ "$value" != "false" ]; then
                value=true
              fi
              echo "| ${gate} | ${value} |"
            done
            if [ "${#gate_fallbacks[@]}" -gt 0 ]; then
              echo ""
              echo "The trusted base-branch planner predates one or more job gates; missing values were scheduled fail-closed."
            else
              echo ""
              echo "Jobs marked false are skipped before runner allocation because this PR does not touch their curated path surfaces."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}

      - id: binary-matrix
        name: Select binary build matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          builds = [
              {
                  "os": "ubuntu-latest",
                  "target": "x86_64-unknown-linux-gnu",
                  "artifact_name": "ferrum-edge",
                  "asset_name": "ferrum-edge-linux-x86_64",
                  "cni_asset_name": "ferrum-cni-linux-x86_64",
              },
              {
                  "os": "macos-latest",
                  "target": "x86_64-apple-darwin",
                  "artifact_name": "ferrum-edge",
                  "asset_name": "ferrum-edge-macos-x86_64",
              },
              {
                  "os": "macos-latest",
                  "target": "aarch64-apple-darwin",
                  "artifact_name": "ferrum-edge",
                  "asset_name": "ferrum-edge-macos-aarch64",
              },
              {
                  "os": "windows-latest",
                  "target": "x86_64-pc-windows-msvc",
                  "artifact_name": "ferrum-edge.exe",
                  "asset_name": "ferrum-edge-windows-x86_64.exe",
              },
          ]
          if os.environ["EVENT_NAME"] == "pull_request":
              builds = builds[:1]
          print("matrix=" + json.dumps({"include": builds}, separators=(",", ":")))
          PY
        env:
          EVENT_NAME: ${{ github.event_name }}

      - name: Install Rust formatting toolchain
        if: steps.plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check Rust formatting
        if: steps.plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: cargo fmt --all -- --check

      - name: Verify every integration_tests module is sharded
        if: steps.plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: |
          set -euo pipefail
          # All non-helper test files (excluding mod.rs and the shared
          # mesh_test_support helper).
          actual=$(ls tests/integration/*.rs \
            | xargs -n1 basename \
            | sed 's/\.rs$//' \
            | grep -v -E '^(mod|mesh_test_support)$' \
            | sort -u)
          # Keep this grep contract in sync with the test-integration matrix.
          declared=$(grep -hE '^[[:space:]]+integration::[a-z0-9_]+_tests[[:space:]]*$' .github/workflows/ci.yml \
            | sed -E 's|^[[:space:]]+integration::||; s|[[:space:]]+$||' \
            | sort -u)
          if ! diff <(echo "$actual") <(echo "$declared") > /tmp/integration-coverage.diff; then
            echo "Integration shard coverage mismatch. Files missing from a shard, or stale filters:"
            cat /tmp/integration-coverage.diff
            exit 1
          fi
          echo "All $(echo "$actual" | wc -l | tr -d ' ') integration test files are sharded."

  test-unit:
    name: Unit Tests
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test"

      - name: Run inline lib tests
        # Covers `#[cfg(test)] mod tests` blocks inline in `src/` (used for
        # private fns/structs that the separate tests/ binaries can't see).
        run: cargo test --lib
        env:
          RUST_BACKTRACE: 1

      - name: Run cache accounting and reload safety regressions
        # These tests are also part of the complete unit suite below. Run the
        # explicit contract first so test deletion/renaming cannot silently
        # weaken the hardening gate, while reusing the same compiled test
        # binary instead of paying for a second cold Rust job.
        run: |
          set -euo pipefail
          hardening_tests=(
            unit::plugins::response_caching_tests::test_concurrent_stores_keep_size_bounded_and_non_wrapping
            unit::plugins::plugin_cache_tests::test_rebuild_rejects_malformed_body_validator_and_keeps_prior_cache
            unit::plugins::plugin_cache_tests::test_apply_delta_rejects_malformed_request_size_limiting_and_keeps_prior_cache
            unit::plugins::plugin_cache_tests::test_apply_delta_rejects_unknown_enabled_plugin_and_keeps_prior_cache
          )

          set +e
          test_output="$(cargo test --test unit_tests -- --exact "${hardening_tests[@]}" 2>&1)"
          test_status=$?
          set -e

          printf '%s\n' "$test_output"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi

          if ! printf '%s\n' "$test_output" | grep -qE '^test result: ok\. 4 passed; 0 failed; 0 ignored;'; then
            echo "::error::expected exactly 4 plugin hardening unit regressions to run and pass"
            exit 1
          fi
        env:
          RUST_BACKTRACE: 1

      - name: Summarize plugin hardening unit regressions
        if: always()
        run: |
          echo "## Plugin Hardening Unit Regressions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- test_concurrent_stores_keep_size_bounded_and_non_wrapping" >> $GITHUB_STEP_SUMMARY
          echo "- test_rebuild_rejects_malformed_body_validator_and_keeps_prior_cache" >> $GITHUB_STEP_SUMMARY
          echo "- test_apply_delta_rejects_malformed_request_size_limiting_and_keeps_prior_cache" >> $GITHUB_STEP_SUMMARY
          echo "- test_apply_delta_rejects_unknown_enabled_plugin_and_keeps_prior_cache" >> $GITHUB_STEP_SUMMARY

      - name: Run unit tests
        run: cargo test --test unit_tests
        env:
          RUST_BACKTRACE: 1

  test-secrets:
    name: Secret Backends
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test-secrets"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-nextest

      - name: Run secret-backend functional tests
        # Compile once with every backend enabled, then preserve provider-level
        # failure reporting through nextest's per-test processes and
        # --no-fail-fast execution. Per-feature-combination compile checking is
        # intentionally not done here; feature-specific source remains covered
        # by the all-features build and the backend-specific test filters.
        # Vault/AWS use testcontainers; GCP/Azure use in-process wiremock fakes.
        run: |
          cargo nextest run \
            --features secrets-vault,secrets-aws,secrets-gcp,secrets-azure \
            --test secrets_functional \
            --no-fail-fast \
            file_backend cross_backend vault_backend aws_backend gcp_backend azure_backend
        env:
          RUST_BACKTRACE: 1

      - name: Run disabled-provider fail-closed checks (default features)
        # The all-features build above compiles out every
        # `#[cfg(not(feature = "secrets-*"))]` test in cross_backend, which
        # asserts that provider suffixes fail closed when their feature is not
        # compiled in — the shipped `default = []` posture. Run cross_backend
        # once more without cloud features so that coverage survives the
        # matrix consolidation.
        run: |
          cargo nextest run \
            --test secrets_functional \
            --no-fail-fast \
            cross_backend
        env:
          RUST_BACKTRACE: 1

  test-service-integration:
    name: Service Integration
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test-service-integration"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-nextest

      - name: Run service-integration tests
        # Consul, LDAP, Kafka/Redpanda, and MySQL run real third-party software
        # through testcontainers. Nextest reports each test independently and
        # keeps running after one backend fails so one middleware cannot mask
        # another.
        run: cargo nextest run --test service_integration --no-fail-fast consul ldap kafka mysql
        env:
          RUST_BACKTRACE: 1

  test-pkcs11-softhsm:
    name: PKCS#11 SoftHSM Smoke Test
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test-pkcs11"

      - name: Install SoftHSM and OpenSC tools
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc

      - name: Initialize SoftHSM token
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          cat > "$RUNNER_TEMP/softhsm/softhsm2.conf" <<EOF
          directories.tokendir = $RUNNER_TEMP/softhsm/tokens
          objectstore.backend = file
          log.level = ERROR
          slots.removable = false
          EOF
          export SOFTHSM2_CONF="$RUNNER_TEMP/softhsm/softhsm2.conf"
          softhsm2-util --init-token --free --label ferrum-ci --so-pin 1234 --pin 123456
          pkcs11-tool --module /usr/lib/softhsm/libsofthsm2.so \
            --login --pin 123456 --token-label ferrum-ci \
            --keypairgen --key-type rsa:2048 \
            --label edge-rsa --id 01 --usage-sign
          echo "SOFTHSM2_CONF=$SOFTHSM2_CONF" >> "$GITHUB_ENV"

      - name: Run PKCS#11 signer smoke test
        run: cargo test --features pkcs11 --lib tls::pkcs11::tests::signer_loads_configured_token_and_signs -- --ignored
        env:
          FERRUM_PKCS11_MODULE_PATH: /usr/lib/softhsm/libsofthsm2.so
          FERRUM_PKCS11_PIN: "123456"
          FERRUM_PKCS11_TEST_KEY_SOURCE: "pkcs11://edge-rsa?pin_env=FERRUM_PKCS11_PIN&id_hex=01"
          RUST_BACKTRACE: 1

  build-test-artifacts:
    name: Build Test Artifacts
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    # The gateway binary is packaged into a distroless Debian 13 image by
    # conformance consumers. Pin the build host so its glibc stays no newer
    # than the runtime image glibc; all native archive consumers use the same
    # Linux architecture.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-test-artifacts"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-nextest

      - name: Build gateway binary
        run: |
          set -euo pipefail
          cargo build --profile pr-build --bin ferrum-edge
          mkdir -p target/debug
          cp target/pr-build/ferrum-edge target/debug/ferrum-edge

      - name: Build ferrum-cni binary
        # `cni_tests` launches `env!("CARGO_BIN_EXE_ferrum-cni")`, which
        # Cargo bakes in as target/debug/ferrum-cni under the workspace path
        # used to build the archive. Keep archive builders and shard runners on
        # matching OS/arch + checkout layout, or update this artifact/path with
        # any future runner/workspace/target-dir change.
        #
        # This debug-path binary is transferred to every integration shard;
        # omit DWARF from the transfer-only build to keep the artifact small.
        run: cargo build --config profile.dev.debug=0 --bin ferrum-cni

      - name: Build integration tests archive
        # Nextest archives are native binaries, so the file and artifact names
        # include runner OS/arch. Full debuginfo makes the archive hundreds of
        # MB larger and is omitted only from this transfer artifact.
        run: |
          archive_file="integration-tests-${RUNNER_OS}-${RUNNER_ARCH}.tar.zst"
          cargo nextest archive \
            --config profile.test.debug=0 \
            --config profile.dev.debug=0 \
            --test integration_tests \
            --archive-file "$archive_file"

      - name: Build functional tests archive
        # Build the second test target in the same job and shared Cargo cache,
        # reusing the leaf-crate compilation from the integration archive.
        run: |
          archive_file="functional-tests-${RUNNER_OS}-${RUNNER_ARCH}.tar.zst"
          cargo nextest archive \
            --config profile.test.debug=0 \
            --config profile.dev.debug=0 \
            --test functional_tests \
            --archive-file "$archive_file"

      - name: Upload gateway binary
        # Consumers expect the existing target/debug path and OS/arch-keyed
        # artifact name even though the fast pr-build profile produced it.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ferrum-edge-debug-${{ runner.os }}-${{ runner.arch }}
          path: target/debug/ferrum-edge
          retention-days: 1
          if-no-files-found: error

      - name: Upload integration tests archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-tests-archive-${{ runner.os }}-${{ runner.arch }}
          path: integration-tests-${{ runner.os }}-${{ runner.arch }}.tar.zst
          retention-days: 1
          if-no-files-found: error

      - name: Upload ferrum-cni binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ferrum-cni-debug-${{ runner.os }}-${{ runner.arch }}
          path: target/debug/ferrum-cni
          retention-days: 1
          if-no-files-found: error

      - name: Upload functional tests archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: functional-tests-archive-${{ runner.os }}-${{ runner.arch }}
          path: functional-tests-${{ runner.os }}-${{ runner.arch }}.tar.zst
          retention-days: 1
          if-no-files-found: error

  test-integration:
    # Integration tests are an in-process suite — they spin up gateway state,
    # databases, gRPC servers, etc. inside the test process (no external
    # binary), so they ALSO don't need redis/mongo services. The shard split
    # below keeps all 74 test-file filters visible to the grep-based coverage
    # contract while balancing them across two runners. Two-hundred-plus
    # wall-clock waits in `wait_for_poll` / `wait_for_route` / fixed sleeps
    # make elapsed time, not CPU utilisation, the useful balancing signal.
    name: Integration Tests (${{ matrix.shard }})
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build-test-artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: admin-platform
            # Heavy admin API and cached-config surfaces share this shard with
            # the lower-count but setup-heavy k8s/telemetry/CNI platform tests.
            filters: |
              integration::admin_api_specs_handler_tests
              integration::admin_db_api_specs_tests
              integration::spec_expose_integration_tests
