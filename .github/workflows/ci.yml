          terminationGracePeriodSeconds: 10
          NULLGRACEEOF
          if helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            -f "$RUNNER_TEMP/ferrum-gateway-helm-results/null-drain-low-grace.yaml" \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/null-drain-low-grace-rendered.yaml" \
            2> "$RUNNER_TEMP/ferrum-gateway-helm-results/null-drain-low-grace.err"; then
            echo "::error title=Null drain skipped grace guard::null shutdownDrainSeconds must be validated against the 30s binary default"
            exit 1
          fi
          grep -F 'null shutdownDrainSeconds uses the binary' "$RUNNER_TEMP/ferrum-gateway-helm-results/null-drain-low-grace.err"
          grep -Fq 'maxUnavailable: 1' "$RUNNER_TEMP/ferrum-gateway-helm-results/null-rendered.yaml"
          if grep -Fq 'minAvailable:' "$RUNNER_TEMP/ferrum-gateway-helm-results/null-rendered.yaml"; then
            echo "::error title=Null minAvailable still rendered::minAvailable: null must fall through to maxUnavailable"
            exit 1
          fi
          # A concrete non-loopback admin bind is probed at that exact address: the
          # runtime binds admin only there, so dialing 127.0.0.1 would restart-loop.
          helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file --set admin.bindAddress=10.0.0.5 \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/concrete-bind.yaml"
          concrete_probe="$(awk '/^[[:space:]]+readinessProbe:/{f=1} f{print} f&&/periodSeconds:/{exit}' "$RUNNER_TEMP/ferrum-gateway-helm-results/concrete-bind.yaml")"
          if ! grep -q -- '- 10.0.0.5' <<<"$concrete_probe"; then
            echo "::error title=Concrete bind probe host mismatch::admin.bindAddress=10.0.0.5 must produce a --host 10.0.0.5 probe"
            exit 1
          fi
          # allowedCidrs must cover that concrete probe source or render fails.
          if helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file --set admin.bindAddress=10.0.0.5 \
            --set-string admin.allowedCidrs=192.168.0.0/16 \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/concrete-cidr-missing.yaml" \
            2> "$RUNNER_TEMP/ferrum-gateway-helm-results/concrete-cidr-missing.err"; then
            echo "::error title=Probe source omitted from allowlist::a concrete-bind probe source must be required"
            exit 1
          fi
          grep -F 'must include 10.0.0.5/32' "$RUNNER_TEMP/ferrum-gateway-helm-results/concrete-cidr-missing.err"
          # The exact probe source and a covering CIDR both satisfy the guard.
          helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file --set admin.bindAddress=10.0.0.5 \
            --set-string admin.allowedCidrs=10.0.0.5/32 \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/concrete-cidr-present.yaml"
          helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file --set admin.bindAddress=10.0.0.5 \
            --set-string admin.allowedCidrs=10.0.0.0/8 \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/concrete-covering-cidr.yaml"
          # CidrSet folds IPv4-mapped IPv6 rules into their embedded IPv4
          # network, so the chart's probe-source guard must do the same.
          helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file --set admin.bindAddress=10.0.0.5 \
            --set-string admin.allowedCidrs=::ffff:10.0.0.0/104 \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/mapped-ipv4-covering-cidr.yaml"
          helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file --set admin.bindAddress=10.0.0.5 \
            --set-string admin.allowedCidrs=::ffff:10.0.0.5 \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/mapped-ipv4-exact.yaml"
          helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file --set admin.bindAddress=fd00::5 \
            --set-string admin.allowedCidrs=fd00::/8 \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/ipv6-covering-cidr.yaml"
          if helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file --set admin.bindAddress=fd00::5 \
            --set-string admin.allowedCidrs=fe00::/8 \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/ipv6-cidr-missing.yaml" \
            2> "$RUNNER_TEMP/ferrum-gateway-helm-results/ipv6-cidr-missing.err"; then
            echo "::error title=IPv6 probe source omitted from allowlist::an unrelated IPv6 CIDR must not satisfy the guard"
            exit 1
          fi
          grep -F 'must include fd00::5/128' "$RUNNER_TEMP/ferrum-gateway-helm-results/ipv6-cidr-missing.err"
          # A resolver-suffixed source of a chart-managed base var is reserved: it
          # resolves into the base var and would collide with the chart's own
          # source at secret resolution (resolve_all_env_secrets aborts startup).
          if helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file \
            --set-string env.FERRUM_ADMIN_JWT_SECRET_VAULT=secret/data/ferrum#admin \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/env-suffix-reserved.yaml" \
            2> "$RUNNER_TEMP/ferrum-gateway-helm-results/env-suffix-reserved.err"; then
            echo "::error title=Reserved suffix env accepted::a resolver-suffixed managed var must be reserved"
            exit 1
          fi
          grep -F 'env.FERRUM_ADMIN_JWT_SECRET_VAULT is managed by first-class' "$RUNNER_TEMP/ferrum-gateway-helm-results/env-suffix-reserved.err"
          if helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file \
            --set 'extraEnv[0].name=FERRUM_DB_URL_FILE' \
            --set-string 'extraEnv[0].value=/etc/ferrum/db-url' \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/extraenv-suffix-reserved.yaml" \
            2> "$RUNNER_TEMP/ferrum-gateway-helm-results/extraenv-suffix-reserved.err"; then
            echo "::error title=Reserved suffix extraEnv accepted::a resolver-suffixed managed var must be reserved"
            exit 1
          fi
          grep -F 'extraEnv entry FERRUM_DB_URL_FILE is managed by first-class' "$RUNNER_TEMP/ferrum-gateway-helm-results/extraenv-suffix-reserved.err"
          # HTTP/3 (QUIC) via the env passthrough publishes the HTTPS port on UDP
          # too, and declares the UDP container port the Service targets by name.
          helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file \
            --set tls.frontend.enabled=true --set tls.frontend.secretName=ferrum-frontend-tls \
            --set-string env.FERRUM_ENABLE_HTTP3=true \
            --show-only templates/service.yaml \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/http3-service.yaml"
          grep -Fq -- '- name: https-quic' "$RUNNER_TEMP/ferrum-gateway-helm-results/http3-service.yaml"
          quic_block="$(awk '/- name: https-quic/{f=1} f{print} f&&/protocol:/{exit}' "$RUNNER_TEMP/ferrum-gateway-helm-results/http3-service.yaml")"
          if ! grep -q 'protocol: UDP' <<<"$quic_block"; then
            echo "::error title=QUIC Service port not UDP::https-quic must be protocol UDP"
            exit 1
          fi
          helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file \
            --set tls.frontend.enabled=true --set tls.frontend.secretName=ferrum-frontend-tls \
            --set-string env.FERRUM_ENABLE_HTTP3=true \
            --show-only templates/deployment.yaml \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/http3-deploy.yaml"
          grep -Fq -- '- name: proxy-h3-udp' "$RUNNER_TEMP/ferrum-gateway-helm-results/http3-deploy.yaml"
          # The binary bool also accepts "1" through extraEnv (list form).
          helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file \
            --set tls.frontend.enabled=true --set tls.frontend.secretName=ferrum-frontend-tls \
            --set 'extraEnv[0].name=FERRUM_ENABLE_HTTP3' --set-string 'extraEnv[0].value=1' \
            --show-only templates/service.yaml \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/http3-extraenv-service.yaml"
          grep -Fq -- '- name: https-quic' "$RUNNER_TEMP/ferrum-gateway-helm-results/http3-extraenv-service.yaml"
          # Frontend TLS without HTTP/3 stays TCP-only (no dead UDP port).
          if grep -Fq -- '- name: https-quic' "$RUNNER_TEMP/ferrum-gateway-helm-results/frontend-tls-rendered.yaml"; then
            echo "::error title=QUIC port without HTTP/3::https-quic must only render when FERRUM_ENABLE_HTTP3 is enabled"
            exit 1
          fi
          # HTTP/3 enabled without an active HTTPS listener publishes no UDP port
          # (the QUIC listener needs frontend TLS / dp mode to start).
          helm template ferrum ./charts/ferrum-gateway --namespace ferrum \
            --set mode=file --set-string env.FERRUM_ENABLE_HTTP3=true \
            --show-only templates/service.yaml \
            > "$RUNNER_TEMP/ferrum-gateway-helm-results/http3-no-tls-service.yaml"
          if grep -Fq -- '- name: https-quic' "$RUNNER_TEMP/ferrum-gateway-helm-results/http3-no-tls-service.yaml"; then
            echo "::error title=QUIC port without HTTPS listener::https-quic must require an active HTTPS listener"
            exit 1
          fi

      - name: Upload core gateway chart diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ferrum-gateway-helm-chart
          path: ${{ runner.temp }}/ferrum-gateway-helm-results
          retention-days: 7

      - name: Download prebuilt gateway binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ferrum-edge-debug-${{ runner.os }}-${{ runner.arch }}
          path: target/debug

      - name: Package Ferrum image
        uses: ./.github/actions/package-ferrum-runtime-image
        with:
          binary-path: target/debug/ferrum-edge
          image: ${{ env.FERRUM_IMAGE }}

      - name: Create kind cluster
        run: |
          set -euo pipefail
          chmod +x target/debug/ferrum-edge
          kind create cluster --name ferrum-helm --wait 120s
          kind load docker-image "$FERRUM_IMAGE" --name ferrum-helm

      - name: Default install renders no unusable control plane
        run: |
          set -euo pipefail
          kubectl create namespace ferrum-default
          helm install ferrum-default ./charts/ferrum-mesh -n ferrum-default
          kubectl -n ferrum-default get all -o wide > "$RUNNER_TEMP/ferrum-helm-results/default-install-resources.txt"
          if kubectl -n ferrum-default get deployment ferrum-mesh-control-plane >/dev/null 2>&1; then
            echo "::error title=Default install created a control plane::default install must not create an unusable CP"
            exit 1
          fi
          if [ -n "$(kubectl -n ferrum-default get pods -o name)" ]; then
            echo "::error title=Default install created runtime pods::default install should be scaffolding-only"
            kubectl -n ferrum-default get pods -o wide
            exit 1
          fi

      - name: Development values become Ready
        run: |
          set -euo pipefail
          kubectl create namespace ferrum-dev
          admin_secret="$(openssl rand -hex 32)"
          grpc_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${admin_secret}"
          echo "::add-mask::${grpc_secret}"
          kubectl -n ferrum-dev create secret generic ferrum-mesh-dev-credentials \
            --from-literal=admin-jwt-secret="${admin_secret}" \
            --from-literal=cp-dp-grpc-jwt-secret="${grpc_secret}"
          helm install ferrum-dev ./charts/ferrum-mesh -n ferrum-dev \
            -f ./charts/ferrum-mesh/examples/development-values.yaml \
            --set image.repository=ferrum-edge \
            --set image.tag=helm-chart-ci \
            --set image.pullPolicy=IfNotPresent
          kubectl -n ferrum-dev rollout status deployment/ferrum-mesh-control-plane --timeout=180s
          kubectl -n ferrum-dev get pods -o wide > "$RUNNER_TEMP/ferrum-helm-results/development-pods.txt"
          kubectl -n ferrum-dev describe deployment/ferrum-mesh-control-plane > "$RUNNER_TEMP/ferrum-helm-results/development-control-plane-deployment.txt"
          kubectl -n ferrum-dev get events --sort-by=.lastTimestamp > "$RUNNER_TEMP/ferrum-helm-results/development-events.txt"
          kubectl -n ferrum-dev logs deployment/ferrum-mesh-control-plane --all-containers --tail=1000 > "$RUNNER_TEMP/ferrum-helm-results/development-control-plane.log"
          if grep -Fq "${admin_secret}" "$RUNNER_TEMP/ferrum-helm-results/development-control-plane.log" ||
             grep -Fq "${grpc_secret}" "$RUNNER_TEMP/ferrum-helm-results/development-control-plane.log"; then
            rm -f "$RUNNER_TEMP/ferrum-helm-results/development-control-plane.log"
            echo "::error title=Secret leaked to logs::development control-plane logs contained a JWT secret"
            exit 1
          fi

      - name: Existing Secret production-style values become Ready
        run: |
          set -euo pipefail
          kubectl create namespace ferrum-prod
          pg_password="$(openssl rand -hex 24)"
          admin_secret="$(openssl rand -hex 32)"
          grpc_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${pg_password}"
          echo "::add-mask::${admin_secret}"
          echo "::add-mask::${grpc_secret}"
          kubectl -n ferrum-prod create secret generic ferrum-postgres \
            --from-literal=password="${pg_password}"
          cat <<'YAML' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ferrum-postgres
            namespace: ferrum-prod
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ferrum-postgres
            template:
              metadata:
                labels:
                  app: ferrum-postgres
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    ports:
                      - containerPort: 5432
                    env:
                      - name: POSTGRES_DB
                        value: ferrum
                      - name: POSTGRES_USER
                        value: ferrum
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: ferrum-postgres
                            key: password
                    readinessProbe:
                      exec:
                        command: ["pg_isready", "-U", "ferrum", "-d", "ferrum"]
                      periodSeconds: 2
                      timeoutSeconds: 2
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ferrum-postgres
            namespace: ferrum-prod
          spec:
            selector:
              app: ferrum-postgres
            ports:
              - name: postgres
                port: 5432
                targetPort: 5432
          YAML
          kubectl -n ferrum-prod rollout status deployment/ferrum-postgres --timeout=180s
          db_url="postgres://ferrum:${pg_password}@ferrum-postgres.ferrum-prod.svc.cluster.local:5432/ferrum"
          echo "::add-mask::${db_url}"
          kubectl -n ferrum-prod create secret generic ferrum-mesh-production-db \
            --from-literal=url="${db_url}"
          kubectl -n ferrum-prod create secret generic ferrum-mesh-production-credentials \
            --from-literal=admin-jwt-secret="${admin_secret}" \
            --from-literal=cp-dp-grpc-jwt-secret="${grpc_secret}"
          helm install ferrum-prod ./charts/ferrum-mesh -n ferrum-prod \
            -f ./charts/ferrum-mesh/examples/production-existing-secrets-values.yaml \
            --set image.repository=ferrum-edge \
            --set image.tag=helm-chart-ci \
            --set image.pullPolicy=IfNotPresent
          kubectl -n ferrum-prod rollout status deployment/ferrum-mesh-control-plane --timeout=180s
          kubectl -n ferrum-prod get pods -o wide > "$RUNNER_TEMP/ferrum-helm-results/production-pods.txt"
          kubectl -n ferrum-prod describe deployment/ferrum-mesh-control-plane > "$RUNNER_TEMP/ferrum-helm-results/production-control-plane-deployment.txt"
          kubectl -n ferrum-prod get events --sort-by=.lastTimestamp > "$RUNNER_TEMP/ferrum-helm-results/production-events.txt"
          kubectl -n ferrum-prod logs deployment/ferrum-mesh-control-plane --all-containers --tail=1000 > "$RUNNER_TEMP/ferrum-helm-results/production-control-plane.log"
          for secret in "$pg_password" "$db_url" "$admin_secret" "$grpc_secret"; do
            if grep -Fq "$secret" "$RUNNER_TEMP/ferrum-helm-results/production-control-plane.log"; then
              rm -f "$RUNNER_TEMP/ferrum-helm-results/production-control-plane.log"
              echo "::error title=Secret leaked to logs::production-style control-plane logs contained a secret value"
              exit 1
            fi
          done

      - name: Collect Helm chart diagnostics
        if: always()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/ferrum-helm-results"
          for ns in ferrum-default ferrum-dev ferrum-prod; do
            kubectl -n "$ns" get all -o wide > "$RUNNER_TEMP/ferrum-helm-results/${ns}-all.txt" 2>&1
            kubectl -n "$ns" get events --sort-by=.lastTimestamp > "$RUNNER_TEMP/ferrum-helm-results/${ns}-events.txt" 2>&1
            kubectl -n "$ns" get pods -o jsonpath='{range .items[*]}{.metadata.name}{" phase="}{.status.phase}{" ready="}{range .status.containerStatuses[*]}{.ready}{" restartCount="}{.restartCount}{" exitCode="}{.lastState.terminated.exitCode}{" reason="}{.lastState.terminated.reason}{";"}{end}{"\n"}{end}' \
              > "$RUNNER_TEMP/ferrum-helm-results/${ns}-pod-status.txt" 2>&1
          done

      - name: Upload Helm chart diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ferrum-mesh-helm-chart
          path: ${{ runner.temp }}/ferrum-helm-results
          retention-days: 7

  test:
    name: Tests
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs:
      - ci-plan
      - test-unit
      - test-secrets
      - test-service-integration
      - test-pkcs11-softhsm
      - build-test-artifacts
      - test-integration
      - test-conformance
      - dependency-audit
      - test-vendor-patches
      - test-functional
      - plugin-hardening-redis-regression
      - mesh-multicluster-federation
      - mesh-e2e-sidecar
      - helm-chart
      - lint
      - build-ebpf
      - build-ebpf-userspace
      - ebpf-live
      - netns-capture-live
      - two-cluster-mesh-live
      - performance-regression
      - build-binaries
      - build-arm64-cross
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Verify required CI aggregate wiring
        run: python3 .github/scripts/verify_required_ci.py

      - name: Summarize required CI results
        run: |
          set -euo pipefail

          failures=0

          add_row() {
            echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"
          }

          require_success() {
            local label="$1"
            local result="$2"
            if [ "$CI_MODE" = "light" ] && [ "$result" = "skipped" ]; then
              return
            fi
            if [ "$result" != "success" ]; then
              echo "::error title=Required CI failed::${label} completed with result '${result}'"
              failures=1
            fi
          }

          require_live_gate() {
            local label="$1"
            local result="$2"
            local changed="${{ needs.ci-plan.outputs.run_ebpf_live }}"
            if [ "$changed" = "true" ]; then
              require_success "$label" "$result"
              return
            fi
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error title=Live CI gate failed::${label} completed with result '${result}'"
              failures=1
            fi
          }

          require_planned_gate() {
            local label="$1"
            local result="$2"
            local scheduled="$3"
            if [ "$scheduled" = "true" ]; then
              require_success "$label" "$result"
              return
            fi
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error title=Path-gated CI failed::${label} completed with result '${result}'"
              failures=1
            fi
          }

          echo "## Required CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY

          add_row "CI plan, format, and shard coverage (${CI_MODE})" "${{ needs.ci-plan.result }}"
          add_row "Unit and inline lib" "${{ needs.test-unit.result }}"
          add_row "Secret backends" "${{ needs.test-secrets.result }}"
          add_row "Service integration" "${{ needs.test-service-integration.result }}"
          add_row "PKCS#11 SoftHSM integration" "${{ needs.test-pkcs11-softhsm.result }}"
          add_row "Test artifact build" "${{ needs.build-test-artifacts.result }}"
          add_row "Integration" "${{ needs.test-integration.result }}"
          add_row "Mesh conformance" "${{ needs.test-conformance.result }}"
          add_row "Dependency audit" "${{ needs.dependency-audit.result }}"
          add_row "Vendored patch regressions" "${{ needs.test-vendor-patches.result }}"
          add_row "Functional shards" "${{ needs.test-functional.result }}"
          add_row "Plugin hardening Redis regression" "${{ needs.plugin-hardening-redis-regression.result }}"
          add_row "Mesh multicluster federation" "${{ needs.mesh-multicluster-federation.result }}"
          add_row "Mesh e2e sidecar" "${{ needs.mesh-e2e-sidecar.result }}"
          add_row "Helm chart" "${{ needs.helm-chart.result }}"
          add_row "Lint" "${{ needs.lint.result }}"
          add_row "eBPF programs" "${{ needs.build-ebpf.result }}"
          add_row "eBPF userspace loader" "${{ needs.build-ebpf-userspace.result }}"
          add_row "eBPF live-kernel" "${{ needs.ebpf-live.result }}"
          add_row "Netns capture live" "${{ needs.netns-capture-live.result }}"
          add_row "Two-cluster mesh live" "${{ needs.two-cluster-mesh-live.result }}"
          add_row "Performance regression" "${{ needs.performance-regression.result }}"
          add_row "Native platform binaries" "${{ needs.build-binaries.result }}"
          add_row "Protected Linux ARM64 Cross build" "${{ needs.build-arm64-cross.result }}"

          require_success "CI plan" "${{ needs.ci-plan.result }}"
          require_success "Unit and inline lib" "${{ needs.test-unit.result }}"
          require_success "Secret backends" "${{ needs.test-secrets.result }}"
          require_success "Service integration" "${{ needs.test-service-integration.result }}"
          require_success "PKCS#11 SoftHSM integration" "${{ needs.test-pkcs11-softhsm.result }}"
          require_success "Test artifact build" "${{ needs.build-test-artifacts.result }}"
          require_success "Integration" "${{ needs.test-integration.result }}"
          require_success "Mesh conformance" "${{ needs.test-conformance.result }}"
          require_success "Dependency audit" "${{ needs.dependency-audit.result }}"
          require_success "Vendored patch regressions" "${{ needs.test-vendor-patches.result }}"
          require_success "Functional shards" "${{ needs.test-functional.result }}"
          require_success "Plugin hardening Redis regression" "${{ needs.plugin-hardening-redis-regression.result }}"
          require_planned_gate "Mesh multicluster federation" "${{ needs.mesh-multicluster-federation.result }}" "${{ needs.ci-plan.outputs.run_mesh_federation }}"
          require_planned_gate "Mesh e2e sidecar" "${{ needs.mesh-e2e-sidecar.result }}" "${{ needs.ci-plan.outputs.run_mesh_sidecar_smoke }}"
          require_planned_gate "Helm chart" "${{ needs.helm-chart.result }}" "${{ needs.ci-plan.outputs.run_helm }}"
          require_success "Lint" "${{ needs.lint.result }}"
          require_planned_gate "eBPF programs" "${{ needs.build-ebpf.result }}" "${{ needs.ci-plan.outputs.run_ebpf_build }}"
          require_success "eBPF userspace loader" "${{ needs.build-ebpf-userspace.result }}"
          require_live_gate "eBPF live-kernel" "${{ needs.ebpf-live.result }}"
          require_live_gate "Netns capture live" "${{ needs.netns-capture-live.result }}"
          require_live_gate "Two-cluster mesh live" "${{ needs.two-cluster-mesh-live.result }}"
          require_success "Performance regression" "${{ needs.performance-regression.result }}"
          require_success "Native platform binaries" "${{ needs.build-binaries.result }}"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "${{ needs.build-arm64-cross.result }}" != "skipped" ]; then
              echo "::error title=Unexpected ARM64 PR build::protected Cross invocation must run only after code reaches main"
              failures=1
            fi
          else
            require_success "Protected Linux ARM64 Cross build" "${{ needs.build-arm64-cross.result }}"
          fi

          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
        env:
          CI_MODE: ${{ needs.ci-plan.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}

  lint:
    name: Lint
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-lint"
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  build-ebpf:
    name: Build eBPF Programs
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full' && needs.ci-plan.outputs.run_ebpf_build == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install nightly Rust with rust-src
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: rust-src

      - name: Install stable Rust for shared types
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: ./.github/actions/setup-sccache

      - uses: ./.github/actions/setup-fast-linker

      - name: Cache eBPF Rust dependencies and compiler outputs
        if: steps.changes.outputs.ebpf_changed == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "ci-ebpf-programs"
          workspaces: |
            ebpf -> target
          cache-directories: ${{ github.workspace }}/.cache/sccache

      - name: Install bpf-linker
        run: cargo install bpf-linker --locked

      - name: Build BPF programs
        run: cd ebpf && cargo +nightly build --target bpfel-unknown-none -Z build-std=core --release -p ferrum-ebpf

      - name: Test shared types
        run: cd ebpf && cargo test -p ferrum-ebpf-common

      - name: Upload BPF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ebpf-programs
          path: ebpf/target/bpfel-unknown-none/release/ferrum-ebpf
          retention-days: 14

  build-ebpf-userspace:
    name: Build eBPF Userspace Loader
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-ebpf-userspace"

      - name: Build userspace aya loader (--features ebpf)
        # The aya userspace loader (src/ebpf/loader.rs, src/ebpf/maps.rs) only
        # compiles under `--features ebpf` on Linux, and no other CI job
        # exercises it — the default image ships the no-op mock backend. This
        # guarantees the loader keeps building as the shared BPF ABI
        # (ferrum-ebpf-common) and map set evolve. The kernel ELF is read at
        # runtime, so no compiled BPF object is needed here.
        run: cargo build --lib --features ebpf
        env:
          RUST_BACKTRACE: 1

  ebpf-live:
    name: eBPF Live-Kernel Test
    needs: ci-plan
    # Live kernel validation is high-value for BPF/node-waypoint-sensitive
    # changes, but it adds several minutes to every PR when run unconditionally.
    if: needs.ci-plan.outputs.mode == 'full' && needs.ci-plan.outputs.run_ebpf_live == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install nightly Rust with rust-src
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: rust-src

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-ebpf-live"

      - name: Install bpf-linker
        run: cargo install bpf-linker --locked

      - name: Build BPF programs (kernel object)
        run: cd ebpf && cargo +nightly build --target bpfel-unknown-none -Z build-std=core --release -p ferrum-ebpf

      - name: Build and locate live-kernel test binary (--features ebpf)
        id: build_test_bin
        run: |
          set -euo pipefail
          mapfile -t bins < <(
            cargo test --features ebpf --lib --no-run --message-format=json-render-diagnostics \
              | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null and (.target.kind | index("lib"))) | .executable'
          )
          if [ "${#bins[@]}" -ne 1 ]; then
            printf 'Expected exactly one lib test binary, found %s:\n' "${#bins[@]}" >&2
            printf '%s\n' "${bins[@]}" >&2
            exit 1
          fi
          BIN="${bins[0]}"
          echo "Live-kernel test binary: $BIN"
          echo "test_bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Ensure bpffs is mounted
        run: sudo mount -t bpf bpf /sys/fs/bpf 2>/dev/null || true

      - name: Preflight live-kernel prerequisites
        run: |
          set -euo pipefail
          kernel="$(uname -r)"
          major="${kernel%%.*}"
          rest="${kernel#*.}"
          minor="${rest%%.*}"
          if [ "$major" -lt 5 ] || { [ "$major" -eq 5 ] && [ "$minor" -lt 7 ]; }; then
            echo "::error::kernel ${kernel} is older than the required Linux 5.7"
            exit 1
          fi
          test -f /sys/fs/cgroup/cgroup.controllers || {
            echo "::error::cgroup v2 is not mounted at /sys/fs/cgroup"
            exit 1
          }
          sudo mount -t bpf bpf /sys/fs/bpf 2>/dev/null || true
          mountpoint -q /sys/fs/bpf || {
            echo "::error::bpffs is not mounted at /sys/fs/bpf"
            exit 1
          }
          sudo -n true

      - name: Run live-kernel eBPF test as root
        # Loads + verifies every BPF program (including the GAP-2M sock_ops
        # cookie bridge) on the runner's real kernel, attaches them to a
        # scratch cgroup, and round-trips the workload-identity map. Required
        # mode turns any test-level SKIP into a CI failure. Run the prebuilt
        # test binary directly under sudo so cargo never runs as root against
        # the user-owned target dir.
        run: |
          set -euo pipefail
          BIN="${{ steps.build_test_bin.outputs.test_bin }}"
          echo "Live-kernel test binary: $BIN"
          set +e
          output="$(sudo -E \
            "FERRUM_NODE_AGENT_BPF_ELF_PATH=$GITHUB_WORKSPACE/ebpf/target/bpfel-unknown-none/release/ferrum-ebpf" \
            "FERRUM_LIVE_TESTS_REQUIRED=1" \
            "$BIN" ebpf::loader::live_kernel_tests --ignored --nocapture --test-threads=1 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^SKIP:' <<<"$output"; then
            echo "::error::eBPF live tests skipped under required CI mode"
            exit 1
          fi
          if ! grep -Eq '^test result: ok\. 2 passed; 0 failed;' <<<"$output"; then
            echo "::error::expected exactly 2 eBPF live tests to pass"
            exit 1
          fi
        env:
          RUST_BACKTRACE: 1

  netns-capture-live:
    name: Netns Source Capture Live Tests
    needs: ci-plan
    # The netns tests require privileged live-kernel operations; the path gate
    # keeps unrelated PRs fast while preserving coverage for capture/proxy paths.
    if: needs.ci-plan.outputs.mode == 'full' && needs.ci-plan.outputs.run_ebpf_live == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-netns-capture-live"

      - name: Build and locate live test binary
        id: build_test_bin
        run: |
          set -euo pipefail
          mapfile -t bins < <(
            cargo test --lib --no-run --message-format=json-render-diagnostics \
              | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null and (.target.kind | index("lib"))) | .executable'
          )
          if [ "${#bins[@]}" -ne 1 ]; then
            printf 'Expected exactly one lib test binary, found %s:\n' "${#bins[@]}" >&2
            printf '%s\n' "${bins[@]}" >&2
            exit 1
          fi
          BIN="${bins[0]}"
          echo "In-netns live test binary: $BIN"
          echo "test_bin=$BIN" >> "$GITHUB_OUTPUT"

          cargo build --bin ferrum-edge
          mapfile -t functional_bins < <(
            cargo test --test functional_tests --no-run --message-format=json-render-diagnostics \
              | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null and (.target.kind | index("test"))) | .executable'
          )
          if [ "${#functional_bins[@]}" -ne 1 ]; then
            printf 'Expected exactly one functional test binary, found %s:\n' "${#functional_bins[@]}" >&2
            printf '%s\n' "${functional_bins[@]}" >&2
            exit 1
          fi
          FUNCTIONAL_BIN="${functional_bins[0]}"
          echo "Source-capture functional test binary: $FUNCTIONAL_BIN"
          echo "functional_test_bin=$FUNCTIONAL_BIN" >> "$GITHUB_OUTPUT"

      - name: Preflight netns capture prerequisites
        run: |
          set -euo pipefail
          sudo -n true
          for bin in unshare nsenter setpriv timeout ip iptables iptables-save; do
            command -v "$bin" >/dev/null 2>&1 || {
              echo "::error::$bin is required for strict netns live tests"
              exit 1
            }
          done
          sudo unshare --net sh -c 'ip link set lo up 2>/dev/null || true; iptables -t nat -L >/dev/null'

      - name: Run in-netns capture live tests as root
        # Privileged functional tests for the per-pod-netns outbound capture
        # listener (`src/proxy/netns_capture.rs`). They create + enter network
        # namespaces (needs CAP_SYS_ADMIN) to prove a 127.0.0.1:15001 listener
        # bound INSIDE a pod netns is reachable from a client in that netns and
        # isolated from the host netns — the loopback property a single
        # host-netns listener cannot satisfy. Also runs the SO_ORIGINAL_DST
        # live test (`src/socket_opts.rs::original_dst_live_tests`): a real
        # iptables REDIRECT in a throwaway netns must report the pre-NAT
        # destination on the accepted socket — the primitive mesh outbound
        # multi-port routing rests on. Also runs the mesh UDP source-capture
        # live test (`src/proxy/mesh_udp_capture.rs::live_netns_tests`): a real
        # TPROXY mangle rule + fwmark policy routing in a throwaway netns must
        # divert a pod-egress UDP datagram onto the transparent capture socket
        # and recover its pre-TPROXY destination from the IP_RECVORIGDSTADDR
        # cmsg (the UDP analogue of SO_ORIGINAL_DST). Required mode turns any
        # test-level SKIP into a CI failure. Run the prebuilt binary directly
        # under sudo so cargo never runs as root against the user-owned target.
        run: |
          set -euo pipefail
          BIN="${{ steps.build_test_bin.outputs.test_bin }}"
          echo "In-netns live test binary: $BIN"
          set +e
          output="$(sudo -E "FERRUM_LIVE_TESTS_REQUIRED=1" \
            timeout --signal=KILL 120s \
            "$BIN" proxy::netns_capture::live_netns_tests socket_opts::original_dst_live_tests proxy::mesh_udp_capture::live_netns_tests --ignored --nocapture --test-threads=1 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^SKIP:' <<<"$output"; then
            echo "::error::netns live tests skipped under required CI mode"
            exit 1
          fi
          if ! grep -Eq '^test result: ok\. 4 passed; 0 failed;' <<<"$output"; then
            echo "::error::expected exactly 4 netns live tests to pass"
            exit 1
          fi

      - name: Run full UDP and raw-TCP source-capture live e2e as root
        # Runs two real-gateway functional tests under the same strict live-test
        # gate: Ambient's NetnsUdpCaptureManager installs the per-pod producer
        # and relays UDP over HBONE with transparent VIP:port replies; the raw-TCP
        # counterpart uses the production REDIRECT plan and Sidecar mesh-mTLS.
        # Hard timeout is a final guard against a wedged kernel/netns operation.
        run: |
          set -euo pipefail
          BIN="${{ steps.build_test_bin.outputs.functional_test_bin }}"
          echo "Source-capture functional test binary: $BIN"
          set +e
          output="$(sudo -E \
            "FERRUM_LIVE_TESTS_REQUIRED=1" \
            "FERRUM_SKIP_GATEWAY_BUILD=1" \
            timeout --signal=KILL 240s \
            "$BIN" functional_mesh_live_source_capture --ignored --nocapture --test-threads=1 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^SKIP:' <<<"$output"; then
            echo "::error::source-capture live tests skipped under required CI mode"
            exit 1
          fi
          if ! grep -Eq '^test result: ok\. 2 passed; 0 failed;' <<<"$output"; then
            echo "::error::expected exactly 2 full source-capture live tests to pass"
            exit 1
          fi
        env:
          RUST_BACKTRACE: 1

  two-cluster-mesh-live:
    name: Two-Cluster Mesh Live Datapath
    needs: ci-plan
    # Shares the mesh/netns-sensitive path detector with the source-capture
    # lane. The gate is intentionally separate because it downloads two real
    # SPIRE control planes and runs the full cross-cluster protocol matrix.
    if: needs.ci-plan.outputs.mode == 'full' && needs.ci-plan.outputs.run_ebpf_live == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-two-cluster-mesh-live"

      - name: Install pinned SPIRE server and agent
        env:
          SPIRE_VERSION: 1.15.2
          SPIRE_LINUX_AMD64_MUSL_SHA256: 3874d07ffeb6640bafb9fe6a538de06151f155d5ed2f8e8a51f138d2f51b8105
        run: |
          set -euo pipefail
          archive="spire-${SPIRE_VERSION}-linux-amd64-musl.tar.gz"
          base="https://github.com/spiffe/spire/releases/download/v${SPIRE_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          printf '%s  %s\n' "$SPIRE_LINUX_AMD64_MUSL_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive"
          sudo install -m 0755 "spire-${SPIRE_VERSION}/bin/spire-server" /usr/local/bin/spire-server
          sudo install -m 0755 "spire-${SPIRE_VERSION}/bin/spire-agent" /usr/local/bin/spire-agent
          spire-server -version
          spire-agent -version

      - name: Build and locate two-cluster functional test binary
        id: build_test_bin
        run: |
          set -euo pipefail
          cargo build --bin ferrum-edge
          mapfile -t bins < <(
            cargo test --test functional_tests --no-run --message-format=json-render-diagnostics \
              | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null and (.target.kind | index("test"))) | .executable'
          )
          if [ "${#bins[@]}" -ne 1 ]; then
            printf 'Expected exactly one functional test binary, found %s:\n' "${#bins[@]}" >&2
            printf '%s\n' "${bins[@]}" >&2
            exit 1
          fi
          echo "functional_test_bin=${bins[0]}" >> "$GITHUB_OUTPUT"

      - name: Preflight two-cluster netns prerequisites
        run: |
          set -euo pipefail
          sudo -n true
          for bin in unshare nsenter setpriv timeout ip iptables iptables-save sysctl spire-server spire-agent; do
            command -v "$bin" >/dev/null 2>&1 || {
              echo "::error::$bin is required for the strict two-cluster live gate"
              exit 1
            }
          done
          sudo unshare --net sh -c 'ip link set lo up; iptables -t nat -L >/dev/null'

      - name: Run real two-cluster cross-cluster protocol matrix as root
        run: |
          set -euo pipefail
          BIN="${{ steps.build_test_bin.outputs.functional_test_bin }}"
          output_file="$RUNNER_TEMP/two-cluster-live-output.log"
          set +e
          sudo -E \
            "FERRUM_LIVE_TESTS_REQUIRED=1" \
            "FERRUM_SKIP_GATEWAY_BUILD=1" \
            timeout --signal=KILL 600s \
            "$BIN" functional_mesh_live_two_cluster_cross_cluster_protocol_matrix \
              --ignored --nocapture --test-threads=1 2>&1 | tee "$output_file"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^SKIP:' "$output_file"; then
            echo "::error::two-cluster live test skipped under required CI mode"
            exit 1
          fi
          if ! grep -Eq '^test result: ok\. 1 passed; 0 failed;' "$output_file"; then
            echo "::error::expected exactly one shared two-cluster live gate to pass"
            exit 1
          fi
        env:
          RUST_BACKTRACE: 1

  performance-regression:
    name: Performance Regression Check
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Detect performance-sensitive changes
        id: perf_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          run_benchmark=true
          run_ip_restriction_benchmark=false
          reason="Performance regression checks always run for ${EVENT_NAME} events."
          changed_files=""

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null)"; then
              run_benchmark=false
              reason="No performance-sensitive paths changed."

              # This smoke benchmark drives plain HTTP/1.1 through a file-mode
              # proxy route. Gate it on shared/deep proxy hot paths, file-mode
              # startup, and dependency/build surfaces that can affect that
              # measurement. Individual plugin implementations, admin,
              # secrets, and unrelated operating modes are not observable here
              # and should not pay for a 17-minute release build.
              while IFS= read -r path; do
                # Every top-level src/*.rs module is shared runtime
                # infrastructure (request_epoch, overload, load balancing,
                # pooling, adaptive concurrency, metrics — see the CLAUDE.md
                # source layout) consumed on or beside the measured request
                # path; gate the whole tier instead of enumerating files.
                # `case` globs match `/`, so test the tier explicitly:
                # starts with src/, ends with .rs, no deeper directory.
                rest="${path#src/}"
                if [ "${rest}" != "${path}" ] \
                  && [ "${rest%.rs}" != "${rest}" ] \
                  && [ "${rest#*/}" = "${rest}" ]; then
                  run_benchmark=true
                  reason="Performance-sensitive paths changed."
                  break
                fi
                case "${path}" in
                  src/proxy/*|src/http3/*|src/dns/*|src/pool/*|\
                  src/config/*|src/plugins/mod.rs|\
                  src/modes/file.rs|src/modes/mod.rs|\
                  vendor/*|ebpf/*|tests/performance/*|proto/*|.cargo/*|.github/actions/*|\
                  build.rs|ferrum.conf|Cargo.toml|Cargo.lock|rust-toolchain.toml|\
                  .github/workflows/ci.yml)
                    run_benchmark=true
                    reason="Performance-sensitive paths changed."
                    break
                    ;;
                esac
              done <<<"${changed_files}"
            else
              run_benchmark=true
              reason="Could not diff against origin/${BASE_REF}; running benchmark to be safe."
              changed_files=""
            fi
          fi

          if [ "${EVENT_NAME}" != "pull_request" ] || grep -Eq '^(src/plugins/(ip_restriction\.rs|mod\.rs)|tests/performance/mesh/(Cargo\.(toml|lock)|benches/ip_restriction\.rs)|\.github/scripts/verify_ip_restriction_benchmark\.py|\.github/workflows/ci\.yml)$' <<<"${changed_files}"; then
            run_ip_restriction_benchmark=true
          fi

          if [ -n "${changed_files}" ]; then
            printf '%s\n' "${changed_files}" > "${RUNNER_TEMP}/performance-regression-changed-files.txt"
          else
            : > "${RUNNER_TEMP}/performance-regression-changed-files.txt"
          fi

          {
            echo "run=${run_benchmark}"
            echo "run_ip_restriction_benchmark=${run_ip_restriction_benchmark}"
            echo "reason=${reason}"
          } >> "${GITHUB_OUTPUT}"

      - uses: ./.github/actions/setup-rust-ci
        if: steps.perf_changes.outputs.run == 'true' || steps.perf_changes.outputs.run_ip_restriction_benchmark == 'true'
        with:
          shared-key: "ci-perf"

      - name: Run IP restriction worst-case microbenchmark
        if: steps.perf_changes.outputs.run_ip_restriction_benchmark == 'true'
        run: |
          cargo bench --manifest-path tests/performance/mesh/Cargo.toml --bench ip_restriction
          python3 .github/scripts/verify_ip_restriction_benchmark.py \
            --criterion-root tests/performance/mesh/target/criterion \
            --max-scaling-ratio 8 \
            --max-ns-per-instance 10000

      - name: Build release binaries
        if: steps.perf_changes.outputs.run == 'true'
        run: |
          cargo build --profile ci-release --bin ferrum-edge
          cd tests/performance && cargo build --release --bin backend_server

      - name: Start backend server
        if: steps.perf_changes.outputs.run == 'true'
        run: |
          tests/performance/target/release/backend_server > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "${GITHUB_ENV}"
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:3001/health > /dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Backend failed to start"
              cat /tmp/backend.log
              exit 1
            fi
            sleep 1
          done

      - name: Start gateway
        if: steps.perf_changes.outputs.run == 'true'
        run: |
          FERRUM_MODE=file \
          FERRUM_FILE_CONFIG_PATH="$(pwd)/tests/performance/perf_config.yaml" \
          FERRUM_LOG_LEVEL=error \
          FERRUM_ADD_VIA_HEADER=false \
          FERRUM_POOL_MAX_IDLE_PER_HOST=200 \
          FERRUM_POOL_IDLE_TIMEOUT_SECONDS=120 \
          FERRUM_POOL_ENABLE_HTTP_KEEP_ALIVE=true \
          FERRUM_POOL_ENABLE_HTTP2=false \
          FERRUM_POOL_WARMUP_ENABLED=true \
          ./target/ci-release/ferrum-edge run > /tmp/gateway.log 2>&1 &
          echo "GATEWAY_PID=$!" >> "${GITHUB_ENV}"
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "Gateway ready"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Gateway failed to start"
              cat /tmp/gateway.log
              exit 1
            fi
            sleep 1
          done

      - name: Run self-relative performance test
        if: steps.perf_changes.outputs.run == 'true'
        timeout-minutes: 5
        run: |
          mkdir -p tests/performance/ci_results
          python3 tests/performance/ci_overhead_bench.py \
            --gateway-url http://127.0.0.1:8000/api/users \
            --backend-url http://127.0.0.1:3001/api/users \
            --gateway-health-url http://127.0.0.1:8000/health \
            --concurrency 50 \
            --duration 5 \
            --iterations 3 \
            --warmup 2 \
            --overhead-threshold 50 \
            --output tests/performance/ci_results/overhead_results.json

      - name: Stop services
        if: always() && steps.perf_changes.outputs.run == 'true'
        run: |
          kill "${BACKEND_PID:-}" 2>/dev/null || true
          kill "${GATEWAY_PID:-}" 2>/dev/null || true

      - name: Upload performance results
        if: always() && (steps.perf_changes.outputs.run == 'true' || steps.perf_changes.outputs.run_ip_restriction_benchmark == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-results
          path: |
            tests/performance/ci_results/
            tests/performance/mesh/target/criterion/ip_restriction_lookup/
          retention-days: 30

      - name: Post performance summary
        if: always()
        env:
          RUN: ${{ steps.perf_changes.outputs.run }}
          RUN_IP_RESTRICTION: ${{ steps.perf_changes.outputs.run_ip_restriction_benchmark }}
          REASON: ${{ steps.perf_changes.outputs.reason }}
        run: |
          {
            echo "## Performance Regression Check"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${RUN_IP_RESTRICTION}" = "true" ]; then
            {
              echo "IP restriction lookup guard executed: 10,000/100-rule mean ratio <= 8x and 10,000-rule mean <= 10 microseconds per plugin instance."
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ "${RUN}" != "true" ]; then
            {
              echo "Skipped self-relative gateway benchmark: ${REASON}"
              echo ""
              echo "Relevant paths:"
              echo "- Shared runtime infrastructure: every top-level \`src/*.rs\` module (request epoch, overload, load balancing, pooling, adaptive concurrency, metrics, startup — all consumed on or beside the measured request path)."
              echo "- Proxy and connection hot paths: \`src/proxy/**\`, \`src/http3/**\`, \`src/dns/**\`, and \`src/pool/**\`."
              echo "- File-mode gateway path: \`src/config/**\` (env/conf precedence, file loading, validation, pool tuning, and domain types all feed the measured startup and request flow), \`src/plugins/mod.rs\`, \`src/modes/file.rs\`, and \`src/modes/mod.rs\`."
              echo "- Build and dependency graph: \`vendor/**\`, \`ebpf/**\`, \`tests/performance/**\`, \`proto/**\`, \`.cargo/**\`, \`build.rs\`, \`ferrum.conf\`, \`Cargo.toml\`, \`Cargo.lock\`, \`rust-toolchain.toml\`, \`.github/workflows/ci.yml\`, and \`.github/actions/**\`."
              echo ""
              echo "Changed files:"
              echo '```'
              if [ -s "${RUNNER_TEMP}/performance-regression-changed-files.txt" ]; then
                cat "${RUNNER_TEMP}/performance-regression-changed-files.txt"
              else
                echo "(none)"
              fi
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [ -f tests/performance/ci_results/overhead_results.json ]; then
            {
              echo '```json'
              cat tests/performance/ci_results/overhead_results.json
              echo ''
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Performance tests did not produce results." >> "${GITHUB_STEP_SUMMARY}"
          fi

  # ── Cross-platform builds ────────────────────────────────────────────────
  # PRs run the native Linux x86_64 build needed by the required CI gate. Main
  # pushes build the four native production `release` artifacts here. Linux
  # ARM64 runs in the isolated, policy-protected job below so no shared setup
  # step or inherited environment can alter Cross. Versioned tags are handled
  # by release.yml.

  build-binaries:
    name: Build (${{ matrix.asset_name }})
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-plan.outputs.binary-matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-sccache

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # Required native deps only. mold + clang are an optional fast-linker
        # optimization, so they are intentionally NOT in this strict transaction
        # — a transient mirror failure for those linker-only packages must not
        # fail an otherwise-buildable binary. setup-fast-linker below installs
        # them best-effort (continue-on-error) and clears the mold rustflags via
        # its fallback when they are missing, degrading to the default linker.
        run: |
          set -euo pipefail

          missing_packages=()
          if ! command -v protoc > /dev/null 2>&1; then
            missing_packages+=(protobuf-compiler)
          fi
          if ! dpkg -s libcurl4-openssl-dev > /dev/null 2>&1; then
            missing_packages+=(libcurl4-openssl-dev)
          fi
          if [ "${#missing_packages[@]}" -eq 0 ]; then
            echo "Required Linux build dependencies already available"
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${missing_packages[@]}"

      - uses: ./.github/actions/setup-fast-linker

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        # Cache restore/save is a build-time optimization, not a correctness
        # input. The Windows runner occasionally fails the post-step cache
        # upload to GitHub's cache service with no log output (observed on PR
        # #884: tar.exe completes, then the step is marked failed before any
        # error is printed). The release binary itself is already built and
        # uploaded as an artifact before this step's post phase runs, so a
        # cache miss / save failure should not gate the binary build. Treat
        # this step as best-effort across all targets to avoid an entire
        # build matrix entry going red on a transient GitHub Actions cache
        # issue.
        continue-on-error: true
        with:
          shared-key: "build-${{ matrix.target }}"
          cache-directories: ${{ github.workspace }}/.cache/sccache

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # Chocolatey's mutable community feed has intermittently returned 406 for
      # NASM before Cargo even starts. Download the official release and verify
      # its content instead of depending on the community package feed.
      - name: Install protoc and NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $protocVersion = "35.1"
          $protocRoot = Join-Path $env:RUNNER_TEMP "protoc-$protocVersion"
          $protocZip = Join-Path $env:RUNNER_TEMP "protoc-$protocVersion-win64.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$protocVersion/protoc-$protocVersion-win64.zip" `
            -OutFile $protocZip
          Expand-Archive -Path $protocZip -DestinationPath $protocRoot -Force
          $protocBin = Join-Path $protocRoot "bin"
          $protocExe = Join-Path $protocBin "protoc.exe"
          if (!(Test-Path $protocExe)) {
            throw "protoc.exe was not found after extracting $protocZip"
          }
          $protocBin | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          "PROTOC=$protocExe" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

          $nasmVersion = "3.02"
          $nasmZip = Join-Path $env:RUNNER_TEMP "nasm-$nasmVersion-win64.zip"
          $nasmRoot = Join-Path $env:RUNNER_TEMP "nasm"
          Invoke-WebRequest `
            -Uri "https://www.nasm.us/pub/nasm/releasebuilds/$nasmVersion/win64/nasm-$nasmVersion-win64.zip" `
            -OutFile $nasmZip
          $expectedNasmSha256 = "161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7"
          $actualNasmSha256 = (Get-FileHash -Algorithm SHA256 $nasmZip).Hash.ToLowerInvariant()
          if ($actualNasmSha256 -ne $expectedNasmSha256) {
            throw "NASM archive SHA-256 mismatch: expected $expectedNasmSha256, got $actualNasmSha256"
          }
          Expand-Archive -Path $nasmZip -DestinationPath $nasmRoot -Force
          $nasmBin = Join-Path $nasmRoot "nasm-$nasmVersion"
          $nasmExe = Join-Path $nasmBin "nasm.exe"
          if (!(Test-Path $nasmExe)) {
            throw "nasm.exe was not found after extracting $nasmZip"
          }
          $nasmBin | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Build PR verification binary
        if: github.event_name == 'pull_request'
        run: cargo build --features cloud-secrets --profile pr-build --target ${{ matrix.target }}

      - name: Build release binary
        if: github.event_name == 'push'
        run: cargo build --features cloud-secrets --release --target ${{ matrix.target }}

      - name: Prepare release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "release-assets/${{ matrix.asset_name }}"
          if [[ -n "${{ matrix.cni_asset_name }}" ]]; then
            cp "target/${{ matrix.target }}/release/ferrum-cni" "release-assets/${{ matrix.cni_asset_name }}"
          fi
          cd release-assets
          for asset in *; do
            [[ "$asset" == *.sha256 ]] && continue
            if command -v sha256sum &> /dev/null; then
              sha256sum "$asset" > "$asset.sha256"
            else
              shasum -a 256 "$asset" > "$asset.sha256"
            fi
            cat "$asset.sha256"
          done

      - name: Upload artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: release-assets/

  build-arm64-cross:
    name: Build (ferrum-edge-linux-aarch64)
    needs: ci-plan
    if: needs.ci-plan.outputs.mode == 'full' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust and the ARM64 target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Install checksum-verified Cross 0.2.5
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cross@0.2.5
          fallback: none

      - name: Revalidate the complete trusted Cross input boundary
        run: |
          python3 -I .github/scripts/verify_cross_build_policy.py \
            --config Cross.toml \
            --cargo-config Cargo.toml \
            --ci-workflow .github/workflows/ci.yml \
            --release-workflow .github/workflows/release.yml

      - name: Build release binary with a fixed empty Cross environment
        run: |
          set -euo pipefail
          test -x /home/runner/.cargo/bin/cross
          clean_path=/home/runner/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          clean_hostname="$(/bin/hostname)"
          env -i \
            HOME=/home/runner \
            USER=runner \
            HOSTNAME="$clean_hostname" \
            PATH="$clean_path" \
            CARGO_HOME=/home/runner/.cargo \
            RUSTUP_HOME=/home/runner/.rustup \
            CARGO_TERM_COLOR=always \
            TERM=xterm \
            CI=true \
            RUSTC_WRAPPER= \
            RUSTFLAGS= \
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
            CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++ \
            AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar \
            /home/runner/.cargo/bin/cross build \
              --features cloud-secrets \
              --release \
              --target aarch64-unknown-linux-gnu

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp target/aarch64-unknown-linux-gnu/release/ferrum-edge release-assets/ferrum-edge-linux-aarch64
          cp target/aarch64-unknown-linux-gnu/release/ferrum-cni release-assets/ferrum-cni-linux-aarch64
          cd release-assets
          for asset in *; do
            sha256sum "$asset" > "$asset.sha256"
            cat "$asset.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-aarch64-unknown-linux-gnu
          path: release-assets/

  main-publish-gate:
    name: Main Publish Gate
    needs: [test, build-binaries]
    if: always() && needs.test.result == 'success' && needs.build-binaries.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The polling loop stops at its own 60-minute deadline, so the fail-closed
    # timeout below is always the branch that fires. This job-level ceiling is
    # only a backstop against a wedged runner and bounds runner occupancy.
    timeout-minutes: 75
    permissions:
      actions: read
    steps:
      - name: Wait for dedicated release checks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Each record binds the API endpoint, the run-reported workflow path,
          # and the display name. A display name alone is not an identity: a
          # second workflow can reuse it and must never satisfy publication for
          # a missing canonical run.
          required_workflow_specs=(
            "coverage.yml|.github/workflows/coverage.yml|Coverage"
            "gateway-api-conformance.yml|.github/workflows/gateway-api-conformance.yml|Gateway API Conformance"
            "mesh-e2e-sidecar-live.yml|.github/workflows/mesh-e2e-sidecar-live.yml|Mesh E2E Sidecar Live Datapath"
          )

          # Bound the wait inside `timeout-minutes` so the runner is never held
          # past this deadline and the diagnostic below stays reachable.
          deadline=$((SECONDS + 3600))

          while :; do
            pending=0

            for specification in "${required_workflow_specs[@]}"; do
              IFS='|' read -r workflow_file workflow_path workflow <<<"$specification"

              # Query the canonical workflow endpoint, not the repository-wide
              # run list. The endpoint identity prevents a different workflow
              # with the same display name from satisfying this requirement.
              # The remaining fields independently bind the run to this exact
              # file, name, commit, push event, and branch.
              runs=""
              api_succeeded=0
              for attempt in 1 2 3; do
                if runs="$(
                  gh api --paginate \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${REPOSITORY}/actions/workflows/${workflow_file}/runs?head_sha=${HEAD_SHA}&event=push&branch=${BRANCH_NAME}&per_page=100" \
                    --jq '.workflow_runs[] | [.name, .path, .status, (.conclusion // ""), .head_branch, .event, .head_sha] | @tsv'
                )"; then
                  api_succeeded=1
                  break
                fi
                if [ "$attempt" -lt 3 ]; then
                  echo "::warning::Actions API query failed for ${workflow_path}; retrying (${attempt}/3)."
                  sleep $((attempt * 5))
                fi
              done
              if [ "$api_succeeded" -ne 1 ]; then
                echo "::error::Actions API query failed for ${workflow_path} after 3 attempts."
                exit 1
              fi

              # A record that does not carry exactly seven fields cannot be
              # matched field by field. Reject malformed data instead of
              # silently treating the canonical workflow as absent.
              if awk -F '\t' 'NF > 0 && NF != 7 { found = 1 } END { exit !found }' \
                <<<"$runs"; then
                echo "::error::Malformed ${workflow_path} run data for ${HEAD_SHA}."
                exit 1
              fi

              # The workflow-specific endpoint should return only this file.
              # Verify both server-reported identity fields anyway so an API or
              # repository identity drift fails immediately and visibly.
              if awk -F '\t' \
                -v name="$workflow" \
                -v path="$workflow_path" \
                'NF == 7 && ($1 != name || $2 != path) { found = 1 } END { exit !found }' \
                <<<"$runs"; then
                echo "::error::Workflow identity mismatch for ${workflow_path}."
                exit 1
              fi

              # Every matching run must succeed. Selecting a single run would
              # let one passing duplicate mask a failed run of the same
              # workflow for this same commit and branch.
              matching="$(awk -F '\t' \
                -v name="$workflow" \
                -v path="$workflow_path" \
                -v branch="$BRANCH_NAME" \
                -v sha="$HEAD_SHA" \
                'NF == 7 && $1 == name && $2 == path && $5 == branch && $6 == "push" && $7 == sha { print $3 "\t" $4 }' \
                <<<"$runs")"
              if [ -z "$matching" ]; then
                echo "Waiting for ${workflow} to start for ${HEAD_SHA}."
                pending=1
                continue
              fi

              workflow_pending=0
              # A here-string keeps this loop in the current shell so the flag
              # it sets, and any `exit`, take effect for the whole step.
              while IFS=$'\t' read -r status conclusion; do
                if [ "$status" != "completed" ]; then
                  echo "Waiting for ${workflow}: ${status}."
                  workflow_pending=1
                elif [ "$conclusion" != "success" ]; then
                  echo "::error::${workflow} concluded ${conclusion:-unknown} for ${HEAD_SHA}."
                  exit 1
                fi
              done <<<"$matching"

              if [ "$workflow_pending" -eq 1 ]; then
                pending=1
              else
                echo "${workflow} passed."
              fi
            done

            if [ "$pending" -eq 0 ]; then
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            sleep 30
          done

          echo "::error::Timed out waiting for dedicated release checks for ${HEAD_SHA}."
          exit 1

  latest-release:
    name: Update Latest Release
    needs: [test, build-binaries, build-arm64-cross, main-publish-gate]
    if: always() && needs.test.result == 'success' && needs.build-binaries.result == 'success' && needs.build-arm64-cross.result == 'success' && needs.main-publish-gate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # Download exactly the five trusted build artifacts by name. A wildcard
      # pattern would also accept any other artifact whose name happened to
      # start with the same prefix, so an unrelated job could contribute files
      # to the published `latest` release.
      - name: Download native binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: downloaded-artifacts/binary-x86_64-unknown-linux-gnu

      - name: Download protected ARM64 binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-aarch64-unknown-linux-gnu
          path: downloaded-artifacts/binary-aarch64-unknown-linux-gnu

      - name: Download macOS x86_64 binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-x86_64-apple-darwin
          path: downloaded-artifacts/binary-x86_64-apple-darwin

      - name: Download macOS aarch64 binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-aarch64-apple-darwin
          path: downloaded-artifacts/binary-aarch64-apple-darwin

      - name: Download Windows binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-x86_64-pc-windows-msvc
          path: downloaded-artifacts/binary-x86_64-pc-windows-msvc

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # The closed, auditable published asset set. Each entry names one
          # exact trusted artifact directory and one exact file inside it, so a
          # colliding or extra upload can neither add nor replace an asset.
          copy_trusted_asset() {
            if [ ! -f "downloaded-artifacts/$1" ] || [ -L "downloaded-artifacts/$1" ]; then
              echo "::error::missing trusted release asset $1" >&2
              exit 1
            fi
            cp "downloaded-artifacts/$1" "release-assets/$2"
            echo "$2" >> "$RUNNER_TEMP/expected-assets"
          }
          : > "$RUNNER_TEMP/expected-assets"
          copy_trusted_asset binary-x86_64-unknown-linux-gnu/ferrum-edge-linux-x86_64 ferrum-edge-linux-x86_64
          copy_trusted_asset binary-x86_64-unknown-linux-gnu/ferrum-edge-linux-x86_64.sha256 ferrum-edge-linux-x86_64.sha256
          copy_trusted_asset binary-x86_64-unknown-linux-gnu/ferrum-cni-linux-x86_64 ferrum-cni-linux-x86_64
          copy_trusted_asset binary-x86_64-unknown-linux-gnu/ferrum-cni-linux-x86_64.sha256 ferrum-cni-linux-x86_64.sha256
          copy_trusted_asset binary-aarch64-unknown-linux-gnu/ferrum-edge-linux-aarch64 ferrum-edge-linux-aarch64
          copy_trusted_asset binary-aarch64-unknown-linux-gnu/ferrum-edge-linux-aarch64.sha256 ferrum-edge-linux-aarch64.sha256
          copy_trusted_asset binary-aarch64-unknown-linux-gnu/ferrum-cni-linux-aarch64 ferrum-cni-linux-aarch64
          copy_trusted_asset binary-aarch64-unknown-linux-gnu/ferrum-cni-linux-aarch64.sha256 ferrum-cni-linux-aarch64.sha256
          copy_trusted_asset binary-x86_64-apple-darwin/ferrum-edge-macos-x86_64 ferrum-edge-macos-x86_64
          copy_trusted_asset binary-x86_64-apple-darwin/ferrum-edge-macos-x86_64.sha256 ferrum-edge-macos-x86_64.sha256
          copy_trusted_asset binary-aarch64-apple-darwin/ferrum-edge-macos-aarch64 ferrum-edge-macos-aarch64
          copy_trusted_asset binary-aarch64-apple-darwin/ferrum-edge-macos-aarch64.sha256 ferrum-edge-macos-aarch64.sha256
          copy_trusted_asset binary-x86_64-pc-windows-msvc/ferrum-edge-windows-x86_64.exe ferrum-edge-windows-x86_64.exe
          copy_trusted_asset binary-x86_64-pc-windows-msvc/ferrum-edge-windows-x86_64.exe.sha256 ferrum-edge-windows-x86_64.exe.sha256
          # Publishing must be exactly the trusted set, never whatever the
          # download happened to produce.
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/expected-assets"
          ls -A release-assets | LC_ALL=C sort > "$RUNNER_TEMP/published-assets"
          if ! diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/published-assets"; then
            echo "::error::published release asset set drifted from the trusted set" >&2
            exit 1
          fi
          cd release-assets
          sha256sum -c ./*.sha256
          cd ..
          ls -la release-assets/
      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing latest release and tag
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          # Build release notes
          cat > notes.md << 'NOTES'
          ## Latest Development Build

          Auto-built from the latest commit on `main` (${{ github.sha }}).

          For stable releases, download a versioned tag (e.g., `v1.0.0`).

          ### Binaries

          | Platform | Binary |
          |----------|--------|
          | Linux x86_64 | `ferrum-edge-linux-x86_64` |
          | Linux x86_64 CNI plugin | `ferrum-cni-linux-x86_64` |
          | Linux ARM64 | `ferrum-edge-linux-aarch64` |
          | Linux ARM64 CNI plugin | `ferrum-cni-linux-aarch64` |
          | macOS x86_64 | `ferrum-edge-macos-x86_64` |
          | macOS ARM64 (Apple Silicon) | `ferrum-edge-macos-aarch64` |
          | Windows x86_64 | `ferrum-edge-windows-x86_64.exe` |

          ### Docker

          ```bash
          docker pull ferrumedge/ferrum-edge:latest
          docker pull ghcr.io/ferrum-edge/ferrum-edge:latest
          ```

          ### Checksums

          ```
          NOTES
          cat release-assets/*.sha256 >> notes.md
          echo '```' >> notes.md

          # Create the release
          gh release create latest \
            --title "Latest Build ($(date -u +%Y-%m-%d))" \
            --notes-file notes.md \
            --prerelease \
            --target "${{ github.sha }}" \
            release-assets/*

  docker:
    name: Docker (${{ matrix.platform }})
    needs: [test, build-binaries, build-arm64-cross, main-publish-gate]
    if: always() && needs.test.result == 'success' && needs.build-binaries.result == 'success' && needs.build-arm64-cross.result == 'success' && needs.main-publish-gate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            binary_target: x86_64-unknown-linux-gnu
            binary_asset: ferrum-edge-linux-x86_64
            cni_asset: ferrum-cni-linux-x86_64
            arch_dir: amd64
          - platform: linux/arm64
            binary_target: aarch64-unknown-linux-gnu
            binary_asset: ferrum-edge-linux-aarch64
            cni_asset: ferrum-cni-linux-aarch64
            arch_dir: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-${{ matrix.binary_target }}
          path: downloaded-artifacts

      - name: Prepare Docker context
        run: |
          mkdir -p docker-context/bin/${{ matrix.arch_dir }}
          cp downloaded-artifacts/${{ matrix.binary_asset }} docker-context/bin/${{ matrix.arch_dir }}/ferrum-edge
          cp downloaded-artifacts/${{ matrix.cni_asset }} docker-context/bin/${{ matrix.arch_dir }}/ferrum-cni
          cp Dockerfile.release docker-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push per-platform digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker-context
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=ferrumedge/ferrum-edge,ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-digest-${{ matrix.arch_dir }}
          path: /tmp/digests/*
          if-no-files-found: error

  docker-manifest:
    name: Docker Manifest
    needs: docker
    if: always() && needs.docker.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest (Docker Hub)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ferrumedge/ferrum-edge:latest \
            -t ferrumedge/ferrum-edge:main-${{ github.sha }} \
            $(printf 'ferrumedge/ferrum-edge@sha256:%s ' *)

      - name: Create and push multi-arch manifest (GHCR)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:latest \
            -t ghcr.io/${{ github.repository }}:main-${{ github.sha }} \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
