name: Dependency Security Lockfiles

# Optional, read-only producer for #5912. It never commits or publishes code.
# New workflow admission remains subject to the trusted-base security policy.
on:
  pull_request:
    paths:
      - Cargo.toml
      - fuzz/Cargo.toml
      - tests/performance/mesh/Cargo.toml
      - vendor/**
      - docs/upstream-hyper-patches/**
      - docs/upstream-reqwest-patches/**
      - .github/scripts/verify_hyper_patch_stack.py
      - scripts/verify_dependency_security_chain.py
      - .github/workflows/dependency-security-lockfiles.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve security lockfiles (optional)
    if: >-
      github.repository == 'ferrum-edge/ferrum-edge' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/gcp-opentelemetry-security-chain') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/fix/gcp-opentelemetry-security-chain'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Reconstruct the published vendor sources before Cargo
        run: |
          mkdir -p security-lockfiles/evidence
          curl --fail --silent --show-error --location \
            https://static.crates.io/crates/hyper/hyper-1.10.0.crate \
            --output security-lockfiles/evidence/hyper-1.10.0.crate
          python3 .github/scripts/verify_hyper_patch_stack.py \
            --archive security-lockfiles/evidence/hyper-1.10.0.crate \
            --evidence security-lockfiles/evidence/hyper
          curl --fail --silent --show-error --location \
            https://static.crates.io/crates/reqwest/reqwest-0.13.4.crate \
            --output security-lockfiles/evidence/reqwest-0.13.4.crate
          echo '219c5811de6525e5416c7d5d53bb656d3afdbc6c5af816e0802bcfa42dbdc1c3  security-lockfiles/evidence/reqwest-0.13.4.crate' | sha256sum --check
          tar -xzf security-lockfiles/evidence/reqwest-0.13.4.crate \
            -C security-lockfiles/evidence
          git apply --directory=security-lockfiles/evidence/reqwest-0.13.4 \
            docs/upstream-reqwest-patches/reqwest-ferrum.patch
          diff -r security-lockfiles/evidence/reqwest-0.13.4/src \
            vendor/reqwest-0.13.4-ferrum-patched/src
          cmp security-lockfiles/evidence/reqwest-0.13.4/Cargo.toml \
            vendor/reqwest-0.13.4-ferrum-patched/Cargo.toml
          cmp security-lockfiles/evidence/reqwest-0.13.4/LICENSE-MIT \
            vendor/reqwest-0.13.4-ferrum-patched/LICENSE-MIT
          cmp security-lockfiles/evidence/reqwest-0.13.4/LICENSE-APACHE \
            vendor/reqwest-0.13.4-ferrum-patched/LICENSE-APACHE
          cmp security-lockfiles/evidence/reqwest-0.13.4/README.md \
            vendor/reqwest-0.13.4-ferrum-patched/README.md
      - name: Resolve the real root graph with targeted Cargo updates
        run: |
          cargo update -p hyper -p reqwest -p google-cloud-secretmanager-v1 \
            -p google-cloud-auth -p google-cloud-gax-internal \
            -p google-cloud-gax -p google-cloud-wkt -p aws-smithy-json
          # Keep the AWS runtime on its existing 1.91.1 compiler floor.
          cargo update -p aws-smithy-schema --precise 0.1.0
          cargo update -p aws-smithy-runtime-api --precise 1.12.3
          cargo update -p aws-smithy-types --precise 1.4.9
          cargo update -p xxhash-rust --precise 0.8.16
          cargo metadata --locked --format-version 1 --features cloud-secrets \
            > security-lockfiles/evidence/root-metadata.json
      - name: Resolve the production-dependent standalone graphs
        run: |
          cargo update --manifest-path tests/performance/mesh/Cargo.toml \
            -p hyper -p reqwest
          cargo update --manifest-path tests/performance/mesh/Cargo.toml \
            -p xxhash-rust --precise 0.8.16
          cargo metadata --manifest-path tests/performance/mesh/Cargo.toml \
            --locked --format-version 1 > security-lockfiles/evidence/mesh-metadata.json
          cargo update --manifest-path fuzz/Cargo.toml -p hyper -p reqwest
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 \
            > security-lockfiles/evidence/fuzz-metadata.json
      - name: Verify security floors, path uniqueness and crypto profiles
        run: |
          python3 scripts/verify_dependency_security_chain.py
          python3 .github/scripts/check_fips_feature_policy.py --manifest-check
          cargo tree --locked -e normal,build --prefix none -f '{p}|{f}' \
            --features secrets-gcp,secrets-aws > security-lockfiles/evidence/ring-tree.txt
          python3 .github/scripts/check_fips_feature_policy.py \
            --tree security-lockfiles/evidence/ring-tree.txt --profile crypto-ring
          cargo tree --locked -e normal,build --prefix none -f '{p}|{f}' \
            --no-default-features --features fips \
            > security-lockfiles/evidence/fips-tree.txt
          python3 .github/scripts/check_fips_feature_policy.py \
            --tree security-lockfiles/evidence/fips-tree.txt --profile fips
      - name: Stage immutable lockfile evidence
        run: |
          mkdir -p security-lockfiles/fuzz security-lockfiles/tests/performance/mesh
          cp Cargo.lock security-lockfiles/Cargo.lock
          cp fuzz/Cargo.lock security-lockfiles/fuzz/Cargo.lock
          cp tests/performance/mesh/Cargo.lock security-lockfiles/tests/performance/mesh/Cargo.lock
          git rev-parse HEAD > security-lockfiles/evidence/source-sha.txt
          rustc --version > security-lockfiles/evidence/rustc-version.txt
          cargo --version > security-lockfiles/evidence/cargo-version.txt
          git diff -- Cargo.lock fuzz/Cargo.lock tests/performance/mesh/Cargo.lock \
            > security-lockfiles/evidence/lockfiles.diff
          sha256sum security-lockfiles/Cargo.lock security-lockfiles/fuzz/Cargo.lock \
            security-lockfiles/tests/performance/mesh/Cargo.lock \
            > security-lockfiles/evidence/lockfiles.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-security-lockfiles-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: security-lockfiles/
          if-no-files-found: error
          retention-days: 7
