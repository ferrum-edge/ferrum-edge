# Temporary #5575 flake observation. No production graph or frozen job edits.
#
# `backend_accepts_then_rst_returns_502__*` never fails on macOS (6000 local
# executions) and — as this lane's first run established — does NOT fail when
# the nine RST cells are repeated on Linux in isolation either (2160 hosted
# cell executions, zero failures). Both real occurrences happened inside the
# 500+ test `protocols` functional shard, so the surrounding concurrent load
# is part of the trigger. This lane therefore repeats that WHOLE shard, using
# its exact filter list from ci.yml, and keeps the output of the repetition
# that first fails an RST cell. Unrelated failures in a shard that size are
# counted separately so they cannot masquerade as a reproduction.
#
# Delete this workflow once #5575 has a root cause.
name: RST Flake Observation

on:
  pull_request:
    paths:
      - tests/functional/scripted_backend_matrix_tests.rs
      - tests/scaffolding/matrix.rs
      - tests/scaffolding/backends/tcp.rs
      - .github/workflows/rst-flake-observation.yml
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Repetitions of the full protocols shard per lane shard"
        type: string
        required: true
        default: "14"
      test_threads:
        description: "nextest test-threads per repetition (contention knob)"
        type: string
        required: true
        default: "4"

permissions:
  contents: read

jobs:
  observe:
    name: RST cells shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Shared `ci-debug` rust-cache lane: every member must compile with
      # identical profile settings so restored dependency artifacts stay
      # fingerprint-compatible.
      CARGO_BUILD_JOBS: "3"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-debug"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-nextest

      - name: Build functional tests
        run: cargo test --no-run --test functional_tests

      - name: Build gateway binary
        # The protocols shard's functional tests launch this binary.
        run: cargo build --bin ferrum-edge

      - name: Repeat the protocols shard
        id: repeat
        env:
          REPETITIONS: ${{ github.event.inputs.repetitions || '14' }}
          TEST_THREADS: ${{ github.event.inputs.test_threads || '4' }}
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/rst-evidence"
          mkdir -p "$evidence"
          rustc --version --verbose > "$evidence/rustc.txt"

          # The exact `protocols` shard filter list from ci.yml. Running the
          # nine RST cells ALONE does not reproduce #5575 (2160 hosted cell
          # executions, zero failures), while both real occurrences happened
          # inside this 500+ test shard -- so the surrounding concurrent load
          # is part of the trigger and has to be reproduced too.
          mapfile -t raw_filters <<'FILTERS'
            functional_cors_protocol_test
            functional_grpc_message_metrics_test
            functional_grpc_test
            functional_h3_soap_utf16_test
            functional_http3_connect_udp_test
            functional_key_auth_query_test
            functional_max_forwards_test
            functional_request_mirror_admission_test
            functional_request_mirror_query_parity_test
            functional_request_transformer_query_test
            functional_ai_stream_router_boundary_test
            functional_openapi_client_contract_test
            functional_load_testing_replay_test
            functional_passthrough_test
            functional_sse_test
            functional_mcp_aggregate_sse_test
            functional_stream_listener_failure_test
            functional_tcp_proxy_test
            functional_tcp_splice_backend_timeout_test
            functional_udp_proxy_test
            functional_unix_backend_test
            functional_websocket_test
            scripted_backend_h2_tests
            scripted_backend_h3_tests
            scripted_backend_matrix_tests
            scripted_backend_network_sim_tests
            scripted_backend_streaming_latency_tests
            scripted_backend_tests
            scripted_backend_udp_tests
            functional_query_param_limits_test
            functional_streaming_request_body_limits_test
            functional_streaming_response_body_limits_test
            functional_tcp_idle_timeout_env_test
            functional_websocket_frame_limit_test
            functional_websocket_connection_limit_test
            functional_header_read_timeout_test
            functional_injector_serving_test
            functional_response_body_limits_test
            functional_request_body_limits_test
            functional_request_buffer_budget_test
            functional_header_limits_test
            functional_early_data_test
            functional_ws_origin_test
            functional_allowed_methods_test
            functional_allowed_methods_logging_test
            functional_transaction_debugger_body_capture_test
            functional_forwarded_via_headers_test
            functional_streaming_latency_tracking_test
            functional_streaming_outcome_accounting_test
            functional_chunked_request_size_limits_test
            functional_chunked_response_size_limits_test
            functional_body_size_limits_test
            functional_url_query_limits_test
            functional_header_size_limits_test
            functional_protocol_h3_request_body_test
            functional_protocol_h3_body_limit_config_test
            functional_protocol_h2_body_limit_config_test
            functional_protocol_body_limit_config_test
            functional_early_upload_deadline_test
            functional_h1_h2_auth_lifetime_test
            functional_h3_auth_lifetime_test
            functional_h3_authority_validation_test
            functional_h3_local_policy_test
            functional_subset_http_policy_test
            functional_destination_active_requests_test
            functional_destination_active_requests_grpc_test
            functional_destination_active_requests_h3_test
            functional_h3_grpc_web_test
            functional_h3_grpc_streaming_test
            functional_h3_mtls_early_data_test
            functional_request_termination_h3_test
            functional_policy_path_canonicalization_test
            functional_response_caching_conditional_test
            functional_response_mock_grpc_exclusion_test
            functional_response_mock_semantics_test
            functional_response_protocol_managed_headers_test
            functional_websocket_limits_test
          FILTERS
          # The heredoc body carries the YAML block's indentation; nextest
          # filters are whitespace-free test-path substrings, so strip it.
          filters=()
          for raw in "${raw_filters[@]}"; do
            trimmed="${raw// /}"
            [ -n "$trimmed" ] && filters+=("$trimmed")
          done
          echo "protocols shard filters: ${#filters[@]}"

          captured=0
          unrelated=0
          for i in $(seq 1 "$REPETITIONS"); do
            log="$evidence/run-current.log"
            cargo nextest run \
              --test functional_tests \
              --run-ignored all \
              --no-fail-fast \
              --test-threads "$TEST_THREADS" \
              "${filters[@]}" \
              > "$log" 2>&1 || true

            # Only an RST-cell failure is the signal. Unrelated flakes in a
            # 500-test shard must not masquerade as a reproduction.
            if grep -qE "(FAIL|TIMEOUT).*backend_accepts_then_rst_returns_502" "$log"; then
              captured=$((captured + 1))
              cp "$log" "$evidence/CAPTURED-shard${{ matrix.shard }}-rep${i}.log"
              echo "::warning::Reproduced #5575 on shard ${{ matrix.shard }} repetition $i"
              break
            fi
            if grep -qE "^\s+(FAIL|TIMEOUT)" "$log"; then
              unrelated=$((unrelated + 1))
              if [ "$unrelated" -le 2 ]; then
                cp "$log" "$evidence/unrelated-shard${{ matrix.shard }}-rep${i}.log"
              fi
            fi
            echo "shard ${{ matrix.shard }}: repetition $i done (captured=$captured unrelated=$unrelated)"
          done

          echo "shard ${{ matrix.shard }}: finished captured=$captured unrelated=$unrelated"
          echo "captured=$captured" >> "$GITHUB_OUTPUT"
          echo "unrelated=$unrelated" >> "$GITHUB_OUTPUT"
          # Observation only: never turn a known flake into a red check.
          exit 0

      - name: Summarize
        if: always()
        run: |
          {
            echo "### RST flake observation — shard ${{ matrix.shard }}"
            echo
            echo "- repetitions requested: ${{ github.event.inputs.repetitions || '14' }}"
            echo "- test-threads: ${{ github.event.inputs.test_threads || '4' }}"
            echo "- RST captures: ${{ steps.repeat.outputs.captured }}"
            echo "- unrelated shard failures: ${{ steps.repeat.outputs.unrelated }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: rst-flake-evidence-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/rst-evidence
          if-no-files-found: warn
          retention-days: 14
