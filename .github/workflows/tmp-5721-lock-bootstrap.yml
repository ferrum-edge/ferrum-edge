# TEMPORARY (issue #5721): regenerate the root Cargo.lock on a hosted runner
# after the manifest changes (mongodb >= 3.7, aws-sdk-secretsmanager without its
# legacy `rustls` feature, rustls-pemfile dropped), verify the retired advisory
# crates are gone, and run the dependency gate. Removed before the PR is opened.
name: TEMP 5721 Lock Bootstrap

on:
  push:
    branches:
      - fix/issue-5721-deny-exceptions-reeval

permissions:
  contents: read

jobs:
  bootstrap:
    name: TEMP 5721 lock bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Install cargo-deny
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-deny@0.19.9

      - name: Update lockfile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cp Cargo.lock "$RUNNER_TEMP/out/Cargo.lock.before"
          cargo update -p mongodb --precise 3.7.0 2>&1 | tee "$RUNNER_TEMP/out/update.log"
          cp Cargo.lock "$RUNNER_TEMP/out/Cargo.lock"
          diff -u "$RUNNER_TEMP/out/Cargo.lock.before" Cargo.lock > "$RUNNER_TEMP/out/Cargo.lock.diff" || true
          git diff --stat

      - name: Verify retired crates are gone
        if: always()
        run: |
          set +e
          for spec in hickory-proto@0.25.2 hickory-resolver@0.25.2 rustls@0.21.12 \
            rustls-webpki@0.101.7 h2@0.3.27 hyper@0.14.32 hyper-rustls@0.24.2 \
            tokio-rustls@0.24.1 rustls-pemfile; do
            echo "=== ${spec}" | tee -a "$RUNNER_TEMP/out/tree.log"
            cargo tree --locked --all-features --target all -i "$spec" \
              2>&1 | tee -a "$RUNNER_TEMP/out/tree.log"
          done
          for spec in rsa paste mongodb hickory-proto; do
            echo "=== ${spec}" | tee -a "$RUNNER_TEMP/out/tree.log"
            cargo tree --locked --all-features --target all -i "$spec" -e normal,build \
              2>&1 | tee -a "$RUNNER_TEMP/out/tree.log"
          done
          grep -c '^\[\[package\]\]' Cargo.lock | tee -a "$RUNNER_TEMP/out/tree.log"

      - name: cargo-deny (advisories, bans, sources, licenses)
        if: always()
        run: |
          set -o pipefail
          cargo deny check advisories bans sources licenses 2>&1 | tee "$RUNNER_TEMP/out/deny.log"

      - name: Advisory expiry check
        if: always()
        run: bash scripts/check_advisory_expiry.sh 2>&1 | tee "$RUNNER_TEMP/out/expiry.log"

      - name: rustfmt patch
        if: always()
        run: |
          set +e
          cargo fmt --all -- --check > "$RUNNER_TEMP/out/fmt-check.log" 2>&1
          echo "fmt-check exit=$?" | tee -a "$RUNNER_TEMP/out/fmt-check.log"
          cargo fmt --all
          git diff -- '*.rs' > "$RUNNER_TEMP/out/fmt.patch"
          git diff --stat -- '*.rs'

      - name: Upload bootstrap output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lock-bootstrap-5721
          path: ${{ runner.temp }}/out/
          retention-days: 3

  clippy-probe:
    name: TEMP 5721 clippy probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Update lockfile before the locked fetch
        run: |
          set -euo pipefail
          cargo update -p mongodb --precise 3.7.0

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-lint"
          save: "false"
          components: clippy

      - name: Run clippy (default + secrets-aws + acme)
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          cargo clippy \
            --config profile.test.debug=0 \
            --config profile.dev.debug=0 \
            --features secrets-aws,acme \
            --all-targets -- -D warnings
