name: Connect BoringCache

# Run once after merge, then approve the verification URL in the enrollment log.
on:
  workflow_dispatch:

concurrency:
  group: boringcache-connect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  connect:
    name: Enroll BoringCache Machine connection
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ferrum-edge/ferrum-edge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install pinned BoringCache CLI
        shell: bash
        run: |
          set -euo pipefail
          # Keep the release and digest aligned with the v1.32.0 CI pilot.
          binary="$RUNNER_TEMP/boringcache"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$binary" \
            https://github.com/boringcache/cli/releases/download/v1.32.0/boringcache-linux-amd64
          printf '%s  %s\n' \
            'ad6b82b1f4632702dce4e1e9a5e4398bf562026f37f1f3cac2958bed6285bf94' \
            "$binary" | sha256sum --check --strict
          chmod 0755 "$binary"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Enroll GitHub Actions Machine connection
        shell: bash
        run: |
          set -euo pipefail
          echo 'Open the verification URL below while this job waits for approval.'
          echo 'Approve ferrum-edge/ferrum-edge and select Workspace jeremy-j/ferrum-edge.'
          boringcache ci connect --oidc-provider github-actions

      - name: Summarize enrollment
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          ## BoringCache enrollment completed

          Review the approved repository and Workspace in BoringCache's
          **Machine connections**. The intended binding is GitHub repository
          `ferrum-edge/ferrum-edge` to Workspace `jeremy-j/ferrum-edge`.

          This connects GitHub Actions OIDC to BoringCache without a reusable
          BoringCache repository secret. The CI cache pilot is configured separately.
          MARKDOWN
