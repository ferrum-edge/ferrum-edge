# TEMPORARY (issue #5721): minimally refresh the standalone Cargo lockfiles after
# the root manifest change and the rustls-pemfile removal, run the standalone
# advisory scan with the shared deny.toml, and emit rustfmt output for every
# workspace. Removed before the PR is opened.
name: TEMP 5721 Standalone Bootstrap

on:
  push:
    branches:
      - fix/issue-5721-deny-exceptions-reeval

permissions:
  contents: read

jobs:
  bootstrap:
    name: TEMP 5721 standalone bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Install cargo-deny
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-deny@0.19.9

      - name: Inventory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python3 .github/scripts/standalone_cargo_manifests.py > "$RUNNER_TEMP/out/manifests.txt"
          cat "$RUNNER_TEMP/out/manifests.txt"

      - name: Root lockfile is current
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Refresh standalone lockfiles
        run: |
          set -euo pipefail
          mapfile -t manifests < "$RUNNER_TEMP/out/manifests.txt"
          for manifest in "${manifests[@]}"; do
            echo "=== ${manifest}" | tee -a "$RUNNER_TEMP/out/refresh.log"
            cargo metadata --manifest-path "$manifest" --format-version 1 \
              2>>"$RUNNER_TEMP/out/refresh.log" > /dev/null
            cargo metadata --manifest-path "$manifest" --locked --format-version 1 > /dev/null
          done
          git diff --stat

      - name: Standalone advisory scan
        if: always()
        run: |
          set +e
          set -uo pipefail
          status=0
          mapfile -t manifests < "$RUNNER_TEMP/out/manifests.txt"
          for manifest in "${manifests[@]}"; do
            echo "=== ${manifest}" | tee -a "$RUNNER_TEMP/out/deny.log"
            cargo deny --manifest-path "$manifest" \
              check --allow advisory-not-detected --config deny.toml advisories \
              2>&1 | tee -a "$RUNNER_TEMP/out/deny.log"
            rc="${PIPESTATUS[0]}"
            echo "exit=${rc}" | tee -a "$RUNNER_TEMP/out/deny.log"
            [ "$rc" -eq 0 ] || status=1
          done
          echo "=== root" | tee -a "$RUNNER_TEMP/out/deny.log"
          cargo deny check advisories bans sources licenses 2>&1 | tee -a "$RUNNER_TEMP/out/deny.log"
          rc="${PIPESTATUS[0]}"
          echo "exit=${rc}" | tee -a "$RUNNER_TEMP/out/deny.log"
          [ "$rc" -eq 0 ] || status=1
          exit "$status"

      - name: rustfmt patch
        if: always()
        run: |
          set +e
          cargo fmt --all
          mapfile -t manifests < "$RUNNER_TEMP/out/manifests.txt"
          for manifest in "${manifests[@]}"; do
            cargo fmt --manifest-path "$manifest" --all
          done
          git diff -- '*.rs' > "$RUNNER_TEMP/out/fmt.patch"
          git diff --stat -- '*.rs'

      - name: Collect lockfiles
        if: always()
        run: |
          set -euo pipefail
          git diff --binary -- '*Cargo.lock' > "$RUNNER_TEMP/out/locks.patch"
          git diff --stat -- '*Cargo.lock'

      - name: Upload bootstrap output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: standalone-bootstrap-5721
          path: ${{ runner.temp }}/out/
          retention-days: 3
