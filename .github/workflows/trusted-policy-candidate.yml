name: Trusted Policy Candidate

# A pull request cannot replace the trusted policy used by CI Policy or the
# protected-policy check. This isolated, read-only lane provides the missing
# complementary evidence: candidate policy source is compiled and its own
# static self-tests execute without producing any output consumed by another
# job.
on:
  pull_request:
    paths:
      - .github/scripts/**
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - .github/scripts/**
      - .github/workflows/**

permissions:
  contents: read

# A newer push to the same pull request cancels the superseded run. Every
# other event (push to main, dispatch, schedule) gets a unique group so it
# always runs to completion and never displaces another dispatch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate-self-test:
    name: Candidate policy self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # Catch contract/extraction drift before waiting for the application
      # matrix. Tests still repeats these checks as its required final gate.
      - name: Validate candidate CI contracts
        run: python3 .github/scripts/verify_required_ci.py

      - name: Exercise the candidate policy
        run: |
          set -euo pipefail
          policy=.github/scripts/verify_cross_build_policy.py
          python3 -I "$policy" --self-test
