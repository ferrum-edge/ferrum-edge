name: Trusted Policy Candidate

# A pull request cannot replace the trusted policy used by CI Policy or the
# protected-policy check. This isolated, read-only lane provides the missing
# complementary evidence: candidate policy source is compiled and its own
# static self-tests execute without producing any output consumed by another
# job.
on:
  pull_request:
    paths:
      - .github/scripts/**
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - .github/scripts/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  candidate-self-test:
    name: Candidate policy self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Explain release study policy surfaces
        run: |
          python3 - <<'PYCODE'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts")
          from verify_cross_build_policy import generic_workflow_cross_surfaces
          source = ".github/workflows/perf-benchmark.yml"
          reasons = {}
          surfaces, errors = generic_workflow_cross_surfaces(
              Path(source).read_text(), source,
              include_opaque_shell_executable=True, reasons=reasons,
          )
          print(json.dumps({"surfaces": surfaces, "reasons": reasons, "errors": errors}, indent=2))
          PYCODE

      # Catch contract/extraction drift before waiting for the application
      # matrix. Tests still repeats these checks as its required final gate.
      - name: Validate candidate CI contracts
        run: python3 .github/scripts/verify_required_ci.py

      - name: Exercise the candidate policy
        run: |
          set -euo pipefail
          policy=.github/scripts/verify_cross_build_policy.py
          python3 -I "$policy" --self-test
