name: Trusted Policy Candidate

# A pull request cannot replace the trusted policy used by CI Policy or the
# protected-policy check. This isolated, read-only lane provides the missing
# complementary evidence: candidate policy source is compiled and its own
# static self-tests execute without producing any output consumed by another
# job.
on:
  pull_request:
    paths:
      - .github/scripts/**
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - .github/scripts/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  candidate-self-test:
    name: Candidate policy self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Diagnose checked-in mesh benchmark lockfile
        env:
          RUSTC_WRAPPER: ""
          CARGO_BUILD_RUSTC_WRAPPER: ""
        run: |
          cargo metadata --manifest-path tests/performance/mesh/Cargo.toml --format-version 1 > /dev/null
          git diff -- tests/performance/mesh/Cargo.lock

      - name: Preserve resolved mesh benchmark lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mesh-lockfile-diagnostic
          path: tests/performance/mesh/Cargo.lock
          retention-days: 7

      # Catch contract/extraction drift before waiting for the application
      # matrix. Tests still repeats these checks as its required final gate.
      - name: Validate candidate CI contracts
        run: python3 .github/scripts/verify_required_ci.py

      - name: Exercise the candidate policy
        run: |
          set -euo pipefail
          policy=.github/scripts/verify_cross_build_policy.py
          python3 -I "$policy" --self-test
