name: Performance Regression

# Out-of-band performance regression check. It runs once a day against the
# tip of `main` (plus manual dispatch) instead of on every pull request and
# every merge, so the ci-release build, the self-relative overhead benchmark,
# and the Criterion microbenchmarks never sit on the PR or main critical path.
# A regression turns this scheduled run red; the daily cadence bounds how far
# `main` can drift before it is noticed. `performance-regression` remains the
# job id so the static contract verifiers keep binding to it by name.
on:
  schedule:
    # 06:17 UTC daily; the offset avoids the top-of-hour GitHub scheduler surge.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-regression
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  performance-regression:
    name: Performance Regression Check
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Lightweight protocol-perf contract gates (no benchmarks): check evaluator,
      # workflow and harness integrity before any benchmark builds. The scheduled
      # multi-protocol bench in protocol-perf-regression.yml stays non-required.
      - name: Verify protocol-perf contracts (static)
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_protocol_perf_regression_workflow.py --self-test
          python3 .github/scripts/verify_protocol_perf_regression_workflow.py
          python3 tests/performance/multi_protocol/evaluate_protocol_perf_budgets.py --self-test
          python3 -m py_compile tests/performance/multi_protocol/run_protocol_regression_scenarios.py

      # Lightweight mesh-baseline workflow contracts (no collection): check the
      # acceptance/runner-pin/interval-evidence wiring before any benchmark
      # builds.
      - name: Verify mesh performance baselines workflow contract
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_mesh_performance_baselines_workflow.py --self-test
          python3 .github/scripts/verify_mesh_performance_baselines_workflow.py

      - name: Self-test RR and WRR selection benchmark verifiers
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_rr_selection_benchmark.py --self-test
          python3 .github/scripts/verify_wrr_selection_benchmark.py --self-test

      # Pure gate-logic self-tests (no sockets, no benchmarks): a timed run with
      # no successful responses must fail the overhead check, and semantic-cache
      # Criterion samples are refused without verified fixture evidence.
      - name: Self-test overhead and semantic-cache benchmark gates
        run: |
          set -euo pipefail
          python3 tests/performance/ci_overhead_bench.py --self-test
          python3 .github/scripts/verify_ai_semantic_cache_cleanup_benchmark.py --self-test

      - uses: ./.github/actions/setup-rust-ci
        # setup-sccache deliberately installs the verified wrapper under a fresh
        # runner-private path. Hide that runner-unique identity only from the
        # nested rust-cache key calculation; setup-sccache still publishes the
        # verified path through GITHUB_ENV for the benchmark steps below.
        env:
          RUSTC_WRAPPER: ""
          CARGO_BUILD_RUSTC_WRAPPER: ""
        with:
          shared-key: "ci-perf"
          workspaces: |
            . -> target
            tests/performance/mesh -> target

      - name: Stabilize performance compiler wrapper identity
        run: |
          set -euo pipefail
          source="${FERRUM_SCCACHE_BIN:-}"
          if [ -z "$source" ] || [ ! -x "$source" ]; then
            printf '%s\n' 'RUSTC_WRAPPER=' 'CARGO_BUILD_RUSTC_WRAPPER=' >> "$GITHUB_ENV"
            echo "sccache is unavailable; performance builds will run uncached"
            exit 0
          fi

          stable_root="${RUNNER_TEMP}/ferrum-performance-sccache"
          stable_wrapper="${stable_root}/bin/sccache"
          rm -rf "$stable_root"
          mkdir -p "${stable_root}/bin"
          cp -- "$source" "$stable_wrapper"
          chmod 0755 "$stable_wrapper"
          printf '%s\n' \
            "RUSTC_WRAPPER=${stable_wrapper}" \
            "CARGO_BUILD_RUSTC_WRAPPER=${stable_wrapper}" >> "$GITHUB_ENV"
          echo "Performance compiler wrapper activated at a deterministic runner-local path"

      - name: Run IP restriction worst-case microbenchmark
        run: |
          cargo bench --manifest-path tests/performance/mesh/Cargo.toml --bench ip_restriction
          python3 .github/scripts/verify_ip_restriction_benchmark.py \
            --criterion-root tests/performance/mesh/target/criterion \
            --max-scaling-ratio 8 \
            --max-ns-per-instance 10000

      - name: Run WRR selection contention microbenchmark
        run: |
          cargo bench --manifest-path tests/performance/mesh/Cargo.toml --bench wrr_selection
          python3 .github/scripts/verify_wrr_selection_benchmark.py --self-test
          python3 .github/scripts/verify_wrr_selection_benchmark.py \
            --criterion-root tests/performance/mesh/target/criterion \
            --min-parallel-speedup 1.10

      - name: Run RoundRobin selection contention microbenchmark
        run: |
          set -euo pipefail
          # Scheduled and manual runs compare against the preceding commit.
          RR_BASE_SHA="$(git rev-parse HEAD^)"
          export RR_BASE_SHA
          python3 .github/scripts/verify_rr_selection_benchmark.py --self-test
          bash .github/scripts/run_rr_selection_comparison.sh

      - name: Run AI semantic-cache cleanup microbenchmark
        run: |
          set -euo pipefail
          # The bench writes this only after verifying, outside the timed loop,
          # that every entry was seeded and retained through the production
          # final-body hooks; the evaluator refuses samples without it.
          export AI_SEMANTIC_CACHE_FIXTURE_EVIDENCE="${GITHUB_WORKSPACE}/tests/performance/ci_results/ai_semantic_cache_cleanup_fixture.json"
          cargo bench --manifest-path tests/performance/mesh/Cargo.toml --bench ai_semantic_cache_cleanup
          python3 .github/scripts/verify_ai_semantic_cache_cleanup_benchmark.py \
            --criterion-root tests/performance/mesh/target/criterion \
            --max-scaling-ratio 3 \
            --fixture-evidence "${AI_SEMANTIC_CACHE_FIXTURE_EVIDENCE}" \
            --output tests/performance/ci_results/ai_semantic_cache_cleanup.json

      - name: Build release binaries
        run: |
          cargo build --profile ci-release --bin ferrum-edge
          cd tests/performance && cargo build --release --bin backend_server

      - name: Start backend server
        run: |
          tests/performance/target/release/backend_server > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "${GITHUB_ENV}"
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:3001/health > /dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Backend failed to start"
              cat /tmp/backend.log
              exit 1
            fi
            sleep 1
          done

      - name: Start gateway
        run: |
          FERRUM_MODE=file \
          FERRUM_FILE_CONFIG_PATH="$(pwd)/tests/performance/perf_config.yaml" \
          FERRUM_LOG_LEVEL=error \
          FERRUM_ADD_VIA_HEADER=false \
          FERRUM_POOL_MAX_IDLE_PER_HOST=200 \
          FERRUM_POOL_IDLE_TIMEOUT_SECONDS=120 \
          FERRUM_POOL_ENABLE_HTTP_KEEP_ALIVE=true \
          FERRUM_POOL_ENABLE_HTTP2=false \
          FERRUM_POOL_WARMUP_ENABLED=true \
          ./target/ci-release/ferrum-edge run > /tmp/gateway.log 2>&1 &
          echo "GATEWAY_PID=$!" >> "${GITHUB_ENV}"
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "Gateway ready"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Gateway failed to start"
              cat /tmp/gateway.log
              exit 1
            fi
            sleep 1
          done

      - name: Run self-relative performance test
        timeout-minutes: 5
        run: |
          mkdir -p tests/performance/ci_results
          python3 tests/performance/ci_overhead_bench.py \
            --gateway-url http://127.0.0.1:8000/api/users \
            --backend-url http://127.0.0.1:3001/api/users \
            --gateway-health-url http://127.0.0.1:8000/health \
            --concurrency 50 \
            --duration 5 \
            --iterations 3 \
            --warmup 2 \
            --overhead-threshold 50 \
            --output tests/performance/ci_results/overhead_results.json

      - name: Stop services
        if: always()
        run: |
          kill "${BACKEND_PID:-}" 2>/dev/null || true
          kill "${GATEWAY_PID:-}" 2>/dev/null || true

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: performance-results
          path: |
            tests/performance/ci_results/
            tests/performance/mesh/target/criterion/ip_restriction_lookup/
            tests/performance/mesh/target/criterion/wrr_selection/
            tests/performance/mesh/target/criterion/rr_selection/
            tests/performance/mesh/target/criterion/ai_semantic_cache_cleanup_hot_path/
          retention-days: 30

      - name: Post performance summary
        if: always()
        run: |
          {
            echo "## Performance Regression Check"
            echo ""
            echo "IP restriction lookup guard executed: 10,000/100-rule mean ratio <= 8x and 10,000-rule mean <= 10 microseconds per plugin instance."
            echo ""
            echo "WRR selection contention guard executed: mandatory 4-thread/1-thread throughput speedup >= 1.10x on 32/129-target fixtures; 4-target 5:1:1:1 fixture remains measured (informational parallel speedup under Arc strong-count hotspot; 4/32 1-thread serial-wall ratio ceiling). A parallel-floor miss is a hard failure only when an independent-process CPU control at the same thread count still clears 1.10x (median of 5); if the control also misses, the floor is advisory because the runner is oversubscribed."
            echo ""
            echo "RoundRobin selection guard compared the same 2-target workload at 1 and 8 threads against an immutable baseline, with three interleaved runs per revision on one runner. Missing evidence fails; a consistent regression beyond all measured 95% intervals plus Criterion's 1% noise threshold fails. See rr-comparison/comparison.json and provenance.json."
            echo ""
            echo "AI semantic-cache cleanup guard executed: p99 of Criterion sample means (not per-request p99) for an exact local miss through the final-request-body hook at 10,000 and 100,000 entries, each seeded and replayed as a retained hit before timing; 100,000/10,000 ratio <= 3x."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ -f tests/performance/ci_results/overhead_results.json ]; then
            {
              echo '```json'
              cat tests/performance/ci_results/overhead_results.json
              echo ''
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Performance tests did not produce results." >> "${GITHUB_STEP_SUMMARY}"
          fi
