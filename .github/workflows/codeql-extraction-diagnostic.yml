name: CodeQL Rust Extraction Diagnostic

# Opt-in database creation only. Keep default CodeQL scanning enabled: this
# workflow never evaluates queries or uploads SARIF, and is not a merge gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-rust-extraction-diagnostic
  cancel-in-progress: false

jobs:
  extract:
    # Standard hosted compute is free while this repository is public.
    if: github.repository == 'ferrum-edge/ferrum-edge' && github.event.repository.private == false
    name: Extract Rust (${{ matrix.profile }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Match the release's cloud-secret feature set with each valid crypto
          # provider. FIPS intentionally omits `default` (and thus crypto-ring).
          - profile: ordinary
            features: default,cloud-secrets
          - profile: fips
            features: fips,cloud-secrets
    env:
      CODEQL_VERSION: '2.27.3'
      CODEQL_SHA256: 845075a2fa2fdf72629adc6cbde6264691b698d1f294bd27f10c6b579cd750a4
      DIAGNOSTIC_PROFILE: ${{ matrix.profile }}
      DIAGNOSTIC_FEATURES: ${{ matrix.features }}
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set temporary diagnostic paths
        run: printf 'DIAGNOSTIC_DIR=%s/codeql-extraction-diagnostic\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install build-script prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake golang-go libcurl4-openssl-dev \
            mold ninja-build perl pkg-config protobuf-compiler
          rustup component add rust-src
          rustc --version
          cargo --version
          protoc --version

      - name: Install the baseline CodeQL CLI (checksum verified)
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTIC_DIR/tools"
          archive="$DIAGNOSTIC_DIR/codeql-linux64.zip"
          curl --fail --location --retry 3 \
            "https://github.com/github/codeql-cli-binaries/releases/download/v${CODEQL_VERSION}/codeql-linux64.zip" \
            --output "$archive"
          printf '%s  %s\n' "$CODEQL_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$DIAGNOSTIC_DIR/tools"
          rm "$archive"
          "$DIAGNOSTIC_DIR/tools/codeql/codeql" version

      - name: Create a Rust database without running queries
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; printf "%s\n" "$status" > "$DIAGNOSTIC_DIR/status"; printf "%s\n" "$SECONDS" > "$DIAGNOSTIC_DIR/seconds"' EXIT
          IFS=, read -r -a features <<< "$DIAGNOSTIC_FEATURES"
          options=()
          for feature in "${features[@]}"; do
            options+=(--extractor-option "rust.cargo_features=$feature")
          done
          "$DIAGNOSTIC_DIR/tools/codeql/codeql" database create \
            "$DIAGNOSTIC_DIR/database" \
            --language=rust --build-mode=none --threads=2 \
            --source-root="$GITHUB_WORKSPACE" \
            "${options[@]}" 2>&1 | tee "$DIAGNOSTIC_DIR/extraction.log"
          git diff --exit-code

      - name: Record extraction evidence
        if: always() && !cancelled()
        env:
          EXTRACTION_OUTCOME: ${{ steps.extract.outcome }}
        run: |
          set -euo pipefail
          {
            printf '## Rust extraction: %s\n\n' "$DIAGNOSTIC_PROFILE"
            printf -- '- Source commit: %s\n' "$GITHUB_SHA"
            printf -- '- CodeQL CLI: %s\n' "$CODEQL_VERSION"
            printf -- '- Features: %s\n' "$DIAGNOSTIC_FEATURES"
            printf -- '- Extraction step: %s\n' "$EXTRACTION_OUTCOME"
            if test -f "$DIAGNOSTIC_DIR/status"; then
              printf -- '- Exit status: %s\n' "$(cat "$DIAGNOSTIC_DIR/status")"
              printf -- '- Elapsed seconds: %s\n' "$(cat "$DIAGNOSTIC_DIR/seconds")"
            fi
            if test -f "$DIAGNOSTIC_DIR/extraction.log"; then
              warnings=$(awk '/WARN/ {count++} END {print count+0}' "$DIAGNOSTIC_DIR/extraction.log")
              printf -- '- Raw log lines containing WARN: %s\n' "$warnings"
            fi
            printf '\nCounts are diagnostics, not vulnerabilities or a coverage percentage. '
            printf 'No queries or SARIF upload run here; current default scans continue.\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if test -d "$DIAGNOSTIC_DIR/database/working"; then
            echo 'Generated bindings found in the database build workspace (existence only):'
            find "$DIAGNOSTIC_DIR/database/working" -type f \
              \( -name custom_plugin_mods.rs -o -name custom_plugin_registry.rs -o -name _.rs \) \
              -printf '%P\n'
          fi
