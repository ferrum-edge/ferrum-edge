name: Ruleset Canary Probe

# Temporary probe for the org-ruleset canary (ruleset-canary branch only).
# FORGED copy: the PR replaces the trusted gate with an unconditional pass that
# reports a same-named check from GitHub Actions.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ruleset-canary-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  probe:
    name: Ruleset Canary Probe
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Context
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "copy=FORGED"
          echo "workflow_ref=$WORKFLOW_REF"
          echo "workflow_sha=$WORKFLOW_SHA"
          echo "event_name=$EVENT_NAME sha=$SHA ref=$REF head=$HEAD_SHA run=$RUN_ID"
          sleep 90
      - name: Forged pass
        run: |
          echo "forged probe - always passes"
