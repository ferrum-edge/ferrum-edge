# Temporary #5588 dependency observation. No production graph or frozen job edits.
name: H2 Guard Observation

on:
  pull_request:
    paths:
      - tests/performance/multi_protocol/h2_guard/**
      - tests/performance/multi_protocol/h2_guard_observation.py
      - tests/performance/multi_protocol/h2_guard_snapshot.py
      - tests/performance/multi_protocol/h2_diagnostics.py
      - tests/performance/multi_protocol/experiment_arms.py
      - tests/performance/multi_protocol/run_gateway_protocol_bench.sh
      - tests/performance/multi_protocol/tests/test_h2_guard_observation.py
      - .github/workflows/h2-guard-observation.yml
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
  # prepare.py fails closed when a repository file it pins drifts: the
  # src/admin/mod.rs SHA-256 in h2_guard/source.json, the h2 entry in
  # Cargo.lock, the single [patch.crates-io] table in Cargo.toml, and the two
  # Dockerfile cargo build calls. Ordinary source PRs do not run this lane, so
  # re-verify every main push that touches a pinned input; a stale pin turns
  # that push's run red instead of surfacing on a later unrelated PR.
  push:
    branches: [main]
    paths:
      - tests/performance/multi_protocol/h2_guard/**
      - tests/performance/multi_protocol/h2_guard_observation.py
      - tests/performance/multi_protocol/h2_guard_snapshot.py
      - tests/performance/multi_protocol/h2_diagnostics.py
      - tests/performance/multi_protocol/experiment_arms.py
      - tests/performance/multi_protocol/run_gateway_protocol_bench.sh
      - tests/performance/multi_protocol/tests/test_h2_guard_observation.py
      - .github/workflows/h2-guard-observation.yml
      - src/admin/mod.rs
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
  workflow_dispatch:
    inputs:
      run_campaign:
        description: "Run the full diagnostic image and four-pair H2/gRPC campaign after checks"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: h2-guard-observation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Only superseded PR runs are cancelled. Main pushes and manual campaigns
  # run to completion (see docs/ci_cd.md "Main-push concurrency").
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard-checks:
    name: H2 pinned guard regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify archive and patch; create isolated build context
        run: python3 tests/performance/multi_protocol/h2_guard/prepare.py --output "$RUNNER_TEMP/h2-guard"
      - name: Format generated dependency and compile real guard regressions
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/h2-guard/context/vendor/h2-0.4.19-observation"
          upstream="$RUNNER_TEMP/h2-guard/upstream"
          evidence="$RUNNER_TEMP/h2-guard/evidence"
          rustc --version --verbose > "$evidence/rustc.txt"
          cargo --version --verbose > "$evidence/cargo.txt"
          # Formatting is a hosted build transformation; archive the resulting
          # source as well as the reviewed patch/preimage/postimage hashes.
          cargo fmt --manifest-path "$crate/Cargo.toml" --all
          cargo fmt --manifest-path "$crate/Cargo.toml" --all -- --check
          # New Clippy versions report warnings in this immutable dependency.
          # Compare both complete same-toolchain builds; every new/changed
          # diagnostic and every compiler error fails. No lint is suppressed.
          cargo fmt --manifest-path "$upstream/Cargo.toml" --all
          # Upstream cfg(test) denies all warnings. Retain them as warnings in
          # both JSON streams so the comparison can reject every added warning.
          # Compiler errors still fail Cargo; non-Clippy warnings fail lint.py.
          cargo clippy --manifest-path "$upstream/Cargo.toml" --locked --lib --tests --message-format=json -- --cap-lints warn > "$evidence/clippy-upstream.jsonl"
          cargo clippy --manifest-path "$crate/Cargo.toml" --locked --lib --tests --message-format=json -- --cap-lints warn > "$evidence/clippy-observed.jsonl"
          python3 tests/performance/multi_protocol/h2_guard/lint.py "$evidence/clippy-upstream.jsonl" "$evidence/clippy-observed.jsonl" > "$evidence/clippy-comparison.json"
          cargo test --manifest-path "$crate/Cargo.toml" --locked --lib guard_observation -- --nocapture --test-threads=1 2>&1 | tee "$evidence/guard-tests.log"
          # The four competing failures need an untouched process-wide reserve.
          cargo test --manifest-path "$crate/Cargo.toml" --locked --lib guard_observation_concurrent_failure_dumps_reserve_complete_tails -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$evidence/concurrent-failure-tests.log"
          cargo test --manifest-path "$crate/Cargo.toml" --locked --lib data_frame_budget 2>&1 | tee "$evidence/upstream-budget-tests.log"
          H2_GUARD_PRODUCER_CONTRACT="$evidence/producer-contract.txt" \
            cargo test --manifest-path "$crate/Cargo.toml" --locked --lib guard_observation_export_contract -- --nocapture --test-threads=1 \
            2>&1 | tee "$evidence/producer-contract.log"
      - name: Check selected reqwest and native Hyper dependency chains
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libssl-dev libcurl4-openssl-dev
          cargo metadata --locked --format-version 1 --manifest-path "$RUNNER_TEMP/h2-guard/context/Cargo.toml" > "$RUNNER_TEMP/h2-guard/evidence/metadata.json"
          python3 tests/performance/multi_protocol/h2_guard/verify.py graph "$RUNNER_TEMP/h2-guard/evidence/metadata.json" > "$RUNNER_TEMP/h2-guard/evidence/transport-chains.json"
          cargo check --manifest-path "$RUNNER_TEMP/h2-guard/context/Cargo.toml" --locked --lib --features cloud-secrets \
            2>&1 | tee "$RUNNER_TEMP/h2-guard/evidence/generated-context-check.log"
      - name: Check harness parsing and fail-closed preparation
        if: always()
        env:
          H2_GUARD_PRODUCER_CONTRACT: ${{ runner.temp }}/h2-guard/evidence/producer-contract.txt
        run: python3 -m unittest discover --verbose --start-directory tests/performance/multi_protocol/tests --pattern 'test_*.py'
      - name: Retain exact generated source, logs and identities
        if: always()
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/h2-guard/context/vendor/h2-0.4.19-observation"
          if [ -d "$crate" ]; then
            tar --exclude=target -czf "$RUNNER_TEMP/h2-guard/evidence/patched-source.tgz" -C "$crate" .
            sha256sum "$RUNNER_TEMP/h2-guard/evidence/patched-source.tgz" > "$RUNNER_TEMP/h2-guard/evidence/patched-source.sha256"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: h2-guard-checks-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h2-guard/evidence
          retention-days: 30

  campaign:
    name: H2 guard campaign / ${{ matrix.protocol }}
    needs: guard-checks
    if: github.event_name == 'workflow_dispatch' && inputs.run_campaign
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        protocol: [http2, grpcs]
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Install existing harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libcurl4-openssl-dev lsof sysstat
      - name: Prepare the same pinned diagnostic context
        run: |
          set -euo pipefail
          python3 tests/performance/multi_protocol/h2_guard/prepare.py --output "$RUNNER_TEMP/h2-guard"
          crate="$RUNNER_TEMP/h2-guard/context/vendor/h2-0.4.19-observation"
          cargo fmt --manifest-path "$crate/Cargo.toml" --all
          cargo fmt --manifest-path "$crate/Cargo.toml" --all -- --check
          cargo metadata --locked --format-version 1 --manifest-path "$RUNNER_TEMP/h2-guard/context/Cargo.toml" > "$RUNNER_TEMP/h2-guard/evidence/metadata.json"
          python3 tests/performance/multi_protocol/h2_guard/verify.py graph "$RUNNER_TEMP/h2-guard/evidence/metadata.json" > "$RUNNER_TEMP/h2-guard/evidence/transport-chains.json"
          rustc --version --verbose > "$RUNNER_TEMP/h2-guard/evidence/host-rustc.txt"
          lscpu > "$RUNNER_TEMP/h2-guard/evidence/cpu.txt"
          free -h > "$RUNNER_TEMP/h2-guard/evidence/memory.txt"
          vmstat 1 6 > "$RUNNER_TEMP/h2-guard/evidence/runner-health.txt"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build diagnostic image with the existing Docker stages and features
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/h2-guard/context
          file: ${{ runner.temp }}/h2-guard/context/Dockerfile
          target: runtime
          build-args: |
            FEATURES=cloud-secrets
            CARGO_PROFILE=release
          tags: ferrum-edge:h2-guard
          load: true
          push: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.ferrum.h2-guard-source=ef8e5e5a340588f4452631496976cf8636d4a7ecf600239fdc27615d2530bc16
          # Never export this transient dependency into ordinary image caches.
          cache-from: type=gha
      - name: Retain image build identity
        env:
          BUILD_METADATA: ${{ steps.image.outputs.metadata }}
        run: |
          set -euo pipefail
          docker image inspect ferrum-edge:h2-guard > "$RUNNER_TEMP/h2-guard/evidence/image.json"
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"h2-guard/evidence/build-metadata.json").write_text(os.environ["BUILD_METADATA"] + "\n")'
      - name: Build unchanged validating client and backend
        run: cargo build --locked --release --manifest-path tests/performance/multi_protocol/Cargo.toml
      - name: Run predeclared direct, adaptive, fixed arms (retain every failure)
        timeout-minutes: 30
        env:
          PROTOCOL: ${{ matrix.protocol }}
          FERRUM_IMAGE: ferrum-edge:h2-guard
        run: |
          set -euo pipefail
          sizes=71680
          if [ "$PROTOCOL" = grpcs ]; then sizes="10240 71680"; fi
          bash tests/performance/multi_protocol/run_gateway_protocol_bench.sh "$PROTOCOL" \
            --experiment-manifest "$GITHUB_WORKSPACE/tests/performance/multi_protocol/h2_guard/experiment.json" \
            --gateways ferrum --payload-sizes "$sizes" --duration 15 --concurrency 200 \
            --pairs 4 --skip-build --wallclock-budget-seconds 1500 \
            --output-dir "results/$PROTOCOL/run_1" 2>&1 | tee "$RUNNER_TEMP/h2-guard/evidence/campaign.log"
      - name: Index all canonical samples including failed repetitions
        if: always()
        env:
          PROTOCOL: ${{ matrix.protocol }}
        run: |
          if [ -d "results/$PROTOCOL/run_1" ]; then
            python3 tests/performance/multi_protocol/h2_guard/verify.py campaign "results/$PROTOCOL/run_1" --protocol "$PROTOCOL"
          fi
      - name: Retain exact generated source and client identity
        if: always()
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/h2-guard/context/vendor/h2-0.4.19-observation"
          if [ -d "$crate" ]; then
            tar --exclude=target -czf "$RUNNER_TEMP/h2-guard/evidence/patched-source.tgz" -C "$crate" .
            sha256sum "$RUNNER_TEMP/h2-guard/evidence/patched-source.tgz" > "$RUNNER_TEMP/h2-guard/evidence/patched-source.sha256"
          fi
          if [ -f tests/performance/multi_protocol/target/release/proto_bench ]; then
            sha256sum tests/performance/multi_protocol/target/release/proto_bench tests/performance/multi_protocol/target/release/proto_backend > "$RUNNER_TEMP/h2-guard/evidence/harness-binaries.sha256"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: h2-guard-${{ matrix.protocol }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/h2-guard/evidence
            results/${{ matrix.protocol }}
          retention-days: 30
