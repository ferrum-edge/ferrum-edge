# On-demand native Linux release-profile comparison.
#
# Runs the full tests/performance/multi_protocol suite on Linux and posts
# results to the GitHub Actions step summary.  Triggered manually via
# workflow_dispatch so it can target any branch or PR.
#
# Each run executes the benchmark suite a configurable number of times
# (1-3, default 1) to optionally identify outliers caused by noisy-neighbor
# effects on shared GitHub runners.  A pre-benchmark health check logs CPU
# steal, scheduler jitter, and memory to quantify runner impairment.
#
# Usage:
#   - Go to Actions → "Release Profile Study" → "Run workflow"
#   - Pick the branch (or PR branch) to benchmark
#   - Optionally adjust duration, concurrency, payload size, and protocols

name: Release Profile Study

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Test duration per protocol (seconds)"
        required: false
        default: "5"
        type: string
      concurrency:
        description: "Concurrent connections"
        required: false
        default: "100"
        type: string
      payload_size:
        description: "Payload size in bytes (UDP uses 2048 regardless)"
        required: false
        default: "10240"
        type: string
      protocols:
        description: "Protocols to test (http1, http2, grpc, ws, tcp, etc. or 'all')"
        required: false
        default: "all"
        type: string
      iterations:
        description: "Number of benchmark iterations (1-3)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

jobs:
  benchmark:
    name: Multi-Protocol Benchmark (${{ matrix.optimization }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        optimization: [fat, thin]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: ./.github/actions/setup-sccache

      - uses: ./.github/actions/setup-fast-linker

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "ci-perf-bench"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev lsof sysstat

      - name: Runner health check (pre-benchmark)
        run: |
          echo "=========================================="
          echo "  RUNNER HEALTH CHECK — PRE-BENCHMARK"
          echo "=========================================="
          echo ""

          echo "--- CPU Info ---"
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket|MHz|Hypervisor|Virtualization'
          echo ""

          echo "--- CPU Steal / Usage (5-second sample) ---"
          # vmstat: columns us=user, sy=system, id=idle, wa=iowait, st=steal
          vmstat 1 6 | tail -n 5
          echo ""

          # Parse average steal from the 5 samples
          AVG_STEAL=$(vmstat 1 6 | tail -n 5 | awk '{sum += $17; n++} END {printf "%.1f", sum/n}')
          echo "Average CPU steal over 5s: ${AVG_STEAL}%"
          if (( $(echo "$AVG_STEAL > 5.0" | bc -l) )); then
            echo "::warning::CPU steal is ${AVG_STEAL}% — noisy neighbor detected. Benchmark results may be unreliable."
          else
            echo "CPU steal is low (${AVG_STEAL}%). Runner appears unimpaired."
          fi
          echo ""

          echo "--- Memory ---"
          free -h
          echo ""

          echo "--- Disk I/O (5-second sample) ---"
          iostat -x 1 2 2>/dev/null | tail -n 20 || echo "(iostat not available)"
          echo ""

          echo "--- System Load ---"
          uptime
          echo ""

          echo "--- Kernel Scheduler Latency (check for contention) ---"
          # Sample one-millisecond sleep timing to detect scheduler jitter
          python3 - <<'PYJITTER'
          import time
          samples = []
          for _ in range(100):
              t0 = time.monotonic_ns()
              time.sleep(0.001)  # 1ms sleep
              elapsed_us = (time.monotonic_ns() - t0) / 1000
              samples.append(elapsed_us)
          avg = sum(samples) / len(samples)
          p99 = sorted(samples)[98]
          maxv = max(samples)
          print(f'1ms sleep accuracy: avg={avg:.0f}µs  p99={p99:.0f}µs  max={maxv:.0f}µs')
          if p99 > 5000:
              print('WARNING: High scheduler jitter detected — runner may be overloaded')
          else:
              print('Scheduler jitter is within normal range')
          PYJITTER
          echo ""
          echo "=========================================="
          echo "  HEALTH CHECK COMPLETE"
          echo "=========================================="

      - name: Measure isolated release-profile compilation
        env:
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.optimization }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.optimization == 'fat' && '1' || '16' }}
          RUSTC_WRAPPER: ""
          CARGO_BUILD_RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          # Compare empty compiled-artifact state; dependency downloads may be
          # restored. Disable compiler caching identically in both study lanes.
          target_dir="$(mktemp -d "$RUNNER_TEMP/release-study.XXXXXX")"
          export CARGO_TARGET_DIR="$target_dir"
          mkdir -p benchmark-results/compile target/release
          sudo fallocate -l 12G /mnt/ferrum-release-study-swap
          sudo chmod 600 /mnt/ferrum-release-study-swap
          sudo mkswap /mnt/ferrum-release-study-swap
          sudo swapon /mnt/ferrum-release-study-swap
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            lscpu
            free -k
            printf 'lto=%s\ncodegen_units=%s\n' "$CARGO_PROFILE_RELEASE_LTO" "$CARGO_PROFILE_RELEASE_CODEGEN_UNITS"
            printf 'Native Linux experiment; not the shipping GNU sysroot producer.\n'
          } > benchmark-results/compile/provenance.txt
          vmstat 5 > benchmark-results/compile/vmstat.txt &
          study_sampler_pid=$!
          trap 'kill "$study_sampler_pid" 2>/dev/null || true; wait "$study_sampler_pid" || true' EXIT
          /usr/bin/time --format='wall_seconds=%e max_child_rss_kib=%M major_faults=%F minor_faults=%R exit_status=%x' \
            --output=benchmark-results/compile/gateway.time \
            cargo build --release --features cloud-secrets --bin ferrum-edge --locked --timings \
            2>&1 | tee benchmark-results/compile/gateway.log
          kill "$study_sampler_pid"
          wait "$study_sampler_pid" || true
          trap - EXIT
          cp "$CARGO_TARGET_DIR/cargo-timings/cargo-timing.html" benchmark-results/compile/
          cp "$CARGO_TARGET_DIR/release/ferrum-edge" target/release/ferrum-edge
          sha256sum target/release/ferrum-edge > benchmark-results/compile/gateway.sha256
          stat -c '%s' target/release/ferrum-edge > benchmark-results/compile/gateway-bytes.txt
          target/release/ferrum-edge version > benchmark-results/compile/gateway-version.txt

      - name: Build benchmark tools
        working-directory: tests/performance/multi_protocol
        run: cargo build --release --locked

      - name: Run benchmark suite (${{ inputs.iterations }} iteration(s))
        timeout-minutes: 45
        working-directory: tests/performance/multi_protocol
        env:
          BENCH_ITERATIONS: ${{ inputs.iterations }}
          BENCH_PROTOCOLS: ${{ inputs.protocols }}
          BENCH_DURATION: ${{ inputs.duration }}
          BENCH_CONCURRENCY: ${{ inputs.concurrency }}
          BENCH_PAYLOAD_SIZE: ${{ inputs.payload_size }}
        run: |
          ITERATIONS="$BENCH_ITERATIONS"
          for run in $(seq 1 "$ITERATIONS"); do
            echo ""
            echo "============================================"
            echo "  BENCHMARK RUN ${run}/${ITERATIONS}"
            echo "============================================"
            echo ""

            # Quick steal check before each run
            AVG_STEAL=$(vmstat 1 3 | tail -n 2 | awk '{sum += $17; n++} END {printf "%.1f", sum/n}')
            echo "Pre-run CPU steal: ${AVG_STEAL}%"
            if (( $(echo "$AVG_STEAL > 5.0" | bc -l) )); then
              echo "::warning::Run ${run}: CPU steal is ${AVG_STEAL}% before starting — noisy neighbor detected"
            fi

            bash run_protocol_test.sh \
              "$BENCH_PROTOCOLS" \
              --skip-build \
              --duration "$BENCH_DURATION" \
              --concurrency "$BENCH_CONCURRENCY" \
              --payload-size "$BENCH_PAYLOAD_SIZE" \
              --json 2>&1 | tee /tmp/bench_output_run${run}.txt

            echo ""
            echo "Run ${run}/${ITERATIONS} complete."
          done

          echo ""
          echo "============================================"
          echo "  ALL ${ITERATIONS} BENCHMARK RUN(S) COMPLETE"
          echo "============================================"

      - name: Collect JSON results
        if: always()
        env:
          NUM_ITERATIONS: ${{ inputs.iterations }}
        run: |
          mkdir -p benchmark-results

          # Collect results from all runs into separate files and a combined file.
          # The --json flag makes each proto_bench invocation print pretty-printed
          # multi-line JSON objects interleaved with shell log lines.  Use
          # json.JSONDecoder.raw_decode to extract complete objects from the stream.
          python3 - <<'PYEOF'
          import json, sys, os

          def extract_json_blobs(filepath):
              if not os.path.exists(filepath):
                  return []
              raw = open(filepath).read()
              decoder = json.JSONDecoder()
              blobs = []
              i = 0
              while i < len(raw):
                  idx = raw.find("{", i)
                  if idx == -1:
                      break
                  try:
                      obj, end = decoder.raw_decode(raw, idx)
                      blobs.append(obj)
                      i = end
                  except json.JSONDecodeError:
                      i = idx + 1
              return blobs

          num_iterations = int(os.environ.get("NUM_ITERATIONS", "1"))
          all_runs = {}
          for run in range(1, num_iterations + 1):
              blobs = extract_json_blobs(f"/tmp/bench_output_run{run}.txt")
              all_runs[f"run_{run}"] = blobs
              # Save per-run results
              with open(f"benchmark-results/results_run{run}.json", "w") as f:
                  json.dump({"benchmarks": blobs}, f, indent=2)
              print(f"Run {run}: collected {len(blobs)} benchmark results")

          # Combined results file with all runs
          combined = {"runs": all_runs}
          with open("benchmark-results/results.json", "w") as f:
              json.dump(combined, f, indent=2)
          PYEOF

      - name: Post benchmark summary
        if: always()
        env:
          NUM_ITERATIONS: ${{ inputs.iterations }}
          BENCH_BUILD_PROFILE: ${{ format('release-study-{0}', matrix.optimization) }}
          BENCH_DURATION: ${{ inputs.duration }}
          BENCH_CONCURRENCY: ${{ inputs.concurrency }}
          BENCH_PROTOCOLS: ${{ inputs.protocols }}
        run: |
          python3 - benchmark-results/results.json <<'PYEOF'
          import json, sys, os, math

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          results_path = sys.argv[1]

          if not os.path.exists(results_path):
              with open(summary_file, "a") as f:
                  f.write("## Multi Protocol Performance Benchmark\n\nNo results collected.\n")
              sys.exit(0)

          with open(results_path) as f:
              data = json.load(f)

          runs = data.get("runs", {})
          if not runs:
              with open(summary_file, "a") as f:
                  f.write("## Multi Protocol Performance Benchmark\n\nNo benchmark results found.\n")
              sys.exit(0)

          def fmt_rps(v):
              return f"{v:,.0f}"

          def fmt_us(us):
              if us is None:
                  return "N/A"
              if us >= 1_000_000:
                  return f"{us/1_000_000:.2f}s"
              if us >= 1000:
                  return f"{us/1000:.2f}ms"
              return f"{us}µs"

          def classify_gateway(target):
              return ":8000" in target or ":8443" in target or ":5010" in target or ":5001" in target or ":5003" in target or ":5004" in target

          def group_benchmarks(benchmarks):
              pairs = {}
              for b in benchmarks:
                  target = b.get("target", "")
                  proto = b.get("protocol", "unknown")
                  if proto not in pairs:
                      pairs[proto] = {}
                  if classify_gateway(target):
                      pairs[proto]["gateway"] = b
                  else:
                      pairs[proto]["direct"] = b
              return pairs

          lines = []
          lines.append("## Multi Protocol Performance Benchmark Results\n")
          num_iterations = int(os.environ.get("NUM_ITERATIONS", "1"))

          build_profile = os.environ.get("BENCH_BUILD_PROFILE", "unknown")
          duration = os.environ.get("BENCH_DURATION", "unknown")
          concurrency = os.environ.get("BENCH_CONCURRENCY", "unknown")
          protocols = os.environ.get("BENCH_PROTOCOLS", "unknown")

          lines.append(f"**Profile:** `{build_profile}` | "
                       f"**Duration:** {duration}s | "
                       f"**Concurrency:** {concurrency} | "
                       f"**Protocols:** {protocols} | "
                       f"**Iterations:** {num_iterations}\n")

          # Per-run tables
          for run_key in sorted(runs.keys()):
              run_num = run_key.replace("run_", "")
              benchmarks = runs[run_key]
              if not benchmarks:
                  continue
              pairs = group_benchmarks(benchmarks)

              lines.append(f"\n### Run {run_num}\n")
              lines.append("| Protocol | Gateway RPS | Direct RPS | Overhead | Avg Latency | P50 | P99 | Errors |")
              lines.append("|----------|------------|------------|----------|-------------|-----|-----|--------|")

              for proto, p in sorted(pairs.items()):
                  gw = p.get("gateway", {})
                  dr = p.get("direct", {})
                  gw_rps = gw.get("rps", 0)
                  dr_rps = dr.get("rps", 0)
                  overhead = f"~{int((dr_rps - gw_rps) / dr_rps * 100)}%" if dr_rps > 0 else "N/A"
                  lines.append(
                      f"| {proto} "
                      f"| {fmt_rps(gw_rps)} "
                      f"| {fmt_rps(dr_rps)} "
                      f"| {overhead} "
                      f"| {fmt_us(gw.get('latency_avg_us'))} "
                      f"| {fmt_us(gw.get('p50_us'))} "
                      f"| {fmt_us(gw.get('p99_us'))} "
                      f"| {gw.get('total_errors', 0)} |"
                  )

          # Cross-run comparison & outlier detection (only meaningful with 2+ runs)
          # Collect gateway RPS per protocol across runs
          proto_rps = {}  # proto -> [rps_run1, ...]
          for run_key in sorted(runs.keys()):
              pairs = group_benchmarks(runs[run_key])
              for proto, p in pairs.items():
                  gw_rps = p.get("gateway", {}).get("rps", 0)
                  if proto not in proto_rps:
                      proto_rps[proto] = []
                  proto_rps[proto].append(gw_rps)

          if proto_rps and num_iterations > 1:
              lines.append("\n### Cross-Run Comparison (Gateway RPS)\n")
              run_headers = " | ".join(f"Run {i+1}" for i in range(num_iterations))
              run_separators = "--------|" * num_iterations
              lines.append(f"| Protocol | {run_headers} | Mean | Stdev | CV% | Outlier? |")
              lines.append(f"|----------|{run_separators}------|-------|-----|----------|")

              for proto in sorted(proto_rps.keys()):
                  vals = proto_rps[proto]
                  mean_v = sum(vals) / len(vals) if vals else 0
                  if len(vals) > 1 and mean_v > 0:
                      variance = sum((v - mean_v) ** 2 for v in vals) / (len(vals) - 1)
                      stdev = math.sqrt(variance)
                      cv = (stdev / mean_v) * 100
                  else:
                      stdev = 0
                      cv = 0

                  # Flag as outlier if CV > 15% (high variance across runs)
                  outlier = "⚠️ YES" if cv > 15 else "No"

                  rps_cells = " | ".join(fmt_rps(v) for v in vals)
                  # Pad if fewer than expected runs
                  while len(vals) < num_iterations:
                      rps_cells += " | N/A"
                      vals.append(0)

                  lines.append(
                      f"| {proto} "
                      f"| {rps_cells} "
                      f"| {fmt_rps(mean_v)} "
                      f"| {fmt_rps(stdev)} "
                      f"| {cv:.1f}% "
                      f"| {outlier} |"
                  )

              lines.append("")
              lines.append("> **CV% (Coefficient of Variation)**: Measures run-to-run consistency. "
                           "CV > 15% suggests noisy-neighbor interference or other instability. "
                           "Results marked as outliers should be interpreted with caution.")

          lines.append("")
          lines.append("<details><summary>Raw JSON (all runs)</summary>\n")
          lines.append("```json")
          lines.append(json.dumps(data, indent=2))
          lines.append("```\n")
          lines.append("</details>")

          with open(summary_file, "a") as f:
              f.write("\n".join(lines) + "\n")

          # Also print to stdout for the log
          for line in lines:
              print(line)
          PYEOF

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results-${{ matrix.optimization }}-${{ github.sha }}
          path: benchmark-results/
          retention-days: 7
