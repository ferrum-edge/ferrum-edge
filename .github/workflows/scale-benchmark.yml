# On-demand resource scale benchmark.
#
# Runs the functional_scale_perf_test against the gateway, progressively
# adding proxies (with key_auth + access_control plugins and unique consumers)
# in batches up to 30,000 total.  After each batch a load test measures
# throughput and latency.  Results are posted to the GitHub Actions step summary
# with RPS/latency degradation analysis and error breakdown.
#
# The test uses the existing Rust functional test harness which handles gateway
# lifecycle, resource creation via batch admin API, and load generation.
#
# Usage:
#   - Go to Actions -> "Resources Scale Benchmark" -> "Run workflow"
#   - Pick the branch (or PR branch) to benchmark
#   - Choose SQLite (default, no deps), PostgreSQL, or MongoDB

name: Resources Scale Benchmark

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Benchmark workload"
        required: false
        default: "resources"
        type: choice
        options:
          - resources
          - route-status
          - unit-compile
      baseline_ref:
        description: "Baseline revision for isolated route-status comparison"
        required: false
        default: "main"
        type: string
      db_type:
        description: "Database backend"
        required: false
        default: "sqlite"
        type: choice
        options:
          - sqlite
          - postgres
          - mongodb

jobs:
  scale-benchmark:
    name: Scale Benchmark (${{ inputs.db_type }})
    if: inputs.benchmark == 'resources'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: ./.github/actions/setup-sccache

      - uses: ./.github/actions/setup-fast-linker

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "ci-scale-bench"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev lsof sysstat

      - name: Runner health check (pre-benchmark)
        run: |
          echo "=========================================="
          echo "  RUNNER HEALTH CHECK — PRE-BENCHMARK"
          echo "=========================================="
          echo ""

          echo "--- CPU Info ---"
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket|MHz|Hypervisor|Virtualization'
          echo ""

          echo "--- CPU Steal / Usage (5-second sample) ---"
          vmstat 1 6 | tail -n 5
          echo ""

          AVG_STEAL=$(vmstat 1 6 | tail -n 5 | awk '{sum += $17; n++} END {printf "%.1f", sum/n}')
          echo "Average CPU steal over 5s: ${AVG_STEAL}%"
          if (( $(echo "$AVG_STEAL > 5.0" | bc -l) )); then
            echo "::warning::CPU steal is ${AVG_STEAL}% — noisy neighbor detected. Benchmark results may be unreliable."
          else
            echo "CPU steal is low (${AVG_STEAL}%). Runner appears unimpaired."
          fi
          echo ""

          echo "--- Memory ---"
          free -h
          echo ""

          echo "--- System Load ---"
          uptime
          echo ""

          echo "=========================================="
          echo "  HEALTH CHECK COMPLETE"
          echo "=========================================="

      # Pre-build the gateway binary so the test harness's internal
      # `cargo build --release` is a fast no-op.
      - name: Build gateway binary
        run: cargo build --release --bin ferrum-edge

      - name: Run scale benchmark (SQLite)
        if: inputs.db_type == 'sqlite'
        timeout-minutes: 90
        run: |
          cargo test --test functional_tests \
            test_scale_perf_30k_proxies \
            -- --ignored --nocapture 2>&1 | tee /tmp/scale_bench_output.txt

      - name: Start PostgreSQL container
        if: inputs.db_type == 'postgres'
        run: |
          # The Rust test checks for "ferrum-scale-test-pg" by name via `docker inspect`.
          docker run -d --name ferrum-scale-test-pg \
            -e POSTGRES_USER=ferrum \
            -e POSTGRES_PASSWORD=ferrum-scale-test \
            -e POSTGRES_DB=ferrum_scale \
            -p 25432:5432 \
            postgres:16

          # Wait for the container to be ready
          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 30); do
            if docker exec ferrum-scale-test-pg pg_isready -U ferrum 2>/dev/null; then
              echo "PostgreSQL container ready"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::PostgreSQL did not become ready in 30 seconds"
              exit 1
            fi
            sleep 1
          done

      - name: Run scale benchmark (PostgreSQL)
        if: inputs.db_type == 'postgres'
        timeout-minutes: 90
        run: |
          cargo test --test functional_tests \
            test_scale_perf_30k_proxies_postgres \
            -- --ignored --nocapture 2>&1 | tee /tmp/scale_bench_output.txt

      - name: Start MongoDB container
        if: inputs.db_type == 'mongodb'
        run: |
          # The Rust test checks for "ferrum-scale-test-mongo" by name via `docker inspect`
          # and cleans the database via `docker exec ... mongosh`.
          #
          # Single-node replica set, not standalone: the benchmark provisions via
          # POST /batch, which is all-or-nothing (issue #2401) and therefore needs
          # MongoDB multi-document transactions. A standalone mongod refuses the
          # batch with 501 rather than applying part of a graph.
          # `--network host` with a real port: a replica-set member advertises
          # its own host:port and the driver reconnects to whatever is
          # advertised, so a `-p` mapping would point the driver at the wrong
          # port.
          docker run -d --name ferrum-scale-test-mongo --network host \
            mongo:7 --replSet rs0 --port 27117 --bind_ip_all

          # Wait for the container to be ready
          echo "Waiting for MongoDB to be ready..."
          for i in $(seq 1 30); do
            if docker exec ferrum-scale-test-mongo \
              mongosh --quiet --port 27117 --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; then
              echo "MongoDB container ready"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::MongoDB did not become ready in 30 seconds"
              exit 1
            fi
            sleep 1
          done

          docker exec ferrum-scale-test-mongo mongosh --quiet --port 27117 --eval \
            'try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27117"}]}) }'
          echo "Waiting for the replica set primary..."
          for i in $(seq 1 60); do
            if docker exec ferrum-scale-test-mongo mongosh --quiet --port 27117 --eval \
              'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              echo "Replica set primary ready"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::MongoDB replica set did not elect a primary"
              docker logs ferrum-scale-test-mongo
              exit 1
            fi
            sleep 1
          done
          echo "FERRUM_MONGO_REPLICA_SET=rs0" >> "$GITHUB_ENV"

      - name: Run scale benchmark (MongoDB)
        if: inputs.db_type == 'mongodb'
        timeout-minutes: 90
        run: |
          cargo test --test functional_tests \
            test_scale_perf_30k_proxies_mongodb \
            -- --ignored --nocapture 2>&1 | tee /tmp/scale_bench_output.txt

      - name: Parse results and post summary
        if: always()
        env:
          DB_TYPE: ${{ inputs.db_type }}
        run: |
          python3 - /tmp/scale_bench_output.txt <<'PYEOF'
          import sys, os, re, json

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          db_type = os.environ.get("DB_TYPE", "sqlite")
          build_profile = "release"

          output_path = sys.argv[1]
          if not os.path.exists(output_path):
              with open(summary_file, "a") as f:
                  f.write("## Resources Scale Benchmark\n\nNo output captured — test may have failed to start.\n")
              sys.exit(0)

          raw = open(output_path).read()

          # Parse the box-formatted results from print_perf_result() and the summary table.
          # Each perf result block looks like:
          #   │  Proxies:   3000  │  Duration:  30.0s                   │
          #   │  Total requests:          12345                       │
          #   │  Successful:              12300                       │
          #   │  Failed:                     45                       │
          #   │  RPS:                    1234.5                       │
          #   │  Avg latency:        1234 µs (  1.2 ms)            │
          #   │  P50 latency:         987 µs (  1.0 ms)            │
          #   │  P95 latency:        2345 µs (  2.3 ms)            │
          #   │  P99 latency:        5678 µs (  5.7 ms)            │
          #   │  Max latency:       12345 µs ( 12.3 ms)            │

          results = []

          # Strategy: find each "Proxies:" line and extract the following metrics block
          blocks = raw.split("┌─────────────────────────────────────────────────────────┐")
          for block in blocks[1:]:  # skip everything before the first block
              r = {}
              m = re.search(r'Proxies:\s+([\d,]+)', block)
              if m:
                  r['proxies'] = int(m.group(1).replace(',', ''))

              m = re.search(r'Duration:\s+([\d.]+)s', block)
              if m:
                  r['duration_secs'] = float(m.group(1))

              m = re.search(r'Total requests:\s+([\d,]+)', block)
              if m:
                  r['total_requests'] = int(m.group(1).replace(',', ''))

              m = re.search(r'Successful:\s+([\d,]+)', block)
              if m:
                  r['successful'] = int(m.group(1).replace(',', ''))

              m = re.search(r'Failed:\s+([\d,]+)', block)
              if m:
                  r['failed'] = int(m.group(1).replace(',', ''))

              m = re.search(r'RPS:\s+([\d.]+)', block)
              if m:
                  r['rps'] = float(m.group(1))

              for label, key in [('Avg', 'avg_us'), ('P50', 'p50_us'), ('P95', 'p95_us'), ('P99', 'p99_us'), ('Max', 'max_us')]:
                  m = re.search(rf'{label} latency:\s+([\d.]+)\s+µs', block)
                  if m:
                      r[key] = float(m.group(1))

              if 'proxies' in r and 'rps' in r:
                  results.append(r)

          # Also try to extract the summary table (has all data in one place)
          # Format: "   3000     12345.0       1.2       1.0       2.3       5.7      12.3  (100% of baseline)"
          # But the box-format parsing above is more reliable, so we prefer that.

          # Check for test success/failure
          test_passed = "test result: ok" in raw
          test_failed = "test result: FAILED" in raw or "FAILED" in raw.split("\n")[-5:].__repr__()

          # Extract any assertion failures or panics
          errors = []
          for line in raw.split("\n"):
              if "panicked" in line.lower() or "assertion" in line.lower() and "failed" in line.lower():
                  errors.append(line.strip())
              if "SUCCESS rate dropped" in line or "WARNING:" in line:
                  errors.append(line.strip())

          # Build the summary
          lines = []
          lines.append("## Resources Scale Benchmark Results\n")
          lines.append(f"**Database:** `{db_type}` | **Build Profile:** `{build_profile}` | "
                       f"**Test Status:** {'PASSED' if test_passed else 'FAILED'}\n")

          if not results:
              lines.append("No benchmark data points were captured from the test output.\n")
              if errors:
                  lines.append("### Errors\n")
                  for e in errors:
                      lines.append(f"- `{e}`")
              with open(summary_file, "a") as f:
                  f.write("\n".join(lines) + "\n")
              # Print to stdout too
              print("\n".join(lines))
              sys.exit(0)

          def fmt_us(us):
              if us is None:
                  return "N/A"
              if us >= 1_000_000:
                  return f"{us/1_000_000:.2f}s"
              if us >= 1000:
                  return f"{us/1000:.2f}ms"
              return f"{us:.0f}us"

          def fmt_rps(v):
              return f"{v:,.0f}"

          # Main results table
          lines.append("### Per-Batch Results\n")
          lines.append("| Proxies | RPS | Avg Latency | P50 | P95 | P99 | Max | Requests | Errors | Success Rate |")
          lines.append("|---------|-----|-------------|-----|-----|-----|-----|----------|--------|--------------|")

          baseline_rps = results[0]['rps'] if results else 1.0

          for r in results:
              total = r.get('total_requests', 0)
              failed = r.get('failed', 0)
              success = r.get('successful', 0)
              success_rate = (success / total * 100) if total > 0 else 0
              lines.append(
                  f"| {r['proxies']:,} "
                  f"| {fmt_rps(r['rps'])} "
                  f"| {fmt_us(r.get('avg_us'))} "
                  f"| {fmt_us(r.get('p50_us'))} "
                  f"| {fmt_us(r.get('p95_us'))} "
                  f"| {fmt_us(r.get('p99_us'))} "
                  f"| {fmt_us(r.get('max_us'))} "
                  f"| {total:,} "
                  f"| {failed:,} "
                  f"| {success_rate:.1f}% |"
              )

          # Degradation analysis
          if len(results) >= 2:
              lines.append("\n### Degradation Analysis\n")

              first = results[0]
              last = results[-1]
              first_rps = first['rps']
              last_rps = last['rps']

              rps_degradation = (1.0 - last_rps / first_rps) * 100 if first_rps > 0 else 0

              # RPS degradation
              if rps_degradation > 0:
                  severity = "minimal" if rps_degradation < 15 else "moderate" if rps_degradation < 40 else "significant" if rps_degradation < 70 else "severe"
                  icon = "white_check_mark" if rps_degradation < 15 else "warning" if rps_degradation < 40 else "x"
                  lines.append(f"**RPS Degradation** ({first['proxies']:,} -> {last['proxies']:,} proxies): "
                               f"**{rps_degradation:.1f}%** ({severity}) :{icon}:")
              else:
                  lines.append(f"**RPS Degradation** ({first['proxies']:,} -> {last['proxies']:,} proxies): "
                               f"**None** (RPS improved or stable) :white_check_mark:")

              lines.append(f"- Baseline ({first['proxies']:,} proxies): {fmt_rps(first_rps)} RPS")
              lines.append(f"- Final ({last['proxies']:,} proxies): {fmt_rps(last_rps)} RPS")
              lines.append("")

              # Latency degradation
              for label, key in [("Avg", "avg_us"), ("P50", "p50_us"), ("P95", "p95_us"), ("P99", "p99_us")]:
                  first_val = first.get(key, 0)
                  last_val = last.get(key, 0)
                  if first_val > 0:
                      increase = ((last_val - first_val) / first_val) * 100
                      lines.append(f"**{label} Latency**: {fmt_us(first_val)} -> {fmt_us(last_val)} "
                                   f"({'+' if increase > 0 else ''}{increase:.1f}%)")

              lines.append("")

              # Per-step RPS change table
              lines.append("### Step-by-Step RPS Progression\n")
              lines.append("| Step | Proxies | RPS | vs Baseline | vs Previous |")
              lines.append("|------|---------|-----|-------------|-------------|")

              for i, r in enumerate(results):
                  vs_baseline = (r['rps'] / first_rps * 100) if first_rps > 0 else 0
                  if i == 0:
                      vs_prev = "—"
                  else:
                      prev_rps = results[i-1]['rps']
                      change = ((r['rps'] - prev_rps) / prev_rps * 100) if prev_rps > 0 else 0
                      vs_prev = f"{'+' if change > 0 else ''}{change:.1f}%"

                  lines.append(
                      f"| {i+1} "
                      f"| {r['proxies']:,} "
                      f"| {fmt_rps(r['rps'])} "
                      f"| {vs_baseline:.0f}% "
                      f"| {vs_prev} |"
                  )

          # Error analysis
          total_errors = sum(r.get('failed', 0) for r in results)
          if total_errors > 0:
              lines.append("\n### Error Summary\n")
              lines.append(f"**Total errors across all batches:** {total_errors:,}\n")
              for r in results:
                  if r.get('failed', 0) > 0:
                      total = r.get('total_requests', 0)
                      error_rate = (r['failed'] / total * 100) if total > 0 else 0
                      lines.append(f"- {r['proxies']:,} proxies: {r['failed']:,} errors ({error_rate:.2f}% error rate)")

          if errors:
              lines.append("\n### Test Warnings/Assertions\n")
              for e in errors[:20]:  # cap at 20
                  lines.append(f"- `{e}`")

          # Raw JSON data for programmatic consumption
          lines.append("\n<details><summary>Raw JSON data</summary>\n")
          lines.append("```json")
          json_data = {
              "db_type": db_type,
              "build_profile": build_profile,
              "test_passed": test_passed,
              "results": results,
          }
          lines.append(json.dumps(json_data, indent=2))
          lines.append("```\n")
          lines.append("</details>")

          with open(summary_file, "a") as f:
              f.write("\n".join(lines) + "\n")

          # Print to stdout
          for line in lines:
              print(line)

          # Save JSON for artifact upload
          with open("/tmp/scale_bench_results.json", "w") as f:
              json.dump(json_data, f, indent=2)
          PYEOF

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scale-benchmark-${{ inputs.db_type }}-${{ github.sha }}
          path: |
            /tmp/scale_bench_output.txt
            /tmp/scale_bench_results.json
          retention-days: 90

  route-status-profile:
    name: Isolated route status (${{ matrix.revision }})
    if: inputs.benchmark == 'route-status'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_TERM_COLOR: never
      PROFILE_REVISION: ${{ matrix.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ matrix.revision == 'baseline' && inputs.baseline_ref || github.sha }}
          persist-credentials: false

      - name: Record revision and runner memory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/route-status-profile"
          git rev-parse HEAD | tee "$RUNNER_TEMP/route-status-profile/revision.txt"
          sudo fallocate -l 12G /mnt/ferrum-route-status-swap
          sudo chmod 600 /mnt/ferrum-route-status-swap
          sudo mkswap /mnt/ferrum-route-status-swap
          sudo swapon /mnt/ferrum-route-status-swap
          free -h
          lscpu

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-test

      - name: Compile the unchanged external unit target
        run: cargo test --test unit_tests --no-run

      - name: Measure the isolated scale regression three times
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            /usr/bin/time --format='wall_seconds=%e max_child_rss_kib=%M exit_status=%x' \
              --output="$RUNNER_TEMP/route-status-profile/round-$round.time" \
              cargo test --test unit_tests -- \
              --exact unit::gateway_core::k8s_status_planning_tests::large_route_snapshots_scale_indexing_while_budget_bounds_planning \
              --nocapture 2>&1 | tee "$RUNNER_TEMP/route-status-profile/round-$round.log"
          done

      - name: Verify selection and summarize isolated measurements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import statistics
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "route-status-profile"
          name = "unit::gateway_core::k8s_status_planning_tests::large_route_snapshots_scale_indexing_while_budget_bounds_planning"
          measurements = []
          for round in range(1, 4):
              log = (root / f"round-{round}.log").read_text()
              if f"test {name} ... ok" not in log:
                  raise SystemExit("The exact scale regression did not pass")
              results = re.findall(r"^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; (\d+) filtered out; finished in ([0-9.]+)s$", log, re.MULTILINE)
              if len(results) != 1 or int(results[0][0]) == 0:
                  raise SystemExit("Expected exactly one isolated passing test from the complete unit target")
              usage = re.fullmatch(r"wall_seconds=([0-9.]+) max_child_rss_kib=(\d+) exit_status=0\n?", (root / f"round-{round}.time").read_text())
              if usage is None:
                  raise SystemExit("Missing successful timing proof")
              measurements.append({"round": round, "wall_seconds": float(usage[1]), "max_child_rss_kib": int(usage[2]), "test_seconds": float(results[0][1]), "filtered_tests": int(results[0][0])})
          result = {"revision": (root / "revision.txt").read_text().strip(), "role": os.environ["PROFILE_REVISION"], "measurements": measurements}
          (root / "summary.json").write_text(json.dumps(result, indent=2) + "\n")
          summary = f"## Isolated route-status profile: {result['role']}\n\nRevision: `{result['revision']}`\n\n"
          summary += f"Median wall time: {statistics.median(m['wall_seconds'] for m in measurements):.2f}s. "
          summary += f"Median maximum child RSS: {statistics.median(m['max_child_rss_kib'] for m in measurements):,.0f} KiB.\n\n"
          summary += "Each process runs both original cardinalities, both planning calls, and all existing assertions. Compile time is excluded. The baseline and candidate run on separate standard hosted runners; these repetitions are descriptive, not a same-host confidence interval. Normal CI still runs the complete unit target.\n"
          print(summary)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write(summary)
          PY

      - name: Preserve isolated profile evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: route-status-profile-${{ matrix.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/route-status-profile/
          retention-days: 14
          if-no-files-found: warn

  unit-scheduling:
    name: Unit scheduling (${{ matrix.cargo_jobs }} Cargo jobs)
    if: inputs.benchmark == 'unit-compile'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cargo_jobs: [1, 3]
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Extend runner swap for the aggregated unit_tests compile
        run: |
          set -euo pipefail
          # The single-crate rustc frontend for the aggregated tests/unit_tests
          # binary exceeds hosted-runner RAM on cold compiles: the VM dies with
          # "The runner has received a shutdown signal" / exit 143 before any
          # compiler diagnostic can print. Give the VM swap headroom so memory
          # pressure degrades to paging instead of killing the runner agent.
          sudo fallocate -l 12G /mnt/ferrum-swapfile
          sudo chmod 600 /mnt/ferrum-swapfile
          sudo mkswap /mnt/ferrum-swapfile
          sudo swapon /mnt/ferrum-swapfile
          free -h

      - uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: "ci-unit-scheduling-downloads"

      - name: Isolate cold compiler state and record provenance
        run: |
          set -euo pipefail
          # Use fresh directories after setup's dependency download/cache step.
          # Retain downloaded crate sources, but import no compiled artifacts.
          target_dir="$(mktemp -d "$RUNNER_TEMP/unit-target.XXXXXX")"
          compiler_cache="$(mktemp -d "$RUNNER_TEMP/unit-sccache.XXXXXX")"
          if [ -n "${FERRUM_SCCACHE_BIN:-}" ]; then
            sccache --stop-server || true
          fi
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$compiler_cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/unit-experiment" "$RUNNER_TEMP/unit-ci"
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            uname -a
            nproc
            free -k
            printf 'cargo_jobs=%s\nprofile_dev_debug=%s\n' "$CARGO_BUILD_JOBS" "$CARGO_PROFILE_DEV_DEBUG"
            printf 'cold state: empty Cargo target and empty local sccache; downloaded sources may be reused\n'
          } > "$RUNNER_TEMP/unit-experiment/provenance.txt"
          date +%s > "$RUNNER_TEMP/unit-experiment/readiness-start.txt"

      - name: Precompile inline and hardening test binaries
        # Compile both targets in one Cargo invocation before running either.
        # Otherwise a hosted runner can pass all inline tests, then lose the
        # entire job while compiling the separate four-test hardening binary.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit-ci"
          python3 .github/scripts/run_unit_ci.py default-build --sample-parent "$$" &
          unit_sampler_pid=$!
          trap 'kill "$unit_sampler_pid" 2>/dev/null || true; wait "$unit_sampler_pid" || true' EXIT
          /usr/bin/time --format='wall_seconds=%e max_child_rss_kib=%M major_faults=%F minor_faults=%R exit_status=%x' --output="$RUNNER_TEMP/unit-ci/default-build.time" cargo test --lib --test unit_tests --no-run --timings 2>&1 | tee "$RUNNER_TEMP/unit-ci/default-build.log"
          kill "$unit_sampler_pid"
          wait "$unit_sampler_pid"
          trap - EXIT
          cp "$CARGO_TARGET_DIR/cargo-timings/cargo-timing.html" "$RUNNER_TEMP/unit-ci/default-build.cargo-timing.html"
          python3 .github/scripts/run_unit_ci.py default-build
        env:
          RUST_BACKTRACE: 1

      - name: Run inline lib tests
        # Covers `#[cfg(test)] mod tests` blocks inline in `src/` (used for
        # private fns/structs that the separate tests/ binaries can't see).
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit-ci"
          /usr/bin/time --format='wall_seconds=%e max_child_rss_kib=%M major_faults=%F minor_faults=%R exit_status=%x' --output="$RUNNER_TEMP/unit-ci/default-lib.time" cargo test --lib 2>&1 | tee "$RUNNER_TEMP/unit-ci/default-lib.log"
          python3 .github/scripts/run_unit_ci.py default-lib
        env:
          RUST_BACKTRACE: 1

      - name: Run cache accounting and reload safety regressions
        # These tests are also part of the complete unit suite below. Run the
        # explicit contract first so test deletion/renaming cannot silently
        # weaken the hardening gate, while reusing the same compiled test
        # binary instead of paying for a second cold Rust job.
        run: |
          set -euo pipefail
          hardening_tests=(
            unit::plugins::response_caching_tests::test_concurrent_stores_keep_size_bounded_and_non_wrapping
            unit::plugins::plugin_cache_tests::test_rebuild_rejects_malformed_body_validator_and_keeps_prior_cache
            unit::plugins::plugin_cache_tests::test_apply_delta_rejects_malformed_request_size_limiting_and_keeps_prior_cache
            unit::plugins::plugin_cache_tests::test_apply_delta_rejects_unknown_enabled_plugin_and_keeps_prior_cache
          )

          set +e
          test_output="$(cargo test --test unit_tests -- --exact "${hardening_tests[@]}" 2>&1)"
          test_status=$?
          set -e

          printf '%s\n' "$test_output"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi

          if ! printf '%s\n' "$test_output" | grep -qE '^test result: ok\. 4 passed; 0 failed; 0 ignored;'; then
            echo "::error::expected exactly 4 plugin hardening unit regressions to run and pass"
            exit 1
          fi
        env:
          RUST_BACKTRACE: 1

      - name: Summarize plugin hardening unit regressions
        if: always()
        run: |
          echo "## Plugin Hardening Unit Regressions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- test_concurrent_stores_keep_size_bounded_and_non_wrapping" >> $GITHUB_STEP_SUMMARY
          echo "- test_rebuild_rejects_malformed_body_validator_and_keeps_prior_cache" >> $GITHUB_STEP_SUMMARY
          echo "- test_apply_delta_rejects_malformed_request_size_limiting_and_keeps_prior_cache" >> $GITHUB_STEP_SUMMARY
          echo "- test_apply_delta_rejects_unknown_enabled_plugin_and_keeps_prior_cache" >> $GITHUB_STEP_SUMMARY

      - name: Run kTLS live-kernel handoff proof
        # Issue #3619 re-enabled a handoff that had been INERT, so classifier
        # unit tests are not sufficient evidence. These tests drive a real
        # rustls TLS 1.2 client against the real `try_ktls_accept`, install
        # kernel TLS keys on this runner's kernel, relay application bytes
        # through splice(2), and assert the close handshake: an authenticated
        # close_notify is clean EOF, a bare FIN is a truncation, a backend EOF
        # produces the reciprocal alert, and an unauthenticated record never
        # becomes EOF.
        #
        # `FERRUM_KTLS_LIVE_REQUIRED=1` makes an unavailable kernel capability
        # a failure rather than a skip, and the SKIP/`test result` assertions
        # below make "the live path did not run" indistinguishable from a red
        # gate. This job is `require_success "Unit and inline lib"` in the
        # required `Tests` aggregate, so the live path is genuinely blocking.
        run: |
          set -euo pipefail
          # The TLS ULP normally autoloads from setsockopt(TCP_ULP); load it
          # explicitly too so a failure below is about the handoff, not the
          # module.
          sudo modprobe tls || true

          set +e
          output="$(cargo test --lib -- --ignored --nocapture --test-threads=1 \
            proxy::ktls_live_kernel_tests 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q '^SKIP:' <<<"$output"; then
            echo "::error::kTLS live-kernel tests skipped under required CI mode"
            exit 1
          fi
          if ! grep -Eq '^test result: ok\. 3 passed; 0 failed;' <<<"$output"; then
            echo "::error::expected exactly 3 kTLS live-kernel tests to pass"
            exit 1
          fi
        env:
          FERRUM_KTLS_LIVE_REQUIRED: "1"
          RUST_BACKTRACE: 1

      - name: Run unit tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit-ci"
          /usr/bin/time --format='wall_seconds=%e max_child_rss_kib=%M major_faults=%F minor_faults=%R exit_status=%x' --output="$RUNNER_TEMP/unit-ci/default-unit.time" cargo test --test unit_tests 2>&1 | tee "$RUNNER_TEMP/unit-ci/default-unit.log"
          python3 .github/scripts/run_unit_ci.py default-unit
        env:
          RUST_BACKTRACE: 1

      - name: Precompile ACME library and DNS hook test binaries
        # Keep inline ACME coverage, but compile only the two-test DNS target
        # alongside it: enabling ACME must not rebuild monolithic unit_tests.
        # Default suites above retain their full target graph and test counts.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit-ci"
          python3 .github/scripts/run_unit_ci.py acme-build --sample-parent "$$" &
          unit_sampler_pid=$!
          trap 'kill "$unit_sampler_pid" 2>/dev/null || true; wait "$unit_sampler_pid" || true' EXIT
          /usr/bin/time --format='wall_seconds=%e max_child_rss_kib=%M major_faults=%F minor_faults=%R exit_status=%x' --output="$RUNNER_TEMP/unit-ci/acme-build.time" cargo test --features acme --lib --test acme_dns01_tests --no-run --timings 2>&1 | tee "$RUNNER_TEMP/unit-ci/acme-build.log"
          kill "$unit_sampler_pid"
          wait "$unit_sampler_pid"
          trap - EXIT
          cp "$CARGO_TARGET_DIR/cargo-timings/cargo-timing.html" "$RUNNER_TEMP/unit-ci/acme-build.cargo-timing.html"
          python3 .github/scripts/run_unit_ci.py acme-build
        env:
          RUST_BACKTRACE: 1

      - name: Run ACME outbound-boundary regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit-ci"
          /usr/bin/time --format='wall_seconds=%e max_child_rss_kib=%M major_faults=%F minor_faults=%R exit_status=%x' --output="$RUNNER_TEMP/unit-ci/acme-outbound.time" cargo test --features acme --lib tls::acme::client::tests 2>&1 | tee "$RUNNER_TEMP/unit-ci/acme-outbound.log"
          python3 .github/scripts/run_unit_ci.py acme-outbound
        env:
          RUST_BACKTRACE: 1

      # The `acme` feature is not default, so the unit suite above compiles the
      # DNS-01 hook out entirely. Issue #2409's cancellation contract (a hook
      # child must not outlive the renewal claim) only has a gate if it is run
      # explicitly with the feature on.
      - name: Run ACME DNS-01 hook cancellation regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit-ci"
          /usr/bin/time --format='wall_seconds=%e max_child_rss_kib=%M major_faults=%F minor_faults=%R exit_status=%x' --output="$RUNNER_TEMP/unit-ci/acme-dns.time" cargo test --features acme --test acme_dns01_tests 2>&1 | tee "$RUNNER_TEMP/unit-ci/acme-dns.log"
          python3 .github/scripts/run_unit_ci.py acme-dns
        env:
          RUST_BACKTRACE: 1

      # Same reason: the renewal-resumption entry point (issue #2409's crash
      # recovery) only exists behind `acme`, so the takeover/skip decisions it
      # makes before any ACME networking need the feature on to be gated at all.
      - name: Run ACME renewal crash-recovery regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit-ci"
          /usr/bin/time --format='wall_seconds=%e max_child_rss_kib=%M major_faults=%F minor_faults=%R exit_status=%x' --output="$RUNNER_TEMP/unit-ci/acme-renewal.time" cargo test --features acme --lib tls::acme_renewal_resume_tests 2>&1 | tee "$RUNNER_TEMP/unit-ci/acme-renewal.log"
          python3 .github/scripts/run_unit_ci.py acme-renewal
        env:
          RUST_BACKTRACE: 1

      - name: Preserve cold readiness evidence
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/unit-experiment/readiness-end.txt"
          cp -a "$RUNNER_TEMP/unit-ci" "$RUNNER_TEMP/unit-experiment/cold"

      - name: Measure same-workspace reuse after both feature builds
        run: |
          set -euo pipefail
          for phase in default-build acme-build; do
            python3 .github/scripts/run_unit_ci.py "$phase" --sample-parent "$$" &
            unit_sampler_pid=$!
            trap 'kill "$unit_sampler_pid" 2>/dev/null || true; wait "$unit_sampler_pid" || true' EXIT
            if [ "$phase" = default-build ]; then
              /usr/bin/time --format='wall_seconds=%e max_child_rss_kib=%M major_faults=%F minor_faults=%R exit_status=%x' --output="$RUNNER_TEMP/unit-ci/default-build.time" cargo test --lib --test unit_tests --no-run --timings 2>&1 | tee "$RUNNER_TEMP/unit-ci/default-build.log"
            else
              /usr/bin/time --format='wall_seconds=%e max_child_rss_kib=%M major_faults=%F minor_faults=%R exit_status=%x' --output="$RUNNER_TEMP/unit-ci/acme-build.time" cargo test --features acme --lib --test acme_dns01_tests --no-run --timings 2>&1 | tee "$RUNNER_TEMP/unit-ci/acme-build.log"
            fi
            kill "$unit_sampler_pid"
            wait "$unit_sampler_pid"
            trap - EXIT
            cp "$CARGO_TARGET_DIR/cargo-timings/cargo-timing.html" "$RUNNER_TEMP/unit-ci/$phase.cargo-timing.html"
            python3 .github/scripts/run_unit_ci.py "$phase"
            mkdir -p "$RUNNER_TEMP/unit-experiment/warm"
            cp "$RUNNER_TEMP/unit-ci/$phase".* "$RUNNER_TEMP/unit-experiment/warm/"
          done

      - name: Preserve scheduling experiment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-scheduling-${{ matrix.cargo_jobs }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/unit-ci/
            ${{ runner.temp }}/unit-experiment/
          retention-days: 7
          if-no-files-found: error
