name: FIPS Build Policy

# FIPS deployment-mode gate for issue #3510, with CI runtime caching for #3888.
#
# Jobs:
#
# 1. `feature-policy` is the cheap REQUIRED graph audit. It reads `Cargo.toml`
#    and the resolved feature graph for both profiles and fails when a ring
#    feature could still be in control of a nominal FIPS build.
# 2. `fips-plan` decides whether the expensive compile/claimed-check/clippy/
#    test-binary/test jobs run.
#    The planner is read from the trusted base; a missing or unknown planner
#    fails closed toward running the live compile gate.
# 3. `fips-compile` is a build-only exact producer: it builds the locked FIPS
#    binary, then publishes one cache layer and one immutable artifact before
#    claimed checks, clippy, and test-binary compile start:
#    - Stable rust-cache fallback: `shared-key` is
#      `ci-fips-contract-${{ hashFiles(...) }}` (the input the pinned
#      Swatinem/rust-cache actually uses; a sibling `key:` input is ignored
#      whenever `shared-key` is set and must not appear). Automatic
#      toolchain/env/manifest/lock hashing stays enabled. This layer is NOT
#      SHA-scoped, so dependency/compiler work stays warm across commits. The
#      compile producer removes only restored aws-lc-fips-sys `out/build`
#      CMake trees before Cargo: those intermediates are runner-local and can
#      fail an incremental delocate pass after crossing runners.
#    - Exact producer handoff artifact: the successful producer tree
#      (workspace target + sccache + the checkout's Git tree identity) is
#      packaged as a zstd tar and published as the immutable, one-day artifact
#      `fips-producer-handoff-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}`.
#      This artifact IS the same-run compile-to-consumer channel. It is not a
#      repository cache entry, so the shared 10 GB cache quota's LRU eviction
#      (which repeatedly dropped the former `actions/cache` producer key
#      between save and consumer restore under concurrent runs) cannot touch
#      it, and fork pull-request runs can publish and consume it too. A later
#      explicit workflow dispatch can also name this run and attempt,
#      downloading the exact same-SHA artifact as its inter-run warm source.
#      Warm-evidence chaining still uses separate workflow runs because GitHub
#      deletes a run's artifacts when that run is fully rerun. Abrupt loss of
#      the producer cannot publish that producer's unsaved state.
# 4. `fips-claimed-checks`, `fips-clippy`, and `fips-test-build` download the
#    producer handoff by the attempt-wildcard pattern
#    `fips-producer-handoff-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-*`
#    with `merge-multiple: false`. The pinned download action flattens a
#    single matching artifact's payload into the channel directory and, when
#    two or more attempts exist, extracts each into an artifact-named child
#    directory. Promotion admits both layouts, binds the attempt from the
#    `fips-producer-identity` member packaged inside the tar (never from the
#    consumer's `github.run_attempt`), requires child directory names and
#    payload identity to agree, and then validates the payload, source-tree
#    identity, and executable (consumers; rust-cache `save-if: false` and no
#    producer publication). Trusted non-cold runs fail closed if no producer
#    handoff for this source SHA/run_id exists. Because the pattern is
#    attempt-independent, a `rerun --failed` consumer at a later attempt
#    reuses the artifact the skipped producer published at an earlier attempt
#    — the former run-attempt-scoped cache key made such reruns unrecoverable.
#    `fips-test-build` precompiles the complete unit_tests and
#    integration_tests executables and publishes digest-bound copies as an
#    immutable same-run artifact, overlapping claimed-profile and clippy work
#    after the shorter build-only producer. The test-binary job remains a
#    handoff consumer and does not publish inter-run state.
# 5. `fips-test` downloads the immutable same-run test artifacts by the
#    attempt-wildcard pattern `fips-test-binaries-${{ github.run_id }}-*`
#    with the same one-match flattened / multi-match child-directory layout.
#    It binds the attempt from `fips-test-identity` inside the bundle, selects
#    the newest matching attempt, and validates manifest/digests before
#    direct execution. A failed-job rerun can therefore reuse the artifact
#    from the successful, skipped `fips-test-build` prerequisite. This
#    transport is available on forced-cold and fork runs without publishing
#    shared cache.
# 6. `fips-build` keeps the `FIPS Build & Test` check name and fails closed,
#    including on the test-binary producer result.
#
# Ferrum Edge is not a validated cryptographic module and is not independently
# FIPS-certified. A green run here means the FIPS profile builds, links the
# selected AWS-LC FIPS implementation, passes its approved-mode self-test, and
# refuses every non-approved algorithm. It does not prove that the artifact and
# operating environment fall under a CMVP certificate. See docs/fips.md.

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  # Issue #4445: `FIPS Build & Test` is a branch-protection-required AND
  # publish-blocking check (`.github/required-publication-checks.json`), so
  # every `main` SHA must carry its own trusted, exact-SHA evidence. The
  # publication gate resolves this workflow's canonical `push` run for the
  # product commit; merge-group evidence is not enough, because the queue
  # reports against a synthesized commit and a commit that reaches `main`
  # outside the queue would carry none at all. This trigger is therefore
  # unconditional and carries NO `paths:` filter: a filtered required gate can
  # make publication evidence absent. On a `main` push `fips-plan` takes its
  # `--force-run` branch -- the one it uses for every event that is neither
  # `pull_request` nor `merge_group` -- so the full compile/claimed-check/
  # clippy/test gate always executes rather than a relevance decision.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_cold_cache:
        description: Skip cache restore to prove cold-path FIPS contracts
        type: boolean
        default: false
      warm_source_run_id:
        description: Exact prior FIPS workflow run ID to use as the warm source
        type: string
        required: false
        default: ""
      warm_source_run_attempt:
        description: Exact attempt number that published the warm-source artifact
        type: string
        required: false
        default: "1"

permissions:
  actions: read
  contents: read

concurrency:
  group: fips-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  FERRUM_CI_FORCE_COLD_CACHE: ${{ github.event.inputs.force_cold_cache == 'true' }}
  # Immutable producer handoff artifact: the exact compile-to-consumer channel
  # for this run AND the inter-run warm source for a later explicit workflow
  # dispatch. Unique per SHA + workflow run + attempt so a full-workflow rerun
  # republishes under a fresh name. Same-run consumers download by the
  # attempt-independent prefix pattern and promote the newest attempt, so a
  # failed-job rerun of a consumer can reuse the attempt the skipped producer
  # already published. Run artifacts are not repository cache entries: the
  # shared 10 GB cache quota's LRU eviction cannot drop them mid-run.
  # Pull-request workflows execute a synthetic merge SHA, while a later manual
  # warm run executes the selected branch head. Bind both event shapes to the
  # pull-request head so the explicit inter-run handoff remains addressable;
  # every other event keeps its native github.sha identity.
  FIPS_HANDOFF_ARTIFACT: fips-producer-handoff-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  FIPS_HANDOFF_ARTIFACT_PREFIX: fips-producer-handoff-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-

jobs:
  feature-policy:
    name: FIPS Feature Policy
    runs-on: ubuntu-latest
    # This job does not install sccache, so clear the checked-in rustc wrapper
    # from `.cargo/config.toml` rather than exec'ing a missing tool.
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Static manifest contract
        run: python3 .github/scripts/check_fips_feature_policy.py --manifest-check

      - name: Resolve the ordinary (crypto-ring) feature graph
        run: |
          cargo tree --color never -e normal,build --prefix none \
            -f '{p}|{f}' --locked > /tmp/tree-crypto-ring.txt

      - name: Audit the ordinary feature graph
        run: |
          python3 .github/scripts/check_fips_feature_policy.py \
            --tree /tmp/tree-crypto-ring.txt --profile crypto-ring

      - name: Audit every claimed FIPS feature combination
        # Feature resolution alone does not build `aws-lc-fips-sys`, so this
        # needs no C/Go toolchain. The committed lockfile pins this profile too.
        #
        # The combinations are enumerated by the checker itself
        # (`--list-claimed-profiles`) rather than duplicated in YAML, so a new
        # optional feature cannot be claimed as FIPS-clean in one place and go
        # unaudited in the other. `check_claimed_profiles_declared()` in the
        # static manifest step above additionally fails when an optional cargo
        # feature is named by no claimed profile at all — an unlisted feature is
        # an implicit support claim, which is exactly what this gate refuses.
        run: |
          set -euo pipefail
          status=0
          while IFS=$'\t' read -r label features; do
            [ -n "$features" ] || continue
            echo "::group::FIPS feature graph — ${label}"
            slug="$(printf '%s' "$features" | tr ',' '-')"
            cargo tree --color never -e normal,build --prefix none \
              -f '{p}|{f}' --locked \
              --no-default-features --features "$features" \
              > "/tmp/tree-${slug}.txt"
            if ! python3 .github/scripts/check_fips_feature_policy.py \
                --tree "/tmp/tree-${slug}.txt" --profile fips; then
              echo "::error::FIPS feature-graph audit failed for ${label} (--features ${features})"
              status=1
            fi
            echo "::endgroup::"
          done < <(python3 .github/scripts/check_fips_feature_policy.py --list-claimed-profiles)
          exit "$status"

  fips-plan:
    name: FIPS compile trigger
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for FIPS compile changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          changed_files="$RUNNER_TEMP/fips-build-changed-files.txt"
          rm -f -- "$changed_files"
          : > "$changed_files"

          filter_args=(--suite fips-build --changed-files "$changed_files")

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! printf '%s' "$BASE_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$'; then
              echo "::error::refusing to resolve an unsafe base ref" >&2
              exit 1
            fi
            case "$BASE_REF" in
              *..*|*//*|*/|*.lock|*/.*)
                echo "::error::refusing to resolve an unsafe base ref" >&2
                exit 1
                ;;
            esac
            fetched=false
            for attempt in 1 2 3; do
              if git fetch --no-tags --no-recurse-submodules origin \
                "+refs/heads/${BASE_REF}:refs/ferrum/trusted-base"; then
                fetched=true
                break
              fi
              echo "git fetch of ${BASE_REF} failed (attempt ${attempt}/3); retrying" >&2
              sleep $(( attempt * 10 ))
            done
            if [ "$fetched" != true ]; then
              echo "::error::git fetch of ${BASE_REF} failed after 3 attempts" >&2
              exit 1
            fi
            trusted_sha="$(git rev-parse --verify --quiet refs/ferrum/trusted-base^{commit} || true)"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            if ! printf '%s' "$MERGE_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::merge_group base_sha missing or malformed" >&2
              exit 1
            fi
            if ! git cat-file -e "${MERGE_BASE_SHA}^{commit}" 2>/dev/null; then
              fetched=false
              for attempt in 1 2 3; do
                if git fetch --no-tags --no-recurse-submodules origin \
                  "${MERGE_BASE_SHA}"; then
                  fetched=true
                  break
                fi
                echo "git fetch of merge_group base failed (attempt ${attempt}/3); retrying" >&2
                sleep $(( attempt * 10 ))
              done
              if [ "$fetched" != true ]; then
                echo "::error::git fetch of merge_group base_sha failed after 3 attempts" >&2
                exit 1
              fi
            fi
            trusted_sha="$MERGE_BASE_SHA"
          else
            trusted_sha="$(git rev-parse --verify --quiet 'HEAD^{commit}' || true)"
            filter_args+=(--force-run)
          fi

          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::trusted base did not resolve to a full commit id" >&2
            exit 1
          fi

          if ! git cat-file -e "${trusted_sha}:.github/scripts/ci_runtime_plan.py" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "trusted base has not adopted .github/scripts/ci_runtime_plan.py; running the full gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          entry="$(git ls-tree --full-tree "$trusted_sha" -- .github/scripts/ci_runtime_plan.py)"
          if [ "$(printf '%s\n' "$entry" | grep -c . || true)" != "1" ]; then
            echo "::error::.github/scripts/ci_runtime_plan.py is not a single tree entry at ${trusted_sha}" >&2
            exit 1
          fi
          entry_mode="$(printf '%s\n' "$entry" | awk '{print $1}')"
          entry_type="$(printf '%s\n' "$entry" | awk '{print $2}')"
          entry_object="$(printf '%s\n' "$entry" | awk '{print $3}')"
          entry_path="$(printf '%s\n' "$entry" | awk -F'\t' '{print $2}')"
          if [ "$entry_type" != "blob" ] || [ "$entry_path" != ".github/scripts/ci_runtime_plan.py" ]; then
            echo "::error::.github/scripts/ci_runtime_plan.py is not a blob at ${trusted_sha}" >&2
            exit 1
          fi
          case "$entry_mode" in
            100644|100755) ;;
            *)
              echo "::error::.github/scripts/ci_runtime_plan.py has non-regular mode ${entry_mode}" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$entry_object" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::.github/scripts/ci_runtime_plan.py did not resolve to an object id" >&2
            exit 1
          fi
          if [ "$(git cat-file -s "$entry_object")" -gt 262144 ]; then
            echo "::error::.github/scripts/ci_runtime_plan.py exceeds the 256 KiB trusted-filter ceiling" >&2
            exit 1
          fi

          # Keep every lookup, materialization, hash check, and execution path
          # literal and statically inspectable by the trusted Cross policy. A
          # mutable shell alias could otherwise decouple the validated base
          # blob's target from the PR-controlled path that is executed.
          proposed_entry="$(git ls-tree --full-tree HEAD -- .github/scripts/ci_runtime_plan.py)"
          if [[ "$proposed_entry" != "100644 blob "* && \
                "$proposed_entry" != "100755 blob "* ]]; then
            echo "::error::.github/scripts/ci_runtime_plan.py must be a regular blob in the proposed checkout" >&2
            exit 1
          fi
          git cat-file blob "$entry_object" > .github/scripts/ci_runtime_plan.py
          if [ "$(git hash-object .github/scripts/ci_runtime_plan.py)" != "$entry_object" ]; then
            echo "::error::failed to materialize the exact trusted planner blob" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            git diff --name-only --no-renames -z "${trusted_sha}...HEAD" \
              > "$changed_files"
          fi

          python3 -I .github/scripts/ci_runtime_plan.py --self-test
          plan="$(python3 -I .github/scripts/ci_runtime_plan.py "${filter_args[@]}")"
          relevant="$(printf '%s\n' "$plan" | sed -n 's/^relevant=//p')"
          case "$relevant" in
            true|false) ;;
            *)
              echo "::error::trusted relevance filter produced no usable verdict" >&2
              exit 1
              ;;
          esac
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevance decided by trusted base ${trusted_sha}." >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$plan" | sed -n '/^## /,$p' >> "$GITHUB_STEP_SUMMARY"

  fips-compile:
    name: FIPS compile
    needs: fips-plan
    if: needs.fips-plan.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: ./.github/actions/setup-sccache

      # Cargo fingerprints the resolved rustc-wrapper executable, including
      # its runner-local path and metadata. setup-sccache deliberately installs
      # into a fresh private directory, so carrying that wrapper identity into
      # Cargo would invalidate every restored Rust artifact on the next job or
      # runner. The exact target handoff is the compiler cache for this gate;
      # clear the wrapper before any Cargo/cache operation so its artifacts
      # retain the native rustc identity across trusted restores.
      - name: Stabilize Cargo compiler identity for exact-target reuse
        run: |
          set -euo pipefail
          if [ -n "${FERRUM_SCCACHE_BIN:-}" ] && [ -x "${FERRUM_SCCACHE_BIN}" ]; then
            "${FERRUM_SCCACHE_BIN}" --stop-server > /dev/null 2>&1 || true
          fi
          printf '%s\n' 'RUSTC_WRAPPER=' 'CARGO_BUILD_RUSTC_WRAPPER=' >> "$GITHUB_ENV"

      - name: Install aws-lc-fips-sys build prerequisites
        # The FIPS build of AWS-LC is compiled through the upstream crate's
        # source-build path. This is a functional CI gate; certificate
        # applicability still depends on the vendor security policy and the
        # deployment's exact module version and operating environment.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build golang-go libcurl4-openssl-dev protobuf-compiler zstd

      - uses: ./.github/actions/setup-fast-linker

      # Stable dependency/compiler fallback. The contract discriminator lives in
      # `shared-key` because pinned rust-cache ignores `key` whenever
      # `shared-key` is set. Do not add `key:` or `add-job-id-key`. Automatic
      # env/manifest/lock hashing remains enabled. This key is not SHA-scoped.
      - name: Cache FIPS Rust, AWS-LC, and sccache outputs
        if: github.event.inputs.force_cold_cache != 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-fips-contract-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'build.rs', '.github/workflows/fips-build.yml', '.github/scripts/check_fips_feature_policy.py', 'src/fips/**', 'vendor/**') }}
          cache-directories: ${{ github.workspace }}/.cache/sccache
          cache-on-failure: "true"
          save-if: ${{ github.event.pull_request.head.repo.fork != true }}

      - name: Record rust-cache restore
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit "$CACHE_HIT" \
            --path "${GITHUB_WORKSPACE}/.cache/sccache" \
            --note "layer=stable-fallback; measured=sccache-directory-subset; rust-cache Cargo/target archive bytes are not exposed; shared-key=ci-fips-contract save-if=non-fork fork=${FORK_PR:-false}"

      # The stable cache crosses runners. AWS-LC's CMake build tree does not:
      # an incremental rerun can feed the restored libbcm archive back through
      # delocate and reject debug `.loc` directives that the original clean
      # build accepted. Keep installed libraries and Rust outputs warm, but
      # force any later aws-lc-fips-sys build-script rerun to start from a clean
      # CMake tree. Any exact artifact promotion happens later and replaces target.
      - name: Quarantine restored AWS-LC FIPS CMake state
        if: github.event.inputs.force_cold_cache != 'true'
        run: |
          set -euo pipefail
          target_root="${GITHUB_WORKSPACE}/target"
          if [ -L "$target_root" ]; then
            echo "::error::restored FIPS target must not be a symlink" >&2
            exit 1
          fi
          if [ ! -e "$target_root" ]; then
            echo "rust-cache restore contains no target tree; no AWS-LC CMake state to quarantine."
            exit 0
          fi
          if [ ! -d "$target_root" ]; then
            echo "::error::restored FIPS target must be a real directory" >&2
            exit 1
          fi
          listing="$(mktemp "${RUNNER_TEMP}/fips-aws-lc-cmake-roots.XXXXXX")"
          trap 'rm -f "$listing"' EXIT
          if ! find "$target_root" -xdev \
            -path '*/build/aws-lc-fips-sys-*/out/build' -prune -print0 \
            >"$listing"; then
            echo "::error::failed to enumerate restored AWS-LC CMake state" >&2
            exit 1
          fi
          quarantined=0
          while IFS= read -r -d '' cmake_root; do
            case "$cmake_root" in
              "$target_root"/*/build/aws-lc-fips-sys-*/out/build) ;;
              *)
                echo "::error::AWS-LC CMake quarantine escaped the FIPS target" >&2
                exit 1
                ;;
            esac
            if [ ! -d "$cmake_root" ] || [ -L "$cmake_root" ]; then
              echo "::error::restored AWS-LC CMake state must be a real directory" >&2
              exit 1
            fi
            rm -rf -- "$cmake_root"
            quarantined=$((quarantined + 1))
          done <"$listing"
          rm -f "$listing"
          trap - EXIT
          echo "Quarantined ${quarantined} restored AWS-LC FIPS CMake build tree(s)."

      # Full reruns delete artifacts from earlier attempts of the same run.
      # Warm evidence therefore chains separate workflow_dispatch runs, naming
      # the exact preceding run and attempt. The action receives a read-only
      # token internally; no PR-controlled run step receives GITHUB_TOKEN.
      - name: Download exact inter-run FIPS handoff artifact
        if: github.event.inputs.force_cold_cache != 'true' && github.event_name == 'workflow_dispatch' && inputs.warm_source_run_id != ''
        id: inter-run-fips-handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fips-producer-handoff-${{ github.event.pull_request.head.sha || github.sha }}-${{ inputs.warm_source_run_id }}-${{ inputs.warm_source_run_attempt }}
          path: ${{ runner.temp }}/inter-run-fips-handoff
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.warm_source_run_id }}

      - name: Promote exact inter-run FIPS handoff artifact
        if: github.event.inputs.force_cold_cache != 'true' && github.event_name == 'workflow_dispatch' && inputs.warm_source_run_id != '' && steps.inter-run-fips-handoff.outcome == 'success'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_RUN_ID: ${{ inputs.warm_source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.warm_source_run_attempt }}
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/inter-run-fips-handoff"
          archive="${source_root}/fips-producer-handoff.tar.zst"
          if [ ! -f "$archive" ] || [ -L "$archive" ]; then
            echo "::error::inter-run FIPS handoff is missing its real tar.zst payload" >&2
            exit 1
          fi
          extract_root="${RUNNER_TEMP}/inter-run-fips-extracted"
          rm -rf "$extract_root"
          mkdir -p "$extract_root"

          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          reject_hostile_tar_member() {
            local member="$1"
            case "$member" in
              ''|.|..)
                fail "producer handoff archive member is malformed"
                ;;
              *[![:print:]]*|*\\*)
                fail "producer handoff archive member is malformed"
                ;;
              /*)
                fail "producer handoff archive member uses an absolute path"
                ;;
            esac
            local part
            local IFS='/'
            for part in $member; do
              case "$part" in
                ''|.|..|*[![:print:]]*|*\\*)
                  fail "producer handoff archive member uses path traversal"
                  ;;
              esac
            done
          }

          listing_tmp="$(mktemp "${RUNNER_TEMP}/fips-tar-listing.XXXXXX")"
          verbose_tmp="$(mktemp "${RUNNER_TEMP}/fips-tar-verbose.XXXXXX")"
          identity_verbose_tmp="$(mktemp "${RUNNER_TEMP}/fips-tar-identity-verbose.XXXXXX")"
          if ! tar --zstd -tf "$archive" >"$listing_tmp"; then
            rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
            fail "producer handoff archive listing failed"
          fi
          if ! tar --zstd -tvf "$archive" >"$verbose_tmp"; then
            rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
            fail "producer handoff archive verbose listing failed"
          fi
          name_count=0
          verbose_count=0
          identity_count=0
          identity_verbose_count=0
          while IFS= read -r member || [ -n "$member" ]; do
            reject_hostile_tar_member "$member"
            name_count=$((name_count + 1))
            if [ "$member" = "fips-producer-identity" ]; then
              identity_count=$((identity_count + 1))
            fi
          done <"$listing_tmp"
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              '') continue ;;
              [-]*|d*) ;;
              *)
                rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
                fail "producer handoff archive contains a non-file member"
                ;;
            esac
            verbose_count=$((verbose_count + 1))
          done <"$verbose_tmp"
          if [ "$name_count" -eq 0 ] || [ "$verbose_count" -ne "$name_count" ]; then
            rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
            fail "producer handoff archive listing is inconsistent"
          fi
          if [ "$identity_count" -ne 1 ]; then
            rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
            fail "producer handoff archive identity member is missing or ambiguous"
          fi
          if ! tar --zstd -tvf "$archive" fips-producer-identity >"$identity_verbose_tmp"; then
            rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
            fail "producer handoff archive identity member listing failed"
          fi
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              '') continue ;;
              -*) identity_verbose_count=$((identity_verbose_count + 1)) ;;
              *)
                rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
                fail "producer handoff archive identity member is not a regular file"
                ;;
            esac
          done <"$identity_verbose_tmp"
          if [ "$identity_verbose_count" -ne 1 ]; then
            rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
            fail "producer handoff archive identity member is missing or ambiguous"
          fi
          rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
          tar --zstd --no-same-owner -xf "$archive" -C "$extract_root"
          for path in target .cache/sccache; do
            source_path="${extract_root}/${path}"
            if [ ! -d "$source_path" ] || [ -L "$source_path" ]; then
              echo "::error::inter-run FIPS handoff is missing a real ${path} directory" >&2
              exit 1
            fi
          done
          tree_manifest="${extract_root}/fips-producer-source-tree"
          if [ ! -f "$tree_manifest" ] || [ -L "$tree_manifest" ]; then
            echo "::error::inter-run FIPS handoff is missing its real source-tree manifest" >&2
            exit 1
          fi
          archived_tree="$(cat "$tree_manifest")"
          line_count="$(wc -l < "$tree_manifest")"
          if [ "$line_count" -ne 1 ] || [ "${#archived_tree}" -ne 40 ] || \
             [[ "$archived_tree" == *[!0-9a-f]* ]]; then
            echo "::error::inter-run FIPS handoff source-tree manifest is malformed" >&2
            exit 1
          fi
          identity="${extract_root}/fips-producer-identity"
          if [ ! -f "$identity" ] || [ -L "$identity" ]; then
            echo "::error::inter-run FIPS handoff is missing its real identity manifest" >&2
            exit 1
          fi
          case "$SOURCE_SHA" in
            *[!0-9a-f]*)
              echo "::error::inter-run FIPS handoff consumer source SHA is malformed" >&2
              exit 1
              ;;
          esac
          if [ "${#SOURCE_SHA}" -ne 40 ]; then
            echo "::error::inter-run FIPS handoff consumer source SHA is malformed" >&2
            exit 1
          fi
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*|0*)
              echo "::error::inter-run FIPS handoff source run id is malformed" >&2
              exit 1
              ;;
          esac
          case "$SOURCE_RUN_ATTEMPT" in
            ''|*[!0-9]*|0*)
              echo "::error::inter-run FIPS handoff source attempt is malformed" >&2
              exit 1
              ;;
          esac
          expected_identity="$(printf 'source_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$SOURCE_SHA" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT")"
          if [ "$(cat "$identity")" != "$expected_identity" ]; then
            echo "::error::inter-run FIPS handoff identity does not match the named source artifact" >&2
            exit 1
          fi
          current_tree="$(git rev-parse HEAD^{tree})"
          if [ "$archived_tree" != "$current_tree" ]; then
            echo "::error::inter-run FIPS handoff source tree does not match this checkout; refusing stale-base reuse" >&2
            exit 1
          fi
          if ! git diff --quiet --no-ext-diff || \
             ! git diff --cached --quiet --no-ext-diff; then
            echo "::error::tracked checkout content changed before FIPS handoff promotion" >&2
            exit 1
          fi
          rm -rf "${GITHUB_WORKSPACE}/target" "${GITHUB_WORKSPACE}/.cache/sccache"
          mkdir -p "${GITHUB_WORKSPACE}/.cache"
          mv "${extract_root}/target" "${GITHUB_WORKSPACE}/target"
          mv "${extract_root}/.cache/sccache" "${GITHUB_WORKSPACE}/.cache/sccache"
          # Checkout gives the identical source tree fresh mtimes. The handoff
          # is already bound to this exact head/run/attempt, so make its regular
          # outputs newer only after validating the restored executable. This
          # prevents Cargo from relinking exact-head outputs as merely stale.
          target_root="${GITHUB_WORKSPACE}/target"
          fips_binary="${target_root}/debug/ferrum-edge"
          if [ ! -d "$target_root" ] || [ -L "$target_root" ] || \
             [ ! -f "$fips_binary" ] || [ -L "$fips_binary" ] || \
             [ ! -x "$fips_binary" ]; then
            echo "::error::exact inter-run FIPS target is missing its executable; refusing to refresh restored mtimes" >&2
            exit 1
          fi
          mtime_reference="${RUNNER_TEMP}/fips-target-mtime-reference"
          rm -f "$mtime_reference"
          touch "$mtime_reference"
          find "$target_root" -xdev -type f \
            -exec touch --reference="$mtime_reference" -- {} +
          rm -f "$mtime_reference"

      - name: Record inter-run FIPS handoff restore
        if: github.event.inputs.force_cold_cache != 'true' && github.event_name == 'workflow_dispatch' && inputs.warm_source_run_id != ''
        env:
          SOURCE_RUN_ID: ${{ inputs.warm_source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.warm_source_run_attempt }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name inter-run-fips-handoff \
            --hit true \
            --path "${GITHUB_WORKSPACE}/target" \
            --note "layer=inter-run-artifact; measured=target-directory; source_run=${SOURCE_RUN_ID}; source_attempt=${SOURCE_RUN_ATTEMPT}"

      - name: Record absent inter-run FIPS handoff
        if: github.event.inputs.force_cold_cache != 'true' && (github.event_name != 'workflow_dispatch' || inputs.warm_source_run_id == '')
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name inter-run-fips-handoff \
            --hit false \
            --bytes 0 \
            --note "layer=inter-run-artifact; no explicit warm source requested"

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit false \
            --bytes 0 \
            --note "layer=stable-fallback; force_cold_cache skipped restore"
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name inter-run-fips-handoff \
            --hit false \
            --bytes 0 \
            --note "layer=inter-run-artifact; force_cold_cache skipped download"
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-producer \
            --hit false \
            --bytes 0 \
            --note "layer=producer; force_cold_cache skipped handoff publish"

      - name: Assert cache-service credentials are absent
        run: |
          set -euo pipefail
          leaked=0
          for var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
            if [ -n "${!var:-}" ]; then
              echo "::error::${var} is present in this run environment; refusing to execute later PR-controlled build steps with a cache-service credential" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi

      - name: Build the FIPS profile
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-build
          set +e
          cargo build --locked --no-default-features --features fips --bin ferrum-edge
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-build --status "$status"
          exit "$status"

      # Exact producer archive: full workspace target + sccache as left by this
      # successful profile build, plus the checkout's Git tree identity.
      # Test-binary precompile is a parallel consumer so claimed-profile and
      # clippy work do not wait on it. Artifact ZIP extraction normalizes
      # permissions, so the producer tree is packaged as a zstd tar first and
      # executable modes inside target survive the handoff.
      - name: Package FIPS producer handoff
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/fips-producer-handoff.tar.zst"
          tree_manifest="${RUNNER_TEMP}/fips-producer-source-tree"
          identity="${RUNNER_TEMP}/fips-producer-identity"
          rm -f "$archive" "$tree_manifest" "$identity"
          if ! git diff --quiet --no-ext-diff || \
             ! git diff --cached --quiet --no-ext-diff; then
            echo "::error::tracked checkout content changed while building the FIPS producer" >&2
            exit 1
          fi
          source_tree="$(git rev-parse HEAD^{tree})"
          if [ "${#source_tree}" -ne 40 ] || [[ "$source_tree" == *[!0-9a-f]* ]]; then
            echo "::error::failed to resolve the FIPS producer source tree" >&2
            exit 1
          fi
          case "$SOURCE_SHA" in
            *[!0-9a-f]*)
              echo "::error::failed to resolve the FIPS producer source SHA" >&2
              exit 1
              ;;
          esac
          if [ "${#SOURCE_SHA}" -ne 40 ]; then
            echo "::error::failed to resolve the FIPS producer source SHA" >&2
            exit 1
          fi
          case "$RUN_ID" in
            ''|*[!0-9]*|0*)
              echo "::error::failed to resolve the FIPS producer run id" >&2
              exit 1
              ;;
          esac
          case "$RUN_ATTEMPT" in
            ''|*[!0-9]*|0*)
              echo "::error::failed to resolve the FIPS producer run attempt" >&2
              exit 1
              ;;
          esac
          printf 'source_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$SOURCE_SHA" "$RUN_ID" "$RUN_ATTEMPT" > "$identity"
          printf '%s\n' "$source_tree" > "$tree_manifest"
          # Cargo may hard-link identical build outputs. Store each link as an
          # independent regular-file member so consumers never need to admit
          # archive link targets into the trusted handoff surface.
          tar --zstd --hard-dereference -cf "$archive" -C "$RUNNER_TEMP" \
            fips-producer-identity fips-producer-source-tree \
            -C "$GITHUB_WORKSPACE" target .cache/sccache
          rm -f "$tree_manifest" "$identity"
          if [ ! -s "$archive" ] || [ -L "$archive" ]; then
            echo "::error::failed to create a real FIPS producer handoff archive" >&2
            exit 1
          fi

      # Unlike the repository cache, this immutable run artifact is not subject
      # to cache-LRU churn from concurrent PR jobs. It is exact to the SHA, run,
      # and attempt, and download-artifact verifies its service digest. This is
      # the same-run compile-to-consumer channel and the inter-run warm source.
      - name: Publish FIPS producer handoff
        if: github.event.inputs.force_cold_cache != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.FIPS_HANDOFF_ARTIFACT }}
          path: ${{ runner.temp }}/fips-producer-handoff.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Record sccache stats
        if: always()
        run: |
          sccache_bin="${FERRUM_SCCACHE_BIN:-}"
          if [ -n "$sccache_bin" ] && [ -x "$sccache_bin" ]; then
            "$sccache_bin" --show-stats || true
          fi
          python3 .github/scripts/ci_runtime_telemetry.py summarize --title "FIPS compile"

  fips-claimed-checks:
    name: FIPS claimed feature combinations (${{ matrix.shard_name }})
    needs: fips-compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_name: 1-of-3
          - shard_index: 1
            shard_name: 2-of-3
          - shard_index: 2
            shard_name: 3-of-3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: ./.github/actions/setup-sccache

      - name: Stabilize Cargo compiler identity for exact-target reuse
        run: |
          set -euo pipefail
          if [ -n "${FERRUM_SCCACHE_BIN:-}" ] && [ -x "${FERRUM_SCCACHE_BIN}" ]; then
            "${FERRUM_SCCACHE_BIN}" --stop-server > /dev/null 2>&1 || true
          fi
          printf '%s\n' 'RUSTC_WRAPPER=' 'CARGO_BUILD_RUSTC_WRAPPER=' >> "$GITHUB_ENV"

      - name: Install aws-lc-fips-sys build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build golang-go libcurl4-openssl-dev protobuf-compiler zstd

      - uses: ./.github/actions/setup-fast-linker

      - name: Cache FIPS Rust, AWS-LC, and sccache outputs
        if: github.event.inputs.force_cold_cache != 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-fips-contract-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'build.rs', '.github/workflows/fips-build.yml', '.github/scripts/check_fips_feature_policy.py', 'src/fips/**', 'vendor/**') }}
          cache-directories: ${{ github.workspace }}/.cache/sccache
          cache-on-failure: "true"
          save-if: "false"

      - name: Record rust-cache restore
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit "$CACHE_HIT" \
            --path "${GITHUB_WORKSPACE}/.cache/sccache" \
            --note "layer=stable-fallback; measured=sccache-directory-subset; rust-cache Cargo/target archive bytes are not exposed; save-if=false fork=${FORK_PR:-false}"

      # The stable rust-cache fallback may have restored an inter-commit
      # target/sccache tree. Drop it before promotion so the exact producer
      # tree cannot mix with stale fallback outputs. Runs for fork PRs too:
      # the artifact channel, unlike the former cache channel, is fork-usable.
      - name: Drop stable target before producer promotion
        if: github.event.inputs.force_cold_cache != 'true'
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}/target" "${GITHUB_WORKSPACE}/.cache/sccache"

      # Same-run producer channel: download every handoff attempt this source
      # SHA/run_id has published. The pattern is attempt-independent, so a
      # failed-job rerun at a later attempt still finds the artifact the
      # skipped producer published earlier. The pinned action flattens one
      # match into the channel directory and creates per-artifact children
      # when several attempts exist; promotion below admits both layouts.
      - name: Download FIPS producer handoff
        if: github.event.inputs.force_cold_cache != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ env.FIPS_HANDOFF_ARTIFACT_PREFIX }}*
          path: ${{ runner.temp }}/fips-producer-channel
          merge-multiple: false

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit false \
            --bytes 0 \
            --note "layer=stable-fallback; force_cold_cache skipped restore"
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-producer \
            --hit false \
            --bytes 0 \
            --note "layer=producer; force_cold_cache skipped handoff download"

      # Promote the newest published handoff attempt for this source
      # SHA/run_id. Attempt identity is read from the tar's
      # fips-producer-identity member, never from this consumer's
      # github.run_attempt. The archive is validated (exact channel shape,
      # real tar payload, matching payload/directory identity, real restored
      # directories, matching source-tree identity, clean checkout, real
      # executable) before its regular target files receive one common
      # reference timestamp — checkout gives identical sources newer mtimes,
      # and Cargo would otherwise relink exact restored outputs as stale.
      - name: Promote same-run FIPS producer handoff
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          PREFIX: ${{ env.FIPS_HANDOFF_ARTIFACT_PREFIX }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          channel_root="${RUNNER_TEMP}/fips-producer-channel"
          payload_name="fips-producer-handoff.tar.zst"
          identity_member="fips-producer-identity"
          payload_dir=""
          selected_attempt=0

          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          is_real_dir() {
            [ -d "$1" ] && [ ! -L "$1" ]
          }

          is_real_file() {
            [ -f "$1" ] && [ ! -L "$1" ]
          }

          is_positive_decimal() {
            case "$1" in
              ''|*[!0-9]*|0*) return 1 ;;
            esac
            return 0
          }

          is_sha40() {
            [ "${#1}" -eq 40 ] || return 1
            case "$1" in
              *[!0-9a-f]*) return 1 ;;
            esac
            return 0
          }

          collect_entries() {
            local root="$1"
            shopt -s nullglob dotglob
            collected_entries=("$root"/*)
            shopt -u nullglob dotglob
          }

          if ! is_sha40 "$SOURCE_SHA"; then
            fail "consumer event-stable source SHA is malformed"
          fi
          if ! is_positive_decimal "$RUN_ID"; then
            fail "consumer workflow run id is malformed"
          fi
          if [ "$PREFIX" != "fips-producer-handoff-${SOURCE_SHA}-${RUN_ID}-" ]; then
            fail "producer handoff prefix does not match this source SHA/run_id"
          fi

          read_identity_file() {
            local identity="$1"
            identity_source_sha=""
            identity_run_id=""
            identity_attempt=""
            local line_count=0
            local line
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                *$'\r'*)
                  fail "same-run FIPS producer handoff identity manifest is malformed"
                  ;;
              esac
              line_count=$((line_count + 1))
              case "$line" in
                source_sha=*) identity_source_sha="${line#source_sha=}" ;;
                run_id=*) identity_run_id="${line#run_id=}" ;;
                run_attempt=*) identity_attempt="${line#run_attempt=}" ;;
                *)
                  fail "same-run FIPS producer handoff identity manifest is malformed"
                  ;;
              esac
            done < "$identity"
            if [ "$line_count" -ne 3 ] || \
               ! is_sha40 "$identity_source_sha" || \
               ! is_positive_decimal "$identity_run_id" || \
               ! is_positive_decimal "$identity_attempt"; then
              fail "same-run FIPS producer handoff identity manifest is malformed"
            fi
            expected_identity="$(printf 'source_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
              "$identity_source_sha" "$identity_run_id" "$identity_attempt")"
            if [ "$(cat "$identity")" != "$expected_identity" ]; then
              fail "same-run FIPS producer handoff identity manifest is malformed"
            fi
            if [ "$identity_source_sha" != "$SOURCE_SHA" ]; then
              fail "producer handoff identity source SHA does not match this checkout event"
            fi
            if [ "$identity_run_id" != "$RUN_ID" ]; then
              fail "producer handoff identity run id does not match this workflow run"
            fi
          }

          reject_hostile_tar_member() {
            local member="$1"
            case "$member" in
              ''|.|..)
                fail "producer handoff archive member is malformed"
                ;;
              *[![:print:]]*|*\\*)
                fail "producer handoff archive member is malformed"
                ;;
              /*)
                fail "producer handoff archive member uses an absolute path"
                ;;
            esac
            local part
            local IFS='/'
            for part in $member; do
              case "$part" in
                ''|.|..|*[![:print:]]*|*\\*)
                  fail "producer handoff archive member uses path traversal"
                  ;;
              esac
            done
          }

          assert_identity_member() {
            local archive="$1"
            local expected="$2"
            local listing_tmp verbose_tmp identity_verbose_tmp
            local member line
            local name_count=0 verbose_count=0 identity_count=0 identity_verbose_count=0
            listing_tmp="$(mktemp "${RUNNER_TEMP}/fips-tar-listing.XXXXXX")"
            verbose_tmp="$(mktemp "${RUNNER_TEMP}/fips-tar-verbose.XXXXXX")"
            identity_verbose_tmp="$(mktemp "${RUNNER_TEMP}/fips-tar-identity-verbose.XXXXXX")"
            if ! tar --zstd -tf "$archive" >"$listing_tmp"; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive listing failed"
            fi
            if ! tar --zstd -tvf "$archive" >"$verbose_tmp"; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive verbose listing failed"
            fi
            while IFS= read -r member || [ -n "$member" ]; do
              reject_hostile_tar_member "$member"
              name_count=$((name_count + 1))
              if [ "$member" = "$expected" ]; then
                identity_count=$((identity_count + 1))
              fi
            done <"$listing_tmp"
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                '') continue ;;
                [-]*|d*) ;;
                *)
                  rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
                  fail "producer handoff archive contains a non-file member"
                  ;;
              esac
              verbose_count=$((verbose_count + 1))
            done <"$verbose_tmp"
            if [ "$name_count" -eq 0 ] || [ "$verbose_count" -ne "$name_count" ]; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive listing is inconsistent"
            fi
            if [ "$identity_count" -ne 1 ]; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive identity member is missing or ambiguous"
            fi
            if ! tar --zstd -tvf "$archive" "$expected" >"$identity_verbose_tmp"; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive identity member listing failed"
            fi
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                '') continue ;;
                -*) identity_verbose_count=$((identity_verbose_count + 1)) ;;
                *)
                  rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
                  fail "producer handoff archive identity member is not a regular file"
                  ;;
              esac
            done <"$identity_verbose_tmp"
            if [ "$identity_verbose_count" -ne 1 ]; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive identity member is missing or ambiguous"
            fi
            rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
          }

          extract_identity() {
            local archive="$1"
            local dest="$2"
            rm -rf "$dest"
            mkdir -p "$dest"
            if ! is_real_dir "$dest"; then
              fail "failed to create producer handoff identity extract directory"
            fi
            assert_identity_member "$archive" "$identity_member"
            tar --zstd --no-same-owner \
              -xf "$archive" -C "$dest" "$identity_member"
            local identity="${dest}/${identity_member}"
            if ! is_real_file "$identity"; then
              fail "same-run FIPS producer handoff is missing its real identity manifest"
            fi
            collect_entries "$dest"
            if [ "${#collected_entries[@]}" -ne 1 ] || \
               [ "$(basename "${collected_entries[0]}")" != "$identity_member" ]; then
              fail "producer handoff identity extract contained unexpected paths"
            fi
            read_identity_file "$identity"
          }

          admit_payload_dir() {
            local candidate="$1"
            local directory_attempt="${2:-}"
            if ! is_real_dir "$candidate"; then
              fail "producer handoff payload directory is not a real directory"
            fi
            collect_entries "$candidate"
            if [ "${#collected_entries[@]}" -ne 1 ]; then
              fail "producer handoff payload directory has an unexpected entry shape"
            fi
            local archive="${collected_entries[0]}"
            if [ "$(basename "$archive")" != "$payload_name" ] || ! is_real_file "$archive"; then
              fail "same-run FIPS producer handoff is missing its real tar.zst payload"
            fi
            local channel_abs candidate_abs archive_dir_abs
            channel_abs="$(cd "$channel_root" && pwd -P)"
            candidate_abs="$(cd "$candidate" && pwd -P)"
            archive_dir_abs="$(cd "$(dirname "$archive")" && pwd -P)"
            case "$candidate_abs" in
              "$channel_abs"|"$channel_abs"/*) ;;
              *) fail "producer handoff payload directory escaped channel root" ;;
            esac
            if [ "$archive_dir_abs" != "$candidate_abs" ]; then
              fail "producer handoff payload escaped its artifact directory"
            fi
            extract_identity "$archive" "${RUNNER_TEMP}/fips-producer-identity-extract"
            if [ -n "$directory_attempt" ] && [ "$identity_attempt" != "$directory_attempt" ]; then
              fail "producer handoff directory attempt does not match payload identity"
            fi
          }

          if [ -L "$channel_root" ]; then
            fail "producer handoff channel must not be a symlink"
          fi
          if ! is_real_dir "$channel_root"; then
            fail "fips-compile producer handoff was not published for this event-stable source SHA/run_id; refusing to claim compile-to-consumer reuse"
          fi
          collect_entries "$channel_root"
          if [ "${#collected_entries[@]}" -eq 0 ]; then
            fail "fips-compile producer handoff was not published for this event-stable source SHA/run_id; refusing to claim compile-to-consumer reuse"
          fi
          file_count=0
          dir_count=0
          for entry in "${collected_entries[@]}"; do
            if [ -L "$entry" ]; then
              fail "producer handoff channel contains a symlink"
            fi
            if [ -f "$entry" ]; then
              file_count=$((file_count + 1))
            elif [ -d "$entry" ]; then
              dir_count=$((dir_count + 1))
            else
              fail "producer handoff channel contains an unexpected entry type"
            fi
          done
          if [ "$file_count" -gt 0 ] && [ "$dir_count" -gt 0 ]; then
            fail "producer handoff channel mixes files and directories"
          fi
          if [ "$dir_count" -eq 0 ]; then
            if [ "$file_count" -ne 1 ]; then
              fail "producer handoff channel flattened layout is malformed"
            fi
            admit_payload_dir "$channel_root" ""
            payload_dir="$channel_root"
            selected_attempt="$identity_attempt"
          else
            for candidate in "${collected_entries[@]}"; do
              name="$(basename "$candidate")"
              case "$name" in
                "$PREFIX"*) ;;
                *)
                  fail "producer handoff channel contains an unexpected artifact name"
                  ;;
              esac
              attempt="${name#"$PREFIX"}"
              if ! is_positive_decimal "$attempt"; then
                fail "producer handoff channel contains a malformed attempt"
              fi
              admit_payload_dir "$candidate" "$attempt"
              if [ "$identity_attempt" -gt "$selected_attempt" ]; then
                selected_attempt="$identity_attempt"
                payload_dir="$candidate"
              fi
            done
          fi
          if [ -z "$payload_dir" ] || ! is_positive_decimal "$selected_attempt"; then
            fail "fips-compile producer handoff was not published for this event-stable source SHA/run_id; refusing to claim compile-to-consumer reuse"
          fi
          echo "Promoting FIPS producer handoff attempt ${selected_attempt}."
          archive="${payload_dir}/fips-producer-handoff.tar.zst"
          if [ ! -f "$archive" ] || [ -L "$archive" ]; then
            echo "::error::same-run FIPS producer handoff is missing its real tar.zst payload" >&2
            exit 1
          fi
          extract_root="${RUNNER_TEMP}/fips-producer-extracted"
          rm -rf "$extract_root"
          mkdir -p "$extract_root"
          tar --zstd --no-same-owner -xf "$archive" -C "$extract_root"
          for path in target .cache/sccache; do
            source_path="${extract_root}/${path}"
            if [ ! -d "$source_path" ] || [ -L "$source_path" ]; then
              echo "::error::same-run FIPS producer handoff is missing a real ${path} directory" >&2
              exit 1
            fi
          done
          tree_manifest="${extract_root}/fips-producer-source-tree"
          if [ ! -f "$tree_manifest" ] || [ -L "$tree_manifest" ]; then
            echo "::error::same-run FIPS producer handoff is missing its real source-tree manifest" >&2
            exit 1
          fi
          archived_tree="$(cat "$tree_manifest")"
          line_count="$(wc -l < "$tree_manifest")"
          if [ "$line_count" -ne 1 ] || [ "${#archived_tree}" -ne 40 ] || \
             [[ "$archived_tree" == *[!0-9a-f]* ]]; then
            echo "::error::same-run FIPS producer handoff source-tree manifest is malformed" >&2
            exit 1
          fi
          extracted_identity="${extract_root}/fips-producer-identity"
          if [ ! -f "$extracted_identity" ] || [ -L "$extracted_identity" ]; then
            echo "::error::same-run FIPS producer handoff is missing its real identity manifest" >&2
            exit 1
          fi
          read_identity_file "$extracted_identity"
          if [ "$identity_attempt" != "$selected_attempt" ]; then
            echo "::error::producer handoff extracted identity does not match the selected attempt" >&2
            exit 1
          fi
          current_tree="$(git rev-parse HEAD^{tree})"
          if [ "$archived_tree" != "$current_tree" ]; then
            echo "::error::same-run FIPS producer handoff source tree does not match this checkout; refusing stale-base reuse" >&2
            exit 1
          fi
          if ! git diff --quiet --no-ext-diff || \
             ! git diff --cached --quiet --no-ext-diff; then
            echo "::error::tracked checkout content changed before FIPS handoff promotion" >&2
            exit 1
          fi
          rm -rf "${GITHUB_WORKSPACE}/target" "${GITHUB_WORKSPACE}/.cache/sccache"
          mkdir -p "${GITHUB_WORKSPACE}/.cache"
          mv "${extract_root}/target" "${GITHUB_WORKSPACE}/target"
          mv "${extract_root}/.cache/sccache" "${GITHUB_WORKSPACE}/.cache/sccache"
          # The promoted handoff is bound to this source SHA/run_id tree.
          # Refresh only regular target files after the executable proof so
          # newer checkout mtimes do not force Cargo to relink identical
          # outputs.
          target_root="${GITHUB_WORKSPACE}/target"
          fips_binary="${target_root}/debug/ferrum-edge"
          if [ ! -d "$target_root" ] || [ -L "$target_root" ] || \
             [ ! -f "$fips_binary" ] || [ -L "$fips_binary" ] || \
             [ ! -x "$fips_binary" ]; then
            echo "::error::same-run FIPS target is missing its executable; refusing to refresh restored mtimes" >&2
            exit 1
          fi
          mtime_reference="${RUNNER_TEMP}/fips-target-mtime-reference"
          rm -f "$mtime_reference"
          touch "$mtime_reference"
          find "$target_root" -xdev -type f \
            -exec touch --reference="$mtime_reference" -- {} +
          rm -f "$mtime_reference"

      - name: Record same-run FIPS producer handoff
        if: github.event.inputs.force_cold_cache != 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-producer \
            --hit true \
            --path "${GITHUB_WORKSPACE}/target" \
            --note "layer=producer; measured=target-directory; transport=same-run-artifact; sccache promoted from the same handoff"

      - name: Assert cache-service credentials are absent
        run: |
          set -euo pipefail
          leaked=0
          for var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
            if [ -n "${!var:-}" ]; then
              echo "::error::${var} is present in this run environment; refusing to execute later PR-controlled build steps with a cache-service credential" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi

      - name: Compile every crypto-relevant optional FIPS combination
        # `cargo check` proves each claimed cryptographic combination while
        # avoiding redundant binary links. Three deterministic ordinal shards
        # keep the warm gate below its wall-time target without duplicating the
        # checker-owned profile inventory in workflow YAML. The cloud-secrets
        # profile remains compile-covered even though runtime policy refuses it.
        env:
          FIPS_CLAIMED_SHARD_INDEX: ${{ matrix.shard_index }}
          FIPS_CLAIMED_SHARD_COUNT: 3
        run: |
          set -euo pipefail
          case "${FIPS_CLAIMED_SHARD_INDEX}:${FIPS_CLAIMED_SHARD_COUNT}" in
            0:3|1:3|2:3) ;;
            *)
              echo "::error::invalid FIPS claimed-profile shard contract" >&2
              exit 1
              ;;
          esac
          phase="fips-claimed-checks-${FIPS_CLAIMED_SHARD_INDEX}"
          python3 .github/scripts/ci_runtime_telemetry.py start --phase "$phase"
          profiles_file="$(mktemp)"
          trap 'rm -f "$profiles_file"' EXIT
          python3 .github/scripts/check_fips_feature_policy.py \
            --list-claimed-profiles > "$profiles_file"
          status=0
          profile_index=0
          selected=0
          while IFS=$'\t' read -r label features; do
            [ -n "$features" ] || continue
            if [ $((profile_index % FIPS_CLAIMED_SHARD_COUNT)) -eq "$FIPS_CLAIMED_SHARD_INDEX" ]; then
              selected=$((selected + 1))
              echo "::group::cargo check — ${label}"
              if ! cargo check --locked --no-default-features --features "$features" \
                --lib --bins; then
                echo "::error::FIPS claimed-profile compile failed for ${label} (--features ${features})"
                status=1
              fi
              echo "::endgroup::"
            fi
            profile_index=$((profile_index + 1))
          done < "$profiles_file"
          if [ "$profile_index" -eq 0 ] || [ "$selected" -eq 0 ]; then
            echo "::error::FIPS claimed-profile shard ${FIPS_CLAIMED_SHARD_INDEX} selected no profiles" >&2
            status=1
          fi
          python3 .github/scripts/ci_runtime_telemetry.py end --phase "$phase" --status "$status"
          exit "$status"

      - name: Record sccache stats
        if: always()
        env:
          FIPS_CLAIMED_SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          sccache_bin="${FERRUM_SCCACHE_BIN:-}"
          if [ -n "$sccache_bin" ] && [ -x "$sccache_bin" ]; then
            "$sccache_bin" --show-stats || true
          fi
          python3 .github/scripts/ci_runtime_telemetry.py summarize \
            --title "FIPS claimed profiles (${FIPS_CLAIMED_SHARD_INDEX})"

  fips-clippy:
    name: FIPS clippy
    needs: fips-compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The same runner-memory signature issue #4018 documents on
    # `fips-test-build`, one job earlier in the graph: the dependency graph
    # finishes (`Checking tikv-jemalloc-ctl` is the last line), the run goes
    # silent while clippy type-checks the whole `ferrum-edge` crate with every
    # test module (`--lib --tests`), and the runner dies with `exit code 143`
    # and "The runner has received a shutdown signal" — or stalls until the
    # 45-minute cap. Four of forty completed runs over 2026-09-04/05 ended that
    # way; the rest finish in 11–15 minutes. `CARGO_BUILD_JOBS` bounds the
    # crates checked side by side in the tail, and the additive swapfile below
    # gives the single large check the headroom the 7 GiB image lacks.
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - uses: ./.github/actions/setup-sccache

      - name: Stabilize Cargo compiler identity for exact-target reuse
        run: |
          set -euo pipefail
          if [ -n "${FERRUM_SCCACHE_BIN:-}" ] && [ -x "${FERRUM_SCCACHE_BIN}" ]; then
            "${FERRUM_SCCACHE_BIN}" --stop-server > /dev/null 2>&1 || true
          fi
          printf '%s\n' 'RUSTC_WRAPPER=' 'CARGO_BUILD_RUSTC_WRAPPER=' >> "$GITHUB_ENV"

      - name: Install aws-lc-fips-sys build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build golang-go libcurl4-openssl-dev protobuf-compiler zstd

      - uses: ./.github/actions/setup-fast-linker

      - name: Cache FIPS Rust, AWS-LC, and sccache outputs
        if: github.event.inputs.force_cold_cache != 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-fips-contract-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'build.rs', '.github/workflows/fips-build.yml', '.github/scripts/check_fips_feature_policy.py', 'src/fips/**', 'vendor/**') }}
          cache-directories: ${{ github.workspace }}/.cache/sccache
          cache-on-failure: "true"
          save-if: "false"

      - name: Record rust-cache restore
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit "$CACHE_HIT" \
            --path "${GITHUB_WORKSPACE}/.cache/sccache" \
            --note "layer=stable-fallback; measured=sccache-directory-subset; rust-cache Cargo/target archive bytes are not exposed; save-if=false fork=${FORK_PR:-false}"

      # The stable rust-cache fallback may have restored an inter-commit
      # target/sccache tree. Drop it before promotion so the exact producer
      # tree cannot mix with stale fallback outputs. Runs for fork PRs too:
      # the artifact channel, unlike the former cache channel, is fork-usable.
      - name: Drop stable target before producer promotion
        if: github.event.inputs.force_cold_cache != 'true'
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}/target" "${GITHUB_WORKSPACE}/.cache/sccache"

      # Same-run producer channel: download every handoff attempt this source
      # SHA/run_id has published. The pattern is attempt-independent, so a
      # failed-job rerun at a later attempt still finds the artifact the
      # skipped producer published earlier. The pinned action flattens one
      # match into the channel directory and creates per-artifact children
      # when several attempts exist; promotion below admits both layouts.
      - name: Download FIPS producer handoff
        if: github.event.inputs.force_cold_cache != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ env.FIPS_HANDOFF_ARTIFACT_PREFIX }}*
          path: ${{ runner.temp }}/fips-producer-channel
          merge-multiple: false

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit false \
            --bytes 0 \
            --note "layer=stable-fallback; force_cold_cache skipped restore"
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-producer \
            --hit false \
            --bytes 0 \
            --note "layer=producer; force_cold_cache skipped handoff download"

      # Promote the newest published handoff attempt for this source
      # SHA/run_id. Attempt identity is read from the tar's
      # fips-producer-identity member, never from this consumer's
      # github.run_attempt. The archive is validated (exact channel shape,
      # real tar payload, matching payload/directory identity, real restored
      # directories, matching source-tree identity, clean checkout, real
      # executable) before its regular target files receive one common
      # reference timestamp — checkout gives identical sources newer mtimes,
      # and Cargo would otherwise relink exact restored outputs as stale.
      - name: Promote same-run FIPS producer handoff
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          PREFIX: ${{ env.FIPS_HANDOFF_ARTIFACT_PREFIX }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          channel_root="${RUNNER_TEMP}/fips-producer-channel"
          payload_name="fips-producer-handoff.tar.zst"
          identity_member="fips-producer-identity"
          payload_dir=""
          selected_attempt=0

          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          is_real_dir() {
            [ -d "$1" ] && [ ! -L "$1" ]
          }

          is_real_file() {
            [ -f "$1" ] && [ ! -L "$1" ]
          }

          is_positive_decimal() {
            case "$1" in
              ''|*[!0-9]*|0*) return 1 ;;
            esac
            return 0
          }

          is_sha40() {
            [ "${#1}" -eq 40 ] || return 1
            case "$1" in
              *[!0-9a-f]*) return 1 ;;
            esac
            return 0
          }

          collect_entries() {
            local root="$1"
            shopt -s nullglob dotglob
            collected_entries=("$root"/*)
            shopt -u nullglob dotglob
          }

          if ! is_sha40 "$SOURCE_SHA"; then
            fail "consumer event-stable source SHA is malformed"
          fi
          if ! is_positive_decimal "$RUN_ID"; then
            fail "consumer workflow run id is malformed"
          fi
          if [ "$PREFIX" != "fips-producer-handoff-${SOURCE_SHA}-${RUN_ID}-" ]; then
            fail "producer handoff prefix does not match this source SHA/run_id"
          fi

          read_identity_file() {
            local identity="$1"
            identity_source_sha=""
            identity_run_id=""
            identity_attempt=""
            local line_count=0
            local line
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                *$'\r'*)
                  fail "same-run FIPS producer handoff identity manifest is malformed"
                  ;;
              esac
              line_count=$((line_count + 1))
              case "$line" in
                source_sha=*) identity_source_sha="${line#source_sha=}" ;;
                run_id=*) identity_run_id="${line#run_id=}" ;;
                run_attempt=*) identity_attempt="${line#run_attempt=}" ;;
                *)
                  fail "same-run FIPS producer handoff identity manifest is malformed"
                  ;;
              esac
            done < "$identity"
            if [ "$line_count" -ne 3 ] || \
               ! is_sha40 "$identity_source_sha" || \
               ! is_positive_decimal "$identity_run_id" || \
               ! is_positive_decimal "$identity_attempt"; then
              fail "same-run FIPS producer handoff identity manifest is malformed"
            fi
            expected_identity="$(printf 'source_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
              "$identity_source_sha" "$identity_run_id" "$identity_attempt")"
            if [ "$(cat "$identity")" != "$expected_identity" ]; then
              fail "same-run FIPS producer handoff identity manifest is malformed"
            fi
            if [ "$identity_source_sha" != "$SOURCE_SHA" ]; then
              fail "producer handoff identity source SHA does not match this checkout event"
            fi
            if [ "$identity_run_id" != "$RUN_ID" ]; then
              fail "producer handoff identity run id does not match this workflow run"
            fi
          }

          reject_hostile_tar_member() {
            local member="$1"
            case "$member" in
              ''|.|..)
                fail "producer handoff archive member is malformed"
                ;;
              *[![:print:]]*|*\\*)
                fail "producer handoff archive member is malformed"
                ;;
              /*)
                fail "producer handoff archive member uses an absolute path"
                ;;
            esac
            local part
            local IFS='/'
            for part in $member; do
              case "$part" in
                ''|.|..|*[![:print:]]*|*\\*)
                  fail "producer handoff archive member uses path traversal"
                  ;;
              esac
            done
          }

          assert_identity_member() {
            local archive="$1"
            local expected="$2"
            local listing_tmp verbose_tmp identity_verbose_tmp
            local member line
            local name_count=0 verbose_count=0 identity_count=0 identity_verbose_count=0
            listing_tmp="$(mktemp "${RUNNER_TEMP}/fips-tar-listing.XXXXXX")"
            verbose_tmp="$(mktemp "${RUNNER_TEMP}/fips-tar-verbose.XXXXXX")"
            identity_verbose_tmp="$(mktemp "${RUNNER_TEMP}/fips-tar-identity-verbose.XXXXXX")"
            if ! tar --zstd -tf "$archive" >"$listing_tmp"; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive listing failed"
            fi
            if ! tar --zstd -tvf "$archive" >"$verbose_tmp"; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive verbose listing failed"
            fi
            while IFS= read -r member || [ -n "$member" ]; do
              reject_hostile_tar_member "$member"
              name_count=$((name_count + 1))
              if [ "$member" = "$expected" ]; then
                identity_count=$((identity_count + 1))
              fi
            done <"$listing_tmp"
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                '') continue ;;
                [-]*|d*) ;;
                *)
                  rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
                  fail "producer handoff archive contains a non-file member"
                  ;;
              esac
              verbose_count=$((verbose_count + 1))
            done <"$verbose_tmp"
            if [ "$name_count" -eq 0 ] || [ "$verbose_count" -ne "$name_count" ]; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive listing is inconsistent"
            fi
            if [ "$identity_count" -ne 1 ]; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive identity member is missing or ambiguous"
            fi
            if ! tar --zstd -tvf "$archive" "$expected" >"$identity_verbose_tmp"; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive identity member listing failed"
            fi
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                '') continue ;;
                -*) identity_verbose_count=$((identity_verbose_count + 1)) ;;
                *)
                  rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
                  fail "producer handoff archive identity member is not a regular file"
                  ;;
              esac
            done <"$identity_verbose_tmp"
            if [ "$identity_verbose_count" -ne 1 ]; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive identity member is missing or ambiguous"
            fi
            rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
          }

          extract_identity() {
            local archive="$1"
            local dest="$2"
            rm -rf "$dest"
            mkdir -p "$dest"
            if ! is_real_dir "$dest"; then
              fail "failed to create producer handoff identity extract directory"
            fi
            assert_identity_member "$archive" "$identity_member"
            tar --zstd --no-same-owner \
              -xf "$archive" -C "$dest" "$identity_member"
            local identity="${dest}/${identity_member}"
            if ! is_real_file "$identity"; then
              fail "same-run FIPS producer handoff is missing its real identity manifest"
            fi
            collect_entries "$dest"
            if [ "${#collected_entries[@]}" -ne 1 ] || \
               [ "$(basename "${collected_entries[0]}")" != "$identity_member" ]; then
              fail "producer handoff identity extract contained unexpected paths"
            fi
            read_identity_file "$identity"
          }

          admit_payload_dir() {
            local candidate="$1"
            local directory_attempt="${2:-}"
            if ! is_real_dir "$candidate"; then
              fail "producer handoff payload directory is not a real directory"
            fi
            collect_entries "$candidate"
            if [ "${#collected_entries[@]}" -ne 1 ]; then
              fail "producer handoff payload directory has an unexpected entry shape"
            fi
            local archive="${collected_entries[0]}"
            if [ "$(basename "$archive")" != "$payload_name" ] || ! is_real_file "$archive"; then
              fail "same-run FIPS producer handoff is missing its real tar.zst payload"
            fi
            local channel_abs candidate_abs archive_dir_abs
            channel_abs="$(cd "$channel_root" && pwd -P)"
            candidate_abs="$(cd "$candidate" && pwd -P)"
            archive_dir_abs="$(cd "$(dirname "$archive")" && pwd -P)"
            case "$candidate_abs" in
              "$channel_abs"|"$channel_abs"/*) ;;
              *) fail "producer handoff payload directory escaped channel root" ;;
            esac
            if [ "$archive_dir_abs" != "$candidate_abs" ]; then
              fail "producer handoff payload escaped its artifact directory"
            fi
            extract_identity "$archive" "${RUNNER_TEMP}/fips-producer-identity-extract"
            if [ -n "$directory_attempt" ] && [ "$identity_attempt" != "$directory_attempt" ]; then
              fail "producer handoff directory attempt does not match payload identity"
            fi
          }

          if [ -L "$channel_root" ]; then
            fail "producer handoff channel must not be a symlink"
          fi
          if ! is_real_dir "$channel_root"; then
            fail "fips-compile producer handoff was not published for this event-stable source SHA/run_id; refusing to claim compile-to-consumer reuse"
          fi
          collect_entries "$channel_root"
          if [ "${#collected_entries[@]}" -eq 0 ]; then
            fail "fips-compile producer handoff was not published for this event-stable source SHA/run_id; refusing to claim compile-to-consumer reuse"
          fi
          file_count=0
          dir_count=0
          for entry in "${collected_entries[@]}"; do
            if [ -L "$entry" ]; then
              fail "producer handoff channel contains a symlink"
            fi
            if [ -f "$entry" ]; then
              file_count=$((file_count + 1))
            elif [ -d "$entry" ]; then
              dir_count=$((dir_count + 1))
            else
              fail "producer handoff channel contains an unexpected entry type"
            fi
          done
          if [ "$file_count" -gt 0 ] && [ "$dir_count" -gt 0 ]; then
            fail "producer handoff channel mixes files and directories"
          fi
          if [ "$dir_count" -eq 0 ]; then
            if [ "$file_count" -ne 1 ]; then
              fail "producer handoff channel flattened layout is malformed"
            fi
            admit_payload_dir "$channel_root" ""
            payload_dir="$channel_root"
            selected_attempt="$identity_attempt"
          else
            for candidate in "${collected_entries[@]}"; do
              name="$(basename "$candidate")"
              case "$name" in
                "$PREFIX"*) ;;
                *)
                  fail "producer handoff channel contains an unexpected artifact name"
                  ;;
              esac
              attempt="${name#"$PREFIX"}"
              if ! is_positive_decimal "$attempt"; then
                fail "producer handoff channel contains a malformed attempt"
              fi
              admit_payload_dir "$candidate" "$attempt"
              if [ "$identity_attempt" -gt "$selected_attempt" ]; then
                selected_attempt="$identity_attempt"
                payload_dir="$candidate"
              fi
            done
          fi
          if [ -z "$payload_dir" ] || ! is_positive_decimal "$selected_attempt"; then
            fail "fips-compile producer handoff was not published for this event-stable source SHA/run_id; refusing to claim compile-to-consumer reuse"
          fi
          echo "Promoting FIPS producer handoff attempt ${selected_attempt}."
          archive="${payload_dir}/fips-producer-handoff.tar.zst"
          if [ ! -f "$archive" ] || [ -L "$archive" ]; then
            echo "::error::same-run FIPS producer handoff is missing its real tar.zst payload" >&2
            exit 1
          fi
          extract_root="${RUNNER_TEMP}/fips-producer-extracted"
          rm -rf "$extract_root"
          mkdir -p "$extract_root"
          tar --zstd --no-same-owner -xf "$archive" -C "$extract_root"
          for path in target .cache/sccache; do
            source_path="${extract_root}/${path}"
            if [ ! -d "$source_path" ] || [ -L "$source_path" ]; then
              echo "::error::same-run FIPS producer handoff is missing a real ${path} directory" >&2
              exit 1
            fi
          done
          tree_manifest="${extract_root}/fips-producer-source-tree"
          if [ ! -f "$tree_manifest" ] || [ -L "$tree_manifest" ]; then
            echo "::error::same-run FIPS producer handoff is missing its real source-tree manifest" >&2
            exit 1
          fi
          archived_tree="$(cat "$tree_manifest")"
          line_count="$(wc -l < "$tree_manifest")"
          if [ "$line_count" -ne 1 ] || [ "${#archived_tree}" -ne 40 ] || \
             [[ "$archived_tree" == *[!0-9a-f]* ]]; then
            echo "::error::same-run FIPS producer handoff source-tree manifest is malformed" >&2
            exit 1
          fi
          extracted_identity="${extract_root}/fips-producer-identity"
          if [ ! -f "$extracted_identity" ] || [ -L "$extracted_identity" ]; then
            echo "::error::same-run FIPS producer handoff is missing its real identity manifest" >&2
            exit 1
          fi
          read_identity_file "$extracted_identity"
          if [ "$identity_attempt" != "$selected_attempt" ]; then
            echo "::error::producer handoff extracted identity does not match the selected attempt" >&2
            exit 1
          fi
          current_tree="$(git rev-parse HEAD^{tree})"
          if [ "$archived_tree" != "$current_tree" ]; then
            echo "::error::same-run FIPS producer handoff source tree does not match this checkout; refusing stale-base reuse" >&2
            exit 1
          fi
          if ! git diff --quiet --no-ext-diff || \
             ! git diff --cached --quiet --no-ext-diff; then
            echo "::error::tracked checkout content changed before FIPS handoff promotion" >&2
            exit 1
          fi
          rm -rf "${GITHUB_WORKSPACE}/target" "${GITHUB_WORKSPACE}/.cache/sccache"
          mkdir -p "${GITHUB_WORKSPACE}/.cache"
          mv "${extract_root}/target" "${GITHUB_WORKSPACE}/target"
          mv "${extract_root}/.cache/sccache" "${GITHUB_WORKSPACE}/.cache/sccache"
          # The promoted handoff is bound to this source SHA/run_id tree.
          # Refresh only regular target files after the executable proof so
          # newer checkout mtimes do not force Cargo to relink identical
          # outputs.
          target_root="${GITHUB_WORKSPACE}/target"
          fips_binary="${target_root}/debug/ferrum-edge"
          if [ ! -d "$target_root" ] || [ -L "$target_root" ] || \
             [ ! -f "$fips_binary" ] || [ -L "$fips_binary" ] || \
             [ ! -x "$fips_binary" ]; then
            echo "::error::same-run FIPS target is missing its executable; refusing to refresh restored mtimes" >&2
            exit 1
          fi
          mtime_reference="${RUNNER_TEMP}/fips-target-mtime-reference"
          rm -f "$mtime_reference"
          touch "$mtime_reference"
          find "$target_root" -xdev -type f \
            -exec touch --reference="$mtime_reference" -- {} +
          rm -f "$mtime_reference"

      - name: Record same-run FIPS producer handoff
        if: github.event.inputs.force_cold_cache != 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-producer \
            --hit true \
            --path "${GITHUB_WORKSPACE}/target" \
            --note "layer=producer; measured=target-directory; transport=same-run-artifact; sccache promoted from the same handoff"

      - name: Assert cache-service credentials are absent
        run: |
          set -euo pipefail
          leaked=0
          for var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
            if [ -n "${!var:-}" ]; then
              echo "::error::${var} is present in this run environment; refusing to execute later PR-controlled build steps with a cache-service credential" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi

      # Best-effort, additive, and cleaned up on failure, exactly like the
      # `fips-test-build` step (issue #4018): insurance for the main-crate
      # check that follows, not a correctness gate.
      - name: Enlarge runner swap for the main-crate lint
        run: |
          set -uo pipefail
          ferrum_swap="/mnt/ferrum-fips-swapfile"
          if sudo fallocate -l 8G "$ferrum_swap" \
            && sudo chmod 600 "$ferrum_swap" \
            && sudo mkswap "$ferrum_swap" \
            && sudo swapon "$ferrum_swap"; then
            echo "Runner swap enlarged for the FIPS clippy lint (additive 8 GiB Ferrum swapfile)."
          else
            echo "::warning::could not enlarge runner swap; continuing on whatever the image provides" >&2
            sudo swapoff "$ferrum_swap" 2>/dev/null || true
            sudo rm -f "$ferrum_swap" || true
          fi
          awk '/^SwapTotal:/ {print "SwapTotal: " $2 " kB"}' /proc/meminfo
          free -h

      - name: Lint the FIPS profile
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-clippy
          set +e
          cargo clippy --locked --no-default-features --features fips \
            --lib --tests -p ferrum-edge -- -D warnings
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-clippy --status "$status"
          exit "$status"

      - name: Record sccache stats
        if: always()
        run: |
          sccache_bin="${FERRUM_SCCACHE_BIN:-}"
          if [ -n "$sccache_bin" ] && [ -x "$sccache_bin" ]; then
            "$sccache_bin" --show-stats || true
          fi
          python3 .github/scripts/ci_runtime_telemetry.py summarize --title "FIPS clippy"

  fips-test-build:
    name: FIPS test binaries
    needs: fips-compile
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Issue #4018: the precompile step below is killed with
    # `exit code 143` and "The runner has received a shutdown signal" on a large
    # minority of runs. The log always ends the same way: the dependency graph
    # finishes, the run goes silent for several minutes while Cargo builds the
    # two large test binaries (`unit_tests` and `integration_tests` — the whole
    # `ferrum-edge` crate plus every test module), and the runner dies mid-tail.
    # No diagnostic is ever emitted because the process is killed rather than
    # failing, which is exactly the signature of the hosted runner's memory
    # ceiling rather than a compile error.
    #
    # `[profile.dev]` sets `debug = true` and the `test` profile inherits from
    # `dev`, so every concurrent codegen thread in that tail holds a
    # full-debuginfo LLVM module for a crate of that size. The two settings
    # below attack the same peak from both directions: fewer concurrent
    # threads, and a smaller footprint per thread. `CARGO_BUILD_JOBS` bounds the
    # jobserver that rustc's own codegen threads draw from, so it caps
    # parallelism WITHIN those two crates — which is where the tail is — and not
    # merely the number of crates built side by side.
    #
    # `line-tables-only` keeps file and line in backtraces and drops only
    # variable-level debuginfo. These binaries exist to be executed under exact
    # test filters by the downstream FIPS consumers; nothing symbolicates locals
    # from them.
    env:
      CARGO_BUILD_JOBS: "3"
      # Set on BOTH profiles rather than relying on `test` inheriting from
      # `dev`, so the override cannot silently miss the profile that actually
      # builds these binaries.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: ./.github/actions/setup-sccache

      - name: Stabilize Cargo compiler identity for exact-target reuse
        run: |
          set -euo pipefail
          if [ -n "${FERRUM_SCCACHE_BIN:-}" ] && [ -x "${FERRUM_SCCACHE_BIN}" ]; then
            "${FERRUM_SCCACHE_BIN}" --stop-server > /dev/null 2>&1 || true
          fi
          printf '%s\n' 'RUSTC_WRAPPER=' 'CARGO_BUILD_RUSTC_WRAPPER=' >> "$GITHUB_ENV"

      - name: Install aws-lc-fips-sys build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build golang-go libcurl4-openssl-dev protobuf-compiler zstd

      - uses: ./.github/actions/setup-fast-linker

      - name: Cache FIPS Rust, AWS-LC, and sccache outputs
        if: github.event.inputs.force_cold_cache != 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-fips-contract-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'build.rs', '.github/workflows/fips-build.yml', '.github/scripts/check_fips_feature_policy.py', 'src/fips/**', 'vendor/**') }}
          cache-directories: ${{ github.workspace }}/.cache/sccache
          cache-on-failure: "true"
          save-if: "false"

      - name: Record rust-cache restore
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit "$CACHE_HIT" \
            --path "${GITHUB_WORKSPACE}/.cache/sccache" \
            --note "layer=stable-fallback; measured=sccache-directory-subset; rust-cache Cargo/target archive bytes are not exposed; save-if=false fork=${FORK_PR:-false}"

      # The stable rust-cache fallback may have restored an inter-commit
      # target/sccache tree. Drop it before promotion so the exact producer
      # tree cannot mix with stale fallback outputs. Runs for fork PRs too:
      # the artifact channel, unlike the former cache channel, is fork-usable.
      - name: Drop stable target before producer promotion
        if: github.event.inputs.force_cold_cache != 'true'
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}/target" "${GITHUB_WORKSPACE}/.cache/sccache"

      # Same-run producer channel: download every handoff attempt this source
      # SHA/run_id has published. The pattern is attempt-independent, so a
      # failed-job rerun at a later attempt still finds the artifact the
      # skipped producer published earlier. The pinned action flattens one
      # match into the channel directory and creates per-artifact children
      # when several attempts exist; promotion below admits both layouts.
      - name: Download FIPS producer handoff
        if: github.event.inputs.force_cold_cache != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ env.FIPS_HANDOFF_ARTIFACT_PREFIX }}*
          path: ${{ runner.temp }}/fips-producer-channel
          merge-multiple: false

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit false \
            --bytes 0 \
            --note "layer=stable-fallback; force_cold_cache skipped restore"
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-producer \
            --hit false \
            --bytes 0 \
            --note "layer=producer; force_cold_cache skipped handoff download"
      # Promote the newest published handoff attempt for this source
      # SHA/run_id. Attempt identity is read from the tar's
      # fips-producer-identity member, never from this consumer's
      # github.run_attempt. The archive is validated (exact channel shape,
      # real tar payload, matching payload/directory identity, real restored
      # directories, matching source-tree identity, clean checkout, real
      # executable) before its regular target files receive one common
      # reference timestamp — checkout gives identical sources newer mtimes,
      # and Cargo would otherwise relink exact restored outputs as stale.
      - name: Promote same-run FIPS producer handoff
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          PREFIX: ${{ env.FIPS_HANDOFF_ARTIFACT_PREFIX }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          channel_root="${RUNNER_TEMP}/fips-producer-channel"
          payload_name="fips-producer-handoff.tar.zst"
          identity_member="fips-producer-identity"
          payload_dir=""
          selected_attempt=0

          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          is_real_dir() {
            [ -d "$1" ] && [ ! -L "$1" ]
          }

          is_real_file() {
            [ -f "$1" ] && [ ! -L "$1" ]
          }

          is_positive_decimal() {
            case "$1" in
              ''|*[!0-9]*|0*) return 1 ;;
            esac
            return 0
          }

          is_sha40() {
            [ "${#1}" -eq 40 ] || return 1
            case "$1" in
              *[!0-9a-f]*) return 1 ;;
            esac
            return 0
          }

          collect_entries() {
            local root="$1"
            shopt -s nullglob dotglob
            collected_entries=("$root"/*)
            shopt -u nullglob dotglob
          }

          if ! is_sha40 "$SOURCE_SHA"; then
            fail "consumer event-stable source SHA is malformed"
          fi
          if ! is_positive_decimal "$RUN_ID"; then
            fail "consumer workflow run id is malformed"
          fi
          if [ "$PREFIX" != "fips-producer-handoff-${SOURCE_SHA}-${RUN_ID}-" ]; then
            fail "producer handoff prefix does not match this source SHA/run_id"
          fi

          read_identity_file() {
            local identity="$1"
            identity_source_sha=""
            identity_run_id=""
            identity_attempt=""
            local line_count=0
            local line
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                *$'\r'*)
                  fail "same-run FIPS producer handoff identity manifest is malformed"
                  ;;
              esac
              line_count=$((line_count + 1))
              case "$line" in
                source_sha=*) identity_source_sha="${line#source_sha=}" ;;
                run_id=*) identity_run_id="${line#run_id=}" ;;
                run_attempt=*) identity_attempt="${line#run_attempt=}" ;;
                *)
                  fail "same-run FIPS producer handoff identity manifest is malformed"
                  ;;
              esac
            done < "$identity"
            if [ "$line_count" -ne 3 ] || \
               ! is_sha40 "$identity_source_sha" || \
               ! is_positive_decimal "$identity_run_id" || \
               ! is_positive_decimal "$identity_attempt"; then
              fail "same-run FIPS producer handoff identity manifest is malformed"
            fi
            expected_identity="$(printf 'source_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
              "$identity_source_sha" "$identity_run_id" "$identity_attempt")"
            if [ "$(cat "$identity")" != "$expected_identity" ]; then
              fail "same-run FIPS producer handoff identity manifest is malformed"
            fi
            if [ "$identity_source_sha" != "$SOURCE_SHA" ]; then
              fail "producer handoff identity source SHA does not match this checkout event"
            fi
            if [ "$identity_run_id" != "$RUN_ID" ]; then
              fail "producer handoff identity run id does not match this workflow run"
            fi
          }

          reject_hostile_tar_member() {
            local member="$1"
            case "$member" in
              ''|.|..)
                fail "producer handoff archive member is malformed"
                ;;
              *[![:print:]]*|*\\*)
                fail "producer handoff archive member is malformed"
                ;;
              /*)
                fail "producer handoff archive member uses an absolute path"
                ;;
            esac
            local part
            local IFS='/'
            for part in $member; do
              case "$part" in
                ''|.|..|*[![:print:]]*|*\\*)
                  fail "producer handoff archive member uses path traversal"
                  ;;
              esac
            done
          }

          assert_identity_member() {
            local archive="$1"
            local expected="$2"
            local listing_tmp verbose_tmp identity_verbose_tmp
            local member line
            local name_count=0 verbose_count=0 identity_count=0 identity_verbose_count=0
            listing_tmp="$(mktemp "${RUNNER_TEMP}/fips-tar-listing.XXXXXX")"
            verbose_tmp="$(mktemp "${RUNNER_TEMP}/fips-tar-verbose.XXXXXX")"
            identity_verbose_tmp="$(mktemp "${RUNNER_TEMP}/fips-tar-identity-verbose.XXXXXX")"
            if ! tar --zstd -tf "$archive" >"$listing_tmp"; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive listing failed"
            fi
            if ! tar --zstd -tvf "$archive" >"$verbose_tmp"; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive verbose listing failed"
            fi
            while IFS= read -r member || [ -n "$member" ]; do
              reject_hostile_tar_member "$member"
              name_count=$((name_count + 1))
              if [ "$member" = "$expected" ]; then
                identity_count=$((identity_count + 1))
              fi
            done <"$listing_tmp"
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                '') continue ;;
                [-]*|d*) ;;
                *)
                  rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
                  fail "producer handoff archive contains a non-file member"
                  ;;
              esac
              verbose_count=$((verbose_count + 1))
            done <"$verbose_tmp"
            if [ "$name_count" -eq 0 ] || [ "$verbose_count" -ne "$name_count" ]; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive listing is inconsistent"
            fi
            if [ "$identity_count" -ne 1 ]; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive identity member is missing or ambiguous"
            fi
            if ! tar --zstd -tvf "$archive" "$expected" >"$identity_verbose_tmp"; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive identity member listing failed"
            fi
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                '') continue ;;
                -*) identity_verbose_count=$((identity_verbose_count + 1)) ;;
                *)
                  rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
                  fail "producer handoff archive identity member is not a regular file"
                  ;;
              esac
            done <"$identity_verbose_tmp"
            if [ "$identity_verbose_count" -ne 1 ]; then
              rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
              fail "producer handoff archive identity member is missing or ambiguous"
            fi
            rm -f "$listing_tmp" "$verbose_tmp" "$identity_verbose_tmp"
          }

          extract_identity() {
            local archive="$1"
            local dest="$2"
            rm -rf "$dest"
            mkdir -p "$dest"
            if ! is_real_dir "$dest"; then
              fail "failed to create producer handoff identity extract directory"
            fi
            assert_identity_member "$archive" "$identity_member"
            tar --zstd --no-same-owner \
              -xf "$archive" -C "$dest" "$identity_member"
            local identity="${dest}/${identity_member}"
            if ! is_real_file "$identity"; then
              fail "same-run FIPS producer handoff is missing its real identity manifest"
            fi
            collect_entries "$dest"
            if [ "${#collected_entries[@]}" -ne 1 ] || \
               [ "$(basename "${collected_entries[0]}")" != "$identity_member" ]; then
              fail "producer handoff identity extract contained unexpected paths"
            fi
            read_identity_file "$identity"
          }

          admit_payload_dir() {
            local candidate="$1"
            local directory_attempt="${2:-}"
            if ! is_real_dir "$candidate"; then
              fail "producer handoff payload directory is not a real directory"
            fi
            collect_entries "$candidate"
            if [ "${#collected_entries[@]}" -ne 1 ]; then
              fail "producer handoff payload directory has an unexpected entry shape"
            fi
            local archive="${collected_entries[0]}"
            if [ "$(basename "$archive")" != "$payload_name" ] || ! is_real_file "$archive"; then
              fail "same-run FIPS producer handoff is missing its real tar.zst payload"
            fi
            local channel_abs candidate_abs archive_dir_abs
            channel_abs="$(cd "$channel_root" && pwd -P)"
            candidate_abs="$(cd "$candidate" && pwd -P)"
            archive_dir_abs="$(cd "$(dirname "$archive")" && pwd -P)"
            case "$candidate_abs" in
              "$channel_abs"|"$channel_abs"/*) ;;
              *) fail "producer handoff payload directory escaped channel root" ;;
            esac
            if [ "$archive_dir_abs" != "$candidate_abs" ]; then
              fail "producer handoff payload escaped its artifact directory"
            fi
            extract_identity "$archive" "${RUNNER_TEMP}/fips-producer-identity-extract"
            if [ -n "$directory_attempt" ] && [ "$identity_attempt" != "$directory_attempt" ]; then
              fail "producer handoff directory attempt does not match payload identity"
            fi
          }

          if [ -L "$channel_root" ]; then
            fail "producer handoff channel must not be a symlink"
          fi
          if ! is_real_dir "$channel_root"; then
            fail "fips-compile producer handoff was not published for this event-stable source SHA/run_id; refusing to claim compile-to-consumer reuse"
          fi
          collect_entries "$channel_root"
          if [ "${#collected_entries[@]}" -eq 0 ]; then
            fail "fips-compile producer handoff was not published for this event-stable source SHA/run_id; refusing to claim compile-to-consumer reuse"
          fi
          file_count=0
          dir_count=0
          for entry in "${collected_entries[@]}"; do
            if [ -L "$entry" ]; then
              fail "producer handoff channel contains a symlink"
            fi
            if [ -f "$entry" ]; then
              file_count=$((file_count + 1))
            elif [ -d "$entry" ]; then
              dir_count=$((dir_count + 1))
            else
              fail "producer handoff channel contains an unexpected entry type"
            fi
          done
          if [ "$file_count" -gt 0 ] && [ "$dir_count" -gt 0 ]; then
            fail "producer handoff channel mixes files and directories"
          fi
          if [ "$dir_count" -eq 0 ]; then
            if [ "$file_count" -ne 1 ]; then
              fail "producer handoff channel flattened layout is malformed"
            fi
            admit_payload_dir "$channel_root" ""
            payload_dir="$channel_root"
            selected_attempt="$identity_attempt"
          else
            for candidate in "${collected_entries[@]}"; do
              name="$(basename "$candidate")"
              case "$name" in
                "$PREFIX"*) ;;
                *)
                  fail "producer handoff channel contains an unexpected artifact name"
                  ;;
              esac
              attempt="${name#"$PREFIX"}"
              if ! is_positive_decimal "$attempt"; then
                fail "producer handoff channel contains a malformed attempt"
              fi
              admit_payload_dir "$candidate" "$attempt"
              if [ "$identity_attempt" -gt "$selected_attempt" ]; then
                selected_attempt="$identity_attempt"
                payload_dir="$candidate"
              fi
            done
          fi
          if [ -z "$payload_dir" ] || ! is_positive_decimal "$selected_attempt"; then
            fail "fips-compile producer handoff was not published for this event-stable source SHA/run_id; refusing to claim compile-to-consumer reuse"
          fi
          echo "Promoting FIPS producer handoff attempt ${selected_attempt}."
          archive="${payload_dir}/fips-producer-handoff.tar.zst"
          if [ ! -f "$archive" ] || [ -L "$archive" ]; then
            echo "::error::same-run FIPS producer handoff is missing its real tar.zst payload" >&2
            exit 1
          fi
          extract_root="${RUNNER_TEMP}/fips-producer-extracted"
          rm -rf "$extract_root"
          mkdir -p "$extract_root"
          tar --zstd --no-same-owner -xf "$archive" -C "$extract_root"
          for path in target .cache/sccache; do
            source_path="${extract_root}/${path}"
            if [ ! -d "$source_path" ] || [ -L "$source_path" ]; then
              echo "::error::same-run FIPS producer handoff is missing a real ${path} directory" >&2
              exit 1
            fi
          done
          tree_manifest="${extract_root}/fips-producer-source-tree"
          if [ ! -f "$tree_manifest" ] || [ -L "$tree_manifest" ]; then
            echo "::error::same-run FIPS producer handoff is missing its real source-tree manifest" >&2
            exit 1
          fi
          archived_tree="$(cat "$tree_manifest")"
          line_count="$(wc -l < "$tree_manifest")"
          if [ "$line_count" -ne 1 ] || [ "${#archived_tree}" -ne 40 ] || \
             [[ "$archived_tree" == *[!0-9a-f]* ]]; then
            echo "::error::same-run FIPS producer handoff source-tree manifest is malformed" >&2
            exit 1
          fi
          extracted_identity="${extract_root}/fips-producer-identity"
          if [ ! -f "$extracted_identity" ] || [ -L "$extracted_identity" ]; then
            echo "::error::same-run FIPS producer handoff is missing its real identity manifest" >&2
            exit 1
          fi
          read_identity_file "$extracted_identity"
          if [ "$identity_attempt" != "$selected_attempt" ]; then
            echo "::error::producer handoff extracted identity does not match the selected attempt" >&2
            exit 1
          fi
          current_tree="$(git rev-parse HEAD^{tree})"
          if [ "$archived_tree" != "$current_tree" ]; then
            echo "::error::same-run FIPS producer handoff source tree does not match this checkout; refusing stale-base reuse" >&2
            exit 1
          fi
          if ! git diff --quiet --no-ext-diff || \
             ! git diff --cached --quiet --no-ext-diff; then
            echo "::error::tracked checkout content changed before FIPS handoff promotion" >&2
            exit 1
          fi
          rm -rf "${GITHUB_WORKSPACE}/target" "${GITHUB_WORKSPACE}/.cache/sccache"
          mkdir -p "${GITHUB_WORKSPACE}/.cache"
          mv "${extract_root}/target" "${GITHUB_WORKSPACE}/target"
          mv "${extract_root}/.cache/sccache" "${GITHUB_WORKSPACE}/.cache/sccache"
          # The promoted handoff is bound to this source SHA/run_id tree.
          # Refresh only regular target files after the executable proof so
          # newer checkout mtimes do not force Cargo to relink identical
          # outputs.
          target_root="${GITHUB_WORKSPACE}/target"
          fips_binary="${target_root}/debug/ferrum-edge"
          if [ ! -d "$target_root" ] || [ -L "$target_root" ] || \
             [ ! -f "$fips_binary" ] || [ -L "$fips_binary" ] || \
             [ ! -x "$fips_binary" ]; then
            echo "::error::same-run FIPS target is missing its executable; refusing to refresh restored mtimes" >&2
            exit 1
          fi
          mtime_reference="${RUNNER_TEMP}/fips-target-mtime-reference"
          rm -f "$mtime_reference"
          touch "$mtime_reference"
          find "$target_root" -xdev -type f \
            -exec touch --reference="$mtime_reference" -- {} +
          rm -f "$mtime_reference"

      - name: Record same-run FIPS producer handoff
        if: github.event.inputs.force_cold_cache != 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-producer \
            --hit true \
            --path "${GITHUB_WORKSPACE}/target" \
            --note "layer=producer; measured=target-directory; transport=same-run-artifact; sccache promoted from the same handoff"

      - name: Assert cache-service credentials are absent
        run: |
          set -euo pipefail
          leaked=0
          for var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
            if [ -n "${!var:-}" ]; then
              echo "::error::${var} is present in this run environment; refusing to execute later PR-controlled build steps with a cache-service credential" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi

      # The filtered test consumer runs exact policy and handshake filters, but
      # Cargo must still build the complete unit_tests and integration_tests
      # binaries. Build those binaries in this producer-cache consumer so the
      # work overlaps claimed-profile and clippy jobs, then publish only
      # digest-bound copies through an immutable same-run artifact. Downstream
      # tests never ask Cargo to reconsider fresh-checkout mtimes.
      # Headroom for whatever peak the two job-level `env` settings above do
      # not remove (issue #4018). The hosted image ships a 4 GiB
      # `/mnt/swapfile` on a partition with tens of GiB free.
      #
      # Add an 8 GiB Ferrum-owned swapfile alongside the image swap (~12 GiB
      # total) rather than disabling or replacing `/mnt/swapfile`. Deliberately
      # best-effort rather than fail-closed: this step is insurance, not a
      # correctness gate, and this workflow's text is frozen by
      # `verify_cross_build_policy.py` under a single admitted generation
      # digest. Any failure raises a warning annotation, leaves the image swap
      # untouched, best-effort cleans up only `/mnt/ferrum-fips-swapfile`, and
      # the resulting `SwapTotal` is always printed so "the swap was never
      # enlarged" is readable from the log rather than inferred.
      - name: Enlarge runner swap for the test-binary codegen tail
        run: |
          set -uo pipefail
          ferrum_swap="/mnt/ferrum-fips-swapfile"
          if sudo fallocate -l 8G "$ferrum_swap" \
            && sudo chmod 600 "$ferrum_swap" \
            && sudo mkswap "$ferrum_swap" \
            && sudo swapon "$ferrum_swap"; then
            echo "Runner swap enlarged for the FIPS test-binary build (additive 8 GiB Ferrum swapfile)."
          else
            echo "::warning::could not enlarge runner swap; continuing on whatever the image provides" >&2
            sudo swapoff "$ferrum_swap" 2>/dev/null || true
            sudo rm -f "$ferrum_swap" || true
          fi
          awk '/^SwapTotal:/ {print "SwapTotal: " $2 " kB"}' /proc/meminfo
          free -h

      - name: Precompile FIPS test binaries for consumers
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-test-build
          metadata="$(mktemp)"
          bundle="${GITHUB_WORKSPACE}/target/fips-test-bundle"
          set +e
          cargo test --locked --no-default-features --features fips \
            --test unit_tests --test integration_tests --no-run
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            set +e
            cargo test --locked --no-default-features --features fips \
              --test unit_tests --test integration_tests --no-run \
              --message-format=json > "$metadata"
            status=$?
            set -e
          fi
          if [ "$status" -eq 0 ]; then
            set +e
            python3 - "$metadata" "$bundle" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import sys

          metadata = Path(sys.argv[1])
          bundle = Path(sys.argv[2])
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          target_root = (workspace / "target").resolve(strict=True)
          wanted = {"unit_tests", "integration_tests"}
          found = {name: set() for name in wanted}

          for raw_line in metadata.read_text(encoding="utf-8").splitlines():
              try:
                  record = json.loads(raw_line)
              except json.JSONDecodeError:
                  continue
              if record.get("reason") != "compiler-artifact":
                  continue
              target = record.get("target") or {}
              name = target.get("name")
              executable = record.get("executable")
              if name not in wanted or not executable:
                  continue
              path = Path(executable).resolve(strict=True)
              path.relative_to(target_root)
              if not path.is_file() or not os.access(path, os.X_OK):
                  raise SystemExit(f"non-executable FIPS test artifact: {path}")
              found[name].add(path.relative_to(workspace).as_posix())

          invalid = {name: sorted(paths) for name, paths in found.items() if len(paths) != 1}
          if invalid:
              raise SystemExit(f"expected one executable per FIPS test target: {invalid}")

          if bundle.exists():
              shutil.rmtree(bundle)
          bundle.mkdir(mode=0o700)
          records = {}
          for name in sorted(wanted):
              source = workspace / next(iter(found[name]))
              destination = bundle / name
              shutil.copyfile(source, destination)
              destination.chmod(0o700)
              digest = hashlib.sha256()
              with destination.open("rb") as executable_file:
                  for chunk in iter(lambda: executable_file.read(1024 * 1024), b""):
                      digest.update(chunk)
              records[name] = {"file": name, "sha256": digest.hexdigest()}

          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          if re.fullmatch(r"[1-9][0-9]*", run_id) is None:
              raise SystemExit("malformed FIPS test identity run id")
          if re.fullmatch(r"[1-9][0-9]*", run_attempt) is None:
              raise SystemExit("malformed FIPS test identity run attempt")
          (bundle / "fips-test-identity").write_text(
              f"run_id={run_id}\nrun_attempt={run_attempt}\n",
              encoding="utf-8",
          )
          (bundle / "manifest.json").write_text(
              json.dumps(records, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            status=$?
            set -e
          fi
          rm -f "$metadata"
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-test-build --status "$status"
          exit "$status"

      - name: Publish exact FIPS test executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fips-test-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/target/fips-test-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove staged FIPS test artifact
        run: rm -rf "${GITHUB_WORKSPACE}/target/fips-test-bundle"

      - name: Record sccache stats
        if: always()
        run: |
          sccache_bin="${FERRUM_SCCACHE_BIN:-}"
          if [ -n "$sccache_bin" ] && [ -x "$sccache_bin" ]; then
            "$sccache_bin" --show-stats || true
          fi
          python3 .github/scripts/ci_runtime_telemetry.py summarize --title "FIPS test binaries"

  fips-test:
    name: FIPS tests
    needs: fips-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      # A failed-job rerun can execute this consumer at attempt N without
      # rerunning its already-successful fips-test-build prerequisite. Download
      # every immutable test bundle for this run. The pinned action flattens a
      # single matching artifact into the channel directory and creates
      # per-artifact children when several attempts exist. Validation below
      # admits both layouts and binds the attempt from fips-test-identity
      # instead of asking for an artifact the skipped producer never published
      # at attempt N.
      - name: Download exact FIPS test executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: fips-test-binaries-${{ github.run_id }}-*
          path: ${{ runner.temp }}/fips-test-channel
          merge-multiple: false

      - name: Assert cache-service credentials are absent
        run: |
          set -euo pipefail
          leaked=0
          for var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
            if [ -n "${!var:-}" ]; then
              echo "::error::${var} is present in this run environment; refusing to execute later PR-controlled build steps with a cache-service credential" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi

      - name: Validate restored FIPS test executables
        id: fips-test-binaries
        env:
          FIPS_TEST_CHANNEL: ${{ runner.temp }}/fips-test-channel
          FIPS_TEST_ARTIFACT_PREFIX: fips-test-binaries-${{ github.run_id }}-
          FIPS_TEST_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          ALLOWED_BUNDLE = {
              "unit_tests",
              "integration_tests",
              "manifest.json",
              "fips-test-identity",
          }
          POSITIVE_DECIMAL = re.compile(r"[1-9][0-9]*")

          def fail(message: str) -> None:
              raise SystemExit(message)

          channel_path = Path(os.environ["FIPS_TEST_CHANNEL"])
          if channel_path.is_symlink():
              fail("FIPS test artifact channel must not be a symlink")
          if not channel_path.is_dir():
              fail("FIPS test artifact channel is not a directory")
          channel = channel_path.resolve(strict=True)
          if not channel.is_dir() or channel.is_symlink():
              fail("FIPS test artifact channel is not a directory")
          prefix = os.environ["FIPS_TEST_ARTIFACT_PREFIX"]
          expected_run_id = os.environ["FIPS_TEST_RUN_ID"]
          if POSITIVE_DECIMAL.fullmatch(expected_run_id) is None:
              fail("malformed FIPS test run id")
          if prefix != f"fips-test-binaries-{expected_run_id}-":
              fail("FIPS test artifact prefix does not match this workflow run")

          def read_identity(bundle: Path) -> int:
              identity_path = bundle / "fips-test-identity"
              if identity_path.is_symlink():
                  fail("FIPS test identity must not be a symlink")
              identity = identity_path.resolve(strict=True)
              if identity.parent != bundle:
                  fail("FIPS test identity escaped artifact root")
              text = identity.read_text(encoding="utf-8")
              lines = text.splitlines()
              if not text.endswith("\n") or len(lines) != 2:
                  fail("malformed FIPS test identity manifest")
              records = {}
              for line in lines:
                  if "\r" in line or line.count("=") != 1:
                      fail("malformed FIPS test identity manifest")
                  key, value = line.split("=", 1)
                  if key in records:
                      fail("malformed FIPS test identity manifest")
                  records[key] = value
              if set(records) != {"run_id", "run_attempt"}:
                  fail("malformed FIPS test identity manifest")
              run_id = records["run_id"]
              run_attempt = records["run_attempt"]
              if POSITIVE_DECIMAL.fullmatch(run_id) is None:
                  fail("malformed FIPS test identity run id")
              if POSITIVE_DECIMAL.fullmatch(run_attempt) is None:
                  fail("malformed FIPS test artifact attempt")
              expected = f"run_id={run_id}\nrun_attempt={run_attempt}\n"
              if text != expected:
                  fail("malformed FIPS test identity manifest")
              if run_id != expected_run_id:
                  fail("FIPS test identity run id does not match this workflow run")
              return int(run_attempt)

          def admit_bundle(bundle_path: Path, directory_attempt: int | None) -> tuple[int, Path]:
              if bundle_path.is_symlink() or not bundle_path.is_dir():
                  fail(f"FIPS test bundle is not a real directory: {bundle_path.name}")
              bundle = bundle_path.resolve(strict=True)
              if bundle != channel and bundle.parent != channel:
                  fail("FIPS test artifact directory escaped channel root")
              names = []
              for entry in sorted(bundle.iterdir(), key=lambda item: item.name):
                  if entry.is_symlink() or not entry.is_file():
                      fail(f"unexpected non-file FIPS test bundle entry: {entry.name}")
                  resolved = entry.resolve(strict=True)
                  if resolved.parent != bundle:
                      fail("FIPS test bundle entry escaped artifact root")
                  names.append(entry.name)
              if set(names) != ALLOWED_BUNDLE:
                  fail(f"unexpected FIPS test bundle entries: {sorted(names)}")
              attempt = read_identity(bundle)
              if directory_attempt is not None and attempt != directory_attempt:
                  fail("FIPS test directory attempt does not match payload identity")
              return attempt, bundle

          channel_entries = sorted(channel.iterdir(), key=lambda item: item.name)
          if not channel_entries:
              fail("no FIPS test artifact exists for this workflow run")
          files = []
          dirs = []
          for entry in channel_entries:
              if entry.is_symlink():
                  fail(f"FIPS test artifact channel contains a symlink: {entry.name}")
              if entry.is_file():
                  files.append(entry)
              elif entry.is_dir():
                  dirs.append(entry)
              else:
                  fail(f"unexpected FIPS test artifact entry type: {entry.name}")
          if files and dirs:
              fail("FIPS test artifact channel mixes files and directories")

          attempts = []
          if dirs:
              for candidate_path in dirs:
                  if not candidate_path.name.startswith(prefix):
                      fail(f"unexpected FIPS test artifact name: {candidate_path.name}")
                  raw_attempt = candidate_path.name[len(prefix):]
                  if POSITIVE_DECIMAL.fullmatch(raw_attempt) is None:
                      fail(f"malformed FIPS test artifact attempt: {candidate_path.name}")
                  directory_attempt = int(raw_attempt)
                  attempt, candidate = admit_bundle(candidate_path, directory_attempt)
                  attempts.append((attempt, candidate))
          else:
              attempt, bundle = admit_bundle(channel, None)
              attempts.append((attempt, bundle))
          if not attempts:
              fail("no FIPS test artifact exists for this workflow run")
          _, bundle = max(attempts)
          manifest_path = bundle / "manifest.json"
          if manifest_path.is_symlink():
              raise SystemExit("FIPS test manifest must not be a symlink")
          manifest = manifest_path.resolve(strict=True)
          if manifest.parent != bundle:
              raise SystemExit("FIPS test manifest escaped artifact root")
          records = json.loads(manifest.read_text(encoding="utf-8"))
          wanted = {"unit_tests", "integration_tests"}
          if not isinstance(records, dict) or set(records) != wanted:
              raise SystemExit(f"unexpected FIPS test manifest keys: {sorted(records)}")

          validated = {}
          for name in sorted(wanted):
              record = records[name]
              if not isinstance(record, dict) or set(record) != {"file", "sha256"}:
                  raise SystemExit(f"invalid FIPS test manifest record for {name}")
              if record["file"] != name:
                  raise SystemExit(f"unexpected FIPS test filename for {name}")
              expected = record["sha256"]
              if not isinstance(expected, str) or re.fullmatch(r"[0-9a-f]{64}", expected) is None:
                  raise SystemExit(f"invalid FIPS test digest for {name}")
              candidate_path = bundle / name
              if candidate_path.is_symlink():
                  raise SystemExit(f"FIPS test artifact must not be a symlink: {name}")
              candidate = candidate_path.resolve(strict=True)
              candidate.relative_to(bundle)
              if not candidate.is_file():
                  raise SystemExit(f"restored FIPS test artifact is not a regular file: {candidate}")
              digest = hashlib.sha256()
              with candidate.open("rb") as executable_file:
                  for chunk in iter(lambda: executable_file.read(1024 * 1024), b""):
                      digest.update(chunk)
              if digest.hexdigest() != expected:
                  raise SystemExit(f"FIPS test artifact digest mismatch: {name}")
              candidate.chmod(0o700)
              if not os.access(candidate, os.X_OK):
                  raise SystemExit(f"FIPS test artifact is not executable: {candidate}")
              validated[name] = candidate.as_posix()

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"unit={validated['unit_tests']}\n")
              output.write(f"integration={validated['integration_tests']}\n")
          PY

      - name: FIPS policy, key-admission, and handshake tests
        # libtest accepts one TESTNAME filter per invocation. `tls::fips_` selects
        # tls::fips_policy_tests and tls::fips_key_admission_tests (the only
        # tls::fips_* unit modules). Handshake coverage is two named tests in
        # the same restored integration_tests binary:
        # frontend_and_backend_builders_complete_a_real_tls_handshake
        # and legitimate_data_plane_connects_once_a_permit_is_released.
        env:
          UNIT_TEST_BINARY: ${{ steps.fips-test-binaries.outputs.unit }}
          INTEGRATION_TEST_BINARY: ${{ steps.fips-test-binaries.outputs.integration }}
        run: |
          set -euo pipefail
          unit_test_binary="$UNIT_TEST_BINARY"
          integration_test_binary="$INTEGRATION_TEST_BINARY"
          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-unit-tests
          set +e
          "$unit_test_binary" tls::fips_
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-unit-tests --status "$status"
          [ "$status" -eq 0 ] || exit "$status"

          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-handshake-tests
          set +e
          "$integration_test_binary" \
            integration::cp_grpc_handshake_admission_tests::frontend_and_backend_builders_complete_a_real_tls_handshake
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-handshake-tests --status "$status"
          [ "$status" -eq 0 ] || exit "$status"

          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-handshake-permit-tests
          set +e
          "$integration_test_binary" \
            integration::cp_grpc_handshake_admission_tests::legitimate_data_plane_connects_once_a_permit_is_released
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-handshake-permit-tests --status "$status"
          exit "$status"

      - name: Record FIPS test timings
        if: always()
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py summarize --title "FIPS tests"

  fips-build:
    name: FIPS Build & Test
    runs-on: ubuntu-latest
    needs:
      - fips-plan
      - fips-compile
      - fips-claimed-checks
      - fips-clippy
      - fips-test-build
      - fips-test
    if: always()
    steps:
      - name: Fail when FIPS planning fails
        if: needs.fips-plan.result != 'success'
        run: exit 1

      - name: Fail when FIPS planner output is unusable
        if: needs.fips-plan.result == 'success' && needs.fips-plan.outputs.relevant != 'true' && needs.fips-plan.outputs.relevant != 'false'
        run: exit 1

      - name: Skip expensive FIPS compile for unrelated changes
        if: needs.fips-plan.outputs.relevant == 'false'
        run: |
          {
            echo "## FIPS Build & Test"
            echo ""
            echo "No FIPS-sensitive paths changed. Feature policy still ran."
            echo "Compile, claimed-check, clippy, test-binary, and handshake jobs were skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when FIPS compile did not succeed
        if: needs.fips-plan.outputs.relevant == 'true' && needs.fips-compile.result != 'success'
        run: exit 1

      - name: Fail when FIPS claimed-profile checks did not succeed
        if: needs.fips-plan.outputs.relevant == 'true' && needs.fips-claimed-checks.result != 'success'
        run: exit 1

      - name: Fail when FIPS clippy did not succeed
        if: needs.fips-plan.outputs.relevant == 'true' && needs.fips-clippy.result != 'success'
        run: exit 1

      - name: Fail when FIPS test-binary compile did not succeed
        if: needs.fips-plan.outputs.relevant == 'true' && needs.fips-test-build.result != 'success'
        run: exit 1

      - name: Fail when FIPS tests did not succeed
        if: needs.fips-plan.outputs.relevant == 'true' && needs.fips-test.result != 'success'
        run: exit 1

      - name: Report FIPS compile gate
        if: needs.fips-plan.outputs.relevant == 'true'
        run: |
          {
            echo "## FIPS Build & Test"
            echo ""
            echo "Compile, claimed-profile checks, clippy \`-D warnings\`, "
            echo "test-binary precompile, and policy/key-admission/handshake "
            echo "tests passed."
            echo ""
            echo "Compile published its exact producer tree as the immutable "
            echo "one-day handoff artifact (sha + run_id + run_attempt) after "
            echo "the locked fips profile build. Claimed checks, clippy, and "
            echo "test-binary compile promoted that same-run artifact in "
            echo "parallel, preferring the newest attempt so failed-job reruns "
            echo "reuse a prior attempt's producer. The same artifact serves an "
            echo "explicitly chained same-SHA workflow dispatch as its inter-run "
            echo "warm source. Tests executed digest-bound binaries from the "
            echo "immutable same-run artifact published by fips-test-build. "
            echo "Stable rust-cache remains the inter-commit fallback."
            echo ""
            echo "Warm PR target: <=30 minutes, p95 <=45 minutes, measured on hosted runs."
          } >> "$GITHUB_STEP_SUMMARY"
