name: FIPS Build Policy

# FIPS deployment-mode gate for issue #3510, with CI runtime caching for #3888.
#
# Jobs:
#
# 1. `feature-policy` is the cheap REQUIRED graph audit. It reads `Cargo.toml`
#    and the resolved feature graph for both profiles and fails when a ring
#    feature could still be in control of a nominal FIPS build.
# 2. `fips-plan` decides whether the expensive compile/claimed-check/clippy/
#    test-binary/test jobs run.
#    The planner is read from the trusted base; a missing or unknown planner
#    fails closed toward running the live compile gate.
# 3. `fips-compile` is a build-only exact producer: it builds the locked FIPS
#    binary, then publishes two cache layers before claimed checks, clippy, and
#    test-binary compile start:
#    - Stable rust-cache fallback: `shared-key` is
#      `ci-fips-contract-${{ hashFiles(...) }}` (the input the pinned
#      Swatinem/rust-cache actually uses; a sibling `key:` input is ignored
#      whenever `shared-key` is set and must not appear). Automatic
#      toolchain/env/manifest/lock hashing stays enabled. This layer is NOT
#      SHA-scoped, so dependency/compiler work stays warm across commits.
#    - Exact same-run producer channel: `actions/cache` key
#      `fips-producer-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}`.
#      Saved after a successful profile build as a main step, before rust-cache's
#      post cleanup, for this-attempt claimed/clippy/test-build consumers. A new
#      attempt always gets a fresh key, so GitHub's immutable exact-hit skip
#      cannot trap newly warmed outputs.
#    Compile also publishes its successful producer tree as an immutable,
#    one-day artifact scoped to SHA + run_id + run_attempt. A later explicit
#    workflow dispatch can name that source run and attempt, downloading the
#    exact same-SHA artifact as its warm source. Separate workflow runs are
#    required because GitHub deletes a run's artifacts when that run is rerun.
#    Run artifacts are not exposed to repository cache-LRU eviction. Abrupt
#    loss of the producer cannot publish that producer's unsaved state.
# 4. `fips-claimed-checks`, `fips-clippy`, and `fips-test-build` restore the
#    same-run producer key (consumers; rust-cache `save-if: false` and no
#    producer save). Trusted non-cold runs fail closed if this-run producer
#    output is missing. restore-keys keep
#    `fips-producer-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-` so a failed-job
#    rerun of a consumer can reuse a prior attempt of the same run.
#    `fips-test-build` precompiles the complete unit_tests and integration_tests
#    executables and publishes digest-bound copies as an immutable same-run
#    artifact, overlapping claimed-profile and clippy work after the shorter
#    build-only producer. The test-binary job remains a cache consumer and does
#    not publish inter-run state.
# 5. `fips-test` downloads only the immutable same-run test artifact and
#    validates its manifest/digests before direct execution. This transport is
#    available on forced-cold and fork runs without publishing shared cache.
# 6. `fips-build` keeps the `FIPS Build & Test` check name and fails closed,
#    including on the test-binary producer result.
#
# Ferrum Edge is not a validated cryptographic module and is not independently
# FIPS-certified. A green run here means the FIPS profile builds, links the
# selected AWS-LC FIPS implementation, passes its approved-mode self-test, and
# refuses every non-approved algorithm. It does not prove that the artifact and
# operating environment fall under a CMVP certificate. See docs/fips.md.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      force_cold_cache:
        description: Skip cache restore to prove cold-path FIPS contracts
        type: boolean
        default: false
      warm_source_run_id:
        description: Exact prior FIPS workflow run ID to use as the warm source
        type: string
        required: false
        default: ""
      warm_source_run_attempt:
        description: Exact attempt number that published the warm-source artifact
        type: string
        required: false
        default: "1"

permissions:
  actions: read
  contents: read

concurrency:
  group: fips-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  FERRUM_CI_FORCE_COLD_CACHE: ${{ github.event.inputs.force_cold_cache == 'true' }}
  # Exact compile-to-consumer channel. Unique per SHA + workflow run + attempt
  # so a source-only change can publish freshly warmed Cargo/target/AWS-LC/
  # sccache state. restore-keys use the SHA+run_id prefix (no attempt) so a
  # failed-job rerun of a consumer can reuse a prior successful compile in the
  # same run. This early save is not the inter-run warm source: later
  # ordinary CI caches can LRU-evict it before the next full-workflow rerun.
  # Pull-request workflows execute a synthetic merge SHA, while a later manual
  # warm run executes the selected branch head. Bind both event shapes to the
  # pull-request head so the explicit inter-run handoff remains addressable;
  # every other event keeps its native github.sha identity.
  FIPS_PRODUCER_KEY: fips-producer-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  FIPS_PRODUCER_RESTORE_PREFIX: fips-producer-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-
  # Immutable inter-run producer artifact. A later explicit workflow dispatch
  # names the exact source run and attempt; the artifact name also binds the
  # current SHA. Separate runs avoid both repository cache LRU and GitHub's
  # deletion of a run's artifacts when that same run is rerun.
  FIPS_HANDOFF_ARTIFACT: fips-producer-handoff-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  feature-policy:
    name: FIPS Feature Policy
    runs-on: ubuntu-latest
    # This job does not install sccache, so clear the checked-in rustc wrapper
    # from `.cargo/config.toml` rather than exec'ing a missing tool.
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Static manifest contract
        run: python3 .github/scripts/check_fips_feature_policy.py --manifest-check

      - name: Resolve the ordinary (crypto-ring) feature graph
        run: |
          cargo tree --color never -e normal,build --prefix none \
            -f '{p}|{f}' --locked > /tmp/tree-crypto-ring.txt

      - name: Audit the ordinary feature graph
        run: |
          python3 .github/scripts/check_fips_feature_policy.py \
            --tree /tmp/tree-crypto-ring.txt --profile crypto-ring

      - name: Audit every claimed FIPS feature combination
        # Feature resolution alone does not build `aws-lc-fips-sys`, so this
        # needs no C/Go toolchain. The committed lockfile pins this profile too.
        #
        # The combinations are enumerated by the checker itself
        # (`--list-claimed-profiles`) rather than duplicated in YAML, so a new
        # optional feature cannot be claimed as FIPS-clean in one place and go
        # unaudited in the other. `check_claimed_profiles_declared()` in the
        # static manifest step above additionally fails when an optional cargo
        # feature is named by no claimed profile at all — an unlisted feature is
        # an implicit support claim, which is exactly what this gate refuses.
        run: |
          set -euo pipefail
          status=0
          while IFS=$'\t' read -r label features; do
            [ -n "$features" ] || continue
            echo "::group::FIPS feature graph — ${label}"
            slug="$(printf '%s' "$features" | tr ',' '-')"
            cargo tree --color never -e normal,build --prefix none \
              -f '{p}|{f}' --locked \
              --no-default-features --features "$features" \
              > "/tmp/tree-${slug}.txt"
            if ! python3 .github/scripts/check_fips_feature_policy.py \
                --tree "/tmp/tree-${slug}.txt" --profile fips; then
              echo "::error::FIPS feature-graph audit failed for ${label} (--features ${features})"
              status=1
            fi
            echo "::endgroup::"
          done < <(python3 .github/scripts/check_fips_feature_policy.py --list-claimed-profiles)
          exit "$status"

  fips-plan:
    name: FIPS compile trigger
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for FIPS compile changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          changed_files="$RUNNER_TEMP/fips-build-changed-files.txt"
          rm -f -- "$changed_files"
          : > "$changed_files"

          filter_args=(--suite fips-build --changed-files "$changed_files")

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! printf '%s' "$BASE_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$'; then
              echo "::error::refusing to resolve an unsafe base ref" >&2
              exit 1
            fi
            case "$BASE_REF" in
              *..*|*//*|*/|*.lock|*/.*)
                echo "::error::refusing to resolve an unsafe base ref" >&2
                exit 1
                ;;
            esac
            fetched=false
            for attempt in 1 2 3; do
              if git fetch --no-tags --no-recurse-submodules origin \
                "+refs/heads/${BASE_REF}:refs/ferrum/trusted-base"; then
                fetched=true
                break
              fi
              echo "git fetch of ${BASE_REF} failed (attempt ${attempt}/3); retrying" >&2
              sleep $(( attempt * 10 ))
            done
            if [ "$fetched" != true ]; then
              echo "::error::git fetch of ${BASE_REF} failed after 3 attempts" >&2
              exit 1
            fi
            trusted_sha="$(git rev-parse --verify --quiet refs/ferrum/trusted-base^{commit} || true)"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            if ! printf '%s' "$MERGE_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::merge_group base_sha missing or malformed" >&2
              exit 1
            fi
            if ! git cat-file -e "${MERGE_BASE_SHA}^{commit}" 2>/dev/null; then
              fetched=false
              for attempt in 1 2 3; do
                if git fetch --no-tags --no-recurse-submodules origin \
                  "${MERGE_BASE_SHA}"; then
                  fetched=true
                  break
                fi
                echo "git fetch of merge_group base failed (attempt ${attempt}/3); retrying" >&2
                sleep $(( attempt * 10 ))
              done
              if [ "$fetched" != true ]; then
                echo "::error::git fetch of merge_group base_sha failed after 3 attempts" >&2
                exit 1
              fi
            fi
            trusted_sha="$MERGE_BASE_SHA"
          else
            trusted_sha="$(git rev-parse --verify --quiet 'HEAD^{commit}' || true)"
            filter_args+=(--force-run)
          fi

          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::trusted base did not resolve to a full commit id" >&2
            exit 1
          fi

          if ! git cat-file -e "${trusted_sha}:.github/scripts/ci_runtime_plan.py" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "trusted base has not adopted .github/scripts/ci_runtime_plan.py; running the full gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          entry="$(git ls-tree --full-tree "$trusted_sha" -- .github/scripts/ci_runtime_plan.py)"
          if [ "$(printf '%s\n' "$entry" | grep -c . || true)" != "1" ]; then
            echo "::error::.github/scripts/ci_runtime_plan.py is not a single tree entry at ${trusted_sha}" >&2
            exit 1
          fi
          entry_mode="$(printf '%s\n' "$entry" | awk '{print $1}')"
          entry_type="$(printf '%s\n' "$entry" | awk '{print $2}')"
          entry_object="$(printf '%s\n' "$entry" | awk '{print $3}')"
          entry_path="$(printf '%s\n' "$entry" | awk -F'\t' '{print $2}')"
          if [ "$entry_type" != "blob" ] || [ "$entry_path" != ".github/scripts/ci_runtime_plan.py" ]; then
            echo "::error::.github/scripts/ci_runtime_plan.py is not a blob at ${trusted_sha}" >&2
            exit 1
          fi
          case "$entry_mode" in
            100644|100755) ;;
            *)
              echo "::error::.github/scripts/ci_runtime_plan.py has non-regular mode ${entry_mode}" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$entry_object" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::.github/scripts/ci_runtime_plan.py did not resolve to an object id" >&2
            exit 1
          fi
          if [ "$(git cat-file -s "$entry_object")" -gt 262144 ]; then
            echo "::error::.github/scripts/ci_runtime_plan.py exceeds the 256 KiB trusted-filter ceiling" >&2
            exit 1
          fi

          # Keep every lookup, materialization, hash check, and execution path
          # literal and statically inspectable by the trusted Cross policy. A
          # mutable shell alias could otherwise decouple the validated base
          # blob's target from the PR-controlled path that is executed.
          proposed_entry="$(git ls-tree --full-tree HEAD -- .github/scripts/ci_runtime_plan.py)"
          if [[ "$proposed_entry" != "100644 blob "* && \
                "$proposed_entry" != "100755 blob "* ]]; then
            echo "::error::.github/scripts/ci_runtime_plan.py must be a regular blob in the proposed checkout" >&2
            exit 1
          fi
          git cat-file blob "$entry_object" > .github/scripts/ci_runtime_plan.py
          if [ "$(git hash-object .github/scripts/ci_runtime_plan.py)" != "$entry_object" ]; then
            echo "::error::failed to materialize the exact trusted planner blob" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            git diff --name-only --no-renames -z "${trusted_sha}...HEAD" \
              > "$changed_files"
          fi

          python3 -I .github/scripts/ci_runtime_plan.py --self-test
          plan="$(python3 -I .github/scripts/ci_runtime_plan.py "${filter_args[@]}")"
          relevant="$(printf '%s\n' "$plan" | sed -n 's/^relevant=//p')"
          case "$relevant" in
            true|false) ;;
            *)
              echo "::error::trusted relevance filter produced no usable verdict" >&2
              exit 1
              ;;
          esac
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevance decided by trusted base ${trusted_sha}." >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$plan" | sed -n '/^## /,$p' >> "$GITHUB_STEP_SUMMARY"

  fips-compile:
    name: FIPS compile
    needs: fips-plan
    if: needs.fips-plan.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: ./.github/actions/setup-sccache

      # Cargo fingerprints the resolved rustc-wrapper executable, including
      # its runner-local path and metadata. setup-sccache deliberately installs
      # into a fresh private directory, so carrying that wrapper identity into
      # Cargo would invalidate every restored Rust artifact on the next job or
      # runner. The exact target handoff is the compiler cache for this gate;
      # clear the wrapper before any Cargo/cache operation so its artifacts
      # retain the native rustc identity across trusted restores.
      - name: Stabilize Cargo compiler identity for exact-target reuse
        run: |
          set -euo pipefail
          if [ -n "${FERRUM_SCCACHE_BIN:-}" ] && [ -x "${FERRUM_SCCACHE_BIN}" ]; then
            "${FERRUM_SCCACHE_BIN}" --stop-server > /dev/null 2>&1 || true
          fi
          printf '%s\n' 'RUSTC_WRAPPER=' 'CARGO_BUILD_RUSTC_WRAPPER=' >> "$GITHUB_ENV"

      - name: Install aws-lc-fips-sys build prerequisites
        # The FIPS build of AWS-LC is compiled through the upstream crate's
        # source-build path. This is a functional CI gate; certificate
        # applicability still depends on the vendor security policy and the
        # deployment's exact module version and operating environment.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build golang-go libcurl4-openssl-dev protobuf-compiler zstd

      - uses: ./.github/actions/setup-fast-linker

      # Stable dependency/compiler fallback. The contract discriminator lives in
      # `shared-key` because pinned rust-cache ignores `key` whenever
      # `shared-key` is set. Do not add `key:` or `add-job-id-key`. Automatic
      # env/manifest/lock hashing remains enabled. This key is not SHA-scoped.
      - name: Cache FIPS Rust, AWS-LC, and sccache outputs
        if: github.event.inputs.force_cold_cache != 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-fips-contract-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'build.rs', '.github/workflows/fips-build.yml', '.github/scripts/check_fips_feature_policy.py', 'src/fips/**', 'vendor/**') }}
          cache-directories: ${{ github.workspace }}/.cache/sccache
          cache-on-failure: "true"
          save-if: ${{ github.event.pull_request.head.repo.fork != true }}

      - name: Record rust-cache restore
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit "$CACHE_HIT" \
            --path "${GITHUB_WORKSPACE}/.cache/sccache" \
            --note "layer=stable-fallback; measured=sccache-directory-subset; rust-cache Cargo/target archive bytes are not exposed; shared-key=ci-fips-contract save-if=non-fork fork=${FORK_PR:-false}"

      # Full reruns delete artifacts from earlier attempts of the same run.
      # Warm evidence therefore chains separate workflow_dispatch runs, naming
      # the exact preceding run and attempt. The action receives a read-only
      # token internally; no PR-controlled run step receives GITHUB_TOKEN.
      - name: Download exact inter-run FIPS handoff artifact
        if: github.event.inputs.force_cold_cache != 'true' && github.event_name == 'workflow_dispatch' && inputs.warm_source_run_id != ''
        id: inter-run-fips-handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fips-producer-handoff-${{ github.event.pull_request.head.sha || github.sha }}-${{ inputs.warm_source_run_id }}-${{ inputs.warm_source_run_attempt }}
          path: ${{ runner.temp }}/inter-run-fips-handoff
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.warm_source_run_id }}

      - name: Promote exact inter-run FIPS handoff artifact
        if: github.event.inputs.force_cold_cache != 'true' && github.event_name == 'workflow_dispatch' && inputs.warm_source_run_id != '' && steps.inter-run-fips-handoff.outcome == 'success'
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/inter-run-fips-handoff"
          archive="${source_root}/fips-producer-handoff.tar.zst"
          if [ ! -f "$archive" ] || [ -L "$archive" ]; then
            echo "::error::inter-run FIPS handoff is missing its real tar.zst payload" >&2
            exit 1
          fi
          extract_root="${RUNNER_TEMP}/inter-run-fips-extracted"
          rm -rf "$extract_root"
          mkdir -p "$extract_root"
          tar --zstd --no-same-owner -xf "$archive" -C "$extract_root"
          for path in target .cache/sccache; do
            source_path="${extract_root}/${path}"
            if [ ! -d "$source_path" ] || [ -L "$source_path" ]; then
              echo "::error::inter-run FIPS handoff is missing a real ${path} directory" >&2
              exit 1
            fi
          done
          tree_manifest="${extract_root}/fips-producer-source-tree"
          if [ ! -f "$tree_manifest" ] || [ -L "$tree_manifest" ]; then
            echo "::error::inter-run FIPS handoff is missing its real source-tree manifest" >&2
            exit 1
          fi
          archived_tree="$(cat "$tree_manifest")"
          line_count="$(wc -l < "$tree_manifest")"
          if [ "$line_count" -ne 1 ] || [ "${#archived_tree}" -ne 40 ] || \
             [[ "$archived_tree" == *[!0-9a-f]* ]]; then
            echo "::error::inter-run FIPS handoff source-tree manifest is malformed" >&2
            exit 1
          fi
          current_tree="$(git rev-parse HEAD^{tree})"
          if [ "$archived_tree" != "$current_tree" ]; then
            echo "::error::inter-run FIPS handoff source tree does not match this checkout; refusing stale-base reuse" >&2
            exit 1
          fi
          if ! git diff --quiet --no-ext-diff || \
             ! git diff --cached --quiet --no-ext-diff; then
            echo "::error::tracked checkout content changed before FIPS handoff promotion" >&2
            exit 1
          fi
          rm -rf "${GITHUB_WORKSPACE}/target" "${GITHUB_WORKSPACE}/.cache/sccache"
          mkdir -p "${GITHUB_WORKSPACE}/.cache"
          mv "${extract_root}/target" "${GITHUB_WORKSPACE}/target"
          mv "${extract_root}/.cache/sccache" "${GITHUB_WORKSPACE}/.cache/sccache"
          # Checkout gives the identical source tree fresh mtimes. The handoff
          # is already bound to this exact head/run/attempt, so make its regular
          # outputs newer only after validating the restored executable. This
          # prevents Cargo from relinking exact-head outputs as merely stale.
          target_root="${GITHUB_WORKSPACE}/target"
          fips_binary="${target_root}/debug/ferrum-edge"
          if [ ! -d "$target_root" ] || [ -L "$target_root" ] || \
             [ ! -f "$fips_binary" ] || [ -L "$fips_binary" ] || \
             [ ! -x "$fips_binary" ]; then
            echo "::error::exact inter-run FIPS target is missing its executable; refusing to refresh restored mtimes" >&2
            exit 1
          fi
          mtime_reference="${RUNNER_TEMP}/fips-target-mtime-reference"
          rm -f "$mtime_reference"
          touch "$mtime_reference"
          find "$target_root" -xdev -type f \
            -exec touch --reference="$mtime_reference" -- {} +
          rm -f "$mtime_reference"

      - name: Record inter-run FIPS handoff restore
        if: github.event.inputs.force_cold_cache != 'true' && github.event_name == 'workflow_dispatch' && inputs.warm_source_run_id != ''
        env:
          SOURCE_RUN_ID: ${{ inputs.warm_source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.warm_source_run_attempt }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name inter-run-fips-handoff \
            --hit true \
            --path "${GITHUB_WORKSPACE}/target" \
            --note "layer=inter-run-artifact; measured=target-directory; source_run=${SOURCE_RUN_ID}; source_attempt=${SOURCE_RUN_ATTEMPT}"

      - name: Record absent inter-run FIPS handoff
        if: github.event.inputs.force_cold_cache != 'true' && (github.event_name != 'workflow_dispatch' || inputs.warm_source_run_id == '')
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name inter-run-fips-handoff \
            --hit false \
            --bytes 0 \
            --note "layer=inter-run-artifact; no explicit warm source requested"

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit false \
            --bytes 0 \
            --note "layer=stable-fallback; force_cold_cache skipped restore"
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name inter-run-fips-handoff \
            --hit false \
            --bytes 0 \
            --note "layer=inter-run-artifact; force_cold_cache skipped download"
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-producer \
            --hit false \
            --bytes 0 \
            --note "layer=producer; force_cold_cache skipped save"

      - name: Assert cache-service credentials are absent
        run: |
          set -euo pipefail
          leaked=0
          for var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
            if [ -n "${!var:-}" ]; then
              echo "::error::${var} is present in this run environment; refusing to execute later PR-controlled build steps with a cache-service credential" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi

      - name: Build the FIPS profile
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py start --phase fips-build
          set +e
          cargo build --locked --no-default-features --features fips --bin ferrum-edge
          status=$?
          set -e
          python3 .github/scripts/ci_runtime_telemetry.py end --phase fips-build --status "$status"
          exit "$status"

      # Exact producer archive: full workspace target + sccache as left by this
      # successful profile build. Test-binary precompile is a parallel consumer
      # so claimed-profile and clippy work do not wait on it. Saved as a main
      # step so rust-cache's later post cleanup (which strips workspace crates)
      # cannot empty it. Unique sha/run_id/run_attempt avoids immutable
      # exact-hit collisions.
      - name: Save FIPS producer compile outputs
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca # v4.2.4
        with:
          path: |
            ${{ github.workspace }}/target
            ${{ github.workspace }}/.cache/sccache
          key: ${{ env.FIPS_PRODUCER_KEY }}

      # Artifact ZIP extraction normalizes permissions. Package the producer
      # tree first so executable modes inside target survive the handoff.
      - name: Package inter-run FIPS producer handoff
        if: github.event.inputs.force_cold_cache != 'true'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/fips-producer-handoff.tar.zst"
          tree_manifest="${RUNNER_TEMP}/fips-producer-source-tree"
          rm -f "$archive"
          if ! git diff --quiet --no-ext-diff || \
             ! git diff --cached --quiet --no-ext-diff; then
            echo "::error::tracked checkout content changed while building the FIPS producer" >&2
            exit 1
          fi
          source_tree="$(git rev-parse HEAD^{tree})"
          if [ "${#source_tree}" -ne 40 ] || [[ "$source_tree" == *[!0-9a-f]* ]]; then
            echo "::error::failed to resolve the FIPS producer source tree" >&2
            exit 1
          fi
          printf '%s\n' "$source_tree" > "$tree_manifest"
          tar --zstd -cf "$archive" -C "$GITHUB_WORKSPACE" \
            target .cache/sccache -C "$RUNNER_TEMP" fips-producer-source-tree
          rm -f "$tree_manifest"
          if [ ! -s "$archive" ] || [ -L "$archive" ]; then
            echo "::error::failed to create a real FIPS producer handoff archive" >&2
            exit 1
          fi

      # Unlike the repository cache, this immutable run artifact is not subject
      # to cache-LRU churn from concurrent PR jobs. It is exact to the SHA, run,
      # and attempt, and download-artifact verifies its service digest.
      - name: Publish inter-run FIPS producer handoff
        if: github.event.inputs.force_cold_cache != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.FIPS_HANDOFF_ARTIFACT }}
          path: ${{ runner.temp }}/fips-producer-handoff.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Record sccache stats
        if: always()
        run: |
          sccache_bin="${FERRUM_SCCACHE_BIN:-}"
          if [ -n "$sccache_bin" ] && [ -x "$sccache_bin" ]; then
            "$sccache_bin" --show-stats || true
          fi
          python3 .github/scripts/ci_runtime_telemetry.py summarize --title "FIPS compile"

  fips-claimed-checks:
    name: FIPS claimed feature combinations (${{ matrix.shard_name }})
    needs: fips-compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_name: 1-of-3
          - shard_index: 1
            shard_name: 2-of-3
          - shard_index: 2
            shard_name: 3-of-3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize runtime telemetry
        run: python3 .github/scripts/ci_runtime_telemetry.py init --quiet

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: ./.github/actions/setup-sccache

      - name: Stabilize Cargo compiler identity for exact-target reuse
        run: |
          set -euo pipefail
          if [ -n "${FERRUM_SCCACHE_BIN:-}" ] && [ -x "${FERRUM_SCCACHE_BIN}" ]; then
            "${FERRUM_SCCACHE_BIN}" --stop-server > /dev/null 2>&1 || true
          fi
          printf '%s\n' 'RUSTC_WRAPPER=' 'CARGO_BUILD_RUSTC_WRAPPER=' >> "$GITHUB_ENV"

      - name: Install aws-lc-fips-sys build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build golang-go libcurl4-openssl-dev protobuf-compiler

      - uses: ./.github/actions/setup-fast-linker

      - name: Cache FIPS Rust, AWS-LC, and sccache outputs
        if: github.event.inputs.force_cold_cache != 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-fips-contract-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'build.rs', '.github/workflows/fips-build.yml', '.github/scripts/check_fips_feature_policy.py', 'src/fips/**', 'vendor/**') }}
          cache-directories: ${{ github.workspace }}/.cache/sccache
          cache-on-failure: "true"
          save-if: "false"

      - name: Record rust-cache restore
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit "$CACHE_HIT" \
            --path "${GITHUB_WORKSPACE}/.cache/sccache" \
            --note "layer=stable-fallback; measured=sccache-directory-subset; rust-cache Cargo/target archive bytes are not exposed; save-if=false fork=${FORK_PR:-false}"

      - name: Drop stable target before producer restore
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}/target" "${GITHUB_WORKSPACE}/.cache/sccache"

      - name: Restore FIPS producer compile outputs
        if: github.event.inputs.force_cold_cache != 'true'
        id: fips-producer
        uses: actions/cache/restore@374a27f26986edd8c430f386d152a856e179c0ae # v4.2.4
        with:
          path: |
            ${{ github.workspace }}/target
            ${{ github.workspace }}/.cache/sccache
          key: ${{ env.FIPS_PRODUCER_KEY }}
          restore-keys: |
            ${{ env.FIPS_PRODUCER_RESTORE_PREFIX }}
          fail-on-cache-miss: ${{ github.event.pull_request.head.repo.fork != true }}

      - name: Record FIPS producer restore
        if: github.event.inputs.force_cold_cache != 'true'
        env:
          CACHE_HIT: ${{ steps.fips-producer.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.fips-producer.outputs.cache-matched-key }}
          CACHE_PRIMARY: ${{ steps.fips-producer.outputs.cache-primary-key }}
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py classify-restore \
            --name fips-producer \
            --hit "$CACHE_HIT" \
            --matched "$CACHE_MATCHED" \
            --primary "$CACHE_PRIMARY" \
            --path "${GITHUB_WORKSPACE}/target" \
            --note "layer=producer; measured=target-directory; sccache restored with the same producer key"

      - name: Record cold-cache proof
        if: github.event.inputs.force_cold_cache == 'true'
        run: |
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name rust-cache \
            --hit false \
            --bytes 0 \
            --note "layer=stable-fallback; force_cold_cache skipped restore"
          python3 .github/scripts/ci_runtime_telemetry.py cache \
            --name fips-producer \
            --hit false \
            --bytes 0 \
            --note "layer=producer; force_cold_cache skipped restore"

      - name: Require this-run FIPS producer cache
        if: github.event.inputs.force_cold_cache != 'true' && github.event.pull_request.head.repo.fork != true
        env:
          MATCHED: ${{ steps.fips-producer.outputs.cache-matched-key }}
          PREFIX: ${{ env.FIPS_PRODUCER_RESTORE_PREFIX }}
        run: |
          set -euo pipefail
          case "$MATCHED" in
            "$PREFIX"*)
              echo "Restored this-run FIPS producer cache."
              ;;
            *)
              echo "::error::fips-compile producer cache was not restored for this event-stable source SHA/run_id; refusing to claim compile-to-consumer reuse" >&2
              exit 1
              ;;
          esac
          # The validated producer prefix is bound to this source SHA/run_id.
          # Refresh only regular target files after that proof so the newer
          # checkout mtimes do not force Cargo to relink identical outputs.
          target_root="${GITHUB_WORKSPACE}/target"
          fips_binary="${target_root}/debug/ferrum-edge"
          if [ ! -d "$target_root" ] || [ -L "$target_root" ] || \
             [ ! -f "$fips_binary" ] || [ -L "$fips_binary" ] || \
             [ ! -x "$fips_binary" ]; then
            echo "::error::this-run FIPS target is missing its executable; refusing to refresh restored mtimes" >&2
            exit 1
          fi
          mtime_reference="${RUNNER_TEMP}/fips-target-mtime-reference"
          rm -f "$mtime_reference"
          touch "$mtime_reference"
          find "$target_root" -xdev -type f \
            -exec touch --reference="$mtime_reference" -- {} +
          rm -f "$mtime_reference"

      - name: Assert cache-service credentials are absent
        run: |
          set -euo pipefail
          leaked=0
          for var in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_CACHE_URL; do
            if [ -n "${!var:-}" ]; then
              echo "::error::${var} is present in this run environment; refusing to execute later PR-controlled build steps with a cache-service credential" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi

      - name: Compile every crypto-relevant optional FIPS combination
        # `cargo check` proves each claimed cryptographic combination while
        # avoiding redundant binary links. Three deterministic ordinal shards
        # keep the warm gate below its wall-time target without duplicating the
        # checker-owned profile inventory in workflow YAML. The cloud-secrets
        # profile remains compile-covered even though runtime policy refuses it.
        env:
          FIPS_CLAIMED_SHARD_INDEX: ${{ matrix.shard_index }}
          FIPS_CLAIMED_SHARD_COUNT: 3
        run: |
          set -euo pipefail
          case "${FIPS_CLAIMED_SHARD_INDEX}:${FIPS_CLAIMED_SHARD_COUNT}" in
            0:3|1:3|2:3) ;;
            *)
              echo "::error::invalid FIPS claimed-profile shard contract" >&2
              exit 1
              ;;
          esac
          phase="fips-claimed-checks-${FIPS_CLAIMED_SHARD_INDEX}"
          python3 .github/scripts/ci_runtime_telemetry.py start --phase "$phase"
          profiles_file="$(mktemp)"
          trap 'rm -f "$profiles_file"' EXIT
          python3 .github/scripts/check_fips_feature_policy.py \
            --list-claimed-profiles > "$profiles_file"
          status=0
          profile_index=0
          selected=0
          while IFS=$'\t' read -r label features; do
            [ -n "$features" ] || continue
            if [ $((profile_index % FIPS_CLAIMED_SHARD_COUNT)) -eq "$FIPS_CLAIMED_SHARD_INDEX" ]; then
              selected=$((selected + 1))
              echo "::group::cargo check — ${label}"
              if ! cargo check --locked --no-default-features --features "$features" \
                --lib --bins; then
                echo "::error::FIPS claimed-profile compile failed for ${label} (--features ${features})"
                status=1
              fi
              echo "::endgroup::"
            fi
            profile_index=$((profile_index + 1))
          done < "$profiles_file"
          if [ "$profile_index" -eq 0 ] || [ "$selected" -eq 0 ]; then
            echo "::error::FIPS claimed-profile shard ${FIPS_CLAIMED_SHARD_INDEX} selected no profiles" >&2
            status=1
          fi
          python3 .github/scripts/ci_runtime_telemetry.py end --phase "$phase" --status "$status"
          exit "$status"

      - name: Record sccache stats
        if: always()
        env:
          FIPS_CLAIMED_SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          sccache_bin="${FERRUM_SCCACHE_BIN:-}"
          if [ -n "$sccache_bin" ] && [ -x "$sccache_bin" ]; then
            "$sccache_bin" --show-stats || true
          fi
          python3 .github/scripts/ci_runtime_telemetry.py summarize \
            --title "FIPS claimed profiles (${FIPS_CLAIMED_SHARD_INDEX})"

