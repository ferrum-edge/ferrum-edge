name: Claude PR Review

# Proposal only. Keep the existing workflow disabled until owner configuration
# and trusted-base admission have been independently reviewed. No comment trigger.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: string
      head_sha:
        description: Exact 40-character pull request head SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  model:
    if: github.repository == 'ferrum-edge/ferrum-edge' && github.ref == 'refs/heads/main' && vars.LLM_REVIEW_MODEL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Only trusted automation is checked out. PR source arrives as bounded
      # JSON data from exact-SHA APIs, never as a worktree or agent settings.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/generate_llm_review.py
            .github/scripts/llm_review_io.py
          sparse-checkout-cone-mode: false

      - name: Generate an untrusted review artifact without model tools
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_REVIEW_API_KEY: ${{ secrets.ANTHROPIC_REVIEW_API_KEY }}
          REVIEW_MODEL: ${{ vars.LLM_REVIEW_MODEL }}
          REVIEW_PR: ${{ inputs.pr_number }}
          REVIEW_HEAD: ${{ inputs.head_sha }}
          REVIEW_DIR: ${{ runner.temp }}/llm-review
        run: python3 -I .github/scripts/generate_llm_review.py

      - name: Upload review data for human inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llm-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llm-review/*
          if-no-files-found: error
          retention-days: 3
