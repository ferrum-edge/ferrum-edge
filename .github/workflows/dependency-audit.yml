name: Dependency Audit

# Scheduled supply-chain governance for the dependency tree and the vendored,
# patched crates (reqwest / h3 / tungstenite / tokio-tungstenite / dimpl —
# canonically docs/vendored-patch-lifecycle.json). The blocking
# advisories gate also runs per-PR in ci.yml; this workflow re-checks against the
# latest advisory database WITHOUT a PR (so a newly-published RUSTSEC advisory is
# caught within a week even on a quiet repo) and adds two time-sensitive checks
# that only make sense on a schedule: advisory-exception expiry and upstream
# patch-merge status.
#
# Full policy: docs/dependency-policy.md.

on:
  schedule:
    # Mondays 05:30 UTC — sits between the Sunday coverage/prune crons and the
    # Monday 07:00 conformance cron so the weekly maintenance ticks don't stack.
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  # cargo-deny runs `cargo metadata`; this workflow doesn't install sccache, so
  # clear the checked-in sccache rustc-wrapper (.cargo/config.toml) — the same
  # fallback the setup-sccache action applies — to avoid exec'ing a missing tool.
  RUSTC_WRAPPER: ""
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  advisories:
    name: Advisories & exception expiry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          # cargo-deny pinned to the validated schema version; cargo-audit is a
          # non-blocking second opinion, so it tracks latest.
          tool: cargo-deny@0.19.9,cargo-audit

      - name: cargo-deny (advisories, bans, sources, licenses)
        # Same blocking policy as the per-PR gate, re-evaluated against the
        # freshly-fetched advisory DB. A new advisory or disallowed license not
        # time-boxed in deny.toml fails here even when no PR has opened.
        run: cargo deny check advisories bans sources licenses

      - name: cargo-deny (eBPF workspace)
        # `ebpf/Cargo.toml` is a separate [workspace]; its `ferrum-ebpf` member
        # never enters the root graph but ships in the published `-ebpf` /
        # `-ebpf-tools` images and runs privileged on the host network. Shares
        # the root policy via `--config deny.toml`. `always()` so a root-graph
        # failure above can't hide the eBPF verdict.
        if: always()
        # `--allow advisory-not-detected`: the shared deny.toml ignore list is
        # scoped to the root graph (mongodb/aws/sqlx paths that the eBPF workspace
        # never pulls in); with `unused-ignored-advisory = "deny"` those entries
        # would otherwise fail this run for not matching anything here.
        run: >-
          cargo deny --manifest-path ebpf/Cargo.toml
          check --allow advisory-not-detected --config deny.toml advisories bans sources licenses

      - name: Advisory-exception expiry self-test
        # Proves the checker still rejects a missing/expired [expires:] token —
        # for [advisories.ignore] AND [licenses.exceptions] — against synthetic
        # deny.toml fixtures, before it is trusted on the real one below.
        if: always()
        run: bash scripts/check_advisory_expiry.sh --self-test

      - name: Advisory-exception expiry
        # Fails once any deny.toml [expires:] date has passed, so a time-boxed
        # advisory ignore or license exception can never silently become
        # permanent.
        if: always()
        run: bash scripts/check_advisory_expiry.sh

      - name: Third-party license inventory
        # Crate -> license listing derived from the LOCKED graph, so the shipped
        # notices and the enforced [licenses] allowlist cannot diverge silently.
        # `cargo deny list` only reads `cargo metadata`; it compiles nothing.
        if: always()
        run: cargo deny list --format json --layout crate > third-party-licenses.json

      - name: Upload third-party license inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: third-party-licenses
          path: third-party-licenses.json
          retention-days: 30

      - name: cargo-audit (second opinion)
        # Belt-and-suspenders: cargo-audit's advisory matching occasionally
        # differs from cargo-deny's. Informational — the blocking signal is the
        # cargo-deny step above.
        if: always()
        run: cargo audit || true

  upstream-patch-status:
    name: Vendored patch upstream status
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Vendored-patch lifecycle parity
        # Checker runs synthetic self-tests before repository parity.
        run: python3 scripts/check_vendored_patch_lifecycle.py

      - name: Check upstream status of vendored patches
        # Reports each vendored patch's upstream PR state + latest crates.io
        # release. Fails (red scheduled run) when an upstream PR has merged, so
        # a retireable vendor copy can't be missed. See docs/dependency-policy.md.
        # Wrapper path also self-tests, then parity, then network reporting.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check_vendored_patch_status.sh
