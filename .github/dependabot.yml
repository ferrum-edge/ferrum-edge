version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Frozen action pins rotate with their trusted contracts; see
    # docs/dependency-policy.md#rotating-frozen-actions.
    ignore:
      - dependency-name: "actions/cache/restore"
      - dependency-name: "actions/cache/save"
      - dependency-name: "actions/checkout"
      - dependency-name: "actions/download-artifact"
      - dependency-name: "actions/setup-python"
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "docker/build-push-action"
      - dependency-name: "docker/login-action"
      - dependency-name: "docker/setup-buildx-action"
      - dependency-name: "dtolnay/rust-toolchain"
      - dependency-name: "Swatinem/rust-cache"
      - dependency-name: "taiki-e/install-action"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # Docker discovers every file whose name matches /dockerfile|containerfile/i,
  # so `Dockerfile`, `Dockerfile.release`, `Dockerfile.test`, and
  # `Dockerfile.ebpf-tools-layer` are all in scope. Its parser only reads `FROM`
  # lines; the `ARG <NAME>=<image>@sha256:...` defaults are refreshed by
  # `.github/workflows/base-image-digest-refresh.yml` instead. Both mechanisms
  # are digest-preserving: they rewrite the digest, never drop it.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
