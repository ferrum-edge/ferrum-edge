version: 2
updates:
  # The root workspace, plus the mesh benchmark crate, which path-depends on
  # the root crate and carries the same vendored patch table. Other standalone
  # lockfiles still get security updates; see
  # docs/dependency-policy.md#cargo-dependency-updates for why they are not here.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/tests/performance/mesh"
    schedule:
      interval: "weekly"
      day: "monday"
    # Crates replaced by a vendored `[patch.crates-io]` copy, plus sqlx, whose
    # crates pin `sqlx-core` exactly. Moving any of them past its vendored
    # version silently drops the Ferrum patch from the build. They move only by
    # re-vendoring (docs/dependency-policy.md).
    ignore:
      - dependency-name: "sqlx*"
      - dependency-name: "reqwest"
      - dependency-name: "h3"
      - dependency-name: "h3-quinn"
      - dependency-name: "tungstenite"
      - dependency-name: "tokio-tungstenite"
      - dependency-name: "dimpl"
      - dependency-name: "hyper"
      - dependency-name: "hyper-util"
      - dependency-name: "h2"
    groups:
      # The Azure SDK crates share `azure_core`'s `TokenCredential` trait, so
      # they only compile when they move together (a lone `azure_core` major
      # bump broke the build in #6559). This group comes first so it claims
      # them, majors included, before the catch-all group below.
      azure-sdk:
        patterns:
          - "azure_*"
          - "typespec*"
      # One weekly PR per directory for every compatible update; a
      # semver-major update gets its own PR and a maintainer.
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # Every external action, including those inside frozen trusted-policy
  # surfaces, rotates through ordinary Dependabot PRs: the trusted policy
  # compares pin-normalized text and admits a changed pin only as a forward
  # upstream release, and green PRs auto-merge. See
  # docs/dependency-policy.md#automated-action-pin-rotation.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Publishes no release tags (one branch per toolchain), so no new pin
      # could pass the release-tag rule; rotate it by hand.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      # One weekly PR (one CI run) for every compatible action update;
      # a semver-major update gets its own PR and a maintainer.
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # Docker discovers every file whose name matches /dockerfile|containerfile/i,
  # so `Dockerfile`, `Dockerfile.release`, `Dockerfile.test`, and
  # `Dockerfile.ebpf-tools-layer` are all in scope. Its parser only reads `FROM`
  # lines; the `ARG <NAME>=<image>@sha256:...` defaults are refreshed by
  # `.github/workflows/base-image-digest-refresh.yml` instead. Both mechanisms
  # are digest-preserving: they rewrite the digest, never drop it.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
