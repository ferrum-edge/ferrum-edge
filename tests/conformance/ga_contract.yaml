schema_version: 1
capabilities:
  - id: mesh.destination_rule.tcp_connect_timeout
    display_name: DestinationRule TCP connect timeout
    maturity: ga
    topology: sidecar
    config_protocol: istio
    semantic_assertions:
      - category: istio_destination_rule
        feature: trafficPolicy.connectionPool.tcp.connectTimeout
    live_suite: mesh-e2e-sidecar
    live_assertions:
      - sidecar.destination_rule.tcp_connect_timeout
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#destinationrule
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.

  - id: mesh.destination_rule.tcp_max_connections
    display_name: DestinationRule TCP max connections
    maturity: ga
    topology: sidecar
    config_protocol: istio
    semantic_assertions:
      - category: istio_destination_rule
        feature: trafficPolicy.connectionPool.tcp.maxConnections
    live_suite: mesh-e2e-sidecar
    # maxConnections is enforced on stream-family (TCP) and WebSocket backend
    # connections only — never on the pooled multiplexed mesh-mTLS HTTP egress
    # path (docs/mesh.md "DestinationRule maxConnections enforcement scope") —
    # so the live backing is a WebSocket flow: one held WS session at
    # maxConnections=1, a second upgrade rejected 503, recovery after release
    # (issue #1974).
    live_assertions:
      - sidecar.destination_rule.tcp_max_connections
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#destinationrule
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.

  - id: mesh.virtual_service.cors_policy
    display_name: VirtualService HTTP CORS policy
    maturity: ga
    topology: sidecar
    config_protocol: istio
    semantic_assertions:
      - category: istio_virtual_service
        feature: http[].corsPolicy
    live_suite: mesh-e2e-sidecar
    # Live-backed via the mesh slice's `virtual_service_cors_policies`
    # carriage (issue #1973): the client sidecar synthesizes the `cors`
    # plugin onto its materialized outbound route, and the suite proves an
    # allowed Origin reflected, a sidecar-answered Istio 200 preflight, and
    # unmatched actual/preflight requests forwarded without gateway ACAO.
    live_assertions:
      - sidecar.virtual_service.cors_policy
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#virtualservice-translation
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.

  - id: mesh.peer_authentication.strict_mtls
    display_name: PeerAuthentication STRICT inbound mTLS
    maturity: ga
    topology: sidecar
    config_protocol: istio
    semantic_assertions:
      - category: istio_peer_authentication
        feature: mtls.mode = STRICT
    live_suite: mesh-e2e-sidecar
    live_assertions:
      - sidecar.peer_auth.strict_mtls_authenticated
      - sidecar.peer_auth.strict_mtls_plaintext_rejected
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#peerauthentication
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.

  - id: mesh.authorization_policy.allow_deny_enforcement
    display_name: AuthorizationPolicy ALLOW/DENY enforcement
    maturity: ga
    topology: sidecar
    config_protocol: istio
    semantic_assertions:
      - category: istio_authorization_policy
        feature: DENY beats ALLOW on overlap
      - category: istio_authorization_policy
        feature: ALLOW + rule admits matching request
    live_suite: mesh-e2e-sidecar
    # The identity-scoped DENY is the distinctive observation; the ALLOW half
    # is proven by the authenticated positive traversing an ALLOW rule
    # (sidecar.peer_auth.strict_mtls_authenticated) and its implicit-deny
    # complement (sidecar.request_auth.missing_jwt_rejected).
    live_assertions:
      - sidecar.authz.denied_principal_rejected
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#authorization
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.

  - id: mesh.identity.spire_svid_issuance
    display_name: SPIFFE identity plumbing (SPIRE Agent CA)
    maturity: ga
    topology: sidecar
    # Identity is delivered over the SPIRE Agent Workload API
    # (FERRUM_MESH_CA_BACKEND=spire_agent), not a config protocol translation.
    config_protocol: spiffe_workload_api
    semantic_assertions:
      - category: mesh_spiffe_identity
        feature: SPIFFE ID parse + Istio ns/sa convention
      - category: mesh_spiffe_identity
        feature: X.509 URI-SAN SVID identity extraction
      - category: mesh_spiffe_identity
        feature: inbound peer SVID verification decision
      - category: mesh_spiffe_identity
        feature: gateway SVID slot fail-closed inbound identity
      - category: mesh_spiffe_identity
        feature: FERRUM_MESH_CA_BACKEND spire_agent selection
    live_suite: mesh-e2e-sidecar
    # Live backing: the suite registers SPIRE workload entries for every
    # fixture identity (sidecar.spire.workload_entries) and the STRICT-mTLS
    # positive rides SPIRE-issued SVIDs on both sides of the captured datapath
    # (sidecar.peer_auth.strict_mtls_authenticated, shared with the
    # PeerAuthentication row — sharing an emitted live assertion id across
    # rows is deliberate and validated per-row).
    live_assertions:
      - sidecar.spire.workload_entries
      - sidecar.peer_auth.strict_mtls_authenticated
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#spire-agent-ca
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.
      - Internal self-signed CA (FERRUM_MESH_CA_BACKEND=internal) remains Dev-only and is excluded.

  - id: mesh.request_authentication.jwt_validation
    display_name: RequestAuthentication JWT validation
    maturity: ga
    topology: sidecar
    config_protocol: istio
    semantic_assertions:
      - category: istio_request_authentication
        feature: jwtRules[].issuer + inline jwks
    live_suite: mesh-e2e-sidecar
    live_assertions:
      - sidecar.request_auth.valid_jwt_admitted
      - sidecar.request_auth.missing_jwt_rejected
      - sidecar.request_auth.invalid_jwt_rejected
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#requestauthentication
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.

  - id: mesh.config_transport.native_subscribe
    display_name: Native MeshSubscribe config transport
    maturity: ga
    topology: sidecar
    # Config arrives over the Ferrum-native MeshConfigSync.MeshSubscribe gRPC
    # stream (a Ferrum CP serving a Ferrum DP), not an Istio CRD translation
    # or third-party xDS feed.
    config_protocol: native_mesh_subscribe
    semantic_assertions:
      - category: mesh_config_transport
        feature: namespace-scoped MeshSlice snapshot build
      - category: mesh_config_transport
        feature: MeshSubscribe update dedupe via content_eq
      - category: mesh_config_transport
        feature: native slice apply + malformed-update fail-closed
    live_suite: mesh-e2e-sidecar
    # Live backing (issue #2002): the fixture deploys a Ferrum CP (cp mode,
    # sqlite, K8s pod discovery building the mesh model from the cluster's
    # real Services/pods) and a sidecar DP on
    # FERRUM_MESH_CONFIG_PROTOCOL=native. Captured client traffic reaching
    # the capp app proves the CP-delivered slice materialized the inbound
    # datapath (those routes exist ONLY via MeshSubscribe delivery), and the
    # DP's JWT-authenticated /mesh/config-drift must attribute the slice to
    # source_protocol=native from the ferrum-cp URL.
    live_assertions:
      - sidecar.config.native_subscribe_delivered
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#native-meshsubscribe-default
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.
      - The xDS ADS transport is a separate surface and is not covered by this row.
      - The live fixture exercises the transport over in-cluster plaintext h2c with JWT auth (FERRUM_CP_DP_GRPC_ALLOW_PLAINTEXT=true); CP-DP gRPC TLS is an orthogonal, documented deployment knob not exercised by this row.

  # ── Multicluster federation (issue #2459) ────────────────────────────────
  # Live-proven two-cluster SPIRE federation + east-west SNI datapath. Poller-
  # driven cross-cluster endpoint discovery remains Experimental and is
  # excluded from every row below.

  - id: mesh.multicluster.spire_trust_federation
    display_name: Multicluster SPIRE trust federation
    maturity: ga
    topology: sidecar
    config_protocol: spiffe_workload_api
    semantic_assertions:
      - category: mesh_multicluster_federation
        feature: remote cluster requires federated trust bundle
      - category: mesh_multicluster_federation
        feature: federated trust domain uniqueness
    live_suite: multicluster-federation
    live_assertions:
      - multicluster.spire.federation_ready_a
      - multicluster.spire.federation_ready_b
      - multicluster.federation.trust_bundle_exchange
      - multicluster.spire.workload_entries
    platform_profile: kind-spire-multicluster-federation
    docs_anchor: docs/mesh.md#trust-federation
    owner: mesh
    exclusions:
      - Cross-cluster endpoint discovery (poller-driven) remains Experimental.
      - Network-partition / last-good retention live coverage remains deferred (#3331).

  - id: mesh.multicluster.eastwest_authenticated_datapath
    display_name: Multicluster east-west authenticated datapath
    maturity: ga
    topology: east_west_gateway
    config_protocol: file
    semantic_assertions:
      - category: mesh_topology_matrix
        feature: EastWestGateway topology
      - category: mesh_multicluster_federation
        feature: local_cluster identity reject blank/whitespace
    live_suite: multicluster-federation
    live_assertions:
      - multicluster.eastwest.gateway_reachable
      - multicluster.eastwest.a_to_b_authenticated
      - multicluster.eastwest.b_to_a_authenticated
      - multicluster.eastwest.bidirectional_authenticated_traffic
    platform_profile: kind-spire-multicluster-federation
    docs_anchor: docs/mesh.md#east-west-gateways
    owner: mesh
    exclusions:
      - Cross-cluster endpoint discovery (poller-driven) remains Experimental.
      - Ambient cross-cluster gRPC remains fail-closed; this row covers Sidecar HTTP east-west.

  - id: mesh.multicluster.untrusted_peer_rejected
    display_name: Multicluster untrusted peer rejection
    maturity: ga
    topology: sidecar
    config_protocol: file
    semantic_assertions:
      - category: mesh_multicluster_federation
        feature: remote_clusters uniqueness by canonical name
    live_suite: multicluster-federation
    live_assertions:
      - multicluster.eastwest.untrusted_peer_rejected
    platform_profile: kind-spire-multicluster-federation
    docs_anchor: docs/mesh.md#authorization
    owner: mesh
    exclusions:
      - Cross-cluster endpoint discovery (poller-driven) remains Experimental.

  - id: mesh.multicluster.trust_revocation_recovery
    display_name: Multicluster trust revocation and recovery
    maturity: ga
    topology: sidecar
    config_protocol: file
    semantic_assertions:
      - category: mesh_multicluster_federation
        feature: federated bundle withdrawal fails closed while remotes declared
    live_suite: multicluster-federation
    live_assertions:
      - multicluster.federation.bundle_revoked_rejected
      - multicluster.federation.trust_restored_recovers
    platform_profile: kind-spire-multicluster-federation
    docs_anchor: docs/mesh.md#trust-federation
    owner: mesh
    exclusions:
      - Cross-cluster endpoint discovery (poller-driven) remains Experimental.
      - Network-partition / last-good retention live coverage remains deferred (#3331).

  - id: mesh.multicluster.endpoint_failure_recovery
    display_name: Multicluster destination endpoint failure and recovery
    maturity: ga
    topology: sidecar
    config_protocol: file
    semantic_assertions:
      - category: mesh_multicluster_federation
        feature: east-west gateway requires host and non-zero port
    live_suite: multicluster-federation
    live_assertions:
      - multicluster.eastwest.endpoint_blackhole_when_dest_down
      - multicluster.eastwest.endpoint_recovers_when_dest_returns
    platform_profile: kind-spire-multicluster-federation
    docs_anchor: docs/mesh.md#multi-cluster
    owner: mesh
    exclusions:
      - Cross-cluster endpoint discovery (poller-driven) remains Experimental.
