schema_version: 1
capabilities:
  - id: mesh.destination_rule.tcp_connect_timeout
    display_name: DestinationRule TCP connect timeout
    maturity: ga
    topology: sidecar
    config_protocol: istio
    semantic_assertions:
      - category: istio_destination_rule
        feature: trafficPolicy.connectionPool.tcp.connectTimeout
    live_suite: mesh-e2e-sidecar
    live_assertions:
      - sidecar.destination_rule.tcp_connect_timeout
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#destinationrule
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.

  - id: mesh.destination_rule.tcp_max_connections
    display_name: DestinationRule TCP max connections
    maturity: ga
    topology: sidecar
    config_protocol: istio
    semantic_assertions:
      - category: istio_destination_rule
        feature: trafficPolicy.connectionPool.tcp.maxConnections
    live_suite: mesh-e2e-sidecar
    # maxConnections is enforced on stream-family (TCP) and WebSocket backend
    # connections only — never on the pooled multiplexed mesh-mTLS HTTP egress
    # path (docs/mesh.md "DestinationRule maxConnections enforcement scope") —
    # so the live backing is a WebSocket flow: one held WS session at
    # maxConnections=1, a second upgrade rejected 503, recovery after release
    # (issue #1974).
    live_assertions:
      - sidecar.destination_rule.tcp_max_connections
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#destinationrule
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.

  - id: mesh.virtual_service.cors_policy
    display_name: VirtualService HTTP CORS policy
    maturity: ga
    topology: sidecar
    config_protocol: istio
    semantic_assertions:
      - category: istio_virtual_service
        feature: http[].corsPolicy
    live_suite: mesh-e2e-sidecar
    live_assertions:
      - sidecar.virtual_service.cors_policy
    # The VirtualService-derived `cors` plugin lands on GatewayConfig proxies;
    # MeshSlice::from_gateway_config carries only the `mesh` block, so no
    # deployment shape (file source or CP->DP) can put VS CORS on a live mesh
    # sidecar route today. The semantic translation above remains
    # conformance-pinned; live backing is blocked on carrying route-level
    # plugins in the mesh slice.
    live_deferred: >-
      Mesh slice does not carry VirtualService-derived route plugins, so no
      live sidecar deployment can exercise VS CORS; feature gap tracked in
      issue #1973.
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#virtualservice-translation
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.

  - id: mesh.peer_authentication.strict_mtls
    display_name: PeerAuthentication STRICT inbound mTLS
    maturity: ga
    topology: sidecar
    config_protocol: istio
    semantic_assertions:
      - category: istio_peer_authentication
        feature: mtls.mode = STRICT
    live_suite: mesh-e2e-sidecar
    live_assertions:
      - sidecar.peer_auth.strict_mtls_authenticated
      - sidecar.peer_auth.strict_mtls_plaintext_rejected
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#peerauthentication
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.

  - id: mesh.authorization_policy.allow_deny_enforcement
    display_name: AuthorizationPolicy ALLOW/DENY enforcement
    maturity: ga
    topology: sidecar
    config_protocol: istio
    semantic_assertions:
      - category: istio_authorization_policy
        feature: DENY beats ALLOW on overlap
      - category: istio_authorization_policy
        feature: ALLOW + rule admits matching request
    live_suite: mesh-e2e-sidecar
    # The identity-scoped DENY is the distinctive observation; the ALLOW half
    # is proven by the authenticated positive traversing an ALLOW rule
    # (sidecar.peer_auth.strict_mtls_authenticated) and its implicit-deny
    # complement (sidecar.request_auth.missing_jwt_rejected).
    live_assertions:
      - sidecar.authz.denied_principal_rejected
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#authorization
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.

  - id: mesh.request_authentication.jwt_validation
    display_name: RequestAuthentication JWT validation
    maturity: ga
    topology: sidecar
    config_protocol: istio
    semantic_assertions:
      - category: istio_request_authentication
        feature: jwtRules[].issuer + inline jwks
    live_suite: mesh-e2e-sidecar
    live_assertions:
      - sidecar.request_auth.valid_jwt_admitted
      - sidecar.request_auth.missing_jwt_rejected
      - sidecar.request_auth.invalid_jwt_rejected
    platform_profile: kind-spire-sidecar
    docs_anchor: docs/mesh.md#requestauthentication
    owner: mesh
    exclusions:
      - NodeWaypoint topology remains Experimental and is excluded from this sidecar GA contract.
      - Cross-cluster endpoint discovery remains Experimental and is excluded from this sidecar GA contract.
