[package]
name = "mesh-runtime-perf"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "mesh_backend"
path = "src/bin/mesh_backend.rs"

[[bin]]
name = "mesh_loadgen"
path = "src/bin/mesh_loadgen.rs"

[[bin]]
name = "mesh_tls_probe"
path = "src/bin/mesh_tls_probe.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
anyhow = "1"
# SYNC: rustls major version must match root Cargo.toml.
rustls = { version = "0.23", features = ["ring", "std"] }
rustls-pki-types = "1"
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[profile.dev]
opt-level = 0
debug = true
incremental = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
