[package]
name = "mesh-perf"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone crate, not a workspace member of the root ferrum-edge crate.
# Mirrors tests/performance/multi_protocol/ pattern: own Cargo.toml, own
# Cargo.lock. Run with `cargo bench` from this directory, OR via run.sh.
#
# Depends on the root ferrum-edge crate by path so benches can call production
# public APIs, including mesh (`ferrum_edge::modes::mesh::*`) and core plugins.
# That means a `cargo bench` here rebuilds the root crate — slow first run,
# fast iterations afterward via target/ cache.

[dependencies]
ferrum-edge = { path = "../../.." }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "html_reports"] }
serde_json = "1"
# SYNC: keep aligned with the root Cargo.toml. `unix_backend_pool` drives the
# production Unix connection pool, which is async and binds real Unix-domain
# sockets, so the bench needs a runtime and a temp dir.
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

# Standalone manifests do not inherit the root crate's patch table. Keep these
# overrides synchronized with the root Cargo.toml so the benchmark builds the
# same production dependency implementations as ferrum-edge.
[patch.crates-io]
reqwest = { path = "../../../vendor/reqwest-0.13.3-ferrum-patched" }
h3 = { path = "../../../vendor/h3-0.0.8-ferrum-patched" }
h3-quinn = { path = "../../../vendor/h3-quinn-0.0.10-ferrum-patched" }
tungstenite = { path = "../../../vendor/tungstenite-0.29.0-ferrum-patched" }
tokio-tungstenite = { path = "../../../vendor/tokio-tungstenite-0.29.0-ferrum-patched" }
dimpl = { path = "../../../vendor/dimpl-0.6.1-ferrum-patched" }

[[bench]]
name = "authz_match"
harness = false

[[bench]]
name = "slice_apply"
harness = false

[[bench]]
name = "xds_translation"
harness = false

[[bench]]
name = "ip_restriction"
harness = false

[[bench]]
name = "wrr_selection"
harness = false

[[bench]]
name = "rr_selection"
harness = false

[[bench]]
name = "ai_semantic_cache_cleanup"
harness = false

[[bench]]
name = "unix_backend_pool"
harness = false

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# Use release profile for benches so optimisation matches production.
[profile.bench]
inherits = "release"
debug = false
