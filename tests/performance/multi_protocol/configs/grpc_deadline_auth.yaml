version: "1"
# gRPC deadline A/B (#6904), authenticated cell: grpc_deadline_open.yaml plus
# key_auth. An authenticated stream carries the authorization lifetime
# (FERRUM_AUTHENTICATED_STREAM_MAX_LIFETIME_SECONDS, default 3600 s), so a
# deadline-bearing call here runs the RPC-deadline pump inside the
# authorization pump. The benchmark key is public test data, not a secret.
proxies:
  - id: "grpc-deadline-bench"
    name: "gRPC Deadline Bench Service (Key Auth)"
    listen_path: "/bench.BenchService"
    backend_scheme: http
    backend_host: "127.0.0.1"
    backend_port: 50052
    strip_listen_path: false
    preserve_host_header: false
    backend_connect_timeout_ms: 5000
    backend_read_timeout_ms: 10000
    backend_write_timeout_ms: 10000
    auth_mode: single
    pool_enable_http2: true
    pool_http2_keep_alive_interval_seconds: 30
    pool_http2_keep_alive_timeout_seconds: 45
    pool_http2_initial_stream_window_size: 8388608
    pool_http2_initial_connection_window_size: 33554432
    pool_http2_adaptive_window: false
    pool_http2_max_frame_size: 1048576
    pool_http2_max_concurrent_streams: 1000
    plugins:
      - plugin_config_id: "grpc-deadline-bench-key-auth"

consumers:
  - id: "grpc-deadline-bench-consumer"
    username: "grpc-deadline-bench"
    credentials:
      keyauth:
        - key: "grpc-deadline-bench-key-0001"

plugin_configs:
  - id: "grpc-deadline-bench-key-auth"
    plugin_name: "key_auth"
    config:
      key_location: "header:x-api-key"
    scope: proxy
    proxy_id: "grpc-deadline-bench"
    enabled: true
