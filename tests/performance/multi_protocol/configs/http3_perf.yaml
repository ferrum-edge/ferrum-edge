---
version: "1"
# HTTP/3 (QUIC) performance test config
# Gateway listens with HTTP/3 enabled, proxies to HTTP/3 backend
proxies:
  - id: "h3-echo"
    name: "HTTP/3 Echo"
    listen_path: "/echo"
    backend_scheme: https
    backend_host: "127.0.0.1"
    backend_port: 3445
    upstream_id: "h3-backend"
    strip_listen_path: false
    preserve_host_header: false
    backend_connect_timeout_ms: 5000
    backend_read_timeout_ms: 10000
    backend_write_timeout_ms: 10000
    auth_mode: single
    plugins: []

  - id: "h3-health"
    name: "HTTP/3 Health Check"
    listen_path: "/health"
    backend_scheme: http
    backend_host: "127.0.0.1"
    backend_port: 3010
    strip_listen_path: false
    preserve_host_header: false
    backend_connect_timeout_ms: 5000
    backend_read_timeout_ms: 5000
    backend_write_timeout_ms: 5000
    auth_mode: single
    plugins: []

upstreams:
  - id: "h3-backend"
    targets:
      - host: "127.0.0.1"
        port: 3445
        weight: 1
    # The existing upstream override controls both SNI and verification name;
    # the single numeric target above remains the connect address.
    backend_tls_sni: "localhost"
    backend_tls_verify_server_cert: true
    backend_tls_server_ca_cert_path: "CA_PATH"

consumers: []
plugin_configs: []
