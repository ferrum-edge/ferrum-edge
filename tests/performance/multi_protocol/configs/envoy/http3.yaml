# Envoy HTTP/3 (QUIC) reverse proxy config
# UDP listener on 8443 with QUIC/TLS 1.3 → HTTP/3 backend on 3445
#
# HTTP/3 downstream is production-ready per Envoy docs; upstream HTTP/3 is alpha.
# We terminate HTTP/3 at the gateway and use HTTP/3 upstream via explicit config.
#
# The client assigns at most 10 workers per QUIC connection. Envoy's normal
# 100-stream limit admits that entire workload. A listener transport limit of
# four admits at most 84 of 200 workers across 21 connections. The historical
# HCM setting did not apply that downstream limit: the H3 experiment generator
# explicitly sets udp_listener_config.quic_options.quic_protocol_options.
# Do not derive a stream-count cap
# from 24 MiB / 6 MiB: flow-control credit advances as data is consumed and the
# connection window need not hold every complete body simultaneously.
# Keep the configured 6 MiB stream / 24 MiB connection windows and 128 MiB
# connection buffers. Downstream transport windows retain the listener defaults;
# HCM HTTP/3 options do not override those transport parameters.
# No HTTP buffer filter is needed for forwarding the echo workload.
# See docs/benchmark_audit_2026_09_17.md for the controlled zero-error checks
# and their limits. Hosted reruns determine comparative performance.
#
# Envoy's QUIC upstream verifier requires an explicit SNI/server name for this
# static 127.0.0.1 cluster. Without it the TLS hostname is empty and Envoy
# returns local 503s even though the benchmark cert is valid for localhost.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 15000 }

static_resources:
  listeners:
    - name: h3_listener
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 8443
          protocol: UDP
      per_connection_buffer_limit_bytes: 134217728
      udp_listener_config:
        quic_options: {}
        downstream_socket_config:
          prefer_gro: true
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.quic
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.quic.v3.QuicDownstreamTransport
              downstream_tls_context:
                common_tls_context:
                  tls_certificates:
                    - certificate_chain: { filename: CERT_PATH }
                      private_key: { filename: KEY_PATH }
                  alpn_protocols: ["h3"]
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_h3
                codec_type: HTTP3
                http3_protocol_options:
                  quic_protocol_options:
                    max_concurrent_streams: { value: 100 }
                    initial_stream_window_size: { value: 6291456 }
                    initial_connection_window_size: { value: 25165824 }
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: backend_h3
                            # Disable the per-route HTTP timeout. Strict echo
                            # validation turns slow 5 MiB streaming responses
                            # into errors if Envoy returns a timeout-generated
                            # 504 before the body finishes under load.
                            timeout: 0s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                access_log: []

  clusters:
    - name: backend_h3
      connect_timeout: 5s
      per_connection_buffer_limit_bytes: 134217728
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http3_protocol_options:
              quic_protocol_options:
                max_concurrent_streams: { value: 100 }
                initial_stream_window_size: { value: 6291456 }
                initial_connection_window_size: { value: 25165824 }
      transport_socket:
        name: envoy.transport_sockets.quic
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.quic.v3.QuicUpstreamTransport
          upstream_tls_context:
            # Matches the benchmark cert SAN generated by tls_utils.
            sni: localhost
            common_tls_context:
              alpn_protocols: ["h3"]
              validation_context:
                trusted_ca:
                  filename: CA_PATH
                # CertificateValidationContext API at pinned Envoy d7809ba2.
                # SNI is retained; chain and intended DNS identity are explicit.
                match_typed_subject_alt_names:
                  - san_type: DNS
                    matcher:
                      exact: localhost
      load_assignment:
        cluster_name: backend_h3
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 3445
                      protocol: UDP
