version: "1"
# gRPC deadline A/B (#6904), unauthenticated cell. Identical to
# grpc_deadline_auth.yaml except for key_auth, so the auth cells differ only by
# the authenticated-stream authorization lifetime and the key check.
# Read by .github/scripts/grpc_deadline_comparison.py; both revisions under
# comparison must accept this file unchanged.
proxies:
  - id: "grpc-deadline-bench"
    name: "gRPC Deadline Bench Service"
    listen_path: "/bench.BenchService"
    backend_scheme: http
    backend_host: "127.0.0.1"
    backend_port: 50052
    strip_listen_path: false
    preserve_host_header: false
    backend_connect_timeout_ms: 5000
    backend_read_timeout_ms: 10000
    backend_write_timeout_ms: 10000
    auth_mode: single
    pool_enable_http2: true
    pool_http2_keep_alive_interval_seconds: 30
    pool_http2_keep_alive_timeout_seconds: 45
    pool_http2_initial_stream_window_size: 8388608
    pool_http2_initial_connection_window_size: 33554432
    pool_http2_adaptive_window: false
    pool_http2_max_frame_size: 1048576
    pool_http2_max_concurrent_streams: 1000
    plugins: []

consumers: []
plugin_configs: []
