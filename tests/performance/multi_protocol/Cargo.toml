[package]
name = "multi-protocol-perf"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "proto_backend"
path = "proto_backend.rs"

[[bin]]
name = "proto_bench"
path = "proto_bench.rs"

[[bin]]
name = "h3_tls_fixture"
path = "h3_proof/tls_fixture.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1"
h2 = "0.4"

# TLS
rustls = { version = "0.23", features = ["ring", "std"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.13"

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

# gRPC
tonic = { version = "0.14.5", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.5"
prost = "0.14.3"

# HTTP/3 / QUIC
quinn = "0.11.9"
h3 = "0.0.8"
h3-quinn = "0.0.10"

# DTLS 1.2/1.3
# SYNC: version must match root Cargo.toml (cross-version DTLS handshakes hang)
dimpl = { version = "0.6", features = ["aws-lc-rs", "rcgen"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Metrics
hdrhistogram = "7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Streaming
tokio-stream = "0.1"

# Other
bytes = "1"
anyhow = "1"
dashmap = "6"
libc = "0.2"

[build-dependencies]
tonic-prost-build = "0.14.5"

[dev-dependencies]
# Reuse the repository's socket lease registry for real connector regressions.
socket2 = "0.6"
uuid = { version = "1.23.1", features = ["v4"] }

[profile.dev]
opt-level = 0
debug = true
incremental = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
