# Frontend Service the VirtualService routes; no pod backs it, so a 200 from
# it can only come from the carried route.
apiVersion: v1
kind: Service
metadata:
  name: xfront
  namespace: __XSRC__
spec:
  selector:
    app: xfront-unbacked
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http
---
# The client namespace's Sidecar imports the destination namespace, so the
# xclient Sidecar sees xremote (ferrum-cp-xns applies Sidecar egress scopes,
# FERRUM_MESH_SIDECAR_ENFORCED=true): a cross-namespace destination rides only
# to a data plane that sees it.
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: default
  namespace: __XSRC__
spec:
  egress:
    - hosts:
        - "./*"
        - "__XDST__/*"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xclient
  namespace: __XSRC__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xclient
  namespace: __XSRC__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xclient
  template:
    metadata:
      labels:
        app: xclient
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: xclient
      securityContext:
        fsGroup: 1337
      initContainers:
        - name: ferrum-edge-init
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          command: ["/bin/sh", "-c"]
          # `set -e` fails the pod closed if the iptables install or any rule
          # fails. Order matters: pod-local and proxy-UID RETURNs precede the
          # catch-all REDIRECT, as in the injector's chain.
          args:
            - |
              set -e
              apk add --no-cache iptables
              iptables -t nat -N FERRUM_MESH_OUTBOUND 2>/dev/null || true
              iptables -t nat -C OUTPUT -p tcp -j FERRUM_MESH_OUTBOUND 2>/dev/null || \
                iptables -t nat -A OUTPUT -p tcp -j FERRUM_MESH_OUTBOUND
              iptables -t nat -C FERRUM_MESH_OUTBOUND -m addrtype --dst-type LOCAL -j RETURN 2>/dev/null || \
                iptables -t nat -A FERRUM_MESH_OUTBOUND -m addrtype --dst-type LOCAL -j RETURN
              iptables -t nat -C FERRUM_MESH_OUTBOUND -m owner --uid-owner 1337 -j RETURN 2>/dev/null || \
                iptables -t nat -A FERRUM_MESH_OUTBOUND -m owner --uid-owner 1337 -j RETURN
              iptables -t nat -C FERRUM_MESH_OUTBOUND -p tcp -j REDIRECT --to-ports 15001 2>/dev/null || \
                iptables -t nat -A FERRUM_MESH_OUTBOUND -p tcp -j REDIRECT --to-ports 15001
              echo "ferrum outbound capture installed (tcp -> 15001, uid 1337 + local exempt)"
              iptables -t nat -L FERRUM_MESH_OUTBOUND -n
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: outbound
              containerPort: 15001
          env:
            - name: FERRUM_MODE
              value: mesh
            - name: FERRUM_MESH_TOPOLOGY
              value: sidecar
            - name: FERRUM_MESH_CONFIG_PROTOCOL
              value: native
            - name: FERRUM_DP_CP_GRPC_URLS
              value: https://ferrum-cp-xns.__XSRC__.svc.cluster.local:50051
            - name: FERRUM_DP_GRPC_TLS_CA_CERT_PATH
              value: /transport/ca.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_CERT_PATH
              value: /transport/client.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_KEY_PATH
              value: /transport/client-key.pem
            - name: FERRUM_BACKEND_TLS_WATCH_INTERVAL_SECONDS
              value: "2"
            # Externally minted bearer (run.sh): `kid: xns`, `sub` = this
            # node id, `ns` naming both namespaces. Self-minting would claim
            # only __XSRC__, and the bearer `ns` claim is a ceiling on every
            # cross-namespace destination.
            - name: FERRUM_DP_CP_GRPC_TOKEN_FILE
              value: /token/token
            - name: FERRUM_MESH_NODE_ID
              value: xclient
            - name: FERRUM_NAMESPACE
              value: __XSRC__
            - name: FERRUM_MESH_PRODUCTION_MODE
              value: "true"
            - name: FERRUM_MESH_CA_BACKEND
              value: spire_agent
            - name: FERRUM_MESH_SPIRE_AGENT_SOCKET
              value: /run/spire/sockets/agent.sock
            - name: FERRUM_MESH_WORKLOAD_SPIFFE_ID
              value: spiffe://__TRUST_DOMAIN__/ns/__XSRC__/sa/xclient
            - name: FERRUM_MESH_OUTBOUND_LISTEN_ADDR
              value: 0.0.0.0:15001
            - name: FERRUM_ADMIN_HTTP_PORT
              value: "15020"
            # JWT-authenticated GET /mesh/config-drift diagnostics.
            - name: FERRUM_ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-xns-secrets
                  key: admin-jwt-secret
            - name: FERRUM_POOL_WARMUP_ENABLED
              value: "false"
            - name: FERRUM_LOG_LEVEL
              value: info
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: transport
              mountPath: /transport
              readOnly: true
            - name: token
              mountPath: /token
              readOnly: true
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep 365d"]
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: transport
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: ferrum-native-mtls-dp
                  items:
                    - key: ca.pem
                      path: ca.pem
                    - key: client.pem
                      path: client.pem
                    - key: client-key.pem
                      path: client-key.pem
        - name: token
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: ferrum-xns-client-token
                  items:
                    - key: token
                      path: token
