---
# Frontend Service the VirtualService routes. Its selector matches NO pod on
# purpose: one pod backs exactly one Service (a second Service selecting the
# v1/v2 pods would make their sidecars' local workload resolution fail
# closed). The K8s controller still models it as a MeshService with no
# workloads, so the client Sidecar has no plain Service route for this host:
# a 200 from it can only come from the carried VirtualService route.
apiVersion: v1
kind: Service
metadata:
  name: vssvc
  namespace: __NAMESPACE__
spec:
  selector:
    app: vssvc-frontend-unbacked
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http
---
# vs-client: a native-MeshSubscribe Sidecar CLIENT. It subscribes to ferrum-cp
# over the same production mTLS + JWT channel as capp and, being a Sidecar,
# requests the carried VirtualService http[] routes; the curl container drives
# requests straight at the outbound capture listener (:15001) with the
# frontend FQDN as Host, like the file-source client probes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vs-client
  namespace: __NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vs-client
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vs-client
  template:
    metadata:
      labels:
        app: vs-client
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: vs-client
      securityContext:
        fsGroup: 1337
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: outbound
              containerPort: 15001
          env:
            - name: FERRUM_MODE
              value: mesh
            - name: FERRUM_MESH_TOPOLOGY
              value: sidecar
            - name: FERRUM_MESH_CONFIG_PROTOCOL
              value: native
            - name: FERRUM_DP_CP_GRPC_URLS
              value: https://ferrum-cp.__NAMESPACE__.svc.cluster.local:50051
            - name: FERRUM_DP_GRPC_TLS_CA_CERT_PATH
              value: /transport/ca.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_CERT_PATH
              value: /transport/client.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_KEY_PATH
              value: /transport/client-key.pem
            - name: FERRUM_BACKEND_TLS_WATCH_INTERVAL_SECONDS
              value: "2"
            - name: FERRUM_CP_DP_GRPC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-mesh-e2e-secrets
                  key: cp-dp-grpc-jwt-secret
            - name: FERRUM_NAMESPACE
              value: __NAMESPACE__
            - name: FERRUM_MESH_PRODUCTION_MODE
              value: "true"
            - name: FERRUM_MESH_CA_BACKEND
              value: spire_agent
            - name: FERRUM_MESH_SPIRE_AGENT_SOCKET
              value: /run/spire/sockets/agent.sock
            - name: FERRUM_MESH_WORKLOAD_SPIFFE_ID
              value: spiffe://__TRUST_DOMAIN__/ns/__NAMESPACE__/sa/vs-client
            - name: FERRUM_MESH_OUTBOUND_LISTEN_ADDR
              value: 0.0.0.0:15001
            - name: FERRUM_ADMIN_HTTP_PORT
              value: "15020"
            # JWT-authenticated GET /mesh/config-drift diagnostics (run.sh
            # mints the HS256 bearer from the shared Secret).
            - name: FERRUM_ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-mesh-e2e-secrets
