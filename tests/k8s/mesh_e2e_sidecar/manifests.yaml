# Live single-cluster Sidecar mesh e2e workloads (M2 sidecar suite, M5 Stage 4).
#
# Applied ONCE by run.sh after the placeholders below are substituted (awk).
# The topology is the same-cluster subset of the proven multicluster-federation
# fixture (tests/k8s/multicluster-federation/manifests.yaml):
#
#   - a destination service (`svc`) fronted by a hand-crafted Ferrum SIDECAR
#     (topology=sidecar) whose inbound iptables init container REDIRECTs the
#     app port 8080 -> :15006 — the REAL captured inbound path;
#   - a CLIENT sidecar (topology=sidecar, outbound capture :15001) plus a curl
#     container that drives captured requests. Its init container black-holes
#     a designated IP (OUTPUT DROP) so the DestinationRule connectTimeout probe
#     observes a REAL hanging connect that only the configured timeout bounds;
#   - a ROGUE sidecar identical to the client but running as sa/rogue — it
#     completes valid same-trust-domain mTLS to the destination and is then
#     DENIED by the destination's identity-scoped AuthorizationPolicy
#     (mesh_authz 403): the destination-side authz negative.
#
# Identity comes from the local SPIRE agent (FERRUM_MESH_CA_BACKEND=spire_agent);
# mesh config is delivered via FERRUM_MESH_CONFIG_PROTOCOL=file from ConfigMaps
# run.sh renders at runtime (the client document needs the discovered svc pod
# IP), so this manifest mounts the ConfigMaps but does not define them.
#
# The native MeshSubscribe leg (issue #2002) adds two more deployments:
#
#   - `ferrum-cp` — a Ferrum CONTROL PLANE (FERRUM_MODE=cp, sqlite on an
#     emptyDir) whose K8s controller (pod discovery: Pods/Services/
#     EndpointSlices in this namespace only; Istio CRD watching ON for the
#     two installed kinds, VirtualService and DestinationRule; Gateway API
#     CRD watching disabled) builds the mesh model from the cluster's REAL
#     Services, pods and VirtualServices — the only path that populates
#     `GatewayConfig.mesh` on a CP
#     (src/config_sources/k8s/mod.rs) — and serves it over the native
#     `MeshConfigSync.MeshSubscribe` gRPC stream (src/grpc/mesh_server.rs) on
#     :50051. In-cluster mTLS + JWT: the CP presents a server certificate
#     whose SAN is the Kubernetes Service DNS hostname the DP dials
#     (`https://ferrum-cp.<ns>.svc.cluster.local:50051`), verifies the DP
#     client certificate against FERRUM_CP_GRPC_TLS_CLIENT_CA_PATH, and still
#     requires the shared CP/DP JWT. The DP verifies that SAN against
#     FERRUM_DP_GRPC_TLS_CA_CERT_PATH and presents FERRUM_DP_GRPC_TLS_CLIENT_*.
#     Material is minted per run and mounted through projected Secrets. The
#     release-blocking native leg does not permit plaintext gRPC and does
#     not skip server certificate verification.
#     File/provider/Kubernetes-backed CP/DP gRPC TLS sources are watched, so
#     a projected Secret generation swap is the rotation proof.
#   - `capp` — a destination workload shaped exactly like `svc` (inbound
#     iptables REDIRECT 8080 -> :15006, SPIRE identity, python echo) whose
#     sidecar runs FERRUM_MESH_CONFIG_PROTOCOL=native subscribing to the CP
#     over that mTLS+JWT channel. Its inbound routes exist ONLY if the
#     CP-delivered native slice materialized, so client traffic reaching its
#     app is the live MeshSubscribe proof
#     (`sidecar.config.native_subscribe_delivered`). Config-drift diagnostics
#     ride the sidecar's JWT-authenticated `GET /mesh/config-drift`
#     (FERRUM_ADMIN_JWT_SECRET from the shared Secret; run.sh mints the
#     HS256 token). Dedicated probe Deployments (not capp) cover the
#     fail-closed negatives and must never inherit a previously accepted
#     slice.
#
# The live VirtualService http[] split gate (issue #7502) adds a native
# client and two native destinations, all subscribed to that same CP:
#
#   - `vs-client` — a Sidecar (topology=sidecar, outbound :15001) on
#     FERRUM_MESH_CONFIG_PROTOCOL=native. A file-source client cannot carry
#     the gateway proxies/upstreams a VirtualService http[] route translates
#     into, so the split is only reachable through a CP-delivered slice: the
#     Sidecar asks for carried http routes (MeshSubscribeRequest field
#     sidecar_http_routes) and applies them client-side.
#   - `vssvc-v1` / `vssvc-v2` — capp-shaped native destinations with their
#     own identities and distinct echo markers (`vs-backend-v1` /
#     `vs-backend-v2`).
#   - `vssvc` — a frontend Service whose selector matches NO pod (one pod
#     backs exactly one Service, so it cannot also select the v1/v2 pods).
#     run.sh applies a VirtualService on its host with a header-match rule
#     (`x-canary: true` -> vssvc-v2) and a 90/10 vssvc-v1/vssvc-v2 split.
#
# JWT secrets come from the `ferrum-mesh-e2e-secrets` Secret run.sh mints per
# run (openssl rand), so this manifest references but does not define it.
#
# Substituted placeholders:
#   __NAMESPACE__       workload namespace (ferrum)
#   __TRUST_DOMAIN__    the cluster trust domain (mesh-e2e.test)
#   __IMAGE__           ferrum runtime image ref
#   __APP_BODY__        echo body marker (mesh-e2e-app) so traffic is attributable
#   __BLACKHOLE_IP__    IP the client pod's init container DROPs on OUTPUT — the
#                       `slowsvc` workload address, so its mesh-mTLS dial hangs
#
# Fixed identities:
#   sa/svc     the destination workload service account
#   sa/wssvc   the WebSocket destination service account (its OWN pod +
#              identity: one local pod backs exactly ONE service — a second
#              local service_name on sa/svc would make
#              resolve_local_workloads fail closed and materialize NO inbound
#              routes)
#   sa/client  the allowed client service account
#   sa/rogue   a same-domain workload DENIED by a dest-side AuthorizationPolicy
#   sa/capp    the native-MeshSubscribe destination (its OWN pod + identity,
#              same one-pod-one-service rule as wssvc; the CP's K8s-built
#              workload SPIFFE ID spiffe://<td>/ns/<ns>/sa/capp must equal the
#              sidecar's FERRUM_MESH_WORKLOAD_SPIFFE_ID for
#              resolve_local_workloads to anchor inbound routes)
#   sa/native-mtls-probe
#              dedicated identity for fail-closed native mTLS/JWT probes so
#              they cannot share sa/capp and make capp's inbound resolution
#              ambiguous while negatives run
#   sa/drsvc-a / sa/drsvc-b
#              DestinationRule visibility backends (beta-owned MeshService
#              `drsvc`; each SA backs exactly one local service attachment)
#   sa/vs-client / sa/vssvc-v1 / sa/vssvc-v2
#              the VirtualService split gate's native client and its two
#              destinations (each SA backs at most one Service)
#   sa/ferrum-cp the control plane (K8s API access via the namespaced Roles
#              below; NOT a mesh workload — no SPIRE entry)
#   (slowsvc has NO service account / SPIRE entry on purpose: its dial is
#    black-holed and never completes a handshake.)
---
apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
  labels:
    ferrum.io/mesh: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wssvc
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: client
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rogue
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drsvc-a
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drsvc-b
  namespace: __NAMESPACE__
---
# ── Destination service ─────────────────────────────────────────────────────
# A plain ClusterIP Service used for its FQDN (svc.<ns>.svc.cluster.local) —
# the Host the client's captured requests carry and the outbound routes match.
apiVersion: v1
kind: Service
metadata:
  name: svc
  namespace: __NAMESPACE__
spec:
  selector:
    app: svc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# ── Destination sidecar pod ─────────────────────────────────────────────────
# init container: inbound iptables REDIRECT app-port 8080 -> :15006 (the
#   proxy's mesh-mTLS inbound listener). This is the destination-side capture
#   the in-process functional tests collapse and the live fixture exercises.
# ferrum-edge sidecar: topology=sidecar, STRICT inbound (production mode),
#   identity from the local SPIRE agent, mesh config from the file ConfigMap.
# app: a tiny python echo that answers 200 with an attributable body.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc
  template:
    metadata:
      labels:
        app: svc
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: svc
      initContainers:
        # The init container needs a SHELL + `iptables`. The Ferrum runtime
        # image (__IMAGE__) is DISTROLESS (no /bin/sh, no iptables), so the
        # capture-init runs on a small Alpine image with iptables apk-installed
        # at start (same pattern as the multicluster-federation fixture).
        - name: ferrum-edge-init
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          command: ["/bin/sh", "-c"]
          # Mirror the Ferrum injector's INBOUND REDIRECT shape
          # (src/capture/mod.rs): a dedicated nat chain jumped from PREROUTING,
          # then REDIRECT the app port to the sidecar inbound port. `set -e`
          # fails the pod closed if any rule (or the iptables install) fails.
          # NO `-m owner` here: owner-match is OUTPUT-only and errors in
          # PREROUTING; the :15006 RETURN keeps the sidecar's own inbound port
          # from being re-redirected onto itself.
          args:
            - |
              set -e
              apk add --no-cache iptables
              iptables -t nat -N FERRUM_INBOUND 2>/dev/null || true
              iptables -t nat -C PREROUTING -p tcp -j FERRUM_INBOUND 2>/dev/null || \
                iptables -t nat -A PREROUTING -p tcp -j FERRUM_INBOUND
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 15006 -j RETURN 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 15006 -j RETURN
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006
              echo "ferrum inbound capture installed (8080 -> 15006)"
              iptables -t nat -L FERRUM_INBOUND -n
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: inbound
              containerPort: 15006
          env:
            - name: FERRUM_MODE
              value: mesh
            - name: FERRUM_MESH_TOPOLOGY
              value: sidecar
            - name: FERRUM_MESH_CONFIG_PROTOCOL
              value: file
            - name: FERRUM_MESH_FILE_CONFIG_PATH
              value: /etc/ferrum/mesh/mesh.yaml
            - name: FERRUM_MESH_PRODUCTION_MODE
              value: "true"
            - name: FERRUM_MESH_PEER_AUTH_LIVE_RELOAD_ENABLED
              value: "true"
            - name: FERRUM_MESH_CA_BACKEND
              value: spire_agent
            - name: FERRUM_MESH_SPIRE_AGENT_SOCKET
              value: /run/spire/sockets/agent.sock
            - name: FERRUM_MESH_WORKLOAD_SPIFFE_ID
              value: spiffe://__TRUST_DOMAIN__/ns/__NAMESPACE__/sa/svc
            - name: FERRUM_ADMIN_HTTP_PORT
              value: "15020"
            - name: FERRUM_POOL_WARMUP_ENABLED
              value: "false"
            - name: FERRUM_LOG_LEVEL
              value: info
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: mesh-config
              mountPath: /etc/ferrum/mesh
              readOnly: true
        - name: app
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          command:
            - python
            - -u
            - -c
            - |
              import socket
              import threading
              import time

              # Content-Length is computed from the ACTUAL body bytes so the
              # marker stays exact (a hardcoded length truncates the body and
              # makes curl see a short read on close).
              BODY = b"__APP_BODY__\n"
              RESPONSE = (
                  b"HTTP/1.1 200 OK\r\n"
                  b"content-length: " + str(len(BODY)).encode() + b"\r\n"
                  b"\r\n" + BODY
              )

              def serve():
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind(("0.0.0.0", 8080))
                  s.listen(128)
                  while True:
                      conn, _ = s.accept()
                      data = conn.recv(4096)
                      if data:
                          conn.sendall(RESPONSE)
                      conn.close()

              threading.Thread(target=serve, daemon=True).start()
              while True:
                  time.sleep(3600)
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: mesh-config
          configMap:
            name: ferrum-mesh-dest
---
# ── WebSocket destination pod (DR maxConnections probe target) ──────────────
# Its OWN pod + service account (sa/wssvc): one local pod backs exactly ONE
# service, so the WS listener must not be modeled as a second local
# service_name on the svc pod's identity (resolve_local_workloads would fail
# closed and materialize no inbound routes at all). Same shape as the svc pod
# — inbound REDIRECT 8080 -> :15006, STRICT sidecar, SPIRE identity — but the
# app is a minimal RFC 6455 WebSocket server: it answers the upgrade with a
# correct Sec-WebSocket-Accept (the sidecar's inner H1 upgrade validates it)
# and HOLDs the connection until the peer closes — a held session is what
# occupies the maxConnections=1 slot.
apiVersion: v1
kind: Service
metadata:
  name: wssvc
  namespace: __NAMESPACE__
spec:
  selector:
    app: wssvc
  ports:
    - name: ws
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wssvc
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wssvc
  template:
    metadata:
      labels:
        app: wssvc
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: wssvc
      initContainers:
        - name: ferrum-edge-init
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache iptables
              iptables -t nat -N FERRUM_INBOUND 2>/dev/null || true
              iptables -t nat -C PREROUTING -p tcp -j FERRUM_INBOUND 2>/dev/null || \
                iptables -t nat -A PREROUTING -p tcp -j FERRUM_INBOUND
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 15006 -j RETURN 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 15006 -j RETURN
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006
              echo "ferrum inbound capture installed (8080 -> 15006)"
              iptables -t nat -L FERRUM_INBOUND -n
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: inbound
              containerPort: 15006
          env:
            - name: FERRUM_MODE
              value: mesh
            - name: FERRUM_MESH_TOPOLOGY
              value: sidecar
            - name: FERRUM_MESH_CONFIG_PROTOCOL
              value: file
            - name: FERRUM_MESH_FILE_CONFIG_PATH
              value: /etc/ferrum/mesh/mesh.yaml
            - name: FERRUM_MESH_PRODUCTION_MODE
              value: "true"
            - name: FERRUM_MESH_PEER_AUTH_LIVE_RELOAD_ENABLED
              value: "true"
            - name: FERRUM_MESH_CA_BACKEND
              value: spire_agent
            - name: FERRUM_MESH_SPIRE_AGENT_SOCKET
              value: /run/spire/sockets/agent.sock
            - name: FERRUM_MESH_WORKLOAD_SPIFFE_ID
              value: spiffe://__TRUST_DOMAIN__/ns/__NAMESPACE__/sa/wssvc
            - name: FERRUM_ADMIN_HTTP_PORT
              value: "15020"
            - name: FERRUM_POOL_WARMUP_ENABLED
              value: "false"
            - name: FERRUM_LOG_LEVEL
              value: info
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: mesh-config
              mountPath: /etc/ferrum/mesh
              readOnly: true
        - name: app
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          command:
            - python
            - -u
            - -c
            - |
              import base64
              import hashlib
              import socket
              import threading
              import time

              WS_GUID = "258EAFA5-E914-47DA-95CA-C5AB0DC85B11"

              def ws_hold(conn):
                  try:
                      while conn.recv(4096):
                          pass
                  except OSError:
                      pass
                  finally:
                      conn.close()

              def serve_ws():
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind(("0.0.0.0", 8080))
                  s.listen(128)
                  while True:
                      conn, _ = s.accept()
                      data = b""
                      try:
                          conn.settimeout(5)
                          while b"\r\n\r\n" not in data:
                              chunk = conn.recv(4096)
                              if not chunk:
                                  break
                              data += chunk
                      except OSError:
                          conn.close()
                          continue
                      key = ""
                      for line in data.split(b"\r\n"):
                          if line.lower().startswith(b"sec-websocket-key:"):
                              key = line.split(b":", 1)[1].strip().decode()
                      if not key:
                          conn.close()
                          continue
                      accept = base64.b64encode(
                          hashlib.sha1((key + WS_GUID).encode()).digest()
                      ).decode()
                      conn.sendall(
                          (
                              "HTTP/1.1 101 Switching Protocols\r\n"
                              "Upgrade: websocket\r\n"
                              "Connection: Upgrade\r\n"
                              "Sec-WebSocket-Accept: " + accept + "\r\n\r\n"
                          ).encode()
                      )
                      conn.settimeout(None)
                      threading.Thread(target=ws_hold, args=(conn,), daemon=True).start()

              threading.Thread(target=serve_ws, daemon=True).start()
              while True:
                  time.sleep(3600)
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: mesh-config
          configMap:
            name: ferrum-mesh-wsdest
---
# ── Client sidecar pod ──────────────────────────────────────────────────────
# topology=sidecar with an outbound capture listener on :15001. The curl
# container drives captured requests directly at :15001 with the destination
# FQDN as Host (mirroring the functional tests' plaintext_http_get and the
# federation fixture). The init container installs an OUTPUT DROP for the
# designated black-hole IP so the `slowsvc` mesh-mTLS dial
# (__BLACKHOLE_IP__:15006) hangs INSIDE this pod's own netns — a genuine,
# routing-independent connect timeout that only the DestinationRule
# connectTimeout bounds (a refused/unroutable dial would fail fast and prove
# nothing about the timeout knob).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: client
      initContainers:
        - name: ferrum-blackhole-init
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache iptables
              iptables -C OUTPUT -d __BLACKHOLE_IP__/32 -j DROP 2>/dev/null || \
                iptables -A OUTPUT -d __BLACKHOLE_IP__/32 -j DROP
              echo "ferrum blackhole installed (__BLACKHOLE_IP__ -> DROP)"
              iptables -L OUTPUT -n
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: outbound
              containerPort: 15001
          env:
            - name: FERRUM_MODE
              value: mesh
            - name: FERRUM_MESH_TOPOLOGY
              value: sidecar
            - name: FERRUM_MESH_CONFIG_PROTOCOL
              value: file
            - name: FERRUM_MESH_FILE_CONFIG_PATH
              value: /etc/ferrum/mesh/mesh.yaml
            - name: FERRUM_MESH_PRODUCTION_MODE
              value: "true"
            - name: FERRUM_MESH_CA_BACKEND
              value: spire_agent
            - name: FERRUM_MESH_SPIRE_AGENT_SOCKET
              value: /run/spire/sockets/agent.sock
            - name: FERRUM_MESH_WORKLOAD_SPIFFE_ID
              value: spiffe://__TRUST_DOMAIN__/ns/__NAMESPACE__/sa/client
            # Cross-namespace MeshService + DestinationRule lookup (#2465/#2469)
            # requires an applicable Sidecar egress scope; without it the file
            # slice stays namespace-local and beta-owned services never materialize.
            - name: FERRUM_MESH_SIDECAR_ENFORCED
              value: "true"
            - name: FERRUM_MESH_OUTBOUND_LISTEN_ADDR
              value: 0.0.0.0:15001
            - name: FERRUM_ADMIN_HTTP_PORT
              value: "15020"
            - name: FERRUM_POOL_WARMUP_ENABLED
              value: "false"
            - name: FERRUM_LOG_LEVEL
              value: debug
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: mesh-config
              mountPath: /etc/ferrum/mesh
              readOnly: true
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep 365d"]
        # Raw-socket probe runner for the WebSocket maxConnections assertion:
        # curl cannot hold a WS upgrade open as a session, so the probe drives
        # hand-rolled HTTP/1.1 upgrades over python3 stdlib sockets (same image
        # the svc app already uses, so no extra pulls on the node).
        - name: probe
          image: python:3.12-alpine
          command: ["sh", "-c", "sleep 365d"]
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: mesh-config
          configMap:
            name: ferrum-mesh-client
---
# ── Ferrum control plane (native MeshSubscribe source) ──────────────────────
# FERRUM_MODE=cp with sqlite on an emptyDir. The mesh model a CP serves over
# MeshSubscribe comes exclusively from its K8s controller translating the
# cluster's real Services/Pods/EndpointSlices into MeshService/Workload
# entries (src/config_sources/k8s/core.rs); there is no DB table or admin API
# write path for the mesh block. The controller here is scoped to THIS
# namespace (CpScope::Single derives the watch scope when
# FERRUM_K8S_WATCH_NAMESPACES is unset): pod discovery, plus Istio CRD watching
# for the kinds this cluster installs (VirtualService and DestinationRule,
# from tests/fixtures/k8s/). Istio CRDs are also watched in the Istio root
# namespace (istio-system), so a second Role grants exactly that read there.
# Gateway-API and istio-root-namespace meshConfig watching stay disabled, so
# the two Roles below are the complete RBAC surface. FERRUM_K8S_TRUST_DOMAIN must equal the
# fixture trust domain so derived workload SPIFFE IDs
# (spiffe://<td>/ns/<ns>/sa/<sa>) match the sidecars' SPIRE identities.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ferrum-cp
  namespace: __NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ferrum-cp
  namespace: __NAMESPACE__
rules:
  # Pod-discovery watch set (FERRUM_K8S_POD_DISCOVERY_ENABLED): mirrors the
  # `podDiscovery` block of charts/ferrum-mesh/templates/control-plane-rbac.yaml,
  # namespaced because the watch scope is this single namespace.
  - apiGroups: [""]
    resources:
      - pods
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  # Istio CRD watch (issue #7502): only the kinds the fixture installs. The
  # controller skips kinds a served group does not serve, so no grant is
  # needed for the rest of the Istio watch set.
  - apiGroups: ["networking.istio.io"]
    resources:
      - virtualservices
      - destinationrules
    verbs: ["get", "list", "watch"]
  # IstioStatusWriter: read the live status subresource, then merge-patch the
  # FerrumAccepted condition with a resourceVersion/UID precondition.
  - apiGroups: ["networking.istio.io"]
    resources:
      - virtualservices/status
      - destinationrules/status
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ferrum-cp
  namespace: __NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ferrum-cp
subjects:
  - kind: ServiceAccount
    name: ferrum-cp
    namespace: __NAMESPACE__
---
# Istio CRDs are watched in the watch namespace AND the Istio root namespace
# (FERRUM_K8S_ISTIO_ROOT_NAMESPACE, default istio-system). The root namespace
# holds no objects here, but its watch must list successfully: a forbidden
# scope would never deliver the evidence the K8s config revision needs.
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ferrum-cp-istio-root
  namespace: istio-system
rules:
  - apiGroups: ["networking.istio.io"]
    resources:
      - virtualservices
      - destinationrules
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ferrum-cp-istio-root
  namespace: istio-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ferrum-cp-istio-root
subjects:
  - kind: ServiceAccount
    name: ferrum-cp
    namespace: __NAMESPACE__
---
# The FQDN the native DP dials: https://ferrum-cp.<ns>.svc.cluster.local:50051.
# The CP server certificate SAN is exactly that hostname so verification is
# real Service DNS, not a skip-verify or IP-only handshake.
apiVersion: v1
kind: Service
metadata:
  name: ferrum-cp
  namespace: __NAMESPACE__
spec:
  selector:
    app: ferrum-cp
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
# Distinct Service DNS name selecting the same CP pods. The server certificate
# SAN does NOT include this hostname; the wrong-SAN negative dials it over
# https:// so rustls hostname verification is the failing control.
apiVersion: v1
kind: Service
metadata:
  name: ferrum-cp-wrong-san
  namespace: __NAMESPACE__
spec:
  selector:
    app: ferrum-cp
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrum-cp
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ferrum-cp
  template:
    metadata:
      labels:
        app: ferrum-cp
    spec:
      serviceAccountName: ferrum-cp
      # emptyDir volumes are root-owned; fsGroup makes /data group-writable
      # for the non-root runtime user so sqlite can create its DB file.
      securityContext:
        fsGroup: 1337
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: grpc
              containerPort: 50051
          # Ready == the gRPC listener is up (admin binds loopback by default,
          # so it cannot back a kubelet probe). MeshSubscribe snapshots served
          # before the first K8s reconcile may lack the mesh block; the
          # reconcile broadcast converges subscribers, so readiness here only
          # needs to mean "subscribable".
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          env:
            - name: FERRUM_MODE
              value: cp
            - name: FERRUM_NAMESPACE
              value: __NAMESPACE__
            - name: FERRUM_DB_TYPE
              value: sqlite
            - name: FERRUM_DB_URL
              value: sqlite:/data/ferrum.db?mode=rwc
            - name: FERRUM_ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-mesh-e2e-secrets
                  key: admin-jwt-secret
            - name: FERRUM_CP_DP_GRPC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-mesh-e2e-secrets
                  key: cp-dp-grpc-jwt-secret
            - name: FERRUM_CP_GRPC_LISTEN_ADDR
              value: 0.0.0.0:50051
            # Production CP gRPC mTLS: server cert SAN matches the Service DNS
            # hostname the DP dials; client CA requires a DP client certificate.
            # JWT remains required on the same stream. Projected Secret mounts
            # are watched (FERRUM_BACKEND_TLS_WATCH_INTERVAL_SECONDS) so a
            # generation swap reconnects without a pod restart.
            - name: FERRUM_CP_GRPC_TLS_CERT_PATH
              value: /transport/server.pem
            - name: FERRUM_CP_GRPC_TLS_KEY_PATH
              value: /transport/server-key.pem
            - name: FERRUM_CP_GRPC_TLS_CLIENT_CA_PATH
              value: /transport/client-ca.pem
            - name: FERRUM_BACKEND_TLS_WATCH_INTERVAL_SECONDS
              value: "2"
            # Explicit (defaults are in-cluster-on anyway) so the fixture does
            # not depend on the KUBERNETES_SERVICE_HOST heuristic.
            - name: FERRUM_K8S_CONTROLLER_ENABLED
              value: "true"
            - name: FERRUM_K8S_POD_DISCOVERY_ENABLED
              value: "true"
            # The revision scalar is the minimum convergence evidence across
            # watch scopes. Keep this live fixture's authoritative idle relist
            # comfortably inside its 60s route-convergence assertion so quiet
            # scopes advance without weakening the equal-revision content gate.
            - name: FERRUM_K8S_WATCH_IDLE_RELIST_SECS
              value: "2"
            # Istio CRD watching is ON (issue #7502): run.sh installs the
            # pinned VirtualService/DestinationRule CRDs before this pod
            # starts, the Roles above grant exactly those kinds here and in
            # istio-system, and the controller translates the split gate's
            # VirtualService and writes its FerrumAccepted status. No Gateway
            # API CRDs are installed: keep that watch disabled so reconcile
            # startup never waits on a forbidden watcher.
            - name: FERRUM_K8S_WATCH_ISTIO_CRDS
              value: "true"
            - name: FERRUM_K8S_WATCH_GATEWAY_API_CRDS
              value: "false"
            - name: FERRUM_K8S_WATCH_MESH_CONFIG
              value: "false"
            - name: FERRUM_K8S_TRUST_DOMAIN
              value: __TRUST_DOMAIN__
            - name: FERRUM_POOL_WARMUP_ENABLED
              value: "false"
            # Handshake rejections are debug in production. The live classifier
            # correlates those CP TLS lines to the probe pod IP; info alone
            # would hide omit-client / foreign-client evidence.
            - name: FERRUM_LOG_LEVEL
              value: "info,ferrum_edge::modes::control_plane=debug"
          volumeMounts:
            - name: cp-data
              mountPath: /data
            - name: transport
              mountPath: /transport
              readOnly: true
      volumes:
        - name: cp-data
          emptyDir: {}
        - name: transport
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: ferrum-native-mtls-cp
                  items:
                    - key: server.pem
                      path: server.pem
                    - key: server-key.pem
                      path: server-key.pem
                    - key: client-ca.pem
                      path: client-ca.pem
---
# ── Native-MeshSubscribe destination pod (capp) ─────────────────────────────
# Shaped exactly like `svc` (inbound iptables REDIRECT 8080 -> :15006, SPIRE
# identity, python echo answering a DISTINCT marker) except the sidecar's mesh
# config arrives via FERRUM_MESH_CONFIG_PROTOCOL=native from the ferrum-cp
# MeshSubscribe stream — no ConfigMap mount. Mesh-mode startup BLOCKS in
# wait_for_initial_mesh_config until a valid slice arrives (reconnecting with
# jittered backoff while the CP rolls out), and the sidecar materializes its
# :15006 inbound routes only from a slice whose K8s-built capp workload
# SPIFFE ID matches FERRUM_MESH_WORKLOAD_SPIFFE_ID — client traffic reaching
# the app therefore proves CP-delivered native config end to end. The
# CP-built slice carries no PeerAuthentication (no PeerAuthentication CRD is
# installed), so inbound is PERMISSIVE; the client's egress still dials mesh-mTLS with its
# SPIRE SVID, and STRICT posture remains proven by the svc/wssvc legs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capp
  namespace: __NAMESPACE__
---
# Dedicated identity for native MeshSubscribe transport negatives/rotation
# probes. Must not share sa/capp: a second pod with capp's SPIFFE would make
# resolve_local_workloads fail closed on the live destination.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: native-mtls-probe
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: Service
metadata:
  name: capp
  namespace: __NAMESPACE__
spec:
  selector:
    app: capp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capp
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capp
  template:
    metadata:
      labels:
        app: capp
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: capp
      securityContext:
        fsGroup: 1337
      initContainers:
        - name: ferrum-edge-init
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache iptables
              iptables -t nat -N FERRUM_INBOUND 2>/dev/null || true
              iptables -t nat -C PREROUTING -p tcp -j FERRUM_INBOUND 2>/dev/null || \
                iptables -t nat -A PREROUTING -p tcp -j FERRUM_INBOUND
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 15006 -j RETURN 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 15006 -j RETURN
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006
              echo "ferrum inbound capture installed (8080 -> 15006)"
              iptables -t nat -L FERRUM_INBOUND -n
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: inbound
              containerPort: 15006
          env:
            - name: FERRUM_MODE
              value: mesh
            - name: FERRUM_MESH_TOPOLOGY
              value: sidecar
            - name: FERRUM_MESH_CONFIG_PROTOCOL
              value: native
            - name: FERRUM_DP_CP_GRPC_URLS
              value: https://ferrum-cp.__NAMESPACE__.svc.cluster.local:50051
            - name: FERRUM_DP_GRPC_TLS_CA_CERT_PATH
              value: /transport/ca.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_CERT_PATH
              value: /transport/client.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_KEY_PATH
              value: /transport/client-key.pem
            - name: FERRUM_BACKEND_TLS_WATCH_INTERVAL_SECONDS
              value: "2"
            - name: FERRUM_CP_DP_GRPC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-mesh-e2e-secrets
                  key: cp-dp-grpc-jwt-secret
            # Subscribe-request namespace + self-minted JWT `ns` claim; must
            # sit inside the CP's scope (CpScope::Single(FERRUM_NAMESPACE)).
            - name: FERRUM_NAMESPACE
              value: __NAMESPACE__
            - name: FERRUM_MESH_PRODUCTION_MODE
              value: "true"
            - name: FERRUM_MESH_CA_BACKEND
              value: spire_agent
            - name: FERRUM_MESH_SPIRE_AGENT_SOCKET
              value: /run/spire/sockets/agent.sock
            - name: FERRUM_MESH_WORKLOAD_SPIFFE_ID
              value: spiffe://__TRUST_DOMAIN__/ns/__NAMESPACE__/sa/capp
            - name: FERRUM_ADMIN_HTTP_PORT
              value: "15020"
            # Enables the JWT-authenticated GET /mesh/config-drift diagnostics
            # probe (run.sh mints the HS256 token; without this env mesh mode
            # generates a random unknowable secret).
            - name: FERRUM_ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-mesh-e2e-secrets
                  key: admin-jwt-secret
            - name: FERRUM_POOL_WARMUP_ENABLED
              value: "false"
            - name: FERRUM_LOG_LEVEL
              value: info
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: transport
              mountPath: /transport
              readOnly: true
        - name: app
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          command:
            - python
            - -u
            - -c
            - |
              import socket
              import threading
              import time

              # Distinct marker ("<app body>-native") so a native-subscribe
              # probe answer can never be confused with the file-config svc.
              BODY = b"__APP_BODY__-native\n"
              RESPONSE = (
                  b"HTTP/1.1 200 OK\r\n"
                  b"content-length: " + str(len(BODY)).encode() + b"\r\n"
                  b"\r\n" + BODY
              )

              def serve():
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind(("0.0.0.0", 8080))
                  s.listen(128)
                  while True:
                      conn, _ = s.accept()
                      data = conn.recv(4096)
                      if data:
                          conn.sendall(RESPONSE)
                      conn.close()

              threading.Thread(target=serve, daemon=True).start()
              while True:
                  time.sleep(3600)
        # Loopback admin prober: the sidecar's admin API binds 127.0.0.1, so
        # the config-drift diagnostics curl must run INSIDE the pod netns.
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep 365d"]
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: transport
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: ferrum-native-mtls-dp
                  items:
                    - key: ca.pem
                      path: ca.pem
                    - key: client.pem
                      path: client.pem
                    - key: client-key.pem
                      path: client-key.pem
---
# ── DestinationRule visibility destinations (beta-owned MeshService) ───────
# Two sidecar-backed workloads behind MeshService `drsvc` owned by namespace
# `beta`. Sidecar materialization only iterates MeshService workloads (not
# ServiceEntry endpoints), so these pods must speak real inbound mesh-mTLS
# (:15006 + SPIRE) for the client's captured :15001 egress. Bodies are fixed
# markers (not __APP_BODY__) so they cannot collide with the svc STRICT probes.
# FERRUM_NAMESPACE=beta so the dest file-slice keeps beta/drsvc visible without
# a Sidecar on the destination; SPIFFE stays ns/__NAMESPACE__/sa/drsvc-* (the
# real k8s SA / SPIRE selector). Each SA backs exactly one local service_name
# so resolve_local_workloads cannot fail closed on ambiguity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drsvc-a
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drsvc-a
  template:
    metadata:
      labels:
        app: drsvc-a
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: drsvc-a
      initContainers:
        - name: ferrum-edge-init
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache iptables
              iptables -t nat -N FERRUM_INBOUND 2>/dev/null || true
              iptables -t nat -C PREROUTING -p tcp -j FERRUM_INBOUND 2>/dev/null || \
                iptables -t nat -A PREROUTING -p tcp -j FERRUM_INBOUND
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 15006 -j RETURN 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 15006 -j RETURN
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006
              echo "ferrum inbound capture installed (8080 -> 15006)"
              iptables -t nat -L FERRUM_INBOUND -n
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: inbound
              containerPort: 15006
          env:
            - name: FERRUM_MODE
              value: mesh
            - name: FERRUM_MESH_TOPOLOGY
              value: sidecar
            - name: FERRUM_MESH_CONFIG_PROTOCOL
              value: file
            - name: FERRUM_MESH_FILE_CONFIG_PATH
              value: /etc/ferrum/mesh/mesh.yaml
            - name: FERRUM_NAMESPACE
              value: beta
            - name: FERRUM_MESH_PRODUCTION_MODE
              value: "true"
            - name: FERRUM_MESH_PEER_AUTH_LIVE_RELOAD_ENABLED
              value: "true"
            - name: FERRUM_MESH_CA_BACKEND
              value: spire_agent
            - name: FERRUM_MESH_SPIRE_AGENT_SOCKET
              value: /run/spire/sockets/agent.sock
            - name: FERRUM_MESH_WORKLOAD_SPIFFE_ID
              value: spiffe://__TRUST_DOMAIN__/ns/__NAMESPACE__/sa/drsvc-a
            - name: FERRUM_ADMIN_HTTP_PORT
              value: "15020"
            - name: FERRUM_POOL_WARMUP_ENABLED
              value: "false"
            - name: FERRUM_LOG_LEVEL
              value: info
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: mesh-config
              mountPath: /etc/ferrum/mesh
              readOnly: true
        - name: app
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          command:
            - python
            - -u
            - -c
            - |
              import socket, threading, time
              BODY = b"backend-a\n"
              RESPONSE = (
                  b"HTTP/1.1 200 OK\r\n"
                  b"content-length: " + str(len(BODY)).encode() + b"\r\n"
                  b"\r\n" + BODY
              )
              def serve():
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind(("0.0.0.0", 8080))
                  s.listen(128)
                  while True:
                      conn, _ = s.accept()
                      data = conn.recv(4096)
                      if data:
                          conn.sendall(RESPONSE)
                      conn.close()
              threading.Thread(target=serve, daemon=True).start()
              while True:
                  time.sleep(3600)
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: mesh-config
          configMap:
            name: ferrum-mesh-drsvc-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drsvc-b
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drsvc-b
  template:
    metadata:
      labels:
        app: drsvc-b
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: drsvc-b
      initContainers:
        - name: ferrum-edge-init
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache iptables
              iptables -t nat -N FERRUM_INBOUND 2>/dev/null || true
              iptables -t nat -C PREROUTING -p tcp -j FERRUM_INBOUND 2>/dev/null || \
                iptables -t nat -A PREROUTING -p tcp -j FERRUM_INBOUND
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 15006 -j RETURN 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 15006 -j RETURN
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006
              echo "ferrum inbound capture installed (8080 -> 15006)"
              iptables -t nat -L FERRUM_INBOUND -n
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: inbound
              containerPort: 15006
          env:
            - name: FERRUM_MODE
              value: mesh
            - name: FERRUM_MESH_TOPOLOGY
              value: sidecar
            - name: FERRUM_MESH_CONFIG_PROTOCOL
              value: file
            - name: FERRUM_MESH_FILE_CONFIG_PATH
              value: /etc/ferrum/mesh/mesh.yaml
            - name: FERRUM_NAMESPACE
              value: beta
