---
# ── Rogue client pod (dest-side authz negative) ─────────────────────────────
# Identical to the client but running as sa/rogue: it completes valid
# same-trust-domain mTLS to the destination and is then DENIED at the
# DESTINATION by the `deny-rogue` AuthorizationPolicy (mesh_authz 403). STRICT
# PeerAuth alone cannot tell sa/rogue from sa/client (both present a valid
# SVID in the trusted domain) — the identity-scoped DENY is what holds the
# boundary, so the 403 proves destination-side authz, not an incidental
# client-side TLS failure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rogue
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rogue
  template:
    metadata:
      labels:
        app: rogue
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: rogue
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: outbound
              containerPort: 15001
          env:
            - name: FERRUM_MODE
              value: mesh
            - name: FERRUM_MESH_TOPOLOGY
              value: sidecar
            - name: FERRUM_MESH_CONFIG_PROTOCOL
              value: file
            - name: FERRUM_MESH_FILE_CONFIG_PATH
              value: /etc/ferrum/mesh/mesh.yaml
            - name: FERRUM_MESH_PRODUCTION_MODE
              value: "true"
            - name: FERRUM_MESH_CA_BACKEND
              value: spire_agent
            - name: FERRUM_MESH_SPIRE_AGENT_SOCKET
              value: /run/spire/sockets/agent.sock
            - name: FERRUM_MESH_WORKLOAD_SPIFFE_ID
              value: spiffe://__TRUST_DOMAIN__/ns/__NAMESPACE__/sa/rogue
            - name: FERRUM_MESH_SIDECAR_ENFORCED
              value: "true"
            - name: FERRUM_MESH_OUTBOUND_LISTEN_ADDR
              value: 0.0.0.0:15001
            - name: FERRUM_ADMIN_HTTP_PORT
              value: "15020"
            - name: FERRUM_POOL_WARMUP_ENABLED
              value: "false"
            - name: FERRUM_LOG_LEVEL
              value: debug
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: mesh-config
              mountPath: /etc/ferrum/mesh
              readOnly: true
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep 365d"]
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: mesh-config
          configMap:
            name: ferrum-mesh-client
---
# ── VirtualService http[] split gate (issue #7502) ──────────────────────────
# vssvc-v1 / vssvc-v2: capp-shaped native-MeshSubscribe destinations (inbound
# REDIRECT 8080 -> :15006, SPIRE identity, PERMISSIVE inbound because no
# PeerAuthentication CRD is installed) answering fixed markers
# `vs-backend-v1` / `vs-backend-v2`. The client's split legs still dial them
# over SVID-mTLS pinned to each workload identity: a Sidecar mesh.mtls target
# has no plaintext fallback. Each Service is backed by exactly one pod with
# its own service account.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vssvc-v1
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: Service
metadata:
  name: vssvc-v1
  namespace: __NAMESPACE__
spec:
  selector:
    app: vssvc-v1
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vssvc-v1
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vssvc-v1
  template:
    metadata:
      labels:
        app: vssvc-v1
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: vssvc-v1
      securityContext:
        fsGroup: 1337
      initContainers:
        - name: ferrum-edge-init
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache iptables
              iptables -t nat -N FERRUM_INBOUND 2>/dev/null || true
              iptables -t nat -C PREROUTING -p tcp -j FERRUM_INBOUND 2>/dev/null || \
                iptables -t nat -A PREROUTING -p tcp -j FERRUM_INBOUND
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 15006 -j RETURN 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 15006 -j RETURN
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006
              echo "ferrum inbound capture installed (8080 -> 15006)"
              iptables -t nat -L FERRUM_INBOUND -n
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: inbound
              containerPort: 15006
          env:
            - name: FERRUM_MODE
              value: mesh
            - name: FERRUM_MESH_TOPOLOGY
              value: sidecar
            - name: FERRUM_MESH_CONFIG_PROTOCOL
              value: native
            - name: FERRUM_DP_CP_GRPC_URLS
              value: https://ferrum-cp.__NAMESPACE__.svc.cluster.local:50051
            - name: FERRUM_DP_GRPC_TLS_CA_CERT_PATH
              value: /transport/ca.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_CERT_PATH
              value: /transport/client.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_KEY_PATH
              value: /transport/client-key.pem
            - name: FERRUM_BACKEND_TLS_WATCH_INTERVAL_SECONDS
              value: "2"
            - name: FERRUM_CP_DP_GRPC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-mesh-e2e-secrets
                  key: cp-dp-grpc-jwt-secret
            - name: FERRUM_NAMESPACE
              value: __NAMESPACE__
            - name: FERRUM_MESH_PRODUCTION_MODE
              value: "true"
            - name: FERRUM_MESH_CA_BACKEND
              value: spire_agent
            - name: FERRUM_MESH_SPIRE_AGENT_SOCKET
              value: /run/spire/sockets/agent.sock
            - name: FERRUM_MESH_WORKLOAD_SPIFFE_ID
              value: spiffe://__TRUST_DOMAIN__/ns/__NAMESPACE__/sa/vssvc-v1
            - name: FERRUM_ADMIN_HTTP_PORT
              value: "15020"
            - name: FERRUM_POOL_WARMUP_ENABLED
              value: "false"
            - name: FERRUM_LOG_LEVEL
              value: info
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: transport
              mountPath: /transport
              readOnly: true
        - name: app
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          command:
            - python
            - -u
            - -c
            - |
              import socket, threading, time
              BODY = b"vs-backend-v1\n"
              RESPONSE = (
                  b"HTTP/1.1 200 OK\r\n"
                  b"content-length: " + str(len(BODY)).encode() + b"\r\n"
                  b"\r\n" + BODY
              )
              def serve():
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind(("0.0.0.0", 8080))
                  s.listen(128)
                  while True:
                      conn, _ = s.accept()
                      data = conn.recv(4096)
                      if data:
                          conn.sendall(RESPONSE)
                      conn.close()
              threading.Thread(target=serve, daemon=True).start()
              while True:
                  time.sleep(3600)
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: transport
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: ferrum-native-mtls-dp
                  items:
                    - key: ca.pem
                      path: ca.pem
                    - key: client.pem
                      path: client.pem
                    - key: client-key.pem
                      path: client-key.pem
---
