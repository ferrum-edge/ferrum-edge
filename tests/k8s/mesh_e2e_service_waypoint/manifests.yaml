# Live ServiceWaypoint mesh e2e workloads (issue #7503, design spec
# docs/plans/mesh_virtualservice_servicewaypoint.md section 6.4).
#
# Applied ONCE by run.sh after the placeholders below are substituted (awk) and
# after the pinned CRDs are Established. One kind cluster runs SPIRE, a Ferrum
# control plane, a ServiceWaypoint, its bound Services' native Sidecar
# backends, a cross-namespace destination, and an HBONE client:
#
#   - `ferrum-cp` (namespace __NAMESPACE__) — FERRUM_MODE=cp, sqlite, K8s
#     controller with pod discovery, Istio CRD watching (VirtualService,
#     AuthorizationPolicy) and Gateway API CRD watching (Gateway,
#     ReferenceGrant) over a two-namespace scope (__NAMESPACE__ and
#     __BETA_NAMESPACE__, FERRUM_CP_NAMESPACES). It serves native
#     MeshSubscribe on :50051 with production mTLS + JWT (same per-run PKI
#     shape as mesh-e2e-sidecar).
#   - `__WAYPOINT__` — a waypoint Gateway (gatewayClassName: istio-waypoint,
#     istio.io/waypoint-for: service) and the ServiceWaypoint Deployment
#     (FERRUM_MESH_TOPOLOGY=service_waypoint, FERRUM_MESH_WAYPOINT_NAME=__WAYPOINT__,
#     native MeshSubscribe, SPIRE identity sa/__WAYPOINT__) listening for HBONE
#     on :15008.
#   - Bound Services (label istio.io/use-waypoint: __WAYPOINT__):
#       swsvc        frontend, no backing pod; carries the split VirtualService
#       swsvc-v1     native Sidecar backend answering `sw-backend-v1`
#       swsvc-v2     native Sidecar backend answering `sw-backend-v2`
#       swx          frontend, no backing pod; carries the cross-namespace
#                    VirtualService to xsvc.__BETA_NAMESPACE__
#   - `xsvc` (namespace __BETA_NAMESPACE__) — native Sidecar backend answering
#     `sw-xsvc-beta`, the cross-namespace destination admitted only while a
#     ReferenceGrant in __BETA_NAMESPACE__ allows it.
#   - `hbone-client` — an init container fetches the pod's SPIRE X.509 SVID
#     (spire-agent api fetch x509) into an emptyDir; the curl container then
#     opens authenticated HTTP/2 CONNECT tunnels to the waypoint's :15008
#     (curl --proxy https://<waypoint>:15008 --proxy-http2 --proxytunnel with
#     the SVID as the proxy client certificate) and sends inner HTTP/1.1
#     requests through them: exactly the HBONE shape the waypoint terminates.
#
# Backends answer GET /slow after 90 s so the suite can hold one inner request
# (and its L7 tunnel) open across a binding withdrawal.
#
# Secrets (`ferrum-mesh-e2e-secrets`, `ferrum-native-mtls-cp`,
# `ferrum-native-mtls-dp`) are minted per run by run.sh in both namespaces;
# this manifest references but does not define them.
#
# Substituted placeholders:
#   __NAMESPACE__        waypoint namespace (ferrum)
#   __BETA_NAMESPACE__   cross-namespace destination namespace (beta)
#   __TRUST_DOMAIN__     cluster trust domain (mesh-e2e.test)
#   __IMAGE__            ferrum runtime image ref
#   __SPIRE_AGENT_IMAGE__ the SPIRE agent image tests/k8s/lib/spire.sh deploys
#   __WAYPOINT__         waypoint Gateway / FERRUM_MESH_WAYPOINT_NAME (swp)
---
apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
  labels:
    ferrum.io/mesh: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: __BETA_NAMESPACE__
  labels:
    ferrum.io/mesh: enabled
---
# Istio CRDs are watched in every scope namespace AND the Istio root namespace
# (FERRUM_K8S_ISTIO_ROOT_NAMESPACE, default istio-system); its watch must list
# successfully or the K8s config revision never gets evidence for that scope.
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ferrum-cp
  namespace: __NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ferrum-cp
  namespace: __NAMESPACE__
rules:
  # Pod discovery (FERRUM_K8S_POD_DISCOVERY_ENABLED).
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Istio CRD watch: only the kinds this suite installs.
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies/status"]
    verbs: ["get", "patch", "update"]
  # Gateway API watch: the waypoint Gateway and the cross-namespace
  # ReferenceGrant, plus the core Secret/ConfigMap watch the Gateway API
  # controller runs per watched namespace.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "referencegrants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ferrum-cp
  namespace: __NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ferrum-cp
subjects:
  - kind: ServiceAccount
    name: ferrum-cp
    namespace: __NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ferrum-cp
  namespace: __BETA_NAMESPACE__
rules:
  # Pod discovery (FERRUM_K8S_POD_DISCOVERY_ENABLED).
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Istio CRD watch: only the kinds this suite installs.
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies/status"]
    verbs: ["get", "patch", "update"]
  # Gateway API watch: the waypoint Gateway and the cross-namespace
  # ReferenceGrant, plus the core Secret/ConfigMap watch the Gateway API
  # controller runs per watched namespace.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "referencegrants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ferrum-cp
  namespace: __BETA_NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ferrum-cp
subjects:
  - kind: ServiceAccount
    name: ferrum-cp
    namespace: __NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ferrum-cp-istio-root
  namespace: istio-system
rules:
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ferrum-cp-istio-root
  namespace: istio-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ferrum-cp-istio-root
subjects:
  - kind: ServiceAccount
    name: ferrum-cp
    namespace: __NAMESPACE__
---
# Gateway API watching also watches Namespace objects cluster-wide (labels feed
# Gateway allowedRoutes namespace selectors), which needs a ClusterRole. Read
# only, Namespaces only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ferrum-cp-swp-e2e-namespaces
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ferrum-cp-swp-e2e-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ferrum-cp-swp-e2e-namespaces
subjects:
  - kind: ServiceAccount
    name: ferrum-cp
    namespace: __NAMESPACE__
---
apiVersion: v1
kind: Service
metadata:
  name: ferrum-cp
  namespace: __NAMESPACE__
spec:
  selector:
    app: ferrum-cp
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrum-cp
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ferrum-cp
  template:
    metadata:
      labels:
        app: ferrum-cp
    spec:
      serviceAccountName: ferrum-cp
      securityContext:
        fsGroup: 1337
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: grpc
              containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          env:
            - name: FERRUM_MODE
              value: cp
            - name: FERRUM_NAMESPACE
              value: __NAMESPACE__
            # Two-namespace scope: the waypoint namespace and the
            # cross-namespace destination namespace. A Set scope requires a
            # JWT `ns` claim on every subscription and partitions every
            # namespace's resources (src/modes/control_plane.rs).
            - name: FERRUM_CP_NAMESPACES
              value: __NAMESPACE__,__BETA_NAMESPACE__
            - name: FERRUM_DB_TYPE
              value: sqlite
            - name: FERRUM_DB_URL
              value: sqlite:/data/ferrum.db?mode=rwc
            - name: FERRUM_ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-mesh-e2e-secrets
                  key: admin-jwt-secret
            - name: FERRUM_CP_DP_GRPC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-mesh-e2e-secrets
                  key: cp-dp-grpc-jwt-secret
            - name: FERRUM_CP_GRPC_LISTEN_ADDR
              value: 0.0.0.0:50051
            - name: FERRUM_CP_GRPC_TLS_CERT_PATH
              value: /transport/server.pem
            - name: FERRUM_CP_GRPC_TLS_KEY_PATH
              value: /transport/server-key.pem
            - name: FERRUM_CP_GRPC_TLS_CLIENT_CA_PATH
              value: /transport/client-ca.pem
            - name: FERRUM_K8S_CONTROLLER_ENABLED
              value: "true"
            - name: FERRUM_K8S_POD_DISCOVERY_ENABLED
              value: "true"
            - name: FERRUM_K8S_WATCH_IDLE_RELIST_SECS
              value: "2"
            - name: FERRUM_K8S_WATCH_ISTIO_CRDS
              value: "true"
            - name: FERRUM_K8S_WATCH_GATEWAY_API_CRDS
              value: "true"
            - name: FERRUM_K8S_WATCH_MESH_CONFIG
              value: "false"
            - name: FERRUM_K8S_TRUST_DOMAIN
              value: __TRUST_DOMAIN__
            - name: FERRUM_POOL_WARMUP_ENABLED
              value: "false"
            - name: FERRUM_LOG_LEVEL
              value: info
          volumeMounts:
            - name: cp-data
              mountPath: /data
            - name: transport
              mountPath: /transport
              readOnly: true
      volumes:
        - name: cp-data
          emptyDir: {}
        - name: transport
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: ferrum-native-mtls-cp
                  items:
                    - key: server.pem
                      path: server.pem
                    - key: server-key.pem
                      path: server-key.pem
                    - key: client-ca.pem
                      path: client-ca.pem
---
# ── Waypoint Gateway + ServiceWaypoint ──────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: __WAYPOINT__
  namespace: __NAMESPACE__
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: __WAYPOINT__
  namespace: __NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __WAYPOINT__
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: __WAYPOINT__
  template:
    metadata:
      labels:
        app: __WAYPOINT__
    spec:
      serviceAccountName: __WAYPOINT__
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: hbone
              containerPort: 15008
          env:
            - name: FERRUM_MODE
              value: mesh
            - name: FERRUM_MESH_TOPOLOGY
              value: service_waypoint
            - name: FERRUM_MESH_WAYPOINT_NAME
              value: __WAYPOINT__
            - name: FERRUM_MESH_CONFIG_PROTOCOL
              value: native
            - name: FERRUM_DP_CP_GRPC_URLS
              value: https://ferrum-cp.__NAMESPACE__.svc.cluster.local:50051
            - name: FERRUM_DP_GRPC_TLS_CA_CERT_PATH
              value: /transport/ca.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_CERT_PATH
              value: /transport/client.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_KEY_PATH
              value: /transport/client-key.pem
            - name: FERRUM_CP_DP_GRPC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-mesh-e2e-secrets
                  key: cp-dp-grpc-jwt-secret
            - name: FERRUM_NAMESPACE
              value: __NAMESPACE__
            - name: FERRUM_MESH_PRODUCTION_MODE
              value: "true"
            - name: FERRUM_MESH_CA_BACKEND
              value: spire_agent
            - name: FERRUM_MESH_SPIRE_AGENT_SOCKET
              value: /run/spire/sockets/agent.sock
            - name: FERRUM_MESH_WORKLOAD_SPIFFE_ID
              value: spiffe://__TRUST_DOMAIN__/ns/__NAMESPACE__/sa/__WAYPOINT__
            - name: FERRUM_ADMIN_HTTP_PORT
              value: "15020"
            # Admin JWT for /metrics, /service-waypoint/services and
            # /mesh/policy-denies/recent (run.sh mints the HS256 bearer).
            - name: FERRUM_ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-mesh-e2e-secrets
                  key: admin-jwt-secret
            - name: FERRUM_POOL_WARMUP_ENABLED
              value: "false"
            - name: FERRUM_LOG_LEVEL
              value: info
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: transport
              mountPath: /transport
              readOnly: true
        # Loopback admin prober (the admin API binds 127.0.0.1).
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep 365d"]
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: transport
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: ferrum-native-mtls-dp
                  items:
                    - key: ca.pem
                      path: ca.pem
                    - key: client.pem
                      path: client.pem
                    - key: client-key.pem
                      path: client-key.pem
---
# ── Bound Services and their native Sidecar backends ────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swsvc-v1
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: Service
metadata:
  name: swsvc-v1
  namespace: __NAMESPACE__
  labels:
    istio.io/use-waypoint: __WAYPOINT__
spec:
  selector:
    app: swsvc-v1
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swsvc-v1
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swsvc-v1
  template:
    metadata:
      labels:
        app: swsvc-v1
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: swsvc-v1
      securityContext:
        fsGroup: 1337
      initContainers:
        - name: ferrum-edge-init
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache iptables
              iptables -t nat -N FERRUM_INBOUND 2>/dev/null || true
              iptables -t nat -C PREROUTING -p tcp -j FERRUM_INBOUND 2>/dev/null || \
                iptables -t nat -A PREROUTING -p tcp -j FERRUM_INBOUND
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 15006 -j RETURN 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 15006 -j RETURN
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006
              echo "ferrum inbound capture installed (8080 -> 15006)"
              iptables -t nat -L FERRUM_INBOUND -n
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: inbound
              containerPort: 15006
          env:
            - name: FERRUM_MODE
              value: mesh
            - name: FERRUM_MESH_TOPOLOGY
              value: sidecar
            - name: FERRUM_MESH_CONFIG_PROTOCOL
              value: native
            - name: FERRUM_DP_CP_GRPC_URLS
              value: https://ferrum-cp.__NAMESPACE__.svc.cluster.local:50051
            - name: FERRUM_DP_GRPC_TLS_CA_CERT_PATH
              value: /transport/ca.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_CERT_PATH
              value: /transport/client.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_KEY_PATH
              value: /transport/client-key.pem
            - name: FERRUM_CP_DP_GRPC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-mesh-e2e-secrets
                  key: cp-dp-grpc-jwt-secret
            - name: FERRUM_NAMESPACE
              value: __NAMESPACE__
            - name: FERRUM_MESH_PRODUCTION_MODE
              value: "true"
            - name: FERRUM_MESH_CA_BACKEND
              value: spire_agent
            - name: FERRUM_MESH_SPIRE_AGENT_SOCKET
              value: /run/spire/sockets/agent.sock
            - name: FERRUM_MESH_WORKLOAD_SPIFFE_ID
              value: spiffe://__TRUST_DOMAIN__/ns/__NAMESPACE__/sa/swsvc-v1
            - name: FERRUM_ADMIN_HTTP_PORT
              value: "15020"
            - name: FERRUM_POOL_WARMUP_ENABLED
              value: "false"
            - name: FERRUM_LOG_LEVEL
              value: info
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: transport
              mountPath: /transport
              readOnly: true
        - name: app
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          command:
            - python
            - -u
            - -c
            - |
              import socket, threading, time
              BODY = b"sw-backend-v1\n"
              RESPONSE = (
                  b"HTTP/1.1 200 OK\r\n"
                  b"content-length: " + str(len(BODY)).encode() + b"\r\n"
                  b"\r\n" + BODY
              )
              def handle(conn):
                  try:
                      data = conn.recv(4096)
                      if not data:
                          return
                      line = data.split(b"\r\n", 1)[0]
                      # GET /slow holds the response open so the suite can
                      # keep one L7 HBONE tunnel alive across a binding change.
                      if b" /slow" in line:
                          time.sleep(90)
                      conn.sendall(RESPONSE)
                  except OSError:
                      pass
                  finally:
                      conn.close()
              def serve():
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind(("0.0.0.0", 8080))
                  s.listen(128)
                  while True:
                      conn, _ = s.accept()
                      threading.Thread(target=handle, args=(conn,), daemon=True).start()
              threading.Thread(target=serve, daemon=True).start()
              while True:
                  time.sleep(3600)
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: transport
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: ferrum-native-mtls-dp
                  items:
                    - key: ca.pem
                      path: ca.pem
                    - key: client.pem
                      path: client.pem
                    - key: client-key.pem
                      path: client-key.pem
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swsvc-v2
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: Service
metadata:
  name: swsvc-v2
  namespace: __NAMESPACE__
  labels:
    istio.io/use-waypoint: __WAYPOINT__
spec:
  selector:
    app: swsvc-v2
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swsvc-v2
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swsvc-v2
  template:
    metadata:
      labels:
        app: swsvc-v2
        ferrum.io/mesh: enabled
    spec:
      serviceAccountName: swsvc-v2
      securityContext:
        fsGroup: 1337
      initContainers:
        - name: ferrum-edge-init
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache iptables
              iptables -t nat -N FERRUM_INBOUND 2>/dev/null || true
              iptables -t nat -C PREROUTING -p tcp -j FERRUM_INBOUND 2>/dev/null || \
                iptables -t nat -A PREROUTING -p tcp -j FERRUM_INBOUND
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 15006 -j RETURN 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 15006 -j RETURN
              iptables -t nat -C FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006 2>/dev/null || \
                iptables -t nat -A FERRUM_INBOUND -p tcp --dport 8080 -j REDIRECT --to-ports 15006
              echo "ferrum inbound capture installed (8080 -> 15006)"
              iptables -t nat -L FERRUM_INBOUND -n
      containers:
        - name: ferrum-edge
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            runAsUser: 1337
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: inbound
              containerPort: 15006
          env:
            - name: FERRUM_MODE
              value: mesh
            - name: FERRUM_MESH_TOPOLOGY
              value: sidecar
            - name: FERRUM_MESH_CONFIG_PROTOCOL
              value: native
            - name: FERRUM_DP_CP_GRPC_URLS
              value: https://ferrum-cp.__NAMESPACE__.svc.cluster.local:50051
            - name: FERRUM_DP_GRPC_TLS_CA_CERT_PATH
              value: /transport/ca.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_CERT_PATH
              value: /transport/client.pem
            - name: FERRUM_DP_GRPC_TLS_CLIENT_KEY_PATH
              value: /transport/client-key.pem
            - name: FERRUM_CP_DP_GRPC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferrum-mesh-e2e-secrets
                  key: cp-dp-grpc-jwt-secret
            - name: FERRUM_NAMESPACE
              value: __NAMESPACE__
            - name: FERRUM_MESH_PRODUCTION_MODE
              value: "true"
            - name: FERRUM_MESH_CA_BACKEND
              value: spire_agent
            - name: FERRUM_MESH_SPIRE_AGENT_SOCKET
              value: /run/spire/sockets/agent.sock
            - name: FERRUM_MESH_WORKLOAD_SPIFFE_ID
              value: spiffe://__TRUST_DOMAIN__/ns/__NAMESPACE__/sa/swsvc-v2
            - name: FERRUM_ADMIN_HTTP_PORT
              value: "15020"
            - name: FERRUM_POOL_WARMUP_ENABLED
              value: "false"
            - name: FERRUM_LOG_LEVEL
              value: info
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: transport
              mountPath: /transport
              readOnly: true
        - name: app
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          command:
            - python
            - -u
            - -c
            - |
              import socket, threading, time
              BODY = b"sw-backend-v2\n"
              RESPONSE = (
                  b"HTTP/1.1 200 OK\r\n"
                  b"content-length: " + str(len(BODY)).encode() + b"\r\n"
                  b"\r\n" + BODY
              )
              def handle(conn):
                  try:
                      data = conn.recv(4096)
                      if not data:
                          return
                      line = data.split(b"\r\n", 1)[0]
                      # GET /slow holds the response open so the suite can
                      # keep one L7 HBONE tunnel alive across a binding change.
                      if b" /slow" in line:
                          time.sleep(90)
                      conn.sendall(RESPONSE)
                  except OSError:
                      pass
                  finally:
                      conn.close()
              def serve():
                  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind(("0.0.0.0", 8080))
                  s.listen(128)
                  while True:
                      conn, _ = s.accept()
                      threading.Thread(target=handle, args=(conn,), daemon=True).start()
              threading.Thread(target=serve, daemon=True).start()
              while True:
                  time.sleep(3600)
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: transport
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: ferrum-native-mtls-dp
                  items:
                    - key: ca.pem
                      path: ca.pem
                    - key: client.pem
                      path: client.pem
                    - key: client-key.pem
                      path: client-key.pem
---
# Frontend for the split VirtualService. Bound to the waypoint, selector matches NO pod (one
# pod backs exactly one Service), so only a carried VirtualService route can
# answer it.
apiVersion: v1
kind: Service
metadata:
  name: swsvc
  namespace: __NAMESPACE__
  labels:
    istio.io/use-waypoint: __WAYPOINT__
spec:
  selector:
    app: swsvc-frontend-unbacked
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http
---
# Frontend for the cross-namespace VirtualService. Bound to the waypoint, selector matches NO pod (one
# pod backs exactly one Service), so only a carried VirtualService route can
# answer it.
apiVersion: v1
kind: Service
metadata:
  name: swx
  namespace: __NAMESPACE__
  labels:
    istio.io/use-waypoint: __WAYPOINT__
spec:
  selector:
    app: swx-frontend-unbacked
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http
---
