---
# ── HBONE client ────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hbone-client
  namespace: __NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hbone-client
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hbone-client
  template:
    metadata:
      labels:
        app: hbone-client
    spec:
      serviceAccountName: hbone-client
      securityContext:
        # curlimages/curl runs as curl_user (100:101); the init container
        # writes the SVID as that user so the curl container can read the key.
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
      initContainers:
        # SPIRE issues this pod's X.509 SVID through the Workload API (k8s
        # attestor: namespace + service account); `api fetch x509 -write`
        # stores svid.0.pem, svid.0.key and bundle.0.pem in the emptyDir. The
        # entry is registered before this Deployment is applied.
        - name: fetch-svid
          image: __SPIRE_AGENT_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["/opt/spire/bin/spire-agent"]
          args:
            - api
            - fetch
            - x509
            - -socketPath
            - /run/spire/sockets/agent.sock
            - -timeout
            - 60s
            - -write
            - /svid
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: svid
              mountPath: /svid
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep 365d"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: svid
              mountPath: /svid
              readOnly: true
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: svid
          emptyDir: {}
