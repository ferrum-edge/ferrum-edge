# Minimal Gateway API ReferenceGrant CRD (gateway.networking.k8s.io/v1beta1,
# the version Gateway API's standard channel stores), checked in for the
# mesh-e2e-sidecar live suite (issue #7502) so the kind cluster can hold
# ReferenceGrant objects without fetching manifests from the network. The
# suite installs it with the Istio CRDs; ferrum-cp keeps Gateway API watching
# disabled because the split gate is same-namespace (cross-namespace carried
# destinations are issue #7499). x-kubernetes-preserve-unknown-fields keeps
# the spec free of the full upstream schema. Not a Gateway API install.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: referencegrants.gateway.networking.k8s.io
  annotations:
    # Required for any CRD in a *.k8s.io / *.kubernetes.io group: the API
    # server refuses it without an approval annotation. This is the value the
    # upstream Gateway API CRDs carry.
    api-approved.kubernetes.io: https://github.com/kubernetes-sigs/gateway-api/pull/2466
spec:
  group: gateway.networking.k8s.io
  names:
    kind: ReferenceGrant
    listKind: ReferenceGrantList
    plural: referencegrants
    shortNames:
      - refgrant
    singular: referencegrant
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
