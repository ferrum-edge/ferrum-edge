# Minimal PeerAuthentication CRD for the mesh-e2e-sidecar live suite (issue
# #7502). Serves security.istio.io/v1 (the version Ferrum's CRD watcher
# registers, src/k8s_controller/watcher.rs ISTIO_CRDS) plus v1beta1, and
# declares subresources.status so Ferrum's IstioStatusWriter can write
# FerrumAccepted. The suite applies a selector-scoped STRICT policy for the
# VirtualService split destinations through the control plane.
# x-kubernetes-preserve-unknown-fields keeps spec/status free of Istio's full
# schema. Checked in so CI never fetches manifests from the network. Not an
# Istio install.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: peerauthentications.security.istio.io
spec:
  group: security.istio.io
  names:
    kind: PeerAuthentication
    listKind: PeerAuthenticationList
    plural: peerauthentications
    shortNames:
      - pa
    singular: peerauthentication
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
    - name: v1beta1
      served: true
      storage: false
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
