# Minimal VirtualService CRD for the mesh-e2e-sidecar live suite (issue #7502).
# Serves networking.istio.io/v1 (the version Ferrum's CRD watcher registers,
# src/k8s_controller/watcher.rs ISTIO_CRDS) plus v1beta1, and declares
# subresources.status so Ferrum's IstioStatusWriter can write FerrumAccepted.
# x-kubernetes-preserve-unknown-fields keeps spec/status free of Istio's full
# schema. Checked in so CI never fetches manifests from the network. Not an
# Istio install.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualservices.networking.istio.io
spec:
  group: networking.istio.io
  names:
    kind: VirtualService
    listKind: VirtualServiceList
    plural: virtualservices
    shortNames:
      - vs
    singular: virtualservice
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
    - name: v1beta1
      served: true
      storage: false
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
