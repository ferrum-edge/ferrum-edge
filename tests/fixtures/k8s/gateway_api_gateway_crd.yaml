# Minimal Gateway API Gateway CRD for the mesh-e2e-service-waypoint live suite
# (issue #7503). Serves gateway.networking.k8s.io/v1 (the version Ferrum's CRD
# watcher registers first, src/k8s_controller/watcher.rs GATEWAY_API_CRDS) plus
# v1beta1, and declares subresources.status so the Gateway API status writer
# can patch it. The suite applies one waypoint Gateway
# (gatewayClassName: istio-waypoint) that the Kubernetes translator records as
# a MeshConfig.waypoint_bindings entry for the ServiceWaypoint under test.
# x-kubernetes-preserve-unknown-fields keeps the spec free of the full upstream
# schema. Checked in so CI never fetches manifests from the network. Not a
# Gateway API install.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gateways.gateway.networking.k8s.io
  annotations:
    # Required for any CRD in a *.k8s.io / *.kubernetes.io group: the API
    # server refuses it without an approval annotation. This is the value the
    # upstream Gateway API CRDs carry.
    api-approved.kubernetes.io: https://github.com/kubernetes-sigs/gateway-api/pull/2466
spec:
  group: gateway.networking.k8s.io
  names:
    kind: Gateway
    listKind: GatewayList
    plural: gateways
    shortNames:
      - gtw
    singular: gateway
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
    - name: v1beta1
      served: true
      storage: false
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
