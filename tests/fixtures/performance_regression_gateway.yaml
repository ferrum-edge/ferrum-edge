---
version: "1"
# Gateway configuration for the daily CI HTTP overhead gate. The "Start
# gateway" step of .github/workflows/performance-regression.yml loads it with
# FERRUM_MODE=file, and ci_overhead_bench.py drives /health and /api/users
# through it against backend_server on 127.0.0.1:3001.
#
# That workflow never runs on a pull request, so two pull-request checks hold
# this file to it instead:
# - verify_required_ci.py fails when a file the job reads is missing;
# - tests/unit/config/performance_regression_gateway_config_tests.rs loads it
#   through the production file loader, so a schema change that stops it
#   loading fails the Rust lane.
# It lives under tests/fixtures/ rather than tests/performance/ because the
# planner schedules the Rust lane for tests/fixtures/ changes and not for the
# standalone benchmark tree.

proxies:
  - id: "proxy-health"
    name: "Health Check Proxy"
    listen_path: "/health"
    backend_scheme: http
    backend_host: "127.0.0.1"
    backend_port: 3001
    strip_listen_path: false
    preserve_host_header: false
    backend_connect_timeout_ms: 1000
    backend_read_timeout_ms: 5000
    backend_write_timeout_ms: 5000
    backend_tls_verify_server_cert: true
    auth_mode: single

    plugins: []

  - id: "proxy-users"
    name: "Users API Proxy"
    listen_path: "/api/users"
    backend_scheme: http
    backend_host: "127.0.0.1"
    backend_port: 3001
    strip_listen_path: false
    preserve_host_header: false
    backend_connect_timeout_ms: 1000
    backend_read_timeout_ms: 5000
    backend_write_timeout_ms: 5000
    backend_tls_verify_server_cert: true
    auth_mode: single

    plugins: []

  - id: "proxy-data"
    name: "Data API Proxy"
    listen_path: "/api/data"
    backend_scheme: http
    backend_host: "127.0.0.1"
    backend_port: 3001
    strip_listen_path: false
    preserve_host_header: false
    backend_connect_timeout_ms: 1000
    backend_read_timeout_ms: 10000
    backend_write_timeout_ms: 10000
    backend_tls_verify_server_cert: true
    auth_mode: single

    plugins: []

consumers: []

plugin_configs: []
