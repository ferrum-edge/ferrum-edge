[target.aarch64-unknown-linux-gnu]
# Cross 0.2.5 OCI index, resolved from GHCR on 2026-10-04; its executable
# image is linux/amd64 (the host compiler), targeting aarch64 as before.
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5@sha256:7f8308a8734d9fcd2ebbe9a3e4bdea74af293f0799d80c3cc341e340cda49a4c"
# This dedicated file is a complete policy allowlist for the protected ARM64
# jobs: no global/extra target keys, custom Dockerfile/runner/build mode, volume,
# or unfixed passthrough input is permitted by the trusted verifier.
#
# clang/libclang for bindgen come from the image's own Ubuntu 16.04 archive
# (`xenial-updates`, already configured and signed by the base image's
# ubuntu-keyring), pinned to the exact version. No third-party apt
# repository or key is fetched at release time (issue #5955). The package
# installs libclang under /usr/lib/llvm-6.0/lib, matching LIBCLANG_PATH below.
# protoc is a linux/x86_64 host tool, not the aarch64 target. Its SHA-256
# is the already admitted .github/linux-gnu-abi.toml pin, checked before unzip.
pre-build = [
    "dpkg --add-architecture 'arm64'",
    "apt-get update && apt-get install --assume-yes perl make 'libcurl4-openssl-dev:arm64' cmake software-properties-common wget gnupg unzip",
    "multiarch=$(dpkg-architecture -a 'arm64' -qDEB_HOST_MULTIARCH) && ln -sfn -- \"/usr/include/${multiarch}/curl\" \"/usr/${multiarch}/include/curl\"",
    "wget -qO /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip && echo 'ed8fca87a11c888fed329d6a59c34c7d436165f662a2c875246ddb1ac2b6dd50  /tmp/protoc.zip' | sha256sum --check --strict - && unzip -o /tmp/protoc.zip -d /usr/local bin/protoc && chmod +x /usr/local/bin/protoc && rm /tmp/protoc.zip",
    "apt-get install --assume-yes 'clang-6.0=1:6.0-1ubuntu2~16.04.1' 'libclang-6.0-dev=1:6.0-1ubuntu2~16.04.1'"
]

[target.aarch64-unknown-linux-gnu.env]
# The cross-rs container lacks sccache, mold, standalone `clang`, and a
# gcc new enough to understand `-fuse-ld=`. We use three forms of override
# (one per kind of cargo setting) to make `.cargo/config.toml` agnostic:
#
# 1. `RUSTC_WRAPPER=` (empty) — cargo reliably treats empty as "no wrapper",
#    cleanly clearing `[build] rustc-wrapper`. Same for CARGO_BUILD_RUSTC_WRAPPER.
#
# 2. `RUSTFLAGS=` (empty) — per cargo docs, when RUSTFLAGS is set (even to
#    empty), cargo skips `[target.<triple>] rustflags` entirely. This is
#    the only env-var form that REPLACES (rather than merges with) target-
#    specific rustflags. CARGO_TARGET_<TRIPLE>_RUSTFLAGS merges, which is
#    why an earlier fix using it left `-fuse-ld=mold` still on the linker
#    cmdline.
#
# 3. `CARGO_TARGET_<TRIPLE>_LINKER=<real binary>` — cargo doesn't honor
#    empty values for the LINKER key, so we point each to a real binary
#    that exists in the container:
#      - x86_64-linux-gnu (host, used for build scripts/proc-macros): `cc`
#        (gcc symlink, always present on Debian/Ubuntu).
#      - aarch64-linux-gnu (cross target): `aarch64-linux-gnu-gcc`
#        (the cross toolchain shipped in the container).
passthrough = [
    "LIBCLANG_PATH=/usr/lib/llvm-6.0/lib",
    "RUSTC_WRAPPER=",
    "CARGO_BUILD_RUSTC_WRAPPER=",
    "RUSTFLAGS=",
    "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=cc",
    "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc",
    "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc",
    "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++",
    "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar",
]
