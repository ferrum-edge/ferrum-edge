---
# Ferrum Edge comparison benchmark configuration
# Two proxies matching the same endpoints tested on Kong and Tyk

proxies:
  - id: "proxy-health"
    name: "Health Check Proxy"
    listen_path: "/health"
    backend_scheme: http
    backend_host: "BACKEND_HOST"
    backend_port: 3001
    strip_listen_path: false
    preserve_host_header: false
    backend_connect_timeout_ms: 1000
    backend_read_timeout_ms: 5000
    backend_write_timeout_ms: 5000
    backend_tls_verify_server_cert: true
    auth_mode: single
    plugins: []
  - id: "proxy-echo"
    name: "Echo API Proxy"
    listen_path: "/api/echo"
    backend_scheme: http
    backend_host: "BACKEND_HOST"
    backend_port: 3001
    strip_listen_path: false
    preserve_host_header: false
    backend_connect_timeout_ms: 1000
    backend_read_timeout_ms: 5000
    backend_write_timeout_ms: 5000
    backend_tls_verify_server_cert: true
    auth_mode: single
    pool_idle_timeout_seconds: 180
    plugins: []
consumers: []
plugin_configs: []
version: "1"
expected_resource_counts:
  proxies: 2
  consumers: 0
  upstreams: 0
  plugin_configs: 0
