---
# Ferrum Edge comparison benchmark configuration — end-to-end TLS
# Frontend: HTTPS (TLS termination) → Backend: HTTPS (re-encryption)
#
# backend_tls_verify_server_cert is false because the E2E TLS leg measures
# re-encryption overhead, not certificate verification, and every gateway in
# this benchmark skips backend verification the same way (Kong
# KONG_TLS_CERTIFICATE_VERIFY=off, Tyk ssl_insecure_skip_verify, KrakenD
# allow_insecure_connections, Envoy with no validation_context). The backend
# serves tests/certs/server.crt, a self-signed certificate marked CA:TRUE, which
# rustls/webpki rejects as an end-entity certificate (CaUsedAsEndEntity), so
# Ferrum could not verify it even with that file as its CA.

proxies:
  - id: "proxy-health"
    name: "Health Check Proxy (E2E TLS)"
    listen_path: "/health"
    backend_scheme: https
    backend_host: "BACKEND_HOST"
    backend_port: 3443
    strip_listen_path: false
    preserve_host_header: false
    backend_connect_timeout_ms: 1000
    backend_read_timeout_ms: 5000
    backend_write_timeout_ms: 5000
    backend_tls_verify_server_cert: false
    auth_mode: single
    plugins: []

  - id: "proxy-echo"
    name: "Echo API Proxy (E2E TLS)"
    listen_path: "/api/echo"
    backend_scheme: https
    backend_host: "BACKEND_HOST"
    backend_port: 3443
    strip_listen_path: false
    preserve_host_header: false
    backend_connect_timeout_ms: 1000
    backend_read_timeout_ms: 5000
    backend_write_timeout_ms: 5000
    backend_tls_verify_server_cert: false
    auth_mode: single
    pool_idle_timeout_seconds: 180
    plugins: []

consumers: []

plugin_configs: []
