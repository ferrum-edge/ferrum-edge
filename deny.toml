# cargo-deny configuration — dependency security & supply-chain gate.
#
# This is the enforcement half of Ferrum Edge's dependency-patch governance.
# The documentation half lives in docs/dependency-policy.md (vendored-crate
# inventory, owners, retirement triggers, emergency-update process).
#
# Run locally:
#   cargo install --locked cargo-deny
#   cargo deny check advisories bans sources licenses   # the blocking gate (see CI)
#
# CI runs `cargo deny check advisories bans sources licenses` on every PR that
# touches a dependency surface (Cargo.toml/Cargo.lock/deny.toml/vendor/**) and on
# a weekly schedule (.github/workflows/dependency-audit.yml). The advisories and
# licenses checks are BLOCKING: a new RUSTSEC advisory that is not explicitly
# ignored below fails CI, and any dependency whose SPDX expression is outside the
# allowlist (or below the confidence threshold) fails CI.
#
# Every [advisories.ignore] entry MUST carry a rationale and an
# `[expires:YYYY-MM-DD]` token. scripts/check_advisory_expiry.sh (run by the
# scheduled workflow) fails once an expiry date passes, forcing re-review so an
# exception can never become permanent silently.

[graph]
# Evaluate the full dependency graph including all optional features, so
# feature-gated backends (cloud secret providers, MySQL, MongoDB, GeoIP) are
# audited even though `default = []`.
all-features = true

[advisories]
version = 2
# Reject crates whose current version has been yanked from the registry.
yanked = "deny"
# Audit the FULL graph, not just direct workspace members. In cargo-deny 0.19
# these default to "workspace", which — even with [graph].all-features — would
# let a transitive unmaintained/unsound advisory pass silently. "all" makes them
# blocking everywhere, matching the intent of the exceptions enumerated below.
unmaintained = "all"
unsound = "all"
# Fail if an ignore no longer matches any advisory in the current graph, so a
# fixed/removed vulnerable crate forces deletion of its now-stale exception
# (default is "warn"). Otherwise a stale ignore could linger and silently
# re-suppress the same RUSTSEC id if a later dependency reintroduces it.
unused-ignored-advisory = "deny"
# Everything not listed here is denied (vulnerabilities, unmaintained, unsound,
# and notices alike, under advisories schema v2). Each exception is time-boxed.
#
# Last re-evaluated 2026-09-24 (issue #5721). Retired in that pass because an
# upstream fix became reachable (see docs/dependency-policy.md, "Advisory
# exception register"):
#   - RUSTSEC-2026-0118 / RUSTSEC-2026-0119 (hickory-proto 0.25.2): mongodb 3.7
#     moved its SRV resolver to hickory 0.26; Cargo.toml now requires >= 3.7
#     (the lockfile resolves 3.9.1).
#   - RUSTSEC-2026-0098 / -0099 / -0104 (rustls-webpki 0.101.7) and
#     RUSTSEC-2026-0258 (h2 0.3.27): all came from the AWS SDK's legacy
#     `rustls` feature (hyper 0.14 / rustls 0.21 connector), which
#     aws-sdk-secretsmanager now disables; the SDK uses its hyper 1.x
#     `default-https-client` instead.
#   - RUSTSEC-2025-0134 (rustls-pemfile, unmaintained): PEM parsing moved to
#     the rustls-pki-types `PemObject` API and the dependency was dropped.
ignore = [
    # ── rsa 0.9.10 — RUSTSEC-2023-0071, the Marvin timing side-channel in
    # private-key operations. There is still no fixed release: RustSec lists
    # `patched = []`; rsa 0.9.10 is the latest stable and 0.10.0-rc.18 (the
    # latest pre-release, already required by sqlx 0.9.0) is still affected
    # (checked 2026-09-24). Two parents reach it:
    #   - sqlx-mysql 0.8.6 uses only `RsaPublicKey` OAEP *encryption* of the
    #     password for MySQL `sha256_password` / `caching_sha2_password` over a
    #     non-TLS link. That is a public-key operation, so the timing leak is not
    #     reachable there, and FERRUM_DB_TLS_MODE avoids the exchange entirely.
    #   - jsonwebtoken 10's `rust_crypto` backend, selected by the default
    #     `crypto-ring` profile (`fips` selects `aws_lc_rs` instead). RS*/PS*
    #     verification is a public-key operation, but RSA *signing* of outbound
    #     client assertions (`private_key_jwt` in oidc_relying_party and
    #     oauth2_introspection, ai_federation service-account JWTs) runs on the
    #     non-constant-time implementation. EC/EdDSA assertion keys or the
    #     `fips` profile avoid it.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 Marvin timing side-channel; no fixed release (patched = [], 0.9.10 latest stable, 0.10.0-rc.18 still affected, checked 2026-09-24). sqlx-mysql does public-key encryption only; jsonwebtoken rust_crypto (crypto-ring profile) signs RSA client assertions, avoided with EC/EdDSA keys or the fips profile. Re-evaluate on an rsa fix. [expires:2026-12-31]" },

    # ── paste 1.0.15 — RUSTSEC-2024-0436, unmaintained (repository archived).
    # A proc-macro only: it runs at compile time and has no runtime or network
    # surface. Parents: tikv-jemalloc-ctl (0.6.1, and still `paste ^1` in the
    # latest 0.7.0, checked 2026-09-24) and our own test matrix macro
    # (tests/scaffolding/matrix.rs, dev-dependency). Dropping our dev-dependency
    # alone would not remove the crate while tikv-jemalloc-ctl keeps it.
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained; proc-macro only (tikv-jemalloc-ctl, still paste ^1 in 0.7.0 as of 2026-09-24, plus the test matrix dev-dependency), no runtime or network surface. Re-evaluate when tikv-jemalloc-ctl drops paste. [expires:2026-12-31]" },
]

[bans]
# The repo intentionally carries duplicate major versions during build-out
# (for example tungstenite 0.28+0.29 and the RustCrypto digest 0.10/0.11 lines).
# Surface them as warnings for visibility without blocking PRs.
#
# FIPS profile (issue #3510): `--no-default-features --features fips` adds
# `aws-lc-fips-sys` (the FIPS build of AWS-LC) alongside the ordinary
# `aws-lc-sys`. Both sys crates may be compiled — `dimpl` and rustls's own
# aws_lc_rs arm request `aws-lc-sys` unconditionally — but `aws-lc-rs` binds
# `aws-lc-fips-sys` whenever its `fips` feature is on, so only the validated
# module is reachable through the API. That is the upstream-supported shape;
# `.github/scripts/check_fips_feature_policy.py` is what asserts it rather than
# assuming it. Both crates come from crates.io, so the `[sources]` gate below
# covers them unchanged. The committed `Cargo.lock` pins BOTH profiles,
# including `aws-lc-fips-sys`, so every FIPS resolve and build runs `--locked`
# (see docs/dependency-policy.md → "FIPS build profile"). A lockfile entry does
# not compile or link that package into an ordinary artifact; feature selection
# still controls the build.
multiple-versions = "warn"
# Block `*` registry version requirements (an unpinned-dependency supply-chain
# risk). The only wildcard in the tree is the in-repo workspace path dep
# `ferrum-ebpf-common = { path = "ebpf/..." }`. `allow-wildcard-paths` exempts
# path deps of *private* crates, and the workspace crate is marked
# `publish = false` in Cargo.toml so that exemption applies to it.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Crates must come from crates.io. Vendored patches are local path deps under
# [patch.crates-io] and are exempt (no registry/git source).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
# Part of the blocking CI gate (see header). Every `[licenses.exceptions]` entry
# MUST carry an owner, a rationale, and an `[expires:YYYY-MM-DD]` token, and
# `scripts/check_advisory_expiry.sh` ENFORCES that on the per-PR
# `dependency-audit` job and the weekly workflow alike: a missing token or a
# passed date fails the run, exactly as for `[advisories.ignore]`.
#
# Token placement differs from advisories because the schema does. cargo-deny
# 0.19.9 rejects any key inside an exceptions entry other than the crate spec
# plus `allow` (`error[unexpected-keys] ... expected: ["allow"]`), so there is no
# `reason` field to hold the rationale. Put it in a `#` comment immediately
# preceding the entry (a trailing comment on the entry line also works):
#
#     exceptions = [
#         # owner: <name> — <rationale> [expires:YYYY-MM-DD]
#         { crate = "some-crate", allow = ["Some-License-1.0"] },
#     ]
#
# The comment binds to ONE entry: the next entry needs its own token.
version = 2
# The workspace crate itself is PolyForm-Noncommercial (non-SPDX-OSI); skip
# evaluating first-party member licenses.
private = { ignore = true }
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "BSL-1.0",
    # MIT No Attribution: MIT without the attribution clause, so strictly more
    # permissive than the "MIT" already allowed above. OSI approved.
    # Reached through borrow-or-share -> fluent-uri -> referencing.
    "MIT-0",
    # Community Data License Agreement Permissive 2.0. The license Mozilla's CA
    # root store data ships under; it is a permissive DATA license with no
    # copyleft and no attribution requirement, and it reaches us only as the
    # baked-in root certificates in webpki-roots / webpki-root-certs.
    "CDLA-Permissive-2.0",
]
