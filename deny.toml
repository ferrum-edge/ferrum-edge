# cargo-deny configuration — dependency security & supply-chain gate.
#
# This is the enforcement half of Ferrum Edge's dependency-patch governance.
# The documentation half lives in docs/dependency-policy.md (vendored-crate
# inventory, owners, retirement triggers, emergency-update process).
#
# Run locally:
#   cargo install --locked cargo-deny
#   cargo deny check advisories bans sources licenses   # the blocking gate (see CI)
#
# CI runs `cargo deny check advisories bans sources licenses` on every PR that
# touches a dependency surface (Cargo.toml/Cargo.lock/deny.toml/vendor/**) and on
# a weekly schedule (.github/workflows/dependency-audit.yml). The advisories and
# licenses checks are BLOCKING: a new RUSTSEC advisory that is not explicitly
# ignored below fails CI, and any dependency whose SPDX expression is outside the
# allowlist (or below the confidence threshold) fails CI.
#
# Every [advisories.ignore] entry MUST carry a rationale and an
# `[expires:YYYY-MM-DD]` token. scripts/check_advisory_expiry.sh (run by the
# scheduled workflow) fails once an expiry date passes, forcing re-review so an
# exception can never become permanent silently.

[graph]
# Evaluate the full dependency graph including all optional features, so
# feature-gated backends (cloud secret providers, MySQL, MongoDB, GeoIP) are
# audited even though `default = []`.
all-features = true

[advisories]
version = 2
# Reject crates whose current version has been yanked from the registry.
yanked = "deny"
# Audit the FULL graph, not just direct workspace members. In cargo-deny 0.19
# these default to "workspace", which — even with [graph].all-features — would
# let a transitive unmaintained/unsound advisory pass silently. "all" makes them
# blocking everywhere, matching the intent of the exceptions enumerated below.
unmaintained = "all"
unsound = "all"
# Fail if an ignore no longer matches any advisory in the current graph, so a
# fixed/removed vulnerable crate forces deletion of its now-stale exception
# (default is "warn"). Otherwise a stale ignore could linger and silently
# re-suppress the same RUSTSEC id if a later dependency reintroduces it.
unused-ignored-advisory = "deny"
# Everything not listed here is denied (vulnerabilities, unmaintained, unsound,
# and notices alike, under advisories schema v2). Each exception is time-boxed.
ignore = [
    # ── hickory-proto 0.25.2 — pulled ONLY by mongodb 3.6.0 (its internal SRV
    # resolver). The gateway's own DNS path uses hickory-resolver 0.26.1, which
    # is already patched. mongodb 3.6 pins hickory `^0.25`, so we cannot bump
    # the transitive copy without mongodb relaxing its requirement.
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.25.2 O(n^2) name-compression DoS; confined to the mongodb driver's SRV resolver (gateway DNS uses 0.26.1); mongodb 3.6 pins ^0.25. Tracking mongodb release. [expires:2026-09-30]" },
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25.2 NSEC3 unbounded loop; no upstream fix available; confined to the mongodb driver's resolver, not the proxy/gateway DNS path. Re-evaluate quarterly / on mongodb bump. [expires:2026-09-30]" },

    # ── rsa 0.9.10 — pulled ONLY by sqlx-mysql. The Marvin timing side-channel
    # affects RSA key-exchange used by MySQL's sha2 public-key auth fallback.
    # No fixed release exists upstream. Mitigation: use FERRUM_DB_TLS_MODE so
    # the MySQL handshake does not fall back to RSA-encrypted password exchange;
    # only relevant when the MySQL config backend is in use.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 Marvin timing side-channel via sqlx-mysql; no upstream fix; only on the optional MySQL config-DB path; mitigated by DB TLS. Re-evaluate on rsa/sqlx fix. [expires:2026-09-30]" },

    # ── rustls-webpki 0.101.7 — pulled ONLY by the AWS SDK chain (hyper-rustls
    # 0.24.2 / rustls 0.21), which is gated behind the optional `secrets-aws`
    # feature (NOT in default builds). The gateway's own TLS stack uses
    # rustls 0.23 + rustls-webpki 0.103. The AWS chain pins webpki `^0.101.7`,
    # so the fix (>=0.103.x) is unreachable until aws-sdk-rust moves off
    # rustls 0.21.
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101.7 CRL-parse panic via AWS SDK (rustls 0.21) behind optional `secrets-aws`; gateway TLS uses webpki 0.103; aws chain pins ^0.101.7. Tracking aws-sdk-rust. [expires:2026-09-30]" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101.7 name-constraint (URI) bypass via AWS SDK behind optional `secrets-aws`; gateway TLS uses webpki 0.103. Tracking aws-sdk-rust off rustls 0.21. [expires:2026-09-30]" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101.7 name-constraint (wildcard) bypass via AWS SDK behind optional `secrets-aws`; gateway TLS uses webpki 0.103. Tracking aws-sdk-rust off rustls 0.21. [expires:2026-09-30]" },

    # ── h2 0.3.27 — pulled ONLY by the AWS SDK chain (aws-smithy-http-client
    # -> aws-smithy-runtime -> aws-config / aws-runtime / aws-sdk-*), gated
    # behind the optional `secrets-aws` feature (NOT in default builds). That
    # path is OUTBOUND to AWS endpoints (Secrets Manager / STS); it never
    # serves untrusted peers, so the empty-DATA-frame flood is not reachable
    # there. The advisory has no fix on the 0.3.x line (>=0.4.16 only), and
    # aws-smithy-http-client still declares an optional `h2 ^0.3.24` for its
    # legacy hyper-0.14 arm as of 1.3.0, so the transitive copy cannot be
    # dropped by bumping. The gateway's OWN HTTP/2 data path (h2 0.4.x, used by
    # Http2ConnectionPool / GrpcConnectionPool / H2 termination) is patched to
    # 0.4.16 in Cargo.lock — that is the attacker-facing exposure and it is
    # fixed, not ignored.
    #
    # WARNING: cargo-deny ignores are keyed by advisory ID only, NOT by version.
    # This entry therefore also suppresses RUSTSEC-2026-0258 if h2 0.4.x is ever
    # regressed below 0.4.16, and `unused-ignored-advisory = "deny"` will NOT
    # catch that because the 0.3.27 copy keeps the ignore "used". Delete this
    # entry the moment the AWS chain drops h2 0.3.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 unbounded empty DATA frames via the AWS SDK legacy hyper-0.14 arm behind optional `secrets-aws`; outbound-to-AWS only, never serving untrusted peers; no 0.3.x fix exists. The gateway's own h2 0.4.x data path is PATCHED to >=0.4.16, not ignored. Tracking aws-sdk-rust dropping h2 0.3. [expires:2026-09-30]" },

    # ── Unmaintained / unsound (advisory schema v2 treats these as deny too).
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained; proc-macro only (tikv-jemalloc-ctl + dev-deps), no runtime/security surface. Replace if a successor stabilizes. [expires:2026-09-30]" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 unmaintained; functional PEM parser at config load. Migrate to rustls-pki-types pemfile helpers. [expires:2026-09-30]" },
]

[bans]
# The repo intentionally carries duplicate major versions during build-out
# (rustls 0.21+0.23, hyper 0.14+1.x, hickory 0.25+0.26, tungstenite 0.28+0.29).
# Surface them as warnings for visibility without blocking PRs.
#
# FIPS profile (issue #3510): `--no-default-features --features fips` adds
# `aws-lc-fips-sys` (the FIPS build of AWS-LC) alongside the ordinary
# `aws-lc-sys`. Both sys crates may be compiled — `dimpl` and rustls's own
# aws_lc_rs arm request `aws-lc-sys` unconditionally — but `aws-lc-rs` binds
# `aws-lc-fips-sys` whenever its `fips` feature is on, so only the validated
# module is reachable through the API. That is the upstream-supported shape;
# `.github/scripts/check_fips_feature_policy.py` is what asserts it rather than
# assuming it. Both crates come from crates.io, so the `[sources]` gate below
# covers them unchanged. The committed `Cargo.lock` pins BOTH profiles,
# including `aws-lc-fips-sys`, so every FIPS resolve and build runs `--locked`
# (see docs/dependency-policy.md → "FIPS build profile"). A lockfile entry does
# not compile or link that package into an ordinary artifact; feature selection
# still controls the build.
multiple-versions = "warn"
# Block `*` registry version requirements (an unpinned-dependency supply-chain
# risk). The only wildcard in the tree is the in-repo workspace path dep
# `ferrum-ebpf-common = { path = "ebpf/..." }`. `allow-wildcard-paths` exempts
# path deps of *private* crates, and the workspace crate is marked
# `publish = false` in Cargo.toml so that exemption applies to it.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Crates must come from crates.io. Vendored patches are local path deps under
# [patch.crates-io] and are exempt (no registry/git source).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
# Part of the blocking CI gate (see header). Every `[licenses.exceptions]` entry
# MUST carry an owner, a rationale, and an `[expires:YYYY-MM-DD]` token in the
# same style as `[advisories.ignore]`. scripts/check_advisory_expiry.sh does not
# yet enforce license-exception expiry — track that as a follow-up.
version = 2
# The workspace crate itself is PolyForm-Noncommercial (non-SPDX-OSI); skip
# evaluating first-party member licenses.
private = { ignore = true }
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "BSL-1.0",
    # MIT No Attribution: MIT without the attribution clause, so strictly more
    # permissive than the "MIT" already allowed above. OSI approved.
    # Reached through borrow-or-share -> fluent-uri -> referencing.
    "MIT-0",
    # Community Data License Agreement Permissive 2.0. The license Mozilla's CA
    # root store data ships under; it is a permissive DATA license with no
    # copyleft and no attribution requirement, and it reaches us only as the
    # baked-in root certificates in webpki-roots / webpki-root-certs.
    "CDLA-Permissive-2.0",
]
