# fe-agent-11- #4038 HOLD: scope=proxy + proxy_id, no proxies[].plugins association
version: "1"
proxies:
  - id: error-route
    name: fe-agent-11-error-route
    listen_path: /error
    backend_scheme: http
    backend_host: 127.0.0.1
