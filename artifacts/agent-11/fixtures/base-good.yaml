# fe-agent-11- baseline: valid file-mode config with an attached terminate plugin
version: "1"
proxies:
  - id: error-route
    name: fe-agent-11-error-route
    listen_path: /error
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 22002
    strip_listen_path: true
    auth_mode: none
    plugins:
      - plugin_config_id: terminate-error
consumers: []
plugin_configs:
  - id: terminate-error
    plugin_name: request_termination
    scope: proxy
    proxy_id: error-route
    enabled: true
    config:
      status_code: 418
      message: "fe-agent-11-attached"
    created_at: "2026-08-30T00:00:00Z"
    updated_at: "2026-08-30T00:00:00Z"
