version: "1"
proxies:
  - id: echo-route
    name: fe-agent-11-echo
    listen_path: /echo
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 22002
    strip_listen_path: true
    auth_mode: none
    plugins:
      - plugin_config_id: xf-late
      - plugin_config_id: xf-early
consumers: []
plugin_configs:
  - id: xf-late
    plugin_name: request_transformer
    scope: proxy
    proxy_id: echo-route
    enabled: true
    priority_override: 3010
    config:
      rules:
        - operation: add
          target: header
          key: x-fe-late
          value: "late"
    created_at: "2026-08-30T00:00:00Z"
    updated_at: "2026-08-30T00:00:00Z"
  - id: xf-early
    plugin_name: request_transformer
    scope: proxy
    proxy_id: echo-route
    enabled: true
    priority_override: 2990
    config:
      rules:
        - operation: add
          target: header
          key: x-fe-early
          value: "early"
    created_at: "2026-08-30T00:00:00Z"
    updated_at: "2026-08-30T00:00:00Z"
