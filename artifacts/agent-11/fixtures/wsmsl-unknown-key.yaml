version: "1"
proxies:
  - id: error-route
    name: fe-agent-11-error-route
    listen_path: /error
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 22002
    strip_listen_path: true
    auth_mode: none
    plugins:
      - plugin_config_id: wsmsl-typo
consumers: []
plugin_configs:
  - id: wsmsl-typo
    plugin_name: ws_message_size_limiting
    scope: proxy
    proxy_id: error-route
    enabled: true
    config:
      max_frame_bytes: 65536
      max_frame_bytez: 1
    created_at: "2026-08-30T00:00:00Z"
    updated_at: "2026-08-30T00:00:00Z"
