version: "1"
proxies:
  - id: error-route
    name: fe-agent-11-error-route
    listen_path: /error
    backend_scheme: http
    backend_host: 127.0.0.1
    backend_port: 22002
    strip_listen_path: true
    auth_mode: none
    plugins:
      - plugin_config_id: jwt-bad
consumers: []
plugin_configs:
  - id: jwt-bad
    plugin_name: jwt_auth
    scope: proxy
    proxy_id: error-route
    enabled: true
    config:
      typo_leeway: 30
    created_at: "2026-08-30T00:00:00Z"
    updated_at: "2026-08-30T00:00:00Z"
