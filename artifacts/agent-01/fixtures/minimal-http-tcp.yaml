# Minimal file-mode config: one HTTP route + one TCP stream route.
# Loopback-only. Ports are placeholders; the harness rewrites them.
version: "1"
proxies:
  - id: "http-echo"
    name: "HTTP Echo"
    listen_path: "/echo"
    backend_scheme: http
    backend_host: "127.0.0.1"
    backend_port: 21002
    strip_listen_path: true
    auth_mode: none

  - id: "tcp-echo"
    name: "TCP Echo"
    listen_port: 21003
    backend_scheme: tcp
    backend_host: "127.0.0.1"
    backend_port: 21004

consumers: []
plugin_configs: []
upstreams: []
