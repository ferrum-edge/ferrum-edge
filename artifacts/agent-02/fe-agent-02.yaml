    strip_listen_path: false
    backend_path: "/rid/exact"
    preserve_host_header: false
    backend_connect_timeout_ms: 2000
    backend_read_timeout_ms: 4000
    backend_write_timeout_ms: 4000
    auth_mode: single
    plugins: []

