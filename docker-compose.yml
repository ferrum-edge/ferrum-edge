version: '3.9'

# =============================================================================
# Admin API exposure (read before publishing the admin port)
# =============================================================================
# The admin API is a management plane and is SAFE BY DEFAULT: the gateway binds
# its admin listener to loopback (127.0.0.1) inside the container, so it is NOT
# reachable from the network and the plaintext admin HTTP port is intentionally
# NOT published below. The proxy data-plane ports (8000/8443) are published as
# usual.
#
# To serve admin over TLS (recommended), set FERRUM_ADMIN_TLS_CERT_PATH /
# FERRUM_ADMIN_TLS_KEY_PATH, publish the 9443 admin-HTTPS port, and set
# FERRUM_ADMIN_HTTP_PORT=0 to disable plaintext.
#
# For LOCAL-DEVELOPMENT host access to the plaintext admin API, add to a service:
#     environment:
#       FERRUM_ADMIN_BIND_ADDRESS: 0.0.0.0          # bind beyond container loopback
#       FERRUM_ALLOW_INSECURE_ADMIN_HTTP: "true"    # required in database/cp modes
#     ports:
#       - "127.0.0.1:9000:9000"                     # publish to host loopback only
# The gateway refuses to start a public plaintext admin listener in database/cp
# modes without this explicit opt-in. See docs/configuration.md (Admin API).
services:
  # ============================================================================
  # Single-Node Database Mode with SQLite
  # ============================================================================
  # This is the simplest setup - single gateway instance using SQLite
  # No CP/DP complexity, no external database required
  ferrum-sqlite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ferrum-sqlite
    command: ["run"]
    ports:
      - "8000:8000"     # HTTP proxy
      - "8443:8443"     # HTTPS proxy
      - "9443:9443"     # Admin API HTTPS (set FERRUM_ADMIN_TLS_* to serve; admin is loopback-only by default)
    environment:
      FERRUM_MODE: database
      FERRUM_DB_TYPE: sqlite
      FERRUM_DB_URL: sqlite:////data/ferrum.db?mode=rwc
      FERRUM_ADMIN_JWT_SECRET: ${FERRUM_ADMIN_JWT_SECRET:?Set FERRUM_ADMIN_JWT_SECRET to a strong secret}
      FERRUM_LOG_LEVEL: info
    volumes:
      - ferrum_data:/data
    networks:
      - ferrum-network
    healthcheck:
      test: ["CMD", "/app/ferrum-edge", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ============================================================================
  # PostgreSQL Database (for use with database mode)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ferrum-postgres-db
    environment:
      POSTGRES_DB: ferrum
      POSTGRES_USER: ferrum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ferrum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrum -d ferrum"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Single-Node Database Mode with PostgreSQL
  # ============================================================================
  # Production-ready setup with external PostgreSQL database
  ferrum-postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ferrum-postgres
    command: ["run"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"     # HTTP proxy
      - "8444:8443"     # HTTPS proxy
      - "9444:9443"     # Admin API HTTPS (set FERRUM_ADMIN_TLS_* to serve; admin is loopback-only by default)
    environment:
      FERRUM_MODE: database
      FERRUM_DB_TYPE: postgres
      FERRUM_DB_URL: postgres://ferrum:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong secret}@postgres:5432/ferrum
      FERRUM_ADMIN_JWT_SECRET: ${FERRUM_ADMIN_JWT_SECRET:?Set FERRUM_ADMIN_JWT_SECRET to a strong secret}
      FERRUM_LOG_LEVEL: info
      FERRUM_DB_POLL_INTERVAL: 30
      # FERRUM_DB_FAILOVER_URLS: postgres://ferrum:${POSTGRES_PASSWORD}@postgres-standby:5432/ferrum
      # FERRUM_DB_READ_REPLICA_URL: postgres://ferrum:${POSTGRES_PASSWORD}@postgres-replica:5432/ferrum
    networks:
      - ferrum-network
    healthcheck:
      test: ["CMD", "/app/ferrum-edge", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - postgres

  # ============================================================================
  # MongoDB Database (for use with database mode)
  # ============================================================================
  # Requires building with: cargo build --features mongodb
  mongodb:
    image: mongo:7-jammy
    container_name: ferrum-mongodb-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ferrum
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-dev-password-change-in-production}
      MONGO_INITDB_DATABASE: ferrum
    volumes:
      - mongodb_data:/data/db
    networks:
      - ferrum-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Single-Node Database Mode with MongoDB
  # ============================================================================
  ferrum-mongodb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ferrum-mongodb
    command: ["run"]
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8002:8000"     # HTTP proxy
      - "8445:8443"     # HTTPS proxy
      - "9445:9443"     # Admin API HTTPS (set FERRUM_ADMIN_TLS_* to serve; admin is loopback-only by default)
    environment:
      FERRUM_MODE: database
      FERRUM_DB_TYPE: mongodb
      FERRUM_DB_URL: mongodb://ferrum:${MONGO_PASSWORD:-dev-password-change-in-production}@mongodb:27017/?authSource=admin
      FERRUM_MONGO_DATABASE: ferrum
      FERRUM_ADMIN_JWT_SECRET: ${FERRUM_ADMIN_JWT_SECRET:?Set FERRUM_ADMIN_JWT_SECRET to a strong secret}
      FERRUM_LOG_LEVEL: info
      FERRUM_DB_POLL_INTERVAL: 30
    networks:
      - ferrum-network
    healthcheck:
      test: ["CMD", "/app/ferrum-edge", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - mongodb

  # ============================================================================
  # Control Plane Mode
  # ============================================================================
  # Centralized configuration authority for distributed deployments
  # Reads from database, serves Admin API, pushes config to Data Plane nodes
  ferrum-cp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ferrum-cp
    command: ["run"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9445:9443"     # Admin API HTTPS (set FERRUM_ADMIN_TLS_* to serve; admin is loopback-only by default)
      - "50051:50051"   # gRPC config distribution
    environment:
      FERRUM_MODE: cp
      FERRUM_DB_TYPE: postgres
      FERRUM_DB_URL: postgres://ferrum:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong secret}@postgres:5432/ferrum
      FERRUM_ADMIN_JWT_SECRET: ${FERRUM_ADMIN_JWT_SECRET:?Set FERRUM_ADMIN_JWT_SECRET to a strong secret}
      FERRUM_CP_GRPC_LISTEN_ADDR: 0.0.0.0:50051
      FERRUM_CP_DP_GRPC_JWT_SECRET: ${FERRUM_CP_DP_GRPC_JWT_SECRET:?Set FERRUM_CP_DP_GRPC_JWT_SECRET to a strong secret}
      FERRUM_LOG_LEVEL: info
    networks:
      - ferrum-network
    healthcheck:
      test: ["CMD", "/app/ferrum-edge", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - cp-dp

  # ============================================================================
  # Data Plane Mode (Node 1)
  # ============================================================================
  # Handles proxy traffic only, receives config from Control Plane
  # No database access or Admin API modifications
  ferrum-dp-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ferrum-dp-1
    command: ["run"]
    depends_on:
      - ferrum-cp
    ports:
      - "8002:8000"     # HTTP proxy
      - "8445:8443"     # HTTPS proxy
      # Read-only admin API binds to loopback by default and is not published.
    environment:
      FERRUM_MODE: dp
      FERRUM_DP_CP_GRPC_URLS: http://ferrum-cp:50051
      FERRUM_CP_DP_GRPC_JWT_SECRET: ${FERRUM_CP_DP_GRPC_JWT_SECRET:?Set FERRUM_CP_DP_GRPC_JWT_SECRET to a strong secret}
      FERRUM_LOG_LEVEL: info
    networks:
      - ferrum-network
    healthcheck:
      test: ["CMD", "/app/ferrum-edge", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - cp-dp

  # ============================================================================
  # Data Plane Mode (Node 2)
  # ============================================================================
  # Additional DP node for horizontal scaling
  ferrum-dp-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ferrum-dp-2
    command: ["run"]
    depends_on:
      - ferrum-cp
    ports:
      - "8003:8000"     # HTTP proxy
      - "8446:8443"     # HTTPS proxy
      # Read-only admin API binds to loopback by default and is not published.
    environment:
      FERRUM_MODE: dp
      FERRUM_DP_CP_GRPC_URLS: http://ferrum-cp:50051
      FERRUM_CP_DP_GRPC_JWT_SECRET: ${FERRUM_CP_DP_GRPC_JWT_SECRET:?Set FERRUM_CP_DP_GRPC_JWT_SECRET to a strong secret}
      FERRUM_LOG_LEVEL: info
    networks:
      - ferrum-network
    healthcheck:
      test: ["CMD", "/app/ferrum-edge", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - cp-dp

networks:
  ferrum-network:
    driver: bridge

volumes:
  ferrum_data:
  postgres_data:
  mongodb_data:
