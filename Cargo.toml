[package]
name = "ferrum-edge"
version = "0.9.3"
edition = "2024"
description = "A high-performance edge proxy built in Rust"
license = "PolyForm-Noncommercial-1.0.0"
# Not published to crates.io: this is a noncommercial gateway binary shipped as
# release artifacts / container images, not a library. Marking it private also
# lets cargo-deny's `allow-wildcard-paths` exempt the internal
# `ferrum-ebpf-common` path dependency (see deny.toml [bans]).
publish = false

# The vendored h3 crate lives at `vendor/h3-0.0.8-ferrum-patched/` and is
# patched in via `[patch.crates-io]` below. Cargo treats vendored deps under
# `[patch.crates-io]` as fully built, but `cargo test -p h3 --lib frame` does
# not run their tests because they aren't workspace members. The patch's
# regression coverage is the two new unit tests in
# `vendor/h3-0.0.8-ferrum-patched/src/frame.rs::tests`
# (`poll_next_drains_buffered_headers_before_quic_close` and
# `poll_data_drains_buffered_body_before_quic_close`); to run them locally,
# invoke `cargo test --manifest-path vendor/h3-0.0.8-ferrum-patched/Cargo.toml --lib frame`.
# The same tests are part of hyperium/h3#339 and run on the upstream PR's CI.
#
# The vendored tungstenite/tokio-tungstenite crates live at
# `vendor/tungstenite-0.29.0-ferrum-patched/` and
# `vendor/tokio-tungstenite-0.29.0-ferrum-patched/`. They backport
# snapview/tungstenite-rs#556 and snapview/tokio-tungstenite#380 so the
# WebSocket tunnel fast path can take over the raw backend stream without
# dropping bytes buffered during the 101 response parse. The tungstenite copy
# also retains a distinct pre-reservation frame-limit error origin; see the
# governed deliberate-fork record in docs/upstream-tungstenite-patches/. To run
# their tests directly:
# `cargo test --manifest-path vendor/tungstenite-0.29.0-ferrum-patched/Cargo.toml --lib into_inner_with_read_buffer`
# `cargo test --manifest-path vendor/tungstenite-0.29.0-ferrum-patched/Cargo.toml --lib size_limit_hit`
# and
# `cargo test --manifest-path vendor/tokio-tungstenite-0.29.0-ferrum-patched/Cargo.toml --config 'patch.crates-io.tungstenite.path="vendor/tungstenite-0.29.0-ferrum-patched"' --test into_inner_with_read_buffer`.

[[bin]]
name = "ferrum-edge"
path = "src/main.rs"

# Performance-only HBONE E2E fixture (issue #3332). Constructs the harness
# GatewayConfig in-process and feeds it to `file::serve` / `ProxyState` the
# same way mesh materialization does. This is not a production binary and
# not a general-purpose trusted config loader. `test = false` so `cargo test`
# does not execute this long-running process.
[[example]]
name = "hbone_perf_fixture"
path = "examples/hbone_perf_fixture.rs"
test = false
bench = false

# Functional tests for external secret-provider integrations. Lives in a
# subdirectory (not a single tests/*.rs file) so it can carry shared helper
# modules, which requires an explicit target declaration. Provider-specific
# modules are gated behind the matching `secrets-*` feature; run e.g.
# `cargo test --features secrets-vault --test secrets_functional vault_backend`.
[[test]]
name = "secrets_functional"
path = "tests/secrets_functional/mod.rs"

# Functional integration tests for external middleware that must be validated
# against the REAL third-party software (a service registry, a directory
# server, …), imitated locally with free OSS containers via `testcontainers`
# (Docker) — never a managed/cloud service. Lives in a subdirectory so it can
# carry shared container helpers. Container-backed tests self-skip when Docker
# is unavailable (graceful locally) and hard-fail in CI; see
# `tests/service_integration/`. Run e.g.
# `cargo test --test service_integration consul` (or `ldap` / `kafka` / `mysql` /
# `oidc` / `oauth2_introspection` / `clickhouse`).
[[test]]
name = "service_integration"
path = "tests/service_integration/mod.rs"

# The two Unix DNS hook cancellation tests need ACME but no unit-suite
# scaffolding. Keep this target out of default builds and avoid recompiling
# the monolithic unit_tests binary for optional-feature CI (issue #4669).
[[test]]
name = "acme_dns01_tests"
path = "tests/acme_dns01/mod.rs"
required-features = ["acme"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }

# HTTP
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
# ACME wraps hyper-rustls around Ferrum's policy-aware connector so the
# original hostname remains the SNI/certificate identity while only screened
# resolved addresses are dialed.
# The crypto backend is NOT selected here: it comes from the mutually exclusive
# `crypto-ring` / `fips` features below, so a nominal FIPS build cannot leave
# `hyper-rustls/ring` in control of ACME's TLS.
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "http2", "native-tokio", "tls12", "rustls-platform-verifier"], optional = true }
h2 = "0.4"
http-body = "1"
http-body-util = "0.1"
http = "1"

# TLS
#
# The cryptographic backend is selected exclusively by the mutually exclusive
# `crypto-ring` / `fips` cargo features (see `[features]`), never inline here.
# `sqlx-core`, `quinn-proto`, `tonic`, `ldap3`, and `hyper-rustls` each gate
# their aws-lc arm on the *absence* of their ring arm, so additively enabling
# aws-lc while a ring feature is still compiled leaves the non-validated
# implementation in charge while looking switched. Moving every provider
# selection onto the feature pair is what makes the switch real.
#
# `ring` and `aws-lc-rs` are the ring-API-compatible backends behind
# `crate::fips::backend` (randomness, HMAC, digests, signature verification).
# The direct rustls/tokio-rustls dependencies and reqwest deliberately select
# no provider here; the exclusive feature pair below supplies that provider.
ring = { version = "0.17", optional = true }
# `default-features = false` deliberately omits `aws-lc-sys`: the `fips` feature
# selects `aws-lc-fips-sys` instead, and `aws-lc-rs` binds whichever of the two
# is compiled with `fips` taking precedence. Other crates in the graph
# (dimpl, rustls's own aws_lc_rs arm) still request `aws-lc-sys`, so both sys
# crates may be *built*; only the FIPS one is *linked into the API surface*.
# See docs/fips.md §"What the module boundary is".
aws-lc-rs = { version = "1.16", default-features = false, features = ["alloc", "ring-io", "ring-sig-verify"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1.0"
zeroize = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
# `raw_value` lets JSON-RPC batch admission measure and retain each member's
# exact raw wire slice before it is materialized (see mcp_gateway batch caps).
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
# Direct pin of the libyaml event parser already used by serde_yaml so API-spec
# and file-backed config YAML can compose alias-preserving graphs and traverse
# them under explicit budgets without relying on serde_yaml's unbounded alias
# materialization (issue #3307 and PR #3843).
unsafe-libyaml = "0.2.11"
jsonschema = { version = "0.46.5", default-features = false }
roxmltree = "0.20"
memchr = "2"

# Database
# `runtime-tokio-rustls` is deliberately NOT used: it hard-wires
# `tls-rustls-ring`. The TLS arm comes from `crypto-ring` / `fips` instead.
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "mysql", "sqlite", "chrono", "json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# gRPC
# TLS arm (`tls-ring` / `tls-aws-lc`) comes from `crypto-ring` / `fips`.
tonic = { version = "0.14.6", features = ["tls-webpki-roots"] }
tonic-prost = "0.14.6"
prost = "0.14.3"
tower = { version = "0.5", features = ["util"] }

# JWT and auth
#
# The signing/verification backend (`rust_crypto` vs `aws_lc_rs`) comes from
# `crypto-ring` / `fips`. jsonwebtoken 10 prefers `aws_lc_rs` when both are
# compiled, but leaving `rust_crypto` on in a FIPS build would still link a
# second, non-validated implementation of the same primitives, so the arms are
# exclusive here too.
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem"] }
# NOTE: `argon2` was declared here and referenced by nothing in `src/` or
# `custom_plugins/`. Argon2 is not an SP 800-132 approved KDF, so an unused
# declaration was a non-approved primitive sitting in the dependency graph for
# no behavioural reason; it is removed rather than policy-gated (issue #3510).
# Ferrum's only stored-password representation is `hmac_sha256:<hex>`, an
# approved keyed MAC, computed through `crate::fips::approved`.

# LDAP — `tls-rustls-ring` selects rustls (matching the gateway's TLS stack)
# with the ring crypto provider, dropping the implicit native-tls/OpenSSL
# dependency. `default-features = false` is required because the default
# feature set pulls in `tls-native`, which is mutually exclusive with
# `tls-rustls`. `sync` is re-enabled for parity with the previous default.
# Migrating to rustls makes CA exclusivity (CLAUDE.md "TLS Architecture")
# enforceable for LDAP TLS — `RootCertStore::empty()` + custom CA replaces
# the system trust pool wholesale, which native-tls's `add_root_certificate`
# could not do.
# The rustls provider arm (`tls-rustls-ring` / `tls-rustls-aws-lc-rs`) comes
# from `crypto-ring` / `fips`.
ldap3 = { version = "0.12", default-features = false, features = ["sync"] }

# WebSocket
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# HTTP/3 / QUIC
# `default-features = false` drops quinn's default `rustls-ring` arm. QUIC
# initial keys, packet protection, and the TLS 1.3 handshake all run in
# whichever provider quinn-proto compiles, so leaving the default on would put
# ring in control of every HTTP/3 byte in a nominal FIPS build. The remaining
# default features (`log`, `platform-verifier`, `runtime-tokio`, `bloom`) are
# re-enabled explicitly; the provider arm comes from `crypto-ring` / `fips`.
quinn = { version = "0.11.9", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "bloom"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"

# Time/date
chrono = { version = "0.4", features = ["serde"] }
httpdate = "1"

# Other utilities
regex = "1"
semver = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
ahash = "0.8"
arc-swap = "1"
# HNSW vector index used by the optional ai_semantic_cache semantic-similarity path.
instant-distance = "0.6.1"
# CachePadded for hot-path atomics in OverloadState. Already transitive via
# tokio/dashmap; the explicit pin makes the surface intentional.
crossbeam-utils = "0.8"
# Lock-free bounded MPMC ring (ArrayQueue) backing the router-cache eviction
# sample reservoir. Already transitive via sqlx-core; the explicit pin makes the
# surface intentional.
crossbeam-queue = "0.3"
bytes = "1"
thiserror = "2"
anyhow = "1"
tempfile = "3"
async-trait = "0.1"
pin-project-lite = "0.2"
# `default-features = false` drops `system-proxy` from the default set —
# we are a server-side gateway making outbound backend calls, so honouring
# `HTTP_PROXY` / `HTTPS_PROXY` env vars from the operator's shell is almost
# never the intent (and a misconfigured env var would silently route
# backend traffic through an unintended hop). Everything else from the
# pre-0.13 default set is re-enabled explicitly. `rustls-no-provider` is
# load-bearing: `crypto-ring` / `fips`, not reqwest, selects the provider.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider", "stream", "http2", "charset"] }
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"] }
base64 = "0.22"
# AWS event-stream prelude/message CRC32 (ITU-T V.42). Already transitive via
# flate2; the explicit dependency makes the Bedrock integrity check intentional.
crc32fast = "1"
url = "2"
# Mozilla Public Suffix List for browser-equivalent Set-Cookie Domain handling.
psl = "2"
percent-encoding = "2"
socket2 = { version = "0.6.3", features = ["all"] }
tokio-util = { version = "0.7.18", default-features = false }
prost-reflect = "0.16"
brotli = "8"
flate2 = "1"
zstd = "0.13"

# CLI
clap = { version = "4", features = ["derive"] }

# Crypto
hex = "0.4"
# `verify` enables PKCS#10 CSR / X.509 signature verification (proof-of-possession
# in the internal CA CSR issuance path). Backed by the same `ring` provider already
# in the dependency tree.
# The verification arm (`verify` = ring, `verify-aws` = aws-lc-rs) comes from
# `crypto-ring` / `fips`; both gate the same public API.
x509-parser = { version = "0.18" }
# Used by the mesh identity subsystem to issue X.509 SVIDs (URI-SAN-aware).
# Pinned to the same `ring` crypto provider already used by rustls so we do
# not pull in a second crypto stack. Kept as a normal dep (not dev-dep) because
# `src/identity/ca/internal.rs` and the bootstrap helper need it at runtime.
# Enable `x509-parser` so `Issuer::from_ca_cert_pem` is available, and `pem`
# for PEM input/output paths.
# `default-features = false` drops rcgen's default `ring` arm; the crypto arm
# (`ring` / `fips`) comes from `crypto-ring` / `fips`. `crypto` is re-enabled
# explicitly because it is what exposes key generation and signing at all.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "x509-parser", "pem"] }
# Glob-style pattern matching for mesh policy SPIFFE-ID / namespace matchers
# (`spiffe://prod/ns/foo/sa/*`). Already in the dep tree transitively; pinning
# here for visibility.
glob = "0.3"

# Kubernetes controller (Layer 8) — async K8s client with watch/informer/reflector
# support. Used by the CRD reconciliation loop in CP mode when
# FERRUM_K8S_CONTROLLER_ENABLED=true.
# kube's default feature set hard-selects `ring` for its hyper-rustls client.
# Keep the transport/provider-neutral surface here; the mutually exclusive
# backend features below choose kube-client's provider together with Ferrum's.
kube = { version = "3.1", default-features = false, features = ["runtime", "client", "derive", "ws", "rustls-tls"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
# Used by `rcgen::CertificateParams::not_before` / `not_after` (rcgen's
# choice — it needs `time::OffsetDateTime`). Already in `[dev-dependencies]`
# for testing; promoting to a regular dep so the mesh CA can reference it.
time = "0.3"

# Secrets management (optional cloud backends — gate via cargo features)
# Crypto arm (`ring` / `fips`) comes from `crypto-ring` / `fips`.
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "rcgen", "time", "x509-parser"], optional = true }
cryptoki = { version = "0.12", optional = true }
vaultrs = { version = "0.8", optional = true }
aws-config = { version = "1.8", features = ["behavior-version-latest"], optional = true }
aws-sdk-secretsmanager = { version = "1", optional = true }
google-cloud-secretmanager-v1 = { version = "1.9", optional = true }
# Provides anonymous credentials so the GCP Secret Manager client can target a
# local fake/emulator endpoint (`FERRUM_GCP_SECRET_MANAGER_ENDPOINT`) without
# attempting Application Default Credentials discovery. Already in the tree
# transitively via google-cloud-secretmanager-v1 → gaxi; pinned here so the
# direct `with_credentials(..)` call site has a declared dependency.
google-cloud-auth = { version = "1", optional = true }
azure_security_keyvault_secrets = { version = "0.14", optional = true }
azure_identity = { version = "0.35", optional = true }
azure_core = { version = "0.35", optional = true }

# GeoIP (geo_restriction plugin)
maxminddb = "0.28"

# Redis (centralized rate limiting across multiple gateway instances)
redis = { version = "1", features = ["tokio-rustls-comp", "tls-rustls-insecure", "connection-manager"] }

# Kafka (kafka_logging plugin)
rdkafka = { version = "0.39", features = ["cmake-build", "zstd"] }

# MongoDB (NoSQL database backend). Its default `rustls-tls` feature selects
# ring, so retain the non-crypto defaults explicitly and select the TLS provider
# through `crypto-ring` / `fips` below.
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "dns-resolver"] }

# DTLS 1.2/1.3 (secure UDP) — Sans-IO state machine
# SYNC: version must match tests/performance/multi_protocol/Cargo.toml (cross-version DTLS handshakes hang)
dimpl = { version = "0.6", features = ["aws-lc-rs", "rcgen"] }

# Shared types between eBPF programs and userspace (no_std, platform-independent)
ferrum-ebpf-common = { path = "ebpf/ferrum-ebpf-common" }

# Memory allocator — jemalloc reduces fragmentation and improves throughput
# under high concurrency (50k+ connections). Not available on Windows.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# recvmmsg/sendmmsg for batched UDP datagram I/O, io_uring for splice (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
# eBPF program loader (optional, behind `ebpf` feature)
aya = { version = "0.13", optional = true }
aya-log = { version = "0.2", optional = true }

# ── Feature flags ──────────────────────────────────────────────────────────
# Cloud secret backends are optional.  Disabling them saves ~1,900 transitive
# crate compilations, which is useful for benchmark and perf-regression CI
# builds that never use external secret providers.
[features]
default = ["crypto-ring"]

# ── Cryptographic backend (mutually exclusive) ─────────────────────────────
#
# Exactly one of `crypto-ring` and `fips` must be selected. Selecting both or
# neither is a hard `compile_error!` in `src/fips/mod.rs`, and
# `.github/scripts/check_fips_feature_policy.py` re-checks the *resolved*
# feature graph so a transitive edge cannot quietly put ring back in control of
# a nominal FIPS build.
#
# `crypto-ring` (default) reproduces the historical, non-FIPS build exactly.
# Ordinary deployments are behaviourally unchanged by the existence of the
# FIPS profile.
crypto-ring = [
    "dep:ring",
    "rustls/ring",
    "tokio-rustls/ring",
    "tonic/tls-ring",
    "quinn/rustls-ring",
    "sqlx/tls-rustls-ring",
    "ldap3/tls-rustls-ring",
    "rcgen/ring",
    "x509-parser/verify",
    "jsonwebtoken/rust_crypto",
    "reqwest/__rustls-ring",
    "hyper-rustls?/ring",
    "instant-acme?/ring",
    "kube/ring",
    "mongodb/rustls-tls",
]

# `fips` builds against the FIPS build of AWS-LC (`aws-lc-fips-sys`) through
# `aws-lc-rs` and rustls. Every arm below is the aws-lc counterpart of the
# `crypto-ring` line directly above it, so the two lists must stay
# position-for-position comparable — that correspondence is what the CI policy
# check reads.
#
# Building this profile requires a C toolchain, CMake, Go, and Perl for
# `aws-lc-fips-sys`. The committed lockfile pins both profiles; feature
# selection still keeps the FIPS-only module out of ordinary artifacts. See
# docs/fips.md §"Building the FIPS profile".
#
# Selecting this feature does NOT make Ferrum Edge a validated cryptographic
# module and does not make any deployment FIPS-certified. It selects the
# module Ferrum's cryptography is routed through; validation, the operating
# environment, and the deployment controls are the operator's, and are
# documented in docs/fips.md.
# NOTE: there is deliberately no `dep:aws-lc-rs` entry. `aws-lc-rs/fips` on an
# optional dependency already enables that dependency, so listing both was a
# duplicate activation of the same optional dep — harmless to cargo, but it made
# the list read as if the dep and its FIPS arm were independently selectable,
# which is exactly the confusion this profile cannot afford. `crypto-ring` still
# needs its explicit `dep:ring` because `ring` has no feature to enable through.
fips = [
    "aws-lc-rs/fips",
    "rustls/fips",
    "tokio-rustls/fips",
    "tonic/tls-aws-lc",
    "quinn/rustls-aws-lc-rs-fips",
    "sqlx/tls-rustls-aws-lc-rs",
    "ldap3/tls-rustls-aws-lc-rs",
    "rcgen/fips",
    "x509-parser/verify-aws",
    "jsonwebtoken/aws_lc_rs",
    "reqwest/__rustls-aws-lc-rs",
    "hyper-rustls?/fips",
    "instant-acme?/fips",
    "kube/aws-lc-rs",
    "mongodb/rustls-tls-aws-lc",
]

fuzzing = []
acme = ["dep:instant-acme", "dep:hyper-rustls"]
pkcs11 = ["dep:cryptoki"]
cloud-secrets = ["secrets-vault", "secrets-aws", "secrets-gcp", "secrets-azure"]
secrets-vault = ["dep:vaultrs"]
secrets-aws = ["dep:aws-config", "dep:aws-sdk-secretsmanager"]
secrets-gcp = ["dep:google-cloud-secretmanager-v1", "dep:google-cloud-auth"]
secrets-azure = ["dep:azure_identity", "dep:azure_security_keyvault_secrets", "dep:azure_core"]
ebpf = ["dep:aya", "dep:aya-log", "ferrum-ebpf-common/userspace"]

# ── Build profiles ─────────────────────────────────────────────────────────
# Dev: optimise for fast compile-edit-run cycles
[profile.dev]
opt-level = 0
debug = true            # full debuginfo for local development
incremental = true      # incremental compilation for faster rebuilds
# Split debuginfo to speed up linking (macOS/Linux)
split-debuginfo = "unpacked"

# Release: optimise for runtime performance.
#
# `panic = "abort"` is a deliberate availability tradeoff (issue #4166): no
# unwind tables (smaller binary, faster error paths), and a panic anywhere —
# including a background poller or accept loop — terminates the process.
# Background-task supervisors still handle non-panic unexpected exits.
# Operators must run a process supervisor (systemd, Kubernetes). See
# PRODUCTION_READINESS.md ("Deliberate decisions") and docs/ci_cd.md.
[profile.release]
opt-level = 3
lto = "fat"             # fat LTO: full cross-crate inlining for maximum hot-path perf
codegen-units = 1       # single codegen unit for best LLVM optimization
strip = true            # strip symbols — smaller binary
incremental = false     # disable incremental for deterministic release builds
panic = "abort"         # fail-fast: no unwind tables; a panic kills the process

# CI-specific: fast release builds for testing (not shipping)
[profile.ci-release]
inherits = "release"
lto = "off"             # skip LTO entirely — biggest time saver
codegen-units = 256     # maximise codegen parallelism
strip = true
opt-level = 2           # still optimised, but less aggressive

# PR platform verification: fastest linked binary build.
#
# Pull requests only need to prove that each target links with the selected
# feature set. Shipping artifacts are built from `release` on main/tag flows.
[profile.pr-build]
inherits = "dev"
opt-level = 0
debug = 0               # avoid expensive debuginfo emission/linking
incremental = false     # let sccache cache crate outputs across CI runs
lto = "off"
codegen-units = 256

# Maximum-performance: for production shipping builds and benchmarks.
# Fat LTO + single codegen unit enables whole-program optimisation across
# all crates. Compile time is 3-5× slower than `release` but yields 5-10%
# better runtime throughput.
[profile.max-perf]
inherits = "release"
lto = "fat"             # full inter-module LTO (cross-crate inlining, DCE)
codegen-units = 1       # single codegen unit for maximum optimiser visibility
panic = "abort"         # inherit release fail-fast; no unwind tables

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
# Independent reference implementations for cryptographic test vectors and
# request-signing fixtures. Production code routes SHA-2/HMAC-SHA-2 through
# `crate::fips::approved` and must not depend on these RustCrypto crates.
sha2 = "0.11.0"
hmac = "0.13.0"
# `tempfile` is intentionally also declared in `[dependencies]` for
# `src/config/mongo_store.rs`. Keeping it dev-only would re-introduce the
# `cargo check --lib` break (see the dependency-section comment).
wiremock = "0.6"
# Functional secret-backend tests: Vault dev server + LocalStack run in Docker
# via testcontainers; env-mutating tests serialize via serial_test. Only the
# `secrets_functional` test target uses these. See tests/secrets_functional/.
testcontainers = "0.27"
serial_test = "3"
# Functional testing dependencies
rand = "0.10"
futures = "0.3"
# `aws_lc_rs` feature enables RSA key generation in rcgen (the default `ring`
# backend cannot generate RSA keys). aws-lc-rs is already in the dep graph
# transitively via `dimpl`, so this only flips a feature on an existing crate.
# Required for `tests/unit/plugins/soap_ws_security_tests.rs` end-to-end
# sign-then-verify roundtrip coverage of the X.509 signature path.
rcgen = { version = "0.14", features = ["aws_lc_rs"] }
# Test fixtures construct rustls providers and raw digests directly. Pinning
# `ring` here — a DEV dependency, never linked into the shipped binary — keeps
# the whole suite compiling under both `--features crypto-ring` and
# `--no-default-features --features fips`, without letting a fixture's provider
# choice reach a deployment. The FIPS build/lint gate in
# `.github/workflows/fips-build.yml` audits normal/build package feature rows
# with dev-dependency edges excluded for exactly this reason.
ring = "0.17"
rustls = { version = "0.23", features = ["ring"] }
rstest = "0.26"
time = "0.3"
# Phase 6 cross-protocol matrix macro: concatenates idents at macro
# expansion to generate one #[tokio::test] per (frontend, backend)
# combination. Pure proc-macro, zero runtime cost.
paste = "1"
# Simple HTTP server dependencies
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "test-util"] }

# ── Vendored upstream patches ──────────────────────────────────────────────
# We carry a vendored copy of reqwest 0.13.3 with PR seanmonstar/reqwest#3017
# applied so each request can override the client-level connect timeout via
# `RequestBuilder::connect_timeout(Duration)`. Without the patch, two proxies
# sharing the same connection-pool key (which intentionally excludes policy
# fields like `backend_connect_timeout_ms`) would also share whichever
# connect timeout the underlying `reqwest::Client` was first built with.
#
# Retirement plan: when reqwest#3017 merges and ships in a release we use,
# remove this `[patch.crates-io]` entry, drop `vendor/reqwest-0.13.3-ferrum-patched/`,
# and unpin the dependency. The call-site change in `src/connection_pool.rs`
# uses the upstream API as proposed in the PR, so it stays intact.
# See `docs/upstream-reqwest-patches/001-per-request-connect-timeout/README.md`.
#
# We also carry a vendored copy of h3 0.0.8 with the frame-drain-on-quic-close
# fix applied (hyperium/h3#339, tracking issue hyperium/h3#338). Without the
# patch, `FrameStream::try_recv` propagates a QUIC `CONNECTION_CLOSE` via `?`
# before the frame decoder gets to consume bytes already buffered from a prior
# wake. When io_uring batches `STREAM(FIN)` + `CONNECTION_CLOSE(H3_NO_ERROR)`
# into one recv (common for fast backends doing graceful shutdown), the
# buffered HEADERS frame is silently discarded and `recv_response` returns
# `StreamError::ConnectionError` — the gateway surfaces a 502 to the client
# even though the response was on the wire.
#
# Retirement plan: when h3 ships a release with the fix, remove the
# corresponding `[patch.crates-io]` line, drop `vendor/h3-0.0.8-ferrum-patched/`,
# and bump the `h3` floor in `Cargo.toml` to that version. The gateway-side
# suppression in PR #506 stays — it is correct independently of whether the
# underlying h3 library can recover the response.
# See `docs/upstream-h3-patches/001-recv-frame-drain-on-quic-close/README.md`.
#
# We also carry vendored copies of tungstenite 0.29.0 and tokio-tungstenite
# 0.29.0 with the upstream-proposed lossless raw-takeover APIs:
# `WebSocket::into_inner_with_read_buffer()` and
# `WebSocketStream::into_inner_with_read_buffer()`. Without these, tunnel mode
# loses backend bytes coalesced with the 101 response because plain
# `into_inner()` drops tungstenite's internal read buffer.
#
# Retirement plan: when both upstream changes and equivalent frame/message
# capacity attribution ship in compatible published releases consumed by
# ferrum-edge, remove both `[patch.crates-io]` lines, drop the two vendor
# directories, bump dependency versions/lockfile normally, and keep the gateway
# call site using the same upstream API. See
# `docs/upstream-tungstenite-patches/README.md`.
#
# We also carry a narrowly scoped copy of dimpl 0.6.1 that transmits complete
# leaf-first certificate chains and owns every retained private-key byte copy
# in zeroizing storage. No compatible upstream release currently provides
# either security property. See
# `docs/upstream-dimpl-patches/001-certificate-chain-and-key-zeroization/README.md`.
#
# We also carry a vendored copy of h3-quinn 0.0.10 whose `RecvStream` owns its
# `quinn::RecvStream` inline instead of moving it into a `ReusableBoxFuture` for
# the duration of a pending read. Upstream leaves the field as `None` while
# `poll_data` is `Pending`, so `stop_sending` unwraps that `None` — a process
# abort under `panic = "abort"` — exactly when an HTTP/3 server needs it most:
# retiring a request-body read to send `STOP_SENDING(H3_NO_ERROR)` after the
# response is complete. Working around it gateway-side is not possible (quinn
# exposes no connection-level STOP_SENDING and the parked stream is
# unreachable), and skipping the call downgrades the wire signal to
# `quinn::RecvStream::drop`'s `STOP_SENDING(0)`, which is not an HTTP/3 error
# code. `quinn::RecvStream::read_chunk` is documented cancel-safe, so building
# it per poll is equivalent — and allocation-free.
#
# Retirement plan: when h3-quinn ships a release whose `stop_sending` is
# correct while a read is in flight *and* whose `SendStream`/`BidiStream`
# expose an equivalent `&self` + `'static` `stopped` watch, remove the
# `[patch.crates-io]` line, drop `vendor/h3-quinn-0.0.10-ferrum-patched/`,
# and bump the `h3-quinn` floor. See `docs/upstream-h3-quinn-patches/`.
[patch.crates-io]
reqwest = { path = "vendor/reqwest-0.13.3-ferrum-patched" }
h3 = { path = "vendor/h3-0.0.8-ferrum-patched" }
h3-quinn = { path = "vendor/h3-quinn-0.0.10-ferrum-patched" }
tungstenite = { path = "vendor/tungstenite-0.29.0-ferrum-patched" }
tokio-tungstenite = { path = "vendor/tokio-tungstenite-0.29.0-ferrum-patched" }
dimpl = { path = "vendor/dimpl-0.6.1-ferrum-patched" }
