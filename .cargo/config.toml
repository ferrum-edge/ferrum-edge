# ── Build configuration shared by local and CI ─────────────────────────────
#
# This file is the single source of truth for the fast-linker and network
# settings. Both local `cargo` invocations and remote CI use them. CI installs
# the linker tools via `.github/actions/setup-fast-linker`; if the install
# fails, that action clears the corresponding env vars so cargo falls back to
# the platform default. Local developers bootstrap the same tools once via
# `scripts/install-build-deps.sh`.
#
# Why explicit triples (not cfg() forms): env-var overrides like
# CARGO_TARGET_<TRIPLE>_RUSTFLAGS only apply to explicit triple sections —
# cargo does not merge them with cfg()-based sections. Keeping the
# sections explicit keeps the CI fallback working.

# ── sccache (environment-selected, never committed here) ───────────────
# This file deliberately sets no `rustc-wrapper`. Every cargo process that
# reads it would have to exec the wrapper, including ones that only resolve
# the dependency graph: Dependabot's cargo updater runs `rustc -vV` through
# it, has no sccache, and failed every run while the wrapper was committed
# here (`dependency_file_not_resolvable`).
# - CI: `.github/actions/setup-sccache` exports RUSTC_WRAPPER /
#   CARGO_BUILD_RUSTC_WRAPPER as the checksum-verified binary, or clears them.
# - Local: `scripts/install-build-deps.sh` sets `build.rustc-wrapper` in your
#   user-level $CARGO_HOME/config.toml, or export RUSTC_WRAPPER=sccache.
# sccache honors $SCCACHE_DIR if it is set in the shell environment.
[build]
incremental = false       # prevent cache corruption on concurrent/agent builds and external APFS volumes

# ── Fast linkers (per-platform) ─────────────────────────────────────────
# 2-5x faster link times on Linux (mold), modest improvement on macOS (lld).
# Windows uses the default link.exe (changing it adds risk without proven
# benefit at our crate count).
# Install: `brew install lld` (macOS) / `apt-get install -y mold clang` (Linux)
# or run `scripts/install-build-deps.sh`.

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
# Native aarch64 Linux uses mold like x86_64. The CI cross-compile path
# runs inside cross-rs's container, which clears these via Cross.toml
# passthrough so the container's default linker is used.
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-apple-darwin]
# `-fuse-ld=lld` resolves to ld64.lld for Mach-O targets when the binary
# is on PATH (Homebrew installs it at /opt/homebrew/bin/ld64.lld).
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# ── Network ─────────────────────────────────────────────────────────────
# Robustness settings shared by local and CI cargo. The flake these target:
# intermittent "curl failed fetching a dependency" / "spurious network error"
# while downloading crate tarballs from the crates.io CDN (CloudFront). It is
# a connectivity/edge issue, never anything in the dependency set — each
# occurrence lands on a different, unrelated crate and clears on a plain
# re-run. Putting the fix in this shared file (rather than CI-only env) means
# every cargo invocation gets the same hardening without editing ~30 job
# definitions: local dev, each CI job, and the cross-rs / docker container
# builds that bind-mount this tree and layer this config over their own
# $CARGO_HOME.
[net]
# Use the git CLI for fetching — honors the user's SSH agent and is
# notably faster on large/private dependency updates.
git-fetch-with-cli = true
# Retry transient registry/CDN errors. Cargo's default is 3; 10 absorbs the
# multi-round CDN hiccups seen across consecutive CI runs. `retry` only
# re-attempts errors cargo classifies as *spurious* (connection resets,
# timeouts, 5xx), so it never masks a real resolution/auth/404 failure —
# pure upside, including for local devs on flaky networks.
retry = 10

# ── HTTP transport ──────────────────────────────────────────────────────
[http]
# Force HTTP/1.1 for crates.io downloads by disabling HTTP/2 multiplexing.
# The CloudFront edge in front of static.crates.io intermittently resets
# HTTP/2 streams mid-transfer; cargo's libcurl downloader surfaces that reset
# as the "curl failed fetching a dependency" flake. Several parallel HTTP/1.1
# transfers are markedly more resilient to it on shared CI egress, and this
# is the cargo-team-recommended mitigation for exactly this failure mode.
# Cost is negligible: on a warm Swatinem cache almost nothing is downloaded,
# and even cold the extra connections are cheap next to compile time.
multiplexing = false
