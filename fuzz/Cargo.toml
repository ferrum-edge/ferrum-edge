[package]
name = "ferrum-edge-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.9"
ferrum-edge = { path = "..", features = ["fuzzing"] }
# The root crate disables librdkafka's OAuthBearer OIDC support, but
# librdkafka 2.12.1 still includes <curl/curl.h> under an #ifdef for the
# disabled macro. Activate the real vendored curl headers only in this isolated
# fuzz dependency graph so the frozen hosted lanes remain hermetic.
rdkafka = { version = "0.39", features = ["curl-static"] }
# cargo-fuzz builds with `--cfg fuzzing`, which compiles h2's `fuzz_bridge`
# module. Since the root and this workspace patch h2 to the vendored path
# crate, Cargo no longer caps its lints, and h2's `#![deny(missing_docs)]`
# rejects that undocumented module unless `unstable` is on (the attribute is
# `cfg_attr(feature = "unstable", allow(missing_docs))`). h2's own fuzz crate
# enables it the same way. `unstable` only widens visibility of h2 internals;
# it changes no runtime behaviour.
h2 = { version = "0.4.19", features = ["unstable"] }

[dev-dependencies]
proptest = "=1.6.0"

# This is an isolated Cargo workspace, so it does not inherit the root
# workspace's patched protocol and security dependencies. Keep these paths in
# lockstep with the root `[patch.crates-io]` table or the fuzz lane would
# compile and exercise different code from the production binary.
[patch.crates-io]
reqwest = { path = "../vendor/reqwest-0.13.3-ferrum-patched" }
h3 = { path = "../vendor/h3-0.0.8-ferrum-patched" }
h3-quinn = { path = "../vendor/h3-quinn-0.0.10-ferrum-patched" }
tungstenite = { path = "../vendor/tungstenite-0.29.0-ferrum-patched" }
tokio-tungstenite = { path = "../vendor/tokio-tungstenite-0.29.0-ferrum-patched" }
dimpl = { path = "../vendor/dimpl-0.6.1-ferrum-patched" }
hyper-util = { path = "../vendor/hyper-util-0.1.21-ferrum-patched" }
hyper = { path = "../vendor/hyper-1.9.0-ferrum-patched" }
h2 = { path = "../vendor/h2-0.4.19-ferrum-patched" }

[[bin]]
name = "traceparent"
path = "fuzz_targets/traceparent.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_decode"
path = "fuzz_targets/config_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_protocol"
path = "fuzz_targets/proxy_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "datagram_client_address"
path = "fuzz_targets/datagram_client_address.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mesh_udp_frame"
path = "fuzz_targets/mesh_udp_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "k8s_crd"
path = "fuzz_targets/k8s_crd.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plugin_config"
path = "fuzz_targets/plugin_config.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[profile.dev]
debug = 1

[profile.fuzz]
inherits = "release"
debug = 1

[profile.fuzz-with-sanitizer]
inherits = "release"
debug = 1
