openapi: 3.1.0
info:
  title: Ferrum Edge Admin API
  description: |
    RESTful API for managing the Ferrum Edge configuration at runtime.

    All endpoints except `/live`, `/health`, `/status`, exact `/metrics`, and
    `/overload` require JWT bearer token authentication via the
    `Authorization: Bearer <token>` header.

    Admin JWTs must include `iss`, `sub`, `exp`, `iat`, `nbf`, `jti`, and a
    string `role` claim. `viewer` can call read-only endpoints, `operator` can
    also mutate proxies, upstreams, plugin configs, and operational refresh/test
    endpoints, and `admin` has full access including consumers, credentials, API
    spec retrieval and mutations, TLS material management, batch/restore, and
    audit logs. API spec metadata listing is read-only and therefore available
    to `viewer`, `operator`, and `admin`; retrieving the original document is
    Admin-only because it can contain sensitive upstream or plugin config. Tokens
    without a valid `role` claim are rejected. When `FERRUM_ADMIN_JWT_AUDIENCE`
    is set, tokens must additionally carry a matching `aud` claim. When it is
    unset (default), tokens without `aud` are accepted, but tokens carrying an
    `aud` claim are rejected per RFC 7519 strict audience handling.

    ## Namespaces

    Resource endpoints that include the `X-Ferrum-Namespace` parameter are
    scoped by that request header. Resources (proxies, consumers, plugin configs,
    upstreams, API specs, audit log entries, and backup/restore payloads) are
    isolated per namespace — uniqueness constraints (listen_path, proxy/upstream
    name, consumer username, listen_port) apply per namespace, and a request only
    sees resources whose `namespace` field matches the header. The header
    defaults to `ferrum` when omitted, must match `^[a-zA-Z0-9][a-zA-Z0-9._-]*$`
    (start with an alphanumeric character; alphanumerics, dots, underscores, or
    hyphens after that; max 254 chars — same rules as resource IDs), and is
    enforced on scoped write operations: any `namespace` field in the request
    body is overwritten with the header value (the field is therefore
    effectively read-only on the wire). Process/runtime surfaces such as
    observability, cluster state, backend capabilities, TLS management, and mesh
    topology reflect the current node or control-plane state and are not
    namespace-filtered unless their operation explicitly declares the namespace
    header. Discover all known resource namespaces via `GET /namespaces`.

    When the gateway is started with `FERRUM_ADMIN_REQUIRE_NAMESPACE_CLAIM=true`,
    namespace-scoped resource endpoints additionally require the admin JWT to
    carry an `ns` claim (a single string or an array of strings, the same claim
    shapes as the CP/DP gRPC plane) that includes the requested
    `X-Ferrum-Namespace` value; requests outside the claimed namespaces are
    rejected with `403 Forbidden`. With the flag unset (default), any valid
    admin JWT may address any namespace.

    ## Caching and read-only mode

    When the primary database is unavailable, read endpoints transparently fall
    back to the most recent cached configuration and include an
    `X-Data-Source: cached` response header. Write operations require a live
    database and return `503 Service Unavailable` when one is not present.

    The Admin API can be placed in **read-only mode**, in which case persisted
    configuration and database mutations return `403 Forbidden`. Authenticated
    operational POST endpoints that do not persist configuration remain
    available, including mesh egress-scope dry-runs, backend capability
    refreshes, and forced TLS source reloads.

    ## Request body size limits

    Most write endpoints accept request bodies up to 1 MiB; bodies that exceed
    the limit are rejected with `413 Payload Too Large`. The `/restore`
    endpoint has a higher configurable limit (default 100 MiB, controlled by
    `FERRUM_ADMIN_RESTORE_MAX_BODY_SIZE_MIB`) to accommodate large-scale
    backups (30K+ proxies / 90K+ plugins can reach ~80 MB).
  version: 0.2.0
  license:
    name: PolyForm Noncommercial 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0

servers:
  - url: "{protocol}://{host}:{port}"
    description: Admin API listener
    variables:
      protocol:
        default: http
        enum: [http, https]
      host:
        default: 127.0.0.1
      port:
        default: "9000"

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Unauthenticated health and readiness probes
  - name: Metrics
    description: Observability and monitoring endpoints
  - name: Mesh Observability
    description: Mesh service graph and identity health telemetry
  - name: Proxies
    description: Manage proxy route definitions
  - name: Consumers
    description: Manage API consumers and their credentials
  - name: Plugins
    description: Manage plugin configurations
  - name: Upstreams
    description: Manage upstream groups for load-balanced backends
  - name: Batch
    description: Bulk resource creation for high-throughput provisioning
  - name: Backup & Restore
    description: Full configuration backup and restore for disaster recovery and migration
  - name: Audit
    description: Query database-backed admin mutation history
  - name: Namespaces
    description: Multi-tenant namespace discovery
  - name: Monitoring
    description: CP/DP cluster status and operational introspection
  - name: Backend Capabilities
    description: Inspect and force-refresh the per-backend-target protocol classification cache (H1/H2/H3/h2c/gRPC)
  - name: Node-Waypoint
    description: Inspect the per-pod identity index used by node-waypoint topology (mesh-only)
  - name: Service-Waypoint
    description: Inspect the resolved service binding used by service-waypoint topology (mesh-only)
  - name: API Specs
    description: Submit, retrieve, replace, and delete OpenAPI/Swagger spec bundles that create proxy + upstream + plugin resources atomically
  - name: TLS
    description: TLS inventory/events/validation/forced reload require operator; persisted certificate, key, trust, JWKS, and ACME state mutations require admin

paths:
  # ── Health ──────────────────────────────────────────────────────────
  /live:
    get:
      operationId: getLive
      summary: Liveness probe (unauthenticated, minimal)
      description: |
        Always returns `200 OK` with the body `{"status":"ok"}` and no
        operational internals. Intended for load-balancer / Kubernetes
        liveness probes. Never requires authentication.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /health:
    get:
      operationId: getHealth
      summary: Gateway health check (tiered detail)
      description: |
        Readiness + diagnostics. Also accessible at `/status`.

        **Unauthenticated** callers receive only `status` and `ready` (suitable
        for readiness probes). The **detailed** diagnostics — `mode`, `database`
        connectivity/pool stats, `cached_config` proxy/consumer counts,
        `database_polling` degradation, `config_rejected`, and mesh state — are
        returned only when the caller presents a valid admin JWT, a matching
        `FERRUM_METRICS_BEARER_TOKEN`, or originates from
        `FERRUM_METRICS_ALLOWED_CIDRS`.

        Returns `503 Service Unavailable` while the gateway is still in
        startup (`status: "starting"`, `ready: false`). Once startup is
        complete it returns `200 OK` with `status` set to `"ok"` or
        `"degraded"` (DB disconnected / admin writes blocked / database
        incremental polling repeatedly rejecting the same delta while serving
        last known-good config; or, in database or control-plane mode, a full
        config load rejected by the runtime-config validation contract while the
        backend is reachable — `config_rejected: true`, admin stays writable as
        the in-band repair path, gated on any deferred schema migration applying
        first). `config_rejected` is a sticky flag cleared only by an accepted
        authoritative full reload; while the backend is unreachable
        (`db_available` false / `admin_writes_enabled` false) the detail is
        suppressed so it never advertises the writable repair path during an
        outage. In CP/DP/mesh modes, if a supervised serving
        listener later exits with an error, `/health` returns `503` with
        `status: "unavailable"`, `ready: false` durably (sticky across a later
        readiness restore). Mesh traffic and admin listener failures use the
        same sticky state; authenticated responses include a sanitized
        `listener_failures` snapshot.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Gateway is ready (status `ok` or `degraded`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Gateway not ready (status `starting` during startup, or `unavailable` after a supervised serving-listener failure); `ready=false`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /status:
    get:
      operationId: getStatus
      summary: Gateway status (alias for /health)
      tags: [Health]
      security: []
      responses:
        "200":
          description: Gateway is ready (status `ok` or `degraded`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Gateway not ready (status `starting` or `unavailable`, `ready=false`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /admin/tls/inventory:
    get:
      operationId: listTlsInventory
      summary: List configured TLS material sources
      description: |
        Returns a paginated inventory of configured TLS material sources with
        non-secret provenance, load state, parsed certificate metadata, and the
        runtime/config surfaces using each source. Inline PEM and private key
        bytes are never returned.
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationOffset"
      responses:
        "200":
          description: TLS material inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsInventoryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/tls/events:
    get:
      operationId: listTlsEvents
      summary: List recent TLS source rotation events
      description: |
        Returns bounded persisted history for TLS source watcher outcomes.
        Events are emitted for successful rotations and source/rebuild failures;
        no-op refresh polls are counted in Prometheus but are not stored here.
        The bounded history is persisted under `FERRUM_TLS_MANAGED_STORE_PATH`
        so recent rotation events survive process restarts.
      tags: [TLS]
      parameters:
        - name: cert_id
          in: query
          required: false
          schema:
            type: string
          description: Filter to events whose source material has this stable event cert ID.
        - name: source_id
          in: query
          required: false
          schema:
            type: string
          description: Filter to events whose source identifier matches exactly.
        - name: surface
          in: query
          required: false
          schema:
            type: string
          description: Filter by TLS surface such as `proxy_https` or `admin_https`.
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [rotated, load_error, rebuild_error]
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationOffset"
      responses:
        "200":
          description: Recent TLS source events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsEventListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/tls/acme/certificates:
    get:
      operationId: listAcmeCertificates
      summary: List ACME-issued TLS certificates
      description: |
        Lists certificates in Ferrum's ACME-issued material store. Records can
        be referenced from TLS source fields as `acme://certificates/{id}#cert`
        and `acme://certificates/{id}#key`. This store is the persistence
        target for the ACME manager; importing already issued ACME material is
        supported before automated order endpoints are enabled.
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationOffset"
      responses:
        "200":
          description: ACME-issued certificate records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeCertificateRecordListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: importAcmeCertificate
      summary: Import an ACME-issued certificate and private key
      description: |
        Imports already issued ACME certificate material into Ferrum's ACME
        store. Private key bytes are persisted but never returned in responses.
      tags: [TLS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcmeCertificateRequest"
      responses:
        "201":
          description: ACME certificate imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeCertificateRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/tls/acme/certificates/{id}:
    get:
      operationId: getAcmeCertificate
      summary: Get an ACME-issued TLS certificate
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: ACME certificate record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeCertificateRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateAcmeCertificate
      summary: Replace an ACME-issued certificate and private key
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcmeCertificateRequest"
      responses:
        "200":
          description: ACME certificate updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeCertificateRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAcmeCertificate
      summary: Delete an unreferenced ACME-issued TLS certificate
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: ACME certificate deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/tls/acme/orders:
    get:
      operationId: listAcmeOrders
      summary: List ACME orders and active challenge material
      description: |
        Lists ACME orders persisted by Ferrum. HTTP-01 challenge records in
        `pending_challenges`, `ready`, or `processing` states are served from
        proxy listeners at `/.well-known/acme-challenge/{token}` before
        normal route matching. TLS-ALPN-01 records in those states are served
        in-band on TLS listeners for ClientHello messages that offer only
        `acme-tls/1` and matching SNI. DNS-01 records expose the TXT record
        name and value that must be published before finalization.
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationOffset"
      responses:
        "200":
          description: ACME order records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeOrderListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createAcmeOrder
      summary: Create an ACME HTTP-01, TLS-ALPN-01, or DNS-01 order
      description: |
        Creates an ACME order through the optional `acme` Cargo feature and
        persists the returned HTTP-01, TLS-ALPN-01, or DNS-01 challenge material. When
        Ferrum is built without that feature this endpoint returns
        `501 Not Implemented`.
      tags: [TLS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcmeOrderRequest"
      responses:
        "201":
          description: ACME order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /admin/tls/acme/accounts:
    get:
      operationId: listAcmeAccounts
      summary: List ACME accounts in use
      description: |
        Lists non-secret ACME account metadata discovered from persisted
        ACME account credentials, orders, and certificates. Account credentials
        are never returned.
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationOffset"
      responses:
        "200":
          description: ACME accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeAccountListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/tls/acme/renew/{id}:
    post:
      operationId: renewAcmeCertificate
      summary: Create a renewal order for an ACME certificate
      description: |
        Creates a replacement HTTP-01, TLS-ALPN-01, or DNS-01 ACME order for an existing
        `acme://certificates/{id}` record. Ferrum reuses persisted account
        credentials from the latest order for the certificate when available,
        or uses credentials supplied in the request. Finalize the returned
        order after the selected challenge is reachable.
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcmeRenewRequest"
      responses:
        "201":
          description: Renewal order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /admin/tls/acme/orders/{id}:
    get:
      operationId: getAcmeOrder
      summary: Get an ACME order
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: ACME order record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAcmeOrder
      summary: Delete an ACME order and stop serving its challenges
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: ACME order deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/tls/acme/orders/{id}/finalize:
    post:
      operationId: finalizeAcmeOrder
      summary: Finalize an ACME HTTP-01, TLS-ALPN-01, or DNS-01 order
      description: |
        Marks the order's prepared HTTP-01, TLS-ALPN-01, or DNS-01 challenges ready,
        waits for the ACME directory to accept the authorizations, finalizes
        the order, fetches the issued certificate, and stores it as an
        `acme://certificates/{id}` record. The endpoint requires the optional
        `acme` Cargo feature and returns `501 Not Implemented` without it.
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcmeOrderFinalizeRequest"
      responses:
        "200":
          description: ACME order finalized and certificate persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcmeOrderFinalizeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /admin/tls/certificates:
    get:
      operationId: listManagedTlsCertificates
      summary: List admin-managed TLS certificates
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationOffset"
      responses:
        "200":
          description: Managed certificate records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedTlsRecordListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createManagedTlsCertificate
      summary: Upload an admin-managed TLS certificate and private key
      description: Private key bytes are persisted in the managed store but are never returned in responses.
      tags: [TLS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedTlsCertificateRequest"
      responses:
        "201":
          description: Managed certificate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedTlsRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/tls/certificates/{id}:
    get:
      operationId: getManagedTlsCertificate
      summary: Get an admin-managed TLS certificate
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Managed certificate record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedTlsRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateManagedTlsCertificate
      summary: Rotate an admin-managed TLS certificate and private key
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedTlsCertificateRequest"
      responses:
        "200":
          description: Managed certificate updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedTlsRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteManagedTlsCertificate
      summary: Delete an unreferenced admin-managed TLS certificate
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Managed certificate deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/tls/ca-bundles:
    get:
      operationId: listManagedTlsCaBundles
      summary: List admin-managed TLS CA bundles
      tags: [TLS]
      parameters:
        - $ref: "#/components/parameters/PaginationLimit"
        - $ref: "#/components/parameters/PaginationOffset"
      responses:
        "200":
          description: Managed CA bundle records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedTlsRecordListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
