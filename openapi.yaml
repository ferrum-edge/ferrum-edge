    PluginConfigCreate:
      description: Request body for creating or updating a plugin configuration.
      allOf:
        - $ref: "#/components/schemas/PluginConfig"
      required:
        - plugin_name
        - scope

    PluginScope:
      type: string
      enum: [global, proxy, proxy_group]
      description: |
        `global` — plugin applies to all proxies; `proxy_id` must be null.
        `proxy` — plugin applies only to the proxy referenced by `proxy_id`;
        `proxy_id` is required.
        `proxy_group` — plugin applies to a subset of proxies that reference it
        in their `plugins` association list; `proxy_id` must be null. A single
        shared plugin instance is used across all associated proxies, so stateful
        plugins (e.g., rate_limiting) share counters across the group.

    # ── WebSocket Plugin Configs ─────────────────────────────────────
    WsMessageSizeLimitingConfig:
      type: object
      description: |
        Configuration for the `ws_message_size_limiting` plugin. Enforces an
        actual wire-frame payload ceiling before payload reservation and an
        independent reassembled-message ceiling. Violations trigger a bounded
        close frame (RFC 6455 close code 1009 — Message Too Big) sent to both
        client and backend after shared relay cancellation is published.
      required:
        - max_frame_bytes
      properties:
        max_frame_bytes:
          type: integer
          format: uint64
          minimum: 1
          description: >-
            Maximum frame payload size in bytes. Required and must be greater
            than zero — the plugin rejects configs with `max_frame_bytes` of 0
            at config load time. Applied to Text, Binary, Ping, and Pong frames
            in both directions; Close frames bypass the size check. Note that
            Ping/Pong are RFC 6455 control frames capped at 125 bytes by the
            protocol itself, so values below 125 will close the connection on
            heartbeat traffic.
        max_message_bytes:
          type: integer
          format: uint64
          minimum: 1
          description: >-
            Maximum reassembled Text/Binary message payload in bytes. Defaults
            to four times `max_frame_bytes` and must be greater than or equal to
            `max_frame_bytes`. Continuation frames are still checked separately
            against `max_frame_bytes`; a cumulative message larger than the
            frame limit is valid until this independent bound is exceeded.
        close_reason:
          type: string
          default: "Message too large"
          description: >-
            Close frame reason text sent to both peers when either limit is
            exceeded. Truncated to 123 UTF-8 bytes (the WebSocket protocol
            close-frame reason limit) on a UTF-8 char boundary.

    WsFrameLoggingConfig:
      type: object
      additionalProperties: false
      description: |
        Configuration for the `ws_frame_logging` plugin. Logs WebSocket frame
        metadata (direction, frame type, payload size, optional payload
        fingerprint) under the `ws_frame_log` tracing target. Logs Text and
        Binary frames by default; Ping/Pong are opt-in via `log_ping_pong`. The
        plugin never transforms or drops frames — it is purely observational.

        Default `log_level` is `info` so healthy frame traffic does not become
        warning-level noise. Under the gateway's default
        `FERRUM_LOG_LEVEL=warn` EnvFilter, constructing an enabled empty config
        emits an actionable construction-time warning naming the filtered level
        while normal frame records remain suppressed. Validation and cache
        publication can construct an instance separately, so the diagnostic can
        repeat. A filter stricter than `warn` (or `ws_frame_log=off`) also
        suppresses that diagnostic; operators using such a filter must
        deliberately admit the configured target level. Explicit `trace` or
        `debug` likewise require a matching (or more verbose) runtime filter;
        `warn` is available only when selected deliberately. Filtering skips
        fingerprint computation and tracing event construction only — frame
        parsing, plugin selection (`requires_ws_frame_hooks`), and `on_ws_frame`
        dispatch still occur, so H1 raw-copy tunnel mode remains unavailable
        while this plugin is attached.

        Admission contract: only the keys below are allowed; unknown keys and
        explicit `null` field values are rejected. `payload_preview_bytes`
        values above 65536 are rejected (not clamped). The plugin is registered
        OptionalFailOpen. Admin create/update performs strict construction and
        returns HTTP 400 for an invalid enabled config before storing it. During
        file-mode load, pre-existing DB/CP snapshot application, or cache
        rebuild, invalid enabled configs produce a validation/construction
        warning and omit this instance from the published plugin cache rather
        than rejecting the surrounding snapshot.

        Raw frame contents are never logged: WebSocket payloads routinely carry
        credentials (bearer tokens, cookies, API keys), so when
        `include_payload_preview` is enabled the `preview` field contains only a
        keyed, non-reversible fingerprint of the form
        `hmac-sha256:<12 hex chars> len=<bytes>` (with a trailing `+` after the
        digest when only a prefix of the payload was hashed). The key is
        generated per plugin instance and is not exposed in logs, so log access
        alone cannot confirm guessed payloads offline.
      properties:
        log_level:
          type: string
          enum: [trace, debug, info, warn]
          default: info
          description: >-
            Tracing level for frame log output. Case-sensitive; unknown values
            (e.g., `"error"`, `"INFO"`) and explicit `null` are rejected at
            config load time. Healthy records default to `info`; construction
            warns when the active filter suppresses the configured level.
        include_payload_preview:
          type: boolean
          default: false
          description: >-
            Emit a keyed, non-reversible payload fingerprint
            (`hmac-sha256:<prefix> len=<n>`) in the `preview` field. Raw frame
            bytes are never logged. Explicit `null` is rejected.
        payload_preview_bytes:
          type: integer
          default: 128
          minimum: 0
          maximum: 65536
          description: >-
            Maximum number of leading payload bytes folded into the fingerprint
            digest. Values above 65536 are rejected (not clamped). Must be
            greater than zero when `include_payload_preview` is true; zero is
            accepted only when previews are disabled. Explicit `null` is
            rejected.
        log_ping_pong:
          type: boolean
          default: false
          description: >-
            Whether to log ping/pong frames in addition to text/binary frames.
            Explicit `null` is rejected.
      allOf:
        - if:
            required: [include_payload_preview]
            properties:
              include_payload_preview:
                const: true
          then:
            properties:
              payload_preview_bytes:
                minimum: 1

    WsRateLimitingConfig:
      type: object
      description: |
        Configuration for the `ws_rate_limiting` plugin. Enforces per-connection
        frame rate limiting using a token-bucket algorithm. When the bucket is
        exhausted, the plugin sends a WebSocket close frame (RFC 6455 close code
        1008 — Policy Violation) to both client and backend. Both directions
        (client→backend and backend→client) consume from the same per-connection
        bucket. Supports centralized Redis-backed mode for cross-instance
        coordination of frame counters. Counter storage supports only local
        memory and Redis; database-backed counters are intentionally unsupported.
      properties:
        frames_per_second:
          type: integer
          format: uint64
          default: 100
          minimum: 1
          description: >-
            Token refill rate per second. Must be greater than zero — configs
            with `frames_per_second: 0` are rejected at config load time.
        burst_size:
          type: integer
          format: uint64
          minimum: 1
          description: >-
            Maximum burst capacity (tokens). Defaults to the value of
            `frames_per_second` when not explicitly set. Must be greater than
            zero and greater than or equal to `frames_per_second`.
        close_reason:
          type: string
          default: "Frame rate exceeded"
          description: >-
            Close-frame reason text sent when the frame rate is exceeded.
            Truncated on a UTF-8 char boundary to 123 bytes (the RFC 6455 §5.5
            control-frame payload limit) so the frame stays well-formed.
        sync_mode:
          type: string
          enum: [local, redis]
          default: local
          description: "Frame counter storage: 'local' (in-memory) or 'redis' (centralized). Database-backed counters are unsupported. Any RESP-compatible server works."
        redis_url:
          type: string
          description: "Redis connection URL. Required when sync_mode is 'redis'."
        redis_tls:
          type: boolean
          default: false
          description: "Enable TLS for the Redis connection. CA verification uses gateway-level FERRUM_TLS_CA_BUNDLE_PATH; skip-verify uses FERRUM_TLS_NO_VERIFY."
        redis_key_prefix:
          type: string
          default: "ferrum:ws_rate_limiting"
          description: Key prefix for all Redis keys
        redis_pool_size:
          type: integer
          default: 4
          description: Number of multiplexed Redis connections
        redis_username:
          type: string
          description: Redis username for ACL authentication
        redis_password:
          type: string
          description: Redis password
        redis_connect_timeout_seconds:
          type: integer
          default: 5
          description: Redis connection timeout in seconds
        redis_health_check_interval_seconds:
          type: integer
          default: 5
          description: Health check ping interval when Redis is unavailable

    UdpRateLimitingConfig:
      type: object
      description: |
        Configuration for the `udp_rate_limiting` plugin. Rate limits UDP
        datagrams per resolved client IP using a fixed-window algorithm with
        atomic counters. Excess datagrams are silently dropped (standard UDP
        flood mitigation). Operates on both client→backend and backend→client
        datagrams within the same window per client IP. Counter storage supports
        only local memory and Redis; database-backed counters are intentionally
        unsupported.
      anyOf:
        - required: [datagrams_per_second]
        - required: [bytes_per_second]
      properties:
        datagrams_per_second:
          type: integer
          format: uint64
          minimum: 1
          description: >-
            Maximum datagrams per `window_seconds`. At least one of
            `datagrams_per_second` or `bytes_per_second` is required.
        bytes_per_second:
          type: integer
          format: uint64
          minimum: 1
          description: >-
            Maximum bytes per `window_seconds` (sum of datagram payload sizes).
            At least one of `datagrams_per_second` or `bytes_per_second` is
            required.
        window_seconds:
          type: integer
          format: uint64
          default: 1
          minimum: 1
          description: >-
            Window length in seconds. Defaults to 1 second. The effective
            per-window cap is `datagrams_per_second × window_seconds` (and
            similarly for bytes).
        sync_mode:
          type: string
          enum: [local, redis]
          default: local
          description: "Datagram/byte counter storage: 'local' (in-memory) or 'redis' (centralized). Database-backed counters are unsupported."
        redis_url:
          type: string
          description: "Redis connection URL. Required when sync_mode is 'redis'."
        redis_tls:
          type: boolean
          default: false
          description: "Enable TLS for the Redis connection. CA verification uses gateway-level FERRUM_TLS_CA_BUNDLE_PATH; skip-verify uses FERRUM_TLS_NO_VERIFY."
        redis_key_prefix:
          type: string
          default: "ferrum:udp_rate_limiting"
          description: Key prefix for all Redis keys
        redis_pool_size:
          type: integer
          default: 4
          description: Number of multiplexed Redis connections
        redis_username:
          type: string
          description: Redis username for ACL authentication
        redis_password:
          type: string
          description: Redis password
        redis_connect_timeout_seconds:
          type: integer
          default: 5
          description: Redis connection timeout in seconds
        redis_health_check_interval_seconds:
          type: integer
          default: 5
          description: Health check ping interval when Redis is unavailable

    # ── Circuit Breaker ─────────────────────────────────────────────
    CircuitBreakerConfig:
      type: object
      properties:
        failure_threshold:
          type: integer
          format: uint32
          default: 5
          description: Consecutive failures to trip the circuit open
        success_threshold:
          type: integer
          format: uint32
          default: 3
          description: Consecutive successes in half-open to close the circuit
        timeout_seconds:
          type: integer
          format: uint64
          default: 30
          description: Seconds to wait in open state before transitioning to half-open
        failure_status_codes:
          type: array
          items:
            type: integer
            format: uint16
          default: [500, 502, 503, 504]
          description: HTTP status codes that count as failures
        half_open_max_requests:
          type: integer
          format: uint32
          default: 1
          description: Maximum concurrent probe requests allowed in half-open state
        trip_on_connection_errors:
          type: boolean
          default: true
          description: >
            Whether connection-level errors (TCP refused, DNS failure, TLS handshake
            error, connect timeout) count as circuit breaker failures independently
            of failure_status_codes. When true (default), connection errors always
            trip the breaker. When false, only real HTTP response status codes in
            failure_status_codes are counted.

    # ── Retry ───────────────────────────────────────────────────────
    RetryConfig:
      type: object
      properties:
        max_retries:
          type: integer
          format: uint32
          default: 3
          description: Maximum retry attempts
        retryable_status_codes:
          type: array
          items:
            type: integer
            format: uint16
          default: [502, 503, 504]
          description: HTTP status codes eligible for retry
        retryable_methods:
          type: array
          items:
            type: string
            enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, TRACE, CONNECT]
          maxItems: 9
          default: [GET, HEAD, OPTIONS, PUT, DELETE]
          description: HTTP methods eligible for retry. Must be valid HTTP methods.
        backoff:
          $ref: "#/components/schemas/BackoffStrategy"
        retry_on_connect_failure:
          type: boolean
          default: true
          description: |
            Retry on TCP-level failures (connect refused, DNS failure, TLS
            error, timeout) independently of `retryable_status_codes`.

    BackoffStrategy:
      description: Retry delay strategy
      oneOf:
        - type: object
          title: Fixed delay
          required: [fixed]
          properties:
            fixed:
              type: object
              required: [delay_ms]
              properties:
                delay_ms:
                  type: integer
                  format: uint64
                  default: 100
                  description: Fixed delay between retries in milliseconds
        - type: object
          title: Exponential backoff
          required: [exponential]
          properties:
            exponential:
              type: object
              required: [base_ms, max_ms]
              properties:
                base_ms:
                  type: integer
                  format: uint64
                  description: Base delay in milliseconds (doubled each attempt)
                max_ms:
                  type: integer
                  format: uint64
                  description: Maximum delay cap in milliseconds
      default:
        fixed:
          delay_ms: 100

    # ── Upstream / Load Balancing ────────────────────────────────────
    UpstreamCreate:
      description: |
        Request body for creating or updating an upstream. Same schema as
        Upstream but `id`, `created_at`, and `updated_at` are optional
        (server-managed).
      allOf:
        - $ref: "#/components/schemas/Upstream"
      required:
        - targets

    Upstream:
      type: object
      required: [targets]
      properties:
        id:
          type: string
          description: >-
            Unique identifier (UUID auto-generated if omitted or empty on create).
            Custom IDs must start with an alphanumeric character and contain only
            alphanumeric characters, dots, underscores, or hyphens (max 254 chars).
          pattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
          maxLength: 254
        namespace:
          type: string
          default: ferrum
          readOnly: true
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
          maxLength: 254
          description: >-
            Namespace this upstream belongs to. Read-only on the wire — set
            from the `X-Ferrum-Namespace` request header (or the `ferrum`
            default) on every create/update; any value in the request body
            is ignored.
        name:
          type: [string, "null"]
          description: >-
            Optional friendly name. Must be unique across all upstreams when set.
        targets:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamTarget"
          description: >-
            Static list of backend targets. At least one target is required unless
            `service_discovery` is configured as an alternative target source.
        algorithm:
          $ref: "#/components/schemas/LoadBalancerAlgorithm"
        hash_on:
          type: [string, "null"]
          description: |
            Hash key source for consistent-hashing algorithm. Accepted values:
            - `ip` (default) — hash on client IP address
            - `header:<name>` — hash on a request header value (e.g. `header:x-user-id`)
            - `cookie:<name>` — hash on a cookie value; if the cookie is absent, the
              gateway sets a `Set-Cookie` response header to establish a sticky session.
            Ignored by other algorithms.
        hash_on_cookie_config:
          oneOf:
            - $ref: "#/components/schemas/HashOnCookieConfig"
            - type: "null"
          description: >-
            Cookie attributes for `hash_on: "cookie:<name>"` sticky sessions.
            Ignored when `hash_on` is not cookie-based. Defaults are used if omitted.
        health_checks:
          oneOf:
            - $ref: "#/components/schemas/HealthCheckConfig"
            - type: "null"
        service_discovery:
          oneOf:
            - $ref: "#/components/schemas/ServiceDiscoveryConfig"
            - type: "null"
          description: >-
            Dynamic target discovery configuration. When set, discovered targets
            are merged with any static `targets`. Can be used as the sole target
            source (allowing `targets` to be empty).
        subsets:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/SubsetDefinition"
          description: |
            Named target subsets for DestinationRule-style routing. A proxy's
            `upstream_subset` selects one of these names. A target matches a
            subset when its `tags` are a superset of the subset's labels.
            Empty arrays are rejected; omit the field when no subsets are
            configured.
        port_overrides:
          type: object
          readOnly: true
          additionalProperties:
            $ref: "#/components/schemas/UpstreamPortOverride"
          description: >-
            Per-destination-port traffic policy projected from mesh
            DestinationRule `portLevelSettings`. Keys are decimal port numbers.
            A direct value in a create/update or file config is rejected; this
            field can appear in read responses for mesh-derived upstreams.
        source_locality:
          type: [string, "null"]
          readOnly: true
          description: >-
            Source workload locality in `region/zone/subzone` form, projected
            by mesh slice apply. A direct operator value is rejected.
        locality_lb_setting:
          oneOf:
            - $ref: "#/components/schemas/UpstreamLocalityLbSetting"
            - type: "null"
          readOnly: true
          description: >-
            Locality distribute/failover policy projected from a mesh
            DestinationRule. A direct operator value is rejected.
        backend_tls_client_cert_path:
          type: [string, "null"]
          description: >-
            Path to a PEM-encoded client certificate for mTLS with backend
            targets. When this upstream is referenced by a proxy, this TLS
            config takes precedence over the proxy's own backend TLS fields.
            Only meaningful for TLS-enabled backend schemes (`https`, `tcps`,
            `dtls`).
        backend_tls_client_key_path:
          type: [string, "null"]
          description: >-
            Path to a PEM-encoded private key matching
            `backend_tls_client_cert_path`. Required when the cert path is set.
        backend_tls_verify_server_cert:
          type: boolean
          default: true
          description: >-
            Whether to verify the backend server's TLS certificate. Set to
            `false` only for development/testing — disabling verification
            removes the security guarantees of TLS.
        backend_tls_server_ca_cert_path:
          type: [string, "null"]
          description: >-
            Path to a PEM CA bundle used as the sole trust anchor when
            verifying backend server certificates for this upstream. When
            set, the system/webpki trust store is NOT used (CA exclusivity).
        backend_tls_sni:
          type: [string, "null"]
          maxLength: 253
          description: >-
            Optional backend TLS Server Name Indication override. Mesh
            DestinationRule `trafficPolicy.tls.sni` projects to this field.
            Stored/projected only — backend handshake SNI consumption is not
            yet enforced (tracked by GAP-1B).
        backend_tls_san_allow_list:
          type: array
          maxItems: 256
          items:
            type: string
            maxLength: 2048
          default: []
          description: >-
            Optional allow-list of backend certificate Subject Alternative
            Names. Entries may be exact DNS names, IP literals, or SPIFFE URI
            SANs. Mesh DestinationRule `trafficPolicy.tls.subjectAltNames`
            projects to this field. Stored/projected only — SAN allow-list
            verification is not yet enforced (tracked by GAP-1C).
        locality_lb_strict:
          type: boolean
          default: false
          readOnly: true
          description: >-
            Strict local-first locality load balancing for this upstream. Mesh
            slice apply projects this from the `FERRUM_MESH_LOCALITY_LB_STRICT`
            environment flag onto mesh upstreams; it is `false` for non-mesh
            upstreams. When `true` and no source locality resolves, the load
            balancer restricts selection to local-cluster endpoints
            (fail-closed-to-local), widening to remote endpoints only when no
            local endpoint is healthy; when `false` (default) it returns the
            mixed local+remote pool (fail-open). Read-only / projected — a direct
            value in a create/update request body is REJECTED (set the env var
            instead); it can appear in `GET`/list responses.
        api_spec_id:
          type: [string, "null"]
          description: |
            ID of the `ApiSpec` that created this upstream via the spec-import admin
            API (`POST /api-specs`). `null` for upstreams created via direct admin
            endpoints (`POST /upstreams`). When set, `DELETE /api-specs/{id}` also
            deletes this upstream; `PUT /api-specs/{id}` replaces it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpstreamTarget:
      type: object
      required: [host, port]
      properties:
        host:
          type: string
          description: Backend hostname or IP
        port:
          type: integer
          format: uint16
        weight:
          type: integer
          format: uint32
          default: 1
          description: Relative weight for weighted round-robin
        tags:
          type: object
          default: {}
          additionalProperties:
            type: string
          description: Arbitrary key-value tags
        locality:
          type: [string, "null"]
          maxLength: 255
          description: >-
            Optional locality in `region`, `region/zone`, or
            `region/zone/subzone` form. Used by locality-aware load balancing.
        path:
          type: [string, "null"]
          description: >-
            Optional path prefix that overrides the proxy's backend_path when
            this target is selected by the load balancer. If omitted or null,
            the proxy's backend_path is used.

    SubsetDefinition:
      type: object
      required: [name, labels]
      properties:
        name:
          type: string
          maxLength: 128
          description: Name selected by `Proxy.upstream_subset`.
        labels:
          type: object
          additionalProperties:
            type: string
          description: |
            Exact label selector. A target matches when its `tags` contain all
            key/value pairs listed here.
        traffic_policy:
          oneOf:
            - $ref: "#/components/schemas/SubsetTrafficPolicy"
            - type: "null"
          description: Optional per-subset traffic policy overrides.

    SubsetTrafficPolicy:
      type: object
      properties:
        load_balancer_algorithm:
          oneOf:
            - $ref: "#/components/schemas/LoadBalancerAlgorithm"
            - type: "null"
          description: |
            Optional load-balancer algorithm override for this subset. When set,
            the subset uses this algorithm instead of the parent upstream's
            algorithm.
        hash_on:
          oneOf:
            - type: string
            - type: "null"
          description: |
            Optional hash-key source for subset-scoped consistent hashing. Uses
            the same syntax as `Upstream.hash_on`: `ip`, `header:<name>`, or
            `cookie:<name>`.
        tls:
          oneOf:
            - $ref: "#/components/schemas/MeshTrafficPolicyTls"
            - type: "null"
          readOnly: true
          description: >-
            Subset TLS origination policy projected from a mesh
            DestinationRule. Direct admin/file configuration is rejected; the
            field can appear in read responses for mesh-derived upstreams.
        connect_timeout_ms:
          type: [integer, "null"]
          format: uint64
          readOnly: true
          description: >-
            Subset backend-connect timeout projected from a mesh
            DestinationRule. Direct admin/file configuration is rejected.
        passive_health_check:
          oneOf:
            - $ref: "#/components/schemas/PassiveHealthCheck"
            - type: "null"
          readOnly: true
          description: >-
            Subset passive-health policy projected from mesh outlier detection.
            Direct admin/file configuration is rejected.

    MeshTrafficPolicyTls:
      type: object
      required: [mode, insecure_skip_verify]
      properties:
        mode:
          type: string
          enum: [disable, simple, mutual, istio_mutual]
          default: simple
          description: DestinationRule client-side TLS mode.
        sni:
          type: [string, "null"]
          description: Optional backend TLS Server Name Indication value.
        ca_certificates:
          type: [string, "null"]
          description: Optional path to a PEM CA bundle.
        client_certificate:
          type: [string, "null"]
          description: Client-certificate path required by `mutual` mode.
        private_key:
          type: [string, "null"]
          description: Private-key path required by `mutual` mode.
        subject_alt_names:
          type: array
          items:
            type: string
          default: []
          description: Allowed backend certificate Subject Alternative Names.
        insecure_skip_verify:
          type: boolean
          default: false
          description: Disable backend server-certificate verification.

    UpstreamLocalityLbSetting:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          default: true
        distribute:
          type: array
          items:
            $ref: "#/components/schemas/LocalityDistribute"
          description: Weighted target-locality distributions.
        failover:
          type: array
          items:
            $ref: "#/components/schemas/LocalityFailover"
          description: Source-region to failover-region mappings.

    LocalityDistribute:
      type: object
      required: [from]
      properties:
        from:
          type: string
          description: Source locality in `region/zone/subzone` form.
        to:
          type: object
          additionalProperties:
            type: integer
            format: uint32
          description: Target locality to relative-weight mapping.

    LocalityFailover:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: Source region.
        to:
          type: string
          description: Failover region.

    BackendTlsConfig:
      type: object
      properties:
        client_cert_path:
          type: [string, "null"]
          minLength: 1
        client_key_path:
          type: [string, "null"]
          minLength: 1
        server_ca_cert_path:
          type: [string, "null"]
          minLength: 1
        verify_server_cert:
          type: boolean
          default: true
        sni:
          type: [string, "null"]
          maxLength: 253
        san_allow_list:
          type: array
          maxItems: 256
          default: []
          items:
            type: string
            maxLength: 2048

    MeshRouteBackendTlsConfig:
      type: object
      additionalProperties: false
      description: |
        Strict route-local backend TLS override for mesh_route_dispatch.
        Unknown keys (for example `client_certpath` or
        `verify_server_certificate`) fail admission instead of silently
        disabling intended mTLS materials or verification.
      properties:
        client_cert_path:
          type: [string, "null"]
          minLength: 1
        client_key_path:
          type: [string, "null"]
          minLength: 1
        server_ca_cert_path:
          type: [string, "null"]
          minLength: 1
        verify_server_cert:
          type: boolean
          default: true
        sni:
          type: [string, "null"]
          maxLength: 253
        san_allow_list:
          type: array
          maxItems: 256
          default: []
          items:
            type: string
            maxLength: 2048

    MeshRouteRetryConfig:
      type: object
      additionalProperties: false
      description: |
        Strict route-local retry policy for mesh_route_dispatch. Unknown keys
        (for example `max_retry` or `retry_on_connect_failur`) fail admission
        instead of silently falling back to defaults.
      properties:
        max_retries:
          type: integer
          format: uint32
          default: 3
        retryable_status_codes:
          type: array
          items:
            type: integer
            format: uint16
          default: []
        retryable_methods:
          type: array
          items:
            type: string
            enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, TRACE, CONNECT]
          maxItems: 9
          default: [GET, HEAD, OPTIONS, PUT, DELETE]
        backoff:
          $ref: "#/components/schemas/MeshRouteBackoffStrategy"
        retry_on_connect_failure:
          type: boolean
          default: true

    MeshRouteBackoffStrategy:
      description: Strict route-local retry delay strategy for mesh_route_dispatch.
      oneOf:
        - type: object
          title: Fixed delay
          required: [fixed]
          additionalProperties: false
          properties:
            fixed:
              type: object
              required: [delay_ms]
              additionalProperties: false
              properties:
                delay_ms:
                  type: integer
                  format: uint64
                  default: 100
        - type: object
          title: Exponential backoff
          required: [exponential]
          additionalProperties: false
          properties:
            exponential:
              type: object
              required: [base_ms, max_ms]
              additionalProperties: false
              properties:
                base_ms:
                  type: integer
                  format: uint64
                max_ms:
                  type: integer
                  format: uint64
      default:
        fixed:
          delay_ms: 100

    TcpKeepaliveCfg:
      type: object
      properties:
        time_seconds:
          type: [integer, "null"]
          format: uint32
          minimum: 1
        interval_seconds:
          type: [integer, "null"]
          format: uint32
          minimum: 1
        probes:
          type: [integer, "null"]
          format: uint32
          minimum: 1

    H2UpgradePolicy:
      type: string
      enum: [DEFAULT, UPGRADE, DO_NOT_UPGRADE]
      description: Mesh backend HTTP/2 upgrade policy.

    UpstreamPortOverride:
      type: object
      properties:
        connect_timeout_ms:
          type: [integer, "null"]
          format: uint64
        algorithm:
          oneOf:
            - $ref: "#/components/schemas/LoadBalancerAlgorithm"
            - type: "null"
        hash_on:
          type: [string, "null"]
        passive_health_check:
          oneOf:
            - $ref: "#/components/schemas/PassiveHealthCheck"
            - type: "null"
        locality_lb_setting:
          oneOf:
            - $ref: "#/components/schemas/UpstreamLocalityLbSetting"
            - type: "null"
        max_connections:
          type: [integer, "null"]
          format: uint32
        tcp_keepalive:
          oneOf:
            - $ref: "#/components/schemas/TcpKeepaliveCfg"
            - type: "null"
        http_max_requests_per_connection:
          type: [integer, "null"]
          format: uint32
          deprecated: true
          description: Legacy mesh carrier; not applied by runtime dispatch.
        http_idle_timeout_ms:
          type: [integer, "null"]
          format: uint64
        h2_max_concurrent_streams:
          type: [integer, "null"]
          format: uint32
        tls:
          oneOf:
            - $ref: "#/components/schemas/BackendTlsConfig"
            - type: "null"
        h2_upgrade_policy:
          oneOf:
            - $ref: "#/components/schemas/H2UpgradePolicy"
            - type: "null"
        max_retries:
          type: [integer, "null"]
          format: uint32
        http1_max_pending_requests:
          type: [integer, "null"]
          format: uint32

    LoadBalancerAlgorithm:
      type: string
      enum:
        - round_robin
        - weighted_round_robin
        - least_connections
        - least_latency
        - consistent_hashing
        - random
        - passthrough
      default: round_robin
      description: >-
        Load-balancing algorithm. `passthrough` (mesh DestinationRule
        `loadBalancer.simple=PASSTHROUGH`) dials the request's captured original
        destination when it matches a target in the upstream's pool, bypassing
        load balancing; requests with no captured original destination, or one
        that matches no (healthy) pool target, fall back to round-robin. Outside
        the mesh capture data path no original destination is available, so
        `passthrough` behaves as `round_robin`.

    # ── Hash-On Cookie Config ────────────────────────────────────────
    HashOnCookieConfig:
      type: object
      description: >-
        Cookie attributes for `hash_on: "cookie:<name>"` sticky sessions.
        Controls the Set-Cookie header injected when a new session is established.
      properties:
        path:
          type: string
          default: "/"
          description: Cookie `Path` attribute.
        ttl_seconds:
          type: integer
          default: 3600
          description: Cookie `Max-Age` in seconds (default 1 hour).
        domain:
          type: [string, "null"]
          description: Optional `Domain` attribute.
        http_only:
          type: boolean
          default: true
          description: Set `HttpOnly` flag.
        secure:
          type: boolean
          default: false
          description: Set `Secure` flag.
        same_site:
          type: [string, "null"]
          enum: [Strict, Lax, None, null]
          description: '`SameSite` attribute.'

    # ── Health Checks ───────────────────────────────────────────────
    HealthCheckConfig:
      type: object
      properties:
        active:
          oneOf:
            - $ref: "#/components/schemas/ActiveHealthCheck"
            - type: "null"
        passive:
          oneOf:
            - $ref: "#/components/schemas/PassiveHealthCheck"
            - type: "null"

    ActiveHealthCheck:
      type: object
      properties:
        http_path:
          type: string
          default: /health
          description: HTTP path to probe
        interval_seconds:
          type: integer
          format: uint64
          default: 10
          description: Seconds between probes
        timeout_ms:
          type: integer
          format: uint64
          default: 5000
          description: Probe timeout in milliseconds
        healthy_threshold:
          type: integer
          format: uint32
          default: 3
          description: Consecutive healthy probes to mark target healthy
        unhealthy_threshold:
          type: integer
          format: uint32
          default: 3
          description: Consecutive unhealthy probes to mark target unhealthy
        healthy_status_codes:
          type: array
          items:
            type: integer
            format: uint16
          default: [200, 302]
          description: Status codes considered healthy (HTTP probe only)
        probe_type:
          type: string
          enum: [http, tcp, udp, grpc]
          default: http
          description: |
            Type of health probe.
            `http` — HTTP GET request (default).
            `tcp` — TCP SYN connection probe.
            `udp` — UDP probe with optional payload.
            `grpc` — gRPC health check using `grpc.health.v1.Health/Check`.
        udp_probe_payload:
          type: [string, "null"]
          description: |
            Hex-encoded payload to send for UDP probes (e.g., "0000").
            If omitted, a single zero byte is sent.
        grpc_service_name:
          type: [string, "null"]
          description: |
            Service name for gRPC health check requests
            (`grpc.health.v1.Health/Check`). Empty/null (default) checks the
            overall server health. Only used when `probe_type: grpc`.
        use_tls:
          type: boolean
          default: false
          description: Use HTTPS for HTTP probes

    PassiveHealthCheck:
      type: object
      properties:
        unhealthy_status_codes:
          type: array
          items:
            type: integer
            format: uint16
          default: [500, 502, 503, 504]
          description: Status codes that count toward the unhealthy threshold
        unhealthy_threshold:
          type: integer
          format: uint32
          default: 3
          description: Failures within the window to mark target unhealthy
        unhealthy_window_seconds:
          type: integer
          format: uint64
          default: 30
          description: Sliding window for counting failures
        healthy_after_seconds:
          type: integer
          format: uint64
          default: 30
          description: |
            Seconds after which an unhealthy target is automatically restored
            to the rotation. Acts as a recovery timer / half-open circuit
            breaker. Default: 30 seconds. Set to 0 to disable automatic
            recovery (rely on active health checks or all-unhealthy fallback
            only). On-success recovery is always active in addition to this
            timer.
        max_ejection_percent:
          type: [integer, "null"]
          format: uint8
          minimum: 0
          maximum: 100
          description: |
            Maximum percentage of targets that may be passively ejected at the
            same time. When passive ejections exceed this cap, the earliest
            passive ejections are re-admitted first. Null means no cap.
        gateway_error_codes:
          type: [array, "null"]
          items:
            type: integer
            format: uint16
          description: |
            Reserved for DestinationRule parity. Validated and persisted, but
            not yet applied by passive health at runtime.
        split_external_local_origin_errors:
          type: [boolean, "null"]
          description: |
            Reserved for DestinationRule parity. Validated and persisted, but
            not yet applied by passive health at runtime.

    # ── Service Discovery ──────────────────────────────────────────
    ServiceDiscoveryConfig:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [dns_sd, kubernetes, consul, mesh]
          description: Service discovery provider type
        dns_sd:
          type: [object, "null"]
          description: DNS-SD (SRV record) configuration. Required when provider is `dns_sd`.
          required: [service_name]
          properties:
            service_name:
              type: string
              description: DNS name to query for SRV records (e.g., `_http._tcp.my-service.example.com`)
            poll_interval_seconds:
              type: integer
              format: uint64
              default: 30
              description: Re-query interval in seconds
        kubernetes:
          type: [object, "null"]
          description: Kubernetes EndpointSlice configuration. Required when provider is `kubernetes`.
          required: [service_name]
          properties:
            service_name:
              type: string
              description: Kubernetes service name
            namespace:
              type: string
              default: default
              description: Kubernetes namespace
            port_name:
              type: [string, "null"]
              description: Named port to select from EndpointSlice
            label_selector:
              type: [string, "null"]
              description: >-
                Label selector used to filter EndpointSlices (matches the
                Kubernetes `labelSelector` syntax, e.g.
                `app=my-svc,tier=backend`). Optional; when omitted all
                EndpointSlices for the service are considered.
            poll_interval_seconds:
              type: integer
              format: uint64
              default: 30
        consul:
          type: [object, "null"]
          description: HashiCorp Consul configuration. Required when provider is `consul`.
          required: [address, service_name]
          properties:
            address:
              type: string
              description: Consul HTTP API address (e.g., `http://consul:8500`)
            service_name:
              type: string
              description: Service name registered in Consul
            datacenter:
              type: [string, "null"]
              description: Datacenter filter (uses local datacenter if not set)
            tag:
              type: [string, "null"]
              description: Service tag filter
            healthy_only:
              type: boolean
              default: true
              description: Only return healthy services
            token:
              type: [string, "null"]
              description: Consul ACL token for authentication
            poll_interval_seconds:
              type: integer
              format: uint64
              default: 30
        mesh:
          type: [object, "null"]
          description: Ferrum mesh service configuration. Required when provider is `mesh`.
          required: [service_name]
          properties:
            service_name:
              type: string
              description: Mesh service name from the CP-delivered mesh model
            namespace:
              type: [string, "null"]
              description: Mesh namespace override. Defaults to the upstream namespace when omitted.
            port:
              type: [integer, "null"]
              format: uint16
              description: Mesh service port to select. Defaults to the first service/workload port.
            poll_interval_seconds:
              type: integer
              format: uint64
              default: 30
            topology:
              type: string
              enum: [ambient, sidecar]
              default: ambient
              description: |
                Destination mesh topology; selects the mesh transport
                discovered targets are tagged for. `ambient` tags targets for
                HBONE dispatch (HTTP/2 CONNECT over SVID mTLS to the peer's
                `:15008` listener); `sidecar` tags targets for plain SVID-mTLS
                HTTP/2 dispatch to the peer sidecar's `:15006` inbound
                listener. Sidecar peers have no HBONE listener, so the
                topology must match the destination mesh or dispatch fails
                closed.
        default_weight:
          type: integer
          format: uint32
          default: 1
          description: Default weight assigned to discovered targets
      allOf:
        - if:
            required: [provider]
            properties:
              provider:
                const: dns_sd
          then:
            required: [dns_sd]
            properties:
              dns_sd:
                type: object
        - if:
            required: [provider]
            properties:
              provider:
                const: kubernetes
          then:
            required: [kubernetes]
            properties:
              kubernetes:
                type: object
        - if:
            required: [provider]
            properties:
              provider:
                const: consul
          then:
            required: [consul]
            properties:
              consul:
                type: object
        - if:
            required: [provider]
            properties:
              provider:
                const: mesh
          then:
            required: [mesh]
            properties:
              mesh:
                type: object

    MeshEgressScopeResponse:
      type: object
      required: [namespace, scope, health]
      properties:
        namespace:
          type: string
        scope:
          $ref: "#/components/schemas/MeshEgressScopeSnapshot"
        health:
          $ref: "#/components/schemas/MeshEgressScopeHealth"

    MeshEgressScopeSnapshot:
      type: object
      required:
        - sidecar_enforced
        - dry_run
        - sidecar_applied
        - sidecar_admitted_services
        - sidecar_denied_services
        - sidecar_admitted_destination_rules
        - sidecar_denied_destination_rules
      properties:
        sidecar_enforced:
          type: boolean
        dry_run:
          type: boolean
        sidecar_applied:
          type: boolean
        sidecar_admitted_services:
          type: integer
          format: uint64
        sidecar_denied_services:
          type: integer
          format: uint64
        destination_rules:
          type: array
          items:
            $ref: "#/components/schemas/MeshEgressScopeResource"
        sidecar_admitted_destination_rules:
          type: integer
          format: uint64
        sidecar_denied_destination_rules:
          type: integer
          format: uint64
        services:
          type: array
          items:
            $ref: "#/components/schemas/MeshEgressScopeResource"
        service_entries:
          type: array
          items:
            $ref: "#/components/schemas/MeshEgressScopeResource"
        known_destinations:
          type: array
          items:
            type: string

    MeshEgressScopeResource:
      type: object
      required: [namespace, name]
      properties:
        namespace:
          type: string
        name:
          type: string
        hosts:
          type: array
          items:
            type: string
        ports:
          type: array
          items:
            type: integer
            format: uint16

    MeshEgressScopeHealth:
      type: object
      required: [sidecar_admitted_services, sidecar_denied_services]
      properties:
        sidecar_admitted_services:
          type: integer
          format: uint64
        sidecar_denied_services:
          type: integer
          format: uint64

    MeshHealthResponse:
      type: object
      required: [egress_scope]
      properties:
        egress_scope:
          $ref: "#/components/schemas/MeshEgressScopeHealth"

    # ── Health response ─────────────────────────────────────────────
    HealthResponse:
      type: object
      description: |
        Tiered: unauthenticated callers receive only `status` and `ready`. The
        remaining detailed fields (`timestamp`, `mode`, `database`,
        `admin_writes_enabled`, `cached_config`, `database_polling`,
        `config_rejected`, `mesh`, `listener_failures`, `logging`) are
        present only when the caller is authenticated (admin JWT, metrics bearer
        token, or allowlisted CIDR).
      required: [status, ready]
      properties:
        status:
          type: string
          enum: [ok, degraded, starting, unavailable]
          description: |
            Aggregate gateway health.
            `ok` — fully ready and healthy (200). Also returned for
            intentionally read-only deployments (admin API in read-only mode
            with a healthy DB) — `admin_writes_enabled` is the right signal
            for that, not `status`.
            `degraded` — ready but the configured database is currently
            unavailable (still 200; the gateway continues to serve from
            cached config). Intentional read-only mode does NOT set
            `degraded`.
            `starting` — startup not yet complete (returned with 503 and
            `ready: false`).
            `unavailable` — the gateway became ready but a serving listener
            task later exited with an error (CP gRPC or admin HTTP/HTTPS
            server, a DP proxy/admin listener, or a mesh traffic/admin
            listener). This is a sticky, monotonic
            degradation: it stays set across a later readiness restore
            (returned with 503 and `ready: false`). CP, DP, and mesh modes
            report it.
        ready:
          type: boolean
          description: |
            `true` once the gateway has finished startup AND no supervised
            serving listener has failed since. While `false`, the endpoint
            returns `503 Service Unavailable`. In CP/DP/mesh modes a post-startup
            serving-listener failure sets `ready: false` durably (sticky) even
            though internal startup completed.
        admin_writes_enabled:
          type: boolean
          description: |
            `true` when the admin API will accept writes. `false` when the
            admin API is in read-only mode or when the database is currently
            unavailable. When `false` and read-only mode is not configured,
            `status` is forced to `degraded`.
        timestamp:
          type: string
          format: date-time
        mode:
          type: string
          description: Gateway operating mode
          examples:
            - cp
            - dp
            - file
        database:
          type: object
          description: |
            Database connectivity info. Present only when the gateway has a
            configured database (database/cp/dp modes); absent in file mode.
          required: [status]
          properties:
            status:
              type: string
              enum: [connected, disconnected]
            type:
              type: string
              description: Database engine type. Present only when connected.
              examples:
                - postgres
                - mysql
                - sqlite
            error:
              type: [string, "null"]
              description: Error message when disconnected
            pool:
              type: object
              description: |
                Connection pool statistics (SQL backends only; absent for MongoDB).
                Present only when status is `connected`.
              properties:
                size:
                  type: integer
                  description: Current connections managed by the pool (idle + active)
                idle:
                  type: integer
                  description: Connections available for checkout
                active:
                  type: integer
                  description: Connections currently in use
                max_connections:
                  type: integer
                  description: Configured maximum (FERRUM_DB_POOL_MAX_CONNECTIONS)
                min_connections:
                  type: integer
                  description: Configured minimum idle (FERRUM_DB_POOL_MIN_CONNECTIONS)
                read_replica:
                  type: object
                  description: Read replica pool stats (present only when FERRUM_DB_READ_REPLICA_URL is configured)
                  properties:
                    size:
                      type: integer
                    idle:
                      type: integer
                    active:
                      type: integer
        cached_config:
          type: object
          required: [available]
          properties:
            available:
              type: boolean
            loaded_at:
              type: string
              format: date-time
              description: Present only when `available` is true
            proxy_count:
              type: integer
              description: Present only when `available` is true
            consumer_count:
              type: integer
              description: Present only when `available` is true
        database_polling:
          $ref: "#/components/schemas/DatabaseDeltaPollingHealth"
        config_rejected:
          type: boolean
          description: |
            Database and control-plane modes only, authenticated detail only.
            Present and `true` when the latest **full** config load was rejected
            by the runtime-config validation contract (a reachable backend served
            a semantically-invalid snapshot). The gateway keeps serving the last
            known-good config and, because the backend is reachable, keeps the
            admin API writable (`admin_writes_enabled` stays `true`) so the
            offending resource can be repaired in-band; `status` is forced to
            `degraded`. Re-enabling writes is gated on any deferred schema
            migration applying first, so a reachable backend with a still-pending
            schema keeps writes blocked while this flag stays set. The flag is
            sticky and clears only when an accepted authoritative **full** reload
            proves the offending resource is gone (an accepted incremental poll
            does not clear it). While the backend is unreachable
            (`admin_writes_enabled` false) this detail is suppressed so it never
            advertises the writable repair path during an outage, even though the
            underlying flag remains set. A genuine connectivity failure is
            reported via `admin_writes_enabled`/`status` instead and does not set
            this flag.
        mesh:
          $ref: "#/components/schemas/MeshHealthResponse"
        listener_failures:
          $ref: "#/components/schemas/ServingListenerFailureSnapshot"
        logging:
          $ref: "#/components/schemas/LoggingSinkSnapshot"

    ServingListenerFailureSnapshot:
      type: object
      description: |
        Sticky process-lifetime snapshot of supervised listeners that exited
        after successful bind. Error text is intentionally sanitized.
      required: [failures_total, failures]
      properties:
        failures_total:
          type: integer
          format: uint64
        failures:
          type: array
          items:
            type: object
            required: [listener, listen_port, error, kind]
            properties:
              listener:
                type: string
              listen_port:
                type: integer
                format: uint16
              error:
                type: string
                enum: [listener serve task exited after successful bind]
              kind:
                type: string
                enum: [serve_failed]

    # ── Overload ──────────────────────────────────────────────────
    OverloadNoProxyState:
      type: object
      description: |
        Returned in control-plane mode where no proxy state exists.
      required: [level, message]
      properties:
        level:
          type: string
          enum: [normal]
        message:
          type: string
          example: No proxy state available

    OverloadLevelOnly:
      type: object
      description: |
        Coarse, LB-safe overload view returned to unauthenticated callers — only
        the level, with no resource internals. The full `OverloadSnapshot` is
        returned to authenticated callers (admin JWT / metrics token / allowlisted
        CIDR).
      required: [level]
      properties:
        level:
          type: string
          enum: [normal, pressure, critical]

    NodeWaypointDropSnapshot:
      type: object
      required:
        - cookie_unavailable
        - unknown_cookie
        - missing_pod_uid
        - missing_workload_hash
        - unknown_pod
        - hash_mismatch
      properties:
        cookie_unavailable:
          type: integer
          format: uint64
          description: Connections dropped because the socket cookie was unavailable.
        unknown_cookie:
          type: integer
          format: uint64
          description: Connections dropped because the socket cookie was not enrolled.
        missing_pod_uid:
          type: integer
          format: uint64
          description: Connections dropped because the cookie record had no pod UID.
        missing_workload_hash:
          type: integer
          format: uint64
          description: Connections dropped because the cookie record had no workload identity hash.
        unknown_pod:
          type: integer
          format: uint64
          description: Connections dropped because the pod UID was absent from the identity index.
        hash_mismatch:
          type: integer
          format: uint64
          description: Connections dropped because the cookie and workload identity hashes differed.

    OverloadSnapshot:
      type: object
      required: [level, draining, active_connections, active_requests, red_drop_probability_pct, port_exhaustion_events, node_waypoint_drops, pressure, actions, stream_listeners]
      properties:
        level:
          type: string
          enum: [normal, pressure, critical]
          description: Current overload severity level
        draining:
          type: boolean
          description: Whether the gateway is draining connections for shutdown
        active_connections:
          type: integer
          format: uint64
          description: Number of currently active proxy connections
        active_requests:
          type: integer
          format: uint64
          description: Number of currently in-flight requests/streams (H1 requests, H2/gRPC streams, H3 streams)
        red_drop_probability_pct:
          type: number
          format: double
          description: RED (Random Early Detection) drop probability percentage (0-100)
        port_exhaustion_events:
          type: integer
          format: uint64
          description: Monotonic count of EADDRNOTAVAIL errors (ephemeral port exhaustion). Alert when this value increases.
        node_waypoint_drops:
          $ref: "#/components/schemas/NodeWaypointDropSnapshot"
        pressure:
          type: object
          required: [file_descriptors, connections, requests, event_loop_latency_us]
          properties:
            file_descriptors:
              type: object
              required: [current, max, ratio]
              properties:
                current:
                  type: integer
                  format: uint64
                max:
                  type: integer
                  format: uint64
                ratio:
                  type: number
                  format: double
                  description: current / max (0.0–1.0)
            connections:
              type: object
              required: [current, max, ratio]
              properties:
                current:
                  type: integer
                  format: uint64
                max:
                  type: integer
                  format: uint64
                ratio:
                  type: number
                  format: double
                  description: current / max (0.0–1.0)
            requests:
              type: object
              required: [current, max, ratio]
              properties:
                current:
                  type: integer
                  format: uint64
                max:
                  type: integer
                  format: uint64
                ratio:
                  type: number
                  format: double
                  description: current / max (0.0–1.0). 0.0 when FERRUM_MAX_REQUESTS=0 (unlimited)
            event_loop_latency_us:
              type: integer
              format: uint64
              description: Event loop scheduling latency in microseconds
        actions:
          type: object
          required: [disable_keepalive, reject_new_connections, reject_new_requests]
          properties:
            disable_keepalive:
              type: boolean
              description: Whether Connection:close is being sent on responses
            reject_new_connections:
              type: boolean
              description: Whether new connections are being refused
            reject_new_requests:
              type: boolean
              description: Whether new requests/streams are being rejected with 503
        stream_listeners:
          type: object
          description: |
            Stream-listener (TCP/UDP/DTLS) diagnostics. Present only when the
            gateway has a proxy state (absent in control-plane mode).
          required: [dtls_demux_sessions_total, dtls_demux_sessions, bind_failures_total, bind_failures]
          properties:
            dtls_demux_sessions_total:
              type: integer
              format: uint64
              description: Total pre-handshake DTLS demux sessions across all UDP+DTLS listeners (eventually consistent).
            dtls_demux_sessions:
              type: array
              description: Per-listener pre-handshake DTLS demux session counts.
              items:
                type: object
                required: [listener_key, listen_port, sessions]
                properties:
                  listener_key:
                    type: string
                  listen_port:
                    type: integer
                    format: uint16
                  sessions:
                    type: integer
                    format: uint64
            bind_failures_total:
              type: integer
              description: |
                Number of configured stream-listener resources that are NOT
                serving after the most recent config reconcile or a subsequent
                asynchronous listener-task failure — hard bind failures PLUS
                listeners deferred/degraded for a config reason (e.g. a
                `frontend_tls` listener still waiting for TLS material).
                In DP mode these binds are intentionally non-fatal (a bad
                CP-pushed config must not brick the data plane), so this count
                surfaces the non-serving listeners beyond the warn log. `0` once
                every configured stream listener is serving. Each entry's `kind`
                distinguishes a hard failure from a deferral.
            bind_failures:
              type: array
              description: |
                Structured per-resource stream-listener non-serving reasons from
                the most recent reconcile plus subsequent asynchronous listener-task
                failures, classified by `kind`. Shared SNI listener failures emit one
                entry per affected proxy ID. Empty once every configured stream
                listener is serving.
              items:
                type: object
                required: [proxy_id, listen_port, error, kind]
                properties:
                  proxy_id:
                    type: string
                    description: ID of the proxy whose stream listener is not serving.
                  listen_port:
                    type: integer
                    format: uint16
                    description: The listen port that could not be bound or is deferred.
                  error:
                    type: string
                    description: 'Human-readable reason (e.g. "port already in use", "Deferred: frontend_tls TCP listener requires a rustls ServerConfig").'
                  kind:
                    type: string
                    enum:
                      - bind_failed
                      - backend_tls_invalid
                      - backend_tls_rotation_invalid
                      - frontend_tls_deferred
                      - frontend_dtls_deferred
                      - frontend_dtls_build_failed
                    description: |
                      Classification of why the listener is not serving.
                      `bind_failed`, `backend_tls_invalid`, and
                      `backend_tls_rotation_invalid` are hard failures (the
                      startup path treats these as fatal in file/database mode);
                      the `frontend_*` variants are non-fatal deferrals/degradations
                      that clear once TLS material is loaded or corrected.
        listener_failures:
          $ref: "#/components/schemas/ServingListenerFailureSnapshot"

    # ── Runtime metrics ─────────────────────────────────────────────
    RuntimeMetricsSnapshot:
      type: object
      required: [timestamp, uptime_seconds, mode, ferrum_version, system, http, errors, dns, connections, logs, overload]
      properties:
        timestamp:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
          format: uint64
        mode:
          type: string
          enum: [database, file, cp, dp, mesh, node_agent, injector, migrate]
        ferrum_version:
          type: string
        system:
          $ref: "#/components/schemas/RuntimeSystemSnapshot"
        http:
          $ref: "#/components/schemas/RuntimeHttpSnapshot"
        errors:
          $ref: "#/components/schemas/RuntimeErrorsSnapshot"
        dns:
          $ref: "#/components/schemas/RuntimeDnsSnapshot"
        connections:
          $ref: "#/components/schemas/RuntimeConnectionsSnapshot"
        logs:
          $ref: "#/components/schemas/RuntimeLogsSnapshot"
        overload:
          $ref: "#/components/schemas/OverloadSnapshot"

    RuntimeSystemSnapshot:
      type: object
      required: [sampled_at_unix_ms, platform, cpu, memory, file_descriptors, ephemeral_ports]
      properties:
        sampled_at_unix_ms:
          type: integer
          format: uint64
        platform:
          type: string
          enum: [linux, macos, windows, other]
        cpu:
          type: object
          properties:
            process_percent: { type: number, format: float }
            system_percent: { type: [number, "null"], format: float }
            cgroup_quota_percent: { type: [number, "null"], format: float }
            cpu_count: { type: integer }
        memory:
          type: object
          properties:
            rss_bytes: { type: integer, format: uint64 }
            virtual_bytes: { type: integer, format: uint64 }
            host_percent: { type: [number, "null"], format: float }
            cgroup_percent: { type: [number, "null"], format: float }
            cgroup_limit_bytes: { type: [integer, "null"], format: uint64 }
            jemalloc_allocated_bytes: { type: [integer, "null"], format: uint64 }
            jemalloc_resident_bytes: { type: [integer, "null"], format: uint64 }
        file_descriptors:
          type: object
          properties:
            current: { type: integer, format: uint64 }
            max: { type: integer, format: uint64 }
            ratio: { type: number, format: double }
        ephemeral_ports:
          type: object
          properties:
            range_low: { type: [integer, "null"] }
            range_high: { type: [integer, "null"] }
            range_size: { type: [integer, "null"] }
            exhaustion_events: { type: integer, format: uint64 }
            active_outbound_estimate: { type: integer, format: uint64 }

    RuntimeHttpSnapshot:
      type: object
      properties:
        total_requests: { type: integer, format: uint64 }
        requests_per_second_1s: { type: integer, format: uint64 }
        requests_per_second_1m: { type: integer, format: uint64 }
        requests_per_second_5m: { type: integer, format: uint64 }
        client_disconnects: { type: integer, format: uint64 }
        status_codes:
          type: object
          properties:
            totals:
              type: object
              additionalProperties: { type: integer, format: uint64 }
            rate_1s:
              type: object
              additionalProperties: { type: integer, format: uint64 }
            rate_1m:
              type: object
              additionalProperties: { type: integer, format: uint64 }
            rate_5m:
              type: object
              additionalProperties: { type: integer, format: uint64 }
            percent_total:
              type: object
              additionalProperties: { type: number, format: double }
            percent_1m:
              type: object
              additionalProperties: { type: number, format: double }
            percent_5m:
              type: object
              additionalProperties: { type: number, format: double }

    RuntimeErrorsSnapshot:
      type: object
      properties:
        by_class:
          type: object
          additionalProperties:
            type: object
            properties:
              http: { type: integer, format: uint64 }
              grpc: { type: integer, format: uint64 }
              stream: { type: integer, format: uint64 }
              body: { type: integer, format: uint64 }
        by_proxy:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
              format: uint64

    RuntimeDnsSnapshot:
      type: object
      properties:
        lookups_total: { type: integer, format: uint64 }
        cache_hits: { type: integer, format: uint64 }
        cache_misses: { type: integer, format: uint64 }
        stale_serves: { type: integer, format: uint64 }
        errors: { type: integer, format: uint64 }
        hit_ratio: { type: number, format: double }
        error_ratio: { type: number, format: double }
        cache_entries: { type: integer }

    RuntimeConnectionsSnapshot:
      type: object
      properties:
        active: { type: integer, format: uint64 }
        active_requests: { type: integer, format: uint64 }
        pool_handshakes_total: { type: object, additionalProperties: { type: integer, format: uint64 } }
        pool_evictions_total: { type: object, additionalProperties: { type: integer, format: uint64 } }
        pool_failures_total: { type: object, additionalProperties: { type: integer, format: uint64 } }
        tcp_rst_observed:
          type: object
          properties:
            by_proxy:
              type: object
              additionalProperties:
                type: object
                additionalProperties: { type: integer, format: uint64 }
            total: { type: integer, format: uint64 }

    RuntimeLogsSnapshot:
      type: object
      description: Ferrum project tracing event counters and bounded process-sink health/loss telemetry.
      properties:
        by_level:
          type: object
          additionalProperties:
            type: integer
            format: uint64
        by_category:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
              format: uint64
        sinks:
          $ref: "#/components/schemas/LoggingSinkSnapshot"

    LoggingSinkSnapshot:
      type: object
      description: >-
        Authenticated stdout/stderr diagnostics. Stdout combines runtime
        stdout events and stdout_logging access records because both use the
        same bounded queue; stderr is independent.
      required: [stdout, stderr]
      properties:
        stdout:
          oneOf:
            - $ref: "#/components/schemas/LoggingSinkState"
            - type: "null"
        stderr:
          oneOf:
            - $ref: "#/components/schemas/LoggingSinkState"
            - type: "null"

    LoggingSinkState:
      type: object
      required:
        - sink
        - healthy
        - accepting
        - queue_capacity_records
        - queue_capacity_bytes
        - max_record_bytes
        - queued_records
        - reserved_bytes
        - queued_bytes
        - accepted_records_total
        - saturation_dropped_records_total
        - oversized_dropped_records_total
        - closed_dropped_records_total
        - writer_failures_total
        - flush_failures_total
        - shutdown_timeouts_total
        - shutdown_incomplete_records_total
        - last_failure
      properties:
        sink: { type: string, enum: [stdout, stderr] }
        healthy: { type: boolean }
        accepting: { type: boolean }
        queue_capacity_records:
          type: integer
          description: Hard admitted-record limit; the byte budget may limit admission first.
        queue_capacity_bytes:
          type: integer
          description: Aggregate per-sink serialized-payload reservation limit for admitted records.
        max_record_bytes:
          type: integer
          description: Per-record serialization limit and provisional pre-serialization reservation.
        queued_records:
          type: integer
          description: Records admitted but not yet completed by the writer.
        reserved_bytes:
          type: integer
          description: >-
            Current byte reservations. A producer initially reserves
            max_record_bytes; after serialization an exact-sized payload is
            queued and this shrinks to the record length until write completion.
        queued_bytes:
          type: integer
          description: Actual serialized bytes admitted but not yet completed by the writer.
        accepted_records_total: { type: integer, format: uint64 }
        saturation_dropped_records_total: { type: integer, format: uint64 }
        oversized_dropped_records_total: { type: integer, format: uint64 }
        closed_dropped_records_total: { type: integer, format: uint64 }
        writer_failures_total: { type: integer, format: uint64 }
        flush_failures_total: { type: integer, format: uint64 }
        shutdown_timeouts_total: { type: integer, format: uint64 }
        shutdown_incomplete_records_total: { type: integer, format: uint64 }
        last_failure:
          oneOf:
            - type: object
              required: [operation, error_kind, occurred_at]
              properties:
                operation: { type: string, enum: [write, flush, shutdown] }
                error_kind: { type: string }
                occurred_at: { type: string, format: date-time }
            - type: "null"

    DatabaseDeltaPollingDegraded:
      type: object
      description: |
        Active database incremental-delta rejection state. Labels are bounded
        enums and never include raw resource IDs.
      required:
        - reason
        - resource_category
        - validation_category
        - consecutive_identical_rejections
        - current_backoff_bucket
        - current_backoff_seconds
        - escalated
      properties:
        reason:
          type: string
          enum: [rejected_incremental_delta, rejected_incremental_delta_escalated]
        resource_category:
          type: string
          enum: [none, proxy, consumer, plugin_config, upstream, mixed]
        validation_category:
          type: string
          enum: [security_plugin, duplicate_route, listener, upstream_reference, plugin_reference, tls, other]
        consecutive_identical_rejections:
          type: integer
          format: int64
        current_backoff_bucket:
          type: string
          enum: [none, lt_5s, lt_30s, lt_5m, gte_5m, max]
        current_backoff_seconds:
          type: integer
          format: int64
        escalated:
          type: boolean

    DatabaseDeltaPollingHealth:
      type: object
      description: |
        Database-mode polling health for rejected incremental deltas. Present
        only in database mode. When `status` is `degraded`, the gateway keeps
        serving the last known-good runtime config and leaves the accepted poll
        cursor unchanged.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        reason:
          type: string
          enum: [rejected_incremental_delta, rejected_incremental_delta_escalated]
        resource_category:
          type: string
          enum: [none, proxy, consumer, plugin_config, upstream, mixed]
        validation_category:
          type: string
          enum: [security_plugin, duplicate_route, listener, upstream_reference, plugin_reference, tls, other]
        consecutive_identical_rejections:
          type: integer
          format: int64
        current_backoff_bucket:
          type: string
          enum: [none, lt_5s, lt_30s, lt_5m, gte_5m, max]
        current_backoff_seconds:
          type: integer
          format: int64
        escalated:
          type: boolean

    DatabaseDeltaPollingMetrics:
      type: object
      description: |
        Bounded metrics for database incremental-delta validation rejections.
        Resource-category and backoff dimensions are fixed enum labels; raw
        resource IDs are never exposed as metric labels.
      required:
        - rejected_deltas_total
        - rejected_deltas_by_resource_category
        - consecutive_identical_rejections
        - current_backoff_bucket
        - current_backoff_seconds
        - forced_full_reloads_total
        - recoveries_total
        - last_resource_category
      properties:
        rejected_deltas_total:
          type: integer
          format: int64
        rejected_deltas_by_resource_category:
          type: object
          description: |
            Counts keyed by fixed resource-category labels:
            `none`, `proxy`, `consumer`, `plugin_config`, `upstream`, `mixed`.
          additionalProperties:
            type: integer
            format: int64
        consecutive_identical_rejections:
          type: integer
          format: int64
        current_backoff_bucket:
          type: string
          enum: [none, lt_5s, lt_30s, lt_5m, gte_5m, max]
        current_backoff_seconds:
          type: integer
          format: int64
        forced_full_reloads_total:
          type: integer
          format: int64
        recoveries_total:
          type: integer
          format: int64
        last_resource_category:
          type: string
          enum: [none, proxy, consumer, plugin_config, upstream, mixed]
        degraded:
          anyOf:
            - $ref: "#/components/schemas/DatabaseDeltaPollingDegraded"
            - type: "null"

    # ── Admin metrics ───────────────────────────────────────────────
    AdminMetrics:
      type: object
      description: |
        Comprehensive gateway runtime metrics snapshot. Cached for 5 seconds
        to avoid performance impact from frequent polling.
      required:
        - gateway
        - connection_pools
        - circuit_breakers
        - health_check
        - load_balancers
        - caches
        - consumer_index
        - rate_limiting
        - tcp_connection_throttle
      properties:
        gateway:
          $ref: "#/components/schemas/AdminMetricsGateway"
        connection_pools:
          $ref: "#/components/schemas/AdminMetricsConnectionPools"
        circuit_breakers:
          type: array
          items:
            $ref: "#/components/schemas/AdminMetricsCircuitBreaker"
          description: |
            Per-proxy circuit breaker states. Only proxies with circuit breaker
            config that have been accessed appear here.
        health_check:
          $ref: "#/components/schemas/AdminMetricsHealthCheck"
        load_balancers:
          $ref: "#/components/schemas/AdminMetricsLoadBalancers"
        caches:
          $ref: "#/components/schemas/AdminMetricsCaches"
        consumer_index:
          $ref: "#/components/schemas/AdminMetricsConsumerIndex"
        rate_limiting:
          $ref: "#/components/schemas/AdminMetricsRateLimiting"
        tcp_connection_throttle:
          $ref: "#/components/schemas/AdminMetricsTcpConnectionThrottle"
        database_polling:
          $ref: "#/components/schemas/DatabaseDeltaPollingMetrics"

    AdminMetricsGateway:
      type: object
      description: Top-level gateway info and throughput counters.
      required:
        - mode
        - ferrum_version
        - uptime_seconds
        - total_requests
        - status_codes_total
        - requests_per_second
        - status_codes_per_second
        - metrics_window_seconds
        - proxy_count
        - consumer_count
        - upstream_count
        - plugin_config_count
      properties:
        mode:
          type: string
          enum: [database, file, cp, dp]
          description: Operating mode (set by FERRUM_MODE)
        ferrum_version:
          type: string
          description: Ferrum Edge binary version
          example: "0.9.0"
        uptime_seconds:
          type: integer
          format: int64
          description: Seconds since the gateway process started
        total_requests:
          type: integer
          format: int64
          description: Total requests processed since the gateway started (cumulative counter)
        status_codes_total:
          type: object
          additionalProperties:
            type: integer
          description: |
            Cumulative map of HTTP status code (as string key) to total count
            since the gateway started. Only status codes that were seen appear
            as keys.
          example:
            "200": 523401
            "404": 1892
            "429": 312
        requests_per_second:
          type: integer
          format: int64
          description: Average requests per second over the last metrics window
        status_codes_per_second:
          type: object
          additionalProperties:
            type: integer
          description: |
            Average per-second rate of each HTTP status code over the last
            metrics window. Only status codes seen in the window appear as keys.
          example:
            "200": 1105
            "404": 38
            "429": 31
        metrics_window_seconds:
          type: integer
          format: int64
          description: |
            Window size in seconds used for per-second rate calculations
            (requests_per_second, status_codes_per_second). Configured via
            FERRUM_STATUS_METRICS_WINDOW_SECONDS (default 30).
        config_last_updated_at:
          type: [string, "null"]
          format: date-time
          description: RFC 3339 timestamp of the last successful config load/reload
        config_source_status:
          type: string
          enum: [online, "n/a"]
          description: |
            "online" when a database is configured and reachable,
            "n/a" for file mode or CP mode without a database
        proxy_count:
          type: integer
          description: Number of proxy routes in the active config
        consumer_count:
          type: integer
          description: Number of consumers in the active config
        upstream_count:
          type: integer
          description: Number of upstreams (load-balanced target groups) in the active config
        plugin_config_count:
          type: integer
          description: Number of plugin configurations in the active config

    AdminMetricsConnectionPools:
      type: object
      description: |
        Connection pool sizes for all four protocol pools. Each pool reuses
        connections to backend services to avoid TCP/TLS handshake overhead.
      properties:
        http:
          type: object
          description: HTTP/1.1 connection pool (reqwest-based, supports HTTP and HTTPS backends)
          properties:
            total_pools:
              type: integer
              description: Number of distinct backend host:port:protocol pool entries
            max_idle_per_host:
              type: integer
              description: Maximum idle connections kept per host (from FERRUM_POOL_MAX_IDLE_PER_HOST)
            idle_timeout_seconds:
              type: integer
              description: Seconds before an idle connection is evicted
            entries_per_host:
              type: object
              additionalProperties:
                type: integer
              description: Map of pool key (host:port:tls) to connection count
        grpc:
          type: object
          description: gRPC HTTP/2 connection pool (h2c + h2 with trailer support)
          properties:
            total_connections:
              type: integer
        http2:
          type: object
          description: HTTP/2 connection pool for HTTPS backends (stream multiplexing)
          properties:
            total_connections:
              type: integer
        http3:
          type: object
          description: HTTP/3 QUIC connection pool
          properties:
            total_connections:
              type: integer

    AdminMetricsCircuitBreaker:
      type: object
      description: |
        Circuit breaker state for a single proxy. Three states:
        - **closed**: Normal operation, requests pass through
        - **open**: Failures exceeded threshold, requests rejected with 503
        - **half_open**: Timeout elapsed, limited probe requests allowed to test recovery
      required: [proxy_id, state, failure_count, success_count]
      properties:
        proxy_id:
          type: string
          description: ID of the proxy this circuit breaker protects
        state:
          type: string
          enum: [closed, open, half_open]
        failure_count:
          type: integer
          description: |
            Consecutive failures in current state. In closed state, triggers
            opening when it reaches the configured threshold.
        success_count:
          type: integer
          description: |
            Consecutive successes during half_open state. When this reaches the
            configured success_threshold, the circuit closes (recovers).

    AdminMetricsHealthCheck:
      type: object
      description: |
        Health check state showing which upstream targets are currently
        marked unhealthy and excluded from load balancing.
      required: [unhealthy_target_count, unhealthy_targets]
      properties:
        unhealthy_target_count:
          type: integer
          description: Number of targets currently marked unhealthy
        unhealthy_targets:
          type: array
          items:
            type: object
            required: [target, since_epoch_ms]
            properties:
              target:
                type: string
                description: "Target in host:port format"
                example: "10.0.3.12:8080"
              since_epoch_ms:
                type: integer
                format: int64
                description: Unix epoch milliseconds when the target was marked unhealthy

    AdminMetricsLoadBalancers:
      type: object
      description: |
        Active connection counts per upstream target. Only upstreams with
        at least one active connection appear. Useful for verifying even
        distribution across targets and spotting hot targets.
      properties:
        active_connections:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
          description: |
            Nested map: upstream_id → { "host:port" → active_connection_count }.
            Only targets with count > 0 are included.

    AdminMetricsCaches:
      type: object
      description: Router lookup cache and DNS resolver cache statistics.
      properties:
        router:
          type: object
          description: |
            Router cache stores (host, path) → proxy lookups for O(1) repeated hits.
            Lookups are split across two partitions: a prefix/negative partition
            and a regex/exact partition. The regex/exact partition also holds
            exact-path and path-parameter positive matches, so those are counted
            under `regex_cache_entries`.
          properties:
            prefix_cache_entries:
              type: integer
              description: Current entries in the prefix route cache
            regex_cache_entries:
              type: integer
              description: >-
                Current entries in the regex/exact cache partition (regex,
                exact-path, and path-parameter matches)
            prefix_eviction_count:
              type: integer
              format: int64
              description: Total number of prefix cache eviction sweeps since startup
            regex_eviction_count:
              type: integer
              format: int64
              description: Total number of regex cache eviction sweeps since startup
            max_cache_entries:
              type: integer
              description: Maximum entries per cache partition before eviction triggers
        dns:
          type: object
          description: DNS resolver cache with stale-while-revalidate support
          properties:
            cache_entries:
              type: integer
              description: Number of hostname entries currently cached

    AdminMetricsConsumerIndex:
      type: object
      description: |
        Consumer credential index counts by authentication type.
        Includes pre-built hash map index sizes (key_auth, basic_auth, mtls, identity)
        and per-type credential entry counts (jwt, hmac).
      required: [total_consumers, key_auth_credentials, basic_auth_credentials, mtls_credentials, jwt_credentials, hmac_credentials, identity_credentials]
      properties:
        total_consumers:
          type: integer
          description: Total number of consumers loaded in the index
        key_auth_credentials:
          type: integer
          description: Number of API key credentials indexed (for key_auth plugin)
        basic_auth_credentials:
          type: integer
          description: Number of username credentials indexed (for basic_auth plugin)
        mtls_credentials:
          type: integer
          description: Number of mTLS identity credentials indexed (for mtls_auth plugin)
        jwt_credentials:
          type: integer
          description: Number of JWT credential entries across all consumers (for jwt_auth plugin)
        hmac_credentials:
          type: integer
          description: Number of HMAC credential entries across all consumers (for hmac_auth plugin)
        identity_credentials:
          type: integer
          description: Number of identity index entries (shared by jwt_auth, jwks_auth, hmac_auth, and ldap_auth plugins). Includes username, id, and custom_id entries per consumer

    AdminMetricsRateLimiting:
      type: object
      description: |
        Rate limiter state across all plugin instances. Each tracked key
        represents a unique client (by IP or consumer) with an active
        rate-limit window. Bounded to 100K entries per plugin instance.
      required: [tracked_key_count]
      properties:
        tracked_key_count:
          type: integer
          description: |
            Total number of rate-limit keys currently tracked across all
            rate_limiting plugin instances (deduplicated by plugin identity)

    AdminMetricsTcpConnectionThrottle:
      type: object
      description: Runtime scope contract for TCP concurrent-connection throttling.
      required: [enforcement_scope, replica_limit_behavior]
      properties:
        enforcement_scope:
          type: string
          enum: [process_local]
          description: Counters are held only by this ferrum-edge process.
        replica_limit_behavior:
          type: string
          enum: [configured_limit_per_replica]
          description: >-
            Each replica enforces the configured limit independently, so the
            aggregate deployment allowance can reach the configured limit
            multiplied by the number of replicas receiving that identity's TCP
            connections.

    # ── Pagination envelope ────────────────────────────────────────────
    Pagination:
      type: object
      description: |
        Pagination metadata returned on list endpoints. Resource list endpoints
        return this envelope even when `limit` and `offset` are omitted.
      required: [offset, limit, total]
      properties:
        offset:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Number of items skipped
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: |
            The page size the server actually applied — not the number of items
            returned. When the request omits `limit` this reports the server
            default of 100, and when the request exceeds the maximum it reports
            the capped value of 1000.
        total:
          type: integer
          format: int64
          minimum: 0
          description: Total number of items in the collection (before pagination)

    # ── Batch ──────────────────────────────────────────────────────────
    BatchCreateRequest:
      type: object
      description: |
        Batch create request. All fields are optional — include only the
        resource types you want to create.
      properties:
        proxies:
          type: array
          items:
            $ref: "#/components/schemas/ProxyCreate"
          description: Proxies to create
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerCreate"
          description: Consumers to create
        plugin_configs:
          type: array
          items:
            $ref: "#/components/schemas/PluginConfigCreate"
          description: Plugin configurations to create
        upstreams:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamCreate"
          description: Upstreams to create

    BatchCreateResponse:
      type: object
      required: [created]
      properties:
        created:
          type: object
          required: [proxies, consumers, plugin_configs, upstreams]
          properties:
            proxies:
              type: integer
              description: Number of proxies created
            consumers:
              type: integer
              description: Number of consumers created
            plugin_configs:
              type: integer
              description: Number of plugin configs created
            upstreams:
              type: integer
              description: Number of upstreams created
        errors:
          type: array
          items:
            type: string
          description: Present only on 207 Multi-Status; lists per-type error messages

    BackupResponse:
      type: object
      required: [version, ferrum_version, exported_at, source, counts, proxies, consumers, plugin_configs, upstreams]
      properties:
        version:
          type: string
          description: Configuration schema version
          example: "1"
        ferrum_version:
          type: string
          description: Ferrum Edge binary version that produced this backup
          example: "0.9.0"
        exported_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the backup was created
        source:
          type: string
          enum: [database, cached]
          description: Where the config was read from
        counts:
          type: object
          required: [proxies, consumers, plugin_configs, upstreams]
          properties:
            proxies:
              type: integer
            consumers:
              type: integer
            plugin_configs:
              type: integer
            upstreams:
              type: integer
        proxies:
          type: array
          items:
            $ref: "#/components/schemas/Proxy"
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerBackup"
        plugin_configs:
          type: array
          items:
            $ref: "#/components/schemas/PluginConfig"
        upstreams:
          type: array
          items:
            $ref: "#/components/schemas/Upstream"

    RestoreRequest:
      type: object
      description: |
        Same format as the backup output or the batch create request.
        All fields are optional — omitted resource types are treated as empty.
      properties:
        proxies:
          type: array
          items:
            $ref: "#/components/schemas/Proxy"
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerRestore"
        plugin_configs:
          type: array
          items:
            $ref: "#/components/schemas/PluginConfig"
        upstreams:
          type: array
          items:
            $ref: "#/components/schemas/Upstream"

    RestoreResponse:
      type: object
      required: [restored]
      properties:
        restored:
          type: object
          required: [proxies, consumers, plugin_configs, upstreams]
          properties:
            proxies:
              type: integer
              description: Number of proxies restored
            consumers:
              type: integer
              description: Number of consumers restored
            plugin_configs:
              type: integer
              description: Number of plugin configs restored
            upstreams:
              type: integer
              description: Number of upstreams restored
    # ── Shared: Transaction-Log Schema Customization ──────────────────
    # Shape of the `schema:` block (and the entries inside
    # `transaction_log_schema.schemas`). See docs/log_schema.md for the
    # operator-facing reference, validation rules, and cookbook.
    SummaryLogSchema:
      type: object
      description: >-
        Customizable output schema for transaction-log JSON / line
        protocol. Rename keys, drop fields, reorder, inject static
        stamping, emit derived fields, flatten metadata. Metadata
        redaction always applies on every code path — sensitive
        substrings (`authorization`, `cookie`, `password`, `token`, …)
        cannot be introduced via `static_fields` or `derived_fields`
        (rejected at construction). This object, each `derived_fields`
        entry, and `metadata` are strict fixed shapes: unknown keys are
        rejected with a nested path.
        HTTP summaries include the normalized terminal `grpc_status` field
        (separate from `response_status_code`) when the request is gRPC. It
        can be renamed, omitted, or ordered like every other native field.
        See docs/log_schema.md.
      additionalProperties: false
      properties:
        summary_type:
          type: string
          enum: [http, stream, both]
          default: both
          description: >-
            Which summary type(s) this schema applies to. Summaries of
            the other type fall back to native serialization (the schema
            only customizes types it claims to handle).
        omit:
          type: array
          items: { type: string }
          description: Native field names to drop from output.
        rename:
          type: object
          additionalProperties: { type: string }
          description: Map of native field name -> output key.
        order:
          type: array
          items: { type: string }
          description: >-
            Explicit output order, by output key. May contain `"*"` once
            as a wildcard for "every unlisted entry in natural order."
            Without `"*"`, every field must be listed.
        static_fields:
          type: object
          additionalProperties: true
          description: >-
            Literal JSON values injected at top level. Keys / nested
            keys matching sensitive substrings are rejected at
            compile time.
        derived_fields:
          type: array
          description: Computed values; emitted alongside native fields.
          items:
            type: object
            required: [name, kind]
            additionalProperties: false
            properties:
              name:
                type: string
                description: Output key for the derived value.
              kind:
                type: string
                enum: [status_class, backend_host, summary_kind, outcome]
                description: >-
                  `status_class`: `"1xx"`–`"5xx"` from
                  `response_status_code` (stream: `"none"`).
                  `backend_host`: hostname from `backend_target`
                  (port stripped, IPv6 brackets honored).
                  `summary_kind`: `"http"`, `"stream"`, or
                  `"websocket_disconnect"` (the last only for `ws_logging`
                  WebSocket disconnect entries).
                  `outcome`: `"ok"` / `"error"`.
        metadata:
          type: object
          description: How to render the `metadata` map.
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [nested, omit, flatten]
              default: nested
            prefix:
              type: string
              description: >-
                Flatten mode only. Prepended to each metadata key when
                promoted to top-level (e.g. `"meta_"`). Control
                characters are rejected.
            on_collision:
              type: string
              enum: [skip, overwrite]
              default: skip
              description: >-
                Flatten mode only. Behavior when a metadata key collides
                with an already-emitted field. `skip` keeps the existing
                value; `overwrite` emits a duplicate JSON key (last
                value wins per parser convention).
        timestamp_format:
          type: string
          enum: [rfc3339, epoch_ms, epoch_s]
          default: rfc3339
          description: >-
            Conversion applied to timestamp string fields
            (`timestamp_received`, `timestamp_connected`,
            `timestamp_disconnected`). Parse failures fall back to the
            raw RFC3339 string.

    # ── Plugin Config Schemas ──────────────────────────────────────────
    # Per-plugin configuration schemas. The `config` field on PluginConfig
    # accepts one of these depending on the `plugin_name` value.

    StdoutLoggingConfig:
      type: [object, "null"]
      additionalProperties: false
      description: "Plugin: stdout_logging — Writes one JSON transaction/stream summary per line to the bounded non-blocking stdout writer. Independent of FERRUM_LOG_LEVEL. Accepted keys are filter, schema, and schema_ref; null or an empty object uses defaults. The optional filter runs before schema application."
      properties:
        filter:
          type: [object, "null"]
          additionalProperties: false
          description: >-
            Optional predicate that suppresses log entries before they are
            serialized. All present fields must match for an entry to be
            logged. When omitted, every transaction is logged.
          properties:
            status_code_min:
              type: integer
              minimum: 0
              maximum: 65535
              description: HTTP responses with status < this value are skipped. Stream summaries (no HTTP status) are always skipped when any status_code_* bound is set.
            status_code_max:
              type: integer
              minimum: 0
              maximum: 65535
              description: HTTP responses with status > this value are skipped. Must be greater than or equal to status_code_min when both are set, otherwise plugin validation rejects the config.
            min_latency_ms:
              type: integer
              minimum: 0
              description: Skip summaries whose total latency / stream duration is below this many milliseconds.
            errors_only:
              type: boolean
              default: false
              description: >-
                HTTP-family summaries require an authoritative terminal
                failure: dispatch/error_class, body failure, incomplete body,
                client disconnect, gateway rejection, or nonzero final
                grpc_status. Stream summaries require error_class or
                connection_error. Status and latency predicates remain
                independent and must also match.
        schema:
          $ref: "#/components/schemas/SummaryLogSchema"
        schema_ref:
          type: string
          description: >-
            Name of a schema registered by a `transaction_log_schema` plugin.
            Mutually exclusive with `schema`. See docs/log_schema.md.

    HttpLoggingConfig:
      type: object
      description: "Plugin: http_logging — Sends transaction logs to an HTTP endpoint in batches."
      required:
        - endpoint_url
      properties:
        endpoint_url:
          type: string
          description: URL to POST transaction logs to
        custom_headers:
          type: object
          additionalProperties:
            type: string
          description: "Key-value pairs of custom HTTP headers to include on every batch request. Use this for service-specific auth (e.g., DD-API-KEY for Datadog, Api-Key for New Relic) or metadata headers."
          example:
            DD-API-KEY: your-datadog-api-key
        batch_size:
          type: integer
          default: 50
          description: Number of entries to buffer before sending a batch
        flush_interval_ms:
          type: integer
          default: 1000
          minimum: 100
          description: Max milliseconds before flushing a partial batch
        max_retries:
          type: integer
          default: 3
          description: Retry attempts on failed batch delivery
        retry_delay_ms:
          type: integer
          default: 1000
          description: Delay in milliseconds between retry attempts
        buffer_capacity:
          type: integer
          default: 10000
          description: Channel capacity — new entries are dropped when full
        schema:
          $ref: "#/components/schemas/SummaryLogSchema"
        schema_ref:
          type: string
          description: >-
            Name of a schema registered by a `transaction_log_schema` plugin.
            Mutually exclusive with `schema`. See docs/log_schema.md.

    TcpLoggingConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: tcp_logging — Sends transaction logs as NDJSON over a persistent
        TCP or TCP+TLS connection. Only the properties below are admitted;
        unknown keys (for example a misspelled `tlls`) are rejected so transport
        security cannot silently default to plaintext. `connect_timeout_ms`
        bounds DNS, TCP connect, and TLS handshake when enabled.
        `write_timeout_ms` bounds each batch write/flush; timeouts discard the
        writer and use the shared retry/reconnect path. Delivery is
        at-least-once after partial-write failure. Registration policy is
        KeepLastKnownGood: an invalid enabled candidate rejects startup or
        reload publication instead of silently removing or downgrading the
        previously accepted logger.
      required:
        - host
        - port
      allOf:
        - if:
            required: [tls_server_name]
          then:
            required: [tls]
            properties:
              tls:
                const: true
      properties:
        host:
          type: string
          minLength: 1
          description: Hostname or IP of the TCP log receiver
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Port of the TCP log receiver
        tls:
          type: boolean
          default: false
          description: Enable TLS encryption for the connection
        tls_server_name:
          type: string
          minLength: 1
          pattern: '^(?:[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?|[0-9A-Fa-f.]*:[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*)$'
          description: >-
            DNS or IP identity for TLS SNI/certificate verification (defaults to
            `host`). Allowed only when `tls` is true. The schema rejects URL
            schemes, paths, queries, fragments, credentials, whitespace, and
            host:port values; full rustls DNS/IP identity validation is enforced
            during plugin admission.
        batch_size:
          type: integer
          default: 50
          minimum: 1
          description: Number of entries to buffer before sending a batch
        flush_interval_ms:
          type: integer
          default: 1000
          minimum: 100
          description: Max milliseconds before flushing a partial batch
        max_retries:
          type: integer
          default: 3
          minimum: 0
          description: Retry attempts on failed batch delivery
        retry_delay_ms:
          type: integer
          default: 1000
          minimum: 0
          description: Delay in milliseconds between retry attempts
        buffer_capacity:
          type: integer
          default: 10000
          minimum: 1
          description: Channel capacity — new entries are dropped when full
        connect_timeout_ms:
          type: integer
          default: 5000
          minimum: 100
          maximum: 60000
          description: >-
            Connection establishment timeout in milliseconds. Covers DNS
            resolution, TCP connect, and the TLS handshake when `tls` is true.
        write_timeout_ms:
          type: integer
          default: 5000
          minimum: 100
          maximum: 60000
          description: >-
            Per-batch socket write_all + flush timeout in milliseconds. On
            timeout the persistent writer is discarded and retries reconnect.
        schema:
          $ref: "#/components/schemas/SummaryLogSchema"
        schema_ref:
          type: string
          minLength: 1
          description: >-
            Name of a schema registered by a `transaction_log_schema` plugin.
            Mutually exclusive with `schema`. See docs/log_schema.md.

    UdpLoggingConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: udp_logging — Sends transaction logs to a UDP/DTLS endpoint in
        batches. Unknown top-level keys are rejected at construction / Admin
        validation so transport typos (for example `dtsl`) cannot silently
        fall back to plaintext. DTLS-only fields require `dtls: true` (omitted
        or false rejects them) so Admin/spec admission cannot accept plaintext
        configs that runtime would ignore. Registration policy is
        OptionalFailOpen (invalid enabled instances are omitted from the
        published cache).
      required:
        - host
        - port
      allOf:
        - if:
            required: [dtls]
            properties:
              dtls:
                const: true
          then:
            dependentRequired:
              dtls_cert_path: [dtls_key_path]
              dtls_key_path: [dtls_cert_path]
          else:
            not:
              anyOf:
                - required: [dtls_cert_path]
                - required: [dtls_key_path]
                - required: [dtls_ca_cert_path]
                - required: [dtls_no_verify]
      properties:
        host:
          type: string
          minLength: 1
          # Match runtime parse_socket_host: hostname or IP without scheme,
          # path, query, fragment, credentials, or a single-colon host:port.
          # Valid IPv6 literals necessarily contain at least two colons.
          not:
            anyOf:
              - pattern: "://"
              - pattern: "[/?#@\\s]"
              - pattern: "^[^\\[\\]:]+:[^:]+$"
          description: >-
            UDP endpoint hostname or IP address. Must be a bare hostname or IP
            without scheme, path, query, fragment, credentials, or port
            (bracketed and unbracketed IPv6 literals are allowed).
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: UDP endpoint port
        dtls:
          type: boolean
          default: false
          description: >-
            Enable DTLS encryption for log datagrams. Shared Admin / CP validation
            checks configuration shape without opening node-local sources. On the
            consuming node, certificate/key/CA sources are materialized and cached
            for the plugin generation. When false or omitted, DTLS-only fields are
            rejected.
        dtls_cert_path:
          type: string
          minLength: 1
          description: >-
            PEM client certificate for DTLS mutual TLS. Materialized during the
            consuming node's dependency/construction phase when dtls is true; must
            be paired with dtls_key_path. Rejected unless dtls is true.
        dtls_key_path:
          type: string
          minLength: 1
          description: >-
            PEM private key for DTLS mutual TLS (ECDSA P-256 or P-384). Must be
            paired with dtls_cert_path. Rejected unless dtls is true.
        dtls_ca_cert_path:
          type: string
          minLength: 1
          description: >-
            PEM CA certificate for verifying the DTLS server. Materialized on the
            consuming node whenever set with dtls true, including when dtls_no_verify
            is true (the source must still be valid even though verification is
            disabled). Rejected unless dtls is true.
        dtls_no_verify:
          type: boolean
          default: false
          description: >-
            Skip DTLS server certificate verification (testing only). Rejected
            unless dtls is true.
        batch_size:
          type: integer
          default: 10
          description: Number of entries to buffer before sending a batch
        flush_interval_ms:
          type: integer
          default: 1000
          minimum: 100
          description: Max milliseconds before flushing a partial batch
        max_retries:
          type: integer
          default: 1
          description: Retry attempts on failed batch delivery
        retry_delay_ms:
          type: integer
          default: 500
          description: Delay in milliseconds between retry attempts
        buffer_capacity:
          type: integer
          default: 10000
          description: Channel capacity — new entries are dropped when full
        schema:
          $ref: "#/components/schemas/SummaryLogSchema"
        schema_ref:
          type: string
          description: >-
            Name of a schema registered by a `transaction_log_schema` plugin.
            Mutually exclusive with `schema`. See docs/log_schema.md.

    KafkaLoggingConfig:
      type: object
      description: "Plugin: kafka_logging — Produces transaction summaries as JSON messages to an Apache Kafka topic. Uses an async channel to decouple the proxy hot path from Kafka I/O, with librdkafka handling batching, compression, and delivery retries."
      required:
        - broker_list
        - topic
      properties:
        broker_list:
          type: string
          description: Comma-separated Kafka broker addresses (e.g., broker1:9092,broker2:9092)
        topic:
          type: string
          description: Kafka topic to produce messages to
        key_field:
          type: string
          enum: [client_ip, proxy_id, none]
          default: client_ip
          description: "Partition key field: client_ip (groups by client), proxy_id (groups by route), none (round-robin)"
        buffer_capacity:
          type: integer
          default: 10000
          minimum: 1
          description: "Channel capacity — new entries are dropped when full. Each entry is ~1-2 KB, so 10,000 entries may use ~10-20 MB"
        compression:
          type: string
          enum: [none, gzip, snappy, lz4, zstd]
          default: lz4
          description: Kafka message compression algorithm
        flush_timeout_seconds:
          type: integer
          default: 5
          minimum: 1
          description: Seconds to wait for librdkafka to flush pending messages during graceful shutdown
        acks:
          type: string
          enum: ["0", "1", "all", "-1"]
          description: "Delivery acknowledgment level: 0 (fire-and-forget), 1 (leader ack), all/-1 (full ISR ack)"
        message_timeout_ms:
          type: integer
          description: Timeout for message delivery in milliseconds
        security_protocol:
          type: string
          enum: [plaintext, ssl, sasl_plaintext, sasl_ssl]
          description: Kafka security protocol
        sasl_mechanism:
          type: string
          description: SASL mechanism (e.g., PLAIN, SCRAM-SHA-256, SCRAM-SHA-512)
        sasl_username:
          type: string
          description: SASL username
        sasl_password:
          type: string
          description: SASL password
        ssl_ca_location:
          type: string
          description: Path to CA certificate for broker TLS verification. Falls back to FERRUM_TLS_CA_BUNDLE_PATH
        ssl_no_verify:
          type: boolean
          description: Skip broker TLS certificate verification. Falls back to FERRUM_TLS_NO_VERIFY
        ssl_certificate_location:
          type: string
          description: Path to client certificate for mTLS
        ssl_key_location:
          type: string
          description: Path to client private key for mTLS
        producer_config:
          type: object
          additionalProperties:
            type: string
          description: "Escape hatch: arbitrary librdkafka producer properties as key-value pairs"
        schema:
          $ref: "#/components/schemas/SummaryLogSchema"
        schema_ref:
          type: string
          description: >-
            Name of a schema registered by a `transaction_log_schema` plugin.
            Mutually exclusive with `schema`. Note: Kafka partition keys
            (`client_ip` / `proxy_id`) read typed summary fields and are NOT
            affected by `rename:`. See docs/log_schema.md.

    WsLoggingConfig:
      type: object
      description: "Plugin: ws_logging — Sends transaction logs to a WebSocket endpoint in batches."
      required:
        - endpoint_url
      properties:
        endpoint_url:
          type: string
          description: WebSocket URL (ws:// or wss://) to send transaction logs to. Must include a hostname; malformed or non-WebSocket schemes are rejected at config load time.
        reconnect_delay_ms:
          type: integer
          default: 5000
          description: Delay in milliseconds before reconnecting after connection failure
        batch_size:
          type: integer
          default: 50
          description: Number of entries to buffer before sending a batch
        flush_interval_ms:
          type: integer
          default: 1000
          minimum: 100
          description: Max milliseconds before flushing a partial batch
        max_retries:
          type: integer
          default: 3
          description: Retry attempts on failed batch delivery
        retry_delay_ms:
          type: integer
          default: 1000
          description: Delay in milliseconds between retry attempts
        buffer_capacity:
          type: integer
          default: 10000
          description: Channel capacity — new entries are dropped when full
        schema:
          $ref: "#/components/schemas/SummaryLogSchema"
        schema_ref:
          type: string
          description: >-
            Name of a schema registered by a `transaction_log_schema` plugin.
            Mutually exclusive with `schema`. WebSocket disconnect entries are
            serialized through the schema as well (`rename`, `omit`, `order`,
            `static_fields`, `derived_fields`, and `metadata` all apply). Because
            `ws_logging` opts into the WebSocket-disconnect capability, the
            named schema is recompiled under that capability at resolve time, so
            the WebSocket-disconnect native fields (`event`,
            `frames_client_to_backend`, `frames_backend_to_client`, `direction`,
            `io_side`, …) are available in addition to the shared HTTP fields.
            See docs/log_schema.md.

    LokiLoggingConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: loki_logging — Ships transaction logs to Grafana Loki via the
        push API in bounded, label-grouped streams. HTTP 204 is the canonical
        success response; other 2xx responses are accepted only when their body
        drains completely and is empty. Loki's blocked-ingestion status 260,
        non-empty/anomalous compatible-success responses, and every other
        non-retryable response are terminal; 408, 429, and 5xx responses use
        bounded exponential backoff with jitter. Explicit nulls and unknown
        top-level fields are rejected.
      required:
        - endpoint_url
      properties:
        endpoint_url:
          type: string
          format: uri
          pattern: '^[hH][tT][tT][pP][sS]?://(?![^/?#]*@)(?:\[[^\]\s]+\]|[^/?#:\s]+)(?::[0-9]+)?(?:[/?#]\S*)?$'
          description: >-
            Loki push API URL (for example,
            http://loki:3100/loki/api/v1/push). URL user information is
            rejected; use authorization_header or custom_headers instead.
            Path and query components are redacted from operational and
            non-admin diagnostics.
        authorization_header:
          type: string
          minLength: 1
          pattern: '^[\u0021-\u007E](?:[\u0009\u0020-\u007E]*[\u0021-\u007E])?$'
          description: >-
            Full Authorization header value (e.g. "Bearer <token>" or
            "Basic <b64>"). Leading and trailing whitespace is rejected.
        custom_headers:
          type: object
          propertyNames:
            type: string
            minLength: 1
            maxLength: 65535
            pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
          additionalProperties:
            type: string
            pattern: '^[\u0009\u0020-\u007E]*$'
          description: >-
            Extra HTTP headers (for example, X-Scope-OrgID for multi-tenant
            Loki). Names use HTTP token syntax and are at most 65,535 ASCII
            bytes. All values are redacted from audit records and non-admin
            config reads.
        labels:
          type: object
          propertyNames:
            pattern: '^(?!__)(?!ferrum_emitter$)[a-zA-Z_][a-zA-Z0-9_]{0,1023}$'
          additionalProperties:
            type: string
            maxLength: 2048
          default:
            service: ferrum-edge
          description: >-
            Static labels merged into every Loki stream. Keep cardinality low
            because labels are indexed. Names beginning with __ and the
            reserved ferrum_emitter label are rejected. Ferrum Edge adds a
            unique ferrum_emitter value per plugin instance so independently
            ordered emitters never share a Loki stream. Each replica and each
            rebuilt plugin generation therefore consumes a distinct active
            stream for every other label combination; size Loki
            max_streams_per_user limits and reload cadence accordingly.
        include_proxy_id_label:
          type: boolean
          default: true
          description: Add the matched proxy_id as a Loki label
        include_status_class_label:
          type: boolean
          default: true
          description: Add status_class (2xx/3xx/4xx/5xx) as a Loki label
        gzip:
          type: boolean
          default: true
          description: Gzip-compress the request body (Content-Encoding header set automatically)
        batch_size:
          type: integer
          default: 100
          minimum: 1
          maximum: 10000
          description: Number of entries to buffer before sending a batch
        flush_interval_ms:
          type: integer
          default: 1000
          minimum: 100
          description: Max milliseconds before flushing a partial batch
        max_retries:
          type: integer
          default: 3
          minimum: 0
          maximum: 10
          description: >-
            Retries after the initial delivery attempt. Only transport
            failures, 408, 429, and 5xx retry. A received 204 is committed even
            when its best-effort body drain is anomalous, avoiding duplicates.
        retry_delay_ms:
          type: integer
          default: 1000
          minimum: 1
          maximum: 60000
          description: Initial exponential-backoff delay in milliseconds
        buffer_capacity:
          type: integer
          default: 10000
          minimum: 1
          maximum: 1000000
          description: Channel capacity — new entries are dropped when full
        max_entry_bytes:
          type: integer
          default: 65536
          minimum: 1024
          maximum: 1048576
          description: >-
            Maximum retained bytes for one serialized JSON line plus its Loki
            labels. Configuration is rejected unless the configured
            serializer's minimum HTTP and stream lines plus static, reserved,
            and worst-case dynamic label values fit this budget. Request-shaped
            fields can still make an individual serialized line exceed the
            budget; those oversized entries are dropped before enqueue.
        buffer_max_bytes:
          type: integer
          default: 16777216
          minimum: 1024
          maximum: 268435456
          description: >-
            Per-plugin retained-content byte budget across queued, batched,
            and retrying entries. Must be at least max_entry_bytes; entries
            are dropped non-blockingly when the budget is exhausted.
        schema:
          $ref: "#/components/schemas/SummaryLogSchema"
        schema_ref:
          type: string
          description: >-
            Name of a schema registered by a `transaction_log_schema` plugin.
            Mutually exclusive with `schema`. Note: Loki labels
            (`build_http_labels` / `build_stream_labels`) read typed summary
            fields and are NOT affected by `rename:`. See docs/log_schema.md.

    StatsdLoggingConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: statsd_logging — Sends transaction metrics to a StatsD-compatible
        server over UDP. Unknown top-level keys are rejected at construction /
        Admin validation. Nested `global_tags` remains an intentionally open
        string map, but keys must match [A-Za-z_][A-Za-z0-9_.-]* (max 64 bytes)
        and cannot override reserved or schema-renamed runtime tags (namespace, method, status,
        status_class, proxy, protocol, error, cause, direction, body_outcome,
        body_error, result, io_side, error_class). The authoritative namespace
        tag is always appended and preserves the full validated Ferrum namespace
        (up to 254 bytes). Metric prefixes are sanitized and capped at 256
        bytes; encoded global_tags (+ namespace) are capped at 400 bytes.
        UDP datagrams never exceed a 1452-byte conservative IPv4/IPv6 payload
        ceiling; indivisible oversized lines are dropped rather than fragmented.
        Mirror summaries are excluded from request.* families. Timers require
        finite non-negative samples (the -1.0 no-backend TTFB sentinel is
        omitted). WebSocket session completion emits websocket.* families via
        on_ws_disconnect. Registration policy is OptionalFailOpen (invalid
        enabled configs warn and omit the plugin on file-mode load / cache
        rebuild rather than aborting the gateway). See docs/plugins.md.
      required:
        - host
      properties:
        host:
          type: string
          description: StatsD server hostname or IP address
        port:
          type: integer
          default: 8125
          minimum: 1
          maximum: 65535
          description: StatsD server UDP port
        prefix:
          type: string
          default: "ferrum"
          maxLength: 256
          description: >-
            Metric name prefix (e.g., ferrum.request.count). Sanitized for
            StatsD line-protocol safety. OpenAPI `maxLength` counts Unicode
            characters; runtime admission separately enforces at most 256
            UTF-8 bytes after sanitization, so multibyte prefixes may be
            rejected below 256 characters.
        global_tags:
          type: object
          propertyNames:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[A-Za-z_][A-Za-z0-9_.-]*$'
            description: >-
              Tag keys are restricted to the ASCII grammar
              `[A-Za-z_][A-Za-z0-9_.-]*`, so OpenAPI `maxLength: 64`
              matches the runtime 64-byte key ceiling.
          additionalProperties:
            type: string
          description: >-
            Extra DogStatsD tags appended to every metric. Keys must match
            `[A-Za-z_][A-Za-z0-9_.-]*` (max 64 ASCII bytes) and cannot
            override reserved runtime tags or effective schema-renamed runtime
            keys (enforced at construction).
            Encoded global_tags (+ authoritative namespace) are capped at
            400 bytes.
        flush_interval_ms:
          type: integer
          default: 500
          minimum: 50
          description: Max milliseconds before flushing buffered metrics
        buffer_capacity:
          type: integer
          default: 10000
          description: Channel capacity — new entries are dropped when full
        max_batch_lines:
          type: integer
          default: 50
          description: Max metric entries to batch before flushing
        max_retries:
          type: integer
          default: 0
          minimum: 0
          description: >-
            Retry attempts after the initial UDP send fails. Defaults to 0
            (no retries). Consumed by the shared batching logger.
        retry_delay_ms:
          type: integer
          default: 0
          minimum: 0
          description: >-
            Delay in milliseconds between retry attempts. Defaults to 0.
            Consumed by the shared batching logger when `max_retries` > 0.
        schema:
          allOf:
            - $ref: "#/components/schemas/SummaryLogSchema"
          description: >-
            Only `rename` and `omit` apply to statsd output — they operate on
            tag keys that map 1:1 to a native summary field:
            HTTP: `method`↔`http_method`, `status`↔`response_status_code`,
            `proxy`↔`proxy_id`.
            Stream: `protocol`↔`protocol`, `proxy`↔`proxy_id`,
            `cause`↔`disconnect_cause`, `direction`↔`disconnect_direction`.
            Rename targets must match [A-Za-z_][A-Za-z0-9_.-]* and must not
            collide with reserved runtime tags. `static_fields`,
            `derived_fields`, `metadata`, `order`, and `timestamp_format` are
            no-ops for statsd (line protocol, not JSON). See docs/log_schema.md.
        schema_ref:
          type: string
          description: >-
            Name of a schema registered by a `transaction_log_schema` plugin.
            Mutually exclusive with `schema`. Same statsd caveats as above.

    TransactionLogSchemaConfig:
      type: object
      description: >-
        Plugin: transaction_log_schema — Config-only plugin that registers
        named `SummaryLogSchema` definitions into a process-global registry
        for other logging plugins to consume via `schema_ref:`. Required
        scope is `global`; constructed by the loader BEFORE any plugin that
        uses `schema_ref:` so resolution always succeeds. The registry is
        atomically replaced on every config reload — renamed or removed
        schemas do not leak. Config-only instances are discarded after
        staging and never retained in runtime hook or protocol cache lists.
        Admin create/update/delete, batch, and restore validate the complete
        prospective namespace graph without consulting or modifying the live
        registry. Unknown outer and nested fixed-shape keys are rejected.
        See docs/log_schema.md.
      required: [schemas]
      additionalProperties: false
      properties:
        schemas:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/SummaryLogSchema"
          description: >-
            Map of schema name → schema definition. Names are referenced
            by other plugins as `schema_ref: <name>`. Duplicate names
            across multiple enabled `transaction_log_schema` plugins in the
            same namespace are rejected before persistence or load.

    TransactionDebuggerConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: transaction_debugger — Emits verbose request/response and
        terminal diagnostics via tracing::debug on the transaction_debug
        target. Request and response payloads are never captured. Requires
        FERRUM_LOG_LEVEL=debug to see output. Unsupported keys are rejected.
      properties:
        redacted_headers:
          type: array
          items:
            type: string
          description: Additional header names to redact beyond the built-in sensitive list

    CorrelationIdConfig:
      type: object
      additionalProperties: false
      description: "Plugin: correlation_id — Preserves a non-empty inbound ID only when it is at most 256 bytes and matches [A-Za-z0-9._-]+; every missing or rejected value is replaced (never truncated) with UUID v4. Multiple instances retain independent authoritative values in private typed request/session state. The first instance in priority order owns the canonical request_id, while every instance forwards and echoes only its own private value, including on successful H1/H2/H3 WebSocket handshakes. Public request_id and correlation_id.instance.* metadata are compatibility projections; later plugin writes cannot change authoritative forwarding, echo, or logged values. Effective instances on one proxy chain that overlap on any supported protocol must normalize to distinct header_name values and have distinct effective priorities; use priority_override to make canonical ownership deterministic. Disjoint protocol owners do not conflict. Admission and reload reject either overlapping ambiguous composition. Runtime admission also rejects the deployment-specific effective FERRUM_REAL_IP_HEADER value case-insensitively; that dynamic exclusion cannot be expressed by this static schema. CP/DP config sync requires every DP to advertise the same effective value as the CP before configuration is distributed. The top-level config must be an object; null fields select defaults."
      properties:
        header_name:
          type: [string, "null"]
          default: x-request-id
          minLength: 1
          pattern: "^\\s*[!#$%&'*+.^_`|~0-9A-Za-z-]+\\s*$"
          not:
            type: string
            pattern: "^\\s*(?:[Ee][Aa][Rr][Ll][Yy]-[Dd][Aa][Tt][Aa]|[Xx]-[Ff][Ee][Rr][Rr][Uu][Mm]-[Oo][Rr][Ii][Gg][Ii][Nn][Aa][Ll]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt]-[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]|[Xx]-[Gg][Rr][Pp][Cc]-[Ww][Ee][Bb]-[Mm][Oo][Dd][Ee]|[Aa][Pp][Ii]-[Kk][Ee][Yy]|[Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn]-[Ii][Nn][Ff][Oo]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]|[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn]|[Cc][Oo][Nn][Tt][Ee][Nn][Tt]-[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]|[Cc][Oo][Nn][Tt][Ee][Nn][Tt]-[Ll][Ee][Nn][Gg][Tt][Hh]|[Cc][Oo][Oo][Kk][Ii][Ee]|[Ee][Xx][Pp][Ee][Cc][Tt]|[Gg][Rr][Pp][Cc]-[Mm][Ee][Ss][Ss][Aa][Gg][Ee]|[Gg][Rr][Pp][Cc]-[Ss][Tt][Aa][Tt][Uu][Ss]|[Gg][Rr][Pp][Cc]-[Ss][Tt][Aa][Tt][Uu][Ss]-[Dd][Ee][Tt][Aa][Ii][Ll][Ss]-[Bb][Ii][Nn]|[Hh][Oo][Ss][Tt]|[Kk][Ee][Ee][Pp]-[Aa][Ll][Ii][Vv][Ee]|[Pp][Rr][Oo][Xx][Yy]-[Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ee]|[Pp][Rr][Oo][Xx][Yy]-[Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn]-[Ii][Nn][Ff][Oo]|[Pp][Rr][Oo][Xx][Yy]-[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]|[Pp][Rr][Oo][Xx][Yy]-[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn]|[Ss][Ee][Cc]-[Ww][Ee][Bb][Ss][Oo][Cc][Kk][Ee][Tt]-[Aa][Cc][Cc][Ee][Pp][Tt]|[Ss][Ee][Cc]-[Ww][Ee][Bb][Ss][Oo][Cc][Kk][Ee][Tt]-[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss]|[Ss][Ee][Cc]-[Ww][Ee][Bb][Ss][Oo][Cc][Kk][Ee][Tt]-[Kk][Ee][Yy]|[Ss][Ee][Cc]-[Ww][Ee][Bb][Ss][Oo][Cc][Kk][Ee][Tt]-[Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll]|[Ss][Ee][Cc]-[Ww][Ee][Bb][Ss][Oo][Cc][Kk][Ee][Tt]-[Vv][Ee][Rr][Ss][Ii][Oo][Nn]|[Ss][Ee][Tt]-[Cc][Oo][Oo][Kk][Ii][Ee]|[Tt][Ee]|[Tt][Rr][Aa][Cc][Ee][Pp][Aa][Rr][Ee][Nn][Tt]|[Tt][Rr][Aa][Cc][Ee][Ss][Tt][Aa][Tt][Ee]|[Tt][Rr][Aa][Ii][Ll][Ee][Rr]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]-[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]|[Uu][Pp][Gg][Rr][Aa][Dd][Ee]|[Ww][Ww][Ww]-[Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ee]|[Xx]-[Aa][Pp][Ii]-[Kk][Ee][Yy]|[Xx]-[Aa][Uu][Tt][Hh]-[Tt][Oo][Kk][Ee][Nn]|[Xx]-[Cc][Ss][Rr][Ff]-[Tt][Oo][Kk][Ee][Nn]|[Xx]-[Ff][Oo][Rr][Ww][Aa][Rr][Dd][Ee][Dd]-[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]|[Xx]-[Ff][Oo][Rr][Ww][Aa][Rr][Dd][Ee][Dd]-[Ff][Oo][Rr]|[Xx]-[Gg][Oo][Oo][Gg]-[Aa][Pp][Ii]-[Kk][Ee][Yy]|[Xx]-[Xx][Ss][Rr][Ff]-[Tt][Oo][Kk][Ee][Nn])\\s*$"
          allOf:
            - not:
                type: string
                pattern: "^\\s*(?:[Ee][Aa][Rr][Ll][Yy]-[Dd][Aa][Tt][Aa]|[Xx]-[Ff][Ee][Rr][Rr][Uu][Mm]-[Oo][Rr][Ii][Gg][Ii][Nn][Aa][Ll]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt]-[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]|[Xx]-[Gg][Rr][Pp][Cc]-[Ww][Ee][Bb]-[Mm][Oo][Dd][Ee]|[Tt][Rr][Aa][Cc][Ee][Pp][Aa][Rr][Ee][Nn][Tt]|[Tt][Rr][Aa][Cc][Ee][Ss][Tt][Aa][Tt][Ee]|[Ff][Oo][Rr][Ww][Aa][Rr][Dd][Ee][Dd]|[Vv][Ii][Aa]|[Xx]-[Ff][Oo][Rr][Ww][Aa][Rr][Dd][Ee][Dd]-[Hh][Oo][Ss][Tt]|[Xx]-[Ff][Oo][Rr][Ww][Aa][Rr][Dd][Ee][Dd]-[Pp][Rr][Oo][Tt][Oo])\\s*$"
          description: "Header name (surrounding whitespace trimmed and lowercased internally). Used for the inbound preserved value and this instance's outbound/echoed value. Protocol-managed request, forwarding, framing, connection, content-coding, W3C tracing context (traceparent and tracestate), gRPC status, WebSocket handshake, and internal marker names (including early-data, x-grpc-web-mode, and x-ferrum-original-content-encoding), plus security-sensitive credential/authentication names, are rejected case-insensitively. Runtime also rejects the effective deployment-specific FERRUM_REAL_IP_HEADER value case-insensitively; CP/DP config sync enforces one matching value across the cluster before distribution. Null selects x-request-id."
        echo_downstream:
          type: [boolean, "null"]
          default: true
          description: When true, this instance's resolved ID is added to ordinary responses, rejection responses, and successful H1 Upgrade/H2-H3 Extended CONNECT WebSocket handshakes. Null selects true.

    PrometheusMetricsConfig:
      type: object
      description: >-
        Plugin: prometheus_metrics — Exports gateway metrics in Prometheus
        format. At most one enabled instance is permitted and it must use
        global scope because the registry and tunables are process-wide.
      properties:
        render_cache_ttl_seconds:
          type: integer
          default: 5
          description: How long the cached /metrics response is served before rebuilding (seconds)
        stale_entry_ttl_seconds:
          type: integer
          default: 3600
          description: How long idle metric entries live before eviction (seconds). Prevents unbounded memory growth from deleted/recreated proxies
        cache_invalidation_min_age_ms:
          type: integer
          default: 500
          description: Minimum age (ms) of the render cache before record() will invalidate it. Under extreme load this prevents an allocation per request

    ProxyAlertsConfig:
      type: object
      description: |
        Plugin: proxy_alerts — in-gateway anomaly notifications for proxy
        traffic. Observes HTTP/gRPC transaction summaries, TCP/UDP stream
        disconnect summaries, and WebSocket disconnect summaries, then sends
        Trigger/Resolve notifications to Slack, Microsoft Teams, Discord, or
        generic HTTP webhooks. See docs/proxy_alerts.md.

        Unknown top-level keys are rejected. Present values must match their
        declared types (`enabled` boolean, `quiet_hours_utc` array,
        `max_concurrent_dispatches` integer >= 1). The `channels` map remains
        open for arbitrary channel names; each channel/rule variant is closed
        to its selected shape. Rules may also be `enabled: false` drafts.
      additionalProperties: false
      required: [channels, rules]
      properties:
        enabled:
          type: boolean
          default: true
          description: Master runtime switch for this plugin instance.
        default_cooldown_seconds:
          type: integer
          format: uint32
          minimum: 1
          maximum: 86400
          default: 300
          description: Per-rule fallback cooldown. Cooldown is tracked per `(rule, proxy, channel)`.
        default_min_request_count:
          type: integer
          format: uint64
          minimum: 1
          default: 50
          description: Per-rule fallback for error-rate and latency-percentile rules.
        default_window_seconds:
          type: integer
          format: uint32
          minimum: 5
          maximum: 3600
          default: 60
          description: Per-rule fallback sliding-window length.
        default_resolved_window_seconds:
          type: integer
          format: uint32
          minimum: 5
          maximum: 86400
          default: 300
          description: Per-rule fallback recovery quiet period after a breach clears.
        max_concurrent_dispatches:
          type: integer
          format: uint32
          minimum: 1
          default: 8
          description: Maximum concurrent outbound notification requests. Excess alerts are dropped, not queued.
        quiet_hours_utc:
          type: array
          default: []
          description: UTC time windows where Trigger alerts are suppressed. Resolve alerts still dispatch.
          items:
            $ref: "#/components/schemas/ProxyAlertsQuietHourWindow"
        channels:
          type: object
          minProperties: 1
          propertyNames:
            pattern: "^[A-Za-z0-9_-]+$"
          additionalProperties:
            $ref: "#/components/schemas/ProxyAlertsChannel"
          description: Map of channel name to channel definition. Rule `channels` entries reference these names.
        rules:
          type: array
          minItems: 1
          description: Alert rules evaluated per matched proxy. At least one rule must be active.
          items:
            $ref: "#/components/schemas/ProxyAlertsRule"
          contains:
            oneOf:
              - $ref: "#/components/schemas/ProxyAlertsErrorRateRule"
              - $ref: "#/components/schemas/ProxyAlertsStatusCodeCountRule"
              - $ref: "#/components/schemas/ProxyAlertsLatencyPercentileRule"
              - $ref: "#/components/schemas/ProxyAlertsErrorClassRule"
              - $ref: "#/components/schemas/ProxyAlertsStreamDisconnectCauseRule"
      example:
        enabled: true
        default_cooldown_seconds: 300
        default_min_request_count: 50
        default_window_seconds: 60
        default_resolved_window_seconds: 300
        max_concurrent_dispatches: 8
        quiet_hours_utc:
          - from: "23:00"
            to: "06:00"
            weekdays: [0, 6]
        channels:
          ops_slack:
            type: slack
            webhook_url_env: FERRUM_ALERTS_SLACK_WEBHOOK
            channel_override: "#alerts-prod"
          pagerduty_v2:
            type: webhook
            url_env: FERRUM_PAGERDUTY_EVENTS_URL
            method: POST
            headers:
              Content-Type: application/json
            body_template: '{"routing_key":"$ROUTING_KEY","event_action":"${event_action}","payload":{"summary":"${rule_name}: ${reason}","source":"${proxy_name}","severity":"${severity}"}}'
        rules:
          - name: proxy_5xx_spike
            enabled: true
            type: error_rate
            status_codes: [500, 501, 502, 503, 504]
            threshold_percent: 5.0
            min_request_count: 100
            window_seconds: 60
            channels: [ops_slack, pagerduty_v2]
            cooldown_seconds: 300
            recovery:
              resolved_window_seconds: 300
            severity: high

    ProxyAlertsQuietHourWindow:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: UTC start time in strict HH:MM form.
        to:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: UTC end time in strict HH:MM form. Values earlier than `from` wrap past midnight.
        weekdays:
          type: array
          default: []
          description: Days the window applies to (`0 = Sunday` ... `6 = Saturday`). Omit or use `[]` for every day.
          items:
            type: integer
            minimum: 0
            maximum: 6

    ProxyAlertsChannel:
      oneOf:
        - $ref: "#/components/schemas/ProxyAlertsSlackChannel"
        - $ref: "#/components/schemas/ProxyAlertsTeamsChannel"
        - $ref: "#/components/schemas/ProxyAlertsDiscordChannel"
        - $ref: "#/components/schemas/ProxyAlertsWebhookChannel"
      discriminator:
        propertyName: type
        mapping:
          slack: "#/components/schemas/ProxyAlertsSlackChannel"
          teams: "#/components/schemas/ProxyAlertsTeamsChannel"
          discord: "#/components/schemas/ProxyAlertsDiscordChannel"
          webhook: "#/components/schemas/ProxyAlertsWebhookChannel"

    ProxyAlertsSlackChannel:
      type: object
      additionalProperties: false
      required: [type]
      anyOf:
        - required: [webhook_url]
        - required: [webhook_url_env]
      properties:
        type:
          type: string
          enum: [slack]
        webhook_url:
          type: string
          format: uri
          description: Slack incoming webhook URL. Prefer `webhook_url_env` for secrets.
        webhook_url_env:
          type: string
          description: Environment variable containing the Slack incoming webhook URL.
        channel_override:
          type: string
          description: Optional Slack channel override, e.g. `#alerts-prod`.
        username:
          type: string
          description: Optional bot username override.
        icon_emoji:
          type: string
          description: Optional bot icon emoji, e.g. `:rotating_light:`.

    ProxyAlertsTeamsChannel:
      type: object
      additionalProperties: false
      required: [type]
      anyOf:
        - required: [webhook_url]
        - required: [webhook_url_env]
      properties:
        type:
          type: string
          enum: [teams]
        webhook_url:
          type: string
          format: uri
          description: Microsoft Teams incoming webhook URL. Prefer `webhook_url_env` for secrets.
        webhook_url_env:
          type: string
          description: Environment variable containing the Teams incoming webhook URL.

    ProxyAlertsDiscordChannel:
      type: object
      additionalProperties: false
      required: [type]
      anyOf:
        - required: [webhook_url]
        - required: [webhook_url_env]
      properties:
        type:
          type: string
          enum: [discord]
        webhook_url:
          type: string
          format: uri
          description: Discord-compatible webhook URL. Prefer `webhook_url_env` for secrets.
        webhook_url_env:
          type: string
          description: Environment variable containing the Discord webhook URL.
        username:
          type: string
          description: Optional webhook username override.

    ProxyAlertsWebhookChannel:
      type: object
      additionalProperties: false
      required: [type, body_template]
      anyOf:
        - required: [url]
        - required: [url_env]
      properties:
        type:
          type: string
          enum: [webhook]
        url:
          type: string
          format: uri
          description: HTTP(S) endpoint URL. Prefer `url_env` for secrets.
        url_env:
          type: string
          description: Environment variable containing the HTTP(S) endpoint URL.
        method:
          type: string
          enum: [POST, PUT, PATCH]
          default: POST
        headers:
          type: object
          additionalProperties:
            type: string
          default:
            Content-Type: application/json
          description: Headers sent with the webhook request. JSON content types JSON-escape template substitutions.
        body_template:
          type: string
          description: Template body. Supports generic notification variables plus proxy_alerts variables such as `${rule_name}`, `${proxy_name}`, `${observed}`, `${threshold}`, `${sample_count}`, `${window_seconds}`, and `${reason}`.

    ProxyAlertsRule:
      description: |
        Active rules are discriminator-selected closed variants. An explicit
        `enabled: false` draft object is also accepted and may contain
        incomplete or unknown fields; runtime skips drafts before validation.
        Active variants reject `enabled: false` so a complete disabled rule
        cannot satisfy more than one `oneOf` branch.
      oneOf:
        - $ref: "#/components/schemas/ProxyAlertsDisabledDraftRule"
        - $ref: "#/components/schemas/ProxyAlertsErrorRateRule"
        - $ref: "#/components/schemas/ProxyAlertsStatusCodeCountRule"
        - $ref: "#/components/schemas/ProxyAlertsLatencyPercentileRule"
        - $ref: "#/components/schemas/ProxyAlertsErrorClassRule"
        - $ref: "#/components/schemas/ProxyAlertsStreamDisconnectCauseRule"
      discriminator:
        propertyName: type
        mapping:
          error_rate: "#/components/schemas/ProxyAlertsErrorRateRule"
          status_code_count: "#/components/schemas/ProxyAlertsStatusCodeCountRule"
          latency_percentile: "#/components/schemas/ProxyAlertsLatencyPercentileRule"
          error_class: "#/components/schemas/ProxyAlertsErrorClassRule"
          stream_disconnect_cause: "#/components/schemas/ProxyAlertsStreamDisconnectCauseRule"

    ProxyAlertsDisabledDraftRule:
      type: object
      description: |
        Explicitly disabled draft rule. Runtime skips these before validation,
        so incomplete, unknown, or otherwise invalid fields are allowed when
        `enabled` is the boolean `false`. Active complete rules must not use
        this branch (`enabled: false` is excluded from active variants).
      required: [enabled]
      properties:
        enabled:
          const: false
      additionalProperties: true

    ProxyAlertsRuleCommon:
      type: object
      description: >
        Shared rule fields. Closed-object enforcement lives on each selected
        rule variant via `unevaluatedProperties: false` so common and
        type-specific keys compose correctly.
      properties:
        name:
          type: string
          minLength: 1
          description: Unique rule name within this plugin config.
        enabled:
          type: boolean
          enum: [true]
          default: true
          description: >
            Active rules are enabled when this field is omitted or `true`.
            Use `ProxyAlertsDisabledDraftRule` (`enabled: false`) for incomplete drafts.
        window_seconds:
          type: integer
          format: uint32
          minimum: 5
          maximum: 3600
          description: Sliding-window length for this rule.
        channels:
          type: array
          minItems: 1
          items:
            type: string
            pattern: "^[A-Za-z0-9_-]+$"
          description: Channel names from the top-level `channels` map.
        cooldown_seconds:
          type: integer
          format: uint32
          minimum: 1
          maximum: 86400
          description: Per-rule cooldown override.
        recovery:
          oneOf:
            - $ref: "#/components/schemas/ProxyAlertsRecovery"
            - type: "null"
          description: Optional resolved notification settings.
        severity:
          $ref: "#/components/schemas/ProxyAlertsSeverity"

    ProxyAlertsRecovery:
      type: object
      additionalProperties: false
      properties:
        resolved_window_seconds:
          type: integer
          format: uint32
          minimum: 5
          maximum: 86400
          default: 300
          description: How long the rule must stay below threshold before a Resolve notification is sent.

    ProxyAlertsSeverity:
      type: string
      enum: [info, low, medium, high, critical]
      default: medium

    ProxyAlertsErrorRateRule:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ProxyAlertsRuleCommon"
        - type: object
          required: [name, type, status_codes, threshold_percent, channels]
          properties:
            type:
              type: string
              enum: [error_rate]
            status_codes:
              $ref: "#/components/schemas/ProxyAlertsStatusCodeList"
            threshold_percent:
              type: number
              format: double
              exclusiveMinimum: 0
              maximum: 100
              description: Alert when the matching status-code percentage is at least this value.
            min_request_count:
              type: integer
              format: uint64
              minimum: 1
              description: Minimum total requests in the window before the percentage can alert.

    ProxyAlertsStatusCodeCountRule:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ProxyAlertsRuleCommon"
        - type: object
          required: [name, type, status_codes, threshold_count, channels]
          properties:
            type:
              type: string
              enum: [status_code_count]
            status_codes:
              $ref: "#/components/schemas/ProxyAlertsStatusCodeList"
            threshold_count:
              type: integer
              format: uint64
              minimum: 1
              description: Alert when at least this many matching responses occur in the window.

    ProxyAlertsLatencyPercentileRule:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ProxyAlertsRuleCommon"
        - type: object
          required: [name, type, metric, percentile, threshold_ms, channels]
          properties:
            type:
              type: string
              enum: [latency_percentile]
            metric:
              type: string
              enum: [backend_total_ms, backend_ttfb_ms, total_ms, stream_duration_ms]
              description: Latency metric to observe. `stream_duration_ms` applies to TCP/UDP/WebSocket sessions; the others apply to HTTP-family summaries.
            percentile:
              type: integer
              minimum: 1
              maximum: 99
            threshold_ms:
              type: number
              format: double
              exclusiveMinimum: 0
              maximum: 300000
              description: Alert when the bucket upper-bound estimate for the percentile is strictly greater than this threshold.
            min_request_count:
              type: integer
              format: uint64
              minimum: 1
              description: Minimum observations in the window before the percentile can alert.

    ProxyAlertsErrorClassRule:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ProxyAlertsRuleCommon"
        - type: object
          required: [name, type, classes, threshold_count, channels]
          properties:
            type:
              type: string
              enum: [error_class]
            classes:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/ErrorClass"
              description: Error classes counted by this rule. HTTP rules also check `body_error_class`.
            threshold_count:
              type: integer
              format: uint64
              minimum: 1
              description: Alert when at least this many matching errors occur in the window.

    ProxyAlertsStreamDisconnectCauseRule:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ProxyAlertsRuleCommon"
        - type: object
          required: [name, type, causes, threshold_count, channels]
          properties:
            type:
              type: string
              enum: [stream_disconnect_cause]
            causes:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/DisconnectCause"
              description: Stream disconnect causes counted by this rule.
            threshold_count:
              type: integer
              format: uint64
              minimum: 1
              description: Alert when at least this many matching disconnects occur in the window.

    ProxyAlertsStatusCodeList:
      type: array
      minItems: 1
      items:
        type: integer
        minimum: 100
        maximum: 599

    ErrorClass:
      type: string
      enum:
        - connection_timeout
        - connection_refused
        - connection_reset
        - connection_closed
        - dns_lookup_error
        - tls_error
        - read_write_timeout
        - client_disconnect
        - protocol_error
        - response_body_too_large
        - request_body_too_large
        - connection_pool_error
        - port_exhaustion
        - graceful_remote_close
        - dispatch_policy_rejected
        - request_error
      description: |
        Stable classification of a backend dispatch failure. Emitted on
        `TransactionSummary.error_class` / `StreamTransactionSummary.error_class`
        and used by alert rules. `graceful_remote_close` is the HTTP/3 backend's
        spec-legal teardown signal (RFC 9114 §8.1) — the request still 502s but
        the connection stays H3-capable. `dispatch_policy_rejected` covers
        terminal gateway decisions taken before any backend dial (for example
        an unsupportable backend TLS SNI override) and is intentionally not a
        connection error, so retry policies do not fire.

    DisconnectCause:
      type: string
      enum:
        - idle_timeout
        - recv_error
        - backend_error
        - graceful_shutdown

    OtelTracingConfig:
      type: object
      description: "Plugin: otel_tracing — W3C Trace Context propagation and OTLP span export."
      properties:
        endpoint:
          type: string
          description: OTLP/HTTP collector endpoint. Omit for propagation-only mode
        service_name:
          type: string
          default: ferrum-edge
          description: Service name in spans and resource attributes
        deployment_environment:
          type: string
          description: deployment.environment resource attribute
        generate_trace_id:
          type: boolean
          default: true
          description: Generate trace IDs for requests without incoming traceparent
        headers:
          type: object
          additionalProperties:
            type: string
          default: {}
          description: Custom HTTP headers sent with OTLP exports
        authorization:
          type: string
          description: Authorization header value for OTLP exports
        batch_size:
          type: integer
          default: 50
          description: Spans per export batch
        flush_interval_ms:
          type: integer
          default: 5000
          description: Max delay before flushing a partial batch
        buffer_capacity:
          type: integer
          default: 10000
          description: Max pending spans; drops oldest when full
        max_retries:
          type: integer
          default: 2
          description: Retry attempts on export failure
        retry_delay_ms:
          type: integer
          default: 1000
          description: Delay between retries

    MtlsAuthConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: mtls_auth — Authenticates client certificates on HTTP/1.1,
        HTTP/2, HTTP/3, gRPC, WebSocket, terminated TCP+TLS, and UDP+DTLS.
        Stream proxies require frontend_tls=true and passthrough=false.
      properties:
        cert_field:
          type: string
          default: subject_cn
          enum: [subject_cn, subject_ou, subject_o, san_dns, san_email, fingerprint_sha256, serial]
          description: >-
            Certificate field to use as identity. For subject_cn, subject_ou,
            subject_o, san_dns, and san_email Ferrum uses only the first matching
            value in certificate order. DNS SAN matching is ASCII
            case-insensitive; every other field uses exact matching.
        allowed_issuers:
          type: array
          minItems: 1
          items:
            type: object
            required: [ca_certificate_pem]
            additionalProperties: false
            anyOf:
              - required: [cn]
              - required: [o]
              - required: [ou]
            properties:
              cn:
                type: string
                minLength: 1
              o:
                type: string
                minLength: 1
              ou:
                type: string
                minLength: 1
              ca_certificate_pem:
                type: string
                minLength: 1
                description: >-
                  Required for every allowed_issuers entry. Must contain exactly
                  one currently valid PEM-encoded CA certificate with
                  basicConstraints CA:TRUE and keyUsage keyCertSign. Ferrum
                  verifies the leaf signature path to this pinned key; DN labels
                  alone never authorize an issuer. UDP+DTLS exposes no
                  intermediate chain, so its pin must be the immediate issuing CA.
          description: >-
            Per-proxy issuer pins. DN fields are descriptive filters (AND within
            an entry, OR across entries) and must match the pinned CA subject;
            the certificate signature path must also reach ca_certificate_pem.
        allowed_ca_fingerprints_sha256:
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^[0-9A-Fa-f]{64}$'
          description: >-
            SHA-256 fingerprints of allowed verified, client-presented
            intermediate/CA certificates. Rejected for UDP+DTLS because that
            frontend exposes only the leaf certificate.

    JwksAuthConfig:
      type: object
      additionalProperties: false
      description: "Plugin: jwks_auth — Multi-provider JWKS JWT validation with claim-based authorization."
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              jwks_uri:
                type: string
                description: Direct URL to the IdP's JWKS endpoint. HTTPS is required except for literal loopback or localhost endpoints. URL userinfo is rejected.
              discovery_url:
                type: string
                description: >-
                  OIDC discovery URL (auto-discovers jwks_uri). The discovered
                  jwks_uri must use the same origin as the discovery URL
                  (scheme, host, and effective port). For IdPs that serve JWKS
                  from a different origin than discovery, configure jwks_uri
                  directly instead. HTTPS is required except for literal
                  loopback or localhost endpoints. URL userinfo is rejected.
              jwks:
                oneOf:
                  - type: string
                  - type: object
                description: Inline JWKS JSON string or object
              issuer:
                type: string
                description: Expected JWT iss claim — routes tokens to this provider
              audience:
                type: string
                description: Expected JWT aud claim
              audiences:
                type: array
                items:
                  type: string
                description: Accepted JWT aud claims; OR matched
              from_headers:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name:
                      type: string
                      description: Header name to read the token from
                    prefix:
                      type: string
                      description: Optional token prefix to strip; empty string is treated as no prefix
                description: Custom header token locations
              from_params:
                type: array
                items:
                  type: string
                description: Custom query parameter token locations
              forward_original_token:
                type: boolean
                default: true
                description: Whether to forward the token-bearing header or query parameter upstream
              require_exp:
                type: boolean
                description: Per-provider override for requiring an exp claim
              required_scopes:
                type: array
                items:
                  type: string
                description: Scopes that must all be present in the token
              required_roles:
                type: array
                items:
                  type: string
                description: Roles where any one must be present
              scope_claim:
                type: string
                description: Per-provider override for scope claim path
              role_claim:
                type: string
                description: Per-provider override for role claim path
              consumer_identity_claim:
                type: string
                description: Per-provider override for consumer identity claim (falls back to global)
              consumer_header_claim:
                type: string
                description: Per-provider override for consumer header claim (falls back to global)
              claim_headers:
                type: object
                additionalProperties:
                  type: string
                description: Per-provider claim path to upstream header mappings
              claim_headers_separator:
                type: string
                description: Separator for array claim header values
              require_mtls_binding:
                type: boolean
                default: false
                description: Require cnf.x5t#S256 to match the frontend client certificate
              require_dpop:
                type: boolean
                default: false
                description: Require and validate an RFC 9449 DPoP proof
              dpop_clock_skew_secs:
                type: integer
                format: uint64
                default: 30
                description: DPoP iat/exp clock skew allowance in seconds
              dpop_jti_cache_max_entries:
                type: integer
                default: 10000
                description: Maximum entries in the per-provider DPoP replay cache
              dpop_jti_ttl_secs:
                type: integer
                format: uint64
                default: 300
                description: DPoP jti replay cache TTL in seconds
          description: Array of identity provider configurations
        scope_claim:
          type: string
          default: scope
          description: Global scope claim path
        role_claim:
          type: string
          default: roles
          description: Global role claim path
        consumer_identity_claim:
          type: string
          default: sub
          description: JWT claim for consumer lookup
        consumer_header_claim:
          type: string
          description: JWT claim for X-Consumer-Username header (default same as consumer_identity_claim)
        claim_headers:
          type: object
          additionalProperties:
            type: string
          description: Global claim path to upstream header mappings
        claim_headers_separator:
          type: string
          default: ","
          description: Separator for array claim header values
        emit_mesh_request_principal_metadata:
          type: boolean
          default: false
          description: Emits mesh.request_principal plus mesh JWT claim/audience metadata for direct mesh_authz request-principal and when-condition evaluation
        require_exp:
          type: boolean
          default: true
          description: Global default for requiring an exp claim
        jwks_refresh_interval_secs:
          type: integer
          format: uint64
          default: 900
          description: JWKS key refresh interval in seconds

    Oauth2IntrospectionConfig:
      type: object
      additionalProperties: false
      description: "Plugin: oauth2_introspection — RFC 7662 bearer token introspection with bounded, explicit multi-provider routing."
      required: [providers]
      properties:
        providers:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            properties:
              introspection_endpoint:
                type: string
                description: >-
                  Direct token introspection endpoint URL. Must use https when
                  client_auth.method is credentialed (client_secret_basic,
                  client_secret_post, or private_key_jwt) and the host is not
                  loopback/localhost; http is only permitted for loopback hosts.
              discovery_url:
                type: string
                description: >-
                  OIDC discovery URL used to resolve introspection_endpoint. Must
                  use https when client_auth.method is credentialed and the host
                  is not loopback/localhost; http is only permitted for loopback
                  hosts. The discovered endpoint must preserve the discovery
                  URL's scheme, normalized host, and effective port.
              issuer:
                type: string
                description: Expected iss claim in active introspection responses
              audiences:
                type: array
                items:
                  type: string
                description: Accepted aud claims; OR matched
              client_auth:
                type: object
                additionalProperties: false
                properties:
                  method:
                    type: string
                    enum:
                      - client_secret_basic
                      - client_secret_post
                      - private_key_jwt
                      - none
                    default: client_secret_basic
                    description: >-
                      Client authentication method against the introspection
                      endpoint. Credentialed methods (client_secret_basic,
                      client_secret_post, private_key_jwt) require an https
                      endpoint for non-loopback hosts; http is only accepted
                      for loopback/localhost endpoints. The 'none' method is
                      loopback/localhost-only regardless of scheme.
                  client_id:
                    type: string
                  client_secret:
                    type: string
                    format: password
                  private_key_pem:
                    type: string
                    format: password
                  private_key_jwt_alg:
                    type: string
                    enum: [RS256, RS384, RS512, ES256, ES384, EdDSA]
                  private_key_jwt_kid:
                    type: string
              from_headers:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name:
                      type: string
                    prefix:
                      type: string
              from_params:
                type: array
                items:
                  type: string
              forward_original_token:
                type: boolean
                default: true
              positive_cache_ttl_secs:
                type: integer
                format: uint64
                default: 60
              negative_cache_ttl_secs:
                type: integer
                format: uint64
                default: 10
              request_timeout_ms:
                type: integer
                format: uint64
                default: 5000
              max_cache_entries:
                type: integer
                default: 10000
              token_hint_param:
                type: [string, "null"]
              required_scopes:
                type: array
                items:
                  type: string
              required_roles:
                type: array
                items:
                  type: string
              scope_claim:
                type: string
              role_claim:
                type: string
              consumer_identity_claim:
                type: string
              consumer_header_claim:
                type: string
              claim_headers:
                type: object
                additionalProperties:
                  type: string
                description: Claim path to upstream header mappings
        allow_provider_fanout:
          type: boolean
          default: false
          description: >-
            Allow one Authorization bearer token to be submitted sequentially
            to multiple providers. Enable only when every provider shares one
            credential trust boundary. By default, multi-provider configs must
            use distinct from_headers/from_params routing hints or have exactly
            one provider that uses the Authorization location.
        scope_claim:
          type: string
          default: scope
        role_claim:
          type: string
          default: roles
        consumer_identity_claim:
          type: string
          default: username
        consumer_header_claim:
          type: string

    OidcRelyingPartyConfig:
      type: object
      additionalProperties: false
      description: "Plugin: oidc_relying_party — Browser OIDC relying party with authorization code + PKCE and encrypted sessions."
      required: [providers, session]
      properties:
        providers:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [issuer, client_id, redirect_uri]
            properties:
              issuer:
                type: string
                description: Expected ID token issuer
              discovery_url:
                type: string
                description: OIDC discovery URL
              authorization_endpoint:
                type: string
              token_endpoint:
                type: string
              userinfo_endpoint:
                type: string
              jwks_uri:
                type: string
              end_session_endpoint:
                type: string
              post_logout_redirect_uri:
                type: string
                description: Absolute HTTPS redirect URI sent to the provider after RP-initiated logout; HTTP is allowed only for localhost or literal loopback development endpoints.
              client_id:
                type: string
              client_auth:
                type: object
                additionalProperties: false
                properties:
                  method:
                    type: string
                    enum:
                      - client_secret_basic
                      - client_secret_post
                      - private_key_jwt
                      - none
                    default: client_secret_basic
                  client_secret:
                    type: string
                    format: password
                  private_key_pem:
                    type: string
                    format: password
                  private_key_jwt_alg:
                    type: string
                    enum: [RS256, RS384, RS512, ES256, ES384, EdDSA]
                  private_key_jwt_kid:
                    type: string
              redirect_uri:
                type: string
                description: Absolute callback URI registered with the provider. Before issuing a browser challenge, Ferrum requires its host to match the validated request Host/:authority; DNS comparison is case-insensitive, IP literals compare by address, and ports are ignored. Trailing-dot DNS callback hosts and missing, malformed, or cross-host request authorities fail closed before state or cookies are issued.
              callback_path:
                type: string
                default: /oauth/callback
                description: Callback path handled by Ferrum; must equal the path in redirect_uri.
              logout_path:
                type: string
                default: /oauth/logout
              scopes:
                type: array
                items:
                  type: string
              audiences:
                type: array
                items:
                  type: string
              required_scopes:
                type: array
                items:
                  type: string
              required_roles:
                type: array
                items:
                  type: string
              scope_claim:
                type: string
              role_claim:
                type: string
              consumer_identity_claim:
                type: string
              consumer_header_claim:
                type: string
              claim_headers:
                type: object
                additionalProperties:
                  type: string
              id_token_clock_skew_secs:
                type: integer
                format: uint64
                default: 60
        session:
          type: object
          additionalProperties: false
          required: [encryption_secret]
          properties:
            encryption_secret:
              type: string
              format: password
              description: Session cookie encryption secret; must be at least 32 bytes
            encryption_secret_previous:
              type: string
              format: password
              description: Previous encryption secret accepted during rotation
            cookie_name:
              type: string
              description: Cookie name. When omitted, Ferrum derives a context-specific name from the provider and authorization policy.
            store:
              type: string
              enum: [cookie]
              default: cookie
            ttl_secs:
              type: integer
              format: uint64
              default: 3600
            idle_ttl_secs:
              type: integer
              format: uint64
              default: 1800
            max_cookie_bytes:
              type: integer
              format: uint64
              default: 8000
            secure:
              type: boolean
              default: true
            http_only:
              type: boolean
              default: true
            same_site:
              type: string
              enum: [lax, strict, none]
              default: lax
            domain:
              type: string
              description: Optional Domain attribute for the durable session cookie. The short-lived browser correlation cookie always remains host-only and never inherits this value.
            path:
              type: string
              default: /
        behavior:
          type: object
          additionalProperties: false
          properties:
            state_ttl_secs:
              type: integer
              format: uint64
              default: 600
              minimum: 1
              maximum: 3600
            state_cache_max_entries:
              type: integer
              format: uint64
              default: 10000
              minimum: 1
              description: Global maximum number of pending browser authorization flows for this plugin instance.
            state_cache_max_entries_per_source:
              type: integer
              format: uint64
              default: 32
              minimum: 1
              description: Maximum pending browser authorization flows per resolved client IP; must not exceed state_cache_max_entries.
            post_login_redirect_param:
              type: string
            trusted_redirect_hosts:
              type: array
              items:
                type: string
            refresh_skew_secs:
              type: integer
              format: uint64
              default: 30
            challenge_html_status:
              type: integer
              default: 302
            challenge_api_status:
              type: integer
              default: 401
            html_accept_substrings:
              type: array
              items:
                type: string
            rp_initiated_logout:
              type: boolean
              default: true
            post_login_default_path:
              type: string
              default: /

    JwtAuthConfig:
      type: object
      description: "Plugin: jwt_auth — HS256 JWT Bearer token authentication."
      additionalProperties: false
      properties:
        token_lookup:
          type: string
          default: "header:Authorization"
          description: "Where to find the token (header:<name> or query:<name>)"
        consumer_claim_field:
          type: string
          default: sub
          description: JWT claim identifying the consumer
        expected_issuer:
          type: string
          description: Required iss claim; mutually exclusive with expected_issuers
        expected_issuers:
          type: array
          items:
            type: string
          description: Accepted iss claims
        audiences:
          type: array
          items:
            type: string
          description: Accepted aud claims; audience validation is disabled when empty
        require_exp:
          type: boolean
          default: true
          description: Require an exp claim; expiration is always validated when present
        require_nbf:
          type: boolean
          default: false
          description: Require an nbf claim; when present, nbf is always validated
        leeway_secs:
          type: integer
          format: uint64
          default: 0
          maximum: 300
          description: Clock leeway for time-based JWT claims

    KeyAuthConfig:
      type: object
      additionalProperties: false
      description: "Plugin: key_auth — API key authentication."
      properties:
        key_location:
          type: string
          default: "header:X-API-Key"
          pattern: "^(header:[!#$%&'*+.^_`|~0-9A-Za-z-]+|query:\\S+)$"
          description: >-
            Exact credential location (header:<name> or query:<name>).
            Whitespace is not trimmed; header names must be valid HTTP tokens,
            and query names must be non-empty and contain no whitespace.
        hide_credentials:
          type: boolean
          default: true
          description: >-
            Remove the configured API-key header or query parameter before
            forwarding an authenticated request upstream, including when
            another mechanism wins a multi-auth chain. Disable only when a
            legacy backend explicitly requires the reusable credential.

    BasicAuthConfig:
      type: object
      description: "Plugin: basic_auth — HTTP Basic credentials verified against HMAC-SHA256 password hashes."
      properties: {}

    LdapAuthConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: ldap_auth — LDAP directory authentication with optional AD group
        filtering. Status codes distinguish failure classes: invalid credentials
        or unknown user return 401; a user authorized by bind but not in any
        `required_groups` returns 403; backend/configuration failures (directory
        unreachable, service-account bind failure, or search RPC error) return 500
        rather than 401, so clients are not falsely told their credentials are
        wrong. When `required_groups` is set without a service account
        (`service_account_dn`/`service_account_password`), the group-membership
        search uses an ANONYMOUS bind; group enforcement then only works if the
        directory permits anonymous reads of group objects, so a service account
        is recommended. TLS connections (`ldaps://`/STARTTLS) honor the gateway
        CRL (`FERRUM_TLS_CRL_FILE_PATH`), rejecting revoked server certificates.
        Every connection/reconnection performs an uncached A+AAAA lookup, screens
        the complete candidate set and each imminent dial under the active backend
        egress policy, and retains the configured hostname for TLS/SNI verification.
        Non-loopback plaintext `ldap://` is rejected unless the development-only
        `allow_plaintext` override is explicitly enabled. Search-then-bind requires
        a canonical identity attribute, rejects ambiguous searches, and exports the
        selected entry's canonical value rather than the presented username.
      required:
        - ldap_url
      allOf:
        - anyOf:
            - required: [bind_dn_template]
            - required:
                - search_base_dn
                - search_filter
                - canonical_identity_attribute
                - service_account_dn
                - service_account_password
        - if:
            required: [search_base_dn, search_filter]
          then:
            required: [service_account_dn, service_account_password]
        - if:
            required: [ldap_url]
            properties:
              ldap_url:
                pattern: "^ldap://"
          then:
            anyOf:
              - required: [starttls]
                properties:
                  starttls:
                    const: true
              - required: [allow_plaintext]
                properties:
                  allow_plaintext:
                    const: true
              - properties:
                  ldap_url:
                    pattern: '^ldap://(?:127(?:\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})){3}|\[::1\]|(?:[^/?#@]+\.)?[lL][oO][cC][aA][lL][hH][oO][sS][tT]\.?)(?::[0-9]+)?(?:[/?#]|$)'
        - if:
            required: [required_groups]
            properties:
              required_groups:
                minItems: 1
          then:
            required: [group_base_dn]
            properties:
              group_filter:
                pattern: '\{(?:user_dn|username)\}'
        - not:
            required: [ldap_url, starttls]
            properties:
              ldap_url:
                pattern: "^ldaps://"
              starttls:
                const: true
      properties:
        ldap_url:
          type: string
          minLength: 1
          pattern: "^ldaps?://"
          not:
            pattern: "^ldaps?://[^/?#]*@"
          description: "LDAP server URL. Use ldaps:// or ldap:// with starttls=true; non-loopback plaintext ldap:// requires the explicit development-only allow_plaintext override. Embedded URL credentials are rejected. Each connection freshly resolves and policy-screens all A/AAAA candidates while retaining this hostname for TLS/SNI verification."
          example: "ldaps://ldap.example.com:636"
        bind_dn_template:
          type: string
          minLength: 1
          pattern: '\{username\}'
          description: "Direct bind DN template with {username} placeholder"
          example: "uid={username},ou=users,dc=example,dc=com"
        search_base_dn:
          type: string
          minLength: 1
          description: "Base DN for search-then-bind user search"
        search_filter:
          type: string
          minLength: 1
          pattern: '\{username\}'
          description: "LDAP search filter with {username} placeholder"
          example: "(&(objectClass=user)(sAMAccountName={username}))"
        canonical_identity_attribute:
          type: string
          minLength: 1
          description: "Required for search-then-bind. Exactly one value from the uniquely selected entry becomes the authenticated identity, Consumer mapping key, custom group-filter {username}, and default memberUid value (for example uid or sAMAccountName). Choose the authoritative attribute whose value username-based groups store; mismatches fail closed and never fall back to the presented login. Attribute-name matching is LDAP case-insensitive."
        service_account_dn:
          type: string
          minLength: 1
          description: "DN for the service account used in search-then-bind"
        service_account_password:
          type: string
          minLength: 1
          writeOnly: true
          format: password
          description: "Password for the service account"
        group_base_dn:
          type: string
          minLength: 1
          description: "Base DN for group membership search"
        group_filter:
          type: string
          minLength: 1
          description: "Group search filter. When required_groups is non-empty, a custom filter must contain {user_dn} or {username}. {username} is the authenticated canonical identity: the presented username for direct bind, or canonical_identity_attribute for search-then-bind. Before authorization, every custom-filter match is rechecked against the exact returned group DN using member, uniqueMember, and memberUid so a static branch cannot fabricate membership."
        required_groups:
          type: array
          items:
            type: string
            minLength: 1
          description: "LDAP/AD group names the user must belong to (OR logic)"
        group_attribute:
          type: string
          minLength: 1
          default: "cn"
          description: "Attribute containing the group name; returned LDAP attribute names are matched case-insensitively"
        starttls:
          type: boolean
          default: false
          description: "Use STARTTLS to upgrade ldap:// connections; invalid with ldaps://"
        allow_plaintext:
          type: boolean
          default: false
          description: "Development-only override allowing a non-loopback ldap:// endpoint without STARTTLS. Service-account and user passwords then have no transport confidentiality."
        connect_timeout_seconds:
          type: integer
          format: uint64
          default: 5
          minimum: 1
          maximum: 300
          description: "Per-connection DNS resolution, candidate TCP/TLS establishment, and per-operation timeout in seconds; also applied as the server-side LDAP search time limit"
        request_timeout_seconds:
          type: integer
          format: uint64
          minimum: 1
          maximum: 300
          description: "Strict wall-clock deadline in seconds for the complete uncached authentication and group-check flow. The effective default is 15 seconds, raised to connect_timeout_seconds when that value is larger."
        max_concurrent_requests:
          type: integer
          format: uint64
          default: 64
          minimum: 1
          maximum: 1024
          description: "Maximum concurrent uncached LDAP authentication flows per plugin instance; excess requests fail immediately"
        cache_ttl_seconds:
          type: integer
          format: uint64
          default: 0
          minimum: 0
          maximum: 86400
          description: "Cache TTL for successful auth results (0 = disabled, maximum 24 hours)"
        max_cache_entries:
          type: integer
          format: uint64
          default: 10000
          minimum: 1
          description: "Strict maximum entries in the auth result cache. At capacity, one existing entry is replaced without a full-cache scan."
        consumer_mapping:
          type: boolean
          default: true
          description: "Whether to map LDAP user to a gateway Consumer"

    HmacAuthConfig:
      type: object
      description: >-
        Plugin: hmac_auth — Ferrum-specific versioned HMAC authorization with
        mandatory request-body integrity protection. RFC 9530 defines
        Content-Digest; this is not RFC 9421 HTTP Message Signatures. Requests
        must include Digest or Content-Digest matching the original body.
        Version 1 signs the matched proxy namespace, credential identity,
        normalized authority, method, path, raw query, Date, and literal digest
        value. HBONE CONNECT and
        request-body-transformer compositions fail closed. The
        pre-authentication body path has a 10 MiB hard ceiling. Date provides a
        bounded freshness window, not single-use replay prevention.
      properties:
        clock_skew_seconds:
          type: integer
          format: uint64
          default: 300
          description: Maximum allowed clock skew in seconds for the Date header freshness window. The Date header bounds replay to this window but does not prevent in-window replay (no nonce store); keep it tight for non-idempotent routes.

    # ── Mesh / Service-Mesh Plugins ─────────────────────────────────
    # These plugins are primarily auto-injected by mesh mode (sidecar / ambient /
    # east-west / egress / waypoint topologies) from the CP-delivered slice. They
    # are also accepted as operator-managed `plugin_configs` rows on non-mesh
    # gateways for standalone deployments, with the schema below.
    SpiffeIdentityConfig:
      type: object
      description: |
        Plugin: spiffe_identity — Extracts the SPIFFE ID from the peer
        certificate's URI SAN and populates `ctx.peer_spiffe_id` /
        `StreamConnectionContext` metadata for downstream auth and rate-limit
        plugins (notably `mesh_authz` and `rate_limiting` with
        `limit_by: spiffe_identity`).

        Auto-injected by mesh mode on every applicable topology; reserved
        plugin id `__mesh_spiffe_identity`. Standalone usage is supported on
        non-mesh gateways that still terminate mTLS and want to surface the
        SPIFFE identity to other plugins.
      additionalProperties: false
      properties: {}

    MeshAuthzConfig:
      type: object
      description: |
        Plugin: mesh_authz — Layer 2 mesh authorization evaluator. Applies
        Istio-style `MeshPolicy` (ALLOW / DENY / AUDIT) rules to the SPIFFE
        identity extracted by `spiffe_identity` or the HBONE baggage on
        ambient mTLS streams. DENY rules are evaluated first (first match
        wins); the presence of any ALLOW rule with no match triggers an
        implicit deny.

        Source matching enforces both the positive identity matchers
        (`principals` in Istio `<trust-domain>/ns/.../sa/...` form,
        `serviceAccounts`, `namespaces`, `trustDomains`,
        `requestPrincipals`) and the conjunctive negative and IP-block
        matchers (`notPrincipals`/`notServiceAccounts`/`notNamespaces`/
        `notTrustDomains`/`notRequestPrincipals`/`ipBlocks`/`notIpBlocks`/
        `remoteIpBlocks`/`notRemoteIpBlocks`). `when:` conditions are
        evaluated against
        request attributes (`source.principal`, `source.namespace`,
        `request.auth.principal`, `request.auth.presenter`,
        `request.auth.audiences`,
        `request.auth.claims[...]` string or string-list values including
        nested claim leaf paths,
        `request.headers[...]`,
        `destination.port`, `connection.sni`, `source.ip`, `remote.ip`).
        Unsupported `when:` keys are rejected during translation/config
        validation so DENY conditions cannot silently fail open.
        DENY rules treat missing HTTP-only operation/condition attributes as
        matches, matching Istio's TCP behavior for policies that mention HTTP
        fields.
        Negative identity matchers reject only when the source/JWT identity
        is present and matches an excluded pattern; absent identities satisfy
        the negative matcher so DENY policies such as `notPrincipals: ["*"]`
        and `notRequestPrincipals: ["*"]` catch anonymous traffic. IP-block
        matchers fail closed when the IP they test is absent, and malformed
        CIDRs reject translated resources or direct plugin config. See
        `docs/mesh.md`.

        Auto-injected by mesh mode on every applicable topology; reserved
        plugin id `__mesh_authz`. PolicyScope filtering (`MeshWide` /
        `Namespace` / `WorkloadSelector`) is applied at construction time
        from the slice-embedded workload identity, except in node-waypoint
        topology where the filter runs per-request against the pod-scoped
        cache attached to `RequestContext`.
      properties:
        mesh_slice:
          type: object
          description: |
            Embedded mesh slice — supplied by mesh-mode auto-injection.
            Carries the filtered policy set plus the workload's
            `namespace`/`labels` used for slice-level scope filtering. Not
            intended for direct operator configuration; operator-managed
            instances pass `mesh_policies` instead.
        mesh_policies:
          type: array
          items:
            type: object
            description: A single `MeshPolicy` document. See `docs/mesh.md`.
          description: |
            Standalone-mode policy list. Used by direct configuration / tests
            when no slice is available.
        namespace:
          type: string
          description: |
            Proxy workload namespace, used by the slice-level PolicyScope
            filter to discard policies that do not apply to this workload.
            Overrides any namespace embedded in `mesh_slice`.
        labels:
          type: object
          additionalProperties:
            type: string
          description: |
            Proxy workload labels, used by the slice-level scope filter for
            `WorkloadSelector`-scoped policies. Overrides any labels embedded
            in `mesh_slice`.
        trust_domain_aliases:
          type: array
          items:
            type: string
          description: |
            Additional SPIFFE trust domains accepted as equivalent to the
            peer cert's trust domain when authorising HBONE baggage
            `source.principal`. Empty (default) means strict same-trust-domain
            match.
        per_pod_policy_scoping:
          type: boolean
          default: false
          description: |
            When `true`, the construction-time slice-level scope filter is
            skipped and policies are filtered per-connection using the
            `PolicyScopeCache` attached to `RequestContext.node_waypoint_policy_scope`
            (HTTP/HBONE) or `StreamConnectionContext.node_waypoint_policy_scope`
            (raw TCP streams). A connection whose source pod has no resolved
            per-pod scope records `mesh_authz.scope_missing`; when any
            namespace/selector-scoped policy is configured it then **fails closed**
            (`403`, `mesh_authz.deny_policy=scope_missing`) on the HTTP/HBONE
            request path and raw TCP streams (at accept) — a missing scope
            means the source workload left the live slice generation, not an
            enrollment race, so a long-lived connection from a removed workload
            stops being served under scoped authz. NodeWaypoint UDP/DTLS has no
            trustworthy per-datagram/session pod scope, so slice preparation
            disables UDP/DTLS service/proxy paths when enforcing
            namespace/selector-scoped policies are present; mesh-wide UDP/DTLS
            policy remains evaluable, and audit-only scoped policy does not
            force suppression. Auto-set by mesh injection on `NodeWaypoint`
            topology where one listener serves many pods.
        ambient_udp_source_scoping:
          type: boolean
          default: false
          readOnly: true
          description: >-
            Enables node-waypoint Ambient UDP source-policy scoping. Injected
            by mesh runtime configuration rather than operator-managed plugin
            config.
        cluster_domain:
          type: string
          default: cluster.local
          readOnly: true
          description: Primary Kubernetes cluster domain injected by mesh mode.
        cluster_domains:
          type: array
          readOnly: true
          items:
            type: string
          description: >-
            Deduplicated cluster-domain aliases used for node-waypoint service
            host matching; injected by mesh mode.
        node_waypoint_route_upstreams:
          type: array
          readOnly: true
          description: >-
            Mesh-generated route upstream metadata used to precompute
            destination policy scopes for node-waypoint dispatch.
          items:
            type: object
            required: [id, namespace]
            properties:
              id:
                type: string
              namespace:
                type: string
              targets:
                type: array
                items:
                  type: object
                  required: [host, port]
                  properties:
                    host:
                      type: string
                    port:
                      type: integer
                      format: uint16
                    service_namespace:
                      type: [string, "null"]
                    service_name:
                      type: [string, "null"]
                    service_port:
                      type: [integer, "null"]
                      format: uint16
        trusted_hbone_assertors:
          type: array
          items:
            type: string
          default: ["ztunnel", "waypoint"]
          description: |
            Allow-list of identity-asserting infrastructure components whose
            HBONE baggage `source.principal` may rewrite the authz principal.
            Bare service-account names match any peer whose SPIFFE path ends
            with `/sa/<name>`; full SPIFFE IDs match exactly. Default is
            `["ztunnel", "waypoint"]`. Explicit empty array disables all
            baggage rewriting.

    MeshOutboundRegistryConfig:
      type: object
      description: |
        Plugin: mesh_outbound_registry — Implements Istio
        `MeshConfig.outboundTrafficPolicy.mode: REGISTRY_ONLY`. Rejects HTTP
        requests whose `Host` header is not in the configured destination
        registry. Auto-injected by mesh mode when the slice declares
        `RegistryOnly`; not registered when policy is `AllowAny` (default).
        Operator-managed instances on non-mesh gateways behave as a generic
        HTTP `Host` allowlist.

        Matches against four kinds of entries: bare hostnames (no Host port),
        explicit `host:port` pairs, `host:*` (any explicit Host port), and
        wildcard hosts (`*.example.com`, `*.example.com:443`,
        `*.example.com:*`). Empty registry fails closed.
      properties:
        registry:
          type: array
          items:
            type: string
          default: []
          description: |
            Known destinations. Bare hostnames match requests with no
            explicit `Host` port. `host:port` entries match only that port.
            `host:*` entries match any explicit port. Wildcard entries
            (`*.example.com[:port|:*]`) match one DNS label below the
            suffix.
        reject_status:
          type: integer
          format: uint16
          minimum: 400
          maximum: 599
          default: 502
          description: |
            Status code returned for unknown destinations. Operators may
            override to 404 to mask unknown destinations.
        outbound_listen_ports:
          type: array
          items:
            type: integer
            format: uint16
            minimum: 1
          default: []
          description: |
            Optional frontend listener ports where the registry is enforced.
            Empty means enforce on every HTTP-family request that reaches
            the plugin (operator-managed default). Mesh auto-injection sets
            this to the outbound capture listener port so the global plugin
            does not apply to inbound listeners. Port `0` is rejected at
            runtime construction; use `[]` for intentional global scope.
        namespace:
          type: string
          default: ferrum
          description: Mesh namespace label used by the Prometheus decision counter.

    MeshRouteDispatchConfig:
      type: object
      additionalProperties: false
      description: |
        Plugin: mesh_route_dispatch — Per-request route override driven by
        method / header / query-param predicates. Closes the Istio
        `VirtualService.http[].match` header/method gap without extending
        the `Proxy` schema. Runs after authentication, authorization, and
        rate limiting — admission decisions still use the public listener
        identity; only downstream `before_proxy` plugins and backend
        dispatch see the effective override destination.

        At least one rule is required. When multiple plugin instances run on
        one proxy, each matching instance replaces the override destination
        set by earlier instances. Per-rule `backend_tls` is direct-backend
        only (`upstream_id` destinations inherit TLS from the referenced
        Upstream).

        Unknown keys are rejected at every owned nesting level, including
        route-local `retry` / backoff and destination `backend_tls`
        (`additionalProperties: false` / serde `deny_unknown_fields`). Shared
        gateway `RetryConfig` and `BackendTlsConfig` schemas remain open for
        other consumers; mesh routes use `MeshRouteRetryConfig` and
        `MeshRouteBackendTlsConfig`.
      required: [rules]
      properties:
        rules:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            description: |
              One ordered route rule. `destination` is required unless the
              rule carries a `redirect` (which answers the request itself and
              needs no backend). First match wins.
            anyOf:
              - required: [destination]
              - required: [redirect]
            allOf:
              - if:
                  required: [timeout_disabled]
                  properties:
                    timeout_disabled:
                      const: true
                then:
                  properties:
                    timeout_ms:
                      type: "null"
              - if:
                  required: [retry_disabled]
                  properties:
                    retry_disabled:
                      const: true
                then:
                  properties:
                    retry:
                      type: "null"
            properties:
              match:
                type: object
                additionalProperties: false
                description: |
                  Match criteria — all configured fields must match for the
                  rule to fire. At least one of `methods`/`headers`/
                  `query_params`/`authority`/`source_namespace`/`uri` must be
                  configured (an empty match is rejected at load time).
                properties:
                  methods:
                    type: array
                    items:
                      oneOf:
                        - type: string
                          description: Bare-string back-compat form, interpreted as Exact.
                        - type: object
                          description: |
                            Istio StringMatch shape — exactly one of
                            `exact` / `prefix` / `regex`. Prefix patterns are
                            uppercased at compile time (methods are uppercase
                            ASCII per RFC 9110 §9.1); regex patterns are
                            interpreted verbatim inside full-input anchors.
                          additionalProperties: false
                          properties:
                            exact:
                              type: string
                            prefix:
                              type: string
                            regex:
                              type: string
                    description: HTTP methods (any-of). Empty = no method restriction.
                  headers:
                    type: object
                    additionalProperties:
                      oneOf:
                        - type: string
                          description: Bare-string back-compat form, interpreted as Exact.
                        - type: object
                          description: |
                            Istio StringMatch shape — exactly one of
                            `exact` / `prefix` / `regex`.
                          additionalProperties: false
                          properties:
                            exact:
                              type: string
                            prefix:
                              type: string
                            regex:
                              type: string
                    description: Header matches (all-of). Header names are case-insensitive.
                  query_params:
                    type: object
                    additionalProperties:
                      type: string
                    description: Query parameter equality matches (all-of). Decoded after percent-decoding.
                  uri:
                    description: |
                      Optional URI predicate (Istio `StringMatch` shape).
                      Exactly one of `exact` / `prefix` / `regex`. This is
                      normally omitted because the parent proxy `listen_path`
                      gates URI selection; the VirtualService translator emits
                      it for widened `ignoreUriCase` routes and collapsed
                      route-order fallbacks that need dispatch-layer URI
                      precision. Regex patterns must match the full URI path.
                    oneOf:
                      - type: object
                        required: [exact]
                        additionalProperties: false
                        properties:
                          exact:
                            type: string
                      - type: object
                        required: [prefix]
                        additionalProperties: false
                        properties:
                          prefix:
                            type: string
                      - type: object
                        required: [regex]
                        additionalProperties: false
                        properties:
                          regex:
                            type: string
                  ignore_uri_case:
                    type: boolean
                    description: |
                      When true, folds ASCII case for `match.uri.exact` and
                      `match.uri.prefix` comparisons only. Regex URI matches
                      keep their operator-supplied regex unchanged; operators
                      who want case-insensitive regex should write `(?i)` in
                      the pattern. Requires `match.uri`.
                  source_namespace:
                    type: [string, "null"]
                    description: |
                      Source workload Kubernetes namespace (exact match).
                      Mirrors Istio `VirtualService.http[].match.sourceNamespace`:
                      the CRD models this as an exact-only string (no
                      `prefix`/`regex` arms). Resolved from the peer's SPIFFE
                      ID via the Istio convention
                      `spiffe://<trust-domain>/ns/<namespace>/sa/<service-account>`.
                      Matches are case-sensitive (Kubernetes namespace names
                      are RFC 1123 lowercase). The predicate fails closed
                      (returns no-match) when the request carries no resolved
                      peer SPIFFE identity, so non-mesh requests and clients
                      that present non-SPIFFE certificates do not match.
                      Empty / whitespace-only values are rejected at load time.
                  authority:
                    description: |
                      `:authority` / `Host` match (Istio `HTTPMatchRequest.authority`).
                      Exactly one of `exact` / `prefix` / `regex` per rule.
                      Exact and prefix patterns compare against the raw request
                      `Host`/`:authority` case-sensitively, including an
                      explicit request port when present. Regex patterns are
                      compiled verbatim and must match the full authority
                      string; operators who want case-insensitive regex should
                      write `(?i)` in the pattern. Distinct from
                      VirtualService-level `hosts`, which gates proxy
                      admission — this is a per-rule predicate evaluated AFTER
                      routing has picked the proxy.
                    oneOf:
                      - type: string
                        description: Bare-string back-compat form, interpreted as Exact.
                      - type: object
                        required: [exact]
                        additionalProperties: false
                        properties:
                          exact:
                            type: string
                      - type: object
                        required: [prefix]
                        additionalProperties: false
                        properties:
                          prefix:
                            type: string
                      - type: object
                        required: [regex]
                        additionalProperties: false
                        properties:
                          regex:
                            type: string
              destination:
                type: object
                additionalProperties: false
                description: |
                  Override applied on match. At least one field must be set.
                  `upstream_id` is mutually exclusive with the direct-backend
                  fields (`backend_host`/`backend_port`/`backend_tls`).
                properties:
                  upstream_id:
                    type: [string, "null"]
                  backend_host:
                    type: [string, "null"]
                  backend_port:
                    type: [integer, "null"]
                    format: uint16
                    minimum: 1
                  backend_tls:
                    description: Optional per-rule backend TLS override (direct backends only).
                    oneOf:
                      - $ref: "#/components/schemas/MeshRouteBackendTlsConfig"
                      - type: "null"
                  requires_node_waypoint_authz:
                    type: boolean
                    default: false
                    description: |
                      Trusted mesh-translator marker. When scoped NodeWaypoint
                      authorization is active, a matching destination carrying
                      this marker requires an authorized destination stamp.
              timeout_ms:
                type: [integer, "null"]
                format: uint64
                description: |
                  Optional route-local backend response/read timeout in
                  milliseconds. Mutually exclusive with
                  `timeout_disabled: true`.
              timeout_disabled:
                type: boolean
                default: false
                description: |
                  Explicitly clear the selected proxy's inherited backend
                  response/read timeout. Cannot be true when `timeout_ms` is set.
              retry:
                oneOf:
                  - $ref: "#/components/schemas/MeshRouteRetryConfig"
                  - type: "null"
                description: |
                  Optional route-local retry policy. Mutually exclusive with
                  `retry_disabled: true`.
              retry_disabled:
                type: boolean
                default: false
                description: |
                  Explicitly clear the selected proxy's inherited retry
                  policy. Cannot be true when `retry` is set.
              request_transform:
                type: array
                description: |
                  Per-rule request header transforms (Istio VirtualService
                  `http[].headers.request.{set,add,remove}`). Published onto
                  `RequestContext.route_override_request_transform` when this
                  rule matches; consumed by the `request_transformer` plugin
                  on the proxy when its `apply_route_overrides` flag is true.
                  Route-level transforms layer AFTER the static plugin rules,
                  so route-level header writes win on conflict. Validated at
                  config load — CRLF in values and unknown operations are
                  rejected.
                items:
                  type: object
                  additionalProperties: false
                  required: [operation, key]
                  allOf:
                    - if:
                        required: [operation]
                        properties:
                          operation:
                            enum: [add, update]
                      then:
                        required: [value]
                        properties:
                          value:
                            type: string
                    - if:
                        required: [operation]
                        properties:
                          operation:
                            const: remove
                      then:
                        properties:
                          value:
                            type: "null"
                  properties:
                    operation:
                      type: string
                      enum: [add, update, remove]
                    target:
                      type: string
                      enum: [header]
                      default: header
                    key:
                      type: string
                    value:
                      type: [string, "null"]
                      description: Required and non-null for add/update; omitted or null for remove.
              response_transform:
                type: array
                description: |
                  Per-rule response header transforms (Istio VirtualService
                  `http[].headers.response.{set,add,remove}`). Same shape as
                  `request_transform` but applied on the response path via
                  the `response_transformer` plugin.
                items:
                  type: object
                  additionalProperties: false
                  required: [operation, key]
                  allOf:
                    - if:
                        required: [operation]
                        properties:
                          operation:
                            enum: [add, update]
                      then:
                        required: [value]
                        properties:
                          value:
                            type: string
                    - if:
                        required: [operation]
                        properties:
                          operation:
                            const: remove
                      then:
                        properties:
                          value:
                            type: "null"
                  properties:
                    operation:
                      type: string
                      enum: [add, update, remove]
                    target:
                      type: string
                      enum: [header]
                      default: header
                    key:
                      type: string
                    value:
                      type: [string, "null"]
                      description: Required and non-null for add/update; omitted or null for remove.
              fault:
                type: object
                additionalProperties: false
                description: |
                  Optional per-rule fault action. Projects Istio
                  `VirtualService.http[].fault` onto the matched dispatch
                  rule (replacing the historical proxy-scoped
                  `fault_injection` plugin that could not be collapsed
                  with sibling routes). At least one of `delay` / `abort`
                  must be present.

                  RTDS scope: the percentages baked into a per-rule fault
                  are NOT runtime-tunable via the GAP-3E RTDS keys
                  `ferrum.fault_injection.<scope>.{abort,delay}_percent` —
                  those keys apply only to `fault_injection` plugin
                  instances configured with `runtime_overlay_scope`.
                  Operators who need RTDS-driven fault percentages
                  should use a global / proxy-scoped `fault_injection`
                  plugin instead.
                properties:
                  delay:
                    type: object
                    additionalProperties: false
                    required: [duration_ms, percentage]
                    properties:
                      duration_ms:
                        type: integer
                        format: uint64
                        minimum: 1
                        maximum: 60000
                        description: |
                          Sleep duration in milliseconds before dispatch
                          when the percentile roll hits. Bounded to
                          `[1, 60_000]` (1 ms to 1 minute).
                      percentage:
                        type: number
                        format: double
                        exclusiveMinimum: 0
                        maximum: 100
                        description: |
                          Percent of matching requests that trigger the
                          delay. `0.0` is rejected at config load time
                          (omit the action to disable it instead). Positive
                          values below one 64-bit sampler bucket round up
                          to that first bucket so every accepted value can
                          trigger.
                  abort:
                    type: object
                    additionalProperties: false
                    required: [status_code, percentage]
                    properties:
                      status_code:
                        type: integer
                        minimum: 200
                        maximum: 599
                      percentage:
                        type: number
                        format: double
                        exclusiveMinimum: 0
                        maximum: 100
                        description: |
                          Percent of matching requests that abort. Positive
                          values below one 64-bit sampler bucket round up to
                          that first bucket so every accepted value can trigger.
                      grpc_status:
                        type: integer
                        minimum: 0
                        maximum: 16
                        description: |
                          Optional gRPC status code emitted only when the
                          immutable pre-plugin request flavor is native
                          gRPC. Plain HTTP, WebSocket, and gRPC-Web requests
                          never receive a stray `grpc-status` header even if
                          an earlier hook rewrites `content-type`.
                      body:
                        type: [string, "null"]
                        description: Optional response body; empty when omitted.
              rewrite:
                type: object
                additionalProperties: false
                description: |
                  Optional per-rule URI / authority rewrite. Projects Istio
                  `VirtualService.http[].rewrite` onto the matched dispatch
                  rule so a rewriting route can be collapsed with sibling
                  routes onto one Ferrum proxy without rewriting the siblings'
                  traffic. At least one of `uri` / `authority` must be set.
                  Applied when the rule matches and no `redirect` fires.
                properties:
                  uri:
                    type: [string, "null"]
                    description: |
                      Replacement request path forwarded to the backend. When
                      `match_prefix` is set (the source `match.uri` was a
                      prefix) only that prefix is replaced; otherwise the whole
                      path is replaced. CRLF is rejected at load time.
                  authority:
                    type: [string, "null"]
                    description: |
                      Replacement `Host` / `:authority` forwarded to the
                      backend. CRLF / whitespace is rejected at load time.
                  match_prefix:
                    type: [string, "null"]
                    description: |
                      Literal path prefix the source `match.uri.prefix`
                      matched. The plugin strips this prefix and prepends
                      `uri` (Istio prefix-rewrite). Normally set by the
                      VirtualService translator, not hand-authored.
              redirect:
                type: object
                additionalProperties: false
                description: |
                  Optional per-rule HTTP redirect. Projects Istio
                  `VirtualService.http[].redirect`. When the rule matches the
                  request is answered with a 3xx + `Location` and never reaches
                  a backend; takes precedence over `rewrite` and the route
                  override destination. A status-only redirect is valid and
                  preserves the original URL. A rule carrying a `redirect`
                  does not require a `destination`.
                properties:
                  uri:
                    type: [string, "null"]
                    description: Replacement path for the Location header; request path preserved when unset.
                  match_prefix:
                    type: [string, "null"]
                    description: |
                      Literal matched path prefix replaced by `uri`; the
                      unmatched suffix is preserved. Normally emitted by the
                      VirtualService translator.
                  authority:
                    type: [string, "null"]
                    description: Replacement authority (host[:port]) for the Location header; request authority preserved when unset.
                  port:
                    type: [integer, "null"]
                    format: uint16
                    minimum: 1
                    description: Replacement authority port; request host is preserved when authority is unset.
                  scheme:
                    type: [string, "null"]
                    enum: [http, https, null]
                    description: Replacement scheme for the Location header; request scheme preserved when unset.
                  redirect_code:
                    type: integer
                    minimum: 300
                    maximum: 399
                    default: 301
                    description: HTTP redirect status code (Istio `redirectCode`). Defaults to 301.
        reject_unmatched:
          type: boolean
          default: false
          description: |
            When `true`, requests that match no rule are rejected with 404
            instead of falling through to the proxy's default backend. The
            Istio VirtualService translator sets this so a route gated by a
            method/header/query-param `match` does not serve traffic that
            misses those predicates. Across multiple attached instances, the
            decision is finalized only after all instances run and only when
            no instance matched and no earlier route override exists.

    WorkloadMetricsConfig:
      type: object
      description: |
        Plugin: workload_metrics — Adds Istio / GAMMA-style workload identity
        labels and Telemetry CRD tag overrides into transaction metadata, and
        owns trace-context propagation for the mesh. The existing logging,
        metrics, and OTel sinks pick these up via `TransactionSummary.metadata`
        and `StreamTransactionSummary.metadata` without plugin-trait changes.

        Auto-injected by mesh mode on every applicable topology; reserved
        plugin id `__mesh_workload_metrics`. Standalone use is supported on
        non-mesh gateways that want Istio-style workload labels in logs.

        Runtime admission permits at most 32 distinct custom tag names across
        `custom_tags` and `custom_header_tags` combined. The individual
        `maxProperties: 32` bounds remain for generated clients, but the
        cross-property combined total cannot be expressed mechanically.
      properties:
        node_id:
          type: string
          description: Mesh node identifier attached to workload metadata.
        topology:
          type: string
          description: Mesh topology name attached to workload metadata.
        namespace:
          type: string
          description: Mesh namespace attached to workload metadata and used when deriving the default `service_name`.
        workload_spiffe_id:
          type: string
          description: This workload's SPIFFE ID (e.g., `spiffe://cluster.local/ns/default/sa/api`).
        labels:
          type: object
          additionalProperties:
            type: string
          description: Static workload labels to inject as `mesh.*` metadata keys on every transaction.
        trust_domain_aliases:
          type: array
          items:
            type: string
          description: Additional SPIFFE trust domains accepted as equivalent to the workload's trust domain.
        trusted_hbone_assertors:
          type: array
          items:
            type: string
          default: ["ztunnel", "waypoint"]
          description: |
            Allow-list of identity-asserting infrastructure components whose
            HBONE baggage `source.principal` may be trusted for workload
            metrics source attribution. Bare service-account names match any
            peer whose SPIFFE path ends with `/sa/<name>`; full SPIFFE IDs
            match exactly. Default is `["ztunnel", "waypoint"]`. Explicit
            empty array disables baggage-derived source attribution.
        sampling_percentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Tracing sampling percentage 0.0–100.0 (from Istio Telemetry CRD).
        custom_tags:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 1024
          description: |
            Custom tags injected into transaction metadata and exported spans.
            Names are limited to 128 ASCII letters, digits, `.`, `_`, or `-`
            and cannot collide with reserved, sensitive, `mesh.*`, trace, or
            authorization keys. This map and `custom_header_tags` may contain
            at most 32 distinct tag names combined.
        custom_header_tags:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
          description: |
            Custom tags populated from request headers (`tag_name ->
            header_name`). Credential-bearing source headers and reserved or
            sensitive destination names are rejected; runtime values over 1024
            bytes are omitted. This map and `custom_tags` may contain at most
            32 distinct tag names combined.
        metrics:
          type: object
          description: |
            Istio Telemetry-CRD-style metrics customization. Both fields are
            optional and additive; unknown fields are ignored.
          properties:
            tag_overrides:
              type: array
              items:
                type: object
                required: [name, operation]
                properties:
                  metric:
                    type: string
                    description: |
                      Metric family targeted by this override. Supported values
                      are `REQUEST_COUNT`, `REQUEST_DURATION`, their Ferrum
                      metric names, and `ALL_METRICS`; omitted means all metrics.
                      Recognized Istio standard families Ferrum does not emit
                      are accepted and ignored with a bounded construction-time
                      warning; unknown families remain configuration errors.
                  name:
                    type: string
                    description: |
                      Tag name to override. Accepts Istio names such as
                      `source_workload` and Ferrum `mesh.*` label names.
                  operation:
                    type: object
                    required: [type]
                    description: |
                      One of `{"type": "remove"}`,
                      `{"type": "rename", "new_name": "..."}`, or
                      `{"type": "set", "value": "..."}`.
                    properties:
                      type:
                        type: string
                        enum: [remove, rename, set]
                      new_name:
                        type: string
                        description: Replacement tag name when `type` is `rename`.
                      value:
                        type: string
                        maxLength: 256
                        description: |
                          Replacement tag value when `type` is `set`. OpenAPI
                          `maxLength` counts Unicode characters; runtime
                          admission separately enforces at most 256 UTF-8 bytes,
                          so multibyte values may be rejected below 256
                          characters.
              description: Per-metric tag overrides translated from the Istio Telemetry CRD.
            disabled_metrics:
              type: array
              items:
                type: string
              description: |
                Names of metrics suppressed by this workload. Supported values
                are `REQUEST_COUNT`, `REQUEST_DURATION`, their Ferrum metric
                names, and `ALL_METRICS`. Recognized Istio standard families
                Ferrum does not emit are accepted and ignored with a bounded
                construction-time warning; unknown families remain errors.
        tracing_providers:
          type: array
          items:
            type: object
          description: |
            Per-provider tracing exporters surfaced from the Istio Telemetry
            CRD via the mesh slice. Also enables trace-context propagation
            when span reporting is disabled.
        tracing_provider:
          type: object
          description: |
            Singular tracing exporter fallback. Ignored when
            `tracing_providers` is present.
        span_reporting_disabled:
          type: boolean
          default: false
          description: |
            When `true`, trace context is still propagated but no spans are
            exported. Matches Istio Telemetry CRD `disableSpanReporting`.
        service_name:
          type: string
          description: |
            Service name attached to exported spans. Defaults to the
            workload's service when omitted.

    MeshBpfMetricsConfig:
      type: object
      description: |
        Plugin: __mesh_bpf_metrics - reserved internal mesh NodeWaypoint
        plugin that exposes BPF SOCK_OPS counters on the Prometheus scrape
        surface. Mesh mode auto-injects it when BPF metrics are available;
        operator-managed plugin configs should not create names prefixed
        with `__`.
      properties:
        prefix:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
          default: ferrum_mesh_bpf
          description: Prometheus metric name prefix for emitted BPF counters.

    SoapWsSecurityConfig:
      type: object
      description: "Plugin: soap_ws_security — Validates WS-Security headers in SOAP envelopes. Supports UsernameToken (PasswordText/PasswordDigest), X.509 signature verification, SAML 2.0 assertion validation (XMLDSIG signature verification against trusted IdP signing certificates with enveloped-signature transform, Issuer / NotBefore / NotOnOrAfter / Audience checks, and Subject NameID extraction), timestamp freshness, and nonce replay protection. Buffers request bodies with SOAP content types (text/xml, application/soap+xml, application/xml). At least one security feature must be enabled. Note: signature paths verify against the wire bytes of SignedInfo / referenced elements and do not yet apply Exclusive XML Canonicalization (xml-exc-c14n#); operators integrating with IdPs that strictly canonicalize should validate end-to-end."
      properties:
        reject_missing_security_header:
          type: boolean
          default: true
          description: Reject SOAP requests that lack a WS-Security header
        timestamp:
          type: object
          description: WS-Security Timestamp validation
          properties:
            require:
              type: boolean
              default: true
              description: Require a wsu:Timestamp element in the Security header
            max_age_seconds:
              type: integer
              format: uint64
              default: 300
              description: Maximum age (seconds) of the Created timestamp before rejection
            require_expires:
              type: boolean
              default: false
              description: Require an Expires element inside the Timestamp
            clock_skew_seconds:
              type: integer
              format: uint64
              default: 300
              description: Clock skew tolerance (seconds) for timestamp validation
        username_token:
          type: object
          description: WS-Security UsernameToken authentication
          properties:
            enabled:
              type: boolean
              default: false
              description: Enable UsernameToken authentication
            password_type:
              type: string
              enum: [PasswordText, PasswordDigest]
              default: PasswordDigest
              description: Password format. PasswordDigest hashes password with nonce+timestamp; PasswordText sends the password directly (TLS only).
            credentials:
              type: array
              items:
                type: object
                required: [username, password]
                properties:
                  username:
                    type: string
                  password:
                    type: string
              description: Allowed username/password pairs for UsernameToken authentication
        x509_signature:
          type: object
          description: X.509 certificate signature verification
          properties:
            enabled:
              type: boolean
              default: false
              description: Enable X.509 signature verification
            trusted_certs:
              type: array
              items:
                type: string
              description: PEM file paths of trusted signing certificates (matched by SHA-256 fingerprint)
            allowed_algorithms:
              type: array
              items:
                type: string
                enum: [rsa-sha256, rsa-sha1]
              default: [rsa-sha256]
              description: Allowed XMLDSig signature algorithms
            allowed_digest_algorithms:
              type: array
              items:
                type: string
                enum: [sha256, sha1]
              default: [sha256]
              description: |
                Allowed XMLDSig `<Reference>` digest algorithms. Tracked
                independently of `allowed_algorithms` so signature method
                and reference digest can be gated separately — e.g. accept
                rsa-sha256 signatures over sha1 digests (rare but valid)
                without also accepting rsa-sha1 signatures. Defaults to
                sha256 only; add `sha1` to allow legacy reference digests.
            require_signed_timestamp:
              type: boolean
              default: true
              description: Require the Timestamp to be included in the signature's references
        saml:
          type: object
          description: |
            SAML 2.0 assertion validation. The plugin cryptographically verifies
            the assertion's `<Signature>` element (XMLDSIG) BEFORE checking any
            attacker-controlled fields. Verification steps, in order:
              1. Locate `<Signature>` inside the assertion (rejected if absent).
                 More than one `<Assertion>` inside the WS-Security block is
                 rejected outright.
              2. Resolve the signing algorithm and confirm it is in `allowed_signature_algorithms`.
              3. Verify each `<Reference>` digest against the assertion with its own
                 `<Signature>` element removed (XMLDSIG enveloped-signature transform).
                 The digest algorithm must be in `allowed_digest_algorithms`. At
                 least one Reference must target the enclosing Assertion ID.
              4. Match the signing certificate from `KeyInfo/X509Data/X509Certificate`
                 against `trusted_signing_certs` by SHA-256 fingerprint of the full DER
                 (leaf-cert trust — no CA chain validation; operators supply the IdP's
                 actual signing certificate(s) as published in IdP metadata).
              5. Verify `<SignatureValue>` over the `<SignedInfo>` bytes using the matched
                 cert's RSA public key.
              6. Validate Issuer (must match `trusted_issuers`), NotBefore /
                 NotOnOrAfter (with `clock_skew_seconds` tolerance), and Audience
                 (if `audience` is configured).
              7. Extract the Subject NameID into `ctx.metadata["soap_ws_saml_subject"]`
                 for downstream plugins.
            On any failure the request is rejected with HTTP 401. Signature paths use the
            wire bytes of `SignedInfo` / referenced elements and do not currently apply
            Exclusive XML Canonicalization (xml-exc-c14n#).
          properties:
            enabled:
              type: boolean
              default: false
              description: Enable SAML 2.0 assertion validation.
            trusted_issuers:
              type: array
              items:
                type: string
              description: |
                SAML Issuer URIs that are accepted as the source of an assertion.
                Required when `enabled` is true. The Issuer string inside the
                signed assertion must match one of these values exactly.
            trusted_signing_certs:
              type: array
              items:
                type: string
              description: |
                PEM file paths of IdP X.509 signing certificates. The cert
                presented inside the assertion's `KeyInfo` must match one of
                these by SHA-256 fingerprint of the full DER. Required when
                `enabled` is true. Rotating an IdP signing cert requires
                updating this list and restarting (no live reload).
            allowed_signature_algorithms:
              type: array
              items:
                type: string
                enum: [rsa-sha256, rsa-sha1]
              default: [rsa-sha256]
              description: |
                XMLDSig signature algorithms accepted on SAML assertions.
                Defaults to RSA-SHA256 only. Adding `rsa-sha1` accepts legacy
                IdPs that still emit SHA-1 signatures. Tracked independently
                of `allowed_digest_algorithms`.
            allowed_digest_algorithms:
              type: array
              items:
                type: string
                enum: [sha256, sha1]
              default: [sha256]
              description: |
                XMLDSig `<Reference>` digest algorithms accepted inside the
                assertion's SignedInfo. Defaults to SHA-256 only. Add `sha1`
                only to interoperate with IdPs that still emit SHA-1 digests.
                Independent of `allowed_signature_algorithms` so an operator
                can choose any combination.
            audience:
              type: string
              description: |
                Optional. When set, the assertion's
                `Conditions/AudienceRestriction/Audience` must match this
                string exactly. Use this to bind assertions to the specific
                service this proxy fronts.
            clock_skew_seconds:
              type: integer
              format: uint64
              default: 300
              description: Clock skew tolerance (seconds) for SAML NotBefore / NotOnOrAfter.
        nonce:
          type: object
          description: Nonce replay protection cache (PasswordDigest only)
          properties:
            cache_ttl_seconds:
              type: integer
              format: uint64
              default: 300
              description: How long to remember nonces for replay detection (seconds)
            max_cache_size:
              type: integer
              format: uint64
              default: 10000
              description: Maximum nonce cache entries before eviction sweep

    CorsExactOrigin:
      oneOf:
        - type: string
          const: "*"
        - type: string
          minLength: 1
          pattern: '^[Hh][Tt][Tt][Pp][Ss]?://(?:\[[0-9A-Fa-f:.]+\]|[^:/?#@\s]+)(?::[0-9]+)?$'
      description: >-
        Exact HTTP(S) origin. The runtime URL parser additionally validates the
        host and port and canonicalizes scheme/host case, default ports, IDNA,
        IPv4, and IPv6. Exact `*` is Istio's allow-all value.

    CorsAllowedOriginString:
      oneOf:
        - $ref: '#/components/schemas/CorsExactOrigin'
        - type: string
          minLength: 3
          pattern: '^\*\.[^*/:\s]+$'
          description: Native wildcard-subdomain matcher such as `*.example.com`.

    CorsConfig:
      type: object
      additionalProperties: false
      required: [allowed_origins]
      description: |
        Plugin: cors — Cross-Origin Resource Sharing. Unknown keys, null values,
        non-object configs, and an omitted origin policy are rejected. Actual
        requests evaluate origin/credentials/exposure behavior; method/header
        allow-lists and max age govern preflight only.
      allOf:
        - if:
            not:
              required: [unmatched_preflights]
          then:
            properties:
              allowed_methods:
                minItems: 1
                default: ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
              allowed_headers:
                minItems: 1
                default: ["Accept", "Authorization", "Content-Type", "Origin", "X-Requested-With"]
              max_age:
                default: 86400
        - not:
            required: [preflight_continue, unmatched_preflights]
      properties:
        allowed_origins:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/CorsAllowedOriginString'
              - type: object
                additionalProperties: false
                minProperties: 1
                maxProperties: 1
                description: >-
                  Istio StringMatch-shaped origin matcher: EXACTLY ONE of
                  exact / prefix / regex (no extra or unknown keys). Empty or
                  multi-key objects are rejected at config time.
                properties:
                  exact:
                    $ref: '#/components/schemas/CorsExactOrigin'
                    description: >-
                      Exact origin, canonicalized at config time (scheme/host
                      case, IDNA, IP serialization, and default ports). The
                      exact value `*` has Istio's documented allow-all meaning.
                  prefix:
                    type: string
                    minLength: 1
                    description: >-
                      Literal byte-prefix of the request Origin header
                      (case-sensitive), e.g. "https://app.".
                  regex:
                    type: string
                    minLength: 1
                    description: >-
                      RE2 pattern that must FULLY match the request Origin
                      header. Compiled (and size-bounded) at config time; an
                      invalid pattern is rejected.
          description: >-
            Required permitted-origin policy. Each entry is either a string
            (`"*"` for intentional allow-all, an exact `scheme://host[:port]`
            origin canonicalized on the cold config path, or a
            `*.suffix.com` wildcard-subdomain pattern)
            or an Istio `StringMatch`-shaped object carrying exactly one of
            `exact` / `prefix` / `regex`. Prefix and regex retain literal Istio
            matcher semantics and are not broadened by exact canonicalization.
        allowed_methods:
          type: array
          items:
            type: string
            minLength: 1
            pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
          description: >-
            Preflight-only allowed methods returned in
            Access-Control-Allow-Methods. This list is not evaluated against
            the actual request method. Omission uses the native direct-plugin
            default; with `unmatched_preflights`, omission/empty preserves
            Istio's empty list.
        allowed_headers:
          type: array
          items:
            type: string
            minLength: 1
            pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
          description: >-
            Preflight-only allowed request headers returned in
            Access-Control-Allow-Headers. This list is not evaluated against
            headers on the actual request. Omission uses the native
            direct-plugin default; with `unmatched_preflights`, omission/empty
            preserves Istio's empty list.
        exposed_headers:
          type: array
          items:
            type: string
            minLength: 1
            pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
          default: []
          description: Response headers exposed to browser JavaScript
        allow_credentials:
          type: boolean
          default: false
          description: "Send Access-Control-Allow-Credentials: true"
        max_age:
          type: integer
          format: uint64
          minimum: 0
          description: >-
            Preflight cache duration in seconds. Native direct-plugin omission
            defaults to 86400; translated Istio omission remains absent.
        preflight_continue:
          type: boolean
          default: false
          description: >-
            Pass allowed preflights to the backend. Backend status/body are
            retained, but every Access-Control response field is replaced by
            the complete gateway-authoritative policy.
        unmatched_preflights:
          type: string
          enum: [forward, ignore]
          description: >-
            Istio projection marker. `forward` preserves omitted,
            `UNSPECIFIED`, and `FORWARD` behavior; `ignore` returns a local 200
            without CORS authorization fields. Its presence also preserves
            omitted/empty method and header lists and omitted max age instead
            of applying native direct-plugin defaults. It is mutually exclusive
            with `preflight_continue`.

    OpaPluginConfig:
      type: object
      additionalProperties: false
      required: [opa_host, policy_path]
      description: |
        Plugin: opa — Delegates HTTP request authorization to Open Policy
        Agent's Data API in the `authorize` phase. The gateway POSTs
        `{ "input": ... }` to `{opa_host}/v1/data/{policy_path}` and allows
        only `true` decisions or objects with `allow: true` at
        `decision_pointer`. Fails closed by default; `fail_open: true` is the
        opt-in availability mode. Unknown configuration keys are rejected.
        Request headers and query-located credentials are redacted before
        being sent to OPA.
      properties:
        opa_host:
          type: string
          format: uri
          description: >-
            Base OPA URL using http:// or https://. URL credentials are not
            allowed; use `headers` for OPA authentication.
          example: "http://opa.opa-system.svc.cluster.local:8181"
        policy_path:
          type: string
          description: >-
            OPA data path appended under /v1/data/. Must be non-empty, must not
            start with '/', must not contain percent-encoding, and must not
            contain empty, '.', or '..' segments.
          example: "ferrum/authz/allow"
        headers:
          type: object
          additionalProperties:
            type: string
          default: {}
          description: >-
            Static HTTP headers sent to OPA on every decision request. The
            `content-type` header is managed by the plugin and cannot be
            configured here.
          example:
            Authorization: "Bearer opa-client-token"
        timeout_ms:
          type: integer
          format: uint64
          minimum: 1
          default: 1000
          description: >-
            Requested per-decision timeout in milliseconds. Every positive
            value is accepted; the effective runtime timeout is capped at
            30000 milliseconds.
        max_response_bytes:
          type: integer
          format: uint64
          minimum: 1
          default: 262144
          description: >-
            Maximum decoded OPA response size. Oversized declared or streamed
            responses use the configured fail-open/fail-closed posture.
        fail_open:
          type: boolean
          default: false
          description: Continue when OPA is unavailable, times out, returns non-2xx, returns malformed JSON, or exceeds max_response_bytes.
        fail_closed:
          type: boolean
          default: true
          description: Inverse of `fail_open`; do not set both fields.
        deny_status:
          type: integer
          format: uint16
          minimum: 400
          maximum: 599
          default: 403
          description: HTTP status returned when OPA returns a policy denial.
        deny_body:
          type: string
          default: '{"error":"forbidden by policy"}'
          description: Response body returned on policy denial.
        deny_headers:
          type: object
          additionalProperties:
            type: string
          default: {}
          description: Headers added to the policy-denial response.
        fail_closed_status:
          type: integer
          format: uint16
          minimum: 400
          maximum: 599
          default: 503
          description: >-
            HTTP status returned when fail-closed handles OPA unavailability,
            timeouts, non-2xx responses, malformed JSON, or oversized responses.
        fail_closed_body:
          type: string
          default: '{"error":"authorization service unavailable"}'
          description: Response body returned on fail-closed OPA errors.
        fail_closed_headers:
          type: object
          additionalProperties:
            type: string
          default: {}
          description: Headers added to fail-closed OPA error responses.
        decision_pointer:
          type: array
          items:
            type: string
          default: [result]
          description: JSON object-key path to the decision value in OPA's response.
        include_method:
          type: boolean
          default: true
        include_path:
          type: boolean
          default: true
        include_query:
          type: boolean
          default: true
          description: >-
            Include decoded, non-redacted query parameters as input.query.
            Present query parameters configured as authentication credential
            locations are omitted by default.
        include_query_credentials:
          type: boolean
          default: false
          description: >-
            Unsafe opt-in to include built-in and authentication-plugin-marked
            query credentials in input.query. Keys listed in redact_query_keys
            remain redacted.
        include_headers:
          type: boolean
          default: true
        include_body:
          type: boolean
          default: false
          description: >-
            After authentication succeeds, buffer and forward the request
            body. UTF-8 bodies use `body`; non-UTF-8 raw bytes use
            `body_base64`.
        max_body_bytes:
          type: integer
          format: uint64
          minimum: 1
          default: 1048576
          description: >-
            Plugin-local request body ceiling when include_body is enabled.
            The strictest of this value and the positive global request body
            limit is enforced; this value remains active when the global
            limit is unlimited (0).
        include_consumer:
          type: boolean
          default: true
        include_client_ip:
          type: boolean
          default: true
        include_service:
          type: boolean
          default: true
        reject_duplicate_query_keys:
          type: boolean
          default: true
          description: >-
            When include_query is enabled, reject requests whose query string
            contains duplicate keys with conflicting values (e.g. a=1&a=2) to
            prevent OPA/backend authorization mismatch. Identical-value
            duplicates (a=1&a=1) are allowed. Rejection uses the configured
            deny_status and deny_body. Set to false for APIs that use
            array-style repeated query keys, or disable include_query entirely
            to skip the check.
        redact_headers:
          type: array
          items:
            type: string
          default:
            - authorization
            - proxy-authorization
            - cookie
            - api-key
            - x-api-key
            - x-goog-api-key
            - x-auth-token
            - x-csrf-token
            - x-xsrf-token
            - x-forwarded-authorization
          description: >-
            Additional request headers to redact from `input.headers`. Built-in
            sensitive headers and active authentication credential headers are
            always omitted.
        redact_query_keys:
          type: array
          items:
            type: string
            minLength: 1
          default: []
          description: >-
            Additional query parameter names to omit from input.query,
            matched case-insensitively. Built-in credential names and query
            locations marked by authentication plugins are already omitted
            unless include_query_credentials is explicitly enabled.

    AccessControlConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: access_control — consumer-based and group-based allow/deny for
        HTTP-family and TCP/UDP stream proxies. Evaluation order: deny
        (consumer username → group) then allow (consumer username → group).
        Deny always overrides allow. At least one of `allowed_consumers`,
        `disallowed_consumers`, `allowed_groups`, `disallowed_groups`, or
        `allow_authenticated_identity=true` must be configured. Unknown config
        keys are rejected. `allow_authenticated_identity=true` cannot be combined
        with an allow-list (`allowed_consumers`/`allowed_groups`) because the
        allow-list is not applied to unmapped external identities. Use
        ip_restriction for IP/CIDR rules. Rule entries match principal values
        byte-for-byte (no trimming) and must contain at least one
        non-whitespace character. Whitespace admission follows Rust
        `str::trim` Unicode `White_Space` semantics.
      allOf:
        - anyOf:
            - required: [allowed_consumers]
              properties:
                allowed_consumers:
                  minItems: 1
            - required: [disallowed_consumers]
              properties:
                disallowed_consumers:
                  minItems: 1
            - required: [allowed_groups]
              properties:
                allowed_groups:
                  minItems: 1
            - required: [disallowed_groups]
              properties:
                disallowed_groups:
                  minItems: 1
            - required: [allow_authenticated_identity]
              properties:
                allow_authenticated_identity:
                  enum: [true]
        - not:
            allOf:
              - required: [allow_authenticated_identity]
                properties:
                  allow_authenticated_identity:
                    enum: [true]
              - anyOf:
                  - required: [allowed_consumers]
                    properties:
                      allowed_consumers:
                        minItems: 1
                  - required: [allowed_groups]
                    properties:
                      allowed_groups:
                        minItems: 1
      properties:
        allowed_consumers:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
          default: []
          description: >-
            Consumer usernames that are explicitly allowed. Empty list disables
            the username allow check (other allow rules still apply).
        disallowed_consumers:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 4096
            pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
          default: []
          description: >-
            Consumer usernames or, when allow_authenticated_identity is true,
            exact external principals that are explicitly denied. Takes
            precedence over every allow rule. The 4096-character bound is
            independent of the 255-character gateway Consumer username ceiling
            so JWT, OIDC, and SPIFFE-style principals can be revoked; longer
            external identities fail closed at runtime.
        allowed_groups:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
          default: []
          description: >-
            ACL group names that are explicitly allowed. The check matches if
            any of the consumer's `acl_groups` appears in this list.
        disallowed_groups:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
          default: []
          description: >-
            ACL group names that are explicitly denied. If any of the consumer's
            `acl_groups` appears in this list the request is rejected, even when
            the username is in `allowed_consumers`.
        allow_authenticated_identity:
          type: boolean
          default: false
          description: >-
            Allow requests whose `ctx.authenticated_identity` is set by an
            external auth plugin (e.g. jwks_auth) even when no gateway Consumer
            was mapped. Empty or whitespace-only identities are unauthenticated.
            Cannot be combined with an allow-list
            (`allowed_consumers`/`allowed_groups`); the deny-list
            `disallowed_consumers` is still applied to the external identity.

    TcpConnectionThrottleConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: tcp_connection_throttle — Caps active TCP/TCP+TLS connections
        per Consumer when a stream auth plugin identified one, else per
        canonical client IP. Explicit proxy/proxy-group attachment to any other
        protocol is rejected during configuration admission and plugin-cache
        validation. A global policy with a nonempty effective target set must
        cover at least one TCP/TCP+TLS proxy; mixed global scope is filtered
        from unsupported listeners. UDP/DTLS is not protected; use
        udp_rate_limiting for datagram/session admission.
        Enforcement is process-local, so each replica independently permits up
        to the configured limit and the deployment-wide allowance can be the
        limit multiplied by the number of replicas receiving the same identity.
      required: [max_connections_per_key]
      properties:
        max_connections_per_key:
          type: integer
          format: uint64
          minimum: 1
          description: >-
            Maximum active TCP connections allowed for one Consumer/IP key in
            this ferrum-edge process. Each replica enforces this limit
            independently.
        cleanup_interval_seconds:
          type: integer
          format: uint64
          default: 60
          minimum: 0
          maximum: 86400
          description: >-
            Interval in seconds between defensive background sweeps that remove
            residual zero-count entries. Normal connection completion and
            plugin-chain rejection release the exact admission permit and remove
            its zero-count entry inline. The sweep never repairs a missed
            positive decrement. `0` disables only the residual sweep; inline
            permit release and removal remain enabled.

    AdaptiveConcurrencyConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: adaptive_concurrency — Target-aware backend admission for
        upstream survival. Runs after load balancing for HTTP, gRPC, native
        HTTP/3 backend dispatch, HTTP/3 fallback bridge dispatch, and
        WebSocket upgrade admission with the permit held for the full session
        lifetime.
      properties:
        key_by:
          type: string
          enum: [proxy_target, upstream_target, backend_target]
          default: proxy_target
          description: >-
            Limit key scope. `proxy_target` keys by proxy plus selected
            backend. `upstream_target` keys by upstream plus selected backend
            when the proxy uses an upstream, and falls back to proxy-target
            scoping for direct backends. `backend_target` shares one limit per
            backend endpoint across every proxy using this plugin instance.
        max_tracked_keys:
          type: integer
          format: uint64
          default: 10000
          minimum: 1
          description: Maximum number of distinct target keys this stable plugin policy will track, bounding limiter memory for high-cardinality wildcard upstreams. State is retained across compatible config reloads. Lowering this value or changing the policy's effective subset-filtered backend targets, route-override destinations, or route execution order publishes an independent tracking space; retired permits finish against detached state, while retired cache and load-balancer views cannot admit, repopulate, or train the replacement. Service-discovery changes outside the policy's selected subset remain compatible. When the cap is reached, new target keys fail open — they are admitted without adaptive limiting (never rejected with a 503) until the policy is removed/recreated, its route key space changes, or the process restarts. Existing keys continue to be admitted subject to their adaptive limit.
        min_limit:
          type: integer
          format: uint64
          default: 1
          minimum: 1
          description: Lower bound for the adaptive in-flight request limit.
        initial_limit:
          type: integer
          format: uint64
          default: 32
          minimum: 1
          description: Starting in-flight request limit for a new target key. Must be between `min_limit` and `max_limit`.
        max_limit:
          type: integer
          format: uint64
          default: 1024
          minimum: 1
          description: Upper bound for the adaptive in-flight request limit. Must be greater than or equal to `min_limit`.
        min_samples:
          type: integer
          format: uint64
          default: 20
          minimum: 1
          description: Successful backend samples required before latency-based limit changes are applied.
        target_latency_multiplier:
          type: number
          format: double
          default: 1.5
          exclusiveMinimum: 1
          description: Target latency threshold as a multiple of the learned minimum observed backend latency.
        decrease_ratio:
          type: number
          format: double
          default: 0.8
          exclusiveMinimum: 0
          exclusiveMaximum: 1
          description: Multiplicative decrease applied after backend 5xx responses, connection errors, or high latency.
        increase_step:
          type: integer
          format: uint64
          default: 1
          minimum: 1
          description: Additive increase applied when the target is saturated and latency remains within the target.
        shadow_mode:
          type: boolean
          default: false
          description: Learn and expose state without rejecting requests when the current in-flight count is at or above the limit. Retired cache/load-balancer views and requests crossing a structural generation handoff still fail closed so they cannot repopulate the replacement tracking space.
        expose_headers:
          type: boolean
          default: false
          description: Include `x-adaptive-concurrency-limit` and `x-adaptive-concurrency-inflight` on genuine per-target limit rejections. Generation-handoff rejections omit them because no truthful per-target limit or in-flight value exists.

    IpRestrictionConfig:
      type: object
      additionalProperties: false
      anyOf:
        - required: [allow]
          properties:
            allow:
              minItems: 1
        - required: [deny]
          properties:
            deny:
              minItems: 1
      description: >-
        Plugin: ip_restriction — IP/CIDR allow/deny enforcement. Rules are
        validated and compiled at config load time into sorted, merged numeric
        intervals; invalid IPv4/IPv6 addresses or CIDR prefixes reject plugin
        creation. Request lookup is allocation-free, lock-free, and logarithmic
        in the number of non-overlapping intervals. The authoritative client IP
        is parsed/canonicalized once per request or stream session and reused by
        every plugin instance. IPv4 octets must use canonical unsigned decimal
        notation (for example, `010.1.2.3` and `+10.1.2.3` are rejected).
        Supports IPv4 exact and CIDR (`/0`-`/32`) and native IPv6 exact and CIDR
        (`/0`-`/128`). IPv4-mapped IPv6 rules normalize to IPv4, so mapped CIDRs
        accept only `/96`-`/128` (equivalent to IPv4 `/0`-`/32`); shorter mapped
        prefixes are rejected as ambiguous. IPv6 zone identifiers (e.g. `%eth0`)
        on rules or client IPs are stripped before matching. Runs on every
        protocol — HTTP, gRPC, WebSocket, TCP, UDP, and DTLS. Config must be an
        object, unknown properties and null values are rejected, and at least
        one of `allow` or `deny` must be non-empty.
      properties:
        allow:
          type: array
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
          default: []
          description: >-
            Allowed IP addresses or CIDR ranges (IPv4 or IPv6). Empty list
            disables allow-list enforcement.
        deny:
          type: array
          items:
            type: string
            minLength: 1
            pattern: '.*\S.*'
          default: []
          description: >-
            Denied IP addresses or CIDR ranges (IPv4 or IPv6). Always takes
            precedence over an `allow` match.
        mode:
          type: string
          enum: [allow_first, deny_first]
          default: allow_first
          description: >-
            Order of list evaluation for non-overlapping rules. `allow_first`
            (default) reject when an allow list is configured but the IP is not
            in it, otherwise check deny. `deny_first` rejects on any deny match
            first, then enforces the allow list. When the same IP matches both
            lists, deny always wins regardless of mode.

    BotDetectionConfig:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [blocked_patterns]
            properties:
              blocked_patterns:
                type: array
                maxItems: 0
          then:
            required: [allow_missing_user_agent]
            properties:
              allow_missing_user_agent:
                const: false
      description: >-
        Plugin: bot_detection — case-insensitive User-Agent matching.
        Configuration must be an object and unknown properties are rejected.
        `blocked_patterns` are substring matches; `allow_list` entries are
        word-boundary matches and are consulted before blocked patterns, so a
        User-Agent that contains a blocked substring can still pass if it also
        contains an allow-list entry as a standalone token (useful for
        permitting GoogleBot while blocking generic `bot` patterns). The
        word-boundary anchoring on the allow list prevents an allowed token
        from being smuggled inside an otherwise-blocked agent. A no-op config
        (empty `blocked_patterns` while missing User-Agent headers are allowed)
        is rejected; an allow-list alone is not enforcement. The User-Agent is
        client-controlled and spoofable, so this is a coarse filter, not strong
        bot verification. Pattern entry whitespace follows Rust `str::trim`
        Unicode `White_Space` semantics. HTTP-family only.
      properties:
        blocked_patterns:
          type: [array, "null"]
          items:
            type: string
            minLength: 1
            pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
          default:
            - curl
            - wget
            - python-requests
            - python-urllib
            - scrapy
            - httpclient
            - java/
            - libwww-perl
            - mechanize
            - php/
          description: >-
            User-Agent substrings to reject (case-insensitive). Specifying this
            field with an array replaces the defaults entirely. Entries are
            trimmed and must contain a non-whitespace character. `null` is the
            same as omission and installs the documented defaults. Setting the
            field to `[]` is valid only when `allow_missing_user_agent: false`
            creates a missing-header reject path; an allow-list alone is not
            enforcement.
        allow_list:
          type: [array, "null"]
          items:
            type: string
            minLength: 1
            pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
          default: []
          description: >-
            User-Agent tokens that always pass, evaluated before
            `blocked_patterns` (allow wins). Matching is case-insensitive and
            word-boundary anchored, so an entry only matches when it appears as
            a standalone token in the User-Agent. Entries are trimmed and must
            contain a non-whitespace character. `null` is the same as omission
            and installs an empty allow list.
        allow_missing_user_agent:
          type: [boolean, "null"]
          default: true
          description: >-
            When true (default), requests with no User-Agent header pass — this
            keeps health-check and load-balancer probes working. Set to false
            to reject them with `custom_response_code`. `null` is the same as
            omission and selects `true`.
        custom_response_code:
          type: [integer, "null"]
          format: uint16
          minimum: 400
          maximum: 599
          default: 403
          description: >-
            For non-gRPC requests, the final 4xx or 5xx HTTP status returned
            with the JSON rejection body. Native gRPC requests instead return
            an empty-body HTTP 200 trailers-only error with this HTTP status
            mapped to `grpc-status` and `Forbidden` in `grpc-message`. Values
            outside 400–599, including informational and no-body status codes,
            and non-integer values are rejected. `null` is the same as omission
            and selects 403.

    RequestTransformerConfig:
      type: object
      description: |
        Plugin: request_transformer — Modifies request headers, query params,
        and JSON body. Rules are validated at plugin load time; unknown
        operations or targets, missing `value` on add/update, missing
        `new_key` on rename, and CR/LF in header values are rejected.

        When `apply_route_overrides: true`, the plugin also consumes per-rule
        header transforms published by `mesh_route_dispatch` onto
        `RequestContext.route_override_request_transform`. Static `rules`
        run first, then per-rule overrides — route-level header writes win
        on conflict. The Istio VirtualService translator auto-emits a
        proxy-scoped instance with `rules: []` + `apply_route_overrides: true`
        on routes that carry `headers.request.{set,add,remove}` and have no
        operator-configured `request_transformer`. Operators with a global
        `request_transformer` should be aware: a proxy-scoped instance
        REPLACES the global on that proxy, so the global's static body /
        query rules will not apply to VS-translated routes that auto-emit
        this plugin. The plugin_cache logs a `warn!` when this shadowing
        happens.
      properties:
        rules:
          type: array
          items:
            type: object
            required: [operation, key]
            properties:
              operation:
                type: string
                enum: [add, remove, update, rename]
                description: |
                  add: insert if absent (does not overwrite). Note: this is
                  the historical Ferrum semantics, not Istio's "append to
                  multi-value" semantics — use `update` to overwrite.
                  update: write, creating intermediate objects as needed.
                  remove: delete the field.
                  rename: move old → new, with rollback if the destination is unreachable.
              target:
                type: string
                enum: [header, query, body]
                default: header
              key:
                type: string
                description: |
                  Header name, query param, or dot-notation body path. Body
                  paths support nested objects ('user.address.city'), array
                  indexing via numeric segments ('items.0.name'), and
                  backslash-escaped literal dots ('meta.weird\\.key').
              value:
                type: string
                description: |
                  Required for add/update. For body rules, strings that parse
                  as JSON (e.g., "42", "true", '{"a":1}') are inserted as the
                  parsed type; otherwise kept as a JSON string. Header values
                  must not contain CR or LF.
              new_key:
                type: string
                description: Required for rename operations.
        apply_route_overrides:
          type: boolean
          default: false
          description: |
            When `true`, this instance accepts an empty `rules` array and
            consumes per-rule header transforms published by
            `mesh_route_dispatch` on the matching route. The plugin declares
            `modifies_request_headers() == true` so the dispatcher allocates
            a separate cloned header map for route-level writes (preserving
            the gateway invariant that `ctx.headers` carries the original
            inbound headers during `before_proxy`). Auto-emitted by the
            Istio VirtualService translator.
        runtime_overlay_scope:
          type: string
          minLength: 1
          pattern: "\\S"
          description: Optional RTDS boolean key controlling whether the transformer runs. Must contain at least one non-whitespace character; surrounding whitespace is trimmed at runtime.
        default_enabled:
          type: boolean
          default: true
          description: >-
            Fallback when `runtime_overlay_scope` is configured but the RTDS
            overlay has no boolean value for that key.

    ResponseTransformerConfig:
      type: object
      description: |
        Plugin: response_transformer — Modifies response headers and JSON
        body. Same validation rules as request_transformer (unknown
        operations / targets, missing value / new_key, and CR/LF in header
        values are rejected at plugin load time).

        When `apply_route_overrides: true`, the plugin consumes per-rule
        header transforms published by `mesh_route_dispatch` onto
        `RequestContext.route_override_response_transform`. See the
        `request_transformer` notes on shadowing of operator-configured
        globals — the same applies on the response side.
      properties:
        rules:
          type: array
          items:
            type: object
            required: [operation, key]
            properties:
              operation:
                type: string
                enum: [add, remove, update, rename]
              target:
                type: string
                enum: [header, body]
                default: header
              key:
                type: string
                description: |
                  Header name or dot-notation body path. Body paths support
                  nested objects, array indexing ('items.0'), and
                  backslash-escaped literal dots.
              value:
                type: string
                description: |
                  Required for add/update. Header values must not contain CR
                  or LF.
              new_key:
                type: string
                description: Required for rename operations.
        apply_route_overrides:
          type: boolean
          default: false
          description: |
            Counterpart to `request_transformer.apply_route_overrides` for
            response headers. Auto-emitted by the Istio VirtualService
            translator on routes carrying `headers.response.{set,add,remove}`
            that have no operator-configured `response_transformer`.
        runtime_overlay_scope:
          type: string
          minLength: 1
          pattern: "\\S"
          description: Optional RTDS boolean key controlling whether the transformer runs. Must contain at least one non-whitespace character; surrounding whitespace is trimmed at runtime.
        default_enabled:
          type: boolean
          default: true
          description: >-
            Fallback when `runtime_overlay_scope` is configured but the RTDS
            overlay has no boolean value for that key.

    SecurityHeadersConfig:
      type: object
      additionalProperties: false
      description: "Plugin: security_headers — Injects validated response security headers (secure defaults) and strips fingerprinting headers at the client-visible initial-header boundary, including buffered gRPC/gRPC-Web and WebSocket handshakes. Unknown configuration keys are rejected."
      properties:
        content_type_options:
          oneOf:
            - type: boolean
            - type: string
              pattern: '^[\u0009\u0020-\u007E]*$'
            - type: "null"
          default: nosniff
          description: "X-Content-Type-Options. true = nosniff (default); a string sets a custom value; false/null disables."
        frame_options:
          oneOf:
            - type: boolean
            - type: string
              pattern: '^[\u0009\u0020-\u007E]*$'
            - type: "null"
          default: SAMEORIGIN
          description: "X-Frame-Options. Default SAMEORIGIN; string overrides; false disables."
        referrer_policy:
          oneOf:
            - type: boolean
            - type: string
              pattern: '^[\u0009\u0020-\u007E]*$'
            - type: "null"
          default: strict-origin-when-cross-origin
          description: "Referrer-Policy. Default strict-origin-when-cross-origin; string overrides; false disables."
        hsts:
          description: "Strict-Transport-Security (opt-in). true = max-age=31536000; includeSubDomains; a string is used verbatim; an object {max_age, include_subdomains, preload} builds the value."
          oneOf:
            - type: boolean
            - type: string
              pattern: '^[\u0009\u0020-\u007E]*$'
            - type: "null"
            - type: object
              additionalProperties: false
              properties:
                max_age:
                  type: integer
                  minimum: 0
                  default: 31536000
                include_subdomains:
                  type: boolean
                  default: true
                preload:
                  type: boolean
                  default: false
        content_security_policy:
          type: [string, "null"]
          pattern: '^[\u0009\u0020-\u007E]*$'
          description: "Content-Security-Policy value (opt-in; application-specific)."
        permissions_policy:
          type: [string, "null"]
          pattern: '^[\u0009\u0020-\u007E]*$'
          description: "Permissions-Policy value (opt-in)."
        set:
          type: [object, "null"]
          propertyNames:
            type: string
            minLength: 1
            maxLength: 65535
            pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
          additionalProperties:
            type: string
            pattern: '^[\u0009\u0020-\u007E]*$'
          description: "Arbitrary response headers to set (name -> value). Names accept the complete HTTP field-name token grammar, are limited to 65,535 ASCII bytes, and are canonicalized to lowercase. Values must satisfy the HTTP HeaderValue builder rules: only HTAB and printable ASCII are accepted."
        remove:
          type: [array, "null"]
          items:
            type: string
            minLength: 1
            maxLength: 65535
            pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
          default: [server, x-powered-by]
          description: "Valid HTTP field names (maximum 65,535 ASCII bytes) to strip case-insensitively. Names are canonicalized to lowercase. Defaults to Server and X-Powered-By; set [] to strip nothing."
        override_existing:
          type: boolean
          default: true
          description: "When false, only add a header the backend did not already set."

    CompressionConfig:
      type: object
      additionalProperties: false
      description: "Plugin: compression — On-the-fly response compression (gzip, brotli) and optional request decompression. Content negotiation follows RFC 9110 §12.5.3 including the identity coding: an uncoded response is acceptable by default at q=1 unless refused with `identity;q=0` or `*;q=0` without a more-specific identity entry (a nonzero wildcard does not lower identity quality), the most preferred acceptable representation wins (server preference order breaks ties toward compression), and the response is rejected with 406 when identity is unacceptable and no acceptable coded representation can be produced — including size/content-type ineligibility, identity range/delta responses (206/226, Content-Range, or the internal range marker), and `response_caching` HIT paths. Identity range/delta responses are non-transformable (forwarded unchanged when identity is acceptable); no-body statuses and already-encoded upstream responses remain protocol hard skips. Reject-path 406 replacement is scoped to cache HITs so auth/policy rejection statuses are not masked. Honors request/response Cache-Control: no-transform and strong ETag validators by skipping compression (still 406 when that leaves no acceptable representation). Unknown top-level keys are rejected at construction (for example `min_content_lenght` or `gzip_leveel`); the removed `disable_on_etag` key still reports an explicit migration error. Invalid generations fail file/admin/database/CP-DP admission while KeepLastKnownGood retains the prior published instance."
      properties:
        algorithms:
          type: array
          items:
            type: string
            enum: [gzip, br, brotli]
          default: [gzip, br]
          description: "Enabled compression algorithms in server preference order"
        min_content_length:
          type: integer
          format: uint64
          default: 256
          description: "Skip compression for bodies smaller than this (bytes)"
        content_types:
          type: array
          items:
            type: string
          description: "Content-type whitelist. Defaults to 10 common text/application types"
        remove_accept_encoding:
          type: boolean
          default: true
          description: "Strip Accept-Encoding from backend request so backend sends uncompressed"
        gzip_level:
          type: integer
          minimum: 0
          maximum: 9
          default: 6
          description: "Gzip compression level (0=no compression, 1=fastest, 9=best)"
        brotli_quality:
          type: integer
          minimum: 0
          maximum: 11
          default: 4
          description: "Brotli quality (0=fastest, 11=best)"
        decompress_request:
          type: boolean
          default: false
          description: "Enable decompression of gzip/brotli request bodies"
        max_decompressed_request_size:
          type: integer
          format: uint64
          default: 10485760
          description: "Zip bomb protection: max decompressed request body size in bytes (10 MB)"

    SseConfig:
      type: object
      additionalProperties: false
      description: "Plugin: sse — Server-Sent Events stream handler. Validates SSE client criteria, shapes requests, and ensures proper streaming response headers. Unknown keys and non-object configs are rejected. Explicit null members are rejected; omitted keys keep defaults. wrap_non_sse_responses implies client-visible text/event-stream for wrapped responses."
      properties:
        require_get_method:
          type: boolean
          default: true
          description: "Reject non-GET requests with 405 (SSE is read-only)"
        require_accept_header:
          type: boolean
          default: true
          description: "Require Accept: text/event-stream header (406 if missing)"
        strip_accept_encoding:
          type: boolean
          default: true
          description: "Strip Accept-Encoding to prevent compressed responses breaking SSE framing"
        add_no_buffering_header:
          type: boolean
          default: true
          description: "Add X-Accel-Buffering: no to disable nginx/ALB response buffering"
        strip_content_length:
          type: boolean
          default: true
          description: "Remove Content-Length from SSE responses (streams are indefinite)"
        retry_ms:
          type: integer
          format: uint64
          minimum: 1
          description: "EventSource reconnection hint in milliseconds (must be >= 1 when set)"
        force_sse_content_type:
          type: boolean
          default: false
          description: "Force Content-Type: text/event-stream even if backend returns something else"
        wrap_non_sse_responses:
          type: boolean
          default: false
          description: "Wrap non-SSE response bodies in data: ...\\n\\n SSE event framing (enables response buffering). Implies client-visible text/event-stream for wrapped responses and composes with force_sse_content_type."

    RateLimitingRuleConfig:
      type: object
      required: [scope]
      additionalProperties: false
      oneOf:
        - allOf:
            - required: [window_seconds, max_requests]
            - not:
                anyOf:
                  - required: [requests_per_second]
                  - required: [requests_per_minute]
                  - required: [requests_per_hour]
        - allOf:
            - anyOf:
                - required: [requests_per_second]
                - required: [requests_per_minute]
                - required: [requests_per_hour]
            - not:
                anyOf:
                  - required: [window_seconds]
                  - required: [max_requests]
      allOf:
        - if:
            properties:
              scope:
                pattern: "^[cC][oO][nN][sS][uU][mM][eE][rR][sS]$"
            required: [scope]
          then:
            required: [consumers]
        - if:
            properties:
              scope:
                pattern: "^[dD][eE][fF][aA][uU][lL][tT]$"
            required: [scope]
          then:
            not:
              required: [consumers]
      description: "One rate_limiting rule. Every rule must set either one or more preset fields (`requests_per_second`/`requests_per_minute`/`requests_per_hour`) or the custom-window pair (`window_seconds` + `max_requests`), but not both styles in the same rule. Exactly one rule in the plugin config must use `scope: default`. `scope: consumers` is only valid with `limit_by: consumer`; each listed identity gets its own independent counter using this rule's windows."
      properties:
        scope:
          type: string
          pattern: "^([dD][eE][fF][aA][uU][lL][tT]|[cC][oO][nN][sS][uU][mM][eE][rR][sS])$"
          description: "`default` applies to all keys without a more specific consumer rule and to IP fallback. `consumers` selects the identities listed in `consumers`; each identity has its own counter. Parsed case-insensitively."
        consumers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: "Effective consumer identities for `scope: consumers` rules. Each listed identity gets an independent counter using this rule's windows. Matched against mapped Consumer username first, then external authenticated identity."
        requests_per_second:
          type: integer
          format: uint64
          minimum: 1
          description: Max requests per second
        requests_per_minute:
          type: integer
          format: uint64
          minimum: 1
          description: Max requests per minute
        requests_per_hour:
          type: integer
          format: uint64
          minimum: 1
          description: Max requests per hour
        window_seconds:
          type: integer
          format: uint64
          minimum: 1
          description: Custom rate-limit window length in seconds. Must be paired with `max_requests`.
        max_requests:
          type: integer
          format: uint64
          minimum: 1
          description: Maximum requests permitted within `window_seconds`.

    RateLimitingConfig:
      type: object
      required: [limits]
      additionalProperties: false
      description: "Plugin: rate_limiting — Per-IP, per-consumer, or per-SPIFFE-identity request rate limiting. On stream proxies, consumer mode uses the identified stream Consumer when available and otherwise falls back to client IP; `spiffe_identity` keys on the SPIFFE ID extracted by the `spiffe_identity` / `mtls_auth` mesh chain and falls back to client IP when no SPIFFE identity is present. Supports centralized Redis-backed mode for coordinating rate limits across multiple gateway instances. `limits` must contain exactly one `scope: default` rule for generic keys and fallback IPs, plus optional `scope: consumers` rules that apply the same rate rule to one or many consumer identities, each with an independent counter. Counter storage supports only local memory and Redis; database-backed counters are intentionally unsupported."
      properties:
        limit_by:
          type: string
          enum: [ip, consumer, spiffe_identity, spiffe]
          default: ip
          description: |
            Rate limit key:
            - `ip` (default) — client IP.
            - `consumer` — identified consumer (HTTP) or stream consumer (TCP/UDP); falls back to client IP when no consumer is present.
            - `spiffe_identity` — SPIFFE ID extracted from peer certificate (mesh authn). `spiffe` is accepted as an alias.
        expose_headers:
          type: boolean
          default: false
          description: Inject x-ratelimit-* headers on requests and responses
        limits:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RateLimitingRuleConfig"
          description: "Rate-limit rules. Must include exactly one `scope: default` rule. `scope: consumers` rules are only valid when `limit_by` is `consumer`."
        sync_mode:
          type: string
          enum: [local, redis]
          default: local
          description: "Rate limit state storage: 'local' (in-memory per instance) or 'redis' (centralized across instances). Database-backed counters are unsupported. Any RESP-compatible server works (Redis, Valkey, DragonflyDB, KeyDB, Garnet)."
        redis_url:
          type: string
          description: "Redis connection URL (e.g., redis://host:6379/0). Required when sync_mode is 'redis'."
        redis_tls:
          type: boolean
          default: false
          description: "Enable TLS for the Redis connection (upgrades redis:// to rediss://). CA verification uses gateway-level FERRUM_TLS_CA_BUNDLE_PATH; skip-verify uses FERRUM_TLS_NO_VERIFY."
        redis_key_prefix:
          type: string
          default: "ferrum:rate_limiting"
          description: Key prefix for all Redis keys (namespace isolation)
        redis_pool_size:
          type: integer
          default: 4
          description: Number of multiplexed Redis connections
        redis_username:
          type: string
          description: Redis username for ACL-based authentication (Redis 6+)
        redis_password:
          type: string
          description: Redis password for authentication
        redis_connect_timeout_seconds:
          type: integer
          default: 5
          description: Redis connection timeout in seconds
        redis_health_check_interval_seconds:
          type: integer
          default: 5
          description: Interval in seconds for health check pings when Redis is marked unavailable

    RequestSizeLimitingConfig:
      type: object
      description: |
        Plugin: request_size_limiting — Per-proxy request body size limits.
        Rejects oversized requests with HTTP 413 in three places: an early
        Content-Length fast path (`on_request_received`), a buffered-body
        check when another plugin already loaded the body (`before_proxy`),
        and a final post-transform check before forwarding to the backend
        (`on_final_request_body`).
      required:
        - max_bytes
      properties:
        max_bytes:
          type: integer
          format: uint64
          minimum: 1
          description: >-
            Maximum allowed request body size in bytes. Required and must be
            greater than zero — the gateway rejects plugin creation when
            missing or 0.

    WafPluginConfig:
      type: object
      description: "Plugin: waf — OWASP-style content-pattern threat detection for HTTP-family requests and optional responses."
      properties:
        mode:
          type: string
          enum: [enforce, monitor, disabled]
          default: enforce
        default_rule_action:
          type: string
          enum: [enforce, monitor, disabled]
          description: >-
            Bulk action applied to every built-in rule. Unset leaves the pack
            monitor-only; per-rule rule_modes entries still take precedence.
            Combine with paranoia_level to enforce only the low-false-positive
            core of the rule pack.
        paranoia_level:
          type: integer
          minimum: 1
          maximum: 4
          default: 1
        request_inspection:
          type: boolean
          default: true
        request_body_inspection:
          type: boolean
          default: true
        response_inspection:
          type: boolean
          default: false
        response_body_inspection:
          type: boolean
          default: false
        log_to_metadata:
          type: boolean
          default: true
        log_to_stdout:
          type: boolean
          default: false
        scan_budget_ms:
          type: integer
          default: 50
        max_scan_bytes:
          type: integer
          default: 1048576
        on_scan_timeout:
          type: string
          enum: [allow, block, log_and_allow]
          default: log_and_allow
        on_body_too_large:
          type: string
          enum: [scan_truncated, skip, block]
          default: scan_truncated
          description: >-
            Behavior when a body exceeds max_scan_bytes. scan_truncated scans
            the prefix; skip scans nothing; block rejects (fail closed) when
            mode is enforce, otherwise scans the prefix.
        include_default_rules:
          type: boolean
          default: true
        disabled_default_rules:
          type: array
          items:
            type: string
          default: []
        rule_modes:
          type: object
          additionalProperties:
            type: string
            enum: [enforce, monitor, disabled]
        rule_overrides:
          type: object
          description: >-
            Per-rule tuning by rule id (built-in or custom): attach fp_filters,
            scope via conditions, raise/lower paranoia_min, change severity, or
            set action without forking the rule pack. Unknown rule ids and
            unsupported fields are rejected.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              action:
                type: string
                enum: [enforce, monitor, disabled]
              paranoia_min:
                type: integer
                minimum: 1
                maximum: 4
              severity:
                type: string
                enum: [info, low, medium, high, critical]
              score:
                type: integer
                minimum: 0
              fp_filters:
                type: array
                items:
                  type: string
              conditions:
                type: object
                properties:
                  paths:
                    type: array
                    description: >-
                      Exact paths by default. A trailing `*` means prefix match,
                      and a leading `~` means an operator-authored regex matched
                      with regex `is_match`; regex conditions may match anywhere
                      in the path unless the pattern itself is anchored.
                    items:
                      type: string
                  methods:
                    type: array
                    items:
                      type: string
                  headers:
                    type: object
                    additionalProperties:
                      type: [string, "null"]
                  consumers:
                    type: array
                    items:
                      type: string
        custom_rules:
          type: array
          items:
            $ref: "#/components/schemas/WafRule"
          default: []
        scoring:
          type: object
          description: >-
            Anomaly scoring. When enabled, every matched rule contributes its
            severity weight (or per-rule score) to a cumulative transaction
            score; the request is rejected when the score reaches
            block_threshold and mode is enforce, even when no individual rule
            is set to enforce. The running total is exposed as waf.score.
          properties:
            enabled:
              type: boolean
              default: true
            block_threshold:
              type: integer
              minimum: 1
              default: 7
            weights:
              type: object
              description: Per-severity weights; defaults info=0 low=2 medium=3 high=5 critical=10.
              additionalProperties: false
              properties:
                info:
                  type: integer
                  minimum: 0
                low:
                  type: integer
                  minimum: 0
                medium:
                  type: integer
                  minimum: 0
                high:
                  type: integer
                  minimum: 0
                critical:
                  type: integer
                  minimum: 0
        global_exemptions:
          $ref: "#/components/schemas/WafExemptions"
        body_methods:
          type: array
          items:
            type: string
          default: [POST, PUT, PATCH]
        body_content_types:
          type: array
          items:
            type: string
          default:
            - application/json
            - application/x-www-form-urlencoded
            - application/xml
            - text/xml
            - text/plain
            - text/html
        inspect_multipart:
          type: boolean
          default: false
        inspect_binary_body:
          type: boolean
          default: false
        disallowed_methods:
          type: array
          items:
            type: string
          default: []
        reject_status_code:
          type: integer
          minimum: 400
          maximum: 599
          default: 403
        reject_content_type:
          type: string
          default: application/json
        reject_body:
          type: string
          default: '{"error":"Forbidden"}'
        stream:
          $ref: "#/components/schemas/WafStreamConfig"

    WafStreamConfig:
      type: object
      description: >
        Optional raw TCP/UDP inspection. When present the WAF also attaches to
        stream proxies. L7 signature scanning runs over plaintext application
        bytes (plain TCP opening segment, decrypted TLS/DTLS payloads); encrypted
        passthrough traffic is never L7-scanned. Governed by the global `mode`.
      properties:
        tcp_require_tls:
          type: boolean
          default: false
          description: >
            Reject a TCP connection whose opening bytes are not a TLS/DTLS
            ClientHello. Applies to plain/passthrough proxies; a no-op once TLS
            is terminated.
        inspect_tcp:
          type: boolean
          default: true
          description: Run signatures over the opening bytes of TCP streams.
        inspect_udp:
          type: boolean
          default: true
          description: Run signatures over UDP/DTLS datagram payloads.
        inspect_response:
          type: boolean
          default: false
          description: Also scan backend→client datagrams (client→backend only by default).
        signatures:
          type: array
          items:
            $ref: "#/components/schemas/WafStreamSignature"
          default: []

    WafStreamSignature:
      type: object
      required: [id, pattern]
      properties:
        id:
          type: string
          description: Stable identifier, surfaced in logs and `waf.rule_hits`.
        pattern:
          type: string
          description: Byte regex matched against the stream/datagram payload.
        severity:
          type: string
          enum: [info, low, medium, high, critical]
          default: medium
        action:
          type: string
          enum: [enforce, monitor, disabled]
          default: enforce

    WafRule:
      type: object
      required: [id, category, target]
      properties:
        id:
          type: string
          example: FE-SQLI-001
        name:
          type: string
        category:
          type: string
          example: sqli
        severity:
          type: string
          enum: [info, low, medium, high, critical]
          default: medium
        target:
          oneOf:
            - type: string
              enum:
                - header_names
                - header_values
                - request_headers
                - query_keys
                - query_values
                - request_query
                - cookies
                - url_path
                - request_path
                - full_url
                - request_url
                - method
                - request_method
                - body_text
                - request_body
                - body_json_path
                - response_headers
                - response_body
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum:
                    - header_names
                    - header_values
                    - request_headers
                    - query_keys
                    - query_values
                    - request_query
                    - cookies
                    - url_path
                    - request_path
                    - full_url
                    - request_url
                    - method
                    - request_method
                    - body_text
                    - request_body
                    - body_json_path
                    - response_headers
                    - response_body
                names:
                  type: array
                  description: Only valid for header_values/request_headers targets; must be non-empty when provided.
                  items:
                    type: string
                path:
                  type: string
                  description: Required and only valid for body_json_path targets.
        match_kind:
          type: string
          enum: [regex, literal, contains, equals, luhn, cidr]
          default: regex
        pattern:
          type: string
        action:
          type: string
          enum: [enforce, monitor, disabled]
          default: monitor
        fp_filters:
          type: array
          items:
            type: string
          default: []
        paranoia_min:
          type: integer
          minimum: 1
          maximum: 4
          default: 1
        score:
          type: integer
          minimum: 0
          description: Anomaly-score contribution when scoring is enabled; defaults to the per-severity weight.
        conditions:
          type: object
          properties:
            paths:
              type: array
              description: >-
                Exact paths by default. A trailing `*` means prefix match, and a
                leading `~` means an operator-authored regex matched with regex
                `is_match`; regex conditions may match anywhere in the path
                unless the pattern itself is anchored.
              items:
                type: string
            methods:
              type: array
              items:
                type: string
            headers:
              type: object
              additionalProperties:
                type: [string, "null"]
            consumers:
              type: array
              items:
                type: string

    WafExemptions:
      type: object
      properties:
        paths:
          type: array
          description: >-
            Paths that short-circuit the entire WAF. Each entry matches from the
            start of the path: a plain string is an exact full-path match,
            `prefix*` is a prefix match, and `~regex` is a start-anchored regex
            (implicit `^(?:...)` wrapper so every alternation branch is
            anchored). Use `~.*pattern` for a floating substring match. Keep entries tight — an over-broad pattern silently disables
            the WAF on unintended routes.
          items:
            type: string
        methods:
          type: array
          items:
            type: string
        consumers:
          type: array
          items:
            type: string
        ips:
          type: array
          items:
            type: string
        header_present:
          type: object
          additionalProperties:
            type: [string, "null"]
        fp_capture_filters:
          type: array
          items:
            type: string

    ResponseSizeLimitingConfig:
      type: object
      description: |
        Plugin: response_size_limiting — Per-proxy response body size limits.
        Rejects oversized responses with HTTP 502 either via Content-Length
        fast path (`after_proxy`) or after final buffering when
        `require_buffered_check: true` is set (`on_final_response_body`).
        Without `require_buffered_check`, chunked/streaming responses
        without Content-Length cannot be enforced by this plugin — the
        global `FERRUM_MAX_RESPONSE_BODY_SIZE_BYTES` limit applies in that
        case via the gateway's `SizeLimitedStreamingResponse` adapter.
      required:
        - max_bytes
      properties:
        max_bytes:
          type: integer
          format: uint64
          minimum: 1
          description: >-
            Maximum allowed response body size in bytes. Required and must be
            greater than zero — the gateway rejects plugin creation when
            missing or 0.
        require_buffered_check:
          type: boolean
          default: false
          description: Force response body buffering so this plugin can enforce the size limit on chunked/streaming responses without Content-Length.

    FaultInjectionConfig:
      type: object
      additionalProperties: false
      description: "Plugin: fault_injection — Probabilistic aborts and latency injection for chaos testing. HTTP-family faults run in before_proxy; raw TCP faults run on stream connect. UDP and DTLS are not supported."
      properties:
        abort:
          type: [object, "null"]
          additionalProperties: false
          properties:
            status_code:
              type: integer
              minimum: 200
              maximum: 599
              description: Final HTTP status returned when the abort fault triggers
            percentage:
              type: number
              exclusiveMinimum: 0
              maximum: 100
              description: Abort probability as a percentage. Positive values below one 64-bit sampler bucket round up to that first bucket.
            grpc_status:
              type: integer
              minimum: 0
              maximum: 16
              description: Optional gRPC status emitted only for native application/grpc requests; plain HTTP, WebSocket, and gRPC-Web rejects omit it
            body:
              type: string
              default: ""
              description: HTTP response body returned with the abort
          required: [status_code, percentage]
        delay:
          type: [object, "null"]
          additionalProperties: false
          properties:
            duration_ms:
              type: integer
              format: uint64
              minimum: 1
              maximum: 60000
              description: Delay duration before continuing or aborting, capped at one minute
            percentage:
              type: number
              exclusiveMinimum: 0
              maximum: 100
              description: Delay probability as a percentage. Positive values below one 64-bit sampler bucket round up to that first bucket.
          required: [duration_ms, percentage]
        runtime_overlay_scope:
          type: [string, "null"]
          pattern: '\S'
          description: |
            Optional RTDS scope containing at least one non-whitespace
            character; null is equivalent to omission, and leading and
            trailing whitespace is trimmed. The accepted request epoch captures
            `ferrum.fault_injection.<scope>.abort_percent` and `.delay_percent`
            atomically with this plugin config. Missing or malformed keys fall
            back independently to the static percentage.
      anyOf:
        - required: [abort]
          properties:
            abort:
              type: object
        - required: [delay]
          properties:
            delay:
              type: object

    BodyValidatorConfig:
      type: object
      description: "Plugin: body_validator — JSON Schema, XML, and gRPC protobuf validation for request/response bodies."
      properties:
        json_schema:
          type: object
          description: JSON Schema for request body validation
        required_fields:
          type: array
          items:
            type: string
          default: []
          description: Simple required field names in request body
        validate_xml:
          type: boolean
          default: false
          description: Enable XML well-formedness validation
        required_xml_elements:
          type: array
          items:
            type: string
          default: []
          description: Required XML element names
        xml_max_entities:
          type: integer
          format: uint64
          default: 100
          description: >-
            Max <!ENTITY declarations allowed in an XML DOCTYPE before the body
            is rejected as a possible entity-expansion (billion-laughs) attack.
            Applies to request and response XML when well-formedness validation
            runs.
        xml_reject_nested_entities:
          type: boolean
          default: true
          description: >-
            Reject XML whose entity definitions reference other general
            entities (the billion-laughs expansion signature).
        content_types:
          type: array
          items:
            type: string
          default: ["application/json", "application/xml", "text/xml"]
          description: MIME types to validate
        response_json_schema:
          type: object
          description: JSON Schema for response body validation
        response_required_fields:
          type: array
          items:
            type: string
          default: []
          description: Required field names in response
        response_validate_xml:
          type: boolean
          default: false
        response_required_xml_elements:
          type: array
          items:
            type: string
          default: []
        response_content_types:
          type: array
          items:
            type: string
          default: ["application/json", "application/xml", "text/xml"]
        protobuf_descriptor_path:
          type: string
          description: Path to compiled FileDescriptorSet binary (protoc --descriptor_set_out --include_imports)
        protobuf_request_type:
          type: string
          description: Default fully-qualified protobuf message type for request validation
        protobuf_response_type:
          type: string
          description: Default fully-qualified protobuf message type for response validation
        protobuf_method_messages:
          type: object
          additionalProperties:
            type: object
            properties:
              request:
                type: string
                description: Fully-qualified protobuf message type for request validation
              response:
                type: string
                description: Fully-qualified protobuf message type for response validation
          description: Per-method message type overrides keyed by gRPC path
        protobuf_reject_unknown_fields:
          type: boolean
          default: false
          description: Reject messages containing field numbers not in the descriptor
        grpc_max_decompressed_size_bytes:
          type: integer
          format: uint64
          minimum: 0
          default: 10485760
          description: >-
            Maximum decompressed protobuf payload size accepted from a gRPC
            frame. Defaults to `FERRUM_MAX_REQUEST_BODY_SIZE_BYTES`, or 10 MiB
            when that setting is absent.

    OpenapiValidatorConfig:
      type: object
      required: [operations]
      description: |
        Plugin: openapi_validator — validates request and response bodies
        against operation schemas generated from an attached OpenAPI/Swagger
        document. Supports JSON, XML, form-urlencoded, multipart, text, and
        binary media types. Usually generated by `x-ferrum-validate` on
        `POST /api-specs` or `PUT /api-specs/{id}`; direct creation requires a
        proxy-scoped plugin attached to a proxy with `api_spec_id` set.
      properties:
        enforcement_mode:
          type: string
          enum: [block, log_only, disabled]
          default: block
          description: Blocking rejects mismatches, log_only records metadata and continues, disabled skips validation.
        validate_request:
          type: boolean
          default: true
          description: Validate request bodies when an operation has a request schema.
        validate_response:
          type: boolean
          default: true
          description: Validate response bodies when an operation has a response schema.
        request_content_types:
          type: array
          items:
            type: string
          default:
            - application/json
            - application/xml
            - text/xml
            - application/x-www-form-urlencoded
            - multipart/form-data
            - text/plain
            - application/octet-stream
          description: Request media types in scope. JSON includes `+json`, XML includes `+xml`, text/plain covers `text/*`, and application/octet-stream covers common binary application, image, audio, and video types.
        response_content_types:
          type: array
          items:
            type: string
          default:
            - application/json
            - application/xml
            - text/xml
            - application/x-www-form-urlencoded
            - multipart/form-data
            - text/plain
            - application/octet-stream
          description: Response media types in scope. JSON includes `+json`, XML includes `+xml`, text/plain covers `text/*`, and application/octet-stream covers common binary application, image, audio, and video types.
        fail_on_unknown_operation:
          type: boolean
          default: true
          description: Reject requests that do not match any generated operation.
        fail_on_missing_response_schema:
          type: boolean
          default: false
          description: Reject responses with no exact/default schema for the status and content type.
        max_body_bytes:
          type: integer
          format: uint64
          minimum: 1
          default: 1048576
          description: Maximum raw or decompressed body size to validate.
        schema_draft:
          type: string
          enum: [auto, draft7, draft2020-12]
          default: auto
          description: JSON Schema draft used when compiling generated schemas.
        operations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OpenapiValidatorOperation"
          description: Generated operation schema table. The importer replaces this from the spec on every spec PUT.
        bypass:
          type: object
          additionalProperties: false
          properties:
            paths:
              type: array
              items:
                type: string
              default: []
              description: Regex paths that skip validation.
            methods:
              type: array
              items:
                type: string
              default: []
              description: HTTP methods that skip validation.
            consumers:
              type: array
              items:
                type: string
              default: []
              description: Consumer identities that skip validation.
            header_present:
              type: object
              additionalProperties:
                type: [string, "null"]
              default: {}
              description: Header-name map. Null means any value; a string requires exact value.
        error_response:
          type: object
          additionalProperties: false
          properties:
            request_status_code:
              type: integer
              format: uint16
              minimum: 400
              maximum: 599
              default: 400
            response_status_code:
              type: integer
              format: uint16
              minimum: 400
              maximum: 599
              default: 502
            content_type:
              type: string
              default: application/problem+json
        error_truncate_chars:
          type: integer
          format: uint64
          default: 1024
          description: Maximum validation-error characters written to metadata and problem bodies.

    OpenapiValidatorOperation:
      type: object
      additionalProperties: false
      required: [method, path_template, path_regex]
      properties:
        method:
          type: string
          description: Uppercase HTTP method.
        path_template:
          type: string
          description: OpenAPI path template, used for metadata and path specificity ordering.
        path_regex:
          type: string
          description: >-
            Regex used to match the request path, compiled at plugin load.
            Auto-generated specs derive it from the path template; operator-supplied
            patterns are automatically anchored as `^(?:...)$` (full-path match) so a
            loose pattern cannot substring-match an unintended superstring path.
        operation_label:
          type: string
          description: Optional metadata label. Defaults to "`METHOD path_template`".
        request_required:
          type: boolean
          default: false
          description: Reject empty request bodies when the OpenAPI requestBody is required.
        request_body:
          type: object
          properties:
            content:
              type: object
              additionalProperties:
                type: object
              description: Media type to JSON Schema map.
            content_type:
              type: string
              description: Alternate single-schema form.
            schema:
              type: object
              description: Alternate single-schema form.
          description: Request body schemas by media type.
        responses:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
          description: Status code to media type to JSON Schema map. Exact status codes are checked first, OpenAPI wildcard ranges such as `4XX` are checked next, and `default` is used as the final fallback.

    RequestTerminationConfig:
      type: object
      description: >-
        Plugin: request_termination — Returns a canned response without
        proxying to the backend. The response body and `content-type` are
        rendered once at construction time so the request hot path is
        allocation-light. Useful for maintenance windows, mocking, or
        path/header-based short-circuiting. Runs after CORS so browser
        preflight responses are still emitted correctly. HTTP-family only.
      properties:
        status_code:
          type: integer
          format: uint16
          minimum: 100
          maximum: 599
          default: 503
          description: >-
            HTTP status code returned. Values outside 100–599 (or non-numeric
            values) are coerced to 503.
        content_type:
          type: string
          default: application/json
          description: >-
            `Content-Type` header value. The default-body renderer uses this to
            choose between JSON, XML, and plain-text formatting (substring
            match for `json` / `xml`).
        body:
          type: string
          default: ""
          description: >-
            Explicit response body. When set (non-empty) it is returned
            verbatim and `message` is ignored.
        message:
          type: string
          default: Service unavailable
          description: >-
            Used to build the default body when `body` is empty. Rendered as a
            JSON `message` field, an XML `<message>` element, or plain text
            depending on `content_type`. JSON and XML escaping are applied
            automatically.
        trigger:
          type: object
          description: >-
            Optional trigger condition. Without a trigger every request on the
            proxy is terminated (maintenance-mode default). Set only one of
            `path_prefix` or `header`; configuring both is rejected.
          properties:
            path_prefix:
              type: string
              description: >-
                Only terminate when the request path starts with this prefix.
                Must start with `/`, or be exactly `*` to match the
                asterisk-form target of a server-wide `OPTIONS *` request, and
                contain no control characters; any other value can never match
                a request path. Mutually exclusive with `header`.
            header:
              type: string
              description: >-
                Only terminate when this request header is present. The
                comparison is case-insensitive on the header name. Mutually
                exclusive with `path_prefix`.
            header_value:
              type: string
              default: ""
              description: >-
                Optional exact value for `header`. Empty (default) matches
                any value, so the trigger fires whenever the header is
                present.

    ResponseMockConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: response_mock — Returns mock responses for API testing before
        backends are ready. Rule paths are relative to a prefix listen_path;
        exact (`=`), regex (`~`), root (`/`), and host-only scopes match the
        full request path. Supports HTTP, gRPC, and WebSocket upgrade
        handshakes: a match short-circuits only the HTTP handshake response and
        does not establish or mock an upgraded WebSocket frame stream. Unknown
        top-level and per-rule keys are rejected; the free-form headers map
        remains open for string-valued response headers. Runtime construction
        is the authoritative final boundary.
      required:
        - rules
      properties:
        rules:
          type: array
          description: Mock rules evaluated in order (first match wins)
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - path
            properties:
              method:
                type: string
                minLength: 1
                description: >-
                  HTTP method token to match (omit to match all methods). When
                  supplied it must be non-empty and parse as an HTTP method
                  token (runtime validates via http::Method). The configured
                  method is normalized to uppercase and compared exactly with
                  the request method.
              path:
                type: string
                minLength: 1
                description: >-
                  Non-empty rule path. Relative to a prefix listen_path
                  (e.g., /users for listen_path /api/v1). For exact (`=`),
                  regex (`~`), root (`/`), and host-only proxies, use the full
                  request path. Regex rule paths use a ~ prefix (auto-anchored).
              status_code:
                type: integer
                format: uint16
                minimum: 100
                maximum: 599
                description: >-
                  HTTP status code to return (default 200). Values outside
                  100–599 are rejected. Status 101 on an HTTP/1.1 WebSocket
                  upgrade, or a success-like 200 on HTTP/2 / HTTP/3 Extended
                  CONNECT, is still only a synthetic HTTP handshake response;
                  it does not create an upgraded frame stream.
              headers:
                type: object
                additionalProperties:
                  type: string
                description: Response headers (default content-type application/json)
              body:
                type: string
                description: Response body string
              delay_ms:
                type: integer
                format: uint64
                maximum: 3600000
                description: "Simulated latency in milliseconds (default 0). Capped at 3600000 (1 hour); larger values are rejected at config validation."
        passthrough_on_no_match:
          type: boolean
          description: >-
            If true, unmatched requests (including WebSocket upgrades) continue
            to the backend. If false (default), returns 404.

    SpecExposeConfig:
      type: object
      additionalProperties: false
      description: "Plugin: spec_expose — Exposes API specification documents (OpenAPI, WSDL, WADL) for GET and HEAD on the canonical /specz sub-path. HEAD retains the GET representation through response-body policy, then returns the final status and representation headers without a wire body. Unauthenticated. Only works with prefix-based listen_path proxies (HTTP only). Successful upstream fetches are capped by max_response_body_bytes and cached in-process for cache_ttl_seconds (default 300s). Failed fetches are coalesced and negatively cached with bounded exponential backoff; excess cache-miss waiters receive HTTP 503 with Retry-After."
      required:
        - spec_url
      properties:
        spec_url:
          type: string
          description: "Full URL (http or https only) to fetch the API specification document (e.g., https://internal-service/docs/openapi.yaml). URL userinfo is rejected. Paths and queries may be used for origin routing or signed access, but are omitted from gateway diagnostics."
        content_type:
          type: [string, "null"]
          description: "Trusted response Content-Type override; it is not restricted by the upstream allow-list. When omitted or null, only supported spec media types are preserved from upstream (case-insensitive media-type comparison, with original parameters retained); every other or missing value falls back to application/octet-stream."
        tls_no_verify:
          type: [boolean, "null"]
          description: "Skip TLS certificate verification when fetching the spec. Omitted or null defaults to the gateway's FERRUM_TLS_NO_VERIFY setting. When verification is enabled and a gateway CA bundle is configured, load or parse failure rejects plugin construction instead of widening trust."
        cache_ttl_seconds:
          type: [integer, "null"]
          format: uint64
          minimum: 0
          default: 300
          description: "Time-to-live for the in-process spec body cache (seconds). Omitted or null defaults to 300. The first /specz request fetches the spec from spec_url and stores it; subsequent requests within the TTL window return the cached copy without re-fetching. Set to 0 to disable durable positive caching; callers admitted before an in-flight fetch completes still share that fetch regardless of scheduling delay, while later requests immediately re-fetch. Failed fetches use bounded negative-cache backoff regardless of this value."
        max_response_body_bytes:
          type: [integer, "null"]
          format: uint64
          minimum: 1
          default: 26214400
          description: "Maximum upstream spec response body size to buffer and cache. Omitted or null defaults to 26214400. The body is streamed with this cap so oversized responses are rejected with HTTP 502 before unbounded memory growth."

    LoadTestingConfig:
      type: object
      additionalProperties: false
      description: |
        Plugin: load_testing — On-demand proxy load testing triggered by
        X-Loadtesting-Key header. Spawns concurrent clients through the
        gateway's own proxy listener (HTTP only). Unknown top-level keys are
        rejected. File, admin/database, and CP/DP admission share the same
        constructor validation; serving-mode publication uses KeepLastKnownGood
        so an invalid candidate keeps the prior valid generation active.
        Omitted optional fields select defaults; runtime also treats explicit
        null on optional fields as omitted.
      required:
        - key
        - concurrent_clients
        - duration_seconds
      properties:
        key:
          type: string
          minLength: 1
          description: Secret value that the X-Loadtesting-Key header must match to trigger the load test
        concurrent_clients:
          type: integer
          format: uint64
          minimum: 1
          maximum: 10000
          description: Number of concurrent virtual clients
        duration_seconds:
          type: integer
          format: uint64
          minimum: 1
          maximum: 3600
          description: How long the test runs in seconds
        ramp:
          type: [boolean, "null"]
          default: false
          description: When true, clients start gradually over the duration instead of all at once
        request_timeout_ms:
          type: [integer, "null"]
          format: uint64
          default: 30000
          minimum: 1
          description: "Per-request timeout in milliseconds. Prevents workers from hanging on streaming/long-lived responses (SSE, long-poll)"
        max_response_body_bytes:
          type: [integer, "null"]
          format: uint64
          minimum: 1
          default: 1048576
          description: >-
            Maximum response bytes the synthetic client consumes per request.
            Must be greater than zero. The client stops reading at the cap,
            bounding its own work and memory without changing the backend
            response.
        gateway_port:
          type: [integer, "null"]
          format: uint16
          description: "Local gateway port for synthetic requests. Defaults to FERRUM_PROXY_HTTP_PORT (or FERRUM_PROXY_HTTPS_PORT when gateway_tls is enabled) or 8000/8443"
        gateway_tls:
          type: [boolean, "null"]
          default: false
          description: Use HTTPS for local loopback synthetic requests
        gateway_tls_no_verify:
          type: [boolean, "null"]
          description: "Skip TLS cert verification for loopback connections. Defaults to true when gateway_tls is enabled (gateway cert typically won't match 127.0.0.1)"
        gateway_addresses:
          type: [array, "null"]
          items:
            type: string
          description: "Remote gateway URLs to fan out the trigger to. Each receives the original request WITH the key header so it starts its own local load test"

    RequestMirrorConfig:
      type: object
      description: |
        Plugin: request_mirror — Duplicates live proxy traffic to a secondary
        destination for shadow testing, validation, or migration checks
        without affecting client responses. Mirrored requests are
        fire-and-forget: spawned via `tokio::spawn`, the gateway never waits
        for the mirror response and mirror failures never propagate to the
        client. Mirror response metadata (status, size, latency) is captured
        via a `tokio::sync::watch` channel and surfaced through transaction
        logs.
      required:
        - mirror_host
      properties:
        mirror_host:
          type: string
          description: "Hostname or IP of the mirror target. Normalized to ASCII-lowercase at config load."
        mirror_port:
          type: integer
          format: uint16
          minimum: 1
          maximum: 65535
          description: "Port of the mirror target. Defaults to 80 (http) or 443 (https)."
        mirror_protocol:
          type: string
          enum: [http, https]
          default: http
          description: "Transport protocol used for the mirror request."
        mirror_path:
          type: string
          description: "Override path used for the mirror request. When omitted, the original request path is used."
        percentage:
          type: number
          format: double
          minimum: 0.0
          maximum: 100.0
          default: 100.0
          description: "Percentage of requests to mirror. Granularity is 0.1% (deterministic counter-based sampling, no RNG)."
        mirror_request_body:
          type: boolean
          default: true
          description: "When true, the request body is forwarded to the mirror target. Binary-safe (preserves gRPC protobuf and other non-UTF-8 payloads). Forces request-body buffering for this proxy."
        max_in_flight:
          type: integer
          format: uint64
          minimum: 1
          default: 256
          description: >-
            Maximum mirror tasks allowed concurrently. Requests that arrive
            while every permit is in use are still served normally but are not
            mirrored.
        max_response_body_bytes:
          type: integer
          format: uint64
          minimum: 1
          default: 1048576
          description: "Cap on bytes read from a mirror response when deriving its size. Only consulted when the response has no `content-length` header — streaming is aborted as soon as the limit is crossed and the mirror task records the truncated count. Bytes are discarded after measurement, so this only bounds memory pressure from misbehaving mirror sinks. Default is 1 MiB."

    ServerlessFunctionConfig:
      type: object
      additionalProperties: false
      description: |
        Plugin: serverless_function — Invokes AWS Lambda, Azure Functions, or
        Google Cloud Functions as middleware in the proxy pipeline. In
        `pre_proxy` mode the function response can inject request headers and
        metadata before the backend call. In `terminate` mode the function
        response is returned directly to the client (HTTP only — gRPC
        rejection normalization would drop the body, so terminate mode on
        gRPC requests is rejected with 500). Cloud credential fields fall
        back to well-known environment variables. Terminate mode forwards
        applicable end-to-end response headers, preserving repeated Set-Cookie
        and list-valued Link while requiring Location, Content-Location, and
        Refresh to remain singleton,
        while stripping hop-by-hop, Connection-listed, transport-managed,
        provider-control, and credential-bearing fields. URL-valued Location,
        Content-Location, Refresh (url= and bare URI forms after semicolon,
        comma, or ASCII-whitespace delay separators), and every Link target are removed
        when a relative, absolute, encoded, or nested target exposes the
        configured signed function path/query. Duplicate singleton URL-valued
        fields fail closed instead of being comma-folded; repeated Link lines
        are revalidated as the exact combined list returned downstream.
        Complete signed paths match at
        slash-delimited segment boundaries even with added prefix or descendant
        segments, not inside arbitrary substrings. The complete slash-trimmed
        signed path is also protected when copied exactly into either side of a
        decoded query pair; longer scalar lookalikes remain observable. Both
        non-empty components of every configured query pair are protected
        credential scalars: a key
        remains protected whether it is key-only (`?SIGNED_TOKEN=`) or paired
        with a value (`?SIGNED_TOKEN=1`), and a non-empty value is protected
        independently. Exact ASCII-case-insensitive URI scheme copies are also
        governed. Leading and trailing slashes remain part of each scalar;
        a slash-only scalar remains protected and makes ambiguous URL-path
        surfaces fail closed. Each scalar remains protected if copied into
        either side of another query pair or into decoded paths at URI-component
        boundaries (including path-parameter/query delimiters), and decoded fragments are checked
        directly at URI-component boundaries even when they are scalar rather
        than URI-shaped. Query comparison
        percent-decodes generic URI components but preserves literal `+` characters
        instead of applying form-data space conversion. Inspection checks
        explicit numeric authority ports before normalization can erase default
        ports, and is bounded to 16 KiB per field, 32 Link targets, 32 embedded
        path URI references, eight percent-decoding transforms, and two nested
        URI-reference hops. URI userinfo, residual
        encoding, malformed target syntax, malformed percent triplets,
        percent-decoded non-UTF-8 bytes, budget overflow, or another structural
        URI reference at the nesting boundary fails closed even for root
        function destinations, while unrelated URL targets, non-URL
        Refresh directives, quoted Link parameters, and scalar labels without
        signed components remain observable.
        Later body rewrites invalidate ranges, validators, integrity metadata,
        and content-bound signatures while unmodified responses retain them;
        206 Partial Content and 226 IM Used responses skip rewriting to preserve
        range and delta semantics; transform-dependent header hooks also decline
        them rather than relabelling untouched bytes. Inspection still runs,
        and enforcing
        redaction-dependent plugins reject governed content when those bytes
        cannot be safely rewritten.
        Proven pre-invocation payload-validation, unsupported-gRPC, DNS-policy,
        and literal-IP-policy rejections release every acquired deduplication
        owner after commit. Real remote 502 responses remain application
        responses; uncertain post-invocation failures retain their protection.
        Deduplicated terminal replays preserve the final status/body but use
        sanitized headers: session/authentication fields, Retry-After,
        trace/correlation fields, and rate-limit counters are not replayed. The
        stored body is already finalized and bypasses ordinary presentation
        transforms on replay while remaining subject to response inspection and
        final-body validation. A current-policy redaction decision runs only its
        required transform and fails closed with 502 if rewriting cannot
        complete.
        If request_deduplication is attached, every same-protocol instance must
        have a strictly lower effective priority than terminate mode; candidate
        admission rejects equal or reversed ordering before persistence. This
        candidate check derives static serverless capabilities without resolving
        CP-local cloud credentials; runtime construction still validates the
        node-local credentials and environment fail closed.
        HEAD/204/205/304 bodies are empty. Automatic redirects are disabled;
        pre_proxy accepts only 2xx as approval, while terminate may
        intentionally return only final 2xx-5xx statuses (200-599).
        Informational and out-of-range three-digit function statuses follow the
        configured error path.
      required:
        - provider
      properties:
        provider:
          type: string
          enum: [aws_lambda, azure_functions, gcp_cloud_functions]
          description: "Cloud provider for the serverless function."
        mode:
          type: string
          enum: [pre_proxy, terminate]
          default: pre_proxy
          description: |
            pre_proxy: invoke and inject headers/metadata, then continue.
            terminate: invoke and return response to client (HTTP only).
        function_url:
          type: string
          format: uri
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://[^@/?#\\s]+(?:[/?][^#\\s]*)?$"
          description: "HTTP(S) trigger URL without URL userinfo or a fragment. Required for azure_functions and gcp_cloud_functions; ignored for aws_lambda invocation (the URL is derived from region + function name), but still validated when supplied. Path/query credentials are structurally redacted from diagnostics and non-admin/audit projections."
        aws_region:
          type: string
          description: "AWS region (aws_lambda only). Falls back to AWS_DEFAULT_REGION, then AWS_REGION env vars."
        aws_access_key_id:
          type: string
          description: "IAM access key (aws_lambda only). Falls back to AWS_ACCESS_KEY_ID env var."
        aws_secret_access_key:
          type: string
          description: "IAM secret key (aws_lambda only). Falls back to AWS_SECRET_ACCESS_KEY env var."
        aws_function_name:
          type: string
          description: "Lambda function name or ARN (aws_lambda only). Falls back to AWS_LAMBDA_FUNCTION_NAME env var."
        aws_session_token:
          type: string
          description: "STS session token (aws_lambda only). Falls back to AWS_SESSION_TOKEN env var."
        aws_qualifier:
          type: string
          description: "Optional version/alias qualifier (e.g., $LATEST, prod)."
        aws_endpoint_url:
          type: string
          format: uri
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://[^@/?#\\s]+/?$"
          description: >-
            Optional HTTP(S) Lambda endpoint override for LocalStack or a
            VPC-internal endpoint. Must be an origin without userinfo, path,
            query, or fragment. Falls back to `AWS_LAMBDA_ENDPOINT_URL`.
        azure_function_key:
          type: string
          description: "Function key for x-functions-key auth (azure_functions only). Falls back to AZURE_FUNCTIONS_KEY env var."
        gcp_bearer_token:
          type: string
          description: "Bearer token for Authorization header (gcp_cloud_functions only). Falls back to GCP_CLOUD_FUNCTIONS_BEARER_TOKEN env var."
        forward_body:
          type: boolean
          default: false
          description: "Include one authoritative lossless request-body representation in the function payload for every HTTP method. Ferrum never parses JSON into a structured value: exact UTF-8 bytes are carried as a string with body_encoding=utf8, arbitrary bytes are base64 with body_encoding=base64, and the active hook Content-Type is carried separately as body_content_type. The plugin buffers before invocation and fails closed if bytes are unavailable or the active request headers use a non-identity Content-Encoding. Candidate admission and runtime cache construction reject combination with a request-body transformer on the same protocol chain."
        forward_headers:
          type: array
          items:
            type: string
          description: "Header names to forward into the function payload (lowercased at config load)."
        forward_query_params:
          type: boolean
          default: false
          description: "Include decoded query parameters in the function payload after omitting credentials that an earlier auth plugin marked for backend stripping. Duplicate decoded names, invalid percent-encoded UTF-8, raw '+' ambiguity, and parameters lacking their original encoded representation are rejected before invocation even when on_error=continue."
        timeout_ms:
          type: integer
          format: uint64
          minimum: 1
          default: 5000
          description: "Function invocation timeout in milliseconds. Must be > 0."
        max_response_body_bytes:
          type: integer
          format: uint64
          minimum: 1
          default: 10485760
          description: "Max function response body size (10 MiB default). Must be > 0."
        on_error:
          type: string
          enum: [reject, continue]
          default: reject
          description: "reject: return error to client. continue: skip and proxy normally."
        error_status_code:
          type: integer
          format: uint16
          minimum: 400
          maximum: 599
          default: 502
          description: "Final HTTP error status when rejecting an invocation or pre_proxy non-2xx response. Must be in range 400-599."
      allOf:
        - if:
            required: [provider]
            properties:
              provider:
                enum: [azure_functions, gcp_cloud_functions]
          then:
            required: [function_url]
            properties:
              function_url:
                type: string

    ResponseCachingConfig:
      type: object
      description: "Plugin: response_caching — In-memory HTTP response caching keyed by matched proxy, method, path, exact raw query-string hash when enabled, authenticated identity when present, optional anonymous marker, and Vary/credential-selected request headers. Honors Cache-Control freshness, upstream Age/Date, current Age generation on hits, ETag/Last-Modified revalidation (304), Vary, and never caches responses with Set-Cookie. Includes an LRU cacheability predictor that suppresses repeat cache lookups for variants known to be uncacheable. Unknown top-level keys are rejected with path-qualified diagnostics and spelling suggestions so misspelled Vary, consumer, query, Cache-Control, status/method, capacity, or invalidation fields cannot silently weaken isolation or retention. HTTP only."
      additionalProperties: false
      properties:
        ttl_seconds:
          type: [integer, "null"]
          format: uint64
          default: 300
          description: "Default freshness lifetime in seconds when the backend response has no max-age/s-maxage. Backend cache-control directives take precedence when respect_cache_control is true. Upstream Age and Date still reduce remaining freshness."
        max_entries:
          type: [integer, "null"]
          format: uint64
          default: 10000
          description: Maximum number of cached entries before eviction of expired/oldest entries
        max_entry_size_bytes:
          type: [integer, "null"]
          format: uint64
          default: 1048576
          description: Maximum size of a single cached response body (1 MiB by default). Larger responses are not cached.
        max_total_size_bytes:
          type: [integer, "null"]
          format: uint64
          default: 104857600
          description: Exact maximum retained in-memory response-entry size across all entries (100 MiB by default). Concurrent stores and replacements are admitted atomically; oversized entries are not cached.
        cacheable_methods:
          type: array
          items:
            type: string
          default: ["GET", "HEAD"]
          description: HTTP methods eligible for caching (uppercased)
        cacheable_status_codes:
          type: array
          items:
            type: integer
            format: uint16
          default: [200, 301, 404]
          description: Response status codes eligible for caching
        respect_cache_control:
          type: [boolean, "null"]
          default: true
          description: "Honor backend Cache-Control directives (no-store, private, no-cache, max-age, s-maxage, must-revalidate, public)"
        respect_no_cache:
          type: [boolean, "null"]
          default: true
          description: "Bypass cache lookup when the client request sends Cache-Control: no-cache or no-store"
        vary_by_headers:
          type: array
          items:
            type: string
          default: []
          description: "Additional request header names (lowercased) to include in the cache key even when the backend does not send Vary. Merged with any backend Vary response header."
        cache_key_include_query:
          type: [boolean, "null"]
          default: true
          description: Include the exact raw query string in the cache key as a SHA-256 hash. The query string is not parsed, sorted, percent-decoded, or normalized.
        cache_key_include_consumer:
          type: [boolean, "null"]
          default: false
          description: Allow caching authenticated responses under their isolated identity key even when the backend does not send Cache-Control public/s-maxage/must-revalidate; also add an _anon cache-key partition for unauthenticated requests. Authenticated requests are always partitioned by hashed effective identity regardless of this flag.
        add_cache_status_header:
          type: [boolean, "null"]
          default: true
          description: "Add X-Cache-Status (MISS, HIT, BYPASS, REVALIDATED, PREDICTED-BYPASS) to downstream responses. Cache hits also emit a current Age header."
        invalidate_on_unsafe_methods:
          type: [boolean, "null"]
          default: true
          description: "Invalidate cached entries for the matched path (and descendants under the same path prefix) on non-cacheable methods (POST, PUT, PATCH, DELETE)"

    GraphqlConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: graphql — Query depth/complexity limiting, introspection control,
        and per-operation rate limiting. At least one effective protection rule is
        required (`max_depth`, `max_complexity`, `max_aliases`,
        `introspection_allowed: false`, a non-empty `type_rate_limits`, or a
        non-empty `operation_rate_limits`). `introspection_allowed: true` alone is
        not an effective rule. Unknown top-level keys are rejected. Rate-limit
        counter storage supports only local memory and Redis; database-backed
        counters are intentionally unsupported. When `sync_mode` is `redis`,
        `redis_url` is required. Explicit Redis fields are validated even in
        local mode so latent configuration cannot become invalid only when the
        mode is changed. Runtime numeric fields require integer JSON encoding
        (for example `2`, not `2.0`); JSON Schema treats those two encodings as
        the same mathematical integer. Runtime also rejects invalid Redis URL
        shapes that JSON Schema cannot fully cross-validate with every authoring
        tool.
      allOf:
        - anyOf:
            - required: [max_depth]
            - required: [max_complexity]
            - required: [max_aliases]
            - required: [introspection_allowed]
              properties:
                introspection_allowed:
                  const: false
            - required: [type_rate_limits]
              properties:
                type_rate_limits:
                  minProperties: 1
            - required: [operation_rate_limits]
              properties:
                operation_rate_limits:
                  minProperties: 1
        - if:
            required: [sync_mode]
            properties:
              sync_mode:
                const: redis
          then:
            required: [redis_url]
      properties:
        max_depth:
          type: integer
          format: uint32
          description: Maximum allowed query nesting depth
        max_complexity:
          type: integer
          format: uint32
          description: Maximum allowed field count
        max_aliases:
          type: integer
          format: uint32
          description: Maximum allowed alias count
        introspection_allowed:
          type: boolean
          default: true
          description: >-
            Whether introspection queries are permitted. Setting this to `false`
            counts as an effective protection rule; the default `true` does not.
        limit_by:
          type: string
          enum: [ip, consumer]
          default: ip
          description: Rate limit key
        type_rate_limits:
          type: object
          additionalProperties: false
          properties:
            query:
              $ref: "#/components/schemas/GraphqlRateSpec"
            mutation:
              $ref: "#/components/schemas/GraphqlRateSpec"
            subscription:
              $ref: "#/components/schemas/GraphqlRateSpec"
          description: >-
            Rate limits by operation type. Only `query`, `mutation`, and
            `subscription` keys are accepted; unknown keys are rejected.
        operation_rate_limits:
          type: object
          propertyNames:
            pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          additionalProperties:
            $ref: "#/components/schemas/GraphqlRateSpec"
          description: >-
            Rate limits by named operation. Keys must be valid GraphQL Names
            (`[_A-Za-z][_0-9A-Za-z]*`).
        sync_mode:
          type: string
          enum: [local, redis]
          default: local
          description: "GraphQL rate-limit counter storage: 'local' (in-memory) or 'redis' (centralized). Database-backed counters are unsupported."
        redis_url:
          type: string
          minLength: 1
          pattern: '^rediss?://[^/?#\s]+(?:[/?#][^\s]*)?$'
          description: "Redis connection URL. Required when sync_mode is 'redis'."
        redis_tls:
          type: boolean
          default: false
          description: "Enable TLS for the Redis connection. CA verification uses gateway-level FERRUM_TLS_CA_BUNDLE_PATH; skip-verify uses FERRUM_TLS_NO_VERIFY."
        redis_key_prefix:
          type: string
          minLength: 1
          default: "ferrum:graphql"
          description: Key prefix for all Redis keys
        redis_pool_size:
          type: integer
          minimum: 1
          default: 4
          description: Number of multiplexed Redis connections
        redis_username:
          type: string
          description: Redis username for ACL authentication
        redis_password:
          type: string
          description: Redis password
        redis_connect_timeout_seconds:
          type: integer
          minimum: 1
          default: 5
          description: Redis connection timeout in seconds
        redis_health_check_interval_seconds:
          type: integer
          minimum: 1
          default: 5
          description: Health check ping interval when Redis is unavailable

    GrpcMethodRouterConfig:
      type: object
      description: >-
        Plugin: grpc_method_router — Per-method access control and rate limiting
        for gRPC services. Authorizes the backend-effective gRPC path after
        route rewrites, listen-path stripping, backend-path composition, and
        initial target selection, then populates grpc_service, grpc_method, and
        grpc_full_method metadata with that final method. At least one access or
        rate rule is required. Rate-limit counter storage supports only local
        memory and Redis; database-backed counters are intentionally unsupported.
      allOf:
        - anyOf:
            - required: [allow_methods]
            - required: [deny_methods]
              properties:
                deny_methods:
                  minItems: 1
            - required: [method_rate_limits]
              properties:
                method_rate_limits:
                  minProperties: 1
        - if:
            required: [sync_mode]
            properties:
              sync_mode:
                const: redis
          then:
            required: [redis_url]
      properties:
        allow_methods:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^\s*/?[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*/[A-Za-z_][A-Za-z0-9_]*\s*$'
          description: >-
            Only these gRPC methods are permitted (allowlist). Each entry is a
            full method path like /package.Service/Method. Leading/trailing
            whitespace and one optional leading slash are normalized by the
            runtime. Duplicate normalized forms are rejected at runtime; JSON
            Schema uniqueItems can reject only byte-identical duplicates.
        deny_methods:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^\s*/?[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*/[A-Za-z_][A-Za-z0-9_]*\s*$'
          default: []
          description: >-
            These gRPC methods are explicitly blocked. Deny takes precedence
            over allow. Duplicate normalized forms are rejected at runtime;
            JSON Schema uniqueItems can reject only byte-identical duplicates.
        method_rate_limits:
          type: object
          propertyNames:
            pattern: '^\s*/?[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*/[A-Za-z_][A-Za-z0-9_]*\s*$'
          additionalProperties:
            $ref: "#/components/schemas/RateSpec"
          description: >-
            Per-method rate limits keyed by full method path
            (e.g., /myapp.UserService/CreateUser). Duplicate normalized keys
            cannot be expressed by JSON Schema and are rejected at runtime.
        limit_by:
          type: string
          enum: [ip, consumer]
          default: ip
          description: >-
            Rate limit key. When consumer, uses identified_consumer then
            authenticated_identity then client IP as fallback.
        sync_mode:
          type: string
          enum: [local, redis]
          default: local
          description: "gRPC method rate-limit counter storage: 'local' (in-memory) or 'redis' (centralized). Database-backed counters are unsupported."
        redis_url:
          type: string
          minLength: 1
          pattern: '^rediss?://[^/?#\s]+(?:[/?#][^\s]*)?$'
          description: "Redis connection URL. Required when sync_mode is 'redis'."
        redis_tls:
          type: boolean
          default: false
          description: "Enable TLS for the Redis connection. CA verification uses gateway-level FERRUM_TLS_CA_BUNDLE_PATH; skip-verify uses FERRUM_TLS_NO_VERIFY."
        redis_key_prefix:
          type: string
          minLength: 1
          default: "ferrum:grpc_method_router"
          description: Key prefix for all Redis keys
        redis_pool_size:
          type: integer
          minimum: 1
          default: 4
          description: Number of multiplexed Redis connections
        redis_username:
          type: string
          description: Redis username for ACL authentication
        redis_password:
          type: string
          description: Redis password
        redis_connect_timeout_seconds:
          type: integer
          minimum: 1
          default: 5
          description: Redis connection timeout in seconds
        redis_health_check_interval_seconds:
          type: integer
          minimum: 1
          default: 5
          description: Health check ping interval when Redis is unavailable

    GrpcWebConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: grpc_web — Translates between gRPC-Web (browser-compatible)
        and native gRPC (HTTP/2) wire formats. Supports binary
        (application/grpc-web) and text (application/grpc-web-text) encoding.
        Config must be a JSON object (not null); `{}` and objects that only set
        `expose_headers` are accepted. Unknown keys are rejected.
      properties:
        expose_headers:
          type: array
          items:
            type: string
          description: >-
            Additional response headers to include in
            Access-Control-Expose-Headers for browser CORS compatibility.
            grpc-status and grpc-message are always exposed.

    GrpcDeadlineConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: grpc_deadline — Manages the grpc-timeout metadata header.
        Supports all gRPC timeout units (H, M, S, m, u, n). At least one
        effective rule is required. When both deadline values are configured,
        default_deadline_ms must be less than or equal to max_deadline_ms;
        runtime validation enforces this cross-field relationship.
      anyOf:
        - required: [max_deadline_ms]
        - required: [default_deadline_ms]
        - required: [subtract_gateway_processing]
          properties:
            subtract_gateway_processing:
              const: true
        - required: [reject_no_deadline]
          properties:
            reject_no_deadline:
              const: true
      properties:
        max_deadline_ms:
          type: integer
          format: uint64
          minimum: 1
          description: Cap incoming deadlines to this value (milliseconds)
        default_deadline_ms:
          type: integer
          format: uint64
          minimum: 1
          description: Inject grpc-timeout when client omits it
        subtract_gateway_processing:
          type: boolean
          default: false
          description: >-
            Subtract elapsed gateway processing time before forwarding.
            Returns gRPC DEADLINE_EXCEEDED (status 4) if remaining time is zero.
        reject_no_deadline:
          type: boolean
          default: false
          description: >-
            Reject requests missing a positive grpc-timeout. Takes precedence
            over default_deadline_ms. Native H2/H3 gRPC clients receive HTTP
            200 with a non-OK grpc-status in the trailers-only header block;
            the internal plugin rejection status is not exposed as HTTP 400.

    AiSemanticFirewallBuiltinPackConfig:
      oneOf:
        - type: boolean
          description: Boolean shorthand. true enables the pack with Ferrum defaults; false disables it.
        - type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              default: true
              description: Enable or disable this built-in pack.
            examples_mode:
              type: string
              enum: [append, replace]
              default: append
              description: Append customer examples to Ferrum defaults or replace the semantic example set for this pack.
            examples:
              type: array
              minItems: 1
              items:
                type: string
              description: Customer semantic examples for this built-in pack.
          description: Object form for tuning a built-in AI semantic firewall pack.
      description: Built-in pack toggle or tuning object.

    AiTranscriptAuditConfig:
      type: object
      required: [sink]
      additionalProperties: false
      description: "Plugin: ai_transcript_audit — Controlled AI payload capture for compliance/audit. Captures AI request/response bodies (after redaction), keyed HMAC-SHA256 body hashes (keyed with redaction.hash_secret when set, else a per-process random key), model/provider, token metadata, guardrail decisions, tool names, and cache metadata, then exports them asynchronously to an HTTP collector in batches. Never blocks or rejects the proxy hot path unless an operator opts into a fail-closed policy (sink.on_buffer_full=reject or sink.on_sink_error=reject). Not a security boundary on its own — pair with ai_prompt_shield, ai_semantic_firewall, and ai_response_guard for enforcement. HTTP-only; gRPC capture is future work. Unknown keys are rejected at the root and every fixed nested object (capture, sampling, redaction, custom_patterns items, limits, privacy, sink); sink.custom_headers remains the only intentional free-form string map. Nested objects may be omitted or null to keep defaults."
      properties:
        mode:
          type: string
          enum: [metadata_only, redacted_body, full_body, hash_only]
          default: redacted_body
          description: "metadata_only: keyed body hashes + model/provider/token/guardrail metadata, no body. redacted_body: capped, PII-redacted request/response excerpts — SSE captures whose frames are all parseable OpenAI chat.completion.chunk frames export a reassembled per-choice completion-text excerpt (annotated sse_reassembled) so PII split across streaming deltas cannot evade per-frame redaction; other SSE shapes keep the per-frame-redacted raw frames. full_body: capped unredacted excerpts (requires allow_full_body). hash_only: keyed body hashes + envelope only. Body hashes are keyed HMAC-SHA256 in every mode, never plain SHA-256 (a mostly-predictable payload around one secret would make an unkeyed digest an offline brute-force oracle)."
        allow_full_body:
          type: boolean
          default: false
          description: "Required guardrail for mode=full_body, which captures unredacted payloads. Construction fails if full_body is set without this opt-in."
        capture:
          type: [object, "null"]
          additionalProperties: false
          description: "What to capture. Omit or null to keep defaults."
          properties:
            request:
              type: boolean
              default: true
            response:
              type: boolean
              default: true
            streaming_response:
              default: false
              description: "Capture SSE response excerpts. false | true | 'sampled'. true forces every AI-candidate request's response onto the stream-inspection path. 'sampled' tees only requests that win the sampling.rate roll (or whose request-side guardrail fired when always_capture_on_guardrail is set — the tee decision is evaluated at dispatch time, after the request-phase guardrail plugins ran); error responses and response-side guardrail hits on un-sampled streaming requests still emit records via the log fallback, but without a response body/hash — teeing every stream to cover those late triggers would defeat sampled capture."
              oneOf:
                - type: boolean
                - type: string
                  enum: [sampled]
            headers:
              type: boolean
              default: false
              description: "Capture response headers (redacted by key). Also gated by privacy.include_raw_headers."
            tool_calls:
              type: boolean
              default: true
              description: "Extract tool/function names from the request body."
        sampling:
          type: [object, "null"]
          additionalProperties: false
          description: "Sampling controls. Omit or null to keep defaults."
          properties:
            rate:
              type: number
              minimum: 0.0
              maximum: 1.0
              default: 1.0
              description: "Fraction of eligible AI transactions emitted as full records. Guardrail/error captures override the roll."
            always_capture_on_guardrail:
              type: boolean
              default: true
            always_capture_on_error:
              type: boolean
              default: true
            max_records_per_minute:
              type: integer
              minimum: 0
              default: 0
              description: "Records-per-minute cap (0 = unlimited). Over the cap, records are dropped (never reject traffic)."
        redaction:
          type: [object, "null"]
          additionalProperties: false
          description: "PII redaction policy for captured excerpts. Omit or null to keep defaults. In mode=redacted_body and mode=metadata_only the pattern set must not be empty: builtins=[] with no custom_patterns is rejected at construction (a pass-through redactor would export unredacted data — body excerpts in redacted_body, the request-derived model/tool_names in both — without the full_body opt-in; hash_only exports no request-derived strings and is exempt)."
          properties:
            builtins:
              type: array
              items:
                type: string
                enum: [ssn, credit_card, email, phone_us, api_key, aws_key, ip_address, iban]
              description: "Built-in PII patterns, shared with ai_prompt_shield/ai_response_guard."
            custom_patterns:
              type: array
              items:
                type: object
                required: [name, regex]
                additionalProperties: false
                properties:
                  name:
                    type: string
                  regex:
                    type: string
            placeholder:
              type: string
              default: "[REDACTED:{type}]"
              description: "Non-hashing replacement template; {type} is substituted with the pattern name."
            hash_redacted_values:
              type: boolean
              default: true
              description: "Replace matches with [REDACTED:<type>:<hmac-prefix>] so identical values stay correlatable without storing the raw value. The digest is a keyed HMAC-SHA256 (see hash_secret), never a plain hash — most PII value spaces are small enough to brute-force offline from an unsalted digest."
            hash_secret:
              type: string
              minLength: 16
              description: "Optional key for the redacted-value HMAC and the exported request/response body hashes. When set (min 16 chars), hashed placeholders and body hashes are stable across gateway instances and restarts, so values correlate fleet-wide. When omitted, each process generates a random key at startup: digests still correlate within one process lifetime but never across restarts/instances, and can never be dictionary-attacked from exported records. Treat like any other secret — do not log or export it."
        limits:
          type: [object, "null"]
          additionalProperties: false
          description: "Capture size caps. Omit or null to keep defaults."
          properties:
            max_request_bytes:
              type: integer
              minimum: 1
              default: 65536
            max_response_bytes:
              type: integer
              minimum: 1
              default: 65536
            max_stream_capture_bytes:
              type: integer
              minimum: 1
              default: 65536
        sink:
          type: object
          required: [endpoint_url]
          additionalProperties: false
          description: "Async batched HTTP sink. The endpoint is SSRF-screened against the backend egress policy at construction (literal IPs) and at send time (resolved hostnames). Unknown sink keys are rejected; custom_headers remains an open string map."
          properties:
            type:
              type: string
              enum: [http]
              default: http
            endpoint_url:
              type: string
              format: uri
              description: "http(s) collector URL."
            custom_headers:
              type: object
              additionalProperties:
                type: string
              description: "Extra headers sent on every batch. Values support ${ENV_VAR} expansion resolved lazily at send time, so secrets are not stored in config (e.g. Authorization: 'Bearer ${AUDIT_TOKEN}'). Arbitrary header names are accepted; this is the only intentional free-form map in the plugin config."
            batch_size:
              type: integer
              minimum: 1
              default: 50
            flush_interval_ms:
              type: integer
              minimum: 100
              default: 1000
            buffer_capacity:
              type: integer
              minimum: 1
              default: 10000
            max_retries:
              type: integer
              minimum: 0
              default: 3
            retry_delay_ms:
              type: integer
              minimum: 0
              default: 1000
              description: "Fixed delay between batch send retries for transient collector failures."
            on_buffer_full:
              type: string
              enum: [drop, reject]
              default: drop
              description: "drop: silently drop when the queue is full (never block). reject: fail selected buffered or streaming audit records with 503 before response commit when a queue slot cannot be reserved. Streaming admission honors sampling plus configured error/guardrail overrides."
            on_sink_error:
              type: string
              enum: [warn, reject]
              default: warn
              description: "warn: log and drop on permanent sink failure. reject: fail selected buffered or streaming audit records with 503 before response commit while the sink is unhealthy. Streaming admission honors sampling plus configured error/guardrail overrides. Any non-2xx collector response marks the sink unhealthy — including non-retryable 4xx (401/403/413, e.g. an expired token) whose batch is discarded rather than retried — so records silently lost at the collector stop audited traffic instead of letting it flow unaudited. Rejected transactions still build and enqueue their audit record — the background flush of those records is the recovery probe, and a successful batch send restores sink health automatically."
        privacy:
          type: [object, "null"]
          additionalProperties: false
          description: "Identity/header export controls. Omit or null to keep defaults."
          properties:
            include_consumer_username:
              type: boolean
              default: true
            include_client_ip:
              type: boolean
              default: false
            include_raw_headers:
              type: boolean
              default: false

    AiSemanticFirewallConfig:
      type: object
      additionalProperties: false
      description: "Plugin: ai_semantic_firewall — Semantic LLM guardrails for prompt injection, jailbreaks, system/developer prompt exfiltration, data exfiltration intent, indirect prompt injection, tool abuse, business-topic allow/deny policy, response leakage, dry-run rollout, and audit metadata."
      allOf:
        - if:
            required: [enabled]
            properties:
              enabled:
                const: false
          then: {}
          else:
            required: [provider]
      properties:
        enabled:
          type: boolean
          default: true
        inspect:
          type: object
          additionalProperties: false
          properties:
            request:
              type: boolean
              default: true
            response:
              type: boolean
              default: true
          description: Request and response inspection toggles.
        mode:
          type: string
          enum: [enforce, dry_run]
          default: enforce
          description: Dry-run mode never rejects and emits would_action metadata.
        on_error:
          type: string
          enum: [warn, allow, reject]
          description: "Behavior when embedding/evaluation fails. The default is conditional and is NOT advertised as a static schema default on purpose: when omitted, enforce mode defaults to reject (required semantic evaluation fails closed) while dry_run defaults to warn (provider outages are audited as would_warn, not would_reject). Tooling that materializes OpenAPI defaults must therefore leave this field unset to inherit the mode-appropriate default; sending an explicit reject for a dry_run config would skew rollout/audit telemetry."
        default_action:
          type: string
          enum: [reject, warn]
          default: reject
          description: Default action for built-in semantic rules.
        fail_on_uninspectable_body:
          type: boolean
          default: true
          description: When true, missing, empty, malformed, encoded, oversized, or governed LLM JSON with no extractable content is handled through on_error (rejecting by default in enforce mode). Set false only as an explicit compatibility opt-out on a generic shared JSON proxy that intentionally forwards such bodies uninspected.
        streaming_response:
          type: string
          enum: [skip, reject, buffer, inspect]
          description: "Behavior for stream:true requests when response-side inspection is active. The default is conditional and is NOT advertised as a static schema default on purpose: when omitted, enforce mode with response-side rules active defaults to reject (clients cannot bypass response inspection by streaming) while dry_run or request-only configurations default to skip. Tooling that materializes OpenAPI defaults must leave this field unset to inherit the correct default — sending an explicit reject for a dry_run/request-only config would flip request-body buffering on (requires_request_body_before_before_proxy) and buffer every JSON POST just to read the stream flag, unlike the omitted-field behavior. skip is an explicit fail-open opt-out that allows the streamed response uninspected and records ai_semantic_firewall.response_inspection_skipped when the request body is available; reject fails closed and rejects the request so a client cannot disable response inspection by streaming — clients retry with stream:false to receive an inspectable buffered response; buffer forces the streamed response onto the buffered path, reassembles its SSE deltas into coherent text, and runs the full response engine before anything reaches the client (most accurate, highest time-to-first-byte; an oversized stream fails closed via FERRUM_MAX_RESPONSE_BODY_SIZE_BYTES); inspect inspects the stream progressively in windows (reassemble to a sentence/paragraph or byte-cap boundary, inspect, release if clean) and cuts the stream mid-flight on a violation with a terminal SSE error event — preserves streaming UX (low time-to-first-byte) at the cost of windowed granularity plus a per-window inspection. inspect records ai_semantic_firewall.response_inspection=streaming_windowed. Production enforcement should use reject, buffer, or inspect with on_error=reject."
        streaming:
          type: object
          additionalProperties: false
          description: Windowed-inspection tuning. Only valid when streaming_response is inspect.
          properties:
            window:
              type: string
              enum: [sentence, paragraph, bytes]
              default: sentence
              description: Window boundary detector (window=tokens is not yet supported).
            max_window_bytes:
              type: integer
              format: uint
              minimum: 1
              default: 4096
              description: Hard aggregate cap for the current window's input and retained raw/frame/reassembled state. Coalesced chunks are expanded event-by-event, and an individual event that cannot fit is uninspectable (fails closed under on_error=reject, forwarded under warn/allow).
            overlap_bytes:
              type: integer
              format: uint
              default: 256
              description: Bytes of already-cleared text re-inspected with the next window so a violation phrase split across a boundary is still caught. Prose and tool-call tails split this aggregate budget with a reserved tool-state share. Must be less than max_window_bytes and is included within that aggregate retained-state cap.
            max_inspections:
              type: integer
              format: uint
              minimum: 1
              default: 64
              description: Safety cap on provider inspections per response. Once reached, further inspectable windows honor on_error (reject cuts/fail-closed; warn/allow forward best-effort).
            on_violation:
              type: string
              enum: [cut_with_error_event, cut_silent]
              default: cut_with_error_event
              description: Whether a cut emits an OpenAI-compatible terminal SSE error event or ends the stream silently. Applies to enforcement=block only (detect never cuts).
            enforcement:
              type: string
              enum: [block, detect]
              default: block
              description: block holds each window until it passes inspection, then releases it (or cuts the stream on a violation) — no un-inspected bytes reach the client, at the cost of windowing latency. detect is release-then-detect — bytes stream through immediately and a violation is only logged (to the structured log, never the client or metrics), never cut; use it to observe what would be blocked without affecting traffic.
        provider:
          type: object
          additionalProperties: false
          required: [type, endpoint]
          properties:
            type:
              type: string
              enum: [openai_compatible_embeddings]
              description: OpenAI-compatible embeddings provider.
            endpoint:
              type: string
              format: uri
              description: Embeddings endpoint URL. Literal IP hosts are checked against FERRUM_BACKEND_ALLOW_IPS; hostname resolution is checked by the shared plugin HTTP client at request time.
            model:
              type: string
              description: Embedding model sent in the request body.
            api_key_env:
              type: string
              description: Environment variable holding the provider API key. The variable must exist after Ferrum startup secret resolution and is sent as Authorization Bearer when present.
            request_timeout_ms:
              type: integer
              format: uint64
              minimum: 1
              default: 5000
              description: Per-request embedding provider timeout in milliseconds.
          description: Required when the plugin has active rules.
        builtins:
          type: object
          additionalProperties: false
          properties:
            prompt_injection:
              $ref: '#/components/schemas/AiSemanticFirewallBuiltinPackConfig'
            jailbreak:
              $ref: '#/components/schemas/AiSemanticFirewallBuiltinPackConfig'
            system_prompt_exfiltration:
              $ref: '#/components/schemas/AiSemanticFirewallBuiltinPackConfig'
            data_exfiltration:
              $ref: '#/components/schemas/AiSemanticFirewallBuiltinPackConfig'
            indirect_prompt_injection:
              $ref: '#/components/schemas/AiSemanticFirewallBuiltinPackConfig'
            tool_abuse:
              $ref: '#/components/schemas/AiSemanticFirewallBuiltinPackConfig'
            response_leakage:
              $ref: '#/components/schemas/AiSemanticFirewallBuiltinPackConfig'
          description: Built-in rule packs. When omitted, all built-ins are enabled; when provided, omitted packs are disabled. Object form can append or replace semantic examples per pack while keeping the built-in rule ID and pack metadata.
        extraction:
          type: object
          additionalProperties: false
          properties:
            request_json_paths:
              type: array
              items:
                type: string
                enum:
                  - "$.messages[*].content"
                  - "$.messages[*].tool_calls[*].function.name"
                  - "$.messages[*].tool_calls[*].function.arguments"
                  - "$.prompt"
                  - "$.input"
                  - "$.instructions"
                  - "$.tools[*].function.name"
                  - "$.tools[*].function.description"
                  - "$.tools[*].function.parameters"
                  - "$.context"
                  - "$.documents[*].text"
                  - "$.retrieved_context[*].content"
                  - "$.tool_results[*].content"
              default:
                - "$.messages[*].content"
                - "$.messages[*].tool_calls[*].function.name"
                - "$.messages[*].tool_calls[*].function.arguments"
                - "$.prompt"
                - "$.input"
                - "$.instructions"
                - "$.tools[*].function.name"
                - "$.tools[*].function.description"
                - "$.tools[*].function.parameters"
                - "$.context"
                - "$.documents[*].text"
                - "$.retrieved_context[*].content"
                - "$.tool_results[*].content"
              description: Supported simple request extraction paths. When configured, this list replaces the defaults.
            response_json_paths:
              type: array
              items:
                type: string
                enum:
                  - "$.choices[*].text"
                  - "$.choices[*].message.content"
                  - "$.choices[*].message.tool_calls[*].function.name"
                  - "$.choices[*].message.tool_calls[*].function.arguments"
                  - "$.choices[*].delta.content"
                  - "$.choices[*].delta.tool_calls[*].function.name"
                  - "$.choices[*].delta.tool_calls[*].function.arguments"
                  - "$.output_text"
                  - "$.output[*].content[*].text"
                  - "$.output[*].arguments"
              default:
                - "$.choices[*].text"
                - "$.choices[*].message.content"
                - "$.choices[*].message.tool_calls[*].function.name"
                - "$.choices[*].message.tool_calls[*].function.arguments"
                - "$.choices[*].delta.content"
                - "$.choices[*].delta.tool_calls[*].function.name"
                - "$.choices[*].delta.tool_calls[*].function.arguments"
                - "$.output_text"
                - "$.output[*].content[*].text"
                - "$.output[*].arguments"
              description: Supported simple response extraction paths. When configured, this list replaces the defaults.
        allow_topics:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, examples]
            properties:
              id:
                type: string
              description:
                type: string
              examples:
                type: array
                minItems: 1
                items:
                  type: string
              threshold:
                type: number
                format: float
                minimum: 0
                maximum: 1
                default: 0.74
              action_on_no_match:
                type: string
                enum: [reject, warn]
                default: reject
          description: Mandatory request-side semantic allow topics.
        deny_topics:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, examples]
            properties:
              id:
                type: string
              description:
                type: string
              examples:
                type: array
                minItems: 1
                items:
                  type: string
              threshold:
                type: number
                format: float
                minimum: 0
                maximum: 1
                default: 0.78
              action:
                type: string
                enum: [reject, warn]
                default: reject
          description: Customer-defined request/response semantic deny topics.
        custom_rules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, examples]
            properties:
              id:
                type: string
              description:
                type: string
              direction:
                type: string
                enum: [request, response, both]
                default: both
              severity:
                type: string
                enum: [low, medium, high, critical]
                default: high
              action:
                type: string
                enum: [warn, reject]
                default: reject
                description: Custom rules can warn or reject. Use allow_topics for allowlist semantics.
              examples:
                type: array
                minItems: 1
                items:
                  type: string
              threshold:
                type: number
                format: float
                minimum: 0
                maximum: 1
                default: 0.80
          description: Customer-defined semantic rules.
        privacy:
          type: object
          additionalProperties: false
          properties:
            log_raw_text:
              type: boolean
              enum: [false]
              default: false
              description: Reserved for future explicit raw-text logging. true is rejected in this release.
            include_snippet_hash:
              type: boolean
              default: true
            snippet_hash_salt:
              type: string
              description: Optional salt mixed into snippet_hash digests so short/low-entropy matched segments written to logs cannot be reversed by brute force/rainbow tables. Keep consistent across a fleet for correlation and out of the same logs. Unsalted (default) is reversible for short segments.
          description: Raw prompt/response text is not written by default; hashes are for correlation only.
        expose_rule_id_to_client:
          type: boolean
          default: false
          description: Include matched rule IDs in reject responses.

    AiSemanticCacheConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: ai_semantic_cache — Caches LLM responses keyed by normalized
        prompts. Exact-match normalization is enabled by default; optional
        semantic similarity uses a configured embedding provider and a local
        HNSW vector index. Supports local DashMap and Redis exact-response
        storage. Unknown root, semantic-policy, and Redis sync keys are
        rejected at admission with path-qualified diagnostics (registration
        policy KeepLastKnownGood). There are no intentionally open maps.
      properties:
        ttl_seconds:
          type: integer
          format: uint64
          default: 300
          description: Time-to-live for cached entries in seconds
        max_entries:
          type: integer
          format: uint64
          default: 10000
          description: Maximum number of cached entries (local mode). In semantic mode, HNSW snapshot memory also scales with this count outside max_total_size_bytes.
        max_entry_size_bytes:
          type: integer
          format: uint64
          default: 1048576
          description: Maximum size of a single cached response body in bytes (1 MiB)
        max_total_size_bytes:
          type: integer
          format: uint64
          default: 104857600
          description: Maximum total response-entry cache size in bytes (100 MiB, local mode). Includes response bodies, cached headers, semantic scope keys, and retained embedding vectors; excludes the separate HNSW snapshot copy and transient rebuild buffers.
        include_model_in_key:
          type: boolean
          default: true
          description: Include the model name in the cache key (different models get separate cache entries)
        include_params_in_key:
          type: boolean
          default: true
          description: Include request parameters (temperature, top_p, max_tokens) in the cache key. Default `true` — different sampling params produce different responses and must not collide. Set `false` only when cross-parameter cache reuse is intentional.
        scope_by_consumer:
          type: boolean
          default: true
          description: Scope cache entries per consumer (authenticated consumer ID is included in the cache key). Default `true` — different consumers must not see each other's cached responses. Set `false` only on a public LLM proxy with no per-tenant data.
        cache_multimodal:
          type: string
          enum: [reject, exact_only, exact-only, include_fingerprints, include-fingerprints]
          default: exact_only
          description: Multimodal request caching mode for non-text content parts. `reject` bypasses cache lookup/store, `exact_only` uses hashed fingerprints for exact matches and disables semantic hits, and `include_fingerprints` also includes those fingerprints in semantic scope keys. The runtime parser trims surrounding whitespace and is case-insensitive (e.g. `"Reject"`, `" exact_only "` are accepted), and `_`/`-` aliases are interchangeable; admin-API config validation runs through this lenient parser, not the schema `enum`. The `enum` lists only canonical/alias forms because JSON Schema cannot express case-insensitivity — strict schema validators may reject mixed-case or padded inputs the gateway itself accepts.
        semantic_similarity_enabled:
          type: boolean
          default: false
          description: Enable embedding-based semantic lookup after exact Redis/local misses. Exact matching remains active when this is disabled or enabled.
        semantic_embedding_provider:
          type: string
          enum: [openai, openai_compatible, openai-compatible, azure, azure_openai, azure-openai, mistral, voyage, voyageai, voyage_ai, anthropic, claude, cohere, google, google_gemini, google-gemini, gemini, google_vertex, google-vertex, vertex, vertex_ai, vertex-ai, bedrock_titan, bedrock-titan, amazon_titan, amazon-titan, bedrock_cohere, bedrock-cohere, cohere_bedrock, cohere-bedrock]
          default: openai
          description: Embedding provider request/response format. Compatibility aliases mirror the plugin parser; anthropic and claude are aliases for Voyage-compatible embeddings because Claude does not expose a native embedding model.
        semantic_embedding_endpoint:
          type: string
          format: uri
          description: Embedding endpoint URL. Required when semantic_similarity_enabled is true. OpenAI-compatible endpoints use input/model JSON; other providers send native embedding JSON.
        semantic_embedding_model:
          type: string
          description: Model name sent in the embedding request body. Omit for local endpoints that do not require a model field.
        semantic_embedding_input_type:
          type: string
          description: Provider-specific input or task type, such as query/document for Voyage, search_query/search_document for Cohere, SEMANTIC_SIMILARITY for Gemini, or Vertex task_type.
        semantic_embedding_output_dimension:
          type: integer
          format: uint64
          description: Provider-specific reduced embedding dimension when supported.
        semantic_embedding_api_key:
          type: string
          format: password
          description: API key for the embedding endpoint. Sent in semantic_embedding_auth_header with semantic_embedding_auth_scheme when configured.
        semantic_embedding_auth_header:
          type: string
          description: HTTP header used for semantic_embedding_api_key. Defaults to Authorization, except Azure OpenAI uses api-key and Google Gemini uses x-goog-api-key.
        semantic_embedding_auth_scheme:
          type: string
          description: Prefix for the API key header value. Defaults to Bearer, except Azure OpenAI and Google Gemini send the raw key. Set to an empty string to send the raw key.
        semantic_similarity_threshold:
          type: number
          format: float
          exclusiveMinimum: 0
          maximum: 1
          default: 0.95
          description: Minimum cosine similarity for a semantic cache hit.
        semantic_vector_max_candidates:
          type: integer
          format: uint64
          default: 16
          description: Number of nearest HNSW candidates to inspect during semantic lookup.
        semantic_embedding_timeout_ms:
          type: integer
          format: uint64
          default: 5000
          description: Per-request timeout for embedding calls in milliseconds. Embedding failures fall back to a normal exact-cache miss.
        sync_mode:
          type: string
          enum: [local, redis]
          default: local
          description: "Storage backend: 'local' (in-memory DashMap) or 'redis' (centralized Redis)"
        redis_url:
          type: string
          description: Redis connection URL (required when sync_mode is redis)
        redis_tls:
          type: boolean
          default: false
          description: Enable TLS for Redis connection
        redis_key_prefix:
          type: string
          default: "ferrum:ai_semantic_cache"
          description: Redis key namespace prefix
        redis_pool_size:
          type: integer
          format: uint64
          default: 4
          description: Number of multiplexed Redis connections
        redis_connect_timeout_seconds:
          type: integer
          format: uint64
          default: 5
          description: Redis connection timeout in seconds
        redis_health_check_interval_seconds:
          type: integer
          format: uint64
          default: 5
          description: Interval for background health check pings when Redis is unavailable
        redis_username:
          type: string
          description: Redis ACL username (Redis 6+)
        redis_password:
          type: string
          description: Redis password

    AiTokenMetricsConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: ai_token_metrics — Extracts token usage from HTTP JSON/SSE LLM
        response bodies. Native gRPC protobuf messages are unsupported and the
        plugin is not registered for the Grpc protocol view. Unknown keys are
        rejected.
      properties:
        provider:
          type: string
          default: auto
          enum: [auto, openai, anthropic, google, cohere, mistral, bedrock]
          description: "Exact lowercase LLM provider format; surrounding whitespace and alternate casing are rejected"
        include_model:
          type: boolean
          default: true
          description: Extract model name into metadata
        include_token_details:
          type: boolean
          default: true
          description: Extract prompt/completion tokens separately
        metadata_prefix:
          type: string
          default: ai
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_.-]+$'
          description: Prefix for metadata keys
        buffer_streaming_responses:
          type: boolean
          default: false
          description: Buffer text/event-stream responses so final SSE usage events can be parsed; disables streaming delivery for those responses
        cost_per_prompt_token:
          type: number
          format: double
          minimum: 0
          maximum: 18446744073709.55
          description: Calculate estimated cost per request from prompt tokens; maximum 18446744073709.55
        cost_per_completion_token:
          type: number
          format: double
          minimum: 0
          maximum: 18446744073709.55
          description: Calculate estimated cost per request from completion tokens; maximum 18446744073709.55

    AiRequestGuardConfig:
      type: object
      additionalProperties: false
      description: "Plugin: ai_request_guard — Validates and constrains AI/LLM API requests."
      anyOf:
        - required: [max_tokens_limit]
        - required: [default_max_tokens]
        - required: [allowed_models]
          properties:
            allowed_models:
              minItems: 1
        - required: [blocked_models]
          properties:
            blocked_models:
              minItems: 1
        - required: [require_user_field]
          properties:
            require_user_field:
              const: true
        - required: [max_messages]
        - required: [max_prompt_characters]
        - required: [temperature_range]
        - required: [block_system_prompts]
          properties:
            block_system_prompts:
              const: true
        - required: [strict_schema]
          properties:
            strict_schema:
              const: true
        - required: [required_metadata_fields]
          properties:
            required_metadata_fields:
              minItems: 1
      properties:
        max_tokens_limit:
          type: integer
          description: Maximum allowed output-token request value across OpenAI and provider-native token fields
        enforce_max_tokens:
          type: string
          enum: [reject, clamp]
          default: reject
          description: Reject (400 error) or clamp (silently cap) max_tokens
        default_max_tokens:
          type: integer
          description: Inject a default output-token limit if no supported token field is present; top-level-shaped bodies keep a family-correct top-level fallback (max_output_tokens for Responses, else max_tokens) so a spoofed provider marker or stray cross-provider alias cannot uncap them, while unambiguously provider-native bodies receive only their native cap (including TGI parameters.max_new_tokens)
        supported_schema:
          type: string
          enum: [chat_completions, responses, provider_native, auto]
          default: auto
          description: Request schema family accepted when strict_schema is true
        strict_schema:
          type: boolean
          default: false
          description: Reject JSON request bodies that do not match supported_schema coverage
        allowed_models:
          type: array
          items:
            type: string
          default: []
          description: Whitelist of allowed model names (empty = allow all)
        blocked_models:
          type: array
          items:
            type: string
          default: []
          description: Blacklist of model names (takes precedence over allowed)
        require_model_for_model_policy:
          type: boolean
          default: true
          description: Require a non-empty string model field when allowed_models or blocked_models is configured. Setting false only relaxes a genuinely-absent model; a present-but-invalid model (non-string or empty/whitespace) is still rejected with HTTP 400
        require_user_field:
          type: boolean
          default: false
          description: Require user field in request body
        max_messages:
          type: integer
          description: Maximum message entries across messages, Responses input, Gemini contents, and Cohere chat_history arrays
        max_prompt_characters:
          type: integer
          description: Maximum total prompt characters across prompt/input/system fields, message text, text multimodal parts, tools, tool arguments, document/RAG fields (including Anthropic text document source.data), and Azure "On Your Data" data_sources[]/dataSources[].parameters.role_information/roleInformation
        temperature_range:
          type: array
          items:
            type: number
            format: double
          minItems: 2
          maxItems: 2
          description: "Allowed [min, max] range for top-level temperature plus Gemini generationConfig.temperature and Bedrock inferenceConfig.temperature; conflicting aliases are rejected"
        block_system_prompts:
          type: boolean
          default: false
          description: Reject system/developer prompt fields and roles, including Responses instructions, provider-native top-level system fields, and Azure "On Your Data" data_sources[]/dataSources[].parameters.role_information/roleInformation (a de-facto system instruction the backend applies)
        system_prompt_aliases:
          type: array
          items:
            type: string
          default: []
          description: Additional message roles or top-level fields treated as system prompts when block_system_prompts is true
        required_metadata_fields:
          type: array
          items:
            type: string
          default: []
          description: Required fields in request body
        fail_on_uninspectable_body:
          type: boolean
          default: true
          description: Reject JSON POST requests whose body cannot be inspected because the buffered body is missing, empty, non-UTF-8, malformed JSON, or still compressed after request transforms (no compression/decompress_request decoded it). Set false only for compatibility when the backend must handle such uninspectable bodies itself.

    AiRateLimiterConfig:
      type: object
      description: "Plugin: ai_rate_limiter — Token-aware rate limiting for LLM APIs. Supports centralized Redis-backed mode for cross-instance token budget coordination. Counter storage supports only local memory and Redis; database-backed counters are intentionally unsupported."
      required: [token_limit]
      properties:
        token_limit:
          type: integer
          minimum: 1
          default: 100000
          description: Maximum tokens allowed per window
        window_seconds:
          type: integer
          minimum: 1
          default: 60
          description: Sliding window duration in seconds
        count_mode:
          type: string
          enum: [total_tokens, prompt_tokens, completion_tokens]
          default: total_tokens
          description: What to count
        limit_by:
          type: string
          enum: [consumer, ip]
          default: consumer
          description: Rate limit key
        expose_headers:
          type: boolean
          default: false
          description: Inject x-ai-ratelimit-* headers
        provider:
          type: string
          default: auto
          description: LLM provider format for token extraction
        on_unmetered_response:
          type: string
          enum: [reject, charge_estimate, warn]
          default: charge_estimate
          description: Action for successful responses without usage metadata. charge_estimate keeps the pre-request reservation, reject returns a 502 and keeps the reservation, warn logs and releases the reservation.
        sync_mode:
          type: string
          enum: [local, redis]
          default: local
          description: "Token budget storage: 'local' (in-memory) or 'redis' (centralized). Database-backed counters are unsupported. Any RESP-compatible server works."
        redis_url:
          type: string
          description: "Redis connection URL. Required when sync_mode is 'redis'."
        redis_tls:
          type: boolean
          default: false
          description: "Enable TLS for the Redis connection. CA verification uses gateway-level FERRUM_TLS_CA_BUNDLE_PATH; skip-verify uses FERRUM_TLS_NO_VERIFY."
        redis_key_prefix:
          type: string
          default: "ferrum:ai_rate_limiter"
          description: Key prefix for all Redis keys
        redis_pool_size:
          type: integer
          default: 4
          description: Number of multiplexed Redis connections
        redis_username:
          type: string
          description: Redis username for ACL authentication
        redis_password:
          type: string
          description: Redis password
        redis_connect_timeout_seconds:
          type: integer
          default: 5
          description: Redis connection timeout in seconds
        redis_health_check_interval_seconds:
          type: integer
          default: 5
          description: Health check ping interval when Redis is unavailable

    AiPromptShieldConfig:
      type: object
      additionalProperties: false
      description: "Plugin: ai_prompt_shield — PII detection and redaction in bare JSON AI prompts. Native protobuf/framed gRPC and gRPC-Web bodies are outside the JSON inspection scope."
      anyOf:
        - not:
            required: [patterns]
        - required: [patterns]
          properties:
            patterns:
              minItems: 1
        - required: [custom_patterns]
          properties:
            custom_patterns:
              minItems: 1
      properties:
        action:
          type: string
          enum: [reject, redact, warn]
          default: reject
          description: Action when PII is detected
        patterns:
          type: array
          items:
            type: string
            enum: [ssn, credit_card, email, phone_us, api_key, aws_key, ip_address, iban]
          default: [ssn, credit_card, api_key, aws_key]
          description: "Built-in patterns: ssn, credit_card, email, phone_us, api_key, aws_key, ip_address, iban"
        custom_patterns:
          type: array
          items:
            type: object
            required: [name, regex]
            properties:
              name:
                type: string
              regex:
                type: string
          default: []
          description: "Custom {name, regex} patterns"
        scan_fields:
          type: string
          enum: [content, all]
          default: content
          description: "Which parts of the request to scan. 'content' scans LLM prompt fields only: chat messages[].content plus top-level prompt, input, instructions, and system (completions/responses/embeddings/Anthropic-system shapes), including matches split across adjacent text parts. 'all' scans the entire request body recursively while exempting only top-level structural scalar values such as model/id/role and numeric tuning parameters; nested occurrences remain scannable. Use 'all' for request shapes that carry prompt text in non-standard fields."
        exclude_roles:
          type: array
          items:
            type: string
          default: []
          description: Message roles to skip scanning
        redaction_placeholder:
          type: string
          default: "[REDACTED:{type}]"
          description: Template for redacted text
        max_scan_bytes:
          type: integer
          minimum: 1
          default: 1048576
          description: Maximum body size to scan; enforcing actions reject larger bodies instead of bypassing inspection

    AiPromptCompressorConfig:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [request_family]
            properties:
              request_family:
                const: text_completions
          then:
            properties:
              compress_roles:
                contains:
                  type: string
                  pattern: '^\s*[Uu][Ss][Ee][Rr]\s*$'
      description: "Plugin: ai_prompt_compressor — Shortens LLM prompt text to reduce token usage, cost, and latency using a bounded model-free statistical (extractive) filter. Rewrites messages[].content (per role) and the legacy top-level prompt only for admitted OpenAI Chat Completions or Text Completions representations. Code blocks, inline code, URLs, Unicode numbers, common identifiers, and negations are preserved verbatim. Configured preserve markers use a bounded representation-preserving fallback whenever statistical compression is skipped. Successful compression rewrites reserialize the complete JSON body. No model files, network calls, or external services are used."
      properties:
        compress_roles:
          type: array
          items:
            type: string
            pattern: '\S'
          default: [user]
          minItems: 1
          description: "Message roles whose content is compressed (case-insensitive). Defaults to user only so system instructions are preserved; add 'system'/'assistant'/'tool' to compress those too. When 'user' is included, the legacy top-level `prompt` field is also compressed."
        target_ratio:
          type: number
          format: float
          default: 0.5
          exclusiveMinimum: 0
          exclusiveMaximum: 1
          description: "Fraction of word-tokens to keep. 0.5 targets ~50% reduction; 0.3 is more aggressive. Must be between 0 and 1 (exclusive)."
        min_content_tokens:
          type: integer
          minimum: 0
          maximum: 131072
          default: 200
          description: "Estimated-token floor per content string. Content below this is passed through unchanged so short prompts are not mangled. Token counts are estimated (~4 characters per token); no model tokenizer is embedded."
        max_scan_bytes:
          type: integer
          minimum: 1
          maximum: 1048576
          default: 1048576
          description: "Skip statistical compression when the request body exceeds this size. Configured preserve-marker sanitation remains active up to the immutable 1048576-byte hard body/output maximum and fails closed above it. Eligible prompt text is additionally capped at 524288 bytes, 32768 combined whitespace/tokenizer/marker work units, 256 rewritable fields, and 1024 preserve markers per body. A transformed body is staged beside request metadata for wire-path reuse only when it is at most 65536 bytes."
        preserve_tag:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]+$'
          description: "Optional marker name. Text wrapped in <TAG>...</TAG> in JSON string values is copied through verbatim (the markers themselves are stripped), letting operators protect must-keep spans. Preserve-marker sanitation applies only to string values: object member-name bytes are preserved and names are never sanitized, including marker-shaped or escaped content. Nested spans are flattened while preserving their text; unmatched and JSON-escaped markers in values are stripped deterministically from every admitted request family even when statistical compression is skipped. Name may contain at most 64 ASCII letters, digits, '-', and '_'."
        request_family:
          type: string
          enum: [auto, chat_completions, text_completions]
          default: auto
          description: "Request-family gate. 'auto' requires a body shape matching the standard endpoint path suffix (/chat/completions or /completions). A fixed family is an explicit opt-in for compatible custom endpoint paths and still rejects malformed, provider-native, or ambiguous body shapes."

    AiResponseGuardConfig:
      type: object
      additionalProperties: false
      description: "Plugin: ai_response_guard — HTTP-only validation and filtering for AI/LLM API responses. Enforcing actions fail closed when a governed buffered response is oversized or uninspectable. Native gRPC protobuf messages are not supported."
      anyOf:
        - required: [pii_patterns]
          properties:
            pii_patterns:
              minItems: 1
        - required: [custom_pii_patterns]
          properties:
            custom_pii_patterns:
              minItems: 1
        - required: [blocked_phrases]
          properties:
            blocked_phrases:
              minItems: 1
        - required: [blocked_patterns]
          properties:
            blocked_patterns:
              minItems: 1
        - required: [require_json]
          properties:
            require_json:
              const: true
        - required: [required_fields]
          properties:
            required_fields:
              minItems: 1
        - required: [max_completion_length]
          properties:
            max_completion_length:
              minimum: 1
      properties:
        action:
          type: string
          enum: [reject, redact, warn]
          default: reject
          description: "Action when a violation is detected in the response body. Buffered SSE is parsed and redacted by complete event; content spanning events that cannot be safely rewritten is rejected. Live SSE requests are never re-buffered by this plugin."
        pii_patterns:
          type: array
          items:
            type: string
            enum: [ssn, credit_card, email, phone_us, api_key, aws_key, ip_address, iban]
          default: []
          description: "Built-in PII pattern names to scan for (e.g., ssn, credit_card, email, phone_us, api_key, aws_key, ip_address, iban)"
        custom_pii_patterns:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, regex]
            properties:
              name:
                type: string
                minLength: 1
                description: Pattern identifier used in redaction placeholders and violation reports
              regex:
                type: string
                minLength: 1
                description: Regular expression pattern to match
          default: []
          description: "Custom PII {name, regex} patterns for domain-specific detection"
        blocked_phrases:
          type: array
          items:
            type: string
            minLength: 1
          default: []
          description: Exact phrases to block in response content (case-insensitive). Literal values are never exposed in placeholders, metadata, logs, or reject bodies; bounded positional rule IDs are used instead.
        blocked_patterns:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, regex]
            properties:
              name:
                type: string
                minLength: 1
                description: Pattern identifier for violation reports
              regex:
                type: string
                minLength: 1
                description: Regular expression pattern to match
          default: []
          description: "Custom {name, regex} patterns for blocking arbitrary content in responses"
        scan_fields:
          type: string
          enum: [content, all]
          default: content
          description: "Which response fields to scan: 'content' scans supported completion and tool/function-call fields, 'all' scans the entire response body"
        redaction_placeholder:
          type: string
          default: "[REDACTED:{type}]"
          description: "Template for redacted text. {type} is replaced with the pattern name"
        max_scan_bytes:
          type: integer
          minimum: 1
          default: 1048576
          description: Maximum governed buffered response size. Reject/redact and structural rules fail closed above this limit; warn-only content rules record a bounded warning and pass through.
        require_json:
          type: boolean
          default: false
          description: Reject responses that are not valid JSON
        required_fields:
          type: array
          items:
            type: string
            minLength: 1
          default: []
          description: JSON field names that must be present in the response body
        max_completion_length:
          type: integer
          minimum: 0
          default: 0
          description: "Maximum allowed length of completion content, measured in characters (Unicode scalar values, not UTF-8 bytes). 0 = no limit"

    AiToolGovernorConfig:
      type: object
      description: "Plugin: ai_tool_governor — Deterministic allow/deny/approval policy for AI tool/function calls. Inspects request tool definitions (tools[].function.name / functions[].name), buffered response tool calls (choices[].message.tool_calls[] and legacy function_call), streaming SSE tool-call deltas (held until complete and cleared by policy/approval, then released — or the stream is cut with an SSE error event, never leaking the held call), and optionally MCP tools/call and A2A JSON-RPC methods. Complements ai_semantic_firewall (which catches intent): every decision here is a deterministic function of names, arguments, JSON Schema, regexes, identity, and an optional approval webhook. In enforce mode, governed bodies the plugin cannot inspect fail closed: Content-Encoding'd, oversized (>4 MiB), non-UTF-8, or unparseable JSON request bodies are rejected when request inspection is enabled, oversized JSON responses are rejected, and streaming holds past the 4 MiB cap cut the stream. Configuration is strict: unknown root, inspect, tool-policy, blocked-pattern, approval, response, and observability properties are rejected (with path-qualified diagnostics). The free-form `tools` name map and arbitrary per-tool `json_schema` document remain open. Does not execute tools or replace mcp_gateway/A2A routing. HTTP-family only."
      properties:
        enabled:
          type: boolean
          default: true
          description: "When false the plugin is inert (no buffering, no inspection), and policy field *values* are ignored — but unknown property names are still rejected at every fixed-shape layer."
      allOf:
        - if:
            required: [enabled]
            properties:
              enabled:
                const: false
          then:
            # Disabled drafts may carry ignored policy fields of any value, but
            # only the known property names — typos still fail closed.
            type: object
            additionalProperties: false
            properties:
              enabled:
                const: false
              mode: true
              default_action: true
              inspect: true
              tools: true
              approval: true
              response: true
              observability: true
          else:
            $ref: "#/components/schemas/AiToolGovernorEnabledConfig"

    AiToolGovernorEnabledConfig:
      type: object
      additionalProperties: false
      allOf:
        # Runtime defaults response_tool_calls to true. The only no-surface
        # shape is therefore an explicit response_tool_calls=false with
        # every other surface false or omitted.
        - not:
            required: [inspect]
            properties:
              inspect:
                required: [response_tool_calls]
                properties:
                  request_tool_definitions:
                    const: false
                  response_tool_calls:
                    const: false
                  streaming_response_tool_calls:
                    const: false
                  mcp_tool_calls:
                    const: false
                  a2a_methods:
                    const: false
        - if:
            required: [default_action]
            properties:
              default_action:
                const: allow
          then:
            required: [tools]
            properties:
              tools:
                minProperties: 1
        # In enforce mode, require a webhook only when an approval policy can
        # reach a concrete-call surface. Name-only definition inspection blocks
        # require_approval locally and needs no webhook.
        - if:
            allOf:
              - not:
                  required: [mode]
                  properties:
                    mode:
                      const: dry_run
              - anyOf:
                  - not:
                      required: [inspect]
                  - required: [inspect]
                    properties:
                      inspect:
                        anyOf:
                          - not:
                              required: [response_tool_calls]
                          - required: [response_tool_calls]
                            properties:
                              response_tool_calls:
                                const: true
                          - required: [streaming_response_tool_calls]
                            properties:
                              streaming_response_tool_calls:
                                const: true
                          - required: [mcp_tool_calls]
                            properties:
                              mcp_tool_calls:
                                const: true
                          - required: [a2a_methods]
                            properties:
                              a2a_methods:
                                const: true
              - anyOf:
                  - required: [default_action]
                    properties:
                      default_action:
                        const: require_approval
                  - not:
                      properties:
                        tools:
                          additionalProperties:
                            not:
                              required: [action]
                              properties:
                                action:
                                  const: require_approval
          then:
            required: [approval]
      properties:
        enabled:
          type: boolean
          default: true
          description: "When false the plugin is inert (no buffering, no inspection)."
        mode:
          type: string
          enum: [enforce, dry_run]
          default: enforce
          description: "enforce rejects/cuts blocked tool calls; dry_run evaluates and emits metadata but never rejects and never calls the approval webhook (safe rollout)."
        default_action:
          type: string
          enum: [allow, deny, require_approval]
          default: deny
          description: "Action for a tool with no explicit policy entry. tools may be empty only when default_action governs (deny/require_approval)."
        inspect:
          type: object
          additionalProperties: false
          description: "Independently toggled inspection surfaces. At least one must be enabled. Unknown surface switches are rejected."
          properties:
            request_tool_definitions:
              type: boolean
              default: false
              description: "Reject/dry-run requests that expose disallowed tool definitions to the model."
            response_tool_calls:
              type: boolean
              default: true
              description: "Govern tool calls in buffered (non-streaming) responses. At most 64 concrete tool calls are governed per request/response/SSE batch (unconditional; applies to allow/deny/redact_args/require_approval/dry_run)."
            streaming_response_tool_calls:
              type: boolean
              default: false
              description: "Govern OpenAI SSE tool-call deltas. Held tool-call frames are released only after policy/approval clears the call; a block cuts the stream with a terminal SSE error event. Duplicate choice/tool indexes, empty-string or non-string IDs, conflicting IDs, or an ID introduced after an untagged fragment are ungovernable and fail closed in enforce mode. JSON null for tool_calls[].id is treated as omitted (same as a missing field). At most 64 concrete tool calls are governed per SSE batch. In streaming, a redact_args match fails closed (denies) since mid-stream surgical redaction of split-JSON arguments is out of scope."
            mcp_tool_calls:
              type: boolean
              default: false
              description: "Inspect MCP JSON-RPC tools/call request bodies directly (params.name + params.arguments), including calls inside JSON-RPC batch arrays. When params.arguments is omitted, the governor normalizes it to {} before required-arg / regex / hash / approval / JSON Schema evaluation (MCP zero-argument calls). Provider response shapes that omit function.arguments are not normalized."
            a2a_methods:
              type: boolean
              default: false
              description: "Govern A2A JSON-RPC method names against the tools policy map (params carried as arguments)."
        tools:
          type: object
          propertyNames:
            minLength: 1
          description: "Per-tool policy, keyed by a non-empty exact tool name (may be namespaced, e.g. github.create_pr, or an MCP/A2A method name). The tool-name map is intentionally free-form; each policy object is closed."
          additionalProperties:
            type: object
            additionalProperties: false
            required: [action]
            allOf:
              - if:
                  properties:
                    action:
                      const: redact_args
                  required: [action]
                then:
                  required: [blocked_arg_patterns]
                  properties:
                    blocked_arg_patterns:
                      minItems: 1
            properties:
              action:
                type: string
                enum: [allow, deny, redact_args, require_approval, dry_run]
                description: "allow forwards; deny blocks; redact_args replaces blocked_arg_patterns matches with redaction_placeholder (buffered path); require_approval calls the approval webhook; dry_run forwards and records ai_tool_governor.decision=dry_run distinctly from a real allow. At most 64 concrete tool calls are governed per request/response/SSE batch regardless of action."
              risk:
                type: string
                enum: [low, medium, high, critical]
                default: low
                description: "Risk band surfaced as ai_tool_governor.risk (max across a batch) and in approval requests."
              max_arg_bytes:
                type: integer
                minimum: 0
                description: "Deny when the raw arguments string exceeds this many bytes."
              required_args:
                type: array
                items:
                  type: string
                  minLength: 1
                description: "Deny when any listed key is absent from the parsed arguments object."
              blocked_arg_patterns:
                type: array
                maxItems: 32
                items:
                  type: object
                  additionalProperties: false
                  required: [name, regex]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 256
                      description: "Pattern identifier; substituted into redaction_placeholder {name}. OpenAPI maxLength: 256 counts Unicode characters; runtime admission enforces a stricter 256 UTF-8 byte cap."
                    regex:
                      type: string
                      minLength: 1
                      description: "Regex matched against the raw arguments string. Under a non-redact action a match denies; under redact_args a match is redacted. Patterns that match empty input are rejected at config load; contextual zero-length matches fail closed at runtime."
                description: "Named regexes screening tool arguments. At least one entry is required when action=redact_args. At most 32 patterns per tool; every append is checked before allocation and redacted output is capped at the 4 MiB inspectable body limit."
              json_schema:
                type: object
                description: "JSON Schema (validated with the jsonschema crate) the parsed arguments must satisfy, else deny. Intentionally open — arbitrary JSON Schema keywords are allowed; do not set additionalProperties: false here."
        approval:
          type: object
          additionalProperties: false
          description: "Approval webhook, required when any policy can reach require_approval."
          required: [endpoint_url]
          properties:
            endpoint_url:
              type: string
              minLength: 1
              format: uri
              pattern: '^https?://(?:[^/?#]*@)?(?:\[[^\]]+\]|[^/?#:@]+)(?::[0-9]+)?(?:[/?#]|$)'
              description: "http/https URL POSTed with request_id, consumer, proxy, model, provider, tool_name, arguments_hash, risk (and raw arguments only when include_arguments=true). Response: {\"decision\":\"allow|deny\"} or {\"allow\":true|false}, optional approval_id. Response bodies are capped at 64 KiB."
            timeout_ms:
              type: integer
              minimum: 1
              maximum: 30000
              default: 1500
              description: "Per-request approval webhook timeout (max 30000). A whole batch of approvals is also capped at 30s cumulative wait; after an enforce-mode block, further webhook calls in that batch are skipped. At most 64 concrete tool calls are governed per request/response/SSE batch. Dropping the governing future (client cancel) cancels any in-flight approval HTTP call."
            cache_ttl_seconds:
              type: integer
              minimum: 0
              maximum: 2592000
              default: 300
              description: "TTL for caching an approval decision keyed by consumer+proxy+model+provider+tool+arguments. 0 disables caching. The cache is bounded (4096 entries); at capacity expired entries are purged and new decisions are not cached rather than growing memory."
            fail_on_error:
              type: string
              enum: [reject, warn, allow]
              default: reject
              description: "Behavior when the approval endpoint cannot be evaluated: reject fails closed, warn/allow fail open."
            include_arguments:
              type: boolean
              default: false
              description: "Include the raw tool arguments in the approval request body. Off by default so secrets are not sent."
        response:
          type: object
          additionalProperties: false
          properties:
            deny_status_code:
              type: integer
              minimum: 400
              maximum: 599
              default: 403
              description: "HTTP error status (400-599) returned for a deterministic tool policy denial in enforce mode. Uninspectable governed bodies fail closed with 502."
            redaction_placeholder:
              type: string
              maxLength: 256
              default: "[REDACTED_TOOL_ARG:{name}]"
              description: "Template for redacted argument matches; {name} is replaced with the matched pattern name. OpenAPI maxLength: 256 counts Unicode characters; runtime admission enforces a stricter 256 UTF-8 byte cap. Redacted argument output is capped at the 4 MiB inspectable body limit."
            streaming_deny_event:
              type: boolean
              default: true
              description: "Emit a terminal SSE error event when cutting a streamed tool call."
        observability:
          type: object
          additionalProperties: false
          properties:
            emit_metadata:
              type: boolean
              default: true
              description: "Emit ai_tool_governor.* transaction metadata (enabled, mode, decision, tool_names, risk, policy_ids, approval_id, arguments_hashes, redacted_tools)."
            hash_arguments:
              type: boolean
              default: true
              description: "Emit SHA-256 hashes of tool arguments as ai_tool_governor.arguments_hashes. Raw arguments are never placed in metadata."
            max_argument_log_bytes:
              type: integer
              minimum: 0
              default: 0
              description: "When > 0, log up to this many bytes of a blocked call's raw arguments at debug for audit. 0 keeps raw arguments out of logs entirely."

    AiFederationConfig:
      type: object
      additionalProperties: false
      description: "Plugin: ai_federation — HTTP-family OpenAI Chat Completions gateway. Translates final request bodies to provider-native JSON with a 64 MiB serialization cap and normalizes bounded, non-streaming responses back to OpenAI format. Native gRPC is not supported or advertised. Provider and OAuth redirects are never followed. Configuration is strict: unknown root, provider, and circuit fields are rejected. Streaming Chat Completions (`stream: true`) return 501. Priority fallback is allowed for configured statuses, malformed provider success responses, and proven pre-wire transport failures. Ambiguous POST outcomes are not replayed by default. Fails closed by default when a JSON POST cannot be inspected, lacks a string `model`, or has no matching provider. Outbound calls use the shared PluginHttpClient and global TLS settings (FERRUM_TLS_CA_BUNDLE_PATH, FERRUM_TLS_NO_VERIFY); per-proxy backend TLS overrides do not apply."
      required: [providers]
      properties:
        providers:
          type: array
          minItems: 1
          maxItems: 128
          description: One or more provider definitions. Tried in priority order (lower number = first).
          items:
            type: object
            additionalProperties: false
            required: [name, provider_type]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 128
                pattern: '^[A-Za-z0-9._-]+$'
                description: Unique provider name used in logs and metadata (e.g. ai_federation_provider field).
              provider_type:
                type: string
                enum:
                  - openai
                  - anthropic
                  - google_gemini
                  - google_vertex
                  - azure_openai
                  - aws_bedrock
                  - mistral
                  - cohere
                  - xai
                  - deepseek
                  - meta_llama
                  - hugging_face
                description: AI provider format / wire protocol.
              priority:
                type: integer
                minimum: 0
                maximum: 4294967295
                description: "Lower = tried first. Defaults to provider's index + 1."
              api_key:
                type: string
                description: API key for the provider. Required for all providers except aws_bedrock (uses SigV4) and google_vertex (uses service account JWT).
              model_patterns:
                type: array
                maxItems: 128
                items:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: '^[A-Za-z0-9._:/+*-]+$'
                  not: { pattern: '\.\.' }
                default: []
                description: "Glob patterns to match the request's `model` field (e.g. ['claude-*', 'gpt-4*']). Empty = catch-all."
              model_mapping:
                type: object
                maxProperties: 1024
                propertyNames:
                  minLength: 1
                  maxLength: 256
                  pattern: '^[A-Za-z0-9._:/+-]+$'
                  not: { pattern: '\.\.' }
                additionalProperties:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: '^[A-Za-z0-9._:/+-]+$'
                  not: { pattern: '\.\.' }
                default: {}
                description: "Map client-facing model names to provider-native names (e.g. {claude-4-sonnet: 'claude-sonnet-4-20250514'})."
              default_model:
                type: string
                minLength: 1
                maxLength: 256
                pattern: '^[A-Za-z0-9._:/+-]+$'
                not: { pattern: '\.\.' }
                description: Model to send to the provider when no mapping matches.
              multimodal_mode:
                type: string
                enum:
                  - reject
                  - translate
                  - text_only_with_warning
                description: "How this provider handles OpenAI Chat Completions content parts that are not text. Translated providers default to reject; OpenAI-compatible providers and Cohere default to translate. text_only_with_warning intentionally drops non-text parts and records ai_federation_multimodal_* metadata."
              connect_timeout_seconds:
                type: integer
                minimum: 1
                default: 5
                description: Per-provider TCP + TLS handshake timeout for outbound provider calls.
              read_timeout_seconds:
                type: integer
                minimum: 1
                default: 60
                description: Overall per-request deadline for outbound provider calls.
              max_response_body_bytes:
                type: integer
                minimum: 1
                maximum: 67108864
                default: 8388608
                description: Maximum provider response bytes collected and maximum normalized JSON bytes emitted. Collection/serialization aborts as soon as this bound is exceeded.
              base_url:
                type: string
                format: uri
                pattern: '^https?://[^/?#@]+(?:/[^?#]*)?$'
                description: Override the provider endpoint. Userinfo, query strings, and fragments are rejected. HTTPS is required unless allow_plaintext is explicitly true; literal and resolved IPs remain subject to FERRUM_BACKEND_ALLOW_IPS.
              allow_plaintext:
                type: boolean
                default: false
                description: Permit an explicit http:// base_url. This weakens credential transport security and never permits provider-generated redirects.
              azure_resource:
                type: string
                minLength: 2
                maxLength: 64
                pattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$'
                description: "Azure OpenAI resource name (the {resource} in {resource}.openai.azure.com). Required for azure_openai."
              azure_deployment:
                type: string
                minLength: 1
                maxLength: 64
                pattern: '^[A-Za-z0-9._:-]+$'
                description: Azure OpenAI deployment name. Required for azure_openai.
              azure_api_version:
                type: string
                minLength: 1
                maxLength: 64
                pattern: '^[A-Za-z0-9._:-]+$'
                default: "2024-06-01"
                description: Azure OpenAI api-version query parameter.
              google_project_id:
                type: string
                minLength: 1
                maxLength: 128
                pattern: '^[A-Za-z0-9._:-]+$'
                description: Google Cloud project ID. Required for google_vertex.
              google_region:
                type: string
                minLength: 1
                maxLength: 63
                pattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$'
                description: Google Vertex AI region (e.g. us-central1). Required for google_vertex.
              google_service_account_json:
                type: string
                description: Google service account JSON contents (the file body, not the path). Required for google_vertex; used to mint OAuth2 access tokens via JWT bearer flow.
              aws_region:
                type: string
                minLength: 1
                maxLength: 63
                pattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$'
                description: "AWS region for Bedrock (e.g. us-east-1). Required for aws_bedrock unless AWS_DEFAULT_REGION/AWS_REGION env var is set."
              aws_access_key_id:
                type: string
                description: "AWS access key ID for Bedrock SigV4 signing. Falls back to AWS_ACCESS_KEY_ID env var."
              aws_secret_access_key:
                type: string
                description: "AWS secret access key for Bedrock SigV4 signing. Falls back to AWS_SECRET_ACCESS_KEY env var."
              aws_session_token:
                type: string
                description: "Optional AWS STS session token for temporary credentials. Falls back to AWS_SESSION_TOKEN env var."
              circuit_breaker:
                type: object
                additionalProperties: false
                description: Optional passive circuit. State belongs to this resolved provider instance and is discarded on configuration reload.
                properties:
                  failure_threshold:
                    type: integer
                    minimum: 1
                    maximum: 100
                    default: 3
                    description: Consecutive configured transport, status, or protocol failures before opening.
                  cooldown_seconds:
                    type: integer
                    minimum: 1
                    maximum: 86400
                    default: 30
                    description: Time to skip an open provider before permitting one half-open probe.
                  success_threshold:
                    type: integer
                    minimum: 1
                    maximum: 100
                    default: 1
                    description: Successful half-open probes required to close the circuit.
            allOf:
              - if:
                  properties:
                    provider_type:
                      enum: [openai, anthropic, google_gemini, azure_openai, mistral, cohere, xai, deepseek, meta_llama, hugging_face]
                  required: [provider_type]
                then:
                  required: [api_key]
              - if:
                  properties:
                    provider_type:
                      const: azure_openai
                  required: [provider_type]
                then:
                  required: [azure_resource, azure_deployment]
              - if:
                  properties:
                    provider_type:
                      const: google_vertex
                  required: [provider_type]
                then:
                  required: [google_project_id, google_region, google_service_account_json]
              - if:
                  properties:
                    base_url:
                      pattern: '^http://'
                  required: [base_url]
                then:
                  properties:
                    allow_plaintext:
                      const: true
                  required: [allow_plaintext]
        fallback_enabled:
          type: boolean
          default: true
          description: Try the next provider when one fails (network error or matching status code).
        fallback_on_status_codes:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 599
          default: [429, 500, 502, 503]
          description: HTTP status codes from a provider that trigger fallback to the next provider.
        fallback_on_network_errors:
          type: boolean
          default: true
          description: Trigger fallback only for transport failures proven to occur before the non-idempotent provider POST reached the wire.
        fallback_on_protocol_errors:
          type: boolean
          default: true
          description: Try the next provider when a 2xx response is malformed or cannot be losslessly normalized, or when a redirect is returned.
        fallback_on_ambiguous_errors:
          type: boolean
          default: false
          description: Permit replay on the next provider after a POST may have reached the prior provider. Enabling this can duplicate model calls and charges; leave false unless the provider contract supplies replay safety.
        fail_on_missing_model:
          type: boolean
          default: true
          description: Reject JSON POST requests whose body cannot be inspected as JSON or lacks a top-level string `model` field. Set to false only to explicitly pass such requests through to the normal backend.
        fail_on_no_matching_provider:
          type: boolean
          default: true
          description: Reject requests whose `model` does not match any configured provider. Set to false only to explicitly pass unsupported models through to the normal backend.
        max_concurrent_requests:
          type: integer
          minimum: 1
          maximum: 4096
          default: 64
          description: Maximum simultaneous federation provider chains, including fallback and OAuth work. Excess requests fail with 503 without queueing.

    AiStreamRouterConfig:
      type: object
      additionalProperties: false
      description: "Plugin: ai_stream_router — streaming counterpart to ai_federation. Claims ONLY OpenAI Chat Completions requests with `stream: true` and preserves true end-to-end SSE streaming. Runs at priority 2984 (after ai_semantic_cache at 2980, before ai_federation at 4060). Instead of an internal terminate-and-respond HTTP call, it rewrites the routing decision via RequestContext.route_override_* so the normal proxy dispatch streams the provider response straight back to the client. Strips client credential headers (Authorization, Proxy-Authorization, Cookie, and API-key headers) and injects the provider's credential; gateway-asserted x-consumer-* identity headers are also suppressed toward the provider. openai/openai_compatible providers pass through unchanged except optional stream_options.include_usage injection; anthropic requests are translated to the Anthropic Messages API streaming request and Anthropic SSE events are normalized to OpenAI chat.completion.chunk SSE. google_gemini config is accepted for forward-compatibility but rejected at construction until implemented. When it claims a request it sets ctx.metadata ai_stream_router_claimed=true so ai_federation defers. Fails closed by default when a streaming request lacks a top-level string `model` or matches no provider. Non-streaming requests Continue to ai_federation. Fallback across providers after the first downstream byte is out of scope (ai_stream_router.fallback_attempts is always 0). Configuration is strict: unknown root, provider, and fallback fields are rejected with path-qualified diagnostics (and spelling suggestions when useful), so typos such as `enabeld` cannot silently leave the router enabled. The same constructor contract admits file validate/startup, Admin/database writes, and CP/DP snapshot or reload publication; invalid enabled configs reject publication and retain the last-known-good instance under the plugin's FailClosed policy. NOTE: this plugin is HTTP-only and routes over the normal dispatch path, so per-proxy backend TLS/DNS egress policy applies to provider endpoints."
      required: [providers]
      properties:
        enabled:
          type: boolean
          default: true
          description: Master switch. When false the plugin never claims requests.
        fail_on_missing_model:
          type: boolean
          default: true
          description: Reject a streaming request that lacks a top-level string `model`. Set to false to pass such requests through (to ai_federation / normal backend).
        fail_on_no_matching_provider:
          type: boolean
          default: true
          description: Reject a streaming request whose `model` matches no configured provider. Set to false to pass such requests through.
        inject_usage_options:
          type: boolean
          default: true
          description: For openai/openai_compatible providers, inject stream_options.include_usage=true so the provider emits a final usage event.
        normalize_response_stream:
          type: boolean
          default: true
          description: Normalize provider-native SSE (e.g. Anthropic Messages API events) to OpenAI chat.completion.chunk SSE. Disabling forwards provider-native SSE verbatim.
        providers:
          type: array
          minItems: 1
          description: One or more streaming provider definitions. The first provider (in priority order) whose model_patterns match the request `model` wins.
          items:
            type: object
            additionalProperties: false
            required: [name, provider_type, endpoint, api_key, model_patterns]
            properties:
              name:
                type: string
                description: Unique provider name (surfaced in ai_stream_router.provider metadata).
              provider_type:
                type: string
                enum:
                  - openai
                  - openai_compatible
                  - anthropic
                  - google_gemini
                description: "Provider wire format. openai/openai_compatible pass through; anthropic is translated + normalized; google_gemini is reserved (rejected at construction in this MVP)."
              endpoint:
                type: string
                description: "Full https (or http with allow_plaintext) provider streaming endpoint URL, e.g. https://api.openai.com/v1/chat/completions or https://api.anthropic.com/v1/messages. May contain a literal {model} path placeholder for future providers. An endpoint query string (e.g. an Azure-style ?api-version=...) is preserved and merged with the client's own query using '&'. IPv6 literal hosts are bracketed in the forwarded authority."
              api_key:
                type: string
                description: "Provider API key. Supports a ${ENV_VAR} reference resolved from the process environment. Injected as Authorization: Bearer for openai(-compatible), x-api-key for anthropic."
              model_patterns:
                type: array
                minItems: 1
                items:
                  type: string
                description: "Non-empty glob patterns matched against the request `model` (exact or prefix, e.g. ['gpt-*', 'o*'] or ['claude-*'])."
              priority:
                type: integer
                minimum: 1
                description: "Lower = matched first. Defaults to provider index + 1."
              allow_plaintext:
                type: boolean
                default: false
                description: Permit an http:// endpoint (rejected by default).
              anthropic_version:
                type: string
                default: "2023-06-01"
                description: anthropic-version header value sent to Anthropic providers.
              inherit_backend_tls:
                type: boolean
                default: false
                description: "By default an https provider endpoint is verified against the system trust store (default backend TLS). Set true to keep the proxy's own resolved backend TLS instead — custom CA bundle, SNI/SAN policy, and backend mTLS client certificate — for internal openai_compatible endpoints behind private PKI. No effect on http endpoints."
        fallback:
          type: object
          additionalProperties: false
          description: "Reserved fallback policy. Parsed and validated but not yet active: ai_stream_router cannot switch providers after the first downstream byte."
          properties:
            enabled:
              type: boolean
              default: false
            on_connect_error:
              type: boolean
              default: true
            on_5xx_before_first_byte:
              type: boolean
              default: true
            max_attempts:
              type: integer
              default: 2

    A2aGatewayConfig:
      type: object
      description: "Plugin: a2a_gateway — transparent Agent-to-Agent protocol gateway for HTTP JSON-RPC, HTTP+JSON/REST, and gRPC/grpcs A2A traffic. Detects standard A2A methods, optionally denies methods by gateway policy, rewrites HTTP Agent Card endpoint URLs to the gateway address, preserves SSE/gRPC streaming, and emits a2a.* metadata for existing Ferrum logging, tracing, chargeback, WAF, and alerting plugins. It does not manage A2A task state or aggregate multiple agents in V1."
      properties:
        enabled:
          type: boolean
          default: true
        mode:
          type: string
          enum: [transparent_proxy]
          default: transparent_proxy
        endpoint:
          type: object
          properties:
            path:
              type: string
              default: /a2a
              description: Public JSON-RPC A2A endpoint path.
            agent_card_path:
              type: string
              default: /.well-known/agent-card.json
              description: Public Agent Card discovery path suffix.
            protocol_versions:
              type: array
              minItems: 1
              items:
                type: string
              default: ["0.3.0"]
            grpc_services:
              type: array
              minItems: 1
              items:
                type: string
              default: ["lf.a2a.v1.A2AService"]
              description: Fully-qualified gRPC service names recognized as A2A services. V1 observes and gates these methods without decoding protobuf payloads.
        detection:
          type: object
          properties:
            bindings:
              type: array
              minItems: 1
              items:
                type: string
                enum: [jsonrpc, rest, grpc]
              default: [jsonrpc, rest, grpc]
            version_header:
              type: string
              default: A2A-Version
              description: Header used to record/accept A2A protocol version hints.
            max_request_body_size:
              type: integer
              format: uint64
              default: 1048576
              description: Maximum JSON-RPC request body bytes parsed for A2A detection; 0 means no plugin-level detection limit. Oversized JSON-RPC candidates fail closed when default_action is deny or any per-method deny rule is configured.
            allow_unknown_methods_with_version_header:
              type: boolean
              default: true
              description: Treat JSON-RPC requests carrying the version header as A2A even when the method is not in the built-in standard-method table. Metadata records method as unknown to bound cardinality.
            strip_accept_encoding:
              type: boolean
              default: true
              description: Remove Accept-Encoding on non-streaming A2A HTTP requests whose responses may be parsed or rewritten by the plugin. Enabling this plugin with the default true value marks request headers mutable for all traffic on the proxy.
        discovery:
          type: object
          properties:
            rewrite_agent_card_urls:
              type: boolean
              default: true
              description: Rewrite HTTP JSON Agent Card URLs for detected card requests. V1 rewrites JSON-RPC endpoint URLs, preserves non-JSONRPC interface URLs such as GRPC and HTTP+JSON, and removes stale signatures after mutation.
            public_base_url:
              type: string
              format: uri
              description: Optional explicit public gateway origin, for example https://agents.example.com. When omitted and trust_forwarded_headers is true, X-Forwarded-* and Host are used after validating http/https scheme and host-only values.
            trust_forwarded_headers:
              type: boolean
              default: false
        observability:
          type: object
          properties:
            emit_metadata:
              type: boolean
              default: true
              description: Emit a2a.* request and response metadata for downstream logging, tracing, authz, and chargeback plugins. When true (default), detected non-streaming A2A HTTP responses are buffered so response metadata (a2a.task_id, a2a.context_id, a2a.task_state, a2a.error) can be extracted; SSE and gRPC responses are never buffered. Detected 2xx SSE streams are observed without buffering and write a2a.stream_events plus any observed a2a.task_id, a2a.context_id, and a2a.task_state into transaction metadata at stream termination, where key-based metadata redaction applies. The buffer is bounded by the global FERRUM_MAX_RESPONSE_BODY_SIZE_BYTES limit, not max_payload_size. Set false together with discovery.rewrite_agent_card_urls=false to keep responses fully streaming; request detection and method policy still apply.
            log_payloads:
              type: boolean
              default: false
              description: Copies bounded A2A response payloads into metadata. Payloads can contain secrets or PII and are copied verbatim into a2a.payload.response rather than field-redacted; enable only for protected logging paths. Request payloads are not logged. Requires emit_metadata=true, because payload capture writes the a2a.payload.response metadata key; with emit_metadata=false this option has no effect.
            max_payload_size:
              type: integer
              format: uint64
              default: 1048576
              minimum: 1
        policy:
          type: object
          properties:
            default_action:
              type: string
              enum: [allow, deny]
              default: allow
            methods:
              type: object
              description: >-
                Per-method policy overrides. Keys must be a canonical A2A method name —
                message/send, message/stream, tasks/get, tasks/list, tasks/cancel,
                tasks/resubscribe, tasks/pushNotificationConfig/set,
                tasks/pushNotificationConfig/get, tasks/pushNotificationConfig/list,
                tasks/pushNotificationConfig/delete, agent/getCard,
                agent/getExtendedAgentCard, agent/getAuthenticatedExtendedCard — or the
                literal "unknown". PascalCase gRPC/REST aliases such as SendMessage or
                GetTask are accepted and normalized to these canonical names.
                Unrecognized keys are rejected at config validation.
              additionalProperties:
                type: object
                required: [action]
                properties:
                  action:
                    type: string
                    enum: [allow, deny]

    McpGatewayConfig:
      type: object
      description: "Plugin: mcp_gateway — HTTP MCP / Agent Tool Gateway for JSON-RPC MCP traffic. Supports transparent_proxy and aggregate_router modes, MCP session mediation, catalog aggregation, namespaced tool/resource/prompt routing, tool argument JSON Schema validation, and mcp.* metadata emission. Generic auth, rate limiting, WAF, retry, timeout, tracing, DLP, and semantic safety remain separate Ferrum plugins."
      required: [mode, endpoint, servers]
      properties:
        enabled:
          type: boolean
          default: true
        mode:
          type: string
          enum: [transparent_proxy, aggregate_router]
        endpoint:
          type: object
          required: [path]
          properties:
            path:
              type: string
              description: Public MCP endpoint path, such as /mcp.
            protocol_versions:
              type: array
              minItems: 1
              items:
                type: string
              default: ["2025-11-25"]
              description: Supported MCP protocol versions, in preference order. The first entry is the gateway's preferred version, returned by aggregate-mode initialize when the client requests an unsupported version.
        discovery:
          type: object
          properties:
            aggregate_tools:
              type: boolean
              default: true
            aggregate_resources:
              type: boolean
              default: true
            aggregate_prompts:
              type: boolean
              default: true
            namespace_separator:
              type: string
              default: "."
            cache_ttl_seconds:
              type: integer
              format: uint64
              default: 300
            hide_denied_items:
              type: boolean
              default: true
            on_new_tool:
              type: string
              enum: [allow, allow_immediately, expose, hide_until_configured]
              default: hide_until_configured
            on_schema_change:
              type: string
              enum: [allow, allow_immediately, expose, hide_until_configured]
              default: hide_until_configured
        sessions:
          type: object
          properties:
            downstream_session_header:
              type: string
              default: mcp-session-id
              description: Must be a valid HTTP header name; rejected at config validation otherwise.
            upstream_session_header:
              type: string
              default: mcp-session-id
              description: Must be a valid HTTP header name; rejected at config validation otherwise.
            initialize_upstreams:
              type: string
              enum: [lazy, startup, passthrough]
              default: lazy
              description: startup is accepted as a V1 alias for lazy because upstream MCP initialize requires a downstream client session.
            session_ttl_seconds:
              type: integer
              format: uint64
              default: 3600
              minimum: 1
              description: Idle downstream MCP session lifetime before eviction.
            max_sessions:
              type: integer
              format: uint64
              default: 16384
              minimum: 1
              description: Maximum downstream MCP sessions retained by this plugin instance; oldest sessions are evicted when the cap is reached.
        capabilities:
          type: object
          properties:
            advertise_tools:
              type: boolean
              default: true
            advertise_resources:
              type: boolean
              default: true
            advertise_prompts:
              type: boolean
              default: true
            advertise_logging:
              type: boolean
              default: false
              description: In aggregate_router mode, requires passthrough_unknown_methods=true until logging methods are routed or implemented.
            advertise_completions:
              type: boolean
              default: false
              description: In aggregate_router mode, requires passthrough_unknown_methods=true until explicit completion routing is implemented.
            advertise_tasks:
              type: boolean
              default: false
              description: In aggregate_router mode, requires passthrough_unknown_methods=true until task methods are routed or implemented.
            passthrough_unknown_methods:
              type: boolean
              default: false
        servers:
          type: object
          minProperties: 1
          propertyNames:
            pattern: '^[A-Za-z0-9._-]+$'
            description: Server ids are embedded in public mcp:// resource URIs, so they must be URI-safe (ASCII alphanumerics, '.', '_', '-').
          additionalProperties:
            type: object
            required: [upstream_url, namespace]
            properties:
              upstream_url:
                type: string
                format: uri
                description: HTTP or HTTPS upstream MCP endpoint URL. Credentials, query, and fragment are rejected.
              namespace:
                type: string
                description: Public namespace prefix used for tool and prompt names.
              enabled:
                type: boolean
                default: true
              expose_tools:
                type: boolean
                default: true
              expose_resources:
                type: boolean
                default: false
              expose_prompts:
                type: boolean
                default: false
              initialize_strategy:
                type: string
                enum: [lazy, startup, passthrough]
                description: Overrides sessions.initialize_upstreams for this server; startup is accepted as a V1 alias for lazy.
        policy:
          type: object
          properties:
            default_action:
              type: string
              enum: [allow, deny]
              default: deny
            hide_denied_tools:
              type: boolean
              default: true
            tools:
              type: object
              additionalProperties:
                type: object
                required: [action]
                properties:
                  action:
                    type: string
                    enum: [allow, deny, hide_from_discovery]
        validation:
          type: object
          properties:
            validate_tool_arguments:
              type: boolean
              default: true
            validate_tool_results:
              type: boolean
              default: false
              enum: [false]
              description: Reserved; tool result validation is not implemented yet, so true is rejected at config validation.
            max_upstream_response_bytes:
              type: integer
              format: int64
              minimum: 1
              default: 4194304
              description: "Maximum bytes read from a single non-SSE upstream application/json response before the read is aborted (DoS backstop). Must be greater than 0."
            max_catalog_items_per_list:
              type: integer
              format: int64
              minimum: 1
              default: 10000
              description: "Maximum items accumulated across paginated catalog list pages (tools/resources/prompts) before the aggregation is rejected. Must be greater than 0."
            max_catalog_bytes_per_list:
              type: integer
              format: int64
              minimum: 1
              default: 8388608
              description: "Maximum total serialized bytes accumulated across paginated catalog list pages before the aggregation is rejected. Must be greater than 0."
        observability:
          type: object
          properties:
            emit_metadata:
              type: boolean
              default: true
            log_raw_arguments:
              type: boolean
              default: false
              description: Copies raw MCP tool arguments into request metadata. Arguments can contain secrets or PII; prefer log_argument_hash unless the logging path is explicitly protected.
            log_argument_hash:
              type: boolean
              default: true
            log_raw_results:
              type: boolean
              default: false
            log_result_hash:
              type: boolean
              default: false

    ApiChargebackConfig:
      type: object
      description: |
        Plugin: api_chargeback — Per-consumer API usage charge tracking across
        three independent pricing dimensions: per-call pricing by billable
        status code, per-byte bandwidth pricing (both client->backend and
        backend->client, applied to HTTP-family AND stream proxies), and
        per-connection pricing for stream proxies (TCP/TCP+TLS/UDP/DTLS).
        Ordinary HTTP uses the wire status. Native gRPC and translated
        gRPC-Web use the final client-visible grpc-status mapped to the
        canonical effective HTTP status; missing/malformed/unknown terminal
        status fails closed to 500.
        At least one of `pricing_tiers`, `bandwidth_pricing`, or
        `stream_connection_pricing` must be configured.
      properties:
        currency:
          type: string
          default: "USD"
          description: Currency label included in Prometheus metrics and JSON output. Informational only — the plugin does not perform currency conversion.
        pricing_tiers:
          type: array
          minItems: 1
          items:
            type: object
            required: [status_codes, price_per_call]
            properties:
              status_codes:
                type: array
                minItems: 1
                items:
                  type: integer
                description: Billable status codes that trigger this tier's charge. Ordinary HTTP uses the wire status. Native gRPC and translated gRPC-Web map final terminal codes as 0→200, 1→499, 2→500, 3→400, 4→504, 5→404, 6→409, 7→403, 8→429, 9→400, 10→409, 11→400, 12→501, 13→500, 14→503, 15→500, and 16→401; missing, malformed, or unknown terminal codes map to 500. A status code must appear in exactly one tier.
              price_per_call:
                type: number
                minimum: 0
                description: Charge per HTTP API call (e.g. 0.00001). Must be non-negative.
          description: |
            HTTP-family per-call pricing. Each tier maps a set of billable
            status codes to a per-call price. Ordinary HTTP uses its wire
            status; native gRPC and translated gRPC-Web use the canonical
            effective-HTTP mapping of the finalized terminal grpc-status.
            Stream proxies (TCP/UDP/DTLS) have no HTTP status code and use
            `stream_connection_pricing` instead.
        bandwidth_pricing:
          type: object
          additionalProperties: false
          description: |
            Optional bandwidth pricing applied to both HTTP-family and stream
            transactions, using the gateway-perspective `bytes_sent` /
            `bytes_received` counters from the transaction-summary schema.
          properties:
            price_per_byte_sent:
              type: number
              minimum: 0
              default: 0.0
              description: Per-byte charge for bytes flowed client->backend.
            price_per_byte_received:
              type: number
              minimum: 0
              default: 0.0
              description: Per-byte charge for bytes flowed backend->client.
        stream_connection_pricing:
          type: object
          additionalProperties: false
          required: [price_per_connection]
          description: |
            Optional per-connection pricing for stream proxies (TCP, TCP+TLS,
            UDP, DTLS). Charges the configured flat fee once per session at
            disconnect time. Streams have no HTTP status code so they cannot
            use `pricing_tiers`.
          properties:
            price_per_connection:
              type: number
              minimum: 0
              description: Per-session charge applied at stream disconnect.
        render_cache_ttl_seconds:
          type: integer
          default: 5
          description: How long the cached /charges response is served before rebuilding.
        stale_entry_ttl_seconds:
          type: integer
          default: 3600
          description: How long idle chargeback entries live before eviction.
        cache_invalidation_min_age_ms:
          type: integer
          default: 500
          description: Minimum age (ms) of the render cache before record() will invalidate it.
        cleanup_interval_seconds:
          type: integer
          default: 300
          description: How often (seconds) the background task evicts entries that have been idle longer than stale_entry_ttl_seconds. Set to 0 to disable.

    ApiChargebackSinkConfig:
      type: object
      additionalProperties: false
      description: |
        Plugin: api_chargeback_sink — Durable ClickHouse charge export. Uses the
        same `pricing_tiers`, `bandwidth_pricing`, `stream_connection_pricing`,
        and `currency` fields as `api_chargeback`, then exports either
        per-transaction events (`mode: per_event`) or periodic accumulator
        deltas (`mode: snapshot`) to ClickHouse. Ordinary HTTP uses its wire
        status for pricing. Native gRPC and translated gRPC-Web use the final
        normalized grpc-status mapped to the canonical effective HTTP status.
        Durable events preserve that billable status, the raw HTTP status, and
        the normalized gRPC status separately.
      properties:
        mode:
          type: string
          enum: [per_event, snapshot]
          default: per_event
          description: Export one event per transaction or periodic snapshot deltas. Snapshot mode requires spool.enabled=true for durable delta delivery.
        currency:
          type: string
          default: "USD"
          description: Currency label written to each charge event.
        pricing_version:
          type: string
          default: default
          description: Operator-controlled pricing/version label written to each event.
        include_request_id:
          type: boolean
          default: true
          description: Include request/correlation ID metadata when present.
        include_trace_id:
          type: boolean
          default: true
          description: Include trace ID or traceparent metadata when present.
        pricing_tiers:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [status_codes, price_per_call]
            properties:
              status_codes:
                type: array
                minItems: 1
                items:
                  type: integer
                  minimum: 100
                  maximum: 599
                description: Billable status codes. Ordinary HTTP uses the wire status; gRPC/gRPC-Web uses the canonical effective mapping of final grpc-status, with missing/malformed/unknown terminal status mapped to 500.
              price_per_call:
                type: number
                minimum: 0
          description: HTTP-family per-call pricing by billable status. A status code must appear in at most one tier.
        bandwidth_pricing:
          type: object
          additionalProperties: false
          properties:
            price_per_byte_sent:
              type: number
              minimum: 0
              default: 0.0
            price_per_byte_received:
              type: number
              minimum: 0
              default: 0.0
          description: Optional per-byte pricing for client->backend and backend->client bytes.
        stream_connection_pricing:
          type: object
          additionalProperties: false
          required: [price_per_connection]
          properties:
            price_per_connection:
              type: number
              minimum: 0
          description: Optional flat per-session charge for TCP/TCP+TLS/UDP/DTLS disconnects.
        clickhouse:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url:
              type: string
              format: uri
              description: ClickHouse HTTP endpoint. Must use http:// or https:// and must not contain user-info.
            database:
              type: string
              default: ferrum
            table:
              type: string
              default: charges_raw
            username:
              type: string
              description: Optional ClickHouse HTTP Basic username.
            password_ref:
              type: string
              description: FERRUM_* environment variable containing the ClickHouse password, often materialized at startup from an existing `_FILE`, `_VAULT`, `_AWS`, `_AZURE`, or `_GCP` secret suffix. Because the password is sent via HTTP Basic auth, `clickhouse.url` must use `https://` and TLS certificate/hostname verification must stay enabled when this is set.
            tls:
              type: object
              additionalProperties: false
              properties:
                ca_file:
                  type: [string, "null"]
                  description: PEM CA bundle for this ClickHouse endpoint.
                client_cert_file:
                  type: [string, "null"]
                  description: PEM client certificate for ClickHouse mTLS.
                client_key_file:
                  type: [string, "null"]
                  description: PEM client private key for ClickHouse mTLS.
                verify_hostname:
                  type: boolean
                  default: true
                  description: Verify the ClickHouse server hostname. Disabling this logs a warning and is for testing only.
                insecure_skip_verify:
                  type: boolean
                  default: false
                  description: Disable certificate verification for this ClickHouse endpoint. Logs a warning and cannot be used with password_ref. Testing only.
            insert_query_params:
              type: object
              additionalProperties:
                type: string
              default: {}
              description: Extra query parameters appended to the ClickHouse INSERT request, such as async_insert.
            timeout_ms:
              type: integer
              minimum: 1
              default: 5000
        batch:
          type: object
          additionalProperties: false
          properties:
            size:
              type: integer
              minimum: 1
              maximum: 100000
              default: 500
            flush_interval_ms:
              type: integer
              minimum: 1
              default: 2000
            buffer_capacity:
              type: integer
              minimum: 1
              maximum: 1000000
              default: 50000
        retry:
          type: object
          additionalProperties: false
          properties:
            max_attempts:
              type: integer
              minimum: 0
              default: 5
            initial_delay_ms:
              type: integer
              minimum: 0
              default: 250
            max_delay_ms:
              type: integer
              minimum: 0
              default: 10000
            jitter:
              type: boolean
              default: true
        spool:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              default: true
            dir:
              type: string
              default: /var/lib/ferrum/chargeback-spool
            max_bytes:
              type: integer
              minimum: 1
              default: 10737418240
            replay_interval_secs:
              type: integer
              minimum: 1
              default: 60
            compression:
              type: string
              enum: [zstd, none]
              default: zstd
        snapshot:
          type: object
          additionalProperties: false
          properties:
            interval_secs:
              type: integer
              minimum: 1
              default: 30
            emit_zero_deltas:
              type: boolean
              default: false
              description: Emit unchanged keys on every snapshot tick.
            cleanup_interval_secs:
              type: integer
              minimum: 1
              default: 300
              description: How often idle snapshot accumulator keys are evicted.
            stale_entry_ttl_secs:
              type: integer
              minimum: 1
              default: 3600
              description: How long a snapshot accumulator key may remain idle before entries and last-emitted state are removed.

    ChargebackResponse:
      type: object
      description: |
        JSON format response from the /charges endpoint. Ordinary HTTP entries
        use their wire status. Native gRPC and translated gRPC-Web entries use
        the final client-visible grpc-status mapped to the canonical effective
        HTTP status; the mapping affects billing output only and does not
        overwrite transaction-log transport status.
      properties:
        currency:
          type: string
          description: |
            Currency in use across all recorded charges. Each `api_chargeback`
            plugin instance carries its own currency (per global/proxy/proxy_group
            scope), so this is `"mixed"` when instances disagree — read the
            per-proxy `currency` field for the authoritative value in that case.
          example: "USD"
        generated_at:
          type: string
          format: date-time
        consumers:
          type: object
          additionalProperties:
            type: object
            properties:
              total_charges:
                type: number
                description: Sum of per-call, stream-connection, and bandwidth charges across all proxies for this consumer.
              total_calls:
                type: integer
                description: Sum of HTTP calls + stream sessions across all proxies for this consumer.
              per_call_charges:
                type: number
                description: HTTP per-call charges only.
              stream_connection_charges:
                type: number
                description: Stream per-connection charges only.
              bandwidth_charges:
                type: number
                description: Bandwidth charges only (sent + received).
              proxies:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    proxy_name:
                      type: string
                    currency:
                      type: string
                      description: |
                        Currency of the `api_chargeback` instance that recorded
                        this proxy's charges. Authoritative even when the
                        top-level `currency` is `"mixed"`.
                      example: "USD"
                    protocol_family:
                      type: string
                      enum: [http, stream, mixed]
                      description: |
                        Protocol family this proxy serves. `"mixed"` when the same
                        proxy_id carries both HTTP and stream activity. Bandwidth
                        metrics and the JSON breakdown are scoped per family.
                    total_charges:
                      type: number
                      description: Per-proxy sum of per-call, stream-connection, and bandwidth charges.
                    total_calls:
                      type: integer
                      description: Per-proxy sum of HTTP calls + stream sessions.
                    by_status:
                      type: object
                      description: |
                        HTTP-family per-call breakdown by billable status (empty
                        for stream-only proxies; populated for `http` and
                        `mixed`). Ordinary HTTP uses the wire status. Native
                        gRPC and translated gRPC-Web use the final terminal code
                        mapped to its canonical effective HTTP status; missing,
                        malformed, and unknown terminal codes use 500.
                      additionalProperties:
                        type: object
                        properties:
                          calls:
                            type: integer
                          charges:
                            type: number
                    bandwidth:
                      type: object
                      properties:
                        bytes_sent:
                          type: integer
                          description: Total bytes flowed client->backend for this consumer/proxy pair.
                        bytes_received:
                          type: integer
                          description: Total bytes flowed backend->client for this consumer/proxy pair.
                        charge_sent:
                          type: number
                          description: Accumulated bandwidth charge for client->backend bytes.
                        charge_received:
                          type: number
                          description: Accumulated bandwidth charge for backend->client bytes.
                    stream:
                      type: object
                      description: Present whenever the proxy recorded stream activity (TCP/UDP/DTLS), including `mixed` proxies that also serve HTTP.
                      properties:
                        connections:
                          type: integer
                          description: Number of stream sessions recorded.
                        connection_charges:
                          type: number
                          description: Accumulated per-connection charge.

    ChargebackSinkStatusResponse:
      type: object
      description: Status response from `GET /charges/sink/status`.
      properties:
        mode:
          type: string
          enum: [per_event, snapshot]
        enabled:
          type: boolean
        pricing_version:
          type: [string, "null"]
        clickhouse:
          type: [object, "null"]
          properties:
            endpoint:
              type: string
              description: ClickHouse endpoint with user-info, query, and fragment stripped.
            database:
              type: string
            table:
              type: string
        queue:
          type: object
          properties:
            depth:
              type: integer
            capacity:
              type: integer
            high_water_hits_total:
              type: integer
        spool:
          type: object
          properties:
            enabled:
              type: boolean
            files:
              type: integer
            bytes:
              type: integer
            drops_total:
              type: integer
            last_replay_at:
              type: [string, "null"]
              format: date-time
        export:
          type: object
          properties:
            events_enqueued_total:
              type: integer
            events_exported_total:
              type: integer
            failures_total:
              type: integer
            last_success_at:
              type: [string, "null"]
              format: date-time
            last_failure_at:
              type: [string, "null"]
              format: date-time
            last_failure_reason:
              type: [string, "null"]

    RequestDeduplicationConfig:
      type: object
      description: "Plugin: request_deduplication — Idempotency-key based request deduplication. Logical keys are scoped by stable plugin-config identity, proxy, peer SPIFFE identity when present, authenticated identity when configured, and idempotency header value, then stored as framed SHA-256 digests. Stable plugin identity partitions sibling Redis-backed instances even when they share an explicit/default prefix, while the same configured instance shares keys across gateways. Cached responses replay only when the request fingerprint also matches method, authority/host, exact path, raw query string, deterministic request headers that can affect routing/transforms, and request-body digest. Cached bytes are already-finalized representations and bypass ordinary presentation transforms on replay while remaining subject to response inspection and final-body validation; a current-policy redaction decision runs only its required transform and fails closed with 502 if rewriting cannot complete. Applicable methods with declared bodies are prebuffered so keys added by earlier header transforms can be fingerprinted. Reusing a logical idempotency key for a different fingerprint returns 409. A completed external operation performed by a synthetic short-circuit — for example an ai_federation provider call — retains the in-flight marker and any distributed lock until inflight_ttl_seconds instead of caching the synthetic body, so an identical idempotency-key retry cannot repeat the billable external operation; externally executed synthetic plugins that do not mark this provenance must define their own completion contract. Completed response retention is bounded by per-entry and exact local total byte limits; size-skipped responses return normally and are not retained. In local mode, ordinary skipped responses clear in-flight state immediately. Supports centralized Redis-backed mode for cross-instance deduplication; Redis mode uses token-owned in-flight locks before backend dispatch and publishes completed responses before releasing the lock. Redis values include the fingerprint, obey the per-entry size limit for both retained response size and serialized payload size, and v3 logical keys are not backward-compatible with earlier key versions. If an owned terminal response fits locally but its serialized Redis value exceeds the cap, Redis admission settles before ordinary local eviction; the matching local gateway preserves one replay while active entries occupy the cap, and later pressure converts an unretainable protected replay to an in-flight tombstone while peers remain blocked. If a completion is skipped only by the local total cap and Redis publication fails, local and distributed in-flight locks are left to expire under inflight_ttl_seconds to avoid immediate duplicate execution without a replay value."
      properties:
        header_name:
          type: string
          default: "Idempotency-Key"
          description: Request header name containing the deduplication key
        ttl_seconds:
          type: integer
          minimum: 1
          default: 300
          description: Time-to-live in seconds for cached completed responses. Must be greater than zero.
        inflight_ttl_seconds:
          type: integer
          minimum: 1
          description: >-
            Time-to-live in seconds for in-flight request entries used to
            coalesce duplicate requests while the first is still being
            processed. Defaults to `ttl_seconds` when omitted. Must be
            greater than zero.
        max_entries:
          type: integer
          minimum: 1
          default: 10000
          description: Maximum number of tracked local deduplication entries. Active in-flight entries and fail-closed terminal tombstones count but are not evicted while live, so security state may temporarily exceed the cap.
        max_entry_size_bytes:
          type: integer
          minimum: 1
          default: 1048576
          description: Maximum retained size of one completed response entry. Oversized retained responses are returned normally, clear in-flight state, and are not retained or serialized for Redis. Redis payloads are also skipped when their serialized value exceeds this cap.
        max_total_size_bytes:
          type: integer
          minimum: 1
          default: 104857600
          description: Exact maximum retained size across local completed response entries. Responses that would exceed this cap are returned normally and are not retained. In local mode, skipped responses clear in-flight state immediately; in Redis mode, a local-total-cap skip keeps local and distributed in-flight locks until inflight_ttl_seconds if Redis publication fails.
        applicable_methods:
          type: array
          items:
            type: string
          default: ["POST", "PUT", "PATCH"]
          description: HTTP methods that require deduplication
        scope_by_consumer:
          type: boolean
          default: true
          description: Scope deduplication keys per consumer identity
        enforce_required:
          type: boolean
          default: false
          description: Reject requests missing the deduplication header with 400
        sync_mode:
          type: string
          enum: [local, redis]
          default: local
          description: "Dedup cache storage: 'local' (in-memory) or 'redis' (centralized completed responses plus distributed in-flight locks). Any RESP-compatible server works."
        redis_url:
          type: string
          description: "Redis connection URL. Required when sync_mode is 'redis'."
        redis_tls:
          type: boolean
          default: false
          description: "Enable TLS for the Redis connection. CA verification uses gateway-level FERRUM_TLS_CA_BUNDLE_PATH; skip-verify uses FERRUM_TLS_NO_VERIFY."
        redis_key_prefix:
          type: string
          default: "ferrum:dedup"
          description: Key prefix for all Redis keys
        redis_pool_size:
          type: integer
          default: 4
          description: Number of multiplexed Redis connections
        redis_connect_timeout_seconds:
          type: integer
          default: 5
          description: Redis connection timeout in seconds
        redis_health_check_interval_seconds:
          type: integer
          default: 5
          description: Health check ping interval when Redis is unavailable
        redis_username:
          type: string
          description: Redis username for ACL authentication
        redis_password:
          type: string
          description: Redis password

    GeoRestrictionConfig:
      type: object
      additionalProperties: false
      description: >-
        Plugin: geo_restriction — country-level access control backed by a
        MaxMind GeoIP2 / GeoLite2 `.mmdb` file. The database is fully verified
        and loaded into bounded owned immutable memory at construction. Files
        larger than 512 MiB, aggregate verified MMDB content above 512 MiB per
        validation generation/cache build, and records containing unsupported
        country codes are rejected before publication. File dependency
        validation is fatal in file mode and warns for absent/unreadable files
        in database mode. CP performs structure-only validation without opening
        node-local files; DP validates and refreshes its node-local files for
        full snapshots and affected incremental rebuilds. On runtime nodes that
        construct the plugin, a missing file uses
        `on_lookup_failure`, while a readable corrupt, incompatible, or
        wrong-product database is rejected.
        Exactly one of `allow_countries` and `deny_countries` must be non-empty.
        Runs on every protocol — HTTP, gRPC, WebSocket, TCP, UDP.
      required: [db_path]
      oneOf:
        - title: Allow-list mode
          required: [allow_countries]
          properties:
            allow_countries:
              minItems: 1
            deny_countries:
              maxItems: 0
        - title: Deny-list mode
          required: [deny_countries]
          properties:
            allow_countries:
              maxItems: 0
            deny_countries:
              minItems: 1
      properties:
        db_path:
          type: string
          minLength: 1
          pattern: '\S'
          description: >-
            Filesystem path to a MaxMind GeoIP2 or GeoLite2 `.mmdb` database no
            larger than 512 MiB. Across one validation generation/cache build,
            the verified sizes of all distinct content snapshots must also total
            no more than 512 MiB; equivalent path spellings with identical
            verified content are charged once. A changed candidate overlaps the live snapshot;
            when their combined size exceeds 512 MiB, hot replacement is
            rejected and the installed database must be loaded by restarting
            the gateway. Required.
        allow_countries:
          type: array
          items:
            $ref: "#/components/schemas/GeoRestrictionCountryCode"
          default: []
          description: >-
            ISO 3166-1 alpha-2 country codes (case-insensitive — normalized to
            uppercase) that are allowed. Mutually exclusive with
            `deny_countries`. Example: `["US", "CA", "GB"]`.
        deny_countries:
          type: array
          items:
            $ref: "#/components/schemas/GeoRestrictionCountryCode"
          default: []
          description: >-
            ISO 3166-1 alpha-2 country codes (case-insensitive — normalized to
            uppercase) that are denied. Mutually exclusive with
            `allow_countries`.
        inject_headers:
          type: boolean
          default: false
          description: >-
            When true, inject the resolved country code into the proxied
            request as the `x-geo-country` header (uppercase ISO 3166-1
            alpha-2). Central header materialization strips any client-supplied
            value even when no geo plugin is attached. The header remains
            absent on fail-open lookup paths unless an earlier geo instance
            already emitted an authoritative value; later non-injecting
            instances preserve that value. HTTP-family proxies only — ignored
            on TCP/UDP streams.
        on_lookup_failure:
          type: string
          enum: [allow, deny]
          default: allow
          description: >-
            Action when the client IP cannot be resolved to a country. Applies
            to both genuine MaxMind misses (private IPs, unallocated ranges)
            and to the data plane fallback path when the `.mmdb` file is
            missing on disk. The default `allow` is fail-open: unresolved
            traffic is permitted, so a missing or stale `.mmdb` silently
            disables the geo gate. Set this explicitly to `deny` for fail-closed
            behaviour. When the default is used, a one-time warning is logged at
            startup, and the first request-time fail-open is logged at warn.

    GeoRestrictionCountryCode:
      type: string
      minLength: 2
      maxLength: 2
      pattern: '^(?:[Aa][DdEeFfGgIiLlMmOoQqRrSsTtUuWwXxZz]|[Bb][AaBbDdEeFfGgHhIiJjLlMmNnOoQqRrSsTtVvWwYyZz]|[Cc][AaCcDdFfGgHhIiKkLlMmNnOoRrUuVvWwXxYyZz]|[Dd][EeJjKkMmOoZz]|[Ee][CcEeGgHhRrSsTt]|[Ff][IiJjKkMmOoRr]|[Gg][AaBbDdEeFfGgHhIiLlMmNnPpQqRrSsTtUuWwYy]|[Hh][KkMmNnRrTtUu]|[Ii][DdEeLlMmNnOoQqRrSsTt]|[Jj][EeMmOoPp]|[Kk][EeGgHhIiMmNnPpRrWwYyZz]|[Ll][AaBbCcIiKkRrSsTtUuVvYy]|[Mm][AaCcDdEeFfGgHhKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz]|[Nn][AaCcEeFfGgIiLlOoPpRrUuZz]|[Oo][Mm]|[Pp][AaEeFfGgHhKkLlMmNnRrSsTtWwYy]|[Qq][Aa]|[Rr][EeOoSsUuWw]|[Ss][AaBbCcDdEeGgHhIiJjKkLlMmNnOoRrSsTtVvXxYyZz]|[Tt][CcDdFfGgHhJjKkLlMmNnOoRrTtVvWwZz]|[Uu][AaGgMmSsYyZz]|[Vv][AaCcEeGgIiNnUu]|[Ww][FfSs]|[Xx][Kk]|[Yy][EeTt]|[Zz][AaMmWw])$'
      description: >-
        A currently assigned ISO 3166-1 alpha-2 country code, or XK (the
        user-assigned Kosovo code emitted by MaxMind). Matching is
        case-insensitive and runtime storage is normalized to uppercase. Other
        reserved, user-assigned, deleted, and alias codes are rejected.

    GraphqlRateSpec:
      type: object
      additionalProperties: false
      description: >-
        Closed GraphQL rate limit specification. Both fields are required and
        must be positive integers; unknown keys are rejected.
      required: [max_requests, window_seconds]
      properties:
        max_requests:
          type: integer
          format: uint64
          minimum: 1
          description: Maximum requests allowed in the window
        window_seconds:
          type: integer
          format: uint64
          minimum: 1
          description: Time window in seconds

    RateSpec:
      type: object
      description: >-
        Rate limit specification used by grpc_method_router. Both fields are
        required and must be positive integers. The gRPC runtime currently
        ignores additional keys, so this shared component remains open to
        preserve schema/runtime parity.
      required: [max_requests, window_seconds]
      properties:
        max_requests:
          type: integer
          format: uint64
          minimum: 1
          description: Maximum requests allowed in the window
        window_seconds:
          type: integer
          format: uint64
          minimum: 1
          description: Time window in seconds

    # ── Cluster Status ─────────────────────────────────────────────────

    ClusterStatusCp:
      type: object
      required: [mode, connected_data_planes, data_planes, connected_mesh_nodes, mesh_nodes]
      properties:
        mode:
          type: string
          enum: [cp]
        connected_data_planes:
          type: integer
          description: Number of currently connected Data Plane nodes
        data_planes:
          type: array
          items:
            $ref: "#/components/schemas/ConnectedDpNode"
        connected_mesh_nodes:
          type: integer
          description: Number of currently connected Mesh nodes
        mesh_nodes:
          type: array
          items:
            $ref: "#/components/schemas/ConnectedMeshNode"

    ConnectedMeshNode:
      type: object
      required: [node_id, version, namespace, status, connected_at, last_sync_at]
      properties:
        node_id:
          type: string
          description: Unique identifier for the mesh node
        version:
          type: string
          description: Ferrum Edge version reported by the mesh node
        namespace:
          type: string
          description: Namespace the mesh node is subscribed to
        status:
          type: string
          enum: [online]
          description: Always "online" — disconnected mesh nodes are removed from the registry
        connected_at:
          type: string
          format: date-time
          description: When the mesh node's gRPC stream was established
        last_sync_at:
          type: string
          format: date-time
          description: When the last config update was broadcast to this mesh node

    ConnectedDpNode:
      type: object
      required: [node_id, version, namespace, status, connected_at, last_sync_at]
      properties:
        node_id:
          type: string
          description: Unique identifier for the DP node (generated on each DP startup)
        version:
          type: string
          description: Ferrum Edge version reported by the DP
        namespace:
          type: string
          description: Namespace the DP is subscribed to
        status:
          type: string
          enum: [online]
          description: Always "online" — disconnected DPs are removed from the registry
        connected_at:
          type: string
          format: date-time
          description: When the DP's gRPC stream was established
        last_sync_at:
          type: string
          format: date-time
          description: When the last config update was broadcast to this DP

    ClusterStatusDp:
      type: object
      required: [mode, control_plane]
      properties:
        mode:
          type: string
          enum: [dp]
        control_plane:
          type: object
          required: [url, status, is_primary]
          properties:
            url:
              type: string
              description: URL of the CP this DP is connected to (or last attempted)
            status:
              type: string
              enum: [online, offline]
              description: Whether the gRPC stream to the CP is currently active
            is_primary:
              type: boolean
              description: True when connected to the primary CP, false for a fallback CP
            connected_since:
              type: [string, "null"]
              format: date-time
              description: When the current connection was established (null if offline)
            last_config_received_at:
              type: [string, "null"]
              format: date-time
              description: When the last config update was received (null if none yet)

    ClusterStatusOther:
      type: object
      required: [mode, message]
      properties:
        mode:
          type: string
          description: Current operating mode (database, file, etc.)
        message:
          type: string
          description: Informational message

    # ── Backend Capabilities ─────────────────────────────────────────
    ProtocolSupport:
      type: string
      enum: [unknown, supported, unsupported]
      description: |
        Per-backend per-protocol classification state.

        - `supported` — registry has confirmed the backend speaks this
          protocol; the hot path is free to use the native dispatch pool.
        - `unsupported` — registry has confirmed the backend does NOT
          speak this protocol (e.g., ALPN-negotiated HTTP/1.1 when the
          pool tried h2); the hot path skips the native pool.
        - `unknown` — no probe has run yet, or the last probe timed out.
          Hot-path behavior is identical to `unsupported` (fall back to
          reqwest), but the next scheduled refresh will retry.

    BackendCapabilityEntry:
      type: object
      required: [key, plain_http, grpc_transport, hbone, last_probe_at_unix_secs]
      properties:
        key:
          type: string
          description: |
            Deduplicated backend-target identity key:
            `scheme|host|port|dns_override|ca|mtls_cert|mtls_key|verify|hbone_port`.
            The HBONE port field is populated only for targets tagged
            `mesh.hbone=true`.
            Stable across responses for the same target; safe to match
            for churn detection.
        plain_http:
          type: object
          description: Transport support for plain HTTP (non-gRPC, non-WebSocket) traffic.
          required: [h1, h2_tls, h3]
          properties:
            h1:
              $ref: "#/components/schemas/ProtocolSupport"
            h2_tls:
              $ref: "#/components/schemas/ProtocolSupport"
            h3:
              $ref: "#/components/schemas/ProtocolSupport"
        grpc_transport:
          type: object
          description: Transport support for gRPC traffic detected via `content-type`.
          required: [h2_tls, h2c]
          properties:
            h2_tls:
              $ref: "#/components/schemas/ProtocolSupport"
            h2c:
              $ref: "#/components/schemas/ProtocolSupport"
        hbone:
          $ref: "#/components/schemas/ProtocolSupport"
          description: |
            Gateway-to-mesh HBONE support for upstream targets tagged
            `mesh.hbone=true`. `supported` means the gateway can open
            HTTP/2 CONNECT over SPIFFE mTLS to the sidecar port; `unknown`
            is used for untagged targets, gateways without SVIDs, or
            not-yet-probed entries.
        last_probe_at_unix_secs:
          type: integer
          format: int64
          description: |
            Epoch seconds of the most recent classification update.
            Refreshed by periodic probes AND by live-traffic downgrades
            (`mark_h2_tls_unsupported`, `mark_h3_unsupported`,
            `mark_hbone_unsupported`).
        last_probe_error:
          type: [string, "null"]
          description: |
            Human-readable error from the most recent probe or live
            downgrade. `null` when the latest update classified the
            target cleanly. Expected-unsupported outcomes (h2c on
            plaintext, H3 on most HTTPS backends, untagged HBONE,
            per-request HBONE CONNECT rejection) do NOT populate this
            field — only real connection / TLS-config errors and
            in-flight live downgrades.

    BackendCapabilitiesResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          description: Every registry entry keyed by backend-target identity.
          items:
            $ref: "#/components/schemas/BackendCapabilityEntry"

    # ── Node-Waypoint Identities ──────────────────────────────────────
    NodeWaypointIdentityEntry:
      type: object
      required:
        - pod_uid
        - spiffe_id
        - workload_spiffe_hash
        - orig_dst4_cookies
        - orig_dst6_cookies
        - has_policy_scope
      properties:
        pod_uid:
          type: string
          description: |
            Hyphenated lowercase UUID matching the Kubernetes `metadata.uid`
            that operators see in `kubectl get pod -o yaml`.
          example: "11111111-1111-1111-1111-111111111111"
        spiffe_id:
          type: string
          description: |
            SPIFFE ID assigned to that pod's service account
            (`spiffe://{trust_domain}/ns/{namespace}/sa/{service_account}`
            by convention).
          example: "spiffe://cluster.local/ns/default/sa/api"
        workload_spiffe_hash:
          type: integer
          format: int64
          description: |
            First 8 bytes of SHA-256 over the SPIFFE ID, big-endian as
            `u64`. Matches the value the eBPF `OrigDst{4,6}` map carries,
            for cross-correlation with node-agent telemetry. May exceed
            JavaScript's safe integer range; treat as opaque when
            consumed from JS clients.
        orig_dst4_cookies:
          type: integer
          format: int64
          description: |
            Number of socket cookies currently mapped to this pod via the
            IPv4 original-destination map. `0` means the pod is enrolled
            but has no in-flight outbound connection on IPv4.
        orig_dst6_cookies:
          type: integer
          format: int64
          description: |
            Number of socket cookies currently mapped to this pod via the
            IPv6 original-destination map. `0` means the pod is enrolled
            but has no in-flight outbound connection on IPv6.
        has_policy_scope:
          type: boolean
          description: |
            `true` iff a per-pod `PolicyScopeCache` is installed for this
            pod via `install_policy_scopes`. When `false`, mesh-authz
            falls back to the shared slice-level scope.

    NodeWaypointIdentitiesResponse:
      type: object
      required: [identity_count, cookies, identities]
      properties:
        identity_count:
          type: integer
          format: int64
          description: |
            Total number of enrolled pod identities. Equal to
            `identities.length`.
        cookies:
          type: object
          required: [orig_dst4, orig_dst6]
          description: |
            Total cookie-record counts across all enrolled pods, split by
            address family. Useful as a quick "1k cookies / 10 identities"
            sanity check without summing per-identity entries.
          properties:
            orig_dst4:
              type: integer
              format: int64
              description: Total IPv4 cookie records currently tracked.
            orig_dst6:
              type: integer
              format: int64
              description: Total IPv6 cookie records currently tracked.
        identities:
          type: array
          description: |
            One entry per enrolled pod identity, sorted by `pod_uid` so
            polling produces stable output. Entries with zero cookies are
            kept — enrolled-but-idle pods are operationally interesting.
          items:
            $ref: "#/components/schemas/NodeWaypointIdentityEntry"

    # ── Service-Waypoint Services ─────────────────────────────────────
    ServiceWaypointServiceEntry:
      type: object
      required: [namespace, name, ports, workload_count]
      properties:
        namespace:
          type: string
          description: Namespace of the admitted mesh service.
          example: default
        name:
          type: string
          description: Mesh service name admitted by the waypoint binding.
          example: reviews
        ports:
          type: array
          description: Service ports exposed by this mesh service.
          items:
            type: integer
            minimum: 1
            maximum: 65535
          example: [8080]
        workload_count:
          type: integer
          format: int64
          description: Number of workload SPIFFE references behind this service in the installed slice.
          example: 3

    ServiceWaypointServicesResponse:
      type: object
      required: [waypoint_name, namespace, service_count, services]
      properties:
        waypoint_name:
          type: string
          description: GAMMA waypoint binding name requested by this DP.
          example: api-waypoint
        namespace:
          type: string
          description: Namespace of the installed mesh slice.
          example: default
        service_count:
          type: integer
          format: int64
          description: Number of services admitted into this waypoint slice.
          example: 2
        services:
          type: array
          description: Services admitted by the installed service-waypoint slice, in slice order.
          items:
            $ref: "#/components/schemas/ServiceWaypointServiceEntry"

    # ── API Specs ─────────────────────────────────────────────────────
    ApiSpecSummary:
      type: object
      description: |
        Summary record for a single API spec. Returned by `GET /api-specs`.
        The raw spec content (the OpenAPI/Swagger document) is intentionally
        omitted — use `GET /api-specs/{id}` to retrieve the full document.
      properties:
        id:
          type: string
          description: UUID of the spec
        proxy_id:
          type: string
          description: ID of the proxy owned by this spec
        namespace:
          type: string
          description: Namespace in which this spec and its resources live
        spec_version:
          type: string
          description: OpenAPI/Swagger version string detected from the document
          example: "3.1.0"
        spec_format:
          type: string
          enum: [json, yaml]
          description: Format in which the spec was submitted and is stored
        title:
          type: [string, "null"]
          description: "`info.title` from the spec document, if present"
        info_version:
          type: [string, "null"]
          description: "`info.version` from the spec document, if present"
        description:
          type: [string, "null"]
          description: |
            `info.description` from the spec, truncated to 4096 bytes at a
            UTF-8 character boundary if necessary.
        contact_name:
          type: [string, "null"]
          description: "`info.contact.name` from the spec, if present"
        contact_email:
          type: [string, "null"]
          description: "`info.contact.email` from the spec, if present"
        license_name:
          type: [string, "null"]
          description: "`info.license.name` from the spec, if present"
        license_identifier:
          type: [string, "null"]
          description: |
            `info.license.identifier` (OpenAPI 3.1+) or `info.license.url`
            fallback, if present.
        tags:
          type: array
          items:
            type: string
          description: |
            Top-level `tags[].name` entries from the spec, de-duplicated and
            sorted alphabetically. Empty array when no tags are defined.
        server_urls:
          type: array
          items:
            type: string
          description: |
            Server URLs: `servers[].url` for OpenAPI 3.x; for Swagger 2.0,
            constructed as `{scheme}://{host}{basePath}` for each scheme.
            Empty array when no server information is present.
        operation_count:
          type: integer
          format: int32
          description: |
            Count of HTTP method keys (`get`, `post`, `put`, `delete`,
            `options`, `head`, `patch`, `trace`) summed across all `paths.*`
            entries in the spec.
        uncompressed_size:
          type: integer
          format: int64
          description: Size in bytes of the uncompressed spec content
        content_hash:
          type: string
          description: Lowercase hex SHA-256 digest of the uncompressed spec content. Used as ETag value.
        content_encoding:
          type: string
          enum: [gzip]
          description: Encoding used for stored spec content (always `gzip`)
        created_at:
          type: string
          format: date-time
          description: When the spec was first submitted
        updated_at:
          type: string
          format: date-time
          description: When the spec was last replaced via `PUT /api-specs/{id}`

    ApiSpecListResponse:
      type: object
      description: Paginated response from `GET /api-specs`.
      required: [items, limit, offset, next_offset, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiSpecSummary"
          description: Spec summary records for the current page
        limit:
          type: integer
          format: uint32
          minimum: 1
          maximum: 200
          description: Page size applied after defaulting or capping
        offset:
          type: integer
          format: uint32
          minimum: 0
          maximum: 4294967295
          description: Number of items skipped
        next_offset:
          type: [integer, "null"]
          format: uint32
          minimum: 0
          maximum: 4294967295
          description: |
            Offset to use for the next page, or `null` when this is the last
            page or when the next offset cannot be represented. A non-null
            value is strictly greater than `offset` and equals
            `offset + items.length` while that value remains below `total`.
        total:
          type: integer
          format: int64
          minimum: 0
          description: Total number of matching API specs before pagination

    ApiSpecCreateResponse:
      type: object
      description: |
        Response body for a successful `POST /api-specs` (201) or
        `PUT /api-specs/{id}` (200). Provides the identifiers and content hash
        of the spec that was created or replaced.
      properties:
        id:
          type: string
          description: UUID of the spec (new on POST, unchanged on PUT)
        proxy_id:
          type: string
          description: ID of the proxy created or updated by this spec
        spec_version:
          type: string
          description: OpenAPI/Swagger version string from the document
        content_hash:
          type: string
          description: Lowercase hex SHA-256 of the uncompressed spec bytes. Fetch responses derive representation-specific ETags from this hash and the selected format.

    ApiSpecValidationError:
      type: object
      description: |
        Response body for 422 Unprocessable Entity from `POST /api-specs`,
        `PUT /api-specs/{id}`, or `DELETE /api-specs/{id}`. For POST/PUT, the
        spec document was parsed successfully and the Ferrum extensions were
        found, but one or more extracted resources failed structural validation
        or database cross-checks (e.g., duplicate `listen_path`, invalid plugin
        config). For DELETE, removing the spec-owned and cascaded resources
        would leave an invalid transaction-log schema graph or TCP-throttle
        plugin composition, or the compensation snapshot contains an
        unrestorable resource. An authoritative in-transaction rejection may
        omit `spec_version` and the failure `id`.
      properties:
        error:
          type: string
          example: "Spec validation failed"
        spec_version:
          type: string
          description: Version string detected from the submitted document, or from the stored spec for DELETE
        failures:
          type: array
          description: One entry per resource that failed validation
          items:
            type: object
            properties:
              resource_type:
                type: string
                enum: [proxy, upstream, upstream_graph, plugin, plugin_composition, plugin_graph, restore_snapshot]
                description: Kind of resource, upstream/plugin graph, or pre-delete restore snapshot that failed
              id:
                type: string
                description: ID of the resource (from the extension object)
              errors:
                type: array
                items:
                  type: string
                description: Human-readable validation error messages for this resource

    ApiSpecParseError:
      type: object
      description: |
        Response body emitted by `POST /api-specs` and `PUT /api-specs/{id}`
        when the spec document fails to parse or violates a Ferrum extension
        rule. The body shape is identical for both 400 and 422 — the status
        code indicates whether the problem is **structural** (400) or
        **semantic** (422). The discriminator is the `code` field below.
      properties:
        error:
          type: string
          description: Short human-readable summary (always `"Spec parse failed"`).
        code:
          type: string
          enum:
            - InvalidJson
            - InvalidYaml
            - UnknownVersion
            - MissingProxyExtension
            - MalformedExtension
            - ConsumerExtensionNotAllowed
            - PluginInvalidScope
            - PluginProxyIdMismatch
            - PluginContainsCredentials
            - ProxyUpstreamIdMismatch
            - InvalidTagName
            - UnsupportedExternalRef
            - SchemaTooDeep
          description: |
            Machine-readable error discriminant.

            **Parse-time / structural — returned as HTTP 400 Bad Request:**

            - `InvalidJson` — body is not valid JSON
            - `InvalidYaml` — body is not valid YAML
            - `UnknownVersion` — no recognised `swagger: "2.0"` or `openapi: "3.x.y"` at root
            - `MissingProxyExtension` — `x-ferrum-proxy` is absent
            - `MalformedExtension` — `x-ferrum-proxy`, `x-ferrum-upstream`, or `x-ferrum-plugins` failed to deserialise

            **Semantic / policy violations — returned as HTTP 422 Unprocessable Entity:**

            - `ConsumerExtensionNotAllowed` — `x-ferrum-consumers` is present (forbidden)
            - `PluginInvalidScope` — a plugin in `x-ferrum-plugins` has `scope: global` or `scope: proxy_group`
            - `PluginProxyIdMismatch` — a plugin's `proxy_id` does not match the spec's proxy ID
            - `PluginContainsCredentials` — a plugin's `config` contains a forbidden key (`credentials`, `keyauth`, `basicauth`, `jwt`, `hmac`, `mtls`, `consumer`, `consumer_id`, `consumer_groups`, or `consumers`)
            - `ProxyUpstreamIdMismatch` — `x-ferrum-proxy.upstream_id` conflicts with the `id` of the inline `x-ferrum-upstream`
            - `InvalidTagName` — a `tags[].name` contains a forbidden character (`"`, `%`, `_`, or `\`) that would break the SQL `has_tag` LIKE filter
            - `UnsupportedExternalRef` — `x-ferrum-validate` references an external `$ref`; only local refs are resolved into generated plugin config
            - `SchemaTooDeep` — `x-ferrum-validate` schema refs exceed the resolver depth limit
        details:
          type: string
          description: |
            Verbose error message — for `MalformedExtension` includes the
            offending extension name and the underlying serde error; for
            `Plugin*` codes includes the plugin id; for `InvalidTagName`
            includes the offending tag name and character. Includes field
            paths and values where applicable.
