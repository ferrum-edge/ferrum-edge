          $ref: "#/components/schemas/BuiltInCredentialType"
        description: >-
          Built-in credential type whose indexed entry to remove. Matches
          runtime `ALLOWED_CREDENTIAL_TYPES`.
      - name: index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
        description: Zero-based index of the credential entry to remove.
      - $ref: "#/components/parameters/XFerrumNamespace"
    delete:
      operationId: deleteConsumerCredentialByIndex
      summary: Remove a specific credential entry by index
      description: |
