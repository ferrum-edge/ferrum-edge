  # ── API Specs ────────────────────────────────────────────────────────
  /api-specs:
    get:
      operationId: listApiSpecs
      summary: List API spec metadata
      description: |
        Returns paginated summary records for all API specs in the namespace.
        Spec content (the raw OpenAPI/Swagger document) is intentionally omitted
        from list responses — use `GET /api-specs/{id}` to retrieve the full
        document for a specific spec.

        Defaults to 50 items per page, maximum 200. Default sort is
        `updated_at DESC` (most recently updated first). Use `sort_by` and
        `order` to change ordering. Use `offset` to page through results.

        Supports the following optional filters: `proxy_id`, `spec_version`
        (prefix match), `title_contains` (case-insensitive substring),
        `updated_since` (ISO-8601 timestamp), and `has_tag` (exact tag name).

        This read-only metadata endpoint requires at least the `viewer` role.

        This endpoint is available in database and CP modes. It returns 503 in
        DP and file modes where no database is present.
      tags: [API Specs]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: uint64
            minimum: 0
            maximum: 18446744073709551615
            default: 50
          description: |
            Maximum number of items to return. `0` selects the default of 50;
            values above 200 are accepted and capped at 200. Negative,
            non-integer, or values beyond the unsigned 64-bit range are
            rejected with `400`.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: uint32
            minimum: 0
            maximum: 4294967295
            default: 0
          description: |
            Number of items to skip. Negative, non-integer, or values above
            4294967295 are rejected with `400`.
        - name: proxy_id
          in: query
          required: false
          schema:
            type: string
          description: Exact match on `proxy_id`. Returns only the spec that owns this proxy.
        - name: spec_version
          in: query
          required: false
          schema:
            type: string
          description: |
            Prefix match on `spec_version`. For example, `spec_version=3.1`
            matches `3.1.0`, `3.1.1`, etc.
        - name: title_contains
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive substring match on `title`.
        - name: updated_since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: |
            Return only specs with `updated_at >= ?`. Accepts ISO-8601 /
            RFC-3339 format (e.g. `2026-04-01T00:00:00Z`).
        - name: has_tag
          in: query
          required: false
          schema:
            type: string
          description: |
            Exact tag membership filter. Returns only specs whose `tags` array
            contains this tag name.
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [updated_at, title, operation_count, created_at]
            default: updated_at
          description: |
            Column to sort results by. Allowed values: `updated_at` (default),
            `title`, `operation_count`, `created_at`. Any other value returns 400.
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: |
            Sort direction. `desc` (default) = largest/newest first; `asc` =
            smallest/oldest first. Any other value returns 400.
        - name: X-Ferrum-Namespace
          in: header
          required: false
          schema:
            type: string
          description: Namespace to operate in. Defaults to `FERRUM_NAMESPACE` when omitted.
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Paginated list of API spec summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSpecListResponse"
        "400":
          description: |
            Invalid query parameter — an unknown `sort_by` value, a SQL `LIKE`
            wildcard in a text filter, or a malformed `limit`/`offset`. As on
            every other list endpoint, malformed pagination is rejected rather
            than silently coerced to a default; `limit=0` still means the
            server default (50 here) and values above 200 are capped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      operationId: submitApiSpec
      summary: Submit an OpenAPI/Swagger spec bundle
      description: |
        Parses an OpenAPI 2.0 (Swagger), 3.0.x, 3.1.x, or 3.2.x specification
        document and atomically creates the embedded proxy, optional upstream,
        and proxy-scoped plugins as a single transactional bundle.

        This mutation requires the `admin` role.

        The spec document must contain Ferrum extension fields at the root:

        - **`x-ferrum-proxy`** (required) — a `Proxy` object that defines the
          route, backend, and protocol settings. Fields follow the same schema
          as `POST /proxies`.
        - **`x-ferrum-upstream`** (optional) — an `Upstream` object. When
          present, a new upstream load-balancer group is created and the proxy's
          `upstream_id` is automatically linked to it.
        - **`x-ferrum-plugins`** (optional) — an array of proxy-scoped
          `PluginConfig` objects. All plugins must have `scope: proxy` (or
          omit `scope`, which defaults to `proxy`). Global and proxy-group
          scopes are rejected.
        - **`x-ferrum-validate`** (optional) — `true` or an object to
          auto-generate a proxy-scoped `openapi_validator` plugin from the
          document's request/response schemas and media types. Local `$ref`s are resolved
          into plugin config; external `$ref`s are rejected with
          `UnsupportedExternalRef`.

        **Forbidden**: `x-ferrum-consumers` is rejected — use `POST /consumers`
        separately. Plugin `config` values must not contain credential or
        consumer fields (`credentials`, `keyauth`, `basicauth`, `jwt`, `hmac`,
        `mtls`, `consumer`, `consumer_id`, `consumer_groups`, `consumers`).
        `api_spec_id` is server-managed and must be omitted from
        `x-ferrum-proxy`, `x-ferrum-upstream`, and `x-ferrum-plugins`; copied
        ownership tags return a 422 validation response on both POST and PUT.

        **Content-Type detection**: `application/json` → JSON parser;
        `application/yaml` / `application/x-yaml` / `text/yaml` / `text/x-yaml` → YAML parser;
        other or missing Content-Type → autodetect by first non-whitespace byte
        (`{` → JSON, else YAML).

        **Body size limit**: controlled by `FERRUM_ADMIN_SPEC_MAX_BODY_SIZE_MIB`
        (default 25 MiB). Returns 413 when exceeded.

        **Ownership**: all created resources are tagged with the new spec's ID
        via `api_spec_id`. A `UNIQUE(namespace, proxy_id)` constraint prevents
        more than one spec per proxy. Deleting the spec (`DELETE /api-specs/{id}`)
        also deletes the proxy (and its plugins via FK cascade) and any
        spec-owned upstream.

        **OpenAPI validation**: when `x-ferrum-validate` is enabled, generated
        operation schemas are embedded in the spec-owned `openapi_validator`
        plugin. Schema-affecting `PUT` requests replace that plugin and rebuild
        only the affected runtime cache entry; documentation-only changes that
        leave the generated operations unchanged short-circuit via the resource
        hash. Direct edits to the generated plugin are ephemeral and are
        replaced by the next spec `PUT`.

        **Hot-path isolation**: specs are admin-only metadata. The gateway
        runtime never reads `api_specs` rows; spec submission does not affect
        in-flight request handling.

        See [docs/api_specs.md](../docs/api_specs.md) for the full extension
        contract, worked examples, and curl recipes.
      tags: [API Specs]
      parameters:
        - name: X-Ferrum-Namespace
          in: header
          required: false
          schema:
            type: string
          description: Namespace to operate in. Defaults to `FERRUM_NAMESPACE` when omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Raw OpenAPI or Swagger document in JSON format. Must contain
                `x-ferrum-proxy` at the root. See description for the full
                extension contract.
            example:
              openapi: "3.1.0"
              info:
                title: Orders API
                version: "1.4.0"
              x-ferrum-proxy:
                id: orders-proxy
                hosts: ["api.example.com"]
                listen_path: /orders
                backend_host: orders.internal
                backend_port: 8080
                backend_scheme: https
          application/yaml:
            schema:
              type: string
              description: |
                Raw OpenAPI or Swagger document in YAML format. Must contain
                `x-ferrum-proxy` at the root. Also accepted as
                `application/x-yaml`, `text/yaml`, or `text/x-yaml`.
          application/x-yaml:
            schema:
              type: string
          text/yaml:
            schema:
              type: string
          text/x-yaml:
            schema:
              type: string
      responses:
        "201":
          description: Spec accepted; proxy, upstream, and plugins created
          headers:
            Location:
              schema:
                type: string
              description: URL of the newly created spec (`/api-specs/{id}`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSpecCreateResponse"
        "400":
          description: |
            Spec document is structurally invalid (bad JSON/YAML, unrecognised
            OpenAPI/Swagger version, or missing/malformed `x-ferrum-*`
            extension). See `ApiSpecParseError.code` for which structural
            problem fired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSpecParseError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "409":
          description: A spec already exists for this proxy ID, a resource name / listen_path conflicts, or the embedded plugin associations would make mTLS DNS identities ambiguous
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request body exceeds `FERRUM_ADMIN_SPEC_MAX_BODY_SIZE_MIB` (default 25 MiB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Spec parsed successfully but failed Ferrum policy or per-resource
            validation. Two body shapes are possible:

            - **`ApiSpecParseError`** when a Ferrum extension violates a
              semantic rule (`ConsumerExtensionNotAllowed`,
              `PluginInvalidScope`, `PluginProxyIdMismatch`,
              `PluginContainsCredentials`, `ProxyUpstreamIdMismatch`,
              `InvalidTagName`).
            - **`ApiSpecValidationError`** when one or more extracted
              resources (proxy / upstream / plugin) failed structural
              validation or database cross-checks (duplicate `listen_path`,
              invalid plugin config, missing referenced upstream, etc.).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApiSpecValidationError"
                  - $ref: "#/components/schemas/ApiSpecParseError"
        "503":
          $ref: "#/components/responses/NamespaceAdmissionUnavailable"

  /api-specs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: API spec UUID returned by `POST /api-specs`

    get:
      operationId: getApiSpec
      summary: Retrieve a spec by ID
      description: |
        Returns the raw spec document (decompressed from its gzip-compressed
        storage). The response body is the original spec document in the format
        that was submitted (JSON or YAML), subject to content negotiation via
        the `Accept` header.

        **Content negotiation**:
        - `Accept: application/json` when the stored format is YAML → converts
          to JSON before responding.
        - `Accept: application/yaml` (or `application/x-yaml`/`text/yaml`) when
          the stored format is JSON → converts to YAML before responding.
        - `Accept: */*` or matching stored format → responds in stored format.

        **Conditional GET** (`If-None-Match`): the response includes a
        representation-specific `ETag` based on the uncompressed spec content
        plus the selected response format (`"<hash>-json"` or `"<hash>-yaml"`).
        Clients that send the matching `If-None-Match` value receive
        `304 Not Modified`, saving bandwidth on polling integrations. Responses
        include `Vary: Accept` because content negotiation affects the selected
        representation and ETag.

        The spec content is served as-is — the gateway does not rewrite any
        Ferrum extension fields in the response.

        This endpoint requires the `admin` role because the original document
        can contain sensitive upstream or plugin configuration.
      tags: [API Specs]
      parameters:
        - name: X-Ferrum-Namespace
          in: header
          required: false
          schema:
            type: string
          description: Namespace to operate in.
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag from a previous response. Returns 304 if the spec is unchanged.
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Spec document
          headers:
            Content-Type:
              schema:
                type: string
                enum: [application/json, application/yaml]
            ETag:
              schema:
                type: string
              description: Quoted representation-specific ETag, for example `"<sha256>-json"` or `"<sha256>-yaml"`.
            Vary:
              schema:
                type: string
                enum: [Accept]
              description: Response varies by the `Accept` request header.
            Cache-Control:
              schema:
                type: string
                enum: ["no-store"]
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/json:
              schema:
                type: object
                description: The raw spec document (JSON format)
            application/yaml:
              schema:
                type: string
                description: The raw spec document (YAML format)
        "304":
          description: Spec unchanged — ETag matches `If-None-Match`
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          description: Requested `Accept` header does not allow JSON or YAML.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    put:
      operationId: replaceApiSpec
      summary: Replace an existing spec bundle
      description: |
        Parses the new spec document and atomically replaces all resources that
        were originally created by this spec (tagged with `api_spec_id = {id}`).

        **Replacement semantics**: spec-owned resources (those with a matching
        `api_spec_id`) are deleted and re-created from the new document.
        Resources that were added to the same proxy via direct admin endpoints
        (e.g., a plugin added with `POST /plugins/config`) have `api_spec_id =
        null` and survive the replace unchanged.

        The spec must reference the same proxy ID as the original submission.
        Changing the proxy ID requires deleting the spec (`DELETE /api-specs/{id}`)
        and submitting a new one (`POST /api-specs`).

        **Idempotent PUT (resource-hash short-circuit)**: At submit time, the
        gateway computes a SHA-256 hash over the serialised proxy, upstream, and
        plugin definitions (the "resource bundle"). If a PUT supplies a bundle
        that produces the same hash as the stored one — for example, when only
        `info.description` or other doc-only fields changed — the proxy, upstream,
        and plugin rows are left untouched. Their `updated_at` timestamps do NOT
        advance, and the polling cycle / DP gRPC broadcast sees no delta.
        The `api_specs` row is always updated (new `updated_at`, `content_hash`,
        and any changed metadata fields). This makes PUT safe to run on every
        CI/CD deploy cycle without causing unnecessary cache rebuilds.

        `created_at` is preserved from the original spec; `updated_at` and
        `content_hash` reflect the new document.

        The request body, content negotiation, and validation rules are identical
        to `POST /api-specs`.

        This mutation requires the `admin` role.
      tags: [API Specs]
      parameters:
        - name: X-Ferrum-Namespace
          in: header
          required: false
          schema:
            type: string
          description: Namespace to operate in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: New OpenAPI or Swagger document in JSON format
          application/yaml:
            schema:
              type: string
              description: New OpenAPI or Swagger document in YAML format
          application/x-yaml:
            schema:
              type: string
          text/yaml:
            schema:
              type: string
          text/x-yaml:
            schema:
              type: string
      responses:
        "200":
          description: Spec replaced; spec-owned resources recreated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSpecCreateResponse"
        "400":
          description: |
            New spec is structurally invalid (bad JSON/YAML, unrecognised
            OpenAPI/Swagger version, or missing/malformed `x-ferrum-*`
            extension). See `ApiSpecParseError.code` for which structural
            problem fired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSpecParseError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A resource name / listen_path in the new spec conflicts with an existing resource outside this bundle, or the replacement would make mTLS DNS identities ambiguous
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request body exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            New spec parsed successfully but failed Ferrum policy or
            per-resource validation. Two body shapes are possible:

            - **`ApiSpecParseError`** when a Ferrum extension violates a
              semantic rule (`ConsumerExtensionNotAllowed`,
              `PluginInvalidScope`, `PluginProxyIdMismatch`,
              `PluginContainsCredentials`, `ProxyUpstreamIdMismatch`,
              `InvalidTagName`).
            - **`ApiSpecValidationError`** when one or more extracted
              resources failed structural validation or database
              cross-checks.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApiSpecValidationError"
                  - $ref: "#/components/schemas/ApiSpecParseError"
        "503":
          $ref: "#/components/responses/NamespaceAdmissionUnavailable"

    delete:
      operationId: deleteApiSpec
      summary: Delete a spec and cascade its owned resources
      description: |
        Deletes the API spec and cascades the deletion to all resources it owns:

        - **Proxy** (spec-owned, always present): deleted. Its proxy-scoped plugin
          configs are deleted by the database FK cascade, including both spec-owned
          plugins and any plugins added manually via `POST /plugins/config`.
        - **Upstream** (spec-owned, if present): deleted. Upstreams that were
          created manually outside the spec (`api_spec_id = null`) are not
          affected.
        - **Spec row**: deleted.

        The proxy is also deleted when `DELETE /proxies/{id}` is called directly —
        the database `ON DELETE CASCADE` constraint removes the spec row in that
        case too.

        Before deletion, Ferrum validates the prospective namespace plugin graph
        after applying every spec-owned and proxy cascade. The request returns
        422 without deleting anything when a retained enabled plugin would be
        left with a dangling `schema_ref`, or when the cascade would leave a
        global TCP connection throttle without a supported TCP/TCP+TLS target.

        Ferrum also validates that the complete pre-delete compensation snapshot
        is owned and shaped so it can be restored atomically. A cascade plugin
        owned by another API spec, an explicitly associated global plugin, a
        proxy-scoped association targeting another proxy, a global plugin carrying
        the deleted proxy ID, a proxy-group plugin carrying `proxy_id`, or an
        embedded proxy association naming a missing plugin config returns a
        structured 422 validation failure without deleting anything.

        If namespace admission is lost after deletion commits, SQL backends and
        replica-set MongoDB compensate in one transaction: the spec-owned and
        current hand-owned upstream snapshots, proxy, spec-owned and hand-owned
        cascade plugins, associations, API-spec row, and config-change records
        are all restored or all remain deleted. The
        recovered proxy's current upstream, plugin-composition, and named-schema
        dependencies are revalidated before commit. A standalone MongoDB
        deployment fails closed before compensation writes because it cannot
        provide that multi-document atomic boundary.

        Returns 204 on success, 404 if the spec does not exist, or 422 when the
        prospective deletion fails plugin-graph or restore-snapshot validation.

        This mutation requires the `admin` role.
      tags: [API Specs]
      parameters:
        - name: X-Ferrum-Namespace
          in: header
          required: false
          schema:
            type: string
          description: Namespace to operate in.
      responses:
        "204":
          description: Spec and spec-owned resources deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: |
            Deleting the spec and its cascaded resources would leave an invalid
            aggregate plugin-composition graph in the namespace, such as a dangling
            transaction-log `schema_ref` or a global TCP connection throttle
            with no supported TCP/TCP+TLS target, or the pre-delete compensation
            snapshot contains foreign ownership, an unrestorable plugin scope/proxy
            association, or an embedded proxy association naming a missing plugin
            config. The response identifies the offending restore-snapshot
            resource and validation details. No resources are deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSpecValidationError"
        "503":
          $ref: "#/components/responses/NamespaceAdmissionUnavailable"

  /api-specs/by-proxy/{proxy_id}:
    parameters:
      - name: proxy_id
        in: path
        required: true
        schema:
          type: string
        description: Proxy ID to look up

    get:
      operationId: getApiSpecByProxy
      summary: Retrieve the spec for a given proxy
      description: |
        Looks up the API spec that owns the given proxy ID and returns its
        raw document with the same content-negotiation and conditional-GET
        (`ETag`/`If-None-Match`) semantics as `GET /api-specs/{id}`.

        Since the `(namespace, proxy_id)` pair is unique, this endpoint
        returns a single spec or 404 when no spec exists for the proxy.

        Useful when the proxy ID is known (e.g., from a CI/CD pipeline
        that created the proxy) but the spec UUID is not stored.

        This endpoint requires the `admin` role because the original document
        can contain sensitive upstream or plugin configuration.
      tags: [API Specs]
      parameters:
        - name: X-Ferrum-Namespace
          in: header
          required: false
          schema:
            type: string
          description: Namespace to operate in.
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag from a previous response. Returns 304 if the spec is unchanged.
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Spec document for the given proxy
          headers:
            ETag:
              schema:
                type: string
              description: Quoted representation-specific ETag, for example `"<sha256>-json"` or `"<sha256>-yaml"`.
            Vary:
              schema:
                type: string
                enum: [Accept]
              description: Response varies by the `Accept` request header.
            Cache-Control:
              schema:
                type: string
                enum: ["no-store"]
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/json:
              schema:
                type: object
                description: The raw spec document (JSON format)
            application/yaml:
              schema:
                type: string
                description: The raw spec document (YAML format)
        "304":
          description: Spec unchanged — ETag matches `If-None-Match`
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          description: Requested `Accept` header does not allow JSON or YAML.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

# ════════════════════════════════════════════════════════════════════════
components:
  # ── Security ────────────────────────────────────────────────────────
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256-signed admin JWT. Configure the secret, issuer, and max TTL via
        environment variables:

        | Variable | Default | Description |
        |----------|---------|-------------|
        | `FERRUM_ADMIN_JWT_SECRET` | *(required)* | Signing key (minimum 32 characters) |
        | `FERRUM_ADMIN_JWT_ISSUER` | `ferrum-edge` | Expected `iss` claim |
        | `FERRUM_ADMIN_JWT_MAX_TTL` | `3600` | Max token lifetime (seconds); `0` disables the cap |

        Tokens must include `iss`, `sub`, `exp`, `iat`, `nbf`, `jti`, and a
        string `role` claim. `iss` must match `FERRUM_ADMIN_JWT_ISSUER`; `nbf`
        and `exp` are validated. `FERRUM_ADMIN_JWT_MAX_TTL` is enforced against
        verifier time, not just the claims, counting the accepted clock-skew
        leeway (60 seconds) exactly once: `exp - iat` must be positive and
        within the maximum, `iat` must not be later than verifier time plus the
        leeway, `exp - now` must stay within the maximum plus that same leeway,
        and `exp` must still be in the future at verifier time (no expiry
        grace on the cap path). Effective maximum real validity is
        `FERRUM_ADMIN_JWT_MAX_TTL + 60s`, so future-shifted timestamps cannot
        extend a token's real lifetime. A configured value above
        `9223372036854775807` is rejected at startup as invalid rather than
        treated as unlimited. Required `role` claim values are `viewer`,
        `operator`, and `admin`. Tokens without a valid `role` claim are
        rejected.

    metricsBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: |
        Dedicated `FERRUM_METRICS_BEARER_TOKEN` accepted only by observability
        scrape/detail surfaces such as exact `/metrics` and detailed
        `/health`/`/status`/`/overload`. CIDR-based metrics access is configured
        separately with `FERRUM_METRICS_ALLOWED_CIDRS` and cannot be represented
        as an OpenAPI security scheme.

  # ── Reusable parameters ────────────────────────────────────────────
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource UUID

    XFerrumNamespace:
      name: X-Ferrum-Namespace
      in: header
      required: false
      schema:
        type: string
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
        maxLength: 254
        default: ferrum
      description: |
        Scopes the request to a specific namespace. Defaults to `ferrum`.
        Must start with an alphanumeric character and contain only
        alphanumeric characters, dots, underscores, or hyphens (max 254
        chars) — same rules as resource IDs (see `validate_namespace` in
        `src/config/types.rs`).

        On write operations, this value overrides the `namespace` field in
        the request body (which is therefore effectively read-only on the
        wire). Resources from other namespaces are not visible to this
        request and uniqueness constraints apply per-namespace.

    PaginationOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9223372036854775807
        default: 0
      description: |
        Number of items to skip. Non-integer, negative, or values beyond the
        backend-safe range (`2^63 - 1`) are rejected with `400` rather than
        coerced. List endpoints return a paginated envelope containing `data`
        and `pagination` fields even when this parameter is omitted.

    PaginationLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: uint64
        minimum: 0
        maximum: 18446744073709551615
        default: 100
      description: |
        Maximum number of items to return. When omitted, the server applies the
        default of 100; list endpoints never return unbounded collections
        (`GET /backup` is the intentional full-export mechanism). `0` is
        coerced to the default of 100, and values above 1000 are capped at
        1000. Non-integer or negative values are rejected with `400`.
        Values beyond the unsigned 64-bit range are also rejected with `400`.
        List endpoints return a paginated envelope containing `data` and
        `pagination` fields even when this parameter is omitted.

  # ── Reusable headers ───────────────────────────────────────────────
  headers:
    X-Data-Source:
      description: |
        Present with value `cached` when the response was served from the
        in-memory config cache instead of the primary database.
      required: false
      schema:
        type: string
        enum: [cached]

  # ── Reusable responses ─────────────────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated token lacks the required admin role or its namespace claim does not authorize the selected namespace
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReadOnly:
      description: Admin API is in read-only mode, the token role cannot perform this mutation, or its namespace claim does not authorize the selected namespace
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Admin API is in read-only mode
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource already exists, conflicts with an existing resource, or the mutation would make mTLS DNS identities ambiguous
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Upstream ACME directory or provider operation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Database unavailable and no cached config
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NamespaceAdmissionUnavailable:
      description: >-
        The mutation is temporarily unavailable. For namespace contention, the
        namespace is fenced by another mutation or an intentionally retained
        uncertain operation; retry after the indicated delay. Operators must
        recover a retained uncertain fence before retries can succeed.
      headers:
        Retry-After:
          required: false
          description: >-
            Minimum delay in seconds before retrying; present for
            namespace-admission contention.
          schema:
            type: integer
            minimum: 1
            example: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Namespace mutation is temporarily unavailable; retry later
    NotImplemented:
      description: Capability is not available in this build
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  # ── Schemas ─────────────────────────────────────────────────────────
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: [string, "null"]
          description: Human-readable error message

    AcmeCertificateRecordListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AcmeCertificateRecord"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AcmeCertificateRecord:
      type: object
      required: [id, domains, directory_url, status, source_uri, created_at, updated_at]
      properties:
        id:
          type: string
        domains:
          type: array
          items:
            type: string
        directory_url:
          type: string
          examples:
            - https://acme-v02.api.letsencrypt.org/directory
            - https://acme-staging-v02.api.letsencrypt.org/directory
        account_id:
          type: string
        order_url:
          type: string
        status:
          type: string
          enum: [issued, renewing, failed, revoked]
        source_uri:
          type: string
          examples:
            - acme://certificates/edge-cert
        subject:
          type: string
        issuer:
          type: string
        sans:
          type: array
          items:
            type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        fingerprint_sha256:
          type: string
          description: SHA-256 fingerprint of public certificate material. Private keys are never returned.
        certificate_count:
          type: integer
        byte_length:
          type: integer
          description: Public certificate material byte length, including intermediate chain PEM.
        issued_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AcmeCertificateRequest:
      type: object
      required: [domains, directory_url, cert_pem, key_pem]
      properties:
        id:
          type: string
          description: Optional stable id. Generated when omitted on create.
        domains:
          type: array
          minItems: 1
          items:
            type: string
          description: DNS identifiers covered by the ACME certificate.
        directory_url:
          type: string
          description: >-
            ACME directory URL that issued the certificate. Must be an absolute
            `https` URL with a host. Literal IP hosts must be public addresses;
            private/reserved literals (loopback, RFC1918, link-local, ULA, and the
            `169.254.169.254` metadata address) are rejected to limit SSRF. Hostnames
            are not resolved here, so a hostname that points at a private IP is not
            blocked by this check — apply network-level egress controls as well.
        account_id:
          type: string
          description: Optional ACME account identifier or URL.
        order_url:
          type: string
          description: Optional ACME order URL.
        cert_pem:
          type: string
          description: Leaf certificate PEM.
        key_pem:
          type: string
          description: Private key PEM. Persisted but never returned.
        chain_pem:
          type: string
          description: Optional intermediate chain PEM.
        allow_overwrite:
          type: boolean
          default: false
        allow_expired:
          type: boolean
          default: false
        cert_expiry_warning_days:
          type: integer
          format: int64
          default: 30

    AcmeOrderListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AcmeOrder"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AcmeAccountListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AcmeAccount"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AcmeAccount:
      type: object
      required: [account_id, directory_url, order_count, certificate_count, has_persisted_credentials]
      properties:
        account_id:
          type: string
          description: ACME account URL or identifier.
        directory_url:
          type: string
        order_count:
          type: integer
        certificate_count:
          type: integer
        has_persisted_credentials:
          type: boolean
          description: Whether at least one stored order can resume this account. The credentials are never returned.
        last_order_at:
          type: string
          format: date-time
        last_certificate_updated_at:
          type: string
          format: date-time

    AcmeOrder:
      type: object
      required: [id, domains, directory_url, status, created_at, updated_at]
      properties:
        id:
          type: string
        certificate_id:
          type: string
          description: ACME certificate record id that should receive the issued certificate.
        domains:
          type: array
          items:
            type: string
        directory_url:
          type: string
        account_id:
          type: string
        order_url:
          type: string
        status:
          type: string
          enum: [pending_challenges, ready, processing, valid, failed, cancelled]
        http01_challenges:
          type: array
          items:
            $ref: "#/components/schemas/AcmeHttp01Challenge"
        tls_alpn01_challenges:
          type: array
          items:
            $ref: "#/components/schemas/AcmeTlsAlpn01Challenge"
        dns01_challenges:
          type: array
          items:
            $ref: "#/components/schemas/AcmeDns01Challenge"
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AcmeHttp01Challenge:
      type: object
      required: [identifier, token, key_authorization, path]
      properties:
        identifier:
          type: string
        token:
          type: string
        key_authorization:
          type: string
          description: Public HTTP-01 response body served for this token.
        path:
          type: string
          example: /.well-known/acme-challenge/abc_DEF-123

    AcmeTlsAlpn01Challenge:
      type: object
      required: [identifier, token, key_authorization_sha256_base64url, alpn_protocol]
      properties:
        identifier:
          type: string
          description: DNS name used as SNI for the TLS-ALPN-01 validation handshake.
        token:
          type: string
        key_authorization_sha256_base64url:
          type: string
          description: Base64url-encoded SHA-256 digest embedded in the critical acmeIdentifier extension.
        alpn_protocol:
          type: string
          enum: [acme-tls/1]

    AcmeDns01Challenge:
      type: object
      required: [identifier, token, txt_record_name, txt_value]
      properties:
        identifier:
          type: string
          description: DNS identifier authorized by the DNS-01 challenge.
        token:
          type: string
        txt_record_name:
          type: string
          example: _acme-challenge.example.com
        txt_value:
          type: string
          description: TXT value that must be published before finalizing the order.

    AcmeOrderRequest:
      type: object
      required: [domains, directory_url]
      properties:
        id:
          type: string
          description: Optional stable order id. Generated when omitted.
        certificate_id:
          type: string
          description: Optional target ACME certificate id for the issued cert.
        domains:
          type: array
          minItems: 1
          items:
            type: string
        directory_url:
          type: string
          description: >-
            ACME directory URL. Must be an absolute `https` URL with a host. Literal
            IP hosts must be public addresses; private/reserved literals (loopback,
            RFC1918, link-local, ULA, and the `169.254.169.254` metadata address) are
            rejected to limit SSRF. Hostnames are not resolved here, so a hostname that
            points at a private IP is not blocked by this check — apply network-level
            egress controls as well.
        contact:
          type: array
          items:
            type: string
          description: ACME account contact URIs such as `mailto:ops@example.com`.
        terms_of_service_agreed:
          type: boolean
          default: false
        challenge_type:
          type: string
          enum: [http01, tls_alpn01, dns01]
          default: http01
          description: ACME challenge type to prepare for this order.
        existing_account_credentials_json:
          type: string
          description: Previously persisted instant-acme account credentials JSON. Persisted but never returned.
        allow_overwrite:
          type: boolean
          default: false

    AcmeOrderFinalizeRequest:
      type: object
      properties:
        certificate_id:
          type: string
          description: Optional override for the ACME certificate record id. Defaults to the order certificate_id, then the order id.
        poll_timeout_seconds:
          type: integer
          format: int64
          default: 60
          minimum: 1
          maximum: 600
          description: Maximum time spent polling ACME order readiness and certificate issuance.
        allow_overwrite:
          type: boolean
          default: false
          description: Replace an existing ACME certificate record with the target id.
        allow_expired:
          type: boolean
          default: false
          description: Permit the fetched certificate to be expired during validation.
        cert_expiry_warning_days:
          type: integer
          format: int64
          default: 30

    AcmeOrderFinalizeResponse:
      type: object
      required: [order, certificate]
      properties:
        order:
          $ref: "#/components/schemas/AcmeOrder"
        certificate:
          $ref: "#/components/schemas/AcmeCertificateRecord"

    AcmeRenewRequest:
      type: object
      properties:
        id:
          type: string
          description: Optional stable renewal order id. Generated when omitted.
        contact:
          type: array
          items:
            type: string
          description: ACME account contact URIs used only when a new account must be created.
        terms_of_service_agreed:
          type: boolean
          default: false
        challenge_type:
          type: string
          enum: [http01, tls_alpn01, dns01]
          default: http01
          description: ACME challenge type to prepare for the renewal order.
        existing_account_credentials_json:
          type: string
          description: Optional instant-acme account credentials JSON. Persisted in the renewal order but never returned.
        allow_overwrite:
          type: boolean
          default: false
          description: Replace an existing order with the same id.

    ManagedTlsRecordListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ManagedTlsRecord"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ManagedTlsRecord:
      type: object
      required: [id, name, kind, source_uri, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [certificate, ca_bundle, crl, ocsp_response, jwks]
        source_uri:
          type: string
          examples:
            - managed://certificates/edge-cert
            - managed://ca-bundles/internal-ca
            - managed://ocsp-responses/edge-ocsp
        subject:
          type: string
        issuer:
          type: string
        sans:
          type: array
          items:
            type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        fingerprint_sha256:
          type: string
          description: SHA-256 fingerprint of public material. Private keys are never returned.
        certificate_count:
          type: integer
        crl_count:
          type: integer
        byte_length:
          type: integer
          description: Decoded public material byte length, including DER OCSP response length.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ManagedTlsCertificateRequest:
      type: object
      required: [cert_pem, key_pem]
      properties:
        id:
          type: string
          description: Optional stable id. Generated when omitted on create.
        name:
          type: string
        description:
          type: string
        cert_pem:
          type: string
          description: Leaf certificate PEM.
        key_pem:
          type: string
          description: Private key PEM. Persisted but never returned.
        chain_pem:
          type: string
          description: Optional intermediate chain PEM.
        allow_overwrite:
          type: boolean
          default: false
        allow_expired:
          type: boolean
          default: false
        cert_expiry_warning_days:
          type: integer
          format: int64
          default: 30

    ManagedTlsCaBundleRequest:
      type: object
      required: [ca_bundle_pem]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        ca_bundle_pem:
          type: string
        allow_overwrite:
          type: boolean
          default: false
        allow_expired:
          type: boolean
          default: false
        cert_expiry_warning_days:
          type: integer
          format: int64
          default: 30

    ManagedTlsCrlRequest:
      type: object
      required: [crl_pem]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        crl_pem:
          type: string
        allow_overwrite:
          type: boolean
          default: false

    ManagedTlsOcspResponseRequest:
      type: object
      required: [ocsp_der_base64]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        ocsp_der_base64:
          type: string
          description: Base64-encoded DER OCSP response bytes. The decoded response must be non-empty.
        allow_overwrite:
          type: boolean
          default: false

    ManagedTlsJwksRequest:
      type: object
      required: [jwks_json]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        jwks_json:
          type: string
          description: JSON Web Key Set document. Must contain a non-empty `keys` array.
        allow_overwrite:
          type: boolean
          default: false

    TlsInventoryListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TlsInventoryEntry"
        pagination:
          $ref: "#/components/schemas/Pagination"

    TlsInventoryEntry:
      type: object
      required: [id, material_kind, source, state, used_by]
      properties:
        id:
          type: string
          description: Stable non-secret inventory ID derived from material kind and source identity.
        material_kind:
          type: string
          enum: [certificate, private_key, ca_bundle, crl, jwks, ocsp, unknown]
        source:
          $ref: "#/components/schemas/TlsInventorySource"
        state:
          type: string
          enum: [loaded, unsupported, unavailable, invalid]
        used_by:
          type: array
          items:
            $ref: "#/components/schemas/TlsInventoryUsage"
        subject:
          type: string
        issuer:
          type: string
        sans:
          type: array
          items:
            type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        days_until_expiry:
          type: integer
          format: int64
        fingerprint_sha256:
          type: string
          description: SHA-256 fingerprint of the leaf certificate. Not populated for private keys.
        certificate_count:
          type: integer
        crl_count:
          type: integer
        error:
          type: string
          description: Non-secret load or parse error when state is not `loaded`.

    TlsInventorySource:
      type: object
      required: [kind, identifier, refreshable]
      properties:
        kind:
          type: string
          description: Source scheme such as `file`, `vault`, `aws`, `k8s`, `acme`, `managed`, or `pkcs11`.
        identifier:
          type: string
          description: Non-secret source identifier. Inline PEM is returned as `inline-pem:<redacted>`.
        refreshable:
          type: boolean
        version:
          type: string

    TlsInventoryUsage:
      type: object
      required: [surface, role, resource_type, resource_id, field]
      properties:
        surface:
          type: string
          examples: [frontend_tls, backend_tls, admin_tls, dtls, cp_grpc_tls, dp_grpc_tls, database_tls, gateway_svid]
        role:
          type: string
          examples: [server_certificate, private_key, client_ca_bundle, server_ca_bundle]
        resource_type:
          type: string
          examples: [env, proxy, upstream, plugin_config]
        resource_id:
          type: string
        field:
          type: string

    TlsEventListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TlsSourceEvent"
        pagination:
          $ref: "#/components/schemas/Pagination"

    TlsSourceEvent:
      type: object
      required: [id, at, surface, outcome, sources]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        surface:
          type: string
        outcome:
          type: string
          enum: [rotated, load_error, rebuild_error]
        sources:
          type: array
          items:
            $ref: "#/components/schemas/TlsSourceEventMaterial"
        revision:
          type: integer
          format: int64
          description: Surface revision after a successful rotation.
        error:
          type: string
          description: Non-secret error string for failed load or rebuild events.

    TlsSourceEventMaterial:
      type: object
      required: [label, cert_id, source_id, scheme, kind]
      properties:
        label:
          type: string
          examples: [cert, key, client_ca]
        cert_id:
          type: string
          description: Stable event source ID derived from material kind and non-secret source identity.
        source_id:
          type: string
          description: Non-secret source identifier. Inline PEM is redacted.
        scheme:
          type: string
          examples: [file, vault, aws, azure, gcp, k8s, acme, managed, pkcs11]
        kind:
          type: string
          examples: [cert, key, ca_bundle, crl, ocsp]
        fingerprint_sha256:
          type: string
          description: Source material fingerprint for non-key material. Omitted for private keys.

    TlsValidateRequest:
      type: object
      properties:
        cert_pem:
          type: string
          description: PEM certificate chain to validate with `key_pem`.
        key_pem:
          type: string
          description: PEM private key that must match `cert_pem`.
        ca_bundle_pem:
          type: string
          description: PEM CA bundle to parse and expiry-check.
        crl_pem:
          type: string
          description: PEM CRL bundle to parse.
        allow_expired:
          type: boolean
          default: false
          description: Skip notBefore/notAfter checks for submitted certificates.
        cert_expiry_warning_days:
          type: integer
          format: int64
          minimum: 0
          default: 30
          description: Warning threshold used during certificate expiry checks.

    TlsValidateResponse:
      type: object
      required: [valid, validated]
      properties:
        valid:
          type: boolean
          example: true
        validated:
          type: object
          additionalProperties: true
          description: Per-material validation summary.

    AuditEvent:
      type: object
      required:
        - id
        - ts
        - actor
        - action
        - resource_type
        - resource_id
        - namespace
        - diff
      properties:
        id:
          type: string
          description: Audit event UUID
        ts:
          type: string
          format: date-time
          description: Event timestamp
        actor:
          type: string
          description: JWT `sub` claim of the admin actor
        action:
          type: string
          description: Mutation action, such as `create`, `update`, `delete`, or `restore`
        resource_type:
          type: string
          description: Mutated resource category
        resource_id:
          type: string
          description: Mutated resource ID
        namespace:
          type: string
          description: Namespace selected by `X-Ferrum-Namespace`
        diff:
          type: object
          additionalProperties: true
          description: >-
            Redacted JSON diff for the successful mutation. Basic credential
            changes expose only the credential type, action, and a stable
            `[REDACTED]` marker, never values, entry fields, shape, or count.
            Unknown/custom credential types are omitted from audit payloads so
            their unmodeled values cannot be disclosed.
            Sensitive plugin configuration is also redacted; loki_logging
            endpoint paths/queries, authorization, and custom-header values
            are never persisted.

    AuditEventListResponse:
      type: object
      required: [items, limit, offset, next_offset, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        limit:
          type: integer
          format: uint32
          minimum: 1
          maximum: 1000
        offset:
          type: integer
          format: uint32
          minimum: 0
          maximum: 4294967295
        next_offset:
          type: [integer, "null"]
          format: uint32
          minimum: 0
          maximum: 4294967295
          description: |
            Strictly advancing offset for the next page, or `null` when no
            further page exists or the next offset cannot be represented.
        total:
          type: integer
          format: int64
          minimum: 0

    # ── Proxy ───────────────────────────────────────────────────────
    Proxy:
      type: object
      required:
        - backend_host
        - backend_port
      properties:
        id:
          type: string
          description: >-
            Unique identifier (UUID auto-generated if omitted or empty on create).
            Custom IDs must start with an alphanumeric character and contain only
            alphanumeric characters, dots, underscores, or hyphens (max 254 chars).
          pattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
          maxLength: 254
        namespace:
          type: string
          default: ferrum
          readOnly: true
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
          maxLength: 254
          description: >-
            Namespace this proxy belongs to. Read-only on the wire — set from
            the `X-Ferrum-Namespace` request header (or the `ferrum` default)
            on every create/update; any value in the request body is ignored.
            See the API description for namespace semantics.
        name:
          type: [string, "null"]
          description: >-
            Optional friendly name. Must be unique across all proxies when set.
        listen_path:
          type: [string, "null"]
          description: >-
            URL path prefix, `=/exact-path`, or `~regex` this proxy matches.
            Must start with `/` for literal prefix matching, `=/` for exact
            whole-path matching, or `~` for regex matching
            (e.g., `~^/api/v[0-9]+$`). Regex patterns are compiled at creation
            time and auto-anchored with `^` and `$` for full-path matching if
            not already present. To allow sub-path matching, end the pattern
            with `.*` (e.g., `~/api/v[0-9]+/.*`).


            **Required for HTTP-family proxies UNLESS `hosts` is non-empty.** An
            HTTP proxy with neither `hosts` nor `listen_path` set is rejected —
            that would route every request on every host and collides with every
            other catch-all.


            **MUST be omitted / null for stream-family proxies** (`tcp`,
            `tcp_tls`, `udp`, `dtls`). Stream proxies route on `listen_port`.


            When `listen_path` is null on an HTTP proxy, the proxy matches any
            path under the configured `hosts`. `strip_listen_path` is a no-op
            (nothing to strip); `backend_path` (if set) prepends to the
            forwarded path.


            The combination of `(hosts, listen_path)` must be unique across all
            HTTP proxies in the same namespace.
          examples:
            - /api/v1
            - =/healthz
            - /users
            - "~/api/v[0-9]+/users/[^/]+"
        hosts:
          type: array
          items:
            type: string
          default: []
          description: >-
            Optional list of hostnames this proxy matches. Empty means match all
            hosts. Supports exact hostnames (`api.example.com`) and wildcard
            prefixes (`*.example.com`). Entries are normalized to lowercase on
            create/update. Must match the format `[a-z0-9]([a-z0-9.-]*[a-z0-9])?`
            for exact hosts or `*.[a-z0-9]([a-z0-9.-]*[a-z0-9])?` for wildcards.


            For HTTP-family proxies, either `hosts` or `listen_path` must be
            set (both may be set together). A host-only proxy (hosts set, no
            listen_path) matches any path under the configured hosts.
          examples:
            - ["api.example.com", "*.internal.example.com"]
        backend_scheme:
          oneOf:
            - $ref: "#/components/schemas/BackendScheme"
            - type: "null"
          description: >-
            Wire-level scheme the proxy uses to talk to its backend.
            Optional for HTTP-family proxies — defaults to `https` when
            omitted. **Required for stream-family proxies** (`tcp`, `tcps`,
            `udp`, `dtls`); validation rejects stream proxies that omit it.

            gRPC and WebSocket are no longer schemes — they are detected
            per-request from the incoming traffic (content-type,
            Upgrade/Connection headers, HTTP/2 Extended CONNECT). A single
            `https` proxy transparently serves a mix of REST, gRPC, and
            WebSocket traffic on the same backend pool.

            HTTPS backends are classified at startup for HTTP/1.1,
            HTTP/2, and HTTP/3 support. Plain HTTP traffic uses the
            native H3 backend pool automatically when the concrete target
            is classified as H3-capable.


            **WebSocket requests arriving over HTTP/3** are supported via
            RFC 9220 Extended CONNECT (`:method=CONNECT`,
            `:protocol=websocket`). The H3 frontend bridges to an HTTP/1.1
            Upgrade backend connection — the same `connect_websocket_backend()`
            helper the H1/H2 frontends use — so the backend sees a normal
            HTTP/1.1 WebSocket regardless of the frontend transport.
            Same plugin pipeline (`on_ws_frame`, `on_ws_disconnect`,
            sticky-session cookies). Gated by
            `FERRUM_HTTP3_WEBSOCKET_ENABLED` (default `true`); when
            false the H3 server does not advertise
            `SETTINGS_ENABLE_CONNECT_PROTOCOL` and the bridge returns 501.
        backend_host:
          type: string
          description: >-
            Backend server hostname or IP. Required when `upstream_id` is not set.
            When `upstream_id` is set, this field is ignored (upstream targets
            provide the backend address).
        backend_port:
          type: integer
          format: uint16
          default: 0
          description: >-
            Backend server port. Required (>= 1) when `upstream_id` is not set.
            When `upstream_id` is set, this field is ignored (upstream targets
            provide the backend port).
        backend_path:
          type: [string, "null"]

          description: Optional path prefix prepended to forwarded requests
        strip_listen_path:
          type: boolean
          default: true
          description: >-
            Strip the matched `listen_path` prefix before forwarding to the
            backend. No-op when `listen_path` is null (host-only proxies have
            no prefix to strip).
        preserve_host_header:
          type: boolean
          default: false
          description: Forward the original Host header to the backend
        backend_connect_timeout_ms:
          type: integer
          format: uint64
          default: 5000
          description: TCP connect timeout in milliseconds
        backend_read_timeout_ms:
          type: integer
          format: uint64
          minimum: 0
          default: 30000
          description: >-
            Backend read timeout in milliseconds (default 30000). For HTTP/gRPC
            proxies it bounds backend response reads and is also the total,
            not idle, deadline for any client request upload that Ferrum must
            buffer before backend dispatch. A buffered upload that exceeds the
            deadline is rejected with HTTP 408 or gRPC DEADLINE_EXCEEDED;
            streaming pass-through uploads are unaffected. For TCP proxies,
            this is a per-direction inactivity timeout on the backend read
            path. 0 disables these bounds.
        backend_write_timeout_ms:
          type: integer
          format: uint64
          minimum: 0
          default: 30000
          description: Backend write timeout in milliseconds. For TCP proxies, this is a per-direction inactivity timeout on the backend write path. 0 = disabled.
        backend_tls_client_cert_path:
          type: [string, "null"]
          maxLength: 4096
          description: Path to mTLS client certificate (PEM). Max 4096 characters.
        backend_tls_client_key_path:
          type: [string, "null"]
          maxLength: 4096
          description: Path to mTLS client private key (PEM). Max 4096 characters.
        backend_tls_verify_server_cert:
          type: boolean
          default: true
          description: Verify the backend's TLS certificate
        backend_tls_server_ca_cert_path:
          type: [string, "null"]
          maxLength: 4096
          description: Path to custom CA bundle for backend TLS verification. Max 4096 characters.
        dns_override:
          type: [string, "null"]

          description: Override DNS resolution with a specific IP address
        dns_cache_ttl_seconds:
          type: [integer, "null"]
          format: uint64
          description: DNS cache TTL override in seconds
        auth_mode:
          $ref: "#/components/schemas/AuthMode"
        plugins:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/PluginAssociation"
          description: Plugin configurations applied to this proxy
        pool_idle_timeout_seconds:
          type: [integer, "null"]
          format: uint64
          description: Idle connection timeout in seconds (overrides global)
        pool_enable_http_keep_alive:
          type: [boolean, "null"]
          description: Enable HTTP keep-alive (overrides global)
        pool_enable_http2:
          type: [boolean, "null"]
          description: Enable HTTP/2 keep-alive PINGs (overrides global)
        pool_tcp_keepalive_seconds:
          type: [integer, "null"]
          format: uint64
          description: TCP keep-alive probe interval (overrides global)
        pool_http2_keep_alive_interval_seconds:
          type: [integer, "null"]
          format: uint64
          description: HTTP/2 PING interval in seconds (overrides global)
        pool_http2_keep_alive_timeout_seconds:
          type: [integer, "null"]
          format: uint64
          description: HTTP/2 PING timeout in seconds (overrides global)
        pool_http2_initial_stream_window_size:
          type: [integer, "null"]
          format: uint32
          minimum: 65535
          maximum: 134217728
          description: |
            HTTP/2 initial per-stream flow-control window size in bytes (overrides global).
            Larger values improve single-stream throughput. Range: 65535–134217728 (128 MiB). Default: 8388608 (8 MiB).
        pool_http2_initial_connection_window_size:
          type: [integer, "null"]
          format: uint32
          minimum: 65535
          maximum: 134217728
          description: |
            HTTP/2 initial connection-level flow-control window size in bytes (overrides global).
            Aggregate budget shared across all concurrent streams. Range: 65535–134217728 (128 MiB). Default: 33554432 (32 MiB).
        pool_http2_adaptive_window:
          type: [boolean, "null"]
          description: |
            Enable adaptive flow-control (BDP probing) for HTTP/2 connections (overrides global).
            Enabled by default — BDP probing dynamically sizes flow-control windows for optimal throughput. Default: true.
        pool_http2_max_frame_size:
          type: [integer, "null"]
          format: uint32
          minimum: 16384
          maximum: 1048576
          description: |
            Maximum HTTP/2 frame payload size in bytes (overrides global).
            Range: 16384–1048576 (1 MiB). Default: 1048576 (1 MiB).
        pool_http2_max_concurrent_streams:
          type: [integer, "null"]
          format: uint32
          minimum: 1
          maximum: 2147483647
          description: |
            Maximum concurrent HTTP/2 streams per backend connection (overrides global).
            Range: 1–2147483647. Default: 1000.
        pool_http3_connections_per_backend:
          type: [integer, "null"]
          minimum: 1
          maximum: 256
          description: |
            Number of QUIC connections per HTTP/3 backend (overrides global
            FERRUM_HTTP3_CONNECTIONS_PER_BACKEND). Multiple connections distribute
            QUIC frame processing across driver tasks. Range: 1–256. Default: 4.
        pool_max_requests_per_connection:
          type: [integer, "null"]
          format: uint64
          minimum: 0
          maximum: 2147483647
          description: |
            Reserved for Istio DestinationRule
            `connectionPool.http.maxRequestsPerConnection`. The field is
            validated and persisted for schema compatibility, but currently has
            no runtime effect because reqwest/hyper do not expose a stable
            per-connection request cap for the shared client pool. Range:
            0–2147483647, where 0 preserves Istio's explicit unlimited value.
        upstream_id:
          type: [string, "null"]
          description: |
            Reference to an existing Upstream for load-balanced backends. When set,
            `backend_host` and `backend_port` are overridden by the selected
            upstream target. The referenced upstream must exist at creation time.
            Deleting an upstream that is referenced by a proxy is blocked.
        upstream_subset:
          type: [string, "null"]
          maxLength: 128
          description: |
            Named subset within `upstream_id` to route to. The subset must be
            defined in the referenced upstream's `subsets` list; invalid subset
            references are rejected during config/admin validation. Matching is
            exact: a target belongs to a subset when its `tags` contain every
            label in the subset selector with the same value.
        listen_port:
          type: [integer, "null"]
          format: uint16
          minimum: 1
          description: |
            Port for this TCP/UDP proxy to listen on (must be >= 1). Required when
            backend_scheme is tcp, tcps, udp, or dtls. Must NOT be set for HTTP
            proxies. Each stream proxy binds its own dedicated port; duplicate ports
            across stream proxies are rejected. In database mode, the Admin API also
            rejects ports that conflict with gateway reserved ports (proxy/admin/gRPC
            listeners) or are already bound on the host. In CP mode, local port
            checks are skipped since stream proxies run on remote DP nodes.
        frontend_tls:
          type: boolean
          default: false
          description: |
            Terminate encryption on the gateway side for incoming connections.
            For TCP: uses the gateway's TLS certificate.
            For UDP: uses DTLS with ECDSA P-256 or Ed25519 certificates
            (configured via FERRUM_DTLS_CERT_PATH/FERRUM_DTLS_KEY_PATH env vars).
        passthrough:
          type: boolean
          default: false
          description: |
            Forward encrypted client bytes directly to the backend without
            terminating TLS (TCP) or DTLS (UDP). The proxy peeks at the
            ClientHello to extract SNI for logging but does not decrypt traffic.
            Only valid for stream proxies (tcp, tcp_tls, udp, dtls).
            Mutually exclusive with frontend_tls.
        tcp_idle_timeout_seconds:
          type: [integer, "null"]
          format: uint64
          description: |
            TCP stream idle timeout in seconds. After this duration of no data transfer
            in either direction, the connection is closed. When omitted, uses the global
            FERRUM_TCP_IDLE_TIMEOUT_SECONDS (default: 300s / 5 min). Set to 0 to disable.
            Only applicable for tcp/tcp_tls protocols.
        stream_proxy_protocol:
          type: [boolean, "null"]
          description: |
            Enable inbound PROXY protocol (v1 text or v2 binary, auto-detected) on this
            stream proxy listener. When true, every inbound TCP connection must begin with a
            valid PROXY header; connections that do not are closed immediately (fail closed).

            Trust requirement: the forwarded address is honoured only when the socket peer
            (the load balancer's own IP) belongs to the FERRUM_TRUSTED_PROXIES CIDR set. A
            connection from an untrusted peer on a PROXY-protocol-enabled listener is also
            closed to prevent direct-connect clients from spoofing their source IP.

            After a trusted parse, client_ip in the stream context (and in stream logs and
            authz plugins) is the forwarded source IP from the PROXY header; direct_client_ip
            retains the raw socket peer (the LB's own IP). This mirrors XFF + FERRUM_TRUSTED_PROXIES
            on the HTTP path.

            Only valid for tcp / tcp_tls stream proxies. Setting it on UDP, DTLS, or HTTP
            proxies produces a validation error (PROXY protocol is TCP-borne).

            Default: null / false (disabled; socket peer is always used as client_ip).
        websocket_idle_timeout_seconds:
          type: [integer, "null"]
          format: uint64
          minimum: 0
          maximum: 86400
          description: |
            WebSocket relay idle timeout in seconds for upgraded sessions on this proxy
            (HTTP-family proxies; applies to H1/H2/H3 frontends and both the frame-parsed
            and tunnel-mode relays). The session closes only when neither direction
            produces activity (frames, including Ping/Pong, or transport bytes) within the
            window; activity from either side keeps it open. When omitted, uses the global
            FERRUM_WEBSOCKET_IDLE_TIMEOUT_SECONDS (default: 300s / 5 min). Set to 0 to
            disable for this proxy (idle sessions then live forever, bounded only by
            FERRUM_WEBSOCKET_MAX_CONNECTIONS). Maximum 86400 (24h).
            HTTP/3 caveat: on QUIC frontends the transport idle timeout
            FERRUM_HTTP3_IDLE_TIMEOUT (default 30s) also applies. On an
            otherwise-idle H3 connection, QUIC may close before a longer WebSocket
            idle timer; multiplexed H3 connections with other active streams may
            stay open. Startup/reload warnings are logged only for affected proxies
            when an H3 WebSocket listener is actually reachable.
        udp_idle_timeout_seconds:
          type: integer
          format: uint64
          default: 60
          description: |
            UDP session idle timeout in seconds. After this duration of inactivity,
            the UDP session mapping is removed. Only applicable for udp/dtls protocols.
        udp_max_response_amplification_factor:
          type: [number, "null"]
          format: float
          exclusiveMinimum: 0
          description: |
            Maximum allowed response amplification factor for UDP proxies.
            When set, backend→client datagrams are dropped if their size exceeds
            `payload_size * factor`. A zero-length request receives an explicit
            one-byte reply allowance so it cannot black-hole the session;
            nonempty requests retain the exact configured payload ratio. This
            protects against UDP amplification attacks (e.g., spoofed-source
            reflection). When omitted (default), no per-datagram amplification
            cap is applied. Only applicable for `udp` / `dtls` proxies.
        allowed_methods:
          oneOf:
            - type: array
              items:
                type: string
                enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, TRACE, CONNECT]
            - type: "null"
          default: null
          description: |
            Optional list of HTTP methods this proxy accepts. When null (default),
            all methods are allowed. When set, requests with methods not in the list
            receive 405 Method Not Allowed before any plugin processing.
        allowed_ws_origins:
          type: array
          items:
            type: string
          default: []
          description: |
            Optional list of allowed WebSocket Origin values (e.g., ["https://example.com"]).
            When non-empty, WebSocket upgrade requests must include an Origin header matching
            one of these values (case-insensitive comparison). Empty array (default) means
            no origin check. Protects against Cross-Site WebSocket Hijacking (CSWSH).

            WebSocket over HTTP/1.1 (`Upgrade: websocket`), HTTP/2
            (RFC 8441 Extended CONNECT), and HTTP/3 (RFC 9220 Extended
            CONNECT) are all supported and use the same Origin check.
            The H3 path is gated by `FERRUM_HTTP3_WEBSOCKET_ENABLED`
            (default `true`); see `docs/http3.md` for the H3-specific
            bridge architecture.
        circuit_breaker:
          oneOf:
            - $ref: "#/components/schemas/CircuitBreakerConfig"
            - type: "null"
          description: Optional circuit breaker configuration
        retry:
          oneOf:
            - $ref: "#/components/schemas/RetryConfig"
            - type: "null"
          description: Optional retry configuration
        response_body_mode:
          type: string
          enum: [stream, buffer]
          default: stream
          description: |
            Response body handling mode.

            - `stream` (default): Passes response bytes through as they arrive for
              lower latency and memory usage. If any plugin attached to this proxy
              requires response body buffering (e.g., response_transformer), the
              gateway automatically buffers regardless of this setting.
            - `buffer`: Always buffers the full response body before running
              after-proxy plugins, even if no plugin requires it. Use this when you
              need to guarantee the complete body is available for inspection.
        api_spec_id:
          type: [string, "null"]
          description: |
            ID of the `ApiSpec` that created this proxy via the spec-import admin
            API (`POST /api-specs`). `null` for proxies created via direct admin
            endpoints (`POST /proxies`). When set, the proxy participates in
            spec-level ownership: `PUT /api-specs/{id}` replaces this proxy as part
            of the bundle, and `DELETE /api-specs/{id}` deletes this proxy (and
            its plugins via FK cascade).
        created_at:
          type: string
          format: date-time
          description: Creation timestamp (set by server)
        updated_at:
          type: string
          format: date-time
          description: Last modification timestamp (set by server)

    ProxyCreate:
      description: |
        Request body for creating or updating a proxy. Same schema as Proxy
        but `id`, `created_at`, and `updated_at` are optional (server-managed).

        **Validation rules** (enforced at admin API + file/DB load time):
        - HTTP-family proxies: at least one of `hosts` or `listen_path` must
          be set. A proxy with neither is rejected (400).
        - Stream-family proxies (`tcp`/`tcps`/`udp`/`dtls`): `listen_path`
          MUST be null/omitted, and `listen_port` MUST be set,
          and `backend_scheme` MUST be set explicitly.
        - Unknown fields are rejected. Backend H3 selection is runtime
          capability-driven for `Https` backends — there is no scheme for it.
      allOf:
        - $ref: "#/components/schemas/Proxy"
      required:
        - backend_host
        - backend_port

    BackendScheme:
      type: string
      enum: [http, https, tcp, tcps, udp, dtls]
      description: |
        Wire-level scheme a proxy uses to talk to its backend.

        **HTTP family** (`http`, `https`) covers HTTP/1.1, HTTP/2, HTTP/3,
        gRPC, and WebSocket. Which of those is actually spoken is
        determined per-request (content-type, Upgrade/Connection headers,
        HTTP/2 Extended CONNECT) — it is **never pinned in config**.
        A single `https` proxy transparently serves a mix of REST, gRPC,
        and WebSocket traffic on the same backend pool. Backend HTTP/3 is
        selected automatically for plain HTTP traffic when the concrete
        backend target is classified as H3-capable.

        **Stream family** (`tcp`, `tcps`, `udp`, `dtls`) are raw L4
        proxies selected by `listen_port`. `tcps` follows the
        `http`/`https`, `ws`/`wss` convention (previously spelled
        `tcp_tls`). `dtls` encrypts UDP datagrams to the backend using
        DTLS 1.2/1.3 (ECDSA P-256/P-384 keys only, version
        auto-negotiated).

        **Legacy note**: In earlier releases this was the 11-variant
        `BackendProtocol` enum including `ws`/`wss`/`grpc`/`grpcs`/`h3`
        plus `tcp_tls`. These are no longer accepted on the admin API —
        use `backend_scheme` instead.

    AuthMode:
      type: string
      enum: [single, multi]
      default: single
      description: |
        `single` — auth plugins run in priority order until the first success.
        For `basic_auth` and the Bearer-token mechanisms `jwt_auth`, `jwks_auth`,
        and `oauth2_introspection`, a foreign `Authorization` scheme is skipped;
        other mechanisms are not covered by this guarantee. Any rejection
        returned by a plugin is terminal.
        `multi` — auth plugins run sequentially until one succeeds. If none
        succeeds, a server rejection takes precedence over the last ordinary
        rejection; an all-missing chain returns the first available challenge
        in plugin priority order, skipping challenge-less mechanisms.

    PluginAssociation:
      type: object
      required: [plugin_config_id]
      properties:
        plugin_config_id:
          type: string
          description: ID of the PluginConfig to apply to this proxy

    # ── Consumer ────────────────────────────────────────────────────
    # The Consumer wire shape is split per surface:
    #   ConsumerBase    — shared scalar fields (no credentials)
    #   Consumer        — ordinary redacted management response
    #   ConsumerCreate  — create/batch request (strict credential input)
    #   ConsumerUpdate  — PUT request (input, plus `[REDACTED]` round trip)
    #   ConsumerBackup  — GET /backup item (canonical unredacted stored values)
    #   ConsumerRestore — POST /restore item (stored values or plaintext input)
    ConsumerBase:
      type: object
      required: [username]
      properties:
        id:
          type: string
          description: >-
            Unique identifier (UUID auto-generated if omitted or empty on create).
            Custom IDs must start with an alphanumeric character and contain only
            alphanumeric characters, dots, underscores, or hyphens (max 254 chars).
          pattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
          maxLength: 254
        namespace:
          type: string
          default: ferrum
          readOnly: true
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
          maxLength: 254
          description: >-
            Namespace this consumer belongs to. Read-only on the wire — set
            from the `X-Ferrum-Namespace` request header (or the `ferrum`
            default) on every create/update; any value in the request body
            is ignored.
        username:
          type: string
          minLength: 1
          description: >-
            Unique consumer username (must be non-empty). Used as the lookup key
            for basic_auth authentication. Must be unique across all consumers.
        custom_id:
          type: [string, "null"]
          description: >-
            Optional external identifier. Must be unique across all consumers when
            set. Empty strings are normalized to null. Must not collide with another
            consumer's username (this would cause incorrect JWKS/JWT authentication).
        acl_groups:
          type: array
          items:
            type: string
            maxLength: 255
          default: []
          maxItems: 500
          description: >-
            ACL group memberships for group-based access control. The
            `access_control` plugin can allow/deny by group instead of (or in
            addition to) individual consumer usernames. A consumer can belong to
            up to 500 groups.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Consumer:
      description: >-
        Ordinary management-plane Consumer representation returned by the
        Consumer CRUD and credential-mutation endpoints. Credential secrets are
        redacted per `ConsumerCredentialsRedacted`: `basicauth` is omitted
        entirely and `keyauth`/`jwt`/`hmac_auth` secret fields carry the exact
        `[REDACTED]` placeholder. Unknown/custom credential types and legacy
        extra entry fields are omitted from this ordinary response projection.
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ConsumerBase"
        - type: object
          properties:
            credentials:
              $ref: "#/components/schemas/ConsumerCredentialsRedacted"

    ConsumerCreate:
      description: >-
        Request body for creating a consumer and for consumer items in
        `POST /batch`. Credential values are write-only inputs: plaintext
        `basicauth` `password` fields are hashed on write and stored secrets are
        never returned by ordinary Consumer responses. Every credential value
        must be a real secret; the reserved `[REDACTED]` placeholder is rejected
        here, and only `PUT` (see `ConsumerUpdate`) accepts it as a round-trip
        marker. Unknown top-level fields are rejected (`unevaluatedProperties:
        false`), matching runtime `Consumer` serde `deny_unknown_fields` on
        create, update, batch, restore, and file/CP-DP config deserialization.


        Update (`PUT`, `ConsumerUpdate`) is non-destructive for credential state
        the ordinary
        `Consumer` response cannot express, so a read-modify-write round trip of
        a `Consumer` response is safe: an omitted credential type the ordinary
        response does not emit at all (`basicauth`, any unknown/custom type, or
        an `mtls_auth` map whose entries the projection filtered out) is
        preserved from the stored consumer, and a
        `keyauth`/`jwt`/`hmac_auth` entry submitted as the exact `[REDACTED]`
        placeholder is restored from the stored entry at the same array index.
        Omitting a credential type that the ordinary response does represent
        (`keyauth`, `jwt`, `hmac_auth`, `mtls_auth`) still removes it; removing
        a hidden type uses
        `DELETE /consumers/{consumer_id}/credentials/{cred_type}`.
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ConsumerBase"
        - type: object
          properties:
            credentials:
              $ref: "#/components/schemas/ConsumerCredentialsInput"

    ConsumerUpdate:
      description: >-
        Request body for `PUT /consumers/{id}`. Identical to `ConsumerCreate`
        except that a `keyauth`, `jwt`, or `hmac_auth` entry may also be the
        exact `[REDACTED]` placeholder projection the ordinary `Consumer`
        response returns, so a client that GETs a consumer, edits an unrelated
        field, and PUTs the body back is schema-valid without ever holding the
        stored secret. The server restores each such placeholder from the stored
        entry at the same array index before validation; a placeholder with no
        stored entry at that index is rejected, so the marker can never become
        live credential material. `[REDACTED]` is a reserved value and is never
        accepted as a real `keyauth` `key`, `jwt` `secret`, or `hmac_auth`
        `secret` on any surface, including create, batch, restore, and the
        dedicated credential endpoints.
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ConsumerBase"
        - type: object
          properties:
            credentials:
              $ref: "#/components/schemas/ConsumerCredentialsUpdateInput"

    ConsumerBackup:
      description: >-
        Consumer item in a `GET /backup` export. Credentials carry canonical
        unredacted stored values (`basicauth` entries carry the stored
        `password_hash`; plaintext passwords are never exported) suitable for
        disaster-recovery restoration via `POST /restore`. Export canonicalizes
        exactly-one-field credential entries — `jwt` and `hmac_auth` to their
        `secret`, `mtls_auth` to its `identity` — so entries written before that
        contract, which may still carry ignored extra fields such as a `jwt`
        `algorithm`, stay restorable, and wraps any credential value still held
        in the legacy single-object form in a one-element array, because restore
        requires every credential value to be a non-empty array of objects.
        Rotation entries keep their order, entries without a string value at the
        canonical field are exported untouched so unrepresentable data surfaces
        at restore rather than being silently dropped, and credential types
        without a single-field rule — `basicauth`, `keyauth`, and unknown/custom
        credential maps — are exported with their fields verbatim.
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ConsumerBase"
        - type: object
          properties:
            credentials:
              $ref: "#/components/schemas/ConsumerCredentialsBackup"

    ConsumerRestore:
      description: >-
        Consumer item accepted by `POST /restore`. Credentials are the
        canonical stored values produced by `GET /backup`; `basicauth` entries
        may instead supply a plaintext `password`, which is hashed before
        storage exactly as on create/update.
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/ConsumerBase"
        - type: object
          properties:
            credentials:
              $ref: "#/components/schemas/ConsumerCredentialsRestore"

    ConsumerCredentialsInput:
      type: object
      default: {}
      description: |
        Map of credential type to credential payload for consumer create,
        update, and batch requests. Each type maps to an array of credential
        objects for zero-downtime rotation. Credential arrays must be non-empty
        and elements must be JSON objects. Credential values that serve as
        lookup keys must be unique across all consumers and across all entries
        within arrays. Max entries per type is controlled by
        `FERRUM_MAX_CREDENTIALS_PER_TYPE` (default: 2).
      properties:
        keyauth:
          type: array
          items:
            $ref: "#/components/schemas/KeyAuthCredential"
          minItems: 1
          description: Multiple API key entries for zero-downtime rotation. Each `key` must be globally unique.
        basicauth:
          type: array
          items:
            $ref: "#/components/schemas/BasicAuthCredential"
          minItems: 1
          description: Multiple basic auth entries for zero-downtime rotation. Indexed by consumer `username`; plaintext `password` is hashed on write and never returned.
        jwt:
          type: array
          items:
            $ref: "#/components/schemas/JwtCredential"
          minItems: 1
          description: Multiple HS256 JWT secrets for zero-downtime rotation. Each entry contains exactly one `secret` string of 32-4096 characters. Looked up by `username`, `id`, or `custom_id`; all secrets tried.
        hmac_auth:
          type: array
          items:
            $ref: "#/components/schemas/HmacAuthCredential"
          minItems: 1
          description: Multiple HMAC secrets for zero-downtime rotation. Looked up by username within the matched proxy namespace; all secrets tried.
        mtls_auth:
          type: array
          items:
            $ref: "#/components/schemas/MtlsAuthCredential"
          minItems: 1
          description: Multiple mTLS identities for zero-downtime rotation. Each `identity` must be globally unique.
      propertyNames:
        $ref: "#/components/schemas/CredentialTypeName"
      additionalProperties:
        type: array
        items:
          type: object
        minItems: 1

    ConsumerCredentialsUpdateInput:
      type: object
      default: {}
      description: |
        Credential map for `PUT /consumers/{id}`. Identical to
        `ConsumerCredentialsInput` except that `keyauth`, `jwt`, and
        `hmac_auth` entries may also be the exact `[REDACTED]` placeholder
        projection returned by ordinary Consumer responses, so the server's own
        redacted response is a valid update body. Each placeholder is replaced
        with the stored entry at the same array index before validation; a
        placeholder with no stored entry at that index is rejected with `400`.
        `basicauth` and `mtls_auth` take the same values as on create, because
        the ordinary response never emits a `basicauth` entry and emits real
        `mtls_auth` identities.
      properties:
        keyauth:
          type: array
          items:
            $ref: "#/components/schemas/KeyAuthCredentialUpdate"
          minItems: 1
          description: API key entries. Each entry is a real `key` or the exact `[REDACTED]` round-trip placeholder.
        basicauth:
          type: array
          items:
            $ref: "#/components/schemas/BasicAuthCredential"
          minItems: 1
          description: Multiple basic auth entries for zero-downtime rotation. Omitting `basicauth` preserves the stored value because ordinary responses never emit it.
        jwt:
          type: array
          items:
            $ref: "#/components/schemas/JwtCredentialUpdate"
          minItems: 1
          description: HS256 JWT entries. Each entry is a real 32-4096 character `secret` or the exact `[REDACTED]` round-trip placeholder.
        hmac_auth:
          type: array
          items:
            $ref: "#/components/schemas/HmacAuthCredentialUpdate"
          minItems: 1
          description: HMAC entries. Each entry is a real `secret` or the exact `[REDACTED]` round-trip placeholder.
        mtls_auth:
          type: array
          items:
            $ref: "#/components/schemas/MtlsAuthCredential"
          minItems: 1
          description: Multiple mTLS identities for zero-downtime rotation. Each `identity` must be globally unique.
      propertyNames:
        $ref: "#/components/schemas/CredentialTypeName"
      additionalProperties:
        type: array
        items:
          type: object
        minItems: 1

    ConsumerCredentialsRedacted:
      type: object
      default: {}
      description: |
        Credential map in ordinary Consumer management responses. Ordinary
        Consumer responses omit `basicauth` entirely, so neither stored hashes
        nor pattern-invalid placeholder values cross the management boundary,
        and replace the `keyauth` `key`, `jwt` `secret`, and `hmac_auth`
        `secret` fields with the exact `[REDACTED]` placeholder string.
        `mtls_auth.identity` is a non-secret lookup key and remains visible.
        Unknown/custom credential types and legacy extra fields are omitted so
        ordinary responses expose only the explicitly modeled safe projection.
        `GET /backup` is the only surface that returns canonical unredacted
        values.
      properties:
        keyauth:
          type: array
          items:
            $ref: "#/components/schemas/KeyAuthCredentialRedacted"
          minItems: 1
          description: API key entries with each `key` replaced by the exact `[REDACTED]` placeholder.
        basicauth: false
        jwt:
          type: array
          items:
            $ref: "#/components/schemas/JwtCredentialRedacted"
          minItems: 1
          description: HS256 JWT entries with each `secret` replaced by the exact `[REDACTED]` placeholder.
        hmac_auth:
          type: array
          items:
            $ref: "#/components/schemas/HmacAuthCredentialRedacted"
          minItems: 1
          description: HMAC entries with each `secret` replaced by the exact `[REDACTED]` placeholder.
        mtls_auth:
          type: array
          items:
            $ref: "#/components/schemas/MtlsAuthCredential"
          minItems: 1
          description: Multiple mTLS identities for zero-downtime rotation. Each `identity` must be globally unique.
      additionalProperties: false

    ConsumerCredentialsBackup:
      type: object
      default: {}
      description: |
        Credential map in `GET /backup` export items: canonical unredacted
        stored values suitable for faithful restoration. `basicauth` entries
        carry the stored `password_hash`; plaintext passwords are never
        exported.
      properties:
        keyauth:
          type: array
          items:
            $ref: "#/components/schemas/KeyAuthCredentialBackup"
          minItems: 1
          description: Multiple API key entries for zero-downtime rotation, unredacted.
        basicauth:
          type: array
          items:
            $ref: "#/components/schemas/BasicAuthCredentialStored"
          minItems: 1
          description: Multiple basic auth entries in canonical stored `password_hash` form.
        jwt:
          type: array
          items:
            $ref: "#/components/schemas/JwtCredentialBackup"
          minItems: 1
          description: Multiple canonical HS256 JWT secrets for zero-downtime rotation, unredacted.
        hmac_auth:
          type: array
          items:
            $ref: "#/components/schemas/HmacAuthCredentialBackup"
          minItems: 1
          description: Multiple HMAC secrets for zero-downtime rotation, unredacted.
        mtls_auth:
          type: array
          items:
            $ref: "#/components/schemas/MtlsAuthCredential"
          minItems: 1
          description: Multiple mTLS identities for zero-downtime rotation. Each `identity` must be globally unique.
      propertyNames:
        $ref: "#/components/schemas/CredentialTypeName"
      additionalProperties:
        type: array
        items:
          type: object
        minItems: 1

    ConsumerCredentialsRestore:
      type: object
      default: {}
      description: |
        Credential map accepted by `POST /restore`: the canonical stored
        values produced by `GET /backup`. `basicauth` entries may supply a
        plaintext `password` instead of `password_hash`; it is hashed before
        storage exactly as on create/update.
      properties:
        keyauth:
          type: array
          items:
            $ref: "#/components/schemas/KeyAuthCredentialBackup"
          minItems: 1
          description: Multiple API key entries for zero-downtime rotation, unredacted.
        basicauth:
          type: array
          items:
            $ref: "#/components/schemas/BasicAuthCredential"
          minItems: 1
          description: Multiple basic auth entries for zero-downtime rotation. Accepts the stored `password_hash` or a plaintext `password` (hashed on import).
        jwt:
          type: array
          items:
            $ref: "#/components/schemas/JwtCredentialBackup"
          minItems: 1
          description: Multiple canonical HS256 JWT secrets for zero-downtime rotation, unredacted.
        hmac_auth:
          type: array
          items:
            $ref: "#/components/schemas/HmacAuthCredentialBackup"
          minItems: 1
          description: Multiple HMAC secrets for zero-downtime rotation, unredacted.
        mtls_auth:
          type: array
          items:
            $ref: "#/components/schemas/MtlsAuthCredential"
          minItems: 1
          description: Multiple mTLS identities for zero-downtime rotation. Each `identity` must be globally unique.
      propertyNames:
        $ref: "#/components/schemas/CredentialTypeName"
      additionalProperties:
        type: array
        items:
          type: object
        minItems: 1

    CredentialTypeName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_-]+$"
      description: >-
        Credential type key. The built-in types are `keyauth`, `basicauth`,
        `jwt`, `hmac_auth`, and `mtls_auth`; any other key defines a custom
        credential type whose entries Ferrum stores and exports verbatim but
        does not interpret. Keys are restricted to one path-safe URI segment —
        1-64 ASCII letters, digits, underscores, or hyphens — so that every
        stored credential type stays removable through
        `DELETE /consumers/{consumer_id}/credentials/{cred_type}`, which matches
        the raw request path split on `/` and does not percent-decode. Keys that
        are empty, contain `/`, `%`, whitespace, control bytes, or other
        reserved URI characters are rejected on create, update, batch, and
        restore. Dedicated credential `PUT`/`POST` path parameters use the
        narrower `BuiltInCredentialType` enum; this broader name stays on
        credential maps and on `DELETE`.

    BuiltInCredentialType:
      type: string
      enum: [basicauth, keyauth, jwt, hmac_auth, mtls_auth]
      description: >-
        Built-in Consumer credential type accepted by
        `PUT`/`POST /consumers/{consumer_id}/credentials/{cred_type}` and by
        indexed `DELETE .../credentials/{cred_type}/{index}`. Matches runtime
        `ALLOWED_CREDENTIAL_TYPES` exactly. Custom types remain writable only
        through whole-Consumer create/update/batch credential maps and
        removable through type-level `DELETE` with `CredentialTypeName`.

    # ── Consumer Credential Types ──────────────────────────────────

    KeyAuthCredential:
      type: object
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 4096
          allOf:
            - pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
            - pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F]*$'
          not:
            const: "[REDACTED]"
          description: >-
            API key value. Must be non-empty after trimming, no more than 4096
            characters, free of disallowed ASCII control bytes, and globally
            unique across all consumers. The exact string `[REDACTED]` is
            reserved as the response redaction placeholder and is rejected as a
            stored key on every write surface; `jwt` and `hmac_auth` secrets
            exclude it implicitly through their 32-character minimum.
      description: "API key credential for the `key_auth` authentication plugin."

    BasicAuthCredential:
      type: object
      additionalProperties: false
      oneOf:
        - required: [password]
        - required: [password_hash]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F]*$'
          writeOnly: true
          description: >-
            Plaintext password (automatically hashed on write using HMAC-SHA256
            with the server secret `FERRUM_BASIC_AUTH_HMAC_SECRET`). Mutually
            exclusive with `password_hash`. Must not contain ASCII control bytes
            other than horizontal tab, line feed, and carriage return.
        password_hash:
          type: string
          maxLength: 76
          pattern: "^hmac_sha256:[0-9a-f]{64}$"
          description: >-
            Pre-hashed password in `hmac_sha256:<64 lowercase hex>` format
            (constant-time, ~1μs). Ordinary Consumer responses omit the
            entire `basicauth` credential type; authenticated backups return
            this canonical unredacted value for restoration.
      description: >-
        Basic auth credential for the `basic_auth` plugin. Supply either
        `password` (auto-hashed) or `password_hash` (pre-hashed). Indexed by
        the consumer's `username`.

    JwtCredential:
      type: object
      required: [secret]
      additionalProperties: false
      properties:
        secret:
          type: string
          minLength: 32
          maxLength: 4096
          pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F]*$'
          writeOnly: true
          description: >-
            JWT signing secret used to verify token signatures (HS256) for this
            consumer. Must be 32-4096 characters and must not contain ASCII
            control bytes other than horizontal tab, line feed, and carriage
            return.
      description: >-
        JWT credential for the `jwt_auth` plugin. The only supported Consumer
        JWT key form is exactly one HS256 `secret`; algorithm selectors,
        public keys, and JWKS fields are not Consumer credential fields. Use
        the separate `jwks_auth` plugin configuration for RSA/EC/JWKS token
        verification. Consumer is looked up by `username`, `id`, or
        `custom_id` from the JWT claim; then all secrets are tried until one
        verifies the signature.

    HmacAuthCredential:
      type: object
      required: [secret]
      additionalProperties: false
      properties:
        secret:
          type: string
          minLength: 32
          maxLength: 4096
          allOf:
            - pattern: '^(?:[\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]*[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]){32}'
            - pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F]*$'
          writeOnly: true
          description: >-
            Shared secret for HMAC signature computation and verification. Must
            contain 32-4096 characters, at least 32 of which are
            non-whitespace, and must not contain disallowed ASCII control
            bytes or be shared by different Consumers within one namespace.
            Separate namespaces may reuse the same secret.
      description: >-
        HMAC auth credential for the `hmac_auth` plugin. Consumer is looked up
        by username within the matched proxy namespace; all secrets are tried
        until one verifies the namespace-bound signature.

    MtlsAuthCredential:
      type: object
      required: [identity]
      additionalProperties: false
      properties:
        identity:
          type: string
          minLength: 1
          maxLength: 4096
          allOf:
            - pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
            - pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F]*$'
          description: >-
            Certificate field value to match against the client certificate
            (e.g., CN, SAN DNS name, fingerprint, or serial). The field
            extracted from the cert is configured on the `mtls_auth` plugin via
            `cert_field`. For subject and SAN fields Ferrum selects the first
            matching value in certificate order; it does not try later values.
            DNS SAN values are compared using ASCII case-insensitive matching;
            all other certificate fields are compared exactly. Identities are
            always exact-unique across consumers and, while an enabled san_dns
            mTLS policy exists, must also be unique under ASCII case folding.
            Persistent backends serialize Consumer, policy, and proxy-association
            admission per namespace so concurrent case variants or policy races
            cannot commit ambiguity; ordinary conflicting CRUD writes return
            409. Batch and restore use their documented per-item and rollback
            responses. File, database, CP/DP, and reload snapshots reject
            violations before runtime indexes are published.
      description: >-
        mTLS auth credential for the `mtls_auth` plugin. Indexed for O(1)
        lookup by certificate identity.

    # ── Consumer Credential Surface Variants ───────────────────────
    # Redacted variants appear only in ordinary Consumer management responses
    # and encode the exact placeholder the runtime emits. Backup variants carry
    # canonical unredacted stored values and appear in `GET /backup` exports
    # and `POST /restore` payloads.

    KeyAuthCredentialRedacted:
      type: object
      required: [key]
      additionalProperties: false
      properties:
        key:
          type: string
          const: "[REDACTED]"
          description: >-
            Redaction placeholder. Ordinary Consumer responses never return the
            stored API key; `GET /backup` returns the canonical value.
      description: >-
        `keyauth` entry as returned by ordinary Consumer responses: the stored
        API key is replaced with the exact `[REDACTED]` placeholder.

    JwtCredentialRedacted:
      type: object
      required: [secret]
      additionalProperties: false
      properties:
        secret:
          type: string
          const: "[REDACTED]"
          description: >-
            Redaction placeholder. Ordinary Consumer responses never return the
            stored JWT secret; `GET /backup` returns the canonical value.
      description: >-
        `jwt` entry as returned by ordinary Consumer responses: the stored
        secret is replaced with the exact `[REDACTED]` placeholder.

    HmacAuthCredentialRedacted:
      type: object
      required: [secret]
      additionalProperties: false
      properties:
        secret:
          type: string
          const: "[REDACTED]"
          description: >-
            Redaction placeholder. Ordinary Consumer responses never return the
            stored HMAC secret; `GET /backup` returns the canonical value.
      description: >-
        `hmac_auth` entry as returned by ordinary Consumer responses: the
        stored secret is replaced with the exact `[REDACTED]` placeholder.

    # Update variants accept either a real credential entry or the exact
    # redaction placeholder the ordinary response returns, so a client can PUT
    # back a `Consumer` response it never held the secrets for. The two
    # alternatives are mutually exclusive — `jwt` and `hmac_auth` secrets
    # require 32+ characters and `KeyAuthCredential` explicitly excludes the
    # placeholder — so `oneOf` is unambiguous.

    KeyAuthCredentialUpdate:
      oneOf:
        - $ref: "#/components/schemas/KeyAuthCredential"
        - $ref: "#/components/schemas/KeyAuthCredentialRedacted"
      description: >-
        `keyauth` entry accepted by `PUT /consumers/{id}`: a real API key, or
        the exact `[REDACTED]` placeholder, which is replaced with the stored
        entry at the same array index before validation.

    JwtCredentialUpdate:
      oneOf:
        - $ref: "#/components/schemas/JwtCredential"
        - $ref: "#/components/schemas/JwtCredentialRedacted"
      description: >-
        `jwt` entry accepted by `PUT /consumers/{id}`: a real HS256 secret, or
        the exact `[REDACTED]` placeholder, which is replaced with the stored
        entry's canonical `secret` at the same array index before validation.

    HmacAuthCredentialUpdate:
      oneOf:
        - $ref: "#/components/schemas/HmacAuthCredential"
        - $ref: "#/components/schemas/HmacAuthCredentialRedacted"
      description: >-
        `hmac_auth` entry accepted by `PUT /consumers/{id}`: a real shared
        secret, or the exact `[REDACTED]` placeholder, which is replaced with
        the stored entry's canonical `secret` at the same array index before
        validation.

    KeyAuthCredentialBackup:
      type: object
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 4096
          allOf:
            - pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'
            - pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F]*$'
          not:
            const: "[REDACTED]"
          description: >-
            Canonical stored API key (1-4096 characters, non-whitespace and
            free of disallowed ASCII control bytes), carried unredacted in
            backup and restore payloads. The exact string `[REDACTED]` is
            reserved as the ordinary-response redaction placeholder and is
            rejected by runtime `Consumer::validate_fields()` on restore,
            create, and update — matching `KeyAuthCredential`.
      description: >-
        `keyauth` entry in backup/restore payloads: the canonical unredacted
        stored API key. The reserved `[REDACTED]` marker is excluded here and
        accepted only by the explicit redacted/update-marker alternatives.

    JwtCredentialBackup:
      type: object
      required: [secret]
      additionalProperties: false
      properties:
        secret:
          type: string
          minLength: 32
          maxLength: 4096
          pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F]*$'
          description: >-
            Canonical stored HS256 JWT secret (32-4096 characters), carried
            unredacted in backup and restore payloads. It must not contain
            ASCII control bytes other than horizontal tab, line feed, and
            carriage return.
      description: >-
        `jwt` entry in backup/restore payloads: the canonical unredacted
        stored HS256 secret. Public-key and JWKS key forms belong to the
        separate `jwks_auth` plugin configuration and are rejected here.

    HmacAuthCredentialBackup:
      type: object
      required: [secret]
      additionalProperties: false
      properties:
        secret:
          type: string
          minLength: 32
          maxLength: 4096
          allOf:
            - pattern: '^(?:[\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]*[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]){32}'
            - pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F]*$'
          description: >-
            Canonical stored HMAC secret (32-4096 characters, including at
            least 32 non-whitespace characters, and no disallowed ASCII
            control bytes), carried unredacted in backup and restore payloads.
      description: >-
        `hmac_auth` entry in backup/restore payloads: the canonical unredacted
        stored secret.

    BasicAuthCredentialStored:
      type: object
      additionalProperties: false
      required: [password_hash]
      properties:
        password_hash:
          type: string
          maxLength: 76
          pattern: "^hmac_sha256:[0-9a-f]{64}$"
          description: >-
            Canonical stored password hash in `hmac_sha256:<64 lowercase hex>`
            format. Backup exports never contain plaintext passwords.
      description: >-
        `basicauth` entry as stored and exported by `GET /backup`: only the
        canonical `password_hash`. `POST /restore` additionally accepts a
        plaintext `password` (see `BasicAuthCredential`), hashed on import.

    ConsumerCredentialInput:
      description: >-
        Single credential entry accepted by the credential mutation endpoints.
        The expected shape is determined by the `{cred_type}` path parameter;
        plaintext `basicauth` `password` values are hashed on write and never
        returned. OpenAPI cannot condition a request-body schema on a path
        parameter, so this union lists every allowed entry shape and the server
        enforces that the selected shape matches `{cred_type}`.
      anyOf:
        - $ref: "#/components/schemas/KeyAuthCredential"
        - $ref: "#/components/schemas/BasicAuthCredential"
        - $ref: "#/components/schemas/JwtCredential"
        - $ref: "#/components/schemas/HmacAuthCredential"
        - $ref: "#/components/schemas/MtlsAuthCredential"

    # ── Plugin Config ───────────────────────────────────────────────
    PluginConfig:
      type: object
      required: [plugin_name, scope, enabled]
      properties:
        id:
          type: string
          description: >-
            Unique identifier (UUID auto-generated if omitted or empty on create).
            Custom IDs must start with an alphanumeric character and contain only
            alphanumeric characters, dots, underscores, or hyphens (max 254 chars).
          pattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
          maxLength: 254
        namespace:
          type: string
          default: ferrum
          readOnly: true
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
          maxLength: 254
          description: >-
            Namespace this plugin config belongs to. Read-only on the wire —
            set from the `X-Ferrum-Namespace` request header (or the `ferrum`
            default) on every create/update; any value in the request body
            is ignored.
        plugin_name:
          type: string
          description: >-
            Plugin type name. Must be one of the available built-in plugins
            (e.g., key_auth, rate_limiting, cors, stdout_logging). Use
            `GET /plugins` to discover available plugin names.
        config:
          type: object
          default: {}
          description: >-
            Plugin-specific JSON configuration. Resource-level size and depth
            constraints are always validated. Plugin-specific construction is
            performed on create/update and config reload only when `enabled` is
            true. For plugins registered FailClosed or KeepLastKnownGood,
            unknown plugin names or invalid enabled plugin-specific config are
            validation-fatal when the plugin cache is built: they block gateway
            startup in file mode, and on DB/CP polling the new config snapshot
            is rejected as a whole (the gateway keeps serving the prior good
            config). Admin API create/update always performs strict construction
            for an enabled config and returns HTTP 400 before storage when that
            config is invalid, regardless of serving-mode failure policy.
            During file-mode load, pre-existing DB/CP snapshot application, or
            cache rebuild, plugins registered OptionalFailOpen (including
            `ws_frame_logging` and other observability sinks) instead emit a
            validation/construction warning and omit that plugin instance from
            the published cache while admitting the surrounding snapshot.
            Disabled plugin configs are stored without construction, allowing
            secret-dependent plugins such as `basic_auth` to be staged before
            their runtime secret is provisioned. Enabling performs full
            validation. See `PluginConfigs` section for per-plugin schema
            definitions. Viewer/operator responses use the audit-safe
            projection while admin responses remain raw. For loki_logging, that
            projection preserves only endpoint scheme/host/port and redacts the
            path, query, authorization, and every custom-header value.
        scope:
          $ref: "#/components/schemas/PluginScope"
        proxy_id:
          type: [string, "null"]
          description: >-
            Required when scope is `proxy` — must reference an existing proxy ID.
            Must be null (or omitted) when scope is `global` or `proxy_group`.
            The referenced proxy must exist. When a proxy is deleted, its
            proxy-scoped plugin configs are automatically deleted (cascade).
            Proxy-group-scoped plugins survive proxy deletion — only the
            association is removed.
        enabled:
          type: boolean
          default: true
          description: >-
            Whether the plugin is active. Disabled configs are stored but not
            constructed; enabling them performs full plugin-specific validation.
        priority_override:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000
          description: >-
            Optional execution priority override. When set, replaces the plugin's
            built-in priority constant. Lower values execute first. Useful when
            multiple instances of the same plugin type are attached to a proxy
            (e.g., two http_logging instances shipping to Splunk and Datadog).
            When null (default), the plugin uses its built-in priority.
        api_spec_id:
          type: [string, "null"]
          description: |
            ID of the `ApiSpec` that created this plugin via the spec-import admin
            API (`POST /api-specs`). `null` for plugins created via direct admin
            endpoints (`POST /plugins/config`). When set, `PUT /api-specs/{id}`
            replaces this plugin as part of the bundle.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      allOf:
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: transaction_log_schema
          then:
            required: [config]
            properties:
              config:
                $ref: "#/components/schemas/TransactionLogSchemaConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: stdout_logging
          then:
            properties:
              config:
                $ref: "#/components/schemas/StdoutLoggingConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: http_logging
          then:
            required: [config]
            properties:
              config:
                $ref: "#/components/schemas/HttpLoggingConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: tcp_logging
          then:
            required: [config]
            properties:
              config:
                $ref: "#/components/schemas/TcpLoggingConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: kafka_logging
          then:
            required: [config]
            properties:
              config:
                $ref: "#/components/schemas/KafkaLoggingConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: ws_logging
          then:
            required: [config]
            properties:
              config:
                $ref: "#/components/schemas/WsLoggingConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: transaction_debugger
          then:
            properties:
              config:
                $ref: "#/components/schemas/TransactionDebuggerConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: jwks_auth
          then:
            required: [config]
            properties:
              config:
                $ref: "#/components/schemas/JwksAuthConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: oauth2_introspection
          then:
            required: [config]
            properties:
              config:
                $ref: "#/components/schemas/Oauth2IntrospectionConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: oidc_relying_party
          then:
            required: [config]
            properties:
              config:
                $ref: "#/components/schemas/OidcRelyingPartyConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: jwt_auth
          then:
            properties:
              config:
                $ref: "#/components/schemas/JwtAuthConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: key_auth
          then:
            properties:
              config:
                $ref: "#/components/schemas/KeyAuthConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: basic_auth
          then:
            properties:
              config:
                $ref: "#/components/schemas/BasicAuthConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: ldap_auth
          then:
            required: [config]
            properties:
              config:
                $ref: "#/components/schemas/LdapAuthConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: hmac_auth
          then:
            properties:
              config:
                $ref: "#/components/schemas/HmacAuthConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: mtls_auth
          then:
            properties:
              config:
                $ref: "#/components/schemas/MtlsAuthConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: spiffe_identity
          then:
            properties:
              config:
                $ref: "#/components/schemas/SpiffeIdentityConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: mesh_authz
          then:
            properties:
              config:
                $ref: "#/components/schemas/MeshAuthzConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: opa
          then:
            required: [config]
            properties:
              config:
                $ref: "#/components/schemas/OpaPluginConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: mesh_outbound_registry
          then:
            properties:
              config:
                $ref: "#/components/schemas/MeshOutboundRegistryConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: compression
          then:
            properties:
              config:
                $ref: "#/components/schemas/CompressionConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: cors
          then:
            properties:
              config:
                $ref: "#/components/schemas/CorsConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: security_headers
          then:
            properties:
              config:
                $ref: "#/components/schemas/SecurityHeadersConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: access_control
          then:
            required: [config]
            properties:
              config:
                $ref: "#/components/schemas/AccessControlConfig"
        - if:
            required: [plugin_name]
            properties:
              plugin_name:
                const: tcp_connection_throttle
          then:
            required: [config]
            properties:
              config:
                $ref: "#/components/schemas/TcpConnectionThrottleConfig"
        - if:
            required: [plugin_name]
