  # ── Overload ────────────────────────────────────────────────────────
  /overload:
    get:
      operationId: getOverload
      summary: Overload status (tiered detail)
      description: |
        Returns the gateway's current overload state. **Unauthenticated** callers
        receive a coarse, LB-safe `{"level": ...}` (with the correct status code)
        so load balancers and monitoring probes can act on the level without
        seeing resource internals. The **full** snapshot — resource pressure
        (file descriptors, connections, requests, event-loop latency), active
        counts, port-exhaustion events, load-shedding actions, and stream-listener
        diagnostics — requires a valid admin JWT, a matching
        `FERRUM_METRICS_BEARER_TOKEN`, or a `FERRUM_METRICS_ALLOWED_CIDRS`
        source IP.

        Returns `503 Service Unavailable` when the overload level is `critical`
        (for both tiers).

        In control-plane mode (no proxy state), returns `{"level":"normal"}`.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Overload state (normal or pressure)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OverloadSnapshot"
                  - $ref: "#/components/schemas/OverloadLevelOnly"
                  - $ref: "#/components/schemas/OverloadNoProxyState"
        "503":
          description: Overload state is critical — gateway is shedding load
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OverloadSnapshot"
                  - $ref: "#/components/schemas/OverloadLevelOnly"

  # ── Metrics ─────────────────────────────────────────────────────────
  /metrics:
    get:
      operationId: getPrometheusMetrics
      summary: Prometheus metrics (gated)
      description: |
        Returns gateway metrics in Prometheus exposition format. **Gated by
        default**: the caller must present a valid admin JWT, a matching
        `FERRUM_METRICS_BEARER_TOKEN`, or originate from a
        `FERRUM_METRICS_ALLOWED_CIDRS` source IP. Otherwise the endpoint
        returns `401 Unauthorized` with a `WWW-Authenticate: Bearer` header.
        Unauthenticated scraping is an explicit operator opt-in (token or CIDR).

        TLS source watcher telemetry includes certificate expiry gauges,
        certificate rotation counters, source refresh outcomes, source fetch
        duration histograms, and bounded source fetch failure counters when
        those source watchers are active.
        Database mode adds bounded rejected-delta polling counters and gauges
        for validation rejections, retry backoff buckets, forced full reloads,
        and recoveries. These labels never include raw resource IDs.
        Mesh mode adds identity and control-plane telemetry families for
        certificate expiry, rotation failures, CA health, trust-bundle
        versions, config freshness, and mTLS handshake failures.
        The admin/management-plane connection limiter is always exposed:
        `ferrum_admin_active_connections` (gauge of admin connections in
        flight), `ferrum_admin_max_connections` and
        `ferrum_admin_max_connections_per_ip` (configured caps, `0` =
        unlimited), and
        `ferrum_admin_rejected_connections_total{reason}` (admin connections
        dropped by the cap, with `reason` one of `max_connections` /
        `max_connections_per_ip`).
      tags: [Metrics]
      security:
        - bearerAuth: []
        - metricsBearerAuth: []
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP ferrum_requests_total Total number of requests processed
                # TYPE ferrum_requests_total counter
                ferrum_requests_total{proxy_id="my-api",method="GET",status_code="200"} 42
                # HELP ferrum_admin_active_connections Admin/management-plane connections currently in flight.
                # TYPE ferrum_admin_active_connections gauge
                ferrum_admin_active_connections 3
                # HELP ferrum_admin_rejected_connections_total Admin connections rejected by the connection limiter, by reason.
                # TYPE ferrum_admin_rejected_connections_total counter
                ferrum_admin_rejected_connections_total{reason="max_connections"} 0
        "401":
          $ref: "#/components/responses/Unauthorized"

  /metrics/runtime:
    get:
      operationId: getRuntimeMetrics
      summary: Runtime host metrics (JSON)
      description: |
        Returns a JWT-authenticated JSON snapshot for "how is this host doing
        right now?": process CPU and memory, file descriptors, ephemeral-port
        pressure, HTTP status rates, error classes, DNS cache outcomes, pool
        churn, TCP resets, log-event counters, bounded stdout/stderr sink
        health/loss/last-failure diagnostics, and the inline overload state.

        The response is cached briefly (default 1000 ms, configurable with
        `FERRUM_METRICS_RUNTIME_CACHE_MS`) because system metrics are sampled in
        the background. Log counters mirror tracing events allowed by
        `FERRUM_LOG_LEVEL` / `RUST_LOG`; the extra 1m/5m HTTP status windows
        can be disabled with `FERRUM_METRICS_STATUS_TRACKING_ENABLED=false`.
      tags: [Metrics]
      responses:
        "200":
          description: Runtime metrics snapshot
          headers:
            X-Cache:
              schema:
                type: string
                enum: [hit, miss]
              description: Whether this response was served from the runtime metrics cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeMetricsSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Charges ────────────────────────────────────────────────────────
  /charges:
    get:
      operationId: getCharges
      summary: API chargeback data
      description: |
        Returns per-consumer API usage charges tracked by the `api_chargeback` plugin.
        Requires a valid admin JWT because chargeback output can contain
        customer and business data. Prometheus scrapes must supply
        `Authorization: Bearer <token>` credentials.
        Default format is Prometheus text exposition; use `?format=json` for JSON.

        **Multi-node deployments**: Each gateway node accumulates charges independently.
        In CP/DP topologies, scrape every DP node and aggregate externally.
      tags: [Metrics]
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [prometheus, json]
          description: |
            Output format. Default is Prometheus text exposition format.
            Use `json` for a structured JSON breakdown by consumer, proxy, and status code.
      responses:
        "200":
          description: Chargeback data
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP ferrum_api_chargeable_calls_total Total chargeable HTTP-family API calls per consumer.
                # TYPE ferrum_api_chargeable_calls_total counter
                ferrum_api_chargeable_calls_total{consumer="alice",proxy_id="proxy-1",proxy_name="Payments API",status_code="200",currency="USD",namespace="ferrum"} 150000
                # HELP ferrum_api_charges_total Total per-call charges accumulated per consumer.
                # TYPE ferrum_api_charges_total counter
                ferrum_api_charges_total{consumer="alice",proxy_id="proxy-1",proxy_name="Payments API",status_code="200",currency="USD",namespace="ferrum"} 1.5000000000
                # HELP ferrum_api_bytes_sent_total Total bytes the gateway sent client->backend on this consumer's behalf.
                # TYPE ferrum_api_bytes_sent_total counter
                ferrum_api_bytes_sent_total{consumer="alice",proxy_id="proxy-1",proxy_name="Payments API",currency="USD",protocol_family="http",namespace="ferrum"} 4500000
                # HELP ferrum_api_bandwidth_charges_total Total bandwidth charges per consumer, split by direction.
                # TYPE ferrum_api_bandwidth_charges_total counter
                ferrum_api_bandwidth_charges_total{consumer="alice",proxy_id="proxy-1",proxy_name="Payments API",direction="received",currency="USD",protocol_family="http",namespace="ferrum"} 0.0900000000
                # HELP ferrum_api_stream_connections_total Total stream sessions (TCP/UDP/DTLS) per consumer.
                # TYPE ferrum_api_stream_connections_total counter
                ferrum_api_stream_connections_total{consumer="alice",proxy_id="tcp-edge",proxy_name="TCP Edge",currency="USD",namespace="ferrum"} 42
            application/json:
              schema:
                $ref: "#/components/schemas/ChargebackResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"

  /charges/sink/status:
    get:
      operationId: getChargebackSinkStatus
      summary: API chargeback sink status
      description: |
        Returns queue depth, spool size, replay timestamps, and export counters
        for the `api_chargeback_sink` plugin. Requires a valid admin JWT because
        sink status can expose billing topology and ClickHouse endpoint metadata.
        Credentials and URL user-info are never returned.
      tags: [Metrics]
      responses:
        "200":
          description: Chargeback sink status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargebackSinkStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/metrics:
    get:
      operationId: getAdminMetrics
      summary: Comprehensive gateway runtime metrics (JSON)
      description: |
        Returns a comprehensive snapshot of the gateway's runtime state including
        request throughput, connection pool sizes, circuit breaker states, health
        check results, load balancer active connections, cache statistics, consumer
        index breakdowns, rate limiter tracked keys, and database rejected-delta
        polling state in database mode. The `tcp_connection_throttle` status
        object states that its configured concurrent-connection limit is
        process-local and independently enforced per replica.

        The response is cached for 5 seconds to avoid performance impact from
        frequent polling. The `X-Cache` response header indicates `hit` or `miss`.

        Designed for dashboards and monitoring integrations that need richer data
        than the Prometheus `/metrics` endpoint provides.
      tags: [Metrics]
      responses:
        "200":
          description: Runtime metrics snapshot
          headers:
            X-Cache:
              schema:
                type: string
                enum: [hit, miss]
              description: Whether this response was served from the 5-second cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Cluster Status ───────────────────────────────────────────────────
  /cluster:
    get:
      operationId: getClusterStatus
      summary: CP/DP cluster connection status
      description: |
        Returns live connection state for CP/DP deployments.

        **CP mode**: Lists all currently connected Data Plane nodes and
        Mesh nodes. Each entry includes `node_id`, `version`, `namespace`,
        `status`, `connected_at`, and `last_sync_at`. Disconnected nodes
        are automatically removed from their respective registries.

        **DP mode**: Shows the connection to the Control Plane — `url`,
        `status` (online/offline), `is_primary` (primary vs fallback CP),
        `connected_since`, and `last_config_received_at`.

        **Database/File modes**: Returns an informational message indicating
        cluster status is only meaningful in CP/DP modes.
      tags: [Monitoring]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cluster connection status
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ClusterStatusCp"
                  - $ref: "#/components/schemas/ClusterStatusDp"
                  - $ref: "#/components/schemas/ClusterStatusOther"
              examples:
                cp_mode:
                  summary: CP mode with two connected DPs and one mesh node
                  value:
                    mode: cp
                    connected_data_planes: 2
                    data_planes:
                      - node_id: "abc-123"
                        version: "0.9.0"
                        namespace: ferrum
                        status: online
                        connected_at: "2025-01-15T10:30:00Z"
                        last_sync_at: "2025-01-15T10:35:00Z"
                      - node_id: "def-456"
                        version: "0.9.0"
                        namespace: staging
                        status: online
                        connected_at: "2025-01-15T10:31:00Z"
                        last_sync_at: "2025-01-15T10:35:00Z"
                    connected_mesh_nodes: 1
                    mesh_nodes:
                      - node_id: "mesh-789"
                        version: "0.9.0"
                        namespace: ferrum
                        status: online
                        connected_at: "2025-01-15T10:32:00Z"
                        last_sync_at: "2025-01-15T10:35:00Z"
                dp_mode_online:
                  summary: DP connected to primary CP
                  value:
                    mode: dp
                    control_plane:
                      url: "http://cp-host:50051"
                      status: online
                      is_primary: true
                      connected_since: "2025-01-15T10:30:00Z"
                      last_config_received_at: "2025-01-15T10:35:00Z"
                dp_mode_offline:
                  summary: DP disconnected from CP
                  value:
                    mode: dp
                    control_plane:
                      url: "http://cp-host:50051"
                      status: offline
                      is_primary: true
                      connected_since: null
                      last_config_received_at: "2025-01-15T10:30:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Backend Capabilities ────────────────────────────────────────────
  /backend-capabilities:
    get:
      operationId: getBackendCapabilities
      summary: List cached backend protocol classifications
      description: |
        Returns every entry in the backend capability registry. Each
        entry describes what transports a particular upstream target
        supports — HTTP/1.1, HTTP/2 over TLS, HTTP/3, gRPC over h2 TLS,
        gRPC over h2c, and gateway-to-mesh HBONE — keyed by deduplicated
        target identity (scheme, host, port, `dns_override`, CA, mTLS cert,
        mTLS key, verify, plus HBONE sidecar port for targets tagged
        `mesh.hbone=true`).

        The registry drives the hot-path routing decision for plain
        HTTPS traffic (native H3 pool vs. direct H2 pool vs. reqwest
        fallback) without per-request probing. Entries are populated at
        startup, refreshed on `FERRUM_BACKEND_CAPABILITY_REFRESH_INTERVAL_SECS`
        (default 24h), and eagerly downgraded on live failures — see
        `docs/admin_api.md#backend-capability-registry` for the full model.

        The endpoint exposes **only** protocol classifications and probe
        timestamps — no credentials, payloads, or TLS private material.
      tags: [Backend Capabilities]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Registry snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendCapabilitiesResponse"
              examples:
                h3_capable_plus_h1_only:
                  summary: Two backends — one h3-capable, one ALPN-downgraded to h1
                  value:
                    entries:
                      - key: "https|api.example.internal|443||/etc/ferrum/ca.pem|||1"
                        plain_http:
                          h1: supported
                          h2_tls: supported
                          h3: supported
                        grpc_transport:
                          h2_tls: supported
                          h2c: unknown
                        hbone: unsupported
                        last_probe_at_unix_secs: 1714003200
                        last_probe_error: null
                      - key: "https|legacy.example.internal|443||||0"
                        plain_http:
                          h1: supported
                          h2_tls: unsupported
                          h3: unsupported
                        grpc_transport:
                          h2_tls: unsupported
                          h2c: unknown
                        hbone: unknown
                        last_probe_at_unix_secs: 1714003200
                        last_probe_error: "H2/TLS downgraded after ALPN-negotiated HTTP/1.1 on request path"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Proxy state unavailable in this mode (e.g., CP without proxy serving)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /backend-capabilities/refresh:
    post:
      operationId: refreshBackendCapabilities
      summary: Force an immediate capability classification pass
      description: |
        Synchronously re-probes every HTTP-family backend in the current
        gateway config and replaces each registry entry with the new
        classification. Blocks until every probe completes, so callers
        can issue `GET /backend-capabilities` immediately afterward to
        observe the post-refresh state.

        This operational recovery action does not persist configuration and is
        available in read-only file, DP, and mesh modes with standard JWT
        authentication.

        Use cases:
        - Protocol rollouts (e.g., freshly enabled HTTP/3 on a fleet).
        - Recovery after a live downgrade (`mark_h3_unsupported`,
          `mark_h2_tls_unsupported`, `mark_hbone_unsupported`) once the
          backend or HBONE sidecar capability is healthy again.
        - Rotated TLS material that the previous probe didn't see.

        Probe parallelism is bounded by `FERRUM_POOL_WARMUP_CONCURRENCY`;
        per-probe timeout follows the proxy's `backend_connect_timeout_ms`
        (clamped to 5s). Request body is ignored.
      tags: [Backend Capabilities]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Refresh completed; registry now reflects the latest probe results
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [refreshed]
              example:
                status: refreshed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Proxy state unavailable in this mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  # ── Node-Waypoint identities (mesh NodeWaypoint topology) ───────────
  /node-waypoint/identities:
    get:
      operationId: getNodeWaypointIdentities
      summary: List currently enrolled node-waypoint pod identities
      description: |
        Returns the resolver's live snapshot of pod identities enrolled in
        the node-waypoint topology — keyed by Kubernetes pod UID with the
        workload SPIFFE ID, the eBPF-side SPIFFE hash, and the current
        IPv4 / IPv6 socket-cookie counts. Operators use this to answer
        "which pods is this waypoint actually serving?" without scraping
        eBPF maps.

        Returns `404 Not Found` when the node-waypoint resolver is not
        installed (non-mesh modes and mesh topologies other than
        `NodeWaypoint`). This avoids surfacing an empty stub list that
        could be mistaken for "no pods enrolled yet" on a sidecar /
        ambient / east-west / egress-gateway DP.

        Entries are sorted by `pod_uid` so polling produces deterministic
        output. The endpoint is cold-path; do not poll faster than a few
        times per second on a busy node.

        The payload exposes pod UIDs and SPIFFE IDs — scope JWT issuance
        accordingly even though no traffic bodies or credentials are
        included. See `docs/admin_api.md#node-waypoint-identities-mesh-nodewaypoint-topology`.
      tags: [Node-Waypoint]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enrolled-identity snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeWaypointIdentitiesResponse"
              examples:
                two_pods_one_taking_traffic:
                  summary: Two enrolled pods; one has live cookies
                  value:
                    identity_count: 2
                    cookies:
                      orig_dst4: 17
                      orig_dst6: 0
                    identities:
                      - pod_uid: "11111111-1111-1111-1111-111111111111"
                        spiffe_id: "spiffe://cluster.local/ns/default/sa/api"
                        workload_spiffe_hash: 12345678901234567890
                        orig_dst4_cookies: 17
                        orig_dst6_cookies: 0
                        has_policy_scope: true
                      - pod_uid: "22222222-2222-2222-2222-222222222222"
                        spiffe_id: "spiffe://cluster.local/ns/default/sa/billing"
                        workload_spiffe_hash: 9876543210987654321
                        orig_dst4_cookies: 0
                        orig_dst6_cookies: 0
                        has_policy_scope: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Node-waypoint topology not enabled in this mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "node-waypoint topology not enabled"
        "503":
          description: Proxy state unavailable in this mode (e.g., CP without proxy serving)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  # ── Service-Waypoint services (mesh ServiceWaypoint topology) ───────
  /service-waypoint/services:
    get:
      operationId: getServiceWaypointServices
      summary: List services admitted for this service-waypoint
      description: |
        Returns the installed mesh slice's resolved service binding for the
        current `ServiceWaypoint` topology. Operators use this to confirm
        which services a named GAMMA waypoint is actually serving after
        `FERRUM_MESH_WAYPOINT_NAME` and Gateway API `use-waypoint`
        labels or annotations have been projected by the control plane.

        Returns `404 Not Found` when service-waypoint topology is not
        active, when no mesh slice has been installed yet, or when the
        installed slice has no `waypoint_name`. The payload exposes service
        names, namespaces, ports, and workload counts, but no request bodies,
        credentials, or backend TLS material.
      tags: [Service-Waypoint]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resolved service-waypoint binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceWaypointServicesResponse"
              example:
                waypoint_name: api-waypoint
                namespace: default
                service_count: 2
                services:
                  - namespace: default
                    name: reviews
                    ports: [8080]
                    workload_count: 3
                  - namespace: default
                    name: ratings
                    ports: [8081]
                    workload_count: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Service-waypoint topology not enabled or no mesh slice installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                topology_not_enabled:
                  value:
                    error: "service-waypoint topology not enabled"
                no_slice:
                  value:
                    error: "no mesh slice available yet"

  # ── Mesh service graph (mesh mode) ───────────────────────────────────
  /mesh/service-graph:
    get:
      operationId: getMeshServiceGraph
      summary: Inspect the live mesh service graph for this data plane
      description: |
        Returns a node-local source-workload to destination-workload graph
        aggregated from the auto-injected `workload_metrics` plugin. The
        endpoint exposes identity, workload, protocol, and RED-counter
        metadata only; request bodies, headers, and credentials are not stored.

        In CP/DP or horizontally scaled mesh deployments, query each data
        plane and aggregate externally.
      tags: [Mesh Observability]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Mesh service graph snapshot
          content:
            application/json:
              schema:
                type: object
                required: [generated_at_unix_ms, generated_at, edge_count, edges]
                properties:
                  generated_at_unix_ms:
                    type: integer
                    format: int64
                  generated_at:
                    type: string
                    format: date-time
                  edge_count:
                    type: integer
                    format: int64
                  edges:
                    type: array
                    items:
                      type: object
                      required:
                        - source_principal
                        - source_workload
                        - source_namespace
                        - source_app
                        - source_service
                        - destination_principal
                        - destination_workload
                        - destination_namespace
                        - destination_app
                        - destination_service
                        - request_protocol
                        - connection_security_policy
                        - requests_total
                        - errors_total
                        - duration_ms_total
                        - duration_ms_avg
                        - last_seen_unix_ms
                        - last_seen
                      properties:
                        source_principal:
                          type: string
                        source_workload:
                          type: string
                        source_namespace:
                          type: string
                        source_app:
                          type: string
                        source_service:
                          type: string
                        destination_principal:
                          type: string
                        destination_workload:
                          type: string
                        destination_namespace:
                          type: string
                        destination_app:
                          type: string
                        destination_service:
                          type: string
                        request_protocol:
                          type: string
                        connection_security_policy:
                          type: string
                        requests_total:
                          type: integer
                          format: int64
                        errors_total:
                          type: integer
                          format: int64
                        duration_ms_total:
                          type: number
                          format: double
                        duration_ms_avg:
                          type: number
                          format: double
                        last_seen_unix_ms:
                          type: integer
                          format: int64
                        last_seen:
                          type: string
                          format: date-time
              example:
                generated_at_unix_ms: 1779035400000
                generated_at: "2026-05-17T16:30:00Z"
                edge_count: 1
                edges:
                  - source_principal: "spiffe://cluster.local/ns/default/sa/frontend"
                    source_workload: "frontend"
                    source_namespace: "default"
                    source_app: "frontend"
                    source_service: "frontend"
                    destination_principal: "spiffe://cluster.local/ns/default/sa/reviews"
                    destination_workload: "reviews"
                    destination_namespace: "default"
                    destination_app: "reviews"
                    destination_service: "reviews"
                    request_protocol: "http"
                    connection_security_policy: "mutual_tls"
                    requests_total: 1250
                    errors_total: 3
                    duration_ms_total: 8420.5
                    duration_ms_avg: 6.7364
                    last_seen_unix_ms: 1779035398000
                    last_seen: "2026-05-17T16:29:58Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No active mesh service graph
          content:
            application/json:
              schema:
                type: object
              examples:
                no-active-mesh-service-graph:
                  value:
                    error: "No active mesh service graph"

  # ── Mesh egress scope (mesh mode) ────────────────────────────────────
  /mesh/egress-scope:
    get:
      operationId: getMeshEgressScope
      summary: Inspect the resolved Sidecar egress scope for this workload
      description: |
        Returns the current workload's resolved Sidecar egress scope, including
        admitted services, admitted service-entries, admitted destination-rules,
        the deduplicated `known_destinations` list used by the outbound
        registry, dry-run status, and admit/deny counts.

        The payload reveals mesh topology shape (service names, hosts, ports,
        FQDN aliases) — scope JWT issuance accordingly even though no traffic
        bodies or credentials are exposed.

        Returns `404 Not Found` when no mesh slice has been installed yet
        instead of fabricating counts from raw config; this is intentional so
        operators can distinguish pre-slice startup state from real scope.
      tags: [Mesh Egress Scope]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active mesh egress scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshEgressScopeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No active mesh egress scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "503":
          description: Proxy state unavailable in this mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /mesh/egress-scope/test:
    post:
      operationId: testMeshEgressScopeCandidate
      summary: Dry-run a candidate destination against the current Sidecar egress scope
      description: |
        Tests whether a candidate destination is admitted by the current
        resolved Sidecar egress scope. Never mutates slice state and remains
        available in read-only mesh and DP modes with standard JWT authentication.

        Useful to validate critical destinations before flipping
        `FERRUM_MESH_SIDECAR_ENFORCED=true` on the control plane.

        The handler memoises the `OutboundRegistry` against the installed
        snapshot so repeated admin calls reuse the same registry instance.
      tags: [Mesh Egress Scope]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host:
                  type: string
                  description: Destination host (FQDN or short name). Required, non-empty.
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: Optional destination port. When omitted, the registry tries any-port and host-only matches.
            example:
              host: reviews.alpha.svc.cluster.local
              port: 8080
      responses:
        "200":
          description: Decision computed
          content:
            application/json:
              schema:
                type: object
                required: [allowed, decision, host, dry_run]
                properties:
                  allowed:
                    type: boolean
                  decision:
                    type: string
                    enum: [admit, deny]
                  host:
                    type: string
                  port:
                    type: [integer, "null"]
                  dry_run:
                    type: boolean
        "400":
          description: Malformed JSON body, empty/missing host, or port 0
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No active mesh egress scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "503":
          description: Proxy state unavailable in this mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /mesh/federation:
    get:
      operationId: getMeshFederation
      summary: Inspect the live SPIFFE trust-bundle federation snapshot
      description: |
        Returns the currently cached cross-cluster SPIFFE trust bundles
        fetched by the federation poller. The poller hits each
        `MultiClusterConfig.remote_clusters[].federation_endpoint` at
        `FERRUM_MESH_FEDERATION_POLL_INTERVAL_SECONDS` and overlays the
        validated bundle on `TrustBundleSet.federated`. Each entry includes
        the originating cluster name, trust domain, endpoint URL, fetch
        timestamp, derived bundle age, and authority counts.

        Returns `404 Not Found` outside mesh mode (when the mesh runtime
        state is not wired into the admin API) or before the first
        successful poll. Polled bundles win on conflict against any
        CP-supplied federated entries — operators inspect this endpoint to
        confirm the freshest rotation is in effect.
      tags: [Mesh Federation]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cached federation snapshot
          content:
            application/json:
              schema:
                type: object
                required: [bundles]
                properties:
                  bundles:
                    type: array
                    items:
                      type: object
                      required:
                        - cluster
                        - trust_domain
                        - endpoint
                        - fetched_at_unix_seconds
                        - bundle_age_seconds
                        - x509_authorities
                        - jwt_authorities
                      properties:
                        cluster:
                          type: string
                          description: Operator-facing name of the RemoteCluster entry.
                        trust_domain:
                          type: string
                          description: SPIFFE trust domain.
                        endpoint:
                          type: string
                          description: HTTPS endpoint the bundle was fetched from.
                        fetched_at_unix_seconds:
                          type: integer
                          format: int64
                        bundle_age_seconds:
                          type: integer
                          format: int64
                          description: Seconds since `fetched_at_unix_seconds`. Saturates at 0.
                        x509_authorities:
                          type: integer
                          description: Number of cached X.509 authority entries.
                        jwt_authorities:
                          type: integer
                          description: Number of cached JWT authority entries.
                        refresh_hint_seconds:
                          type: [integer, "null"]
                          format: int64
                          description: SPIFFE `spiffe_refresh_hint` from the bundle, if present.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No mesh federation bundles cached yet (poller disabled, not in mesh mode, or no successful poll)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  # ── Mesh remote-cluster discovery (mesh mode, F7.2) ──────────────────
  /mesh/remote-clusters:
    get:
      operationId: getMeshRemoteClusters
      summary: Inspect the data plane's view of multicluster east-west discovery
      description: |
        Returns this DP's view of remote-cluster discovery: which remote
        clusters it has actually fetched endpoints from (cross-cluster
        endpoint discovery), and which remote clusters the accepted slice
        declares. Operators previously inferred remote-cluster state only
        indirectly from `GET /mesh/config-drift`'s workload/service
        `resources` counts; this surface names the clusters directly and
        distinguishes "configured but never polled" from "not configured".

        Two views are returned:
        - `discovered`: remote clusters this DP has successfully polled over
          the native `MeshSubscribe` stream, keyed by cluster name, each with
          per-cluster `workload_count` / `service_count`, the
          `fetched_at_unix_seconds` of the last successful poll, and the
          derived `age_seconds`. `age_seconds` tracks the last successful
          poll, not the last endpoint change: a stable cluster refreshes its
          fetch timestamp every poll, so it does not look stale. This view is
          scoped to the **accepted** slice's clusters (matched by name and
          trust domain) — a cluster in the discovery store but absent from the
          accepted config (e.g. left over from a rejected slice) is omitted,
          so a rejected slice never appears as live discovery. Empty when
          discovery is disabled
          (`FERRUM_MESH_REMOTE_DISCOVERY_POLL_INTERVAL_SECONDS` is `0`), no
          slice has been accepted, no remote cluster is trust-eligible, or no
          poll has succeeded yet.
        - `configured`: remote clusters declared in the **accepted** slice's
          multicluster config — name, trust domain, network, and whether a
          control plane (`control_plane_configured`) / federation endpoint
          (`federation_endpoint_configured`) is set. Each carries a
          `discovered` flag cross-referencing the scoped `discovered` view so a
          configured-but-unreachable cluster is visible.

        The payload is a topology-shape summary — counts and provenance,
        never raw workload addresses, SPIFFE IDs, or control-plane URLs
        (those are surfaced only as booleans) — so the sensitive detail kept
        off `/metrics` stays off this surface too while the JWT gates the
        topology shape it does reveal.

        Returns `404 Not Found` outside mesh mode (when the mesh runtime
        state is not wired into the admin API). Both lists are empty (not
        `404`) when in mesh mode with nothing configured or discovered yet,
        so dashboards can poll continuously across boot.
      tags: [Mesh Remote Clusters]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Remote-cluster discovery and configuration snapshot
          content:
            application/json:
              schema:
                type: object
                required: [discovery_enabled, discovered, configured]
                properties:
                  discovery_enabled:
                    type: boolean
                    description: |
                      `true` when cross-cluster endpoint discovery is enabled
                      (`FERRUM_MESH_REMOTE_DISCOVERY_POLL_INTERVAL_SECONDS > 0`).
                      When `false`, `discovered` is always empty regardless of
                      configuration.
                  discovered:
                    type: array
                    description: |
                      Remote clusters this DP has fetched endpoints from,
                      sorted by `cluster_name`. Scoped to the accepted slice's
                      configured clusters (by name + trust domain); clusters
                      from a received-but-rejected slice are omitted.
                    items:
                      type: object
                      required:
                        - cluster_name
                        - trust_domain
                        - workload_count
                        - service_count
                        - fetched_at_unix_seconds
                        - age_seconds
                      properties:
                        cluster_name:
                          type: string
                          description: Operator-facing remote cluster name (snapshot key, validated unique).
                        trust_domain:
                          type: string
                          description: SPIFFE trust domain the remote endpoints were ingested under.
                        network:
                          type: [string, "null"]
                          description: Istio network label of the remote cluster, when declared.
                        workload_count:
                          type: integer
                          description: Number of remote workloads merged into the local registry from this cluster.
                        service_count:
                          type: integer
                          description: Number of remote services merged into the local registry from this cluster.
                        fetched_at_unix_seconds:
                          type: integer
                          format: int64
                          description: |
                            Unix timestamp (seconds) of the most recent
                            successful poll of this cluster. Refreshed on every
                            successful poll, including no-op polls that returned
                            unchanged endpoints.
                        age_seconds:
                          type: integer
                          format: int64
                          description: |
                            Seconds since the last successful poll
                            (`fetched_at_unix_seconds`), not since the last
                            endpoint change. Saturates at 0 on clock skew.
                  configured:
                    type: array
                    description: Remote clusters declared in the accepted slice's multicluster config, sorted by `cluster_name`.
                    items:
                      type: object
                      required:
                        - cluster_name
                        - trust_domain
                        - control_plane_configured
                        - federation_endpoint_configured
                        - discovered
                        - outbound_trust_active
                        - inbound_trust_active
                        - trust_source
                      properties:
                        cluster_name:
                          type: string
                          description: Operator-facing remote cluster name.
                        trust_domain:
                          type: string
                          description: SPIFFE trust domain declared for the remote cluster.
                        network:
                          type: [string, "null"]
                          description: Istio network label, when declared.
                        control_plane_configured:
                          type: boolean
                          description: |
                            Whether a `control_plane_url` is set — i.e. whether
                            this cluster is a candidate for endpoint discovery
                            at all. `false` means federation-only; it will
                            never appear under `discovered`.
                        federation_endpoint_configured:
                          type: boolean
                          description: Whether a `federation_endpoint` is set for SPIFFE trust-bundle exchange.
                        discovered:
                          type: boolean
                          description: |
                            Whether this cluster is present in the scoped
                            `discovered` view (matched by name + trust domain).
                        outbound_trust_active:
                          type: boolean
                          description: Whether this DP has an active outbound trust bundle for the remote trust domain.
                        inbound_trust_active:
                          type: boolean
                          description: Whether this DP has an active inbound SPIFFE verifier that can authenticate peers from the remote trust domain.
                        trust_source:
                          type: string
                          enum: [polled, control_plane, local, blocked_pending_poll, none]
                          description: |
                            Source of the currently effective remote trust
                            state. `blocked_pending_poll` means fail-closed
                            bootstrap is blocking a CP-supplied fallback until
                            the first successful federation poll.
                        trust_bundle_fetched_at_unix_seconds:
                          type: [integer, "null"]
                          format: int64
                          description: Unix timestamp (seconds) of the last successful polled bundle fetch, present when `trust_source` is `polled`.
                        trust_bundle_age_seconds:
                          type: [integer, "null"]
                          format: int64
                          description: Seconds since the last successful polled bundle fetch, present when `trust_source` is `polled`.
              examples:
                discovery-active:
                  value:
                    discovery_enabled: true
                    discovered:
                      - cluster_name: remote-east
                        trust_domain: east.example.com
                        network: net2
                        workload_count: 12
                        service_count: 3
                        fetched_at_unix_seconds: 1747595531
                        age_seconds: 8
                    configured:
                      - cluster_name: remote-east
                        trust_domain: east.example.com
                        network: net2
                        control_plane_configured: true
                        federation_endpoint_configured: true
                        discovered: true
                        outbound_trust_active: true
                        inbound_trust_active: true
                        trust_source: polled
                        trust_bundle_fetched_at_unix_seconds: 1747595530
                        trust_bundle_age_seconds: 9
                      - cluster_name: remote-west
                        trust_domain: west.example.com
                        control_plane_configured: false
                        federation_endpoint_configured: true
                        discovered: false
                        outbound_trust_active: false
                        inbound_trust_active: false
                        trust_source: blocked_pending_poll
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not in mesh mode (mesh runtime state not wired into the admin API)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  # ── Mesh runtime overlay (mesh mode, GAP-3E) ─────────────────────────
  /mesh/runtime-overlay:
    get:
      operationId: getMeshRuntimeOverlay
      summary: Inspect the xDS RTDS runtime overlay for this workload
      description: |
        Returns the merged runtime overlay built from every
        `envoy.service.runtime.v3.Runtime` layer the mesh xDS client has
        received. Each layer's top-level fields are flattened into a single
        keyed map. Runtime resources are sorted lexicographically by name;
        later names override earlier ones on key conflicts, and duplicate
        names are rejected without replacing the last accepted set.

        Field values are typed:
        - `number` — `f64`
        - `string` — UTF-8 string
        - `bool` — boolean
        - `fractional_percent` — `{numerator, denominator}` shaped like an
          Envoy `FractionalPercent` (`denominator` is one of `hundred`,
          `ten_thousand`, `million`)

        Every proxy-accepted slice publishes the overlay to live consumers:
        - `ferrum.fault_injection.<scope>.abort_percent` /
          `.delay_percent` are captured atomically in the request epoch of
          `fault_injection` plugins that declared the matching scope.
        - `ferrum.request_transformer.<scope>.enabled` /
          `ferrum.response_transformer.<scope>.enabled` short-circuit the
          opted-in header / query / body transformers.
        - `ferrum.log.level` rebuilds the gateway-wide tracing
          `EnvFilter` (any `RUST_LOG`-style directive).

        Returns `404 Not Found` outside mesh mode or before the first
        proxy-accepted slice. Received-but-rejected slices do not update
        this endpoint. An accepted slice with no RTDS layers returns `200`
        with an empty `runtime_overlay` so operators can distinguish "not
        converged yet" from "slice has no RTDS layers".
      tags: [Mesh Runtime Overlay]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current runtime overlay
          content:
            application/json:
              schema:
                type: object
                required: [namespace, version, runtime_overlay]
                properties:
                  namespace:
                    type: string
                  version:
                    type: string
                    description: Mesh slice version that produced this overlay.
                  runtime_overlay:
                    type: object
                    properties:
                      fields:
                        type: object
                        additionalProperties:
                          oneOf:
                            - type: object
                              required: [kind, value]
                              properties:
                                kind:
                                  type: string
                                  enum: [number]
                                value:
                                  type: number
                                  format: double
                            - type: object
                              required: [kind, value]
                              properties:
                                kind:
                                  type: string
                                  enum: [string]
                                value:
                                  type: string
                            - type: object
                              required: [kind, value]
                              properties:
                                kind:
                                  type: string
                                  enum: [bool]
                                value:
                                  type: boolean
                            - type: object
                              required: [kind, value]
                              properties:
                                kind:
                                  type: string
                                  enum: [fractional_percent]
                                value:
                                  type: object
                                  required: [numerator, denominator]
                                  properties:
                                    numerator:
                                      type: integer
                                      format: int32
                                    denominator:
                                      type: string
                                      enum: [hundred, ten_thousand, million]
              examples:
                runtime-overlay-populated:
                  value:
                    namespace: alpha
                    version: v-2026-05-18T00:00:00Z
                    runtime_overlay:
                      fields:
                        envoy.reloadable_features.use_observable_cluster_name:
                          kind: bool
                          value: true
                        envoy.access_loggers.json_default_log_level:
                          kind: string
                          value: warn
                        ferrum.fault.sample_fraction:
                          kind: fractional_percent
                          value:
                            numerator: 25
                            denominator: hundred
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No active mesh runtime overlay
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /mesh/config-drift:
    get:
      operationId: getMeshConfigDrift
      summary: Inspect this DP's accepted slice + RTDS overlay drift status
      description: |
        Returns a structured "where is this DP relative to the CP's last
        push?" view (MESH-T6-C). Operators query this on every DP in a
        deployment and diff the resulting `slice.fingerprint` strings: two
        DPs in the same namespace that should be running the same resources
        produce the same fingerprint; divergence flags a split-brain DP.

        The slice block is always present. It carries the resource counts
        per kind, a stable content fingerprint, and the wall-clock age of
        the last proxy-accepted slice. The `runtime_overlay` block (default
        included) summarises the live RTDS overlay: the number of keys in
        effect, their names, and a typed-value fingerprint. Pass
        `?include_overlay=false` to omit it.

        `slice.fingerprint` is a SHA-256 over a deterministic JSON encoding
        of the slice with per-DP identity metadata (`node_id`,
        `workload_spiffe_id`, `waypoint_name`, `labels`), `version`, and
        `runtime_overlay` stripped. Operators wanting to recompute the
        fingerprint offline must serialise the slice with the same
        canonicalisation: recursively sort object keys (preserve array
        order), then hash the resulting bytes and prefix with `sha256-`.

        Returns 404 outside mesh mode (`mesh_runtime_state` not wired).
        Returns 200 with `slice.last_received_at` elided and zeroed
        resource counts when mesh mode is active but no slice has been
        accepted yet — operators rely on the difference between "404
        (wrong mode)" and "200 with no `last_received_at`" (mesh mode, not
        converged yet).

        Future work: a CP-side endpoint that reports the latest published
        slice version per connected DP would let external tooling diff
        what the CP thinks each DP should have against what each DP
        reports here, without having to walk every DP in lock-step.
      tags: [Mesh Config Drift]
      security:
        - bearerAuth: []
      parameters:
        - name: include_overlay
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: |
            When `true` (default), the response includes the
            `runtime_overlay` block summarising the live RTDS layer. When
            `false`, the block is omitted entirely. Unrecognised values
            fall back to the default — the endpoint does not reject typos.
      responses:
        "200":
          description: Current slice + overlay drift snapshot
          content:
            application/json:
              schema:
                type: object
                required: [slice]
                properties:
                  slice:
                    type: object
                    required: [resources, source_protocol, source_cp_url]
                    properties:
                      last_received_at:
                        type: string
                        format: date-time
                        description: |
                          Wall-clock timestamp of the most recent
                          proxy-accepted slice. Omitted when no slice has
                          been accepted yet.
                      age_seconds:
                        type: integer
                        format: int64
                        minimum: 0
                        description: |
                          `now - last_received_at` in seconds. Omitted
                          when `last_received_at` is absent. A slice
                          installed in the future (clock skew) clamps to
                          zero rather than wrapping around.
                      version:
                        type: string
                        description: |
                          CP-generated slice version string. Omitted when
                          no slice has been accepted.
                      namespace:
                        type: string
                        description: |
                          Slice's `namespace` field. Omitted when no slice
                          has been accepted.
                      resources:
                        type: object
                        description: |
                          Per-resource-kind counts so operators can spot
                          which kind drifted (e.g. "all DestinationRules
                          gone"). Always present, defaults to all zeros
                          before the first slice.
                        required:
                          - workloads
                          - services
                          - mesh_policies
                          - peer_authentications
                          - service_entries
                          - request_authentications
                          - destination_rules
                          - virtual_service_cors_policies
                          - mesh_telemetry
                          - mesh_proxy_configs
                          - extension_configs
                        properties:
                          workloads: { type: integer, minimum: 0 }
                          services: { type: integer, minimum: 0 }
                          mesh_policies: { type: integer, minimum: 0 }
                          peer_authentications: { type: integer, minimum: 0 }
                          service_entries: { type: integer, minimum: 0 }
                          request_authentications: { type: integer, minimum: 0 }
                          destination_rules: { type: integer, minimum: 0 }
                          virtual_service_cors_policies: { type: integer, minimum: 0 }
                          mesh_telemetry: { type: integer, minimum: 0 }
                          mesh_proxy_configs: { type: integer, minimum: 0 }
                          extension_configs: { type: integer, minimum: 0 }
                      fingerprint:
                        type: string
                        pattern: "^sha256-[0-9a-f]{64}$"
                        description: |
                          Stable content hash of the slice with per-DP
                          identity metadata (`node_id`,
                          `workload_spiffe_id`, `waypoint_name`, `labels`),
                          `version`, and `runtime_overlay` stripped. Two DPs
                          expecting the same resources produce the same hash.
                          Omitted when no slice has been accepted.
                      source_protocol:
                        type: string
                        description: |
                          Configured mesh source protocol from
                          `FERRUM_MESH_CONFIG_PROTOCOL` (`native` or
                          `xds`). Surfaced even before the first slice so
                          dashboards can label DPs by source.
                      source_cp_url:
                        type: string
                        description: |
                          First configured CP URL (priority 0). Empty
                          string when none is configured.
                  runtime_overlay:
                    type: object
                    description: |
                      Compact summary of the live RTDS overlay. Distinct
                      from `/mesh/runtime-overlay` — this surface is the
                      sorted key list plus a typed-value fingerprint, not
                      the full typed values, so the response stays cheap to
                      poll. Omitted when no slice has been accepted or when
                      `?include_overlay=false`.
                    required: [key_count, keys, fingerprint]
                    properties:
                      key_count:
                        type: integer
                        minimum: 0
                      keys:
                        type: array
                        description: |
                          Sorted list of overlay keys currently in
                          effect. Always sorted so two DPs with the same
                          overlay produce byte-identical responses.
                        items:
                          type: string
                      fingerprint:
                        type: string
                        pattern: "^sha256-[0-9a-f]{64}$"
                        description: |
                          Stable hash of the full typed overlay values so
                          same-key/different-value RTDS drift is visible.
                  convergence:
                    type: object
                    description: |
                      xDS resource-warming convergence state. Present only in
                      xDS mode after the first ADS response; omitted in native
                      mode. Surfaced here (JWT-authenticated) rather than on the
                      unauthenticated `/metrics` surface because the per-type
                      version strings embed config-change timestamps and content
                      digests.
                    required:
                      - per_type_versions
                      - missing_required_types
                      - converged
                      - version_skew
                    properties:
                      per_type_versions:
                        type: object
                        additionalProperties:
                          type: string
                        description: |
                          Received `version_info` per subscribed resource type,
                          keyed by short name (`cds`/`eds`/`lds`/`rds`/`sds`/
                          `ecds`/`rtds`).
                      missing_required_types:
                        type: array
                        items:
                          type: string
                        description: |
                          Required mesh-slice types (short names) that have not
                          yet delivered an initial response. Empty once the first
                          slice can build.
                      converged:
                        type: boolean
                        description: |
                          True once every required type has delivered a response
                          (the first slice can build).
                      version_skew:
                        type: boolean
                        description: |
                          True when the converged required-type versions are not
                          all identical — normal under resource warming after an
                          incremental (e.g. policy/workload-only ECDS) update.
              examples:
                config-drift-populated:
                  value:
                    slice:
                      last_received_at: "2026-05-18T19:32:11Z"
                      age_seconds: 45
                      version: v-2026-05-18T00:00:00Z
                      namespace: alpha
                      resources:
                        workloads: 5
                        services: 17
                        mesh_policies: 23
                        peer_authentications: 5
                        service_entries: 12
                        request_authentications: 4
                        destination_rules: 12
                        virtual_service_cors_policies: 2
                        mesh_telemetry: 2
                        mesh_proxy_configs: 1
                        extension_configs: 0
                      fingerprint: "sha256-9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
                      source_protocol: native
                      source_cp_url: "grpcs://cp-primary.mesh.svc.cluster.local:50051"
                    runtime_overlay:
                      key_count: 2
                      keys:
                        - ferrum.fault.sample
                        - ferrum.log.level
                      fingerprint: "sha256-3f786850e387550fdab836ed7e6dc881de23001b48c2fb5e7d8f4d1c2a0b9e8f"
                    convergence:
                      per_type_versions:
                        cds: "2026-05-18T00:00:00Z:9f86d0818840"
                        eds: "2026-05-18T00:00:00Z:9f86d0818840"
                        lds: "2026-05-18T00:00:00Z:9f86d0818840"
                        rds: "2026-05-18T00:00:00Z:9f86d0818840"
                        ecds: "2026-05-18T19:32:00Z:3f786850e387"
                      missing_required_types: []
                      converged: true
                      version_skew: true
                config-drift-pre-convergence:
                  summary: Mesh mode active but no slice accepted yet
                  value:
                    slice:
                      resources:
                        workloads: 0
                        services: 0
                        mesh_policies: 0
                        peer_authentications: 0
                        service_entries: 0
                        request_authentications: 0
                        destination_rules: 0
                        virtual_service_cors_policies: 0
                        mesh_telemetry: 0
                        mesh_proxy_configs: 0
                        extension_configs: 0
                      source_protocol: native
                      source_cp_url: "grpcs://cp-primary.mesh.svc.cluster.local:50051"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No active mesh runtime state (not in mesh mode)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /mesh/policy-denies/recent:
    get:
      operationId: getMeshPolicyDeniesRecent
      summary: Aggregated recent mesh_authz denies for ad-hoc triage
      description: |
        Returns the top-N most recent `mesh_authz` deny events grouped by the
        `(rule, source, destination, reason)` tuple. The recorder is
        process-singleton, bounded FIFO (`FERRUM_MESH_POLICY_DENY_LOG_CAPACITY`,
        default 10000), and exception-path only — the proxy hot path never
        touches it; only the `mesh_authz` deny branch records into it. The
        endpoint reads a one-shot snapshot of the ring, filters by `at >=
        now - window`, groups by the 4-tuple, sorts by count descending
        (tie-break `last_at` descending, then `rule` ascending), and
        truncates to `limit`.

        The endpoint complements `ferrum_mesh_requests_total{response_code="403"}`
        from the Prometheus dashboard — that metric counts denies in
        aggregate, while this endpoint preserves the drill-down dimensions
        an operator needs when diagnosing a misconfigured
        `AuthorizationPolicy`.

        `source` and `destination` are omitted (instead of serialised as
        `null`) when the deny fired before either identity was known — for
        example unauthenticated HBONE baggage.

        Returns `404 Not Found` outside mesh mode. Returns `400 Bad Request`
        when `window` exceeds 1 hour, is `0`, or `limit` exceeds 1000.
      tags: [Mesh Policy Denies]
      security:
        - bearerAuth: []
      parameters:
        - name: window
          in: query
          required: false
          description: |
            Aggregation window. Accepts the compact suffixes `s`/`m`/`h`
            (e.g. `30s`, `5m`, `1h`) or a bare integer of seconds. Defaults
            to `5m`; maximum is `1h`.
          schema:
            type: string
            default: "5m"
          examples:
            short:
              value: "5m"
            seconds:
              value: "300"
            max:
              value: "1h"
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of grouped rows to return. Defaults to `50`,
            maximum `1000`. `0` returns no grouped rows but preserves
            `total_denies` for the window.
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 50
      responses:
        "200":
          description: Aggregated recent denies for the requested window
          content:
            application/json:
              schema:
                type: object
                required: [window_seconds, limit, total_denies, grouped]
                properties:
                  window_seconds:
                    type: integer
                    format: int64
                    description: |
                      Effective window in seconds after parsing.
                  limit:
                    type: integer
                    description: Effective row limit after clamping.
                  total_denies:
                    type: integer
                    format: int64
                    description: |
                      Total individual deny events within the window
                      (pre-grouping).
                  grouped:
                    type: array
                    items:
                      type: object
                      required: [rule, reason, count, first_at, last_at]
                      properties:
                        rule:
                          type: string
                          description: |
                            Name (or synthetic identifier) of the
                            `MeshPolicy` rule that fired. Synthesised
                            reasons (`unauthenticated_baggage`,
                            `trust_domain_mismatch`, `untrusted_assertor`)
                            reuse the reason string here so operators can
                            still pivot on "rule".
                        source:
                          type: string
                          description: |
                            SPIFFE ID of the source workload, when known.
                            Omitted (the field is absent, not `null`) when
                            the deny fired before any identity was
                            established (e.g. unauthenticated HBONE).
                        destination:
                          type: string
                          description: |
                            SPIFFE ID of the destination workload (the local
                            mesh workload's identity), when present.
                            Omitted (the field is absent, not `null`) for
                            stream-only denies.
                        reason:
                          type: string
                          description: |
                            Categorical reason captured from
                            `ctx.metadata["mesh_authz.deny_policy"]`.
                        count:
                          type: integer
                          format: int64
                        first_at:
                          type: string
                          format: date-time
                          description: |
                            UTC timestamp (RFC 3339) of the oldest event in
                            this group within the requested window.
                        last_at:
                          type: string
                          format: date-time
                          description: |
                            UTC timestamp (RFC 3339) of the newest event in
                            this group within the requested window.
              examples:
                grouped-denies:
                  value:
                    window_seconds: 300
                    limit: 50
                    total_denies: 1234
                    grouped:
                      - rule: deny-prod-from-staging
                        source: spiffe://cluster.local/ns/staging/sa/web
                        destination: spiffe://cluster.local/ns/prod/sa/api
                        reason: namespace_mismatch
                        count: 87
                        first_at: "2026-05-18T19:32:11Z"
                        last_at: "2026-05-18T19:36:48Z"
        "400":
          description: |
            Query parameter rejected. `window` exceeded 1 hour, was `0`, was
            unparseable, or `limit` exceeded 1000.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No active mesh policy-deny recorder — the gateway is running
            outside mesh mode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  # ── Audit ────────────────────────────────────────────────────────────
  /audit:
    parameters:
      - $ref: "#/components/parameters/XFerrumNamespace"
    get:
      operationId: listAuditEvents
      summary: List admin audit events
      description: |
        Returns successful admin API mutation events for the selected namespace.
        Requires an admin-role JWT. Each event includes actor, action, resource
        identity, timestamp, and a JSON diff. Consumer credential data is
        redacted before it is written to the audit log. Sensitive plugin
        configuration is redacted as well; Loki endpoint paths/queries,
        authorization, and all custom-header values are never persisted in
        the diff. Basic credential
        mutations remain visible by type and action, but values, entry fields,
        shape, and count are replaced by one stable `[REDACTED]` marker.

        `limit` follows the shared bounds (default 100, maximum 1000), but this
        endpoint's `offset` ceiling is narrower than the shared
        `PaginationOffset` description: the audit store indexes offsets as a
        32-bit value, so an `offset` above 4294967295 is rejected with `400`
        even though other list endpoints accept it up to 2^63 - 1. The audit
        response uses its own `{items, limit, offset, next_offset, total}`
        envelope rather than the shared `data`/`pagination` envelope.
        `next_offset` is `null` when the next page does not exist or its cursor
        cannot be represented without exceeding the 32-bit ceiling.
      tags: [Audit]
      parameters:
        - name: actor
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
        - name: start
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/PaginationLimit"
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: uint32
            minimum: 0
            maximum: 4294967295
            default: 0
          description: |
            Number of audit events to skip. Negative, non-integer, or values
            above 4294967295 are rejected with `400`.
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Batch ────────────────────────────────────────────────────────────
  /batch:
    parameters:
      - $ref: "#/components/parameters/XFerrumNamespace"
    post:
      operationId: batchCreate
      summary: Batch create resources
      description: |
        Creates multiple resources in a single request. Each resource type is
        persisted in a single database transaction, dramatically improving
        throughput compared to individual create calls.

        Resources are created in dependency order: consumers and upstreams
        first, then proxies, then plugin configs. This ensures referential
        integrity when plugins reference proxy IDs or consumer usernames.

        All fields within each resource follow the same schema as the
        individual create endpoints. IDs are auto-generated if omitted.
        Plaintext Basic-auth passwords require a configured
        `FERRUM_BASIC_AUTH_HMAC_SECRET` of at least 32 bytes; missing or weak
        operator configuration fails the batch with 500 before persistence.
      tags: [Batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateRequest"
      responses:
        "201":
          description: All resources created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateResponse"
        "207":
          description: Partial success — some resource types failed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BatchCreateResponse"
                  - type: object
                    properties:
                      errors:
                        type: array
                        items:
                          type: string
                        description: Error messages for failed resource types
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/NamespaceAdmissionUnavailable"

  # ── Backup & Restore ────────────────────────────────────────────────
  /backup:
    parameters:
      - $ref: "#/components/parameters/XFerrumNamespace"
    get:
      operationId: backupConfig
      summary: Export full gateway configuration
      description: |
        Returns the complete gateway configuration as a single JSON document
        suitable for archival or later restoration via `POST /restore`.

        The output format is compatible with `POST /batch` (additive import)
        and `POST /restore` (full replacement). Consumer credentials are
        included **unredacted** since this is a backup endpoint.

        Falls back to the in-memory cached configuration when the database is
        unavailable, indicated by the `X-Data-Source: cached` response header.

        ### Size guidance

        The response is a single JSON document containing all requested
        resources. Typical sizes:

        | Deployment | Resources | Approx size |
        |------------|-----------|-------------|
        | Small | ~100 proxies, ~50 consumers | 100–200 KB |
        | Medium | ~1,000 proxies, ~500 consumers | 1–2 MB |
        | Large | ~5,000 proxies, ~3,000 consumers | 5–10 MB |
        | Very large | 10,000+ proxies, 5,000+ consumers | 15+ MB |

        For very large deployments, use the `resources` query parameter to
        back up individual resource types separately.
      tags: [Backup & Restore]
      parameters:
        - name: resources
          in: query
          required: false
          description: |
            Comma-separated list of resource types to include.
            Valid values: `proxies`, `consumers`, `plugin_configs`, `upstreams`.
            When omitted, all resource types are included.
          schema:
            type: string
            example: "proxies,upstreams"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Full configuration backup
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="ferrum-backup.json"'
            X-Data-Source:
              schema:
                type: string
                enum: [database, cached]
                description: Where the config was read from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /restore:
    parameters:
      - $ref: "#/components/parameters/XFerrumNamespace"
    post:
      operationId: restoreConfig
      summary: Replace all configuration from a backup
      description: |
        **Replacement operation** — snapshots the current namespace, deletes
        all existing resources, and imports the provided configuration. If any
        import (or the delete) step fails, Ferrum clears the partial state and
        reapplies the snapshot. One persistent namespace-scoped datastore guard
        normally spans that compensating clear and every replay batch, so other
        DNS-sensitive writers cannot interleave with the rollback-only raw
        replay. If a successful clear settles after its namespace lease expires
        and another writer commits under the next generation, recovery keeps
        current resources authoritative for matching IDs, validates the combined
        transaction-log schema graph, and inserts only missing snapshot resources.
        It never clears the intervening write; an invalid combined graph is
        rejected before replay. Requires `?confirm=true` query parameter to
        prevent accidental invocation.

        The recovery snapshot uses a **non-validating raw load** from the
        primary, so an already-invalid-but-present namespace (the case an
        operator runs restore to *repair*) still snapshots and keeps rollback
        available. If the snapshot cannot be taken, restore aborts before any
        delete: connectivity failures return `503`, while corrupt/undecodable
        stored resources return `500` with `failure_class: data_integrity` and
        a safe resource type/id when available. `api_specs` are admin-only metadata outside the config and
        are NOT restored by rollback; a failed restore reports the authoritative
        total number that must be re-submitted via `POST /api-specs` (list the
        namespace's current specs with `GET /api-specs`).

        Accepts the same JSON format produced by `GET /backup`. Resources are
        imported in dependency order (consumers & upstreams first, then proxies,
        then plugin configs).

        To perform an additive (non-destructive) import, use `POST /batch`
        instead.

        ### Body size limit

        Default: **100 MiB** (supports ~30K proxies + 90K plugins).
        Configurable via the `FERRUM_ADMIN_RESTORE_MAX_BODY_SIZE_MIB`
        environment variable. Returns `413 Payload Too Large` when exceeded.

        Database inserts are chunked into 1,000-record transactions to keep
        WAL/redo size bounded. A 90K-plugin restore runs as 90 commits, not
        one massive transaction.

        For configurations exceeding the body limit, restore resource types
        separately using `POST /batch` with partial backup files
        (generated via `GET /backup?resources=proxies`, etc.).
      tags: [Backup & Restore]
      parameters:
        - name: confirm
          in: query
          required: true
          description: Must be `true` to confirm the destructive operation
          schema:
            type: boolean
            enum: [true]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "200":
          description: Configuration restored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResponse"
        "500":
          description: >-
            Restore failed (import, delete, or preparation). The prior
            configuration was reapplied, additively reconciled with an
            intervening post-expiry write, or the response warns that the
            best-effort rollback was incomplete. Additive reconciliation rejects
            an invalid combined transaction-log schema graph before replaying any
            snapshot resources. Also returned when a stored row/document cannot
            be decoded for the pre-delete rollback snapshot; that fail-safe
            response has `failure_class: data_integrity` and no delete is
            attempted.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                  restore_errors:
                    type: array
                    items:
                      type: string
                    description: Persistence or preparation errors that caused the restore to fail
                  rollback:
                    type: string
                    enum: [completed, incomplete, not_needed, unknown_outcome]
                    description: >-
                      Outcome of the best-effort rollback. `completed` — prior
                      config reapplied, or a valid late-clear union retained both
                      intervening and missing prior resources; `incomplete` —
                      reapply failed or an invalid late-clear union was rejected
                      before replay (see `rollback_errors`); `not_needed` — the
                      clear failed atomically (SQL / replica-set MongoDB), so
                      nothing was deleted and the prior config was retained
                      without any compensating re-import; `unknown_outcome` — an
                      ambiguous MongoDB commit result could not be resolved by
                      authoritative post-state counts, so manual recovery is
                      required.
                  failure_class:
                    type: string
                    enum: [data_integrity]
                    description: >-
                      Present on a pre-delete snapshot abort caused by a corrupt
                      or otherwise undecodable stored resource. The existing
                      configuration was not deleted. `restore_errors` identifies
                      the resource type/id when safely available.
                  rollback_errors:
                    type: array
                    items:
                      type: string
                    description: Present only when reapplying the prior configuration was incomplete
                  api_specs_not_restored:
                    type: integer
                    description: >-
                      Authoritative count of API specs present before the restore
                      that a config rollback cannot restore. Present only when the
                      namespace carried specs.
                  api_specs_note:
                    type: string
                    description: >-
                      Operator guidance to recover the affected API specs
                      (re-submit original documents via POST /api-specs and list
                      current specs with GET /api-specs). Present only when
                      `api_specs_not_restored` is set.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "413":
          description: Request body too large (default max 100 MiB, configurable via FERRUM_ADMIN_RESTORE_MAX_BODY_SIZE_MIB)
        "503":
          description: >-
            Restore aborted because the pre-snapshot namespace guard could not
            be acquired or the prior configuration could not be snapshotted for
            rollback. A database/connectivity failure has `failure_class:
            connectivity`. Existing config was NOT deleted; retry once the
            database is reachable. Guard contention or an intentionally retained
            uncertain operation instead returns the stable retryable
            namespace-admission error.
          headers:
            Retry-After:
              description: Present as `1` for namespace-admission contention.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                  failure_class:
                    type: string
                    enum: [connectivity]
                    description: Distinguishes a retryable guard/snapshot availability failure from stored-data corruption.
                  restore_errors:
                    type: array
                    items:
                      type: string
                    description: The guard, snapshot, or connectivity error that caused the abort

  # ── Proxies ─────────────────────────────────────────────────────────
  /proxies:
    parameters:
      - $ref: "#/components/parameters/XFerrumNamespace"
    get:
      operationId: listProxies
      summary: List proxies (paginated)
      description: |
        Falls back to cached config when the database is unavailable.

        Returns a paginated envelope with `data` and `pagination` fields.
      tags: [Proxies]
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Paginated proxy objects
          headers:
            X-Data-Source:
              $ref: "#/components/headers/X-Data-Source"
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Proxy"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      operationId: createProxy
      summary: Create a proxy
      description: |
        Creates a new proxy route. A UUID is generated when `id` is omitted or
        empty. `created_at` and `updated_at` are set automatically.
      tags: [Proxies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyCreate"
      responses:
        "201":
          description: Proxy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proxy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "409":
          description: Conflict — `listen_path` already exists, stream proxy `listen_port` conflicts with another proxy or reserved/unavailable port, or the proxy's plugin associations would make mTLS DNS identities ambiguous
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/NamespaceAdmissionUnavailable"

  /proxies/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/XFerrumNamespace"

    get:
      operationId: getProxy
      summary: Get a proxy
      tags: [Proxies]
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Proxy object
          headers:
            X-Data-Source:
              $ref: "#/components/headers/X-Data-Source"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proxy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    put:
      operationId: updateProxy
      summary: Update a proxy
      description: |
        Replaces the proxy with the given body. The `id` field in the body is
        ignored — the path parameter is authoritative. `updated_at` is set
        automatically.
      tags: [Proxies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyCreate"
      responses:
        "200":
          description: Proxy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proxy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict — `listen_path` already exists on another proxy, stream proxy `listen_port` conflicts with another proxy or reserved/unavailable port, or the proxy's plugin associations would make mTLS DNS identities ambiguous
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/NamespaceAdmissionUnavailable"

    delete:
      operationId: deleteProxy
      summary: Delete a proxy
      description: |
        Deletes the proxy and its proxy-owned cascade resources. If the proxy is
        owned by an API spec, the spec row and spec-owned resources are also
        deleted. When namespace admission is lost after that deletion commits,
        SQL backends and replica-set MongoDB use the API-spec compensation
        transaction to restore the stamped spec resources, an orphaned
        hand-owned upstream, hand-owned cascade plugins, associations, and
        config-change records together. Before persistence, the namespace
        snapshot is used only to discover affected IDs; the current upstream
        and cascade plugins are re-read with ownership metadata intact.
        Hand-owned rows remain hand-owned, the API-spec snapshot supplies
        stamped bundle rows, and foreign ownership or an unrestorable ownership
        shape returns 400 without deleting the proxy. A shared hand-owned
        upstream that remained live is reused rather than inserted again only
        when its stable creation identity and ownership match the pre-delete
        snapshot; a same-ID replacement rejects recovery. The recovered proxy
        graph's current upstream, plugin-composition, and named-schema
        dependencies are revalidated before commit with the configured backend
        egress policy and real-IP header. Standalone MongoDB fails closed before
        multi-document compensation writes.
      tags: [Proxies]
      responses:
        "204":
          description: Proxy deleted
        "400":
          description: Deletion would leave an invalid plugin-composition graph, or an API-spec-owned proxy has foreign/missing ownership metadata or another restore-snapshot shape that atomic compensation cannot reproduce safely
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NamespaceAdmissionUnavailable"

  # ── Consumers ───────────────────────────────────────────────────────
  /consumers:
    parameters:
      - $ref: "#/components/parameters/XFerrumNamespace"
    get:
      operationId: listConsumers
      summary: List consumers (paginated)
      description: |
        Returns a paginated envelope with `data` and `pagination` fields.
      tags: [Consumers]
      parameters:
        - $ref: "#/components/parameters/PaginationOffset"
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Paginated consumer objects
          headers:
            X-Data-Source:
              $ref: "#/components/headers/X-Data-Source"
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Consumer"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      operationId: createConsumer
      summary: Create a consumer
      description: |
        Creates a new API consumer. A UUID is generated when `id` is omitted
        or empty. Plaintext `password` fields inside `basicauth` credentials
        are automatically HMAC-SHA256 hashed (using `FERRUM_BASIC_AUTH_HMAC_SECRET`)
        and stored as `password_hash`.
      tags: [Consumers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerCreate"
      responses:
        "201":
          description: Consumer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consumer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/NamespaceAdmissionUnavailable"

  /consumers/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/XFerrumNamespace"

    get:
      operationId: getConsumer
      summary: Get a consumer
      tags: [Consumers]
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Consumer object
          headers:
            X-Data-Source:
              $ref: "#/components/headers/X-Data-Source"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consumer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    put:
      operationId: updateConsumer
      summary: Update a consumer
      description: >-
        When `basicauth` is omitted from the request, an existing Basic
        credential type is preserved; use `DELETE
        /consumers/{id}/credentials/basicauth` to remove it.


        Update accepts `ConsumerUpdate`, which differs from the create body
        only in also accepting the exact `[REDACTED]` placeholder entries the
        ordinary `Consumer` response returns, so a read-modify-write round trip
        of that response validates against this schema.
      tags: [Consumers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerUpdate"
      responses:
        "200":
          description: Consumer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consumer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/NamespaceAdmissionUnavailable"

    delete:
      operationId: deleteConsumer
      summary: Delete a consumer
      tags: [Consumers]
      responses:
        "204":
          description: Consumer deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NamespaceAdmissionUnavailable"

  /consumers/{consumer_id}/credentials/{cred_type}:
    parameters:
      - name: consumer_id
        in: path
        required: true
        schema:
          type: string
        description: Consumer ID
      - $ref: "#/components/parameters/XFerrumNamespace"

    put:
      operationId: updateConsumerCredentials
      summary: Replace all credentials of a type
      description: |
        Replaces the entire credential value for the given type. Accepts a single
        JSON object or an array of objects; stored credentials are normalized to
        a non-empty array. For `basicauth`, plaintext `password` fields are
        automatically hashed and stored as `password_hash`. Custom credential
        types are not writable here; use whole-Consumer create/update/batch for
        custom maps and `DELETE` to remove them.
      tags: [Consumers]
      parameters:
        - name: cred_type
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/BuiltInCredentialType"
          description: >-
            Built-in credential type to replace. Matches runtime
            `ALLOWED_CREDENTIAL_TYPES`; any other path segment returns `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ConsumerCredentialInput"
                - type: array
                  items:
                    $ref: "#/components/schemas/ConsumerCredentialInput"
                  minItems: 1
              description: Credential payload (entry shape depends on `{cred_type}`)
              examples:
                - password: s3cret
                - key: my-api-key-value
      responses:
        "200":
          description: Credentials updated — returns full consumer object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consumer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/NamespaceAdmissionUnavailable"

    post:
      operationId: appendConsumerCredential
      summary: Append a credential entry for rotation
      description: |
        Appends a new credential entry to the given type, enabling zero-downtime
        credential rotation. Credentials are stored as arrays. Max entries per
        type is controlled by
        `FERRUM_MAX_CREDENTIALS_PER_TYPE` (default: 2). For `basicauth`, plaintext
        `password` fields are automatically hashed. Custom credential types are
        not writable here; use whole-Consumer create/update/batch for custom
        maps and `DELETE` to remove them.
      tags: [Consumers]
      parameters:
        - name: cred_type
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/BuiltInCredentialType"
          description: >-
            Built-in credential type to append to. Matches runtime
            `ALLOWED_CREDENTIAL_TYPES`; any other path segment returns `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerCredentialInput"
      responses:
        "200":
          description: Credential appended — returns full consumer object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consumer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/NamespaceAdmissionUnavailable"

    delete:
      operationId: deleteConsumerCredentials
      summary: Remove all credentials of a type
      description: |
        Removes the entire credential value for the given type. The known types
        are always accepted and the delete is idempotent. An unknown/custom
        credential type is accepted only when the consumer actually stores it —
        such types are hidden from ordinary Consumer responses and therefore
        preserved across whole-Consumer `PUT`, so this endpoint is the only way
        to remove them. An unknown type the consumer does not store returns
        `400`.
      tags: [Consumers]
      parameters:
        - name: cred_type
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CredentialTypeName"
          description: |
            Credential type to remove: one of the built-in types
            (`keyauth`, `basicauth`, `jwt`, `hmac_auth`, `mtls_auth`) or an
            unknown/custom credential type already stored on the consumer.
            Because credential type keys are restricted to one path-safe URI
            segment, every stored type — including hidden custom types that
            whole-Consumer `PUT` preserves — is addressable here. `PUT` and
            `POST` on this path advertise only `BuiltInCredentialType`; this
            `DELETE` parameter stays the broader `CredentialTypeName`.
      responses:
        "204":
          description: Credential removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReadOnly"
        "404":
