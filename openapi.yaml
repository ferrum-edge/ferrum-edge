  /admin/tls/rotate/{surface}:
    post:
      operationId: forceRotateTlsSurface
      summary: Force an active TLS source watcher to re-pull sources
      description: |
        Enqueues an immediate source poll for an active TLS source watcher.
        Supported surfaces are `proxy_https`, `backend_tls`, `admin_https`,
        `dtls`, `database_tls`, `cp_grpc`, `dp_grpc`, `svid`, and `all`. Aliases
        `frontend`, `backend`, `admin`, `frontend_dtls`, `db`, `database`,
        `cp_grpc_tls`, `dp_grpc_tls`, and `gateway_svid` are accepted. Watcher-backed TLS reloads return after
        enqueueing; rotation success or failure is reported asynchronously via
        `/admin/tls/events` and Prometheus metrics. The `svid` surface validates
        and reloads the gateway SVID synchronously, then publishes a backend
        SVID generation bump on success.
      tags: [TLS]
      parameters:
        - name: surface
          in: path
          required: true
          schema:
            type: string
            enum: [proxy_https, backend_tls, admin_https, dtls, database_tls, cp_grpc, dp_grpc, frontend, backend, admin, frontend_dtls, db, database, cp_grpc_tls, dp_grpc_tls, svid, gateway_svid, all]
      responses:
        "202":
          description: Reload request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  requested_surface:
                    type: string
                  surface:
                    type: string
                  surfaces:
                    type: array
                    items:
                      type: string
                  gateway_svid_revision:
                    type: integer
                    format: uint64
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No active watcher is registered for the requested surface
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  requested_surface:
                    type: string
                  normalized_surface:
                    type: string
                  available_surfaces:
                    type: array
                    items:
                      type: string

