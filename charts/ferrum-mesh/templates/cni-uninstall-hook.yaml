{{- /*
  CNI cleanup on `helm uninstall` (issue #3609).

  Enabling nodeAgent.cni writes a chained `*-ferrum.conflist` into every
  node's /etc/cni/net.d. From that point every pod ADD on the node traverses
  ferrum-cni, and an ADD that cannot reach the node-agent fails closed. So a
  release that is deleted without removing that file leaves a node-wide
  pod-creation outage behind, pointing at a socket that no longer exists.

  Shape of the fix, and why:

  * A DaemonSet, not a Job. Cleanup has to happen on EVERY node that ever ran
    the installer; a Job runs on one node and would silently strand the rest
    of a multi-node cluster. Each pod becomes Ready only after
    `ferrum-cni uninstall` succeeded on ITS node.
  * PLUS a later-weighted wait Job, because Helm's hook wait only watches
    `Job` and `Pod` kinds — a hook DaemonSet on its own is created and then
    left behind, so the release (and the node-agent socket) could be deleted
    while cleanup pods were still starting. The Job blocks on the DaemonSet's
    ready count and gives the phase a completion boundary Helm understands.
    A node that cannot be cleaned fails the uninstall visibly instead of
    reporting a clean removal. Once every node has reported success the Job
    deletes the cleanup DaemonSet itself (foreground propagation) and does
    not report success until the API server no longer serves it — so no
    cleanup pod is left running when the release goes away.
  * `pre-delete`, so all of this happens while the node-agent and its socket
    are still part of the release.
  * `pre-delete` ONLY. `helm upgrade` and `helm rollback` do not fire it, so a
    routine rolling pod replacement never removes CNI state that is still
    required.
  * Narrow identities, held OUTSIDE this hook. The cleanup ServiceAccounts,
    Role and RoleBinding are ordinary release resources in
    cni-cleanup-rbac.yaml, not hook resources — see the long explanation
    there. In short: on Helm 3.19+ / v4 a hook failure also deletes the
    earlier hooks that carry `hook-succeeded`, so identity and RBAC held that
    way would vanish exactly when a retry needs them.
  * Deletion policies are asymmetric, on purpose:
      - the DaemonSet gets `before-hook-creation` ONLY. Helm's hook wait
        understands neither DaemonSets nor readiness of their pods, so a
        `hook-succeeded` policy would delete it the instant it was created —
        and on Helm 3.19+ / v4 would also delete it (together with any other
        succeeded hook) if the wait Job later failed. The wait Job removes it
        explicitly instead, after every node has reported success.
      - the wait Job may keep `hook-succeeded`: it is the last hook in the
        phase, and everything a retry depends on — the ServiceAccounts, the
        Role, the RoleBinding, and (on failure) the DaemonSet itself — is
        durable independently of it.
  * Removal itself is ownership-scoped in the binary — only artifacts carrying
    this release's `managedBy`/`owner` marker are touched, and only after
    symlink/hard-link/size/content checks. Another product's CNI config, or
    another Ferrum release's, is left exactly as it was.

  Failure is deliberately loud AND recoverable: a cleanup container exits
  non-zero, its pod restarts, readiness never flips, the wait Job times out,
  and `helm uninstall` fails. The cleanup DaemonSet, its pods and its logs
  survive that failure (no `hook-succeeded` policy), as do the release-owned
  ServiceAccounts and RBAC, so `kubectl -n <ns> logs
  daemonset/ferrum-mesh-cni-cleanup` still works and re-running
  `helm uninstall` re-creates the DaemonSet (`before-hook-creation`) and
  drives the same wait again. Recover a node that cannot be cleaned at all
  with the manual steps in docs/node_agent.md "Recovering a node".
*/ -}}
{{- $cni := .Values.nodeAgent.cni }}
{{- $uninstall := dict "enabled" false }}
{{- if and $cni $cni.uninstall }}{{ $uninstall = $cni.uninstall }}{{ end }}
{{- if and .Values.nodeAgent.enabled $cni $cni.enabled $uninstall.enabled }}
{{- $imageRepository := toString (default .Values.image.repository .Values.nodeAgent.image.repository) -}}
{{- $imageTag := include "ferrum-mesh.resolveImageTag" (dict "root" . "override" .Values.nodeAgent.image.tag) -}}
{{- if and (eq (lower (toString .Values.nodeAgent.captureMode)) "ebpf") (not (hasSuffix "-ebpf" $imageTag)) -}}
{{- $imageTag = printf "%s-ebpf" $imageTag -}}
{{- end -}}
{{- $image := printf "%s:%s" $imageRepository $imageTag -}}
{{- $ownerId := printf "%s/%s" .Release.Namespace .Release.Name -}}
{{- $readyMarker := "/tmp/ferrum-cni-uninstall.ready" -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ferrum-mesh-cni-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-cni-cleanup
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    {{- /* before-hook-creation ONLY — the wait Job owns the deletion. See
           the header: a hook-succeeded policy here would delete this
           DaemonSet immediately (Helm cannot wait on the kind) and would
           also delete it if the wait Job later failed, destroying both the
           evidence and the retry. */}}
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrum-mesh-cni-cleanup
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-mesh-cni-cleanup
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- /*
        hostNetwork is LOAD-BEARING, not a convenience. Cleanup runs exactly
        when a chained ferrum-cni is on the node and its socket is about to
        disappear (or already has), and a chained ADD fails closed. A pod that
        needed its own CNI sandbox would therefore be stuck in
        ContainerCreating behind the very chain it exists to remove — the hook
        would deadlock on every node it is most needed. Pods with
        hostNetwork: true skip CNI ADD entirely, exactly like the node-agent
        DaemonSet this hook cleans up after.
      */}}
      hostNetwork: true
      dnsPolicy: Default
      serviceAccountName: ferrum-mesh-cni-cleanup
      {{- include "ferrum-mesh.imagePullSecrets" . }}
      automountServiceAccountToken: false
      {{- with $uninstall.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ferrum-cni-cleanup
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/ferrum-cni
            - uninstall
          env:
            - name: HOST_BIN_DIR
              value: {{ $cni.hostBinDir | quote }}
            - name: HOST_CONF_DIR
              value: {{ $cni.hostConfDir | quote }}
            - name: CONF_FILE_NAME
              value: {{ $cni.confFileName | quote }}
            {{- /* Owner only, no generation: whichever revision of THIS
                   release is currently installed on the node must go. */}}
            - name: EXPECTED_OWNER
              value: {{ $ownerId | quote }}
            {{- /* Publishing this marker is what makes the pod Ready, so
                   Helm's hook wait means "cleanup finished on this node". */}}
            - name: READY_MARKER_PATH
              value: {{ $readyMarker | quote }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: host-cni-bin
              mountPath: {{ $cni.hostBinDir }}
            - name: host-cni-conf
              mountPath: {{ $cni.hostConfDir }}
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - /app/ferrum-cni
                - uninstall-status
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 1
          resources:
            {{- toYaml (default dict $uninstall.resources) | nindent 12 }}
      volumes:
        - name: host-cni-bin
          hostPath:
            path: {{ $cni.hostBinDir }}
            type: DirectoryOrCreate
        - name: host-cni-conf
          hostPath:
            path: {{ $cni.hostConfDir }}
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ferrum-mesh-cni-cleanup-wait
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-cni-cleanup-wait
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-delete
    {{- /* Later than the DaemonSet so it waits on an object that exists. */}}
    "helm.sh/hook-weight": "10"
    {{- /* Safe to delete on success: this is the last hook in the phase, and
           everything a retry needs (the ServiceAccounts, the Role, the
           RoleBinding, and on failure the cleanup DaemonSet) outlives it. */}}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  {{- /* One attempt. A retry would restart the wait budget and hide a node
         that never finished behind an apparently fresh timer. */}}
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-mesh-cni-cleanup-wait
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- /*
        Same reason as the cleanup DaemonSet: the wait Job has to be
        schedulable on a node whose CNI chain is broken. It reaches the API
        server through KUBERNETES_SERVICE_HOST (an IP), so it needs no cluster
        DNS and keeps dnsPolicy: Default.
      */}}
      hostNetwork: true
      dnsPolicy: Default
      serviceAccountName: ferrum-mesh-cni-cleanup-wait
      {{- include "ferrum-mesh.imagePullSecrets" . }}
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ferrum-cni-cleanup-wait
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/ferrum-cni
            - await-cleanup
          env:
            - name: RELEASE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: CLEANUP_DAEMONSET_NAME
              value: ferrum-mesh-cni-cleanup
            - name: CLEANUP_TIMEOUT_SECS
              value: {{ default 240 $uninstall.timeoutSeconds | quote }}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml (default dict $uninstall.resources) | nindent 12 }}
{{- end }}
