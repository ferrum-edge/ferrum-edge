{{- include "ferrum-mesh.validateCrds" . -}}
{{- $crds := .Values.crds | default dict -}}
{{- $install := true -}}
{{- if hasKey $crds "install" -}}
{{- $install = $crds.install -}}
{{- end -}}
{{- if $install -}}
{{- $crdName := "udpresponseamplificationpolicies.gateway.ferrum.io" -}}
{{- $existing := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $crdName -}}
{{- $ann := dict -}}
{{- if and $existing $existing.metadata -}}
{{- $ann = $existing.metadata.annotations | default dict -}}
{{- end -}}
{{- $owner := index $ann "meta.helm.sh/release-name" | default "" -}}
{{- $foreign := and $existing $owner (ne $owner .Release.Name) -}}
{{- $unmanaged := and $existing (not $owner) -}}
{{- $adopt := false -}}
{{- if hasKey $crds "adoptExisting" -}}
{{- $adopt = $crds.adoptExisting -}}
{{- end -}}
{{- if $unmanaged -}}
{{- if not $adopt -}}
{{- fail "UDPResponseAmplificationPolicy CRD exists but is not Helm-managed (installed from the former charts/ferrum-mesh/crds/ directory). Operator action: helm upgrade --take-ownership --set crds.adoptExisting=true. See docs/upgrade_guide.md. Do not set crds.install=false; that leaves the cluster on a stale schema." -}}
{{- end -}}
{{- end -}}
{{/* A CRD owned by ANOTHER Helm release is left alone: sharing one
     cluster-scoped CRD across releases is ordinary Helm practice, and taking it
     over here would fight that release on every upgrade. Rendering nothing is
     therefore correct — but it must not be SILENT, because a release that
     manages no CRD can sit on a stale schema, which is the drift crds.install
     exists to prevent. NOTES.txt discloses the owning release on install and
     upgrade; `helm template` cannot see ownership at all (lookup is empty), so
     this is a live-cluster concern only. */}}
{{- if not $foreign -}}
{{- $schemaVersion := "v1alpha1-1" -}}
{{- $policy := $crds.udpResponseAmplificationPolicy | default dict -}}
{{- $wanted := index $policy "schemaVersion" | default $schemaVersion | toString -}}
{{- if ne $wanted $schemaVersion -}}
{{- fail (printf "crds.udpResponseAmplificationPolicy.schemaVersion must be %s to match the CRD this chart ships" $schemaVersion) -}}
{{- end -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: udpresponseamplificationpolicies.gateway.ferrum.io
  labels:
    app.kubernetes.io/name: ferrum-mesh
    app.kubernetes.io/instance: {{ .Release.Name }}
    gateway.ferrum.io/policy: udp-amplification
  annotations:
    gateway.ferrum.io/crd-schema-version: {{ $schemaVersion | quote }}
    helm.sh/resource-policy: keep
spec:
  group: gateway.ferrum.io
  names:
    kind: UDPResponseAmplificationPolicy
    listKind: UDPResponseAmplificationPolicyList
    plural: udpresponseamplificationpolicies
    singular: udpresponseamplificationpolicy
    shortNames:
      - udpamp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Factor
          type: number
          jsonPath: .spec.maxResponseAmplificationFactor
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: >
                Ferrum Direct Policy Attachment that sets the UDP response
                amplification budget for Gateway API UDPRoute listeners.
                Ordinary UDPRoute translation never programs an unlimited
                relay; missing or invalid policy falls through to the finite
                controller default (8.0). Unlimited requires mode=Unlimited
                and acknowledgeUnsafeAmplification=true.
              properties:
                targetRefs:
                  type: array
                  maxItems: 16
                  description: >
                    Gateways or UDPRoutes this policy attaches to. Empty
                    targetRefs is valid only as a GatewayClass.parametersRef
                    default. Cross-namespace targets require a ReferenceGrant
                    from gateway.ferrum.io/UDPResponseAmplificationPolicy.
                  items:
                    type: object
                    required: ["kind", "name"]
                    properties:
                      group:
                        type: string
                        default: gateway.networking.k8s.io
                      kind:
                        type: string
                        enum: ["Gateway", "UDPRoute"]
                      name:
                        type: string
                        minLength: 1
                      namespace:
                        type: string
                      sectionName:
                        type: string
                        description: Gateway listener name. Invalid on UDPRoute targets.
                mode:
                  type: string
                  default: Finite
                  enum: ["Finite", "Unlimited"]
                maxResponseAmplificationFactor:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 1024
                  description: Required when mode is Finite. Rejected if zero, negative, non-finite, or greater than 1024.
                acknowledgeUnsafeAmplification:
                  type: boolean
                  description: Required true when mode is Unlimited. Must not be set for Finite.
            status:
              type: object
              properties:
                ancestors:
                  type: array
                  maxItems: 16
                  items:
                    type: object
                    properties:
                      ancestorRef:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      controllerName:
                        type: string
                      conditions:
                        type: array
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
{{- end -}}
{{- end -}}
