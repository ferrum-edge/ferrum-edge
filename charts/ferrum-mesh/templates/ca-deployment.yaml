{{- if .Values.ca.enabled }}
{{- $caEnv := .Values.ca.env | default dict -}}
{{- $admin := include "ferrum-mesh.resolveComponentAdmin" (dict "component" "ca" "env" $caEnv "admin" (.Values.ca.admin | default dict)) | fromYaml -}}
{{- $handlers := dict "live" (dict) "ready" (dict) -}}
{{- if ne (toString $admin.port) "0" -}}
{{- $handlers = include "ferrum-mesh.adminHealthHandlers" $admin | fromYaml -}}
{{- end -}}
{{- $liveHandler := .Values.ca.probes.liveness.override | default dict -}}
{{- if not $liveHandler }}{{- $liveHandler = $handlers.live | default dict -}}{{- end -}}
{{- $readyHandler := .Values.ca.probes.readiness.override | default dict -}}
{{- if not $readyHandler }}{{- $readyHandler = $handlers.ready | default dict -}}{{- end -}}
{{- $startupHandler := .Values.ca.probes.startup.override | default dict -}}
{{- if not $startupHandler }}{{- $startupHandler = $liveHandler -}}{{- end -}}
{{- /* An admin HTTP port of 0 leaves the computed handlers empty; `renderProbes`
       would then silently omit the enabled probe, so a ca rollout would keep
       serving from the Service endpoint set through shutdown. Fail per probe.
       Startup is classified independently so liveness.override cannot replace an
       explicit startup.override (or hide a missing computed startup handler). */ -}}
{{- include "ferrum-mesh.validateComputedProbeHandlers" (dict "component" "ca" "probes" .Values.ca.probes "startupHandler" $startupHandler "liveHandler" $liveHandler "readyHandler" $readyHandler) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrum-mesh-ca
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-ca
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrum-mesh-ca
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-mesh-ca
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: ferrum-mesh-ca
      {{- include "ferrum-mesh.imagePullSecrets" . }}
      terminationGracePeriodSeconds: {{ .Values.ca.terminationGracePeriodSeconds }}
      {{- with .Values.ca.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.ca.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ferrum-edge
          image: {{ include "ferrum-mesh.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          {{- with .Values.ca.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or (ne (toString $admin.port) "0") (ne (toString $admin.httpsPort) "0") }}
          ports:
            {{- if ne (toString $admin.port) "0" }}
            - name: admin-http
              containerPort: {{ $admin.port }}
              protocol: TCP
            {{- end }}
            {{- with (include "ferrum-mesh.adminHttpsPort" (dict "resolved" $admin)) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- end }}
          env:
            {{- include "ferrum-mesh.renderControlPlaneRequiredEnv" . | nindent 12 }}
            - name: FERRUM_MODE
              value: cp
            {{- include "ferrum-mesh.adminEnv" (dict "env" $caEnv "resolved" $admin) | nindent 12 }}
            {{- include "ferrum-mesh.shutdownEnv" .Values.ca | nindent 12 }}
            {{- include "ferrum-mesh.metricsEnv" . | nindent 12 }}
            {{- range $name, $value := .Values.ca.env }}
            {{- if not (has $name (list "FERRUM_DB_TYPE" "FERRUM_DB_URL" "FERRUM_ADMIN_JWT_SECRET" "FERRUM_CP_DP_GRPC_JWT_SECRET" "FERRUM_ADMIN_HTTP_PORT" "FERRUM_ADMIN_HTTPS_PORT" "FERRUM_ADMIN_BIND_ADDRESS" "FERRUM_ALLOW_INSECURE_ADMIN_HTTP" "FERRUM_ADMIN_ALLOWED_CIDRS" "FERRUM_MODE")) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with (include "ferrum-mesh.adminTlsVolumeMount" (dict "resolved" $admin)) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- include "ferrum-mesh.renderProbes" (dict "probes" .Values.ca.probes "startupHandler" $startupHandler "liveHandler" $liveHandler "readyHandler" $readyHandler) }}
          {{- include "ferrum-mesh.preStopLifecycle" .Values.ca | nindent 10 }}
          {{- with .Values.ca.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with (include "ferrum-mesh.adminTlsVolume" (dict "resolved" $admin)) }}
        {{- . | nindent 8 }}
        {{- end }}
{{- end }}
