{{- if .Values.eastWest.enabled }}
{{- $ewEnv := .Values.eastWest.env | default dict -}}
{{- $admin := include "ferrum-mesh.resolveComponentAdmin" (dict "component" "eastWest" "env" $ewEnv "admin" (.Values.eastWest.admin | default dict)) | fromYaml -}}
{{- $handlers := dict "live" (dict) "ready" (dict) -}}
{{- if ne (toString $admin.port) "0" -}}
{{- $handlers = include "ferrum-mesh.adminHealthHandlers" $admin | fromYaml -}}
{{- end -}}
{{- $liveHandler := .Values.eastWest.probes.liveness.override | default dict -}}
{{- if not $liveHandler }}{{- $liveHandler = $handlers.live | default dict -}}{{- end -}}
{{- $readyHandler := .Values.eastWest.probes.readiness.override | default dict -}}
{{- if not $readyHandler }}{{- $readyHandler = $handlers.ready | default dict -}}{{- end -}}
{{- $startupHandler := .Values.eastWest.probes.startup.override | default dict -}}
{{- if not $startupHandler }}{{- $startupHandler = $liveHandler -}}{{- end -}}
{{- /* Per-probe, not the pair: one custom override must not let a DIFFERENT
       enabled probe render with no handler, which `renderProbes` would silently
       omit — losing drain-aware readiness on the SNI Service. Startup is
       classified independently so liveness.override cannot replace an explicit
       startup.override. */ -}}
{{- include "ferrum-mesh.validateComputedProbeHandlers" (dict "component" "eastWest" "probes" .Values.eastWest.probes "startupHandler" $startupHandler "liveHandler" $liveHandler "readyHandler" $readyHandler) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrum-mesh-east-west
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-east-west
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.eastWest.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrum-mesh-east-west
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-mesh-east-west
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: ferrum-mesh-east-west
      {{- include "ferrum-mesh.imagePullSecrets" . }}
      terminationGracePeriodSeconds: {{ .Values.eastWest.terminationGracePeriodSeconds }}
      {{- with .Values.eastWest.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
{{- include "ferrum-mesh.renderTopologySpreadConstraints" (dict
  "Release" .Release
  "replicas" .Values.eastWest.replicas
  "selectorName" "ferrum-mesh-east-west"
  "constraints" .Values.eastWest.topologySpreadConstraints) }}
      {{- with .Values.eastWest.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ferrum-edge
          image: {{ include "ferrum-mesh.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          {{- with .Values.eastWest.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: tls-passthru
              containerPort: {{ .Values.eastWest.listenPort }}
            {{- if ne (toString $admin.port) "0" }}
            - name: admin-http
              containerPort: {{ $admin.port }}
              protocol: TCP
            {{- end }}
            {{- with (include "ferrum-mesh.adminHttpsPort" (dict "resolved" $admin)) }}
            {{- . | nindent 12 }}
            {{- end }}
          env:
            - name: FERRUM_MESH_EAST_WEST_LISTEN_PORT
              value: {{ .Values.eastWest.listenPort | quote }}
            {{- include "ferrum-mesh.adminEnv" (dict "env" $ewEnv "resolved" $admin) | nindent 12 }}
            {{- include "ferrum-mesh.shutdownEnv" .Values.eastWest | nindent 12 }}
            {{- include "ferrum-mesh.metricsEnv" . | nindent 12 }}
            {{- range $name, $value := .Values.eastWest.env }}
            {{- if not (has $name (list "FERRUM_MESH_EAST_WEST_LISTEN_PORT" "FERRUM_ADMIN_HTTP_PORT" "FERRUM_ADMIN_HTTPS_PORT" "FERRUM_ADMIN_BIND_ADDRESS" "FERRUM_ALLOW_INSECURE_ADMIN_HTTP" "FERRUM_ADMIN_ALLOWED_CIDRS")) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- include "ferrum-mesh.renderProbes" (dict "probes" .Values.eastWest.probes "startupHandler" $startupHandler "liveHandler" $liveHandler "readyHandler" $readyHandler) }}
          {{- include "ferrum-mesh.preStopLifecycle" .Values.eastWest | nindent 10 }}
          {{- with .Values.eastWest.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with (include "ferrum-mesh.adminTlsVolumeMount" (dict "resolved" $admin)) }}
            {{- . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with (include "ferrum-mesh.adminTlsVolume" (dict "resolved" $admin)) }}
        {{- . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ferrum-mesh-east-west
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: ferrum-mesh-east-west
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: tls-passthru
      port: {{ .Values.eastWest.listenPort }}
      targetPort: tls-passthru
{{- end }}
