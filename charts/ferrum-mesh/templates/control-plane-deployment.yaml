{{- if .Values.controlPlane.enabled }}
{{- $cpEnv := .Values.controlPlane.env | default dict -}}
{{- $adminTarget := include "ferrum-mesh.adminProbeTargetFromEnv" $cpEnv | fromYaml -}}
{{- $handlers := dict "live" (dict) "ready" (dict) -}}
{{- if ne (toString $adminTarget.port) "0" -}}
{{- $handlers = include "ferrum-mesh.adminHealthHandlers" $adminTarget | fromYaml -}}
{{- end -}}
{{- $liveHandler := .Values.controlPlane.probes.liveness.override | default dict -}}
{{- if not $liveHandler }}{{- $liveHandler = $handlers.live | default dict -}}{{- end -}}
{{- $readyHandler := .Values.controlPlane.probes.readiness.override | default dict -}}
{{- if not $readyHandler }}{{- $readyHandler = $handlers.ready | default dict -}}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrum-mesh-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrum-mesh-control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-mesh-control-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: ferrum-mesh
      containers:
        - name: ferrum-edge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          ports:
            - name: grpc
              containerPort: {{ .Values.controlPlane.grpcPort }}
          env:
            {{- include "ferrum-mesh.renderControlPlaneRequiredEnv" . | nindent 12 }}
            {{- if not (hasKey .Values.controlPlane.env "FERRUM_K8S_CONTROLLER_NAMESPACE") }}
            - name: FERRUM_K8S_CONTROLLER_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- end }}
            {{- range $name, $value := .Values.controlPlane.env }}
            {{- if not (has $name (list "FERRUM_DB_TYPE" "FERRUM_DB_URL" "FERRUM_ADMIN_JWT_SECRET" "FERRUM_CP_DP_GRPC_JWT_SECRET")) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.controlPlane.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "ferrum-mesh.renderProbes" (dict "probes" .Values.controlPlane.probes "liveHandler" $liveHandler "readyHandler" $readyHandler) }}
      {{- with .Values.controlPlane.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ferrum-mesh-control-plane
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: ferrum-mesh-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: grpc
      port: {{ .Values.controlPlane.grpcPort }}
      targetPort: grpc
{{- end }}
