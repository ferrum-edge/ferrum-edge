{{- if .Values.injector.enabled }}
{{- include "ferrum-mesh.validateInjectorTrust" . -}}
{{- $injectorCa := .Values.injector.caBundle | toString | trim -}}
{{- $injectorCm := .Values.injector.certManager | default dict -}}
{{- $injectorInjectFrom := index $injectorCm "injectCaFrom" | default "" | toString | trim -}}
{{- $tcpHandler := dict "tcpSocket" (dict "port" "webhook") -}}
{{- $liveHandler := .Values.injector.probes.liveness.override | default dict -}}
{{- if not $liveHandler }}{{- $liveHandler = $tcpHandler -}}{{- end -}}
{{- $readyHandler := .Values.injector.probes.readiness.override | default dict -}}
{{- if not $readyHandler }}{{- $readyHandler = $tcpHandler -}}{{- end -}}
{{- $startupHandler := .Values.injector.probes.startup.override | default dict -}}
{{- if not $startupHandler }}{{- $startupHandler = $liveHandler -}}{{- end -}}
{{- include "ferrum-mesh.validateComputedProbeHandlers" (dict "component" "injector" "probes" .Values.injector.probes "startupHandler" $startupHandler "liveHandler" $liveHandler "readyHandler" $readyHandler) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrum-mesh-injector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.injector.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrum-mesh-injector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-mesh-injector
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: ferrum-mesh
{{- include "ferrum-mesh.renderTopologySpreadConstraints" (dict
  "Release" .Release
  "replicas" .Values.injector.replicas
  "selectorName" "ferrum-mesh-injector"
  "constraints" .Values.injector.topologySpreadConstraints) }}
{{ with .Values.injector.podSecurityContext }}
      securityContext:
{{ toYaml . | nindent 8 }}
{{ end }}
      containers:
        - name: ferrum-edge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
{{ with .Values.injector.securityContext }}
          securityContext:
{{ toYaml . | nindent 12 }}
{{ end }}
          ports:
            - name: webhook
              containerPort: {{ .Values.injector.listenPort }}
          env:
            - name: FERRUM_INJECTOR_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.injector.listenPort }}"
            - name: FERRUM_INJECTOR_SIDECAR_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            - name: FERRUM_INJECTOR_REQUIRE_ANNOTATION
              value: {{ .Values.injector.requireAnnotation | quote }}
            - name: FERRUM_INJECTOR_TLS_CERT_PATH
              value: {{ .Values.injector.tls.certPath | quote }}
            - name: FERRUM_INJECTOR_TLS_KEY_PATH
              value: {{ .Values.injector.tls.keyPath | quote }}
            {{- range $name, $value := .Values.injector.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- include "ferrum-mesh.renderProbes" (dict "probes" .Values.injector.probes "startupHandler" $startupHandler "liveHandler" $liveHandler "readyHandler" $readyHandler) }}
          volumeMounts:
            - name: injector-tls
              mountPath: /etc/ferrum/injector/tls
              readOnly: true
{{ with .Values.injector.resources }}
          resources:
{{ toYaml . | nindent 12 }}
{{ end }}
      volumes:
        - name: injector-tls
          secret:
            secretName: {{ .Values.injector.tls.secretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: ferrum-mesh-injector
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: ferrum-mesh-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: webhook
      port: {{ .Values.injector.listenPort }}
      targetPort: webhook
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: ferrum-mesh-injector-{{ .Release.Name }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-injector
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if $injectorInjectFrom }}
  annotations:
    cert-manager.io/inject-ca-from: {{ $injectorInjectFrom | quote }}
  {{- end }}
webhooks:
  - name: sidecar-injector.ferrum.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: {{ .Values.injector.failurePolicy }}
    namespaceSelector:
{{ include "ferrum-mesh.renderInjectorWebhookNamespaceSelector" (dict "Release" .Release "namespaceSelector" .Values.injector.namespaceSelector) | nindent 6 }}
    objectSelector:
      matchExpressions:
        - key: app.kubernetes.io/name
          operator: NotIn
          values:
            - ferrum-mesh-injector
    clientConfig:
      service:
        name: ferrum-mesh-injector
        namespace: {{ .Release.Namespace }}
        path: /mutate
        port: {{ .Values.injector.listenPort }}
      {{- if $injectorCa }}
      caBundle: {{ $injectorCa | quote }}
      {{- end }}
    rules:
      - operations:
          - CREATE
        apiGroups:
          - ""
        apiVersions:
          - v1
        resources:
          - pods
{{- end }}
