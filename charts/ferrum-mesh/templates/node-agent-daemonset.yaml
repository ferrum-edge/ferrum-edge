{{- if .Values.nodeAgent.enabled }}
{{- /*
  Resolve security knobs from .Values.nodeAgent.security with hardened defaults.
  Each toggle is reversible via Helm values so older kernels / strict admission
  controllers can roll back individually. See docs/node_agent_security.md.
*/ -}}
{{- $sec := .Values.nodeAgent.security | default dict -}}
{{- $nodeAgentProxyMode := replace "-" "_" (lower (toString .Values.nodeAgent.proxyMode)) -}}
{{- $addPerfmon := true -}}
{{- if hasKey $sec "addCapPerfmon" }}{{ $addPerfmon = get $sec "addCapPerfmon" }}{{ end -}}
{{- $dropSysAdmin := false -}}
{{- if hasKey $sec "dropCapSysAdmin" }}{{ $dropSysAdmin = get $sec "dropCapSysAdmin" }}{{ end -}}
{{- $caps := list "BPF" "NET_ADMIN" -}}
{{- if $addPerfmon }}{{ $caps = append $caps "PERFMON" }}{{ end -}}
{{- if or (not $dropSysAdmin) (eq $nodeAgentProxyMode "node_waypoint") }}{{ $caps = append $caps "SYS_ADMIN" }}{{ end -}}
{{- $readOnlyRoot := true -}}
{{- if hasKey $sec "readOnlyRootFilesystem" }}{{ $readOnlyRoot = get $sec "readOnlyRootFilesystem" }}{{ end -}}
{{- $allowEsc := false -}}
{{- if hasKey $sec "allowPrivilegeEscalation" }}{{ $allowEsc = get $sec "allowPrivilegeEscalation" }}{{ end -}}
{{- /*
  seccompProfile is passed through as-is so callers setting
  `type: Localhost` can also provide `localhostProfile: <path>` (required by
  the kubernetes API server for that type). Default to RuntimeDefault when
  the operator unsets the block entirely.
*/ -}}
{{- $seccompProfile := dict "type" "RuntimeDefault" -}}
{{- if and (hasKey $sec "seccompProfile") (get $sec "seccompProfile") -}}
{{- $candidate := get $sec "seccompProfile" -}}
{{- if and (kindIs "map" $candidate) (hasKey $candidate "type") (get $candidate "type") -}}
{{- $seccompProfile = $candidate -}}
{{- end -}}
{{- end -}}
{{- $cni := .Values.nodeAgent.cni }}
{{- $cniSocketPath := "" }}
{{- if and $cni $cni.enabled }}
{{- $cniSocketPath = printf "%s/%s" $cni.hostSocketDir $cni.socketFileName }}
{{- end }}
{{- $nodeAgentImageRepository := toString (default .Values.image.repository .Values.nodeAgent.image.repository) -}}
{{- $nodeAgentImageTag := toString (default .Values.image.tag .Values.nodeAgent.image.tag) -}}
{{- if and (eq (lower (toString .Values.nodeAgent.captureMode)) "ebpf") (not (hasSuffix "-ebpf" $nodeAgentImageTag)) -}}
{{- $nodeAgentImageTag = printf "%s-ebpf" $nodeAgentImageTag -}}
{{- end -}}
{{- $nodeAgentImage := printf "%s:%s" $nodeAgentImageRepository $nodeAgentImageTag -}}
{{- $nodeAgentAdminBindAddress := toString .Values.nodeAgent.admin.bindAddress -}}
{{- $nodeAgentAdminProbeHost := include "ferrum-mesh.adminProbeHost" $nodeAgentAdminBindAddress -}}
{{- $nodeWaypointRegistryEnabled := eq $nodeAgentProxyMode "node_waypoint" -}}
{{- $ambientEnv := default dict .Values.ambient.env -}}
{{- $ambientTopology := replace "-" "_" (lower (trim (toString (index $ambientEnv "FERRUM_MESH_TOPOLOGY")))) -}}
{{- /* Ambient per-pod-netns UDP capture producer (#2013): when the Ambient
       topology has UDP capture enabled, the node-agent must publish the per-pod
       registry so the ambient proxy's producer can discover enrolled pods. The
       node-agent only WRITES the registry files (no setns / extra caps needed);
       the ambient proxy does the in-netns work. Derived from ambient.env so the
       flag has a single source of truth across both DaemonSets. */ -}}
{{- /* Only `true`/`1` (matches the Rust parse_bool_env, which rejects yes/on);
       kept in lock-step with the ambient DaemonSet predicate (codex). */ -}}
{{- $ambientUdpCaptureEnabled := false -}}
{{- if hasKey $ambientEnv "FERRUM_MESH_CAPTURE_UDP_ENABLED" -}}
{{- $ambientUdpCaptureEnabled = has (lower (trim (toString (index $ambientEnv "FERRUM_MESH_CAPTURE_UDP_ENABLED")))) (list "true" "1") -}}
{{- end -}}
{{- /* Keep this lifecycle predicate in lock-step with ambient-daemonset.yaml.
       Render the registry and topology even for captureMode=iptables so the
       node-agent reaches its Rust fail-closed gate instead of silently starting
       a fallback that cannot publish the pod registry. */ -}}
{{- $ambientUdpLifecycle := and .Values.ambient.enabled (eq $ambientTopology "ambient") .Values.nodeAgent.enabled -}}
{{- $ambientUdpProducer := and $ambientUdpLifecycle $ambientUdpCaptureEnabled -}}
{{- $nodeAgentPublishesRegistry := or $nodeWaypointRegistryEnabled $ambientUdpLifecycle -}}
{{- $nodeAgentManagedEnv := list
  "FERRUM_MODE"
  "FERRUM_MESH_CAPTURE_MODE"
  "FERRUM_NODE_AGENT_PROXY_MODE"
  "FERRUM_MESH_PROXY_UID"
  "FERRUM_MESH_CAPTURE_INCLUDE_CIDRS"
  "FERRUM_MESH_CAPTURE_EXCLUDE_CIDRS"
  "FERRUM_MESH_CAPTURE_EXCLUDE_PORTS"
  "FERRUM_NODE_AGENT_FALLBACK_MODE"
  "FERRUM_NODE_AGENT_CGROUP_ROOT"
  "FERRUM_NODE_AGENT_BPF_FS_PATH"
  "FERRUM_MESH_NODE_WAYPOINT_POD_REGISTRY_DIR"
  "FERRUM_MESH_CAPTURE_UDP_ENABLED"
  "FERRUM_MESH_TOPOLOGY"
  "FERRUM_NODE_AGENT_ADMIN_ENABLED"
  "FERRUM_ADMIN_BIND_ADDRESS"
  "FERRUM_ADMIN_HTTP_PORT"
  "FERRUM_NODE_AGENT_NODE_NAME"
  "FERRUM_NODE_AGENT_NODE_IP"
  "FERRUM_NODE_AGENT_NODE_IPS"
  "FERRUM_NODE_AGENT_INGRESS_REDIRECT_IFACES"
  "FERRUM_MESH_INBOUND_LISTEN_ADDR"
  "FERRUM_NODE_AGENT_CNI_ENABLED"
  "FERRUM_NODE_AGENT_CNI_SOCKET_PATH"
-}}
{{- range $name, $_ := .Values.nodeAgent.env }}
{{- if has $name $nodeAgentManagedEnv -}}
{{- fail (printf "nodeAgent.env.%s is chart-managed; set the corresponding nodeAgent value instead of overriding the rendered environment" $name) -}}
{{- end -}}
{{- end -}}
{{- if $nodeWaypointRegistryEnabled -}}
{{- if ne (lower (toString .Values.nodeAgent.captureMode)) "ebpf" -}}
{{- fail "nodeAgent.proxyMode=node_waypoint requires nodeAgent.captureMode=ebpf" -}}
{{- end -}}
{{- if not .Values.ambient.enabled -}}
{{- fail "nodeAgent.proxyMode=node_waypoint requires ambient.enabled=true" -}}
{{- end -}}
{{- if ne $ambientTopology "node_waypoint" -}}
{{- fail "nodeAgent.proxyMode=node_waypoint requires ambient.env.FERRUM_MESH_TOPOLOGY=node_waypoint" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ferrum-mesh-node-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ferrum-mesh-node-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrum-mesh-node-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-mesh-node-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: ferrum-node-agent
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile:
          {{- toYaml $seccompProfile | nindent 10 }}
      {{- if and $cni $cni.enabled }}
      # CNI installer init container (opt-in). Executes the distroless-safe
      # `ferrum-cni install` mode: it copies the binary into the host CNI
      # plugin dir, reads the existing primary CNI config, appends Ferrum as a
      # meta-plugin, and writes the generated conflist.
      initContainers:
        - name: ferrum-cni-installer
          image: {{ $nodeAgentImage | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/ferrum-cni
            - install
          env:
            - name: HOST_BIN_DIR
              value: {{ $cni.hostBinDir | quote }}
            - name: HOST_CONF_DIR
              value: {{ $cni.hostConfDir | quote }}
            - name: HOST_SOCKET_DIR
              value: {{ $cni.hostSocketDir | quote }}
            - name: CONF_FILE_NAME
              value: {{ $cni.confFileName | quote }}
            - name: CHAINED_WITH
              value: {{ $cni.chainedWith | quote }}
            - name: SOCKET_PATH
              value: {{ $cniSocketPath | quote }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: host-cni-bin
              mountPath: {{ $cni.hostBinDir }}
            - name: host-cni-conf
              mountPath: {{ $cni.hostConfDir }}
            - name: host-ferrum-socket-dir
              mountPath: {{ $cni.hostSocketDir }}
      {{- end }}
      containers:
        - name: ferrum-edge
          image: {{ $nodeAgentImage | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: false
            allowPrivilegeEscalation: {{ $allowEsc }}
            readOnlyRootFilesystem: {{ $readOnlyRoot }}
            capabilities:
              drop: ["ALL"]
              add:
                {{- range $cap := $caps }}
                - {{ $cap }}
                {{- end }}
          env:
            - name: FERRUM_MODE
              value: "node_agent"
            - name: FERRUM_MESH_CAPTURE_MODE
              value: {{ .Values.nodeAgent.captureMode | quote }}
            - name: FERRUM_NODE_AGENT_PROXY_MODE
              value: {{ $nodeAgentProxyMode | quote }}
            - name: FERRUM_MESH_PROXY_UID
              value: {{ .Values.nodeAgent.proxyUid | quote }}
            - name: FERRUM_MESH_CAPTURE_INCLUDE_CIDRS
              value: {{ .Values.nodeAgent.capture.includeCidrs | quote }}
            - name: FERRUM_MESH_CAPTURE_EXCLUDE_CIDRS
              value: {{ .Values.nodeAgent.capture.excludeCidrs | quote }}
            - name: FERRUM_MESH_CAPTURE_EXCLUDE_PORTS
              value: {{ .Values.nodeAgent.capture.excludePorts | quote }}
            - name: FERRUM_NODE_AGENT_FALLBACK_MODE
              value: {{ .Values.nodeAgent.fallbackMode | quote }}
            - name: FERRUM_NODE_AGENT_CGROUP_ROOT
              value: {{ .Values.nodeAgent.cgroupRoot | quote }}
            - name: FERRUM_NODE_AGENT_BPF_FS_PATH
              value: {{ .Values.nodeAgent.bpfFsPath | quote }}
            {{- if $nodeAgentPublishesRegistry }}
            - name: FERRUM_MESH_NODE_WAYPOINT_POD_REGISTRY_DIR
              value: {{ .Values.nodeAgent.podRegistryDir | quote }}
            {{- end }}
            {{- if $ambientUdpLifecycle }}
            {{- /* Propagate Ambient topology even while UDP is disabled so the
                   node-agent keeps publishing the registry and re-derives
                   disabled-cleanup acknowledgements. The capture flag remains
                   producer-only, so disabled cleanup never arms readiness. */}}
            - name: FERRUM_MESH_TOPOLOGY
              value: "ambient"
            {{- end }}
            {{- if $ambientUdpProducer }}
            - name: FERRUM_MESH_CAPTURE_UDP_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.nodeAgent.admin.enabled }}
            - name: FERRUM_NODE_AGENT_ADMIN_ENABLED
              value: "true"
            - name: FERRUM_ADMIN_BIND_ADDRESS
              value: {{ $nodeAgentAdminBindAddress | quote }}
            - name: FERRUM_ADMIN_HTTP_PORT
              value: {{ .Values.nodeAgent.admin.port | quote }}
            {{- end }}
            - name: FERRUM_NODE_AGENT_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.nodeAgent.trustedKubeletProbeSourceIps }}
            - name: FERRUM_NODE_AGENT_NODE_IPS
              value: {{ .Values.nodeAgent.trustedKubeletProbeSourceIps | quote }}
            {{- end }}
            {{- if .Values.nodeAgent.ingressRedirectIfaces }}
            {{- if ne $nodeAgentProxyMode "node_waypoint" }}
            {{- fail "nodeAgent.ingressRedirectIfaces requires nodeAgent.proxyMode=node_waypoint; only NodeWaypoint runs the transparent inbound capture listener the redirect steers into" }}
            {{- end }}
            {{- /* The redirect fails closed: an in-scope packet with no
                   resolvable capture-listener socket is dropped, never
                   delivered. So the ambient NodeWaypoint proxy must actually be
                   deployed on this node, or enabling the redirect would
                   black-hole inbound traffic for every enrolled workload. */ -}}
            {{- $ambientTopology := replace "-" "_" (lower (trim (toString (index (default dict .Values.ambient.env) "FERRUM_MESH_TOPOLOGY")))) }}
            {{- if or (not .Values.ambient.enabled) (ne $ambientTopology "node_waypoint") }}
            {{- fail "nodeAgent.ingressRedirectIfaces requires ambient.enabled=true with ambient.env.FERRUM_MESH_TOPOLOGY=node_waypoint: the redirect steers inbound TCP into the node's transparent inbound capture listener and drops in-scope traffic when no such listener exists" }}
            {{- end }}
            - name: FERRUM_NODE_AGENT_INGRESS_REDIRECT_IFACES
              value: {{ .Values.nodeAgent.ingressRedirectIfaces | quote }}
            {{- /* PORT CONTRACT. The redirect steers at the proxy's transparent
                   inbound CAPTURE listener, which binds
                   FERRUM_MESH_INBOUND_LISTEN_ADDR — never the HBONE port, which
                   terminates authenticated H2 CONNECT over mesh mTLS and cannot
                   consume raw application bytes. The node-agent derives the
                   steer port from the SAME variable, so it must be rendered
                   identically into BOTH containers; an operator override that
                   reached only the proxy would leave the classifier steering at
                   the default port and drop every captured connection.
                   The node-agent additionally refuses to start unless the value
                   is a wildcard address with a non-zero port distinct from the
                   HBONE and outbound capture ports. */ -}}
            {{- $ambientInboundAddr := toString (index (default dict .Values.ambient.env) "FERRUM_MESH_INBOUND_LISTEN_ADDR") }}
            {{- if $ambientInboundAddr }}
            - name: FERRUM_MESH_INBOUND_LISTEN_ADDR
              value: {{ $ambientInboundAddr | quote }}
            {{- end }}
            {{- end }}
            {{- if and $cni $cni.enabled }}
            - name: FERRUM_NODE_AGENT_CNI_ENABLED
              value: "true"
            - name: FERRUM_NODE_AGENT_CNI_SOCKET_PATH
              value: {{ $cniSocketPath | quote }}
            {{- end }}
            {{- range $name, $value := .Values.nodeAgent.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: bpf-fs
              mountPath: {{ .Values.nodeAgent.bpfFsPath }}
            - name: cgroup
              mountPath: {{ .Values.nodeAgent.cgroupRoot }}
              readOnly: true
            {{- if $readOnlyRoot }}
            # Scratch tmpfs required when readOnlyRootFilesystem=true so the
            # tokio/tracing runtime can open transient files. See
            # docs/node_agent_security.md for the full rationale.
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if and $cni $cni.enabled }}
            - name: host-ferrum-socket-dir
              mountPath: {{ $cni.hostSocketDir }}
            {{- end }}
            {{- if $nodeAgentPublishesRegistry }}
            - name: node-waypoint-pod-registry
              mountPath: {{ .Values.nodeAgent.podRegistryDir }}
            {{- end }}
          resources:
            {{- toYaml .Values.nodeAgent.resources | nindent 12 }}
          {{- /* Preserve special behavior: no computed probes when admin is
                 disabled or port=0 (historical readiness omission). Overrides
                 still render. Liveness uses --live so capture degradation does
                 not restart-loop the agent. */ -}}
          {{- $nodeAgentAdminAvailable := and .Values.nodeAgent.admin.enabled (ne (toString .Values.nodeAgent.admin.port) "0") -}}
          {{- $nodeAgentHandlers := dict "live" (dict) "ready" (dict) -}}
          {{- if $nodeAgentAdminAvailable -}}
          {{- $nodeAgentHandlers = include "ferrum-mesh.adminHealthHandlers" (dict "port" .Values.nodeAgent.admin.port "probeHost" $nodeAgentAdminProbeHost) | fromYaml -}}
          {{- end -}}
          {{- $nodeAgentLiveHandler := .Values.nodeAgent.probes.liveness.override | default dict -}}
          {{- if not $nodeAgentLiveHandler }}{{- $nodeAgentLiveHandler = $nodeAgentHandlers.live | default dict -}}{{- end -}}
          {{- $nodeAgentReadyHandler := .Values.nodeAgent.probes.readiness.override | default dict -}}
          {{- if not $nodeAgentReadyHandler }}{{- $nodeAgentReadyHandler = $nodeAgentHandlers.ready | default dict -}}{{- end -}}
          {{- include "ferrum-mesh.renderProbes" (dict "probes" .Values.nodeAgent.probes "liveHandler" $nodeAgentLiveHandler "readyHandler" $nodeAgentReadyHandler) }}
      volumes:
        - name: bpf-fs
          hostPath:
            path: {{ .Values.nodeAgent.bpfFsPath }}
            type: DirectoryOrCreate
        - name: cgroup
          hostPath:
            path: {{ .Values.nodeAgent.cgroupRoot }}
            type: Directory
        {{- if $readOnlyRoot }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if and $cni $cni.enabled }}
        - name: host-cni-bin
          hostPath:
            path: {{ $cni.hostBinDir }}
            type: DirectoryOrCreate
        - name: host-cni-conf
          hostPath:
            path: {{ $cni.hostConfDir }}
            type: DirectoryOrCreate
        - name: host-ferrum-socket-dir
          hostPath:
            path: {{ $cni.hostSocketDir }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if $nodeAgentPublishesRegistry }}
        - name: node-waypoint-pod-registry
          hostPath:
            path: {{ .Values.nodeAgent.podRegistryDir }}
            type: DirectoryOrCreate
        {{- end }}
{{- end }}
