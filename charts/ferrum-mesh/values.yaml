image:
  repository: ferrumedge/ferrum-edge
  tag: "0.9.0"
  pullPolicy: IfNotPresent

namespace: ferrum

controlPlane:
  # Disabled by default because CP mode requires an explicit database URL plus
  # operator-provided JWT secrets. Use examples/development-values.yaml for a
  # single-node SQLite lab, or examples/production-existing-secrets-values.yaml
  # for a Secret-backed install shape.
  enabled: false
  replicas: 1
  grpcPort: 50051
  rbac:
    create: true
    # Grants get/list/watch (+ status patch) for GatewayClass/Gateway/HTTPRoute/
    # GRPCRoute/TCPRoute/TLSRoute/UDPRoute/ListenerSet/ReferenceGrant.
    # GRPCRoute is release-gated by upstream GATEWAY-GRPC; TCPRoute/TLSRoute/
    # ListenerSet live data-plane conformance is gated by
    # scripts/gateway_api_tcproute_conformance.sh,
    # scripts/gateway_api_tlsroute_conformance.sh, and
    # scripts/gateway_api_listenerset_conformance.sh. UDPRoute translation/status
    # evidence is gated by CI Unit Tests and its live UDP data path by CI
    # Integration Tests.
    gatewayApi: true
    istio: true
    meshConfig: true
    # T2-B: flipped to true by default so the chart matches the binary's
    # in-cluster default-on behavior. The K8s controller defaults to ON
    # inside a pod (detected via KUBERNETES_SERVICE_HOST), so pod
    # discovery RBAC must be present for the controller to actually run
    # its native Pod/Service/EndpointSlice watches without falling back
    # to a no-op startup warn. Override to `false` only when explicitly
    # disabling the controller via `FERRUM_K8S_CONTROLLER_ENABLED=false`.
    podDiscovery: true
    nodeLocality: false
  env:
    FERRUM_MODE: cp
    FERRUM_XDS_ENABLED: "true"
    # T2-B: FERRUM_K8S_CONTROLLER_ENABLED and
    # FERRUM_K8S_POD_DISCOVERY_ENABLED auto-default to true in pods.
    # The chart deliberately does NOT set them here so operators can
    # turn them off with a one-line env override without editing the
    # chart values. Same applies to FERRUM_K8S_WATCH_NAMESPACES: when
    # unset, the controller follows the T2-A CP namespace scope
    # (FERRUM_CP_NAMESPACES). Multi-namespace scope (`*` or a CSV set)
    # additionally requires FERRUM_CP_DP_GRPC_TRUST_BUNDLE_PATH — the
    # fleet-wide cpDpGrpcJwtSecret alone is rejected (advisory
    # GHSA-3f2j-wwqw-grmg). The chart renders
    # FERRUM_K8S_CONTROLLER_NAMESPACE to the Helm release namespace unless
    # explicitly overridden here, so managed workload namespace settings do
    # not affect trusted NodeWaypoint discovery.
  database:
    # One of: sqlite, postgres, mysql, mongodb. Required when controlPlane.enabled
    # or ca.enabled is true.
    type: ""
    # Direct URL value. Suitable for local/dev only; prefer urlFrom or
    # existingSecret for shared environments.
    url: ""
    # Full Kubernetes EnvVarSource for FERRUM_DB_URL, for example:
    # urlFrom:
    #   secretKeyRef:
    #     name: ferrum-db
    #     key: url
    urlFrom: {}
    # Shorthand Secret reference for FERRUM_DB_URL.
    existingSecret:
      name: ""
      urlKey: url
    # SQLite convenience form. Renders FERRUM_DB_URL as
    # sqlite:<path>?mode=<mode>.
    sqlite:
      path: ""
      mode: rwc
    # Structured network database form. Direct username/password values are
    # percent-encoded into FERRUM_DB_URL. For Secret-backed database credentials,
    # use urlFrom or existingSecret with a fully encoded database URL Secret.
    host: ""
    port: null
    name: ""
    username: ""
    password: ""
    params: {}
  credentials:
    adminJwtSecret:
      value: ""
      existingSecret:
        name: ""
        key: admin-jwt-secret
      valueFrom: {}
    cpDpGrpcJwtSecret:
      value: ""
      existingSecret:
        name: ""
        key: cp-dp-grpc-jwt-secret
      valueFrom: {}
  # Independently configurable probes. Liveness/startup run
  # `ferrum-edge health --live` (GET /live: process + admin up). Readiness runs
  # `ferrum-edge health` (GET /health: 503 while starting/unavailable; ready-but-
  # degraded stays HTTP 200 with JSON status "degraded"). Do NOT point liveness
  # at /health — that restart-loops an alive-but-unready CP.
  # failureThreshold*periodSeconds covers cert/config/DB startup (~3 min).
  probes:
    startup:
      enabled: true
      failureThreshold: 36
      periodSeconds: 5
      # Replaces the computed startup handler. When empty, startup falls back
      # to the liveness handler (including any liveness.override).
      override: {}
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 15
      # Replaces the computed liveness handler. Also used by startup when
      # startup.override is unset.
      override: {}
    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      override: {}
  # Operator-supplied mounts (TLS material, CP/DP trust bundle, etc.).
  # Multi-namespace CP (FERRUM_CP_NAMESPACES=* or a CSV set) requires a real
  # file at FERRUM_CP_DP_GRPC_TRUST_BUNDLE_PATH — declaring the path alone is
  # not enough (advisory GHSA-3f2j-wwqw-grmg).
  extraVolumes: []
  extraVolumeMounts: []

injector:
  # Disabled by default: the webhook requires a serving-cert Secret and should
  # be enabled only after that Secret and namespace policy are ready.
  enabled: false
  replicas: 1
  listenPort: 9443
  requireAnnotation: true
  failurePolicy: Fail
  caBundle: ""
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - kube-system
          - kube-public
          - kube-node-lease
          - istio-system
      - key: ferrum.io/injection
        operator: NotIn
        values:
          - disabled
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  tls:
    secretName: ferrum-mesh-injector-tls
    certPath: /etc/ferrum/injector/tls/tls.crt
    keyPath: /etc/ferrum/injector/tls/tls.key
  env:
    FERRUM_MODE: injector
  # Injector mode has no admin /live|/health surface. Defaults use a TCP probe
  # against the webhook listen port (TLS listener accept = process up). Overrides
  # may supply httpGet/tcpSocket/exec; keep liveness process-only.
  probes:
    startup:
      enabled: true
      failureThreshold: 36
      periodSeconds: 5
      override: {}
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 15
      override: {}
    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      override: {}

ambient:
  # Requires nodeAgent.enabled=true. Ambient always shares the node-local
  # pod-registry hostPath with the node-agent so UDP placement ownership and
  # cleanup proof remain durable even when UDP capture itself is disabled.
  enabled: false
  inboundPort: 15006
  outboundPort: 15001
  hbonePort: 15008
  captureMode: iptables
  spire:
    # Mount a SPIRE Agent Workload API socket and configure mesh mode to fetch
    # its runtime X.509-SVID from SPIRE. Requires workloadSpiffeId; NodeWaypoint
    # profiles must include $(FERRUM_K8S_NODE_NAME) so each node has a distinct
    # waypoint identity.
    enabled: false
    socketHostPath: /run/spire/sockets
    socketMountPath: /run/spire/sockets
    socketFileName: agent.sock
    workloadSpiffeId: ""
    productionMode: true
  env:
    FERRUM_MODE: mesh
    FERRUM_MESH_TOPOLOGY: ambient
    FERRUM_MESH_HBONE_LISTEN_ADDR: 0.0.0.0:15008
  # Admin-backed probes (health --live / health). Readiness is skipped when
  # FERRUM_ADMIN_HTTP_PORT=0 except NodeWaypoint, which still requires admin for
  # the DaemonSet readiness contract. Timing keeps ambient/node-waypoint boot
  # (slice + SPIRE) inside the startup window.
  probes:
    startup:
      enabled: true
      failureThreshold: 36
      periodSeconds: 5
      override: {}
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 15
      override: {}
    readiness:
      enabled: true
      initialDelaySeconds: 2
      periodSeconds: 5
      override: {}

eastWest:
  enabled: false
  replicas: 1
  listenPort: 15443
  env:
    FERRUM_MODE: mesh
    FERRUM_MESH_TOPOLOGY: east_west_gateway
  # East-west is SNI passthrough on listenPort. Defaults use a TCP probe on that
  # port so kubelet proves the datapath listener without coupling liveness to
  # mesh-slice readiness. Override with admin health exec if preferred.
  probes:
    startup:
      enabled: true
      failureThreshold: 36
      periodSeconds: 5
      override: {}
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 15
      override: {}
    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      override: {}

ca:
  # Disabled by default. This Deployment runs the Ferrum binary in CP mode, so
  # it shares the controlPlane database/JWT contract when enabled.
  enabled: false
  env:
    FERRUM_MESH_PRODUCTION_MODE: "true"
  # Same admin health semantics as controlPlane (CP mode).
  probes:
    startup:
      enabled: true
      failureThreshold: 36
      periodSeconds: 5
      override: {}
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 15
      override: {}
    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      override: {}

observability:
  # Master switch for the observability subtree. Default `false` so a fresh
  # install does not assume the cluster runs Prometheus / a Grafana sidecar.
  # Flip to `true` to render `PrometheusRule` + dashboard `ConfigMap`s.
  enabled: false
  dashboards:
    # When `observability.enabled` is `true`, render a `ConfigMap` that
    # contains the five bundled Grafana dashboards
    # (gateway-overview, mesh-overview, certificate-posture, egress-scope,
    # policy-deny). The ConfigMap carries the `grafana_dashboard: "1"` label
    # that the Grafana sidecar (`kiwigrid/k8s-sidecar`) and the Grafana
    # Operator both pick up automatically.
    enabled: true
    # Sidecar label key/value override — only needed if your Grafana install
    # uses a custom label (e.g. `grafana_dashboard_my-org`). The default is
    # the upstream Grafana sidecar convention.
    # sidecarLabel: grafana_dashboard
    # sidecarLabelValue: "1"
    # Extra labels and annotations stamped on the dashboard ConfigMap.
    # Useful for `grafana.com/folder`-style annotations or routing labels.
    # labels: {}
    # annotations: {}
    # Override the generated ConfigMap name. Default is
    # `ferrum-mesh-dashboards`; uncomment to scope it under a release- or
    # operator-specific name.
    # configMapName: ferrum-mesh-dashboards
  alerts:
    enabled: true
    certExpiringSeconds: 604800
    # Critical alert when an SVID has less than this long until expiry.
    # Default 3600s (1h) matches the SPIRE default workload SVID TTL — at this
    # point rotation has almost certainly stalled.
    svidExpiringCriticalSeconds: 3600
    cpStaleConfigSeconds: 300
    policyDenyRatePerSecond: 1
    mtlsHandshakeFailureRatePerSecond: 0
    injectorFailureRatePerSecond: 0
    # Warn when a federated trust bundle has not been refreshed in this many
    # seconds. Default 600s = 2 * FERRUM_MESH_FEDERATION_POLL_INTERVAL_SECONDS
    # (which defaults to 300s).
    federationBundleStaleSeconds: 600

nodeAgent:
  enabled: false
  env: {}
  # Empty repository/tag inherit the top-level image repository/tag. When
  # captureMode=ebpf, the template automatically appends "-ebpf" to the
  # resolved tag unless it is already present, selecting the real capture image
  # instead of the default mock/no-op image.
  image:
    repository: ""
    tag: ""
  captureMode: ebpf
  proxyMode: local_pod
  proxyUid: 1337
  # Comma-separated host source IPs trusted by the NodeWaypoint direct-inbound
  # guard. These addresses serve two roles: (1) the inbound HBONE relay dials
  # backend pods from a node-local source, so the source-bound guard admits the
  # relay's marked traffic only from a trusted node source IP; and (2) they may
  # reach Kubernetes HTTP/TCP/gRPC probe ports (discovered from the enrolled pod
  # spec) without the relay mark. REQUIRED when proxyMode=node_waypoint: the
  # relay source IP is CNI-specific and cannot be auto-detected (for example the
  # node's pod-CIDR / CNI bridge gateway IP, which may differ from status.hostIP),
  # so the node-agent fails closed (capture unavailable) when this is empty rather
  # than silently dropping all inbound to enrolled pods. Leave empty only for
  # non-NodeWaypoint proxy modes.
  trustedKubeletProbeSourceIps: ""
  # Node capture interfaces that carry the NodeWaypoint inbound tc INGRESS
  # redirect (ferrum_tc_ingress_redirect, issue #3287). Comma-separated, e.g.
  # "eth0" — typically the node uplink, since off-node traffic to a pod is only
  # visible on a tc ingress hook before routing forwards it.
  #
  # Empty (the default) disables the redirect entirely: the capture config
  # publishes a zero redirect mark, the kernel program returns every packet
  # untouched, and inbound behavior is exactly as before. Set it to give
  # enrolled workloads a fully eBPF-owned inbound capture path instead of
  # node-global iptables REDIRECT semantics.
  #
  # The node-agent does not infer this value. It proves at startup from a
  # bounded projected Node cache, then uses a fixed host-revalidation interval
  # to require that this exact set equals the complete set selected by remote
  # PodCIDR/InternalIP routes for every observed capture-capable family.
  # Complete evidence contributes regardless of remote Ready health; incomplete
  # non-Ready joining/rebooting/draining Nodes are ignored, while incomplete
  # Ready=True evidence stays fail-closed. Single-node/no-remote-evidence and
  # alternate policy-routing topologies are unsupported; leave this empty when
  # there is no off-node path. Wrong, extra, incomplete, ambiguous, loopback,
  # down, unsupported, or drifted sets disarm redirect and keep readiness false;
  # capture is never widened.
  #
  # NodeWaypoint proxy mode only (a startup error in local_pod mode), and it
  # requires ambient.enabled=true with ambient.env.FERRUM_MESH_TOPOLOGY=node_waypoint:
  # the redirect fails closed, so without a capture listener on the node it would
  # drop in-scope inbound traffic. The chart renders this value into BOTH the
  # node-agent and the ambient DaemonSet, because the mesh proxy reads the same
  # variable to decide whether to emit its TRANSPARENT INBOUND CAPTURE listener.
  #
  # That capture listener binds FERRUM_MESH_INBOUND_LISTEN_ADDR (default
  # 0.0.0.0:15006) with IP_TRANSPARENT, and is deliberately NOT the HBONE
  # listener: HBONE terminates authenticated HTTP/2 CONNECT over mesh mTLS,
  # while captured traffic is ordinary application bytes. Captured plaintext is
  # admitted only where the live PeerAuthentication posture for the recovered
  # app port allows it — STRICT still requires verified mesh transport. If you
  # override ambient.env.FERRUM_MESH_INBOUND_LISTEN_ADDR the chart renders the
  # same value into the node-agent so the two agree; the address must be a
  # wildcard with a non-zero port or the node-agent refuses to start.
  #
  # Requires the published eBPF runtime (ordinary images omit `ip`) and
  # NET_ADMIN, which the existing tc attachments already need.
  # Redirection is scoped per packet to an enrolled, opted-in pod address on one
  # of its declared containerPorts, so unenrolled traffic is never captured.
  ingressRedirectIfaces: ""
  # Shared host-path directory for the per-pod (uid -> cgroup) registry the
  # node-agent publishes. Consumed by (a) the ambient NodeWaypoint proxy to open
  # per-pod in-netns TCP capture listeners (proxyMode=node_waypoint), and (b) the
  # Ambient per-pod-netns UDP lifecycle (#2013): the enabled producer and the
  # disabled stale-rule cleanup manager both consume it. For Ambient with an
  # eBPF node-agent, the chart mounts this dir into both DaemonSets and grants
  # the ambient proxy the setns/NET_ADMIN capabilities plus tools-capable image
  # needed to install or remove in-netns UDP TPROXY rules.
  podRegistryDir: /run/ferrum/node-waypoint-pods
  cgroupRoot: /sys/fs/cgroup
  bpfFsPath: /sys/fs/bpf
  admin:
    # Enables the read-only node-agent admin listener for /health and /metrics.
    # The default bind is loopback-only; the DaemonSet readiness probe execs the
    # built-in health command inside the container, so it can still reach this
    # listener without exposing unauthenticated metrics on the cluster network.
    enabled: true
    bindAddress: 127.0.0.1
    # Non-conflicting with the ambient mesh admin listener's binary default
    # (9000) when both DaemonSets run on the host network.
    port: 19090
    # Admin HTTPS port. Default 0 keeps existing HTTP-only installs unchanged
    # (the binary default is 9443, so the chart must pin 0 until TLS is opted
    # in). Set a nonzero port together with admin.tls below for HTTPS-only
    # (port=0) or dual-listener operation.
    httpsPort: 0
    # Optional admin TLS Secret mount. Uses the shared FERRUM_ADMIN_TLS_*
    # contract — no node-agent-only TLS variables. When enabled with a
    # secretName, the chart mounts cert/key (and optional client CA / CRL)
    # read-only and sets the matching PATH env vars. Incomplete or invalid
    # combinations fail at helm render; do not store PEM material in values.
    tls:
      enabled: false
      secretName: ""
      mountPath: /etc/ferrum/tls/admin
      certKey: tls.crt
      keyKey: tls.key
      # Optional mTLS client CA key within the same Secret. When set with
      # port=0 (HTTPS-only), computed exec probes cannot present a client
      # cert — override or disable every enabled probe independently, or keep
      # a plaintext loopback port. Simple Prometheus annotations also cannot
      # present a client cert (see metricsScrape).
      clientCaKey: ""
      # Optional PEM CRL key within the same Secret (FERRUM_TLS_CRL_FILE_PATH).
      crlKey: ""
    # Optional Prometheus scrape annotations. Simple prometheus.io annotations
    # cannot present a client certificate: when TLS requires mTLS
    # (tls.clientCaKey) and a plaintext admin.port is still enabled, annotations
    # advertise that HTTP listener. HTTPS-only + mTLS rejects metricsScrape
    # (use an external scrape config/sidecar). HTTPS without client auth still
    # prefers the HTTPS port/scheme.
    metricsScrape:
      enabled: false
      path: /metrics
  # Admin-backed probes. When admin is disabled or both HTTP and HTTPS ports
  # are 0 (or HTTPS is selected without TLS), computed probes are omitted
  # (preserve the historical no-readiness behavior) unless an override
  # handler is supplied. Liveness uses --live so capture degradation does not
  # restart-loop the agent. HTTPS-only probes dial with --tls --tls-no-verify.
  # HTTPS-only mTLS requires every enabled probe to be disabled or given an
  # explicit per-probe override (startup/liveness/readiness are classified
  # independently — overriding only liveness does not cover startup).
  probes:
    startup:
      enabled: true
      failureThreshold: 36
      periodSeconds: 5
      override: {}
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 15
      override: {}
    readiness:
      enabled: true
      initialDelaySeconds: 2
      periodSeconds: 5
      override: {}
  # Default to fail because the published Ferrum image is distroless and does
  # not include /bin/sh, iptables, or ip6tables. Set to `iptables` only when
  # running a custom node-agent image that provides those binaries.
  fallbackMode: fail
  capture:
    includeCidrs: "0.0.0.0/0"
    excludeCidrs: ""
    excludePorts: "15001,15006,15008,15020"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Security posture. See docs/node_agent_security.md for the full reference,
  # including the kernel APIs each capability grants and why every mount /
  # host-access flag is required. Default values harden the DaemonSet without
  # breaking older kernels; every knob is reversible so operators can roll
  # back individually if their environment needs it.
  security:
    # Enforce read-only root filesystem and provision a scratch tmpfs at
    # /tmp. Set to false only if a downstream image needs to write to its
    # own image FS.
    readOnlyRootFilesystem: true
    # Block setuid-binary privilege escalation inside the container. The
    # agent does not exec setuid binaries.
    allowPrivilegeEscalation: false
    # Add CAP_PERFMON to the container's capability set. Required on
    # kernel >= 5.8 to read BPF program info / BTF. On kernel < 5.8 the
    # kernel does not recognise PERFMON and silently ignores it in the
    # capability set (the cap-set entry is still rendered by the chart
    # so admission controllers see the requested posture). Set to false
    # only if an admission webhook rejects PERFMON in your environment.
    addCapPerfmon: true
    # Drop CAP_SYS_ADMIN for local_pod capture. NodeWaypoint capture always
    # adds SYS_ADMIN because the agent must setns() into pod network namespaces
    # to resolve host-side veth peers before attaching inbound tc programs.
    dropCapSysAdmin: true
    # Pod-wide seccomp profile. RuntimeDefault is the containerd default
    # and permits every syscall the agent needs (bpf, setsockopt, sh -c
    # iptables fallback, etc.). Override with type: Localhost and
    # localhostProfile: <path> to load a custom tightened profile (see
    # docs/node_agent_security.md for a template). The whole map is
    # passed through verbatim, so any other fields the Kubernetes API
    # supports for SeccompProfile (e.g. future fields) also work.
    seccompProfile:
      type: RuntimeDefault
      # localhostProfile: profiles/ferrum-node-agent.json

  # CNI plugin install (optional). Disabled by default so an upgrade does
  # not change behaviour. When enabled, the DaemonSet runs an init container
  # that executes `ferrum-cni install`: copy the binary into /opt/cni/bin/,
  # read the existing primary CNI config, and write a generated chained
  # conflist into /etc/cni/net.d/. ADD fetches pod metadata immediately;
  # the kube-rs watcher remains the reconciliation source of truth.
  # See docs/node_agent.md "CNI plugin install".
  cni:
    enabled: false
    # Primary CNI to chain behind. The installer finds an existing config
    # whose plugin list contains this `type` (calico, cilium-cni, bridge,
    # flannel, etc.), preserves that config, and appends Ferrum as a
    # meta-plugin that does NOT allocate IPs or interfaces.
    chainedWith: calico
    # Path on the host where the CNI plugin binary is dropped. Standard
    # kubelet location; rarely needs overriding.
    hostBinDir: /opt/cni/bin
    # Path on the host where the CNI conflist is written. Standard
    # kubelet location; rarely needs overriding.
    hostConfDir: /etc/cni/net.d
    # Filename for the generated conflist. The numeric prefix should sort
    # before the cluster runtime's selected primary config file so kubelet
    # selects this generated chain; inside the file, the primary plugin still
    # runs before ferrum-cni.
    confFileName: "00-ferrum.conflist"
    # Directory on the host that holds the UDS the node-agent listens on
    # and the CNI binary connects to. Must be writable by the node-agent
    # container (which runs as root in this DaemonSet).
    hostSocketDir: /var/run/ferrum
    # Filename of the UDS inside `hostSocketDir`. The chart wires both
    # `FERRUM_NODE_AGENT_CNI_SOCKET_PATH` and the per-conflist
    # `ferrum.socketPath` field from this value so the two halves cannot
    # drift.
    socketFileName: node-agent-cni.sock
    # Automatic rollback for an install that never reaches a usable node-agent.
    #
    # Once the chained conflist is written, EVERY pod ADD on the node
    # traverses ferrum-cni and an unanswered ADD fails closed. The rollback
    # watcher runs as a native sidecar (an init container with
    # `restartPolicy: Always`, Kubernetes 1.29+) alongside the node-agent,
    # polls the CNI STATUS verb, and removes THIS pod's own generation of the
    # artifacts if readiness is never reached — then exits non-zero so the
    # failure stays visible. Readiness reached even once means the artifacts
    # are retained for the lifetime of the pod. Ownership + generation
    # markers, not elapsed time alone, decide what may be removed, so a slow
    # start that is overtaken by a newer install never deletes the newer
    # artifacts.
    #
    # Set `enabled: false` on clusters older than 1.29 (no native sidecars)
    # or where you would rather leave a broken install in place and recover
    # by hand — see docs/node_agent.md "Recovering a node".
    rollback:
      enabled: true
      # Budget for the node-agent to answer CNI STATUS. Keep this comfortably
      # above worst-case node-agent start (image pull, bpffs mount, initial
      # pod relist) so a healthy slow start is never rolled back.
      readyTimeoutSeconds: 300
      # Budget for this pod's own installer to publish its chained conflist.
      # The readiness budget above starts only once that file is observed on
      # disk carrying this generation's ownership marker, so the watcher can
      # never delete state an installer is still publishing. Exceeding this
      # budget means no chain was ever installed by this pod — nothing to roll
      # back — and the watcher exits non-zero saying exactly that.
      publishTimeoutSeconds: 300
      pollIntervalSeconds: 5
    # Cleanup on `helm uninstall`.
    #
    # Renders a `pre-delete` hook DaemonSet (one pod per node, so a
    # multi-node cluster is fully cleaned, unlike a single-pod Job) that runs
    # `ferrum-cni uninstall` before any release resource — including the
    # node-agent and its socket — is deleted. Each pod becomes Ready only
    # after cleanup on ITS node succeeded.
    #
    # A later-weighted wait Job blocks until every one of those pods is Ready,
    # because Helm's hook wait only watches Job and Pod kinds — a hook
    # DaemonSet alone would be fire-and-forget. So a node that cannot be
    # cleaned fails the uninstall visibly instead of silently stranding a
    # chained conflist that points at a dead socket. Once every node has
    # reported success the Job deletes the cleanup DaemonSet itself and waits
    # until the API server no longer serves it. Its Role grants exactly `get`
    # and `delete` on that one DaemonSet by name (plus `get` on its status);
    # the cleanup pods themselves get no token at all.
    #
    # The cleanup ServiceAccounts, Role and RoleBinding are ordinary release
    # resources, not hook resources, and the cleanup DaemonSet carries no
    # `hook-succeeded` deletion policy: on Helm 3.19+ / v4 a hook failure also
    # deletes the earlier hooks that carry that policy, so a failed wait would
    # otherwise take the identity, the RBAC and the evidence with it. As
    # written, a failed uninstall leaves the DaemonSet, its logs and its
    # identity in place, and re-running `helm uninstall` retries cleanly.
    #
    # Cleanup is scoped by the ownership marker written at install time and
    # is a no-op for artifacts owned by a different release. It runs on
    # uninstall ONLY: `helm upgrade` and `helm rollback` do not fire
    # pre-delete hooks, so a routine rolling replacement never removes CNI
    # state that is still required.
    uninstall:
      enabled: true
      # Shared end-to-end budget for every node's cleanup pod to finish and
      # for the wait Job to delete the cleanup DaemonSet afterward. Must fit
      # inside `helm uninstall --timeout` (default 5m) or Helm gives up first
      # and you lose the specific "N of M nodes" diagnostic.
      timeoutSeconds: 240
      # Extra tolerations for the cleanup DaemonSet. The hook already
      # tolerates every taint by default so cleanup reaches nodes the
      # node-agent could run on; this is here for clusters that need
      # additional scheduling hints.
      tolerations:
        - operator: Exists
      # Resource requests/limits for the short-lived cleanup pod.
      resources: {}
