# Production-style control-plane install using existing Kubernetes Secrets.
# This file deliberately contains no credential values. The database URL Secret
# can point at PostgreSQL, MySQL, MongoDB, or SQLite; set database.type to match.

controlPlane:
  enabled: true
  database:
    type: postgres
    existingSecret:
      name: ferrum-mesh-production-db
      urlKey: url
  credentials:
    adminJwtSecret:
      existingSecret:
        name: ferrum-mesh-production-credentials
        key: admin-jwt-secret
    cpDpGrpcJwtSecret:
      existingSecret:
        name: ferrum-mesh-production-credentials
        key: cp-dp-grpc-jwt-secret
  env:
    FERRUM_MODE: cp
    FERRUM_XDS_ENABLED: "true"
    FERRUM_LOG_LEVEL: info
    FERRUM_CP_NAMESPACES: "*"
    # This example keeps the chart smoke-test footprint small by using plaintext
    # CP/DP gRPC on the in-cluster service. For production, mount CP gRPC TLS
    # material and set FERRUM_CP_GRPC_TLS_CERT_PATH / FERRUM_CP_GRPC_TLS_KEY_PATH.
    FERRUM_CP_DP_GRPC_ALLOW_PLAINTEXT: "true"

injector:
  enabled: false

ca:
  enabled: false
