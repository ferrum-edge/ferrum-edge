# Production-style control-plane install using existing Kubernetes Secrets.
# This file deliberately contains no credential values. The database URL Secret
# can point at PostgreSQL, MySQL, MongoDB, or SQLite; set database.type to match.
#
# Create the referenced Secrets before installing, for example:
#   kubectl -n ferrum create secret generic ferrum-mesh-production-db \
#     --from-literal=url='postgres://ferrum:...@db/ferrum'
#   kubectl -n ferrum create secret generic ferrum-mesh-production-credentials \
#     --from-literal=admin-jwt-secret="$(openssl rand -hex 32)" \
#     --from-literal=cp-dp-grpc-jwt-secret="$(openssl rand -hex 32)"
#   # Namespace-bound CP/DP verification credentials (GHSA-3f2j-wwqw-grmg).
#   # Prefer asymmetric public keys in production ("algorithm": "ES256" with
#   # "public_key_pem"/"public_key_path"): the CP then holds only public material
#   # and no data plane is a signing authority at all. The HS256 shape below is
#   # the migration path, and each credential MUST use its own per-tenant secret.
#   #
#   # Never point a credential at the fleet-wide cp-dp-grpc-jwt-secret (whether
#   # inline, via "secret_env": "FERRUM_CP_DP_GRPC_JWT_SECRET", or via
#   # "secret_path"): every data plane already holds that value, so any of them
#   # could name this "kid" and reach this credential's namespaces — exactly the
#   # cross-tenant forgery GHSA-3f2j-wwqw-grmg exists to close. Startup refuses
#   # that reuse: "secret_env" naming the fleet variable is rejected by name, and
#   # an inline "secret"/"secret_path" equal to the effective fleet secret is
#   # rejected by resolved bytes. See docs/cp_namespace_tenancy.md.
#   cat > /tmp/cp-dp-trust-bundle.json <<EOF
#   {
#     "version": 1,
#     "keys": [
#       {
#         "kid": "tenant-a",
#         "algorithm": "HS256",
#         "secret": "$(openssl rand -hex 32)",
#         "namespaces": ["tenant-a"]
#       }
#     ]
#   }
#   EOF
#   kubectl -n ferrum create secret generic ferrum-mesh-production-trust-bundle \
#     --from-file=cp-dp-trust-bundle.json=/tmp/cp-dp-trust-bundle.json
#   shred -u /tmp/cp-dp-trust-bundle.json 2>/dev/null || rm -f /tmp/cp-dp-trust-bundle.json

controlPlane:
  enabled: true
  database:
    type: postgres
    existingSecret:
      name: ferrum-mesh-production-db
      urlKey: url
  credentials:
    adminJwtSecret:
      existingSecret:
        name: ferrum-mesh-production-credentials
        key: admin-jwt-secret
    cpDpGrpcJwtSecret:
      existingSecret:
        name: ferrum-mesh-production-credentials
        key: cp-dp-grpc-jwt-secret
  env:
    FERRUM_MODE: cp
    FERRUM_XDS_ENABLED: "true"
    FERRUM_LOG_LEVEL: info
    FERRUM_CP_NAMESPACES: "*"
    # Required for multi-namespace / "*" scope (advisory GHSA-3f2j-wwqw-grmg).
    # The fleet-wide cpDpGrpcJwtSecret alone is not an authorization boundary
    # across tenants. Mount the JSON trust-bundle Secret below; see
    # docs/cp_namespace_tenancy.md.
    FERRUM_CP_DP_GRPC_TRUST_BUNDLE_PATH: /etc/ferrum/cp-dp-trust-bundle.json
    # Production installs must configure CP/DP gRPC TLS before enabling the
    # control plane listener on non-loopback addresses. Mount TLS material and
    # set FERRUM_CP_GRPC_TLS_CERT_PATH / FERRUM_CP_GRPC_TLS_KEY_PATH.
  extraVolumes:
    - name: cp-dp-trust-bundle
      secret:
        secretName: ferrum-mesh-production-trust-bundle
  extraVolumeMounts:
    - name: cp-dp-trust-bundle
      mountPath: /etc/ferrum/cp-dp-trust-bundle.json
      subPath: cp-dp-trust-bundle.json
      readOnly: true

injector:
  enabled: false

ca:
  enabled: false
