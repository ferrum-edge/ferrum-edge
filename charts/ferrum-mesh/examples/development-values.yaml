# Development control-plane install for kind/minikube.
#
# Gateway API CRDs (required before helm install when controlPlane.rbac.gatewayApi
# is true, the default): Ferrum watches TCPRoute/UDPRoute and
# XBackendTrafficPolicy, so install the experimental channel at the pinned
# v1.5.1 bundle — not standard-install.yaml (mixing channels is rejected).
#
#   kubectl apply --server-side=true \
#     -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/experimental-install.yaml
#
# Opt out of Gateway API: controlPlane.rbac.gatewayApi=false and
# controlPlane.env.FERRUM_K8S_WATCH_GATEWAY_API_CRDS: "false" (no CRD install).
#
# GatewayClass is cluster-scoped (default name `ferrum`). A second independent
# ferrum-mesh release in the same cluster must set a unique gatewayClass.name;
# Helm will not import another release's GatewayClass.
#
# Create the referenced Secret with random values before installing:
#   kubectl -n ferrum create secret generic ferrum-mesh-dev-credentials \
#     --from-literal=admin-jwt-secret="$(openssl rand -hex 32)" \
#     --from-literal=cp-dp-grpc-jwt-secret="$(openssl rand -hex 32)"

controlPlane:
  enabled: true
  database:
    type: sqlite
    url: sqlite:////tmp/ferrum-mesh-dev.db?mode=rwc
  credentials:
    adminJwtSecret:
      existingSecret:
        name: ferrum-mesh-dev-credentials
        key: admin-jwt-secret
    cpDpGrpcJwtSecret:
      existingSecret:
        name: ferrum-mesh-dev-credentials
        key: cp-dp-grpc-jwt-secret
  env:
    FERRUM_MODE: cp
    FERRUM_XDS_ENABLED: "true"
    FERRUM_LOG_LEVEL: info
    # Single-namespace lab posture (FERRUM_NAMESPACE defaults to the release
    # namespace). A multi-namespace CP (FERRUM_CP_NAMESPACES naming a set or "*")
    # additionally requires FERRUM_CP_DP_GRPC_TRUST_BUNDLE_PATH — the fleet-wide
    # cpDpGrpcJwtSecret alone is rejected (advisory GHSA-3f2j-wwqw-grmg).
    # Development example: expose CP/DP gRPC inside the local cluster without TLS.
    # Production installs should configure FERRUM_CP_GRPC_TLS_* instead.
    FERRUM_CP_DP_GRPC_ALLOW_PLAINTEXT: "true"

injector:
  enabled: false

ca:
  enabled: false
