{{- if and (eq .Values.mode "cp") .Values.cp.service.enabled (ne (include "ferrum-gateway.cpGrpcPort" . | toString) "0") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferrum-gateway.cpGrpcServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ferrum-gateway.labels" (dict "root" . "component" "control-plane-grpc") | nindent 4 }}
  {{- with .Values.cp.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.cp.service.type | default "ClusterIP" }}
  selector:
    {{- include "ferrum-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ include "ferrum-gateway.cpGrpcPort" . }}
      targetPort: grpc
      protocol: TCP
{{- end }}
