{{- if and .Values.metrics.enabled .Values.metrics.dashboards.enabled }}
{{- /*
  Bundled Grafana dashboards. Each JSON in `dashboards/` is loaded into the
  ConfigMap data, and the `grafana_dashboard: "1"` label is the sidecar
  convention used by `kiwigrid/k8s-sidecar` (the default Grafana Helm chart
  sidecar) and by the Grafana operator. Operators that already manage
  dashboards out of band can disable this surface by setting
  `metrics.dashboards.enabled=false` (the default value is `true` so installs
  that enable metrics get the dashboards as a single switch).

  Adding a new dashboard:
    1. Drop the JSON in `charts/ferrum-gateway/dashboards/<name>.json`.
    2. No template edits needed — `.Files.Glob` picks it up automatically.
       Hosted CI contract-checks every `ferrum_…` family the JSON references
       against `docs/prometheus_metric_contract.json`.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.metrics.dashboards.configMapName | default (include "ferrum-gateway.suffixedName" (dict "base" (include "ferrum-gateway.fullname" .) "suffix" "-dashboards")) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ferrum-gateway.labels" (dict "root" . "component" "gateway-metrics") | nindent 4 }}
    {{- with .Values.metrics.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{ .Values.metrics.dashboards.sidecarLabel | default "grafana_dashboard" }}: {{ .Values.metrics.dashboards.sidecarLabelValue | default "1" | quote }}
  {{- with .Values.metrics.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
