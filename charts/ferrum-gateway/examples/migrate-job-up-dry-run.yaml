# Explicit migrate mode: dry-run pending database migrations (no schema changes).
#
# FERRUM_MIGRATE_DRY_RUN=true uses the same read-only status path for SQL/Mongo
# backends: it does not create tracking tables, schema objects, collections, or
# indexes. Prefer this before a cutover `up` Job.
#
#   kubectl -n ferrum apply -f charts/ferrum-gateway/examples/migrate-job-up-dry-run.yaml
#   kubectl -n ferrum logs job/ferrum-migrate-up-dry-run
apiVersion: batch/v1
kind: Job
metadata:
  name: ferrum-migrate-up-dry-run
  namespace: ferrum
  labels:
    app.kubernetes.io/name: ferrum-gateway
    app.kubernetes.io/component: migrate
    ferrum.edge/migrate-action: up
    ferrum.edge/migrate-dry-run: "true"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-gateway
        app.kubernetes.io/component: migrate
        ferrum.edge/migrate-action: up
        ferrum.edge/migrate-dry-run: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ferrum-edge
          image: ferrumedge/ferrum-edge:0.9.0
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: FERRUM_MODE
              value: migrate
            - name: FERRUM_MIGRATE_ACTION
              value: up
            - name: FERRUM_MIGRATE_DRY_RUN
              value: "true"
            - name: FERRUM_DB_TYPE
              value: postgres
            - name: FERRUM_DB_URL
              valueFrom:
                secretKeyRef:
                  name: ferrum-gateway-db
                  key: url
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
