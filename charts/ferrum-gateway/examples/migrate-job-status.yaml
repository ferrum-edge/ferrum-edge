# Explicit migrate mode: print applied/pending migration status (read-only).
#
# status never creates tracking tables or mutates schema. Safe to run while a
# gateway Deployment is live; still reuse the gateway image tag and DB Secret.
#
#   kubectl -n ferrum apply -f charts/ferrum-gateway/examples/migrate-job-status.yaml
#   kubectl -n ferrum logs job/ferrum-migrate-status
apiVersion: batch/v1
kind: Job
metadata:
  name: ferrum-migrate-status
  namespace: ferrum
  labels:
    app.kubernetes.io/name: ferrum-gateway
    app.kubernetes.io/component: migrate
    ferrum.edge/migrate-action: status
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-gateway
        app.kubernetes.io/component: migrate
        ferrum.edge/migrate-action: status
    spec:
      restartPolicy: Never
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ferrum-edge
          image: ferrumedge/ferrum-edge:0.9.0
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: FERRUM_MODE
              value: migrate
            - name: FERRUM_MIGRATE_ACTION
              value: status
            - name: FERRUM_DB_TYPE
              value: postgres
            - name: FERRUM_DB_URL
              valueFrom:
                secretKeyRef:
                  name: ferrum-gateway-db
                  key: url
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
