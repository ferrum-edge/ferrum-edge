# Data-plane mode: read-only admin + proxy, config pulled from one or more
# control planes over gRPC. Pairs with cp-values.yaml.
#
# Reuse the admin + CP/DP gRPC JWT Secret created for the control plane:
#   kubectl -n ferrum create secret generic ferrum-grpc-credentials \
#     --from-literal=admin-jwt-secret="<at least 32 characters>" \
#     --from-literal=cp-dp-grpc-jwt-secret="<same value as the CP>"
#
#   helm install ferrum-dp ./charts/ferrum-gateway -n ferrum \
#     -f charts/ferrum-gateway/examples/dp-values.yaml
mode: dp

replicaCount: 3

dp:
  # Single CP (simple) or comma-separated list for multi-CP failover.
  cpGrpcUrls: "http://ferrum-cp-ferrum-gateway-grpc.ferrum.svc:50051"
  # failoverPrimaryRetrySeconds: "300"
  # Maximum applied-snapshot age while every CP is unreachable
  # (FERRUM_DP_CONFIG_MAX_STALE_SECONDS). 0 disables the bound (unsafe); ""
  # omits the env and takes the binary 3600s default.
  # configMaxStaleSeconds: ""
  # What happens to new traffic at the bound (FERRUM_DP_CONFIG_STALE_ACTION).
  # Accepted values: fail_closed (default) or readiness_only. "" omits the env.
  # configStaleAction: ""

grpc:
  jwtSecret:
    existingSecret:
      name: ferrum-grpc-credentials
      key: cp-dp-grpc-jwt-secret
  # Must match the CP example's explicit plaintext development opt-in (the
  # http:// CP URL above is non-loopback plaintext). Remove this and configure
  # tls.cpGrpc/tls.dpGrpc for production.
  allowPlaintext: true

admin:
  jwtSecret:
    existingSecret:
      name: ferrum-grpc-credentials
      key: admin-jwt-secret
  # requireNamespaceClaim: true  # pair with cp.requireNamespaceClaim on multi-tenant CPs

service:
  type: LoadBalancer

# For production, pin CP trust with DP gRPC TLS:
# tls:
#   dpGrpc:
#     enabled: true
#     secretName: ferrum-dp-grpc-tls
#     caKey: ca.crt
#     clientCertKey: tls.crt
