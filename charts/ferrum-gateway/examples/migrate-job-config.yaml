# Explicit migrate mode: persist an on-disk config file version migration.
#
# For FERRUM_MIGRATE_ACTION=config the Job needs a writable config path. This
# example copies an input ConfigMap into an emptyDir, migrates that copy, and
# leaves the result under /work/config.yaml for `kubectl cp` or a follow-up
# step that publishes a new ConfigMap. The gateway file-mode Deployment keeps
# using its read-only ConfigMap mount until you roll it to the migrated content.
#
#   kubectl -n ferrum create configmap ferrum-file-config \
#     --from-file=config.yaml=./config.yaml
#   kubectl -n ferrum apply -f charts/ferrum-gateway/examples/migrate-job-config.yaml
#   kubectl -n ferrum logs job/ferrum-migrate-config
apiVersion: batch/v1
kind: Job
metadata:
  name: ferrum-migrate-config
  namespace: ferrum
  labels:
    app.kubernetes.io/name: ferrum-gateway
    app.kubernetes.io/component: migrate
    ferrum.edge/migrate-action: config
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-gateway
        app.kubernetes.io/component: migrate
        ferrum.edge/migrate-action: config
    spec:
      restartPolicy: Never
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: stage-config
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - cp /config-in/config.yaml /work/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config-in
              mountPath: /config-in
              readOnly: true
            - name: work
              mountPath: /work
      containers:
        - name: ferrum-edge
          image: ferrumedge/ferrum-edge:0.9.0
          imagePullPolicy: IfNotPresent
          args: ["run"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: FERRUM_MODE
              value: migrate
            - name: FERRUM_MIGRATE_ACTION
              value: config
            - name: FERRUM_FILE_CONFIG_PATH
              value: /work/config.yaml
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /work
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: work
          emptyDir: {}
        - name: config-in
          configMap:
            name: ferrum-file-config
