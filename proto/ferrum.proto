syntax = "proto3";

package ferrum;

service ConfigSync {
  // DP subscribes to config updates from CP
  rpc Subscribe(SubscribeRequest) returns (stream ConfigUpdate);
  // DP can request a full config snapshot
  rpc GetFullConfig(FullConfigRequest) returns (FullConfigResponse);
}

service MeshConfigSync {
  // Mesh data planes subscribe to their canonical per-workload mesh slice.
  rpc MeshSubscribe(MeshSubscribeRequest) returns (stream MeshConfigUpdate);
}

message SubscribeRequest {
  string node_id = 1;
  // Ferrum Edge binary version of the DP (e.g. "0.9.0")
  string ferrum_version = 2;
  // Namespace this DP instance loads and proxies
  string namespace = 3;
  // Effective FERRUM_REAL_IP_HEADER on this DP. An explicitly present empty
  // string means no authoritative header is configured. CP requires this
  // field and rejects a mismatch before streaming configuration so plugin
  // ownership admission uses one enforced cluster-wide value.
  optional string real_ip_header = 4;
  // Additive ConfigSync capability advertisement: this DP understands
  // `ConfigUpdate.heartbeat` keepalive frames and will arm an application
  // silence watchdog once the CP confirms it will send them. Absent/false on
  // peers that predate heartbeats, so a CP must never send heartbeats to a DP
  // that did not advertise support — an unnegotiated empty heartbeat envelope
  // would read as an unusable FULL_SNAPSHOT to such a DP.
  bool supports_heartbeat = 5;
}

message FullConfigRequest {
  string node_id = 1;
  // Ferrum Edge binary version of the DP (e.g. "0.9.0")
  string ferrum_version = 2;
  // Namespace to load config for
  string namespace = 3;
  // Same required effective-header advertisement as SubscribeRequest.
  optional string real_ip_header = 4;
}

message FullConfigResponse {
  string config_json = 1;
  string version = 2;
  // Ferrum Edge binary version of the CP (e.g. "0.9.0")
  string ferrum_version = 3;
  // JSON-encoded modes::mesh::config::TrustBundleSet for gateway-to-mesh TLS,
  // or JSON null to clear previously delivered CP trust material. Kept
  // out-of-band so config_json stays compatible with older DPs.
  string trust_bundles_json = 4;
}

message ConfigUpdate {
  enum UpdateType {
    FULL_SNAPSHOT = 0;
    DELTA = 1;
  }
  UpdateType update_type = 1;
  string config_json = 2;
  string version = 3;
  int64 timestamp = 4;
  // Ferrum Edge binary version of the CP (e.g. "0.9.0")
  string ferrum_version = 5;
  // JSON-encoded modes::mesh::config::TrustBundleSet for gateway-to-mesh TLS,
  // or JSON null to clear previously delivered CP trust material. Kept
  // out-of-band so DELTA updates can refresh trust without changing the
  // incremental resource payload and FULL_SNAPSHOT config_json stays
  // compatible with older DPs.
  string trust_bundles_json = 6;
  // Lightweight keepalive frame for ConfigSync Subscribe streams. Heartbeats
  // refresh DP stream liveness without forcing a config apply, so healthy
  // idle clusters are not mistaken for silent partitions. Only ever sent to a
  // subscriber that advertised `SubscribeRequest.supports_heartbeat`.
  bool heartbeat = 7;
  // CP-side confirmation of the heartbeat capability, set on the initial
  // FULL_SNAPSHOT of a Subscribe stream when the CP accepted the DP's
  // `supports_heartbeat` advertisement and will emit heartbeat frames. A DP
  // arms its application silence watchdog only after seeing this, so a new DP
  // talking to a CP that predates heartbeats never reconnects on silence the
  // CP was never asked to break. Absent/false on legacy CPs.
  bool heartbeat_negotiated = 8;
}

message MeshSubscribeRequest {
  string node_id = 1;
  // Ferrum Edge binary version of the mesh data plane (e.g. "0.9.0")
  string ferrum_version = 2;
  // Namespace this mesh data plane loads and enforces
  string namespace = 3;
  // Optional workload identity for sidecar mode. Ambient nodes may leave this
  // empty and rely on labels/topology metadata until HBONE is wired in Phase C.
  string workload_spiffe_id = 4;
  // Workload labels used to select workload-scoped policy.
  map<string, string> labels = 5;
  // Optional GAMMA ServiceWaypoint name. When set, the CP narrows the
  // returned MeshSlice to services bound to this waypoint.
  string waypoint_name = 6;
  // Ambient UDP consumers need the namespace-visible policy candidate
  // superset so trusted per-pod baggage can be scoped at the destination.
  bool ambient_udp_source_scoping = 7;
  // True when this subscription is a CROSS-CLUSTER remote-discovery poll
  // (`RemoteCluster.control_plane_url`), false for an ordinary local mesh
  // data-plane subscription. It selects between two REQUIRED, mutually
  // exclusive JWT audiences (issue #2475), so the flag is not a trust
  // decision and the proto3 false/default cannot admit a no-audience token:
  //   true  -> the bearer token must carry exactly one `aud` equal to
  //            "ferrum-mesh-discovery:<FERRUM_MESH_CLUSTER_AUDIENCE>" of THIS
  //            control plane; an unconfigured control plane refuses outright.
  //   false -> the bearer token must carry exactly one `aud` equal to
  //            "ferrum-mesh-subscribe:local"; missing or discovery-purpose
  //            audiences are refused.
  bool remote_discovery = 8;
}

// A MeshSubscribe response frame.
//
// CONSUMER CONTRACT (enforced fail-closed by every Ferrum mesh config consumer
// before a slice is installed or its endpoints imported):
//   * `ferrum_version` MUST be present and major/minor-compatible with the
//     subscriber.
//   * On a non-heartbeat frame, `version` MUST equal the embedded
//     `MeshSlice.version` — the envelope stamp is a duplicate of the slice's own
//     version, not an independent value.
//   * The embedded slice's `node_id` and `namespace` MUST equal the ones in the
//     MeshSubscribeRequest that opened the stream, and when the request pinned
//     `workload_spiffe_id` / `waypoint_name` the slice MUST echo that same value
//     (an omitted echo is a mismatch, not an exemption).
//   * `config_authority` / `config_sequence` MUST equal the embedded
//     `MeshSlice.revision` (both absent, or both present and equal) — like
//     `version`, the envelope stamp is a duplicate of the slice's own value.
// A frame that violates any of these is refused without mutating the
// subscriber's last-good state.
//
// ORDERING CONTRACT (issue #2473). `config_authority` names the ordering domain
// and `config_sequence` is the durable, monotonic config-change sequence within
// it. Every control-plane replica reading the same config store advertises the
// same authority, so a data plane failing over between replicas compares config
// GENERATIONS, not wall clocks. A candidate is installed only when it is
// strictly newer than, or equal to, the last accepted revision from the SAME
// authority; an older revision, a foreign authority, or an absent revision when
// one is already accepted is quarantined and the last-good slice keeps serving.
// An intentional operator rollback republishes content at a HIGHER sequence — a
// data plane is never moved backward by replaying an old generation.
message MeshConfigUpdate {
  // Transport version stamp. MUST equal the embedded MeshSlice.version on
  // non-heartbeat frames.
  string version = 1;
  int64 timestamp = 2;
  // JSON-encoded modes::mesh::slice::MeshSlice. Kept JSON for native mesh
  // config so the canonical model remains the stable contract. Empty on
  // heartbeat frames.
  string mesh_slice_json = 3;
  // Ferrum Edge binary version of the CP (e.g. "0.9.0")
  string ferrum_version = 4;
  // Lightweight keepalive frame for MeshSubscribe streams. Heartbeats keep
  // registry liveness fresh without forcing receivers to re-apply a slice.
  // A heartbeat carries no slice and is never an install candidate.
  bool heartbeat = 5;
  // Ordering domain of `config_sequence`. Empty means the control plane's
  // config authority has no shared monotonic sequence (Kubernetes CRD
  // controller, file source) — the subscriber then applies no ordering unless
  // it has already accepted a revisioned slice, in which case an unrevisioned
  // frame is refused fail-closed.
  string config_authority = 6;
  // Durable, monotonically increasing config-change sequence within
  // `config_authority`. MUST be zero when `config_authority` is empty; a
  // sequence without its ordering domain is malformed. Never a wall clock: it
  // survives control-plane restarts and is identical on every replica of one
  // config store.
  uint64 config_sequence = 7;
}
